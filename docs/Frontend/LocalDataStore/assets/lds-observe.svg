<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="本地库观测的三个信号、四种错误名与三种分母">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="590" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700" text-anchor="start">三个信号，两种分母</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">本地库的观测不是「打日志」，是把三个数放在一起看</text>
<rect x="28" y="86" width="280" height="64" rx="6" fill="#eef2fb" stroke="#3f5f9e" stroke-width="1.2"/>
<text x="168.0" y="122.0" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="middle">① usage / quota</text>
<rect x="340" y="86" width="280" height="64" rx="6" fill="#fdf6e7" stroke="#b07d1c" stroke-width="1.2"/>
<text x="480.0" y="122.0" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="middle">② 失败率（按错误名）</text>
<rect x="652" y="86" width="280" height="64" rx="6" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.2"/>
<text x="792.0" y="122.0" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="middle">③ 清理量与回收量</text>
<text x="44" y="178" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">estimate() 每 30 s 一次（0.48 ms/次）</text>
<text x="356" y="178" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">QuotaExceeded / AbortError / NotFound</text>
<text x="668" y="178" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">本次清理条数 vs 回读残留</text>
<rect x="28" y="202" width="904" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="44" y="228" font-size="13" fill="#94a3b8" font-weight="700" text-anchor="start">错误名是最便宜的标签：同一个「写不进去」有四种完全不同的原因</text>
<text x="44" y="242" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">QuotaExceededError → 空间不够，清一档再试一次</text>
<text x="44" y="266" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">TransactionInactiveError → 代码在事务里 await 了别的东西（本专题实测到的第一号 bug）</text>
<text x="44" y="290" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">NotFoundError → 打开的版本不对 / 仓库不存在（不传版本的经典后果）</text>
<text x="44" y="314" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">AbortError → 升级或事务被中止，通常伴随 versionchange</text>
<rect x="28" y="338" width="904" height="150" rx="8" fill="#fbeceb" stroke="#b4453c" stroke-width="1.4"/>
<text x="44" y="364" font-size="13" fill="#b4453c" font-weight="700" text-anchor="start">分母选错，指标就永远「看起来正常」</text>
<text x="44" y="380" font-size="11.5" fill="#7f1d1d" font-weight="400" text-anchor="start">会话分母（每 100 个会话有多少次写入失败）：适合「用户能不能用」</text>
<text x="44" y="406" font-size="11.5" fill="#7f1d1d" font-weight="400" text-anchor="start">操作分母（每 1,000 次 put 有多少次失败）：适合「代码有没有 bug」</text>
<text x="44" y="432" font-size="11.5" fill="#7f1d1d" font-weight="400" text-anchor="start">字节分母（每 GB 写入的失败次数）：适合「容量规划」</text>
<text x="44" y="464" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">三者不通用：一次失败的重试会放大操作分母，但会话分母只记一次。</text>
<rect x="28" y="502" width="904" height="60" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="44" y="538" font-size="11.5" fill="#14532d" font-weight="700" text-anchor="start">告警只报「变化」不报「绝对值」：usage 增长 20% 往往只是用户多存了几张图，而失败率从 0.1% 到 2% 一定是代码或配额变了。</text>
</svg>
