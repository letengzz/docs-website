<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Playwright E2E 执行流程</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="70" width="130" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="95" y="94" text-anchor="middle">playwright.config</text>
    <text x="95" y="112" text-anchor="middle" font-size="11" fill="#6b7280">项目/浏览器矩阵</text>
    <rect x="190" y="70" width="130" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="255" y="94" text-anchor="middle">启动 Worker</text>
    <text x="255" y="112" text-anchor="middle" font-size="11" fill="#6b7280">独立进程+上下文</text>
    <rect x="350" y="70" width="140" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="420" y="94" text-anchor="middle">加载应用</text>
    <text x="420" y="112" text-anchor="middle" font-size="11" fill="#6b7280">webServer/dev 或预览</text>
    <rect x="520" y="70" width="130" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="585" y="94" text-anchor="middle">执行用例</text>
    <text x="585" y="112" text-anchor="middle" font-size="11" fill="#6b7280">locator + auto-wait</text>
    <line x1="160" y1="98" x2="188" y2="98" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow3)"/>
    <line x1="320" y1="98" x2="348" y2="98" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow3)"/>
    <line x1="490" y1="98" x2="518" y2="98" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow3)"/>
    <rect x="520" y="160" width="130" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="585" y="184" text-anchor="middle">失败诊断</text>
    <text x="585" y="202" text-anchor="middle" font-size="11" fill="#6b7280">截图/trace查看</text>
    <rect x="350" y="160" width="130" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="415" y="184" text-anchor="middle">生成报告</text>
    <text x="415" y="202" text-anchor="middle" font-size="11" fill="#6b7280">HTML Reporter</text>
    <line x1="585" y1="126" x2="585" y2="158" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow3)"/>
    <line x1="518" y1="188" x2="482" y2="188" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow3)"/>
  </g>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#6b7280">每个测试使用全新的 BrowserContext：无 Cookie/存储污染，支持并行执行</text>
</svg>
