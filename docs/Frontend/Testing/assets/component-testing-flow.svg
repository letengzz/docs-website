<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">组件测试：以用户行为为中心的循环</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="80" width="150" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="105" y="106" text-anchor="middle">1. 渲染组件</text>
    <text x="105" y="126" text-anchor="middle" font-size="11" fill="#6b7280">render()</text>
    <rect x="210" y="80" width="150" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="285" y="106" text-anchor="middle">2. 查询元素</text>
    <text x="285" y="126" text-anchor="middle" font-size="11" fill="#6b7280">getByRole / getByText</text>
    <rect x="390" y="80" width="150" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="465" y="106" text-anchor="middle">3. 触发交互</text>
    <text x="465" y="126" text-anchor="middle" font-size="11" fill="#6b7280">fireEvent / userEvent</text>
    <rect x="570" y="80" width="160" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="650" y="106" text-anchor="middle">4. 断言结果</text>
    <text x="650" y="126" text-anchor="middle" font-size="11" fill="#6b7280">expect(...).toBeVisible()</text>
    <line x1="180" y1="110" x2="208" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="360" y1="110" x2="388" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="540" y1="110" x2="568" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <rect x="120" y="180" width="520" height="80" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#92400e">优先级：按角色查询 &gt; 按文本 &gt; test-id</text>
  <text x="380" y="236" text-anchor="middle" font-size="12" fill="#92400e">原则：像用户一样测试（行为），而不是像开发者一样测试（内部实现）</text>
</svg>
