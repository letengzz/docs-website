<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="设计系统常见症状分诊">
<title>设计系统常见症状分诊</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="392" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">症状分诊：三类根因，九成问题落在这里</text>
<text x="24" y="58" font-size="13" fill="#475569">先分层，再定位；不要一上来就调阈值 / 加 !important</text>
<rect x="30" y="96" width="240" height="96" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="150.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">看起来「样式没生效」</text>
<text x="150.0" y="142" text-anchor="middle" font-size="12" fill="#475569">→ token 没被引用</text>
<text x="150.0" y="160" text-anchor="middle" font-size="12" fill="#475569">→ 变量作用域不在 :root</text>
<text x="150.0" y="178" text-anchor="middle" font-size="12" fill="#475569">→ 打包时样式被摇掉</text>
<rect x="300" y="96" width="240" height="96" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="420.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">看起来「改了没变化」</text>
<text x="420.0" y="142" text-anchor="middle" font-size="12" fill="#475569">→ 消费方缓存了旧版本</text>
<text x="420.0" y="160" text-anchor="middle" font-size="12" fill="#475569">→ 覆盖式主题优先级不够</text>
<text x="420.0" y="178" text-anchor="middle" font-size="12" fill="#475569">→ 构建产物没重新生成</text>
<rect x="570" y="96" width="240" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="690.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">看起来「视觉回归全红」</text>
<text x="690.0" y="142" text-anchor="middle" font-size="12" fill="#475569">→ 渲染环境不一致（字体/AA）</text>
<text x="690.0" y="160" text-anchor="middle" font-size="12" fill="#475569">→ 动态内容未遮罩</text>
<text x="690.0" y="178" text-anchor="middle" font-size="12" fill="#475569">→ 阈值与面积口径不匹配</text>
<rect x="30" y="236" width="400" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="230.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">三条共性判据</text>
<text x="230.0" y="282" text-anchor="middle" font-size="12" fill="#475569">1 先看产物里有没有这条 CSS</text>
<text x="230.0" y="300" text-anchor="middle" font-size="12" fill="#475569">2 再看计算值（computed）是否为目标值</text>
<text x="230.0" y="318" text-anchor="middle" font-size="12" fill="#475569">3 最后看是不是基线环境漂了</text>
<rect x="460" y="236" width="470" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="695.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">一个反例：用 !important 盖住 token</text>
<text x="695.0" y="282" text-anchor="middle" font-size="12" fill="#475569">盖住一次，下一个消费方再盖一次，最终没人知道真实值</text>
<text x="695.0" y="300" text-anchor="middle" font-size="12" fill="#475569">正确做法：改语义 token 的映射，而不是在组件里打补丁</text>
<text x="30" y="372" font-size="13" fill="#475569">分诊顺序固定：产物 → 计算值 → 基线。跳过前两步直接看基线，八成会去改一个本来没错的阈值。</text>
</svg>
