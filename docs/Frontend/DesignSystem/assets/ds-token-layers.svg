<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="三层 token 与产物形态">
<title>三层 token 与产物形态</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">三层 token 与两种产物形态</text>
<text x="24" y="58" font-size="13" fill="#475569">左：引用图；右：编译产物（数字为本机实测）</text>
<rect x="30" y="100" width="180" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="120.0" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">原始层 raw</text>
<text x="120.0" y="146.5" text-anchor="middle" font-size="12.5" fill="#475569">164 条</text>
<text x="120.0" y="165.0" text-anchor="middle" font-size="12.5" fill="#475569">色阶 / 间距 / 字号</text>
<text x="120.0" y="183.5" text-anchor="middle" font-size="12.5" fill="#475569">圆角 / 阴影</text>
<rect x="250" y="100" width="180" height="120" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="340.0" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">语义层 semantic</text>
<text x="340.0" y="146.5" text-anchor="middle" font-size="12.5" fill="#475569">91 条</text>
<text x="340.0" y="165.0" text-anchor="middle" font-size="12.5" fill="#475569">bg-canvas · fg-muted</text>
<text x="340.0" y="183.5" text-anchor="middle" font-size="12.5" fill="#475569">accent-solid …</text>
<rect x="470" y="100" width="180" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="560.0" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">组件层 component</text>
<text x="560.0" y="146.5" text-anchor="middle" font-size="12.5" fill="#475569">168 条</text>
<text x="560.0" y="165.0" text-anchor="middle" font-size="12.5" fill="#475569">button-bg · card-radius</text>
<text x="560.0" y="183.5" text-anchor="middle" font-size="12.5" fill="#475569">modal-padding-x …</text>
<line x1="210" y1="160" x2="246" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<text x="228.0" y="152.0" text-anchor="middle" font-size="12" fill="#475569">引用</text>
<line x1="430" y1="160" x2="466" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<text x="448.0" y="152.0" text-anchor="middle" font-size="12" fill="#475569">引用</text>
<rect x="690" y="96" width="240" height="128" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="810.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">两层产物（推荐）</text>
<text x="810.0" y="142" text-anchor="middle" font-size="12" fill="#475569">raw + semantic 写 var()</text>
<text x="810.0" y="160" text-anchor="middle" font-size="12" fill="#475569">组件层不落盘：7,644 B</text>
<text x="810.0" y="178" text-anchor="middle" font-size="12" fill="#475569">gzip 1,556 B</text>
<rect x="690" y="240" width="240" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="810.0" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">全量产物（反面）</text>
<text x="810.0" y="286" text-anchor="middle" font-size="12" fill="#475569">三层全落盘：13,197 B</text>
<text x="810.0" y="304" text-anchor="middle" font-size="12" fill="#475569">gzip 2,326 B</text>
<text x="810.0" y="322" text-anchor="middle" font-size="12" fill="#475569">多 72%，且更难改</text>
<text x="30" y="268" font-size="14" font-weight="700" fill="#0f172a">解析深度分布：0 跳 164 · 1 跳 91 · 2 跳 168</text>
<text x="30" y="292" font-size="13" fill="#475569">最长链 2 跳；全图解析 1.25 ms；运行时逐次解析 0.109 µs，memo 后 0.033 µs（3.33×）</text>
<text x="30" y="320" font-size="13" fill="#475569">缺陷注入：1 个环（bg-canvas → bg-surface → bg-canvas）与 1 个悬空引用（button-bg → no-such-token）都被检出</text>
<text x="30" y="360" font-size="13" fill="#475569">改 color-gray-300 一处 → 下游 26 条 token、24 个组件；改 color-blue-600 → 3 条 token、1 个组件</text>
<text x="30" y="384" font-size="13" fill="#475569">同一份 token 图，既能生成 CSS 变量，也能生成设计工具可读的扁平 JSON（14,036 B）</text>
</svg>
