<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="分发与打包体积">
<title>分发与打包体积</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="392" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">消费侧：只用一个组件，产物里进了多少</text>
<text x="24" y="58" font-size="13" fill="#475569">真实 esbuild 打包（12 个组件，每组件自带样式）</text>
<rect x="30" y="96" width="280" height="110" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="170.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">无顶层副作用</text>
<text x="170.0" y="142" text-anchor="middle" font-size="12" fill="#475569">barrel / 深路径 JS 都是 162 B</text>
<text x="170.0" y="160" text-anchor="middle" font-size="12" fill="#475569">摇树生效，JS 体积相同</text>
<text x="170.0" y="178" text-anchor="middle" font-size="12" fill="#475569">但 CSS：1,428 B vs 118 B（12.1×）</text>
<rect x="330" y="96" width="300" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="480.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">有顶层副作用（写注册表）</text>
<text x="480.0" y="142" text-anchor="middle" font-size="12" fill="#475569">barrel 645 B vs 深路径 129 B</text>
<text x="480.0" y="160" text-anchor="middle" font-size="12" fill="#475569">= 5.0×，摇树失效</text>
<text x="480.0" y="178" text-anchor="middle" font-size="12" fill="#475569">sideEffects:false 后回到 129 B</text>
<rect x="650" y="96" width="280" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="790.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">全量导入（import * as）</text>
<text x="790.0" y="142" text-anchor="middle" font-size="12" fill="#475569">JS 3,250 B = 单组件 20.06×</text>
<text x="790.0" y="160" text-anchor="middle" font-size="12" fill="#475569">CSS 1,428 B（12 份样式）</text>
<text x="790.0" y="178" text-anchor="middle" font-size="12" fill="#475569">按需加载必须配深路径</text>
<rect x="30" y="236" width="430" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="245.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">三个必须写进 package.json 的字段</text>
<text x="245.0" y="282" text-anchor="middle" font-size="12" fill="#475569">"sideEffects": ["**/*.css"]（而不是 false）</text>
<text x="245.0" y="300" text-anchor="middle" font-size="12" fill="#475569">"exports" 里同时给出深路径与 barrel</text>
<text x="245.0" y="318" text-anchor="middle" font-size="12" fill="#475569">"type": "module" + 双格式产物</text>
<rect x="490" y="236" width="440" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="710.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">样式为什么摇不掉</text>
<text x="710.0" y="282" text-anchor="middle" font-size="12" fill="#475569">CSS 不在 ES 模块图里，打包器只认「导入即副作用」</text>
<text x="710.0" y="300" text-anchor="middle" font-size="12" fill="#475569">要按需，就得让样式跟着组件走（每个组件一个 css）</text>
<text x="30" y="372" font-size="13" fill="#475569">barrel 不是错，错在「barrel + 全量样式 + 顶层注册」三件事叠在一起：读者以为在按需，实际在整包。</text>
</svg>
