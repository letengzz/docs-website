<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="文档与类型同源管道">
<title>文档与类型同源管道</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="392" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">文档站：从类型定义到 props 表的一段管道</text>
<text x="24" y="58" font-size="13" fill="#475569">12 个组件 / 59 个 props；6 类漂移注入，真漂移召回 23/23</text>
<rect x="30" y="96" width="200" height="100" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="130.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">类型定义（唯一来源）</text>
<text x="130.0" y="142" text-anchor="middle" font-size="12" fill="#475569">props: name/type/required</text>
<text x="130.0" y="160" text-anchor="middle" font-size="12" fill="#475569">default / 说明</text>
<text x="130.0" y="178" text-anchor="middle" font-size="12" fill="#475569">59 条</text>
<rect x="270" y="96" width="210" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="375.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">生成 props 表</text>
<text x="375.0" y="142" text-anchor="middle" font-size="12" fill="#475569">5 列表格</text>
<text x="375.0" y="160" text-anchor="middle" font-size="12" fill="#475569">联合类型竖线转义</text>
<text x="375.0" y="178" text-anchor="middle" font-size="12" fill="#475569">干净表 0 误报</text>
<rect x="520" y="96" width="200" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="620.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">解析 + 比对器</text>
<text x="620.0" y="142" text-anchor="middle" font-size="12" fill="#475569">按列取字段</text>
<text x="620.0" y="160" text-anchor="middle" font-size="12" fill="#475569">归一化空白</text>
<text x="620.0" y="178" text-anchor="middle" font-size="12" fill="#475569">跨组件 24 例</text>
<rect x="760" y="96" width="170" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="845.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">差异报告</text>
<text x="845.0" y="142" text-anchor="middle" font-size="12" fill="#475569">D1 缺行 2/2</text>
<text x="845.0" y="160" text-anchor="middle" font-size="12" fill="#475569">D2 多行 12/12</text>
<text x="845.0" y="178" text-anchor="middle" font-size="12" fill="#475569">D5 必填 7/7</text>
<line x1="230" y1="146" x2="262" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="480" y1="146" x2="512" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="720" y1="146" x2="752" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="236" width="430" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="245.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">检不出的那一类</text>
<text x="245.0" y="282" text-anchor="middle" font-size="12" fill="#475569">D6 联合类型顺序不同（"ghost" | "solid" | "outline"）</text>
<text x="245.0" y="300" text-anchor="middle" font-size="12" fill="#475569">语义等价，但字符串不等 → 误报 1/1</text>
<text x="245.0" y="318" text-anchor="middle" font-size="12" fill="#475569">修法：比对前对联合成员排序</text>
<rect x="490" y="236" width="440" height="96" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="710.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">必须守住的两条</text>
<text x="710.0" y="282" text-anchor="middle" font-size="12" fill="#475569">① 表格由类型生成，不允许手写</text>
<text x="710.0" y="300" text-anchor="middle" font-size="12" fill="#475569">② CI 里跑比对，diff 非空即失败</text>
<text x="30" y="372" font-size="13" fill="#475569">格式噪声（多空格、紧凑分隔）不会误报：归一化在比对之前做。</text>
</svg>
