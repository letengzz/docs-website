<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-label="视觉回归八个变体的差异读数">
<title>视觉回归八个变体的差异读数</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="416" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">视觉回归：8 个变体 × 6 种口径</text>
<text x="24" y="58" font-size="13" fill="#475569">色块 = 差异像素占比；右侧是每种口径的漏报/误报</text>
<text x="30" y="96" font-size="12" font-weight="700" fill="#0f172a">变体</text>
<text x="330" y="96" font-size="12" font-weight="700" fill="#0f172a">容差 0</text>
<text x="440" y="96" font-size="12" font-weight="700" fill="#0f172a">容差 2</text>
<text x="550" y="96" font-size="12" font-weight="700" fill="#0f172a">容差 10</text>
<text x="660" y="96" font-size="12" font-weight="700" fill="#0f172a">YIQ 0.05</text>
<text x="790" y="96" font-size="12" font-weight="700" fill="#0f172a">应拦截</text>
<text x="30" y="122" font-size="12" fill="#475569">V0 完全一致</text>
<text x="330" y="122" font-size="12" fill="#0f766e">0.000%</text>
<text x="440" y="122" font-size="12" fill="#0f766e">0.000%</text>
<text x="550" y="122" font-size="12" fill="#0f766e">0.000%</text>
<text x="660" y="122" font-size="12" fill="#0f766e">0.000%</text>
<text x="790" y="122" font-size="12" font-weight="700" fill="#0f766e">放</text>
<text x="30" y="148" font-size="12" fill="#475569">V1 整体右移 1px</text>
<text x="330" y="148" font-size="12" fill="#0f172a">3.583%</text>
<text x="440" y="148" font-size="12" fill="#0f172a">3.536%</text>
<text x="550" y="148" font-size="12" fill="#0f172a">3.419%</text>
<text x="660" y="148" font-size="12" fill="#0f172a">3.425%</text>
<text x="790" y="148" font-size="12" font-weight="700" fill="#b91c1c">拦</text>
<text x="30" y="174" font-size="12" fill="#475569">V2 主色浅 2/255</text>
<text x="330" y="174" font-size="12" fill="#0f172a">5.005%</text>
<text x="440" y="174" font-size="12" fill="#0f766e">0.000%</text>
<text x="550" y="174" font-size="12" fill="#0f766e">0.000%</text>
<text x="660" y="174" font-size="12" fill="#0f766e">0.000%</text>
<text x="790" y="174" font-size="12" font-weight="700" fill="#b91c1c">拦</text>
<text x="30" y="200" font-size="12" fill="#475569">V3 按钮文字 15→16px</text>
<text x="330" y="200" font-size="12" fill="#0f172a">0.272%</text>
<text x="440" y="200" font-size="12" fill="#0f172a">0.272%</text>
<text x="550" y="200" font-size="12" fill="#0f172a">0.216%</text>
<text x="660" y="200" font-size="12" fill="#0f172a">0.216%</text>
<text x="790" y="200" font-size="12" font-weight="700" fill="#b91c1c">拦</text>
<text x="30" y="226" font-size="12" fill="#475569">V4 抗锯齿来源不同</text>
<text x="330" y="226" font-size="12" fill="#b91c1c">13.798%</text>
<text x="440" y="226" font-size="12" fill="#b91c1c">8.866%</text>
<text x="550" y="226" font-size="12" fill="#b91c1c">5.323%</text>
<text x="660" y="226" font-size="12" fill="#b91c1c">5.303%</text>
<text x="790" y="226" font-size="12" font-weight="700" fill="#0f766e">放</text>
<text x="30" y="252" font-size="12" fill="#475569">V5 文字偏 1px（半像素）</text>
<text x="330" y="252" font-size="12" fill="#b91c1c">1.992%</text>
<text x="440" y="252" font-size="12" fill="#b91c1c">1.945%</text>
<text x="550" y="252" font-size="12" fill="#b91c1c">1.828%</text>
<text x="660" y="252" font-size="12" fill="#b91c1c">1.834%</text>
<text x="790" y="252" font-size="12" font-weight="700" fill="#0f766e">放</text>
<text x="30" y="278" font-size="12" fill="#475569">V6 边框 1→2px</text>
<text x="330" y="278" font-size="12" fill="#0f172a">0.903%</text>
<text x="440" y="278" font-size="12" fill="#0f172a">0.903%</text>
<text x="550" y="278" font-size="12" fill="#0f172a">0.903%</text>
<text x="660" y="278" font-size="12" fill="#0f172a">0.903%</text>
<text x="790" y="278" font-size="12" font-weight="700" fill="#b91c1c">拦</text>
<text x="30" y="304" font-size="12" fill="#475569">V7 文案 提交→提交中</text>
<text x="330" y="304" font-size="12" fill="#0f172a">0.109%</text>
<text x="440" y="304" font-size="12" fill="#0f172a">0.108%</text>
<text x="550" y="304" font-size="12" fill="#0f172a">0.103%</text>
<text x="660" y="304" font-size="12" fill="#0f172a">0.103%</text>
<text x="790" y="304" font-size="12" font-weight="700" fill="#b91c1c">拦</text>
<text x="30" y="348" font-size="13" fill="#475569">最准的一档是「严格逐像素 + 面积阈值」：6/8；但它拦不住 V2（容差吃掉 2/255 色差），也拦不住 V7（只占 0.109%）</text>
<text x="30" y="372" font-size="13" fill="#475569">环境噪声必须单独治：每通道 ±1 抖动在容差 0 下报 72.9% 像素，容差 2 下 0 px —— 基线要与渲染环境绑定，而不是靠调阈值</text>
<text x="30" y="396" font-size="13" fill="#475569">动态内容（时间戳 12:00→12:01）不遮罩 39 px，遮罩后 0 px：先遮罩，再谈阈值</text>
</svg>
