<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="486" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：实时监控大屏的整体架构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四层数据流 + 大屏外壳 + 可观测，最后用七项清单验收</text>
  <rect x="30" y="76" width="150" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="105" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">数据模拟器</text>
  <text x="105" y="111" text-anchor="middle" font-size="7" fill="#334155">1s 出一批指标</text>
  <text x="105" y="127.1" text-anchor="middle" font-size="7" fill="#334155">可注入异常与断线</text>
  <rect x="210" y="76" width="160" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="290" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">WebSocket 服务</text>
  <text x="290" y="111" text-anchor="middle" font-size="7" fill="#1D4ED8">Node 原生 ws</text>
  <text x="290" y="127.1" text-anchor="middle" font-size="7" fill="#1D4ED8">定长环形缓冲 + 补数</text>
  <rect x="400" y="76" width="160" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="480" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">前端数据层</text>
  <text x="480" y="111" text-anchor="middle" font-size="7" fill="#6D28D9">连接管理 / 重连</text>
  <text x="480" y="127.1" text-anchor="middle" font-size="7" fill="#6D28D9">环形缓冲 + 节流合并</text>
  <rect x="590" y="76" width="140" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="660" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">渲染层</text>
  <text x="660" y="111" text-anchor="middle" font-size="7" fill="#047857">ECharts 三图</text>
  <text x="660" y="127.1" text-anchor="middle" font-size="7" fill="#047857">增量更新 + 关动画</text>
  <line x1="180" y1="111" x2="210" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="370" y1="111" x2="400" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="111" x2="590" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="168" width="340" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="200" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">大屏外壳</text>
  <text x="200" y="203" text-anchor="middle" font-size="8" fill="#B45309">1920×1080 设计稿 + transform: scale 等比缩放</text>
  <text x="200" y="221.4" text-anchor="middle" font-size="8" fill="#B45309">窗口 resize 重新计算缩放比（防抖 150ms）</text>
  <text x="200" y="239.8" text-anchor="middle" font-size="8" fill="#B45309">数字使用等宽字体，避免跳动时宽度抖动</text>
  <text x="200" y="258.2" text-anchor="middle" font-size="8" fill="#B45309">背景网格与卡片用 CSS 画，不走 Canvas</text>
  <rect x="390" y="168" width="340" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="186.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">性能与可观测</text>
  <text x="560" y="203" text-anchor="middle" font-size="8" fill="#0F766E">用 PerformanceObserver 采长任务（&gt; 50ms）</text>
  <text x="560" y="221.4" text-anchor="middle" font-size="8" fill="#0F766E">页面上角显示 FPS / 点数 / 延迟三项自检指标</text>
  <text x="560" y="239.8" text-anchor="middle" font-size="8" fill="#0F766E">超过预算即自动降级：先关动画，再加大采样间隔</text>
  <text x="560" y="258.2" text-anchor="middle" font-size="8" fill="#0F766E">所有降级动作写进日志，方便复盘</text>
  <text x="60" y="304" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">验收清单（7 项，全部可脚本化或肉眼可判）</text>
  <rect x="30" y="316" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="329" text-anchor="start" font-size="8.5" fill="#065F46">① 启动 10 秒内三张图都有数据，无控制台报错</text>
  <rect x="30" y="338" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="351" text-anchor="start" font-size="8.5" fill="#065F46">② 连续运行 30 分钟内存曲线平稳（不单调上涨）</text>
  <rect x="30" y="360" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="373" text-anchor="start" font-size="8.5" fill="#065F46">③ 拔网线 10 秒再插回，自动重连且补上断连区间的点</text>
  <rect x="30" y="382" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="395" text-anchor="start" font-size="8.5" fill="#065F46">④ 窗口从 1920 缩到 1366，图表不重叠、文字不截断</text>
  <rect x="30" y="404" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="417" text-anchor="start" font-size="8.5" fill="#065F46">⑤ 悬停任一点，tooltip 显示时间与精确值</text>
  <rect x="30" y="426" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="439" text-anchor="start" font-size="8.5" fill="#065F46">⑥ 刷新频率 1 次/秒时，页面 FPS 稳定 ≥ 45</text>
  <rect x="30" y="448" width="700" height="18" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="461" text-anchor="start" font-size="8.5" fill="#065F46">⑦ 关闭标签页后，服务端连接数归零</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
