<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="388" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三条渲染路线：Canvas / SVG / WebGL</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">它们不是竞争关系，而是浏览器提供的三种不同成本的绘制方式</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一个图，三种画法：浏览器提供的三条图形路径</text>
  <rect x="30" y="94" width="226" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Canvas 2D</text>
  <text x="143" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">位图：画完即像素</text>
  <text x="143" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">无 DOM 节点开销</text>
  <text x="143" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">擅长：海量点、频繁重绘</text>
  <text x="143" y="184.2" text-anchor="middle" font-size="8" fill="#1D4ED8">短板：无法用 CSS/事件代理</text>
  <rect x="268" y="94" width="226" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">SVG</text>
  <text x="381" y="129" text-anchor="middle" font-size="8" fill="#047857">矢量：每个图元一个 DOM</text>
  <text x="381" y="147.4" text-anchor="middle" font-size="8" fill="#047857">可被 CSS 与选择器控制</text>
  <text x="381" y="165.8" text-anchor="middle" font-size="8" fill="#047857">擅长：少量图形、可交互</text>
  <text x="381" y="184.2" text-anchor="middle" font-size="8" fill="#047857">短板：元素上千后明显变慢</text>
  <rect x="506" y="94" width="226" height="90" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">WebGL</text>
  <text x="619" y="129" text-anchor="middle" font-size="8" fill="#6D28D9">GPU 批量绘制</text>
  <text x="619" y="147.4" text-anchor="middle" font-size="8" fill="#6D28D9">百万级点仍可流畅</text>
  <text x="619" y="165.8" text-anchor="middle" font-size="8" fill="#6D28D9">擅长：散点/热力/3D</text>
  <text x="619" y="184.2" text-anchor="middle" font-size="8" fill="#6D28D9">短板：上手成本与调试难度</text>
  <text x="60" y="214" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">选型判据（按「图元数量」与「是否需要复杂交互」两轴）</text>
  <rect x="30" y="228" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="245" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">&lt; 1 千个图元</text>
  <rect x="180" y="228" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="245" text-anchor="middle" font-size="8.5" fill="#334155">任意方案均可</text>
  <rect x="310" y="228" width="450" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="535" y="245" text-anchor="middle" font-size="8.5" fill="#334155">团队熟悉度优先；Canvas 与 SVG 差别肉眼难辨</text>
  <rect x="30" y="256" width="150" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="273" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">1 千 ~ 1 万</text>
  <rect x="180" y="256" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="273" text-anchor="middle" font-size="8.5" fill="#334155">Canvas 或 SVG</text>
  <rect x="310" y="256" width="450" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="535" y="273" text-anchor="middle" font-size="8.5" fill="#334155">需要 CSS 控制单个图元 → SVG；需要频繁全量重绘 → Canvas</text>
  <rect x="30" y="284" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="301" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">1 万 ~ 10 万</text>
  <rect x="180" y="284" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="301" text-anchor="middle" font-size="8.5" fill="#334155">Canvas 为主</text>
  <rect x="310" y="284" width="450" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="535" y="301" text-anchor="middle" font-size="8.5" fill="#334155">务必配合采样与按需渲染；SVG 在这档开始出现卡顿</text>
  <rect x="30" y="312" width="150" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="329" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">10 万以上 / 3D</text>
  <rect x="180" y="312" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="329" text-anchor="middle" font-size="8.5" fill="#334155">WebGL</text>
  <rect x="310" y="312" width="450" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="535" y="329" text-anchor="middle" font-size="8.5" fill="#334155">ECharts 走 GL 系列，或直接用 deck.gl / three.js 这类专用库</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#6D28D9">口诀：先按规模筛掉不可行的方案，再在剩下的里挑团队最熟的</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
