<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="418" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数据到图形的映射：维度、通道与比例尺</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选对通道比选对图表类型更重要：位置与长度最准，面积与颜色最容易被误读</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">可视化的本质：把数据列映射到视觉通道</text>
  <rect x="30" y="94" width="160" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="112.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">数据（Data）</text>
  <text x="110" y="129" text-anchor="middle" font-size="7.5" fill="#334155">维度 dimension</text>
  <text x="110" y="146.25" text-anchor="middle" font-size="7.5" fill="#334155">（分类 / 时间 / 名称）</text>
  <text x="110" y="163.5" text-anchor="middle" font-size="7.5" fill="#334155">度量 measure</text>
  <text x="110" y="180.75" text-anchor="middle" font-size="7.5" fill="#334155">（可比较的数值）</text>
  <rect x="300" y="94" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">视觉通道（Channel）</text>
  <text x="380" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">位置 position</text>
  <text x="380" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">长度 / 角度</text>
  <text x="380" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">颜色 / 明度</text>
  <text x="380" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">形状 / 大小 / 透明度</text>
  <rect x="570" y="94" width="160" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="650" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">图形（Mark）</text>
  <text x="650" y="129" text-anchor="middle" font-size="7.5" fill="#047857">点 / 线 / 面</text>
  <text x="650" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">柱 / 条 / 饼 / 环</text>
  <text x="650" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">散点 / 热力 / 地图</text>
  <text x="650" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">组合与嵌套</text>
  <line x1="190" y1="142" x2="300" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="245" y="137" text-anchor="middle" font-size="7.5" fill="#64748B">编码</text>
  <line x1="460" y1="142" x2="570" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="515" y="137" text-anchor="middle" font-size="7.5" fill="#64748B">绘制</text>
  <text x="60" y="220" text-anchor="start" font-size="10" fill="#B91C1C" font-weight="bold">通道的「可辨识度」排序：位置 &gt; 长度 &gt; 角度 &gt; 面积 &gt; 颜色 &gt; 形状</text>
  <text x="60" y="240" text-anchor="start" font-size="9.5" fill="#64748B">同样一组数，用错通道就会让读者读出错误结论——这是可视化的头号坑</text>
  <text x="60" y="272" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">常用比例尺（scale）类型与适用数据</text>
  <rect x="30" y="286" width="150" height="20" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="300" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">linear 线性</text>
  <text x="196" y="300" text-anchor="start" font-size="8.5" fill="#334155">连续数值，等距</text>
  <text x="420" y="300" text-anchor="start" font-size="8.5" fill="#64748B">大多数度量</text>
  <rect x="30" y="310" width="150" height="20" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="105" y="324" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">log 对数</text>
  <text x="196" y="324" text-anchor="start" font-size="8.5" fill="#334155">跨数量级</text>
  <text x="420" y="324" text-anchor="start" font-size="8.5" fill="#64748B">金额 / 流量 / 科学计数</text>
  <rect x="30" y="334" width="150" height="20" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="105" y="348" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">time 时间</text>
  <text x="196" y="348" text-anchor="start" font-size="8.5" fill="#334155">时间轴，自动选粒度</text>
  <text x="420" y="348" text-anchor="start" font-size="8.5" fill="#64748B">趋势图、监控</text>
  <rect x="30" y="358" width="150" height="20" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="105" y="372" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">ordinal 序数</text>
  <text x="196" y="372" text-anchor="start" font-size="8.5" fill="#334155">离散分类</text>
  <text x="420" y="372" text-anchor="start" font-size="8.5" fill="#64748B">品类、地区、渠道</text>
  <rect x="30" y="382" width="150" height="20" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="105" y="396" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">quantize 分段</text>
  <text x="196" y="396" text-anchor="start" font-size="8.5" fill="#334155">连续值切成区间</text>
  <text x="420" y="396" text-anchor="start" font-size="8.5" fill="#64748B">热力图、分档着色</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
