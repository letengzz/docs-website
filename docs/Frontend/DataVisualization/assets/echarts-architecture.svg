<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="378" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">ECharts 分层架构：从 option 到像素</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">理解分层，才能解释「为什么写了 option 却不显示」与「为什么包这么大」</text>
  <rect x="230" y="76" width="300" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">应用层：option 配置 + API 调用 + 事件监听</text>
  <rect x="230" y="118" width="300" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="136.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">数据集层：dataset / transform / 维度映射</text>
  <rect x="230" y="156" width="300" height="30" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="174.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">图表层：series（图元） + component（坐标轴/提示/图例）</text>
  <rect x="230" y="194" width="300" height="30" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="212.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">渲染层：Canvas 渲染器 / SVG 渲染器（二选一）</text>
  <rect x="230" y="232" width="300" height="30" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="250.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">引擎层：zrender（图形、动画、事件、脏矩形）</text>
  <line x1="380" y1="110" x2="380" y2="118" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="148" x2="380" y2="156" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="186" x2="380" y2="194" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="224" x2="380" y2="232" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="262" x2="380" y2="270" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="76" width="180" height="186" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="120" y="94.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">打包层：按需引入</text>
  <text x="120" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">完整包：约 1 MB+</text>
  <text x="120" y="128.25" text-anchor="middle" font-size="7.5" fill="#B45309">按需引入：只带用到的</text>
  <text x="120" y="145.5" text-anchor="middle" font-size="7.5" fill="#B45309">  series 与 component</text>
  <text x="120" y="162.75" text-anchor="middle" font-size="7.5" fill="#B45309">echarts/core + use()</text>
  <text x="120" y="180" text-anchor="middle" font-size="7.5" fill="#B45309">能省 40%~70% 体积</text>
  <text x="120" y="197.25" text-anchor="middle" font-size="7.5" fill="#B45309">副作用：忘 use 就静默不显示</text>
  <rect x="30" y="278" width="180" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="120" y="296.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">生命周期</text>
  <text x="120" y="313" text-anchor="middle" font-size="7.5" fill="#334155">init(dom) 建实例</text>
  <text x="120" y="330.25" text-anchor="middle" font-size="7.5" fill="#334155">setOption 增量合并</text>
  <text x="120" y="347.5" text-anchor="middle" font-size="7.5" fill="#334155">resize 手动调用</text>
  <text x="120" y="364.75" text-anchor="middle" font-size="7.5" fill="#334155">dispose 释放实例</text>
  <rect x="550" y="76" width="180" height="108" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="640" y="94.2" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">渲染器二选一</text>
  <text x="640" y="111" text-anchor="middle" font-size="7.5" fill="#BE185D">canvas：默认，性能好</text>
  <text x="640" y="128.25" text-anchor="middle" font-size="7.5" fill="#BE185D">svg：可用 CSS 控图元</text>
  <text x="640" y="145.5" text-anchor="middle" font-size="7.5" fill="#BE185D">同一 option 可切换</text>
  <text x="640" y="162.75" text-anchor="middle" font-size="7.5" fill="#BE185D">不支持时自动降级</text>
  <rect x="550" y="200" width="180" height="162" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="640" y="218.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">事件与联动</text>
  <text x="640" y="235" text-anchor="middle" font-size="7.5" fill="#0E7490">chart.on('click')</text>
  <text x="640" y="252.25" text-anchor="middle" font-size="7.5" fill="#0E7490"> 拿 dataIndex 反查数据</text>
  <text x="640" y="269.5" text-anchor="middle" font-size="7.5" fill="#0E7490">connect() 多图联动</text>
  <text x="640" y="286.75" text-anchor="middle" font-size="7.5" fill="#0E7490">dispatchAction 主动触发</text>
  <text x="640" y="304" text-anchor="middle" font-size="7.5" fill="#0E7490">注意：click 拿到的是像素坐标</text>
  <text x="640" y="321.25" text-anchor="middle" font-size="7.5" fill="#0E7490">转数据坐标用 convertFromPixel</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
