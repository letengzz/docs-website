<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="346" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实时数据流：从数据源到画布的一条链</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一环都有可量化的成本，先分清「哪一环在拖」再优化</text>
  <rect x="30" y="76" width="112" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="86" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">数据源</text>
  <text x="86" y="111" text-anchor="middle" font-size="7" fill="#334155">指标 / 日志 / 埋点</text>
  <line x1="142" y1="112" x2="152" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="152" y="76" width="112" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="208" y="94.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">传输</text>
  <text x="208" y="111" text-anchor="middle" font-size="7" fill="#1D4ED8">WebSocket（首选）</text>
  <text x="208" y="127.1" text-anchor="middle" font-size="7" fill="#1D4ED8">SSE / 长轮询兜底</text>
  <line x1="264" y1="112" x2="274" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="274" y="76" width="112" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="330" y="94.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">缓冲</text>
  <text x="330" y="111" text-anchor="middle" font-size="7" fill="#6D28D9">环形缓冲定长</text>
  <text x="330" y="127.1" text-anchor="middle" font-size="7" fill="#6D28D9">断线重连与补数</text>
  <line x1="386" y1="112" x2="396" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="396" y="76" width="112" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="452" y="94.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">节流合并</text>
  <text x="452" y="111" text-anchor="middle" font-size="7" fill="#B45309">按帧对齐（rAF）</text>
  <text x="452" y="127.1" text-anchor="middle" font-size="7" fill="#B45309">多路指标合并一次提交</text>
  <line x1="508" y1="112" x2="518" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="518" y="76" width="112" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="574" y="94.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">增量渲染</text>
  <text x="574" y="111" text-anchor="middle" font-size="7" fill="#047857">appendData / 更新尾部</text>
  <text x="574" y="127.1" text-anchor="middle" font-size="7" fill="#047857">只重绘变化区间</text>
  <line x1="630" y1="112" x2="640" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="76" width="112" height="72" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="696" y="94.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">交互</text>
  <text x="696" y="111" text-anchor="middle" font-size="7" fill="#0F766E">悬停暂停刷新</text>
  <text x="696" y="127.1" text-anchor="middle" font-size="7" fill="#0F766E">缩放不丢数据</text>
  <text x="380" y="174" text-anchor="middle" font-size="10.5" fill="#B91C1C" font-weight="bold">关键认识：前端渲染速度往往不是瓶颈，「每条消息都触发一次渲染」才是</text>
  <text x="60" y="206" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三类必须提前设计的异常</text>
  <rect x="30" y="218" width="226" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="143" y="236.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">数据比渲染快（背压）</text>
  <text x="143" y="253" text-anchor="middle" font-size="7.5" fill="#B91C1C">现象：内存持续上涨、页面逐渐卡死</text>
  <text x="143" y="270.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">对策：环形缓冲只留最近 N 点</text>
  <text x="143" y="287.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">兜底：超过阈值丢旧数据而不是排队</text>
  <rect x="268" y="218" width="226" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="381" y="236.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">连接断开</text>
  <text x="381" y="253" text-anchor="middle" font-size="7.5" fill="#C2410C">现象：曲线停住但页面无提示</text>
  <text x="381" y="270.25" text-anchor="middle" font-size="7.5" fill="#C2410C">对策：指数退避重连 + 状态角标</text>
  <text x="381" y="287.5" text-anchor="middle" font-size="7.5" fill="#C2410C">补数：用时间戳拉取断连区间的历史点</text>
  <rect x="506" y="218" width="226" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="619" y="236.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">刷新过快导致视觉抖动</text>
  <text x="619" y="253" text-anchor="middle" font-size="7.5" fill="#B45309">现象：数字频繁跳动、读者抓不住</text>
  <text x="619" y="270.25" text-anchor="middle" font-size="7.5" fill="#B45309">对策：设定最小刷新间隔（如 500ms）</text>
  <text x="619" y="287.5" text-anchor="middle" font-size="7.5" fill="#B45309">技巧：数字滚动动画时长 ≈ 刷新间隔的一半</text>
  <text x="380" y="330" text-anchor="middle" font-size="10" fill="#065F46">验收：拔网线 10 秒再插回，曲线应自动续上且不出现断点错位</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
