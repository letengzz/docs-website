<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="388" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">大数据量四层优化：少画 → 少重绘 → 挪走 → 换引擎</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">顺序不能反：先用零成本的采样解决问题，不要一上来就上 WebGL</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四层递进：从「少画」到「换引擎」，成本逐级上升</text>
  <rect x="30" y="94" width="164" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112" y="112.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">第 1 层 · 少画</text>
  <text x="112" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">降采样：LTTB / 分桶聚合</text>
  <text x="112" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">视口裁剪：只渲染可见区间</text>
  <text x="112" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">代价：几乎为零</text>
  <text x="112" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">收益：最常见的一档</text>
  <line x1="194" y1="144" x2="206" y2="144" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="206" y="94" width="164" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="288" y="112.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">第 2 层 · 少重绘</text>
  <text x="288" y="129" text-anchor="middle" font-size="7.5" fill="#047857">关闭动画 animation: false</text>
  <text x="288" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">增量更新 appendData</text>
  <text x="288" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">脏矩形只重绘变化区</text>
  <text x="288" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">代价：改代码即可</text>
  <line x1="370" y1="144" x2="382" y2="144" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="382" y="94" width="164" height="100" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="464" y="112.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">第 3 层 · 挪走</text>
  <text x="464" y="129" text-anchor="middle" font-size="7.5" fill="#B45309">Web Worker 做计算与聚合</text>
  <text x="464" y="146.25" text-anchor="middle" font-size="7.5" fill="#B45309">OffscreenCanvas 离屏渲染</text>
  <text x="464" y="163.5" text-anchor="middle" font-size="7.5" fill="#B45309">主线程只做提交与交互</text>
  <text x="464" y="180.75" text-anchor="middle" font-size="7.5" fill="#B45309">代价：需处理线程通信</text>
  <line x1="546" y1="144" x2="558" y2="144" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="558" y="94" width="164" height="100" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="640" y="112.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">第 4 层 · 换引擎</text>
  <text x="640" y="129" text-anchor="middle" font-size="7.5" fill="#B91C1C">WebGL 批量绘制</text>
  <text x="640" y="146.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">GL 系列或专用库</text>
  <text x="640" y="163.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">10 万级点仍可交互</text>
  <text x="640" y="180.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">代价：生态与调试成本</text>
  <text x="60" y="224" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">性能预算：先把「目标帧率 + 数据规模 + 交互复杂度」写成数字，再决定做到哪一层</text>
  <rect x="30" y="238" width="140" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="254" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">&lt; 5 千点</text>
  <rect x="170" y="238" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="254" text-anchor="middle" font-size="8.5" fill="#1E293B">60 fps</text>
  <rect x="290" y="238" width="250" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="415" y="254" text-anchor="middle" font-size="8.5" fill="#334155">默认配置即可</text>
  <rect x="540" y="238" width="220" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="254" text-anchor="middle" font-size="8.5" fill="#334155">动画与提示全开</text>
  <rect x="30" y="264" width="140" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="280" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">5 千 ~ 5 万</text>
  <rect x="170" y="264" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="280" text-anchor="middle" font-size="8.5" fill="#1E293B">45~60 fps</text>
  <rect x="290" y="264" width="250" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="415" y="280" text-anchor="middle" font-size="8.5" fill="#334155">降采样 + 关动画</text>
  <rect x="540" y="264" width="220" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="280" text-anchor="middle" font-size="8.5" fill="#334155">提示开启，tooltip 用 axis 触发</text>
  <rect x="30" y="290" width="140" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="306" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">5 万 ~ 50 万</text>
  <rect x="170" y="290" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="306" text-anchor="middle" font-size="8.5" fill="#1E293B">30~45 fps</text>
  <rect x="290" y="290" width="250" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="415" y="306" text-anchor="middle" font-size="8.5" fill="#334155">采样 + 增量 + Worker</text>
  <rect x="540" y="290" width="220" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="306" text-anchor="middle" font-size="8.5" fill="#334155">限制 tooltip 频率，交互走节流</text>
  <rect x="30" y="316" width="140" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="332" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">50 万以上</text>
  <rect x="170" y="316" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="332" text-anchor="middle" font-size="8.5" fill="#1E293B">30 fps 起</text>
  <rect x="290" y="316" width="250" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="415" y="332" text-anchor="middle" font-size="8.5" fill="#334155">WebGL 渲染器</text>
  <rect x="540" y="316" width="220" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="332" text-anchor="middle" font-size="8.5" fill="#334155">数据分片加载，避免一次性灌入</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#B91C1C">先量化再优化：没有「慢」的实测数字，就不知道该不该上 WebGL</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
