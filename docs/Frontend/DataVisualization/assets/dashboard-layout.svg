<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数据大屏的三种适配方案与取舍</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">没有「最好的」方案，只有与投放环境、设计规范、工期最匹配的那一个</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">大屏适配的本质：设计稿是定宽，实际屏幕千差万别</text>
  <rect x="30" y="94" width="226" height="98" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">方案 A · 等比缩放</text>
  <text x="143" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">transform: scale()</text>
  <text x="143" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">设计稿 1920×1080 直接缩</text>
  <text x="143" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">优点：实现最快、视觉还原度高</text>
  <text x="143" y="180.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">缺点：非 16:9 屏幕留白</text>
  <rect x="268" y="94" width="226" height="98" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">方案 B · 相对单位</text>
  <text x="381" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">rem / vw / vh / clamp()</text>
  <text x="381" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">字体与间距随宽度变化</text>
  <text x="381" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">优点：真正自适应</text>
  <text x="381" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">缺点：字体可能过大或过小</text>
  <rect x="506" y="94" width="226" height="98" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">方案 C · 响应式栅格</text>
  <text x="619" y="129" text-anchor="middle" font-size="7.5" fill="#047857">CSS Grid + 断点</text>
  <text x="619" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">按可用空间重排</text>
  <text x="619" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">优点：内容不丢</text>
  <text x="619" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">缺点：工作量大、需设计配合</text>
  <text x="60" y="224" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三方案对照与取舍</text>
  <rect x="30" y="234" width="150" height="24" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="105" y="250" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="180" y="234" width="190" height="24" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="275" y="250" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">方案 A</text>
  <rect x="370" y="234" width="190" height="24" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="465" y="250" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">方案 B</text>
  <rect x="560" y="234" width="190" height="24" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="655" y="250" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">方案 C</text>
  <rect x="30" y="258" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="274" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">实现成本</text>
  <rect x="180" y="258" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="274" text-anchor="middle" font-size="8.5" fill="#334155">低</text>
  <rect x="370" y="258" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="274" text-anchor="middle" font-size="8.5" fill="#334155">中</text>
  <rect x="560" y="258" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="655" y="274" text-anchor="middle" font-size="8.5" fill="#334155">高</text>
  <rect x="30" y="282" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="298" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">视觉还原</text>
  <rect x="180" y="282" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="298" text-anchor="middle" font-size="8.5" fill="#334155">高（严格等比）</text>
  <rect x="370" y="282" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="298" text-anchor="middle" font-size="8.5" fill="#334155">中</text>
  <rect x="560" y="282" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="655" y="298" text-anchor="middle" font-size="8.5" fill="#334155">取决于设计</text>
  <rect x="30" y="306" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="322" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">异形屏表现</text>
  <rect x="180" y="306" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="322" text-anchor="middle" font-size="8.5" fill="#334155">留白或裁切</text>
  <rect x="370" y="306" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="322" text-anchor="middle" font-size="8.5" fill="#334155">自适应拉伸</text>
  <rect x="560" y="306" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="655" y="322" text-anchor="middle" font-size="8.5" fill="#334155">重排，最灵活</text>
  <rect x="30" y="330" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="346" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">文字清晰度</text>
  <rect x="180" y="330" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="346" text-anchor="middle" font-size="8.5" fill="#334155">缩放后可能发虚</text>
  <rect x="370" y="330" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="346" text-anchor="middle" font-size="8.5" fill="#334155">清晰</text>
  <rect x="560" y="330" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="655" y="346" text-anchor="middle" font-size="8.5" fill="#334155">清晰</text>
  <rect x="30" y="354" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="370" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">适用场景</text>
  <rect x="180" y="354" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="370" text-anchor="middle" font-size="8.5" fill="#334155">固定分辨率投放</text>
  <rect x="370" y="354" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="370" text-anchor="middle" font-size="8.5" fill="#334155">通用大屏</text>
  <rect x="560" y="354" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="655" y="370" text-anchor="middle" font-size="8.5" fill="#334155">含复杂内容的看板</text>
  <text x="380" y="394" text-anchor="middle" font-size="10" fill="#6D28D9">工程实践：A 打底（保证还原）+ B 兜底（保证适配），C 只在内容真的需要重排时启用</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
