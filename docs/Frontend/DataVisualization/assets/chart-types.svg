<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">按表达目标选图形：五类问题、五种图形</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选图之前先写清「这张图要回答哪一个问题」，误用绝大多数发生在这一步</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">先问「要回答什么问题」，再选图形——顺序反了就会选错图</text>
  <rect x="30" y="94" width="120" height="28" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="90" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">表达目标</text>
  <rect x="150" y="94" width="150" height="28" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="225" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">回答的问题</text>
  <rect x="300" y="94" width="150" height="28" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="375" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">首选图形</text>
  <rect x="450" y="94" width="130" height="28" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="515" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">应避免</text>
  <rect x="580" y="94" width="150" height="28" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="655" y="112" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">典型误用</text>
  <rect x="30" y="122" width="120" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="148" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">比较</text>
  <rect x="150" y="122" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="225" y="148" text-anchor="middle" font-size="8" fill="#334155">谁更大 / 多多少</text>
  <rect x="300" y="122" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="148" text-anchor="middle" font-size="8" fill="#334155">条形图、柱状图 / （从 0 起）</text>
  <rect x="450" y="122" width="130" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="515" y="148" text-anchor="middle" font-size="8" fill="#334155">截断纵轴</text>
  <rect x="580" y="122" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="588" y="140" text-anchor="start" font-size="7.5" fill="#B91C1C">纵轴不从 0 起，把 </text>
  <text x="588" y="155" text-anchor="start" font-size="7.5" fill="#B91C1C">1% 差异画成 3 倍</text>
  <rect x="30" y="166" width="120" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="192" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">趋势</text>
  <rect x="150" y="166" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="225" y="192" text-anchor="middle" font-size="8" fill="#334155">随时间怎么变</text>
  <rect x="300" y="166" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="192" text-anchor="middle" font-size="8" fill="#334155">折线图、面积图</text>
  <rect x="450" y="166" width="130" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="515" y="192" text-anchor="middle" font-size="8" fill="#334155">用柱状图堆时间</text>
  <rect x="580" y="166" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="588" y="184" text-anchor="start" font-size="7.5" fill="#B91C1C">横轴按分类排序而非时间</text>
  <text x="588" y="199" text-anchor="start" font-size="7.5" fill="#B91C1C">，趋势被抹平</text>
  <rect x="30" y="210" width="120" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="236" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">构成</text>
  <rect x="150" y="210" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="225" y="236" text-anchor="middle" font-size="8" fill="#334155">整体由什么组成</text>
  <rect x="300" y="210" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="236" text-anchor="middle" font-size="8" fill="#334155">堆叠条形、饼图 / （类别少时）</text>
  <rect x="450" y="210" width="130" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="515" y="236" text-anchor="middle" font-size="8" fill="#334155">多环 / 3D 饼图</text>
  <rect x="580" y="210" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="588" y="228" text-anchor="start" font-size="7.5" fill="#B91C1C">饼图超 6 类，小扇区</text>
  <text x="588" y="243" text-anchor="start" font-size="7.5" fill="#B91C1C">无法分辨</text>
  <rect x="30" y="254" width="120" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="280" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">分布</text>
  <rect x="150" y="254" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="225" y="280" text-anchor="middle" font-size="8" fill="#334155">数据集中在哪</text>
  <rect x="300" y="254" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="280" text-anchor="middle" font-size="8" fill="#334155">直方图、箱线图</text>
  <rect x="450" y="254" width="130" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="515" y="280" text-anchor="middle" font-size="8" fill="#334155">只报平均值</text>
  <rect x="580" y="254" width="150" height="44" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="588" y="272" text-anchor="start" font-size="7.5" fill="#B91C1C">只画均值线，双峰分布被</text>
  <text x="588" y="287" text-anchor="start" font-size="7.5" fill="#B91C1C">完全掩盖</text>
  <rect x="30" y="298" width="120" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="324" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">关系</text>
  <rect x="150" y="298" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="225" y="324" text-anchor="middle" font-size="8" fill="#334155">两者是否相关</text>
  <rect x="300" y="298" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="324" text-anchor="middle" font-size="8" fill="#334155">散点图、气泡图</text>
  <rect x="450" y="298" width="130" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="515" y="324" text-anchor="middle" font-size="8" fill="#334155">用折线连接散点</text>
  <rect x="580" y="298" width="150" height="44" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="588" y="316" text-anchor="start" font-size="7.5" fill="#B91C1C">把不相关序列连线，凭空</text>
  <text x="588" y="331" text-anchor="start" font-size="7.5" fill="#B91C1C">造出「趋势」</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#B91C1C">两条硬约束：纵轴截断必须显著标注；面积与颜色的可辨识度远低于长度与位置</text>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#6D28D9">自检一问：把这张图给同事看 3 秒，他能说出你想让他记住的那一句话吗？</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
