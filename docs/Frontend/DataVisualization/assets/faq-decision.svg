<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" width="760" height="374" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="374" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数据可视化问题排查决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">画不出、画得慢、画得不对：三类问题各有各的检查清单</text>
  <rect x="300" y="76" width="160" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">图表出问题了</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类再动手</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">三类问题路径完全不同</text>
  <line x1="380" y1="132" x2="120" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="168" width="180" height="118" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="120" y="186.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">根本画不出来</text>
  <text x="120" y="203" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 容器有没有高度</text>
  <text x="120" y="220.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">（高度 0 是最常见原因）</text>
  <text x="120" y="237.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 按需引入漏了 use</text>
  <text x="120" y="254.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 数据格式不是数组</text>
  <text x="120" y="272" text-anchor="middle" font-size="7.5" fill="#B91C1C">④ init 时 DOM 还没挂载</text>
  <line x1="380" y1="132" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="290" y="168" width="180" height="118" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">画出来了但很慢</text>
  <text x="380" y="203" text-anchor="middle" font-size="7.5" fill="#B45309">① 点数是否超过 1 万</text>
  <text x="380" y="220.25" text-anchor="middle" font-size="7.5" fill="#B45309">② 动画是否还开着</text>
  <text x="380" y="237.5" text-anchor="middle" font-size="7.5" fill="#B45309">③ 是否每帧都 setOption</text>
  <text x="380" y="254.75" text-anchor="middle" font-size="7.5" fill="#B45309">④ 是否每次都重建实例</text>
  <text x="380" y="272" text-anchor="middle" font-size="7.5" fill="#B45309">⑤ 容器是否频繁 resize</text>
  <line x1="380" y1="132" x2="640" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="550" y="168" width="180" height="118" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="640" y="186.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">画出来了但不对</text>
  <text x="640" y="203" text-anchor="middle" font-size="7.5" fill="#6D28D9">① 数据是否被隐式转换</text>
  <text x="640" y="220.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">② 坐标轴类型是否选错</text>
  <text x="640" y="237.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">③ 缺失值是 0 还是 null</text>
  <text x="640" y="254.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">④ 颜色是否带序（顺序色）</text>
  <text x="640" y="272" text-anchor="middle" font-size="7.5" fill="#6D28D9">⑤ 是否被 0 基线截断</text>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#1E3A8A">通用顺序：看容器尺寸 → 看控制台报错 → 看数据本身 → 最后才怀疑库的 bug</text>
  <text x="380" y="336" text-anchor="middle" font-size="9.5" fill="#B91C1C">最省时间的动作：把数据与 option 一起打印出来，90% 的问题在这一步就能看清</text>
  <text x="380" y="358" text-anchor="middle" font-size="9.5" fill="#64748B">反面教材：不看容器高度就反复改 option，或者一上来就怀疑版本不兼容</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
