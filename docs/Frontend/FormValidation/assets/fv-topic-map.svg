<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="表单与校验工程专题地图：从状态模型到落地验收">
  <defs>
    <marker id="fvArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#0f172a">表单与校验工程：十个问题，一条主线</text>
  <text x="480" y="60" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748b">主线：值放在哪里 → 什么时候判 → 用谁的规则判 → 判完怎么说 → 说完了怎么提交</text>

  <rect x="40" y="80" width="880" height="96" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="108" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#2563eb">第一层 · 模型（值在哪里、谁是源）</text>
  <rect x="60" y="120" width="410" height="40" rx="8" fill="#ffffff" stroke="#bfd3f5"/>
  <text x="72" y="145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">StateModel：六层状态与三种存放方式</text>
  <rect x="490" y="120" width="410" height="40" rx="8" fill="#ffffff" stroke="#bfd3f5"/>
  <text x="502" y="145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">LargeForm：订阅粒度与重渲染预算</text>

  <rect x="40" y="188" width="880" height="96" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="216" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0d9488">第二层 · 判定（什么时候判、判得多准）</text>
  <rect x="60" y="228" width="410" height="40" rx="8" fill="#ffffff" stroke="#b6e3dd"/>
  <text x="72" y="253" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">ValidationTiming：五个触发点与三档模式</text>
  <rect x="490" y="228" width="410" height="40" rx="8" fill="#ffffff" stroke="#b6e3dd"/>
  <text x="502" y="253" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">AsyncValidation：乱序、取消与防抖</text>

  <rect x="40" y="296" width="880" height="96" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="324" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#7c3aed">第三层 · 规则（规则写在哪、谁还能用）</text>
  <rect x="60" y="336" width="410" height="40" rx="8" fill="#ffffff" stroke="#ddd0f5"/>
  <text x="72" y="361" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">SchemaSource：一份 schema 三处消费</text>
  <rect x="490" y="336" width="410" height="40" rx="8" fill="#ffffff" stroke="#ddd0f5"/>
  <text x="502" y="361" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">ErrorPresentation：错误的结构与播报</text>

  <rect x="40" y="404" width="880" height="96" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="432" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c2410c">第四层 · 动作（提交与离开）</text>
  <rect x="60" y="444" width="410" height="40" rx="8" fill="#ffffff" stroke="#f5d0b0"/>
  <text x="72" y="469" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">SubmitFlow：闸门位置、部分成功、超时</text>
  <rect x="490" y="444" width="410" height="40" rx="8" fill="#ffffff" stroke="#f5d0b0"/>
  <text x="502" y="469" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">DirtyGuard：脏检查、草稿、离开保护</text>

  <rect x="40" y="512" width="430" height="80" rx="12" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="60" y="540" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">落地 · Practice</text>
  <text x="60" y="564" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">三步企业认证：从 schema 到验收八条</text>
  <rect x="490" y="512" width="430" height="80" rx="12" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="510" y="540" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">分诊 · FAQ</text>
  <text x="510" y="564" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">十二类现象 → 该翻哪一页</text>
  <line x1="480" y1="176" x2="480" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow)"/>
  <line x1="480" y1="284" x2="480" y2="296" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow)"/>
  <line x1="480" y1="392" x2="480" y2="404" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow)"/>
</svg>
