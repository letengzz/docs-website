<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="一条错误信息的解剖：label 关联、aria-describedby、aria-invalid 与首错聚焦">
  <rect x="0" y="0" width="920" height="520" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">一条错误信息由五个部件组成，少一个就读不出来</text>

  <rect x="60" y="70" width="420" height="330" rx="10" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="76" y="96" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">屏幕阅读器与键盘用户看到的</text>

  <text x="80" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">企业邮箱 *</text>
  <rect x="80" y="142" width="380" height="40" rx="6" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="94" y="167" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#334155">zhang@</text>
  <text x="80" y="204" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#b91c1c">⚠ 请输入完整邮箱，例如 name@company.com</text>
  <text x="80" y="226" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">工位邮箱请用企业域名，不接受个人邮箱</text>

  <rect x="80" y="252" width="380" height="130" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="94" y="276" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">① &lt;label for="email"&gt; 绑到输入框</text>
  <text x="94" y="298" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">② aria-invalid="true" 表明当前值不合法</text>
  <text x="94" y="320" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">③ aria-describedby 指向「错误 + 提示」两个 id</text>
  <text x="94" y="342" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">④ role="alert" 或 aria-live 让错误被播报</text>
  <text x="94" y="364" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">⑤ 提交失败后焦点落到第一个错误字段</text>

  <rect x="510" y="70" width="360" height="150" rx="10" fill="#ecfdf5" stroke="#b6e3dd"/>
  <text x="528" y="96" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f766e">错误文案的三段式</text>
  <text x="528" y="122" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">1. 哪里错了（字段，用 label 的原词）</text>
  <text x="528" y="144" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">2. 为什么错（规则，说人话）</text>
  <text x="528" y="166" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">3. 怎么改（一个可执行的例子）</text>
  <text x="528" y="196" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">反例：「输入不合法」「Error 422」</text>

  <rect x="510" y="238" width="360" height="162" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="528" y="264" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">四个常见破法</text>
  <text x="528" y="290" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· 用 placeholder 当 label（一输入就消失）</text>
  <text x="528" y="312" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· 只改边框颜色，不写文字（色盲不可辨）</text>
  <text x="528" y="334" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· 错误挂在表单顶部，字段旁没有</text>
  <text x="528" y="356" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· 焦点不动，键盘用户找不到出错处</text>
  <text x="528" y="382" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">WCAG 3.3.1 / 3.3.3 / 1.3.1 都会挂</text>

  <rect x="60" y="424" width="810" height="66" rx="10" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="78" y="450" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">一条可验收的判据</text>
  <text x="78" y="474" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">关掉屏幕只看键盘：Tab 到出错字段时，读屏应读出「企业邮箱，无效输入，请输入完整邮箱…」；看不到红框也必须知道哪里错</text>
</svg>
