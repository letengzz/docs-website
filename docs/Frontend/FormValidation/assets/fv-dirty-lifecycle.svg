<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="脏状态的三个参照点与草稿生命周期的四个阶段">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">「脏」有三个参照点，说清楚是哪一个才不会误拦用户</text>

  <rect x="40" y="60" width="250" height="120" rx="10" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="165" y="86" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">① 相对「初始值」</text>
  <text x="58" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">当前值 ≠ 打开页面时的快照</text>
  <text x="58" y="134" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">用于：离开保护、撤回到初值</text>
  <text x="58" y="156" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">坑：保存后必须刷新快照</text>

  <rect x="310" y="60" width="270" height="120" rx="10" fill="#ecfdf5" stroke="#b6e3dd"/>
  <text x="445" y="86" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f766e">② 相对「上次保存」</text>
  <text x="328" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">有未保存的改动</text>
  <text x="328" y="134" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">用于：草稿、自动保存、协作冲突</text>
  <text x="328" y="156" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">坑：与①混用会「保存后仍提示」</text>

  <rect x="600" y="60" width="260" height="120" rx="10" fill="#fff7ed" stroke="#f5d0b0"/>
  <text x="730" y="86" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c2410c">③ 相对「服务端最新」</text>
  <text x="618" y="112" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">别人已经改过，本地是旧的</text>
  <text x="618" y="134" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">用于：乐观锁、冲突提示</text>
  <text x="618" y="156" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">坑：只能靠 version/etag 判断</text>

  <text x="40" y="220" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">草稿生命周期</text>
  <rect x="40" y="236" width="180" height="60" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="130" y="262" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f172a">首次输入</text>
  <text x="130" y="282" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#64748b">写本地，不调接口</text>
  <rect x="250" y="236" width="180" height="60" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="340" y="262" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f172a">停手 1~2 s</text>
  <text x="340" y="282" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#64748b">防抖后写草稿</text>
  <rect x="460" y="236" width="180" height="60" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="550" y="262" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f172a">提交成功</text>
  <text x="550" y="282" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#64748b">删草稿 + 刷新快照</text>
  <rect x="670" y="236" width="190" height="60" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="765" y="262" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f172a">超过 7 天</text>
  <text x="765" y="282" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#64748b">过期清理（带版本号）</text>

  <rect x="40" y="320" width="820" height="56" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="58" y="344" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#b91c1c">最贵的坑：草稿恢复时不带版本号 —— 表单结构改过之后，旧草稿把已删除字段塞回表单，或者把新必填字段留空</text>
  <text x="58" y="364" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">草稿必须存 schemaVersion，恢复时按版本迁移或直接丢弃并提示</text>

  <rect x="40" y="390" width="820" height="52" rx="10" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="58" y="412" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#1d4ed8">beforeunload 只能提示、不能保存：浏览器不允许在卸载时做异步写入，所以「关页面前存草稿」只能靠定时保存</text>
  <text x="58" y="432" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">移动端还要处理页面进入后台（visibilitychange）与进程被杀（pagehide）</text>
</svg>
