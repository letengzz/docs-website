<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="schema 单一来源：一份定义被前端校验、类型推导、后端校验与服务端错误映射四处消费">
  <defs>
    <marker id="fvArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="480" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">一份 schema，四处消费：少一处就出现「两套规则」</text>

  <rect x="330" y="70" width="260" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="102" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">schema（唯一规则来源）</text>
  <text x="460" y="124" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">字段名 / 类型 / 必填 / 长度</text>
  <text x="460" y="144" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">跨字段规则 / 错误文案</text>

  <rect x="40" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#bfd3f5"/>
  <text x="140" y="238" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">① 运行时校验</text>
  <text x="140" y="260" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">safeParse → errors</text>
  <text x="140" y="280" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">浏览器与服务端同一个</text>

  <rect x="260" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#b6e3dd"/>
  <text x="360" y="238" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f766e">② 类型推导</text>
  <text x="360" y="260" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">z.infer → 表单值类型</text>
  <text x="360" y="280" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">字段名写错 = 编译错误</text>

  <rect x="480" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#ddd0f5"/>
  <text x="580" y="238" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#6d28d9">③ 渲染描述</text>
  <text x="580" y="260" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">label / hint / required</text>
  <text x="580" y="280" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">表单能自我描述</text>

  <rect x="700" y="210" width="180" height="90" rx="10" fill="#ffffff" stroke="#f5d0b0"/>
  <text x="790" y="238" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c2410c">④ 服务端错误映射</text>
  <text x="790" y="260" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">issue.path → 字段</text>
  <text x="790" y="280" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">400 也能落到红字</text>

  <line x1="400" y1="156" x2="140" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow2)"/>
  <line x1="440" y1="156" x2="360" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow2)"/>
  <line x1="490" y1="156" x2="580" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow2)"/>
  <line x1="530" y1="156" x2="790" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fvArrow2)"/>

  <rect x="40" y="330" width="400" height="120" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="356" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">该共享的</text>
  <text x="60" y="380" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">字段集合、类型、必填、长度、格式</text>
  <text x="60" y="402" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">跨字段约束（两密码一致、起止日期）</text>
  <text x="60" y="424" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">错误码与默认文案</text>

  <rect x="470" y="330" width="410" height="120" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="490" y="356" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">不该共享的</text>
  <text x="490" y="380" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">唯一性 / 验证码 / 权限：只能服务端说了算</text>
  <text x="490" y="402" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">金额与库存的最终校验</text>
  <text x="490" y="424" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">任何「必须查库」的结论</text>
</svg>
