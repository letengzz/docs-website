<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="表单状态的六层结构：值、校验、交互、提交、脏与元数据">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">表单状态的六层：只有第 1 层必须被存下来</text>
  <text x="450" y="58" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748b">越往下越「应该被算出来」，而不是再存一份</text>

  <rect x="30" y="76" width="840" height="66" rx="10" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="48" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">1 值（values）</text>
  <text x="48" y="126" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">唯一必须存的层。字段名是键，值是字符串 / 布尔 / 数组；文件另存 FileList</text>
  <text x="640" y="102" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#1d4ed8">写：onChange / 初始值回填</text>
  <text x="640" y="126" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：提交、序列化、草稿</text>

  <rect x="30" y="152" width="840" height="66" rx="10" fill="#ecfdf5" stroke="#b6e3dd"/>
  <text x="48" y="178" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f766e">2 校验结果（errors / validating）</text>
  <text x="48" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">可派生：由「值 + schema + 触发时机」算出来；异步校验多一个「进行中」位</text>
  <text x="640" y="178" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f766e">写：校验器（含异步）</text>
  <text x="640" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：错误呈现、提交闸门</text>

  <rect x="30" y="228" width="840" height="66" rx="10" fill="#f5f3ff" stroke="#ddd0f5"/>
  <text x="48" y="254" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#6d28d9">3 交互痕迹（touched / visited / dirtyFields）</text>
  <text x="48" y="278" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">只在「用户真的碰过」后才显示错误；它记录的是人，不是数据</text>
  <text x="640" y="254" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#6d28d9">写：onBlur / onChange</text>
  <text x="640" y="278" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：错误可见性判断</text>

  <rect x="30" y="304" width="840" height="66" rx="10" fill="#fff7ed" stroke="#f5d0b0"/>
  <text x="48" y="330" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c2410c">4 提交态（idle / validating / submitting / done / failed）</text>
  <text x="48" y="354" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">必须是一个枚举，不是两个布尔（isSubmitting + hasError 会有 4 种非法组合）</text>
  <text x="640" y="330" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#c2410c">写：提交处理器</text>
  <text x="640" y="354" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：按钮、离开保护</text>

  <rect x="30" y="380" width="840" height="66" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="48" y="406" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">5 脏（isDirty）</text>
  <text x="48" y="430" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">可派生：当前值 ⇄ 初始快照的深比较。200 字段实测 17~34 µs，不能每键都算</text>
  <text x="640" y="406" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#b91c1c">写：派生</text>
  <text x="640" y="430" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：离开提示、草稿保存</text>

  <rect x="30" y="456" width="840" height="66" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="48" y="482" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">6 元数据（字段清单、label、初始快照、提交次数）</text>
  <text x="48" y="506" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">由 schema 或字段配置生成，运行时只读；它是「表单能自我描述」的前提</text>
  <text x="640" y="482" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f172a">写：注册阶段</text>
  <text x="640" y="506" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">读：渲染、可访问性、测试</text>
</svg>
