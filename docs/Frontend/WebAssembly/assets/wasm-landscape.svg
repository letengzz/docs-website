<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">WebAssembly 的定位、四类场景与边界</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">它不是万能的性能药，而是一把「只为热点函数准备」的手术刀</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">WebAssembly 不是「更快的 JavaScript」，而是一个可移植的编译目标</text>
  <rect x="20" y="96" width="720" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">一句话定位：把 C/C++/Rust/Go 等语言编译成体积小、启动快、沙箱隔离的二进制模块</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#6D28D9">在浏览器里替换「算得慢」的那段 JS；在服务端与边缘把它当作比容器更轻的执行单元</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">它不做 DOM、不做网络、不做文件——这些能力要么由宿主 JS 提供，要么由 WASI 授予</text>
  <text x="40" y="178" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四类真正跑得通的场景（其余多为概念演示）</text>
  <rect x="20" y="190" width="174" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="107" y="208.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">音视频与图像处理</text>
  <text x="107" y="225" text-anchor="middle" font-size="7.5" fill="#047857">解码 / 转码 / 滤镜 / 缩略图</text>
  <text x="107" y="242.25" text-anchor="middle" font-size="7.5" fill="#047857">FFmpeg、OpenCV 已有成熟产物</text>
  <rect x="206" y="190" width="174" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="293" y="208.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">加密与压缩</text>
  <text x="293" y="225" text-anchor="middle" font-size="7.5" fill="#1D4ED8">AES / RSA / 哈希 / 解压</text>
  <text x="293" y="242.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">纯计算、无 DOM、收益最确定</text>
  <rect x="392" y="190" width="174" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="479" y="208.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">客户端数据库与引擎</text>
  <text x="479" y="225" text-anchor="middle" font-size="7.5" fill="#0F766E">SQLite / DuckDB 的 Wasm 版</text>
  <text x="479" y="242.25" text-anchor="middle" font-size="7.5" fill="#0F766E">把「熟悉的 SQL」带进浏览器</text>
  <rect x="578" y="190" width="174" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="665" y="208.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">插件沙箱（服务端/边缘）</text>
  <text x="665" y="225" text-anchor="middle" font-size="7.5" fill="#C2410C">用户上传的第三方逻辑</text>
  <text x="665" y="242.25" text-anchor="middle" font-size="7.5" fill="#C2410C">能力授予式隔离，防越权</text>
  <text x="380" y="296" text-anchor="middle" font-size="10" fill="#991B1B">不适合的场景：频繁跨边界传小对象、需要大量 DOM 操作、逻辑本身很轻</text>
  <text x="380" y="320" text-anchor="middle" font-size="9.5" fill="#6D28D9">判据：先量出「热点函数的耗时占比重」，低于整帧 10% 就别上 Wasm——搬运成本会吃掉收益</text>
  <text x="40" y="352" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">与既有专题的分工</text>
  <rect x="20" y="364" width="330" height="28" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="185" y="383" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">Frontend/Others/PerformanceOptimization</text>
  <rect x="358" y="364" width="382" height="28" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="374" y="383" text-anchor="start" font-size="8.5" fill="#334155">讲加载、渲染、缓存等通用性能工程</text>
  <rect x="20" y="398" width="330" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="185" y="417" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">本专题</text>
  <rect x="358" y="398" width="382" height="28" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="374" y="417" text-anchor="start" font-size="8.5" fill="#334155">讲算法级加速：把一段计算整体换掉实现</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
