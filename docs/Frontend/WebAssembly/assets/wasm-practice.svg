<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：图像卷积滤波器的 Wasm 加速路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">热点定位 → 纯计算 C 实现 → 一次大调用 → 放进 Worker，这条路径可复用到多数计算密集型功能</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">实战：用 C 写一个灰度 + 3×3 卷积滤波器，在浏览器里加速图片处理</text>
  <rect x="20" y="96" width="136" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="88" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">① 找出热点</text>
  <text x="88" y="131" text-anchor="middle" font-size="7" fill="#334155">拿 4000×3000 图片测</text>
  <text x="88" y="147.1" text-anchor="middle" font-size="7" fill="#334155">纯 JS 卷积耗时定格</text>
  <text x="88" y="163.2" text-anchor="middle" font-size="7" fill="#334155">确认占比 &gt; 50%</text>
  <line x1="156" y1="142" x2="168" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="168" y="96" width="136" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="236" y="114.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">② 写 C 实现</text>
  <text x="236" y="131" text-anchor="middle" font-size="7" fill="#6D28D9">只接收指针与宽高</text>
  <text x="236" y="147.1" text-anchor="middle" font-size="7" fill="#6D28D9">不碰 DOM / 不碰 I/O</text>
  <text x="236" y="163.2" text-anchor="middle" font-size="7" fill="#6D28D9">保持函数纯净</text>
  <line x1="304" y1="142" x2="316" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="316" y="96" width="136" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="384" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">③ 编译成 wasm</text>
  <text x="384" y="131" text-anchor="middle" font-size="7" fill="#1D4ED8">emcc -O3 -s SIMD</text>
  <text x="384" y="147.1" text-anchor="middle" font-size="7" fill="#1D4ED8">导出 malloc / free</text>
  <text x="384" y="163.2" text-anchor="middle" font-size="7" fill="#1D4ED8">产物放 public/</text>
  <line x1="452" y1="142" x2="464" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="464" y="96" width="136" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="532" y="114.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">④ 接线性内存</text>
  <text x="532" y="131" text-anchor="middle" font-size="7" fill="#047857">在 wasm 内存里分配</text>
  <text x="532" y="147.1" text-anchor="middle" font-size="7" fill="#047857">写入 RGBA 字节</text>
  <text x="532" y="163.2" text-anchor="middle" font-size="7" fill="#047857">调用后读回结果</text>
  <line x1="600" y1="142" x2="612" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="612" y="96" width="136" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="680" y="114.2" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">⑤ 放进 Worker</text>
  <text x="680" y="131" text-anchor="middle" font-size="7" fill="#C2410C">主线程不阻塞</text>
  <text x="680" y="147.1" text-anchor="middle" font-size="7" fill="#C2410C">用 Transferable 传</text>
  <text x="680" y="163.2" text-anchor="middle" font-size="7" fill="#C2410C">避免结构化克隆拷贝</text>
  <rect x="20" y="208" width="720" height="126" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="40" y="228" text-anchor="start" font-size="9.5" fill="#0F172A" font-weight="bold">关键代码（C 侧 + JS 侧）</text>
  <text x="36" y="250" text-anchor="start" font-size="8.5" fill="#1E3A8A">#include &lt;stdlib.h&gt;        // C 侧：只负责计算，内存由 JS 分配后传入</text>
  <text x="36" y="271" text-anchor="start" font-size="8.5" fill="#334155">__attribute__((export_name("gray_conv")))</text>
  <text x="36" y="292" text-anchor="start" font-size="8.5" fill="#334155">void gray_conv(unsigned char *px, int w, int h) { /* 灰度化 + 卷积 */ }</text>
  <text x="36" y="313" text-anchor="start" font-size="8.5" fill="#334155"></text>
  <text x="36" y="334" text-anchor="start" font-size="8.5" fill="#334155">const ptr = exports.malloc(w * h * 4);         // JS 侧：在 wasm 堆上分配</text>
  <text x="36" y="355" text-anchor="start" font-size="8.5" fill="#334155">new Uint8Array(exports.memory.buffer, ptr, w * h * 4).set(imageData.data);  // 一次写入</text>
  <text x="36" y="376" text-anchor="start" font-size="8.5" fill="#334155">exports.gray_conv(ptr, w, h);                  // 一次调用，不要按行循环调用</text>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#065F46">验收判据：输出与原图逐像素差异为 0（或与 JS 实现哈希一致）；p95 耗时下降 ≥ 40%；首屏体积增加可接受</text>
  <text x="380" y="382" text-anchor="middle" font-size="9.5" fill="#6D28D9">本地验证：python -m http.server 8080 起静态服务，DevTools 里确认 .wasm 为 application/wasm 且未被转码</text>
  <text x="380" y="406" text-anchor="middle" font-size="9.5" fill="#991B1B">别忘了释放：处理完成后调 free(ptr)，否则每处理一张图就泄漏一份，几分钟后页面崩掉</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
