<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="474" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">线性内存与跨边界传值的三条路线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先决定「传什么形状的数据」，再决定用什么语言写——这比选语言更影响最终性能</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Wasm 没有字符串和对象，只有一块可以按字节读写的线性内存</text>
  <rect x="20" y="96" width="720" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">线性内存（Linear Memory）：一整块可增长的 ArrayBuffer，Wasm 与 JS 共享它</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#334155">Wasm 侧用指针（整数偏移）访问；JS 侧用 Uint8Array / Float32Array 视图访问同一块内存</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#334155">内存可以 grow()，但增长后旧的 TypedArray 视图会失效——必须重新创建视图</text>
  <text x="40" y="172" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">跨边界传值的三条路线（越往下拷贝越多）</text>
  <rect x="20" y="184" width="236" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="138" y="202.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">数字（i32 / f64）</text>
  <text x="138" y="219" text-anchor="middle" font-size="7.5" fill="#047857">直接按值传，零成本</text>
  <text x="138" y="236.25" text-anchor="middle" font-size="7.5" fill="#047857">最省——设计 API 时优先</text>
  <text x="138" y="253.5" text-anchor="middle" font-size="7.5" fill="#047857">适合循环内高频调用</text>
  <rect x="268" y="184" width="236" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="386" y="202.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">TypedArray（数组/图像）</text>
  <text x="386" y="219" text-anchor="middle" font-size="7.5" fill="#1D4ED8">在 Wasm 内存里分配并写入</text>
  <text x="386" y="236.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">一次拷贝，之后零拷贝访问</text>
  <text x="386" y="253.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">图像/音频数据首选</text>
  <rect x="516" y="184" width="236" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="634" y="202.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">字符串与对象</text>
  <text x="634" y="219" text-anchor="middle" font-size="7.5" fill="#C2410C">需编码为 UTF-8 字节</text>
  <text x="634" y="236.25" text-anchor="middle" font-size="7.5" fill="#C2410C">写入内存 → 传指针+长度</text>
  <text x="634" y="253.5" text-anchor="middle" font-size="7.5" fill="#C2410C">返回时再解码，成本较高</text>
  <text x="380" y="290" text-anchor="middle" font-size="10" fill="#6D28D9">设计原则：把「多次小调用」合并成「一次大数组调用」——边界开销是 Wasm 性能的最大杀手</text>
  <text x="40" y="320" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">字符串互传的两种实现（Rust 侧最常写的一段）</text>
  <rect x="20" y="332" width="720" height="104" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="36" y="352" text-anchor="start" font-size="8.5" fill="#1E3A8A">#[wasm_bindgen]                       // 由 wasm-bindgen 自动生成胶水，JS 侧直接传 string</text>
  <text x="36" y="373" text-anchor="start" font-size="8.5" fill="#334155">pub fn greet(name: &amp;str) -&gt; String { format!("Hello, {name}!") }</text>
  <text x="36" y="394" text-anchor="start" font-size="8.5" fill="#334155"></text>
  <text x="36" y="415" text-anchor="start" font-size="8.5" fill="#1E3A8A">#[wasm_bindgen]                       // 手动管理：返回指针，交给 JS 用视图读取</text>
  <text x="36" y="436" text-anchor="start" font-size="8.5" fill="#334155">pub fn alloc(len: usize) -&gt; *mut u8 { ... }</text>
  <text x="380" y="456" text-anchor="middle" font-size="9.5" fill="#991B1B">内存泄漏的两个来源：Wasm 侧分配后没人释放；JS 侧持有旧视图导致旧内存无法回收</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
