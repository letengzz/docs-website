<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="456" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">WASI 版本演进、组件模型与运行时</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">浏览器内靠 JS 宿主补能力，浏览器外靠 WASI 授予能力——两条路的权限模型完全相反</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">走出浏览器：WASI 让同一份 .wasm 能在服务端与边缘跑</text>
  <rect x="20" y="96" width="720" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">WASI（WebAssembly System Interface）：为 Wasm 定义的标准系统接口</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#0F766E">类比为「Wasm 的 POSIX」——规定模块如何访问文件、时钟、随机数、套接字</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#0F766E">能力型安全模型：模块初始没有任何权限，只能访问宿主显式授予的资源（不是「默认放开再限制」）</text>
  <text x="40" y="178" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">版本演进（写文档时以官方仓库为准，这里是 2026-09 的核对结果）</text>
  <rect x="20" y="190" width="174" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="107" y="208.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">WASI 0.1 Preview 1</text>
  <text x="107" y="225" text-anchor="middle" font-size="7.5" fill="#334155">最早期版本</text>
  <text x="107" y="242.25" text-anchor="middle" font-size="7.5" fill="#334155">能力非常有限</text>
  <text x="107" y="259.5" text-anchor="middle" font-size="7.5" fill="#334155">仅存量项目</text>
  <rect x="206" y="190" width="174" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="293" y="208.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">WASI 0.2 Preview 2</text>
  <text x="293" y="225" text-anchor="middle" font-size="7.5" fill="#1D4ED8">当前稳定线</text>
  <text x="293" y="242.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">文件/时钟/套接字齐全</text>
  <text x="293" y="259.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">组件模型可生产用</text>
  <rect x="392" y="190" width="174" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="479" y="208.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">WASI 0.3 Preview 3</text>
  <text x="479" y="225" text-anchor="middle" font-size="7.5" fill="#6D28D9">2026-06 发布</text>
  <text x="479" y="242.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">原生异步：stream / future</text>
  <text x="479" y="259.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">运行时逐步默认启用</text>
  <rect x="578" y="190" width="174" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="665" y="208.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">WASI 1.0</text>
  <text x="665" y="225" text-anchor="middle" font-size="7.5" fill="#047857">目标 2026 末~2027 初</text>
  <text x="665" y="242.25" text-anchor="middle" font-size="7.5" fill="#047857">生产稳定版</text>
  <text x="665" y="259.5" text-anchor="middle" font-size="7.5" fill="#047857">尚未发布</text>
  <text x="40" y="296" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">组件模型（Component Model）与运行时</text>
  <rect x="20" y="308" width="350" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="195" y="326.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">组件模型解决什么</text>
  <text x="195" y="343" text-anchor="middle" font-size="7.5" fill="#6D28D9">用 WIT 的接口定义语言描述「需要什么、提供什么」</text>
  <text x="195" y="360.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">不同语言编译的组件可以按类型组合，互调不再靠字节约定</text>
  <text x="195" y="377.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">把「库」升级为「可组合、可版本化的独立单元」</text>
  <rect x="386" y="308" width="354" height="88" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="563" y="326.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">常见运行时</text>
  <text x="563" y="343" text-anchor="middle" font-size="7.5" fill="#0E7490">Wasmtime（Bytecode Alliance，服务端主线）</text>
  <text x="563" y="360.25" text-anchor="middle" font-size="7.5" fill="#0E7490">Wasmer / wazero（Go 实现，无 CGO）</text>
  <text x="563" y="377.5" text-anchor="middle" font-size="7.5" fill="#0E7490">WasmEdge（面向边缘与 AI 推理）· Node.js 内置 WebAssembly</text>
  <text x="380" y="414" text-anchor="middle" font-size="10" fill="#0F766E">落地判据：需要「比容器更轻的隔离 + 毫秒级启动」且逻辑无状态，才用 Wasm 组件替代容器</text>
  <text x="380" y="438" text-anchor="middle" font-size="9.5" fill="#991B1B">反面：需要完整 POSIX、原生依赖、长驻有状态服务时，容器与虚拟机仍是更自然的选择</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
