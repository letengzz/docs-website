<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="staleTime 与 gcTime 在同一条时间轴上的分工：新鲜期、陈旧期、卸载后回收">
  <defs>
    <marker id="tm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">两个计时器，两个起点：staleTime 从数据到达算，gcTime 从卸载算</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 时间轴 -->
    <line x1="60" y1="300" x2="900" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#tm)"/>
    <text x="906" y="304" font-size="12" fill="#64748b">t</text>

    <!-- 刻度 -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="120" y1="294" x2="120" y2="306"/>
      <line x1="260" y1="294" x2="260" y2="306"/>
      <line x1="470" y1="294" x2="470" y2="306"/>
      <line x1="650" y1="294" x2="650" y2="306"/>
      <line x1="850" y1="294" x2="850" y2="306"/>
    </g>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="120" y="324">t0 挂载 · 发请求</text>
      <text x="260" y="324">t1 数据到达</text>
      <text x="470" y="324">t2 staleTime 到期</text>
      <text x="650" y="324">t3 组件卸载</text>
      <text x="850" y="324">t4 gcTime 到期</text>
    </g>

    <!-- 新鲜期条 -->
    <rect x="260" y="80" width="210" height="34" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="365" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">新鲜期：不发请求</text>

    <!-- 陈旧期条 -->
    <rect x="470" y="124" width="180" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="560" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">陈旧：下次触发才重取</text>

    <!-- gc 条 -->
    <rect x="650" y="168" width="200" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="750" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">无订阅：gcTime 计时中</text>

    <!-- 回收 -->
    <rect x="850" y="212" width="50" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="875" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">回收</text>

    <!-- 连接线 -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3">
      <line x1="260" y1="114" x2="260" y2="300"/>
      <line x1="470" y1="158" x2="470" y2="300"/>
      <line x1="650" y1="202" x2="650" y2="300"/>
      <line x1="850" y1="246" x2="850" y2="300"/>
      <line x1="120" y1="114" x2="120" y2="294"/>
    </g>

    <!-- 注释 -->
    <text x="60" y="60" font-size="12" font-weight="600" fill="#2563eb">读侧只关心「新鲜」：staleTime 决定要不要重取</text>
    <text x="60" y="262" font-size="11" fill="#64748b">gcTime 在组件存活期间完全不生效——「缓存没生效」九成是把 gcTime 当成了缓存有效期</text>
  </g>
</svg>
