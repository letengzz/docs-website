<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="看板一次拖动的七跳链路，以及每一跳的失败分支">
  <defs>
    <marker id="pr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="prr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">一次拖动：七跳，两个失败分支，一个必须丢弃的回环</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 1 -->
    <rect x="40" y="60" width="180" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="56" y="84" font-size="12" font-weight="600" fill="#1e3a8a">① drop → 算目标位置</text>
    <text x="56" y="104" font-size="11" fill="#334155">列 + 插入下标</text>
    <text x="56" y="118" font-size="11" fill="#64748b">纯本地，0 ms</text>

    <line x1="222" y1="92" x2="256" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pr)"/>

    <!-- 2 -->
    <rect x="260" y="60" width="180" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="276" y="84" font-size="12" font-weight="600" fill="#1e3a8a">② 快照 + 乐观补丁</text>
    <text x="276" y="104" font-size="11" fill="#334155">三处同改 + cancelQueries</text>
    <text x="276" y="118" font-size="11" fill="#64748b">SDP-A / SDP-H</text>

    <line x1="442" y1="92" x2="476" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pr)"/>

    <!-- 3 -->
    <rect x="480" y="60" width="180" height="64" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="496" y="84" font-size="12" font-weight="600" fill="#0f172a">③ PATCH + 幂等键</text>
    <text x="496" y="104" font-size="11" fill="#334155">If-Match: "43"</text>
    <text x="496" y="118" font-size="11" fill="#64748b">SDP-C / SDP-E</text>

    <line x1="662" y1="92" x2="696" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#pr)"/>

    <!-- 4 -->
    <rect x="700" y="60" width="220" height="64" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="716" y="84" font-size="12" font-weight="600" fill="#0f172a">④ 服务端事务</text>
    <text x="716" y="104" font-size="11" fill="#334155">校验版本 → 改 position_key</text>
    <text x="716" y="118" font-size="11" fill="#64748b">→ seq+1 → 写 outbox</text>

    <!-- 5 -->
    <line x1="810" y1="126" x2="810" y2="164" stroke="#2563eb" stroke-width="2" marker-end="url(#pr)"/>
    <rect x="700" y="168" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="716" y="192" font-size="12" font-weight="600" fill="#166534">⑤ 以响应为准补丁</text>
    <text x="716" y="212" font-size="11" fill="#14532d">新 version / 新 seq 覆盖本地</text>
    <text x="716" y="226" font-size="11" fill="#166534">不用本地算的 position_key</text>

    <!-- 6 -->
    <line x1="698" y1="200" x2="664" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#pr)"/>
    <rect x="440" y="168" width="220" height="64" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="456" y="192" font-size="12" font-weight="600" fill="#0f172a">⑥ 广播 card.moved</text>
    <text x="456" y="212" font-size="11" fill="#334155">其他端：校验 → 判序 → 合并</text>
    <text x="456" y="226" font-size="11" fill="#64748b">SDP-D / SDP-F / SDP-G</text>

    <!-- 7 -->
    <line x1="438" y1="200" x2="404" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#prr)"/>
    <rect x="180" y="168" width="220" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="196" y="192" font-size="12" font-weight="600" fill="#991b1b">⑦ 本端也收到 → 丢弃</text>
    <text x="196" y="212" font-size="11" fill="#7f1d1d">seq ≤ 本地已应用</text>
    <text x="196" y="226" font-size="11" fill="#991b1b">漏了这一步：卡片闪一下</text>

    <!-- 失败分支 -->
    <line x1="570" y1="126" x2="570" y2="272" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#prr)"/>
    <rect x="40" y="276" width="400" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="58" y="300" font-size="12" font-weight="600" fill="#991b1b">分支 A：超时 / 5xx / 断线</text>
    <text x="58" y="320" font-size="11" fill="#7f1d1d">回滚到快照（≤ 2 s）+ 提示；断线入离线队列</text>
    <text x="58" y="338" font-size="11" fill="#7f1d1d">重试用同一 opId —— 否则会移动两次</text>

    <rect x="470" y="276" width="450" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="488" y="300" font-size="12" font-weight="600" fill="#9a3412">分支 B：409 / 412 / 422</text>
    <text x="488" y="320" font-size="11" fill="#7c2d12">不回滚：拉最新版本 + 冲突提示（别人已经改过）</text>
    <text x="488" y="338" font-size="11" fill="#7c2d12">静默重试 = 把可见冲突变成静默覆盖</text>

    <!-- 验收 -->
    <rect x="40" y="364" width="880" height="58" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="58" y="388" font-size="12" font-weight="600" fill="#0f172a">S1~S10 验收序列（见正文第四节）</text>
    <text x="58" y="408" font-size="11" fill="#475569">S1 乐观 · S2 回滚 · S3 幂等 · S4 广播 · S5 冲突 · S6 刷新 · S7 断线 · S8 连拖 · S9 详情一致 · S10 诊断包</text>
  </g>
</svg>
