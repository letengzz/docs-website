<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="四类状态的所有者、寿命与作废方式对比">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">四类状态：所有者在哪，作废条件就在哪</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 表头 -->
    <rect x="40" y="52" width="880" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="60" y="74" font-size="12" font-weight="600" fill="#1e3a8a">类型</text>
    <text x="220" y="74" font-size="12" font-weight="600" fill="#1e3a8a">所有者</text>
    <text x="380" y="74" font-size="12" font-weight="600" fill="#1e3a8a">寿命</text>
    <text x="560" y="74" font-size="12" font-weight="600" fill="#1e3a8a">作废方式</text>

    <!-- 远端态 -->
    <rect x="40" y="96" width="880" height="62" rx="6" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="60" y="122" font-size="13" font-weight="600" fill="#0f172a">远端态</text>
    <text x="60" y="142" font-size="11" fill="#64748b">看板列表 / 卡片详情 / 权限</text>
    <text x="220" y="132" font-size="12" fill="#334155">服务端</text>
    <text x="380" y="132" font-size="12" fill="#334155">缓存，可被回收</text>
    <text x="560" y="126" font-size="12" fill="#1d4ed8">失效 + 重取</text>
    <text x="560" y="144" font-size="11" fill="#64748b">→ 查询层缓存</text>

    <!-- 客户端态 -->
    <rect x="40" y="166" width="880" height="62" rx="6" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="60" y="192" font-size="13" font-weight="600" fill="#0f172a">客户端态</text>
    <text x="60" y="212" font-size="11" fill="#64748b">侧栏折叠 / 主题 / 选中 id</text>
    <text x="220" y="202" font-size="12" fill="#334155">当前会话</text>
    <text x="380" y="202" font-size="12" fill="#334155">会话级或持久化</text>
    <text x="560" y="196" font-size="12" fill="#1d4ed8">用户操作</text>
    <text x="560" y="214" font-size="11" fill="#64748b">→ 轻量 store</text>

    <!-- URL 态 -->
    <rect x="40" y="236" width="880" height="62" rx="6" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="60" y="262" font-size="13" font-weight="600" fill="#0f172a">URL 态</text>
    <text x="60" y="282" font-size="11" fill="#64748b">页码 / 筛选 / 排序 / tab</text>
    <text x="220" y="272" font-size="12" fill="#334155">地址栏</text>
    <text x="380" y="272" font-size="12" fill="#334155">可分享、可后退</text>
    <text x="560" y="266" font-size="12" fill="#1d4ed8">导航</text>
    <text x="560" y="284" font-size="11" fill="#64748b">→ 路由 query</text>

    <!-- 表单态 -->
    <rect x="40" y="306" width="880" height="62" rx="6" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="60" y="332" font-size="13" font-weight="600" fill="#0f172a">表单态</text>
    <text x="60" y="352" font-size="11" fill="#64748b">输入值 / 校验错误 / 脏标记</text>
    <text x="220" y="342" font-size="12" fill="#334155">组件（草稿）</text>
    <text x="380" y="342" font-size="12" fill="#334155">组件生命周期</text>
    <text x="560" y="336" font-size="12" fill="#1d4ed8">提交或重置</text>
    <text x="560" y="354" font-size="11" fill="#64748b">→ 本地 state / 表单库</text>

    <!-- 底部：允许流动，不允许复制 -->
    <rect x="40" y="384" width="880" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="480" y="406" text-anchor="middle" font-size="12" fill="#9a3412">四类之间允许「流动」（分页参数流进查询 key），不允许「复制」（把列表数据再存进 store）</text>
  </g>
</svg>
