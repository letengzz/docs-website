<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="推送事件落地的四步：校验、判序、合并、落地，以及被判序丢弃的分支">
  <defs>
    <marker id="sy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">事件到了 ≠ 事件生效：四步落地，一步都不能省</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- socket -->
    <rect x="40" y="90" width="150" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="115" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">WebSocket</text>
    <text x="115" y="138" text-anchor="middle" font-size="11" fill="#334155">card.moved</text>

    <line x1="192" y1="125" x2="226" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#sy)"/>

    <!-- step1 -->
    <rect x="230" y="80" width="160" height="90" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="246" y="104" font-size="12" font-weight="600" fill="#0f172a">① 校验</text>
    <text x="246" y="124" font-size="11" fill="#475569">结构 / 租户 / 看板</text>
    <text x="246" y="142" font-size="11" fill="#64748b">不属于当前看板 → 丢</text>
    <text x="246" y="160" font-size="11" fill="#64748b">SDS-A</text>

    <line x1="392" y1="125" x2="426" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#sy)"/>

    <!-- step2 -->
    <rect x="430" y="80" width="160" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="446" y="104" font-size="12" font-weight="600" fill="#92400e">② 判序</text>
    <text x="446" y="124" font-size="11" fill="#78350f">seq 大于本地才应用</text>
    <text x="446" y="142" font-size="11" fill="#78350f">用「大于」，不用「大于等于」</text>
    <text x="446" y="160" font-size="11" fill="#92400e">SDS-B</text>

    <line x1="592" y1="125" x2="626" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#sy)"/>

    <!-- step3 -->
    <rect x="630" y="80" width="150" height="90" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="646" y="104" font-size="12" font-weight="600" fill="#0f172a">③ 合并</text>
    <text x="646" y="124" font-size="11" fill="#475569">按类型做局部补丁</text>
    <text x="646" y="142" font-size="11" fill="#64748b">不整表重取</text>
    <text x="646" y="160" font-size="11" fill="#64748b">SDS-C</text>

    <line x1="782" y1="125" x2="816" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#sy)"/>

    <!-- step4 -->
    <rect x="820" y="80" width="110" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="836" y="104" font-size="12" font-weight="600" fill="#166534">④ 落地</text>
    <text x="836" y="124" font-size="11" fill="#14532d">写缓存</text>
    <text x="836" y="142" font-size="11" fill="#14532d">更新 lastSeq</text>
    <text x="836" y="160" font-size="11" fill="#166534">SDS-D</text>

    <!-- 丢弃分支 -->
    <path d="M510,172 L510,220" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#sy)"/>
    <rect x="420" y="224" width="300" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="440" y="246" font-size="12" font-weight="600" fill="#991b1b">丢弃（drop）：重复投递 / 自己触发的回环</text>
    <text x="440" y="266" font-size="11" fill="#7f1d1d">「丢弃」要记日志，否则排障时看不出是「没收到」还是「收到了没用」</text>

    <!-- 断线补拉 -->
    <rect x="40" y="230" width="340" height="86" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="58" y="254" font-size="12" font-weight="600" fill="#0f172a">断线：cursor 补拉</text>
    <text x="58" y="274" font-size="11" fill="#475569">GET /events?after=lastSeq</text>
    <text x="58" y="292" font-size="11" fill="#475569">返回 truncated → 整表重取并重置游标</text>
    <text x="58" y="308" font-size="11" fill="#64748b">补拉与实时交错：seq 小于等于已应用的丢弃（SDS-G）</text>

    <!-- 冲突 -->
    <rect x="40" y="330" width="890" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="60" y="352" font-size="12" font-weight="600" fill="#9a3412">冲突策略按「丢了会不会有人受损」选：会 → 版本号（409/412 可见）；不会 → LWW 可接受</text>
    <text x="60" y="372" font-size="11" fill="#7c2d12">本机模拟 1000 轮双端编辑：LWW 静默覆盖 116 次；版本号 0 次覆盖、116 次冲突可见</text>
  </g>
</svg>
