<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="状态管理与数据流专题地图：分类、变更、结构、质量四组九页">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">从「存哪」到「可回放」——九页的推进顺序</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 组标题 -->
    <text x="40" y="76" font-size="13" font-weight="600" fill="#2563eb">① 先分类</text>
    <text x="270" y="76" font-size="13" font-weight="600" fill="#2563eb">② 再管变更</text>
    <text x="500" y="76" font-size="13" font-weight="600" fill="#2563eb">③ 再管结构</text>
    <text x="730" y="76" font-size="13" font-weight="600" fill="#2563eb">④ 最后能证明</text>

    <!-- 组 1 -->
    <rect x="40" y="90" width="200" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="116" font-size="13" font-weight="600" fill="#1e3a8a">总览</text>
    <text x="56" y="136" font-size="11" fill="#475569">四类状态 · 五个必失点</text>
    <text x="56" y="154" font-size="11" fill="#64748b">SDO · 8 条</text>

    <rect x="40" y="180" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="56" y="206" font-size="13" font-weight="600" fill="#0f172a">本地态与远端态</text>
    <text x="56" y="226" font-size="11" fill="#475569">两面墙 · 一条时间轴</text>
    <text x="56" y="244" font-size="11" fill="#64748b">SDL · 8 条</text>

    <rect x="40" y="270" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="56" y="296" font-size="13" font-weight="600" fill="#0f172a">常见问题与分诊</text>
    <text x="56" y="316" font-size="11" fill="#475569">十类症状 · 十四问</text>
    <text x="56" y="334" font-size="11" fill="#64748b">SDQ · 8 条</text>

    <!-- 组 2 -->
    <rect x="270" y="90" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="286" y="116" font-size="13" font-weight="600" fill="#0f172a">缓存失效</text>
    <text x="286" y="136" font-size="11" fill="#475569">四种机制 · 写后读</text>
    <text x="286" y="154" font-size="11" fill="#64748b">SDI · 8 条</text>

    <rect x="270" y="180" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="286" y="206" font-size="13" font-weight="600" fill="#0f172a">乐观更新</text>
    <text x="286" y="226" font-size="11" fill="#475569">三阶段 · 临时 ID</text>
    <text x="286" y="244" font-size="11" fill="#64748b">SDU · 8 条</text>

    <rect x="270" y="270" width="200" height="76" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="286" y="296" font-size="13" font-weight="600" fill="#9a3412">实战：一次拖动</text>
    <text x="286" y="316" font-size="11" fill="#7c2d12">七跳链路 · S1~S10</text>
    <text x="286" y="334" font-size="11" fill="#9a3412">SDP · 8 条</text>

    <!-- 组 3 -->
    <rect x="500" y="90" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="516" y="116" font-size="13" font-weight="600" fill="#0f172a">派生与归一化</text>
    <text x="516" y="136" font-size="11" fill="#475569">不存就不错 · 实体表</text>
    <text x="516" y="154" font-size="11" fill="#64748b">SDD · 8 条</text>

    <rect x="500" y="180" width="200" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="516" y="206" font-size="13" font-weight="600" fill="#0f172a">多端同步与收敛</text>
    <text x="516" y="226" font-size="11" fill="#475569">落地四步 · 判序</text>
    <text x="516" y="244" font-size="11" fill="#64748b">SDS · 8 条</text>

    <!-- 组 4 -->
    <rect x="730" y="90" width="190" height="76" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="746" y="116" font-size="13" font-weight="600" fill="#166534">状态可观测</text>
    <text x="746" y="136" font-size="11" fill="#14532d">日志 · 快照 · 复现</text>
    <text x="746" y="154" font-size="11" fill="#166534">SDV · 8 条</text>

    <rect x="730" y="180" width="190" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="746" y="206" font-size="13" font-weight="600" fill="#0f172a">上线自查</text>
    <text x="746" y="226" font-size="11" fill="#475569">12 项 · 反模式</text>
    <text x="746" y="244" font-size="11" fill="#64748b">FAQ 第三节</text>

    <!-- 箭头 -->
    <line x1="242" y1="128" x2="266" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="242" y1="218" x2="266" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="472" y1="128" x2="496" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="472" y1="218" x2="496" y2="218" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="702" y1="128" x2="726" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 底部判据合计 -->
    <rect x="40" y="366" width="880" height="34" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="480" y="388" text-anchor="middle" font-size="12" fill="#475569">九页九族 · 72 条判据｜每族 8 条，逐页前缀唯一；违反时都写成「违反时的样子 + 怎么验证」</text>
  </g>
</svg>
