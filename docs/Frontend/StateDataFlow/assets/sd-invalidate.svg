<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="四种失效机制：时间、版本、事件、订阅，从不同触发点汇入同一份缓存">
  <defs>
    <marker id="iv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">四种失效机制不是替代关系，是四类受众</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 四个触发源 -->
    <rect x="40" y="60" width="210" height="66" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="56" y="84" font-size="13" font-weight="600" fill="#0f172a">① 时间（TTL）</text>
    <text x="56" y="104" font-size="11" fill="#475569">到点后的下一次触发</text>
    <text x="56" y="120" font-size="11" fill="#64748b">受众：不着急的人</text>

    <rect x="40" y="138" width="210" height="66" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="56" y="162" font-size="13" font-weight="600" fill="#0f172a">② 版本（ETag）</text>
    <text x="56" y="182" font-size="11" fill="#475569">请求时比对，412 拒绝</text>
    <text x="56" y="198" font-size="11" fill="#64748b">受众：并发写的人</text>

    <rect x="40" y="216" width="210" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="240" font-size="13" font-weight="600" fill="#1e3a8a">③ 事件（本地失效）</text>
    <text x="56" y="260" font-size="11" fill="#475569">写成功回调里主动调用</text>
    <text x="56" y="276" font-size="11" fill="#64748b">受众：同一标签页</text>

    <rect x="40" y="294" width="210" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="318" font-size="13" font-weight="600" fill="#1e3a8a">④ 订阅（推送/广播）</text>
    <text x="56" y="338" font-size="11" fill="#475569">WebSocket / BroadcastChannel</text>
    <text x="56" y="354" font-size="11" fill="#64748b">受众：其他标签页 / 其他设备</text>

    <!-- 汇合 -->
    <line x1="252" y1="93" x2="596" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#iv)"/>
    <line x1="252" y1="171" x2="596" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#iv)"/>
    <line x1="252" y1="249" x2="596" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#iv)"/>
    <line x1="252" y1="327" x2="596" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#iv)"/>

    <!-- 中间步骤 -->
    <rect x="600" y="140" width="140" height="120" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="670" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">缓存条目</text>
    <text x="670" y="188" text-anchor="middle" font-size="11" fill="#14532d">标记 stale</text>
    <text x="670" y="208" text-anchor="middle" font-size="11" fill="#14532d">按 key 精确匹配</text>
    <text x="670" y="228" text-anchor="middle" font-size="11" fill="#14532d">能补丁就别重取</text>
    <text x="670" y="248" text-anchor="middle" font-size="11" fill="#166534">同 key 并发合并</text>

    <!-- 输出 -->
    <line x1="742" y1="200" x2="796" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#iv)"/>
    <rect x="800" y="150" width="130" height="100" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="865" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">视图看到</text>
    <text x="865" y="198" text-anchor="middle" font-size="11" fill="#7c2d12">新值</text>
    <text x="865" y="218" text-anchor="middle" font-size="11" fill="#7c2d12">（或先旧后新）</text>
    <text x="865" y="238" text-anchor="middle" font-size="11" fill="#9a3412">1 次请求以内</text>

    <!-- 底部提醒 -->
    <rect x="40" y="366" width="880" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="480" y="384" text-anchor="middle" font-size="11" fill="#991b1b">只做「时间」= 靠用户刷新；只做「事件」= 换台设备永远看不到新值</text>
  </g>
</svg>
