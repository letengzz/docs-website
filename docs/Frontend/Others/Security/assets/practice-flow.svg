<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="200" height="70"/>
  <text x="140" y="92">安全基线清单</text>
  <text class="small" x="140" y="112">输入/输出/传输/存储</text>

  <rect class="mid" x="310" y="60" width="240" height="70"/>
  <text x="430" y="92">分层防御实施</text>
  <text class="small" x="430" y="112">编码 + CSP + SameSite</text>

  <rect class="out" x="620" y="60" width="200" height="70"/>
  <text x="720" y="92">验证与监控</text>
  <text class="small" x="720" y="112">审计 + 测试 + 上报</text>

  <line x1="240" y1="95" x2="310" y2="95" marker-end="url(#pf-arrow)"/>
  <line x1="550" y1="95" x2="620" y2="95" marker-end="url(#pf-arrow)"/>

  <rect class="out" x="310" y="210" width="240" height="54"/>
  <text x="430" y="238">上线检查 + 应急响应</text>
  <text class="small" x="430" y="256">扫描 → 修复 → 复测</text>

  <line x1="430" y1="130" x2="430" y2="210" marker-end="url(#pf-arrow)"/>

  <text class="small" x="430" y="295">原则：纵深防御（Defense in Depth）——每一层失守都有下一层兜底</text>
  <text class="small" x="430" y="315">最小权限 + 默认拒绝 + 不信任任何输入</text>
</svg>
