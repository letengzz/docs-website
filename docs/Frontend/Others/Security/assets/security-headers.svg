<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sh-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .hdr { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .eff { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="hdr" x="40" y="40" width="240" height="54"/>
  <text x="160" y="68">Content-Security-Policy</text>
  <rect class="eff" x="330" y="40" width="240" height="54"/>
  <text x="450" y="68">防 XSS / 注入</text>

  <rect class="hdr" x="40" y="120" width="240" height="54"/>
  <text x="160" y="148">X-Frame-Options / frame-ancestors</text>
  <rect class="eff" x="330" y="120" width="240" height="54"/>
  <text x="450" y="148">防点击劫持</text>

  <rect class="hdr" x="40" y="200" width="240" height="54"/>
  <text x="160" y="228">Strict-Transport-Security</text>
  <rect class="eff" x="330" y="200" width="240" height="54"/>
  <text x="450" y="228">强制 HTTPS / 防降级</text>

  <rect class="hdr" x="580" y="40" width="240" height="54"/>
  <text x="700" y="68">X-Content-Type-Options</text>
  <rect class="eff" x="580" y="120" width="240" height="54"/>
  <text x="700" y="148">防 MIME 嗅探</text>

  <rect class="hdr" x="580" y="200" width="240" height="54"/>
  <text x="700" y="228">Referrer-Policy</text>
  <rect class="eff" x="580" y="280" width="240" height="54"/>
  <text x="700" y="308">防来源泄露</text>

  <text class="small" x="430" y="330">推荐基座：CSP + HSTS + X-Content-Type-Options + frame-ancestors + Referrer-Policy</text>
</svg>
