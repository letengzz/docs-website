<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="280" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">前端 CI 流水线</text>
  <g font-size="13" text-anchor="middle">
    <rect x="25" y="100" width="130" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="130" fill="#4338ca" font-weight="bold">lint</text>
    <text x="90" y="152" fill="#4b5563" font-size="11">ESLint + Prettier</text>
    <text x="90" y="172" fill="#6b7280" font-size="10">--max-warnings 0</text>
    <rect x="195" y="100" width="130" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="260" y="130" fill="#b45309" font-weight="bold">typecheck</text>
    <text x="260" y="152" fill="#4b5563" font-size="11">tsc --noEmit</text>
    <text x="260" y="172" fill="#6b7280" font-size="10">类型门禁</text>
    <rect x="365" y="100" width="130" height="90" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="430" y="130" fill="#be185d" font-weight="bold">test</text>
    <text x="430" y="152" fill="#4b5563" font-size="11">Vitest + 覆盖率</text>
    <text x="430" y="172" fill="#6b7280" font-size="10">阈值 80%</text>
    <rect x="535" y="100" width="130" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="600" y="130" fill="#047857" font-weight="bold">build</text>
    <text x="600" y="152" fill="#4b5563" font-size="11">vite build</text>
    <text x="600" y="172" fill="#6b7280" font-size="10">上传制品</text>
    <rect x="705" y="100" width="110" height="90" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="760" y="130" fill="#6d28d9" font-weight="bold">deploy</text>
    <text x="760" y="152" fill="#4b5563" font-size="11">预览/生产</text>
    <text x="760" y="172" fill="#6b7280" font-size="10">CDN 同步</text>
  </g>
  <path d="M 160 145 H 188" stroke="#6366f1" stroke-width="2.5" marker-end="url(#c1)"/>
  <path d="M 330 145 H 358" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#c1)"/>
  <path d="M 500 145 H 528" stroke="#ec4899" stroke-width="2.5" marker-end="url(#c1)"/>
  <path d="M 670 145 H 698" stroke="#10b981" stroke-width="2.5" marker-end="url(#c1)"/>
  <text x="420" y="235" text-anchor="middle" font-size="13" fill="#475569">PR 必须全部通过才可合并；main 合并自动构建并部署预览环境，Tag 触发生产发布</text>
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
