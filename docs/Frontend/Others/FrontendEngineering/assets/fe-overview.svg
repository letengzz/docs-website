  <rect x="170" y="220" width="500" height="70" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">目标：高效协作 · 稳定质量 · 快速交付 · 可维护</text>
  <text x="420" y="272" text-anchor="middle" font-size="12" fill="#4b5563">脚手架统一结构 → 规范约束开发 → 测试守住质量 → 流水线自动化交付</text>
