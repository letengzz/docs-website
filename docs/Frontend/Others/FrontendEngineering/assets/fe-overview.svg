<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="330" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">前端工程化领域全景</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="150" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="112" fill="#4338ca" font-weight="bold">代码规范</text>
    <text x="105" y="134" fill="#4b5563" font-size="11">ESLint / Prettier</text>
    <text x="105" y="154" fill="#6b7280" font-size="10">Stylelint / EditorConfig</text>
    <rect x="210" y="80" width="150" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="285" y="112" fill="#047857" font-weight="bold">Git 规范</text>
    <text x="285" y="134" fill="#4b5563" font-size="11">分支模型</text>
    <text x="285" y="154" fill="#6b7280" font-size="10">Husky / commitlint</text>
    <rect x="390" y="80" width="150" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="112" fill="#b45309" font-weight="bold">测试体系</text>
    <text x="465" y="134" fill="#4b5563" font-size="11">Vitest / 组件测试</text>
