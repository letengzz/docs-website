<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">标准前端项目结构（Vue3 + Vite）</text>
  <g font-size="13" fill="#374151">
    <text x="100" y="75" font-weight="bold" fill="#4338ca">项目根目录</text>
    <text x="130" y="108">src/</text>
    <text x="170" y="134">api/        —— 接口封装</text>
    <text x="170" y="158">assets/     —— 静态资源</text>
    <text x="170" y="182">components/ —— 通用组件</text>
    <text x="170" y="206">composables/ —— 组合式函数</text>
    <text x="170" y="230">router/     —— 路由配置</text>
    <text x="170" y="254">stores/     —— 状态管理</text>
    <text x="170" y="278">views/      —— 页面</text>
    <text x="130" y="306">public/     —— 不打包的静态文件</text>
    <text x="130" y="330">tests/      —— 测试目录</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <rect x="440" y="55" width="330" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="605" y="80" font-weight="bold" fill="#334155">根目录关键文件</text>
    <text x="470" y="112">vite.config.ts    构建配置</text>
    <text x="470" y="140">tsconfig.json     TypeScript 配置</text>
    <text x="470" y="168">eslint.config.mjs 代码规范（flat config）</text>
    <text x="470" y="196">.prettierrc        格式规范</text>
    <text x="470" y="224">.editorconfig      编辑器统一</text>
    <text x="470" y="252">.husky/            Git 钩子</text>
    <text x="470" y="280">.env.development / .env.production 环境变量</text>
    <text x="470" y="308">.github/workflows/ CI 流水线</text>
    <text x="470" y="336">package.json + pnpm-lock.yaml 依赖锁定</text>
  </g>
</svg>
