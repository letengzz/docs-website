<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="280" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Git 提交质量关卡</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="100" width="150" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="130" fill="#4338ca" font-weight="bold">git add</text>
    <text x="105" y="152" fill="#4b5563" font-size="11">暂存变更</text>
    <text x="105" y="172" fill="#6b7280" font-size="10">仅提交相关文件</text>
    <rect x="220" y="100" width="180" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="130" fill="#b45309" font-weight="bold">pre-commit 钩子</text>
    <text x="310" y="152" fill="#4b5563" font-size="11">Husky + lint-staged</text>
    <text x="310" y="172" fill="#6b7280" font-size="10">只检查暂存文件</text>
    <rect x="440" y="100" width="180" height="90" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="530" y="130" fill="#be185d" font-weight="bold">commit-msg 钩子</text>
    <text x="530" y="152" fill="#4b5563" font-size="11">commitlint 校验</text>
    <text x="530" y="172" fill="#6b7280" font-size="10">Conventional Commits</text>
    <rect x="660" y="100" width="150" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="735" y="130" fill="#047857" font-weight="bold">pre-push 钩子</text>
    <text x="735" y="152" fill="#4b5563" font-size="11">全量单测/类型检查</text>
    <text x="735" y="172" fill="#6b7280" font-size="10">CI 二次兜底</text>
  </g>
  <path d="M 185 145 H 213" stroke="#6366f1" stroke-width="2.5" marker-end="url(#g1)"/>
  <path d="M 405 145 H 433" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#g1)"/>
  <path d="M 625 145 H 653" stroke="#ec4899" stroke-width="2.5" marker-end="url(#g1)"/>
  <text x="420" y="235" text-anchor="middle" font-size="13" fill="#475569">原则：本地钩子快而准（只查变更），CI 全量兜底；钩子可跳过但评审与 CI 不可绕过</text>
  <defs>
    <marker id="g1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
