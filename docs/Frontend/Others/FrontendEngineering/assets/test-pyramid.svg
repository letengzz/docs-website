<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="330" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">前端测试金字塔</text>
  <!-- pyramid -->
  <polygon points="410,70 570,250 250,250" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <polygon points="410,140 505,250 315,250" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="410,205 455,250 365,250" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">E2E 少量</text>
  <text x="410" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">组件测试 中等</text>
  <text x="410" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">单元测试 大量</text>
  <!-- right descriptions -->
  <g font-size="12" fill="#4b5563">
    <text x="600" y="110">E2E：Playwright / Cypress</text>
    <text x="600" y="130">验证用户真实流程，慢而稳定</text>
    <text x="600" y="170">组件测试：Vue Test Utils</text>
    <text x="600" y="190">Testing Library / Vitest</text>
    <text x="600" y="230">单元测试：纯函数、工具库</text>
    <text x="600" y="250">mock 依赖，快而稳</text>
  </g>
  <text x="410" y="300" text-anchor="middle" font-size="13" fill="#475569">策略：单元测试打底（70%+）→ 组件测试覆盖交互 → E2E 只保核心主流程（登录、下单）</text>
</svg>
