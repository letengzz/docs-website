<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="mo-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .src { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="src" x="40" y="60" width="220" height="70"/>
  <text x="150" y="90">RUM 埋点</text>
  <text class="small" x="150" y="110">Performance API + sendBeacon</text>

  <rect class="mid" x="320" y="60" width="220" height="70"/>
  <text x="430" y="90">采集与上报</text>
  <text class="small" x="430" y="110">采样率 / 去重 / 批量</text>

  <rect class="out" x="600" y="60" width="220" height="70"/>
  <text x="710" y="90">可视化告警</text>
  <text class="small" x="710" y="110">Dashboard / 阈值告警</text>

  <line x1="260" y1="95" x2="320" y2="95" marker-end="url(#mo-arrow)"/>
  <line x1="540" y1="95" x2="600" y2="95" marker-end="url(#mo-arrow)"/>

  <rect class="out" x="320" y="210" width="220" height="54"/>
  <text x="430" y="238">性能预算门禁</text>
  <text class="small" x="430" y="256">LCP/体积 超标即告警</text>

  <line x1="710" y1="130" x2="710" y2="180" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="710" y1="180" x2="545" y2="210" marker-end="url(#mo-arrow)"/>

  <text class="small" x="430" y="295">工具：web-vitals 库 / Sentry / Grafana / 自建上报</text>
  <text class="small" x="430" y="315">关注 p75/p95 而非平均值，按环境（移动/桌面）分层</text>
  <text class="small" x="430" y="335">异常联动：性能劣化 → 回滚 / 关闭实验 / 告警升级</text>
</svg>
