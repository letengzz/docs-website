<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="mm-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .lab { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .field { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .core { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="core" x="300" y="30" width="260" height="54"/>
  <text x="430" y="61">Core Web Vitals</text>
  <text class="small" x="430" y="76">LCP / INP / CLS</text>

  <line x1="360" y1="84" x2="150" y2="130" marker-end="url(#mm-arrow)"/>
  <line x1="500" y1="84" x2="710" y2="130" marker-end="url(#mm-arrow)"/>

  <rect class="lab" x="40" y="132" width="220" height="70"/>
  <text x="150" y="160">实验室（Lab）</text>
  <text class="small" x="150" y="182">Lighthouse / WebPageTest</text>
  <text class="small" x="150" y="196">可复现，用于定位问题</text>

  <rect class="field" x="600" y="132" width="220" height="70"/>
  <text x="710" y="160">真实用户（Field）</text>
  <text class="small" x="710" y="182">CrUX / RUM 埋点</text>
  <text class="small" x="710" y="196">反映真实体验，用于监控</text>

  <rect class="field" x="280" y="240" width="300" height="56"/>
  <text x="430" y="268">评估闭环</text>
  <text class="small" x="430" y="286">Lab 定位 → 修复 → Field 验证 → 持续监控</text>

  <line x1="430" y1="202" x2="430" y2="240" marker-end="url(#mm-arrow)"/>

  <text class="small" x="430" y="325">指标联动：TTFB 影响 LCP，长任务影响 INP，图片无尺寸影响 CLS</text>
</svg>
