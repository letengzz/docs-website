<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="bo-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="220" height="70"/>
  <text x="150" y="90">源码与依赖</text>
  <text class="small" x="150" y="110">ESM / 依赖预构建</text>

  <rect class="mid" x="320" y="60" width="220" height="70"/>
  <text x="430" y="90">构建过程</text>
  <text class="small" x="430" y="110">压缩 / Tree-shaking / 分包</text>

  <rect class="out" x="600" y="60" width="220" height="70"/>
  <text x="710" y="90">产物与缓存</text>
  <text class="small" x="710" y="110">hash 命名 / 长效缓存</text>

  <line x1="260" y1="95" x2="320" y2="95" marker-end="url(#bo-arrow)"/>
  <line x1="540" y1="95" x2="600" y2="95" marker-end="url(#bo-arrow)"/>

  <rect class="out" x="320" y="210" width="220" height="54"/>
  <text x="430" y="238">bundle 分析与预算</text>
  <text class="small" x="430" y="256">超出阈值 CI 失败</text>

  <line x1="710" y1="130" x2="710" y2="180" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="710" y1="180" x2="545" y2="210" marker-end="url(#bo-arrow)"/>

  <text class="small" x="430" y="295">构建优化双目标：构建快（开发体验）+ 产物小（用户加载）</text>
  <text class="small" x="430" y="315">与工程化构建优化的分工：本页聚焦体积预算与性能联动</text>
</svg>
