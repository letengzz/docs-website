<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="lo-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .out { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="40" y="60" width="230" height="70"/>
  <text x="155" y="90">1. 网络与 DNS</text>
  <text class="small" x="155" y="110">CDN / HTTP3 / 预连接</text>

  <rect class="step" x="315" y="60" width="230" height="70"/>
  <text x="430" y="90">2. 首字节 TTFB</text>
  <text class="small" x="430" y="110">缓存 / 边缘计算 / SSR</text>

  <rect class="step" x="590" y="60" width="230" height="70"/>
  <text x="705" y="90">3. 资源加载</text>
  <text class="small" x="705" y="110">HTML / CSS / JS / 图片</text>

  <line x1="270" y1="95" x2="315" y2="95" marker-end="url(#lo-arrow)"/>
  <line x1="545" y1="95" x2="590" y2="95" marker-end="url(#lo-arrow)"/>

  <rect class="out" x="315" y="190" width="230" height="60"/>
  <text x="430" y="218">4. 渲染与交互</text>
  <text class="small" x="430" y="236">关键路径 / 懒加载 / 骨架屏</text>

  <line x1="705" y1="130" x2="705" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="705" y1="175" x2="545" y2="190" marker-end="url(#lo-arrow)"/>

  <text class="small" x="430" y="300">关键原则：减少请求数、减小体积、提前开始、延后非关键</text>
  <text class="small" x="430" y="320">手段：preload / preconnect / 按需加载 / 缓存命中</text>
  <text class="small" x="430" y="340">目标：LCP ≤ 2.5s，TTI 尽快可交互</text>
</svg>
