<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="微交互与动效工程专题地图">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#0f172a">微交互与动效工程：从判断到落地</text>

  <rect x="40" y="70" width="880" height="86" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="100" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#2563eb">一、建立判断（先回答「该不该动」）</text>
  <rect x="60" y="110" width="410" height="34" rx="8" fill="#ffffff" stroke="#bfd3f5"/>
  <text x="72" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Overview：四类用途与四条边界</text>
  <rect x="490" y="110" width="410" height="34" rx="8" fill="#ffffff" stroke="#bfd3f5"/>
  <text x="502" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Principles：动因、时间预算与感知</text>

  <rect x="40" y="172" width="880" height="86" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="202" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0d9488">二、定参数（动多久、怎么起停）</text>
  <rect x="60" y="212" width="410" height="34" rx="8" fill="#ffffff" stroke="#b6e3dd"/>
  <text x="72" y="234" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Timing：时长分级、缓动与弹簧</text>
  <rect x="490" y="212" width="410" height="34" rx="8" fill="#ffffff" stroke="#b6e3dd"/>
  <text x="502" y="234" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Feedback：状态机、按下态与乐观 UI</text>

  <rect x="40" y="274" width="880" height="86" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="304" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#7c3aed">三、组织形态（成组的变化）</text>
  <rect x="60" y="314" width="410" height="34" rx="8" fill="#ffffff" stroke="#ddd0f5"/>
  <text x="72" y="336" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">ListAnimation：FLIP、进出场与布局动画</text>
  <rect x="490" y="314" width="410" height="34" rx="8" fill="#ffffff" stroke="#ddd0f5"/>
  <text x="502" y="336" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">PageTransition：View Transitions 与共享元素</text>

  <rect x="40" y="376" width="880" height="86" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="60" y="406" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b45309">四、守住底线（不能牺牲的两件事）</text>
  <rect x="60" y="416" width="410" height="34" rx="8" fill="#ffffff" stroke="#f0d8a8"/>
  <text x="72" y="438" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Performance：合成层、掉帧与 INP</text>
  <rect x="490" y="416" width="410" height="34" rx="8" fill="#ffffff" stroke="#f0d8a8"/>
  <text x="502" y="438" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Accessibility：动效偏好、闪烁与焦点</text>

  <rect x="40" y="478" width="880" height="86" rx="12" fill="#eff6ff" stroke="#93b4f0"/>
  <text x="60" y="508" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">五、落地（把规则变成能验的东西）</text>
  <rect x="60" y="518" width="410" height="34" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="72" y="540" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">Practice：看板拖拽 + 列表增删 + 转场</text>
  <rect x="490" y="518" width="410" height="34" rx="8" fill="#ffffff" stroke="#93b4f0"/>
  <text x="502" y="540" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1f2937">FAQ：十二类现象的分诊入口</text>
</svg>
