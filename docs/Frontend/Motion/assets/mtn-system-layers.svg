<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="动效系统的四层结构与看板实例的落点">
  <defs>
    <marker id="q" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">动效系统四层：上层只允许引用下层的 token，不允许自己写数字</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <rect x="40" y="60" width="420" height="66" rx="10" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="58" y="86" font-size="13" font-weight="600" fill="#1d4ed8">④ 页面（pages）</text>
    <text x="58" y="108" font-size="11" fill="#1e40af">看板页：拖拽落位、评论抽屉、附件上传进度</text>

    <line x1="250" y1="128" x2="250" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#q)"/>

    <rect x="40" y="142" width="420" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="58" y="168" font-size="13" font-weight="600" fill="#047857">③ 模式（patterns）</text>
    <text x="58" y="190" font-size="11" fill="#065f46">列表增删、抽屉开合、卡片重排、骨架切换</text>

    <line x1="250" y1="210" x2="250" y2="222" stroke="#64748b" stroke-width="1.6" marker-end="url(#q)"/>

    <rect x="40" y="224" width="420" height="66" rx="10" fill="#fffbeb" stroke="#f0d8a8"/>
    <text x="58" y="250" font-size="13" font-weight="600" fill="#92400e">② 原语（primitives）</text>
    <text x="58" y="272" font-size="11" fill="#92400e">fade-in / slide-in / flip-move / press / progress</text>

    <line x1="250" y1="292" x2="250" y2="304" stroke="#64748b" stroke-width="1.6" marker-end="url(#q)"/>

    <rect x="40" y="306" width="420" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="332" font-size="13" font-weight="600" fill="#0f172a">① 令牌（tokens）</text>
    <text x="58" y="354" font-size="11" fill="#475569">--motion-fast / --motion-base / --ease-standard / --ease-exit</text>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#475569">
    <rect x="500" y="60" width="420" height="312" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="520" y="86" font-size="13" font-weight="600" fill="#0f172a">看板实例：三个动作各自的落点</text>

    <text x="520" y="116" font-weight="600" fill="#1d4ed8">拖动卡片落位</text>
    <text x="520" y="138">用户手指带来的位移是「直接操纵」，松手后只补最后一段：</text>
    <text x="520" y="158">用 spring，时长 180–260ms，速度承接手指，不做 ease-out 重起。</text>
    <text x="520" y="178" fill="#b45309">判据：松手瞬间的位移与手指连续，没有「跳一下再走」。</text>

    <text x="520" y="208" font-weight="600" fill="#047857">列表新增/删除</text>
    <text x="520" y="230">新增：高度从 0 展开 + 淡入（或 FLIP 整体位移），200ms。</text>
    <text x="520" y="250">删除：先淡出 + 高度收拢，180ms 后再真正移除节点。</text>
    <text x="520" y="270" fill="#b45309">判据：删除时下方卡片是「补位」而不是「瞬移」。</text>

    <text x="520" y="300" font-weight="600" fill="#92400e">评论抽屉</text>
    <text x="520" y="322">遮罩 120ms 淡入，抽屉 260ms 从右侧进入，遮罩先动 40ms。</text>
    <text x="520" y="342" fill="#b45309">判据：按 Esc 立即开始反向动画，且焦点回到触发按钮。</text>
    <text x="520" y="362" fill="#64748b">三个动作共用同一组 token，改一处即可全站生效。</text>
  </g>

  <rect x="40" y="396" width="880" height="60" rx="10" fill="#eff6ff" stroke="#93b4f0"/>
  <text x="60" y="422" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1d4ed8">为什么要有第 ① 层：没有 token 的系统，三个月后会有 27 个不同的 300ms 和 9 条不同的贝塞尔曲线，</text>
  <text x="60" y="444" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#1d4ed8">而没有人能说清哪一条才是「我们家的标准」。</text>
</svg>
