<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="View Transitions 的生命周期四拍与伪元素树">
  <defs>
    <marker id="v" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">View Transitions 的四拍：浏览器替你截图、替你补间</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">
    <rect x="40" y="70" width="200" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="58" y="96" font-size="13" font-weight="600" fill="#0f172a">① 截旧态</text>
    <text x="58" y="118" fill="#475569">旧 DOM 被拍成位图</text>
    <text x="58" y="138" fill="#475569">此时页面「冻结」</text>
    <text x="58" y="158" fill="#64748b">渲染被暂停，输入仍排队</text>

    <line x1="248" y1="120" x2="286" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#v)"/>

    <rect x="294" y="70" width="200" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="312" y="96" font-size="13" font-weight="600" fill="#0f172a">② 跑回调</text>
    <text x="312" y="118" fill="#475569">updateCallback 里改 DOM</text>
    <text x="312" y="138" fill="#475569">只允许同步改动</text>
    <text x="312" y="158" fill="#64748b">异步数据应提前准备好</text>

    <line x1="502" y1="120" x2="540" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#v)"/>

    <rect x="548" y="70" width="200" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="566" y="96" font-size="13" font-weight="600" fill="#0f172a">③ 截新态</text>
    <text x="566" y="118" fill="#475569">新 DOM 再拍一张</text>
    <text x="566" y="138" fill="#475569">同名的元素被配对</text>
    <text x="566" y="158" fill="#64748b">view-transition-name 必须唯一</text>

    <line x1="756" y1="120" x2="794" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#v)"/>

    <rect x="802" y="70" width="118" height="100" rx="10" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="818" y="96" font-size="13" font-weight="600" fill="#1d4ed8">④ 补间</text>
    <text x="818" y="118" fill="#1e40af">两图交叉淡入</text>
    <text x="818" y="138" fill="#1e40af">或形变</text>
    <text x="818" y="158" fill="#1e40af">合成线程完成</text>
  </g>

  <text x="40" y="212" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">自动生成的伪元素树（只在这段时间存在）</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <rect x="40" y="224" width="420" height="196" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="58" y="250" fill="#1e40af">::view-transition</text>
    <text x="74" y="272" fill="#475569">├─ ::view-transition-group(card-42)</text>
    <text x="74" y="294" fill="#475569">│   ├─ ::view-transition-image-pair(card-42)</text>
    <text x="74" y="316" fill="#475569">│   │   ├─ ::view-transition-old(card-42)</text>
    <text x="74" y="338" fill="#475569">│   │   └─ ::view-transition-new(card-42)</text>
    <text x="74" y="360" fill="#64748b">├─ ::view-transition-group(root)</text>
    <text x="74" y="382" fill="#64748b">└─ ::view-transition-group(sidebar)</text>
    <text x="58" y="408" fill="#b45309">旧/新两张图是同名元素配对的结果</text>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#475569">
    <rect x="480" y="224" width="440" height="196" rx="10" fill="#fffbeb" stroke="#f0d8a8"/>
    <text x="498" y="250" font-size="13" font-weight="600" fill="#92400e">四条落地纪律</text>
    <text x="498" y="276">① 一次快照里 view-transition-name 不能重名（重名即整段过渡失效）。</text>
    <text x="498" y="298">② 只给「真的要飞」的那一个元素命名，其余交给默认的 root 淡入。</text>
    <text x="498" y="320">③ 回调里不要 await 数据请求：数据要在 startViewTransition 之前就备好。</text>
    <text x="498" y="342">④ 必须能降级：document.startViewTransition?.(cb) ?? cb()。</text>
    <text x="498" y="372" fill="#64748b">覆盖率（2026-10）：同文档 · Chrome 111+ / Safari 18+ / Firefox 144+；</text>
    <text x="498" y="392" fill="#64748b">跨文档 · Chrome 126+ / Safari 18.2+ / Firefox 未支持（忽略 @view-transition）。</text>
  </g>
</svg>
