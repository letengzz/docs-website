<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">实战：生产级配置分层</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="180" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="86" fill="#0e7490" font-weight="bold" font-size="14">webpack.common.js</text>
    <text x="120" y="106" fill="#4b5563" font-size="11">入口 / 输出 / 别名</text>
    <text x="120" y="123" fill="#4b5563" font-size="11">通用 loader 与插件</text>
    <rect x="240" y="60" width="200" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="340" y="86" fill="#047857" font-weight="bold" font-size="14">webpack.dev.js</text>
    <text x="340" y="106" fill="#4b5563" font-size="11">devServer / HMR</text>
    <text x="340" y="123" fill="#4b5563" font-size="11">eval-source-map</text>
    <rect x="470" y="60" width="190" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="565" y="86" fill="#b45309" font-weight="bold" font-size="14">webpack.prod.js</text>
    <text x="565" y="106" fill="#4b5563" font-size="11">压缩 / 分包</text>
    <text x="565" y="123" fill="#4b5563" font-size="11">contenthash / clean</text>
    <rect x="690" y="60" width="160" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="770" y="86" fill="#6d28d9" font-weight="bold" font-size="14">webpack-merge</text>
    <text x="770" y="106" fill="#4b5563" font-size="11">合并公共配置</text>
    <path d="M 210 110 L 238 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 440 110 L 468 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 660 110 L 688 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="200" width="270" height="140" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="165" y="226" fill="#0f766e" font-weight="bold" font-size="14">公共配置要点</text>
    <text x="165" y="246" fill="#4b5563" font-size="11">resolve.alias 与 extensions</text>
    <text x="165" y="263" fill="#4b5563" font-size="11">oneOf 规则减少重复匹配</text>
    <text x="165" y="280" fill="#4b5563" font-size="11">HtmlWebpackPlugin 统一 HTML 模板</text>
    <text x="165" y="297" fill="#4b5563" font-size="11">optimization.splitChunks 基础分包</text>
    <rect x="320" y="200" width="260" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="226" fill="#4338ca" font-weight="bold" font-size="14">生产配置要点</text>
    <text x="450" y="246" fill="#4b5563" font-size="11">mode: 'production'</text>
    <text x="450" y="263" fill="#4b5563" font-size="11">cache: { type: 'filesystem' }</text>
    <text x="450" y="280" fill="#4b5563" font-size="11">output.clean: true</text>
    <text x="450" y="297" fill="#4b5563" font-size="11">contenthash 文件名</text>
    <text x="450" y="314" fill="#4b5563" font-size="11">runtimeChunk: 'single'</text>
    <rect x="600" y="200" width="250" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="226" fill="#be123c" font-weight="bold" font-size="14">验证清单</text>
    <text x="725" y="246" fill="#4b5563" font-size="11">webpack --stats errors-only 无输出</text>
    <text x="725" y="263" fill="#4b5563" font-size="11">产物体积与上次对比无异常增长</text>
    <text x="725" y="280" fill="#4b5563" font-size="11">本地 http-server 打开 dist 验证运行</text>
    <text x="725" y="297" fill="#4b5563" font-size="11">二次构建耗时明显下降（缓存生效）</text>
    <rect x="30" y="355" width="820" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="381" fill="#334155" font-weight="bold" font-size="13">原则：common 只放两边都需要的；差异化的东西放各自文件——避免用 N 个 if 判断 mode</text>
</g>
  <text x="440" y="434" text-anchor="middle" font-size="13" fill="#475569">Webpack 的复杂度来自「可配置」，因此配置分层比配置技巧更能降低维护成本</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
