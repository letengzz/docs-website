<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Webpack 核心概念关系图</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="150" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="105" y="86" fill="#0e7490" font-weight="bold" font-size="14">Entry</text>
    <text x="105" y="106" fill="#4b5563" font-size="11">打包起点</text>
    <text x="105" y="123" fill="#4b5563" font-size="11">可多入口</text>
    <rect x="210" y="60" width="170" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="295" y="86" fill="#4338ca" font-weight="bold" font-size="14">Module 依赖图</text>
    <text x="295" y="106" fill="#4b5563" font-size="11">递归解析 import/require</text>
    <rect x="410" y="60" width="170" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="495" y="86" fill="#6d28d9" font-weight="bold" font-size="14">Loader</text>
    <text x="495" y="106" fill="#4b5563" font-size="11">转换单个模块</text>
    <text x="495" y="123" fill="#4b5563" font-size="11">链式从右到左</text>
    <rect x="610" y="60" width="120" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="670" y="86" fill="#047857" font-weight="bold" font-size="14">Chunk</text>
    <text x="670" y="106" fill="#4b5563" font-size="11">代码块分组</text>
    <rect x="760" y="60" width="90" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="805" y="86" fill="#b45309" font-weight="bold" font-size="14">Bundle</text>
    <text x="805" y="106" fill="#4b5563" font-size="11">输出文件</text>
    <path d="M 180 105 L 208 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 380 105 L 408 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 580 105 L 608 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 730 105 L 758 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="200" width="250" height="120" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="155" y="226" fill="#0f766e" font-weight="bold" font-size="14">Plugin</text>
    <text x="155" y="246" fill="#4b5563" font-size="11">在整个构建生命周期挂钩子</text>
    <text x="155" y="263" fill="#4b5563" font-size="11">能改产物、能注入资源</text>
    <rect x="300" y="200" width="260" height="120" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="430" y="226" fill="#c2410c" font-weight="bold" font-size="14">Output</text>
    <text x="430" y="246" fill="#4b5563" font-size="11">filename / path</text>
    <text x="430" y="263" fill="#4b5563" font-size="11">assetModuleFilename</text>
    <rect x="580" y="200" width="270" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="715" y="226" fill="#334155" font-weight="bold" font-size="14">Mode</text>
    <text x="715" y="246" fill="#4b5563" font-size="11">development / production</text>
    <text x="715" y="263" fill="#4b5563" font-size="11">决定内置优化开关</text>
    <rect x="30" y="340" width="820" height="70" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="440" y="366" fill="#be123c" font-weight="bold" font-size="13">分工记法：Loader 处理「一个文件怎么变成模块」，Plugin 处理「整个构建过程怎么组织」——两者职责不重叠</text>
</g>
  <text x="440" y="434" text-anchor="middle" font-size="13" fill="#475569">理解依赖图是理解 Webpack 的前提：一切优化都是对「图」的剪裁与切分</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
