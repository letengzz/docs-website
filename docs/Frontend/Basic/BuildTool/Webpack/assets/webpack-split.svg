<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">代码分割的四种方式</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="190" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="125" y="96" fill="#0e7490" font-weight="bold" font-size="14">① 多入口分割</text>
    <text x="125" y="116" fill="#4b5563" font-size="11">entry: { app, admin }</text>
    <text x="125" y="133" fill="#4b5563" font-size="11">output: [name].[hash].js</text>
    <text x="125" y="150" fill="#4b5563" font-size="11">适合多页面应用</text>
    <rect x="240" y="70" width="190" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="335" y="96" fill="#4338ca" font-weight="bold" font-size="14">② 动态 import</text>
    <text x="335" y="116" fill="#4b5563" font-size="11">import('./heavy')</text>
    <text x="335" y="133" fill="#4b5563" font-size="11">返回 Promise</text>
    <text x="335" y="150" fill="#4b5563" font-size="11">按需加载，生成独立 chunk</text>
    <rect x="450" y="70" width="190" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="545" y="96" fill="#6d28d9" font-weight="bold" font-size="14">③ splitChunks</text>
    <text x="545" y="116" fill="#4b5563" font-size="11">自动抽取公共依赖</text>
    <text x="545" y="133" fill="#4b5563" font-size="11">cacheGroups 定制规则</text>
    <text x="545" y="150" fill="#4b5563" font-size="11">chunks: 'all'</text>
    <rect x="660" y="70" width="190" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="755" y="96" fill="#047857" font-weight="bold" font-size="14">④ runtimeChunk</text>
    <text x="755" y="116" fill="#4b5563" font-size="11">单独抽出运行时代码</text>
    <text x="755" y="133" fill="#4b5563" font-size="11">业务代码变更不影响 vendor 缓存</text>
    <rect x="30" y="230" width="400" height="120" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="230" y="256" fill="#0f766e" font-weight="bold" font-size="14">splitChunks 关键参数</text>
    <text x="230" y="276" fill="#4b5563" font-size="11">chunks: 'all' 同时处理同步与异步</text>
    <text x="230" y="293" fill="#4b5563" font-size="11">minSize 小于该值不单独分包</text>
    <text x="230" y="310" fill="#4b5563" font-size="11">maxSize（HTTP/2 场景）控制单包体积</text>
    <text x="230" y="327" fill="#4b5563" font-size="11">cacheGroups 用 test 匹配 node_modules 抽 vendor</text>
    <rect x="450" y="230" width="400" height="120" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="650" y="256" fill="#be123c" font-weight="bold" font-size="14">缓存友好原则</text>
    <text x="650" y="276" fill="#4b5563" font-size="11">业务代码与第三方库分到不同 chunk</text>
    <text x="650" y="293" fill="#4b5563" font-size="11">运行时（runtime）单独一个文件</text>
    <text x="650" y="310" fill="#4b5563" font-size="11">文件名带 contenthash</text>
    <text x="650" y="327" fill="#4b5563" font-size="11">修改业务代码后 vendor 的 hash 应保持不变</text>
</g>
  <text x="440" y="422" text-anchor="middle" font-size="13" fill="#475569">目标：首屏只加载必要代码，且改动一处不导致全量缓存失效</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
