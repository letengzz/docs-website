<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">常见问题速查</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="260" height="130" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="96" fill="#be123c" font-weight="bold" font-size="14">① Cannot find module 'webpack-cli'</text>
    <text x="160" y="116" fill="#4b5563" font-size="11">本地安装 webpack 与 webpack-cli</text>
    <text x="160" y="133" fill="#4b5563" font-size="11">用 npx webpack 而不是全局命令</text>
    <text x="160" y="150" fill="#4b5563" font-size="11">webpack-cli 7 要求 Node 20.9+</text>
    <rect x="320" y="70" width="260" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="96" fill="#b45309" font-weight="bold" font-size="14">② 打包后 Node 内置模块报错</text>
    <text x="450" y="116" fill="#4b5563" font-size="11">Webpack 5 不再自动 polyfill</text>
    <text x="450" y="133" fill="#4b5563" font-size="11">设置 resolve.fallback: { fs: false }</text>
    <text x="450" y="150" fill="#4b5563" font-size="11">或安装对应 polyfill 包</text>
    <rect x="610" y="70" width="240" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="730" y="96" fill="#0e7490" font-weight="bold" font-size="14">③ 构建越来越慢</text>
    <text x="730" y="116" fill="#4b5563" font-size="11">开启 filesystem 缓存</text>
    <text x="730" y="133" fill="#4b5563" font-size="11">缩小 loader 的 include 范围</text>
    <text x="730" y="150" fill="#4b5563" font-size="11">移除未使用插件与 sourcemap</text>
    <rect x="30" y="230" width="260" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="256" fill="#4338ca" font-weight="bold" font-size="14">④ 多个 webpack 副本</text>
    <text x="160" y="276" fill="#4b5563" font-size="11">用 npm ls webpack 查看</text>
    <text x="160" y="293" fill="#4b5563" font-size="11">对齐各依赖的 peer 版本范围</text>
    <text x="160" y="310" fill="#4b5563" font-size="11">必要时用 resolutions / overrides 锁定</text>
    <rect x="320" y="230" width="260" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="450" y="256" fill="#6d28d9" font-weight="bold" font-size="14">⑤ HMR 不生效</text>
    <text x="450" y="276" fill="#4b5563" font-size="11">devServer.hot 开启且入口正确</text>
    <text x="450" y="293" fill="#4b5563" font-size="11">检查 target 是否为 web（不是 node）</text>
    <text x="450" y="310" fill="#4b5563" font-size="11">某些 loader 会破坏模块状态</text>
    <rect x="610" y="230" width="240" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="730" y="256" fill="#047857" font-weight="bold" font-size="14">⑥ 产物 hash 每次都变</text>
    <text x="730" y="276" fill="#4b5563" font-size="11">使用 contenthash 而不是 hash</text>
    <text x="730" y="293" fill="#4b5563" font-size="11">runtimeChunk 单独抽出</text>
    <text x="730" y="310" fill="#4b5563" font-size="11">避免在入口模块里写可变内容</text>
</g>
  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#475569">排查顺序：版本对齐 → 缓存清理（node_modules/.cache） → 配置最小化复现 → 官方文档</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
