<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">实战：生产级配置分层</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="180" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="86" fill="#0e7490" font-weight="bold" font-size="14">vite.config.ts</text>
    <text x="120" y="106" fill="#4b5563" font-size="11">只做装配</text>
    <text x="120" y="123" fill="#4b5563" font-size="11">按 mode 合并</text>
    <rect x="240" y="60" width="200" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="340" y="86" fill="#4338ca" font-weight="bold" font-size="14">config/base.ts</text>
    <text x="340" y="106" fill="#4b5563" font-size="11">通用配置</text>
    <text x="340" y="123" fill="#4b5563" font-size="11">别名 / 插件 / 构建</text>
    <rect x="470" y="60" width="190" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="565" y="86" fill="#047857" font-weight="bold" font-size="14">config/dev.ts</text>
    <text x="565" y="106" fill="#4b5563" font-size="11">开发服务器</text>
    <text x="565" y="123" fill="#4b5563" font-size="11">代理 / HMR</text>
    <rect x="690" y="60" width="160" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="770" y="86" fill="#b45309" font-weight="bold" font-size="14">config/prod.ts</text>
    <text x="770" y="106" fill="#4b5563" font-size="11">压缩 / 分包</text>
    <text x="770" y="123" fill="#4b5563" font-size="11">sourcemap 策略</text>
    <path d="M 210 110 L 238 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 440 110 L 468 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 660 110 L 688 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="200" width="270" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="165" y="226" fill="#6d28d9" font-weight="bold" font-size="14">必须显式确定的项</text>
    <text x="165" y="246" fill="#4b5563" font-size="11">base 与部署路径一致</text>
    <text x="165" y="263" fill="#4b5563" font-size="11">server.proxy 处理跨域（仅开发期）</text>
    <text x="165" y="280" fill="#4b5563" font-size="11">build.outDir / assetsDir</text>
    <text x="165" y="297" fill="#4b5563" font-size="11">resolve.alias 与 tsconfig paths 同步</text>
    <rect x="320" y="200" width="260" height="140" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="450" y="226" fill="#0f766e" font-weight="bold" font-size="14">容易忽略的项</text>
    <text x="450" y="246" fill="#4b5563" font-size="11">build.target 与浏览器支持范围对齐</text>
    <text x="450" y="263" fill="#4b5563" font-size="11">sourcemap 生产环境谨慎开启</text>
    <text x="450" y="280" fill="#4b5563" font-size="11">define 注入的常量必须是可序列化的</text>
    <text x="450" y="297" fill="#4b5563" font-size="11">envPrefix 若非 VITE_ 需显式配置</text>
    <rect x="600" y="200" width="250" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="226" fill="#be123c" font-weight="bold" font-size="14">验证清单</text>
    <text x="725" y="246" fill="#4b5563" font-size="11">pnpm dev 启动无警告</text>
    <text x="725" y="263" fill="#4b5563" font-size="11">pnpm build 零错误、产物 hash 正常</text>
    <text x="725" y="280" fill="#4b5563" font-size="11">pnpm preview 本地验证产物可运行</text>
    <text x="725" y="297" fill="#4b5563" font-size="11">打包体积与上次对比无异常增长</text>
    <rect x="30" y="355" width="820" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="381" fill="#334155" font-weight="bold" font-size="13">原则：配置文件只做装配，具体配置按职责拆到 base / dev / prod 三个文件，避免单文件膨胀到难维护</text>
</g>
  <text x="440" y="434" text-anchor="middle" font-size="13" fill="#475569">构建配置的目标不是「最全」，而是「可解释」——每一条配置都能说出为什么需要它</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
