<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">构建流程与产物</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="160" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="110" y="96" fill="#0e7490" font-weight="bold" font-size="14">① 解析入口</text>
    <text x="110" y="116" fill="#4b5563" font-size="11">index.html</text>
    <text x="110" y="133" fill="#4b5563" font-size="11">扫描 script / link</text>
    <rect x="210" y="70" width="160" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="290" y="96" fill="#4338ca" font-weight="bold" font-size="14">② 转换模块</text>
    <text x="290" y="116" fill="#4b5563" font-size="11">Oxc 编译</text>
    <text x="290" y="133" fill="#4b5563" font-size="11">插件 transform</text>
    <rect x="390" y="70" width="160" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="470" y="96" fill="#6d28d9" font-weight="bold" font-size="14">③ 依赖图</text>
    <text x="470" y="116" fill="#4b5563" font-size="11">模块关系</text>
    <text x="470" y="133" fill="#4b5563" font-size="11">动态导入边界</text>
    <rect x="570" y="70" width="140" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="640" y="96" fill="#047857" font-weight="bold" font-size="14">④ 分包</text>
    <text x="640" y="116" fill="#4b5563" font-size="11">手动 chunk</text>
    <text x="640" y="133" fill="#4b5563" font-size="11">自动 splitVendorChunk</text>
    <rect x="730" y="70" width="120" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="790" y="96" fill="#b45309" font-weight="bold" font-size="14">⑤ 产出</text>
    <text x="790" y="116" fill="#4b5563" font-size="11">dist/</text>
    <path d="M 190 115 L 208 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 370 115 L 388 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 550 115 L 568 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 710 115 L 728 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="200" width="270" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="226" fill="#b45309" font-weight="bold" font-size="14">target 与语法降级</text>
    <text x="165" y="246" fill="#4b5563" font-size="11">build.target 默认 'baseline-widely-available'</text>
    <text x="165" y="263" fill="#4b5563" font-size="11">需要兼容旧浏览器时显式设置 targets</text>
    <text x="165" y="280" fill="#4b5563" font-size="11">降级会增大产物体积，按需开启</text>
    <rect x="320" y="200" width="260" height="140" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="450" y="226" fill="#0f766e" font-weight="bold" font-size="14">典型产物结构</text>
    <text x="450" y="246" fill="#4b5563" font-size="11">dist/index.html</text>
    <text x="450" y="263" fill="#4b5563" font-size="11">dist/assets/[name]-[hash].js</text>
    <text x="450" y="280" fill="#4b5563" font-size="11">dist/assets/[name]-[hash].css</text>
    <text x="450" y="297" fill="#4b5563" font-size="11">hash 用于长期缓存</text>
    <rect x="600" y="200" width="250" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="226" fill="#be123c" font-weight="bold" font-size="14">体积诊断</text>
    <text x="725" y="246" fill="#4b5563" font-size="11">vite build --debug 查看解析细节</text>
    <text x="725" y="263" fill="#4b5563" font-size="11">rollup-plugin-visualizer 生成体积报告</text>
    <text x="725" y="280" fill="#4b5563" font-size="11">关注单个 chunk 是否超过预算</text>
</g>
  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#475569">构建目标：更少请求、更小体积、可长期缓存——hash 文件名让静态资源可以设一年缓存</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
