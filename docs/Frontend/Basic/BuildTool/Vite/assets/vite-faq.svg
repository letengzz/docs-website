<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">常见问题速查</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="260" height="130" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="96" fill="#be123c" font-weight="bold" font-size="14">① 启动报 crypto.hash is not a function</text>
    <text x="160" y="116" fill="#4b5563" font-size="11">根因：Node 版本低于 20.19 / 22.12</text>
    <text x="160" y="133" fill="#4b5563" font-size="11">升级 Node 到受支持版本即可</text>
    <text x="160" y="150" fill="#4b5563" font-size="11">或用 nvm 切换到 22 LTS</text>
    <rect x="320" y="70" width="260" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="96" fill="#b45309" font-weight="bold" font-size="14">② 依赖报错 require is not defined</text>
    <text x="450" y="116" fill="#4b5563" font-size="11">某些依赖只提供 CJS 版本</text>
    <text x="450" y="133" fill="#4b5563" font-size="11">加入 optimizeDeps.include 预构建</text>
    <text x="450" y="150" fill="#4b5563" font-size="11">或找提供 ESM 的替代包</text>
    <rect x="610" y="70" width="240" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="730" y="96" fill="#0e7490" font-weight="bold" font-size="14">③ 别名 @ 不生效</text>
    <text x="730" y="116" fill="#4b5563" font-size="11">resolve.alias 与 tsconfig paths 都要配</text>
    <text x="730" y="133" fill="#4b5563" font-size="11">缺少时补 @types/node</text>
    <text x="730" y="150" fill="#4b5563" font-size="11">注意 __dirname 在 ESM 下需转换</text>
    <rect x="30" y="230" width="260" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="256" fill="#4338ca" font-weight="bold" font-size="14">④ 生产环境白屏 / 资源 404</text>
    <text x="160" y="276" fill="#4b5563" font-size="11">base 与部署子路径不一致</text>
    <text x="160" y="293" fill="#4b5563" font-size="11">history 路由需要服务器 fallback 到 index.html</text>
    <text x="160" y="310" fill="#4b5563" font-size="11">用 pnpm preview 本地复现</text>
    <rect x="320" y="230" width="260" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="450" y="256" fill="#6d28d9" font-weight="bold" font-size="14">⑤ 修改依赖后不生效</text>
    <text x="450" y="276" fill="#4b5563" font-size="11">清缓存：rm -rf node_modules/.vite</text>
    <text x="450" y="293" fill="#4b5563" font-size="11">或运行 vite --force 强制预构建</text>
    <text x="450" y="310" fill="#4b5563" font-size="11">检查 optimizeDeps.exclude 是否误排除</text>
    <rect x="610" y="230" width="240" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="730" y="256" fill="#047857" font-weight="bold" font-size="14">⑥ 环境变量读不到</text>
    <text x="730" y="276" fill="#4b5563" font-size="11">客户端变量必须 VITE_ 前缀</text>
    <text x="730" y="293" fill="#4b5563" font-size="11">改 .env 后需重启 dev server</text>
    <text x="730" y="310" fill="#4b5563" font-size="11">类型声明写在 vite-env.d.ts</text>
</g>
  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#475569">通用排查顺序：Node 版本 → 缓存 → 依赖格式（CJS/ESM） → 路径与 base 配置</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
