<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">环境变量与模式（mode）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="170" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="115" y="96" fill="#0e7490" font-weight="bold" font-size="14">.env</text>
    <text x="115" y="116" fill="#4b5563" font-size="11">所有模式共享</text>
    <text x="115" y="133" fill="#4b5563" font-size="11">VITE_ 前缀才暴露</text>
    <rect x="230" y="70" width="190" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="325" y="96" fill="#4338ca" font-weight="bold" font-size="14">.env.local</text>
    <text x="325" y="116" fill="#4b5563" font-size="11">本地覆盖</text>
    <text x="325" y="133" fill="#4b5563" font-size="11">应加入 .gitignore</text>
    <rect x="450" y="70" width="190" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="545" y="96" fill="#6d28d9" font-weight="bold" font-size="14">.env.[mode]</text>
    <text x="545" y="116" fill="#4b5563" font-size="11">按模式区分</text>
    <text x="545" y="133" fill="#4b5563" font-size="11">如 .env.production</text>
    <rect x="670" y="70" width="180" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="760" y="96" fill="#047857" font-weight="bold" font-size="14">.env.[mode].local</text>
    <text x="760" y="116" fill="#4b5563" font-size="11">最高优先级本地文件</text>
    <text x="440" y="60" text-anchor="middle" fill="#6b7280" font-size="12">优先级从左到右递增 →</text>
    <rect x="30" y="210" width="270" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="236" fill="#b45309" font-weight="bold" font-size="14">内置变量</text>
    <text x="165" y="256" fill="#4b5563" font-size="11">import.meta.env.MODE 当前模式</text>
    <text x="165" y="273" fill="#4b5563" font-size="11">import.meta.env.BASE_URL 基础路径</text>
    <text x="165" y="290" fill="#4b5563" font-size="11">import.meta.env.DEV / PROD 布尔值</text>
    <text x="165" y="307" fill="#4b5563" font-size="11">import.meta.env.SSR 是否 SSR 环境</text>
    <rect x="320" y="210" width="260" height="140" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="450" y="236" fill="#0f766e" font-weight="bold" font-size="14">命令与模式</text>
    <text x="450" y="256" fill="#4b5563" font-size="11">vite dev  → development</text>
    <text x="450" y="273" fill="#4b5563" font-size="11">vite build → production</text>
    <text x="450" y="290" fill="#4b5563" font-size="11">vite build --mode staging → staging</text>
    <text x="450" y="307" fill="#4b5563" font-size="11">加载 .env.staging 与 .env.staging.local</text>
    <rect x="600" y="210" width="250" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="236" fill="#be123c" font-weight="bold" font-size="14">安全红线</text>
    <text x="725" y="256" fill="#4b5563" font-size="11">只有 VITE_ 前缀会注入客户端</text>
    <text x="725" y="273" fill="#4b5563" font-size="11">任何进客户端的变量都是公开的</text>
    <text x="725" y="290" fill="#4b5563" font-size="11">密钥、Token 必须留在服务端</text>
    <text x="725" y="307" fill="#4b5563" font-size="11">不要把 .env 提交到仓库</text>
</g>
  <text x="440" y="402" text-anchor="middle" font-size="13" fill="#475569">口诀：模式决定加载哪个文件；VITE_ 前缀决定它是否会被打进客户端</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
