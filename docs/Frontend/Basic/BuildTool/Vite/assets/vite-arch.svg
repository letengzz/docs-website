<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Vite 架构：开发服务器与构建管线</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="150" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="105" y="86" fill="#0e7490" font-weight="bold" font-size="14">浏览器</text>
    <text x="105" y="106" fill="#4b5563" font-size="11">原生 ESM 请求</text>
    <text x="105" y="123" fill="#4b5563" font-size="11">HMR 客户端</text>
    <rect x="210" y="60" width="210" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="315" y="86" fill="#4338ca" font-weight="bold" font-size="14">Dev Server（开发）</text>
    <text x="315" y="106" fill="#4b5563" font-size="11">按需转换</text>
    <text x="315" y="123" fill="#4b5563" font-size="11">不做整包打包</text>
    <rect x="450" y="60" width="210" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="555" y="86" fill="#6d28d9" font-weight="bold" font-size="14">Plugin Container</text>
    <text x="555" y="106" fill="#4b5563" font-size="11">Rollup 兼容钩子</text>
    <text x="555" y="123" fill="#4b5563" font-size="11">resolve / load / transform</text>
    <rect x="690" y="60" width="160" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="770" y="86" fill="#047857" font-weight="bold" font-size="14">Oxc 编译器</text>
    <text x="770" y="106" fill="#4b5563" font-size="11">TS / JSX 转换</text>
    <text x="770" y="123" fill="#4b5563" font-size="11">语法解析</text>
    <path d="M 180 105 L 208 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 420 105 L 448 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 660 105 L 688 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="190" width="270" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="216" fill="#b45309" font-weight="bold" font-size="14">开发期：No-Bundle</text>
    <text x="165" y="236" fill="#4b5563" font-size="11">启动时不打包，只做依赖预构建</text>
    <text x="165" y="253" fill="#4b5563" font-size="11">浏览器请求哪个模块就转换哪个</text>
    <text x="165" y="270" fill="#4b5563" font-size="11">项目越大，启动优势越明显</text>
    <rect x="320" y="190" width="260" height="130" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="450" y="216" fill="#0f766e" font-weight="bold" font-size="14">生产：Rolldown 打包</text>
    <text x="450" y="236" fill="#4b5563" font-size="11">Rust 实现，兼容 Rollup 插件 API</text>
    <text x="450" y="253" fill="#4b5563" font-size="11">统一 dev 与 prod 的解析/转换/压缩</text>
    <text x="450" y="270" fill="#4b5563" font-size="11">Vite 8 起取代 esbuild + Rollup 双引擎</text>
    <rect x="600" y="190" width="250" height="130" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="216" fill="#be123c" font-weight="bold" font-size="14">HMR 与 Devtools</text>
    <text x="725" y="236" fill="#4b5563" font-size="11">模块级热替换，保留应用状态</text>
    <text x="725" y="253" fill="#4b5563" font-size="11">devtools 选项开启可视化调试</text>
    <text x="725" y="270" fill="#4b5563" font-size="11">forwardConsole 把浏览器日志转到终端</text>
    <rect x="30" y="345" width="820" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="371" fill="#334155" font-weight="bold" font-size="13">关键取舍：开发期靠浏览器原生 ESM 换启动速度；生产期仍输出高度优化的静态资源，两者行为由同一套插件保证一致</text>
</g>
  <text x="440" y="442" text-anchor="middle" font-size="13" fill="#475569">Vite = 开发期按需编译 + 生产期 Rust 打包，用一套插件 API 统一两条路径</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
