<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="rd-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .stage { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .final { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 10; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
  </style>

  <rect class="stage" x="20" y="90" width="110" height="50"/>
  <text x="75" y="110">HTML → DOM</text>
  <text class="small" x="75" y="126">CSS → CSSOM</text>

  <line x1="130" y1="115" x2="165" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rd-arrow)"/>

  <rect class="stage" x="165" y="90" width="110" height="50"/>
  <text x="220" y="115">渲染树</text>

  <line x1="275" y1="115" x2="310" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rd-arrow)"/>

  <rect class="stage" x="310" y="90" width="110" height="50"/>
  <text x="365" y="115">布局 Layout</text>

  <line x1="420" y1="115" x2="455" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rd-arrow)"/>

  <rect class="stage" x="455" y="90" width="110" height="50"/>
  <text x="510" y="115">绘制 Paint</text>

  <line x1="565" y1="115" x2="600" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rd-arrow)"/>

  <rect class="stage" x="600" y="90" width="110" height="50"/>
  <text x="655" y="115">合成 Composite</text>

  <line x1="655" y1="140" x2="655" y2="180" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#rd-arrow)"/>

  <rect class="final" x="600" y="180" width="110" height="44"/>
  <text x="655" y="206">屏幕像素</text>

  <text class="small" x="365" y="180">触发链</text>
  <text class="small" x="365" y="198">改尺寸 → 重排 + 重绘</text>
  <text class="small" x="365" y="216">改颜色 → 重绘</text>
  <text class="small" x="365" y="234">transform/opacity → 只合成（最省）</text>

  <text class="small" x="365" y="260">优化：class 批量改、动画用 transform、读写分离避免强制同步布局</text>
</svg>
