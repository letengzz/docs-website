<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="200" height="70"/>
  <text x="140" y="92">卡片组件需求</text>
  <text class="small" x="140" y="112">不同容器宽度自适应</text>

  <rect class="mid" x="310" y="60" width="240" height="70"/>
  <text x="430" y="92">实现组合拳</text>
  <text class="small" x="430" y="112">Grid + 容器查询 + clamp()</text>

  <rect class="out" x="620" y="60" width="200" height="70"/>
  <text x="720" y="92">验证与调优</text>
  <text class="small" x="720" y="112">DevTools 响应式 + Lighthouse</text>

  <line x1="240" y1="95" x2="310" y2="95" marker-end="url(#pr-arrow)"/>
  <line x1="550" y1="95" x2="620" y2="95" marker-end="url(#pr-arrow)"/>

  <rect class="out" x="310" y="200" width="240" height="54"/>
  <text x="430" y="228">卡片在不同区域自动重排</text>
  <text class="small" x="430" y="246">无需媒体查询监听视口</text>

  <line x1="430" y1="130" x2="430" y2="200" marker-end="url(#pr-arrow)"/>

  <text class="small" x="430" y="295">目标：一个组件、一套样式、处处适配</text>
</svg>
