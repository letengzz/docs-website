<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cq-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .container { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .child { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .note { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
  </style>

  <rect class="container" x="40" y="50" width="300" height="150"/>
  <text x="190" y="80">容器（container-type: inline-size）</text>
  <rect class="child" x="70" y="110" width="90" height="60"/>
  <text x="115" y="146">卡片 A</text>
  <rect class="child" x="190" y="110" width="120" height="60"/>
  <text x="250" y="146">卡片 B</text>

  <rect class="container" x="480" y="50" width="320" height="150"/>
  <text x="640" y="80">另一个容器（宽度不同）</text>
  <rect class="child" x="520" y="110" width="120" height="60"/>
  <text x="580" y="146">卡片 C</text>
  <rect class="child" x="660" y="110" width="110" height="60"/>
  <text x="715" y="146">卡片 D</text>

  <rect class="note" x="150" y="240" width="540" height="60"/>
  <text x="420" y="268">@container (min-width: 300px) { ... }</text>
  <text class="small" x="420" y="288">按「自身容器宽度」响应，而不是视口宽度</text>

  <text class="small" x="420" y="330">应用：可复用组件（侧边栏/主区域里的同一卡片按容器宽度自适应）</text>
</svg>
