<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="gr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .area { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 6; }
    .label { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .note { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
  </style>

  <rect class="label" x="30" y="30" width="220" height="50"/>
  <text x="140" y="60">CSS Grid 容器</text>

  <rect class="area" x="300" y="20" width="120" height="60"/>
  <text x="360" y="54">header</text>
  <rect class="area" x="300" y="90" width="120" height="120"/>
  <text x="360" y="154">sidebar</text>
  <rect class="area" x="430" y="90" width="180" height="120"/>
  <text x="520" y="154">main</text>
  <rect class="area" x="300" y="220" width="310" height="60"/>
  <text x="455" y="254">footer</text>

  <line x1="250" y1="55" x2="300" y2="55" stroke="#4a7bd8" stroke-width="1.4" marker-end="url(#gr-arrow)"/>

  <rect class="note" x="660" y="60" width="150" height="130"/>
  <text x="735" y="90">grid-template-areas</text>
  <text class="small" x="735" y="115">"header header"</text>
  <text class="small" x="735" y="135">"sidebar main"</text>
  <text class="small" x="735" y="155">"footer footer"</text>

  <rect class="note" x="30" y="140" width="220" height="90"/>
  <text x="140" y="168">核心属性</text>
  <text class="small" x="140" y="192">grid-template-columns / rows</text>
  <text class="small" x="140" y="210">fr 单位 / repeat() / gap</text>

  <text class="small" x="420" y="330">对比 Flex：Flex 是一维布局，Grid 是二维布局（行 + 列同时控制）</text>
  <text class="small" x="420" y="350">应用：页面骨架、卡片网格、仪表盘、商品列表</text>
</svg>
