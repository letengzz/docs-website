<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .input { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .cond { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .true { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    .false { fill: #fdeeee; stroke: #d33; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="input" x="250" y="20" width="220" height="46"/>
  <text x="360" y="47">type Result&lt;T&gt; = T extends U ? X : Y</text>

  <line x1="360" y1="66" x2="360" y2="100" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#cf-arrow)"/>

  <rect class="cond" x="250" y="100" width="220" height="46"/>
  <text x="360" y="127">T 是否可赋值给 U？</text>

  <line x1="250" y1="123" x2="150" y2="170" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#cf-arrow)"/>
  <line x1="470" y1="123" x2="570" y2="170" stroke="#d33" stroke-width="1.5" marker-end="url(#cf-arrow)"/>

  <rect class="true" x="50" y="170" width="200" height="56"/>
  <text x="150" y="192">true 分支 → X</text>
  <text class="small" x="150" y="212">可以包含 infer 提取</text>

  <rect class="false" x="470" y="170" width="200" height="56"/>
  <text x="570" y="192">false 分支 → Y</text>
  <text class="small" x="570" y="212">通常是 never 或兜底类型</text>

  <line x1="360" y1="146" x2="360" y2="260" stroke="#4a7bd8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cf-arrow)"/>
  <rect class="cond" x="250" y="260" width="220" height="32"/>
  <text x="360" y="281">裸类型参数 → 对联合类型分发</text>

  <text class="small" x="360" y="295">infer 只能在 extends 右侧的模式中出现</text>
</svg>
