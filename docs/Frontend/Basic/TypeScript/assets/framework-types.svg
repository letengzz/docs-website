<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ft-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .core { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .frame { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .check { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="core" x="260" y="20" width="200" height="50"/>
  <text x="360" y="42">TypeScript</text>
  <text class="small" x="360" y="60">props / 状态 / 事件 / API 全链路类型</text>

  <line x1="300" y1="70" x2="170" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ft-arrow)"/>
  <line x1="420" y1="70" x2="550" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ft-arrow)"/>

  <rect class="frame" x="60" y="115" width="220" height="80"/>
  <text x="170" y="140">Vue 3</text>
  <text class="small" x="170" y="162">defineProps&lt;T&gt; / withDefaults</text>
  <text class="small" x="170" y="180">ref / reactive / computed 推断</text>

  <rect class="frame" x="440" y="115" width="220" height="80"/>
  <text x="550" y="140">React</text>
  <text class="small" x="550" y="162">Props 接口 / useState 泛型</text>
  <text class="small" x="550" y="180">事件类型 / 泛型组件</text>

  <line x1="170" y1="195" x2="170" y2="230" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ft-arrow)"/>
  <line x1="550" y1="195" x2="550" y2="230" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ft-arrow)"/>

  <rect class="check" x="70" y="230" width="200" height="46"/>
  <text x="170" y="252">vue-tsc --noEmit</text>
  <text class="small" x="170" y="268">检查 script + template</text>

  <rect class="check" x="450" y="230" width="200" height="46"/>
  <text x="550" y="252">tsc --noEmit</text>
  <text class="small" x="550" y="268">检查 TSX 组件</text>

  <text class="small" x="360" y="295">API 数据用 ApiResponse&lt;T&gt; 建模，前端全程类型安全</text>
</svg>
