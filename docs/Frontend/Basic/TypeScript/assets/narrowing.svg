<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="nw-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6fd8"/>
    </marker>
  </defs>
  <style>
    .start { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .check { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .end { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="start" x="240" y="20" width="240" height="46"/>
  <text x="360" y="47">value: string | number | null</text>

  <line x1="360" y1="66" x2="360" y2="100" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#nw-arrow)"/>

  <rect class="check" x="240" y="100" width="240" height="46"/>
  <text x="360" y="127">value === null ?</text>

  <line x1="240" y1="123" x2="150" y2="170" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#nw-arrow)"/>
  <line x1="480" y1="123" x2="570" y2="170" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#nw-arrow)"/>

  <rect class="end" x="50" y="170" width="200" height="46"/>
  <text x="150" y="197">null：提前返回/兜底</text>

  <rect class="check" x="470" y="170" width="200" height="46"/>
  <text x="570" y="197">typeof value === "string" ?</text>

  <line x1="570" y1="216" x2="570" y2="250" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#nw-arrow)"/>
  <line x1="470" y1="193" x2="340" y2="250" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#nw-arrow)"/>

  <rect class="end" x="470" y="250" width="200" height="40"/>
  <text x="570" y="275">string 分支</text>

  <rect class="end" x="240" y="250" width="200" height="40"/>
  <text x="340" y="275">number 分支</text>

  <text class="small" x="360" y="295">编译器在每个分支自动收窄；复杂逻辑用自定义守卫 value is T</text>
</svg>
