<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="tc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .core { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .item { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="core" x="260" y="20" width="200" height="50"/>
  <text x="360" y="42">tsconfig.json</text>
  <text class="small" x="360" y="60">全项目的类型与编译约定</text>

  <line x1="280" y1="70" x2="150" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#tc-arrow)"/>
  <line x1="360" y1="70" x2="360" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#tc-arrow)"/>
  <line x1="440" y1="70" x2="570" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#tc-arrow)"/>

  <rect class="item" x="50" y="115" width="200" height="56"/>
  <text x="150" y="137">严格程度</text>
  <text class="small" x="150" y="157">strict / noImplicitAny</text>
  <text class="small" x="150" y="170">strictNullChecks</text>

  <rect class="item" x="260" y="115" width="200" height="56"/>
  <text x="360" y="137">编译目标</text>
  <text class="small" x="360" y="157">target / module</text>
  <text class="small" x="360" y="170">moduleResolution</text>

  <rect class="item" x="470" y="115" width="200" height="56"/>
  <text x="570" y="137">工程映射</text>
  <text class="small" x="570" y="157">paths 别名</text>
  <text class="small" x="570" y="170">项目引用 references</text>

  <rect class="item" x="160" y="210" width="400" height="56"/>
  <text x="360" y="232">类型检查与构建分离</text>
  <text class="small" x="360" y="252">tsc --noEmit 只管类型，Vite/Webpack 负责编译</text>
  <text class="small" x="360" y="266">Vue 用 vue-tsc，React 用 tsc</text>

  <text class="small" x="360" y="290">好配置 = 严格 + 可增量 + 与构建工具对齐</text>
</svg>
