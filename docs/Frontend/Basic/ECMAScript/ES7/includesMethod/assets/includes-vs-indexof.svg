<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">includes 与 indexOf 的核心差异：NaN</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">查询目标：arr = [1, NaN, 3]，问数组里有没有 NaN</text>

  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="300" y="78" width="90" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="345" y="108" fill="#334155">1</text>
    <rect x="395" y="78" width="90" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="440" y="108" fill="#b91c1c">NaN</text>
    <rect x="490" y="78" width="90" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="535" y="108" fill="#334155">3</text>
  </g>
  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="345" y="140">0</text>
    <text x="440" y="140">1</text>
    <text x="535" y="140">2</text>
  </g>

  <rect x="70" y="162" width="340" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="240" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">includes(NaN)</text>
  <text x="240" y="218" text-anchor="middle" font-size="13" fill="#4b5563">比较算法：SameValueZero</text>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#4b5563">NaN 被视为「等于自身」</text>
  <text x="240" y="282" text-anchor="middle" font-size="26" font-weight="bold" fill="#059669">true</text>

  <rect x="470" y="162" width="340" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="640" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#be123c">indexOf(NaN)</text>
  <text x="640" y="218" text-anchor="middle" font-size="13" fill="#4b5563">比较算法：严格相等 ===</text>
  <text x="640" y="240" text-anchor="middle" font-size="13" fill="#4b5563">NaN === NaN 恒为 false</text>
  <text x="640" y="282" text-anchor="middle" font-size="26" font-weight="bold" fill="#e11d48">-1</text>

  <rect x="70" y="322" width="740" height="78" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">结论：写存在性判断（if 分支 / 去重 / 权限校验）一律用 includes</text>
  <text x="440" y="374" text-anchor="middle" font-size="12" fill="#64748b">用 indexOf(x) !== -1 判断时 NaN 会被误判为「不存在」，进而产生重复插入等静默 bug</text>
  <text x="440" y="393" text-anchor="middle" font-size="11" fill="#94a3b8">另有稀疏数组差异：includes 把空洞当 undefined（能找到），indexOf 跳过空洞（找不到）</text>
</svg>
