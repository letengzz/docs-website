<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">生成列 → 原始列：一次可复跑的还原</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">esbuild 0.21.5 打包 3 个源文件 → 318 B 产物 + 1,364 B map → Chrome 155 报错 → 自写 VLQ 解码</text>

<rect x="28" y="78" width="280" height="120" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="40" y="99" font-size="12.5" font-weight="700" fill="#1f2d3d">① 压缩产物（1 行，318 B）</text>
<text x="40" y="120" font-size="11" font-family="Menlo,monospace" fill="#2b5c8a">app.min.js:1:147 → o()</text>
<text x="40" y="140" font-size="11" fill="#5a6b7b">函数名被压缩成 o / t / e</text>
<text x="40" y="157" font-size="11" fill="#5a6b7b">栈顶 = Error 构造位置</text>
<text x="40" y="174" font-size="11" fill="#5a6b7b">mappings：70 段 / 3 个源文件</text>
<text x="40" y="191" font-size="11" fill="#b5432f">map 比产物大 4.3 倍</text>

<rect x="340" y="78" width="290" height="120" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="352" y="99" font-size="12.5" font-weight="700" fill="#1f2d3d">② 栈顶还原（正确）</text>
<text x="352" y="120" font-size="11" font-family="Menlo,monospace" fill="#2f8f7d">1:147 → src/cart.js:5:11</text>
<text x="352" y="140" font-size="11" fill="#5a6b7b">那一行：</text>
<text x="352" y="158" font-size="11" font-family="Menlo,monospace" fill="#1f2d3d">throw new Error("item is required")</text>
<text x="352" y="178" font-size="11" fill="#2f8f7d">这才是真正的抛出点</text>
<text x="352" y="194" font-size="11" fill="#5a6b7b">函数名同时被 names 表恢复</text>

<rect x="662" y="78" width="270" height="120" rx="8" fill="#fbeae6" stroke="#b5432f" stroke-width="1.4"/>
<text x="674" y="99" font-size="12.5" font-weight="700" fill="#1f2d3d">③ colno 还原（错的行）</text>
<text x="674" y="120" font-size="11" font-family="Menlo,monospace" fill="#b5432f">1:269 → src/main.js:3:42</text>
<text x="674" y="140" font-size="11" fill="#5a6b7b">那一行：</text>
<text x="674" y="158" font-size="11" font-family="Menlo,monospace" fill="#1f2d3d">catch (e) { throw e; }</text>
<text x="674" y="178" font-size="11" fill="#b5432f">这是最后一次 rethrow</text>
<text x="674" y="194" font-size="11" fill="#b5432f">差 122 列，跨了文件</text>

<g stroke="#5a6b7b" stroke-width="1.2" marker-end="url(#a4)">
  <line x1="308" y1="138" x2="334" y2="138"/>
  <line x1="630" y1="138" x2="656" y2="138"/>
</g>

<rect x="28" y="214" width="446" height="86" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="40" y="236" font-size="12.5" font-weight="700" fill="#1f2d3d">四个字段必须同一套版本</text>
<text x="40" y="257" font-size="11.5" fill="#5a6b7b">构建注入 / 上传参数 / 事件字段 / 查询 key 全部用 APP_RELEASE</text>
<text x="40" y="276" font-size="11.5" fill="#5a6b7b">推荐：git 短哈希 + 构建时间戳，例如 9f2c1a-202610230200</text>
<text x="40" y="295" font-size="11.5" fill="#c2703a">顺序：构建 → 上传 map → 冒烟还原 → 切流</text>

<rect x="492" y="214" width="440" height="86" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="504" y="236" font-size="12.5" font-weight="700" fill="#1f2d3d">列号两个坑</text>
<text x="504" y="257" font-size="11.5" fill="#5a6b7b">originalPositionFor 的 column 是 0-based，浏览器给的是 1-based → 必须 -1</text>
<text x="504" y="276" font-size="11.5" fill="#5a6b7b">还原失败要标 unresolved，不要拿压缩位置冒充源码位置</text>
<text x="504" y="295" font-size="11.5" fill="#5a6b7b">UI 上「未还原」比「看起来像源码的错行号」诚实得多</text>

<rect x="28" y="316" width="904" height="96" rx="8" fill="#efecf7" stroke="#5b4a8a" stroke-width="1.4"/>
<text x="40" y="338" font-size="12.5" font-weight="700" fill="#1f2d3d">四种产出策略：安全性与还原能力的取舍</text>
<text x="40" y="359" font-size="11.5" fill="#5a6b7b">inline（map 内嵌）→ 泄漏最严重；external + 注释（默认）→ 可被 curl 下载，仍泄漏；hidden（无注释、不部署）→ 推荐；不生成 → 无法还原</text>
<text x="40" y="378" font-size="11.5" fill="#5a6b7b">CI 三道门禁：产物里 grep 不到 sourceMappingURL；冒烟还原命中 src/cart.js:5:11；事件 release 与上传 release 相等</text>
<text x="40" y="397" font-size="11.5" fill="#5b4a8a">取舍：压缩保留函数名（keep-names）能让栈可读，体积代价约 1%~3%</text>
</svg>
