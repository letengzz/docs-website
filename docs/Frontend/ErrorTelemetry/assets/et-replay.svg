<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="410" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">重放不是录像：快照 + 增量，出错才上传</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">一条时间轴说明体积从哪来，一条分档说明隐私怎么保</text>

<line x1="60" y1="120" x2="900" y2="120" stroke="#c3ccd6" stroke-width="1.2"/>
<circle cx="90" cy="120" r="7" fill="#2b5c8a"/>
<text x="72" y="102" font-size="11" font-weight="700" fill="#2b5c8a">FullSnapshot</text>
<text x="60" y="145" font-size="11" fill="#5a6b7b">≈ 节点数 × 80~200 B</text>
<text x="60" y="162" font-size="11" fill="#b5432f">大头在这里</text>

<g fill="#2f8f7d">
  <circle cx="220" cy="120" r="5"/><circle cx="290" cy="120" r="4"/><circle cx="350" cy="120" r="5"/>
  <circle cx="430" cy="120" r="4"/><circle cx="500" cy="120" r="5"/><circle cx="570" cy="120" r="4"/>
</g>
<text x="200" y="102" font-size="11" font-weight="700" fill="#2f8f7d">IncrementalSnapshot × N</text>
<text x="200" y="145" font-size="11" fill="#5a6b7b">mutation / mousemove / scroll / input</text>
<text x="200" y="162" font-size="11" fill="#5a6b7b">≈ 60~150 B / 条，与变动频率成正比</text>

<circle cx="650" cy="120" r="9" fill="none" stroke="#b5432f" stroke-width="3"/>
<text x="622" y="102" font-size="11" font-weight="700" fill="#b5432f">错误发生</text>
<line x1="560" y1="120" x2="645" y2="120" stroke="#b5432f" stroke-width="2" stroke-dasharray="4 3"/>
<text x="520" y="145" font-size="11" fill="#b5432f">只把最近 60 秒截出来上传</text>

<rect x="668" y="96" width="232" height="48" rx="6" fill="#fbeae6" stroke="#b5432f" stroke-width="1.2"/>
<text x="680" y="116" font-size="11" fill="#1f2d3d">replay_id + replay_offset_ms</text>
<text x="680" y="134" font-size="11" fill="#5a6b7b">偏移相对「本段起点」，不是会话起点</text>

<rect x="28" y="190" width="440" height="96" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="40" y="212" font-size="12.5" font-weight="700" fill="#1f2d3d">三档脱敏</text>
<text x="40" y="233" font-size="11.5" fill="#5a6b7b">maskAllInputs：输入值一律打码（默认开）</text>
<text x="40" y="252" font-size="11.5" fill="#5a6b7b">maskTextSelector：按业务标注打码文本节点</text>
<text x="40" y="271" font-size="11.5" fill="#5a6b7b">blockSelector：整块不录（支付 / 证件 / 聊天）</text>

<rect x="492" y="190" width="440" height="96" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="504" y="212" font-size="12.5" font-weight="700" fill="#1f2d3d">客户端脱敏覆盖不到的四处</text>
<text x="504" y="233" font-size="11.5" fill="#5a6b7b">placeholder 里的用户信息 / title 与 aria-label</text>
<text x="504" y="252" font-size="11.5" fill="#5a6b7b">框架渲染到文本节点的手机号 / 图片 URL 里的签名</text>
<text x="504" y="271" font-size="11.5" fill="#c2703a">所以服务端必须再跑一遍正则脱敏并计数</text>

<rect x="28" y="302" width="904" height="86" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="324" font-size="12.5" font-weight="700" fill="#1f2d3d">体积预算：三个必须测的读数（用页面里的 30 秒测量脚本）</text>
<text x="40" y="345" font-size="11.5" fill="#5a6b7b">首次快照 &lt; 200 KB　|　单条最大 &lt; 60 KB　|　30 秒总字节 &lt; 100 KB</text>
<text x="40" y="364" font-size="11.5" fill="#5a6b7b">超标对策：blockSelector 掉大表格 / 长列表；ignoreClass 掉轮播与动画；recordCanvas 默认关闭</text>
<text x="40" y="381" font-size="11.5" fill="#b5432f">64 KiB 额度下一次快照就可能超限 → 重放必须独立接口、独立配额、独立采样</text>
</svg>
