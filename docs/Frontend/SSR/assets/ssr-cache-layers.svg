<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">SSR 的四层缓存与缓存键</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">自下而上收益放大，风险也放大</text>
  <rect x="60" y="78" width="640" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="110" y="106" font-size="9.5" fill="#3730A3" font-weight="bold">① 浏览器 HTTP 缓存</text>
  <text x="300" y="106" font-size="8" fill="#4338CA">静态资源 / 可缓存 HTML　·　失效：内容哈希 + Cache-Control</text>
  <rect x="60" y="132" width="640" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="160" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 共享缓存（CDN / 边缘）</text>
  <text x="340" y="160" font-size="8" fill="#1D4ED8">整页 HTML / API 响应　·　失效：s-maxage + 主动 purge</text>
  <rect x="60" y="186" width="640" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="110" y="214" font-size="9.5" fill="#115E59" font-weight="bold">③ SSR 层缓存</text>
  <text x="270" y="214" font-size="8" fill="#0F766E">渲染结果（字符串 / 流片段）　·　失效：键控失效 + TTL</text>
  <rect x="60" y="240" width="640" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="110" y="268" font-size="9.5" fill="#065F46" font-weight="bold">④ 数据层缓存</text>
  <text x="270" y="268" font-size="8" fill="#047857">数据库 / 下游接口结果　·　失效：业务事件 + TTL（最安全）</text>
  <rect x="60" y="300" width="310" height="82" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="215" y="322" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">缓存键的四个维度</text>
  <text x="80" y="342" font-size="8" fill="#B45309">URL（总是） · 语言/地区 · 设备/端 · 登录态/租户</text>
  <text x="80" y="360" font-size="8" fill="#B45309">漏掉身份维度 = A 用户看到 B 用户的数据</text>
  <text x="80" y="376" font-size="8" fill="#92400E">查询参数顺序不同会分裂缓存键，命中率腰斩</text>
  <rect x="390" y="300" width="310" height="82" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="545" y="322" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">三条硬规则</text>
  <text x="410" y="342" font-size="8" fill="#B91C1C">个性化响应必须 private / no-store</text>
  <text x="410" y="360" font-size="8" fill="#B91C1C">错误响应不得长缓存（故障恢复后仍见错误页）</text>
  <text x="410" y="376" font-size="8" fill="#B91C1C">no-cache ≠ 不缓存（是「每次校验」）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
