<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>富文本编辑器工程：从输入到持久化的六段链路</title>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">从一次按键到一条记录：六段链路与三条旁路</text>

  <!-- 主链路 -->
  <rect x="40" y="62" width="130" height="96" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="105" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">① 输入</text>
  <text x="105" y="110" text-anchor="middle" font-size="11" fill="#334155">keydown</text>
  <text x="105" y="128" text-anchor="middle" font-size="11" fill="#334155">beforeinput</text>
  <text x="105" y="146" text-anchor="middle" font-size="11" fill="#64748B">IME 组合期</text>

  <rect x="188" y="62" width="130" height="96" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="253" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D28D9">② 选区</text>
  <text x="253" y="110" text-anchor="middle" font-size="11" fill="#334155">DOM Range</text>
  <text x="253" y="128" text-anchor="middle" font-size="11" fill="#334155">模型位置 {from,to}</text>
  <text x="253" y="146" text-anchor="middle" font-size="11" fill="#64748B">光标复位</text>

  <rect x="336" y="62" width="130" height="96" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="401" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#C2410C">③ 事务</text>
  <text x="401" y="110" text-anchor="middle" font-size="11" fill="#334155">命令 → 步骤</text>
  <text x="401" y="128" text-anchor="middle" font-size="11" fill="#334155">可逆 · 可合并</text>
  <text x="401" y="146" text-anchor="middle" font-size="11" fill="#64748B">撤销的粒度</text>

  <rect x="484" y="62" width="130" height="96" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="549" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">④ 文档模型</text>
  <text x="549" y="110" text-anchor="middle" font-size="11" fill="#334155">schema 约束</text>
  <text x="549" y="128" text-anchor="middle" font-size="11" fill="#334155">唯一可信数据源</text>
  <text x="549" y="146" text-anchor="middle" font-size="11" fill="#64748B">可单测、可协同</text>

  <rect x="632" y="62" width="110" height="96" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="687" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#BE185D">⑤ 序列化</text>
  <text x="687" y="110" text-anchor="middle" font-size="11" fill="#334155">JSON 为主</text>
  <text x="687" y="128" text-anchor="middle" font-size="11" fill="#334155">HTML 缓存</text>
  <text x="687" y="146" text-anchor="middle" font-size="11" fill="#64748B">往返要测</text>

  <rect x="760" y="62" width="100" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="810" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">⑥ 落库</text>
  <text x="810" y="110" text-anchor="middle" font-size="11" fill="#334155">jsonb</text>
  <text x="810" y="128" text-anchor="middle" font-size="11" fill="#334155">纯文本列</text>
  <text x="810" y="146" text-anchor="middle" font-size="11" fill="#64748B">schema_version</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <path d="M170 110 L186 110" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M318 110 L334 110" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M466 110 L482 110" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M614 110 L630 110" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M742 110 L758 110" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 三条旁路 -->
  <rect x="40" y="196" width="270" height="112" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="60" y="222" font-size="14" font-weight="bold" fill="#B91C1C">旁路 A：粘贴 / 拖拽</text>
  <text x="60" y="246" font-size="11" fill="#334155">五步管线：解析 → 白名单 → 模型化</text>
  <text x="60" y="264" font-size="11" fill="#334155">→ 重写 ID → 落库</text>
  <text x="60" y="288" font-size="11" fill="#7F1D1D">绕开①直接进入④；拖拽不走 paste 事件</text>

  <rect x="330" y="196" width="250" height="112" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="350" y="222" font-size="14" font-weight="bold" fill="#1D4ED8">旁路 B：协同</text>
  <text x="350" y="246" font-size="11" fill="#334155">模型 ↔ CRDT 类型</text>
  <text x="350" y="264" font-size="11" fill="#334155">origin 标记防回环</text>
  <text x="350" y="288" font-size="11" fill="#1E40AF">撤销只能撤自己：trackedOrigins</text>

  <rect x="600" y="196" width="260" height="112" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="620" y="222" font-size="14" font-weight="bold" fill="#6D28D9">旁路 C：程序化装载</text>
  <text x="620" y="246" font-size="11" fill="#334155">加载历史 / 协同补拉 / 导入</text>
  <text x="620" y="264" font-size="11" fill="#334155">标记 addToHistory: false</text>
  <text x="620" y="288" font-size="11" fill="#5B21B6">否则进页面就能撤销到空白</text>

  <!-- 底栏：四条不变量 -->
  <rect x="40" y="336" width="820" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="450" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">四条不变量：模型合法 · 视图一致 · 光标稳定 · 内容可信</text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="#475569">前两条靠架构（受控模型），后两条靠细节（IME 状态机、白名单 + 服务端二次校验）</text>

  <rect x="40" y="432" width="820" height="98" rx="10" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="60" y="458" font-size="13" font-weight="bold" fill="#92400E">本专题九族判据（共 71 条）</text>
  <text x="60" y="482" font-size="12" fill="#78350F">RTE 概述 · DOC 文档模型 · SEL 选区输入法 · PST 粘贴清洗 · CMD 命令栈</text>
  <text x="60" y="504" font-size="12" fill="#78350F">SER 序列化 · COL 协同接入 · RCH 实战 · EDQ 常见问题</text>
  <text x="60" y="522" font-size="11" fill="#A16207">每条只回答三件事：约定是什么 / 定错了会怎样 / 怎么验证没被破坏</text>
</svg>
