<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <title>粘贴的五步清洗管线：解析、白名单、模型化、重写、落库</title>
  <rect width="900" height="540" fill="#FFFFFF"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">粘贴的五步管线：每一步扔掉什么</text>

  <!-- 入口 -->
  <rect x="40" y="58" width="180" height="70" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="130" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#B91C1C">不可信输入</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#7F1D1D">text/html + text/plain</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#7F1D1D">paste / drop 两条入口</text>

  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <path d="M220 93 L244 93" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 步骤 1 -->
  <rect x="248" y="46" width="180" height="94" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="338" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">① 选可信来源</text>
  <text x="338" y="92" text-anchor="middle" font-size="11" fill="#334155">有 html 用 html</text>
  <text x="338" y="110" text-anchor="middle" font-size="11" fill="#334155">否则回退纯文本</text>
  <text x="338" y="130" text-anchor="middle" font-size="11" fill="#64748B">丢：text/rtf（不解析）</text>

  <path d="M428 93 L452 93" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 步骤 2 -->
  <rect x="456" y="46" width="180" height="94" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="546" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#6D28D9">② 惰性解析</text>
  <text x="546" y="92" text-anchor="middle" font-size="11" fill="#334155">new DOMParser()</text>
  <text x="546" y="110" text-anchor="middle" font-size="11" fill="#334155">不加载资源、不执行脚本</text>
  <text x="546" y="130" text-anchor="middle" font-size="11" fill="#64748B">丢：不插入当前文档</text>

  <path d="M636 93 L660 93" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 步骤 3 -->
  <rect x="664" y="46" width="196" height="94" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="762" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">③ 白名单重建</text>
  <text x="762" y="92" text-anchor="middle" font-size="11" fill="#334155">允许什么 → 建什么</text>
  <text x="762" y="110" text-anchor="middle" font-size="11" fill="#334155">未知标签保留子节点</text>
  <text x="762" y="130" text-anchor="middle" font-size="11" fill="#64748B">丢：style / on* / class</text>

  <!-- 步骤 4 -->
  <rect x="456" y="180" width="404" height="94" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="658" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2410C">④ 过 schema（结构第二道闸）</text>
  <text x="658" y="226" text-anchor="middle" font-size="11" fill="#334155">PMParser.fromSchema(schema).parse()</text>
  <text x="658" y="244" text-anchor="middle" font-size="11" fill="#334155">标签名合法 ≠ 嵌套合法</text>
  <text x="658" y="264" text-anchor="middle" font-size="11" fill="#7C2D12">丢：非法嵌套（&lt;p&gt; 套 &lt;p&gt;、表格里的裸文本）</text>

  <path d="M762 140 C762 168 700 168 658 178" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 步骤 5 -->
  <rect x="40" y="180" width="380" height="94" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="230" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#BE185D">⑤ 重写不稳定字段</text>
  <text x="230" y="226" text-anchor="middle" font-size="11" fill="#334155">块 ID 重新生成（uuidv7）</text>
  <text x="230" y="244" text-anchor="middle" font-size="11" fill="#334155">附件改 attachmentId，不落 url</text>
  <text x="230" y="264" text-anchor="middle" font-size="11" fill="#9D174D">丢：旧 ID（否则复制两次同一锚点）</text>

  <path d="M456 227 L424 227" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- 落库 -->
  <rect x="40" y="306" width="820" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="62" y="332" font-size="14" font-weight="bold" fill="#334155">落库：JSON（唯一可信） + 纯文本（检索） + HTML（缓存）</text>
  <text x="62" y="356" font-size="12" fill="#475569">服务端用同一份 schema 再校验一次结构与属性白名单 —— 前端防线一定会被绕过</text>
  <text x="62" y="374" font-size="11" fill="#64748B">展示端渲染时仍走白名单：历史数据可能是漏洞期写入的</text>

  <path d="M230 274 L230 304" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>
  <path d="M658 274 L658 304" stroke="#94A3B8" stroke-width="2" marker-end="url(#p1)"/>

  <!-- CVE -->
  <rect x="40" y="404" width="820" height="112" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="62" y="430" font-size="14" font-weight="bold" fill="#B91C1C">CVE-2026-104847：成熟库也会在粘贴路径上出错</text>
  <text x="62" y="454" font-size="12" fill="#7F1D1D">prosemirror-view &lt; 1.42.3：粘贴时 clipboard slice 的 context 属性未过 schema 属性校验，可构造出执行脚本的内容</text>
  <text x="62" y="476" font-size="12" fill="#7F1D1D">修复：升级到 1.42.3+（2026-10-02 发布）；评级 CVSS v4 8.5，需用户粘贴才触发</text>
  <text x="62" y="500" font-size="11" fill="#991B1B">教训：白名单与 schema 校验是库的职责，而库有漏洞 —— 所以必须有服务端二次校验与展示端白名单兜底</text>
</svg>
