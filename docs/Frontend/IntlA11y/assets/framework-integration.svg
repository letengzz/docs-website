<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="376" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">框架集成：入口不同，接缝相同</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三个框架给的便利各不相同，但服务端渲染的三条接缝谁都躲不开</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">三个框架三种入口，接缝都在服务端渲染</text>
  <rect x="30" y="94" width="220" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">Vue：vue-i18n</text>
  <text x="140" y="129" text-anchor="middle" font-size="8" fill="#047857">组合式 API useI18n</text>
  <text x="140" y="147.4" text-anchor="middle" font-size="8" fill="#047857">消息编译有开销</text>
  <text x="140" y="165.8" text-anchor="middle" font-size="8" fill="#047857">SSR 用独立实例</text>
  <rect x="270" y="94" width="220" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">React：i18next</text>
  <text x="380" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">Provider + useTranslation</text>
  <text x="380" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">命名空间按需加载</text>
  <text x="380" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">水合前勿切语言</text>
  <rect x="510" y="94" width="220" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="620" y="112.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">Nuxt：@nuxtjs/i18n</text>
  <text x="620" y="129" text-anchor="middle" font-size="8" fill="#0F766E">文件即语言包</text>
  <text x="620" y="147.4" text-anchor="middle" font-size="8" fill="#0F766E">路由与 SEO 一起给</text>
  <text x="620" y="165.8" text-anchor="middle" font-size="8" fill="#0F766E">策略 prefix_except_default</text>
  <rect x="30" y="206" width="700" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="46" y="229" text-anchor="start" font-size="9.5" fill="#991B1B" font-weight="bold">接缝一 · 实例隔离</text>
  <text x="250" y="229" text-anchor="start" font-size="8.5" fill="#B91C1C">服务端每个请求一份实例，不共享可变 locale</text>
  <rect x="30" y="250" width="700" height="36" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="46" y="273" text-anchor="start" font-size="9.5" fill="#9A3412" font-weight="bold">接缝二 · 首帧一致</text>
  <text x="250" y="273" text-anchor="start" font-size="8.5" fill="#C2410C">水合前不得切换语言，否则 hydration mismatch</text>
  <rect x="30" y="294" width="700" height="36" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="46" y="317" text-anchor="start" font-size="9.5" fill="#92400E" font-weight="bold">接缝三 · 元信息</text>
  <text x="250" y="317" text-anchor="start" font-size="8.5" fill="#B45309">html lang / hreflang / canonical 由服务端写入</text>
  <text x="380" y="358" text-anchor="middle" font-size="9.5" fill="#475569">通用判据：关掉 JS 看源码 —— 语言、日期、数字、SEO 元信息都该在</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
