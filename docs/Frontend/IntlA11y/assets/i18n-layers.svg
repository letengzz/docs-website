<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">国际化的四层职责</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「翻译」和「工程」分开：翻译只负责第 ① 层，其余三层是代码问题</text>
  <rect x="30" y="74" width="700" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="92.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">① 文案层：抽取与命名</text>
  <text x="380" y="109" text-anchor="middle" font-size="8" fill="#1D4ED8">把界面文案从代码里搬进资源文件</text>
  <text x="380" y="127.4" text-anchor="middle" font-size="8" fill="#1D4ED8">key 用语义命名（cart.submit）而非中文原文</text>
  <text x="380" y="145.8" text-anchor="middle" font-size="8" fill="#1D4ED8">同一 key 之下不许出现可变句拼接</text>
  <rect x="30" y="148" width="700" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="166.2" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">② 资源层：组织与加载</text>
  <text x="380" y="183" text-anchor="middle" font-size="8" fill="#4338CA">按路由/命名空间拆包，首屏只加载当前语言</text>
  <text x="380" y="201.4" text-anchor="middle" font-size="8" fill="#4338CA">语言包版本随构建产物走，不依赖运行时回源</text>
  <text x="380" y="219.8" text-anchor="middle" font-size="8" fill="#4338CA">缺失 key 一律回退到 fallback 语言并打点</text>
  <rect x="30" y="222" width="700" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="240.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">③ 运行时层：locale 与格式化</text>
  <text x="380" y="257" text-anchor="middle" font-size="8" fill="#6D28D9">locale 来源优先级：URL → 用户设置 → 请求头 → 默认</text>
  <text x="380" y="275.4" text-anchor="middle" font-size="8" fill="#6D28D9">日期/数字/货币/复数一律走 Intl，不手写格式</text>
  <text x="380" y="293.8" text-anchor="middle" font-size="8" fill="#6D28D9">时区跟随数据语义，不跟随浏览器</text>
  <rect x="30" y="296" width="700" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="314.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">④ 渲染层：输出与 SEO</text>
  <text x="380" y="331" text-anchor="middle" font-size="8" fill="#0F766E">服务端渲染与客户端首帧必须同 locale</text>
  <text x="380" y="349.4" text-anchor="middle" font-size="8" fill="#0F766E">html lang / dir 与当前语言一致</text>
  <text x="380" y="367.8" text-anchor="middle" font-size="8" fill="#0F766E">hreflang 与 canonical 成对出现</text>
  <text x="380" y="378" text-anchor="middle" font-size="9.5" fill="#64748B">越往上越像「写作」，越往下越像「工程」；四层里只有第一层能靠人，其余三层必须靠机制</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
