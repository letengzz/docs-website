<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">无障碍测试：四层投入与覆盖率现实</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">自动化能拦住结构与对比度类问题，键盘流与语义表达只能靠人和辅助技术</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">自动化只能兜一部分：越靠下越便宜，越靠上越可信</text>
  <rect x="285.0" y="94" width="300" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="435" y="112.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">④ 真实用户与辅助技术</text>
  <text x="435" y="129" text-anchor="middle" font-size="7.5" fill="#B91C1C">NVDA / VoiceOver 实录</text>
  <text x="435" y="146.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">残障用户可用性测试</text>
  <text x="435" y="163.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">发现的问题最真实</text>
  <rect x="306.0" y="160" width="300" height="54" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="456" y="178.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">③ 人工清单走查</text>
  <text x="456" y="195" text-anchor="middle" font-size="7.5" fill="#C2410C">只用键盘走完主流程</text>
  <text x="456" y="212.25" text-anchor="middle" font-size="7.5" fill="#C2410C">200% 缩放与高对比模式</text>
  <text x="456" y="229.5" text-anchor="middle" font-size="7.5" fill="#C2410C">字幕/动效/错误提示</text>
  <rect x="327.0" y="226" width="300" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="477" y="244.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">② 浏览器与 CI 自动化</text>
  <text x="477" y="261" text-anchor="middle" font-size="7.5" fill="#B45309">axe-core / Lighthouse</text>
  <text x="477" y="278.25" text-anchor="middle" font-size="7.5" fill="#B45309">Playwright + axe 断言</text>
  <text x="477" y="295.5" text-anchor="middle" font-size="7.5" fill="#B45309">覆盖率约三到四成</text>
  <rect x="348.0" y="292" width="300" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="498" y="310.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">① 静态检查与规范</text>
  <text x="498" y="327" text-anchor="middle" font-size="7.5" fill="#047857">eslint-plugin-jsx-a11y</text>
  <text x="498" y="344.25" text-anchor="middle" font-size="7.5" fill="#047857">模板 lint 与命名检查</text>
  <text x="498" y="361.5" text-anchor="middle" font-size="7.5" fill="#047857">最便宜、最先拦</text>
  <line x1="380" y1="190" x2="380" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="256" x2="380" y2="226" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="322" x2="380" y2="292" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#B91C1C">工具给出的「0 问题」只说明「没犯那几类最常见的错」，不等于可用</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
