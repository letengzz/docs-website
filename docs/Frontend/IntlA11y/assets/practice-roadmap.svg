<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：双语化与 AA 达标的六步</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一步都有可复跑的判据，避免「改成英文了但没人敢验收」</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">给一个中文单语界面加上英文并达到 AA：六步</text>
  <rect x="30" y="94" width="220" height="100" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="140" y="112.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 盘点与定基线</text>
  <text x="140" y="129" text-anchor="middle" font-size="8" fill="#334155">抓出所有硬编码文案</text>
  <text x="140" y="147.4" text-anchor="middle" font-size="8" fill="#334155">跑一次 axe 存基线</text>
  <text x="140" y="165.8" text-anchor="middle" font-size="8" fill="#334155">记下此刻的达标率</text>
  <line x1="250" y1="144" x2="270" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="94" width="220" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 抽取与命名</text>
  <text x="380" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">按页面建命名空间</text>
  <text x="380" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">key 用语义英文名</text>
  <text x="380" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">占位符只留具名</text>
  <line x1="490" y1="144" x2="510" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="94" width="220" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="620" y="112.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">③ 接通管线</text>
  <text x="620" y="129" text-anchor="middle" font-size="8" fill="#4338CA">伪本地化跑通一遍</text>
  <text x="620" y="147.4" text-anchor="middle" font-size="8" fill="#4338CA">语言包进构建产物</text>
  <text x="620" y="165.8" text-anchor="middle" font-size="8" fill="#4338CA">缺 key 让构建失败</text>
  <rect x="30" y="210" width="220" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="228.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 结构可达化</text>
  <text x="140" y="245" text-anchor="middle" font-size="8" fill="#047857">按钮不是 div</text>
  <text x="140" y="263.4" text-anchor="middle" font-size="8" fill="#047857">补齐 label 与 alt</text>
  <text x="140" y="281.8" text-anchor="middle" font-size="8" fill="#047857">焦点可见与跳转链接</text>
  <rect x="270" y="210" width="220" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="228.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">⑤ 键盘走查</text>
  <text x="380" y="245" text-anchor="middle" font-size="8" fill="#0F766E">只按 Tab 走主流程</text>
  <text x="380" y="263.4" text-anchor="middle" font-size="8" fill="#0F766E">对话框焦点进出</text>
  <text x="380" y="281.8" text-anchor="middle" font-size="8" fill="#0F766E">修完再跑一次 axe</text>
  <rect x="510" y="210" width="220" height="100" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="228.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑥ 双语验收</text>
  <text x="620" y="245" text-anchor="middle" font-size="8" fill="#C2410C">中英各走一遍</text>
  <text x="620" y="263.4" text-anchor="middle" font-size="8" fill="#C2410C">对比度与缩放复核</text>
  <text x="620" y="281.8" text-anchor="middle" font-size="8" fill="#C2410C">写成回归清单</text>
  <text x="380" y="356" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">验收只有两条：换语言不改代码；不碰鼠标能走完全流程</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
