<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="366" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">多语言工作流：六个阶段</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把翻译当成一条流水线来管，而不是「找人翻一遍就完事」</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">管线先通，再谈翻译质量</text>
  <rect x="30" y="94" width="220" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="140" y="112.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① key 冻结</text>
  <text x="140" y="129" text-anchor="middle" font-size="8" fill="#334155">先定 key 与占位符</text>
  <text x="140" y="147.4" text-anchor="middle" font-size="8" fill="#334155">占位符只留具名</text>
  <text x="140" y="165.8" text-anchor="middle" font-size="8" fill="#334155">禁拼接与拼接语序</text>
  <line x1="250" y1="142" x2="270" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="94" width="220" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">② 伪本地化</text>
  <text x="380" y="129" text-anchor="middle" font-size="8" fill="#B45309">把源文案拉长 1.4 倍</text>
  <text x="380" y="147.4" text-anchor="middle" font-size="8" fill="#B45309">换成重音字符</text>
  <text x="380" y="165.8" text-anchor="middle" font-size="8" fill="#B45309">提前暴露截断与硬编码</text>
  <line x1="490" y1="142" x2="510" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="94" width="220" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="620" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">③ 送翻与回填</text>
  <text x="620" y="129" text-anchor="middle" font-size="8" fill="#6D28D9">TMS 只认 key</text>
  <text x="620" y="147.4" text-anchor="middle" font-size="8" fill="#6D28D9">机器翻译打标</text>
  <text x="620" y="165.8" text-anchor="middle" font-size="8" fill="#6D28D9">不覆盖人工译文</text>
  <rect x="30" y="206" width="220" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="224.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">④ 一致性校验</text>
  <text x="140" y="241" text-anchor="middle" font-size="8" fill="#1D4ED8">key 缺失/多余</text>
  <text x="140" y="259.4" text-anchor="middle" font-size="8" fill="#1D4ED8">占位符不一致</text>
  <text x="140" y="277.8" text-anchor="middle" font-size="8" fill="#1D4ED8">空值与纯空格</text>
  <rect x="270" y="206" width="220" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="224.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">⑤ 构建期合并</text>
  <text x="380" y="241" text-anchor="middle" font-size="8" fill="#4338CA">缺 key 直接失败</text>
  <text x="380" y="259.4" text-anchor="middle" font-size="8" fill="#4338CA">语言包进产物</text>
  <text x="380" y="277.8" text-anchor="middle" font-size="8" fill="#4338CA">版本号可追溯</text>
  <rect x="510" y="206" width="220" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="620" y="224.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑥ 灰度与回滚</text>
  <text x="620" y="241" text-anchor="middle" font-size="8" fill="#B91C1C">按语言灰度</text>
  <text x="620" y="259.4" text-anchor="middle" font-size="8" fill="#B91C1C">回滚只切语言包</text>
  <text x="620" y="277.8" text-anchor="middle" font-size="8" fill="#B91C1C">保留上一版指纹</text>
  <text x="380" y="348" text-anchor="middle" font-size="9.5" fill="#B91C1C">红线：源文案改了但 key 没变，翻译平台收不到变更信号 —— 语言包会静默停留在上一版</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
