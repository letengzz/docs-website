<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">WCAG 2.2：四原则与符合性等级</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">POUR 不是口号，每一条背后都有编号的成功准则与可测判据</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">POUR 四原则：把「好不好用」翻译成可判定的条目</text>
  <rect x="30" y="94" width="165" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112.5" y="112.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">Perceivable 可感知</text>
  <text x="112.5" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">文本替代（1.1.1）</text>
  <text x="112.5" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">色彩对比 ≥ 4.5:1（1.4.3）</text>
  <text x="112.5" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">非文本对比 ≥ 3:1（1.4.11）</text>
  <rect x="210" y="94" width="165" height="106" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="292.5" y="112.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">Operable 可操作</text>
  <text x="292.5" y="129" text-anchor="middle" font-size="7.5" fill="#047857">全部功能可键盘（2.1.1）</text>
  <text x="292.5" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">焦点可见（2.4.7）</text>
  <text x="292.5" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">目标尺寸 ≥ 24px（2.5.8）</text>
  <rect x="390" y="94" width="165" height="106" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="472.5" y="112.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">Understandable 可理解</text>
  <text x="472.5" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">语言可判定（3.1.1）</text>
  <text x="472.5" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">错误可识别并建议（3.3.3）</text>
  <text x="472.5" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">一致的导航（3.2.3）</text>
  <rect x="570" y="94" width="165" height="106" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="652.5" y="112.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">Robust 健壮</text>
  <text x="652.5" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">名称角色值（4.1.2）</text>
  <text x="652.5" y="146.25" text-anchor="middle" font-size="7.5" fill="#0F766E">状态消息可播报（4.1.3）</text>
  <text x="652.5" y="163.5" text-anchor="middle" font-size="7.5" fill="#0F766E">兼容辅助技术</text>
  <line x1="30" y1="218" x2="730" y2="218" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="244" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">符合性等级：A 是底线，AA 是通行商业标准，AAA 不要求全站达到</text>
  <rect x="30" y="258" width="70" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="65" y="274" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">A</text>
  <rect x="108" y="258" width="120" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="168" y="274" text-anchor="middle" font-size="8.5" fill="#334155">26 条</text>
  <rect x="236" y="258" width="494" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="483" y="274" text-anchor="middle" font-size="8.5" fill="#334155">不含即不可用</text>
  <rect x="30" y="288" width="70" height="24" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="65" y="304" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">AA</text>
  <rect x="108" y="288" width="120" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="168" y="304" text-anchor="middle" font-size="8.5" fill="#334155">24 条（含 A）</text>
  <rect x="236" y="288" width="494" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="483" y="304" text-anchor="middle" font-size="8.5" fill="#334155">合同与法规常引用</text>
  <rect x="30" y="318" width="70" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="65" y="334" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">AAA</text>
  <rect x="108" y="318" width="120" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="168" y="334" text-anchor="middle" font-size="8.5" fill="#334155">28 条（含 AA）</text>
  <rect x="236" y="318" width="494" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="483" y="334" text-anchor="middle" font-size="8.5" fill="#334155">按内容选择性满足</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#B45309">标准版本：WCAG 2.2 为现行推荐版本；WCAG 3.0 仍在草案阶段，不要照着草案做验收</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
