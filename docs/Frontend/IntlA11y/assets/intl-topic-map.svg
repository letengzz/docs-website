<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">国际化与无障碍：专题地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">六个板块互相咬合——前三个管「文字能不能换」，后三个管「界面能不能用」</text>
  <rect x="30" y="74" width="700" height="42" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="100" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">同一条链上的两件事：文本要换得掉（i18n）、界面要用得上（a11y）</text>
  <rect x="30" y="136" width="220" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="154.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">多语言架构</text>
  <text x="140" y="171" text-anchor="middle" font-size="8" fill="#1D4ED8">文案抽取与 key 设计</text>
  <text x="140" y="189.4" text-anchor="middle" font-size="8" fill="#1D4ED8">语言包组织与按需加载</text>
  <text x="140" y="207.8" text-anchor="middle" font-size="8" fill="#1D4ED8">locale 解析与 fallback 链</text>
  <rect x="270" y="136" width="220" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="154.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">翻译工作流</text>
  <text x="380" y="171" text-anchor="middle" font-size="8" fill="#6D28D9">伪本地化先跑通管线</text>
  <text x="380" y="189.4" text-anchor="middle" font-size="8" fill="#6D28D9">TMS 与 key 冻结</text>
  <text x="380" y="207.8" text-anchor="middle" font-size="8" fill="#6D28D9">CI 校验与灰度回滚</text>
  <rect x="510" y="136" width="220" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="620" y="154.2" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">框架落地</text>
  <text x="620" y="171" text-anchor="middle" font-size="8" fill="#4338CA">vue-i18n / i18next</text>
  <text x="620" y="189.4" text-anchor="middle" font-size="8" fill="#4338CA">服务端渲染与水合一致</text>
  <text x="620" y="207.8" text-anchor="middle" font-size="8" fill="#4338CA">路由与 SEO 元信息</text>
  <rect x="30" y="244" width="220" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="262.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">无障碍基础</text>
  <text x="140" y="279" text-anchor="middle" font-size="8" fill="#047857">POUR 四原则与 AA 判据</text>
  <text x="140" y="297.4" text-anchor="middle" font-size="8" fill="#047857">语义化 HTML 优先</text>
  <text x="140" y="315.8" text-anchor="middle" font-size="8" fill="#047857">ARIA 五条规则</text>
  <rect x="270" y="244" width="220" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="262.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">键盘与焦点</text>
  <text x="380" y="279" text-anchor="middle" font-size="8" fill="#0F766E">焦点可见与顺序</text>
  <text x="380" y="297.4" text-anchor="middle" font-size="8" fill="#0F766E">对话框与路由焦点管理</text>
  <text x="380" y="315.8" text-anchor="middle" font-size="8" fill="#0F766E">复合组件 APG 模式</text>
  <rect x="510" y="244" width="220" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="262.2" text-anchor="middle" font-size="10.5" fill="#9A3412" font-weight="bold">测试与门禁</text>
  <text x="620" y="279" text-anchor="middle" font-size="8" fill="#C2410C">axe-core 只兜三成</text>
  <text x="620" y="297.4" text-anchor="middle" font-size="8" fill="#C2410C">屏幕阅读器实测</text>
  <text x="620" y="315.8" text-anchor="middle" font-size="8" fill="#C2410C">CI 基线与回归</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">出口判据：换一门语言不用改代码，不点鼠标能走完全流程</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
