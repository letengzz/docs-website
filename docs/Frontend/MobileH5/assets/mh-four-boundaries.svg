<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>移动端 H5 的四条边界</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:14px;fill:#0F172A;font-weight:600}.s{font-size:12.5px;fill:#475569}.tag{font-size:12px;fill:#64748B}.box{stroke-width:1.5}</style>
<rect width="920" height="520" fill="#FFFFFF"/>
<text x="460" y="36" text-anchor="middle" class="h">四条边界：先把「想当然」的地方分开</text>
<text x="460" y="58" text-anchor="middle" class="tag">这四条是后面每一页判据的地基——地基错了，手段用对也没用</text>

<rect x="40" y="80" width="420" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="60" y="108" class="lt">边界一：适配 ≠ 等比缩放</text>
<text x="60" y="132" class="s">把 375 稿整体放大到 430，等于把</text>
<text x="60" y="152" class="s">17px 正文变成 19.5px、把 24px 的</text>
<text x="60" y="172" class="s">按钮变成 27.5px——两者都不该发生</text>
<text x="60" y="194" class="s">可读性与可点击尺寸有绝对下限</text>

<rect x="480" y="80" width="400" height="130" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="500" y="108" class="lt">边界二：性能 ≠ 资源变小</text>
<text x="500" y="132" class="s">首屏时间 = 关键路径上最慢的那一段</text>
<text x="500" y="152" class="s">把总包从 2 MB 压到 1 MB，若首屏</text>
<text x="500" y="172" class="s">依赖的那 300 KB 没提前，LCP 不变</text>
<text x="500" y="194" class="s">先缩短路径，再减少总量</text>

<rect x="40" y="228" width="420" height="142" rx="10" fill="#FFF7ED" stroke="#F59E0B" class="box"/>
<text x="60" y="256" class="lt">边界三：桥接 ≠ 调用原生</text>
<text x="60" y="280" class="s">一次桥接跨两个运行时、两个线程，</text>
<text x="60" y="300" class="s">中间还夹着宿主的生命周期</text>
<text x="60" y="322" class="s">「原生没回调」是常态而不是异常：</text>
<text x="60" y="342" class="s">超时、重复回调、页面已销毁都要处理</text>
<text x="60" y="364" class="s">判据：每次调用都能落到终态</text>

<rect x="480" y="228" width="400" height="142" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="500" y="256" class="lt">边界四：兼容 ≠ try/catch 兜底</text>
<text x="500" y="280" class="s">兼容的产物是「一张能跑的矩阵」，</text>
<text x="500" y="300" class="s">不是散落在业务里的能力探测</text>
<text x="500" y="322" class="s">先定义支持面（机型 × 内核 × 版本），</text>
<text x="500" y="342" class="s">再给每条降级路径一个可验证出口</text>
<text x="500" y="364" class="s">判据：能报出「不支持时是什么样」</text>

<rect x="40" y="388" width="840" height="100" rx="10" fill="#FEFCE8" stroke="#CA8A04" class="box"/>
<text x="460" y="414" text-anchor="middle" class="lt">一条贯穿的四步动作链</text>
<text x="460" y="440" text-anchor="middle" class="s">先量基线与支持面（机型 / 内核 / 网络）→ 再定视口与尺寸体系（绝对下限 + 相对缩放）</text>
<text x="460" y="462" text-anchor="middle" class="s">→ 再收关键路径与输入链路（首屏预算 + 手感）→ 最后把桥接与降级落成可执行断言</text>
<text x="460" y="481" text-anchor="middle" class="tag">跳过任何一步，后面的参数都只能靠猜</text>
</svg>
