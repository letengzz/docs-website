<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>移动端 H5 安全面的四层与桥接三条纪律</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:11.5px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}</style>
<rect width="920" height="520" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">H5 的安全面：桥接是权限接口，不是工具函数</text>
<text x="460" y="56" text-anchor="middle" class="tag">浏览器里最坏的结果是「我的页面被改写」，宿主里最坏的结果是「用户的账号被操作」</text>

<rect x="40" y="80" width="204" height="150" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="60" y="106" class="lt">第一层：页面自身</text>
<text x="60" y="130" class="s">XSS 是其余一切的前置条件</text>
<text x="60" y="152" class="s">CSP 收紧 script-src</text>
<text x="60" y="174" class="s">不把用户输入拼进</text>
<text x="60" y="194" class="s">innerHTML / 模板字符串</text>
<text x="60" y="216" class="tag">判据：控制台无 CSP 违规告警</text>

<rect x="256" y="80" width="204" height="150" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="276" y="106" class="lt">第二层：WebView 配置</text>
<text x="276" y="130" class="s">只加载 https</text>
<text x="276" y="152" class="s">关闭不需要的开关</text>
<text x="276" y="174" class="s">禁止 file:// 访问与任意</text>
<text x="276" y="194" class="s">远程调试（生产）</text>
<text x="276" y="216" class="tag">判据：关掉 JS 后页面不白屏</text>

<rect x="472" y="80" width="204" height="150" rx="10" fill="#FFF7ED" stroke="#F59E0B" class="box"/>
<text x="492" y="106" class="lt">第三层：跳转与协议</text>
<text x="492" y="130" class="s">开放重定向与 scheme 劫持</text>
<text x="492" y="152" class="s">外链一律白名单 + 二次确认</text>
<text x="492" y="174" class="s">深链回跳要带校验票据</text>
<text x="492" y="194" class="s">不能只靠 Referer</text>
<text x="492" y="216" class="tag">判据：伪造回跳参数不生效</text>

<rect x="688" y="80" width="192" height="150" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="708" y="106" class="lt">第四层：桥接授权</text>
<text x="708" y="130" class="s">最小暴露面</text>
<text x="708" y="152" class="s">来源页校验</text>
<text x="708" y="174" class="s">参数白名单与长度上限</text>
<text x="708" y="194" class="s">敏感操作二次确认</text>
<text x="708" y="216" class="tag">判据：非白名单页调用被拒</text>

<rect x="40" y="248" width="840" height="140" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="60" y="274" class="lt">桥接的三条纪律（每一条都对应一类已发生过的真实事故形态）</text>
<text x="60" y="300" class="s">① 只暴露「业务动作」，不暴露「通用能力」。给出 openCamera() 而不是 exec(command, args)——后者等价于把宿主当解释器。</text>
<text x="60" y="324" class="s">② 校验调用来源。原生侧必须确认当前 WebView 加载的页面在允许列表内，而不是「只要能拿到对象就信任」。</text>
<text x="60" y="348" class="s">③ 敏感动作不静默执行。支付、发消息、读通讯录、剪贴板写入都要能回到「用户看到并确认了什么」。</text>
<text x="60" y="372" class="tag">这三条的共同点：它们保护的是宿主，而宿主的权限远大于页面——只做前端防护等于没做</text>

<rect x="40" y="404" width="410" height="98" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="60" y="430" class="lt">存储与凭据</text>
<text x="60" y="454" class="s">localStorage 与 IndexedDB 不加密，同源即可读</text>
<text x="60" y="476" class="s">敏感令牌优先放 httpOnly Cookie 或宿主的凭据存储</text>
<text x="60" y="496" class="tag">退出登录要清干净，而不是只清 token 这一个键</text>

<rect x="470" y="404" width="410" height="98" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="490" y="430" class="lt">隐私与合规</text>
<text x="490" y="454" class="s">设备标识、位置、剪贴板读取都要有明确用途与同意动作</text>
<text x="490" y="476" class="s">埋点里不带明文手机号、身份证、地址</text>
<text x="490" y="496" class="tag">判据：抓一次请求，检查载荷里没有可直接识别个人的字段</text>
</svg>
