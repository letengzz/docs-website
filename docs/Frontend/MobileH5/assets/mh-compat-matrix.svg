<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>移动端兼容矩阵：三个维度与四层降级</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:11.5px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}</style>
<rect width="920" height="540" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">兼容矩阵 = 用谁 × 什么内核 × 哪个版本</text>
<text x="460" y="56" text-anchor="middle" class="tag">矩阵的每一行都要能回答「不支持时是什么样」，否则它只是一张清单</text>

<rect x="40" y="80" width="840" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="60" y="106" class="lt">维度一：内核只有两家，但版本几乎无限</text>
<text x="60" y="128" class="s">iOS：所有浏览器（含 Chrome、微信内置）都用 WebKit，所以「换个浏览器试试」在 iOS 上没有意义</text>
<text x="60" y="148" class="tag">Android：Chrome、各家厂商浏览器、以及 App 内嵌 WebView 各自一个版本；系统 WebView 可独立更新，也能被用户停用</text>

<rect x="40" y="172" width="410" height="132" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="60" y="198" class="lt">维度二：宿主决定能力上限</text>
<text x="60" y="222" class="s">同一个 UA，在浏览器里和在 App 内嵌</text>
<text x="60" y="242" class="s">WebView 里能力完全不同：</text>
<text x="60" y="264" class="s">· 桥接对象只在宿主体内存在</text>
<text x="60" y="284" class="s">· 文件 / 相机 / 剪贴板多一层授权</text>
<text x="60" y="304" class="tag">所以「支持面」必须写成「哪个宿主 + 哪个内核」</text>

<rect x="470" y="172" width="410" height="132" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="490" y="198" class="lt">维度三：能力的判定要落到特性而不是 UA</text>
<text x="490" y="222" class="s">UA 串在 WebView 里常被裁剪或伪装，按 UA</text>
<text x="490" y="242" class="s">分支会随版本漂移而失效</text>
<text x="490" y="264" class="s">优先用能力检测：</text>
<text x="490" y="286" class="s">CSS 用 @supports，JS 用「有没有这个属性 / 方法」</text>
<text x="490" y="306" class="tag">只在「能力检测表达不出来」时才退回 UA</text>

<rect x="40" y="316" width="840" height="124" rx="10" fill="#FFF7ED" stroke="#F59E0B" class="box"/>
<text x="460" y="342" text-anchor="middle" class="lt">四层降级：从首选到兜底，每一层都要有出口</text>
<text x="60" y="368" class="s">L1 首选实现：现代能力（dvh / Pointer Events / env(safe-area-inset-*)）。写在前一行，被支持的浏览器直接采用。</text>
<text x="60" y="390" class="s">L2 静态回退：旧单位与旧事件（vh / Touch Events）。不写 @supports，靠「不认识就丢弃」这一条 CSS 规则生效。</text>
<text x="60" y="412" class="s">L3 运行时兜底：能力检测失败时换一条代码路径（用 JS 算键盘偏移、用固定高度替代 dvh）。</text>
<text x="60" y="430" class="tag">L4 明确不支持：在支持面之外直接给出「请升级浏览器 / 请在 App 内打开」的可读提示，而不是白屏。</text>

<rect x="40" y="452" width="272" height="72" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="60" y="478" class="lt">最小验证集</text>
<text x="60" y="500" class="s">低端安卓 + 当前 iOS，各一台真机</text>
<text x="60" y="518" class="tag">覆盖两个内核，代价最低</text>

<rect x="324" y="452" width="272" height="72" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="344" y="478" class="lt">必测状态</text>
<text x="344" y="500" class="s">首屏、软键盘、横竖屏、切后台回前台</text>
<text x="344" y="518" class="tag">四个状态能覆盖大多数真实缺陷</text>

<rect x="608" y="452" width="272" height="72" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="628" y="478" class="lt">必留证据</text>
<text x="628" y="500" class="s">机型 / 系统 / 内核版本 / 现象 / 复现步骤</text>
<text x="628" y="518" class="tag">只有现象没有版本，无法定位</text>
</svg>
