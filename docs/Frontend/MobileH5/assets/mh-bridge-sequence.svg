<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>桥接通信的一次调用时序与四条纪律</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;fill:#1E293B}</style>
<rect width="920" height="560" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">一次 JSBridge 调用的完整时序</text>
<text x="460" y="56" text-anchor="middle" class="tag">跨的是「两个运行时 + 两个线程 + 宿主的生命周期」，不是一次函数调用</text>

<rect x="60" y="82" width="220" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="170" y="110" text-anchor="middle" class="lt">H5（WebView 内的 JS）</text>
<rect x="380" y="82" width="220" height="44" rx="8" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="490" y="110" text-anchor="middle" class="lt">桥（注入对象 / 消息通道）</text>
<rect x="700" y="82" width="160" height="44" rx="8" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="780" y="110" text-anchor="middle" class="lt">原生（宿主 App）</text>

<path d="M170 132 L170 470" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>
<path d="M490 132 L490 470" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>
<path d="M780 132 L780 470" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>

<text x="80" y="156" class="lt">① 生成调用 id 与超时定时器</text>
<path d="M180 152 L470 152" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#a2)"/>
<text x="200" y="172" class="tag">把回调按 id 存进回调留存表</text>

<text x="400" y="200" class="lt">② 递送（同步调用或投递消息）</text>
<path d="M500 196 L770 196" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#a2)"/>
<text x="560" y="216" class="tag">这一步在 Android 上可能要跨线程，不是立即返回</text>

<text x="640" y="244" class="lt">③ 权限与参数校验</text>
<text x="600" y="264" class="tag">来源页校验 + 白名单 + 参数类型检查，任何一条不过就回错误</text>

<text x="430" y="292" class="lt">④ 结果回传（成功 / 失败 / 业务错误）</text>
<path d="M770 288 L500 288" stroke="#10B981" stroke-width="1.8" marker-end="url(#a2)"/>
<text x="520" y="308" class="tag">也可能回传多次（流式返回），消费侧必须幂等</text>

<text x="180" y="336" class="lt">⑤ 消费回调并清理</text>
<path d="M480 332 L180 332" stroke="#10B981" stroke-width="1.8" marker-end="url(#a2)"/>
<text x="200" y="352" class="tag">从留存表删除、清除超时定时器</text>

<rect x="60" y="368" width="800" height="112" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="80" y="394" class="lt">四个终态，任何一个没覆盖都会留下「永远等下去」的回调</text>
<text x="80" y="418" class="s">成功：原生返回结果　　失败：原生明确报错（参数错 / 无权限 / 未实现）</text>
<text x="80" y="440" class="s">超时：约定的最长等待时间到了（原生可能压根没收到，也可能在忙）</text>
<text x="80" y="462" class="s">页面已销毁：返回时 WebView 已关闭，回调不能再碰 DOM</text>

<rect x="60" y="494" width="390" height="52" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="80" y="516" class="lt">iOS：WKWebView 的 messageHandlers</text>
<text x="80" y="536" class="tag">注入时机在 document start；UIWebView 早已被淘汰，不再作为目标</text>

<rect x="470" y="494" width="390" height="52" rx="10" fill="#EFF6FF" stroke="#2563EB" class="box"/>
<text x="490" y="516" class="lt">Android：addJavascriptInterface</text>
<text x="490" y="536" class="tag">被暴露的方法必须加 @JavascriptInterface，对象名与命名空间要收敛</text>

<defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0 0 L7 3.2 L0 6.4 Z" fill="#64748B"/></marker></defs>
</svg>
