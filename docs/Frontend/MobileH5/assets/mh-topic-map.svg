<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>移动端 H5 深入专题地图</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:14px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}</style>
<rect width="920" height="620" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">移动端 H5 深入 · 专题地图</text>
<text x="460" y="56" text-anchor="middle" class="tag">先分清「屏幕、性能、输入、宿主、内核、安全」六个面，再按面找页面</text>

<rect x="40" y="76" width="840" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="60" y="102" class="lt">总览：四条边界（判断层）</text>
<text x="60" y="124" class="s">适配 ≠ 等比缩放　|　性能 ≠ 资源变小　|　桥接 ≠ 调用原生　|　兼容 ≠ try/catch 兜底</text>
<text x="60" y="145" class="s">边界判错，后面每个手段都会用错地方</text>

<rect x="40" y="176" width="264" height="150" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="60" y="202" class="lt">① 屏幕：视口与适配</text>
<text x="60" y="224" class="s">布局视口 / 视觉视口 / 理想视口</text>
<text x="60" y="244" class="s">px→vw、根字号、clamp 边界</text>
<text x="60" y="264" class="s">1px 边框、DPR、安全区、软键盘</text>
<text x="60" y="284" class="s">字号可读性 vs 等比缩放</text>
<text x="60" y="308" class="tag">→ ViewportAdapter</text>

<rect x="328" y="176" width="264" height="150" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="348" y="202" class="lt">② 时间：首屏与运行</text>
<text x="348" y="224" class="s">关键路径 = 网络 + 解析 + 执行 + 渲染</text>
<text x="348" y="244" class="s">LCP 2.5s / INP 200ms / CLS 0.1</text>
<text x="348" y="264" class="s">分包、preload、图片、字体</text>
<text x="348" y="284" class="s">长列表、内存回收、低端机降级</text>
<text x="348" y="308" class="tag">→ PagePerformance</text>

<rect x="616" y="176" width="264" height="150" rx="10" fill="#FFF7ED" stroke="#F59E0B" class="box"/>
<text x="636" y="202" class="lt">③ 输入：触摸与手势</text>
<text x="636" y="224" class="s">Pointer Events 优先，touch 作兜底</text>
<text x="636" y="244" class="s">300ms、passive、touch-action</text>
<text x="636" y="264" class="s">滚动穿透、手势冲突、指针捕获</text>
<text x="636" y="284" class="s">touchcancel 必须收尾</text>
<text x="636" y="308" class="tag">→ TouchInteraction</text>

<rect x="40" y="342" width="264" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" class="box"/>
<text x="60" y="368" class="lt">④ 宿主：桥接通信</text>
<text x="60" y="390" class="s">WKWebView messageHandlers</text>
<text x="60" y="410" class="s">Android addJavascriptInterface</text>
<text x="60" y="430" class="s">调用 id + 超时 + 回调留存表</text>
<text x="60" y="450" class="s">注入时机、版本协商、降级</text>
<text x="60" y="474" class="tag">→ Bridge</text>

<rect x="328" y="342" width="264" height="150" rx="10" fill="#F1F5F9" stroke="#475569" class="box"/>
<text x="348" y="368" class="lt">⑤ 内核：兼容与排障</text>
<text x="348" y="390" class="s">iOS 全 WebKit、Android 多内核</text>
<text x="348" y="410" class="s">WebView 版本决定能力上限</text>
<text x="348" y="430" class="s">真机调试、抓包、vConsole</text>
<text x="348" y="450" class="s">兼容矩阵 = 用谁 + 版本 + 判据</text>
<text x="348" y="474" class="tag">→ Compatibility</text>

<rect x="616" y="342" width="264" height="150" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="636" y="368" class="lt">⑥ 边界：安全面</text>
<text x="636" y="390" class="s">桥接是权限接口，不是工具函数</text>
<text x="636" y="410" class="s">来源校验、白名单、最小暴露</text>
<text x="636" y="430" class="s">scheme 劫持、开放重定向</text>
<text x="636" y="450" class="s">本地存储、剪贴板、截图</text>
<text x="636" y="474" class="tag">→ Security</text>

<rect x="40" y="508" width="540" height="88" rx="10" fill="#FEFCE8" stroke="#CA8A04" class="box"/>
<text x="60" y="534" class="lt">实战：把一个 PC 页面改造成移动端 H5</text>
<text x="60" y="556" class="s">六步：基线测量 → 视口与适配 → 关键路径 → 手势与键盘 → 桥接与降级 → 真机矩阵验收</text>
<text x="60" y="578" class="tag">→ Practice（MH-P：七条可执行断言）</text>

<rect x="600" y="508" width="280" height="88" rx="10" fill="#F8FAFC" stroke="#94A3B8" class="box"/>
<text x="620" y="534" class="lt">收口：常见问题</text>
<text x="620" y="556" class="s">现象分诊表 · 高频十二问</text>
<text x="620" y="578" class="tag">→ FAQ（上线自查清单）</text>
</svg>
