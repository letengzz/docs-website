<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="394" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">两种交付形态与发布链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">解释运行适合「常改、内部用」；出码适合「少改、对外用」</text>
  <text x="190" y="82" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">① 运行时解释</text>
  <rect x="10" y="92" width="130" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="75" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">Schema</text>
  <line x1="140" y1="120" x2="176" y2="120" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="176" y="92" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="251" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">平台运行时</text>
  <line x1="326" y1="120" x2="362" y2="120" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="362" y="92" width="150" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="437" y="110.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">页面（改即生效）</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">② 出码（Schema → 源码）</text>
  <rect x="10" y="186" width="110" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="65" y="204.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">Schema</text>
  <line x1="120" y1="214" x2="150" y2="214" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="150" y="186" width="110" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="205" y="204.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">出码器</text>
  <line x1="260" y1="214" x2="290" y2="214" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="290" y="186" width="110" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="345" y="204.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">前端工程</text>
  <line x1="400" y1="214" x2="430" y2="214" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="430" y="186" width="90" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="475" y="204.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">构建</text>
  <line x1="520" y1="214" x2="550" y2="214" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="550" y="186" width="120" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="610" y="204.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">发布 / 灰度</text>
  <rect x="10" y="272" width="740" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="290.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">发布指针：draft 与 published 分离；回滚 = 把指针移回上一版本</text>
  <rect x="10" y="330" width="740" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="348.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">安全边界：表达式沙箱 / 富文本消毒 / 数据源服务端鉴权 / 远程物料验签</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
