<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="348" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">物料 = 描述 + 实现 + 默认值</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">元信息与实现不一致，是物料里最隐蔽的缺陷</text>
  <rect x="20" y="80" width="220" height="68" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">meta.json · 描述</text>
  <text x="130" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">名字、分类、属性类型与标题</text>
  <text x="130" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">编辑器靠它生成属性面板</text>
  <line x1="240" y1="114" x2="296" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="162" width="220" height="68" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="130" y="180.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">impl · 实现</text>
  <text x="130" y="197" text-anchor="middle" font-size="7.5" fill="#0F766E">真实的 Vue / React 组件</text>
  <text x="130" y="214.25" text-anchor="middle" font-size="7.5" fill="#0F766E">渲染器靠它出视图</text>
  <line x1="240" y1="196" x2="296" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="244" width="220" height="68" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="130" y="262.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">defaultProps · 默认值</text>
  <text x="130" y="279" text-anchor="middle" font-size="7.5" fill="#047857">拖入那一刻的初始 props</text>
  <text x="130" y="296.25" text-anchor="middle" font-size="7.5" fill="#047857">必须能直接渲染通过</text>
  <line x1="240" y1="278" x2="296" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="296" y="80" width="170" height="200" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="381" y="98.2" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">物料注册表</text>
  <text x="381" y="115" text-anchor="middle" font-size="8" fill="#4338CA">componentName 唯一</text>
  <text x="381" y="133.4" text-anchor="middle" font-size="8" fill="#4338CA">重复注册即报错</text>
  <text x="381" y="151.8" text-anchor="middle" font-size="8" fill="#4338CA">可枚举（单一事实来源）</text>
  <line x1="466" y1="180" x2="516" y2="138" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="516" y="80" width="224" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="628" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">编辑器：组件面板</text>
  <text x="628" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">枚举全部物料</text>
  <line x1="466" y1="180" x2="516" y2="222" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="516" y="164" width="224" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="628" y="182.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">渲染器：组件映射</text>
  <text x="628" y="199" text-anchor="middle" font-size="7.5" fill="#0F766E">按名查实现</text>
  <line x1="466" y1="180" x2="516" y2="306" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="516" y="248" width="224" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="628" y="266.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">编辑器：默认值</text>
  <text x="628" y="283" text-anchor="middle" font-size="7.5" fill="#047857">拖入即可用</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
