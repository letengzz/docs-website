<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">页面 Schema 的三段式与版本</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">协议是唯一一旦定错就要全面返工的东西</text>
  <rect x="230" y="76" width="300" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">一个节点（Node）</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">id + componentName + props + children</text>
  <line x1="380" y1="138" x2="380" y2="158" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="15" y="160" width="230" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="178.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">id</text>
  <text x="130" y="195" text-anchor="middle" font-size="7.5" fill="#1D4ED8">页面内全局唯一</text>
  <text x="130" y="212.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不随位置变化</text>
  <rect x="265" y="160" width="230" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="178.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">componentName</text>
  <text x="380" y="195" text-anchor="middle" font-size="7.5" fill="#0F766E">指向物料表里的实现</text>
  <text x="380" y="212.25" text-anchor="middle" font-size="7.5" fill="#0F766E">查不到 = 整块空白</text>
  <rect x="515" y="160" width="230" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="630" y="178.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">props</text>
  <text x="630" y="195" text-anchor="middle" font-size="7.5" fill="#047857">只放数据，不放函数</text>
  <text x="630" y="212.25" text-anchor="middle" font-size="7.5" fill="#047857">必须能 JSON 往返</text>
  <rect x="15" y="258" width="730" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="276.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">children</text>
  <text x="380" y="293" text-anchor="middle" font-size="7.5" fill="#6D28D9">永远是数组：用 [] 表示空；「有没有 children 字段」才表示是不是容器</text>
  <text x="380" y="322" text-anchor="middle" font-size="8.5" fill="#475569">版本与迁移链：每一步只管相邻两版，组合起来覆盖任意历史文档</text>
  <rect x="60" y="336" width="150" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="135" y="354.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">1.0.0</text>
  <line x1="210" y1="356" x2="310" y2="356" stroke="#D97706" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="310" y="336" width="150" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="385" y="354.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">1.0.1</text>
  <line x1="460" y1="356" x2="560" y2="356" stroke="#D97706" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="560" y="336" width="150" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="635" y="354.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">1.1.0</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
