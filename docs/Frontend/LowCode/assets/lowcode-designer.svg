<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="358" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">搭建器：三视图与统一操作接口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">凡是不能被描述成一次「操作」的改动，都是搭建器的缺陷</text>
  <rect x="10" y="76" width="236" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="128" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">画布 Canvas</text>
  <text x="128" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">看效果、选中、拖拽</text>
  <line x1="128" y1="148" x2="330" y2="182" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="262" y="76" width="236" height="72" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">大纲树 Outline</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">在复杂页面里精确选到节点</text>
  <line x1="380" y1="148" x2="330" y2="182" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="514" y="76" width="236" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="632" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">属性面板 Props</text>
  <text x="632" y="111" text-anchor="middle" font-size="7.5" fill="#047857">改内容、样式、事件</text>
  <line x1="632" y1="148" x2="330" y2="182" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="150" y="184" width="460" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="202.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">统一操作接口（insert / remove / move / update）</text>
  <line x1="380" y1="230" x2="380" y2="254" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="60" y="256" width="300" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="210" y="274.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">Schema（单一数据源）</text>
  <rect x="400" y="256" width="300" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="550" y="274.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">History（撤销 / 重做栈）</text>
  <text x="380" y="336" text-anchor="middle" font-size="9" fill="#B45309">纪律：编辑器状态（选中 / hover / 拖拽）绝不写进 Schema，也绝不进撤销栈</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
