<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="386" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：从零搭一个表单页搭建器</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">六步走，顺序不能反 —— 先有协议再有编辑器</text>
  <rect x="10" y="80" width="236" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="128" y="98.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">① 定协议</text>
  <text x="128" y="115" text-anchor="middle" font-size="7.5" fill="#4338CA">元 Schema + 示例页面</text>
  <text x="128" y="132.25" text-anchor="middle" font-size="7.5" fill="#4338CA">判据：三条校验无输出</text>
  <line x1="246" y1="124" x2="260" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="262" y="80" width="236" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 最小渲染器</text>
  <text x="380" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">手写 JSON 即可渲染</text>
  <text x="380" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">判据：不启动编辑器</text>
  <line x1="498" y1="124" x2="512" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="514" y="80" width="236" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="632" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 补物料</text>
  <text x="632" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">先 meta 后实现</text>
  <text x="632" y="132.25" text-anchor="middle" font-size="7.5" fill="#0F766E">判据：默认值全部可渲染</text>
  <line x1="632" y1="168" x2="128" y2="198" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="198" width="236" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="128" y="216.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 做搭建器</text>
  <text x="128" y="233" text-anchor="middle" font-size="7.5" fill="#047857">画布→树→属性→操作→撤销</text>
  <text x="128" y="250.25" text-anchor="middle" font-size="7.5" fill="#047857">判据：5 撤回到初始态</text>
  <line x1="246" y1="242" x2="260" y2="242" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="262" y="198" width="236" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="216.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑤ 接联动</text>
  <text x="380" y="233" text-anchor="middle" font-size="7.5" fill="#C2410C">数据源 + 沙箱 + 短路</text>
  <text x="380" y="250.25" text-anchor="middle" font-size="7.5" fill="#C2410C">判据：校验失败不提交</text>
  <line x1="498" y1="242" x2="512" y2="242" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="514" y="198" width="236" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="632" y="216.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">⑥ 出码交付</text>
  <text x="632" y="233" text-anchor="middle" font-size="7.5" fill="#6D28D9">AST 出码 + 独立构建</text>
  <text x="632" y="250.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">判据：产物不依赖运行时</text>
  <rect x="10" y="322" width="740" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="340.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">P1~P9 断言清单：协议校验 / 可渲染 / 可撤销 / 沙箱 / 短路 / 出码独立 / 同源一致</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
