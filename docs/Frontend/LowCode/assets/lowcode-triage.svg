<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">问题分诊：从现象定位到层</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">低代码的 bug 十有八九是「层没分开」，不是「某个函数写错了」</text>
  <rect x="10" y="76" width="340" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="180" y="94.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">页面局部空白，控制台干净</text>
  <line x1="350" y1="101" x2="400" y2="101" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="76" width="350" height="50" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="575" y="94.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">→ 渲染引擎</text>
  <rect x="10" y="138" width="340" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="180" y="156.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">属性面板是空的 / 改了没效果</text>
  <line x1="350" y1="163" x2="400" y2="163" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="138" width="350" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="575" y="156.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">→ 物料体系</text>
  <rect x="10" y="200" width="340" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="180" y="218.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">撤销回退了「选中」</text>
  <line x1="350" y1="225" x2="400" y2="225" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="200" width="350" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="575" y="218.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">→ 搭建器</text>
  <rect x="10" y="262" width="340" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="180" y="280.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">编辑器把接口打爆</text>
  <line x1="350" y1="287" x2="400" y2="287" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="262" width="350" height="50" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="575" y="280.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">→ 数据源与联动</text>
  <rect x="10" y="324" width="340" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="180" y="342.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">老页面打不开 / 无法回滚</text>
  <line x1="350" y1="349" x2="400" y2="349" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="324" width="350" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="575" y="342.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">→ 协议设计 / 交付与运行时</text>
  <text x="380" y="400" text-anchor="middle" font-size="9" fill="#475569">先定位层，再改代码：跨层修问题一定改错地方</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
