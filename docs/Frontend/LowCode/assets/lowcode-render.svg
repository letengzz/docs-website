<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="346" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">渲染引擎：四个防御点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">componentName 找不到是三段式里最贵的一种失败</text>
  <rect x="20" y="84" width="200" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="120" y="102.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">一份 Schema</text>
  <text x="120" y="119" text-anchor="middle" font-size="7.5" fill="#4338CA">JSON 描述页面的样子</text>
  <text x="120" y="136.25" text-anchor="middle" font-size="7.5" fill="#4338CA">可由人手写驱动</text>
  <line x1="220" y1="130" x2="258" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="258" y="84" width="200" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="358" y="102.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">递归渲染器</text>
  <text x="358" y="119" text-anchor="middle" font-size="7.5" fill="#0F766E">查映射表 → 求值 props</text>
  <text x="358" y="136.25" text-anchor="middle" font-size="7.5" fill="#0F766E">→ 递归 children</text>
  <line x1="458" y1="130" x2="496" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="496" y="84" width="244" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="618" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">组件树 / DOM</text>
  <text x="618" y="119" text-anchor="middle" font-size="7.5" fill="#047857">交给宿主框架挂载</text>
  <text x="618" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">React / Vue</text>
  <rect x="10" y="208" width="176" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="98" y="226.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">组件缺失兜底</text>
  <text x="98" y="243" text-anchor="middle" font-size="7.5" fill="#B91C1C">返回 null + 记账上报</text>
  <text x="98" y="260.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">否则静默空白</text>
  <rect x="198" y="208" width="176" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="286" y="226.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">单节点错误边界</text>
  <text x="286" y="243" text-anchor="middle" font-size="7.5" fill="#C2410C">一个组件抛错</text>
  <text x="286" y="260.25" text-anchor="middle" font-size="7.5" fill="#C2410C">不拖垮整页</text>
  <rect x="386" y="208" width="176" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="474" y="226.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">props 求值隔离</text>
  <text x="474" y="243" text-anchor="middle" font-size="7.5" fill="#B45309">表达式写错</text>
  <text x="474" y="260.25" text-anchor="middle" font-size="7.5" fill="#B45309">不中断整棵渲染</text>
  <rect x="574" y="208" width="176" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="662" y="226.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">编辑态隔离</text>
  <text x="662" y="243" text-anchor="middle" font-size="7.5" fill="#6D28D9">编辑态不发真实请求</text>
  <text x="662" y="260.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">否则打爆后端</text>
  <text x="380" y="320" text-anchor="middle" font-size="9" fill="#475569">判据：未知组件不白屏、缺失被记账、单点错误被隔离、编辑态零请求</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
