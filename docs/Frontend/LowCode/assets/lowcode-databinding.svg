<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="352" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">逻辑层：数据源 / 状态 / 表达式 / 动作</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四层职责混在一起，逻辑就会失控</text>
  <rect x="10" y="76" width="176" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="98" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">数据源 DataSource</text>
  <text x="98" y="111" text-anchor="middle" font-size="7.2" fill="#1D4ED8">可刷新的异步数据（只读）</text>
  <text x="98" y="127.56" text-anchor="middle" font-size="7.2" fill="#1D4ED8">autoLoad / 缓存 / 失败兜底</text>
  <rect x="198" y="76" width="176" height="82" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="286" y="94.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">状态 State</text>
  <text x="286" y="111" text-anchor="middle" font-size="7.2" fill="#0F766E">页面内可变值</text>
  <text x="286" y="127.56" text-anchor="middle" font-size="7.2" fill="#0F766E">改数据走这里</text>
  <rect x="386" y="76" width="176" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="474" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">表达式 Expression</text>
  <text x="474" y="111" text-anchor="middle" font-size="7.2" fill="#047857">纯计算、无副作用</text>
  <text x="474" y="127.56" text-anchor="middle" font-size="7.2" fill="#047857">受限 AST 解释器</text>
  <rect x="574" y="76" width="176" height="82" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="662" y="94.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">动作 Action</text>
  <text x="662" y="111" text-anchor="middle" font-size="7.2" fill="#C2410C">一次副作用</text>
  <text x="662" y="127.56" text-anchor="middle" font-size="7.2" fill="#C2410C">串行短路或并行</text>
  <line x1="380" y1="158" x2="380" y2="182" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="184" width="740" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="202.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">运行时求值：解析依赖 → 求值表达式 → 按声明执行动作</text>
  <text x="380" y="258" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">作用域链（内层同名可覆盖外层，但保留前缀不可覆盖）</text>
  <rect x="10" y="274" width="176" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="98" y="292.2" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">全局 $env / $user</text>
  <text x="98" y="309" text-anchor="middle" font-size="7" fill="#334155">全部页面可见</text>
  <rect x="198" y="274" width="176" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="286" y="292.2" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">页面 dataSources / state / $route</text>
  <text x="286" y="309" text-anchor="middle" font-size="7" fill="#4338CA">本页可见</text>
  <rect x="386" y="274" width="176" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="474" y="292.2" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">列表项 item / index</text>
  <text x="474" y="309" text-anchor="middle" font-size="7" fill="#0F766E">仅列表内部</text>
  <rect x="574" y="274" width="176" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="662" y="292.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">组件局部内部状态</text>
  <text x="662" y="309" text-anchor="middle" font-size="7" fill="#047857">仅该组件</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
