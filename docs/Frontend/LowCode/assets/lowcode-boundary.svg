<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">低代码的四种形态与四层架构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">层与层之间只通过「协议」通信 —— 这是可维护性的最直接判据</text>
  <rect x="10" y="76" width="176" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="98" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">代码生成器</text>
  <text x="98" y="111" text-anchor="middle" font-size="7.5" fill="#334155">产物是真源码</text>
  <text x="98" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">改的人：研发</text>
  <rect x="198" y="76" width="176" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="286" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">JSON 渲染引擎</text>
  <text x="286" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">产物是一份 JSON</text>
  <text x="286" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">改的人：研发/实施</text>
  <rect x="386" y="76" width="176" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="474" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">可视化搭建器</text>
  <text x="474" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">产物是 Schema</text>
  <text x="474" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">改的人：研发+业务</text>
  <rect x="574" y="76" width="176" height="72" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="662" y="94.2" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">零代码平台</text>
  <text x="662" y="111" text-anchor="middle" font-size="7.5" fill="#BE185D">产物在平台里</text>
  <text x="662" y="128.25" text-anchor="middle" font-size="7.5" fill="#BE185D">改的人：纯业务</text>
  <line x1="380" y1="152" x2="380" y2="176" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="184" width="740" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="202.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">① 协议层 Schema</text>
  <text x="380" y="219" text-anchor="middle" font-size="7.5" fill="#4338CA">定义「页面长什么样」的契约 —— 唯一不能随便改的一层</text>
  <text x="380" y="226" text-anchor="middle" font-size="7" fill="#1E293B"></text>
  <rect x="10" y="242" width="740" height="48" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="260.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">② 渲染层 Renderer</text>
  <text x="380" y="277" text-anchor="middle" font-size="7.5" fill="#0F766E">把描述变成组件树 / DOM —— 唯一同时依赖协议与物料的一层</text>
  <text x="380" y="284" text-anchor="middle" font-size="7" fill="#1E293B"></text>
  <rect x="10" y="300" width="740" height="48" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="318.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">③ 物料层 Materials</text>
  <text x="380" y="335" text-anchor="middle" font-size="7.5" fill="#047857">提供可被描述的组件与其元信息 —— 决定平台表达能力的上限</text>
  <text x="380" y="342" text-anchor="middle" font-size="7" fill="#1E293B"></text>
  <rect x="10" y="358" width="740" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="376.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">④ 搭建层 Designer</text>
  <text x="380" y="393" text-anchor="middle" font-size="7.5" fill="#6D28D9">让人改描述 —— 代码量最大、bug 最集中的一层</text>
  <text x="380" y="400" text-anchor="middle" font-size="7" fill="#1E293B"></text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
