<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="960" height="340" rx="12" fill="#f8fafc"/><text x="480.0" y="34" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="600">双包结构：两条路径、两个语言档</text><rect x="60" y="70" width="380" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="250.0" y="92.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">入口 HTML</text><text x="250.0" y="112.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">type=module + nomodule</text><rect x="60" y="160" width="180" height="90" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><text x="150.0" y="199.4" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="600">现代包</text><text x="150.0" y="220.4" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#0f172a">es2017+</text><rect x="260" y="160" width="180" height="90" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="350.0" y="199.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">兼容包</text><text x="350.0" y="219.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">es5 + 全量 polyfill</text><line x1="200" y1="128" x2="150" y2="158" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="300" y1="128" x2="350" y2="1