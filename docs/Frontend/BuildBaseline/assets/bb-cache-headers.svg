<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="960" height="340" rx="12" fill="#f8fafc"/><text x="480.0" y="34" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="600">一次发布的四个步骤与两类缓存策略</text><rect x="55" y="80" width="190" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="150.0" y="111.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">① 上传产物</text><text x="150.0" y="131.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">带指纹</text><line x1="248" y1="117" x2="264" y2="117" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="267" y="80" width="190" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="362.0" y="111.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">② 校验可达</text><text x="362.0" y="131.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">抽查 200</text><line x1="460" y1="117" x2="476" y2="117" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="479" y="80" width="190" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="574.0" y="111.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">③ 切换 HTML</text><text x="574.0" y="131.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">no-cache</text><line x1="672" y1="117" x2="688" y2="117" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="691" y="80" width="190" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="786.0" y="111.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">④ 保留旧版</text><text x="786.0" y="131.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">N 天</text><rect x="55" y="196" width="400" height="92" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><text x="255.0" y="236.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">指纹资源</text><text x="255.0" y="256.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">public, max-age=31536000, immutable</text><rect x="505" y="196" width="400" height="92" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="705.0" y="236.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">HTML / sw.js</text><text x="705.0" y="256.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">no-cache（允许 304）</text><text x="480" y="312" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#be123c">顺序反了就是事故：新 HTML + 已删产物 = 白屏；旧页面 + 删除 chunk = 点按钮没反应</text></svg>
