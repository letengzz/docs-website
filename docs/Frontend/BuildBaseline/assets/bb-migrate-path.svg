<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="960" height="380" rx="12" fill="#f8fafc"/><text x="480.0" y="34" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="600">六步迁移与两处回滚岔口</text><rect x="40" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="105.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">① 盘点</text><text x="105.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">档位/占比</text><line x1="172" y1="113" x2="188" y2="113" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="190" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="255.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">② 决策</text><text x="255.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">三条路</text><line x1="322" y1="113" x2="338" y2="113" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="340" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="405.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">③ 切单包</text><text x="405.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">四处同改</text><line x1="472" y1="113" x2="488" y2="113" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="490" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="555.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">④ 补 API</text><text x="555.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">清单</text><line x1="622" y1="113" x2="638" y2="113" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="640" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="705.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">⑤ 验</text><text x="705.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">三组证据</text><line x1="772" y1="113" x2="788" y2="113" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="790" y="76" width="130" height="74" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><text x="855.0" y="107.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">⑥ 回滚</text><text x="855.0" y="127.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">十分钟</text><rect x="40" y="200" width="300" height="88" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="190.0" y="238.7" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">岔口 A：旧内核占比太高</text><text x="190.0" y="257.7" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a">维持双包，先做升级引导</text><rect x="400" y="200" width="300" height="88" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><text x="550.0" y="238.7" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">岔口 B：验收未过</text><text x="550.0" y="257.7" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a">回滚到上一版产物</text><line x1="255" y1="152" x2="200" y2="198" stroke="#b45309" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5 4"/><line x1="705" y1="152" x2="560" y2="198" stroke="#be123c" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="480" y="320" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#475569">系数都用可复算的：抬档省 38.4%（同源夹具）、双包 2.51×、按路由分包失效 11.2%</text><text x="480" y="344" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#475569">回滚开关本身必须用最低档语法写，否则旧内核上开关尚未生效脚本已失败</text></svg>
