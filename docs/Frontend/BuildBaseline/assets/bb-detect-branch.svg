<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="960" height="360" rx="12" fill="#f8fafc"/><text x="480.0" y="34" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="600">运行时检测的两条分支与三层回退</text><rect x="40" y="130" width="170" height="70" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="125.0" y="159.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">能力检测</text><text x="125.0" y="179.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">in / typeof / 试调</text><rect x="280" y="130" width="150" height="70" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="355.0" y="169.9" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#0f172a" font-weight="600">判定结果</text><line x1="212" y1="165" x2="278" y2="165" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><rect x="500" y="60" width="200" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><text x="600.0" y="86.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">增强层</text><text x="600.0" y="106.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">异步、局部刷新</text><rect x="500" y="176" width="200" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><text x="600.0" y="202.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="600">基础层</text><text x="600.0" y="222.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">表单提交、链接</text><line x1="432" y1="150" x2="498" y2="96" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><line x1="432" y1="180" x2="498" y2="206" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><text x="470" y="130" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#1d4ed8">支持</text><text x="470" y="205" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#b45309">不支持</text><rect x="740" y="60" width="180" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="830.0" y="86.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">装饰层</text><text x="830.0" y="106.5" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">动画可静默跳过</text><rect x="740" y="176" width="180" height="64" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><text x="830.0" y="202.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">检测代码</text><text x="830.0" y="222.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a">必须用最低档语法</text><line x1="702" y1="92" x2="738" y2="92" stroke="#334155" stroke-width="1.8" marker-end="url(#ah)"/><line x1="702" y1="208" x2="738" y2="208" stroke="#be123c" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="480" y="300" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#475569">检测结果缓存要带 TTL 与版本号：永久记住「不支持」会让升级后的用户继续被降级</text><text x="480" y="324" text-anchor=