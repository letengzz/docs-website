<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0D9488"/>
    </marker>
  </defs>
  <rect width="760" height="462" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">离线写的三段式：落盘 → 注册任务 → 补发与确认</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先落盘再发送。反过来（先发、失败再存）在页面被关掉时一定丢数据</text>

  <rect x="30" y="76" width="220" height="132" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="98" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">① 落盘 persist</text>
  <text x="140" y="118" text-anchor="middle" font-size="8" fill="#047857">把请求连同客户端幂等键写进 IDB</text>
  <text x="140" y="136" text-anchor="middle" font-size="8" fill="#047857">keyPath: 'id' 天然满足「只入队一次」</text>
  <text x="140" y="154" text-anchor="middle" font-size="8" fill="#047857">绝不用 localStorage：SW 读不到</text>
  <text x="140" y="172" text-anchor="middle" font-size="8" fill="#047857">记录 createdAt 与 attempts</text>
  <text x="140" y="192" text-anchor="middle" font-size="8" fill="#DC2626">此刻起数据才真正安全</text>
  <line x1="250" y1="142" x2="266" y2="142" stroke="#0D9488" stroke-width="2" marker-end="url(#arO)"/>

  <rect x="270" y="76" width="220" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="98" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">② 注册任务 register</text>
  <text x="380" y="118" text-anchor="middle" font-size="8" fill="#1D4ED8">特性检测 'sync' in registration</text>
  <text x="380" y="136" text-anchor="middle" font-size="8" fill="#1D4ED8">支持：register(tag)，页面关了也能发</text>
  <text x="380" y="154" text-anchor="middle" font-size="8" fill="#1D4ED8">不支持：立刻试一次，失败就留队列</text>
  <text x="380" y="172" text-anchor="middle" font-size="8" fill="#1D4ED8">sync 只是增强，不是唯一重试机制</text>
  <text x="380" y="192" text-anchor="middle" font-size="8" fill="#C2410C">iOS 与 Firefox 永远不会有 sync 事件</text>
  <line x1="490" y1="142" x2="506" y2="142" stroke="#0D9488" stroke-width="2" marker-end="url(#arO)"/>

  <rect x="510" y="76" width="220" height="132" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="620" y="98" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">③ 补发与确认 settle</text>
  <text x="620" y="118" text-anchor="middle" font-size="8" fill="#6D28D9">2xx 或 409 → 删除条目（都算成功）</text>
  <text x="620" y="136" text-anchor="middle" font-size="8" fill="#6D28D9">4xx → 丢弃并告知用户，重试无意义</text>
  <text x="620" y="154" text-anchor="middle" font-size="8" fill="#6D28D9">5xx / 网络异常 → 指数退避重试</text>
  <text x="620" y="172" text-anchor="middle" font-size="8" fill="#6D28D9">上限 8 次，超限标 failed 并暴露</text>
  <text x="620" y="192" text-anchor="middle" font-size="8" fill="#DC2626">成功要 postMessage 通知页面翻状态</text>

  <rect x="30" y="226" width="700" height="72" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="248" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">补发的三个触发点——任何一个生效都能把队列清空</text>
  <text x="380" y="268" text-anchor="middle" font-size="8.5" fill="#0F766E">① online 事件：页面开着时恢复网络 ｜ ② sync 事件：Chromium 支持，页面关了也能触发</text>
  <text x="380" y="288" text-anchor="middle" font-size="8.5" fill="#DC2626">③ 每次应用启动补发一次：跨平台唯一真正可靠的那条——iOS 上只有它生效</text>

  <rect x="30" y="316" width="700" height="94" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="338" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">Background Sync 的真实支持面（2026-10 · 全局覆盖约 76%~78%）</text>
  <text x="380" y="360" text-anchor="middle" font-size="8.5" fill="#065F46">支持：Chrome 49+ ｜ Edge 79+ ｜ Opera 42+ ｜ Samsung Internet 5+ ｜ Chrome for Android</text>
  <text x="380" y="380" text-anchor="middle" font-size="8.5" fill="#DC2626">不支持：Firefox（全平台）｜ Safari（macOS / iOS / iPadOS）｜ Chrome for iOS（内核是 WebKit）｜ Android WebView</text>
  <text x="380" y="400" text-anchor="middle" font-size="8.5" fill="#C2410C">Periodic Background Sync 更窄：仅已安装的 Chromium PWA 且需参与度门槛——不要作为设计前提</text>

  <text x="380" y="434" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">跨平台设计原则：按最窄的平台（iOS）来设计，其他平台自然也能跑</text>
  <text x="380" y="452" text-anchor="middle" font-size="9" fill="#64748B">队列可靠性的本质不是「能不能重试」而是「同一件事做多次也安全」——即幂等</text>
</svg>
