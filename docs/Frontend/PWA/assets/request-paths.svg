<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="480" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">接入 Service Worker 前后：一个 fetch 的三种命运</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">接入之后，「服务器日志」不再等于真实流量——缓存命中与兜底响应都不会出现在日志里</text>

  <rect x="30" y="76" width="700" height="40" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="101" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">页面里的 fetch()  —— 决策点在这里分叉</text>

  <rect x="30" y="146" width="330" height="216" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="170" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">没有 Service Worker</text>
  <rect x="50" y="186" width="290" height="56" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
  <text x="195" y="208" text-anchor="middle" font-size="9" fill="#991B1B">请求直接发往网络</text>
  <text x="195" y="226" text-anchor="middle" font-size="8" fill="#B91C1C">（每次访问都是真实回源）</text>
  <rect x="50" y="262" width="290" height="80" rx="6" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
  <text x="195" y="284" text-anchor="middle" font-size="9" fill="#991B1B">只有两种结局</text>
  <text x="195" y="304" text-anchor="middle" font-size="8" fill="#B91C1C">200 拿到内容 ／ 失败：白屏或错误页</text>
  <text x="195" y="322" text-anchor="middle" font-size="8" fill="#B91C1C">弱网 = 一直转圈，断网 = 什么都看不到</text>

  <rect x="400" y="146" width="330" height="216" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="565" y="170" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">接入 Service Worker 之后</text>
  <rect x="420" y="184" width="290" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="565" y="204" text-anchor="middle" font-size="9" fill="#1E3A8A">① 缓存命中：SW 直接返回，网络请求根本不发出</text>
  <text x="565" y="222" text-anchor="middle" font-size="8" fill="#1D4ED8">Network 面板显示 (ServiceWorker)，容易被误判为「没发出去」</text>
  <rect x="420" y="242" width="290" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="565" y="262" text-anchor="middle" font-size="9" fill="#1E3A8A">② 未命中：转发网络，响应可能被顺手写进缓存</text>
  <text x="565" y="280" text-anchor="middle" font-size="8" fill="#1D4ED8">是否写回由策略决定——这就是「缓存策略」的全部内容</text>
  <rect x="420" y="300" width="290" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="565" y="320" text-anchor="middle" font-size="9" fill="#1E3A8A">③ 网络失败：返回旧版本或离线兜底页</text>
  <text x="565" y="338" text-anchor="middle" font-size="8" fill="#1D4ED8">这类响应在服务端访问日志里完全不存在</text>

  <rect x="30" y="382" width="700" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="404" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">由此得到三条调试纪律</text>
  <text x="380" y="424" text-anchor="middle" font-size="8.5" fill="#047857">① 服务器日志不再等于真实流量，别拿「日志里没有」证明「用户没访问」</text>
  <text x="380" y="442" text-anchor="middle" font-size="8.5" fill="#047857">② Disable cache 不等于绕过 SW，要勾 Application 里的 Bypass for network</text>
  <text x="380" y="460" text-anchor="middle" font-size="8.5" fill="#047857">③ 改了文件却没生效，先怀疑 SW，再看业务代码</text>
</svg>
