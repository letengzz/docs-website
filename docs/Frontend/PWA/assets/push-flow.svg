<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Web Push 的四段链路与各自的失败点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四段里只有 ① 与 ④ 在你的代码里，② ③ 是别人的基础设施——这决定了排障的定位顺序</text>

  <rect x="30" y="70" width="700" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="380" y="90" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">「推」发生在第三段，而第三段的地址（endpoint）是第一段拿到的 → 排查永远从「这条 endpoint 还有效吗」开始</text>

  <rect x="30" y="112" width="160" height="142" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="134" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">① 订阅</text>
  <text x="110" y="152" text-anchor="middle" font-size="8" fill="#1D4ED8">跑在：你的页面</text>
  <text x="110" y="170" text-anchor="middle" font-size="8" fill="#1D4ED8">产出：endpoint + p256dh + auth</text>
  <text x="110" y="188" text-anchor="middle" font-size="8" fill="#1D4ED8">需要：SW 已 ready、VAPID 公钥</text>
  <text x="110" y="212" text-anchor="middle" font-size="8" fill="#DC2626">失败：权限被拒</text>
  <text x="110" y="230" text-anchor="middle" font-size="8" fill="#DC2626">失败：没走用户手势被忽略</text>
  <text x="110" y="248" text-anchor="middle" font-size="8" fill="#DC2626">失败：iOS 没装到主屏</text>
  <line x1="190" y1="183" x2="196" y2="183" stroke="#4F46E5" stroke-width="2" marker-end="url(#arB)"/>

  <rect x="200" y="112" width="160" height="142" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="280" y="134" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">② 发送</text>
  <text x="280" y="152" text-anchor="middle" font-size="8" fill="#6D28D9">跑在：你的服务端</text>
  <text x="280" y="170" text-anchor="middle" font-size="8" fill="#6D28D9">动作：VAPID 签名 + 加密载荷</text>
  <text x="280" y="188" text-anchor="middle" font-size="8" fill="#6D28D9">载荷：建议整体 ≤ 4KB</text>
  <text x="280" y="212" text-anchor="middle" font-size="8" fill="#DC2626">失败：401 签名错</text>
  <text x="280" y="230" text-anchor="middle" font-size="8" fill="#DC2626">失败：403 aud 不匹配</text>
  <text x="280" y="248" text-anchor="middle" font-size="8" fill="#DC2626">措施：401/403 要告警不是重试</text>
  <line x1="360" y1="183" x2="366" y2="183" stroke="#4F46E5" stroke-width="2" marker-end="url(#arB)"/>

  <rect x="370" y="112" width="160" height="142" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="450" y="134" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">③ 投递</text>
  <text x="450" y="152" text-anchor="middle" font-size="8" fill="#0F766E">跑在：厂商推送服务</text>
  <text x="450" y="170" text-anchor="middle" font-size="8" fill="#0F766E">FCM / APNs / Mozilla autopush</text>
  <text x="450" y="188" text-anchor="middle" font-size="8" fill="#0F766E">TTL 决定离线时保留多久</text>
  <text x="450" y="212" text-anchor="middle" font-size="8" fill="#DC2626">失败：404 / 410 订阅已死</text>
  <text x="450" y="230" text-anchor="middle" font-size="8" fill="#DC2626">纪律：收到 410 立刻删除记录</text>
  <text x="450" y="248" text-anchor="middle" font-size="8" fill="#0F766E">不清就会持续失败、污染统计</text>
  <line x1="530" y1="183" x2="536" y2="183" stroke="#4F46E5" stroke-width="2" marker-end="url(#arB)"/>

  <rect x="540" y="112" width="190" height="142" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="635" y="134" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">④ 展示</text>
  <text x="635" y="152" text-anchor="middle" font-size="8" fill="#047857">跑在：你的 Service Worker</text>
  <text x="635" y="170" text-anchor="middle" font-size="8" fill="#047857">push 事件 → showNotification()</text>
  <text x="635" y="188" text-anchor="middle" font-size="8" fill="#047857">notificationclick → 聚焦或新开</text>
  <text x="635" y="212" text-anchor="middle" font-size="8" fill="#DC2626">失败：没放进 waitUntil 被回收</text>
  <text x="635" y="230" text-anchor="middle" font-size="8" fill="#DC2626">失败：iOS 不发可见通知会撤权</text>
  <text x="635" y="248" text-anchor="middle" font-size="8" fill="#047857">用户手势是订阅的前提</text>

  <rect x="30" y="268" width="340" height="102" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">服务端订阅表的最小结构</text>
  <text x="200" y="310" text-anchor="middle" font-size="8.5" fill="#334155">endpoint（唯一索引）｜ p256dh ｜ auth ｜ user_id</text>
  <text x="200" y="328" text-anchor="middle" font-size="8.5" fill="#334155">topics（按类别订阅）｜ created_at</text>
  <text x="200" y="346" text-anchor="middle" font-size="8.5" fill="#334155">last_ok_at ｜ last_error_at（运维用）</text>
  <text x="200" y="364" text-anchor="middle" font-size="8.5" fill="#DC2626">先删死订阅，再谈发送成功率</text>

  <rect x="390" y="268" width="340" height="102" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="290" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">iOS 的六条硬限制（16.4+ 才支持）</text>
  <text x="560" y="310" text-anchor="middle" font-size="8.5" fill="#B91C1C">① 必须装到主屏并从图标打开 ② 必须用户手势触发</text>
  <text x="560" y="328" text-anchor="middle" font-size="8.5" fill="#B91C1C">③ 不支持 WKWebView（App 内浏览器）④ 必须展示可见通知</text>
  <text x="560" y="346" text-anchor="middle" font-size="8.5" fill="#B91C1C">⑤ 不支持 Background Sync ⑥ 走 APNs 但无需开发者账号</text>
  <text x="560" y="364" text-anchor="middle" font-size="8.5" fill="#991B1B">「iOS 不支持推送」是 2023 年 3 月前的旧结论</text>

  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">推送永远是「尽力而为」：设备关机、TTL 过期、用户静音都会丢——不要当成必达通道</text>
  <text x="380" y="424" text-anchor="middle" font-size="9.5" fill="#64748B">授权边界：只应向自己的订阅发送；endpoint 属设备级标识，按个人数据对待</text>
  <text x="380" y="446" text-anchor="middle" font-size="9.5" fill="#64748B">VAPID 私钥泄露 = 别人可以冒充你发通知，因此它必须进密钥管理而不是代码仓库</text>
</svg>
