<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">PWA 与离线应用：专题地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四项能力各自独立——先判断要哪几项，再决定写多少代码</text>

  <rect x="30" y="72" width="700" height="42" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="98" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">Manifest 决定「能不能装」，Service Worker 决定「能不能离线」，Push 决定「关掉页面还能不能找到你」</text>

  <rect x="30" y="130" width="220" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="152" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">概述：四项能力</text>
  <text x="140" y="172" text-anchor="middle" font-size="8" fill="#1D4ED8">可安装 / 可离线 / 可推送 / 可后台</text>
  <text x="140" y="190" text-anchor="middle" font-size="8" fill="#1D4ED8">SW 不在页面里：无 DOM、会休眠</text>
  <text x="140" y="208" text-anchor="middle" font-size="8" fill="#1D4ED8">什么时候不该上 PWA</text>

  <rect x="270" y="130" width="220" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="152" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">Service Worker 生命周期</text>
  <text x="380" y="172" text-anchor="middle" font-size="8" fill="#6D28D9">六阶段：install 到 redundant</text>
  <text x="380" y="190" text-anchor="middle" font-size="8" fill="#6D28D9">waiting 是更新问题的根源</text>
  <text x="380" y="208" text-anchor="middle" font-size="8" fill="#6D28D9">缓存版本与 activate 清理</text>

  <rect x="510" y="130" width="220" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="620" y="152" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">缓存策略</text>
  <text x="620" y="172" text-anchor="middle" font-size="8" fill="#4338CA">五种策略与各自失效模式</text>
  <text x="620" y="190" text-anchor="middle" font-size="8" fill="#4338CA">预缓存只放壳，接口按类缓存</text>
  <text x="620" y="208" text-anchor="middle" font-size="8" fill="#4338CA">导航回退与缓存配额</text>

  <rect x="30" y="230" width="220" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="252" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">离线数据与队列</text>
  <text x="140" y="272" text-anchor="middle" font-size="8" fill="#047857">Cache / IndexedDB / OPFS 分工</text>
  <text x="140" y="290" text-anchor="middle" font-size="8" fill="#047857">先落盘再发送，幂等键去重</text>
  <text x="140" y="308" text-anchor="middle" font-size="8" fill="#047857">Background Sync 只有 Chromium</text>

  <rect x="270" y="230" width="220" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="252" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">消息推送</text>
  <text x="380" y="272" text-anchor="middle" font-size="8" fill="#0F766E">四段链路与各自的失败点</text>
  <text x="380" y="290" text-anchor="middle" font-size="8" fill="#0F766E">VAPID 私钥只能留在服务端</text>
  <text x="380" y="308" text-anchor="middle" font-size="8" fill="#0F766E">iOS 六条硬限制</text>

  <rect x="510" y="230" width="220" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="252" text-anchor="middle" font-size="10.5" fill="#9A3412" font-weight="bold">安装体验</text>
  <text x="620" y="272" text-anchor="middle" font-size="8" fill="#C2410C">Manifest 逐字段与三家判据</text>
  <text x="620" y="290" text-anchor="middle" font-size="8" fill="#C2410C">SW 已不是安装硬门槛</text>
  <text x="620" y="308" text-anchor="middle" font-size="8" fill="#C2410C">没有安装按钮的排查表</text>

  <rect x="30" y="330" width="220" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="140" y="352" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">框架与构建落地</text>
  <text x="140" y="372" text-anchor="middle" font-size="8" fill="#B91C1C">Vite / Nuxt / 无插件三路线</text>
  <text x="140" y="390" text-anchor="middle" font-size="8" fill="#B91C1C">开发期默认不注册 SW</text>
  <text x="140" y="408" text-anchor="middle" font-size="8" fill="#B91C1C">sw.js 固定名 + no-cache</text>

  <rect x="270" y="330" width="220" height="88" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#0F172A" font-weight="bold">实战：博客前台</text>
  <text x="380" y="372" text-anchor="middle" font-size="8" fill="#334155">壳 / 内容快照 / 兜底页三层</text>
  <text x="380" y="390" text-anchor="middle" font-size="8" fill="#334155">六步落地，每步一条判据</text>
  <text x="380" y="408" text-anchor="middle" font-size="8" fill="#334155">P1~P10 验收断言</text>

  <rect x="510" y="330" width="220" height="88" rx="8" fill="#FDF4FF" stroke="#A21CAF" stroke-width="1.6"/>
  <text x="620" y="352" text-anchor="middle" font-size="10.5" fill="#86198F" font-weight="bold">常见问题与最佳实践</text>
  <text x="620" y="372" text-anchor="middle" font-size="8" fill="#A21CAF">按现象分诊的排查树</text>
  <text x="620" y="390" text-anchor="middle" font-size="8" fill="#A21CAF">十二问 + 上线自查 12 项</text>
  <text x="620" y="408" text-anchor="middle" font-size="8" fill="#A21CAF">最佳实践 12 条</text>

  <text x="380" y="448" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">出口判据：断网时不白屏、联网时看到最新、改了代码用户能升上去</text>
</svg>
