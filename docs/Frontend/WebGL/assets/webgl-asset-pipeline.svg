<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="glTF 资源管线">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">资源管线：一个 GLB 从磁盘到显存要过五道关</text>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="56" width="150" height="84" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="115" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">① 网络下载</text>
    <text x="115" y="101" text-anchor="middle" font-size="10.5" fill="#64748b">.glb 单文件最优</text>
    <text x="115" y="119" text-anchor="middle" font-size="10.5" fill="#64748b">gzip / br 压缩</text>

    <rect x="210" y="56" width="150" height="84" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="285" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">② 解析</text>
    <text x="285" y="101" text-anchor="middle" font-size="10.5" fill="#64748b">GLTFLoader.parse</text>
    <text x="285" y="119" text-anchor="middle" font-size="10.5" fill="#64748b">构建节点树/材质/动画</text>

    <rect x="380" y="56" width="150" height="84" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="455" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">③ 解码</text>
    <text x="455" y="101" text-anchor="middle" font-size="10.5" fill="#64748b">Draco 几何 / Meshopt</text>
    <text x="455" y="119" text-anchor="middle" font-size="10.5" fill="#64748b">KTX2 纹理转码</text>

    <rect x="550" y="56" width="150" height="84" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="625" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">④ 上传</text>
    <text x="625" y="101" text-anchor="middle" font-size="10.5" fill="#64748b">几何 → VBO</text>
    <text x="625" y="119" text-anchor="middle" font-size="10.5" fill="#64748b">纹理 → 显存纹理对象</text>

    <rect x="720" y="56" width="120" height="84" rx="8" fill="#ecfdf5" stroke="#0d9488"/>
    <text x="780" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">⑤ 入场景</text>
    <text x="780" y="101" text-anchor="middle" font-size="10.5" fill="#64748b">scene.add</text>
    <text x="780" y="119" text-anchor="middle" font-size="10.5" fill="#64748b">开始参与渲染</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M190 98 H210"/><path d="M360 98 H380"/><path d="M530 98 H550"/><path d="M700 98 H720"/>
  </g>
  <g fill="#94a3b8">
    <path d="M208 98 l-7 -4 v8 z"/><path d="M378 98 l-7 -4 v8 z"/><path d="M548 98 l-7 -4 v8 z"/><path d="M718 98 l-7 -4 v8 z"/>
  </g>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="164" width="400" height="110" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="60" y="188" font-size="12.5" font-weight="700" fill="#1e40af">为什么主线是 glTF</text>
    <text x="60" y="212" font-size="11" fill="#475569">· JSON 描述的开放标准，Khronos 维护，Blender / Maya / 3ds Max 均原生导出</text>
    <text x="60" y="232" font-size="11" fill="#475569">· 一个文件装下网格、材质、贴图、动画、相机、骨骼，不用再面对 OBJ + MTL 的碎片</text>
    <text x="60" y="252" font-size="11" fill="#475569">· 与 PBR 参数一一对应，导入后不用重新配材质</text>
    <text x="60" y="268" font-size="11" fill="#b45309">· .glb 是二进制封装版，体积与请求数都更优，线上优先用 .glb</text>

    <rect x="460" y="164" width="380" height="110" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="480" y="188" font-size="12.5" font-weight="700" fill="#b91c1c">压缩三件套与它们的代价</text>
    <text x="480" y="212" font-size="11" fill="#475569">Draco —— 几何压缩，体积降 60%~90%，但需要解码器（约 200KB）与额外 CPU</text>
    <text x="480" y="232" font-size="11" fill="#475569">Meshopt —— 解码更快、体积略大，适合移动端对帧率敏感的场景</text>
    <text x="480" y="252" font-size="11" fill="#475569">KTX2 / Basis —— GPU 原生压缩纹理，显存占用降 4~6 倍</text>
    <text x="480" y="268" font-size="11" fill="#b45309">代价：三者都让「工具链」变长，源文件要重新导出一次</text>
  </g>

  <rect x="40" y="290" width="800" height="94" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="60" y="314" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#b45309">内存这一关：加载完别忘了「用完还回去」</text>
  <text x="60" y="338" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">几何、材质、纹理、渲染目标都在显存里，JS 的垃圾回收管不到它们；scene.remove() 只是从图里摘掉，不释放显存</text>
  <text x="60" y="360" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">判据：反复加载/卸载模型，renderer.info.memory.geometries 与 .textures 应回到基线，否则就是漏了 dispose()</text>
</svg>
