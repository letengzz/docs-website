<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="实战场景模块架构">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">实战场景结构：六个模块，各自只干一件事</text>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="300" y="52" width="280" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">main.js（装配与帧循环）</text>
    <text x="440" y="93" text-anchor="middle" font-size="10.5" fill="#64748b">创建 → 装配 → setAnimationLoop → 销毁</text>

    <rect x="40" y="146" width="240" height="66" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="160" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">scene.js</text>
    <text x="160" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">Scene / 光照 / 地面 / 环境贴图</text>
    <text x="160" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">只负责「场景里有什么」</text>

    <rect x="300" y="146" width="240" height="66" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="420" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">bars.js</text>
    <text x="420" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">InstancedMesh 数据柱体 + 高度映射</text>
    <text x="420" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">只负责「数据 → 几何」</text>

    <rect x="560" y="146" width="280" height="66" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="700" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">controls.js</text>
    <text x="700" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">OrbitControls + 自动旋转策略</text>
    <text x="700" y="205" text-anchor="middle" font-size="10.5" fill="#64748b">只负责「怎么看」</text>

    <rect x="170" y="240" width="240" height="66" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="290" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">picking.js</text>
    <text x="290" y="284" text-anchor="middle" font-size="10.5" fill="#64748b">Raycaster + 实例 id + tooltip</text>
    <text x="290" y="299" text-anchor="middle" font-size="10.5" fill="#64748b">只负责「点到了谁」</text>

    <rect x="450" y="240" width="260" height="66" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="580" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">perf.js</text>
    <text x="580" y="284" text-anchor="middle" font-size="10.5" fill="#64748b">像素比上限 / 视锥剔除 / 指标采样</text>
    <text x="580" y="299" text-anchor="middle" font-size="10.5" fill="#64748b">只负责「别掉帧」</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <path d="M340 104 V124 H160 V146"/>
    <path d="M420 104 V146"/>
    <path d="M540 104 V124 H700 V146"/>
    <path d="M400 212 V226 H290 V240"/>
    <path d="M500 212 V226 H580 V240"/>
  </g>

  <rect x="40" y="326" width="800" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="60" y="350" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#b45309">为什么值得这样拆</text>
  <text x="60" y="372" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">换数据源只改 bars.js；换交互只改 picking.js；上生产前只加 perf.js —— 每个模块都能被单独验证，也单独被替换</text>
</svg>
