<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="GLSL 三种数据通道">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">GLSL 的三种数据通道：attribute / uniform / varying</text>

  <rect x="40" y="56" width="240" height="96" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="160" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#334155">JS / CPU 侧</text>
  <text x="160" y="103" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569">缓冲区（每个顶点一份）</text>
  <text x="160" y="123" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569">uniforms（整场共享一份）</text>
  <text x="160" y="143" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569">纹理（采样器）</text>

  <rect x="340" y="56" width="240" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="460" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">顶点着色器</text>
  <text x="460" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#1e40af">attribute vec3 position;</text>
  <text x="460" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#1e40af">uniform mat4 projectionMatrix;</text>
  <text x="460" y="143" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#1e40af">varying vec3 vWorld;</text>

  <rect x="640" y="56" width="200" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488"/>
  <text x="740" y="80" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">片元着色器</text>
  <text x="740" y="103" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f766e">varying vec3 vWorld;</text>
  <text x="740" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#0f766e">uniform sampler2D map;</text>
  <text x="740" y="143" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#64748b">attribute 在这里不可见</text>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M280 104 H340"/><path d="M580 104 H640"/>
  </g>
  <g fill="#94a3b8"><path d="M338 104 l-7 -4 v8 z"/><path d="M638 104 l-7 -4 v8 z"/></g>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="176" width="260" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="200" font-size="12.5" font-weight="700" fill="#334155">attribute</text>
    <text x="60" y="222" font-size="11" fill="#475569">每个顶点各不相同</text>
    <text x="60" y="242" font-size="11" fill="#475569">由几何体缓冲区分段喂入</text>
    <text x="60" y="262" font-size="11" fill="#b45309">只在顶点着色器可见</text>

    <rect x="310" y="176" width="260" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="330" y="200" font-size="12.5" font-weight="700" fill="#334155">uniform</text>
    <text x="330" y="222" font-size="11" fill="#475569">一次绘制内所有顶点/片元共享</text>
    <text x="330" y="242" font-size="11" fill="#475569">由 JS 每帧或按需更新</text>
    <text x="330" y="262" font-size="11" fill="#b45309">两个着色器都能读，都不能写</text>

    <rect x="580" y="176" width="260" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="600" y="200" font-size="12.5" font-weight="700" fill="#334155">varying</text>
    <text x="600" y="222" font-size="11" fill="#475569">顶点阶段算出，传给片元阶段</text>
    <text x="600" y="242" font-size="11" fill="#475569">两个着色器里必须同名同类型</text>
    <text x="600" y="262" font-size="11" fill="#b45309">三角面内自动做插值</text>
  </g>

  <rect x="40" y="300" width="800" height="84" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="60" y="324" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#b45309">自定义材质绕不开的两个判断</text>
  <text x="60" y="348" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">· 只是改颜色/加边缘光？用 ShaderMaterial，顶点部分照抄默认写法即可</text>
  <text x="60" y="370" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">· 要动顶点位置（波浪、旗帜）？记得也要修正法线，否则光照会错——或者改用只改颜色的近似方案</text>
</svg>
