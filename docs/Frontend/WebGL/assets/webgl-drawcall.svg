<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="draw call 与批处理">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">性能第一杠杆：把 draw call 数量降下来</text>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="52" width="256" height="150" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="168" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">① 一万个独立 Mesh</text>
    <g fill="#fecaca" stroke="#dc2626" stroke-width="0.8">
      <rect x="66" y="90" width="14" height="14"/><rect x="84" y="90" width="14" height="14"/><rect x="102" y="90" width="14" height="14"/><rect x="120" y="90" width="14" height="14"/><rect x="138" y="90" width="14" height="14"/><rect x="156" y="90" width="14" height="14"/><rect x="174" y="90" width="14" height="14"/><rect x="192" y="90" width="14" height="14"/><rect x="210" y="90" width="14" height="14"/><rect x="228" y="90" width="14" height="14"/><rect x="246" y="90" width="14" height="14"/><rect x="264" y="90" width="14" height="14"/>
      <rect x="66" y="110" width="14" height="14"/><rect x="84" y="110" width="14" height="14"/><rect x="102" y="110" width="14" height="14"/><rect x="120" y="110" width="14" height="14"/><rect x="138" y="110" width="14" height="14"/><rect x="156" y="110" width="14" height="14"/><rect x="174" y="110" width="14" height="14"/><rect x="192" y="110" width="14" height="14"/><rect x="210" y="110" width="14" height="14"/><rect x="228" y="110" width="14" height="14"/><rect x="246" y="110" width="14" height="14"/><rect x="264" y="110" width="14" height="14"/>
    </g>
    <text x="168" y="146" text-anchor="middle" font-size="11" fill="#475569">10000 次 draw call</text>
    <text x="168" y="166" text-anchor="middle" font-size="11" fill="#475569">JS 侧一万次矩阵更新</text>
    <text x="168" y="186" text-anchor="middle" font-size="11" fill="#b45309">CPU 先扛不住，GPU 在空转</text>

    <rect x="312" y="52" width="256" height="150" rx="8" fill="#ecfdf5" stroke="#0d9488"/>
    <text x="440" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">② InstancedMesh（推荐）</text>
    <rect x="342" y="92" width="196" height="34" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="1"/>
    <text x="440" y="114" text-anchor="middle" font-size="11" fill="#0f766e">一次几何 + 一万个实例矩阵</text>
    <text x="440" y="146" text-anchor="middle" font-size="11" fill="#475569">1 次 draw call</text>
    <text x="440" y="166" text-anchor="middle" font-size="11" fill="#475569">矩阵存进实例缓冲，GPU 侧展开</text>
    <text x="440" y="186" text-anchor="middle" font-size="11" fill="#b45309">前提：共用几何与材质</text>

    <rect x="584" y="52" width="256" height="150" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="712" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">③ 合并几何（静态场景）</text>
    <rect x="614" y="92" width="196" height="34" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <text x="712" y="114" text-anchor="middle" font-size="11" fill="#1e40af">所有顶点烘进一个 BufferGeometry</text>
    <text x="712" y="146" text-anchor="middle" font-size="11" fill="#475569">1 次 draw call</text>
    <text x="712" y="166" text-anchor="middle" font-size="11" fill="#475569">适合完全不动的场景元素</text>
    <text x="712" y="186" text-anchor="middle" font-size="11" fill="#b45309">缺点：没法单独控制某个物体</text>
  </g>

  <rect x="40" y="218" width="800" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="242" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#334155">先量再改：三个必看的数字</text>
  <text x="60" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1e40af">renderer.info.render.calls          // 本帧 draw call 数，目标的头号指标</text>
  <text x="60" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#1e40af">renderer.info.render.triangles      // 本帧三角形数；renderer.info.memory.* 看显存对象数</text>

  <rect x="40" y="310" width="800" height="74" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="60" y="334" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#b45309">经验阈值（1080p、中端集成显卡、目标 60fps）</text>
  <text x="60" y="356" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">draw call 控制在数百以内很轻松；上千开始明显吃 CPU；过万基本必须批处理 —— 但真正的判据永远是「先测，再改」</text>
  <text x="60" y="376" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">三角形数在十万级以前通常不是瓶颈，别为了减面数牺牲画面</text>
</svg>
