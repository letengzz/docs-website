<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Three.js 对象树与变换继承">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">场景图：变换沿父子关系向下相乘</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">
    <rect x="330" y="52" width="220" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="78" text-anchor="middle" fill="#1e3a8a">Scene</text>

    <rect x="120" y="126" width="200" height="42" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="220" y="147" text-anchor="middle" fill="#334155">Group「地面」</text>
    <text x="220" y="162" text-anchor="middle" font-size="10.5" fill="#64748b">y = -1</text>

    <rect x="360" y="126" width="200" height="42" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="460" y="147" text-anchor="middle" fill="#334155">Group「机器人」</text>
    <text x="460" y="162" text-anchor="middle" font-size="10.5" fill="#64748b">position (2, 0, 0)</text>

    <rect x="600" y="126" width="220" height="42" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
    <text x="710" y="147" text-anchor="middle" fill="#0f766e">PerspectiveCamera</text>
    <text x="710" y="162" text-anchor="middle" font-size="10.5" fill="#64748b">也可以挂在树上</text>

    <rect x="330" y="204" width="180" height="42" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="420" y="225" text-anchor="middle" fill="#334155">Mesh「身体」</text>
    <text x="420" y="240" text-anchor="middle" font-size="10.5" fill="#64748b">y = 1.2</text>

    <rect x="530" y="204" width="180" height="42" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="620" y="225" text-anchor="middle" fill="#334155">Mesh「手臂」</text>
    <text x="620" y="240" text-anchor="middle" font-size="10.5" fill="#64748b">rotation.z = 0.5</text>

    <rect x="430" y="282" width="180" height="42" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="520" y="303" text-anchor="middle" fill="#b45309">Mesh「手指」</text>
    <text x="520" y="318" text-anchor="middle" font-size="10.5" fill="#64748b">(0, 0, 0)</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M400 94 V110 H220 V126"/>
    <path d="M440 94 V126"/>
    <path d="M480 94 V110 H710 V126"/>
    <path d="M460 168 V186 H420 V204"/>
    <path d="M460 168 V186 H620 V204"/>
    <path d="M420 246 V264 H520 V282"/>
  </g>

  <rect x="24" y="344" width="832" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="440" y="362" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#334155">「手指」的世界坐标 = 机器人(2,0,0) × 身体(y+1.2) × 手臂(旋转 0.5 rad) × 手指(0,0,0) —— 中间任何一环变了，整条链一起动</text>
  <text x="440" y="379" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b">这正是「动一个关节，整条手臂跟着动」能自然实现的原因；也是层级太深时容易算错变换的原因</text>
</svg>
