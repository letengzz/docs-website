<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="WebGL 与 WebGPU 边界">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f172a">WebGL 与 WebGPU：不是「新旧」关系，而是两条成本不同的路</text>

  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="52" width="390" height="196" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="235" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">WebGL 2.0</text>
    <text x="60" y="104" font-size="11.5" fill="#475569">规范状态：已定稿，不再新增特性（长期维护）</text>
    <text x="60" y="126" font-size="11.5" fill="#475569">浏览器：Baseline 广泛可用，覆盖率约 95%+</text>
    <text x="60" y="148" font-size="11.5" fill="#475569">能力：光栅渲染、实例化、变换反馈、3D 纹理、MRT</text>
    <text x="60" y="170" font-size="11.5" fill="#b91c1c">不能做：通用计算（compute shader）、无绑定纹理、显式内存管理</text>
    <text x="60" y="192" font-size="11.5" fill="#475569">写法：GLSL ES 3.0，三行矩阵乘法就能画出东西</text>
    <text x="60" y="214" font-size="11.5" fill="#0f766e">优点：文档与示例极多，生态成熟，调试经验好找</text>
    <text x="60" y="236" font-size="11.5" fill="#475569">three 中的入口：new THREE.WebGLRenderer()</text>

    <rect x="450" y="52" width="390" height="196" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="645" y="78" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">WebGPU</text>
    <text x="470" y="104" font-size="11.5" fill="#475569">规范状态：W3C Candidate Recommendation Draft（2026-09-15）</text>
    <text x="470" y="126" font-size="11.5" fill="#475569">浏览器：约 85%~87%，Safari 26 起补齐；Linux 与 Android 仍在推进</text>
    <text x="470" y="148" font-size="11.5" fill="#475569">能力：显式管线状态、计算着色器、渲染包、间接绘制</text>
    <text x="470" y="170" font-size="11.5" fill="#0f766e">能做：粒子/物理/后处理在 GPU 上算，减少 CPU 往返</text>
    <text x="470" y="192" font-size="11.5" fill="#475569">写法：WGSL；three 里用 TSL 写一次，编译到 WGSL 与 GLSL</text>
    <text x="470" y="214" font-size="11.5" fill="#b91c1c">代价：初始化异步、手写 GLSL 的材质与 EffectComposer 后处理需要改写</text>
    <text x="470" y="236" font-size="11.5" fill="#475569">three 中的入口：new THREE.WebGPURenderer()（自动回落 WebGL 2）</text>
  </g>

  <rect x="40" y="262" width="800" height="76" rx="10" fill="#ecfdf5" stroke="#0d9488"/>
  <text x="60" y="286" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">什么时候不值得为 WebGPU 付迁移成本</text>
  <text x="60" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">· 瓶颈在贴图体积、模型下载、着色器编译时间 —— 这些换渲染后端不会变好</text>
  <text x="60" y="328" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569">· 大量手写 GLSL 的 ShaderMaterial、onBeforeCompile、pmndrs/postprocessing 链路 —— 需要逐条改写成 TSL</text>
</svg>
