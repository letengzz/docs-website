<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="512" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">微前端的集成方式选型与共享依赖策略</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「需要独立部署 + 隔离」→ 运行时；「同产品内解耦 + 体积最优」→ 构建期</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四种集成方式：隔离强度与接入成本只能二选一</text>
  <rect x="30" y="88" width="150" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="105" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">方案</text>
  <rect x="180" y="88" width="100" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="230" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">隔离性</text>
  <rect x="280" y="88" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="345" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">通信</text>
  <rect x="410" y="88" width="100" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="460" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">性能</text>
  <rect x="510" y="88" width="90" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="555" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">接入成本</text>
  <rect x="600" y="88" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="695" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">推荐场景</text>
  <rect x="30" y="114" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="130" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">iframe</text>
  <rect x="180" y="114" width="100" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="130" text-anchor="middle" font-size="7.5" fill="#334155">最强</text>
  <rect x="280" y="114" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="130" text-anchor="middle" font-size="7.5" fill="#334155">postMessage</text>
  <rect x="410" y="114" width="100" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="130" text-anchor="middle" font-size="7.5" fill="#334155">差</text>
  <rect x="510" y="114" width="90" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="555" y="130" text-anchor="middle" font-size="7.5" fill="#334155">最低</text>
  <rect x="600" y="114" width="190" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="695" y="130" text-anchor="middle" font-size="7.5" fill="#334155">老系统 / 不信任的三方代码</text>
  <rect x="30" y="140" width="150" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="156" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">运行时 JS（qiankun）</text>
  <rect x="180" y="140" width="100" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="156" text-anchor="middle" font-size="7.5" fill="#334155">中</text>
  <rect x="280" y="140" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="156" text-anchor="middle" font-size="7.5" fill="#334155">props / 事件 / URL</text>
  <rect x="410" y="140" width="100" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="156" text-anchor="middle" font-size="7.5" fill="#334155">中</text>
  <rect x="510" y="140" width="90" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="555" y="156" text-anchor="middle" font-size="7.5" fill="#334155">中</text>
  <rect x="600" y="140" width="190" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="695" y="156" text-anchor="middle" font-size="7.5" fill="#334155">存量多、渐进迁移</text>
  <rect x="30" y="166" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="182" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">构建期 MF</text>
  <rect x="180" y="166" width="100" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="182" text-anchor="middle" font-size="7.5" fill="#334155">弱</text>
  <rect x="280" y="166" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="182" text-anchor="middle" font-size="7.5" fill="#334155">直接 import</text>
  <rect x="410" y="166" width="100" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="182" text-anchor="middle" font-size="7.5" fill="#334155">最好</text>
  <rect x="510" y="166" width="90" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="555" y="182" text-anchor="middle" font-size="7.5" fill="#334155">中高</text>
  <rect x="600" y="166" width="190" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="695" y="182" text-anchor="middle" font-size="7.5" fill="#334155">同栈、追求体积最优</text>
  <rect x="30" y="192" width="150" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="208" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">Web Components</text>
  <rect x="180" y="192" width="100" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="208" text-anchor="middle" font-size="7.5" fill="#334155">强</text>
  <rect x="280" y="192" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="208" text-anchor="middle" font-size="7.5" fill="#334155">属性 + 事件</text>
  <rect x="410" y="192" width="100" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="208" text-anchor="middle" font-size="7.5" fill="#334155">中</text>
  <rect x="510" y="192" width="90" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="555" y="208" text-anchor="middle" font-size="7.5" fill="#334155">中</text>
  <rect x="600" y="192" width="190" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="695" y="208" text-anchor="middle" font-size="7.5" fill="#334155">新项目、想少踩沙箱坑</text>
  <text x="60" y="250" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">共享依赖的三种处理（体积与耦合的取舍）</text>
  <rect x="30" y="262" width="226" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="143" y="280.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">完全独立</text>
  <text x="143" y="297" text-anchor="middle" font-size="7.5" fill="#B91C1C">每个子应用打自己的依赖</text>
  <text x="143" y="314.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">Vue 会被加载三次</text>
  <text x="143" y="331.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">耦合最低，体积最大</text>
  <rect x="266" y="262" width="226" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="379" y="280.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">共享运行时</text>
  <text x="379" y="297" text-anchor="middle" font-size="7.5" fill="#B45309">主应用提供到 window</text>
  <text x="379" y="314.25" text-anchor="middle" font-size="7.5" fill="#B45309">子应用 external 排除</text>
  <text x="379" y="331.5" text-anchor="middle" font-size="7.5" fill="#B45309">体积小，但版本必须锁死</text>
  <rect x="502" y="262" width="228" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="616" y="280.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">构建期共享（MF）</text>
  <text x="616" y="297" text-anchor="middle" font-size="7.5" fill="#047857">shared 按 semver 自动去重</text>
  <text x="616" y="314.25" text-anchor="middle" font-size="7.5" fill="#047857">版本冲突可编译期发现</text>
  <text x="616" y="331.5" text-anchor="middle" font-size="7.5" fill="#047857">体积最优</text>
  <line x1="30" y1="372" x2="730" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="398" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">边界定的越早，后面越省事</text>
  <rect x="30" y="410" width="350" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="205" y="428.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">正确顺序</text>
  <text x="205" y="445" text-anchor="middle" font-size="7.5" fill="#047857">先定路由表（唯一来源，禁止重叠）</text>
  <text x="205" y="462.25" text-anchor="middle" font-size="7.5" fill="#047857">再定数据属主（谁能写）</text>
  <text x="205" y="479.5" text-anchor="middle" font-size="7.5" fill="#047857">最后定集成方式与样式隔离强度</text>
  <rect x="390" y="410" width="340" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="428.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">常见错误</text>
  <text x="560" y="445" text-anchor="middle" font-size="7.5" fill="#B91C1C">先选框架再想边界</text>
  <text x="560" y="462.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">把所有状态放进一个全局 store</text>
  <text x="560" y="479.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">靠文档约定共享依赖版本（无强制力）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
