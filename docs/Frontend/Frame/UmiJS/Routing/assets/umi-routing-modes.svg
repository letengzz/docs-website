<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="UmiJS 约定式与配置式两种路由方式">
  <defs>
    <marker id="ur-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">同一套路由，两条来的路</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Umi 的两套写法最终编译成同一张路由表；混用的代价是「谁都说不清某个 URL 从哪来」。</text>

  <rect x="30" y="84" width="404" height="196" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">约定式：目录树即路由表</text>
  <rect x="50" y="124" width="364" height="46" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="62" y="143" font-family="ui-monospace, monospace" font-size="11" fill="#334155">src/pages/users/index.tsx</text>
  <text x="62" y="161" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">→ /users</text>
  <rect x="50" y="176" width="364" height="46" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="62" y="195" font-family="ui-monospace, monospace" font-size="11" fill="#334155">src/pages/users/$id.tsx</text>
  <text x="62" y="213" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">→ /users/:id（动态段）</text>
  <rect x="50" y="228" width="364" height="40" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="62" y="253" font-family="ui-monospace, monospace" font-size="11" fill="#334155">$ 前缀 = 动态 · _layout.tsx = 布局 · 404.tsx = 兜底</text>

  <rect x="466" y="84" width="404" height="196" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="486" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">配置式：routes 数组</text>
  <rect x="486" y="124" width="364" height="46" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="498" y="143" font-family="ui-monospace, monospace" font-size="11" fill="#334155">{ path: '/users/:id',</text>
  <text x="498" y="161" font-family="ui-monospace, monospace" font-size="11" fill="#1d4ed8">  component: '@/pages/users' }</text>
  <rect x="486" y="176" width="364" height="46" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="498" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#334155">显式写出来 → 可加 wrappers / 权限 / 重定向</text>
  <text x="498" y="213" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：新增页面要记得同步改这份数组</text>
  <rect x="486" y="228" width="364" height="40" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="498" y="253" font-family="system-ui, sans-serif" font-size="11" fill="#334155">开了 routes 配置，约定式就会整体失效（不是叠加）</text>

  <rect x="30" y="294" width="840" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="319" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">路由钩子的执行顺序（同一次跳转内，顺序是固定的）</text>
  <rect x="50" y="330" width="150" height="38" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="125" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">onRouteChange 开始</text>
  <rect x="230" y="330" width="150" height="38" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="305" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">权限 / 重定向判断</text>
  <rect x="410" y="330" width="150" height="38" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="485" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">加载路由组件</text>
  <rect x="590" y="330" width="150" height="38" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="665" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">完成 / 上报</text>
  <path d="M 200 349 L 230 349" stroke="#475569" stroke-width="1.6" marker-end="url(#ur-arrow)"/>
  <path d="M 380 349 L 410 349" stroke="#475569" stroke-width="1.6" marker-end="url(#ur-arrow)"/>
  <path d="M 560 349 L 590 349" stroke="#475569" stroke-width="1.6" marker-end="url(#ur-arrow)"/>

  <rect x="30" y="400" width="840" height="76" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="50" y="424" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">选型只看一件事：路由是否需要「因人而异」</text>
  <text x="50" y="447" font-family="system-ui, sans-serif" font-size="12" fill="#334155">不需要（纯页面跳转）→ 用约定式，新增页面零配置；需要（不同角色看到不同菜单、按租户挂不同子应用）</text>
  <text x="50" y="468" font-family="system-ui, sans-serif" font-size="12" fill="#334155">→ 用配置式，把规则集中在一处。两者混用是后续最主要的「路由不生效」来源。</text>
</svg>
