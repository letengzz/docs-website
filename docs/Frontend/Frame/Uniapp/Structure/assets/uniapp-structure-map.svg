<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="UniApp 项目结构与多端编译关系">
  <defs>
    <marker id="us-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">一套源码，多端产物：目录里哪些是「共用的」</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">UniApp 的结构问题本质是「哪一份代码会被编译成哪个端的产物」；把归属搞错，就会出现「微信小程序好好的、H5 白屏」。</text>

  <rect x="30" y="84" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">六个约定文件 / 目录</text>
  <text x="50" y="136" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">pages.json</text>
  <text x="50" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#334155">路由 + 窗口样式 + 分包（不进代码包逻辑）</text>
  <text x="50" y="178" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">manifest.json</text>
  <text x="50" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#334155">各端 AppID / 权限 / 打包配置</text>
  <text x="50" y="220" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">App.vue</text>
  <text x="50" y="237" font-family="system-ui, sans-serif" font-size="11" fill="#334155">应用生命周期（只在这一个文件里能写）</text>
  <text x="50" y="262" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">main.js</text>
  <text x="50" y="279" font-family="system-ui, sans-serif" font-size="11" fill="#334155">创建实例 + 挂全局插件</text>
  <text x="50" y="304" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">static/</text>

  <rect x="30" y="322" width="330" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="50" y="345" font-family="ui-monospace, monospace" font-size="11" fill="#0f766e">uni_modules/</text>
  <text x="50" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#334155">可插拔插件：有自己的页面、组件与配置</text>

  <rect x="384" y="84" width="240" height="230" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="404" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">编译期</text>
  <text x="404" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155">条件编译按平台取代码：</text>
  <text x="404" y="158" font-family="ui-monospace, monospace" font-size="10" fill="#334155">#ifdef MP-WEIXIN</text>
  <text x="404" y="176" font-family="ui-monospace, monospace" font-size="10" fill="#334155">#endif</text>
  <text x="404" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#334155">静态资源被平台格式约束：</text>
  <text x="404" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#334155">小程序包体上限、不支持 svg 外链、</text>
  <text x="404" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#334155">不支持部分 CSS 选择器</text>
  <text x="404" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">这一层决定了</text>
  <text x="404" y="289" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">「同一份代码能不能共用」</text>

  <rect x="648" y="84" width="222" height="230" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="668" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">产物端</text>
  <rect x="668" y="124" width="182" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="680" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#334155">微信 / 支付宝小程序</text>
  <rect x="668" y="164" width="182" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="680" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#334155">H5（浏览器）</text>
  <rect x="668" y="204" width="182" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="680" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#334155">App（iOS / Android）</text>
  <rect x="668" y="244" width="182" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="680" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#334155">快应用 / 鸿蒙等</text>
  <text x="668" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">每端都有自己的能力差集</text>

  <path d="M 360 200 L 384 200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#us-arrow)"/>
  <path d="M 624 200 L 648 200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#us-arrow)"/>

  <rect x="30" y="392" width="840" height="82" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="50" y="416" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">结构层面最容易被忽略的两处</text>
  <text x="50" y="439" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① 把业务页面放进了 /static —— 它不经编译，改了不刷新、也不参与分包策略；</text>
  <text x="50" y="461" font-family="system-ui, sans-serif" font-size="12" fill="#334155">② 应用级生命周期写进了页面 —— 只有 App.vue 里的 onLaunch / onShow 会在整包只跑一次；</text>
</svg>
