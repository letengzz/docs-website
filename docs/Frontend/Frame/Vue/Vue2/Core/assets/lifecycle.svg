<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Vue 2 生命周期：四个阶段与八个钩子</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">created 有数据没 DOM · mounted 才有 DOM · beforeDestroy 是清理的唯一入口</text>

  <rect x="30" y="78" width="200" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">创建</text>
  <line x1="50" y1="118" x2="210" y2="118" stroke="#c7d2fe" stroke-width="1"/>
  <text x="130" y="142" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">beforeCreate</text>
  <text x="130" y="166" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">created</text>
  <text x="130" y="192" text-anchor="middle" font-size="11" fill="#059669">可发请求</text>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#b91c1c">$el 还不可用</text>

  <rect x="240" y="78" width="200" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="340" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">挂载</text>
  <line x1="260" y1="118" x2="420" y2="118" stroke="#a7f3d0" stroke-width="1"/>
  <text x="340" y="142" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">beforeMount</text>
  <text x="340" y="166" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">mounted</text>
  <text x="340" y="192" text-anchor="middle" font-size="11" fill="#059669">$el / 子实例可用</text>
  <text x="340" y="212" text-anchor="middle" font-size="11" fill="#4b5563">第三方库初始化</text>

  <rect x="450" y="78" width="200" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">更新</text>
  <line x1="470" y1="118" x2="630" y2="118" stroke="#fde68a" stroke-width="1"/>
  <text x="550" y="142" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">beforeUpdate</text>
  <text x="550" y="166" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">updated</text>
  <text x="550" y="192" text-anchor="middle" font-size="11" fill="#b91c1c">updated 里别改数据</text>
  <text x="550" y="212" text-anchor="middle" font-size="11" fill="#4b5563">否则触发死循环</text>

  <rect x="660" y="78" width="190" height="150" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="755" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#be123c">销毁</text>
  <line x1="680" y1="118" x2="830" y2="118" stroke="#fecdd3" stroke-width="1"/>
  <text x="755" y="142" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">beforeDestroy</text>
  <text x="755" y="166" text-anchor="middle" font-size="12" font-family="monospace" fill="#4b5563">destroyed</text>
  <text x="755" y="192" text-anchor="middle" font-size="11" fill="#059669">清定时器 / 监听 / 订阅</text>
  <text x="755" y="212" text-anchor="middle" font-size="11" fill="#b91c1c">漏了就是内存泄漏</text>

  <path d="M230 153 L238 153" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M440 153 L448 153" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M650 153 L658 153" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="30" y="248" width="820" height="106" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">父子组件的顺序：父 mounted 在所有子 mounted 之后</text>
  <text x="60" y="300" font-size="12" font-family="monospace" fill="#4b5563">父 created → 父 beforeMount → 子 created → 子 beforeMount → 子 mounted → 父 mounted</text>
  <text x="60" y="326" font-size="12" fill="#4b5563">销毁方向相反：父 beforeDestroy 先执行，子的 destroyed 后执行</text>
  <text x="60" y="346" font-size="11" fill="#64748b">要「等子组件 DOM 就绪」用父的 mounted；只要「自己的 DOM 就绪」用自身的 mounted</text>

  <rect x="30" y="368" width="820" height="94" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="440" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">命名版本差异</text>
  <text x="60" y="420" font-size="12" fill="#4b5563">Vue 2：beforeCreate / created / beforeMount / mounted / beforeUpdate / updated / beforeDestroy / destroyed</text>
  <text x="60" y="444" font-size="12" fill="#4b5563">Vue 3：末两个改名为 onBeforeUnmount / onUnmounted，其余同名，Composition API 中写作 onMounted 形式</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
