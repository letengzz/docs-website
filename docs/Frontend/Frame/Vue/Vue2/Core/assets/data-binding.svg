<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Vue 2 数据绑定：两个方向</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">v-bind 只往下走，v-model 是「绑定 + 事件」的语法糖</text>

  <rect x="60" y="88" width="330" height="220" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="225" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">v-bind —— 单向，数据 → 视图</text>
  <line x1="82" y1="130" x2="368" y2="130" stroke="#c7d2fe" stroke-width="1"/>
  <text x="225" y="158" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">v-bind:src="url"</text>
  <text x="225" y="180" text-anchor="middle" font-size="12" fill="#4b5563">简写：:src="url"</text>
  <text x="82" y="212" font-size="12" fill="#4b5563">data.url 变了 → 属性自动更新</text>
  <text x="82" y="236" font-size="12" fill="#4b5563">视图改了属性 → data 不会变</text>
  <text x="82" y="268" font-size="12" fill="#059669">适用：几乎所有 HTML 属性、class、style</text>
  <text x="82" y="292" font-size="12" fill="#b91c1c">坑：对象/数组字面量每次渲染都会新建</text>

  <rect x="490" y="88" width="330" height="220" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">v-model —— 双向</text>
  <line x1="512" y1="130" x2="798" y2="130" stroke="#a7f3d0" stroke-width="1"/>
  <text x="655" y="158" text-anchor="middle" font-size="13" font-family="monospace" fill="#1f2937">v-model="msg"</text>
  <text x="655" y="180" text-anchor="middle" font-size="12" fill="#4b5563">等价于 :value + @input</text>
  <text x="512" y="212" font-size="12" fill="#4b5563">data 变了 → 输入框更新</text>
  <text x="512" y="236" font-size="12" fill="#4b5563">用户输入 → data 同步更新</text>
  <text x="512" y="268" font-size="12" fill="#059669">适用：表单控件（input / select / textarea）</text>
  <text x="512" y="292" font-size="12" fill="#b91c1c">坑：组件上默认绑 value / input 两个约定</text>

  <path d="M392 198 L486 198" stroke="#475569" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah2)"/>

  <rect x="60" y="328" width="760" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">响应式的边界（Vue 2 用 Object.defineProperty，不是 Proxy）</text>
  <text x="440" y="378" text-anchor="middle" font-size="12" fill="#4b5563">新增/删除属性、按下标改数组都检测不到 —— 必须用 $set / $delete 或整体替换</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
