<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Next 版本与渲染模式的选择路径">
  <defs>
    <marker id="no-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">先定路由方案，再定渲染时机</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">这两个决定发生在写第一行业务代码之前。事后改基本等于重做，所以值得先花十分钟对齐。</text>

  <rect x="30" y="84" width="404" height="128" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3730a3">App Router（app/）</text>
  <text x="50" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155">默认服务端组件 · 支持嵌套布局与流式渲染</text>
  <text x="50" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#334155">新项目与需要 SEO 的站点首选</text>
  <text x="50" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#334155">代价：服务端 / 客户端边界需要主动设计</text>
  <text x="50" y="197" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">要求 React 18+</text>

  <rect x="466" y="84" width="404" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="486" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pages Router（pages/）</text>
  <text x="486" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155">模型简单 · 数据获取靠 getServerSideProps / getStaticProps</text>
  <text x="486" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#334155">存量项目与「只想要一个约定少的框架」仍可用</text>
  <text x="486" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#334155">官方仍在维护，新特性优先给 App Router</text>
  <text x="486" y="197" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">两套可以共存于一个项目（迁移期）</text>

  <rect x="30" y="230" width="840" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="256" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">四种渲染时机：把「什么时候算 HTML」拆开看</text>
  <rect x="50" y="270" width="192" height="72" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="66" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">构建时（SSG）</text>
  <text x="66" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#334155">最快，内容可预先知道</text>
  <text x="66" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：改内容要重新构建</text>

  <rect x="254" y="270" width="192" height="72" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="270" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">增量（ISR）</text>
  <text x="270" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#334155">静态 + 过期后台重建</text>
  <text x="270" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：一个窗口内的旧内容</text>

  <rect x="458" y="270" width="192" height="72" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="474" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">请求时（SSR）</text>
  <text x="474" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#334155">每次请求都实时算</text>
  <text x="474" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：TTFB 取决于数据源</text>

  <rect x="662" y="270" width="192" height="72" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="678" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">浏览器（CSR）</text>
  <text x="678" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#334155">首屏空白、之后填充</text>
  <text x="678" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：SEO 与首屏体验最差</text>

  <rect x="30" y="374" width="840" height="92" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="50" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">环境要求与版本纪律</text>
  <text x="50" y="421" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Node 需满足所选 Next 主版本的下限（每个主版本会抬高一次）；包管理器锁定一份 lockfile，不要混用 npm / pnpm / yarn。</text>
  <text x="50" y="443" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Next 的主版本有破坏性变更，升级前先读该版本的升级指南，别直接改版本号跑 install。</text>
</svg>
