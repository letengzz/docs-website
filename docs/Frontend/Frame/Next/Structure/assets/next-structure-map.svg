<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="Next 项目结构与目录特殊文件">
  <defs>
    <marker id="ns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">app/ 下的七个特殊文件名，各自绑定一个时机</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">它们不是「命名习惯」，而是 Next 认得的槽位。放错名字不会报错，只是那个能力静默不生效——这是本项目结构最常见的坑。</text>

  <rect x="30" y="84" width="430" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">一个目录的完整外观（以 /shop/[id] 为例）</text>
  <text x="50" y="136" font-family="ui-monospace, monospace" font-size="11" fill="#334155">app/</text>
  <text x="50" y="156" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ layout.tsx      外壳，跨路由保留</text>
  <text x="50" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ page.tsx        ← 有它才是路由段</text>
  <text x="50" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ loading.tsx     这一层的骨架屏</text>
  <text x="50" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ error.tsx       这一层出错时的兜底（客户端）</text>
  <text x="50" y="236" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ not-found.tsx   找不到时的页面</text>
  <text x="50" y="256" font-family="ui-monospace, monospace" font-size="11" fill="#334155">└─ route.ts        ← 与 page.tsx 互斥的接口出口</text>

  <rect x="480" y="84" width="390" height="196" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">同目录下的普通文件会被忽略</text>
  <text x="500" y="136" font-family="ui-monospace, monospace" font-size="11" fill="#334155">app/shop/[id]/</text>
  <text x="500" y="156" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ CartSummary.tsx   组件（共置）</text>
  <text x="500" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ utils.ts          工具函数</text>
  <text x="500" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#334155">├─ page.test.tsx     测试</text>
  <text x="500" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#334155">└─ page.module.css   样式</text>
  <text x="500" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#334155">共置的价值是「改一个页面只动一个目录」；</text>
  <text x="500" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#334155">代价是页面目录会变长，需要靠命名区分职责。</text>

  <rect x="30" y="294" width="840" height="86" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="50" y="318" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">两条硬约束，越早知道越省事</text>
  <text x="50" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① 同一个目录里 page.tsx 与 route.ts 不能共存——一个是页面、一个是接口，Next 无法替你选。</text>
  <text x="50" y="364" font-family="system-ui, sans-serif" font-size="12" fill="#334155">② error.tsx 必须是客户端组件（要接住渲染期异常），所以它不能是 async 的、也不能直接读数据库。</text>

  <rect x="30" y="394" width="840" height="80" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="50" y="418" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">与服务端 / 客户端边界的关系</text>
  <text x="50" y="441" font-family="system-ui, sans-serif" font-size="12" fill="#334155">默认全是服务端组件；只有标了 'use client' 的文件（及其 import 链）才进浏览器包。所以边界不是「页面级」，是文件级：</text>
  <text x="50" y="462" font-family="system-ui, sans-serif" font-size="12" fill="#334155">把 'use client' 尽量往叶子推，是控制首屏包体积最有效的一步。</text>
</svg>
