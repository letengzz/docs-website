<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Next 嵌套布局的复用边界">
  <defs>
    <marker id="nl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">布局是嵌套的，但「谁会被重建」不嵌套</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">导航时 Next 只替换最内层变化的那一段；但 layout 保状态、template 每次重建——这条差别决定了动画与副作用写在哪里。</text>

  <rect x="30" y="84" width="560" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">页面被切成可以独立替换的层</text>

  <rect x="50" y="124" width="520" height="44" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="66" y="145" font-family="ui-monospace, monospace" font-size="11" fill="#3730a3">app/layout.tsx</text>
  <text x="66" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#334155">html / body · 全局导航 · 主题 Provider　（跨所有路由共享）</text>

  <rect x="50" y="176" width="520" height="44" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="66" y="197" font-family="ui-monospace, monospace" font-size="11" fill="#065f46">app/(shop)/layout.tsx</text>
  <text x="66" y="213" font-family="system-ui, sans-serif" font-size="11" fill="#334155">分组布局 · 只在 /shop 下生效（路由组名不进 URL）</text>

  <rect x="50" y="228" width="520" height="44" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="66" y="249" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">app/(shop)/cart/layout.tsx</text>
  <text x="66" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#334155">段布局 · 再嵌一层，只有购物车相关页复用</text>

  <rect x="50" y="280" width="520" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="66" y="301" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">app/(shop)/cart/page.tsx</text>
  <text x="66" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#334155">真正变化的那一层 —— 导航时被替换的就是它</text>

  <path d="M 310 168 L 310 176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nl-arrow)"/>
  <path d="M 310 220 L 310 228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nl-arrow)"/>
  <path d="M 310 272 L 310 280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nl-arrow)"/>

  <rect x="610" y="84" width="260" height="140" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="630" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">layout.tsx</text>
  <text x="630" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#334155">跨路由导航时不卸载</text>
  <text x="630" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#334155">state 保留 · 不重新请求</text>
  <text x="630" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#334155">适合：导航栏、Provider、</text>
  <text x="630" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#334155">常驻的 WebSocket 连接</text>
  <text x="630" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">看不到孩子的 loading/error</text>

  <rect x="610" y="236" width="260" height="148" rx="12" fill="#fef2f2" stroke="#f87171"/>
  <text x="630" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#991b1b">template.tsx</text>
  <text x="630" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#334155">每次导航都重建</text>
  <text x="630" y="304" font-family="system-ui, sans-serif" font-size="11" fill="#334155">state 清空 · 副作用重跑</text>
  <text x="630" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#334155">适合：入场动画、埋点</text>
  <text x="630" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「每次进页面都要做一次」</text>
  <text x="630" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">用错会表现为「状态莫名丢失」</text>

  <rect x="30" y="398" width="840" height="82" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="50" y="422" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">三条判据，够选对 90% 的情况</text>
  <text x="50" y="445" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① 要在页面之间保留状态 → layout；② 要页面切换时重置 → template；③ 只想给一组页面加同样的外壳 → 路由组布局。</text>
  <text x="50" y="467" font-family="system-ui, sans-serif" font-size="12" fill="#334155">四层嵌套是常见上限：再深就该问「这层布局是不是其实是一个组件」。</text>
</svg>
