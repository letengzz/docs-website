<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="464" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四种渲染模式的对照与选择判据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选错了不是性能差一点，而是整个技术栈选错</text>
  <rect x="30" y="74" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="95" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">模式</text>
  <rect x="160" y="74" width="160" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="240" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">渲染时机</text>
  <rect x="320" y="74" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="375" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">首屏</text>
  <rect x="430" y="74" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="485" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">SEO</text>
  <rect x="540" y="74" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="595" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">服务端成本</text>
  <rect x="650" y="74" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="705" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">适用</text>
  <rect x="30" y="100" width="130" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="95" y="116" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">SSR</text>
  <rect x="160" y="100" width="160" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="240" y="116" text-anchor="middle" font-size="8" fill="#334155">每次请求</text>
  <rect x="320" y="100" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="116" text-anchor="middle" font-size="8" fill="#334155">快</text>
  <rect x="430" y="100" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="485" y="116" text-anchor="middle" font-size="8" fill="#334155">好</text>
  <rect x="540" y="100" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="595" y="116" text-anchor="middle" font-size="8" fill="#334155">高</text>
  <rect x="650" y="100" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="705" y="116" text-anchor="middle" font-size="8" fill="#334155">内容随用户/时间变</text>
  <rect x="30" y="128" width="130" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="95" y="144" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">SSG</text>
  <rect x="160" y="128" width="160" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="240" y="144" text-anchor="middle" font-size="8" fill="#334155">构建时</text>
  <rect x="320" y="128" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="144" text-anchor="middle" font-size="8" fill="#334155">最快</text>
  <rect x="430" y="128" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="485" y="144" text-anchor="middle" font-size="8" fill="#334155">好</text>
  <rect x="540" y="128" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="595" y="144" text-anchor="middle" font-size="8" fill="#334155">零</text>
  <rect x="650" y="128" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="705" y="144" text-anchor="middle" font-size="8" fill="#334155">内容固定、可 CDN</text>
  <rect x="30" y="156" width="130" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="95" y="172" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">ISR / SWR</text>
  <rect x="160" y="156" width="160" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="240" y="172" text-anchor="middle" font-size="8" fill="#334155">首次访问触发</text>
  <rect x="320" y="156" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="172" text-anchor="middle" font-size="8" fill="#334155">快</text>
  <rect x="430" y="156" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="485" y="172" text-anchor="middle" font-size="8" fill="#334155">好</text>
  <rect x="540" y="156" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="595" y="172" text-anchor="middle" font-size="8" fill="#334155">低</text>
  <rect x="650" y="156" width="110" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="705" y="172" text-anchor="middle" font-size="8" fill="#334155">定期更新可容忍陈旧</text>
  <rect x="30" y="184" width="130" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="95" y="200" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">SPA</text>
  <rect x="160" y="184" width="160" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="240" y="200" text-anchor="middle" font-size="8" fill="#334155">浏览器里</text>
  <rect x="320" y="184" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="200" text-anchor="middle" font-size="8" fill="#334155">慢</text>
  <rect x="430" y="184" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="485" y="200" text-anchor="middle" font-size="8" fill="#334155">差</text>
  <rect x="540" y="184" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="595" y="200" text-anchor="middle" font-size="8" fill="#334155">零</text>
  <rect x="650" y="184" width="110" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="705" y="200" text-anchor="middle" font-size="8" fill="#334155">登录后应用界面</text>
  <text x="380" y="234" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">判据只有两条，按顺序问</text>
  <rect x="30" y="248" width="350" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="205" y="266.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 内容需要被搜索引擎抓取吗？</text>
  <text x="205" y="283" text-anchor="middle" font-size="7.5" fill="#334155">不需要 → 直接 SPA（ssr: false）</text>
  <text x="205" y="300.25" text-anchor="middle" font-size="7.5" fill="#334155">别为无 SEO 的页面付服务端成本</text>
  <text x="205" y="317.5" text-anchor="middle" font-size="7.5" fill="#334155">后台管理页是典型例子</text>
  <rect x="390" y="248" width="340" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="266.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">② 同一份内容对所有人一致且变化慢吗？</text>
  <text x="560" y="283" text-anchor="middle" font-size="7.5" fill="#047857">是 → SSG（构建期生成，成本为零）</text>
  <text x="560" y="300.25" text-anchor="middle" font-size="7.5" fill="#047857">否 → SSR 或 ISR</text>
  <text x="560" y="317.5" text-anchor="middle" font-size="7.5" fill="#047857">默认从 SSG 起步</text>
  <rect x="30" y="340" width="700" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="358.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">各自的隐藏代价</text>
  <text x="380" y="375" text-anchor="middle" font-size="8" fill="#B45309">SSR：服务端要扛与用户等量的并发；页面里的慢查询直接拖慢首屏；window / localStorage 不存在</text>
  <text x="380" y="393.4" text-anchor="middle" font-size="8" fill="#B45309">SSG：内容更新必须重新构建；页面数上万时构建时间线性增长</text>
  <text x="380" y="411.8" text-anchor="middle" font-size="8" fill="#B45309">SPA：首屏与 SEO 都放弃，换来最简部署（静态托管）与最少运行成本</text>
  <text x="380" y="446" text-anchor="middle" font-size="9.5" fill="#1E3A8A">最省事的起点是 SSG：产物是纯静态文件，任意 CDN 都能托管，没有进程要运维</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
