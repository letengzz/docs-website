<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="508" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Nuxt 数据获取：payload 复用与请求瀑布</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">客户端复用服务端取到的数据，不重复请求</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">服务端取数一次，序列化进 HTML，客户端复用（hydration 不再请求）</text>
  <rect x="30" y="92" width="226" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="143" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">① 浏览器请求页面</text>
  <line x1="256" y1="123" x2="268" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="92" width="226" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="110.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">② Nitro 执行 setup()</text>
  <line x1="494" y1="123" x2="506" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="92" width="226" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="619" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">③ useFetch 在服务端直连后端</text>
  <rect x="30" y="168" width="226" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="143" y="186.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 渲染成 HTML + 内联 payload</text>
  <line x1="256" y1="199" x2="268" y2="199" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="168" width="226" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="381" y="186.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">⑤ 浏览器立即显示首屏</text>
  <line x1="494" y1="199" x2="506" y2="199" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="168" width="226" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="619" y="186.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">⑥ hydration 从 payload 取值</text>
  <line x1="619" y1="154" x2="619" y2="161" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="619" y1="161" x2="143" y2="161" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="143" y1="161" x2="143" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="236" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">第 ⑥ 步是理解 Nuxt 数据获取的关键：同一个 key 的请求只发一次</text>
  <text x="60" y="268" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">三个 API 的分工</text>
  <rect x="30" y="280" width="150" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="105" y="297" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">API</text>
  <rect x="180" y="280" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="245" y="297" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">是否服务端跑</text>
  <rect x="310" y="280" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="375" y="297" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">是否被 payload 复用</text>
  <rect x="440" y="280" width="380" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="630" y="297" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">用在哪</text>
  <rect x="30" y="306" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="322" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">$fetch</text>
  <rect x="180" y="306" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="322" text-anchor="middle" font-size="8" fill="#334155">会（但只发一次）</text>
  <rect x="310" y="306" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="322" text-anchor="middle" font-size="8" fill="#334155">不会</text>
  <rect x="440" y="306" width="380" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="322" text-anchor="middle" font-size="8" fill="#334155">事件处理：点击、提交表单</text>
  <rect x="30" y="332" width="150" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="348" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">useAsyncData</text>
  <rect x="180" y="332" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="348" text-anchor="middle" font-size="8" fill="#334155">会</text>
  <rect x="310" y="332" width="130" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="348" text-anchor="middle" font-size="8" fill="#334155">会</text>
  <rect x="440" y="332" width="380" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="348" text-anchor="middle" font-size="8" fill="#334155">非 HTTP 的异步源、需要预取的数据</text>
  <rect x="30" y="358" width="150" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="374" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">useFetch</text>
  <rect x="180" y="358" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="374" text-anchor="middle" font-size="8" fill="#334155">会</text>
  <rect x="310" y="358" width="130" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="375" y="374" text-anchor="middle" font-size="8" fill="#334155">会</text>
  <rect x="440" y="358" width="380" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="374" text-anchor="middle" font-size="8" fill="#334155">组件里取一个接口（最常见）</text>
  <text x="380" y="396" text-anchor="middle" font-size="9.5" fill="#B91C1C">在 onMounted 里用 $fetch 会「服务端不跑、客户端再发一次」→ 首屏白屏 + 请求翻倍</text>
  <rect x="30" y="412" width="350" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="205" y="430.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">key 必须稳定且唯一</text>
  <text x="205" y="447" text-anchor="middle" font-size="7.5" fill="#B91C1C">含时间戳/随机数 → 服务端与客户端不一致</text>
  <text x="205" y="464.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">列表里用固定 key → 子组件串数据</text>
  <text x="205" y="481.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">参数变了要体现在 key 里，否则切页不重取</text>
  <rect x="390" y="412" width="340" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="430.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">避免请求瀑布</text>
  <text x="560" y="447" text-anchor="middle" font-size="7.5" fill="#B45309">顶层多个 await useFetch = 串行</text>
  <text x="560" y="464.25" text-anchor="middle" font-size="7.5" fill="#B45309">改 Promise.all 或拆子组件并行</text>
  <text x="560" y="481.5" text-anchor="middle" font-size="7.5" fill="#B45309">父组件 await 权限接口会拖慢所有子请求</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
