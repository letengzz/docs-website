<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="436" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Nuxt 的三种代码与三个运行时位置</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">app/ 是前端，server/ 是服务端，Nitro 把服务端打成跨运行时产物</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一个仓库，三种代码，三个运行时位置</text>
  <rect x="60" y="92" width="138" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="129" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">浏览器（客户端）</text>
  <text x="129" y="127" text-anchor="middle" font-size="7" fill="#1D4ED8">app/pages · app/components</text>
  <text x="129" y="143.1" text-anchor="middle" font-size="7" fill="#1D4ED8">app/composables · app/middleware</text>
  <text x="129" y="159.2" text-anchor="middle" font-size="7" fill="#1D4ED8">hydration 复用 payload</text>
  <rect x="214" y="92" width="138" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="283" y="110.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">Nitro（服务端）</text>
  <text x="283" y="127" text-anchor="middle" font-size="7" fill="#6D28D9">server/api · server/routes</text>
  <text x="283" y="143.1" text-anchor="middle" font-size="7" fill="#6D28D9">server/middleware · server/utils</text>
  <text x="283" y="159.2" text-anchor="middle" font-size="7" fill="#6D28D9">server/plugins · 自动导入</text>
  <rect x="368" y="92" width="138" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="437" y="110.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">构建产物</text>
  <text x="437" y="127" text-anchor="middle" font-size="7" fill="#0F766E">.output/public · .output/server</text>
  <text x="437" y="143.1" text-anchor="middle" font-size="7" fill="#0F766E">index.mjs 已内联依赖</text>
  <text x="437" y="159.2" text-anchor="middle" font-size="7" fill="#0F766E">无需 node_modules</text>
  <rect x="522" y="92" width="138" height="108" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="591" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">外部系统</text>
  <text x="591" y="127" text-anchor="middle" font-size="7" fill="#334155">数据库 · 缓存 · 第三方 API</text>
  <text x="591" y="143.1" text-anchor="middle" font-size="7" fill="#334155">私有密钥只在服务端可见</text>
  <text x="591" y="159.2" text-anchor="middle" font-size="7" fill="#334155">同源代理避免 CORS</text>
  <line x1="198" y1="146" x2="214" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="352" y1="146" x2="368" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="506" y1="146" x2="522" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="30" y1="220" x2="730" y2="220" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="246" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">渲染模式决定「谁来渲染 HTML」，这是 Nuxt 的第一个决策</text>
  <rect x="30" y="258" width="172" height="82" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="116" y="276.2" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">SSR</text>
  <text x="116" y="293" text-anchor="middle" font-size="7.5" fill="#6D28D9">每次请求服务端渲染</text>
  <text x="116" y="310.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">有服务端成本</text>
  <text x="116" y="327.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">个性化内容 + SEO</text>
  <rect x="214" y="258" width="172" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="300" y="276.2" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">SSG</text>
  <text x="300" y="293" text-anchor="middle" font-size="7.5" fill="#047857">构建期生成静态 HTML</text>
  <text x="300" y="310.25" text-anchor="middle" font-size="7.5" fill="#047857">零服务端成本</text>
  <text x="300" y="327.5" text-anchor="middle" font-size="7.5" fill="#047857">内容相对固定</text>
  <rect x="398" y="258" width="172" height="82" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="484" y="276.2" text-anchor="middle" font-size="11" fill="#115E59" font-weight="bold">ISR / SWR</text>
  <text x="484" y="293" text-anchor="middle" font-size="7.5" fill="#0F766E">首次访问触发重建</text>
  <text x="484" y="310.25" text-anchor="middle" font-size="7.5" fill="#0F766E">按需重建，成本低</text>
  <text x="484" y="327.5" text-anchor="middle" font-size="7.5" fill="#0F766E">可容忍短暂陈旧</text>
  <rect x="582" y="258" width="172" height="82" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="668" y="276.2" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="bold">SPA</text>
  <text x="668" y="293" text-anchor="middle" font-size="7.5" fill="#334155">浏览器里渲染</text>
  <text x="668" y="310.25" text-anchor="middle" font-size="7.5" fill="#334155">无 SEO、首屏慢</text>
  <text x="668" y="327.5" text-anchor="middle" font-size="7.5" fill="#334155">登录后界面</text>
  <rect x="30" y="356" width="700" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="374.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">混合渲染：用 routeRules 按路由配置，不必全站统一</text>
  <text x="380" y="391" text-anchor="middle" font-size="8" fill="#4338CA">prerender 构建期静态 · swr 缓存 N 秒 · ssr:false 仅客户端 · proxy 反向代理 · redirect 重定向</text>
  <text x="380" y="409.4" text-anchor="middle" font-size="8" fill="#4338CA">个性化路由绝不能配 swr —— 缓存是按 URL 的，不含用户身份，会串数据</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
