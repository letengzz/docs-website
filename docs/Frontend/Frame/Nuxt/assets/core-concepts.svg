<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">五个核心机制：在哪定义、何时执行、在哪一端</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「路由中间件管不了 API」是最常见的误解——两类中间件运行在完全不同的层</text>

  <!-- 表头 -->
  <rect x="30" y="74" width="140" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="100" y="92" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">机制</text>
  <rect x="170" y="74" width="210" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="275" y="92" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">在哪定义</text>
  <rect x="380" y="74" width="190" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="475" y="92" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">何时执行</text>
  <rect x="570" y="74" width="160" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="650" y="92" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">在哪一端</text>

  <!-- 行 1 -->
  <rect x="30" y="102" width="140" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="122" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">自动导入</text>
  <text x="100" y="138" text-anchor="middle" font-size="7.5" fill="#64748B">少写 import</text>
  <rect x="170" y="102" width="210" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="122" text-anchor="middle" font-size="8" fill="#334155">composables/ utils/ components/</text>
  <text x="275" y="138" text-anchor="middle" font-size="7.5" fill="#64748B">+ Nuxt / Vue 内置 API</text>
  <rect x="380" y="102" width="190" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="475" y="122" text-anchor="middle" font-size="8" fill="#334155">构建期生成导入表</text>
  <text x="475" y="138" text-anchor="middle" font-size="7.5" fill="#64748B">事实表在 .nuxt/imports.d.ts</text>
  <rect x="570" y="102" width="160" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="130" text-anchor="middle" font-size="8" fill="#334155">两端（同构）</text>

  <!-- 行 2 -->
  <rect x="30" y="148" width="140" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="168" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">布局</text>
  <text x="100" y="184" text-anchor="middle" font-size="7.5" fill="#64748B">页面骨架复用</text>
  <rect x="170" y="148" width="210" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="168" text-anchor="middle" font-size="8" fill="#334155">app/layouts/*.vue</text>
  <text x="275" y="184" text-anchor="middle" font-size="7.5" fill="#64748B">页面用 definePageMeta 声明</text>
  <rect x="380" y="148" width="190" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="475" y="168" text-anchor="middle" font-size="8" fill="#334155">页面渲染时</text>
  <text x="475" y="184" text-anchor="middle" font-size="7.5" fill="#64748B">同布局切换不重建</text>
  <rect x="570" y="148" width="160" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="176" text-anchor="middle" font-size="8" fill="#334155">两端（同构）</text>

  <!-- 行 3 -->
  <rect x="30" y="194" width="140" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="214" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">路由中间件</text>
  <text x="100" y="230" text-anchor="middle" font-size="7.5" fill="#64748B">页面级横切</text>
  <rect x="170" y="194" width="210" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="214" text-anchor="middle" font-size="8" fill="#334155">app/middleware/（.global.ts 全局）</text>
  <text x="275" y="230" text-anchor="middle" font-size="7.5" fill="#64748B">具名的要在页面里引用</text>
  <rect x="380" y="194" width="190" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="475" y="214" text-anchor="middle" font-size="8" fill="#334155">路由切换时</text>
  <text x="475" y="230" text-anchor="middle" font-size="7.5" fill="#64748B">navigateTo 必须 return</text>
  <rect x="570" y="194" width="160" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="214" text-anchor="middle" font-size="8" fill="#DC2626" font-weight="bold">两端，但不含 /api</text>
  <text x="650" y="230" text-anchor="middle" font-size="7.5" fill="#64748B">API 鉴权走服务端中间件</text>

  <!-- 行 4 -->
  <rect x="30" y="240" width="140" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="260" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">服务端中间件</text>
  <text x="100" y="276" text-anchor="middle" font-size="7.5" fill="#64748B">请求级横切</text>
  <rect x="170" y="240" width="210" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="260" text-anchor="middle" font-size="8" fill="#334155">server/middleware/</text>
  <text x="275" y="276" text-anchor="middle" font-size="7.5" fill="#64748B">文件即注册，无需引用</text>
  <rect x="380" y="240" width="190" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="475" y="260" text-anchor="middle" font-size="8" fill="#334155">每个 HTTP 请求</text>
  <text x="475" y="276" text-anchor="middle" font-size="7.5" fill="#64748B">含 /api 与静态资源</text>
  <rect x="570" y="240" width="160" height="46" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="268" text-anchor="middle" font-size="8" fill="#059669" font-weight="bold">仅服务端（Nitro）</text>

  <!-- 行 5 -->
  <rect x="30" y="286" width="140" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="306" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">SEO / Head</text>
  <text x="100" y="322" text-anchor="middle" font-size="7.5" fill="#64748B">SSR 价值的一半</text>
  <rect x="170" y="286" width="210" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="306" text-anchor="middle" font-size="8" fill="#334155">useSeoMeta / useHead / app.head</text>
  <text x="275" y="322" text-anchor="middle" font-size="7.5" fill="#64748B">数据到了才确定的用函数式</text>
  <rect x="380" y="286" width="190" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="475" y="306" text-anchor="middle" font-size="8" fill="#334155">渲染时随组件执行</text>
  <text x="475" y="322" text-anchor="middle" font-size="7.5" fill="#64748B">ssr:false 路由不进首屏 HTML</text>
  <rect x="570" y="286" width="160" height="46" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="650" y="314" text-anchor="middle" font-size="8" fill="#334155">服务端决定首屏</text>

  <!-- 底部提示 -->
  <rect x="30" y="352" width="700" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
  <text x="380" y="374" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">排查口诀：「在哪定义」决定改哪里；「何时执行」决定为什么没跑；「在哪一端」决定为什么报 window is not defined</text>
  <text x="380" y="394" text-anchor="middle" font-size="8.5" fill="#78350F">插件（app/plugins/）单独记：启动时执行一次，别在里面发「页面需要的数据请求」——结果不进 payload</text>
</svg>
