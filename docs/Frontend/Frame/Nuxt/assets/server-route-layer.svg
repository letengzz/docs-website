<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="530" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Nuxt 服务端的三层：目录映射、运行时配置、中间件</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">浏览器只与同源的 Nuxt 服务说话，密钥与供应商差异全部收在服务端</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">server/ 目录：文件名即 URL，四个位置分工明确</text>
  <rect x="30" y="88" width="250" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="155" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">文件</text>
  <rect x="280" y="88" width="170" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="365" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">映射到的 URL</text>
  <rect x="450" y="88" width="310" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="605" y="105" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">何时执行 / 用途</text>
  <rect x="30" y="114" width="250" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="130" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">server/api/products.get.ts</text>
  <rect x="280" y="114" width="170" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="365" y="130" text-anchor="middle" font-size="7.5" fill="#334155">/api/products</text>
  <rect x="450" y="114" width="310" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="605" y="130" text-anchor="middle" font-size="7.5" fill="#334155">被请求时；GET 由文件后缀决定</text>
  <rect x="30" y="140" width="250" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="156" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">server/routes/webhook.post.ts</text>
  <rect x="280" y="140" width="170" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="365" y="156" text-anchor="middle" font-size="7.5" fill="#334155">/webhook</text>
  <rect x="450" y="140" width="310" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="605" y="156" text-anchor="middle" font-size="7.5" fill="#334155">被请求时；非 /api 前缀</text>
  <rect x="30" y="166" width="250" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="182" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">server/middleware/trace.ts</text>
  <rect x="280" y="166" width="170" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="365" y="182" text-anchor="middle" font-size="7.5" fill="#334155">—</text>
  <rect x="450" y="166" width="310" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="605" y="182" text-anchor="middle" font-size="7.5" fill="#334155">每个请求都跑；日志、trace_id、鉴权</text>
  <rect x="30" y="192" width="250" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="208" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">server/utils/db.ts</text>
  <rect x="280" y="192" width="170" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="365" y="208" text-anchor="middle" font-size="7.5" fill="#334155">—</text>
  <rect x="450" y="192" width="310" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="605" y="208" text-anchor="middle" font-size="7.5" fill="#334155">自动导入；被 handler 复用</text>
  <rect x="30" y="218" width="250" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="155" y="234" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">server/plugins/init.ts</text>
  <rect x="280" y="218" width="170" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="365" y="234" text-anchor="middle" font-size="7.5" fill="#334155">—</text>
  <rect x="450" y="218" width="310" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="605" y="234" text-anchor="middle" font-size="7.5" fill="#334155">启动时；初始化连接池、注册钩子</text>
  <text x="60" y="250" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">runtimeConfig：密钥的唯一正确位置</text>
  <rect x="30" y="262" width="350" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="205" y="280.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">私有段（服务端可见）</text>
  <text x="205" y="297" text-anchor="middle" font-size="7.5" fill="#047857">NUXT_API_KEY / NUXT_JWT_SECRET</text>
  <text x="205" y="314.25" text-anchor="middle" font-size="7.5" fill="#047857">运行时从环境变量读 → 改了不用重新构建</text>
  <text x="205" y="331.5" text-anchor="middle" font-size="7.5" fill="#047857">绝不出现在浏览器产物里</text>
  <text x="205" y="348.75" text-anchor="middle" font-size="7.5" fill="#047857">门禁：grep 产物，命中即失败</text>
  <rect x="390" y="262" width="340" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="280.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">public 段（人人可见）</text>
  <text x="560" y="297" text-anchor="middle" font-size="7.5" fill="#B45309">NUXT_PUBLIC_SITE_NAME</text>
  <text x="560" y="314.25" text-anchor="middle" font-size="7.5" fill="#B45309">构建期内联进客户端产物 → 改了必须重新构建</text>
  <text x="560" y="331.5" text-anchor="middle" font-size="7.5" fill="#B45309">判断标准：能接受它出现在网站源码里吗</text>
  <text x="560" y="348.75" text-anchor="middle" font-size="7.5" fill="#B45309">站点名、公开 API 地址可以放</text>
  <line x1="30" y1="372" x2="730" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="398" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">两种中间件不要混用</text>
  <rect x="30" y="410" width="350" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="205" y="428.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">server/middleware（服务端）</text>
  <text x="205" y="445" text-anchor="middle" font-size="7.5" fill="#6D28D9">每个 HTTP 请求都跑，能拿到 event</text>
  <text x="205" y="462.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">能改响应头与状态码</text>
  <text x="205" y="479.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">做 trace_id、日志、API 鉴权</text>
  <rect x="390" y="410" width="340" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="560" y="428.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">app/middleware（路由）</text>
  <text x="560" y="445" text-anchor="middle" font-size="7.5" fill="#1D4ED8">路由切换时跑（含客户端导航）</text>
  <text x="560" y="462.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">只能做跳转与赋值，没有 event</text>
  <text x="560" y="479.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">做页面级权限跳转、埋点</text>
  <text x="380" y="512" text-anchor="middle" font-size="9.5" fill="#B91C1C">用路由中间件做 API 鉴权是无效的 —— 它根本不会在 /api/xxx 请求时执行</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
