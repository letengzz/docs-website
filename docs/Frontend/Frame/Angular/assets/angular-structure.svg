<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="436" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Angular 项目结构：根文件、src 分层与三套 tsconfig</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三套 tsconfig 各管一段编译范围——这是 Angular 结构里最容易读错的地方</text>
  <rect x="30" y="76" width="348" height="250" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="204.0" y="95" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">根目录：五个必须认识的文件</text>
  <text x="204.0" y="112" text-anchor="middle" font-size="7.6" fill="#1D4ED8">angular.json      构建/服务/测试的全部配置入口</text>
  <text x="204.0" y="128" text-anchor="middle" font-size="7.6" fill="#1D4ED8">package.json      依赖与脚本</text>
  <text x="204.0" y="144" text-anchor="middle" font-size="7.6" fill="#1D4ED8">tsconfig.json     基础编译选项（被另两套继承）</text>
  <text x="204.0" y="160" text-anchor="middle" font-size="7.6" fill="#1D4ED8">tsconfig.app.json 应用代码范围（exclude 测试）</text>
  <text x="204.0" y="176" text-anchor="middle" font-size="7.6" fill="#1D4ED8">tsconfig.spec.json 测试代码范围（含 *.spec.ts）</text>
  <text x="204.0" y="192" text-anchor="middle" font-size="7.6" fill="#1D4ED8"></text>
  <text x="204.0" y="208" text-anchor="middle" font-size="7.6" fill="#1D4ED8">一句话：tsconfig.json 只放公共选项，</text>
  <text x="204.0" y="224" text-anchor="middle" font-size="7.6" fill="#1D4ED8">app / spec 各自 extends 它再收窄 include</text>
  <rect x="398" y="76" width="332" height="250" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="564.0" y="95" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">src/：分层与职责</text>
  <text x="564.0" y="112" text-anchor="middle" font-size="7.6" fill="#047857">main.ts        引导入口（bootstrapApplication）</text>
  <text x="564.0" y="128" text-anchor="middle" font-size="7.6" fill="#047857">index.html     宿主页（只有 &lt;app-root&gt;）</text>
  <text x="564.0" y="144" text-anchor="middle" font-size="7.6" fill="#047857">styles.css     全局样式</text>
  <text x="564.0" y="160" text-anchor="middle" font-size="7.6" fill="#047857">app/           根组件与路由</text>
  <text x="564.0" y="176" text-anchor="middle" font-size="7.6" fill="#047857">  ├─ core/     单例服务、拦截器、守卫</text>
  <text x="564.0" y="192" text-anchor="middle" font-size="7.6" fill="#047857">  ├─ shared/   可复用组件与指令</text>
  <text x="564.0" y="208" text-anchor="middle" font-size="7.6" fill="#047857">  ├─ features/ 按业务域切分的功能模块</text>
  <text x="564.0" y="224" text-anchor="middle" font-size="7.6" fill="#047857">  └─ assets/   参与构建的静态资源</text>
  <text x="564.0" y="240" text-anchor="middle" font-size="7.6" fill="#047857"></text>
  <text x="564.0" y="256" text-anchor="middle" font-size="7.6" fill="#047857">约定：core 只被 AppModule 引入一次</text>
  <line x1="30" y1="350" x2="730" y2="350" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="372" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三条纪律</text>
  <rect x="30" y="350" width="150" height="22" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="105.0" y="365" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">core 只能导一次</text>
  <rect x="188" y="350" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459.0" y="365" text-anchor="middle" font-size="8.5" fill="#334155">core 里的服务是单例，被 feature 重复 import 会造出多份实例</text>
  <rect x="30" y="376" width="150" height="22" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="105.0" y="391" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">feature 之间不互相 import</text>
  <rect x="188" y="376" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459.0" y="391" text-anchor="middle" font-size="8.5" fill="#334155">跨域调用一律走 core 或 shared，否则模块边界立刻糊掉</text>
  <rect x="30" y="402" width="150" height="22" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="105.0" y="417" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">别手改 angular.json</text>
  <rect x="188" y="402" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459.0" y="417" text-anchor="middle" font-size="8.5" fill="#334155">90% 的需求 CLI 都能生成，手改容易让构建与 IDE 认知不一致</text>
</svg>
