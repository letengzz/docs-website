<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">自动更新与质量保障闭环</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="180" height="110" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="96" fill="#0e7490" font-weight="bold" font-size="14">构建产物</text>
    <text x="120" y="116" fill="#4b5563" font-size="11">版本号递增</text>
    <text x="120" y="133" fill="#4b5563" font-size="11">生成 latest.yml</text>
    <rect x="230" y="70" width="180" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="320" y="96" fill="#4338ca" font-weight="bold" font-size="14">上传发布</text>
    <text x="320" y="116" fill="#4b5563" font-size="11">静态托管 / 对象存储</text>
    <text x="320" y="133" fill="#4b5563" font-size="11">按平台分目录</text>
    <rect x="430" y="70" width="180" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="520" y="96" fill="#6d28d9" font-weight="bold" font-size="14">客户端检查</text>
    <text x="520" y="116" fill="#4b5563" font-size="11">启动或定时检查</text>
    <text x="520" y="133" fill="#4b5563" font-size="11">electron-updater</text>
    <rect x="630" y="70" width="220" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="740" y="96" fill="#047857" font-weight="bold" font-size="14">下载与安装</text>
    <text x="740" y="116" fill="#4b5563" font-size="11">后台下载</text>
    <text x="740" y="133" fill="#4b5563" font-size="11">提示重启或退出时安装</text>
    <path d="M 210 125 L 228 125" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 410 125 L 428 125" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 610 125 L 628 125" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="220" width="400" height="180" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="230" y="246" fill="#0f766e" font-weight="bold" font-size="14">自动更新要点</text>
    <text x="230" y="266" fill="#4b5563" font-size="11">latest.yml / 平台清单必须与实际产物匹配</text>
    <text x="230" y="283" fill="#4b5563" font-size="11">灰度：按比例放量或按渠道分发</text>
    <text x="230" y="300" fill="#4b5563" font-size="11">失败要有回退与重试，不阻塞使用</text>
    <text x="230" y="317" fill="#4b5563" font-size="11">签名不符会导致更新被拒绝</text>
    <rect x="450" y="220" width="400" height="180" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="650" y="246" fill="#b45309" font-weight="bold" font-size="14">质量保障</text>
    <text x="650" y="266" fill="#4b5563" font-size="11">单元/集成测试：Vitest + Node 侧逻辑</text>
    <text x="650" y="283" fill="#4b5563" font-size="11">端到端：Playwright 的 Electron 支持或 WebdriverIO</text>
    <text x="650" y="300" fill="#4b5563" font-size="11">关键路径：启动、文件读写、更新检查</text>
    <text x="650" y="317" fill="#4b5563" font-size="11">性能：冷启动耗时与内存占用纳入观察</text>
</g>
  <text x="440" y="442" text-anchor="middle" font-size="13" fill="#475569">桌面应用的竞争力一半在「能不能持续正确地更新自己」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
