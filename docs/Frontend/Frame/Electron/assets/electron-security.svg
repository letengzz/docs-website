<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Electron 安全基线</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="190" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="125" y="86" fill="#047857" font-weight="bold" font-size="14">contextIsolation: true</text>
    <text x="125" y="106" fill="#4b5563" font-size="11">隔离 preload 与页面上下文</text>
    <text x="125" y="123" fill="#4b5563" font-size="11">默认值，勿关闭</text>
    <rect x="240" y="60" width="190" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="335" y="86" fill="#047857" font-weight="bold" font-size="14">nodeIntegration: false</text>
    <text x="335" y="106" fill="#4b5563" font-size="11">页面不能直接 require</text>
    <text x="335" y="123" fill="#4b5563" font-size="11">默认值，勿关闭</text>
    <rect x="450" y="60" width="190" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="545" y="86" fill="#047857" font-weight="bold" font-size="14">sandbox: true</text>
    <text x="545" y="106" fill="#4b5563" font-size="11">渲染进程沙箱化</text>
    <text x="545" y="123" fill="#4b5563" font-size="11">配合 preload 使用</text>
    <rect x="660" y="60" width="190" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="755" y="86" fill="#047857" font-weight="bold" font-size="14">webSecurity: true</text>
    <text x="755" y="106" fill="#4b5563" font-size="11">保留同源策略</text>
    <text x="755" y="123" fill="#4b5563" font-size="11">勿为图省事关掉</text>
    <rect x="30" y="230" width="400" height="180" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="230" y="256" fill="#0f766e" font-weight="bold" font-size="14">必须做的校验</text>
    <text x="230" y="276" fill="#4b5563" font-size="11">主进程对 IPC 参数做类型与范围校验</text>
    <text x="230" y="293" fill="#4b5563" font-size="11">禁止渲染进程传任意路径读写文件</text>
    <text x="230" y="310" fill="#4b5563" font-size="11">外部链接用 shell.openExternal 并做协议白名单</text>
    <text x="230" y="327" fill="#4b5563" font-size="11">CSP 限制脚本来源</text>
    <rect x="450" y="230" width="400" height="180" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="650" y="256" fill="#be123c" font-weight="bold" font-size="14">高危做法</text>
    <text x="650" y="276" fill="#4b5563" font-size="11">把 ipcRenderer 整个暴露给页面</text>
    <text x="650" y="293" fill="#4b5563" font-size="11">为方便调试永久关闭 webSecurity</text>
    <text x="650" y="310" fill="#4b5563" font-size="11">允许加载任意远程页面且不加限制</text>
    <text x="650" y="327" fill="#4b5563" font-size="11">使用已废弃的 remote 模块</text>
</g>
  <text x="440" y="452" text-anchor="middle" font-size="13" fill="#475569">安全默认值就是最安全的配置：绝大多数漏洞来自「为了省事关掉了默认保护」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
