<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">打包工具与流程</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="200" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="130" y="86" fill="#0e7490" font-weight="bold" font-size="14">electron-builder</text>
    <text x="130" y="106" fill="#4b5563" font-size="11">配置简单，开箱即用</text>
    <text x="130" y="123" fill="#4b5563" font-size="11">支持 nsis / dmg / AppImage</text>
    <text x="130" y="140" fill="#4b5563" font-size="11">内置自动更新（electron-updater）</text>
    <rect x="250" y="60" width="200" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="350" y="86" fill="#4338ca" font-weight="bold" font-size="14">electron-forge</text>
    <text x="350" y="106" fill="#4b5563" font-size="11">官方维护</text>
    <text x="350" y="123" fill="#4b5563" font-size="11">集成 Vite / Webpack 模板</text>
    <text x="350" y="140" fill="#4b5563" font-size="11">可插拔 maker / publisher</text>
    <rect x="470" y="60" width="200" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="570" y="86" fill="#6d28d9" font-weight="bold" font-size="14">electron-packager</text>
    <text x="570" y="106" fill="#4b5563" font-size="11">只负责打包目录</text>
    <text x="570" y="123" fill="#4b5563" font-size="11">不生成安装包</text>
    <text x="570" y="140" fill="#4b5563" font-size="11">适合脚本化自定义流程</text>
    <rect x="690" y="60" width="160" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="770" y="86" fill="#b45309" font-weight="bold" font-size="14">签名与公证</text>
    <text x="770" y="106" fill="#4b5563" font-size="11">macOS 需 codesign + 公证</text>
    <text x="770" y="123" fill="#4b5563" font-size="11">Windows 建议代码签名</text>
    <text x="770" y="140" fill="#4b5563" font-size="11">缺少签名会被系统拦截</text>
    <rect x="30" y="220" width="820" height="80" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="440" y="246" fill="#0f766e" font-weight="bold" font-size="13">典型流程：构建前端产物 → 打包应用目录（含 Node 侧代码） → 生成安装包 → 签名 → 上传发布</text>
    <text x="440" y="266" fill="#4b5563" font-size="12">注意区分 dependencies 与 devDependencies：只有 dependencies 会被打进应用</text>
    <rect x="30" y="330" width="400" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="356" fill="#047857" font-weight="bold" font-size="14">产物要点</text>
    <text x="230" y="376" fill="#4b5563" font-size="11">asar 打包减少文件数</text>
    <text x="230" y="393" fill="#4b5563" font-size="11">按平台分别配置 target</text>
    <text x="230" y="410" fill="#4b5563" font-size="11">版本号从 package.json 读取</text>
    <rect x="450" y="330" width="400" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="650" y="356" fill="#be123c" font-weight="bold" font-size="14">常见坑</text>
    <text x="650" y="376" fill="#4b5563" font-size="11">把 devDependencies 打进包导致体积暴涨</text>
    <text x="650" y="393" fill="#4b5563" font-size="11">原生模块未针对目标平台重编译</text>
    <text x="650" y="410" fill="#4b5563" font-size="11">未配 artifactName 导致无法自动更新</text>
</g>
  <text x="440" y="452" text-anchor="middle" font-size="13" fill="#475569">三选一即可：要省心用 electron-builder，要官方生态用 forge，要完全自定义用 packager</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
