<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">IPC 通信的三种模式</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="260" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="160" y="86" fill="#0e7490" font-weight="bold" font-size="14">① 渲染 → 主（单向）</text>
    <text x="160" y="106" fill="#4b5563" font-size="11">ipcRenderer.send('channel', data)</text>
    <text x="160" y="123" fill="#4b5563" font-size="11">ipcMain.on('channel', handler)</text>
    <rect x="310" y="60" width="260" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="440" y="86" fill="#4338ca" font-weight="bold" font-size="14">② 渲染 → 主（请求响应）</text>
    <text x="440" y="106" fill="#4b5563" font-size="11">ipcRenderer.invoke('channel', data)</text>
    <text x="440" y="123" fill="#4b5563" font-size="11">ipcMain.handle('channel', handler)</text>
    <rect x="590" y="60" width="260" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="86" fill="#047857" font-weight="bold" font-size="14">③ 主 → 渲染（推送）</text>
    <text x="720" y="106" fill="#4b5563" font-size="11">webContents.send('channel', data)</text>
    <text x="720" y="123" fill="#4b5563" font-size="11">ipcRenderer.on(...) 接收</text>
    <rect x="30" y="220" width="820" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="440" y="246" fill="#6d28d9" font-weight="bold" font-size="13">推荐写法：渲染进程不直接碰 ipcRenderer，而是通过 preload 用 contextBridge 暴露最小接口</text>
    <text x="440" y="266" fill="#4b5563" font-size="12">window.api.readFile(path)  →  preload 内 ipcRenderer.invoke('fs:read', path)  →  主进程 fs 读写</text>
    <rect x="30" y="330" width="400" height="100" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="230" y="356" fill="#0f766e" font-weight="bold" font-size="14">为什么用 invoke/handle</text>
    <text x="230" y="376" fill="#4b5563" font-size="11">语义清晰：一次调用一次返回</text>
    <text x="230" y="393" fill="#4b5563" font-size="11">天然 Promise，配合 async/await</text>
    <text x="230" y="410" fill="#4b5563" font-size="11">避免手动管理回调 id</text>
    <rect x="450" y="330" width="400" height="100" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="650" y="356" fill="#be123c" font-weight="bold" font-size="14">安全红线</text>
    <text x="650" y="376" fill="#4b5563" font-size="11">不要暴露 ipcRenderer 整体</text>
    <text x="650" y="393" fill="#4b5563" font-size="11">白名单化 channel 名</text>
    <text x="650" y="410" fill="#4b5563" font-size="11">主进程必须校验参数（路径、类型）</text>
</g>
  <text x="440" y="442" text-anchor="middle" font-size="13" fill="#475569">IPC 是攻击面：暴露得越少越安全，参数校验必须在主进程做</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
