<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">桌面端跨端：三条常见路线</text>

  <rect x="30" y="60" width="270" height="200" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="165" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Electron</text>
  <text x="52" y="114" font-size="11" fill="#3730a3">Chromium + Node.js，Web 技术直接复用</text>
  <text x="52" y="138" font-size="11" fill="#3730a3">生态成熟，桌面能力（托盘、菜单、自动更新）齐全</text>
  <text x="52" y="162" font-size="11" fill="#3730a3">当前版本：v44.3.0（2026-09-08）</text>
  <text x="52" y="186" font-size="10" fill="#6b7280">代价：安装包与内存占用较大</text>
  <text x="52" y="210" font-size="10" fill="#6b7280">适合：内部工具、管理客户端、需快速交付</text>
  <text x="52" y="236" font-size="10" fill="#6b7280">本库已有完整专题：[Electron](Electron 专题)</text>

  <rect x="315" y="60" width="270" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Tauri</text>
  <text x="337" y="114" font-size="11" fill="#065f46">系统 WebView + Rust 内核</text>
  <text x="337" y="138" font-size="11" fill="#065f46">安装包与内存占用明显更小</text>
  <text x="337" y="162" font-size="11" fill="#065f46">需要 Rust 工具链与相应学习成本</text>
  <text x="337" y="186" font-size="10" fill="#6b7280">代价：生态与原生能力相对较小</text>
  <text x="337" y="210" font-size="10" fill="#6b7280">适合：体积敏感、愿意引入 Rust 的团队</text>
  <text x="337" y="236" font-size="10" fill="#6b7280">版本与兼容矩阵以官方发布页为准</text>

  <rect x="600" y="60" width="270" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="735" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">纯 Web / PWA</text>
  <text x="622" y="114" font-size="11" fill="#92400e">不安装客户端，浏览器直接访问</text>
  <text x="622" y="138" font-size="11" fill="#92400e">交付与升级成本最低</text>
  <text x="622" y="162" font-size="11" fill="#92400e">受浏览器能力限制（文件、串口、托盘等）</text>
  <text x="622" y="186" font-size="10" fill="#6b7280">代价：无法深度集成系统能力</text>
  <text x="622" y="210" font-size="10" fill="#6b7280">适合：无需系统集成、以在线使用为主</text>
  <text x="622" y="236" font-size="10" fill="#6b7280">可与 Electron 共用同一套前端代码</text>

  <rect x="30" y="280" width="840" height="142" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="306" font-size="13" font-weight="bold" fill="#1f2937">选择顺序</text>
  <text x="50" y="332" font-size="11" fill="#374151">1. 是否必须访问本地文件系统/硬件（串口、打印机、读卡器）？必须 → 排除纯 Web，考虑 Electron / Tauri。</text>
  <text x="50" y="356" font-size="11" fill="#374151">2. 安装包体积是否是硬指标？是且团队能接受 Rust → Tauri；否则 Electron 更快落地。</text>
  <text x="50" y="380" font-size="11" fill="#374151">3. 能否与现有 Web 端共用代码？Electron 的渲染进程就是 Web 页面，复用率最高。</text>
  <text x="50" y="404" font-size="10" fill="#6b7280">无论选哪条路线，桌面端都要额外处理：自动更新、崩溃上报、权限与签名、多分辨率适配。</text>
</svg>
