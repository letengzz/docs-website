<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">跨端开发问题排查地图</text>

  <rect x="330" y="56" width="240" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">先判断问题范围</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#6b7280">单端 / 多端 / 构建期 / 运行期</text>
  <path d="M 450 110 V 134" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <line x1="120" y1="134" x2="780" y2="134" stroke="#9ca3af" stroke-width="2"/>

  <path d="M 120 134 V 158" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#c1)"/>
  <rect x="30" y="162" width="180" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 只有某一端异常</text>
  <text x="120" y="210" text-anchor="middle" font-size="10" fill="#7f1d1d">平台 API 差异</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#7f1d1d">样式/单位不兼容</text>
  <text x="120" y="246" text-anchor="middle" font-size="10" fill="#7f1d1d">条件编译分支写错</text>
  <text x="120" y="270" text-anchor="middle" font-size="10" fill="#6b7280">→ 用适配层 + 单端复现</text>

  <path d="M 330 134 V 158" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#c1)"/>
  <rect x="250" y="162" width="180" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">② 构建报错</text>
  <text x="340" y="210" text-anchor="middle" font-size="10" fill="#92400e">Node / CLI 版本不匹配</text>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="#92400e">依赖未构建或缓存脏</text>
  <text x="340" y="246" text-anchor="middle" font-size="10" fill="#92400e">插件与框架版本冲突</text>
  <text x="340" y="270" text-anchor="middle" font-size="10" fill="#6b7280">→ 清缓存 + 对齐版本</text>

  <path d="M 470 134 V 158" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#c1)"/>
  <rect x="470" y="162" width="180" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="560" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">③ 多端都不对</text>
  <text x="560" y="210" text-anchor="middle" font-size="10" fill="#1e3a8a">共享层逻辑缺陷</text>
  <text x="560" y="228" text-anchor="middle" font-size="10" fill="#1e3a8a">接口契约变更</text>
  <text x="560" y="246" text-anchor="middle" font-size="10" fill="#1e3a8a">状态管理使用不当</text>
  <text x="560" y="270" text-anchor="middle" font-size="10" fill="#6b7280">→ 先修共享层 + 补单测</text>

  <path d="M 700 134 V 158" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#c1)"/>
  <rect x="690" y="162" width="180" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="780" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">④ 体验不一致</text>
  <text x="780" y="210" text-anchor="middle" font-size="10" fill="#5b21b6">返回行为差异</text>
  <text x="780" y="228" text-anchor="middle" font-size="10" fill="#5b21b6">弹窗/授权流程不同</text>
  <text x="780" y="246" text-anchor="middle" font-size="10" fill="#5b21b6">滚动与手势差异</text>
  <text x="780" y="270" text-anchor="middle" font-size="10" fill="#6b7280">→ 定义交互契约</text>

  <rect x="30" y="326" width="840" height="118" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="352" font-size="13" font-weight="bold" fill="#1f2937">通用四步法</text>
  <text x="50" y="378" font-size="11" fill="#374151">1. 定位范围：是单端、某几端，还是全部？范围决定了是平台差异还是共享层缺陷。</text>
  <text x="50" y="402" font-size="11" fill="#374151">2. 精简复现：用最小页面 + 固定数据复现，排除业务复杂度的干扰。</text>
  <text x="50" y="426" font-size="11" fill="#374151">3. 对比差异：同一份数据在不同端的表现，逐项比对 API 返回、样式与生命周期顺序。</text>
  <text x="50" y="444" font-size="11" fill="#374151">4. 固化结论：把差异写进适配层与测试矩阵，避免同类问题重复出现。</text>

  <defs>
    <marker id="c1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
