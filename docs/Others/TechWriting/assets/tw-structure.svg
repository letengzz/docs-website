<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <rect width="880" height="450" fill="#FFFFFF"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">结论先行的三层结构：每层都能独立交付</text>

  <rect x="180" y="70" width="520" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="204" y="100" font-size="16" font-weight="bold" fill="#1D4ED8">第一层：结论</text>
  <text x="204" y="126" font-size="13" fill="#334155">结论 + 代价 + 被否掉的方案</text>
  <text x="676" y="112" text-anchor="end" font-size="12" fill="#1D4ED8">决策者止步于此</text>

  <rect x="130" y="166" width="620" height="76" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="154" y="196" font-size="16" font-weight="bold" fill="#15803D">第二层：论据</text>
  <text x="154" y="222" font-size="13" fill="#334155">三条支撑理由 + 约束条件 + 影响面</text>
  <text x="726" y="208" text-anchor="end" font-size="12" fill="#15803D">评审者止步于此</text>

  <rect x="80" y="262" width="720" height="76" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="104" y="292" font-size="16" font-weight="bold" fill="#334155">第三层：细节</text>
  <text x="104" y="318" font-size="13" fill="#334155">命令、配置、日志片段、时间线、数据表</text>
  <text x="776" y="304" text-anchor="end" font-size="12" fill="#64748B">执行者按需取用</text>

  <line x1="440" y1="146" x2="440" y2="162" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="440" y1="242" x2="440" y2="258" stroke="#94A3B8" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="80" y="368" width="720" height="62" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="104" y="394" font-size="13" fill="#92400E">自检：只读第一层，能不能做出正确决定？不能 → 结论还没到位；</text>
  <text x="104" y="416" font-size="13" fill="#92400E">只读前两层，能不能复核这个结论？不能 → 论据还缺一条。</text>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
