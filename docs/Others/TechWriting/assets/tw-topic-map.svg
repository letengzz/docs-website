  <text x="135" y="132" text-anchor="middle" font-size="13" fill="#334155">读者、载体与四条标准</text>

  <rect x="330" y="76" width="190" height="76" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="425" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803D">Structure</text>
  <text x="425" y="132" text-anchor="middle" font-size="13" fill="#334155">结论先行与七模块</text>

  <rect x="620" y="76" width="190" height="76" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
