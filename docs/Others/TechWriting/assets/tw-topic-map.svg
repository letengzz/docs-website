  <text x="66" y="476" font-size="14" fill="#334155">写一份新文档：Overview → Structure → Prose → Diagrams / Examples</text>
  <text x="66" y="502" font-size="14" fill="#334155">要交付或对外讲：Review → Speaking；卡在具体问题上直接查 FAQ 的分诊表</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
