<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="880" height="420" fill="#FFFFFF"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">40 分钟分享的时间分配：开场 10%、背景 20%、主体 50%、收尾 20%</text>

  <rect x="60" y="92" width="76" height="72" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="98" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">开场</text>
  <text x="98" y="144" text-anchor="middle" font-size="12" fill="#334155">4 分钟</text>

  <rect x="136" y="92" width="152" height="72" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="212" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803D">背景与问题</text>
  <text x="212" y="144" text-anchor="middle" font-size="12" fill="#334155">8 分钟</text>

  <rect x="288" y="92" width="380" height="72" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="478" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">主体：三个支撑 ×（一个证据 + 一次演示或数据）</text>
  <text x="478" y="144" text-anchor="middle" font-size="12" fill="#334155">20 分钟，占一半，每节 6~7 分钟</text>

  <rect x="668" y="92" width="152" height="72" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="744" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#6D28D9">收尾与问答</text>
  <text x="744" y="144" text-anchor="middle" font-size="12" fill="#334155">8 分钟</text>

  <line x1="60" y1="176" x2="60" y2="186" stroke="#94A3B8" stroke-width="2"/>
  <text x="60" y="202" text-anchor="middle" font-size="12" fill="#64748B">0</text>
  <line x1="136" y1="176" x2="136" y2="186" stroke="#94A3B8" stroke-width="2"/>
  <text x="136" y="202" text-anchor="middle" font-size="12" fill="#64748B">4</text>
  <line x1="288" y1="176" x2="288" y2="186" stroke="#94A3B8" stroke-width="2"/>
  <text x="288" y="202" text-anchor="middle" font-size="12" fill="#64748B">12</text>
  <line x1="668" y1="176" x2="668" y2="186" stroke="#94A3B8" stroke-width="2"/>
  <text x="668" y="202" text-anchor="middle" font-size="12" fill="#64748B">32</text>
  <line x1="820" y1="176" x2="820" y2="186" stroke="#94A3B8" stroke-width="2"/>
  <text x="820" y="202" text-anchor="middle" font-size="12" fill="#64748B">40</text>

  <text x="60" y="238" font-size="13" font-weight="bold" fill="#1E293B">三种时长不是「讲详一点」，是三种不同的东西</text>

  <rect x="40" y="250" width="250" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="165" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">5 分钟</text>
  <text x="165" y="300" text-anchor="middle" font-size="12" fill="#334155">一个观点 + 一个证据</text>
  <text x="165" y="322" text-anchor="middle" font-size="12" fill="#64748B">5~8 页，不许讲完整项目</text>

  <rect x="315" y="250" width="250" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="440" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803D">15 分钟</text>
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#334155">问题 → 方案 → 证据 → 边界</text>
  <text x="440" y="322" text-anchor="middle" font-size="12" fill="#64748B">12~18 页，背景不超过 3 分钟</text>

  <rect x="590" y="250" width="250" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="715" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">40 分钟</text>
  <text x="715" y="300" text-anchor="middle" font-size="12" fill="#334155">方法 + 2~3 个深入点 + 互动</text>
  <text x="715" y="322" text-anchor="middle" font-size="12" fill="#64748B">25~40 页，1.5~2 分钟每页</text>

  <rect x="40" y="358" width="800" height="44" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="64" y="386" font-size="13" fill="#92400E">判据：听众离场能复述的那一句话，应该在第 30 秒出现，并在最后原样再说一次。</text>
</svg>
