<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect width="880" height="470" fill="#FFFFFF"/>
  <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">三类读者的阅读路径：同一份文档，三种用法</text>

  <rect x="30" y="80" width="130" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="95" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">决策者</text>
  <text x="95" y="128" text-anchor="middle" font-size="12" fill="#334155">1 屏内</text>

  <rect x="200" y="80" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="290" y="106" text-anchor="middle" font-size="14" fill="#334155">先看结论</text>
  <text x="290" y="128" text-anchor="middle" font-size="12" fill="#64748B">跳过推导</text>
  <rect x="410" y="80" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="500" y="106" text-anchor="middle" font-size="14" fill="#334155">看代价与风险</text>
  <text x="500" y="128" text-anchor="middle" font-size="12" fill="#64748B">几个选项</text>
  <rect x="620" y="80" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="710" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">决定批不批</text>

  <rect x="30" y="180" width="130" height="60" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="95" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">执行者</text>
  <text x="95" y="228" text-anchor="middle" font-size="12" fill="#334155">按需检索</text>

  <rect x="200" y="180" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="290" y="206" text-anchor="middle" font-size="14" fill="#334155">读前置条件</text>
  <text x="290" y="228" text-anchor="middle" font-size="12" fill="#64748B">环境与权限</text>
  <rect x="410" y="180" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="500" y="206" text-anchor="middle" font-size="14" fill="#334155">复制命令执行</text>
  <text x="500" y="228" text-anchor="middle" font-size="12" fill="#64748B">一条一步</text>
  <rect x="620" y="180" width="180" height="60" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="710" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803D">对预期输出</text>

  <rect x="30" y="280" width="130" height="60" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="95" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D28D9">维护者</text>
  <text x="95" y="328" text-anchor="middle" font-size="12" fill="#334155">三个月后</text>

  <rect x="200" y="280" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="290" y="306" text-anchor="middle" font-size="14" fill="#334155">查索引跳读</text>
  <text x="290" y="328" text-anchor="middle" font-size="12" fill="#64748B">30 秒找路</text>
  <rect x="410" y="280" width="180" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="500" y="306" text-anchor="middle" font-size="14" fill="#334155">只读相关节</text>
  <text x="500" y="328" text-anchor="middle" font-size="12" fill="#64748B">节内自洽</text>
  <rect x="620" y="280" width="180" height="60" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="710" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D28D9">看为什么这么设计</text>

  <line x1="160" y1="110" x2="195" y2="110" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="380" y1="110" x2="405" y2="110" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="590" y1="110" x2="615" y2="110" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="160" y1="210" x2="195" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="380" y1="210" x2="405" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="590" y1="210" x2="615" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="160" y1="310" x2="195" y2="310" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="380" y1="310" x2="405" y2="310" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="590" y1="310" x2="615" y2="310" stroke="#94A3B8" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="30" y="362" width="770" height="84" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/>
  <text x="56" y="390" font-size="14" font-weight="bold" fill="#B91C1C">一条路径都不满足时的症状</text>
  <text x="56" y="414" font-size="13" fill="#334155">决策者读不到结论 → 文档不进决策；执行者卡在第 0 步 → 文档被弃用</text>
  <text x="56" y="436" font-size="13" fill="#334155">维护者找不到「为什么」→ 三个月后把同一件事重写一遍</text>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
