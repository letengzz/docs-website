    <text x="155" y="134" fill="#4b5563" font-size="11">IDE 插件 / 命令行</text>
    <text x="155" y="154" fill="#6b7280" font-size="10">Git 工具 / 片段库</text>
    <text x="155" y="176" fill="#6b7280" font-size="10">AI 编程助手</text>
    <rect x="300" y="80" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
