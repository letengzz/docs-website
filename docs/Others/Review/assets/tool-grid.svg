    <rect x="570" y="80" width="240" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="690" y="110" fill="#b45309" font-weight="bold">协作文档</text>
    <text x="690" y="134" fill="#4b5563" font-size="11">知识库 / 会议 / 白板</text>
