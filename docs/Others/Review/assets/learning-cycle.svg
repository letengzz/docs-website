<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="300" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">高效学习循环</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="100" width="160" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="120" y="130" fill="#4338ca" font-weight="bold">1. 输入</text>
    <text x="120" y="152" fill="#4b5563" font-size="11">文档/源码/课程</text>
    <text x="120" y="172" fill="#6b7280" font-size="10">带着问题学</text>
    <rect x="240" y="100" width="160" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="130" fill="#b45309" font-weight="bold">2. 实践</text>
    <text x="320" y="152" fill="#4b5563" font-size="11">写代码/搭环境</text>
    <text x="320" y="172" fill="#6b7280" font-size="10">最小可运行 Demo</text>
    <rect x="440" y="100" width="160" height="100" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="520" y="130" fill="#be185d" font-weight="bold">3. 输出</text>
    <text x="520" y="152" fill="#4b5563" font-size="11">写文档/讲给别人</text>
    <text x="520" y="172" fill="#6b7280" font-size="10">费曼技巧</text>
    <rect x="640" y="100" width="160" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="130" fill="#047857" font-weight="bold">4. 复盘</text>
    <text x="720" y="152" fill="#4b5563" font-size="11">总结/补漏/归档</text>
    <text x="720" y="172" fill="#6b7280" font-size="10">更新知识地图</text>
  </g>
  <path d="M 205 150 H 233" stroke="#6366f1" stroke-width="2.5" marker-end="url(#l1)"/>
  <path d="M 405 150 H 433" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#l1)"/>
  <path d="M 605 150 H 633" stroke="#ec4899" stroke-width="2.5" marker-end="url(#l1)"/>
  <path d="M 720 205 V 225" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 720 232 H 120" stroke="#10b981" stroke-width="2"/>
  <path d="M 120 232 V 205" stroke="#10b981" stroke-width="2" marker-end="url(#l1)"/>
  <text x="420" y="270" text-anchor="middle" font-size="12" fill="#475569">闭环关键：输出倒逼输入，复盘沉淀为文档，形成个人知识库</text>
  <defs>
    <marker id="l1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
