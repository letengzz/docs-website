<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">决策记录的七段结构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">唯一验收标准：没见过这个项目的人，只读这一页能回答五个问题</text>
  <rect x="30" y="76" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="99" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">元信息</text>
  <rect x="190" y="76" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="99" text-anchor="middle" font-size="8.5" fill="#334155">编号 / 类型 / 状态 / 决策权 / 复审日</text>
  <rect x="30" y="120" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="143" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">背景与约束</text>
  <rect x="190" y="120" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="143" text-anchor="middle" font-size="8.5" fill="#334155">问题是什么、有哪些硬约束</text>
  <rect x="30" y="164" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="187" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">选项</text>
  <rect x="190" y="164" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="187" text-anchor="middle" font-size="8.5" fill="#334155">≥ 2 个真实选项，含「不做」</text>
  <rect x="30" y="208" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="231" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">判据</text>
  <rect x="190" y="208" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="231" text-anchor="middle" font-size="8.5" fill="#334155">会前确定、可判定、能判死</text>
  <rect x="30" y="252" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="275" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">结论与理由</text>
  <rect x="190" y="252" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="275" text-anchor="middle" font-size="8.5" fill="#334155">哪几条判据决定了胜负</text>
  <rect x="30" y="296" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="319" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">代价与未采纳意见</text>
  <rect x="190" y="296" width="540" height="36" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="460" y="319" text-anchor="middle" font-size="8.5" fill="#334155">得罪了谁 / 牺牲了什么</text>
  <rect x="30" y="340" width="150" height="36" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="105" y="363" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">复审</text>
  <rect x="190" y="340" width="540" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="363" text-anchor="middle" font-size="8.5" fill="#334155">何时、什么条件下重开</text>
  <text x="380" y="400" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">五问：解决什么问题 · 有什么约束 · 有哪些候选 · 按什么选的 · 付出了什么</text>
  <text x="380" y="424" text-anchor="middle" font-size="9" fill="#B91C1C">「代价与未采纳意见」合成一段：写前半句时会自然想起后半句</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
