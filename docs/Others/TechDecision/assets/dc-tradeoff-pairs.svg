<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">取舍表达：把「感觉」换成「可反驳的句子」</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">最低标准：反对者能拿着这段话说出你哪一步错了</text>
  <text x="30" y="80" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">取舍段的三段式：换什么 / 放弃什么 / 何时反悔</text>
  <rect x="30" y="94" width="220" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="140" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">换到了什么</text>
  <text x="140" y="129" text-anchor="middle" font-size="7.5" fill="#047857">哪些判据被满足</text>
  <text x="140" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">改善了多少（带数量级）</text>
  <line x1="252" y1="129" x2="268" y2="129" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="94" width="220" height="70" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">放弃了什么</text>
  <text x="380" y="129" text-anchor="middle" font-size="7.5" fill="#C2410C">明知而付的代价</text>
  <text x="380" y="146.25" text-anchor="middle" font-size="7.5" fill="#C2410C">机会成本落到具体事项</text>
  <line x1="492" y1="129" x2="508" y2="129" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="94" width="220" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="620" y="112.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">何时反悔</text>
  <text x="620" y="129" text-anchor="middle" font-size="7.5" fill="#B91C1C">触发条件可观测</text>
  <text x="620" y="146.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">含阈值或具体事件</text>
  <text x="380" y="186" text-anchor="middle" font-size="9" fill="#B91C1C" font-weight="bold">第三段是唯一让决策可被合法推翻的机制——没有它，重开只能靠拍桌子</text>
  <rect x="30" y="204" width="300" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="180" y="221" text-anchor="middle" font-size="8" fill="#991B1B">「性能更好」</text>
  <rect x="350" y="204" width="380" height="26" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="540" y="221" text-anchor="middle" font-size="8" fill="#065F46">「P99 从 40 ms 降到 12 ms（500 QPS 压测）」</text>
  <rect x="30" y="236" width="300" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="180" y="253" text-anchor="middle" font-size="8" fill="#991B1B">「有一定成本」</text>
  <rect x="350" y="236" width="380" height="26" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="540" y="253" text-anchor="middle" font-size="8" fill="#065F46">「月成本 +1.2k；运维多一套集群」</text>
  <rect x="30" y="268" width="300" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="180" y="285" text-anchor="middle" font-size="8" fill="#991B1B">「以后再看」</text>
  <rect x="350" y="268" width="380" height="26" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="540" y="285" text-anchor="middle" font-size="8" fill="#065F46">「3 个月内 2 次切换失败即重开」</text>
  <rect x="30" y="300" width="300" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="180" y="317" text-anchor="middle" font-size="8" fill="#991B1B">「风险可控」</text>
  <rect x="350" y="300" width="380" height="26" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="540" y="317" text-anchor="middle" font-size="8" fill="#065F46">「风险 → 信号 → 止损动作」三列</text>
  <text x="380" y="356" text-anchor="middle" font-size="9" fill="#475569">左边的四句话看起来专业，实际上什么都没说：反对者指不出你错在哪一步</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
