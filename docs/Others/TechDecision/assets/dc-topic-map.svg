<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">技术决策与评审：四道关口与十个落点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">决策的成本不在「选」的那一小时，而在它被记录成什么形状</text>
  <rect x="28" y="76" width="168" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">提得出</text>
  <text x="112" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">标题是决定不是话题</text>
  <rect x="208" y="76" width="168" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="292" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">说得清</text>
  <text x="292" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">选项 / 判据 / 代价</text>
  <rect x="388" y="76" width="168" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="472" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">驳得倒</text>
  <text x="472" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">反对意见要留痕</text>
  <rect x="568" y="76" width="168" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="652" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">改得动</text>
  <text x="652" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">supersede 链与复审</text>
  <line x1="197" y1="107" x2="207" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="377" y1="107" x2="387" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="557" y1="107" x2="567" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="156" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">四道关口有顺序：前一道不过，后一道做得多认真都没有意义</text>
  <rect x="28" y="186" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="92" y="207" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">总览：三种成本</text>
  <rect x="168" y="186" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="232" y="207" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">决策权与分级</text>
  <rect x="308" y="186" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="372" y="207" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">记录结构</text>
  <rect x="448" y="186" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="512" y="207" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">选项与判据</text>
  <rect x="588" y="186" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="652" y="207" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">取舍表达</text>
  <rect x="28" y="230" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="92" y="251" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">评审会</text>
  <rect x="168" y="230" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="232" y="251" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">反对意见</text>
  <rect x="308" y="230" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="372" y="251" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">修改与推翻</text>
  <rect x="448" y="230" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="512" y="251" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">实战：一次评审</text>
  <rect x="588" y="230" width="128" height="34" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="652" y="251" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">常见问题</text>
  <text x="380" y="290" text-anchor="middle" font-size="9" fill="#475569">十页正文：方法论 5 页（上排）+ 流程与实战 5 页（下排）</text>
  <rect x="120" y="312" width="520" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="330.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">共同产出：一份能被后人读懂、能被反驳、能被替换的记录</text>
  <text x="380" y="347" text-anchor="middle" font-size="7.5" fill="#047857">判据不用「写得好不好」衡量，只用「能不能回答问题」衡量</text>
  <text x="380" y="400" text-anchor="middle" font-size="9" fill="#64748B">本专题不重写「架构文档该产出什么」——那部分在「项目交付 · 架构设计」页</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
