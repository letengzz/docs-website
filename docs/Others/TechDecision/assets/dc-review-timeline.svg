<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" width="760" height="374" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="374" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一次 45 分钟评审的时间盒</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「表决」与「讨论」在时间上分开，避免讨论被第一个表态带偏</text>
  <rect x="40.0" y="100" width="69.3" height="46" rx="6" fill="#4F46E5" opacity="0.16" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="74.6667" y="128" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">0-5 陈述</text>
  <rect x="113.3" y="100" width="142.7" height="46" rx="6" fill="#0891B2" opacity="0.16" stroke="#0891B2" stroke-width="1.6"/>
  <text x="184.667" y="128" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">5-15 澄清</text>
  <rect x="260.0" y="100" width="362.7" height="46" rx="6" fill="#EA580C" opacity="0.16" stroke="#EA580C" stroke-width="1.6"/>
  <text x="441.333" y="128" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">15-40 争议</text>
  <rect x="626.7" y="100" width="69.3" height="46" rx="6" fill="#059669" opacity="0.16" stroke="#059669" stroke-width="1.6"/>
  <text x="661.333" y="128" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">40-45 决议</text>
  <text x="380" y="172" text-anchor="middle" font-size="9" fill="#475569">澄清只问事实、争议逐条过判据——两段混在一起，会变成互相觉得对方在抬杠</text>
  <rect x="30" y="192" width="220" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="210.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">会前</text>
  <text x="140" y="227" text-anchor="middle" font-size="7.5" fill="#1D4ED8">材料提前 ≥ 1 个工作日</text>
  <text x="140" y="244.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">含选项 / 判据 / 结论三件</text>
  <text x="140" y="261.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">≤ 6 页且列出待拍板问题</text>
  <rect x="270" y="192" width="220" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="210.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">会中</text>
  <text x="380" y="227" text-anchor="middle" font-size="7.5" fill="#C2410C">决策人最后发言</text>
  <text x="380" y="244.25" text-anchor="middle" font-size="7.5" fill="#C2410C">四类角色按序发言</text>
  <text x="380" y="261.5" text-anchor="middle" font-size="7.5" fill="#C2410C">事实问题记 action，24h 答复</text>
  <rect x="510" y="192" width="220" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="620" y="210.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">会后</text>
  <text x="620" y="227" text-anchor="middle" font-size="7.5" fill="#047857">决议方式写明</text>
  <text x="620" y="244.25" text-anchor="middle" font-size="7.5" fill="#047857">反对意见逐条入册</text>
  <text x="620" y="261.5" text-anchor="middle" font-size="7.5" fill="#047857">复审日与被推翻条件</text>
  <text x="380" y="308" text-anchor="middle" font-size="9" fill="#B91C1C" font-weight="bold">异步评审的反制：每人必回「同意 / 有保留 / 反对」，不回视为未评审</text>
  <rect x="200" y="320" width="360" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="338.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">决议三方式：共识 / 投票 / 授权人裁决</text>
  <text x="380" y="355" text-anchor="middle" font-size="7.5" fill="#4338CA">推荐默认第三种，但必须公开理由 + 记录反对</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
