<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">决策权与分档：谁定、定到哪一档</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">打分表的价值不是精确，是把「我觉得重要」变成三行可争论的数</text>
  <text x="60" y="82" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三维打分 → 三个档位 → 三种动作</text>
  <rect x="30" y="96" width="220" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">可逆性 R</text>
  <text x="140" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">权重 0.45</text>
  <text x="140" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">改回来要停机迁数据 = 10</text>
  <line x1="140" y1="164" x2="140" y2="184" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="96" width="220" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">影响面 I</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">权重 0.35</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">跨 3 个系统或对外承诺 = 10</text>
  <line x1="380" y1="164" x2="380" y2="184" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="96" width="220" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="620" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">时间压力 T</text>
  <text x="620" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">权重 0.20</text>
  <text x="620" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">一周不定就阻塞交付 = 10</text>
  <line x1="620" y1="164" x2="620" y2="184" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="150" y="186" width="460" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="204.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">总分 = R×0.45 + I×0.35 + T×0.20</text>
  <line x1="380" y1="222" x2="380" y2="240" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="242" width="220" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="140" y="260.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">A 档 ≥ 7</text>
  <text x="140" y="277" text-anchor="middle" font-size="7.5" fill="#B91C1C">书面提案 + 评审会</text>
  <text x="140" y="294.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">记录 + 复审日</text>
  <rect x="270" y="242" width="220" height="70" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="260.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">B 档 4 ~ 6.9</text>
  <text x="380" y="277" text-anchor="middle" font-size="7.5" fill="#C2410C">书面提案（可异步）</text>
  <text x="380" y="294.25" text-anchor="middle" font-size="7.5" fill="#C2410C">非提案方评审</text>
  <rect x="510" y="242" width="220" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="620" y="260.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">C 档 &lt; 4</text>
  <text x="620" y="277" text-anchor="middle" font-size="7.5" fill="#047857">一行记录：谁 / 何时 / 选什么</text>
  <text x="620" y="294.25" text-anchor="middle" font-size="7.5" fill="#047857">不必评审</text>
  <text x="380" y="336" text-anchor="middle" font-size="9" fill="#B91C1C" font-weight="bold">T 权重最低但方向特殊：时间紧不代表可以降档，它只影响论证要多快完成</text>
  <rect x="30" y="352" width="160" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="370.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">A 最终负责</text>
  <text x="110" y="387" text-anchor="middle" font-size="7.5" fill="#334155">只能 1 人，具名</text>
  <rect x="206" y="352" width="160" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="286" y="370.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">R 写材料</text>
  <text x="286" y="387" text-anchor="middle" font-size="7.5" fill="#334155">1 人，可换</text>
  <rect x="382" y="352" width="160" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="462" y="370.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">C 必询</text>
  <text x="462" y="387" text-anchor="middle" font-size="7.5" fill="#334155">≤ 4 人</text>
  <rect x="558" y="352" width="160" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="638" y="370.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">I 知会</text>
  <text x="638" y="387" text-anchor="middle" font-size="7.5" fill="#334155">不限，不进会</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
