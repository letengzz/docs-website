<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选项与判据：怎么保证选项是真的</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据的作用不是打分，是让某个选项必须被淘汰</text>
  <text x="30" y="80" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">选项 × 判据：一格一个取值，两行全同即假选项</text>
  <rect x="30" y="92" width="126" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="93" y="109" text-anchor="middle" font-size="8" fill="#3730A3" font-weight="bold"></text>
  <rect x="162" y="92" width="126" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="225" y="109" text-anchor="middle" font-size="8" fill="#3730A3" font-weight="bold">C1 一致性</text>
  <rect x="294" y="92" width="126" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="357" y="109" text-anchor="middle" font-size="8" fill="#3730A3" font-weight="bold">C2 故障域</text>
  <rect x="426" y="92" width="126" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="489" y="109" text-anchor="middle" font-size="8" fill="#3730A3" font-weight="bold">C3 成本</text>
  <rect x="558" y="92" width="126" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="621" y="109" text-anchor="middle" font-size="8" fill="#3730A3" font-weight="bold">C4 中间件</text>
  <rect x="30" y="122" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="93" y="138" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">本地 Caffeine</text>
  <rect x="162" y="122" width="126" height="24" rx="4" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="138" text-anchor="middle" font-size="8" fill="#1E293B">不满足</text>
  <rect x="294" y="122" width="126" height="24" rx="4" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1"/>
  <text x="357" y="138" text-anchor="middle" font-size="8" fill="#1E293B">不满足</text>
  <rect x="426" y="122" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="489" y="138" text-anchor="middle" font-size="8" fill="#1E293B">1.5 人周</text>
  <rect x="558" y="122" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="621" y="138" text-anchor="middle" font-size="8" fill="#1E293B">1 种</text>
  <rect x="30" y="150" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="93" y="166" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">Redis Cluster</text>
  <rect x="162" y="150" width="126" height="24" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="166" text-anchor="middle" font-size="8" fill="#1E293B">满足</text>
  <rect x="294" y="150" width="126" height="24" rx="4" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1"/>
  <text x="357" y="166" text-anchor="middle" font-size="8" fill="#1E293B">满足</text>
  <rect x="426" y="150" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="489" y="166" text-anchor="middle" font-size="8" fill="#1E293B">2.5 人周</text>
  <rect x="558" y="150" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="621" y="166" text-anchor="middle" font-size="8" fill="#1E293B">1 种</text>
  <rect x="30" y="178" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="93" y="194" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">不做</text>
  <rect x="162" y="178" width="126" height="24" rx="4" fill="#FEF2F2" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="194" text-anchor="middle" font-size="8" fill="#1E293B">不满足</text>
  <rect x="294" y="178" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="357" y="194" text-anchor="middle" font-size="8" fill="#1E293B">—</text>
  <rect x="426" y="178" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="489" y="194" text-anchor="middle" font-size="8" fill="#1E293B">0</text>
  <rect x="558" y="178" width="126" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="621" y="194" text-anchor="middle" font-size="8" fill="#1E293B">1 种</text>
  <text x="30" y="230" text-anchor="start" font-size="9" fill="#B91C1C" font-weight="bold">硬约束（门）：C1、C2 —— 不满足即淘汰，不进加权</text>
  <text x="30" y="250" text-anchor="start" font-size="9" fill="#065F46" font-weight="bold">软偏好（分）：C3、C4 —— 只在合格选项之间比较</text>
  <rect x="30" y="264" width="700" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="282.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">加权评分的翻盘率（5 候选 × 6 判据，权重 ±10%，20,000 次扰动）</text>
  <text x="380" y="299" text-anchor="middle" font-size="7.5" fill="#C2410C">领先 0.0% → 翻盘 50.19% ｜ 0.5% → 21.95% ｜ 1.0% → 5.92%</text>
  <text x="380" y="316.25" text-anchor="middle" font-size="7.5" fill="#C2410C">领先 2.0% → 0.04% ｜ 5% 与 10% → 0.00%（已翻不动）</text>
  <text x="380" y="362" text-anchor="middle" font-size="9" fill="#B91C1C" font-weight="bold">规则：前两名差值 &lt; 2% 时，用「哪条是硬约束」定结论，不要用总分</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
