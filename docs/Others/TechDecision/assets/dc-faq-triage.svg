<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="388" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">症状分诊：断了哪一道关口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">决策流程的问题症状几乎一样，差别只在断点位置</text>
  <rect x="280" y="76" width="200" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">症状：又从头吵一遍</text>
  <line x1="380" y1="118" x2="380" y2="138" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="120" y1="138" x2="640" y2="138" stroke="#475569" stroke-width="1.4"/>
  <line x1="120" y1="138" x2="120" y2="160" stroke="#475569" stroke-width="1.4"/>
  <rect x="10" y="160" width="220" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="120" y="178.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">不知道定了啥</text>
  <text x="120" y="195" text-anchor="middle" font-size="7.5" fill="#1D4ED8">标题不是决定</text>
  <text x="120" y="212.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">→ 总览</text>
  <line x1="380" y1="138" x2="380" y2="160" stroke="#475569" stroke-width="1.4"/>
  <rect x="270" y="160" width="220" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="178.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">只会反复开会</text>
  <text x="380" y="195" text-anchor="middle" font-size="7.5" fill="#C2410C">没有重开条件</text>
  <text x="380" y="212.25" text-anchor="middle" font-size="7.5" fill="#C2410C">→ 修改与推翻</text>
  <line x1="640" y1="138" x2="640" y2="160" stroke="#475569" stroke-width="1.4"/>
  <rect x="530" y="160" width="220" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="640" y="178.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">执行不一致</text>
  <text x="640" y="195" text-anchor="middle" font-size="7.5" fill="#6D28D9">A 不具名</text>
  <text x="640" y="212.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">→ 决策权</text>
  <text x="380" y="250" text-anchor="middle" font-size="9" fill="#475569">先定症状类别，再动手——在多个关口之间跳，是排错最常见的浪费</text>
  <rect x="30" y="268" width="280" height="28" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="170" y="286" text-anchor="middle" font-size="8" fill="#991B1B">上线出事才发现有人反对</text>
  <rect x="322" y="268" width="408" height="28" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="526" y="286" text-anchor="middle" font-size="8" fill="#065F46">未采纳意见没记 → 反对意见页</text>
  <rect x="30" y="302" width="280" height="28" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="170" y="320" text-anchor="middle" font-size="8" fill="#991B1B">四十条 ADR 不知哪条有效</text>
  <rect x="322" y="302" width="408" height="28" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="526" y="320" text-anchor="middle" font-size="8" fill="#065F46">跑三条盘点命令 → 修改与推翻页</text>
  <rect x="30" y="336" width="280" height="28" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="170" y="354" text-anchor="middle" font-size="8" fill="#991B1B">新人把老决定又推翻一次</text>
  <rect x="322" y="336" width="408" height="28" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="526" y="354" text-anchor="middle" font-size="8" fill="#065F46">判据没独立成段 → 记录结构页</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
