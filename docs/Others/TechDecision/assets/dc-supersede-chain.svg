<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">替换链与冲突检测</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">决策记录不可变：要改就新开一条并指回去</text>
  <rect x="30" y="84" width="176" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="118" y="102.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">DC-0004</text>
  <text x="118" y="119" text-anchor="middle" font-size="7.5" fill="#334155">自增主键</text>
  <text x="118" y="136.25" text-anchor="middle" font-size="7.5" fill="#334155">superseded</text>
  <line x1="208" y1="113" x2="228" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="230" y="84" width="176" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="318" y="102.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">DC-0012</text>
  <text x="318" y="119" text-anchor="middle" font-size="7.5" fill="#334155">改用 Redis Cluster</text>
  <text x="318" y="136.25" text-anchor="middle" font-size="7.5" fill="#334155">superseded</text>
  <line x1="408" y1="113" x2="428" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="430" y="84" width="176" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="518" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">DC-0021</text>
  <text x="518" y="119" text-anchor="middle" font-size="7.5" fill="#047857">三可用区版本</text>
  <text x="518" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">accepted</text>
  <text x="380" y="166" text-anchor="middle" font-size="8.5" fill="#B91C1C">只改 status 与 superseded_by，正文一字不动 —— 覆盖式修改会让「当时怎么想」永久消失</text>
  <rect x="30" y="182" width="340" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="200.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">正确：线性链，链尾即当前有效</text>
  <text x="200" y="217" text-anchor="middle" font-size="7.5" fill="#047857">DC-0004 → DC-0012 → DC-0021</text>
  <text x="200" y="234.25" text-anchor="middle" font-size="7.5" fill="#047857">反向索引里每条被替换次数 ≤ 1</text>
  <rect x="390" y="182" width="340" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="200.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">错误：分叉替换</text>
  <text x="560" y="217" text-anchor="middle" font-size="7.5" fill="#B91C1C">DC-0012 同时被 DC-0021 与 DC-0033 替换</text>
  <text x="560" y="234.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">后果：谁是当前有效，无解</text>
  <text x="30" y="282" text-anchor="start" font-size="9.5" fill="#0F172A" font-weight="bold">冲突检测：同主题下两条 accepted 且方向相反</text>
  <rect x="30" y="292" width="340" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="200" y="310.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">两两比较 O(N²)</text>
  <text x="200" y="327" text-anchor="middle" font-size="7.5" fill="#C2410C">200 条 19,900 对 → 3.148 ms</text>
  <text x="200" y="344.25" text-anchor="middle" font-size="7.5" fill="#C2410C">2,000 条 1,999,000 对 → 367.259 ms</text>
  <rect x="390" y="292" width="340" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="310.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">主题键分组</text>
  <text x="560" y="327" text-anchor="middle" font-size="7.5" fill="#0F766E">200 条 → 1.375 ms（2.3×）</text>
  <text x="560" y="344.25" text-anchor="middle" font-size="7.5" fill="#0F766E">2,000 条 → 44.450 ms（8.3×）</text>
  <text x="380" y="376" text-anchor="middle" font-size="8.5" fill="#475569">两种做法的冲突集合完全一致（脚本断言 true）——优化只缩范围，不改语义</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
