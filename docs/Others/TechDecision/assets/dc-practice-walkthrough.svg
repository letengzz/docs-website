<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="394" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一次缓存选型评审的完整流水</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">材料 → 澄清 → 争议 → 决议 → 两周后部分推翻</text>
  <rect x="30" y="76" width="110" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="85" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">材料</text>
  <text x="85" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">会前 26h 发出</text>
  <rect x="160" y="76" width="570" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="445" y="94" text-anchor="middle" font-size="7.5" fill="#334155">5 页：结论 / 选项 / 判据 / 代价 / 待拍板</text>
  <line x1="142" y1="99" x2="158" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="134" width="110" height="46" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="85" y="152.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">澄清</text>
  <text x="85" y="169" text-anchor="middle" font-size="7.5" fill="#0E7490">第 5-15 分钟</text>
  <rect x="160" y="134" width="570" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="445" y="152" text-anchor="middle" font-size="7.5" fill="#334155">哨兵能否替代 → 记为事实问题</text>
  <line x1="142" y1="157" x2="158" y2="157" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="192" width="110" height="46" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="85" y="210.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">争议</text>
  <text x="85" y="227" text-anchor="middle" font-size="7.5" fill="#C2410C">第 15-40 分钟</text>
  <rect x="160" y="192" width="570" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="445" y="210" text-anchor="middle" font-size="7.5" fill="#334155">一条价值型 + 一条方案型反对</text>
  <line x1="142" y1="215" x2="158" y2="215" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="250" width="110" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="85" y="268.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">决议</text>
  <text x="85" y="285" text-anchor="middle" font-size="7.5" fill="#6D28D9">第 40-45 分钟</text>
  <rect x="160" y="250" width="570" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="445" y="268" text-anchor="middle" font-size="7.5" fill="#334155">授权人裁决；异议窗口 48h</text>
  <line x1="142" y1="273" x2="158" y2="273" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="308" width="110" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="85" y="326.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">重开</text>
  <text x="85" y="343" text-anchor="middle" font-size="7.5" fill="#047857">第 9 天</text>
  <rect x="160" y="308" width="570" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="445" y="326" text-anchor="middle" font-size="7.5" fill="#334155">工期超 20% → 命中触发条件 → DC-0021</text>
  <line x1="142" y1="331" x2="158" y2="331" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="376" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">最大产出不是「选了什么」，而是发现了 3 处跨槽 MULTI —— 只走「通过 / 不通过」不会有这个发现</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
