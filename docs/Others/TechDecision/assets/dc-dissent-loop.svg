<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">反对意见的四种类型与留痕四要素</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">记录反对意见不是照顾少数派，是让未来的自己知道当初赌的是什么</text>
  <rect x="30" y="78" width="170" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="115" y="96.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">事实型</text>
  <text x="115" y="113" text-anchor="middle" font-size="7.5" fill="#B91C1C">「这个库不支持事务」</text>
  <rect x="220" y="78" width="250" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="345" y="96" text-anchor="middle" font-size="7.5" fill="#334155">阻塞：核实前不表决</text>
  <line x1="202" y1="103" x2="218" y2="103" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="138" width="170" height="50" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="115" y="156.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">风险型</text>
  <text x="115" y="173" text-anchor="middle" font-size="7.5" fill="#C2410C">「切换期有写不可用」</text>
  <rect x="220" y="138" width="250" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="345" y="156" text-anchor="middle" font-size="7.5" fill="#334155">不阻塞：配信号 + 止损</text>
  <line x1="202" y1="163" x2="218" y2="163" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="198" width="170" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="115" y="216.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">价值型</text>
  <text x="115" y="233" text-anchor="middle" font-size="7.5" fill="#6D28D9">「我宁愿慢也不接受」</text>
  <rect x="220" y="198" width="250" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="345" y="216" text-anchor="middle" font-size="7.5" fill="#334155">不阻塞：裁决并说明理由</text>
  <line x1="202" y1="223" x2="218" y2="223" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="258" width="170" height="50" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="115" y="276.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">方案型</text>
  <text x="115" y="293" text-anchor="middle" font-size="7.5" fill="#0F766E">「不如用哨兵」</text>
  <rect x="220" y="258" width="250" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="345" y="276" text-anchor="middle" font-size="7.5" fill="#334155">不阻塞：补进选项表比对</text>
  <line x1="202" y1="283" x2="218" y2="283" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="560" y="100" text-anchor="middle" font-size="9.5" fill="#0F172A" font-weight="bold">四要素</text>
  <rect x="500" y="110" width="230" height="28" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="615" y="128" text-anchor="middle" font-size="7.5" fill="#047857">提出人 / 角色</text>
  <rect x="500" y="144" width="230" height="28" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="615" y="162" text-anchor="middle" font-size="7.5" fill="#047857">意见（原话）</text>
  <rect x="500" y="178" width="230" height="28" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="615" y="196" text-anchor="middle" font-size="7.5" fill="#047857">不采纳的理由</text>
  <rect x="500" y="212" width="230" height="28" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="615" y="230" text-anchor="middle" font-size="7.5" fill="#047857">重开条件</text>
  <line x1="474" y1="200" x2="498" y2="200" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="340" text-anchor="middle" font-size="8.5" fill="#B91C1C" font-weight="bold">升级五条件：事实被证实 · 硬约束被违反 · 风险已发生 · 外部条件变化 · 复审日到期</text>
  <text x="380" y="362" text-anchor="middle" font-size="9" fill="#475569">缺「重开条件」的反对意见会变成永久悬案：每次都要靠人吵一次才重开</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
