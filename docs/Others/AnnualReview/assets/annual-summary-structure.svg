<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">年度总结的推荐结构</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="76" width="810" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="445" y="102" fill="#1d4ed8" font-weight="bold" font-size="14">① 一句话总结</text>
    <text x="445" y="122" fill="#4b5563" font-size="11">今年最大的变化是什么（用一句能被复述的话概括）</text>
    <rect x="40" y="148" width="810" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="445" y="174" fill="#047857" font-weight="bold" font-size="14">② 关键数据</text>
    <text x="445" y="194" fill="#4b5563" font-size="11">投入时间 / 产出数量 / 质量指标，能取到数的都写数，取不到数的写清口径</text>
    <rect x="40" y="220" width="810" height="60" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="445" y="246" fill="#b45309" font-weight="bold" font-size="14">③ 做成了什么</text>
    <text x="445" y="266" fill="#4b5563" font-size="11">按主题分组，每条写「目标 → 结果 → 证据」三要素，不写感受</text>
    <rect x="40" y="292" width="810" height="60" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="445" y="318" fill="#be123c" font-weight="bold" font-size="14">④ 没做成什么</text>
    <text x="445" y="338" fill="#4b5563" font-size="11">写清原因分类：判断失误 / 执行不足 / 外部变化，并为每类给一条改进</text>
    <rect x="40" y="364" width="810" height="56" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="445" y="390" fill="#6d28d9" font-weight="bold" font-size="14">⑤ 明年要变什么</text>
    <text x="445" y="410" fill="#4b5563" font-size="11">最多 3 条，每条可验证：改成什么、怎么衡量、什么时候检查</text>
</g>
  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#475569">写总结时最容易犯的错：把「忙碌」当「成果」。忙碌是投入，成果必须能说清「改变了什么」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
