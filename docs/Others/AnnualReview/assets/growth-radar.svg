<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">个人能力雷达与差距分析</text>
  <g font-size="13" text-anchor="middle">
    <polygon points="300.0,217.5 328.1,233.8 328.1,266.2 300.0,282.5 271.9,266.2 271.9,233.8" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="300.0,185.0 356.3,217.5 356.3,282.5 300.0,315.0 243.7,282.5 243.7,217.5" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="300.0,152.5 384.4,201.2 384.4,298.8 300.0,347.5 215.6,298.8 215.6,201.2" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="300.0,120.0 412.6,185.0 412.6,315.0 300.0,380.0 187.4,315.0 187.4,185.0" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 300 250 L 300.0 120.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="300.0" y="98.0" text-anchor="middle" fill="#4b5563" font-size="11">工程实现</text>
    <path d="M 300 250 L 412.6 185.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="435.1" y="174.0" text-anchor="middle" fill="#4b5563" font-size="11">系统设计</text>
    <path d="M 300 250 L 412.6 315.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="435.1" y="326.0" text-anchor="middle" fill="#4b5563" font-size="11">数据处理</text>
    <path d="M 300 250 L 300.0 380.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="300.0" y="402.0" text-anchor="middle" fill="#4b5563" font-size="11">运维能力</text>
    <path d="M 300 250 L 187.4 315.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="164.9" y="326.0" text-anchor="middle" fill="#4b5563" font-size="11">协作沟通</text>
    <path d="M 300 250 L 187.4 185.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <text x="164.9" y="174.0" text-anchor="middle" fill="#4b5563" font-size="11">知识沉淀</text>
    <polygon points="300.0,139.5 378.8,204.5 361.9,285.8 300.0,328.0 215.6,298.8 209.9,198.0" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-width="2"/>
    <rect x="520" y="90" width="340" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="690" y="116" fill="#4338ca" font-weight="bold" font-size="14">怎么用这张图</text>
    <text x="690" y="136" fill="#4b5563" font-size="11">给自己每项打 0~1 分（用最近一次真实任务的表现）</text>
    <text x="690" y="153" fill="#4b5563" font-size="11">找「高分但用不上」与「低分且天天用」的交集</text>
    <text x="690" y="170" fill="#4b5563" font-size="11">低分 × 高频 = 明年的第一优先级</text>
    <rect x="520" y="250" width="340" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="690" y="276" fill="#b45309" font-weight="bold" font-size="14">半年后再画一次</text>
    <text x="690" y="296" fill="#4b5563" font-size="11">同一维度、同一打分口径，才有可比性</text>
    <text x="690" y="313" fill="#4b5563" font-size="11">分数不涨但任务完成度涨了，也是进步</text>
    <text x="690" y="330" fill="#4b5563" font-size="11">分值变化比绝对值更有信息量</text>
    <text x="690" y="347" fill="#4b5563" font-size="11">不要用雷达图做对外展示，它只服务于自己</text>
</g>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#475569">能力盘点的意义不是打分，而是找出「投入方向」与「实际瓶颈」之间的错位</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
