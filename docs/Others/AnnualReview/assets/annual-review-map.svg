<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">年度复盘全景</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="76" width="200" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="102" fill="#1d4ed8" font-weight="bold" font-size="14">① 盘点</text>
    <text x="130" y="122" fill="#4b5563" font-size="11">文档库 / 资产盘点</text>
    <text x="130" y="139" fill="#4b5563" font-size="11">数据与指标回收</text>
    <text x="130" y="156" fill="#4b5563" font-size="11">事实先于评价</text>
    <rect x="250" y="76" width="200" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="102" fill="#047857" font-weight="bold" font-size="14">② 重构</text>
    <text x="350" y="122" fill="#4b5563" font-size="11">知识体系去重合并</text>
    <text x="350" y="139" fill="#4b5563" font-size="11">结构重新分类</text>
    <text x="350" y="156" fill="#4b5563" font-size="11">淘汰与归档</text>
    <rect x="470" y="76" width="200" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="570" y="102" fill="#b45309" font-weight="bold" font-size="14">③ 总结</text>
    <text x="570" y="122" fill="#4b5563" font-size="11">亮点与不足</text>
    <text x="570" y="139" fill="#4b5563" font-size="11">用数据说话</text>
    <text x="570" y="156" fill="#4b5563" font-size="11">写成可传播的文档</text>
    <rect x="690" y="76" width="180" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="780" y="102" fill="#6d28d9" font-weight="bold" font-size="14">④ 规划</text>
    <text x="780" y="122" fill="#4b5563" font-size="11">目标拆到季度</text>
    <text x="780" y="139" fill="#4b5563" font-size="11">资源与节奏</text>
    <text x="780" y="156" fill="#4b5563" font-size="11">风险与预案</text>
    <rect x="30" y="250" width="840" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="276" fill="#4338ca" font-weight="bold" font-size="14">三层复盘对象</text>
    <text x="450" y="296" fill="#4b5563" font-size="11">个人层：能力结构、时间投入、成长瓶颈 → 决定明年学什么、放什么</text>
    <text x="450" y="313" fill="#4b5563" font-size="11">项目层：交付质量、返工原因、协作成本 → 决定明年怎么改流程</text>
    <text x="450" y="330" fill="#4b5563" font-size="11">资产层：文档库、代码库、模板库 → 决定明年复用什么、清理什么</text>
    <path d="M 230 141 L 244 141" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 450 141 L 464 141" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 670 141 L 684 141" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#475569">复盘不是写作文：先有事实与数据，才有结论；先有结论，才谈规划</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
