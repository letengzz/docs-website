<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">四套常用复盘方法</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="76" width="200" height="170" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="102" fill="#047857" font-weight="bold" font-size="14">KPT</text>
    <text x="130" y="122" fill="#4b5563" font-size="11">Keep：继续做的</text>
    <text x="130" y="139" fill="#4b5563" font-size="11">Problem：要改的</text>
    <text x="130" y="156" fill="#4b5563" font-size="11">Try：下一轮实验</text>
    <text x="130" y="173" fill="#4b5563" font-size="11">轻量，适合迭代回顾</text>
    <rect x="245" y="76" width="200" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="102" fill="#b45309" font-weight="bold" font-size="14">GRAI</text>
    <text x="345" y="122" fill="#4b5563" font-size="11">Goal：当初的目标</text>
    <text x="345" y="139" fill="#4b5563" font-size="11">Result：实际结果</text>
    <text x="345" y="156" fill="#4b5563" font-size="11">Analysis：差异原因</text>
    <text x="345" y="173" fill="#4b5563" font-size="11">Insight：规律与结论</text>
    <text x="345" y="190" fill="#4b5563" font-size="11">适合项目复盘</text>
    <rect x="460" y="76" width="200" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="560" y="102" fill="#1d4ed8" font-weight="bold" font-size="14">PDCA</text>
    <text x="560" y="122" fill="#4b5563" font-size="11">Plan → Do → Check → Act</text>
    <text x="560" y="139" fill="#4b5563" font-size="11">强调循环而非一次性</text>
    <text x="560" y="156" fill="#4b5563" font-size="11">适合流程与机制改进</text>
    <rect x="675" y="76" width="195" height="170" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="772" y="102" fill="#6d28d9" font-weight="bold" font-size="14">OKR 对齐</text>
    <text x="772" y="122" fill="#4b5563" font-size="11">Objective：方向</text>
    <text x="772" y="139" fill="#4b5563" font-size="11">Key Results：可衡量结果</text>
    <text x="772" y="156" fill="#4b5563" font-size="11">打分与复盘同等重要</text>
    <text x="772" y="173" fill="#4b5563" font-size="11">适合目标管理</text>
    <rect x="120" y="280" width="660" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="306" fill="#4338ca" font-weight="bold" font-size="14">怎么组合用</text>
    <text x="450" y="326" fill="#4b5563" font-size="11">个人年度复盘：GRAI（目标-结果-分析-结论）梳理全年，再叠加 OKR 复盘目标达成度</text>
    <text x="450" y="343" fill="#4b5563" font-size="11">团队迭代回顾：KPT 每周/每两周一次，保持轻量可执行</text>
    <text x="450" y="360" fill="#4b5563" font-size="11">机制改进：PDCA 闭环，把「做过的改进」固化成规范</text>
</g>
  <text x="450" y="396" text-anchor="middle" font-size="13" fill="#475569">方法只是脚手架：真正决定质量的，是「敢不敢写下真实数据」和「结论能不能落到下一年的行动」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
