<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">文档库盘点的六个维度</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="76" width="270" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="165" y="102" fill="#1d4ed8" font-weight="bold" font-size="14">结构维度</text>
    <text x="165" y="122" fill="#4b5563" font-size="11">目录层级是否 ≤ 3 层</text>
    <text x="165" y="139" fill="#4b5563" font-size="11">每个主题是否有入口页</text>
    <text x="165" y="156" fill="#4b5563" font-size="11">侧边栏与目录是否一致</text>
    <text x="165" y="173" fill="#4b5563" font-size="11">是否存在平铺单文件</text>
    <rect x="320" y="76" width="270" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="455" y="102" fill="#047857" font-weight="bold" font-size="14">内容维度</text>
    <text x="455" y="122" fill="#4b5563" font-size="11">是否有空壳页（&lt; 60 行）</text>
    <text x="455" y="139" fill="#4b5563" font-size="11">是否有重复主题</text>
    <text x="455" y="156" fill="#4b5563" font-size="11">示例是否可运行</text>
    <text x="455" y="173" fill="#4b5563" font-size="11">是否缺配图与易错点</text>
    <rect x="610" y="76" width="260" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="740" y="102" fill="#b45309" font-weight="bold" font-size="14">时效维度</text>
    <text x="740" y="122" fill="#4b5563" font-size="11">版本号是否过期</text>
    <text x="740" y="139" fill="#4b5563" font-size="11">命令 / API 是否仍有效</text>
    <text x="740" y="156" fill="#4b5563" font-size="11">是否有「待核实」残留</text>
    <text x="740" y="173" fill="#4b5563" font-size="11">最后更新时间分布</text>
    <rect x="30" y="250" width="270" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="165" y="276" fill="#6d28d9" font-weight="bold" font-size="14">链接维度</text>
    <text x="165" y="296" fill="#4b5563" font-size="11">站内相对链接可达率</text>
    <text x="165" y="313" fill="#4b5563" font-size="11">外链失效率</text>
    <text x="165" y="330" fill="#4b5563" font-size="11">锚点是否有效</text>
    <text x="165" y="347" fill="#4b5563" font-size="11">图片路径是否为相对路径</text>
    <rect x="320" y="250" width="270" height="150" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="455" y="276" fill="#0f766e" font-weight="bold" font-size="14">规范维度</text>
    <text x="455" y="296" fill="#4b5563" font-size="11">命名是否符合约定</text>
    <text x="455" y="313" fill="#4b5563" font-size="11">代码块是否标语言</text>
    <text x="455" y="330" fill="#4b5563" font-size="11">表格是否有分隔行</text>
    <text x="455" y="347" fill="#4b5563" font-size="11">容器是否有未闭合</text>
    <rect x="610" y="250" width="260" height="150" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="740" y="276" fill="#be123c" font-weight="bold" font-size="14">价值维度</text>
    <text x="740" y="296" fill="#4b5563" font-size="11">哪些页面真的被访问</text>
    <text x="740" y="313" fill="#4b5563" font-size="11">哪些主题反复被问</text>
    <text x="740" y="330" fill="#4b5563" font-size="11">哪些内容已无读者</text>
    <text x="740" y="347" fill="#4b5563" font-size="11">是否需要合并或下线</text>
</g>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#475569">盘点产出必须是一张「问题清单 + 处置动作 + 责任人」，而不是一份好看的统计报告</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
