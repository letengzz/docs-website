<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">实战：一个周末走完年度复盘</text>
  <g font-size="13" text-anchor="middle">
    <path d="M 60 130 L 840 130" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <rect x="40" y="60" width="150" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="86" fill="#1d4ed8" font-weight="bold" font-size="14">周五晚</text>
    <text x="115" y="106" fill="#4b5563" font-size="11">回收数据</text>
    <text x="115" y="123" fill="#4b5563" font-size="11">导出记录</text>
    <rect x="210" y="60" width="150" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="285" y="86" fill="#047857" font-weight="bold" font-size="14">周六上午</text>
    <text x="285" y="106" fill="#4b5563" font-size="11">盘点与重构</text>
    <text x="285" y="123" fill="#4b5563" font-size="11">去重合并</text>
    <rect x="380" y="60" width="150" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="455" y="86" fill="#b45309" font-weight="bold" font-size="14">周六下午</text>
    <text x="455" y="106" fill="#4b5563" font-size="11">写年度总结</text>
    <text x="455" y="123" fill="#4b5563" font-size="11">数据+结论</text>
    <rect x="550" y="60" width="150" height="70" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="625" y="86" fill="#6d28d9" font-weight="bold" font-size="14">周日上午</text>
    <text x="625" y="106" fill="#4b5563" font-size="11">规划下一年</text>
    <text x="625" y="123" fill="#4b5563" font-size="11">拆到季度</text>
    <rect x="720" y="60" width="150" height="70" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="795" y="86" fill="#0f766e" font-weight="bold" font-size="14">周日下午</text>
    <text x="795" y="106" fill="#4b5563" font-size="11">定检查点</text>
    <text x="795" y="123" fill="#4b5563" font-size="11">写进日历</text>
    <rect x="120" y="220" width="300" height="170" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="270" y="246" fill="#4338ca" font-weight="bold" font-size="14">需要准备的数据源</text>
    <text x="270" y="266" fill="#4b5563" font-size="11">文档库 / Git 提交记录（产出量）</text>
    <text x="270" y="283" fill="#4b5563" font-size="11">事项系统（完成率、周期时间）</text>
    <text x="270" y="300" fill="#4b5563" font-size="11">监控与故障记录（稳定性）</text>
    <text x="270" y="317" fill="#4b5563" font-size="11">日历与时间记录（投入分布）</text>
    <text x="270" y="334" fill="#4b5563" font-size="11">笔记与周报（当时的判断）</text>
    <rect x="470" y="220" width="330" height="170" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="635" y="246" fill="#be123c" font-weight="bold" font-size="14">必须写下来的四件事</text>
    <text x="635" y="266" fill="#4b5563" font-size="11">今年最有效的一个习惯（保持）</text>
    <text x="635" y="283" fill="#4b5563" font-size="11">今年最大的一个误判（避免）</text>
    <text x="635" y="300" fill="#4b5563" font-size="11">明年最重要的一个方向（聚焦）</text>
    <text x="635" y="317" fill="#4b5563" font-size="11">最早什么时候能验证方向对不对（检查点）</text>
</g>
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#475569">复盘要一气呵成：分散到一个月里做，你最后只会得到一堆碎片笔记</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
