<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="462" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">上线验收清单：六类共 18 项，逐项留痕</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">验收表的价值在于「未验证」这三个字——它让没做过的事无法伪装成做过了</text>
  <rect x="40" y="80" width="330" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="205" y="98.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">① 功能与接口</text>
  <text x="205" y="115" text-anchor="middle" font-size="7.5" fill="#047857">验收条件逐条勾选</text>
  <text x="205" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">接口全部按契约返回</text>
  <text x="205" y="149.5" text-anchor="middle" font-size="7.5" fill="#047857">错误码与文档一致</text>
  <rect x="390" y="80" width="330" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="555" y="98.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 数据与迁移</text>
  <text x="555" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">迁移脚本已在预发跑过</text>
  <text x="555" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">回滚方案已验证</text>
  <text x="555" y="149.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">种子数据可重放</text>
  <rect x="40" y="168" width="330" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="205" y="186.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">③ 性能与容量</text>
  <text x="205" y="203" text-anchor="middle" font-size="7.5" fill="#B45309">压测报告达标</text>
  <text x="205" y="220.25" text-anchor="middle" font-size="7.5" fill="#B45309">慢查询已优化</text>
  <text x="205" y="237.5" text-anchor="middle" font-size="7.5" fill="#B45309">容量余量 ≥ 30%</text>
  <rect x="390" y="168" width="330" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="555" y="186.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">④ 安全与权限</text>
  <text x="555" y="203" text-anchor="middle" font-size="7.5" fill="#B91C1C">越权用例全部 403</text>
  <text x="555" y="220.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">密钥不落镜像与日志</text>
  <text x="555" y="237.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">依赖漏洞扫描通过</text>
  <rect x="40" y="256" width="330" height="74" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="205" y="274.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">⑤ 可观测与运维</text>
  <text x="205" y="291" text-anchor="middle" font-size="7.5" fill="#0F766E">日志带 traceId</text>
  <text x="205" y="308.25" text-anchor="middle" font-size="7.5" fill="#0F766E">健康检查可机读</text>
  <text x="205" y="325.5" text-anchor="middle" font-size="7.5" fill="#0F766E">告警接进值班渠道</text>
  <rect x="390" y="256" width="330" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="555" y="274.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">⑥ 文档与复现</text>
  <text x="555" y="291" text-anchor="middle" font-size="7.5" fill="#6D28D9">README 能从零跑起</text>
  <text x="555" y="308.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">部署脚本可复现</text>
  <text x="555" y="325.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">变更记录已写</text>
  <rect x="40" y="348" width="680" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="366.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">验收规则：清单上的每一项都要有「谁在什么时间验过」的记录，不接受口头确认</text>
  <text x="380" y="383" text-anchor="middle" font-size="7.5" fill="#334155">没验过的项一律写「未验证」而不是「应该没问题」——验收表不是形式，是上线前的最后一道体检</text>
  <text x="380" y="444" text-anchor="middle" font-size="8" fill="#64748B">最容易被跳过的是第 ⑥ 项：功能没问题，但换个人按文档跑不起来，项目就还差最后一步</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
