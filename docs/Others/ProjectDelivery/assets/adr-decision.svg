<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">决策按「可逆性」分类，而不是按重要性</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">可逆的就快速试错，不可逆的才值得写进 ADR 反复论证——把论证花在刀口上</text>
  <rect x="40" y="80" width="320" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">可逆决策</text>
  <text x="200" y="115" text-anchor="middle" font-size="7.5" fill="#047857">语言与框架版本、目录结构、</text>
  <text x="200" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">构建工具、日志方案</text>
  <rect x="400" y="80" width="320" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="98.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">不可逆 / 高成本决策</text>
  <text x="560" y="115" text-anchor="middle" font-size="7.5" fill="#B91C1C">数据库主键策略、多租户模型、</text>
  <text x="560" y="132.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">对外接口语义、数据保留口径</text>
  <line x1="200" y1="138" x2="200" y2="170" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="560" y1="138" x2="560" y2="170" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="40" y="170" width="320" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="188.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">判断原则：先做，边做边改</text>
  <text x="200" y="205" text-anchor="middle" font-size="7.5" fill="#047857">写进 ADR 与否都可，改起来是一次提交的事</text>
  <text x="200" y="222.25" text-anchor="middle" font-size="7.5" fill="#047857">把时间花在验证上，而不是反复论证</text>
  <rect x="400" y="170" width="320" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="188.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">判断原则：先论证，写进 ADR 再动手</text>
  <text x="560" y="205" text-anchor="middle" font-size="7.5" fill="#B91C1C">改一次要迁数据、改契约、通知调用方</text>
  <text x="560" y="222.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">用文档把「为什么这么定」固化下来</text>
  <rect x="40" y="270" width="680" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="288.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">ADR（Architecture Decision Record）四段式</text>
  <text x="380" y="305" text-anchor="middle" font-size="7.5" fill="#6D28D9">① 背景与约束：现在面临什么问题，有哪些前提不能动</text>
  <text x="380" y="322.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">② 决策：选了什么，明确写出「不选什么」以及原因</text>
  <text x="380" y="339.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">③ 后果：获得了什么、付出了什么、什么条件下需要重新评估</text>
  <text x="380" y="356.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">④ 状态：已采纳 / 已废弃 / 被哪一条取代</text>
  <text x="380" y="386" text-anchor="middle" font-size="8" fill="#64748B">判断一条决策要不要写 ADR，只看一个问题：改它的代价是几分钟，还是几周？</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
