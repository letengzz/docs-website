<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">需求漏斗：从一句诉求到可验收的条件</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「做完了」的标准必须在动手前写成可对照的句子，否则验收只能靠感觉</text>
  <rect x="40" y="80" width="680" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">原始诉求：一句「我想要个能管订单的后台」</text>
  <line x1="380" y1="126" x2="380" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="120" y="148" width="520" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="166.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">用户故事：作为运营，我希望按状态筛选订单，以便处理异常单</text>
  <line x1="380" y1="194" x2="380" y2="216" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="120" y="216" width="520" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="234.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">验收条件（Given / When / Then）</text>
  <text x="380" y="251" text-anchor="middle" font-size="7.5" fill="#1D4ED8">给定存在 12 笔待发货订单，当我按「待发货」筛选，则列表返回 12 条且分页正确</text>
  <line x1="380" y1="268" x2="380" y2="290" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="120" y="290" width="520" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="308.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">范围裁剪</text>
  <text x="380" y="325" text-anchor="middle" font-size="7.5" fill="#047857">本轮做「筛选 + 分页」；导出 Excel、批量改状态移入下一轮并写明理由</text>
  <line x1="380" y1="342" x2="380" y2="364" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="120" y="364" width="520" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="382.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">非功能需求（同样要可验收）</text>
  <text x="380" y="399" text-anchor="middle" font-size="7.5" fill="#B45309">列表 P95 &lt; 300ms（1 万条数据）；错误响应统一 Result 结构；越权访问返回 403</text>
  <text x="380" y="442" text-anchor="middle" font-size="8" fill="#64748B">验收条件的写法：给定什么前提、做了什么操作、期望什么结果——三者缺一，需求就还没拆完</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
