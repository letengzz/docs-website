<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="438" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">测试分层：谁的活谁干，别让上层替下层兜底</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">越靠下的层跑得越快、越多；越靠上的层越少但越接近「用户能不能用」</text>
  <rect x="230" y="76" width="300" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">端到端测试（少而稳）</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#B91C1C">关键用户旅程 5~20 条</text>
  <rect x="180" y="132" width="400" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="150.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">集成测试（覆盖主链路）</text>
  <text x="380" y="167" text-anchor="middle" font-size="7.5" fill="#B45309">真实数据库与缓存容器</text>
  <rect x="130" y="188" width="500" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="206.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">单元测试（快、多、便宜）</text>
  <text x="380" y="223" text-anchor="middle" font-size="7.5" fill="#047857">纯逻辑与边界条件</text>
  <rect x="80" y="244" width="600" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="262.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">静态检查与合约（每次提交都跑）</text>
  <text x="380" y="279" text-anchor="middle" font-size="7.5" fill="#334155">lint / 类型 / 契约回归 / 覆盖率门禁</text>
  <line x1="380" y1="204" x2="380" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="312" width="680" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="330.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">分层职责要划清，否则会互相假装</text>
  <text x="380" y="347" text-anchor="middle" font-size="7.5" fill="#1D4ED8">单元测试不碰数据库与网络；集成测试不 mock 自己的数据库；</text>
  <text x="380" y="364.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">端到端只验「串起来是通的」，不用它去覆盖分支；</text>
  <text x="380" y="381.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">覆盖率门禁按模块设，不给全库设一个平均线（平均线只会被最容易的模块拉高）</text>
  <text x="380" y="420" text-anchor="middle" font-size="8" fill="#64748B">flaky 测试必须当天修或删除：随机失败的用例会训练团队忽略红色，比没有测试更糟</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
