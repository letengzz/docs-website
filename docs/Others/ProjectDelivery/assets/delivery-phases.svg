<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="336" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">完整项目的四周里程碑与各自的验收判据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把大目标切成四段，每段收尾都有可执行的验证——没有验证的里程碑等于没有里程碑</text>
  <rect x="10" y="84" width="132" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="76" y="102.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">第 1 周 · 需求设计</text>
  <text x="76" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">用户故事 + 验收条件</text>
  <text x="76" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">架构与数据建模</text>
  <text x="76" y="153.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">接口契约评审</text>
  <rect x="162" y="84" width="132" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="228" y="102.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">第 2 周 · 核心编码</text>
  <text x="228" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">骨架可启动</text>
  <text x="228" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">主流程接口可调</text>
  <text x="228" y="153.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">页面可访问</text>
  <rect x="314" y="84" width="132" height="104" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="102.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">第 3 周 · 联调测试</text>
  <text x="380" y="119" text-anchor="middle" font-size="7.5" fill="#047857">前后端联调通过</text>
  <text x="380" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">自动化测试全绿</text>
  <text x="380" y="153.5" text-anchor="middle" font-size="7.5" fill="#047857">压测达标</text>
  <rect x="466" y="84" width="132" height="104" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="532" y="102.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">第 4 周 · 部署验收</text>
  <text x="532" y="119" text-anchor="middle" font-size="7.5" fill="#B45309">一键部署成功</text>
  <text x="532" y="136.25" text-anchor="middle" font-size="7.5" fill="#B45309">监控接入</text>
  <text x="532" y="153.5" text-anchor="middle" font-size="7.5" fill="#B45309">验收清单全过</text>
  <rect x="618" y="84" width="132" height="104" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="684" y="102.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">贯穿全程</text>
  <text x="684" y="119" text-anchor="middle" font-size="7.5" fill="#334155">每日一个可验证步骤</text>
  <text x="684" y="136.25" text-anchor="middle" font-size="7.5" fill="#334155">当日文档留档</text>
  <text x="684" y="153.5" text-anchor="middle" font-size="7.5" fill="#334155">不留「以后再补」</text>
  <line x1="142" y1="136" x2="162" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="294" y1="136" x2="314" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="446" y1="136" x2="466" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="598" y1="136" x2="618" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="214" width="680" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="232.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">每周的验收判据都是「可执行的命令 + 可看到的输出」</text>
  <text x="380" y="249" text-anchor="middle" font-size="7.5" fill="#B91C1C">第 1 周：设计文档 / ER 图 / 接口契约齐全；第 2 周：服务启动 + 接口返回预期；</text>
  <text x="380" y="266.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">第 3 周：mvn verify 全绿 + 压测报告；第 4 周：部署脚本跑通 + 验收清单签字</text>
  <text x="380" y="318" text-anchor="middle" font-size="8" fill="#64748B">里程碑的作用不是排期，而是让「现在到哪一步了」这件事有客观答案</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
