<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="446" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">完整项目交付专题：四个阶段的九页地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">交付不是把代码写完，而是把「能验收、能复现、能回滚」这三件事一起做出来</text>
  <rect x="40" y="78" width="680" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="54" y="118" font-size="10" fill="#5B21B6" font-weight="bold">① 想清楚</text>
  <text x="117" y="109.5" font-size="8" fill="#6D28D9">Requirements：把诉求拆成可验收的用户故事与验收条件</text>
  <text x="117" y="125.5" font-size="8" fill="#6D28D9">Architecture：分层与边界，区分可逆与不可逆决策</text>
  <rect x="40" y="162" width="680" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="54" y="202" font-size="10" fill="#1E3A8A" font-weight="bold">② 定契约</text>
  <text x="117" y="193.5" font-size="8" fill="#1D4ED8">Contract：接口契约先行，前后端并行开发</text>
  <text x="117" y="209.5" font-size="8" fill="#1D4ED8">DataModel：数据建模、迁移版本化与向后兼容</text>
  <rect x="40" y="246" width="680" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="54" y="286" font-size="10" fill="#065F46" font-weight="bold">③ 做与验</text>
  <text x="117" y="277.5" font-size="8" fill="#047857">Testing：分层测试与覆盖率门禁，flaky 治理</text>
  <text x="117" y="293.5" font-size="8" fill="#047857">Overview：四周里程碑与交付节奏</text>
  <rect x="40" y="330" width="680" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="54" y="370" font-size="10" fill="#92400E" font-weight="bold">④ 交出去</text>
  <text x="117" y="361.5" font-size="8" fill="#B45309">Delivery：一键部署、灰度、回滚与上线验收清单</text>
  <text x="117" y="377.5" font-size="8" fill="#B45309">FAQ：交付期的排错与常见误判</text>
  <line x1="25" y1="150" x2="25" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="234" x2="25" y2="246" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="318" x2="25" y2="330" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="428" text-anchor="middle" font-size="8" fill="#64748B">每一环都要留下可复核的产物：需求有验收条件、契约有版本、迁移可回滚、上线有验收记录</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
