<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">TeamBoard 的隐私改造：五处改动，十条验收</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">顺序不能倒：先有清单（知道自己有什么），才谈得上删除与导出（知道自己删了什么）</text>

<g font-size="11.5">
<rect x="28" y="82" width="178" height="88" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="40" y="104" font-size="12" font-weight="700" fill="#1f2d3d">① 列清单</text>
<text x="40" y="126" fill="#5a6b7b">23 张表 / 187 列</text>
<text x="40" y="146" fill="#5a6b7b">L3 41 列 · L4 6 列</text>
<text x="40" y="164" fill="#2b5c8a">写进 `privacy_column`</text>

<rect x="224" y="82" width="178" height="88" rx="7" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.3"/>
<text x="236" y="104" font-size="12" font-weight="700" fill="#1f2d3d">② 收口采集</text>
<text x="236" y="126" fill="#5a6b7b">登录名不再存手机号</text>
<text x="236" y="146" fill="#5a6b7b">日志字段白名单</text>
<text x="236" y="164" fill="#2f8f7d">少 11 个采集点</text>

<rect x="420" y="82" width="178" height="88" rx="7" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.3"/>
<text x="432" y="104" font-size="12" font-weight="700" fill="#1f2d3d">③ 目的绑定</text>
<text x="432" y="126" fill="#5a6b7b">3 个目的：履约/通知/分析</text>
<text x="432" y="146" fill="#5a6b7b">查询带 purpose 参数</text>
<text x="432" y="164" fill="#c2703a">缺省即拒</text>

<rect x="616" y="82" width="152" height="88" rx="7" fill="#efecf7" stroke="#5b4a8a" stroke-width="1.3"/>
<text x="628" y="104" font-size="12" font-weight="700" fill="#1f2d3d">④ 删除传播</text>
<text x="628" y="126" fill="#5a6b7b">墓碑表 + 7 个订阅者</text>
<text x="628" y="146" fill="#5a6b7b">残留对账</text>
<text x="628" y="164" fill="#5b4a8a">9 位置 → 0 行</text>

<rect x="786" y="82" width="146" height="88" rx="7" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.3"/>
<text x="798" y="104" font-size="12" font-weight="700" fill="#1f2d3d">⑤ 证据</text>
<text x="798" y="126" fill="#5a6b7b">9 条自动控制项</text>
<text x="798" y="146" fill="#5a6b7b">月度 CI 采集</text>
<text x="798" y="164" fill="#6b7785">过期即红</text>
</g>

<rect x="28" y="190" width="904" height="96" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="40" y="212" font-size="12.5" font-weight="700" fill="#1f2d3d">十条验收里，四条是「必须失败」的（负向验收比正向更能说明做到了）</text>
<text x="40" y="236" font-size="11.5" fill="#5a6b7b">S1 分级覆盖率 ≥ 99%　S2 采集点白名单生效　S3 撤回后下一批不再出单　S4 导出包含 7 张表</text>
<text x="40" y="256" font-size="11.5" fill="#b5432f">S5 越权导出被拒（他人 uid）　S6 无 purpose 的查询报错　S7 删除后主库查不到　S8 删除后残留对账非 0 则请求不完成</text>
<text x="40" y="276" font-size="11.5" fill="#5a6b7b">S9 备份窗口内的删除有明确文案与时限　S10 证据文件带时间戳且可重跑</text>

<rect x="28" y="302" width="440" height="86" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="324" font-size="12.5" font-weight="700" fill="#1f2d3d">改动量最小的一处，收益最大</text>
<text x="40" y="348" font-size="11.5" fill="#5a6b7b">「登录名不再复用手机号」——删掉 1 个字段的复用，直接消掉 3 条传播路径</text>
<text x="40" y="368" font-size="11.5" fill="#4a7d3a">这类改动不需要架构，只需要有人看清单</text>

<rect x="492" y="302" width="440" height="86" rx="8" fill="#fdf3f0" stroke="#b5432f" stroke-width="1.4"/>
<text x="504" y="324" font-size="12.5" font-weight="700" fill="#1f2d3d">改动量最大的一处，收益最不明显</text>
<text x="504" y="348" font-size="11.5" fill="#5a6b7b">「删除传播 + 残留对账」——7 个订阅者、9 条对账 SQL，平时没有任何可见变化</text>
<text x="504" y="368" font-size="11.5" fill="#b5432f">它的价值只在被问「你确定删干净了吗」的那一天兑现</text>
</svg>
