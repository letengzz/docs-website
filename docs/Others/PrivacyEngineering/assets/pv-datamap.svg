<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">三路发现，合并成一张能挂在门禁上的列清单</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">任何一路单独用都有盲区：列名漏「名不副实」，内容漏「无固定形态」，血缘漏「新建的副本」</text>

<rect x="28" y="80" width="280" height="96" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="40" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">① 按列名（字典 + 词根）</text>
<text x="40" y="124" font-size="11" fill="#5a6b7b">phone / mobile / tel / idcard / email</text>
<text x="40" y="143" font-size="11" fill="#5a6b7b">优点：0 成本、覆盖全库</text>
<text x="40" y="162" font-size="11" fill="#b5432f">召回 9/14（64%）</text>

<rect x="340" y="80" width="280" height="96" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="352" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">② 按内容（正则 + 校验位）</text>
<text x="352" y="124" font-size="11" fill="#5a6b7b">手机 1[3-9]\d{9} / 身份证 mod 11-2 / 卡号 Luhn</text>
<text x="352" y="143" font-size="11" fill="#5a6b7b">优点：抓得住「名不副实」的列</text>
<text x="352" y="162" font-size="11" fill="#b5432f">召回 10/14（71%）</text>

<rect x="652" y="80" width="280" height="96" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="664" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">③ 按血缘（SQL 解析 / 查询日志）</text>
<text x="664" y="124" font-size="11" fill="#5a6b7b">从「已确认的源列」顺着 ETL 往下走</text>
<text x="664" y="143" font-size="11" fill="#5a6b7b">优点：新建的副本、宽表自动跟上</text>
<text x="664" y="162" font-size="11" fill="#b5432f">盲区：手工导数、黑盒 SDK</text>

<line x1="308" y1="128" x2="334" y2="128" stroke="#5a6b7b" stroke-width="1.2" marker-end="url(#dm)"/>
<line x1="620" y1="128" x2="646" y2="128" stroke="#5a6b7b" stroke-width="1.2" marker-end="url(#dm)"/>

<rect x="28" y="196" width="904" height="72" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="40" y="218" font-size="12.5" font-weight="700" fill="#1f2d3d">三路并集：12/14（86%）——剩下的两条不是「漏了」，而是「要人判断」</text>
<text x="40" y="240" font-size="11.5" fill="#5a6b7b">`wx_openid`、`invoice_title`：不是传统 PII，但都是准标识符（可与其他表关联出人）。这类必须写进「分级判定记录」，而不是塞进正则</text>
<text x="40" y="259" font-size="11.5" fill="#b5432f">内容识别还会误报：10 万个 16~19 位数字串，正则命中 5 万个，加 Luhn 后只剩 27,632（误报 44.7%）</text>

<rect x="28" y="284" width="212" height="120" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="306" font-size="12" font-weight="700" fill="#1f2d3d">L1 公开</text>
<text x="40" y="328" font-size="11" fill="#5a6b7b">商品、门店、公开文档</text>
<text x="40" y="348" font-size="11" fill="#5a6b7b">可出域、可入日志</text>
<text x="40" y="374" font-size="11" fill="#4a7d3a">无需额外控制</text>

<rect x="252" y="284" width="212" height="120" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="264" y="306" font-size="12" font-weight="700" fill="#1f2d3d">L2 内部</text>
<text x="264" y="328" font-size="11" fill="#5a6b7b">订单、库存、内部报表</text>
<text x="264" y="348" font-size="11" fill="#5a6b7b">不出域、需账号</text>
<text x="264" y="374" font-size="11" fill="#2b5c8a">访问留痕</text>

<rect x="476" y="284" width="212" height="120" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="488" y="306" font-size="12" font-weight="700" fill="#1f2d3d">L3 个人信息</text>
<text x="488" y="328" font-size="11" fill="#5a6b7b">姓名、手机、地址、证件</text>
<text x="488" y="348" font-size="11" fill="#5a6b7b">目的绑定 + 最小化</text>
<text x="488" y="368" font-size="11" fill="#c2703a">默认不落日志</text>
<text x="488" y="388" font-size="11" fill="#c2703a">进删除传播清单</text>

<rect x="700" y="284" width="232" height="120" rx="8" fill="#fdf3f0" stroke="#b5432f" stroke-width="1.4"/>
<text x="712" y="306" font-size="12" font-weight="700" fill="#1f2d3d">L4 敏感</text>
<text x="712" y="328" font-size="11" fill="#5a6b7b">证件号、银行卡、健康、生物</text>
<text x="712" y="348" font-size="11" fill="#5a6b7b">加密 + 单独授权 + 不跨域</text>
<text x="712" y="368" font-size="11" fill="#b5432f">删除要「可证明」</text>
<text x="712" y="388" font-size="11" fill="#b5432f">审计粒度到行</text>
</svg>
