<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">最小化不是「少写几个字段」，是四道闸按顺序关</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">闸门顺序不能换：先判必要性（不做就是把成本挪给下游），再谈脱敏（脱敏后的数据仍然是数据）</text>

<rect x="28" y="80" width="212" height="86" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="40" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">① 必要性</text>
<text x="40" y="124" font-size="11" fill="#5a6b7b">这个字段不做会失去哪个功能？</text>
<text x="40" y="144" font-size="11" fill="#2b5c8a">答案只能是功能，不能是「以后可能用」</text>

<rect x="256" y="80" width="212" height="86" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="268" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">② 精度</text>
<text x="268" y="124" font-size="11" fill="#5a6b7b">要做成「市」还是「街道」？</text>
<text x="268" y="144" font-size="11" fill="#2f8f7d">生日 → 年龄段；精确坐标 → 商圈</text>

<rect x="484" y="80" width="212" height="86" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="496" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">③ 形态</text>
<text x="496" y="124" font-size="11" fill="#5a6b7b">明文 / 掩码 / 假名 / 聚合</text>
<text x="496" y="144" font-size="11" fill="#c2703a">形态决定「能不能还原」</text>

<rect x="712" y="80" width="220" height="86" rx="8" fill="#efecf7" stroke="#5b4a8a" stroke-width="1.4"/>
<text x="724" y="102" font-size="12.5" font-weight="700" fill="#1f2d3d">④ 出口</text>
<text x="724" y="124" font-size="11" fill="#5a6b7b">日志 / 埋点 / 第三方 SDK</text>
<text x="724" y="144" font-size="11" fill="#5b4a8a">默认全部拒收，白名单放行</text>

<rect x="28" y="188" width="904" height="86" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="40" y="210" font-size="12.5" font-weight="700" fill="#1f2d3d">三种「形态」的可还原性实测（同一批 2,000 个手机号）</text>
<text x="40" y="234" font-size="11.5" fill="#5a6b7b">明文：直接读；掩码 `138****8888`：1 万个候选/号段，与生日交叉即可收敛；无盐 SHA-256：字典 3.9 ms 还原 2000/2000</text>
<text x="40" y="256" font-size="11.5" fill="#b5432f">加盐 SHA-256：同一张字典 2.2 ms 但还原 0 条——差异不在算法强度，在「盐是否与数据同库」</text>

<rect x="28" y="292" width="440" height="90" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="314" font-size="12.5" font-weight="700" fill="#1f2d3d">成本对照（本机，5 万行手机号掩码）</text>
<text x="40" y="338" font-size="11.5" fill="#5a6b7b">37.5 ms / 5 万行 ≈ 133 万行/秒——脱敏本身不是瓶颈</text>
<text x="40" y="360" font-size="11.5" fill="#4a7d3a">瓶颈在「改在哪一层」：入口改一次 vs 每条出口各改一次</text>

<rect x="492" y="292" width="440" height="90" rx="8" fill="#fdf3f0" stroke="#b5432f" stroke-width="1.4"/>
<text x="504" y="314" font-size="12.5" font-weight="700" fill="#1f2d3d">最常见的破口：错误日志与慢查询日志</text>
<text x="504" y="338" font-size="11.5" fill="#5a6b7b">参数化前的 SQL 文本、异常栈里的对象 `toString()`</text>
<text x="504" y="360" font-size="11.5" fill="#b5432f">这两处不经过任何「出口白名单」，只经过日志级别</text>
</svg>
