<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="rq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">一次请求要走六步，只有第一步需要人，其余五步都该是脚本</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">受理、核验、定位、组装、交付、留证——卡在哪一步，决定了「时限」是按小时算还是按天算</text>

<g font-size="11.5">
<rect x="28" y="80" width="130" height="72" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="40" y="102" font-size="12" font-weight="700" fill="#1f2d3d">① 受理</text>
<text x="40" y="122" fill="#5a6b7b">渠道 + 工单号</text>
<text x="40" y="141" fill="#b5432f">人：10 分钟</text>

<rect x="182" y="80" width="130" height="72" rx="7" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.3"/>
<text x="194" y="102" font-size="12" font-weight="700" fill="#1f2d3d">② 核验</text>
<text x="194" y="122" fill="#5a6b7b">登录态 / 双因子</text>
<text x="194" y="141" fill="#c2703a">最难自动化</text>

<rect x="336" y="80" width="130" height="72" rx="7" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.3"/>
<text x="348" y="102" font-size="12" font-weight="700" fill="#1f2d3d">③ 定位</text>
<text x="348" y="122" fill="#5a6b7b">按 uid 拉九张表</text>
<text x="348" y="141" fill="#2f8f7d">索引 0.145 ms</text>

<rect x="490" y="80" width="130" height="72" rx="7" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.3"/>
<text x="502" y="102" font-size="12" font-weight="700" fill="#1f2d3d">④ 组装</text>
<text x="502" y="122" fill="#5a6b7b">JSON + 清单</text>
<text x="502" y="141" fill="#2f8f7d">3,489 B / 单用户</text>

<rect x="644" y="80" width="130" height="72" rx="7" fill="#efecf7" stroke="#5b4a8a" stroke-width="1.3"/>
<text x="656" y="102" font-size="12" font-weight="700" fill="#1f2d3d">⑤ 交付</text>
<text x="656" y="122" fill="#5a6b7b">一次性下载链接</text>
<text x="656" y="141" fill="#5b4a8a">24 h 过期</text>

<rect x="798" y="80" width="134" height="72" rx="7" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.3"/>
<text x="810" y="102" font-size="12" font-weight="700" fill="#1f2d3d">⑥ 留证</text>
<text x="810" y="122" fill="#5a6b7b">工单 + 哈希 + 时间</text>
<text x="810" y="141" fill="#5a6b7b">归档 3 年</text>
</g>
<line x1="158" y1="116" x2="176" y2="116" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#rq)"/>
<line x1="312" y1="116" x2="330" y2="116" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#rq)"/>
<line x1="466" y1="116" x2="484" y2="116" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#rq)"/>
<line x1="620" y1="116" x2="638" y2="116" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#rq)"/>
<line x1="774" y1="116" x2="792" y2="116" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#rq)"/>

<rect x="28" y="180" width="440" height="96" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="40" y="202" font-size="12.5" font-weight="700" fill="#1f2d3d">核验的三个档位（按数据敏感度选，不按方便选）</text>
<text x="40" y="226" font-size="11.5" fill="#5a6b7b">低：登录态即可（只含本人已可见的数据）</text>
<text x="40" y="246" font-size="11.5" fill="#5a6b7b">中：登录态 + 近期验证（短信 / 邮箱）</text>
<text x="40" y="266" font-size="11.5" fill="#b5432f">高：加人工复核（含证件号、支付、健康），且导出包二次加密</text>

<rect x="492" y="180" width="440" height="96" rx="8" fill="#fdf3f0" stroke="#b5432f" stroke-width="1.4"/>
<text x="504" y="202" font-size="12.5" font-weight="700" fill="#1f2d3d">导出包必须自带「说明文件」</text>
<text x="504" y="226" font-size="11.5" fill="#5a6b7b">`manifest.json`：包含哪些表、各多少行、生成时间、字段中文名</text>
<text x="504" y="246" font-size="11.5" fill="#5a6b7b">不写清单的导出包，用户拿到手也不知道「是不是全的」</text>
<text x="504" y="266" font-size="11.5" fill="#b5432f">清单里每一行都要能对应一条 SQL——否则无法自证完整性</text>

<rect x="28" y="296" width="904" height="80" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="318" font-size="12.5" font-weight="700" fill="#1f2d3d">本机实测：定位成本取决于索引，不取决于数据量</text>
<text x="40" y="342" font-size="11.5" fill="#5a6b7b">在 20 万行订单表里取一个用户的 4 条：走 `user_id` 索引 0.145 ms；全表扫 141.3 ms（975 倍）</text>
<text x="40" y="364" font-size="11.5" fill="#4a7d3a">同一份数据，导出慢 1000 倍还是 1 毫秒，差别只在于九张表是不是都建了 `user_id` 索引——这条检查可以写成脚本</text>
</svg>
