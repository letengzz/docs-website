<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pm-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .root { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .module { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="root" x="240" y="20" width="220" height="50"/>
  <text x="350" y="42">settings.gradle.kts</text>
  <text class="small" x="350" y="60">include("common", "service", "web")</text>

  <line x1="300" y1="70" x2="220" y2="105" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
  <line x1="350" y1="70" x2="350" y2="105" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
  <line x1="400" y1="70" x2="480" y2="105" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pm-arrow)"/>

  <rect class="module" x="140" y="105" width="160" height="50"/>
  <text x="220" y="127">:common（公共库）</text>
  <text class="small" x="220" y="145">java-library + api 依赖</text>

  <rect class="module" x="270" y="105" width="160" height="50"/>
  <text x="350" y="127">:service（业务）</text>
  <text class="small" x="350" y="145">implementation(project(":common"))</text>

  <rect class="module" x="400" y="105" width="160" height="50"/>
  <text x="480" y="127">:web（入口）</text>
  <text class="small" x="480" y="145">application 插件 + mainClass</text>

  <line x1="300" y1="155" x2="440" y2="190" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
  <line x1="480" y1="155" x2="480" y2="190" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pm-arrow)"/>

  <rect class="module" x="360" y="190" width="240" height="50"/>
  <text x="480" y="212">构建顺序：common → service → web</text>
  <text class="small" x="480" y="230">./gradlew :web:build 自动构建上游模块</text>

  <text class="small" x="350" y="275">统一版本：gradle/libs.versions.toml（Version Catalog）</text>
</svg>
