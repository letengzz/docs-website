<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pg-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3aa76d"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .acc { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="box" x="50" y="40" width="170" height="54"/>
  <text x="135" y="63">settings.gradle.kts</text>
  <text class="small" x="135" y="82">项目名 / 模块 / 插件仓库</text>

  <line x1="220" y1="67" x2="255" y2="67" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pg-arrow)"/>

  <rect class="box" x="255" y="40" width="170" height="54"/>
  <text x="340" y="63">build.gradle.kts</text>
  <text class="small" x="340" y="82">插件 / 依赖 / 任务</text>

  <line x1="425" y1="67" x2="460" y2="67" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pg-arrow)"/>

  <rect class="box" x="460" y="40" width="190" height="54"/>
  <text x="555" y="63">Task DAG（任务图）</text>
  <text class="small" x="555" y="82">按依赖关系排序执行</text>

  <line x1="555" y1="94" x2="555" y2="125" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pg-arrow)"/>

  <rect class="box" x="460" y="125" width="190" height="54"/>
  <text x="555" y="148">执行阶段（Execution）</text>
  <text class="small" x="555" y="167">编译 / 测试 / 打包</text>

  <rect class="acc" x="60" y="150" width="170" height="48"/>
  <text x="145" y="172">增量构建</text>
  <text class="small" x="145" y="190">输入未变则跳过</text>

  <rect class="acc" x="60" y="215" width="170" height="48"/>
  <text x="145" y="237">构建缓存</text>
  <text class="small" x="145" y="255">跨机器复用产物</text>

  <rect class="acc" x="255" y="215" width="170" height="48"/>
  <text x="340" y="237">配置缓存</text>
  <text class="small" x="340" y="255">复用配置阶段结果</text>

  <rect class="acc" x="460" y="215" width="190" height="48"/>
  <text x="555" y="237">守护进程</text>
  <text class="small" x="555" y="255">常驻 JVM 避免冷启动</text>

  <text class="small" x="380" y="300">Gradle 核心：脚本 → 任务图 → 执行，并以增量、缓存、守护进程加速</text>
</svg>
