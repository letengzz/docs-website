<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
  <style>
    .maven { fill: #fff3e6; stroke: #e07b1a; stroke-width: 1.5; rx: 8; }
    .gradle { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .title { font-size: 16px; font-weight: bold; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <text class="title" x="190" y="30">Maven：固定阶段</text>
  <text class="title" x="570" y="30">Gradle：任务 DAG</text>

  <rect class="maven" x="60" y="50" width="100" height="36"/>
  <text x="110" y="73">validate</text>
  <rect class="maven" x="160" y="50" width="100" height="36"/>
  <text x="210" y="73">compile</text>
  <rect class="maven" x="260" y="50" width="100" height="36"/>
  <text x="310" y="73">package</text>
  <rect class="maven" x="360" y="50" width="100" height="36"/>
  <text x="410" y="73">install</text>

  <rect class="gradle" x="470" y="50" width="100" height="36"/>
  <text x="520" y="73">compileJava</text>
  <rect class="gradle" x="570" y="50" width="100" height="36"/>
  <text x="620" y="73">classes</text>
  <rect class="gradle" x="620" y="110" width="100" height="36"/>
  <text x="670" y="133">jar</text>
  <rect class="gradle" x="520" y="110" width="100" height="36"/>
  <text x="570" y="133">test</text>
  <rect class="gradle" x="570" y="170" width="100" height="36"/>
  <text x="620" y="193">build</text>

  <line x1="670" y1="86" x2="670" y2="110" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pc-arrow)"/>
  <line x1="570" y1="86" x2="570" y2="110" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pc-arrow)"/>
  <line x1="620" y1="146" x2="620" y2="170" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#pc-arrow)"/>

  <rect class="maven" x="60" y="130" width="400" height="90"/>
  <text x="260" y="160">XML + 固定生命周期</text>
  <text class="small" x="260" y="182">约定优先，学习成本低</text>
  <text class="small" x="260" y="202">增量构建弱、无守护进程</text>

  <rect class="gradle" x="470" y="230" width="240" height="50"/>
  <text x="590" y="252">Kotlin DSL + 任务图</text>
  <text class="small" x="590" y="270">灵活、增量构建 + 缓存强</text>

  <text class="small" x="380" y="290">选型：存量 Maven 保持稳定；新项目/Android/追求构建速度选 Gradle</text>
</svg>
