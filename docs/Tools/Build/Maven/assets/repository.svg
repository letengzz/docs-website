<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .repo { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { fill: #666; font-size: 12px; text-anchor: middle; }
  </style>

  <rect class="repo" x="240" y="20" width="240" height="60"/>
  <text class="text" x="360" y="45">本地仓库 ~/.m2/repository</text>
  <text class="small" x="360" y="65">命中直接使用</text>

  <line x1="360" y1="80" x2="360" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pr-arrow)"/>
  <text class="small" x="400" y="103">未命中</text>

  <rect class="repo" x="240" y="115" width="240" height="60"/>
  <text class="text" x="360" y="140">中央仓库 repo.maven.apache.org</text>
  <text class="small" x="360" y="160">公共仓库</text>

  <line x1="360" y1="175" x2="360" y2="210" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pr-arrow)"/>
  <text class="small" x="400" y="198">可配置镜像</text>

  <rect class="repo" x="200" y="210" width="320" height="60"/>
  <text class="text" x="360" y="235">镜像 / 私服（阿里云、Nexus、Artifactory）</text>
  <text class="small" x="360" y="255">下载后回填本地仓库</text>

  <text class="small" x="360" y="275">查找顺序：本地仓库 → 中央仓库（镜像）→ 私服</text>
</svg>
