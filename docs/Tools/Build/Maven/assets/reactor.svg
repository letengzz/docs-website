<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="rx-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .module { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .root { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="root" x="240" y="20" width="240" height="50"/>
  <text x="360" y="42">父 POM（packaging = pom）</text>
  <text class="small" x="360" y="60">modules：common / service / web</text>

  <line x1="280" y1="70" x2="150" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rx-arrow)"/>
  <line x1="360" y1="70" x2="360" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rx-arrow)"/>
  <line x1="440" y1="70" x2="570" y2="115" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rx-arrow)"/>

  <rect class="module" x="80" y="115" width="140" height="50"/>
  <text x="150" y="137">common</text>
  <text class="small" x="150" y="155">先构建</text>

  <rect class="module" x="290" y="115" width="140" height="50"/>
  <text x="360" y="137">service</text>
  <text class="small" x="360" y="155">依赖 common</text>

  <rect class="module" x="500" y="115" width="140" height="50"/>
  <text x="570" y="137">web</text>
  <text class="small" x="570" y="155">依赖 service</text>

  <line x1="220" y1="140" x2="290" y2="140" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#rx-arrow)"/>
  <line x1="430" y1="140" x2="500" y2="140" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#rx-arrow)"/>

  <rect class="module" x="180" y="210" width="360" height="50"/>
  <text x="360" y="232">Reactor 构建顺序：common → service → web</text>
  <text class="small" x="360" y="250">mvn -pl web -am install 只构建 web 及其上游</text>

  <text class="small" x="360" y="285">一次 mvn install 按依赖关系自动排序并全部构建</text>
</svg>
