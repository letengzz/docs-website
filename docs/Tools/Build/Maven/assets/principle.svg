<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pa-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .core { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .side { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="core" x="300" y="20" width="160" height="46"/>
  <text x="380" y="40">pom.xml</text>
  <text class="small" x="380" y="57">项目模型</text>

  <line x1="380" y1="66" x2="380" y2="95" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <rect class="box" x="60" y="100" width="150" height="70"/>
  <text x="135" y="128">标准目录结构</text>
  <text class="small" x="135" y="148">src/main、src/test</text>
  <text class="small" x="135" y="164">无需额外配置</text>

  <rect class="box" x="230" y="100" width="150" height="70"/>
  <text x="305" y="128">构建生命周期</text>
  <text class="small" x="305" y="148">compile → test</text>
  <text class="small" x="305" y="164">package → install</text>

  <rect class="box" x="400" y="100" width="150" height="70"/>
  <text x="475" y="128">插件（Plugin）</text>
  <text class="small" x="475" y="148">在阶段中执行</text>
  <text class="small" x="475" y="164">编译/打包/测试</text>

  <rect class="box" x="570" y="100" width="150" height="70"/>
  <text x="645" y="128">仓库（Repository）</text>
  <text class="small" x="645" y="148">本地 ~/.m2</text>
  <text class="small" x="645" y="164">中央仓库/私服</text>

  <line x1="210" y1="135" x2="230" y2="135" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
  <line x1="380" y1="135" x2="400" y2="135" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pa-arrow)"/>
  <line x1="550" y1="135" x2="570" y2="135" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <rect class="side" x="230" y="215" width="300" height="52"/>
  <text x="380" y="238">四要素 + 仓库 = 一条命令完成构建</text>
  <text class="small" x="380" y="256">mvn clean install 自动按阶段执行并下载依赖</text>

  <text class="small" x="380" y="300">Maven 核心原理：约定优于配置 + 生命周期 + 插件 + 仓库</text>
</svg>
