<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d99a2b"/>
    </marker>
  </defs>
  <style>
    .phase { fill: #fff7e6; stroke: #d99a2b; stroke-width: 1.5; rx: 8; }
    .output { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="phase" x="10" y="60" width="96" height="46"/>
  <text x="58" y="88">validate</text>

  <rect class="phase" x="126" y="60" width="96" height="46"/>
  <text x="174" y="88">compile</text>

  <rect class="phase" x="242" y="60" width="96" height="46"/>
  <text x="290" y="88">test</text>

  <rect class="phase" x="358" y="60" width="96" height="46"/>
  <text x="406" y="88">package</text>

  <rect class="phase" x="474" y="60" width="96" height="46"/>
  <text x="522" y="88">verify</text>

  <rect class="phase" x="590" y="60" width="96" height="46"/>
  <text x="638" y="88">install</text>

  <rect class="phase" x="706" y="60" width="96" height="46"/>
  <text x="754" y="88">deploy</text>

  <line x1="106" y1="83" x2="126" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="222" y1="83" x2="242" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="338" y1="83" x2="358" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="454" y1="83" x2="474" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="570" y1="83" x2="590" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>
  <line x1="686" y1="83" x2="706" y2="83" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#pl-arrow)"/>

  <rect class="output" x="242" y="140" width="350" height="40"/>
  <text x="417" y="165">产物：target/*.jar + surefire-reports 测试报告</text>

  <line x1="406" y1="106" x2="417" y2="140" stroke="#3aa76d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pl-arrow)"/>

  <text class="small" x="410" y="200">执行后阶段会自动先执行前面所有阶段；mvn package 会先 validate/compile/test</text>
</svg>
