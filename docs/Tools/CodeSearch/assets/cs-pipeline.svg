<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>入库流水线的五个阶段与各自的失效点</title>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
</defs>
<text x="32" y="44" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">入库：五个阶段，每个阶段都有自己的静默失效</text>
<text x="32" y="70" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">这一层写错，后面所有查询都是错的——而且错得很难发现（索引里就是少了一批文件）</text>
<rect x="32" y="100" width="164" height="158" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="44" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">① 枚举</text>
<text x="44" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">walk + 忽略规则</text>
<line x1="44" y1="164" x2="184" y2="164" stroke="#2563eb" stroke-width="1.0"/>
<text x="44" y="186" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">失效形态</text>
<text x="44" y="206" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">忽略规则写反</text>
<text x="44" y="223" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">（把 src 排除了）</text>
<line x1="198" y1="178" x2="214" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="216" y="100" width="164" height="158" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="228" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#047857" font-weight="700" text-anchor="start">② 解析</text>
<text x="228" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">解码 + 语言识别</text>
<line x1="228" y1="164" x2="368" y2="164" stroke="#047857" stroke-width="1.0"/>
<text x="228" y="186" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">失效形态</text>
<text x="228" y="206" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">非 UTF-8 直接抛错</text>
<text x="228" y="223" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">整批中断</text>
<line x1="382" y1="178" x2="398" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="400" y="100" width="164" height="158" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="412" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="start">③ 分块</text>
<text x="412" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">按符号 / 按行窗口</text>
<line x1="412" y1="164" x2="552" y2="164" stroke="#b45309" stroke-width="1.0"/>
<text x="412" y="186" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">失效形态</text>
<text x="412" y="206" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">块边界切在标识符中间</text>
<text x="412" y="223" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">（前缀查询失效）</text>
<line x1="566" y1="178" x2="582" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="584" y="100" width="164" height="158" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="596" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start">④ 指纹</text>
<text x="596" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">内容哈希</text>
<line x1="596" y1="164" x2="736" y2="164" stroke="#b91c1c" stroke-width="1.0"/>
<text x="596" y="186" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">失效形态</text>
<text x="596" y="206" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">用 mtime+size 作指纹</text>
<text x="596" y="223" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">（cp -p 后漏检）</text>
<line x1="750" y1="178" x2="766" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="768" y="100" width="164" height="158" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="780" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#6d28d9" font-weight="700" text-anchor="start">⑤ 写入</text>
<text x="780" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">postings + 元数据</text>
<line x1="780" y1="164" x2="920" y2="164" stroke="#6d28d9" stroke-width="1.0"/>
<text x="780" y="186" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="700" text-anchor="start">失效形态</text>
<text x="780" y="206" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">删文件不删 posting</text>
<text x="780" y="223" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400" text-anchor="start">（孤儿命中）</text>
<rect x="32" y="274" width="896" height="118" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="48" y="300" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#334155" font-weight="700" text-anchor="start">本仓实测：入库口径决定召回</text>
<text x="48" y="326" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">按空白分词（whitespace）查「幂等」：命中 41 篇；按子串/bin-gram 查：命中 394 篇 —— 召回差 89.6%</text>
<text x="48" y="350" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">原因：本库 344,347 个含中文的「词」平均 16.8 字符、最长 512 字符（整句被当成一个 token）</text>
<text x="48" y="374" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b91c1c" font-weight="400" text-anchor="start">→ 中文语料上，「分词」这一步必须显式设计，默认的 split() 是一个静默的召回杀手</text>
<text x="32" y="424" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">同一批数字也解释了为什么「代码搜索」偏爱子串 / n-gram 而不是词项：标识符本来就不是自然语言词</text>
<text x="32" y="448" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">判据：CSG-A ~ CSG-H</text>
<text x="32" y="480" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">（本页所有读数用 Python 3.13 标准库在仓库根目录跑出，命令见「如何验证」）</text>
</svg>
