<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<title>从 2406 篇到 10 条：候选集漏斗</title>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
</defs>
<text x="32" y="44" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">查询执行：候选集越大，后面每一步都在为它付钱</text>
<text x="32" y="70" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">实测三次查询的漏斗宽度（本仓语料）</text>
<rect x="210" y="108" width="640.0" height="56" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
<text x="196" y="142" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">语料</text>
<text x="880.0" y="142" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#334155" font-weight="700" text-anchor="end">2,406 篇（全部）</text>
<rect x="210" y="176" width="396.8" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="196" y="210" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">n-gram 交集</text>
<text x="626.8" y="210" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">129</text>
<rect x="210" y="244" width="396.8" height="56" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="1.4"/>
<text x="196" y="278" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">验真（子串确认）</text>
<text x="626.8" y="278" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#047857" font-weight="700" text-anchor="start">129</text>
<rect x="210" y="312" width="217.60000000000002" height="56" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
<text x="196" y="346" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">排序截断 top 50</text>
<text x="447.6" y="346" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b45309" font-weight="700" text-anchor="start">50</text>
<rect x="210" y="380" width="76.80000000000001" height="56" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.4"/>
<text x="196" y="414" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">权限过滤后 top 10</text>
<text x="306.8" y="414" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="start">10</text>
<rect x="32" y="452" width="420" height="52" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="48" y="476" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">「幂等键」：候选 129 → 命中 129（0.42 ms）</text>
<text x="48" y="494" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">候选集恰好等于答案——因为 3 字符全用上了</text>
<rect x="476" y="452" width="452" height="52" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="492" y="476" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">「idempotency」：候选 68 → 命中 35（3.13 ms）</text>
<text x="492" y="494" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">候选集是答案的 1.9 倍——trigram 允许乱序命中</text>
</svg>
