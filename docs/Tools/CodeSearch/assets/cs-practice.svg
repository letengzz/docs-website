<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img">
<title>实战 S1~S10 的一条链</title>
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
</defs>
<text x="32" y="44" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">实战：S1~S10，每一步都有可判定的产出</text>
<text x="32" y="70" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">在本仓 2,406 篇文档上，从零建一个「能回答『在哪、为什么、有多新』」的检索</text>
<rect x="32" y="100" width="164" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="46" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">S1</text>
<text x="46" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">枚举与忽略</text>
<line x1="198" y1="138" x2="210" y2="138" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="212" y="100" width="164" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="226" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">S2</text>
<text x="226" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">解码与语言</text>
<line x1="378" y1="138" x2="390" y2="138" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="392" y="100" width="164" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="406" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">S3</text>
<text x="406" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">分块与行号</text>
<line x1="558" y1="138" x2="570" y2="138" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="572" y="100" width="164" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="586" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">S4</text>
<text x="586" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">指纹与清单</text>
<line x1="738" y1="138" x2="750" y2="138" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="752" y="100" width="164" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="766" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">S5</text>
<text x="766" y="156" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">n-gram 写入</text>
<rect x="32" y="210" width="164" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="46" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start">S6</text>
<text x="46" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">查询解析</text>
<line x1="198" y1="248" x2="210" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="212" y="210" width="164" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="226" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start">S7</text>
<text x="226" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">验真与排序</text>
<line x1="378" y1="248" x2="390" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="392" y="210" width="164" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="406" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start">S8</text>
<text x="406" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">权限与截断</text>
<line x1="558" y1="248" x2="570" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="572" y="210" width="164" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="586" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start">S9</text>
<text x="586" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">增量与删除</text>
<line x1="738" y1="248" x2="750" y2="248" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="752" y="210" width="164" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="766" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start">S10</text>
<text x="766" y="266" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">度量与对账</text>
<rect x="32" y="310" width="288" height="96" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="48" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="start">验收不是「能搜到」</text>
<text x="48" y="360" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">S1~S4 各自有文件数 / 解码失败数</text>
<text x="48" y="380" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">S5~S7 有候选数 / 命中数 / 排序稳定性</text>
<rect x="336" y="310" width="288" height="96" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="352" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#334155" font-weight="700" text-anchor="start">三条必须能答的</text>
<text x="352" y="360" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">在哪（文件:行）；为什么（哪个 gram 命中）</text>
<text x="352" y="380" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">有多新（索引对应的 commit / mtime）</text>
<rect x="640" y="310" width="288" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="656" y="336" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start">两条红线</text>
<text x="656" y="360" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">① 任何「漏文件」都算失败，不算「轻微」</text>
<text x="656" y="380" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">② 删除后仍能搜到 = 数据泄露，不是 bug</text>
<text x="32" y="440" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">判据：CSB-A ~ CSB-H；每步的命令与预期输出写在本页「如何验证」里</text>
</svg>
