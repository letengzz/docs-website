<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<title>词法与语义的混合：RRF 融合</title>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
</defs>
<text x="32" y="44" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">语义检索不是「更好的词法检索」，是「另一种召回」</text>
<text x="32" y="70" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">两条链路各自会漏，融合才有意义；融合的关键是「按名次而不是按分数」</text>
<rect x="32" y="100" width="250" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="48" y="128" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">词法召回（n-gram）</text>
<text x="48" y="152" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">优点：精确、可解释、零训练</text>
<text x="48" y="174" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">缺点：换个说法就搜不到</text>
<text x="48" y="196" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">实测 top1 相似度 0.038</text>
<rect x="32" y="236" width="250" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="48" y="264" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#047857" font-weight="700" text-anchor="start">语义召回（向量）</text>
<text x="48" y="288" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">优点：同义、跨语言、模糊</text>
<text x="48" y="310" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">缺点：近似但不精确（标识符会漂）</text>
<text x="48" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">成本：每页一次 embedding + 一次 ANN</text>
<rect x="330" y="150" width="150" height="156" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="405" y="200" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">RRF 融合</text>
<text x="405" y="226" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="middle">score = Σ 1/(k+rank)</text>
<text x="405" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">k 常取 60</text>
<text x="405" y="276" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="middle">只依赖名次</text>
<line x1="286" y1="160" x2="326" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="286" y1="296" x2="326" y2="256" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="524" y="150" width="250" height="156" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="540" y="178" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b45309" font-weight="700" text-anchor="start">融合后的四条纪律</text>
<text x="540" y="204" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">① 精确命中的权重不能被稀释</text>
<text x="540" y="226" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">② 两路候选都要留「为什么召回」</text>
<text x="540" y="248" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#b91c1c" font-weight="400" text-anchor="start">③ 融合后再做权限过滤 = 又回到后过滤</text>
<text x="540" y="272" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">④ 冷启动：向量索引重建要分钟级</text>
<line x1="484" y1="228" x2="520" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="380" width="896" height="96" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="48" y="406" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#334155" font-weight="700" text-anchor="start">什么时候不该加语义：查询以标识符、错误码、配置键为主时</text>
<text x="48" y="430" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">「ERR_1846」「outbox.published」「kafka-topics.sh」这类查询，向量化之后邻居全是「看起来像」的东西</text>
<text x="48" y="454" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">→ 先做词法、把「精确命中」这条路走通，再按「换个说法搜不到」的真实抱怨决定要不要加语义（判据 CSM-F）</text>
<text x="32" y="504" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">判据：CSM-A ~ CSM-H</text>
</svg>
