<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">IDE 生态全景：四大阵营与选型四维度</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">没有最好的 IDE，只有与语言生态、团队协作方式、部署形态最匹配的那一个</text>
  <rect x="30" y="76" width="162" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="111" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">JetBrains 系</text>
  <text x="111" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">IDEA（Java/Kotlin）</text>
  <text x="111" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">WebStorm / PyCharm</text>
  <text x="111" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">GoLand / RustRover</text>
  <text x="111" y="162.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">Rider / CLion / PhpStorm</text>
  <text x="111" y="180" text-anchor="middle" font-size="7.5" fill="#6D28D9">统一发行版 + Toolbox</text>
  <rect x="206" y="76" width="162" height="116" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="287" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">VS Code 系</text>
  <text x="287" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">VS Code（微软官方）</text>
  <text x="287" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">扩展生态最庞大</text>
  <text x="287" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Copilot / Agents 内置</text>
  <text x="287" y="162.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Cursor / Windsurf 等分支</text>
  <text x="287" y="180" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Remote 与容器能力强</text>
  <rect x="382" y="76" width="162" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="463" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">Eclipse 系</text>
  <text x="463" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">Eclipse IDE（SimRel）</text>
  <text x="463" y="128.25" text-anchor="middle" font-size="7.5" fill="#B45309">企业存量项目常见</text>
  <text x="463" y="145.5" text-anchor="middle" font-size="7.5" fill="#B45309">插件体系 (p2)</text>
  <text x="463" y="162.75" text-anchor="middle" font-size="7.5" fill="#B45309">云原生工具链成熟</text>
  <text x="463" y="180" text-anchor="middle" font-size="7.5" fill="#B45309">对老版本 Java 友好</text>
  <rect x="558" y="76" width="162" height="116" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="639" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">云端与 AI IDE</text>
  <text x="639" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">GitHub Codespaces</text>
  <text x="639" y="128.25" text-anchor="middle" font-size="7.5" fill="#0F766E">JetBrains Air（Fleet 演进）</text>
  <text x="639" y="145.5" text-anchor="middle" font-size="7.5" fill="#0F766E">浏览器内 IDE</text>
  <text x="639" y="162.75" text-anchor="middle" font-size="7.5" fill="#0F766E">Agent 优先工作流</text>
  <text x="639" y="180" text-anchor="middle" font-size="7.5" fill="#0F766E">本地/云端混合</text>
  <text x="380" y="214" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">选型只看三件事：语言生态匹配度 · 团队协作与统一成本 · 远程/容器化开发需求</text>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四个判断维度</text>
  <rect x="30" y="256" width="128" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="94" y="271" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">语言生态匹配</text>
  <rect x="166" y="256" width="564" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="448" y="271" text-anchor="middle" font-size="8.5" fill="#334155">Java / Kotlin 大工程 → JetBrains 系；多语言与前端 → VS Code 系；存量企业项目 → Eclipse 系</text>
  <rect x="30" y="282" width="128" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="94" y="297" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">统一与协作成本</text>
  <rect x="166" y="282" width="564" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="448" y="297" text-anchor="middle" font-size="8.5" fill="#334155">IDE 越「聪明」，配置越复杂；团队统一靠「仓库内配置 + 一份清单」，不靠口头约定</text>
  <rect x="30" y="308" width="128" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="94" y="323" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">远程与容器化</text>
  <rect x="166" y="308" width="564" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="448" y="323" text-anchor="middle" font-size="8.5" fill="#334155">VS Code Remote / Dev Containers 与 JetBrains Gateway 都能做，差别在扩展生态与性能</text>
  <rect x="30" y="334" width="128" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="94" y="349" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">AI 能力现状</text>
  <rect x="166" y="334" width="564" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="448" y="349" text-anchor="middle" font-size="8.5" fill="#334155">2026 年起各家都把 AI 助手做进 IDE 本体：能力差异收紧，成本与数据合规成为主要变量</text>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#1E3A8A">结论：IDE 是「长期基础设施」，先定标准（配置与清单入库），再谈个人偏好</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
