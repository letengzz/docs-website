<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">快捷键能力地图：IDEA 与 VS Code 对照</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">12 类高频能力的两套键位对照，按「能力」记忆而不是按「键」死背</text>
  <text x="380" y="82" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">先记「能力」，再记「键位」——跨 IDE 迁移时只需要重映射键位</text>
  <rect x="30" y="96" width="128" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="94" y="113" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">能力类别</text>
  <rect x="158" y="96" width="232" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="274" y="113" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">IntelliJ IDEA（Win/Linux）</text>
  <rect x="390" y="96" width="232" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
