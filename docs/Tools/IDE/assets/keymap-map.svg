  <text x="94" y="140" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">全局搜索</text>
  <rect x="158" y="124" width="232" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
