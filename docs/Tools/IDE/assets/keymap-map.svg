  <rect x="622" y="124" width="138" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="691" y="140" text-anchor="middle" font-size="8.5" fill="#334155">搜文件、类、符号</text>
  <rect x="30" y="148" width="128" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
