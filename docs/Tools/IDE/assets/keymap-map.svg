  <rect x="158" y="364" width="232" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="274" y="380" text-anchor="middle" font-size="8.5" fill="#334155">Alt+F12</text>
