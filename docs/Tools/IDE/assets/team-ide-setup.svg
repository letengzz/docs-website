<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：团队统一 IDE 环境的六步落地</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一步都有可交付的文件与可验证的结果，避免停留在「约定了但没落地」</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">从「各配各的」到「仓库说了算」：六步落地</text>
  <rect x="30" y="94" width="226" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 锁版本</text>
  <text x="143" y="129" text-anchor="middle" font-size="8" fill="#6D28D9">团队统一 IDE 主版本</text>
  <text x="143" y="147.4" text-anchor="middle" font-size="8" fill="#6D28D9">Toolbox / 安装清单</text>
  <line x1="256" y1="133" x2="268" y2="133" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="94" width="226" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 仓库内配置</text>
  <text x="381" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">提交 .editorconfig</text>
  <text x="381" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">提交 .vscode/ 必要文件</text>
  <line x1="494" y1="133" x2="506" y2="133" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="94" width="226" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 代码风格对齐</text>
  <text x="619" y="129" text-anchor="middle" font-size="8" fill="#047857">IDE 格式化器 ←→ 仓库规则</text>
  <text x="619" y="147.4" text-anchor="middle" font-size="8" fill="#047857">prettier/eslint 为准</text>
  <rect x="30" y="190" width="226" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="143" y="208.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 插件清单</text>
  <text x="143" y="225" text-anchor="middle" font-size="8" fill="#0F766E">extensions.json 推荐</text>
  <text x="143" y="243.4" text-anchor="middle" font-size="8" fill="#0F766E">IDEA 用插件清单文档</text>
  <line x1="256" y1="229" x2="268" y2="229" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="190" width="226" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="208.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 个人同步</text>
  <text x="381" y="225" text-anchor="middle" font-size="8" fill="#B45309">Settings Sync / dotfiles</text>
  <text x="381" y="243.4" text-anchor="middle" font-size="8" fill="#B45309">只放个人偏好</text>
  <line x1="494" y1="229" x2="506" y2="229" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="190" width="226" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="619" y="208.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑥ CI 校验</text>
  <text x="619" y="225" text-anchor="middle" font-size="8" fill="#B91C1C">配置文件存在性检查</text>
  <text x="619" y="243.4" text-anchor="middle" font-size="8" fill="#B91C1C">格式检查作为门禁</text>
  <line x1="700" y1="133" x2="730" y2="133" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="730" y1="133" x2="730" y2="268" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="730" y1="268" x2="256" y2="268" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="bold">验收标准（写进 onboarding 文档）</text>
  <rect x="30" y="314" width="700" height="26" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="331" text-anchor="start" font-size="9" fill="#065F46">✔ 新人按文档 30 分钟内完成环境搭建，无需口头指导</text>
  <rect x="30" y="344" width="700" height="26" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="361" text-anchor="start" font-size="9" fill="#065F46">✔ 同一份代码在两台机器上格式化结果完全一致</text>
  <rect x="30" y="374" width="700" height="26" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="391" text-anchor="start" font-size="9" fill="#065F46">✔ CI 能拦住「改了格式但没同步配置」的提交</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
