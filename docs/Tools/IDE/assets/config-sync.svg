<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">配置同步的三个层次：个人 / 团队 / 环境</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「谁负责哪一层」分清，才不会有「我这边能跑」的扯皮</text>
  <rect x="30" y="78" width="700" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">第 3 层 · 环境可复现（团队级）</text>
  <text x="380" y="113" text-anchor="middle" font-size="8.5" fill="#047857">目标：换台机器 / 新人入职，一条命令得到同样的开发环境</text>
  <text x="380" y="132.55" text-anchor="middle" font-size="8.5" fill="#047857">手段：devcontainer.json（容器化环境即代码）· Toolbox / 版本清单锁版本 · 依赖由包管理器锁定</text>
  <text x="380" y="152.1" text-anchor="middle" font-size="8.5" fill="#047857">验证：clone → 打开 → 环境自检脚本通过</text>
  <rect x="30" y="186" width="700" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="204.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">第 2 层 · 团队统一（仓库级）</text>
  <text x="380" y="221" text-anchor="middle" font-size="8.5" fill="#1D4ED8">目标：代码风格、检查规则、必备插件在仓库里说清楚，不靠口头约定</text>
  <text x="380" y="240.55" text-anchor="middle" font-size="8.5" fill="#1D4ED8">手段：.editorconfig（缩进/换行/字符集）· .vscode/settings.json · .idea 选择性提交</text>
  <text x="380" y="260.1" text-anchor="middle" font-size="8.5" fill="#1D4ED8">验证：CI 校验配置文件存在且关键项一致，prettier/eslint 与 IDE 设置对齐</text>
  <rect x="30" y="294" width="700" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="312.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">第 1 层 · 个人同步（个人级）</text>
  <text x="380" y="329" text-anchor="middle" font-size="8.5" fill="#6D28D9">目标：换机器不丢自己的习惯（主题、快捷键、代码片段）</text>
  <text x="380" y="348.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">手段：JetBrains Settings Sync（账号同步）· VS Code 内置 Settings Sync · dotfiles 软链接方案</text>
  <text x="380" y="368.1" text-anchor="middle" font-size="8.5" fill="#6D28D9">边界：只同步个人偏好，不要用个人同步去分发团队规则</text>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#B91C1C">顺序不能反：先把团队规则放进仓库，再让个人同步只负责「剩下的那部分」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
