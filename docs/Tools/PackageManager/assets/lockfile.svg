<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="lf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .pkg { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .res { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .lock { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .node { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="pkg" x="35" y="60" width="200" height="70"/>
  <text x="135" y="90">package.json</text>
  <text class="small" x="135" y="110">^1.2.3 · 区间声明</text>

  <rect class="res" x="330" y="60" width="200" height="70"/>
  <text x="430" y="90">解析依赖树</text>
  <text class="small" x="430" y="110">semver 匹配 → 固定版本</text>

  <rect class="lock" x="625" y="60" width="200" height="70"/>
  <text x="725" y="90">lockfile</text>
  <text class="small" x="725" y="110">package-lock / pnpm-lock / yarn.lock</text>

  <line x1="235" y1="95" x2="330" y2="95" marker-end="url(#lf-arrow)"/>
  <line x1="530" y1="95" x2="625" y2="95" marker-end="url(#lf-arrow)"/>

  <rect class="node" x="330" y="200" width="380" height="62"/>
  <text x="520" y="228">node_modules（按 lockfile 精确安装）</text>
  <text class="small" x="520" y="246">npm ci / pnpm install --frozen-lockfile</text>

  <line x1="725" y1="130" x2="725" y2="170" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="725" y1="170" x2="710" y2="200" marker-end="url(#lf-arrow)"/>

  <text class="small" x="430" y="305">lockfile 必须提交 Git：保证团队与 CI 安装结果一致</text>
</svg>
