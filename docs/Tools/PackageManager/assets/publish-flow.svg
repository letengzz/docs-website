<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pb-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8852d"/>
    </marker>
  </defs>
  <style>
    .ver { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .build { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .pub { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .done { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #e8852d; stroke-width: 1.4; }
  </style>

  <rect class="ver" x="35" y="55" width="170" height="70"/>
  <text x="120" y="83">版本号</text>
  <text class="small" x="120" y="102">semver：major/minor/patch</text>

  <rect class="build" x="240" y="55" width="170" height="70"/>
  <text x="325" y="83">构建与校验</text>
  <text class="small" x="325" y="102">lint/test/build</text>

  <rect class="pub" x="445" y="55" width="170" height="70"/>
  <text x="530" y="83">发布</text>
  <text class="small" x="530" y="102">npm publish / changeset</text>

  <rect class="done" x="650" y="55" width="175" height="70"/>
  <text x="737" y="83">消费</text>
  <text class="small" x="737" y="102">下游安装新版本</text>

  <line x1="205" y1="90" x2="240" y2="90" marker-end="url(#pb-arrow)"/>
  <line x1="410" y1="90" x2="445" y2="90" marker-end="url(#pb-arrow)"/>
  <line x1="615" y1="90" x2="650" y2="90" marker-end="url(#pb-arrow)"/>

  <rect class="done" x="240" y="200" width="380" height="60"/>
  <text x="430" y="228">版本策略：0.x 预发布、1.0 起语义化、破坏性变更升 major</text>
  <text class="small" x="430" y="246">私有源：Verdaccio / 私有 npm registry / GitHub Packages</text>
</svg>
