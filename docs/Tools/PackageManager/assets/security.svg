<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8852d"/>
    </marker>
  </defs>
  <style>
    .audit { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .lock { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .reg { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #e8852d; stroke-width: 1.4; }
  </style>

  <rect class="audit" x="35" y="55" width="210" height="72"/>
  <text x="140" y="85">审计与扫描</text>
  <text class="small" x="140" y="103">npm audit / pnpm audit / OSV</text>

  <rect class="lock" x="290" y="55" width="210" height="72"/>
  <text x="395" y="85">lockfile 完整性</text>
  <text class="small" x="395" y="103">提交 Git · 校验哈希</text>

  <rect class="reg" x="545" y="55" width="280" height="72"/>
  <text x="685" y="85">来源与签名</text>
  <text class="small" x="685" y="103">私有源 · 作用域包 · 双因子发布</text>

  <line x1="245" y1="91" x2="290" y2="91" marker-end="url(#sc-arrow)"/>
  <line x1="500" y1="91" x2="545" y2="91" marker-end="url(#sc-arrow)"/>

  <rect class="audit" x="200" y="200" width="460" height="60"/>
  <text x="430" y="228">供应链风险：投毒、抢注、依赖混淆、维护者账号被盗</text>
  <text class="small" x="430" y="246">对策：lockfile、最小依赖、签名验证、CI 门禁</text>
</svg>
