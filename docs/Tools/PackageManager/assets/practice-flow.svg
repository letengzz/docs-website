<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .audit { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .mig { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mono { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .ci { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="audit" x="35" y="55" width="170" height="70"/>
  <text x="120" y="83">现状盘点</text>
  <text class="small" x="120" y="102">依赖树 / lockfile / 磁盘</text>

  <rect class="mig" x="240" y="55" width="170" height="70"/>
  <text x="325" y="83">迁移 pnpm</text>
  <text class="small" x="325" y="102">corepack + 白名单修复</text>

  <rect class="mono" x="445" y="55" width="170" height="70"/>
  <text x="530" y="83">workspace 化</text>
  <text class="small" x="530" y="102">拆包 + 互引</text>

  <rect class="ci" x="650" y="55" width="175" height="70"/>
  <text x="737" y="83">CI 与发布</text>
  <text class="small" x="737" y="102">frozen-lockfile + 发布流水线</text>

  <line x1="205" y1="90" x2="240" y2="90" marker-end="url(#pc-arrow)"/>
  <line x1="410" y1="90" x2="445" y2="90" marker-end="url(#pc-arrow)"/>
  <line x1="615" y1="90" x2="650" y2="90" marker-end="url(#pc-arrow)"/>

  <rect class="ci" x="230" y="200" width="430" height="60"/>
  <text x="445" y="228">落地验证：构建一致、磁盘下降、CI 全绿、发布可追溯</text>
  <text class="small" x="445" y="246">配套：CI/CD 专题与前端工程化专题</text>
</svg>
