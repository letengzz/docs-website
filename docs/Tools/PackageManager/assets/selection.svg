<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sel-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .npm { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .pnpm { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .yarn { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .bun { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="npm" x="30" y="50" width="190" height="72"/>
  <text x="125" y="80">npm 11.x</text>
  <text class="small" x="125" y="98">Node 自带 · 生态默认</text>

  <rect class="pnpm" x="245" y="50" width="190" height="72"/>
  <text x="340" y="80">pnpm 10/11</text>
  <text class="small" x="340" y="98">节省磁盘 · 安全默认</text>

  <rect class="yarn" x="460" y="50" width="190" height="72"/>
  <text x="555" y="80">Yarn Berry 4</text>
  <text class="small" x="555" y="98">PnP · zero-install</text>

  <rect class="bun" x="675" y="50" width="155" height="72"/>
  <text x="752" y="80">Bun 1.3</text>
  <text class="small" x="752" y="98">All-in-One · 极快</text>

  <rect class="pnpm" x="180" y="190" width="500" height="64"/>
  <text x="430" y="218">选型：默认 npm；追求效率与磁盘 → pnpm；PnP 团队 → Yarn Berry；一体化运行时 → Bun</text>
  <text class="small" x="430" y="238">基础用法见 Frontend/NodeJs 包管理工具章节，本专题聚焦原理与工程化</text>

  <line x1="125" y1="122" x2="260" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="340" y1="122" x2="360" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="555" y1="122" x2="500" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="752" y1="122" x2="600" y2="190" marker-end="url(#sel-arrow)"/>

  <text class="small" x="430" y="300">版本现状：npm 11.16 · pnpm 10.34（11 主线）· Yarn 4.18 · Bun 1.3.14（2026-08 核对）</text>
  <text class="small" x="430" y="320">关注：lockfile 一致性、磁盘占用、安全审计、monorepo 支持</text>
</svg>
