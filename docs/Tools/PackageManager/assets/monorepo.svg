<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="mr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .root { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .pkg { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .share { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="root" x="320" y="35" width="220" height="54"/>
  <text x="430" y="62">仓库根（workspace root）</text>
  <text class="small" x="430" y="78">pnpm-workspace.yaml / lerna.json</text>

  <rect class="pkg" x="40" y="150" width="170" height="70"/>
  <text x="125" y="178">packages/ui</text>
  <text class="small" x="125" y="198">组件库</text>

  <rect class="pkg" x="250" y="150" width="170" height="70"/>
  <text x="335" y="178">packages/utils</text>
  <text class="small" x="335" y="198">公共工具</text>

  <rect class="pkg" x="460" y="150" width="170" height="70"/>
  <text x="545" y="178">apps/web</text>
  <text class="small" x="545" y="198">前端应用</text>

  <rect class="pkg" x="670" y="150" width="170" height="70"/>
  <text x="755" y="178">apps/api</text>
  <text class="small" x="755" y="198">后端服务</text>

  <line x1="380" y1="89" x2="150" y2="150" marker-end="url(#mr-arrow)"/>
  <line x1="390" y1="89" x2="335" y2="150" marker-end="url(#mr-arrow)"/>
  <line x1="440" y1="89" x2="545" y2="150" marker-end="url(#mr-arrow)"/>
  <line x1="480" y1="89" x2="755" y2="150" marker-end="url(#mr-arrow)"/>

  <rect class="share" x="250" y="255" width="360" height="58"/>
  <text x="430" y="283">价值：依赖统一、一次安装、内部包互相 link</text>
  <text class="small" x="430" y="301">编排工具：Turborepo / Nx / Lerna（任务缓存与并行）</text>
</svg>
