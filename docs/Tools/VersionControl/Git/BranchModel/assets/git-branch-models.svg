<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="三种 Git 分支模型的对照">
  <defs>
    <marker id="gb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">三种分支模型：差别只在「长期分支有几条」</text>
  <text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">选型不看团队大小，看两件事：发布节奏是否固定、线上是否必须能随时回滚到任一历史版本。</text>

  <rect x="30" y="84" width="840" height="118" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="50" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#065f46">一、主干开发（Trunk Based）</text>
  <text x="50" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#334155">长期分支：只有 main。功能分支存活 &lt; 1 天，或者干脆直接提交到 main。</text>
  <rect x="50" y="148" width="740" height="10" rx="5" fill="#34d399"/>
  <circle cx="120" cy="153" r="7" fill="#065f46"/>
  <circle cx="240" cy="153" r="7" fill="#065f46"/>
  <circle cx="360" cy="153" r="7" fill="#065f46"/>
  <circle cx="480" cy="153" r="7" fill="#065f46"/>
  <circle cx="600" cy="153" r="7" fill="#065f46"/>
  <text x="50" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#334155">适合：持续交付、每次提交都保证可发布。要求：必须有完整自动化测试与特性开关，否则主干会长期红。</text>

  <rect x="30" y="212" width="840" height="118" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="50" y="238" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e40af">二、GitHub Flow</text>
  <text x="50" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#334155">长期分支：只有 main。每个改动一条短分支 → Pull Request 评审 → 合回 main → 立刻部署。</text>
  <rect x="50" y="276" width="740" height="10" rx="5" fill="#60a5fa"/>
  <circle cx="140" cy="281" r="7" fill="#1e40af"/>
  <circle cx="300" cy="281" r="7" fill="#1e40af"/>
  <circle cx="470" cy="281" r="7" fill="#1e40af"/>
  <circle cx="650" cy="281" r="7" fill="#1e40af"/>
  <path d="M 200 281 C 200 300, 200 300, 240 300" stroke="#60a5fa" stroke-width="2" fill="none"/>
  <text x="185" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#1d4ed8">短分支 → PR → 合并即部署</text>

  <rect x="30" y="340" width="840" height="104" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="50" y="366" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#9a3412">三、Git Flow</text>
  <text x="50" y="392" font-family="system-ui, sans-serif" font-size="12" fill="#334155">长期分支：main 与 develop 两条，外加 release / hotfix / feature 三类临时分支。</text>
  <rect x="50" y="402" width="740" height="8" rx="4" fill="#fb923c"/>
  <rect x="50" y="416" width="740" height="8" rx="4" fill="#fdba74"/>
  <text x="50" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#9a3412">上：main（只放发布版本）　　下：develop（集成）　　release 从 develop 切、hotfix 从 main 切</text>

  <rect x="30" y="456" width="840" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="50" y="478" font-family="system-ui, sans-serif" font-size="12" fill="#334155">选择：能持续交付就选一或二；必须维护多个已发布版本（如客户端 / 私有化部署）才上三。多选题里最常见的错是把三当成「更专业」。</text>
</svg>
