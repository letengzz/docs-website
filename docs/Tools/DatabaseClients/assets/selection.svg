<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sel-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .nav { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .dbeaver { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .redis { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="nav" x="35" y="50" width="230" height="76"/>
  <text x="150" y="80">Navicat Premium 17.x</text>
  <text class="small" x="150" y="100">商业收费 · 多库统一 · 导入导出强</text>

  <rect class="dbeaver" x="315" y="50" width="230" height="76"/>
  <text x="430" y="80">DBeaver 26.x</text>
  <text class="small" x="430" y="100">开源免费 · 驱动齐全 · 通用查询</text>

  <rect class="redis" x="595" y="50" width="230" height="76"/>
  <text x="710" y="80">RedisInsight 3.8</text>
  <text class="small" x="710" y="100">Redis 官方 · 可视化 · 分析诊断</text>

  <rect class="dbeaver" x="180" y="190" width="500" height="66"/>
  <text x="430" y="218">选型依据：库类型、团队规模、预算、安全合规</text>
  <text class="small" x="430" y="238">MySQL/PostgreSQL → 三款皆可；多库混用 → Navicat/DBeaver；Redis → RedisInsight</text>

  <line x1="150" y1="126" x2="280" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="430" y1="126" x2="430" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="710" y1="126" x2="580" y2="190" marker-end="url(#sel-arrow)"/>

  <text class="small" x="430" y="300">共同能力：连接管理 / SQL 编辑器 / 导入导出 / 备份恢复 / 数据同步</text>
  <text class="small" x="430" y="320">版本现状：Navicat 17.3 · DBeaver 26.1 · RedisInsight 3.8（2026-08 核对）</text>
</svg>
