<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="db-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .drv { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .nav { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .qry { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .exp { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="drv" x="35" y="55" width="170" height="70"/>
  <text x="120" y="83">驱动管理器</text>
  <text class="small" x="120" y="102">自动下载 JDBC 驱动</text>

  <rect class="nav" x="240" y="55" width="170" height="70"/>
  <text x="325" y="83">数据库导航器</text>
  <text class="small" x="325" y="102">连接树 / 元数据浏览</text>

  <rect class="qry" x="445" y="55" width="170" height="70"/>
  <text x="530" y="83">SQL 编辑器</text>
  <text class="small" x="530" y="102">补全 / 执行计划 / 格式化</text>

  <rect class="exp" x="650" y="55" width="175" height="70"/>
  <text x="737" y="83">数据传输 / ER 图</text>
  <text class="small" x="737" y="102">导出导入 / 结构对比</text>

  <line x1="205" y1="90" x2="240" y2="90" marker-end="url(#db-arrow)"/>
  <line x1="410" y1="90" x2="445" y2="90" marker-end="url(#db-arrow)"/>
  <line x1="615" y1="90" x2="650" y2="90" marker-end="url(#db-arrow)"/>

  <rect class="qry" x="240" y="200" width="385" height="60"/>
  <text x="432" y="228">脚本管理：SQL 片段 / 保存为项目文件</text>
  <text class="small" x="432" y="246">支持 SSH 隧道、SSL、Kerberos；社区版免费</text>

  <line x1="737" y1="125" x2="737" y2="168" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="737" y1="168" x2="625" y2="200" marker-end="url(#db-arrow)"/>

  <text class="small" x="430" y="305">支持：MySQL/PostgreSQL/SQLite/Oracle/SQL Server/MongoDB/ClickHouse 等 100+ 数据源</text>
  <text class="small" x="430" y="325">版本现状：DBeaver Community 26.1.x（2026-08 核对）</text>
</svg>
