<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .dev { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .test { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .prod { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .mgmt { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="dev" x="35" y="55" width="190" height="70"/>
  <text x="130" y="83">开发环境</text>
  <text class="small" x="130" y="102">本地 MySQL / SQLite</text>

  <rect class="test" x="260" y="55" width="190" height="70"/>
  <text x="355" y="83">测试环境</text>
  <text class="small" x="355" y="102">SSH 隧道连接</text>

  <rect class="prod" x="485" y="55" width="190" height="70"/>
  <text x="580" y="83">生产环境</text>
  <text class="small" x="580" y="102">只读账号 + SSL</text>

  <rect class="mgmt" x="710" y="55" width="120" height="70"/>
  <text x="770" y="83">统一管理</text>
  <text class="small" x="770" y="102">分组 + 颜色</text>

  <line x1="225" y1="90" x2="260" y2="90" marker-end="url(#pr-arrow)"/>
  <line x1="450" y1="90" x2="485" y2="90" marker-end="url(#pr-arrow)"/>
  <line x1="675" y1="90" x2="710" y2="90" marker-end="url(#pr-arrow)"/>

  <rect class="mgmt" x="200" y="200" width="460" height="60"/>
  <text x="430" y="228">连接规范：命名统一、密码加密保存、环境隔离</text>
  <text class="small" x="430" y="246">生产只读、变更走审批、定期轮换密码</text>

  <line x1="770" y1="125" x2="770" y2="168" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="770" y1="168" x2="660" y2="200" marker-end="url(#pr-arrow)"/>

  <text class="small" x="430" y="310">配套：连接管理 + 数据操作 + FAQ 页面组合使用</text>
</svg>
