<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="环境隔离的三个面、四层与三档数据隔离成本">
  <title>环境隔离：三个面与四层</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">环境隔离：三个面与四层</text>
  <rect x="30" y="74" width="264" height="78" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="162.0" y="104.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">数据面</text>
  <text x="162.0" y="119.0" font-size="9.8" fill="#475569" text-anchor="middle">读到别人写的行</text>
  <text x="162.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">租户列 / schema / 实例</text>
  <rect x="318" y="74" width="264" height="78" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="104.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">资源面</text>
  <text x="450.0" y="119.0" font-size="9.8" fill="#475569" text-anchor="middle">压测打挂功能测试</text>
  <text x="450.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">配额 / 独立压测环境</text>
  <rect x="606" y="74" width="264" height="78" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="738.0" y="104.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">依赖面</text>
  <text x="738.0" y="119.0" font-size="9.8" fill="#475569" text-anchor="middle">沙箱状态被改</text>
  <text x="738.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">契约桩 / 独立账号</text>
  <text x="30" y="186" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">四层隔离（按写面清单逐项过）</text>
  <rect x="30" y="198" width="150" height="42" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="105.0" y="223.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">L1 进程 / 容器</text>
  <text x="200" y="224" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">全局单例、静态缓存</text>
  <text x="420" y="224" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="400">每次测试起一个容器</text>
  <text x="760" y="224" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">秒级</text>
  <rect x="30" y="250" width="150" height="42" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="105.0" y="275.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">L2 数据存储</text>
  <text x="200" y="276" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">库 / 缓存 / 对象 / 索引</text>
  <text x="420" y="276" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="400">实例 / schema / 租户列</text>
  <text x="760" y="276" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">中</text>
  <rect x="30" y="302" width="150" height="42" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="105.0" y="327.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">L3 网络</text>
  <text x="200" y="328" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">端口、服务发现</text>
  <text x="420" y="328" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="400">动态端口、独立 namespace</text>
  <text x="760" y="328" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">低</text>
  <rect x="30" y="354" width="150" height="42" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="105.0" y="379.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">L4 外部依赖</text>
  <text x="200" y="380" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">支付 / 短信 / 邮件</text>
  <text x="420" y="380" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="400">契约桩 + 故障注入</text>
  <text x="760" y="380" font-size="10.6" fill="#475569" text-anchor="start" font-weight="400">中</text>
  <text x="30" y="424" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">三档数据隔离的成本差 10 倍、能力差 3 倍</text>
  <rect x="30" y="436" width="264" height="50" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="162.0" y="458.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">共享库 + 租户列</text>
  <text x="162.0" y="473.5" font-size="9.8" fill="#475569" text-anchor="middle">强度弱 · 成本 0</text>
  <rect x="318" y="436" width="264" height="50" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="450.0" y="458.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">独立 schema</text>
  <text x="450.0" y="473.5" font-size="9.8" fill="#475569" text-anchor="middle">强度中 · 200 MB</text>
  <rect x="606" y="436" width="264" height="50" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="738.0" y="458.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">独立实例</text>
  <text x="738.0" y="473.5" font-size="9.8" fill="#475569" text-anchor="middle">强度强 · 800 MB / 4 worker</text>
</svg>
