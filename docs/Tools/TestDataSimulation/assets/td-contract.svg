<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="契约唯一来源与三处漂移对齐">
  <title>契约仿真：一份真相，三个消费者，三处对齐</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">契约仿真：一份真相，三个消费者，三处对齐</text>
  <rect x="330" y="66" width="240" height="58" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="450.0" y="92.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">契约（唯一来源）</text>
  <text x="450.0" y="107.5" font-size="9.8" fill="#475569" text-anchor="middle">openapi/teamboard.yaml</text>
  <rect x="60" y="168" width="210" height="70" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="165.0" y="194.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">生成桩</text>
  <text x="165.0" y="209.0" font-size="9.8" fill="#475569" text-anchor="middle">Microcks / Prism</text>
  <text x="165.0" y="222.0" font-size="9.8" fill="#475569" text-anchor="middle">由 examples 驱动</text>
  <rect x="360" y="168" width="210" height="70" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="465.0" y="194.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">生成客户端</text>
  <text x="465.0" y="209.0" font-size="9.8" fill="#475569" text-anchor="middle">openapi-generator</text>
  <text x="465.0" y="222.0" font-size="9.8" fill="#475569" text-anchor="middle">签名与类型</text>
  <rect x="660" y="168" width="210" height="70" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="765.0" y="194.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">一致性测试</text>
  <text x="765.0" y="209.0" font-size="9.8" fill="#475569" text-anchor="middle">OPEN_API_SCHEMA</text>
  <text x="765.0" y="222.0" font-size="9.8" fill="#475569" text-anchor="middle">对真实实现跑</text>
  <path d="M 450 124 L 165 168" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M 450 124 L 465 168" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M 450 124 L 765 168" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="30" y="274" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">四种桩形态的取舍</text>
  <rect x="30" y="286" width="190" height="58" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="125.0" y="312.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">手写映射</text>
  <text x="125.0" y="327.5" font-size="9.8" fill="#475569" text-anchor="middle">维护高 · 漂移高</text>
  <rect x="242" y="286" width="190" height="58" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="337.0" y="312.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">代码内 mock</text>
  <text x="337.0" y="327.5" font-size="9.8" fill="#475569" text-anchor="middle">编译期能发现签名变化</text>
  <rect x="454" y="286" width="190" height="58" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="549.0" y="312.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">契约生成</text>
  <text x="549.0" y="327.5" font-size="9.8" fill="#475569" text-anchor="middle">维护低 · 漂移低</text>
  <rect x="666" y="286" width="190" height="58" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="761.0" y="312.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">录制回放</text>
  <text x="761.0" y="327.5" font-size="9.8" fill="#475569" text-anchor="middle">录的是「那一刻」</text>
  <rect x="30" y="366" width="840" height="58" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="392.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">三处对齐：契约 ↔ 桩（每次提交） / 契约 ↔ 实现（每日 + 联调前） / 实现 ↔ 运行（每周告警）</text>
  <text x="450.0" y="407.5" font-size="9.8" fill="#475569" text-anchor="middle">只做第一处：桩不说谎，但实现可能不符；只做第二处：桩可能早就跑偏</text>
  <rect x="30" y="440" width="840" height="46" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="467.5" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">典型覆盖率：契约 37 个 operation，桩实现 12 个 = 32%（其余在联调时才第一次被调用）</text>
</svg>
