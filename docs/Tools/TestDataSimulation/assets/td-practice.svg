<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="八步流水线与两份租户配方">
  <title>多租户看板的测试数据流水线：八步</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">多租户看板的测试数据流水线：八步</text>
  <rect x="30" y="76" width="190" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="125.0" y="106.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A1 建结构</text>
  <text x="125.0" y="121.5" font-size="9.8" fill="#475569" text-anchor="middle">表 / 约束 / RLS</text>
  <line x1="220" y1="109" x2="240" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="242" y="76" width="190" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="337.0" y="106.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A2 灌基线</text>
  <text x="337.0" y="121.5" font-size="9.8" fill="#475569" text-anchor="middle">租户 / 角色</text>
  <line x1="432" y1="109" x2="452" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="454" y="76" width="190" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="549.0" y="106.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A3 造业务</text>
  <text x="549.0" y="121.5" font-size="9.8" fill="#475569" text-anchor="middle">拓扑序 COPY</text>
  <line x1="644" y1="109" x2="664" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="666" y="76" width="190" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="761.0" y="106.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A4 注脏</text>
  <text x="761.0" y="121.5" font-size="9.8" fill="#475569" text-anchor="middle">2% NULL</text>
  <rect x="30" y="172" width="190" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="125.0" y="202.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A5 建索引</text>
  <text x="125.0" y="217.5" font-size="9.8" fill="#475569" text-anchor="middle">ANALYZE</text>
  <line x1="220" y1="205" x2="240" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="242" y="172" width="190" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="337.0" y="202.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A6 附件与索引</text>
  <text x="337.0" y="217.5" font-size="9.8" fill="#475569" text-anchor="middle">前缀 / 索引名</text>
  <line x1="432" y1="205" x2="452" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="454" y="172" width="190" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="549.0" y="202.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A7 算指纹</text>
  <text x="549.0" y="217.5" font-size="9.8" fill="#475569" text-anchor="middle">逐表 + 总</text>
  <line x1="644" y1="205" x2="664" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="666" y="172" width="190" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="761.0" y="202.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">A8 登记</text>
  <text x="761.0" y="217.5" font-size="9.8" fill="#475569" text-anchor="middle">租约 / changelog</text>
  <path d="M 815 142 L 848 142 L 848 190 L 815 190" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="30" y="280" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">两份配方：甲造正常世界，乙造「来敲门的人」</text>
  <rect x="30" y="292" width="405" height="90" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="232.5" y="321.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">租户甲（5 用户 / 4 看板）</text>
  <text x="232.5" y="336.5" font-size="9.8" fill="#475569" text-anchor="middle">角色 4 + 待激活 1</text>
  <text x="232.5" y="349.5" font-size="9.8" fill="#475569" text-anchor="middle">卡片 12 / 200 / 0 + 归档 1 个</text>
  <text x="232.5" y="362.5" font-size="9.8" fill="#475569" text-anchor="middle">评论 0 / 3 / 50</text>
  <rect x="465" y="292" width="405" height="90" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="667.5" y="321.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">租户乙（2 用户 / 1 看板）</text>
  <text x="667.5" y="336.5" font-size="9.8" fill="#475569" text-anchor="middle">只为一件事存在：跨租户访问有真实对象可撞</text>
  <text x="667.5" y="349.5" font-size="9.8" fill="#475569" text-anchor="middle">看板 id 与甲只差一位</text>
  <text x="667.5" y="362.5" font-size="9.8" fill="#475569" text-anchor="middle">断言必须是 404，不是 403</text>
  <rect x="30" y="400" width="840" height="56" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="425.5" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">三层数据不共用：单元用 builder / 集成用 schema+基线 / 端到端用完整世界</text>
  <text x="450.0" y="440.5" font-size="9.8" fill="#475569" text-anchor="middle">混用任何两层，都会在「快」或「真」或「大」三者之一上失败</text>
</svg>
