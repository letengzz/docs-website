<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="数据脱敏五步管线与复评回路">
  <title>脱敏五步：从标识符清单到分级结论</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">脱敏五步：从标识符清单到分级结论</text>
  <rect x="30" y="84" width="152" height="84" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="106.0" y="117.0" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">① 识别标识符</text>
  <text x="106.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">直接 + 准标识符</text>
  <text x="106.0" y="145.0" font-size="9.8" fill="#475569" text-anchor="middle">逐列对照数据字典</text>
  <line x1="182" y1="126" x2="200" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="202" y="84" width="152" height="84" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="278.0" y="117.0" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">② 选算法</text>
  <text x="278.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">六类按三维取舍</text>
  <text x="278.0" y="145.0" font-size="9.8" fill="#475569" text-anchor="middle">伪名化是默认</text>
  <line x1="354" y1="126" x2="372" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="374" y="84" width="152" height="84" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="450.0" y="117.0" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">③ 一致性映射</text>
  <text x="450.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">HMAC + 盐 + 版本</text>
  <text x="450.0" y="145.0" font-size="9.8" fill="#475569" text-anchor="middle">单射：唯一约束保证</text>
  <line x1="526" y1="126" x2="544" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="546" y="84" width="152" height="84" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="622.0" y="117.0" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">④ 回填</text>
  <text x="622.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">join 映射表</text>
  <text x="622.0" y="145.0" font-size="9.8" fill="#475569" text-anchor="middle">不重算（防漂移）</text>
  <line x1="698" y1="126" x2="716" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="718" y="84" width="152" height="84" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="794.0" y="117.0" font-size="11.8" font-weight="700" fill="#0f172a" text-anchor="middle">⑤ 评估分级</text>
  <text x="794.0" y="132.0" font-size="9.8" fill="#475569" text-anchor="middle">k = 最小等价类</text>
  <text x="794.0" y="145.0" font-size="9.8" fill="#475569" text-anchor="middle">GB/T 42460 四级</text>
  <rect x="30" y="198" width="405" height="66" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="232.5" y="222.0" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">反例：每列各自随机替换</text>
  <text x="232.5" y="237.0" font-size="9.8" fill="#475569" text-anchor="middle">user.phone 与 user_profile.phone 变成两个值</text>
  <text x="232.5" y="250.0" font-size="9.8" fill="#475569" text-anchor="middle">关联查询静默 0 行</text>
  <rect x="465" y="198" width="405" height="66" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="667.5" y="222.0" font-size="11.6" font-weight="700" fill="#0f172a" text-anchor="middle">反例：同一个 RNG 冒充一致性</text>
  <text x="667.5" y="237.0" font-size="9.8" fill="#475569" text-anchor="middle">两边遍历顺序不同 → 第 7 行错位</text>
  <text x="667.5" y="250.0" font-size="9.8" fill="#475569" text-anchor="middle">顺序敏感 = 不可复现</text>
  <path d="M 772 168 L 772 292 L 330 292" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="286" font-size="10.4" fill="#be123c" text-anchor="middle" font-weight="700">复评触发：结构变 / 场景变 / 环境变</text>
  <rect x="30" y="306" width="840" height="60" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="333.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">本例实测：16 行、性别 + 年龄段 → k = 3（5 个等价类 3/3/3/3/4）</text>
  <text x="450.0" y="348.5" font-size="9.8" fill="#475569" text-anchor="middle">泛化到 15 岁一档后 k 仍是 3（4 个等价类 3/3/4/6）——k 由最坏的那一格决定</text>
  <rect x="30" y="380" width="840" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="450.0" y="402.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">要提到 k = 5 只有两条路</text>
  <text x="450.0" y="417.0" font-size="9.8" fill="#475569" text-anchor="middle">① 丢掉性别维度（男 10 / 女 6 → k = 6）  ② 继续泛化年龄直到最小格 ≥ 5</text>
  <text x="450.0" y="430.0" font-size="9.8" fill="#475569" text-anchor="middle">两条都要付出「某个维度完全失效」的代价</text>
</svg>
