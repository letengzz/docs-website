<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="八步流水线每步产物与验收判据">
  <title>八步的产物与验收：顺序不能换</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">八步的产物与验收：顺序不能换</text>
  <text x="30" y="62" font-size="11" fill="#475569" text-anchor="start" font-weight="400">步</text>
  <text x="200" y="62" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
  <text x="560" y="62" font-size="11" fill="#475569" text-anchor="start" font-weight="400">验收</text>
  <rect x="30" y="74" width="160" height="38" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="110.0" y="97.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A1 建结构</text>
  <text x="200" y="98" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">001_tables.sql</text>
  <text x="560" y="98" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">\d card 有 FORCE ROW LEVEL SECURITY</text>
  <rect x="30" y="120" width="160" height="38" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="110.0" y="143.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A2 灌基线</text>
  <text x="200" y="144" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">tenant.tsv / rbac.tsv</text>
  <text x="560" y="144" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">行数与八项口径一致</text>
  <rect x="30" y="166" width="160" height="38" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="110.0" y="189.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A3 造业务数据</text>
  <text x="200" y="190" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">board / card / comment.tsv</text>
  <text x="560" y="190" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">悬空外键 = 0</text>
  <rect x="30" y="212" width="160" height="38" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="110.0" y="235.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A4 注脏数据</text>
  <text x="200" y="236" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">同 A3（比例注入）</text>
  <text x="560" y="236" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">实测比例与配置差 &lt; 0.2%</text>
  <rect x="30" y="258" width="160" height="38" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="110.0" y="281.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A5 建索引 + ANALYZE</text>
  <text x="200" y="282" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">002_indexes.sql</text>
  <text x="560" y="282" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">体积与估算偏差 &lt; 30%</text>
  <rect x="30" y="304" width="160" height="38" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="110.0" y="327.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A6 附件与索引</text>
  <text x="200" y="328" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">bucket 前缀 / card_{runId}</text>
  <text x="560" y="328" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">每租户前缀对象数 = 3</text>
  <rect x="30" y="350" width="160" height="38" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="110.0" y="373.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A7 算指纹</text>
  <text x="200" y="374" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">fingerprint.txt</text>
  <text x="560" y="374" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">连跑两次相同</text>
  <rect x="30" y="396" width="160" height="38" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="110.0" y="419.5" font-size="10.8" font-weight="700" fill="#0f172a" text-anchor="middle">A8 登记</text>
  <text x="200" y="420" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="400">env_lease + changelog</text>
  <text x="560" y="420" font-size="10.4" fill="#475569" text-anchor="start" font-weight="400">租约有 expires_at</text>
  <rect x="30" y="448" width="840" height="14" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="459.5" font-size="1" font-weight="700" fill="#0f172a" text-anchor="middle"></text>
</svg>
