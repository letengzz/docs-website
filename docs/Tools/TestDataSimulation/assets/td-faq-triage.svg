<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="症状分诊决策树">
  <title>分诊第一步：这个红能不能复现</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">分诊第一步：这个红能不能复现</text>
  <rect x="330" y="66" width="240" height="54" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="97.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">一个红 / 一个异常现象</text>
  <rect x="60" y="160" width="240" height="54" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="180.0" y="191.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">能复现</text>
  <rect x="600" y="160" width="240" height="54" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="720.0" y="191.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">不能复现（重跑就过）</text>
  <line x1="400" y1="120" x2="200" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="500" y1="120" x2="700" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="60" y="236" width="240" height="40" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="180.0" y="260.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">分布 / 边界没造到</text>
  <text x="312" y="261" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→ 数据工厂</text>
  <rect x="60" y="286" width="240" height="40" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="180.0" y="310.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">悬空外键 / 基数错</text>
  <text x="312" y="311" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→ 数据工厂</text>
  <rect x="60" y="336" width="240" height="40" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="180.0" y="360.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">桩漂移（mock 说谎）</text>
  <text x="312" y="361" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→ 契约仿真</text>
  <rect x="60" y="386" width="240" height="40" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="180.0" y="410.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">写请求污染世界</text>
  <text x="312" y="411" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→ 流量回放</text>
  <rect x="600" y="236" width="240" height="40" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720.0" y="260.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">时钟没注入</text>
  <text x="852" y="261" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→</text>
  <text x="600" y="270" font-size="8.6" fill="#475569" text-anchor="start" font-weight="400">数据集版本化</text>
  <rect x="600" y="286" width="240" height="40" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720.0" y="310.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">随机 / 序列没固定</text>
  <text x="852" y="311" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→</text>
  <text x="600" y="320" font-size="8.6" fill="#475569" text-anchor="start" font-weight="400">数据集版本化</text>
  <rect x="600" y="336" width="240" height="40" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720.0" y="360.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">外部响应不稳定</text>
  <text x="852" y="361" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→</text>
  <text x="600" y="370" font-size="8.6" fill="#475569" text-anchor="start" font-weight="400">契约仿真</text>
  <rect x="600" y="386" width="240" height="40" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="720.0" y="410.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">资源被抢占</text>
  <text x="852" y="411" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">→</text>
  <text x="600" y="420" font-size="8.6" fill="#475569" text-anchor="start" font-weight="400">环境隔离</text>
  <rect x="330" y="236" width="240" height="90" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="272.0" font-size="11.4" font-weight="700" fill="#0f172a" text-anchor="middle">先怀疑四个隐藏变量</text>
  <text x="450.0" y="287.0" font-size="9.8" fill="#475569" text-anchor="middle">不是先改断言</text>
  <text x="450.0" y="300.0" font-size="9.8" fill="#475569" text-anchor="middle">改断言 = 把缺陷藏起来</text>
</svg>
