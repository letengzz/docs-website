<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="测试数据与仿真环境四层结构与失败回补回路">
  <title>测试数据与仿真环境：四层与一条回路</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450.0" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">测试数据与仿真环境：四层与一条回路</text>
  <text x="30" y="66" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">一次测试需要同时成立的四件事</text>
  <rect x="30" y="82" width="195" height="42" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="127.5" y="107.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">数据层</text>
  <rect x="30" y="134" width="195" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="127.5" y="164.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">脱敏映射（一致性 / 单射）</text>
  <rect x="30" y="196" width="195" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="127.5" y="226.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">数据工厂（分布 / 引用图）</text>
  <rect x="30" y="258" width="195" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="127.5" y="288.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">数据集指纹（稳定 / 灵敏）</text>
  <rect x="245" y="82" width="195" height="42" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="342.5" y="107.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">环境层</text>
  <rect x="245" y="134" width="195" height="52" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="342.5" y="164.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">按需环境（Testcontainers）</text>
  <rect x="245" y="196" width="195" height="52" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="342.5" y="226.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">租约与命名空间</text>
  <rect x="245" y="258" width="195" height="52" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="342.5" y="288.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">资源配额</text>
  <rect x="460" y="82" width="195" height="42" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="557.5" y="107.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">依赖层</text>
  <rect x="460" y="134" width="195" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="557.5" y="164.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">契约桩（唯一来源）</text>
  <rect x="460" y="196" width="195" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="557.5" y="226.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">状态机与故障注入</text>
  <rect x="460" y="258" width="195" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="557.5" y="288.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">漂移检测（三处对齐）</text>
  <rect x="675" y="82" width="195" height="42" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="772.5" y="107.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">编排层</text>
  <rect x="675" y="134" width="195" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="772.5" y="164.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">一条命令重建</text>
  <rect x="675" y="196" width="195" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="772.5" y="226.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">清理与回收任务</text>
  <rect x="675" y="258" width="195" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="772.5" y="288.5" font-size="10.6" font-weight="700" fill="#0f172a" text-anchor="middle">门禁（可判定的红）</text>
  <path d="M 772 330 L 772 402 L 128 402 L 128 402" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="396" font-size="10.8" fill="#be123c" text-anchor="middle" font-weight="700">一次红 → 回补数据（而不是改断言）</text>
  <rect x="30" y="420" width="840" height="74" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="448.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">三个约束互相拉扯，只能按用途分级</text>
  <text x="450.0" y="463.0" font-size="9.8" fill="#475569" text-anchor="middle">真实性（像生产）  ×  安全性（无真 PII）  ×  可重复性（同结果）</text>
  <text x="450.0" y="476.0" font-size="9.8" fill="#475569" text-anchor="middle">把 k 从 3 提到 10：等价类被合并、相关性被抹平 → 安全性上去，真实性下来</text>
  <rect x="30" y="508" width="840" height="36" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="530.5" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">判别力 = 变红的缺陷数 / 注入的缺陷总数（生产快照 60% vs 边界数据 90%）</text>
</svg>
