<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">五个非确定性来源与三段钳制</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「同一份输入产出同一串字节」不是宣言，是可以被字节级证伪的命题</text>
  <rect x="30" y="70" width="165" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="112.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">① 时间戳</text>
  <text x="112.5" y="105" text-anchor="middle" font-size="7.5" fill="#C2410C">tar/zip 每个条目 mtime</text>
  <text x="112.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#C2410C">gzip 头时间</text>
  <text x="112.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#C2410C">jar 文件时间</text>
  <rect x="208" y="70" width="165" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="290.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">② 遍历顺序</text>
  <text x="290.5" y="105" text-anchor="middle" font-size="7.5" fill="#B45309">readdir 顺序</text>
  <text x="290.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#B45309">并行完成顺序</text>
  <text x="290.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#B45309">HashMap 迭代</text>
  <rect x="386" y="70" width="165" height="92" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="468.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">③ 绝对路径</text>
  <text x="468.5" y="105" text-anchor="middle" font-size="7.5" fill="#BE185D">sourcemap sources</text>
  <text x="468.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#BE185D">debug 目录</text>
  <text x="468.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#BE185D">__dirname</text>
  <rect x="564" y="70" width="165" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="646.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">④ locale/时区</text>
  <text x="646.5" y="105" text-anchor="middle" font-size="7.5" fill="#6D28D9">排序规则</text>
  <text x="646.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">日期格式化</text>
  <text x="646.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">土耳其 i</text>
  <rect x="30" y="176" width="340" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="200" y="194.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">⑤ 随机与主机状态</text>
  <text x="200" y="211" text-anchor="middle" font-size="7.5" fill="#334155">UUID / 临时端口 / hostname</text>
  <text x="200" y="228.25" text-anchor="middle" font-size="7.5" fill="#334155">CPU 核数影响并行切分</text>
  <text x="200" y="245.5" text-anchor="middle" font-size="7.5" fill="#334155">→ 只能注入，不能消灭</text>
  <rect x="390" y="176" width="340" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="194.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">实测：默认两次打包就不同</text>
  <text x="560" y="211" text-anchor="middle" font-size="7.5" fill="#047857">95ae1c6b…  vs  79039b50…（785 B 相同体积）</text>
  <text x="560" y="228.25" text-anchor="middle" font-size="7.5" fill="#047857">钳制后：5d0c2b86… = 5d0c2b86…</text>
  <rect x="30" y="284" width="700" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="302.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">只改外层 gzip 头不够：tar 里每个条目都有自己的 mtime 字段</text>
  <text x="380" y="319" text-anchor="middle" font-size="7.5" fill="#B91C1C">0df3a41c… ≠ f0e5bb47… —— 必须同时钳制条目时间、顺序、uid/gid、mode 与 gzip 头</text>
  <rect x="30" y="344" width="340" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="200" y="362.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">五项钳制</text>
  <text x="200" y="379" text-anchor="middle" font-size="7.5" fill="#4338CA">排序 / mtime / uid·gid / mode / gzip -n</text>
  <rect x="390" y="344" width="340" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="362.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">证明手段</text>
  <text x="560" y="379" text-anchor="middle" font-size="7.5" fill="#0F766E">同机双跑 → 跨目录双跑 → diffoscope 归因</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
