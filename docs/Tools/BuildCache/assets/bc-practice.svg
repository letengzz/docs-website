<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四周落地与一次假命中的定位时间线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「键相同但产物不同」这一刀，把排查方向一次切成两半</text>
  <rect x="30" y="70" width="165" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">第 1 周</text>
  <text x="112.5" y="105" text-anchor="middle" font-size="7.5" fill="#1D4ED8">让本地能命中</text>
  <text x="112.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">指纹稳定 + 容量 + 三态观测</text>
  <line x1="196" y1="114" x2="205" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="206" y="70" width="165" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="288.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">第 2 周</text>
  <text x="288.5" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">正确性</text>
  <text x="288.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#0F766E">抽检 + 排除副作用 + V1 验证</text>
  <line x1="372" y1="114" x2="381" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="382" y="70" width="165" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="464.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">第 3 周</text>
  <text x="464.5" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">远程（只让 CI 写）</text>
  <text x="464.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#4338CA">权限 + 配额 + 完整性 + 降级</text>
  <line x1="548" y1="114" x2="557" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="558" y="70" width="165" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="640.5" y="88.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">第 4 周</text>
  <text x="640.5" y="105" text-anchor="middle" font-size="7.5" fill="#6D28D9">可复现与看板</text>
  <text x="640.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">钳制时间/路径 + 四指标</text>
  <text x="380" y="180" text-anchor="middle" font-size="9.5" fill="#B91C1C" font-weight="bold">顺序不能换：先正确、再共享、最后证明</text>
  <text x="52" y="200" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:02</text>
  <text x="82" y="200" text-anchor="start" font-size="8.5" fill="#334155">报障：修复在预发又出现，本地是好的</text>
  <line x1="72" y1="211" x2="720" y2="211" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="232" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:05</text>
  <text x="82" y="232" text-anchor="start" font-size="8.5" fill="#334155">无缓存重建 → 问题消失：确认是假命中，剪掉业务线</text>
  <line x1="72" y1="243" x2="720" y2="243" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="264" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:09</text>
  <text x="82" y="264" text-anchor="start" font-size="8.5" fill="#334155">保留现场：备份缓存目录 + 导出强制构建日志</text>
  <line x1="72" y1="275" x2="720" y2="275" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="296" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:14</text>
  <text x="82" y="296" text-anchor="start" font-size="8.5" fill="#334155">量键：命中与强制重建的 hash 相同 → 不是算错键</text>
  <line x1="72" y1="307" x2="720" y2="307" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="328" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:20</text>
  <text x="82" y="328" text-anchor="start" font-size="8.5" fill="#334155">同键两份产物 → 查 inputs，发现漏了 config/**</text>
  <line x1="72" y1="339" x2="720" y2="339" stroke="#E2E8F0" stroke-width="1"/>
  <text x="52" y="360" text-anchor="middle" font-size="8.5" fill="#7C3AED" font-weight="bold">14:35</text>
  <text x="82" y="360" text-anchor="start" font-size="8.5" fill="#334155">止血：关远程读 → 换前缀 → 修 inputs → 补断言</text>
  <line x1="72" y1="371" x2="720" y2="371" stroke="#E2E8F0" stroke-width="1"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
