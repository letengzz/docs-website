<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">本地缓存的五段结构与两个并发风险</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">最容易被低估的一层：它同时承担低延迟、挡写放大、提供第一现场</text>
  <rect x="30" y="70" width="165" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="112.5" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">① 放哪</text>
  <text x="112.5" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">显式配置，不靠默认</text>
  <text x="112.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#4338CA">仓库内 vs 用户目录</text>
  <text x="112.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#4338CA">决定共享范围</text>
  <rect x="208" y="70" width="165" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="290.5" y="88.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 装多少</text>
  <text x="290.5" y="105" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按工作集定容量</text>
  <text x="290.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">20→35.4%  100→68.1%</text>
  <text x="290.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">400→88.1% 后饱和</text>
  <rect x="386" y="70" width="165" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="468.5" y="88.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 怎么写</text>
  <text x="468.5" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">临时文件 + 原子替换</text>
  <text x="468.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#0F766E">写时不校验 = 会读到半个</text>
  <text x="468.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#0F766E">Windows 必须重试</text>
  <rect x="564" y="70" width="165" height="100" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="646.5" y="88.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">④ 谁共享</text>
  <text x="646.5" y="105" text-anchor="middle" font-size="7.5" fill="#6D28D9">跨分支可以</text>
  <text x="646.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">跨 worktree 要隔离</text>
  <text x="646.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">跨仓库会串味</text>
  <text x="380" y="190" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">⑤ 怎么清：目录 / 单条 / 换前缀 / 降容量，四件事对应四种问题</text>
  <rect x="30" y="208" width="340" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="200" y="226.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">就地写（open + write）</text>
  <text x="200" y="243" text-anchor="middle" font-size="7.5" fill="#B91C1C">读到不完整 39/996 = 3.9%</text>
  <text x="200" y="260.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">观测到 4 种内容指纹</text>
  <rect x="390" y="208" width="340" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="226.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">临时文件 + os.replace</text>
  <text x="560" y="243" text-anchor="middle" font-size="7.5" fill="#047857">读到不完整 0/973 = 0.0%</text>
  <text x="560" y="260.25" text-anchor="middle" font-size="7.5" fill="#047857">Windows 因占用重试 188 次</text>
  <rect x="30" y="320" width="700" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="338.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">容量与命中率的关系是非线性的：从 20 加到 100 涨 33 个点，从 200 加到 400 只涨 7 个点</text>
  <text x="380" y="355" text-anchor="middle" font-size="7.5" fill="#B45309">按「磁盘剩余」定容量 = 写放大；按「工作集 × 1.5~2」定容量 = 命中率与磁盘的平衡</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
