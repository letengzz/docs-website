<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三层缓存与一次命中的完整路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">键的客观性 ↔ 失效半径，两者的取舍决定了整套体系的上限</text>
  <rect x="30" y="70" width="165" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="112.5" y="88.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">依赖缓存</text>
  <text x="112.5" y="105" text-anchor="middle" font-size="7.5" fill="#334155">一个依赖包</text>
  <text x="112.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#334155">键：坐标 + 校验和</text>
  <text x="112.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#334155">清一次全仓库重下</text>
  <rect x="208" y="70" width="165" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="290.5" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">任务级缓存</text>
  <text x="290.5" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">一个任务的输出</text>
  <text x="290.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#4338CA">键：输入指纹</text>
  <text x="290.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#4338CA">错一个键错一个任务</text>
  <rect x="386" y="70" width="165" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="468.5" y="88.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">产物级 CAS</text>
  <text x="468.5" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">一段字节</text>
  <text x="468.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#0F766E">键：sha256(字节)</text>
  <text x="468.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#0F766E">内容不变就永远有效</text>
  <rect x="564" y="70" width="165" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="646.5" y="88.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">镜像层</text>
  <text x="646.5" y="105" text-anchor="middle" font-size="7.5" fill="#B45309">一条指令的结果</text>
  <text x="646.5" y="122.25" text-anchor="middle" font-size="7.5" fill="#B45309">键：指令 + 父层摘要</text>
  <text x="646.5" y="139.5" text-anchor="middle" font-size="7.5" fill="#B45309">父层一变后面全废</text>
  <text x="30" y="178" text-anchor="start" font-size="8.5" fill="#64748B">越往下键越客观，越往上失效半径越大</text>
  <rect x="32.0" y="208" width="92" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="78" y="226.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">归一化</text>
  <text x="78" y="243" text-anchor="middle" font-size="7" fill="#6D28D9">第 1 环</text>
  <line x1="125" y1="234" x2="132.2" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="133.2" y="208" width="92" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="179.2" y="226.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">算指纹</text>
  <text x="179.2" y="243" text-anchor="middle" font-size="7" fill="#6D28D9">第 2 环</text>
  <line x1="226.2" y1="234" x2="233.4" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="234.4" y="208" width="92" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="280.4" y="226.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">查本地</text>
  <text x="280.4" y="243" text-anchor="middle" font-size="7" fill="#6D28D9">第 3 环</text>
  <line x1="327.4" y1="234" x2="334.6" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="335.6" y="208" width="92" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381.6" y="226.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">查远程</text>
  <text x="381.6" y="243" text-anchor="middle" font-size="7" fill="#6D28D9">第 4 环</text>
  <line x1="428.6" y1="234" x2="435.8" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="436.8" y="208" width="92" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="482.8" y="226.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">校验</text>
  <text x="482.8" y="243" text-anchor="middle" font-size="7" fill="#047857">第 5 环</text>
  <line x1="529.8" y1="234" x2="537" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="538.0" y="208" width="92" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="584" y="226.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">还原</text>
  <text x="584" y="243" text-anchor="middle" font-size="7" fill="#047857">第 6 环</text>
  <line x1="631" y1="234" x2="638.2" y2="234" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="639.2" y="208" width="92" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="685.2" y="226.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">回写</text>
  <text x="685.2" y="243" text-anchor="middle" font-size="7" fill="#047857">第 7 环</text>
  <rect x="30" y="288" width="168" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="114" y="306.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">命中率</text>
  <text x="114" y="323" text-anchor="middle" font-size="7.5" fill="#1D4ED8">命中 / 总数</text>
  <text x="114" y="340.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">高不一定是好</text>
  <rect x="212" y="288" width="168" height="92" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="296" y="306.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">命中收益</text>
  <text x="296" y="323" text-anchor="middle" font-size="7.5" fill="#0E7490">local / remote 分开算</text>
  <text x="296" y="340.25" text-anchor="middle" font-size="7.5" fill="#0E7490">看省了多少秒</text>
  <rect x="394" y="288" width="168" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="478" y="306.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">假命中率</text>
  <text x="478" y="323" text-anchor="middle" font-size="7.5" fill="#B91C1C">应重建而未重建</text>
  <text x="478" y="340.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">唯一的硬指标：0</text>
  <rect x="576" y="288" width="154" height="92" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="653" y="306.2" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">污染半径</text>
  <text x="653" y="323" text-anchor="middle" font-size="7.5" fill="#BE185D">一个坏条目影响几个构建</text>
  <text x="653" y="340.25" text-anchor="middle" font-size="7.5" fill="#BE185D">越小越好</text>
  <text x="380" y="404" text-anchor="middle" font-size="9.5" fill="#B91C1C" font-weight="bold">命中率低只是慢；假命中是错。错会一路传到线上。</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
