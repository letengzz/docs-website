<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">按现象分诊的四条主干</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一个「没命中」有十几种成因，修法彼此不通用</text>
  <rect x="230" y="70" width="300" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">先量这一刀：两次构建的键相同吗</text>
  <line x1="380" y1="125" x2="380" y2="158" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="111" y1="160" x2="645" y2="160" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="30" y="208" width="162" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="111" y="226.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">键不同 → 指纹</text>
  <text x="111" y="243" text-anchor="middle" font-size="6.8" fill="#B45309">mtime 进了键</text>
  <text x="111" y="258.64" text-anchor="middle" font-size="6.8" fill="#B45309">绝对路径进了键</text>
  <text x="111" y="274.28" text-anchor="middle" font-size="6.8" fill="#B45309">遍历顺序不稳定</text>
  <text x="111" y="289.92" text-anchor="middle" font-size="6.8" fill="#B45309">→ 去指纹页</text>
  <line x1="111" y1="162" x2="111" y2="206" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="208" y="208" width="162" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="289" y="226.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">键同 · 未命中</text>
  <text x="289" y="243" text-anchor="middle" font-size="6.8" fill="#1D4ED8">没写进去 / 被淘汰</text>
  <text x="289" y="258.64" text-anchor="middle" font-size="6.8" fill="#1D4ED8">远程没推（gate 默认 false）</text>
  <text x="289" y="274.28" text-anchor="middle" font-size="6.8" fill="#1D4ED8">读的目录不是以为的那个</text>
  <text x="289" y="289.92" text-anchor="middle" font-size="6.8" fill="#1D4ED8">→ 本地 / 远程页</text>
  <line x1="289" y1="162" x2="289" y2="206" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="208" width="162" height="108" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="467" y="226.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">键同 · 命中但产物错</text>
  <text x="467" y="243" text-anchor="middle" font-size="6.8" fill="#B91C1C">漏输入（同键两义）</text>
  <text x="467" y="258.64" text-anchor="middle" font-size="6.8" fill="#B91C1C">条目被写坏</text>
  <text x="467" y="274.28" text-anchor="middle" font-size="6.8" fill="#B91C1C">→ 正确性页</text>
  <line x1="467" y1="162" x2="467" y2="206" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="564" y="208" width="162" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="645" y="226.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">产物每次都不同</text>
  <text x="645" y="243" text-anchor="middle" font-size="6.8" fill="#6D28D9">时间戳 / 随机 / 顺序</text>
  <text x="645" y="258.64" text-anchor="middle" font-size="6.8" fill="#6D28D9">伪装成「总是未命中」</text>
  <text x="645" y="274.28" text-anchor="middle" font-size="6.8" fill="#6D28D9">→ 可复现页</text>
  <line x1="645" y1="162" x2="645" y2="206" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="344" text-anchor="middle" font-size="9.5" fill="#334155" font-weight="bold">四条分支互不通用：先分诊，再修。别一上来清缓存——会丢掉现场。</text>
  <rect x="30" y="358" width="700" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="376.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">五个「看起来是缓存问题，其实不是」</text>
  <text x="380" y="393" text-anchor="middle" font-size="7.5" fill="#334155">瓶颈在测试/装依赖/镜像；分母变了；本机更弱；条目太大解包更慢；升级工具后全不命中（这是对的）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
