<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">九字段指纹与三类错误的后果</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">写窄了会慢，写宽了会错；漏了字段会静默地给出上一次的结果</text>
  <rect x="30" y="70" width="340" height="250" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="88.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">必须进键的字段</text>
  <text x="200" y="105" text-anchor="middle" font-size="8" fill="#047857">① 源码内容（不是 mtime）</text>
  <text x="200" y="123.4" text-anchor="middle" font-size="8" fill="#047857">② 依赖锁（lockfile）</text>
  <text x="200" y="141.8" text-anchor="middle" font-size="8" fill="#047857">③ 工具链 / 打包器 / 插件版本</text>
  <text x="200" y="160.2" text-anchor="middle" font-size="8" fill="#047857">④ 构建命令与关键参数</text>
  <text x="200" y="178.6" text-anchor="middle" font-size="8" fill="#047857">⑤ 环境变量（显式白名单）</text>
  <text x="200" y="197" text-anchor="middle" font-size="8" fill="#047857">⑥ locale / 时区（产物含格式化时）</text>
  <text x="200" y="215.4" text-anchor="middle" font-size="8" fill="#047857">⑧ 算法与字段集版本前缀</text>
  <text x="200" y="233.8" text-anchor="middle" font-size="8" fill="#047857">⑨ 任务标识 + 目标平台</text>
  <rect x="390" y="70" width="340" height="250" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="88.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">不该进键的字段</text>
  <text x="560" y="105" text-anchor="middle" font-size="8" fill="#B91C1C">文件 mtime / inode</text>
  <text x="560" y="123.4" text-anchor="middle" font-size="8" fill="#B91C1C">权限位（除可执行位）</text>
  <text x="560" y="141.8" text-anchor="middle" font-size="8" fill="#B91C1C">绝对路径（应归一化为相对）</text>
  <text x="560" y="160.2" text-anchor="middle" font-size="8" fill="#B91C1C">构建时间 / 随机数</text>
  <text x="560" y="178.6" text-anchor="middle" font-size="8" fill="#B91C1C">git 分支名（用 tree hash）</text>
  <text x="560" y="197" text-anchor="middle" font-size="8" fill="#B91C1C">user.name / hostname / PWD</text>
  <text x="560" y="215.4" text-anchor="middle" font-size="8" fill="#B91C1C">整个 os.environ 全量透传</text>
  <text x="560" y="233.8" text-anchor="middle" font-size="8" fill="#B91C1C">全量 node_modules 逐文件</text>
  <rect x="30" y="344" width="168" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="114" y="362.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">漏（under-key）</text>
  <text x="114" y="379" text-anchor="middle" font-size="7.5" fill="#B91C1C">假命中</text>
  <text x="114" y="396.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">构建绿但不重建</text>
  <rect x="212" y="344" width="168" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="296" y="362.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">多（over-key）</text>
  <text x="296" y="379" text-anchor="middle" font-size="7.5" fill="#B45309">假未命中</text>
  <text x="296" y="396.25" text-anchor="middle" font-size="7.5" fill="#B45309">慢但不错</text>
  <rect x="394" y="344" width="168" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="478" y="362.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">不稳定</text>
  <text x="478" y="379" text-anchor="middle" font-size="7.5" fill="#C2410C">同输入算出不同键</text>
  <text x="478" y="396.25" text-anchor="middle" font-size="7.5" fill="#C2410C">看起来像缓存坏了</text>
  <rect x="576" y="344" width="154" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="653" y="362.2" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">判据</text>
  <text x="653" y="379" text-anchor="middle" font-size="7.5" fill="#4338CA">换目录、换分支、连跑两次</text>
  <text x="653" y="396.25" text-anchor="middle" font-size="7.5" fill="#4338CA">指纹都必须一致</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
