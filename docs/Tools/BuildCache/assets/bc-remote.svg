<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="408" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">远程缓存的两个键与治理面</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">存的是会被还原进工作区、参与后续构建的产物——权限应对齐制品库</text>
  <rect x="30" y="70" width="220" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="140" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">动作键（action key）</text>
  <text x="140" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">= 任务指纹</text>
  <text x="140" y="122.25" text-anchor="middle" font-size="7.5" fill="#4338CA">→ 结果描述：文件清单 + 退出码</text>
  <text x="140" y="139.5" text-anchor="middle" font-size="7.5" fill="#4338CA">人算的，可能漏字段</text>
  <rect x="270" y="70" width="220" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="88.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">内容键（content key）</text>
  <text x="380" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">= sha256(字节)</text>
  <text x="380" y="122.25" text-anchor="middle" font-size="7.5" fill="#0F766E">→ 字节本身</text>
  <text x="380" y="139.5" text-anchor="middle" font-size="7.5" fill="#0F766E">算出来的，不可能错</text>
  <rect x="510" y="70" width="220" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="620" y="88.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">校验只在内容键上成立</text>
  <text x="620" y="105" text-anchor="middle" font-size="7.5" fill="#047857">下载后重算哈希</text>
  <text x="620" y="122.25" text-anchor="middle" font-size="7.5" fill="#047857">不符即当未命中</text>
  <text x="620" y="139.5" text-anchor="middle" font-size="7.5" fill="#047857">这是唯一挡投毒的手段</text>
  <rect x="30" y="196" width="140" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="100" y="214.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">本地</text>
  <text x="100" y="231" text-anchor="middle" font-size="7.5" fill="#1D4ED8">0.05 s 级</text>
  <line x1="171" y1="227" x2="208" y2="227" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="196" width="140" height="62" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="280" y="214.2" text-anchor="middle" font-size="9" fill="#155E75" font-weight="bold">远程</text>
  <text x="280" y="231" text-anchor="middle" font-size="7.5" fill="#0E7490">0.6 s 级</text>
  <line x1="351" y1="227" x2="388" y2="227" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="196" width="140" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="460" y="214.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">校验</text>
  <text x="460" y="231" text-anchor="middle" font-size="7.5" fill="#0F766E">sha256</text>
  <line x1="531" y1="227" x2="568" y2="227" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="196" width="160" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="650" y="214.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">还原 + 回写本地</text>
  <text x="650" y="231" text-anchor="middle" font-size="7.5" fill="#047857">失败不影响构建</text>
  <text x="380" y="282" text-anchor="middle" font-size="9" fill="#334155">读顺序：本地 → 远程 → 回写本地（反过来等于本地缓存不存在）</text>
  <rect x="30" y="302" width="220" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="140" y="320.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">谁能写</text>
  <text x="140" y="337" text-anchor="middle" font-size="7.5" fill="#B91C1C">只有 CI 的 service account</text>
  <text x="140" y="354.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">PR 构建不写 main 的键</text>
  <text x="140" y="371.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">开发机只读</text>
  <rect x="270" y="302" width="220" height="88" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="320.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">键空间与配额</text>
  <text x="380" y="337" text-anchor="middle" font-size="7.5" fill="#B45309">/&lt;tenant&gt;/&lt;repo&gt;/&lt;key&gt;</text>
  <text x="380" y="354.25" text-anchor="middle" font-size="7.5" fill="#B45309">限总量 + 限速</text>
  <text x="380" y="371.5" text-anchor="middle" font-size="7.5" fill="#B45309">配额告警接监控</text>
  <rect x="510" y="302" width="220" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="620" y="320.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">失败即降级</text>
  <text x="620" y="337" text-anchor="middle" font-size="7.5" fill="#334155">重试 3 次后本次禁用</text>
  <text x="620" y="354.25" text-anchor="middle" font-size="7.5" fill="#334155">413 不视为错误</text>
  <text x="620" y="371.5" text-anchor="middle" font-size="7.5" fill="#334155">构建绝不因远程失败</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
