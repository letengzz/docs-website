<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">协作问题定位树</text>
  <g font-size="13" text-anchor="middle">
    <rect x="330" y="66" width="240" height="60" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="92" fill="#4338ca" font-weight="bold" font-size="14">协作卡住了？</text>
    <text x="450" y="112" fill="#4b5563" font-size="11">先判断卡在哪一类</text>
    <rect x="40" y="176" width="250" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="165" y="202" fill="#be123c" font-weight="bold" font-size="14">信息找不到</text>
    <text x="165" y="222" fill="#4b5563" font-size="11">同一主题多处版本 → 收敛到唯一来源</text>
    <text x="165" y="239" fill="#4b5563" font-size="11">文档过期 → 标状态并指定 Owner</text>
    <text x="165" y="256" fill="#4b5563" font-size="11">搜索不到 → 补标题与标签规范</text>
    <rect x="320" y="176" width="250" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="445" y="202" fill="#b45309" font-weight="bold" font-size="14">流转不顺畅</text>
    <text x="445" y="222" fill="#4b5563" font-size="11">状态无人推进 → 每个状态定负责人</text>
    <text x="445" y="239" fill="#4b5563" font-size="11">评审无限拖延 → 设 SLA（如 24h）</text>
    <text x="445" y="256" fill="#4b5563" font-size="11">需求反复改 → 走变更流程留痕</text>
    <rect x="600" y="176" width="260" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="730" y="202" fill="#1d4ed8" font-weight="bold" font-size="14">度量不可信</text>
    <text x="730" y="222" fill="#4b5563" font-size="11">数据靠人工填 → 改为自动采集</text>
    <text x="730" y="239" fill="#4b5563" font-size="11">指标互相打架 → 明确口径与来源</text>
    <text x="730" y="256" fill="#4b5563" font-size="11">只看速度不看质量 → 加质量指标</text>
    <rect x="180" y="320" width="240" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="346" fill="#047857" font-weight="bold" font-size="14">工具太多</text>
    <text x="300" y="366" fill="#4b5563" font-size="11">先减不增：砍掉没人用的</text>
    <text x="300" y="383" fill="#4b5563" font-size="11">统一入口，避免双写</text>
    <rect x="470" y="320" width="260" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="346" fill="#6d28d9" font-weight="bold" font-size="14">会议太多</text>
    <text x="600" y="366" fill="#4b5563" font-size="11">能异步的别开会</text>
    <text x="600" y="383" fill="#4b5563" font-size="11">会必有议题与结论</text>
    <text x="600" y="400" fill="#4b5563" font-size="11">结论回写文档</text>
    <path d="M 400 126 L 180 170" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 450 126 L 445 170" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 510 126 L 720 170" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 220 286 L 290 314" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 620 286 L 590 314" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="450" y="402" text-anchor="middle" font-size="13" fill="#475569">所有协作问题的通用解法：把「口头约定」变成「写下来的规则」，再加一点自动化</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
