<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Confluence 空间与页面组织</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="180" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="96" fill="#1d4ed8" font-weight="bold" font-size="14">空间 Space</text>
    <text x="120" y="116" fill="#4b5563" font-size="11">权限边界</text>
    <text x="120" y="133" fill="#4b5563" font-size="11">团队/产品各一个</text>
    <rect x="240" y="60" width="190" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="335" y="86" fill="#047857" font-weight="bold" font-size="14">研发空间</text>
    <text x="335" y="106" fill="#4b5563" font-size="11">技术方案 / 架构</text>
    <text x="335" y="123" fill="#4b5563" font-size="11">接口文档 / 规范</text>
    <rect x="240" y="180" width="190" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="335" y="206" fill="#b45309" font-weight="bold" font-size="14">产品空间</text>
    <text x="335" y="226" fill="#4b5563" font-size="11">需求文档 / 原型</text>
    <text x="335" y="243" fill="#4b5563" font-size="11">路线图 / 发布说明</text>
    <rect x="240" y="300" width="190" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="335" y="326" fill="#6d28d9" font-weight="bold" font-size="14">团队空间</text>
    <text x="335" y="346" fill="#4b5563" font-size="11">会议纪要 / 周报</text>
    <text x="335" y="363" fill="#4b5563" font-size="11">新人上手指南</text>
    <rect x="480" y="60" width="390" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="675" y="86" fill="#4338ca" font-weight="bold" font-size="14">页面树：三层足够</text>
    <text x="675" y="106" fill="#4b5563" font-size="11">一级：主题（如「订单服务」）</text>
    <text x="675" y="123" fill="#4b5563" font-size="11">二级：类型（方案 / 接口 / 排障 / 会议）</text>
    <text x="675" y="140" fill="#4b5563" font-size="11">三级：具体页面，带日期或版本号</text>
    <text x="675" y="157" fill="#4b5563" font-size="11">超过三层基本是分类方式有问题</text>
    <rect x="480" y="220" width="390" height="180" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="675" y="246" fill="#0f766e" font-weight="bold" font-size="14">模板与宏：让文档自己长成规范</text>
    <text x="675" y="266" fill="#4b5563" font-size="11">技术方案模板：背景 → 目标 → 方案 → 取舍 → 风险</text>
    <text x="675" y="283" fill="#4b5563" font-size="11">接口文档模板：路径 / 参数 / 响应 / 错误码 / 示例</text>
    <text x="675" y="300" fill="#4b5563" font-size="11">状态宏、任务列表宏、代码块宏、目录宏</text>
    <text x="675" y="317" fill="#4b5563" font-size="11">页面属性宏 + 报表宏：自动汇总，不靠人工维护索引</text>
    <path d="M 210 110 L 236 110" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 210 130 L 236 230" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 210 150 L 236 350" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 430 110 L 476 120" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 430 230 L 476 280" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="450" y="402" text-anchor="middle" font-size="13" fill="#475569">知识库最大的敌人不是「没写」，而是「写了找不到」——用模板 + 报表宏代替人工维护目录</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
