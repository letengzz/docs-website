<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">飞书在研发协作中的典型场景</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="74" width="205" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="132" y="100" fill="#1d4ed8" font-weight="bold" font-size="14">沟通</text>
    <text x="132" y="120" fill="#4b5563" font-size="11">群 + 话题串</text>
    <text x="132" y="137" fill="#4b5563" font-size="11">会议纪要自动生成</text>
    <text x="132" y="154" fill="#4b5563" font-size="11">机器人推送构建/告警</text>
    <rect x="248" y="74" width="205" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="100" fill="#047857" font-weight="bold" font-size="14">文档</text>
    <text x="350" y="120" fill="#4b5563" font-size="11">云文档多人实时协作</text>
    <text x="350" y="137" fill="#4b5563" font-size="11">知识库分册管理</text>
    <text x="350" y="154" fill="#4b5563" font-size="11">评论与 @ 待办</text>
    <rect x="466" y="74" width="205" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="568" y="100" fill="#b45309" font-weight="bold" font-size="14">数据</text>
    <text x="568" y="120" fill="#4b5563" font-size="11">多维表格当轻量系统</text>
    <text x="568" y="137" fill="#4b5563" font-size="11">视图 / 分组 / 统计</text>
    <text x="568" y="154" fill="#4b5563" font-size="11">仪表盘与自动化</text>
    <rect x="684" y="74" width="186" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="777" y="100" fill="#6d28d9" font-weight="bold" font-size="14">流程</text>
    <text x="777" y="120" fill="#4b5563" font-size="11">审批与请假</text>
    <text x="777" y="137" fill="#4b5563" font-size="11">发布申请与变更</text>
    <text x="777" y="154" fill="#4b5563" font-size="11">表单自动进表格</text>
    <rect x="120" y="250" width="660" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="276" fill="#4338ca" font-weight="bold" font-size="14">把飞书接进研发链路的三件事</text>
    <text x="450" y="296" fill="#4b5563" font-size="11">① 机器人：CI 结果、告警、发布通知直接推群，不用人肉同步</text>
    <text x="450" y="313" fill="#4b5563" font-size="11">② 云文档：把「技术方案」放同一处，评审在文档内留痕，避免结论散在聊天记录</text>
    <text x="450" y="330" fill="#4b5563" font-size="11">③ 多维表格：值班表、缺陷台账、发布记录用表格维护，视图代替人工筛选</text>
    <text x="450" y="347" fill="#4b5563" font-size="11">注意：聊天记录不是知识库，重要结论必须回写文档</text>
</g>
  <text x="450" y="402" text-anchor="middle" font-size="13" fill="#475569">飞书的价值在于「同一份信息同时服务消息、文档、表格」；用不好就会变成第二个信息孤岛</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
