<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="一个季度四步：先看清，再改一处">
  <title>一个季度四步：先看清，再改一处</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">一个季度四步：先看清，再改一处</text>
  <rect x="45" y="100" width="190" height="150" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="140.0" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">P1 定问题</text>
  <text x="140.0" y="137.0" font-size="9.8" fill="#475569" text-anchor="middle">1 周</text>
  <text x="140.0" y="151.5" font-size="9.8" fill="#475569" text-anchor="middle">一句话问题</text>
  <text x="140.0" y="166.0" font-size="9.8" fill="#475569" text-anchor="middle">主体 + 起止 + 统计量</text>
  <path d="M 235 175 L 253 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="253" y="100" width="190" height="150" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="348.0" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">P2 建管道</text>
  <text x="348.0" y="137.0" font-size="9.8" fill="#475569" text-anchor="middle">1 周</text>
  <text x="348.0" y="151.5" font-size="9.8" fill="#475569" text-anchor="middle">五张表 + 六校验</text>
  <text x="348.0" y="166.0" font-size="9.8" fill="#475569" text-anchor="middle">三条视图</text>
  <path d="M 443 175 L 461 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="461" y="100" width="190" height="150" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="556.0" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">P3 看一个月</text>
  <text x="556.0" y="137.0" font-size="9.8" fill="#475569" text-anchor="middle">4 周</text>
  <text x="556.0" y="151.5" font-size="9.8" fill="#475569" text-anchor="middle">只观察，不设目标</text>
  <text x="556.0" y="166.0" font-size="9.8" fill="#475569" text-anchor="middle">基线报告要「难看」</text>
  <path d="M 651 175 L 669 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="669" y="100" width="190" height="150" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="764.0" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">P4 改一处</text>
  <text x="764.0" y="137.0" font-size="9.8" fill="#475569" text-anchor="middle">4~6 周</text>
  <text x="764.0" y="151.5" font-size="9.8" fill="#475569" text-anchor="middle">一个约束 + 同口径复测</text>
  <text x="764.0" y="166.0" font-size="9.8" fill="#475569" text-anchor="middle">结论含「可分辨」判断</text>
  <path d="M 859 175 L 877 175" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="45" y="285" width="810" height="90" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="307" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">P4 的诚实结论长什么样</text>
  <text x="450.0" y="322.0" font-size="9.8" fill="#475569" text-anchor="middle">假设：批次 20.5 → 8；观测：P50 81.0h(n=900) → 76.5h(n=210)</text>
  <text x="450.0" y="336.5" font-size="9.8" fill="#475569" text-anchor="middle">判断：差异 4.5h 小于区间宽度 9.9h ⇒ 不可分辨；副作用：部署 2.04 → 3.10 次/周</text>
  <rect x="45" y="392" width="810" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="450.0" y="426.8333333333333" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">S1~S10 验收：表齐 → 校验 0 → 口径唯一 → 视图对账 → 分位一致 → 故意弄坏 → 计划 → 他测 → 无红绿灯 → 写结论</text>
</svg>
