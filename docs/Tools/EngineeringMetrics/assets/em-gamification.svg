<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="反指标：三种博弈机制与三个指纹">
  <title>反指标：三种博弈机制与三个指纹</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">反指标：三种博弈机制与三个指纹</text>
  <text x="60" y="68" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">三种博弈机制（都不需要有人说谎）</text>
  <rect x="60" y="84" width="250" height="108" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="185.0" y="106" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">重定义（口径）</text>
  <text x="185.0" y="121.0" font-size="9.8" fill="#475569" text-anchor="middle">起点从 created 改 started</text>
  <text x="185.0" y="135.5" font-size="9.8" fill="#475569" text-anchor="middle">10.6 天 → 2.1 天，5.0×</text>
  <rect x="325" y="84" width="250" height="108" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="106" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">重分配（归因）</text>
  <text x="450.0" y="121.0" font-size="9.8" fill="#475569" text-anchor="middle">线上缺陷改登记为「优化需求」</text>
  <text x="450.0" y="135.5" font-size="9.8" fill="#475569" text-anchor="middle">缺陷率归零，逃逸率上升</text>
  <rect x="590" y="84" width="250" height="108" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="715.0" y="106" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">节奏（时间）</text>
  <text x="715.0" y="121.0" font-size="9.8" fill="#475569" text-anchor="middle">前 3 周攒着，最后 3 天发 5 次</text>
  <text x="715.0" y="135.5" font-size="9.8" fill="#475569" text-anchor="middle">月末集中度 0% → 42.9%</text>
  <text x="60" y="226" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">三个可检测的指纹（都不需要新增埋点）</text>
  <rect x="60" y="242" width="250" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="185.0" y="264" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">批次大小突变</text>
  <text x="185.0" y="279.0" font-size="9.8" fill="#475569" text-anchor="middle">平均 20.5 / 最大 30，月末出现尖峰</text>
  <rect x="325" y="242" width="250" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="450.0" y="264" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">月末集中度</text>
  <text x="450.0" y="279.0" font-size="9.8" fill="#475569" text-anchor="middle">&gt; 35% 说明在冲刺，而不是在持续交付</text>
  <rect x="590" y="242" width="250" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="715.0" y="264" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">重开 / 回滚率</text>
  <text x="715.0" y="279.0" font-size="9.8" fill="#475569" text-anchor="middle">随「完成数」一起上升 = 赶工完成</text>
  <rect x="60" y="356" width="780" height="96" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="378" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">一条检验：「如果我想让这个数变好，但一行代码都不改，我该怎么做？」</text>
  <text x="450.0" y="393.0" font-size="9.8" fill="#475569" text-anchor="middle">有答案的指标 = 反指标；没有答案的指标，才有资格进看板</text>
  <text x="450.0" y="407.5" font-size="9.8" fill="#475569" text-anchor="middle">同一批 8 项工作，把点数乘 1.5：速率 1.21 → 1.81（+50%），交付物一件没变</text>
</svg>
