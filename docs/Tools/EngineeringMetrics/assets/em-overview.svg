<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="一次变更的七个时间点与三个必答问题">
  <title>一次变更的七个时间点与三个必答问题</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">一次变更的七个时间点与三个必答问题</text>
  <path d="M 60 190 L 840 190" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="60" cy="190" r="7" fill="#1d4ed8"/>
  <text x="60" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">需求创建</text>
  <text x="60" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">created</text>
  <circle cx="182" cy="190" r="7" fill="#1d4ed8"/>
  <text x="182" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">就绪评审</text>
  <text x="182" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">ready</text>
  <circle cx="304" cy="190" r="7" fill="#1d4ed8"/>
  <text x="304" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">进入进行中</text>
  <text x="304" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">started</text>
  <circle cx="426" cy="190" r="7" fill="#1d4ed8"/>
  <text x="426" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">首个提交</text>
  <text x="426" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">first_commit</text>
  <circle cx="548" cy="190" r="7" fill="#1d4ed8"/>
  <text x="548" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">合入主干</text>
  <text x="548" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">merged</text>
  <circle cx="670" cy="190" r="7" fill="#1d4ed8"/>
  <text x="670" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">部署生产</text>
  <text x="670" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">deployed</text>
  <circle cx="792" cy="190" r="7" fill="#1d4ed8"/>
  <text x="792" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">故障恢复</text>
  <text x="792" y="214" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="400">fixed</text>
  <path d="M 304 240 L 792 240" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="548" y="232" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">change lead time（DORA 口径）</text>
  <path d="M 182 268 L 792 268" stroke="#b45309" stroke-width="2" marker-end="url(#ar)"/>
  <text x="487" y="260" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="700">cycle time（团队视角）</text>
  <path d="M 60 296 L 792 296" stroke="#be123c" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="426" y="288" font-size="10.5" fill="#be123c" text-anchor="middle" font-weight="700">lead time（业务视角，含全部排队）</text>
  <rect x="60" y="330" width="250" height="76" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="185.0" y="352" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">分子分母是谁？</text>
  <text x="185.0" y="367.0" font-size="9.8" fill="#475569" text-anchor="middle">按部署 7.8%  vs  按变更 8.7%</text>
  <text x="185.0" y="381.5" font-size="9.8" fill="#475569" text-anchor="middle">同一批数据，两种答案</text>
  <rect x="325" y="330" width="250" height="76" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="450.0" y="352" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">聚合用什么？</text>
  <text x="450.0" y="367.0" font-size="9.8" fill="#475569" text-anchor="middle">中位 81.0h · P90 129.0h</text>
  <text x="450.0" y="381.5" font-size="9.8" fill="#475569" text-anchor="middle">均值 86.2h · 最长 377.0h</text>
  <rect x="590" y="330" width="250" height="76" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="715.0" y="352" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">样本多大？</text>
  <text x="715.0" y="367.0" font-size="9.8" fill="#475569" text-anchor="middle">n=18：区间 [6.5, 16.4]</text>
  <text x="715.0" y="381.5" font-size="9.8" fill="#475569" text-anchor="middle">上下差 2.52 倍，不能说变快</text>
  <text x="60" y="440" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">三问答不上来，数字就还不能用。顺序不能换：先分母，再统计量，最后样本量。</text>
</svg>
