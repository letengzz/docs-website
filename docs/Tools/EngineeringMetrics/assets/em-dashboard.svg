<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="看板四块结构：先给结论，再给分布，最后给明细">
  <title>看板四块结构：先给结论，再给分布，最后给明细</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450.0" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">看板四块结构：先给结论，再给分布，最后给明细</text>
  <rect x="50" y="60" width="800" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="450.0" y="95.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">① 结论行：P50 81.0h (n=900, v2)  |  CFR 7.8% (51 次部署)  |  返工率 7.8%</text>
  <rect x="50" y="134" width="390" height="120" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="245.0" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">② 趋势区：12 周中位 + P90</text>
  <text x="245.0" y="171.0" font-size="9.8" fill="#475569" text-anchor="middle">口径变更处画竖线断点</text>
  <text x="245.0" y="185.5" font-size="9.8" fill="#475569" text-anchor="middle">不画均值，不做平滑</text>
  <rect x="460" y="134" width="390" height="120" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="655.0" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">③ 分布区：本周期直方图</text>
  <text x="655.0" y="171.0" font-size="9.8" fill="#475569" text-anchor="middle">标 P50 / P90，保留离群点</text>
  <text x="655.0" y="185.5" font-size="9.8" fill="#475569" text-anchor="middle">不截断 Y 轴</text>
  <rect x="50" y="266" width="800" height="96" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <text x="450.0" y="288" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">④ 明细区：按服务列表（不排序、不排名）</text>
  <text x="450.0" y="303.0" font-size="9.8" fill="#475569" text-anchor="middle">每行带样本量与口径版本，可下钻到具体变更</text>
  <rect x="50" y="374" width="250" height="82" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="175.0" y="396" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">不该出现：红绿灯</text>
  <text x="175.0" y="411.0" font-size="9.8" fill="#475569" text-anchor="middle">自造阈值 → 把黄变绿</text>
  <rect x="318" y="374" width="250" height="82" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="443.0" y="396" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">不该出现：综合分</text>
  <text x="443.0" y="411.0" font-size="9.8" fill="#475569" text-anchor="middle">权重可调 = 结论可生产</text>
  <rect x="586" y="374" width="264" height="82" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="718.0" y="396" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">不该出现：排行榜</text>
  <text x="718.0" y="411.0" font-size="9.8" fill="#475569" text-anchor="middle">系统问题变个体竞争</text>
</svg>
