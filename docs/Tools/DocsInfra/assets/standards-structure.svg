<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <rect width="880" height="560" fill="#FFFFFF"/>
  <text x="440" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E293B">一篇合格技术文档的页面骨架</text>

  <rect x="140" y="80" width="600" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="170" y="112" font-size="15" font-weight="bold" fill="#1D4ED8">H1 · 唯一标题：与侧边栏 text 一致，下方 1~2 句「一句话定位」</text>

  <rect x="140" y="148" width="600" height="52" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="170" y="180" font-size="15" font-weight="bold" fill="#15803D">H2 · 概念与原理：定义 + 英文术语 + 工作机制（复杂处配示意图）</text>

  <rect x="140" y="216" width="600" height="52" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
  <text x="170" y="248" font-size="15" font-weight="bold" fill="#A16207">H2 · 分类 / 属性 / 配置：表格或列表完整罗列，每项带解释</text>

  <rect x="140" y="284" width="600" height="52" rx="8" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="170" y="316" font-size="15" font-weight="bold" fill="#BE185D">H2 · 示例代码：标注语言与文件路径，可复制可运行，给运行输出</text>

  <rect x="140" y="352" width="600" height="52" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="170" y="384" font-size="15" font-weight="bold" fill="#B91C1C">H2 · 易错点与最佳实践：danger 列坑给正确写法，tip 给建议</text>

  <rect x="140" y="420" width="600" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="170" y="452" font-size="15" font-weight="bold" fill="#475569">H2 · 验证方式：命令 + 预期输出 + 页面地址（可验证的收尾）</text>

  <rect x="140" y="488" width="600" height="52" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="170" y="520" font-size="15" font-weight="bold" fill="#64748B">H2 · 参考资料：官方文档与权威链接（文末固定收尾）</text>
</svg>
