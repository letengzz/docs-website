<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" width="760" height="442" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="442" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">功能开关：四类开关、五态生命周期与三处坑</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 FF-A~FF-H；开关是「减少发布风险」的工具，不是「免于设计」的借口</text>
  <rect x="22" y="88" width="176" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">release 发布开关</text>
  <text x="110" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">新代码默认关</text>
  <text x="110" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">出事一键关</text>
  <rect x="210" y="88" width="176" height="82" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="298" y="106.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">experiment 实验开关</text>
  <text x="298" y="123" text-anchor="middle" font-size="7.5" fill="#4338CA">按桶分流</text>
  <text x="298" y="140.25" text-anchor="middle" font-size="7.5" fill="#4338CA">有明确结束日</text>
  <rect x="398" y="88" width="176" height="82" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="486" y="106.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">ops 运维开关</text>
  <text x="486" y="123" text-anchor="middle" font-size="7.5" fill="#B91C1C">降级 / 限流 / 只读</text>
  <text x="486" y="140.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">长期存在</text>
  <rect x="586" y="88" width="152" height="82" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="662" y="106.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">permission 权限位</text>
  <text x="662" y="123" text-anchor="middle" font-size="7.5" fill="#334155">不是开关</text>
  <text x="662" y="140.25" text-anchor="middle" font-size="7.5" fill="#334155">别混用</text>
  <line x1="22" y1="196" x2="738" y2="196" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="22" y="210" width="226" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="135" y="228.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">生命周期五态</text>
  <text x="135" y="245" text-anchor="middle" font-size="7.5" fill="#047857">建 → 开 → 全量 → 清理 → 删除</text>
  <text x="135" y="262.25" text-anchor="middle" font-size="7.5" fill="#047857"></text>
  <text x="135" y="279.5" text-anchor="middle" font-size="7.5" fill="#047857">超期未清理 = 开关债</text>
  <rect x="266" y="210" width="226" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="379" y="228.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">每条开关必写四行</text>
  <text x="379" y="245" text-anchor="middle" font-size="7.5" fill="#B45309">谁开、开给谁、何时关、怎么删</text>
  <text x="379" y="262.25" text-anchor="middle" font-size="7.5" fill="#B45309"></text>
  <text x="379" y="279.5" text-anchor="middle" font-size="7.5" fill="#B45309">写不进四行的开关不许合</text>
  <rect x="510" y="210" width="228" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="624" y="228.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">开关债的三个征兆</text>
  <text x="624" y="245" text-anchor="middle" font-size="7.5" fill="#6D28D9">分支数 &gt; 版本数</text>
  <text x="624" y="262.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">没人知道某个开关还开着</text>
  <text x="624" y="279.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">删掉后无人能判断影响</text>
  <rect x="22" y="328" width="716" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="346.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">三处最容易出事的写法</text>
  <text x="380" y="363" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 开关读在循环内（每行都查一次配置中心）→ 每请求读一次并缓存</text>
  <text x="380" y="380.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 开关值进了缓存 key 却没进失效条件 → 关了还生效</text>
  <text x="380" y="397.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 前后端各判一次同一开关 → 前端显示可用、后端返回 403</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
