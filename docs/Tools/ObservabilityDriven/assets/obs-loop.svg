<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" width="760" height="468" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="468" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">反馈闭环：一周六步与指标腐化的四个征兆</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 FL-A~FL-H；没有「删」这一步的闭环，一年后必然堆成没人看的看板墙</text>
  <rect x="24" y="88" width="168" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="108" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">周一 看数据</text>
  <text x="108" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">上周新增指标</text>
  <text x="108" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">哪条没人看过</text>
  <rect x="206" y="88" width="168" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="290" y="106.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">周二 定假设</text>
  <text x="290" y="123" text-anchor="middle" font-size="7.5" fill="#4338CA">哪个指标该动</text>
  <text x="290" y="140.25" text-anchor="middle" font-size="7.5" fill="#4338CA">为什么是它</text>
  <rect x="388" y="88" width="168" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="472" y="106.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">周三 埋点</text>
  <text x="472" y="123" text-anchor="middle" font-size="7.5" fill="#0F766E">补口径 / 补维度</text>
  <text x="472" y="140.25" text-anchor="middle" font-size="7.5" fill="#0F766E">写进门禁</text>
  <rect x="570" y="88" width="168" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="654" y="106.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">周四 放量</text>
  <text x="654" y="123" text-anchor="middle" font-size="7.5" fill="#B45309">开关 + 灰度</text>
  <text x="654" y="140.25" text-anchor="middle" font-size="7.5" fill="#B45309">护栏常开</text>
  <rect x="206" y="200" width="168" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="290" y="218.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">周五 收口</text>
  <text x="290" y="235" text-anchor="middle" font-size="7.5" fill="#047857">读数写进当日文档</text>
  <text x="290" y="252.25" text-anchor="middle" font-size="7.5" fill="#047857">欠账登记</text>
  <rect x="388" y="200" width="168" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="472" y="218.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">下周一 再评估</text>
  <text x="472" y="235" text-anchor="middle" font-size="7.5" fill="#6D28D9">无效则删埋点</text>
  <text x="472" y="252.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">有效则提阈值</text>
  <rect x="24" y="316" width="340" height="110" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="194" y="334.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">指标腐化的四个征兆</text>
  <text x="194" y="351" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 建了半年没人看过</text>
  <text x="194" y="368.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 名字与实际口径不符</text>
  <text x="194" y="385.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 依赖的字段已不再写入</text>
  <text x="194" y="402.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">④ 报警阈值还是上线时的值</text>
  <rect x="392" y="316" width="346" height="110" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="565" y="334.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">每月一次的三件事</text>
  <text x="565" y="351" text-anchor="middle" font-size="7.5" fill="#334155">删：零查询的指标与看板</text>
  <text x="565" y="368.25" text-anchor="middle" font-size="7.5" fill="#334155">核：口径与代码常量对一遍</text>
  <text x="565" y="385.5" text-anchor="middle" font-size="7.5" fill="#334155">补：事故里「想看但没有」的那一项</text>
  <text x="380" y="452" text-anchor="middle" font-size="9" fill="#334155">闭环的判据不是「有周会」，是「上周的读数改变了本周的代码或阈值」</text>
  <line x1="194" y1="130" x2="204" y2="130" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="130" x2="386" y2="130" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="558" y1="130" x2="568" y2="130" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="652" y1="174" x2="652" y2="240" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="652" y1="240" x2="558" y2="240" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="242" x2="292" y2="242" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="290" y1="286" x2="290" y2="314" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
