<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">观测驱动开发：九章与各自的判据族</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">共 72 条判据；每章开头写明「本页不讲什么」，与 Ops/Observability 分工</text>
  <rect x="24" y="88" width="226" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="137" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">01 总览</text>
  <text x="137" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">三个反转 / 四类信号</text>
  <text x="137" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">判据 OD-A~OD-H</text>
  <rect x="268" y="88" width="226" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="381" y="106.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">02 指标先行</text>
  <text x="381" y="123" text-anchor="middle" font-size="7.5" fill="#4338CA">SLI 三选 / 口径四条</text>
  <text x="381" y="140.25" text-anchor="middle" font-size="7.5" fill="#4338CA">判据 MF-A~MF-H</text>
  <rect x="512" y="88" width="226" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="625" y="106.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">03 埋点规范</text>
  <text x="625" y="123" text-anchor="middle" font-size="7.5" fill="#0F766E">一处一义 / 基数控制</text>
  <text x="625" y="140.25" text-anchor="middle" font-size="7.5" fill="#0F766E">判据 IM-A~IM-H</text>
  <rect x="24" y="190" width="226" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="137" y="208.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">04 功能开关</text>
  <text x="137" y="225" text-anchor="middle" font-size="7.5" fill="#047857">四类开关 / 生命周期</text>
  <text x="137" y="242.25" text-anchor="middle" font-size="7.5" fill="#047857">判据 FF-A~FF-H</text>
  <rect x="268" y="190" width="226" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="208.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">05 灰度度量</text>
  <text x="381" y="225" text-anchor="middle" font-size="7.5" fill="#B45309">分流口径 / 护栏指标</text>
  <text x="381" y="242.25" text-anchor="middle" font-size="7.5" fill="#B45309">判据 GM-A~GM-H</text>
  <rect x="512" y="190" width="226" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="625" y="208.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">06 实验分桶</text>
  <text x="625" y="225" text-anchor="middle" font-size="7.5" fill="#6D28D9">假设 / 显著性陷阱</text>
  <text x="625" y="242.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">判据 EX-A~EX-H</text>
  <rect x="24" y="292" width="226" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="137" y="310.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">07 告警设计</text>
  <text x="137" y="327" text-anchor="middle" font-size="7.5" fill="#B91C1C">症状优于原因 / 配额</text>
  <text x="137" y="344.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">判据 AD-A~AD-H</text>
  <rect x="268" y="292" width="226" height="76" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="381" y="310.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">08 反馈闭环</text>
  <text x="381" y="327" text-anchor="middle" font-size="7.5" fill="#334155">每周节奏 / 指标腐化</text>
  <text x="381" y="344.25" text-anchor="middle" font-size="7.5" fill="#334155">判据 FL-A~FL-H</text>
  <rect x="512" y="292" width="226" height="76" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="625" y="310.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">09 常见问题</text>
  <text x="625" y="327" text-anchor="middle" font-size="7.5" fill="#0E7490">分诊树 / 五类症状</text>
  <text x="625" y="344.25" text-anchor="middle" font-size="7.5" fill="#0E7490">判据 ODF-A~ODF-H</text>
  <line x1="250" y1="126" x2="266" y2="126" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="494" y1="126" x2="510" y2="126" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="250" y1="228" x2="266" y2="228" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="494" y1="228" x2="510" y2="228" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="137" y1="164" x2="137" y2="188" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="381" y1="164" x2="381" y2="188" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="625" y1="164" x2="625" y2="188" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="137" y1="266" x2="137" y2="290" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="381" y1="266" x2="381" y2="290" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="625" y1="266" x2="625" y2="290" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="396" text-anchor="middle" font-size="9" fill="#334155">九章一条主线：先决定看什么 → 再决定怎么记 → 再决定怎么放量与收量</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
