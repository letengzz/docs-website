<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="448" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">常见问题分诊：五类症状与通用第一步</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 ODF-A~ODF-H；分诊顺序永远是「有数据 → 数据对 → 为什么」</text>
  <rect x="20" y="86" width="246" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="104.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">症状 A：数字对不上</text>
  <text x="143" y="121" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先查分母（谁算进来了）</text>
  <text x="143" y="138.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">再查采样（有没有丢）</text>
  <text x="143" y="155.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">最后查时区与窗口对齐</text>
  <rect x="286" y="86" width="246" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="409" y="104.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">症状 B：看板为空白</text>
  <text x="409" y="121" text-anchor="middle" font-size="7.5" fill="#4338CA">查标签过滤（高基数被丢）</text>
  <text x="409" y="138.25" text-anchor="middle" font-size="7.5" fill="#4338CA">查时间范围（跨了保留期）</text>
  <text x="409" y="155.5" text-anchor="middle" font-size="7.5" fill="#4338CA">查服务是否上报（版本差异）</text>
  <rect x="552" y="86" width="188" height="110" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="646" y="104.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">症状 C：告警风暴</text>
  <text x="646" y="121" text-anchor="middle" font-size="7.5" fill="#B91C1C">先抑制（同源合并）</text>
  <text x="646" y="138.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">再降级（改症状）</text>
  <text x="646" y="155.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">最后删（无处置卡的）</text>
  <rect x="20" y="216" width="246" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="143" y="234.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">症状 D：开关不生效</text>
  <text x="143" y="251" text-anchor="middle" font-size="7.5" fill="#B45309">查缓存 key 是否含开关值</text>
  <text x="143" y="268.25" text-anchor="middle" font-size="7.5" fill="#B45309">查读取点是否在启动时固化</text>
  <text x="143" y="285.5" text-anchor="middle" font-size="7.5" fill="#B45309">查前后端是否各判一次</text>
  <rect x="286" y="216" width="246" height="110" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="409" y="234.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">症状 E：追踪断链</text>
  <text x="409" y="251" text-anchor="middle" font-size="7.5" fill="#0F766E">查跨进程传播（消息/异步）</text>
  <text x="409" y="268.25" text-anchor="middle" font-size="7.5" fill="#0F766E">查采样是否父子不一致</text>
  <text x="409" y="285.5" text-anchor="middle" font-size="7.5" fill="#0F766E">查网关是否重造 trace</text>
  <rect x="552" y="216" width="188" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="646" y="234.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">通用第一步</text>
  <text x="646" y="251" text-anchor="middle" font-size="7.5" fill="#047857">先确认「有没有数据」</text>
  <text x="646" y="268.25" text-anchor="middle" font-size="7.5" fill="#047857">再确认「数据对不对」</text>
  <text x="646" y="285.5" text-anchor="middle" font-size="7.5" fill="#047857">最后才问「为什么」</text>
  <rect x="20" y="346" width="720" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="364.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">本章不回答的问题（各自归口）</text>
  <text x="380" y="381" text-anchor="middle" font-size="7.5" fill="#334155">Prometheus 查询语法 → Ops/Monitoring/Prometheus；OpenTelemetry 接入 → Ops/Observability/OpenTelemetry</text>
  <text x="380" y="398.25" text-anchor="middle" font-size="7.5" fill="#334155">采样算法细节 → Ops/Observability/Sampling；事故处置流程 → Ops/IncidentResponse</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
