<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="450" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实验分桶：三步与四个显著性陷阱</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 EX-A~EX-H；最贵的错误不是「结论错」，是「用错结论改了产品」</text>
  <rect x="26" y="90" width="224" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="138" y="108.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 假设可证伪</text>
  <text x="138" y="125" text-anchor="middle" font-size="7.5" fill="#1D4ED8">「改动后 7 日内下单转化率 +2%」</text>
  <text x="138" y="142.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不是「改得更好用」</text>
  <rect x="268" y="90" width="224" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="108.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 分桶要确定</text>
  <text x="380" y="125" text-anchor="middle" font-size="7.5" fill="#4338CA">hash(exp_id + user_id) 取模</text>
  <text x="380" y="142.25" text-anchor="middle" font-size="7.5" fill="#4338CA">同一用户永远同桶</text>
  <rect x="512" y="90" width="222" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="623" y="108.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 只改一个变量</text>
  <text x="623" y="125" text-anchor="middle" font-size="7.5" fill="#0F766E">同时改三处 → 归因失败</text>
  <text x="623" y="142.25" text-anchor="middle" font-size="7.5" fill="#0F766E">必要时做分层实验</text>
  <rect x="26" y="206" width="340" height="128" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="196" y="224.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">显著性四个陷阱</text>
  <text x="196" y="241" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 偷看：每天都在看到显著就停 → 假阳性翻倍</text>
  <text x="196" y="258.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 样本不足：千级样本宣称 +0.3% 显著</text>
  <text x="196" y="275.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 多重比较：同时测 10 个指标，总有一个显著</text>
  <text x="196" y="292.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">④ 幸存者偏差：只报赢的那次</text>
  <rect x="394" y="206" width="340" height="128" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="564" y="224.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">四条纪律</text>
  <text x="564" y="241" text-anchor="middle" font-size="7.5" fill="#047857">先定样本量与时长，再开始</text>
  <text x="564" y="258.25" text-anchor="middle" font-size="7.5" fill="#047857">到点再看，中途只看护栏</text>
  <text x="564" y="275.5" text-anchor="middle" font-size="7.5" fill="#047857">主指标只留一个，其余当护栏</text>
  <text x="564" y="292.75" text-anchor="middle" font-size="7.5" fill="#047857">失败实验也要留档（知道什么无效）</text>
  <rect x="26" y="354" width="708" height="80" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="372.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">与本专题其他章的接口</text>
  <text x="380" y="389" text-anchor="middle" font-size="7.5" fill="#334155">分桶口径归这里；承载分桶的是「功能开关」，度量的是「灰度度量」，告警的是「告警设计」</text>
  <text x="380" y="406.25" text-anchor="middle" font-size="7.5" fill="#334155">四章共用同一份「实验与开关清单」，否则会出现「开关开着但实验已结束」</text>
  <line x1="200" y1="134" x2="266" y2="134" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="442" y1="134" x2="510" y2="134" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
