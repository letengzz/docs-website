<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="450" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">埋点规范：三处埋点、一处一义与基数控制</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 IM-A~IM-H；最常见的坏味道是「同一个动作在前后端各记一次」</text>
  <rect x="26" y="90" width="224" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="138" y="108.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">三处埋点</text>
  <text x="138" y="125" text-anchor="middle" font-size="7.5" fill="#1D4ED8">服务端：业务结果（唯一可信源）</text>
  <text x="138" y="142.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">客户端：交互意图（用户点了什么）</text>
  <text x="138" y="159.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">网关/边车：流量事实（不计业务）</text>
  <rect x="268" y="90" width="224" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="108.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">一处一义</text>
  <text x="380" y="125" text-anchor="middle" font-size="7.5" fill="#4338CA">同一件事只在一层记一次</text>
  <text x="380" y="142.25" text-anchor="middle" font-size="7.5" fill="#4338CA">两层都记 → 两套数字 → 互相对不上</text>
  <rect x="512" y="90" width="222" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="623" y="108.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">命名三段式</text>
  <text x="623" y="125" text-anchor="middle" font-size="7.5" fill="#0F766E">对象_动作_结果</text>
  <text x="623" y="142.25" text-anchor="middle" font-size="7.5" fill="#0F766E">card_move_success / fail</text>
  <text x="623" y="159.5" text-anchor="middle" font-size="7.5" fill="#0F766E">不用驼峰、不用缩写</text>
  <rect x="26" y="212" width="340" height="140" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="196" y="230.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">基数爆炸：一个字段毁掉一个后端</text>
  <text x="196" y="247" text-anchor="middle" font-size="7.5" fill="#B91C1C">user_id 进标签 → 千万级时间序列</text>
  <text x="196" y="264.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">board_id 进标签 → 十万级</text>
  <text x="196" y="281.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">url 带 id → 无限级</text>
  <text x="196" y="298.75" text-anchor="middle" font-size="7.5" fill="#B91C1C"></text>
  <text x="196" y="316" text-anchor="middle" font-size="7.5" fill="#B91C1C">口径：标签只放「取值可枚举且 &lt; 100」的维度</text>
  <text x="196" y="333.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">高基数维度放日志或追踪，不放指标</text>
  <rect x="394" y="212" width="340" height="140" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="564" y="230.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">四个必带字段</text>
  <text x="564" y="247" text-anchor="middle" font-size="7.5" fill="#047857">trace_id：能把三层串起来</text>
  <text x="564" y="264.25" text-anchor="middle" font-size="7.5" fill="#047857">tenant_id：能按租户切</text>
  <text x="564" y="281.5" text-anchor="middle" font-size="7.5" fill="#047857">app_version / flag 快照：能解释「为什么只有这批人」</text>
  <text x="564" y="298.75" text-anchor="middle" font-size="7.5" fill="#047857"></text>
  <text x="564" y="316" text-anchor="middle" font-size="7.5" fill="#047857">缺 trace_id 的埋点等于孤立数字</text>
  <text x="564" y="333.25" text-anchor="middle" font-size="7.5" fill="#047857">缺版本快照的埋点在灰度期无解</text>
  <rect x="26" y="374" width="708" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="392.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">采样：先保错、再保慢、最后按比例采样成功</text>
  <text x="380" y="409" text-anchor="middle" font-size="7.5" fill="#B45309">错误与超时全留，成功按 1%~10% 采；反过来会导致「事故期间没有样本」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
