<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">指标先行：四步、四种口径与四个必写项</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 MF-A~MF-H；核心是「先定分母」——分母一变，结论全变</text>
  <rect x="26" y="90" width="172" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="112" y="108.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 选 SLI</text>
  <text x="112" y="125" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可用性 / 延迟 / 正确性</text>
  <text x="112" y="142.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">每类只选一个主指标</text>
  <rect x="222" y="90" width="172" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="308" y="108.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 定口径</text>
  <text x="308" y="125" text-anchor="middle" font-size="7.5" fill="#4338CA">分子分母写死</text>
  <text x="308" y="142.25" text-anchor="middle" font-size="7.5" fill="#4338CA">窗口与百分位写死</text>
  <rect x="418" y="90" width="160" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="498" y="108.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 定阈值</text>
  <text x="498" y="125" text-anchor="middle" font-size="7.5" fill="#0F766E">从历史分位取值</text>
  <text x="498" y="142.25" text-anchor="middle" font-size="7.5" fill="#0F766E">不从愿望取值</text>
  <rect x="602" y="90" width="132" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="668" y="108.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">④ 进门禁</text>
  <text x="668" y="125" text-anchor="middle" font-size="7.5" fill="#B45309">不达标不合并</text>
  <rect x="26" y="208" width="340" height="118" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="196" y="226.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">同一个「可用性」的四种口径</text>
  <text x="196" y="243" text-anchor="middle" font-size="7.5" fill="#B91C1C">分母 = 全部请求 ／ 排除 4xx 客户端错误</text>
  <text x="196" y="260.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">分子 = 2xx ／ 2xx+3xx ／ 非 5xx</text>
  <text x="196" y="277.5" text-anchor="middle" font-size="7.5" fill="#B91C1C"></text>
  <text x="196" y="294.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">口径不同 → 数字不可比 → 事故时互相不信</text>
  <text x="196" y="312" text-anchor="middle" font-size="7.5" fill="#B91C1C">所以：口径写进代码常量，不写进文档</text>
  <rect x="394" y="208" width="340" height="118" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="564" y="226.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">延迟为什么必看 P99 而不是均值</text>
  <text x="564" y="243" text-anchor="middle" font-size="7.5" fill="#6D28D9">均值被长尾掩盖：1000 次里 10 次 5 s，均值只多 49 ms</text>
  <text x="564" y="260.25" text-anchor="middle" font-size="7.5" fill="#6D28D9"></text>
  <text x="564" y="277.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">P99 = 每 100 次里最慢的 1 次</text>
  <text x="564" y="294.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">用户记住的正是那一次</text>
  <rect x="26" y="356" width="708" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="374.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">四个必写项：指标名 / 口径公式 / 数据来源 / 谁在什么时候看</text>
  <text x="380" y="391" text-anchor="middle" font-size="7.5" fill="#334155">缺任何一项，这个指标在三个月后一定会被重新解释一遍，而两次解释不会一致</text>
  <line x1="200" y1="129" x2="220" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="396" y1="129" x2="416" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="129" x2="600" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
