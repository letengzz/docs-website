<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pm-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e56a1f"/>
    </marker>
  </defs>
  <style>
    .req { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .env { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .col { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .run { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #e56a1f; stroke-width: 1.4; }
  </style>

  <rect class="req" x="35" y="55" width="175" height="70"/>
  <text x="122" y="83">构造请求</text>
  <text class="small" x="122" y="102">Method / URL / Headers / Body</text>

  <rect class="env" x="245" y="55" width="175" height="70"/>
  <text x="332" y="83">环境变量</text>
  <text class="small" x="332" y="102">{{baseUrl}} / 动态取值</text>

  <rect class="col" x="455" y="55" width="175" height="70"/>
  <text x="542" y="83">集合管理</text>
  <text class="small" x="542" y="102">分组 / 脚本 / 文档</text>

  <rect class="run" x="665" y="55" width="160" height="70"/>
  <text x="745" y="83">运行与监控</text>
  <text class="small" x="745" y="102">Runner / 定时 / CI</text>

  <line x1="210" y1="90" x2="245" y2="90" marker-end="url(#pm-arrow)"/>
  <line x1="420" y1="90" x2="455" y2="90" marker-end="url(#pm-arrow)"/>
  <line x1="630" y1="90" x2="665" y2="90" marker-end="url(#pm-arrow)"/>

  <rect class="env" x="245" y="200" width="385" height="60"/>
  <text x="437" y="228">脚本：Pre-request + Tests（断言 / 提取 token）</text>
  <text class="small" x="437" y="246">v12 新 UI：Git 原生、AI 辅助、云同步</text>

  <line x1="745" y1="125" x2="745" y2="168" stroke="#e56a1f" stroke-dasharray="5 4"/>
  <line x1="745" y1="168" x2="630" y2="200" marker-end="url(#pm-arrow)"/>

  <text class="small" x="430" y="305">支持：REST / GraphQL / gRPC / WebSocket / SOAP</text>
  <text class="small" x="430" y="325">版本现状：Postman v12.20.1（2026-08 核对）</text>
</svg>
