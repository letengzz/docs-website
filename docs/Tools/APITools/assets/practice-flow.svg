<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e56a1f"/>
    </marker>
  </defs>
  <style>
    .design { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .debug { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .test { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .ci { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #e56a1f; stroke-width: 1.4; }
  </style>

  <rect class="design" x="35" y="55" width="160" height="70"/>
  <text x="115" y="83">接口定义</text>
  <text class="small" x="115" y="102">OpenAPI / 团队评审</text>

  <rect class="debug" x="230" y="55" width="160" height="70"/>
  <text x="310" y="83">调试联调</text>
  <text class="small" x="310" y="102">环境变量 + 断言</text>

  <rect class="test" x="425" y="55" width="160" height="70"/>
  <text x="505" y="83">自动化用例</text>
  <text class="small" x="505" y="102">集合 + 数据文件</text>

  <rect class="ci" x="620" y="55" width="205" height="70"/>
  <text x="722" y="83">CI 回归</text>
  <text class="small" x="722" y="102">提交即跑 + 报告</text>

  <line x1="195" y1="90" x2="230" y2="90" marker-end="url(#pc-arrow)"/>
  <line x1="390" y1="90" x2="425" y2="90" marker-end="url(#pc-arrow)"/>
  <line x1="585" y1="90" x2="620" y2="90" marker-end="url(#pc-arrow)"/>

  <rect class="ci" x="230" y="200" width="430" height="60"/>
  <text x="445" y="228">闭环：定义 → 调试 → 用例 → 回归 → 交付</text>
  <text class="small" x="445" y="246">接口文档随代码更新，回归报告进团队看板</text>
</svg>
