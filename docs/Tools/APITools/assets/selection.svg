<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sel-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e56a1f"/>
    </marker>
  </defs>
  <style>
    .post { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .api { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .other { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #e56a1f; stroke-width: 1.4; }
  </style>

  <rect class="post" x="35" y="50" width="230" height="76"/>
  <text x="150" y="80">Postman v12</text>
  <text class="small" x="150" y="100">生态成熟 · 云同步 · 团队协作</text>

  <rect class="api" x="315" y="50" width="230" height="76"/>
  <text x="430" y="80">Apifox 2.8</text>
  <text class="small" x="430" y="100">接口设计+调试+Mock+文档一体</text>

  <rect class="other" x="595" y="50" width="230" height="76"/>
  <text x="710" y="80">curl / 浏览器 / IDE 插件</text>
  <text class="small" x="710" y="100">轻量补充 · 不依赖客户端</text>

  <rect class="api" x="180" y="190" width="500" height="66"/>
  <text x="430" y="218">选型依据：团队协作、接口生命周期、预算与部署形态</text>
  <text class="small" x="430" y="238">重视文档与 Mock → Apifox；全球化团队与生态 → Postman</text>

  <line x1="150" y1="126" x2="280" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="430" y1="126" x2="430" y2="190" marker-end="url(#sel-arrow)"/>
  <line x1="710" y1="126" x2="580" y2="190" marker-end="url(#sel-arrow)"/>

  <text class="small" x="430" y="300">共同能力：请求调试 / 环境变量 / 脚本断言 / Mock / 自动化 / 文档生成</text>
  <text class="small" x="430" y="320">版本现状：Postman 12.20 · Apifox 2.8（2026-08 核对）</text>
</svg>
