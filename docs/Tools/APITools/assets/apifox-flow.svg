<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .design { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .debug { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .mock { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .doc { fill: #f6eefb; stroke: #8b5cc7; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="design" x="35" y="55" width="165" height="70"/>
  <text x="117" y="83">接口设计</text>
  <text class="small" x="117" y="102">OpenAPI 3.x 定义</text>

  <rect class="debug" x="235" y="55" width="165" height="70"/>
  <text x="317" y="83">调试</text>
  <text class="small" x="317" y="102">一键发请求</text>

  <rect class="mock" x="435" y="55" width="165" height="70"/>
  <text x="517" y="83">Mock</text>
  <text class="small" x="517" y="102">智能 Mock 数据</text>

  <rect class="doc" x="635" y="55" width="190" height="70"/>
  <text x="730" y="83">文档与测试</text>
  <text class="small" x="730" y="102">自动生成 / 用例管理</text>

  <line x1="200" y1="90" x2="235" y2="90" marker-end="url(#af-arrow)"/>
  <line x1="400" y1="90" x2="435" y2="90" marker-end="url(#af-arrow)"/>
  <line x1="600" y1="90" x2="635" y2="90" marker-end="url(#af-arrow)"/>

  <rect class="doc" x="235" y="200" width="385" height="60"/>
  <text x="427" y="228">一体化：设计→调试→Mock→文档→测试同一数据源</text>
  <text class="small" x="427" y="246">Apifox CLI：接口测试接入 CI，支持 OAuth2 自动刷新</text>

  <line x1="730" y1="125" x2="730" y2="168" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="730" y1="168" x2="620" y2="200" marker-end="url(#af-arrow)"/>

  <text class="small" x="430" y="305">导入：OpenAPI / Swagger / Postman Collection</text>
  <text class="small" x="430" y="325">版本现状：Apifox 2.8.x（2026-08 核对）</text>
</svg>
