<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="tc-practice-roadmap.svg">
  <title>实战路线：六步走，但第 0 步不走寻常路</title>
  <rect x="0" y="0" width="900" height="570" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">实战路线：三步工具 + 两处流程 + 一个收口</text>

  <rect x="32" y="92" width="836" height="96" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3730a3">第 0 步 · 先做验证命令，而不是先做脚手架</text>
  <text x="48" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#334155">这一句反直觉，但它有账可算：脚手架每次只帮 1 个人省 10 分钟，而验证命令在 CI 里</text>
  <text x="48" y="164" font-family="system-ui, sans-serif" font-size="11" fill="#334155">每次改动都跑 —— N 比「人数」大两个数量级，回报先到的是后者。</text>
  <text x="48" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#334155">更实际的理由：验证命令是脚手架自己的验收手段；没有它，做出来的脚手架没人敢用。</text>

  <rect x="32" y="210" width="410" height="76" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">第 1 步 · acme verify</text>
  <text x="46" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#334155">一条命令跑完所有检查；只读、可随时跑、能进 CI。</text>
  <text x="46" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#334155">退出码是唯一结论：0 通过、1 有问题、4 环境不对。</text>

  <rect x="458" y="210" width="410" height="76" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="472" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">第 2 步 · acme gen api</text>
  <text x="472" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#334155">只新增带 .generated. 的文件，绝不改手写代码。</text>
  <text x="472" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#334155">第二步就跑两遍：第二遍必须什么都不做并返回 0。</text>

  <rect x="32" y="298" width="410" height="76" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="320" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">第 3 步 · acme create service</text>
  <text x="46" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#334155">生成一个完整服务：代码、测试、CI、文档骨架、README。</text>
  <text x="46" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#334155">生成完立刻跑一次 verify —— 新项目起点必须是绿的。</text>

  <rect x="458" y="298" width="410" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="320" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">第 4 步 · 发到内部 registry</text>
  <text x="472" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#334155">让「装上」不再依赖任何人的本机操作与记忆。</text>
  <text x="472" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#334155">发版走 CI；README 里必须写清「装哪一版、怎么升级」。</text>

  <rect x="32" y="386" width="410" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="46" y="408" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">第 5 步 · 最小平台化</text>
  <text x="46" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155">只给一个动作做门户：被非工程师呼叫最多的那一个。</text>
  <text x="46" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不建通用平台 —— 通用平台是结果，不是起点。</text>

  <rect x="458" y="386" width="410" height="76" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="472" y="408" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">第 6 步 · 写下退役条件</text>
  <text x="472" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155">owner 是谁、出事找谁、什么条件下允许下线 —— 写进文档。</text>
  <text x="472" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不写这一条，第 1 步做出的东西三年后就是遗留系统。</text>

  <rect x="32" y="482" width="836" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="506" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：每一步做完，都要能被上一步验证；任何一步的产出如果「下一个人没法自己跑」，</text>
  <text x="48" y="528" font-family="system-ui, sans-serif" font-size="11" fill="#334155">就停下来补齐，不要往前推 —— 往前推只会让后面每一步都建在别人的记忆上。</text>
</svg>
