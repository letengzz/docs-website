<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="tc-codegen-levels.svg">
  <title>代码生成的三档：文本模板 → 结构改写 → 契约驱动</title>
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">代码生成的三档：往已有的代码里加东西，比从零生成难得多</text>

  <rect x="32" y="92" width="258" height="44" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="114" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">一档 · 文本模板</text>
  <text x="46" y="129" font-family="system-ui, sans-serif" font-size="10" fill="#334155">整段替换，不解析</text>

  <rect x="320" y="92" width="258" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="334" y="114" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">二档 · 结构改写</text>
  <text x="334" y="129" font-family="system-ui, sans-serif" font-size="10" fill="#334155">解析成 AST，改完写回</text>

  <rect x="608" y="92" width="258" height="44" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="622" y="114" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">三档 · 契约驱动</text>
  <text x="622" y="129" font-family="system-ui, sans-serif" font-size="10" fill="#334155">契约是唯一事实来源</text>

  <rect x="32" y="136" width="258" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="164" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">做法</text>
  <text x="46" y="179" font-family="system-ui, sans-serif" font-size="10" fill="#334155">读模板字符串，整段替换</text>
  <text x="46" y="206" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">能改</text>
  <text x="46" y="221" font-family="system-ui, sans-serif" font-size="10" fill="#334155">新建文件、整块插入</text>
  <text x="46" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">不能改</text>
  <text x="46" y="263" font-family="system-ui, sans-serif" font-size="10" fill="#334155">已有文件里的局部字段</text>
  <text x="46" y="290" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">代价</text>
  <text x="46" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#334155">低 —— 一个函数就能写完</text>
  <text x="46" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">失效</text>
  <text x="46" y="347" font-family="system-ui, sans-serif" font-size="10" fill="#334155">周边格式被重排后匹配不上</text>

  <rect x="320" y="136" width="258" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="334" y="164" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">做法</text>
  <text x="334" y="179" font-family="system-ui, sans-serif" font-size="10" fill="#334155">解析成结构 → 定位 → 改 → 写回</text>
  <text x="334" y="206" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">能改</text>
  <text x="334" y="221" font-family="system-ui, sans-serif" font-size="10" fill="#334155">局部字段、方法签名、导入</text>
  <text x="334" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">不能改</text>
  <text x="334" y="263" font-family="system-ui, sans-serif" font-size="10" fill="#334155">需要跨文件理解的语义</text>
  <text x="334" y="290" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">代价</text>
  <text x="334" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#334155">中 —— 要跟上语法版本</text>
  <text x="334" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">失效</text>
  <text x="334" y="347" font-family="system-ui, sans-serif" font-size="10" fill="#334155">格式化、注释、语法演进</text>

  <rect x="608" y="136" width="258" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="622" y="164" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">做法</text>
  <text x="622" y="179" font-family="system-ui, sans-serif" font-size="10" fill="#334155">从 IDL / schema / OpenAPI 生成</text>
  <text x="622" y="206" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">能改</text>
  <text x="622" y="221" font-family="system-ui, sans-serif" font-size="10" fill="#334155">所有有契约来源的部分</text>
  <text x="622" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">不能改</text>
  <text x="622" y="263" font-family="system-ui, sans-serif" font-size="10" fill="#334155">契约表达不了的意图</text>
  <text x="622" y="290" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">代价</text>
  <text x="622" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#334155">高 —— 先修契约，再生成</text>
  <text x="622" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">失效</text>
  <text x="622" y="347" font-family="system-ui, sans-serif" font-size="10" fill="#334155">契约与实际实现脱节</text>

  <rect x="32" y="382" width="834" height="112" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="408" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">推荐的默认做法：不去定位，让自己拥有一整块文件</text>
  <text x="48" y="432" font-family="system-ui, sans-serif" font-size="11" fill="#334155">生成物独占一个文件名里带 .generated. 的文件；需要引用的地方只写一行 include 或 require。</text>
  <text x="48" y="454" font-family="system-ui, sans-serif" font-size="11" fill="#334155">代价是多一个文件；收益是生成器永远不会写坏别人的手写代码 —— 「定位」这个问题直接消失。</text>
  <text x="48" y="476" font-family="system-ui, sans-serif" font-size="11" fill="#334155">只有在「必须改已有文件」且「无法新增文件」两个条件同时成立时，才值得升到二档。</text>

  <rect x="32" y="510" width="834" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="534" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：任意一次生成都能回答三个问题 —— 它改了哪些文件、第二次跑会发生什么、</text>
  <text x="48" y="556" font-family="system-ui, sans-serif" font-size="11" fill="#334155">删掉生成器之后这些文件还算不算数。第三个问题答「不算数」的，就不该叫代码生成。</text>
</svg>
