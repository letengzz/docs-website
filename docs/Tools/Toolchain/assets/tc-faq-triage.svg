<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="tc-faq-triage.svg">
  <title>问题分诊：先跑什么，再看根因</title>
  <rect x="0" y="0" width="900" height="660" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">问题分诊：先跑什么，再看根因（顺序不能反）</text>

  <rect x="32" y="92" width="836" height="70" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">装上了，但命令找不到</text>
  <text x="48" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：which acme / npm ls -g &lt;pkg&gt;，再看 PATH 里排第一的那个运行时是谁。</text>
  <text x="48" y="157" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：装进了另一个运行时（nvm 与托管版 Node 的 PATH 顺序）；或 bin 字段没写对。</text>

  <rect x="32" y="172" width="836" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">能跑，但输出里混着人话</text>
  <text x="48" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：把 stdout 重定向到文件，看结果还能不能被直接解析。</text>
  <text x="48" y="237" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：进度、提示、警告写到了 stdout；它们本来就该一律去 stderr。</text>

  <rect x="32" y="252" width="836" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="48" y="276" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">CI 里通过，本机反而失败</text>
  <text x="48" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：在本机带 CI=1 再跑一次，看行为是否与 CI 一致。</text>
  <text x="48" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：藏了一次交互式追问；或本机残留的配置文件被悄悄读了进来。</text>

  <rect x="32" y="332" width="836" height="70" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="48" y="356" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">第二次跑就报错，或生成出重复内容</text>
  <text x="48" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：连续跑两遍 —— 第二遍必须什么都不做，并返回退出码 0。</text>
  <text x="48" y="397" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：注入标记缺失或出现了多次；或目标文件已存在却直接整段覆盖。</text>

  <rect x="32" y="412" width="836" height="70" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="436" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">装了新版，行为还是旧的</text>
  <text x="48" y="460" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：acme --version 与 npm ls -g 的输出对照，看两边是否一致。</text>
  <text x="48" y="477" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：--version 是硬编码的常量；或包缓存与软链还指向旧版本。</text>

  <rect x="32" y="492" width="836" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="516" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">平台上的任务卡在「运行中」不动</text>
  <text x="48" y="540" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先跑：看平台记录的展开参数与超时，拿同一组参数在本机手工跑一次。</text>
  <text x="48" y="557" font-family="system-ui, sans-serif" font-size="11" fill="#334155">根因：没有显式超时；或把超时当成了失败，触发自动重试，动作被跑了两遍。</text>

  <rect x="32" y="578" width="836" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="602" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：每一行都要能给出一个「命令 + 输出」作为结论，而不是一个猜测。</text>
  <text x="48" y="624" font-family="system-ui, sans-serif" font-size="11" fill="#334155">给不出命令的那一行，说明这个症状还没有被复现过 —— 那才是当下要先做的事。</text>
</svg>
