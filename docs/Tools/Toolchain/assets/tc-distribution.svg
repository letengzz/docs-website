<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="tc-distribution.svg">
  <title>分发路径与版本流</title>
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">分发路径与版本流：从「本机能跑」到「别人能装上并回滚」</text>

  <rect x="32" y="92" width="258" height="86" rx="11" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">路径一 · 公开 registry</text>
  <text x="46" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#334155">适用：对外部开放的工具</text>
  <text x="46" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#334155">下限：产物里不含任何凭据</text>

  <rect x="320" y="92" width="258" height="86" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="334" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">路径二 · 内部 registry</text>
  <text x="334" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#334155">适用：内部 CLI、含业务约定</text>
  <text x="334" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#334155">下限：按 scope 改源，不动全局</text>

  <rect x="608" y="92" width="258" height="86" rx="11" fill="#dbeafe" stroke="#2563eb"/>
  <text x="622" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">路径三 · 单文件产物</text>
  <text x="622" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#334155">适用：不想引入包管理器</text>
  <text x="622" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#334155">下限：产物可校验，否则不可信</text>

  <line x1="161" y1="178" x2="161" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>
  <line x1="449" y1="178" x2="449" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>
  <line x1="737" y1="178" x2="737" y2="194" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="32" y="200" width="834" height="64" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="226" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3730a3">使用者装上的到底是哪一版？</text>
  <text x="48" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#334155">这是分发唯一的真问题 —— 答不出来，升级、排障、回滚三件事都只能靠猜。</text>

  <rect x="32" y="280" width="156" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="304" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">改动</text>
  <text x="44" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">一次行为变化</text>
  <text x="44" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#334155">要能说清「改了什么」</text>
  <text x="44" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">看不出来的改动最难评</text>
  <line x1="192" y1="332" x2="198" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="202" y="280" width="156" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="214" y="304" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">changeset</text>
  <text x="214" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">人写的一句话</text>
  <text x="214" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#334155">随改动一起提交</text>
  <text x="214" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">不是发版时补写</text>
  <line x1="362" y1="332" x2="368" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="372" y="280" width="156" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="384" y="304" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">版本号</text>
  <text x="384" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">由破坏性决定</text>
  <text x="384" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不是由工作量决定</text>
  <text x="384" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">0.x 不等于可以随便破</text>
  <line x1="532" y1="332" x2="538" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="542" y="280" width="156" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="554" y="304" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">发布</text>
  <text x="554" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">在 CI 里自动完成</text>
  <text x="554" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#334155">人不手动敲 publish</text>
  <text x="554" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">手工发布＝不可复现</text>
  <line x1="702" y1="332" x2="708" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="712" y="280" width="154" height="104" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="724" y="304" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">使用者</text>
  <text x="724" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">能查到自己的版本</text>
  <text x="724" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#334155">能回滚到上一版</text>
  <text x="724" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">看不见版本＝无法支持</text>

  <rect x="32" y="400" width="410" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="424" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">版本可见性：三条底线</text>
  <text x="48" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#334155">① 版本号不可复用 —— 同一版本号的内容永不改变</text>
  <text x="48" y="470" font-family="system-ui, sans-serif" font-size="10" fill="#334155">② --version 必须真的答得出来（不是硬编码的旧值）</text>
  <text x="48" y="492" font-family="system-ui, sans-serif" font-size="10" fill="#334155">③ 至少一条能看出「谁在装」的线索，哪怕是安装计数</text>

  <rect x="458" y="400" width="408" height="112" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="474" y="424" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">退役不是删包：三步走</text>
  <text x="474" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#334155">① deprecate 并写明原因与替代版本，先不删</text>
  <text x="474" y="470" font-family="system-ui, sans-serif" font-size="10" fill="#334155">② 在 README 顶部加醒目横幅，说明迁移路径</text>
  <text x="474" y="492" font-family="system-ui, sans-serif" font-size="10" fill="#334155">③ 等安装量归零，再考虑下架；删包会打断流水线</text>

  <rect x="32" y="528" width="834" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="552" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：在另一台干净机器上，只按 README 就能装上、能看出自己装的是哪一版、</text>
  <text x="48" y="574" font-family="system-ui, sans-serif" font-size="11" fill="#334155">能退回上一版。这三件事里任何一件做不到，分发的部分就还没完成。</text>
</svg>
