<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="al-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="30">契约在中间：上游是设计，下游全是产物</text>

  <rect class="box" x="40" y="56" width="200" height="62" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="140" y="82">① 设计与规范</text>
  <text class="small" x="140" y="102">资源命名 · 方法 · 状态码 · 错误结构</text>

  <rect class="box" x="270" y="56" width="200" height="62" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="370" y="82">② 评审与冻结</text>
  <text class="small" x="370" y="102">契约评审 · 语义化版本 · 归档基线</text>

  <rect class="box" x="40" y="152" width="770" height="88" fill="#fff8e8" stroke="#d99a3a" stroke-width="2"/>
  <text class="t" x="425" y="180">OpenAPI 契约（唯一事实来源）</text>
  <text class="small" x="425" y="202">openapi: 3.2.x · paths / components / security · $ref 可解析 · Lint 通过</text>
  <text class="small" x="425" y="224">实现与契约不一致时，改的是实现，不是契约</text>

  <line class="line" x1="140" y1="118" x2="140" y2="152" marker-end="url(#al-arrow)"/>
  <line class="line" x1="370" y1="118" x2="370" y2="152" marker-end="url(#al-arrow)"/>
  <line class="line" x1="642" y1="118" x2="642" y2="152" marker-end="url(#al-arrow)"/>
  <rect class="box" x="540" y="56" width="200" height="62" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="640" y="82">现状盘点</text>
  <text class="small" x="640" y="102">存量接口反推 · 影子接口排查</text>

  <line class="line" x1="130" y1="240" x2="130" y2="288" marker-end="url(#al-arrow)"/>
  <line class="line" x1="330" y1="240" x2="330" y2="288" marker-end="url(#al-arrow)"/>
  <line class="line" x1="530" y1="240" x2="530" y2="288" marker-end="url(#al-arrow)"/>
  <line class="line" x1="730" y1="240" x2="730" y2="288" marker-end="url(#al-arrow)"/>

  <rect class="box" x="45" y="288" width="170" height="60" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="130" y="312">Mock 服务</text>
  <text class="small" x="130" y="332">前端不再等后端</text>

  <rect class="box" x="245" y="288" width="170" height="60" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="330" y="312">文档站 / 沙箱</text>
  <text class="small" x="330" y="332">文档与实现同源</text>

  <rect class="box" x="445" y="288" width="170" height="60" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="530" y="312">客户端与类型</text>
  <text class="small" x="530" y="332">SDK / TS 类型自动生成</text>

  <rect class="box" x="645" y="288" width="170" height="60" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="730" y="312">网关与门禁</text>
  <text class="small" x="730" y="332">路由/鉴权/限流 + 回归</text>
</svg>
