<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">实战六步：从存量接口到可门禁的契约</text>

  <rect class="box" x="40" y="48" width="240" height="70" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="160" y="74">① 盘点与分类</text>
  <text class="small" x="160" y="96">把现有接口按「链路 + 受众」分堆</text>
  <text class="small" x="160" y="112">区分对外 / 管理端 / 内部</text>

  <rect class="box" x="310" y="48" width="240" height="70" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="430" y="74">② 定规范并写成规则集</text>
  <text class="small" x="430" y="96">命名、分页、错误结构、幂等</text>
  <text class="small" x="430" y="112">落成 .spectral.yaml（可执行）</text>

  <rect class="box" x="580" y="48" width="240" height="70" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="700" y="74">③ 写契约并归档基线</text>
  <text class="small" x="700" y="96">契约进 Git，与代码同仓同评审</text>
  <text class="small" x="700" y="112">发布即打一个基线快照</text>

  <line class="line" x1="280" y1="83" x2="310" y2="83" marker-end="url(#ap-arrow)"/>
  <line class="line" x1="550" y1="83" x2="580" y2="83" marker-end="url(#ap-arrow)"/>
  <line class="line" x1="700" y1="118" x2="700" y2="160" marker-end="url(#ap-arrow)"/>
  <line class="line" x1="160" y1="118" x2="160" y2="160" marker-end="url(#ap-arrow)"/>

  <rect class="box" x="40" y="160" width="240" height="70" fill="#fff8e8" stroke="#d99a3a"/>
  <text x="160" y="186">④ 契约驱动实现</text>
  <text class="small" x="160" y="208">实现按契约写；不一致改实现</text>
  <text class="small" x="160" y="224">契约测试是这一条的判据</text>

  <rect class="box" x="310" y="160" width="240" height="70" fill="#fff8e8" stroke="#d99a3a"/>
  <text x="430" y="186">⑤ 门禁接进流水线</text>
  <text class="small" x="430" y="208">lint → bundle → 破坏性变更</text>
  <text class="small" x="430" y="224">三道依次跑，任一失败即阻断</text>

  <rect class="box" x="580" y="160" width="240" height="70" fill="#fff8e8" stroke="#d99a3a"/>
  <text x="700" y="186">⑥ 派生产物自动化</text>
  <text class="small" x="700" y="208">Mock / 文档站 / TS 类型 / 网关配置</text>
  <text class="small" x="700" y="224">全部由契约生成，不手写</text>

  <line class="line" x1="280" y1="195" x2="310" y2="195" marker-end="url(#ap-arrow)"/>
  <line class="line" x1="550" y1="195" x2="580" y2="195" marker-end="url(#ap-arrow)"/>

  <rect class="box" x="40" y="262" width="780" height="124" fill="#eefaf0" stroke="#3aa76d"/>
  <text class="t" x="430" y="288">收尾判据（可逐条执行）</text>
  <text class="small" x="430" y="312">① lint 全绿且扫到 N 条路径（活性判据：路径数为 0 说明扫错目录）</text>
  <text class="small" x="430" y="334">② 契约与实现导出的产物 diff 为空</text>
  <text class="small" x="430" y="356">③ 故意删除一个响应字段 → 破坏性变更门禁退出码非 0</text>
  <text class="small" x="430" y="378">④ 从契约生成的 Mock 与真实接口在字段层面一致（契约测试兜底）</text>
</svg>
