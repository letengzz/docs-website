<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ag-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">治理四层门禁：越靠左越便宜，越靠右越难绕过</text>

  <rect class="box" x="30" y="48" width="185" height="86" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="122" y="74">① 编辑器内</text>
  <text class="small" x="122" y="96">Spectral / Redocly 扩展</text>
  <text class="small" x="122" y="114">写完就标红，零等待</text>

  <rect class="box" x="235" y="48" width="185" height="86" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="327" y="74">② pre-commit</text>
  <text class="small" x="327" y="96">lint --fail-severity=error</text>
  <text class="small" x="327" y="114">坏契约不进远端</text>

  <rect class="box" x="440" y="48" width="185" height="86" fill="#fff8e8" stroke="#d99a3a"/>
  <text x="532" y="74">③ PR 门禁</text>
  <text class="small" x="532" y="96">lint + bundle + 差异</text>
  <text class="small" x="532" y="114">破坏性变更必须显式批准</text>

  <rect class="box" x="645" y="48" width="185" height="86" fill="#fdf3f3" stroke="#d9736a"/>
  <text x="737" y="74">④ 发布后对账</text>
  <text class="small" x="737" y="96">契约 ↔ 实现 / 流量比对</text>
  <text class="small" x="737" y="114">抓影子接口与漂移</text>

  <line class="line" x1="215" y1="91" x2="235" y2="91" marker-end="url(#ag-arrow)"/>
  <line class="line" x1="420" y1="91" x2="440" y2="91" marker-end="url(#ag-arrow)"/>
  <line class="line" x1="625" y1="91" x2="645" y2="91" marker-end="url(#ag-arrow)"/>

  <rect class="box" x="30" y="166" width="800" height="110" fill="#fbfcff" stroke="#ccd8ee"/>
  <text class="t" x="430" y="192">规则集是治理的地基：没有规则集的「门禁」只是把校验器跑了一遍</text>
  <text class="small" x="430" y="218">· operationId 必填且唯一 → 客户端生成才有函数名可用</text>
  <text class="small" x="430" y="240">· 路径 kebab-case、schema 属性 camelCase → 命名不再靠自觉</text>
  <text class="small" x="430" y="262">· 每个 responses 必须声明 4xx 分支 → 错误处理不会被漏写</text>

  <rect class="box" x="30" y="296" width="390" height="112" fill="#eefaf0" stroke="#3aa76d"/>
  <text class="t" x="225" y="322">什么算破坏性变更（必须拦）</text>
  <text class="small" x="225" y="346">删除或重命名路径 / 字段 / 枚举值</text>
  <text class="small" x="225" y="368">新增必填请求参数、收紧校验</text>
  <text class="small" x="225" y="390">把字段从可选改必填、改类型或格式</text>

  <rect class="box" x="440" y="296" width="390" height="112" fill="#fdf3f3" stroke="#d9736a"/>
  <text class="t" x="635" y="322">什么不算破坏性（放行但要记录）</text>
  <text class="small" x="635" y="346">新增可选字段 / 新增可选请求参数</text>
  <text class="small" x="635" y="368">新增枚举值（对严格反序列化的客户端是风险）</text>
  <text class="small" x="635" y="390">新增接口、补充 description 与示例</text>
</svg>
