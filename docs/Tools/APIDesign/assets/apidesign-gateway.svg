<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
    .dash { stroke: #b9c6dd; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">网关与契约：配置同源，才能不漂移</text>

  <rect class="box" x="40" y="48" width="150" height="52" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="115" y="70">客户端</text>
  <text class="small" x="115" y="90">App / Web / 第三方</text>

  <rect class="box" x="230" y="48" width="400" height="52" fill="#fff8e8" stroke="#d99a3a" stroke-width="2"/>
  <text x="430" y="70">API 网关</text>
  <text class="small" x="430" y="90">路由 · 鉴权 · 限流 · 版本路由 · 观测</text>

  <rect class="box" x="670" y="48" width="150" height="52" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="745" y="70">后端服务</text>
  <text class="small" x="745" y="90">契约的实现者</text>

  <line class="line" x1="190" y1="74" x2="230" y2="74" marker-end="url(#aw-arrow)"/>
  <line class="line" x1="630" y1="74" x2="670" y2="74" marker-end="url(#aw-arrow)"/>

  <rect class="box" x="40" y="140" width="780" height="60" fill="#fbfcff" stroke="#ccd8ee"/>
  <text class="t" x="430" y="166">OpenAPI 契约是唯一事实来源</text>
  <text class="small" x="430" y="188">路径、方法、鉴权声明、参数约束——网关配置从这里生成，而不是各写一份</text>

  <line class="line" x1="200" y1="200" x2="200" y2="240" marker-end="url(#aw-arrow)"/>
  <line class="line" x1="430" y1="200" x2="430" y2="240" marker-end="url(#aw-arrow)"/>
  <line class="line" x1="660" y1="200" x2="660" y2="240" marker-end="url(#aw-arrow)"/>

  <rect class="box" x="40" y="240" width="290" height="76" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="185" y="266">security → 鉴权策略</text>
  <text class="small" x="185" y="288">哪些路径需要 Bearer / API Key</text>
  <text class="small" x="185" y="306">未声明的一律按最严格策略兜底</text>

  <rect class="box" x="350" y="240" width="270" height="76" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="485" y="266">servers → 路由前缀</text>
  <text class="small" x="485" y="288">版本前缀（/api/v1）在契约里写死</text>
  <text class="small" x="485" y="306">网关只做转发与重写，不臆造路径</text>

  <rect class="box" x="640" y="240" width="180" height="76" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="730" y="266">标签 → 限流档位</text>
  <text class="small" x="730" y="288">按 tags 分档，</text>
  <text class="small" x="730" y="306">不按路径逐条手配</text>

  <rect class="box" x="40" y="338" width="780" height="66" fill="#fdf3f3" stroke="#d9736a"/>
  <text x="430" y="362">最容易出的漂移：网关放行了契约里没写的路径</text>
  <text class="small" x="430" y="384">「契约里没有的路径不允许被路由」应当是一条可自动校验的规则——否则影子接口会绕开全部治理</text>
</svg>
