<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="am-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">契约定稿之后，三件「额外工作」自动变成附带产物</text>

  <rect class="box" x="290" y="48" width="280" height="66" fill="#fff8e8" stroke="#d99a3a" stroke-width="2"/>
  <text class="t" x="430" y="76">openapi.json（已冻结）</text>
  <text class="small" x="430" y="98">含示例、含错误分支、Lint 全绿</text>

  <line class="line" x1="330" y1="114" x2="150" y2="166" marker-end="url(#am-arrow)"/>
  <line class="line" x1="430" y1="114" x2="430" y2="166" marker-end="url(#am-arrow)"/>
  <line class="line" x1="530" y1="114" x2="710" y2="166" marker-end="url(#am-arrow)"/>

  <rect class="box" x="40" y="166" width="220" height="96" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="150" y="192">Mock 服务</text>
  <text class="small" x="150" y="216">Prism / MSW / Apifox</text>
  <text class="small" x="150" y="238">按 example 与 schema 造响应</text>
  <text class="small" x="150" y="256">前端拿真 URL 跑，不写假数据</text>

  <rect class="box" x="320" y="166" width="220" height="96" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="430" y="192">文档站 / 沙箱</text>
  <text class="small" x="430" y="216">Redocly / Scalar / Swagger UI</text>
  <text class="small" x="430" y="238">示例可一键发出真实请求</text>
  <text class="small" x="430" y="256">文档不再「上次更新是三个月前」</text>

  <rect class="box" x="600" y="166" width="220" height="96" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="710" y="192">客户端与类型</text>
  <text class="small" x="710" y="216">openapi-typescript / generator</text>
  <text class="small" x="710" y="238">TS 类型与请求函数自动生成</text>
  <text class="small" x="710" y="256">字段改名在编译期就炸出来</text>

  <rect class="box" x="40" y="288" width="780" height="94" fill="#fdf3f3" stroke="#d9736a"/>
  <text class="t" x="430" y="314">反面：如果 Mock 是手写的，你会得到什么</text>
  <text class="small" x="430" y="338">Mock 与真实接口的字段名、判空规则、分页结构各说各话 → 联调当天全部推倒重来</text>
  <text class="small" x="430" y="360">判据：Mock 必须由契约生成。手写 Mock 只允许作为「契约尚未定稿前的临时脚手架」，且要标注失效期限</text>
</svg>
