<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .axis { stroke: #4a7bd8; stroke-width: 2; }
    .dash { stroke: #d99a3a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .ok { stroke: #3aa76d; stroke-width: 1.4; }
  </style>

  <text class="t" x="430" y="28">接口生命周期：宽限期不是「通知期」，是可执行的倒计时</text>

  <line class="axis" x1="60" y1="200" x2="800" y2="200"/>
  <text class="small" x="800" y="226">时间</text>

  <rect class="box" x="60" y="150" width="200" height="50" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="160" y="172">v1 正常运行</text>
  <text class="small" x="160" y="192">契约归档为基线</text>

  <rect class="box" x="270" y="150" width="230" height="50" fill="#fff8e8" stroke="#d99a3a"/>
  <text x="385" y="172">Deprecation 生效</text>
  <text class="small" x="385" y="192">Deprecation: @&lt;unix 秒&gt;</text>

  <rect class="box" x="510" y="150" width="230" height="50" fill="#fdf3f3" stroke="#d9736a"/>
  <text x="625" y="172">Sunset 到达</text>
  <text class="small" x="625" y="192">Sunset: &lt;HTTP 日期&gt; → 410 Gone</text>

  <line class="dash" x1="270" y1="200" x2="270" y2="238"/>
  <text class="small" x="270" y="258">宣告废弃</text>
  <line class="dash" x1="500" y1="200" x2="500" y2="292"/>
  <text class="small" x="500" y="312">停止响应</text>

  <line class="ok" x1="270" y1="248" x2="500" y2="248"/>
  <line class="ok" x1="270" y1="242" x2="270" y2="254"/>
  <line class="ok" x1="500" y1="242" x2="500" y2="254"/>
  <text x="385" y="272">宽限期（建议 ≥ 6 个月，且按调用量下降而非日历决定终点）</text>

  <rect class="box" x="60" y="330" width="740" height="56" fill="#eefaf0" stroke="#3aa76d"/>
  <text x="430" y="352">两个日期格式不一样，这不是笔误：Deprecation 用结构化字段日期（@Unix 秒），Sunset 用 HTTP-date</text>
  <text class="small" x="430" y="374">并配 Link 头：rel="deprecation" 指向迁移指南，rel="successor-version" 指向替代资源</text>
</svg>
