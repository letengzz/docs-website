<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.4; fill: none; }
    .dash { stroke: #b9c6dd; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
  </style>

  <text class="t" x="430" y="26">一份 OpenAPI 文档的骨架（3.2 视角）</text>

  <rect class="box" x="40" y="44" width="230" height="52" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="155" y="66">openapi: 3.2.0</text>
  <text class="small" x="155" y="86">版本声明，决定可用特性集</text>

  <rect class="box" x="290" y="44" width="230" height="52" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="405" y="66">info / servers / tags</text>
  <text class="small" x="405" y="86">元信息、环境地址、标签分组</text>

  <rect class="box" x="540" y="44" width="280" height="52" fill="#eef4ff" stroke="#4a7bd8"/>
  <text x="680" y="66">security + components.securitySchemes</text>
  <text class="small" x="680" y="86">鉴权在文档里就要说清楚</text>

  <rect class="box" x="40" y="130" width="780" height="150" fill="#fff8e8" stroke="#d99a3a" stroke-width="2"/>
  <text class="t" x="430" y="156">paths：每个路径项下按方法声明 operation</text>

  <rect class="box" x="62" y="172" width="230" height="92" fill="#fffdf7" stroke="#e3c489"/>
  <text class="small" x="177" y="196">operationId（唯一）</text>
  <text class="small" x="177" y="216">summary / description</text>
  <text class="small" x="177" y="236">parameters（query / path / header）</text>
  <text class="small" x="177" y="256">requestBody + responses</text>

  <rect class="box" x="312" y="172" width="230" height="92" fill="#fffdf7" stroke="#e3c489"/>
  <text class="small" x="427" y="196">responses 必须穷举分支</text>
  <text class="small" x="427" y="216">200 / 201 / 204</text>
  <text class="small" x="427" y="236">400 / 401 / 403 / 404</text>
  <text class="small" x="427" y="256">409 / 422 / 429 / 500</text>

  <rect class="box" x="562" y="172" width="236" height="92" fill="#fffdf7" stroke="#e3c489"/>
  <text class="small" x="680" y="196">declared 与 realized 必须一致</text>
  <text class="small" x="680" y="216">「200 缺 content」是最常见的空壳</text>
  <text class="small" x="680" y="236">只有 200 的契约 = 没有契约</text>
  <text class="small" x="680" y="256">错误分支才是联调期的救命信息</text>

  <rect class="box" x="40" y="306" width="380" height="132" fill="#eefaf0" stroke="#3aa76d"/>
  <text class="t" x="230" y="332">components：可复用的一切</text>
  <text class="small" x="230" y="356">schemas（数据模型，JSON Schema 2020-12）</text>
  <text class="small" x="230" y="378">responses / parameters / requestBodies</text>
  <text class="small" x="230" y="400">examples（示例是文档质量的放大器）</text>
  <text class="small" x="230" y="422">$ref 可解析是 Lint 的第一条硬规则</text>

  <rect class="box" x="440" y="306" width="380" height="132" fill="#fdf3f3" stroke="#d9736a"/>
  <text class="t" x="630" y="332">3.2 值得知道的新东西</text>
  <text class="small" x="630" y="356">$self：文档自描述身份，便于多文档引用</text>
  <text class="small" x="630" y="378">itemSchema：把 SSE / NDJSON 流式响应写进契约</text>
  <text class="small" x="630" y="400">标签支持 parent / kind / summary 嵌套分组</text>
  <text class="small" x="630" y="422">deviceAuthorizationUrl：设备码授权流进 securitySchemes</text>
</svg>
