<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    text { fill: #222; font-size: 12.5px; text-anchor: middle; }
    .t { font-size: 14px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    .box { stroke-width: 1.5; rx: 8; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">先分类，再排错：四类症状对应四条路</text>

  <rect class="box" x="330" y="44" width="200" height="48" fill="#fff8e8" stroke="#d99a3a" stroke-width="2"/>
  <text x="430" y="74">门禁红了 / 契约对不上</text>

  <line class="line" x1="380" y1="92" x2="130" y2="132" marker-end="url(#af-arrow)"/>
  <line class="line" x1="420" y1="92" x2="360" y2="132" marker-end="url(#af-arrow)"/>
  <line class="line" x1="460" y1="92" x2="600" y2="132" marker-end="url(#af-arrow)"/>
  <line class="line" x1="490" y1="92" x2="760" y2="132" marker-end="url(#af-arrow)"/>

  <rect class="box" x="30" y="132" width="200" height="120" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="130" y="158">Lint 报错</text>
  <text class="small" x="130" y="182">先看规则名，不看行号</text>
  <text class="small" x="130" y="204">规则来自哪一层？</text>
  <text class="small" x="130" y="224">内置 oas / 团队自定义</text>
  <text class="small" x="130" y="244">分不清就 --format stylish 看详情</text>

  <rect class="box" x="250" y="132" width="200" height="120" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="350" y="158">$ref 解析失败</text>
  <text class="small" x="350" y="182">文件路径相对谁？</text>
  <text class="small" x="350" y="204">多文件必须先 bundle</text>
  <text class="small" x="350" y="224">再交给只吃单文件的工具</text>
  <text class="small" x="350" y="244">大小写敏感，Mac 上测不出</text>

  <rect class="box" x="490" y="132" width="200" height="120" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="590" y="158">实现与契约不一致</text>
  <text class="small" x="590" y="182">以契约为准改实现</text>
  <text class="small" x="590" y="204">确需改契约 → 走变更流程</text>
  <text class="small" x="590" y="224">别「两边都改到能过」</text>
  <text class="small" x="590" y="244">等于把契约降级成注释</text>

  <rect class="box" x="710" y="132" width="130" height="120" fill="#eef4ff" stroke="#4a7bd8"/>
  <text class="t" x="775" y="158">破坏性变更</text>
  <text class="small" x="775" y="182">先问「有谁在调」</text>
  <text class="small" x="775" y="204">有消费者 → 不许直接删</text>
  <text class="small" x="775" y="224">走弃用 + 宽限期</text>
  <text class="small" x="775" y="244">并补 Deprecation 头</text>

  <rect class="box" x="30" y="282" width="800" height="134" fill="#fdf3f3" stroke="#d9736a"/>
  <text class="t" x="430" y="308">四条最容易踩的坑（都能在写之前避免）</text>
  <text class="small" x="430" y="332">① 把 OpenAPI 当文档写：只写 200，不写错误分支 → 联调时错误处理全靠猜</text>
  <text class="small" x="430" y="354">② 用版本号替代兼容性设计：一有小改动就发 v2，消费者跟不上，最后没人升级</text>
  <text class="small" x="430" y="376">③ 手写 Mock 与文档：契约改了它们不改，反而成了误导源</text>
  <text class="small" x="430" y="398">④ 门禁只查语法不查风格：契约合法但风格千奇百怪，客户端生成器产出的函数名没法用</text>
</svg>
