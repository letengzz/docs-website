<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<title>发布链路：五步，两个卡点</title>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
</defs>
<text x="32.0" y="42.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">发布链路：五步，两个卡点</text>
<rect x="32.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
<text x="46.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#047857" font-weight="700" text-anchor="start">构建</text>
<text x="46.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">无源文件</text>
<line x1="158.0" y1="131.0" x2="176.0" y2="131.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="178.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
<text x="192.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#047857" font-weight="700" text-anchor="start">打包</text>
<text x="192.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">根即 manifest</text>
<line x1="304.0" y1="131.0" x2="322.0" y2="131.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="324.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
<text x="338.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#047857" font-weight="700" text-anchor="start">签名</text>
<text x="338.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">CRX3 头 593 B</text>
<line x1="450.0" y1="131.0" x2="468.0" y2="131.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="470.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="484.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b45309" font-weight="700" text-anchor="start">提交审核</text>
<text x="484.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">权限逐条说明</text>
<line x1="596.0" y1="131.0" x2="614.0" y2="131.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="616.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<text x="630.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start">审核</text>
<text x="630.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">1 天 ~ 数周</text>
<line x1="742.0" y1="131.0" x2="760.0" y2="131.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="762.0" y="90.0" width="124.0" height="82.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="776.0" y="118.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">放量</text>
<text x="776.0" y="144.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">小时级生效</text>
<rect x="32.0" y="196.0" width="438.0" height="116.0" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="52.0" y="224.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b45309" font-weight="700" text-anchor="start">卡点 1：权限决定审核时长</text>
<text x="52.0" y="250.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">activeTab + storage → 通常小时级</text>
<text x="52.0" y="272.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">all_urls + tabs + cookies → 人工审核</text>
<text x="52.0" y="296.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">权限说明一条对一条，答不上来就拒</text>
<rect x="490.0" y="196.0" width="438.0" height="116.0" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="510.0" y="224.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="start">卡点 2：ID 与版本不可逆</text>
<text x="510.0" y="250.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">ID = 公钥 SHA-256 前 16 字节（32 字符）</text>
<text x="510.0" y="272.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">换密钥 = 换扩展，用户数据留在旧 ID</text>
<text x="510.0" y="296.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">回滚 = 发一个更大的版本号，不能降级</text>
<rect x="32.0" y="330.0" width="896.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="52.0" y="356.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">一次拒绝的真实成本：修改后是重新排队，不是接着审</text>
<text x="52.0" y="378.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">所以第一次提交前，用干净账号与干净机器把「首次使用流程」走到底——审核员看到的就是这条路</text>
<text x="32.0" y="428.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">判据 DST-A（ID 可复现）、DST-C（版本递增）、DST-F（无远程脚本引用）</text>
</svg>
