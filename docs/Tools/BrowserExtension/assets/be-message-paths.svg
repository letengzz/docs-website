<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>四条通道：一次性、端口、外部、原生</title>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
</defs>
<text x="32.0" y="42.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">四条通道：一次性、端口、外部、原生</text>
<rect x="32.0" y="108.0" width="196.0" height="96.0" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="46.0" y="136.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="start">网页脚本</text>
<text x="46.0" y="162.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">需 externally_</text>
<text x="46.0" y="182.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">connectable 放行</text>
<rect x="262.0" y="108.0" width="196.0" height="96.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="276.0" y="136.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#047857" font-weight="700" text-anchor="start">内容脚本</text>
<text x="276.0" y="162.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">只能收发消息</text>
<text x="276.0" y="182.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">与读 storage</text>
<rect x="492.0" y="108.0" width="196.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="506.0" y="136.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="start">service worker</text>
<text x="506.0" y="162.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">全部 chrome.*</text>
<text x="506.0" y="182.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">无 DOM、无常驻</text>
<rect x="722.0" y="108.0" width="196.0" height="96.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="736.0" y="136.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6d28d9" font-weight="700" text-anchor="start">原生程序</text>
<text x="736.0" y="162.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">host→扩展 1 MB</text>
<text x="736.0" y="182.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">扩展→host 64 MiB</text>
<line x1="231.0" y1="156.0" x2="255.0" y2="156.0" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="243.0" y="100.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b45309" font-weight="600" text-anchor="middle">postMessage</text>
<line x1="461.0" y1="156.0" x2="485.0" y2="156.0" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="473.0" y="100.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#047857" font-weight="600" text-anchor="middle">sendMessage</text>
<line x1="691.0" y1="156.0" x2="715.0" y2="156.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="703.0" y="100.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6d28d9" font-weight="600" text-anchor="middle">connectNative</text>
<rect x="32.0" y="226.0" width="896.0" height="40.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="52.0" y="252.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">扩展页（popup / options）有 DOM 与全部 API，可直接调；它和 sw 之间也走上面两条通道</text>
<rect x="32.0" y="288.0" width="438.0" height="130.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="52.0" y="314.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start">铁律 1：异步回复必须 return true</text>
<text x="52.0" y="338.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">监听器写成 async，return true 变成 Promise，</text>
<text x="52.0" y="358.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">通道立刻关闭——回调永远不执行，也不报错。</text>
<text x="52.0" y="386.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">症状：点了没反应，控制台无异常。</text>
<rect x="490.0" y="288.0" width="438.0" height="130.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="510.0" y="314.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">铁律 2：开销按字节算</text>
<text x="510.0" y="338.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">1,000 节点 ≈ 198 KiB / 1.03 ms</text>
<text x="510.0" y="358.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">10 万节点 ≈ 20.6 MiB / 142.95 ms</text>
<text x="510.0" y="386.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="600" text-anchor="start">只传 id + 变化量：同一批数据缩小 10.2 倍</text>
<text x="32.0" y="452.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">判据 MSG-B（同步监听器 + return true）、MSG-D（单条 ≤ 256 KB）、MSG-G（外部消息校验 origin）</text>
</svg>
