<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img">
<title>四层权限：从「一次给完」到「用时再问」</title>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
</defs>
<text x="32.0" y="42.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">四层权限：从「一次给完」到「用时再问」</text>
<rect x="32.0" y="86.0" width="896.0" height="70.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="52.0" y="114.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start">第 1 层</text>
<text x="52.0" y="138.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">permissions</text>
<text x="268.0" y="114.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">安装即授予</text>
<text x="268.0" y="138.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">会显示安装警告</text>
<text x="520.0" y="128.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">storage / alarms / contextMenus</text>
<rect x="32.0" y="164.0" width="896.0" height="70.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="52.0" y="192.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start">第 2 层</text>
<text x="52.0" y="216.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">host_permissions</text>
<text x="268.0" y="192.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">安装即授予</text>
<text x="268.0" y="216.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">警告最吓人</text>
<text x="520.0" y="206.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">「在所有网站上读取数据」</text>
<rect x="32.0" y="242.0" width="896.0" height="70.0" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="52.0" y="270.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="start">第 3 层</text>
<text x="52.0" y="294.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">optional_permissions</text>
<text x="268.0" y="270.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">用户点授权才给</text>
<text x="268.0" y="294.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">不显示</text>
<text x="520.0" y="284.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">高级功能、可选站点范围</text>
<rect x="32.0" y="320.0" width="896.0" height="70.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="52.0" y="348.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#047857" font-weight="700" text-anchor="start">第 4 层</text>
<text x="52.0" y="372.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">activeTab</text>
<text x="268.0" y="348.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">手势触发时临时给</text>
<text x="268.0" y="372.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">不显示</text>
<text x="520.0" y="362.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">只处理当前这一页</text>
<rect x="32.0" y="402.0" width="896.0" height="44.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="52.0" y="430.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#334155" font-weight="600" text-anchor="start">PMI-D：能靠 activeTab 完成的，不得声明 host 权限——差的不是「好不好看」，是「装不装」</text>
</svg>
