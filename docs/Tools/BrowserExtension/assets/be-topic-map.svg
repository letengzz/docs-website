<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
<title>浏览器扩展工程 · 专题地图</title>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
</defs>
<text x="32.0" y="42.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">浏览器扩展工程 · 专题地图</text>
<text x="32.0" y="68.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">五个层次：环境 → 通信 → 数据 → 交付 → 实战</text>
<rect x="32.0" y="92.0" width="896.0" height="60.0" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
<text x="52.0" y="128.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#334155" font-weight="700" text-anchor="start">环境层</text>
<text x="170.0" y="128.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">manifest 与生命周期 · 权限与最小授权 · 内容脚本与隔离世界</text>
<rect x="32.0" y="162.0" width="896.0" height="60.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="52.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#2563eb" font-weight="700" text-anchor="start">通信层</text>
<text x="170.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">跨上下文消息 · 声明式网络规则</text>
<rect x="32.0" y="232.0" width="896.0" height="60.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="52.0" y="268.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#047857" font-weight="700" text-anchor="start">数据层</text>
<text x="170.0" y="268.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">存储与配额（四个区、字节口径、迁移）</text>
<rect x="32.0" y="302.0" width="896.0" height="60.0" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="52.0" y="338.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="start">交付层</text>
<text x="170.0" y="338.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">打包签名与分发 · 安全边界与审核红线</text>
<rect x="32.0" y="372.0" width="896.0" height="60.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="52.0" y="408.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#6d28d9" font-weight="700" text-anchor="start">实战</text>
<text x="170.0" y="408.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" font-weight="400" text-anchor="start">网页摘录扩展：S1~S10 十条可判定验收</text>
<rect x="32.0" y="448.0" width="288.0" height="78.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="48.0" y="474.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#047857" font-weight="700" text-anchor="start">第一次接触</text>
<text x="48.0" y="500.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">概述 → 生命周期 → 权限 → 内容脚本 → 消息</text>
<rect x="336.0" y="448.0" width="288.0" height="78.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="352.0" y="474.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">要做拦截或存储</text>
<text x="352.0" y="500.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">网络规则 → 存储与配额（可跳读其余）</text>
<rect x="640.0" y="448.0" width="288.0" height="78.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="656.0" y="474.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start">准备上架</text>
<text x="656.0" y="500.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start">分发 → 安全边界 → 实战（十条验收）</text>
<text x="32.0" y="556.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">10 族 80 条判据，逐页前缀唯一：EXO / MFL / PMI / CSC / MSG / NET / STG / DST / SEC / PRP</text>
<text x="32.0" y="580.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">其余九页都是「三个执行上下文 + 六条硬约束」的展开——遇到不确定，先回到概述</text>
</svg>
