<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="280" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">流水线阶段（GitLab CI / Jenkins）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="35" y="100" width="130" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="100" y="130" fill="#4338ca" font-weight="bold">build</text>
    <text x="100" y="152" fill="#4b5563" font-size="11">编译打包</text>
    <text x="100" y="172" fill="#6b7280" font-size="10">Job: compile, package</text>
    <rect x="200" y="100" width="130" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="265" y="130" fill="#b45309" font-weight="bold">test</text>
    <text x="265" y="152" fill="#4b5563" font-size="11">单元/集成测试</text>
    <text x="265" y="172" fill="#6b7280" font-size="10">Job: unit, e2e</text>
    <rect x="365" y="100" width="130" height="90" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="430" y="130" fill="#be185d" font-weight="bold">deploy</text>
    <text x="430" y="152" fill="#4b5563" font-size="11">部署环境</text>
    <text x="430" y="172" fill="#6b7280" font-size="10">dev/staging/prod</text>
    <rect x="530" y="100" width="130" height="90" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="595" y="130" fill="#6d28d9" font-weight="bold">health</text>
    <text x="595" y="152" fill="#4b5563" font-size="11">健康检查/冒烟</text>
    <text x="595" y="172" fill="#6b7280" font-size="10">curl /actuator</text>
    <rect x="695" y="100" width="120" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="755" y="130" fill="#b91c1c" font-weight="bold">notify</text>
    <text x="755" y="152" fill="#4b5563" font-size="11">通知/告警</text>
    <text x="755" y="172" fill="#6b7280" font-size="10">钉钉/企微/Slack</text>
  </g>
  <path d="M 170 145 H 193" stroke="#6366f1" stroke-width="2.5" marker-end="url(#s1)"/>
  <path d="M 335 145 H 358" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#s1)"/>
  <path d="M 500 145 H 523" stroke="#ec4899" stroke-width="2.5" marker-end="url(#s1)"/>
  <path d="M 665 145 H 688" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#s1)"/>
  <text x="420" y="230" text-anchor="middle" font-size="13" fill="#475569">关键：阶段之间串行依赖、同阶段内并行；失败即停止，`when: manual` 实现人工确认放行</text>
  <defs>
    <marker id="s1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
