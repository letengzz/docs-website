<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="340" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">GitOps：Argo CD 自动同步</text>
  <!-- Git -->
  <g>
    <rect x="40" y="100" width="200" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="140" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Git 仓库</text>
    <text x="140" y="155" text-anchor="middle" font-size="12" fill="#4b5563">应用清单（期望状态）</text>
    <text x="140" y="177" text-anchor="middle" font-size="11" fill="#6b7280">deployment.yaml</text>
    <text x="140" y="195" text-anchor="middle" font-size="11" fill="#6b7280">service.yaml</text>
    <text x="140" y="213" text-anchor="middle" font-size="11" fill="#6b7280">values.yaml</text>
  </g>
  <!-- ArgoCD -->
  <g>
    <rect x="310" y="100" width="220" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="420" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">Argo CD</text>
    <text x="420" y="155" text-anchor="middle" font-size="12" fill="#4b5563">监听 Git 变更</text>
    <text x="420" y="177" text-anchor="middle" font-size="12" fill="#4b5563">对比期望 vs 实际</text>
    <text x="420" y="199" text-anchor="middle" font-size="12" fill="#4b5563">自动/手动 Sync</text>
    <text x="420" y="218" text-anchor="middle" font-size="11" fill="#6b7280">回滚 = 改 Git 记录</text>
  </g>
  <!-- K8s -->
  <g>
    <rect x="600" y="100" width="200" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">Kubernetes 集群</text>
    <text x="700" y="155" text-anchor="middle" font-size="12" fill="#4b5563">Deployment 滚动更新</text>
    <text x="700" y="177" text-anchor="middle" font-size="12" fill="#4b5563">Service 路由</text>
    <text x="700" y="199" text-anchor="middle" font-size="12" fill="#4b5563">实际运行状态</text>
    <text x="700" y="218" text-anchor="middle" font-size="11" fill="#6b7280">持续收敛到期望状态</text>
  </g>
  <path d="M 245 160 H 303" stroke="#ef4444" stroke-width="2.5" marker-end="url(#g1)"/>
  <text x="274" y="148" text-anchor="middle" font-size="11" fill="#b91c1c">pull</text>
  <path d="M 535 160 H 593" stroke="#6366f1" stroke-width="2.5" marker-end="url(#g1)"/>
  <text x="564" y="148" text-anchor="middle" font-size="11" fill="#4338ca">apply</text>
  <text x="420" y="285" text-anchor="middle" font-size="13" fill="#475569">任何人对 Git 的改动都会驱动集群变化；禁止手工 kubectl 改线上，审计与回滚都有据可查</text>
  <defs>
    <marker id="g1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
