<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">质量门禁（Quality Gate）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="90" width="150" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="120" fill="#4338ca" font-weight="bold">代码扫描</text>
    <text x="105" y="142" fill="#4b5563" font-size="11">SonarQube / ESLint</text>
    <rect x="220" y="90" width="150" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="295" y="120" fill="#b45309" font-weight="bold">测试覆盖</text>
    <text x="295" y="142" fill="#4b5563" font-size="11">JaCoCo / Istanbul</text>
    <rect x="410" y="90" width="150" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="485" y="120" fill="#be185d" font-weight="bold">安全扫描</text>
    <text x="485" y="142" fill="#4b5563" font-size="11">Trivy / Snyk</text>
    <rect x="600" y="90" width="190" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="695" y="120" fill="#047857" font-weight="bold">门禁判定</text>
    <text x="695" y="142" fill="#4b5563" font-size="11">Bug=0, 覆盖率≥80%</text>
    <text x="695" y="160" fill="#6b7280" font-size="10">通过 → 继续；不通过 → 阻断</text>
  </g>
  <path d="M 185 130 H 213" stroke="#6366f1" stroke-width="2.5" marker-end="url(#q1)"/>
  <path d="M 375 130 H 403" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#q1)"/>
  <path d="M 565 130 H 593" stroke="#ec4899" stroke-width="2.5" marker-end="url(#q1)"/>
  <text x="410" y="220" text-anchor="middle" font-size="13" fill="#475569">门禁通过才允许合并 MR / 发布制品；失败详情回到开发者，快速修复再进流水线</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#6b7280">常见指标：Bug、漏洞、坏味道、覆盖率、重复率、安全漏洞（CVE）</text>
  <defs>
    <marker id="q1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
