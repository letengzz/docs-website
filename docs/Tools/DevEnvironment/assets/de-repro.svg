<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="「能复现」= 三件东西被锁住 + 一个幂等入口">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4453c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker></defs>
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700">「能复现」= 三件东西被锁住 + 一个幂等入口</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">锁文件管依赖，.tool-versions 管解释器，容器管系统库；缺一样就有一条只在别人机器上出现的报错</text>
<rect x="28" y="96" width="210" height="120" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="42" y="120" font-size="13" fill="#2a5d9f" font-weight="700">① 解释器版本</text>
<text x="42" y="140" font-size="11" fill="#1f2d3d">.nvmrc / .tool-versions</text>
<text x="42" y="160" font-size="11" fill="#1f2d3d">engines 字段</text>
<text x="42" y="180" font-size="11" fill="#1f2d3d">（三处写同一个数）</text>
<rect x="258" y="96" width="210" height="120" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="272" y="120" font-size="13" fill="#2a5d9f" font-weight="700">② 依赖图</text>
<text x="272" y="140" font-size="11" fill="#1f2d3d">lockfile 进仓库</text>
<text x="272" y="160" font-size="11" fill="#1f2d3d">安装用 --frozen-lockfile</text>
<text x="272" y="180" font-size="11" fill="#1f2d3d">禁止 npm install 裸跑</text>
<rect x="488" y="96" width="210" height="120" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="502" y="120" font-size="13" fill="#2a5d9f" font-weight="700">③ 系统库</text>
<text x="502" y="140" font-size="11" fill="#1f2d3d">devcontainer / 镜像</text>
<text x="502" y="160" font-size="11" fill="#1f2d3d">apt 包版本写死</text>
<text x="502" y="180" font-size="11" fill="#1f2d3d">时区与 locale 固定</text>
<rect x="718" y="96" width="214" height="120" rx="8" fill="#e9f5ee" stroke="#9ecfb1" stroke-width="1.4"/>
<text x="732" y="120" font-size="13" fill="#2f7d4f" font-weight="700">④ 幂等入口</text>
<text x="732" y="140" font-size="11" fill="#1f2d3d">make bootstrap</text>
<text x="732" y="160" font-size="11" fill="#1f2d3d">跑两遍结果一样</text>
<text x="732" y="180" font-size="11" fill="#1f2d3d">失败可重入</text>
<line x1="238" y1="156" x2="256" y2="156" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="468" y1="156" x2="486" y2="156" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="698" y1="156" x2="716" y2="156" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="28" y="252" width="900" height="60" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="42" y="276" font-size="13" fill="#b4453c" font-weight="700">本机实测：env -i PATH=/usr/bin:/bin zsh -c 'command -v node' → NOT_FOUND</text>
<text x="42" y="296" font-size="11" fill="#1f2d3d">同一条命令在当前环境里返回 /Users/…/node → 说明「能不能跑」取决于 155 个环境变量里的某几个</text>
<text x="28" y="344" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">bootstrap 的四条纪律</text>
<text x="28" y="368" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">1. 先探测后安装：command -v node 命中且版本符合就跳过，不无脑重装。</text>
<text x="28" y="390" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">2. 每步可单独重跑：make bootstrap = deps + hooks + check 三个目标，任何一个失败都能单独重试。</text>
<text x="28" y="412" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">3. 结束时自检并打印版本矩阵：node / pnpm / python / docker 四行，版本不符合直接非零退出。</text>
<text x="28" y="434" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">4. 不写进 shell 启动文件：环境由项目内 .envrc（direnv）或容器提供，退出目录即失效。</text>
</svg>
