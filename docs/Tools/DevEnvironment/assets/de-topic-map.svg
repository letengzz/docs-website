<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="开发环境与终端工程：四层边界与七道关">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4453c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700">开发环境与终端工程：四层边界与七道关</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">从「机器」到「项目能跑」，每一层都有一个只在换机器时暴露的坑</text>
<rect x="28" y="96" width="900" height="62" rx="8" fill="#f4f7fa" stroke="#a9b7c5" stroke-width="1.4"/>
<text x="42" y="120" font-size="13" fill="#1f2d3d" font-weight="700">① 机器层：OS、CPU、磁盘、系统包</text>
<text x="42" y="140" font-size="11" fill="#1f2d3d">决定「能不能装」：glibc 版本、x86 与 arm、Apple 的 /var→/private/var</text>
<rect x="28" y="174" width="900" height="62" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="42" y="198" font-size="13" fill="#2a5d9f" font-weight="700">② Shell 层：启动文件、PATH、补全、别名</text>
<text x="42" y="218" font-size="11" fill="#1f2d3d">决定「你在哪个解释器里敲命令」：登录/交互/非交互读的文件不同，PATH 会重复叠加</text>
<rect x="28" y="252" width="900" height="62" rx="8" fill="#fbf3e2" stroke="#dcc08a" stroke-width="1.4"/>
<text x="42" y="276" font-size="13" fill="#8a5a12" font-weight="700">③ 运行时层：语言解释器与版本管理器</text>
<text x="42" y="296" font-size="11" fill="#1f2d3d">决定「同一行命令跑的是哪个版本」：nvm / fnm / asdf / volta 的 shim 与 PATH 顺序</text>
<rect x="28" y="330" width="900" height="62" rx="8" fill="#e9f5ee" stroke="#9ecfb1" stroke-width="1.4"/>
<text x="42" y="354" font-size="13" fill="#2f7d4f" font-weight="700">④ 项目层：依赖、任务脚本、容器</text>
<text x="42" y="374" font-size="11" fill="#1f2d3d">决定「别人能不能复现」：锁文件、.tool-versions、devcontainer、bootstrap 幂等</text>
<line x1="478" y1="160" x2="478" y2="172" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="478" y1="238" x2="478" y2="250" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="478" y1="316" x2="478" y2="328" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="42" y="470" width="118" height="34" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="101.0" y="491.0" font-size="12" fill="#2a5d9f" font-weight="600" text-anchor="middle">启动耗时</text>
<rect x="170" y="470" width="118" height="34" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="229.0" y="491.0" font-size="12" fill="#2a5d9f" font-weight="600" text-anchor="middle">PATH 重复</text>
<rect x="298" y="470" width="118" height="34" rx="8" fill="#fbf3e2" stroke="#dcc08a" stroke-width="1.4"/>
<text x="357.0" y="491.0" font-size="12" fill="#8a5a12" font-weight="600" text-anchor="middle">版本漂移</text>
<rect x="426" y="470" width="118" height="34" rx="8" fill="#fbf3e2" stroke="#dcc08a" stroke-width="1.4"/>
<text x="485.0" y="491.0" font-size="12" fill="#8a5a12" font-weight="600" text-anchor="middle">dotfiles 写穿</text>
<rect x="554" y="470" width="118" height="34" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="613.0" y="491.0" font-size="12" fill="#b4453c" font-weight="600" text-anchor="middle">密钥外泄</text>
<rect x="682" y="470" width="118" height="34" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="741.0" y="491.0" font-size="12" fill="#b4453c" font-weight="600" text-anchor="middle">远程不一致</text>
<rect x="810" y="470" width="118" height="34" rx="8" fill="#e9f5ee" stroke="#9ecfb1" stroke-width="1.4"/>
<text x="869.0" y="491.0" font-size="12" fill="#2f7d4f" font-weight="600" text-anchor="middle">复现失败</text>
<text x="28" y="528" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">七道关各自有判据族：SHL / PTH / DOT / RPR / SCT / RMT / SBD</text>
</svg>
