<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="同样是 zsh，三种模式读三套文件，差 52 倍">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4453c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700">同样是 zsh，三种模式读三套文件，差 52 倍</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">本机实测：空配置 14.2 ms，真实 .zshrc 746.0 ms，差的 660 ms 全在 nvm</text>
<rect x="28" y="92" width="292" height="150" rx="8" fill="#eaf1fa" stroke="#8fb0d6" stroke-width="1.4"/>
<text x="42" y="116" font-size="13" fill="#2a5d9f" font-weight="700">登录 + 交互（终端窗口）</text>
<text x="42" y="136" font-size="11" fill="#1f2d3d">/etc/zprofile</text>
<text x="42" y="156" font-size="11" fill="#1f2d3d">~/.zprofile</text>
<text x="42" y="176" font-size="11" fill="#1f2d3d">/etc/zshrc</text>
<text x="42" y="196" font-size="11" fill="#1f2d3d">~/.zshrc</text>
<text x="42" y="216" font-size="11" fill="#1f2d3d">~/.zlogin</text>
<rect x="334" y="92" width="292" height="150" rx="8" fill="#fbf3e2" stroke="#dcc08a" stroke-width="1.4"/>
<text x="348" y="116" font-size="13" fill="#8a5a12" font-weight="700">交互非登录（tmux 新窗格）</text>
<text x="348" y="136" font-size="11" fill="#1f2d3d">/etc/zshrc</text>
<text x="348" y="156" font-size="11" fill="#1f2d3d">~/.zshrc</text>
<text x="348" y="176" font-size="11" fill="#1f2d3d"></text>
<text x="348" y="196" font-size="11" fill="#1f2d3d">（不读 .zprofile）</text>
<rect x="640" y="92" width="292" height="150" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="654" y="116" font-size="13" fill="#b4453c" font-weight="700">非交互（脚本 / CI / 子进程）</text>
<text x="654" y="136" font-size="11" fill="#1f2d3d">只读 $ZDOTDIR/.zshenv</text>
<text x="654" y="156" font-size="11" fill="#1f2d3d"></text>
<text x="654" y="176" font-size="11" fill="#1f2d3d">不读 .zshrc</text>
<text x="654" y="196" font-size="11" fill="#1f2d3d">→ PATH 与交互 shell 不同</text>
<text x="28" y="274" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">本机实测（zsh 5.9，macOS x64，各 12~15 次取 p50）</text>
<text x="28" y="310" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">空 .zshrc（ZDOTDIR 隔离）</text>
<rect x="300" y="296" width="520" height="16" rx="3" fill="#eef2f6"/>
<rect x="300" y="296" width="10.4" height="16" rx="3" fill="#a9b7c5"/>
<text x="828" y="310" font-size="11" fill="#1f2d3d" font-weight="400" text-anchor="start">14.2 ms</text>
<text x="28" y="344" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">+ nvm.sh --no-use</text>
<rect x="300" y="330" width="520" height="16" rx="3" fill="#eef2f6"/>
<rect x="300" y="330" width="67.60000000000001" height="16" rx="3" fill="#2f7d4f"/>
<text x="828" y="344" font-size="11" fill="#1f2d3d" font-weight="400" text-anchor="start">97.9 ms</text>
<text x="28" y="378" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">+ nvm.sh（默认，会 use default）</text>
<rect x="300" y="364" width="520" height="16" rx="3" fill="#eef2f6"/>
<rect x="300" y="364" width="468.0" height="16" rx="3" fill="#b4453c"/>
<text x="828" y="378" font-size="11" fill="#1f2d3d" font-weight="400" text-anchor="start">673.8 ms</text>
<text x="28" y="412" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">+ nvm bash_completion</text>
<rect x="300" y="398" width="520" height="16" rx="3" fill="#eef2f6"/>
<rect x="300" y="398" width="504.4" height="16" rx="3" fill="#b4453c"/>
<text x="828" y="412" font-size="11" fill="#1f2d3d" font-weight="400" text-anchor="start">724.1 ms</text>
<text x="28" y="446" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">真实 ~/.zshrc 全量</text>
<rect x="300" y="432" width="520" height="16" rx="3" fill="#eef2f6"/>
<rect x="300" y="432" width="520.0" height="16" rx="3" fill="#b4453c"/>
<text x="828" y="446" font-size="11" fill="#1f2d3d" font-weight="400" text-anchor="start">746.0 ms</text>
<text x="28" y="486" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">结论：`--no-use` 把 nvm 的初始化从 660 ms 降到 80 ms（8.2 倍）；它只是「先解析默认版本」，</text>
<text x="28" y="508" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">真正要用时再 `nvm use`。终端每开一个窗口就付一次这笔钱。</text>
</svg>
