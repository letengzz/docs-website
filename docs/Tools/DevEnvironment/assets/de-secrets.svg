<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="export 的密钥躺在每个子进程的环境里，ps eww 就能读出来">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4453c"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700">export 的密钥躺在每个子进程的环境里，ps eww 就能读出来</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">本机实测：子进程带 DB_PASSWORD 启动后，ps eww -p <pid> 输出 19,793 字节里能搜到明文</text>
<rect x="28" y="96" width="430" height="96" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="42" y="120" font-size="13" fill="#b4453c" font-weight="700">写在 .zshrc 里</text>
<text x="42" y="140" font-size="11" fill="#1f2d3d">export API_KEY=sk-****（明文）</text>
<text x="42" y="160" font-size="11" fill="#1f2d3d">→ 之后每个子进程都继承</text>
<rect x="28" y="216" width="430" height="96" rx="8" fill="#fbeceb" stroke="#dda49e" stroke-width="1.4"/>
<text x="42" y="240" font-size="13" fill="#b4453c" font-weight="700">谁看得到</text>
<text x="42" y="260" font-size="11" fill="#1f2d3d">同机任意用户：ps eww -p <pid></text>
<text x="42" y="280" font-size="11" fill="#1f2d3d">崩溃转储 / 日志 / 子进程上报</text>
<text x="42" y="300" font-size="11" fill="#1f2d3d">备份与 dotfiles 同步</text>
<line x1="243" y1="192" x2="243" y2="214" stroke="#b4453c" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="500" y="96" width="432" height="96" rx="8" fill="#e9f5ee" stroke="#9ecfb1" stroke-width="1.4"/>
<text x="514" y="120" font-size="13" fill="#2f7d4f" font-weight="700">最小暴露写法</text>
<text x="514" y="140" font-size="11" fill="#1f2d3d">DB_PASSWORD=... cmd（只给这一条命令）</text>
<text x="514" y="160" font-size="11" fill="#1f2d3d">局部变量不 export → 子进程看不到</text>
<rect x="500" y="216" width="432" height="96" rx="8" fill="#e9f5ee" stroke="#9ecfb1" stroke-width="1.4"/>
<text x="514" y="240" font-size="13" fill="#2f7d4f" font-weight="700">更好的写法</text>
<text x="514" y="260" font-size="11" fill="#1f2d3d">op run --env-file=.env.tpl -- cmd</text>
<text x="514" y="280" font-size="11" fill="#1f2d3d">keychain / secret manager 按需注入</text>
<line x1="716" y1="192" x2="716" y2="214" stroke="#2f7d4f" stroke-width="1.6" marker-end="url(#arg)"/>
<text x="28" y="348" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">本机实测</text>
<text x="28" y="372" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">· export DB_PASSWORD=… 后启动子进程：子进程 'DB_PASSWORD' in os.environ → True</text>
<text x="28" y="394" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">· DB_PASSWORD=… python -c …（不 export）：同一判断 → False</text>
<text x="28" y="416" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">· ps eww -p <pid> 平均输出 19.7 KB，其中含完整环境变量 → 密钥在进程存活期内一直可读</text>
<text x="28" y="450" font-size="12" fill="#b4453c" font-weight="400" text-anchor="start">判据：仓库与启动文件里不得出现形如 sk- / AKIA / BEGIN PRIVATE 的字面量；应改用 .envrc + 密钥管理器。</text>
</svg>
