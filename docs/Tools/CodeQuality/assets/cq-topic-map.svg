<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="代码质量平台专题地图：从总览到门禁、集成、安全与实战">
  <defs>
    <marker id="cq-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">代码质量平台：一条从「能不能装」到「敢不敢拦」的路</text>

  <rect x="30" y="64" width="252" height="86" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="48" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">1. 总览：四条边界</text>
  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#334155">机器判 / 人判的分界</text>
  <text x="48" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#334155">先定口径，再定阈值</text>

  <rect x="324" y="64" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="342" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. 静态分析与检测器</text>
  <text x="342" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#334155">六个信息层次</text>
  <text x="342" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#334155">七类检测器的能力上限</text>

  <rect x="618" y="64" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="636" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. 平台与部署</text>
  <text x="636" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#334155">五个组件、七个阶段</text>
  <text x="636" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#334155">版本钉住 + 逐 LTA 升级</text>

  <path d="M 156 150 L 156 176" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>
  <path d="M 450 150 L 450 176" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>
  <path d="M 744 150 L 744 176" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>

  <rect x="30" y="184" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">4. 规则定制</text>
  <text x="48" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#334155">规则 / profile / 门禁三者关系</text>
  <text x="48" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#334155">准入三条、退出四条</text>

  <rect x="324" y="184" width="252" height="86" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="342" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">5. 质量门禁设计</text>
  <text x="342" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#334155">新代码口径是地基</text>
  <text x="342" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#334155">阈值定值三步骤</text>

  <rect x="618" y="184" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="636" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e">6. 流水线与 PR 集成</text>
  <text x="636" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#334155">四个集成点是一个漏斗</text>
  <text x="636" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#334155">五条纪律 + 门禁等待</text>

  <path d="M 156 270 L 156 296" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>
  <path d="M 450 270 L 450 296" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>
  <path d="M 744 270 L 744 296" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-map-arrow)"/>

  <rect x="30" y="304" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">7. 安全分析</text>
  <text x="48" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#334155">源 / 传播 / 净化器 / 汇</text>
  <text x="48" y="370" font-family="system-ui, sans-serif" font-size="11" fill="#334155">误报有出路、漏报要盯</text>

  <rect x="324" y="304" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="342" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">8. 实战：六步落地</text>
  <text x="342" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#334155">钉版本 → 定口径 → 取分布</text>
  <text x="342" y="370" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 定阈值 → 报告 → 阻断</text>

  <rect x="618" y="304" width="252" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="636" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">9. 常见问题</text>
  <text x="636" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#334155">按现象分诊 + 十二问</text>
  <text x="636" y="370" font-family="system-ui, sans-serif" font-size="11" fill="#334155">二十项上线自查</text>

  <rect x="30" y="416" width="840" height="118" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="52" y="444" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">贯穿全部九页的三句话</text>
  <text x="52" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#334155">一、判据唯一性：一条规则只有一个实现。手写的脚本备注与声明，都不算判据 —— 反复出场的「静默失效」正是这么来的。</text>
  <text x="52" y="494" font-family="system-ui, sans-serif" font-size="12" fill="#334155">二、先量再调：阈值与规则都要有「从机器输出读出来的」依据，不从模式里推。</text>
  <text x="52" y="518" font-family="system-ui, sans-serif" font-size="12" fill="#334155">三、绿不等于干净：门禁绿只表示这次变更没让情况变糟，存量仍在库里、仍在趋势上。</text>
</svg>
