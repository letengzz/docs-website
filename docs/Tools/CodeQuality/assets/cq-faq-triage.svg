<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="代码质量平台问题分诊：按现象定位到页">
  <defs>
    <marker id="cq-faq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">先按现象分诊，再翻页</text>

  <rect x="30" y="70" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="88" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">「装了但门禁从来不红」</text>
  <text x="48" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 门禁设计（条件是否被静默跳过）</text>
  <rect x="466" y="70" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="88" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">「第一次扫描就全红」</text>
  <text x="484" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 总览（新代码口径没定义）</text>

  <rect x="30" y="126" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="144" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">「覆盖率条件永远通过」</text>
  <text x="48" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 流水线集成（报告没上传）</text>
  <rect x="466" y="126" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="144" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">「分析任务一直 PENDING」</text>
  <text x="484" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 平台与部署（计算引擎没起来）</text>

  <rect x="30" y="182" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">「容器反复重启」</text>
  <text x="48" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 平台与部署（宿主机 mmap / 句柄）</text>
  <rect x="466" y="182" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">「升级到一半数据库迁移失败」</text>
  <text x="484" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 平台与部署（跳过了中间 LTA）</text>

  <rect x="30" y="238" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">「本地没报，CI 上报」</text>
  <text x="48" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 规则定制（规则集版本不一致）</text>
  <rect x="466" y="238" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">「同一处代码报了三遍」</text>
  <text x="484" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 规则定制（规则未做裁决）</text>

  <rect x="30" y="294" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="312" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">「一堆注入其实不可能被利用」</text>
  <text x="48" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 安全分析（净化器未声明）</text>
  <rect x="466" y="294" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="312" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">「删掉校验代码后反而没报了」</text>
  <text x="484" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 安全分析（净化器被移除 = 漏报）</text>

  <rect x="30" y="350" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="368" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6">「免费版想开 PR 分析」</text>
  <text x="48" y="386" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 平台与部署（许可边界，不是配置）</text>
  <rect x="466" y="350" width="404" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="484" y="368" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5b21b6">「要完整走一遍怎么排」</text>
  <text x="484" y="386" font-family="system-ui, sans-serif" font-size="11" fill="#334155">→ 实战（六步 + CQ-A ~ CQ-H 判据）</text>

  <rect x="30" y="406" width="840" height="58" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="52" y="430" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">分诊的第一条纪律：先分「哪一层」再分「什么问题」</text>
  <text x="52" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#334155">链路上有四段：扫描器 / 服务端计算 / 数据库 / 展示与反馈。任何现象先用一条 API 命令确定它在哪一段，再翻页。</text>
</svg>
