<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="污点分析的四个概念：源、传播、净化器与汇">
  <defs>
    <marker id="cq-taint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">污点分析的四个概念：一条链，断一处就不报</text>

  <rect x="30" y="66" width="188" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">① 源 Source</text>
  <text x="48" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#334155">外部可控数据的入口</text>
  <text x="48" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">HTTP 参数 / 请求头</text>
  <text x="48" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Cookie / 环境变量</text>
  <text x="48" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#334155">消息队列 / 文件内容</text>

  <path d="M 224 122 L 244 122" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-taint-arrow)"/>

  <rect x="252" y="66" width="188" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="270" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">② 传播 Propagation</text>
  <text x="270" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#334155">数据在程序内怎么流</text>
  <text x="270" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">赋值 / 字符串拼接</text>
  <text x="270" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#334155">集合存取 / 方法返回值</text>
  <text x="270" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#334155">引擎自动推断</text>

  <path d="M 446 122 L 466 122" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-taint-arrow)"/>

  <rect x="474" y="66" width="188" height="112" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="492" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">③ 净化器 Sanitizer</text>
  <text x="492" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#334155">能把污点洗掉的函数</text>
  <text x="492" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">占位符 / parseInt</text>
  <text x="492" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#334155">路径规范化 + 白名单</text>
  <text x="492" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">必须显式声明，否则误报</text>

  <path d="M 668 122 L 688 122" stroke="#0f172a" stroke-width="1.5" marker-end="url(#cq-taint-arrow)"/>

  <rect x="696" y="66" width="174" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="714" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">④ 汇 Sink</text>
  <text x="714" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#334155">污点到达就危险</text>
  <text x="714" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">SQL / 命令执行</text>
  <text x="714" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#334155">文件路径 / 反序列化</text>
  <text x="714" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#334155">模板渲染 / 日志</text>

  <rect x="30" y="198" width="840" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="224" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">报告的价值在「路径」，不在「一行」</text>
  <text x="52" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#334155">分析器给出的是「数据从某行的参数流入，经过哪几跳，到达某行的文件读取，中间没有净化」。</text>
  <text x="52" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#334155">这把「这里有安全问题」变成了「数据从哪来、经过哪几行、到哪去」—— 修复动作由此才可执行。</text>

  <rect x="30" y="298" width="410" height="106" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="324" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">误报的头号成因：净化器没被认识</text>
  <text x="48" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#334155">自研 SqlBuilder / 白名单枚举转换</text>
  <text x="48" y="364" font-family="system-ui, sans-serif" font-size="10" fill="#334155">→ 引擎不认识，一路报到底</text>
  <text x="48" y="386" font-family="system-ui, sans-serif" font-size="10" fill="#0f766e">首选：改写成引擎能推断的模式</text>

  <rect x="460" y="298" width="410" height="106" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="478" y="324" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">比误报更该盯的：漏报是静的</text>
  <text x="478" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#334155">校验代码被删掉之后，污点分析反而安静了</text>
  <text x="478" y="364" font-family="system-ui, sans-serif" font-size="10" fill="#334155">因为「绕过某个失败测试」而删校验，很常见</text>
  <text x="478" y="386" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">护栏：净化器类函数的改动纳入评审关注点</text>

  <rect x="30" y="420" width="840" height="84" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="52" y="446" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">三层能力 + 四类工具，都不是「四选一」</text>
  <text x="52" y="470" font-family="system-ui, sans-serif" font-size="11" fill="#334155">本专题（SAST）看你自己代码的成因 ｜ 依赖治理（SCA）看你引入的依赖的已知漏洞 ｜ DAST 看运行时可利用性 ｜ 密钥扫描看仓库历史</text>
  <text x="52" y="492" font-family="system-ui, sans-serif" font-size="11" fill="#334155">SAST 覆盖的是代码层级成因，无法替代 DAST 与渗透测试；反过来 DAST 也找不到未上线分支里的注入 —— 交集很小，都要做。</text>
</svg>
