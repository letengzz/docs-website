<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">效率投入账：多久回本</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">学习成本 ÷ 每周节省 = 回本周期；超过 3 个月的工具先别学</text>
  <text x="30" y="80" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">回本周期 = 学习与配置成本 ÷ 每周节省的时间</text>
  <rect x="30" y="100" width="700" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="52" y="124" text-anchor="start" font-size="10" fill="#065F46" font-weight="bold">模糊查找工具</text>
  <text x="300" y="124" text-anchor="start" font-size="8.4" fill="#047857">学习 2 小时</text>
  <text x="430" y="124" text-anchor="start" font-size="8.4" fill="#047857">每天省 5 分钟 → 每周约 25 分钟</text>
  <text x="700" y="124" text-anchor="end" font-size="9.5" fill="#065F46" font-weight="bold">约 5 周</text>
  <text x="52" y="144" text-anchor="start" font-size="8" fill="#64748B">越靠上的工具上手越快、回本越早——所以先学「天天用的」，别先啃框架</text>
  <rect x="30" y="168" width="700" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="52" y="192" text-anchor="start" font-size="10" fill="#1E3A8A" font-weight="bold">提示符与别名</text>
  <text x="300" y="192" text-anchor="start" font-size="8.4" fill="#1D4ED8">配置 1 小时</text>
  <text x="430" y="192" text-anchor="start" font-size="8.4" fill="#1D4ED8">每天省 2 分钟 → 每周约 10 分钟</text>
  <text x="700" y="192" text-anchor="end" font-size="9.5" fill="#1E3A8A" font-weight="bold">约 6 周</text>
  <text x="52" y="212" text-anchor="start" font-size="8" fill="#64748B">越靠上的工具上手越快、回本越早——所以先学「天天用的」，别先啃框架</text>
  <rect x="30" y="236" width="700" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="52" y="260" text-anchor="start" font-size="10" fill="#991B1B" font-weight="bold">自动化脚本框架</text>
  <text x="300" y="260" text-anchor="start" font-size="8.4" fill="#B91C1C">学习 20 小时</text>
  <text x="430" y="260" text-anchor="start" font-size="8.4" fill="#B91C1C">每周省 30 分钟</text>
  <text x="700" y="260" text-anchor="end" font-size="9.5" fill="#991B1B" font-weight="bold">约 40 周</text>
  <text x="52" y="280" text-anchor="start" font-size="8" fill="#64748B">越靠上的工具上手越快、回本越早——所以先学「天天用的」，别先啃框架</text>
  <rect x="30" y="312" width="700" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="333" text-anchor="middle" font-size="8.6" fill="#334155">结论：回本周期超过 3 个月的工具，先记在待办里，等真的被它卡住再学</text>
  <text x="380" y="352" text-anchor="middle" font-size="8.6" fill="#334155">效率工具的选择顺序应该是：先用起来 → 再用熟 → 最后才优化</text>
  <text x="380" y="396" text-anchor="middle" font-size="9" fill="#64748B">上表为便于理解的估算示例，实际收益取决于你的工作内容与使用频率</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
