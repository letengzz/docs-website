<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">该不该自动化：三个标准 + 一笔账</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">频率 × 耗时 × 稳定性三者同时满足才值得；否则脚本本身就是负债</text>
  <text x="30" y="80" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">三个标准同时满足，才值得自动化</text>
  <rect x="30" y="92" width="226" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="143" y="110.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">高频</text>
  <text x="143" y="127" text-anchor="middle" font-size="8" fill="#047857">每周 ≥ 3 次</text>
  <text x="143" y="145.4" text-anchor="middle" font-size="8" fill="#047857">低频任务手做更快</text>
  <rect x="267" y="92" width="226" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="110.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">耗时</text>
  <text x="380" y="127" text-anchor="middle" font-size="8" fill="#1D4ED8">单次 ≥ 1 分钟</text>
  <text x="380" y="145.4" text-anchor="middle" font-size="8" fill="#1D4ED8">几秒钟的事不值得写脚本</text>
  <rect x="504" y="92" width="226" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="617" y="110.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">稳定</text>
  <text x="617" y="127" text-anchor="middle" font-size="8" fill="#0F766E">输入可预期</text>
  <text x="617" y="145.4" text-anchor="middle" font-size="8" fill="#0F766E">靠 UI 坐标点的必定失效</text>
  <text x="30" y="212" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">算一笔账（估算，非精确）：</text>
  <rect x="30" y="224" width="700" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="245" text-anchor="middle" font-size="9" fill="#334155">每天 5 次 × 每次 2 分钟 × 每年 250 个工作日 = 约 41 小时</text>
  <text x="380" y="265" text-anchor="middle" font-size="8.4" fill="#64748B">写脚本 + 调试按 3 小时计 → 大约 9 个工作日回本，之后全是净收益</text>
  <text x="30" y="316" text-anchor="start" font-size="10.5" fill="#B91C1C" font-weight="bold">不该自动化的三种情况</text>
  <rect x="30" y="328" width="700" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="349" text-anchor="middle" font-size="8.4" fill="#B91C1C">① 一次性任务（写脚本的时间比手工做完更久）</text>
  <text x="380" y="368" text-anchor="middle" font-size="8.4" fill="#B91C1C">② 输入不稳定（每次都要人判断，脚本只会把判断藏起来）③ 依赖 UI 坐标</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
