<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">笔记体系：三层流转 + 两条硬规则</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">收集要快、整理要慢、输出要狠；文件格式的寿命比工具长</text>
  <rect x="30" y="76" width="226" height="106" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">收集箱 Inbox</text>
  <text x="143" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">怎么快怎么来</text>
  <text x="143" y="129.4" text-anchor="middle" font-size="8" fill="#6D28D9">唯一要求：当天能倒空</text>
  <text x="143" y="147.8" text-anchor="middle" font-size="8" fill="#6D28D9">不在此处分类</text>
  <rect x="267" y="76" width="226" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">结构化笔记</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#1D4ED8">一页一个概念</text>
  <text x="380" y="129.4" text-anchor="middle" font-size="8" fill="#1D4ED8">双向链接成网</text>
  <text x="380" y="147.8" text-anchor="middle" font-size="8" fill="#1D4ED8">放长期维护的东西</text>
  <rect x="504" y="76" width="226" height="106" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="617" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">输出物</text>
  <text x="617" y="111" text-anchor="middle" font-size="8" fill="#047857">文档 / 周报 / 方案</text>
  <text x="617" y="129.4" text-anchor="middle" font-size="8" fill="#047857">输出时再回查笔记</text>
  <text x="617" y="147.8" text-anchor="middle" font-size="8" fill="#047857">输出反过来整理笔记</text>
  <line x1="257" y1="129" x2="266" y2="129" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="261.5" y="124" text-anchor="middle" font-size="7.5" fill="#64748B">整理</text>
  <line x1="494" y1="129" x2="503" y2="129" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="498.5" y="124" text-anchor="middle" font-size="7.5" fill="#64748B">引用</text>
  <text x="30" y="212" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">笔记库的两条硬规则</text>
  <rect x="30" y="224" width="336" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="198" y="242.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">本地优先</text>
  <text x="198" y="259" text-anchor="middle" font-size="8" fill="#0F766E">文件是纯 Markdown，放在本地目录</text>
  <text x="198" y="277.4" text-anchor="middle" font-size="8" fill="#0F766E">工具换了笔记还在</text>
  <rect x="394" y="224" width="336" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="562" y="242.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">版本化</text>
  <text x="562" y="259" text-anchor="middle" font-size="8" fill="#0F766E">整个笔记库就是一个 Git 仓库</text>
  <text x="562" y="277.4" text-anchor="middle" font-size="8" fill="#0F766E">改错能回滚，换机能克隆</text>
  <rect x="30" y="326" width="700" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="347" text-anchor="middle" font-size="8.4" fill="#B91C1C">常见翻车：把笔记全放在只有某个 App 能读的格式里</text>
  <text x="380" y="366" text-anchor="middle" font-size="8.4" fill="#B91C1C">换工具时导出乱码、图片全丢——笔记的寿命通常比工具长得多</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
