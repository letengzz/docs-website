<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">工具链协同：五个位置，一条链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">单点工具再强，链路断了就得手工搬运——断点才是效率损失的大头</text>
  <rect x="30" y="76" width="132" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">任务/需求</text>
  <text x="96" y="111" text-anchor="middle" font-size="7.6" fill="#334155">issue / 待办</text>
  <line x1="163" y1="122" x2="173" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="174" y="76" width="132" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="240" y="94.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">编辑器 / IDE</text>
  <text x="240" y="111" text-anchor="middle" font-size="7.6" fill="#4338CA">写代码、改配置</text>
  <line x1="307" y1="122" x2="317" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="318" y="76" width="132" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="384" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">终端 + Git</text>
  <text x="384" y="111" text-anchor="middle" font-size="7.6" fill="#1D4ED8">跑命令、提交、推送</text>
  <line x1="451" y1="122" x2="461" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="462" y="76" width="132" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="528" y="94.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">捕获</text>
  <text x="528" y="111" text-anchor="middle" font-size="7.6" fill="#0F766E">截图、笔记、日志</text>
  <line x1="595" y1="122" x2="605" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="606" y="76" width="132" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="672" y="94.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">自动化</text>
  <text x="672" y="111" text-anchor="middle" font-size="7.6" fill="#C2410C">快捷键、定时、批量</text>
  <text x="30" y="200" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">链路的价值在于「不用手工搬运」</text>
  <rect x="30" y="212" width="167" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="113.5" y="230.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">IDE 里跳终端</text>
  <text x="113.5" y="247" text-anchor="middle" font-size="7.6" fill="#6D28D9">快捷键直接开在项目目录</text>
  <rect x="208" y="212" width="167" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="291.5" y="230.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">终端里开编辑器</text>
  <text x="291.5" y="247" text-anchor="middle" font-size="7.6" fill="#1D4ED8">code . / idea . 反向唤起</text>
  <rect x="386" y="212" width="167" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="469.5" y="230.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">截图直达文档</text>
  <text x="469.5" y="247" text-anchor="middle" font-size="7.6" fill="#047857">截图落进 assets/ 再引用</text>
  <rect x="564" y="212" width="167" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="647.5" y="230.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">提交信息带任务号</text>
  <text x="647.5" y="247" text-anchor="middle" font-size="7.6" fill="#C2410C">issue 与提交一一对应</text>
  <rect x="30" y="316" width="700" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="337" text-anchor="middle" font-size="8.4" fill="#92400E">判断链路是否通了的办法：看一天里有几次「手工复制粘贴搬运信息」</text>
  <text x="380" y="356" text-anchor="middle" font-size="8.4" fill="#92400E">每次搬运都是链路断点；把最高频的那个断点接上，收益立刻可见</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
