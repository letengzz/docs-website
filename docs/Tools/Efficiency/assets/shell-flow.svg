<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="392" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">命令行提效链路：五个高频动作，各配一个工具</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每个动作只挑一个工具，装完立刻用得上；不要一次装十个再挑</text>
  <rect x="30" y="76" width="132" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="96" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">找文件</text>
  <text x="96" y="111" text-anchor="middle" font-size="7.6" fill="#4338CA">fzf</text>
  <text x="96" y="128.48" text-anchor="middle" font-size="7.6" fill="#4338CA">模糊匹配 + 实时预览</text>
  <rect x="174" y="76" width="132" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="240" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">搜内容</text>
  <text x="240" y="111" text-anchor="middle" font-size="7.6" fill="#1D4ED8">rg</text>
  <text x="240" y="128.48" text-anchor="middle" font-size="7.6" fill="#1D4ED8">按 .gitignore 过滤</text>
  <rect x="318" y="76" width="132" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="384" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">看内容</text>
  <text x="384" y="111" text-anchor="middle" font-size="7.6" fill="#0F766E">bat</text>
  <text x="384" y="128.48" text-anchor="middle" font-size="7.6" fill="#0F766E">语法高亮 + 行号</text>
  <rect x="462" y="76" width="132" height="104" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="528" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">跳目录</text>
  <text x="528" y="111" text-anchor="middle" font-size="7.6" fill="#047857">zoxide</text>
  <text x="528" y="128.48" text-anchor="middle" font-size="7.6" fill="#047857">按「频率 + 新近度」</text>
  <rect x="606" y="76" width="132" height="104" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="672" y="94.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">处理数据</text>
  <text x="672" y="111" text-anchor="middle" font-size="7.6" fill="#C2410C">jq</text>
  <text x="672" y="128.48" text-anchor="middle" font-size="7.6" fill="#C2410C">JSON 切片与改形</text>
  <text x="30" y="204" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">组合起来用：一条命令串起「搜 → 选 → 看」</text>
  <rect x="30" y="216" width="700" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="244" text-anchor="middle" font-size="9" fill="#334155">rg -l "TODO" | fzf --preview 'bat --color=always {}'</text>
  <text x="30" y="286" text-anchor="start" font-size="10.5" fill="#065F46" font-weight="bold">别名与函数：把「记得住的缩写」写进 profile，而不是靠记忆敲长命令</text>
  <rect x="30" y="298" width="700" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="319" text-anchor="middle" font-size="8.4" fill="#047857">alias gs="git status -sb"      alias ll="eza -lah --git"</text>
  <text x="380" y="338" text-anchor="middle" font-size="8.4" fill="#047857">function mkcd() { mkdir -p "$1" &amp;&amp; cd "$1"; }   # 建目录并进入</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#64748B">一次只装一个工具、立刻用一周；用得上的才留下来，装完就忘的果断删掉</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
