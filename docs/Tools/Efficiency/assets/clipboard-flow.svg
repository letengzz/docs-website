<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="388" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">剪贴板：三种形态、两条链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">富文本 / 纯文本 / 图片各有各的坑；历史剪贴板必须先谈安全</text>
  <rect x="30" y="76" width="216" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="138" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">富文本</text>
  <text x="138" y="111" text-anchor="middle" font-size="8" fill="#1D4ED8">带格式/样式</text>
  <text x="138" y="129.4" text-anchor="middle" font-size="8" fill="#1D4ED8">粘到编辑器最易翻车</text>
  <rect x="260" y="76" width="216" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="368" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">纯文本</text>
  <text x="368" y="111" text-anchor="middle" font-size="8" fill="#047857">最安全的默认</text>
  <text x="368" y="129.4" text-anchor="middle" font-size="8" fill="#047857">粘代码首选</text>
  <rect x="490" y="76" width="216" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="598" y="94.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">图片/文件</text>
  <text x="598" y="111" text-anchor="middle" font-size="8" fill="#C2410C">截图与文件路径</text>
  <text x="598" y="129.4" text-anchor="middle" font-size="8" fill="#C2410C">粘到终端是路径</text>
  <text x="30" y="200" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">剪贴板历史：能翻回 20 步以内的内容，是效率工具里性价比最高的一项</text>
  <rect x="30" y="216" width="220" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="140" y="234.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 复制</text>
  <text x="140" y="251" text-anchor="middle" font-size="8" fill="#334155">Ctrl+C</text>
  <text x="140" y="269.4" text-anchor="middle" font-size="8" fill="#334155">进入历史队列</text>
  <line x1="251" y1="260" x2="269" y2="260" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="216" width="220" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="234.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">② 检索</text>
  <text x="380" y="251" text-anchor="middle" font-size="8" fill="#334155">按关键词翻历史</text>
  <text x="380" y="269.4" text-anchor="middle" font-size="8" fill="#334155">不用回去重找</text>
  <line x1="491" y1="260" x2="509" y2="260" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="216" width="220" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="620" y="234.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">③ 选择性粘贴</text>
  <text x="620" y="251" text-anchor="middle" font-size="8" fill="#334155">保留格式 / 纯文本</text>
  <text x="620" y="269.4" text-anchor="middle" font-size="8" fill="#334155">粘到目标应用的形态</text>
  <rect x="30" y="318" width="700" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="339" text-anchor="middle" font-size="8.4" fill="#B91C1C">安全提醒：剪贴板历史会把密码、Token、身份证号一并存下来</text>
  <text x="380" y="358" text-anchor="middle" font-size="8.4" fill="#B91C1C">用过密码管理器后要清空历史；公共/共享机器上不要开剪贴板云同步</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
