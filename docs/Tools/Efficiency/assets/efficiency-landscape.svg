<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">效率工具全景：五类工具，各管一段</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先按「它在工作流的哪一段」分类，再挑工具；不要按「谁更火」选</text>
  <rect x="30" y="76" width="132" height="112" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="96" y="94.2" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">① 终端与命令</text>
  <text x="96" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">终端模拟器</text>
  <text x="96" y="128.25" text-anchor="middle" font-size="7.5" fill="#4338CA">Shell 与提示符</text>
  <text x="96" y="145.5" text-anchor="middle" font-size="7.5" fill="#4338CA">命令行小工具</text>
  <rect x="174" y="76" width="132" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="240" y="94.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">② 输入与剪贴</text>
  <text x="240" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">输入法配置</text>
  <text x="240" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">剪贴板历史</text>
  <text x="240" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">文本扩展</text>
  <rect x="318" y="76" width="132" height="112" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="384" y="94.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">③ 捕获与检索</text>
  <text x="384" y="111" text-anchor="middle" font-size="7.5" fill="#047857">截图与标注</text>
  <text x="384" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">OCR 取字</text>
  <text x="384" y="145.5" text-anchor="middle" font-size="7.5" fill="#047857">全局快速检索</text>
  <rect x="462" y="76" width="132" height="112" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="528" y="94.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">④ 知识与记录</text>
  <text x="528" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">笔记库</text>
  <text x="528" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">双向链接</text>
  <text x="528" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">版本化归档</text>
  <rect x="606" y="76" width="132" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="672" y="94.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">⑤ 自动化</text>
  <text x="672" y="111" text-anchor="middle" font-size="7.5" fill="#C2410C">快捷键脚本</text>
  <text x="672" y="128.25" text-anchor="middle" font-size="7.5" fill="#C2410C">定时任务</text>
  <text x="672" y="145.5" text-anchor="middle" font-size="7.5" fill="#C2410C">批量处理</text>
  <text x="30" y="212" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">三原则：能在键盘上完成的不碰鼠标 · 能脚本化的不做第二次 · 只留每天真会用的</text>
  <rect x="30" y="224" width="700" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="245" text-anchor="middle" font-size="8.2" fill="#334155">① 键盘优先：鼠标往返一次平均 2 秒，一天 200 次就是 13 分钟</text>
  <text x="380" y="264" text-anchor="middle" font-size="8.2" fill="#334155">② 脚本优先：凡是要重复第三次的事，就写成脚本或快捷键</text>
  <rect x="30" y="294" width="700" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="315" text-anchor="middle" font-size="8.2" fill="#B91C1C">反面清单：收藏了 50 个工具一个没配 · 装 3 个启动器互抢同一个快捷键</text>
  <text x="380" y="334" text-anchor="middle" font-size="8.2" fill="#B91C1C">工具链没有版本化，换台机器要从零再来一遍</text>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#065F46">工具只是放大器：流程没想清楚，效率工具只会让你更快地做无用功</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
