<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">终端栈：四层各管什么，别搞混</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">界面（模拟器）与解释器（Shell）是两件事，混在一起排查会白折腾</text>
  <rect x="30" y="76" width="700" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="52" y="98" text-anchor="start" font-size="10.5" fill="#3730A3" font-weight="bold">终端模拟器</text>
  <text x="52" y="116" text-anchor="start" font-size="8.2" fill="#4338CA">Windows Terminal：标签、分屏、字体、GPU 渲染</text>
  <line x1="380" y1="127" x2="380" y2="137" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="138" width="700" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="52" y="160" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">Shell（解释器）</text>
  <text x="52" y="178" text-anchor="start" font-size="8.2" fill="#1D4ED8">PowerShell 7 / zsh：语法、管道、补全、别名</text>
  <line x1="380" y1="189" x2="380" y2="199" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="200" width="700" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="52" y="222" text-anchor="start" font-size="10.5" fill="#5B21B6" font-weight="bold">提示符层</text>
  <text x="52" y="240" text-anchor="start" font-size="8.2" fill="#6D28D9">starship：Git 状态、语言版本、命令耗时、退出码</text>
  <line x1="380" y1="251" x2="380" y2="261" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="262" width="700" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="52" y="284" text-anchor="start" font-size="10.5" fill="#065F46" font-weight="bold">命令行工具层</text>
  <text x="52" y="302" text-anchor="start" font-size="8.2" fill="#047857">rg / bat / fzf / zoxide / jq：一个工具只干一件事</text>
  <text x="30" y="336" text-anchor="start" font-size="10" fill="#1E293B" font-weight="bold">排查顺序自上而下，别跳层：</text>
  <text x="30" y="356" text-anchor="start" font-size="8.5" fill="#64748B">显示/复制粘贴异常 → 看终端模拟器；命令找不到或补全失效 → 看 Shell 的 PATH 与配置文件</text>
  <text x="30" y="374" text-anchor="start" font-size="8.5" fill="#64748B">提示符卡顿 → 看提示符层配置；命令结果不对 → 看工具参数，别急着重装</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
