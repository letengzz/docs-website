<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="多语言仓库依赖治理的五个阶段与产出">
  <rect x="0" y="0" width="900" height="480" fill="#f7fafc"/>
  <text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16324f">四个产物、五个阶段：每一步都要留下一个可验证的产物</text>
  <text x="30" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b7b">阶段 0 只问三个问题；从阶段 1 开始，每一阶段产出一个能被执行验证的具体东西。</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="84" width="140" height="64" rx="10" fill="#eef4f9" stroke="#2d7d9a" stroke-width="2"/>
    <text x="100" y="112" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">阶段 0</text>
    <text x="100" y="132" font-size="11" fill="#5a6b7b" text-anchor="middle">现状盘点</text>

    <rect x="185" y="84" width="455" height="64" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
    <text x="203" y="108" font-size="12" fill="#40566b">三个问题：有几个产物 · 从哪取依赖 · 有没有已有清单</text>
    <text x="203" y="130" font-size="12" fill="#a23b3b">决定后面做多深；本场景结论：4 个产物、两处直连公网、无已有清单</text>

    <rect x="655" y="84" width="215" height="64" rx="10" fill="#f1f5f9"/>
    <text x="762" y="112" font-size="11" font-weight="bold" fill="#16324f" text-anchor="middle">产出：盘点结论</text>
    <text x="762" y="132" font-size="10" fill="#8a97a3" text-anchor="middle">不留文件，但决定范围</text>

    <rect x="30" y="158" width="140" height="64" rx="10" fill="#eef4f9" stroke="#3fae8c" stroke-width="2"/>
    <text x="100" y="186" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">阶段 1</text>
    <text x="100" y="206" font-size="11" fill="#5a6b7b" text-anchor="middle">清点</text>

    <rect x="185" y="158" width="455" height="64" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
    <text x="203" y="182" font-size="12" fill="#40566b">4 份 SBOM（源码 / 产物 / 镜像三种粒度） + 归档 + 推入可按组件反查的库</text>
    <text x="203" y="204" font-size="12" fill="#a23b3b">关键自检：核对四份清单的组件数，并确认镜像清单里有 OS 包</text>

    <rect x="655" y="158" width="215" height="64" rx="10" fill="#eafaf4"/>
    <text x="762" y="186" font-size="11" font-weight="bold" fill="#1f6b4f" text-anchor="middle">产出：4 份 SBOM + 反查能力</text>
    <text x="762" y="206" font-size="10" fill="#8a97a3" text-anchor="middle">对应判据 P1~P6</text>

    <rect x="30" y="232" width="140" height="64" rx="10" fill="#eef4f9" stroke="#c47a2c" stroke-width="2"/>
    <text x="100" y="260" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">阶段 2</text>
    <text x="100" y="280" font-size="11" fill="#5a6b7b" text-anchor="middle">评估</text>

    <rect x="185" y="232" width="455" height="64" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
    <text x="203" y="256" font-size="12" fill="#40566b">漏洞队列二分（有 / 无修复版本）→ 三把尺子排优先级；许可证找禁止档与 UNKNOWN</text>
    <text x="203" y="278" font-size="12" fill="#a23b3b">KEV 命中即 P0（当日）；UNKNOWN 按禁止处理，不是"待定"</text>

    <rect x="655" y="232" width="215" height="64" rx="10" fill="#fdf7ec"/>
    <text x="762" y="260" font-size="11" font-weight="bold" fill="#8a5312" text-anchor="middle">产出：两份可执行清单</text>
    <text x="762" y="280" font-size="10" fill="#8a97a3" text-anchor="middle">对应判据 P7~P9</text>

    <rect x="30" y="306" width="140" height="64" rx="10" fill="#eef4f9" stroke="#6b5bd2" stroke-width="2"/>
    <text x="100" y="334" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">阶段 3</text>
    <text x="100" y="354" font-size="11" fill="#5a6b7b" text-anchor="middle">准入</text>

    <rect x="185" y="306" width="455" height="64" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
    <text x="203" y="330" font-size="12" fill="#40566b">三个生态统一收进私服 + 三处冷却期（私服 / 机器人 / PR 检查）+ 来源校验</text>
    <text x="203" y="352" font-size="12" fill="#a23b3b">冷却期少配一处，就有一个入口能绕过"新版陷阱"防护</text>

    <rect x="655" y="306" width="215" height="64" rx="10" fill="#f3f0fd"/>
    <text x="762" y="334" font-size="11" font-weight="bold" fill="#16324f" text-anchor="middle">产出：唯一合法入口</text>
    <text x="762" y="354" font-size="10" fill="#8a97a3" text-anchor="middle">对应判据 P10</text>

    <rect x="30" y="380" width="140" height="64" rx="10" fill="#eef4f9" stroke="#a23b3b" stroke-width="2"/>
    <text x="100" y="408" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">阶段 4</text>
    <text x="100" y="428" font-size="11" fill="#5a6b7b" text-anchor="middle">门禁</text>

    <rect x="185" y="380" width="455" height="64" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
    <text x="203" y="404" font-size="12" fill="#40566b">四条阻断门禁（锁文件 / 版本固定 / 许可证 / 漏洞）+ 存量限时 + 清单完整性提示</text>
    <text x="203" y="426" font-size="12" fill="#a23b3b">先冻结增量、再清存量；存量用「每周净减少数」跟踪，不一次性全清</text>

    <rect x="655" y="380" width="215" height="64" rx="10" fill="#fdf3f3"/>
    <text x="762" y="408" font-size="11" font-weight="bold" fill="#a23b3b" text-anchor="middle">产出：会拦住你的流水线</text>
    <text x="762" y="428" font-size="10" fill="#8a97a3" text-anchor="middle">对应判据 P11、P12</text>
  </g>

  <text x="450" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">最终检验只有一项（P6）：给一个组件名，能在 10 分钟内列出哪些产物、哪个版本包含它。做不到，前面全是文件。</text>
</svg>
