<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="依赖治理分诊表：症状对应卡在哪一层">
  <rect x="0" y="0" width="900" height="470" fill="#f7fafc"/>
  <text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16324f">分诊表：先定位卡在哪一层，再谈怎么修</text>
  <text x="30" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b7b">把「清单层」的问题当成「门禁层」的问题去修，会一直修不好 —— 这是最常见的误诊。</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="84" width="140" height="80" rx="10" fill="#2d7d9a"/>
    <text x="100" y="118" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">清点层</text>
    <text x="100" y="140" font-size="11" fill="#d9edf5" text-anchor="middle">有没有清单</text>

    <rect x="185" y="84" width="685" height="80" rx="10" fill="#ffffff" stroke="#c7d7e4" stroke-width="1.5"/>
    <text x="203" y="110" font-size="12" fill="#40566b">「客户问某个 CVE 影不影响，答不上来」→ 清单在文件里但不可检索</text>
    <text x="203" y="132" font-size="12" fill="#40566b">「扫描器说没漏洞，但我们确实用了有漏洞的组件」→ 组件识别没覆盖（版本猜错 / 只扫语言生态 / 没扫镜像）</text>
    <text x="203" y="154" font-size="12" fill="#a23b3b">「前端依赖 1200 个」→ 传递依赖占比高是常态，先建清单，不要试图靠"减少依赖"绕过</text>

    <rect x="30" y="174" width="140" height="80" rx="10" fill="#3fae8c"/>
    <text x="100" y="208" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">评估层</text>
    <text x="100" y="230" font-size="11" fill="#dff4ec" text-anchor="middle">结论怎么排</text>

    <rect x="185" y="174" width="685" height="80" rx="10" fill="#ffffff" stroke="#c7d7e4" stroke-width="1.5"/>
    <text x="203" y="200" font-size="12" fill="#40566b">「一堆高危，没人知道先修哪个」→ 缺优先级口径（KEV / EPSS / 可达性），不是缺漏洞数据</text>
    <text x="203" y="222" font-size="12" fill="#40566b">「两个扫描器结果不一样」→ 数据源与版本区间匹配不同，这是常态；人工确认差异，不要试图修成一致</text>
    <text x="203" y="244" font-size="12" fill="#a23b3b">「无修复版本的和有修复版本的混在一个队列」→ 队列结构错误，先二分</text>

    <rect x="30" y="264" width="140" height="80" rx="10" fill="#c47a2c"/>
    <text x="100" y="298" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">准入层</text>
    <text x="100" y="320" font-size="11" fill="#fbeeda" text-anchor="middle">进来的包对不对</text>

    <rect x="185" y="264" width="685" height="80" rx="10" fill="#ffffff" stroke="#c7d7e4" stroke-width="1.5"/>
    <text x="203" y="290" font-size="12" fill="#40566b">「上游发了毒版本，我们三天后才知道」→ 缺冷却期（私服 / 机器人 / PR 检查三处都要配）</text>
    <text x="203" y="312" font-size="12" fill="#40566b">「私有包被公网同名包顶掉」→ 依赖混淆：聚合仓库成员顺序错，私有包必须加组织前缀</text>
    <text x="203" y="334" font-size="12" fill="#a23b3b">「构建脚本直连公网 curl 二进制」→ 绕过私服、绕过扫描、绕过清单</text>

    <rect x="30" y="354" width="140" height="80" rx="10" fill="#6b5bd2"/>
    <text x="100" y="388" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">门禁层</text>
    <text x="100" y="410" font-size="11" fill="#e7e3fb" text-anchor="middle">能不能拦住</text>

    <rect x="185" y="354" width="685" height="80" rx="10" fill="#ffffff" stroke="#c7d7e4" stroke-width="1.5"/>
    <text x="203" y="380" font-size="12" fill="#40566b">「装了个扫描器，一年后告警比之前还多」→ 只有评估没有阻断，缺的是门禁</text>
    <text x="203" y="402" font-size="12" fill="#40566b">「法务说不能用某个组件，但代码已经上线」→ 许可证检查做在发布之后，必须前移</text>
    <text x="203" y="424" font-size="12" fill="#a23b3b">「门禁老失败，大家开始加 continue-on-error」→ 强度没分档；正确做法是冻结增量 + 存量限时</text>
  </g>

  <text x="450" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">误诊的代价：在清点层缺清单时去调门禁阈值，会陷入"反复调整、始终无效"的循环。</text>
</svg>
