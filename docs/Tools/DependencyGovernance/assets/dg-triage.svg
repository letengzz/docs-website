<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 484" width="900" height="484" role="img" aria-label="漏洞优先级分诊：三把尺子、组合矩阵与队列二分">
  <rect x="0" y="0" width="900" height="484" fill="#f7fafc"/>
  <text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16324f">从「几百条告警」到「一份任务清单」</text>
  <text x="30" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b7b">单一指标排序一定会错；三把尺子叠加 + 队列二分，才得到可执行的任务。</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="84" width="270" height="88" rx="10" fill="#eef4f9" stroke="#2d7d9a" stroke-width="2"/>
    <text x="165" y="112" font-size="15" font-weight="bold" fill="#16324f" text-anchor="middle">尺子一 · CVSS v4.0</text>
    <text x="165" y="136" font-size="12" fill="#40566b" text-anchor="middle">「如果被利用，后果多严重」</text>
    <text x="165" y="158" font-size="12" fill="#a23b3b" text-anchor="middle">不含利用概率，不能单独当优先级</text>

    <rect x="315" y="84" width="270" height="88" rx="10" fill="#eef4f9" stroke="#3fae8c" stroke-width="2"/>
    <text x="450" y="112" font-size="15" font-weight="bold" fill="#16324f" text-anchor="middle">尺子二 · EPSS</text>
    <text x="450" y="136" font-size="12" fill="#40566b" text-anchor="middle">「未来 30 天被利用的概率」（0~1）</text>
    <text x="450" y="158" font-size="12" fill="#8a3535" text-anchor="middle">用来在严重度相同的条目里排序</text>

    <rect x="600" y="84" width="270" height="88" rx="10" fill="#fdf3f3" stroke="#a23b3b" stroke-width="2"/>
    <text x="735" y="112" font-size="15" font-weight="bold" fill="#16324f" text-anchor="middle">尺子三 · KEV</text>
    <text x="735" y="136" font-size="12" fill="#40566b" text-anchor="middle">「是否已被证实有人在用」（是 / 否）</text>
    <text x="735" y="158" font-size="12" fill="#a23b3b" text-anchor="middle">命中即压过其余一切信号</text>

    <path d="M165 176 L165 196 L450 196" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M450 176 L450 196" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M735 176 L735 196 L450 196" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M450 196 L450 212" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow3)"/>
  </g>

  <rect x="30" y="216" width="840" height="132" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="216" width="840" height="30" rx="10" fill="#eaf1f7"/>
    <text x="50" y="236" font-size="12" font-weight="bold" fill="#16324f">KEV</text>
    <text x="130" y="236" font-size="12" font-weight="bold" fill="#16324f">EPSS</text>
    <text x="230" y="236" font-size="12" font-weight="bold" fill="#16324f">CVSS</text>
    <text x="330" y="236" font-size="12" font-weight="bold" fill="#16324f">有修复版本</text>
    <text x="470" y="236" font-size="12" font-weight="bold" fill="#16324f">处置</text>

    <line x1="30" y1="262" x2="870" y2="262" stroke="#e6edf3" stroke-width="1"/>
    <line x1="30" y1="292" x2="870" y2="292" stroke="#e6edf3" stroke-width="1"/>
    <line x1="30" y1="322" x2="870" y2="322" stroke="#e6edf3" stroke-width="1"/>

    <text x="50" y="256" font-size="12" fill="#a23b3b">是</text>
    <text x="130" y="256" font-size="12" fill="#5a6b7b">任意</text>
    <text x="230" y="256" font-size="12" fill="#5a6b7b">任意</text>
    <text x="330" y="256" font-size="12" fill="#5a6b7b">任意</text>
    <text x="470" y="256" font-size="12" font-weight="bold" fill="#a23b3b">P0 立即（当前迭代，紧急通道；无补丁先上缓解）</text>

    <text x="50" y="286" font-size="12" fill="#5a6b7b">否</text>
    <text x="130" y="286" font-size="12" fill="#3fae8c">≥ 0.1</text>
    <text x="230" y="286" font-size="12" fill="#5a6b7b">高 / 严重</text>
    <text x="330" y="286" font-size="12" fill="#3fae8c">是</text>
    <text x="470" y="286" font-size="12" font-weight="bold" fill="#1f6b4f">P1 本迭代（升级即可修）</text>

    <text x="50" y="316" font-size="12" fill="#5a6b7b">否</text>
    <text x="130" y="316" font-size="12" fill="#5a6b7b">&lt; 0.1</text>
    <text x="230" y="316" font-size="12" fill="#5a6b7b">高 / 严重</text>
    <text x="330" y="316" font-size="12" fill="#5a6b7b">是</text>
    <text x="470" y="316" font-size="12" font-weight="bold" fill="#1f4e79">P2 排期（纳入常规升级窗口）</text>

    <text x="50" y="340" font-size="12" fill="#5a6b7b">否</text>
    <text x="130" y="340" font-size="12" fill="#5a6b7b">&lt; 0.1</text>
    <text x="230" y="340" font-size="12" fill="#5a6b7b">中 / 低</text>
    <text x="330" y="340" font-size="12" fill="#5a6b7b">是</text>
    <text x="470" y="340" font-size="12" font-weight="bold" fill="#5a6b7b">P3 合并（随大版本升级一起带走）</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="364" width="410" height="80" rx="10" fill="#eafaf4" stroke="#3fae8c" stroke-width="2"/>
    <text x="48" y="390" font-size="14" font-weight="bold" fill="#1f6b4f">队列 A · 有修复版本（可执行任务）</text>
    <text x="48" y="412" font-size="12" fill="#40566b">升级即可解决；按 P0~P3 排期，纳入迭代计划。</text>
    <text x="48" y="432" font-size="12" fill="#40566b">责任人：研发；节奏：跟随迭代。</text>

    <rect x="460" y="364" width="410" height="80" rx="10" fill="#fdf7ec" stroke="#c47a2c" stroke-width="2"/>
    <text x="478" y="390" font-size="14" font-weight="bold" fill="#8a5312">队列 B · 无修复版本（缓解通道）</text>
    <text x="478" y="412" font-size="12" fill="#40566b">不参与上面排序；评估缓解措施、等待上游、评估替换。</text>
    <text x="478" y="432" font-size="12" fill="#40566b">责任人：架构 / 安全；节奏：按季度复查。</text>

    <text x="450" y="470" font-size="12" font-weight="bold" fill="#a23b3b" text-anchor="middle">自检：如果当前队列第一页里一半以上是「不能升」的条目，说明队列结构错了。</text>
  </g>

  <defs>
    <marker id="dgArrow3" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
