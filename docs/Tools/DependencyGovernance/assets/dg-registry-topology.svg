<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="私服拓扑：聚合、本地与代理仓库">
  <rect x="0" y="0" width="900" height="500" fill="#f7fafc"/>
  <text x="30" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16324f">私服拓扑：唯一合法入口在哪里</text>
  <text x="30" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b7b">要点有两个：出口必须被阻断（否则拓扑形同虚设），聚合仓库的成员顺序必须显式确认（否则私有包会被顶掉）。</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="92" width="150" height="70" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="2"/>
    <text x="105" y="122" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">开发者</text>
    <text x="105" y="144" font-size="11" fill="#5a6b7b" text-anchor="middle">.npmrc / settings.xml</text>

    <rect x="30" y="182" width="150" height="70" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="2"/>
    <text x="105" y="212" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">流水线</text>
    <text x="105" y="234" font-size="11" fill="#5a6b7b" text-anchor="middle">构建 / 拉基础镜像</text>

    <path d="M184 127 L216 127" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow5)"/>
    <path d="M184 217 L216 217" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow5)"/>

    <rect x="220" y="92" width="170" height="160" rx="10" fill="#eef4f9" stroke="#1f4e79" stroke-width="2.5"/>
    <text x="305" y="122" font-size="14" font-weight="bold" fill="#16324f" text-anchor="middle">聚合仓库 group</text>
    <text x="305" y="146" font-size="11" fill="#40566b" text-anchor="middle">统一对外地址</text>
    <text x="305" y="168" font-size="11" fill="#a23b3b" text-anchor="middle">成员顺序 = 优先级</text>
    <text x="305" y="196" font-size="11" fill="#5a6b7b" text-anchor="middle">① 本地仓库 优先</text>
    <text x="305" y="214" font-size="11" fill="#5a6b7b" text-anchor="middle">② 代理仓库 兜底</text>
    <text x="305" y="240" font-size="10" fill="#8a97a3" text-anchor="middle">顺序错 → 依赖混淆</text>

    <path d="M394 140 L426 140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow5)"/>
    <path d="M394 205 L426 205" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow5)"/>

    <rect x="430" y="92" width="170" height="76" rx="10" fill="#eafaf4" stroke="#3fae8c" stroke-width="2"/>
    <text x="515" y="118" font-size="13" font-weight="bold" fill="#1f6b4f" text-anchor="middle">本地仓库 hosted</text>
    <text x="515" y="140" font-size="11" fill="#40566b" text-anchor="middle">自有构建产物 / 私有包</text>
    <text x="515" y="158" font-size="11" fill="#1f6b4f" text-anchor="middle">推荐：私有包加组织前缀</text>

    <rect x="430" y="184" width="170" height="76" rx="10" fill="#fdf7ec" stroke="#c47a2c" stroke-width="2"/>
    <text x="515" y="210" font-size="13" font-weight="bold" fill="#8a5312" text-anchor="middle">代理仓库 proxy</text>
    <text x="515" y="232" font-size="11" fill="#40566b" text-anchor="middle">缓存 + 封禁 + 冷却</text>
    <text x="515" y="250" font-size="11" fill="#8a5312" text-anchor="middle">准入控制的主要落点</text>

    <path d="M604 222 L636 222" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#dgArrow5)"/>

    <rect x="640" y="184" width="230" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="755" y="210" font-size="13" font-weight="bold" fill="#16324f" text-anchor="middle">公网源（受控访问）</text>
    <text x="755" y="232" font-size="11" fill="#40566b" text-anchor="middle">npm / Maven / PyPI / OCI 上游</text>
    <text x="755" y="250" font-size="11" fill="#a23b3b" text-anchor="middle">只允许代理仓库访问，出口封锁</text>

    <path d="M604 268 L636 300" stroke="#a23b3b" stroke-width="2.5" marker-end="url(#dgArrow5r)" stroke-dasharray="6 4"/>
    <rect x="640" y="286" width="230" height="52" rx="8" fill="#fdf3f3" stroke="#a23b3b" stroke-width="1.5"/>
    <text x="755" y="308" font-size="12" font-weight="bold" fill="#a23b3b" text-anchor="middle">开发者 / 流水线 直连公网 = 禁止</text>
    <text x="755" y="328" font-size="11" fill="#8a3535" text-anchor="middle">这一条不做，前面所有拓扑都失效</text>
  </g>

  <rect x="30" y="356" width="840" height="122" rx="10" fill="#ffffff" stroke="#dbe4ec" stroke-width="1.5"/>
  <text x="48" y="382" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16324f">四种准入手段（强度递进，缺一种就有一类攻击能绕过）</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="48" y="396" width="192" height="66" rx="8" fill="#eef4f9"/>
    <text x="144" y="418" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">① 代理与隔离</text>
    <text x="144" y="438" font-size="11" fill="#40566b" text-anchor="middle">解决「从哪拿」</text>
    <text x="144" y="454" font-size="10" fill="#8a97a3" text-anchor="middle">文档写"请用私服"是不够的</text>

    <rect x="252" y="396" width="192" height="66" rx="8" fill="#fdf7ec"/>
    <text x="348" y="418" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">② 封禁</text>
    <text x="348" y="438" font-size="11" fill="#40566b" text-anchor="middle">解决「能不能拿这个」</text>
    <text x="348" y="454" font-size="10" fill="#8a97a3" text-anchor="middle">按组件 + 版本区间，不要只封单版本</text>

    <rect x="456" y="396" width="192" height="66" rx="8" fill="#eafaf4"/>
    <text x="552" y="418" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">③ 冷却期</text>
    <text x="552" y="438" font-size="11" fill="#40566b" text-anchor="middle">解决「能不能现在拿」</text>
    <text x="552" y="454" font-size="10" fill="#8a97a3" text-anchor="middle">恶意版本寿命通常只有几小时</text>

    <rect x="660" y="396" width="192" height="66" rx="8" fill="#f3f0fd"/>
    <text x="756" y="418" font-size="12" font-weight="bold" fill="#16324f" text-anchor="middle">④ 来源校验</text>
    <text x="756" y="438" font-size="11" fill="#40566b" text-anchor="middle">解决「是不是官方构建的」</text>
    <text x="756" y="454" font-size="10" fill="#8a97a3" text-anchor="middle">校验失败即阻断，不允许降级放行</text>
  </g>

  <defs>
    <marker id="dgArrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="dgArrow5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a23b3b"/>
    </marker>
  </defs>
</svg>
