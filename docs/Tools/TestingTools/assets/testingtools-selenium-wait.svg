<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="426" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">UI 自动化的等待策略与 POM 分层</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">80% 的「UI 用例偶发失败」来自等待写法，剩下 20% 来自定位方式与用例耦合</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">UI 自动化的两个核心工程问题：等待怎么写、用例怎么组织</text>
  <text x="40" y="108" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">等待的三种写法与取舍</text>
  <rect x="20" y="120" width="236" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="138" y="138.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">强制等待 Thread.sleep</text>
  <text x="138" y="155" text-anchor="middle" font-size="7.5" fill="#B91C1C">不推荐：白等固定时长</text>
  <text x="138" y="172.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">慢机器上仍会偶发失败</text>
  <text x="138" y="189.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">唯一合理场景：演示</text>
  <rect x="268" y="120" width="236" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="386" y="138.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">隐式等待 ImplicitlyWait</text>
  <text x="386" y="155" text-anchor="middle" font-size="7.5" fill="#B45309">全局生效、只对查找元素有效</text>
  <text x="386" y="172.25" text-anchor="middle" font-size="7.5" fill="#B45309">与显式等待混用会产生</text>
  <text x="386" y="189.5" text-anchor="middle" font-size="7.5" fill="#B45309">不可预测的叠加超时</text>
  <rect x="516" y="120" width="236" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="634" y="138.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">显式等待 WebDriverWait</text>
  <text x="634" y="155" text-anchor="middle" font-size="7.5" fill="#047857">推荐：按条件轮询到满足</text>
  <text x="634" y="172.25" text-anchor="middle" font-size="7.5" fill="#047857">条件用 ExpectedConditions</text>
  <text x="634" y="189.5" text-anchor="middle" font-size="7.5" fill="#047857">可精确设置超时与忽略异常</text>
  <text x="380" y="226" text-anchor="middle" font-size="10" fill="#991B1B">一条纪律：全项目只用显式等待；隐式等待设成 0，否则两类等待的叠加时间无法推理</text>
  <line x1="20" y1="248" x2="740" y2="248" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="40" y="272" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">页对象模型（POM）的正确分层</text>
  <rect x="20" y="284" width="174" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="107" y="302.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">页面层 Page Object</text>
  <text x="107" y="319" text-anchor="middle" font-size="7.5" fill="#1D4ED8">只放元素定位与页面动作</text>
  <text x="107" y="336.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不写断言、不做流程编排</text>
  <rect x="206" y="284" width="174" height="82" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="293" y="302.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">组件层 Component</text>
  <text x="293" y="319" text-anchor="middle" font-size="7.5" fill="#6D28D9">导航栏 / 弹窗等复用块</text>
  <text x="293" y="336.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">避免各页面重复定位串</text>
  <rect x="392" y="284" width="174" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="479" y="302.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">用例层 Test</text>
  <text x="479" y="319" text-anchor="middle" font-size="7.5" fill="#047857">只写业务步骤与断言</text>
  <text x="479" y="336.25" text-anchor="middle" font-size="7.5" fill="#047857">数据由外部供给（CSV/JSON）</text>
  <rect x="578" y="284" width="174" height="82" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="302.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">支撑层 Base / Util</text>
  <text x="665" y="319" text-anchor="middle" font-size="7.5" fill="#334155">驱动创建与销毁、配置</text>
  <text x="665" y="336.25" text-anchor="middle" font-size="7.5" fill="#334155">等待封装、截图、重试</text>
  <text x="380" y="384" text-anchor="middle" font-size="10" fill="#991B1B">反例：把 assert 写进 Page Object，导致「改一个断言要动页面类」，用例无法复用</text>
  <text x="380" y="408" text-anchor="middle" font-size="9.5" fill="#065F46">稳定性三件套：稳定的定位（优先 data-testid）· 独立的用例数据 · 失败自动截图与页面源码</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
