<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="454" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Selenium 架构：绑定 / 协议 / 驱动三层</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">换语言只换第一层，协议与驱动不变——这是 Selenium 能跨语言跨浏览器的原因</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Selenium 是「客户端库 + 协议 + 驱动」三层，理解了协议就不怕换语言</text>
  <rect x="20" y="96" width="170" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="114.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">测试代码与语言绑定</text>
  <text x="105" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Java / Python / .NET / JS / Ruby</text>
  <text x="105" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">统一暴露 WebDriver API</text>
  <text x="105" y="165.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Option 类取代 DesiredCapabilities</text>
  <line x1="190" y1="137" x2="240" y2="137" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="215" y="132" text-anchor="middle" font-size="7.5" fill="#64748B">W3C WebDriver</text>
  <rect x="240" y="96" width="180" height="82" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="330" y="114.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">协议层（HTTP / WebSocket）</text>
  <text x="330" y="131" text-anchor="middle" font-size="7.5" fill="#6D28D9">经典命令走 W3C WebDriver 协议</text>
  <text x="330" y="148.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">事件与拦截走 BiDi</text>
  <line x1="420" y1="137" x2="470" y2="137" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="470" y="96" width="270" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="605" y="114.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">驱动进程 + 浏览器</text>
  <text x="605" y="131" text-anchor="middle" font-size="7.5" fill="#047857">chromedriver / geckodriver / msedgedriver</text>
  <text x="605" y="148.25" text-anchor="middle" font-size="7.5" fill="#047857">由 Selenium Manager 自动下载与缓存</text>
  <line x1="380" y1="180" x2="380" y2="204" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="380" y1="204" x2="380" y2="214" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="60" y="214" width="640" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="232.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">BiDi（WebDriver BiDirectional Protocol）：Selenium 4 的主线演进</text>
  <text x="380" y="249" text-anchor="middle" font-size="7.5" fill="#0F766E">CDP（Chrome DevTools Protocol）只能驱动 Chromium 系，且 Selenium 5 将移除仅走 CDP 的 API</text>
  <text x="380" y="266.25" text-anchor="middle" font-size="7.5" fill="#0F766E">BiDi 是 W3C 标准方向：跨浏览器的事件订阅、网络拦截、下载与模拟命令都走它</text>
  <text x="40" y="306" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">Grid 4 的两种形态（都用于横向扩容，不改变上面三层结构）</text>
  <rect x="20" y="318" width="348" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="194" y="336.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">经典 Grid（Hub + Node）</text>
  <text x="194" y="353" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Router / Distributor / SessionMap</text>
  <text x="194" y="370.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">容器镜像官方维护，可 K8s 部署</text>
  <rect x="392" y="318" width="348" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="566" y="336.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">动态 Grid（Docker 按需起节点）</text>
  <text x="566" y="353" text-anchor="middle" font-size="7.5" fill="#6D28D9">视频录制与实时查看会话</text>
  <text x="566" y="370.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">注意 Docker API 版本要求</text>
  <text x="380" y="412" text-anchor="middle" font-size="10" fill="#065F46">本地跑通判据：不手工装驱动，执行后能在日志里看到 Selenium Manager 的实际下载记录</text>
  <text x="380" y="436" text-anchor="middle" font-size="9.5" fill="#64748B">版本提示：Selenium Manager 自 4.6 起内置；4.37 起不再支持 Python 3.9；CDP-only 写法请尽早迁到 BiDi</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
