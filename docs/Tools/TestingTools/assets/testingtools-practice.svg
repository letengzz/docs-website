<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：接口回归 + 压测基线的一体化流水线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">功能断言与性能基线共用一份脚本与一份夹具，才谈得上「可重复」</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">实战：给「下单接口」建可重复的接口回归 + 压测流水线</text>
  <rect x="20" y="96" width="136" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="88" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">① 建夹具</text>
  <text x="88" y="131" text-anchor="middle" font-size="7" fill="#334155">用容器起依赖</text>
  <text x="88" y="147.1" text-anchor="middle" font-size="7" fill="#334155">固定种子数据</text>
  <text x="88" y="163.2" text-anchor="middle" font-size="7" fill="#334155">每次运行前重置</text>
  <line x1="156" y1="142" x2="168" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="168" y="96" width="136" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="236" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">② 接口回归</text>
  <text x="236" y="131" text-anchor="middle" font-size="7" fill="#1D4ED8">JMeter 断言器</text>
  <text x="236" y="147.1" text-anchor="middle" font-size="7" fill="#1D4ED8">错误率必须为 0</text>
  <text x="236" y="163.2" text-anchor="middle" font-size="7" fill="#1D4ED8">产物存 HTML 报告</text>
  <line x1="304" y1="142" x2="316" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="316" y="96" width="136" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="384" y="114.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">③ 契约校验</text>
  <text x="384" y="131" text-anchor="middle" font-size="7" fill="#6D28D9">OpenAPI 生成用例</text>
  <text x="384" y="147.1" text-anchor="middle" font-size="7" fill="#6D28D9">字段缺失即失败</text>
  <text x="384" y="163.2" text-anchor="middle" font-size="7" fill="#6D28D9">防「悄悄改字段」</text>
  <line x1="452" y1="142" x2="464" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="464" y="96" width="136" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="532" y="114.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">④ 压测基线</text>
  <text x="532" y="131" text-anchor="middle" font-size="7" fill="#047857">固定并发阶梯</text>
  <text x="532" y="147.1" text-anchor="middle" font-size="7" fill="#047857">记录 p95 与 TPS</text>
  <text x="532" y="163.2" text-anchor="middle" font-size="7" fill="#047857">与上一版对比</text>
  <line x1="600" y1="142" x2="612" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="612" y="96" width="136" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="680" y="114.2" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">⑤ 门禁与告警</text>
  <text x="680" y="131" text-anchor="middle" font-size="7" fill="#C2410C">退化超阈值阻断</text>
  <text x="680" y="147.1" text-anchor="middle" font-size="7" fill="#C2410C">报告归档到 CI</text>
  <text x="680" y="163.2" text-anchor="middle" font-size="7" fill="#C2410C">失败自动留现场</text>
  <text x="380" y="208" text-anchor="middle" font-size="10" fill="#6D28D9">关键：压测与功能回归跑在**同一份**脚本上，避免「功能脚本」与「压测脚本」两套各修各的 bug</text>
  <rect x="20" y="228" width="720" height="130" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="40" y="248" text-anchor="start" font-size="9.5" fill="#0F172A" font-weight="bold">可直接抄的命令（JMeter CLI + 非 GUI 模式）</text>
  <text x="36" y="268" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ docker compose up -d db redis      # 起依赖与固定种子数据</text>
  <text x="36" y="290" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ jmeter -n -t order.jmx -l result.jtl -e -o report/ -Jthreads=50 -Jrampup=50 -Jduration=300</text>
  <text x="36" y="312" text-anchor="start" font-size="8.5" fill="#334155">summary +   3120 in 00:05:00 =   10.4/s Avg:   142 Min:    38 Max:  2188 Err:     0 (0.00%)</text>
  <text x="36" y="334" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ jmeter -n -t order.jmx -l base.jtl -e -o base/    # 基线版本，用于对比</text>
  <text x="36" y="356" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ python cmp_report.py base/ report/ --fail-on 'p95&gt;1.10' --fail-on 'err&gt;0.005'</text>
  <text x="380" y="378" text-anchor="middle" font-size="10" fill="#065F46">可验证的收尾：流水线在本地 docker compose 环境下跑通，两次运行的 p95 差异 &lt; 5%</text>
  <text x="380" y="402" text-anchor="middle" font-size="9.5" fill="#B45309">若两次差异远大于 5%，先查压测环境（压测机、网络、依赖数据量），不要急着调业务代码</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
