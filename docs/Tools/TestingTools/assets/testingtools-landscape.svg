<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="512" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">测试工具全景：五层金字塔与工具落点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份代码，五层用五种工具；把重工具放进快反馈层，是团队最常见的浪费</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">测试分层与工具落点：越往上越慢越脆，所以比例必须倒过来</text>
  <rect x="80.0" y="96" width="600" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">性能测试 / 容量验证</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#B91C1C">JMeter · k6（本专题主线 JMeter）</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">比例最低：按发布周期跑，不进每次提交</text>
  <rect x="125.0" y="166" width="510" height="64" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="184.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">UI 自动化（端到端）</text>
  <text x="380" y="201" text-anchor="middle" font-size="7.5" fill="#C2410C">Selenium 4 + WebDriver BiDi</text>
  <text x="380" y="218.25" text-anchor="middle" font-size="7.5" fill="#C2410C">只覆盖关键链路，忌「全量录屏式」用例</text>
  <rect x="170.0" y="236" width="420" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="254.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">接口自动化 / 契约</text>
  <text x="380" y="271" text-anchor="middle" font-size="7.5" fill="#6D28D9">HTTP 断言 · Schema 校验 · 契约回归</text>
  <text x="380" y="288.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">性价比最高：快、稳、定位准</text>
  <rect x="215.0" y="306" width="330" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="324.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">集成测试</text>
  <text x="380" y="341" text-anchor="middle" font-size="7.5" fill="#1D4ED8">多组件协作 · 数据库与 MQ 真连</text>
  <text x="380" y="358.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">用容器化依赖保证可重复</text>
  <rect x="260.0" y="376" width="240" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="394.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">单元测试</text>
  <text x="380" y="411" text-anchor="middle" font-size="7.5" fill="#047857">JUnit / Vitest / pytest</text>
  <text x="380" y="428.25" text-anchor="middle" font-size="7.5" fill="#047857">量最大：反馈最快，定位最准</text>
  <text x="380" y="470" text-anchor="middle" font-size="10" fill="#6D28D9">工具选型只看两件事：能不能在 CI 里稳定跑（防抖动），以及失败时能不能一眼定位</text>
  <text x="380" y="494" text-anchor="middle" font-size="9.5" fill="#64748B">边界：本专题讲「用什么工具、脚本怎么写」；策略与门禁见 Tools/CICD/Testing 与 Frontend/Testing</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
