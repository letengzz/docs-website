<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="484" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">接口自动化的三层结构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">数据与用例分离、断言分三级、契约进 CI 门禁——这是接口测试能长期维护的唯一方式</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">接口自动化 = 数据驱动 + 分层断言 + CI 门禁，缺一层都会退化成人肉点按钮</text>
  <rect x="20" y="96" width="720" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 1 层 · 用例与数据分离</text>
  <text x="380" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">用例只描述「输入 → 期望」，具体账号、商品 ID、时间等由 CSV / JSON / 数据库夹具提供</text>
  <text x="380" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">同一份用例跑 dev/staging/prod 只需换数据文件与环境变量，不改脚本</text>
  <line x1="380" y1="160" x2="380" y2="172" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="172" width="720" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="190.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">第 2 层 · 分层断言（三级都要有）</text>
  <text x="380" y="207" text-anchor="middle" font-size="7.5" fill="#6D28D9">状态码与业务码（快速定位是哪一层坏了）→ 字段类型与必填（Schema 校验）→ 关键字段值（业务正确性）</text>
  <text x="380" y="224.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">只断言「status == 200」等于没测；只做全量字段比对又会被无关变更频繁打断</text>
  <line x1="380" y1="236" x2="380" y2="248" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="248" width="720" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="266.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">第 3 层 · 契约与回归门禁</text>
  <text x="380" y="283" text-anchor="middle" font-size="7.5" fill="#047857">用 OpenAPI 生成契约用例，接口改字段时在 CI 阶段就报错，而不是等线上 500</text>
  <text x="380" y="300.25" text-anchor="middle" font-size="7.5" fill="#047857">门禁口径：错误用例数 = 0 才允许合并；性能基线下降超阈值需人工确认</text>
  <text x="40" y="340" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四种常见「看起来在测但没测到」的写法</text>
  <rect x="20" y="348" width="140" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="90" y="365" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">反模式</text>
  <rect x="160" y="348" width="300" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="310" y="365" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">表现</text>
  <rect x="460" y="348" width="280" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="600" y="365" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">改法</text>
  <rect x="20" y="374" width="140" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="390" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">占位断言</text>
  <rect x="160" y="374" width="300" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="310" y="390" text-anchor="middle" font-size="8.5" fill="#334155">只校验响应非空</text>
  <rect x="460" y="374" width="280" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="390" text-anchor="middle" font-size="8.5" fill="#334155">改为断言业务码与关键字段</text>
  <rect x="20" y="398" width="140" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="414" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">硬编码环境</text>
  <rect x="160" y="398" width="300" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="310" y="414" text-anchor="middle" font-size="8.5" fill="#334155">URL 写死在脚本里</text>
  <rect x="460" y="398" width="280" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="414" text-anchor="middle" font-size="8.5" fill="#334155">环境变量 + 配置档案切换</text>
  <rect x="20" y="422" width="140" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="438" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">用例相互依赖</text>
  <rect x="160" y="422" width="300" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="310" y="438" text-anchor="middle" font-size="8.5" fill="#334155">B 用例依赖 A 先跑</text>
  <rect x="460" y="422" width="280" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="438" text-anchor="middle" font-size="8.5" fill="#334155">每条用例自建前置数据</text>
  <rect x="20" y="446" width="140" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="462" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">无清理逻辑</text>
  <rect x="160" y="446" width="300" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="310" y="462" text-anchor="middle" font-size="8.5" fill="#334155">数据越积越多</text>
  <rect x="460" y="446" width="280" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="462" text-anchor="middle" font-size="8.5" fill="#334155">后置钩子删除或在容器里重建库</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
