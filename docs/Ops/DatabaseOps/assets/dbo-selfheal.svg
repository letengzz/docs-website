<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">自愈的三档处置与双条件闸门</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">误动作的代价远高于漏救——闸门要按「不可逆性」设计，不按「紧急程度」设计</text>
<rect x="36" y="96" width="280" height="70" rx="6" fill="#15803d"/>
<text x="48" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">第一档 · 自动处置</text>
<text x="48" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">确定、可逆、影响面已知</text>
<text x="48" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">例：杀掉 idle in transaction</text>
<rect x="340" y="96" width="280" height="70" rx="6" fill="#b45309"/>
<text x="352" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">第二档 · 自动 + 通知</text>
<text x="352" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">可逆但要留痕</text>
<text x="352" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">例：终止长事务、重建索引</text>
<rect x="644" y="96" width="280" height="70" rx="6" fill="#be123c"/>
<text x="656" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">第三档 · 只报不动</text>
<text x="656" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">不可逆或影响面不明</text>
<text x="656" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">例：切主、扩盘、改参数</text>
<rect x="36" y="196" width="288" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="216" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">闸门：单条件 vs 双条件</text>
<text x="48" y="234" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">单条件「>95% 就动手」：5000 次仿真误动作 5.64%</text>
<text x="48" y="249" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">双条件「连续 3 点 >95% 且斜率 >0」：0.00%</text>
<text x="48" y="264" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价：检出率 50.3% → 44.0%</text>
<text x="48" y="279" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">结论：宁可少救 6 个点，不可多动 5 个点</text>
<rect x="348" y="196" width="288" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="360" y="216" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">熔断：一小时最多动几次</text>
<text x="360" y="234" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一对象 1 小时内最多 1 次</text>
<text x="360" y="249" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一机群 1 小时内最多 2 次</text>
<text x="360" y="264" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">超限转「只报不动」并升级</text>
<text x="360" y="279" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">熔断状态本身要进台账</text>
<rect x="660" y="196" width="264" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="672" y="216" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">必须留的三样</text>
<text x="672" y="234" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">动作前后的取值</text>
<text x="672" y="249" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">触发它的判据与采样点</text>
<text x="672" y="264" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">谁批准的（人或策略版本）</text>
<rect x="36" y="356" width="888" height="56" rx="6" fill="#e0f2fe"/>
<text x="48" y="377" font-size="12" font-weight="700" fill="#075985" font-family="PingFang SC, Helvetica, Arial, sans-serif">自愈的边界：只处理「有明确反向操作」的故障。凡是要「先判断再决定」的（比如是不是该切主），一律进第三档。</text>
<text x="36" y="442" font-size="11.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">反例：磁盘 92% 时自动删归档日志——它在「正常波动」时删掉的是唯一可恢复的备份，这不是自愈，是加速事故。</text>
</svg>
