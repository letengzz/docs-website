<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">清单三来源与四类漂移</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">清单的价值不在「有一份文件」，而在「能算出哪几台与它不一致」</text>
<rect x="36" y="96" width="270" height="76" rx="6" fill="#0f766e"/>
<text x="48" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">来源一 · 声明式清单</text>
<text x="48" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">YAML / 表：版本、参数、扩展</text>
<text x="48" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">人改它，机器不许改</text>
<rect x="345" y="96" width="270" height="76" rx="6" fill="#0f766e"/>
<text x="357" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">来源二 · 实际探测</text>
<text x="357" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">pg_settings / SHOW VARIABLES</text>
<text x="357" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">扩展、账号、复制槽</text>
<rect x="654" y="96" width="270" height="76" rx="6" fill="#0f766e"/>
<text x="666" y="117" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">来源三 · 台账与工单</text>
<text x="666" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">谁在什么时候改的</text>
<text x="666" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">变更单号与审批痕迹</text>
<line x1="306" y1="134" x2="345" y2="134" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="615" y1="134" x2="654" y2="134" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="36" y="196" width="888" height="48" rx="6" fill="#1d4ed8"/>
<text x="48" y="217" font-size="12.5" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">对账：三路取交集，只差分「声明 ↔ 实际」这两路（台账用来解释差异，不用来判定）</text>
<line x1="480" y1="172" x2="480" y2="196" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="36" y="264" width="250" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="284" font-size="12" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">D1 值漂移</text>
<text x="60" y="298" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">声明 16MB，实际 4MB</text>
<text x="300" y="292" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">有意的临时调整未回写，或被人手工改过</text>
<rect x="36" y="320" width="250" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="340" font-size="12" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">D2 缺项</text>
<text x="60" y="354" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">清单要求 `pg_stat_statements`，实际没装</text>
<text x="300" y="348" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">新实例未按基线初始化</text>
<rect x="36" y="376" width="250" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="396" font-size="12" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">D3 多项</text>
<text x="60" y="410" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">清单没有 `pg_cron`，实际装了</text>
<text x="300" y="404" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">历史遗留，或在清单之外被加装</text>
<rect x="36" y="432" width="250" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="452" font-size="12" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">D4 版本漂移</text>
<text x="60" y="466" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">清单 18.6，实际 18.4</text>
<text x="300" y="460" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">补丁未跟上，或从旧镜像克隆</text>
<text x="36" y="500" font-size="11" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">四类漂移的处置完全不同：D1 要回写或确认豁免，D2 要补，D3 要删或入清单，D4 要排升级窗口。</text>
</svg>
