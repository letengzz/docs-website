<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="486" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">容量预测：MAPE 会骗人</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">四种方法在同一个合成序列上的两组误差——排序并不一致</text>
<text x="36" y="100" font-size="11.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">方法</text>
<text x="180" y="100" font-size="11.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">14 天 MAPE</text>
<text x="330" y="100" font-size="11.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">「还有几天到阈值」误差</text>
<text x="560" y="100" font-size="11.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">适用与失效</text>
<rect x="36" y="116" width="888" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="36" y="116" width="6" height="50" fill="#15803d"/>
<text x="54" y="146" font-size="12.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">线性拟合</text>
<text x="180" y="146" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">2.03%</text>
<text x="330" y="146" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">4.7%</text>
<text x="560" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">增长稳定、无拐点时最稳</text>
<rect x="36" y="174" width="888" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="36" y="174" width="6" height="50" fill="#0369a1"/>
<text x="54" y="204" font-size="12.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">近 7 天斜率</text>
<text x="180" y="204" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">2.27%</text>
<text x="330" y="204" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">12.5%</text>
<text x="560" y="204" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">对拐点最敏感，也最容易被周周期骗</text>
<rect x="36" y="232" width="888" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="36" y="232" width="6" height="50" fill="#b45309"/>
<text x="54" y="262" font-size="12.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">指数拟合</text>
<text x="180" y="262" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">2.33%</text>
<text x="330" y="262" font-size="12.5" fill="#be123c" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">29.0%</text>
<text x="560" y="262" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">早期增长像指数时准，后期高估</text>
<rect x="36" y="290" width="888" height="50" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="36" y="290" width="6" height="50" fill="#be123c"/>
<text x="54" y="320" font-size="12.5" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">Holt 双指数</text>
<text x="180" y="320" font-size="12.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">2.86%</text>
<text x="330" y="320" font-size="12.5" fill="#be123c" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="700">64.9%</text>
<text x="560" y="320" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">没建模周周期，斜率被季节项吃掉</text>
<rect x="36" y="372" width="888" height="62" rx="6" fill="#fef3c7"/>
<text x="48" y="393" font-size="13" font-weight="700" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">MAPE 差 1.4 倍，「还有几天」差 14 倍</text>
<text x="48" y="412" font-size="10.5" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">天数 = 剩余容量 ÷ 斜率，斜率的小偏差会被除法放大；所以「预测准不准」和「什么时候该买盘」是两个指标。</text>
<text x="36" y="462" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">80 次重采样、90 天序列（基数 400 GB、日增 2.6 GB、周周期 ±18 GB、噪声 σ=6 GB），阈值 800 GB；脚本不入库，参数写在正文。</text>
</svg>
