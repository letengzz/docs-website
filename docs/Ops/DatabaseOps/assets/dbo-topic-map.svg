<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">数据库运维自动化：专题地图</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">十个页面沿着「盘点 → 作业 → 判定 → 验证」排布，每一页都有本机实测读数与 8 条判据</text>
<rect x="36" y="96" width="168" height="72" rx="6" fill="#1d4ed8"/>
<text x="48" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">总览（DBO）</text>
<text x="48" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">四类作业 · 五个必失点</text>
<rect x="216" y="96" width="168" height="72" rx="6" fill="#0f766e"/>
<text x="228" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">机群清单（FLT）</text>
<text x="228" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">三来源 · 四类漂移</text>
<rect x="396" y="96" width="168" height="72" rx="6" fill="#7c2d12"/>
<text x="408" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">作业模型（JOB）</text>
<text x="408" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">检查-执行-复核</text>
<rect x="576" y="96" width="168" height="72" rx="6" fill="#b45309"/>
<text x="588" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">分波次（WAV）</text>
<text x="588" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 = 爆炸半径</text>
<rect x="756" y="96" width="168" height="72" rx="6" fill="#6d28d9"/>
<text x="768" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">巡检口径（INS）</text>
<text x="768" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">采集贵 · 判据便宜</text>
<rect x="36" y="192" width="168" height="72" rx="6" fill="#be123c"/>
<text x="48" y="213" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">容量预测（CPF）</text>
<text x="48" y="232" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">MAPE 会骗人</text>
<rect x="216" y="192" width="168" height="72" rx="6" fill="#0369a1"/>
<text x="228" y="213" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">自愈止损（SLF）</text>
<text x="228" y="232" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">双条件闸门</text>
<rect x="396" y="192" width="168" height="72" rx="6" fill="#15803d"/>
<text x="408" y="213" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">作业彩排（DRL）</text>
<text x="408" y="232" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">演练闸门</text>
<rect x="576" y="192" width="168" height="72" rx="6" fill="#334155"/>
<text x="588" y="213" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">实战（DBP）</text>
<text x="588" y="232" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">12 实例一次下发</text>
<rect x="756" y="192" width="168" height="72" rx="6" fill="#475569"/>
<text x="768" y="213" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">症状分诊（DBQ）</text>
<text x="768" y="232" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">十条主线</text>
<text x="36" y="300" font-size="11.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">横向是「盘点 → 作业 → 判定 → 验证」四段，纵向是「一次下发」与「长期运行」两条时间尺度；每页 8 条判据，合计 80 条。</text>
<rect x="36" y="330" width="888" height="96" rx="6" fill="#f1f5f9"/>
<text x="48" y="351" font-size="13" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">读法建议</text>
<text x="48" y="370" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">第一次读：总览 → 机群清单 → 作业模型 → 分波次（这四页定的是「怎么把一次变更安全地落到 N 台」）。</text>
<text x="48" y="386" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">已有事故想找口径：巡检口径 → 自愈止损 → 症状分诊。</text>
<text x="48" y="402" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">要给容量报数：容量预测 → 实战（预测与余量表在同一条流水线上）。</text>
<rect x="36" y="440" width="888" height="40" rx="6" fill="#e0f2fe"/>
<text x="48" y="461" font-size="11.5" font-weight="700" fill="#075985" font-family="PingFang SC, Helvetica, Arial, sans-serif">全专题共用一套口径：作业有幂等键、波次有失败域、判据有采集时点、预测有区间——任何一条缺了，后面的数字都不能用。</text>
</svg>
