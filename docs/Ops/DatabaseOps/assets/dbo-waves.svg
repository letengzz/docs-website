<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="496" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">分波次：波次大小就是爆炸半径</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">24 台实例的 4000 次仿真——小波次不提高成功率，只限制失败时的受损面</text>
<rect x="36" y="96" width="168" height="92" rx="6" fill="#be123c"/>
<text x="48" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量并行</text>
<text x="48" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">24 台一波</text>
<text x="48" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏受损 24 台</text>
<text x="48" y="168" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 4.83 台</text>
<text x="48" y="184" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量跑完 1.000</text>
<rect x="216" y="96" width="168" height="92" rx="6" fill="#b45309"/>
<text x="228" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 12</text>
<text x="228" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">两波</text>
<text x="228" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏受损 12 台</text>
<text x="228" y="168" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 2.51 台</text>
<text x="228" y="184" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量跑完 0.740</text>
<rect x="396" y="96" width="168" height="92" rx="6" fill="#0f766e"/>
<text x="408" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 6</text>
<text x="408" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">四波</text>
<text x="408" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏受损 6 台</text>
<text x="408" y="168" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 1.20 台</text>
<text x="408" y="184" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量跑完 0.748</text>
<rect x="576" y="96" width="168" height="92" rx="6" fill="#0369a1"/>
<text x="588" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 3</text>
<text x="588" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">八波</text>
<text x="588" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏受损 3 台</text>
<text x="588" y="168" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 0.62 台</text>
<text x="588" y="184" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量跑完 0.748</text>
<rect x="756" y="96" width="168" height="92" rx="6" fill="#15803d"/>
<text x="768" y="117" font-size="13" font-weight="700" fill="#ffffff" font-family="PingFang SC, Helvetica, Arial, sans-serif">逐台</text>
<text x="768" y="136" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">24 波</text>
<text x="768" y="152" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏受损 1 台</text>
<text x="768" y="168" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 0.25 台</text>
<text x="768" y="184" font-size="10.5" fill="#e2e8f0" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量跑完 0.746</text>
<text x="36" y="218" font-size="11.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">4000 次蒙特卡洛：24 台实例、一次发布是坏版本的概率 25%、坏版本下每台受损概率 80%，波内任一台失败即中止。</text>
<rect x="36" y="236" width="424" height="132" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="256" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">读数一：最坏受损 = 波次大小</text>
<text x="48" y="274" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 6 的最坏值是 6 台，逐台是 1 台</text>
<text x="48" y="289" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">「全量并行」根本没有中止点：中止判据只能事后触发</text>
<text x="48" y="304" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">平均受损随波次线性上涨（0.25 → 4.83）</text>
<text x="48" y="319" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">全量并行把「跑完率」做到 100%，代价是失败时全站</text>
<rect x="492" y="236" width="432" height="132" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="504" y="256" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">读数二：波次大小几乎不影响「跑完率」</text>
<text x="504" y="274" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次 1/3/6 的跑完率都是 74.6%~74.8%</text>
<text x="504" y="289" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">真正影响跑完率的是「版本本身好不好」</text>
<text x="504" y="304" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">所以小波次不是「更容易失败」，只是「炸得小」</text>
<text x="504" y="319" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价在后面：波次越多，总时长越长</text>
<rect x="36" y="390" width="888" height="56" rx="6" fill="#f1f5f9"/>
<text x="48" y="411" font-size="12.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次的三个参数要一起定，不能只调一个</text>
<text x="48" y="430" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">波次大小（爆炸半径）× 波间观察窗（多久算稳定）× 中止条件（谁有权喊停）</text>
<text x="36" y="474" font-size="11" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">经验值：生产库的首波 = 1 台（或最小的只读副本），首波观察窗 ≥ 一个完整业务周期（对订单类系统就是「跨过一次日切」）。</text>
</svg>
