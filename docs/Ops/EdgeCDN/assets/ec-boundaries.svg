<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="边缘与 CDN 的四条边界示意图">
  <defs>
    <marker id="ec-bd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">四条边界：上边缘之前必须回答的四个问题</text>

  <!-- 用户 -->
  <rect x="34" y="86" width="120" height="58" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="94" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">用户</text>
  <text x="94" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">离源站很远</text>

  <!-- 边缘层 -->
  <rect x="200" y="76" width="330" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365" y="104" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">边缘层（CDN 节点 + 边缘函数）</text>
  <text x="365" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">你登不上去，只能通过配置与 API 影响它</text>
  <text x="365" y="143" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">按「缓存能力 + 计算能力」两层各自设规则</text>

  <!-- 源站 -->
  <rect x="610" y="86" width="250" height="58" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="735" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">源站（你真正拥有的东西）</text>
  <text x="735" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">数据、身份、最终一致性都在这</text>

  <path d="M 156 115 L 196 115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ec-bd-arrow)"/>
  <path d="M 532 115 L 606 115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ec-bd-arrow)"/>
  <text x="569" y="107" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">未命中</text>

  <!-- 四条边界 -->
  <rect x="34" y="196" width="196" height="132" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="132" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">边界一 · 放什么</text>
  <text x="52" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#334155">可缓存：静态资源、</text>
  <text x="52" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#334155">公开图片、版本化产物</text>
  <text x="52" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">判据：内容是否与</text>
  <text x="52" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">「谁在看」无关</text>

  <rect x="248" y="196" width="196" height="132" rx="12" fill="#ffffff" stroke="#fca5a5"/>
  <text x="346" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">边界二 · 绝不放什么</text>
  <text x="266" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#334155">个人化响应、带身份的</text>
  <text x="266" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#334155">接口、可写资源</text>
  <text x="266" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">放错的后果不是变慢，</text>
  <text x="266" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">是 A 看到 B 的数据</text>

  <rect x="462" y="196" width="196" height="132" rx="12" fill="#ffffff" stroke="#5eead4"/>
  <text x="560" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">边界三 · 状态放哪</text>
  <text x="480" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#334155">边缘函数默认无状态；</text>
  <text x="480" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#334155">需要跨请求记忆时，</text>
  <text x="480" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#0f766e">先问「复制到每个点</text>
  <text x="480" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#0f766e">之后还成立吗」</text>

  <rect x="676" y="196" width="190" height="132" rx="12" fill="#ffffff" stroke="#fcd34d"/>
  <text x="771" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">边界四 · 坏了谁兜底</text>
  <text x="694" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#334155">边缘逻辑报错时：</text>
  <text x="694" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#334155">回源、返回 5xx、</text>
  <text x="694" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#334155">还是给静态兜底页？</text>
  <text x="694" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">必须是决定过的</text>

  <!-- 底部：判据 -->
  <rect x="34" y="360" width="832" height="126" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="56" y="388" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3730a3">在这四条边界上，最常被跳过的一句反问</text>
  <text x="56" y="416" font-family="system-ui, sans-serif" font-size="13" fill="#334155">「这条内容/这段逻辑，换成另一个用户来请求，结果一样吗？」——一样，才能进边缘；不一样，边缘只能做「加速转发」而不是「缓存」。</text>
  <text x="56" y="444" font-family="system-ui, sans-serif" font-size="13" fill="#334155">「这一层挂了之后，用户看到的是什么？」——答不上来，说明兜底路径没有设计过，只是还没被触发过。</text>
  <text x="56" y="472" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">四条边界都不需要上线才知道答案：它们可以在设计评审里问、在配置评审里查。</text>
</svg>
