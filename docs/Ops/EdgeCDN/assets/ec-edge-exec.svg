<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="边缘函数的执行模型与降级路径">
  <defs>
    <marker id="ec-ef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">边缘函数的三个时机与两条降级路径</text>

  <!-- 时机 -->
  <rect x="30" y="76" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="105" y="102" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">用户请求</text>
  <text x="105" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">TLS 已终结</text>

  <rect x="212" y="76" width="196" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">时机一 · 请求到达</text>
  <text x="310" y="120" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">鉴权、改写、重定向</text>
  <text x="310" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">可以决定「不走缓存」</text>

  <rect x="440" y="76" width="196" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="538" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">缓存查找</text>
  <text x="538" y="120" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">由平台负责，</text>
  <text x="538" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">你的代码插不进去</text>

  <rect x="668" y="76" width="202" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="769" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">时机二 · 响应返回前</text>
  <text x="769" y="120" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">注入头、改内容、</text>
  <text x="769" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">决定能不能被缓存</text>

  <path d="M 184 108 L 208 108" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ec-ef-arrow)"/>
  <path d="M 412 108 L 436 108" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ec-ef-arrow)"/>
  <path d="M 640 108 L 664 108" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ec-ef-arrow)"/>

  <!-- 配额条 -->
  <rect x="30" y="168" width="840" height="118" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="194" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">配额不是优化项，是可行性判据（2026-10 官方口径）</text>
  <text x="52" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Cloudflare Workers：免费 10 万请求/天、每次调用 10 ms CPU；付费 5 分钟上限（默认 30 秒）、内存 128 MB、子请求 50/10000。</text>
  <text x="52" y="244" font-family="system-ui, sans-serif" font-size="12" fill="#334155">腾讯云 EdgeOne：CPU 200 ms（不含 I/O 等待）、代码包 5 MB、请求体 1 MB、单站点 100 个函数 / 200 条规则。</text>
  <text x="52" y="268" font-family="system-ui, sans-serif" font-size="12" fill="#334155">共同点：CPU 只算「执行代码」的时间，等 I/O 不计——所以「边缘函数慢」几乎总是 CPU 超限，而不是网络慢。</text>

  <!-- 降级 -->
  <rect x="30" y="308" width="404" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="232" y="334" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">降级路径 A · 出错即回源（推荐默认）</text>
  <text x="52" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#334155">把边缘逻辑当成「可选加速」：超时或异常时</text>
  <text x="52" y="378" font-family="system-ui, sans-serif" font-size="11" fill="#334155">直接放行到源站，用户最坏只损失这点加速。</text>
  <text x="52" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：源站要能承受「边缘全挂时」的全量流量。</text>

  <rect x="466" y="308" width="404" height="112" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="668" y="334" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">降级路径 B · 返回兜底内容</text>
  <text x="488" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#334155">返回静态兜底页或上一个可用版本：用户看到</text>
  <text x="488" y="378" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「内容旧了」而不是「网站挂了」。</text>
  <text x="488" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">代价：必须显式判断「哪些接口可以降级」。</text>

  <text x="32" y="456" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">两条路径不能混用：同一条路由上「有时回源、有时兜底」会让故障表现无法复现</text>
  <rect x="30" y="474" width="840" height="48" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="52" y="504" font-family="system-ui, sans-serif" font-size="12" fill="#3730a3">选择依据只有一句话：这段逻辑出错时，用户更怕「慢」还是更怕「看到旧的」——怕慢就选 A，怕旧就选 B。</text>
</svg>
