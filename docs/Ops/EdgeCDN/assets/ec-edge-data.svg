<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="边缘数据的三档一致性与选型">
  <defs>
    <marker id="ec-ed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">边缘数据的三档：写在哪，决定能读到多新</text>

  <!-- 用户 -->
  <rect x="30" y="88" width="130" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="95" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">用户请求</text>
  <text x="95" y="131" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">落在一个边缘节点</text>
  <path d="M 164 116 L 196 116" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#ec-ed-arrow)"/>

  <!-- 三档 -->
  <rect x="200" y="66" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="92" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">① 不存边缘状态</text>
  <text x="320" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">每次都问源站（或它的只读副本）</text>
  <text x="320" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">一致性：强（源站说了算）</text>
  <text x="320" y="154" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">代价：每次跨城；适合余额、权限</text>

  <rect x="200" y="180" width="240" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="320" y="206" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">② 边缘 KV（复制式）</text>
  <text x="320" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">写入后自动复制到各节点</text>
  <text x="320" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">一致性：最终（秒级到分钟级）</text>
  <text x="320" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">适合开关、白名单、A/B 分组</text>

  <rect x="200" y="294" width="240" height="100" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">③ 有状态对象 / 单点协调</text>
  <text x="320" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">同一份状态由一个位置串行处理</text>
  <text x="320" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">一致性：单对象强</text>
  <text x="320" y="382" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">代价：远离该位置的用户变慢</text>

  <!-- 源站 -->
  <rect x="490" y="180" width="180" height="100" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="580" y="208" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">源站 / 主库</text>
  <text x="580" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">唯一权威副本</text>
  <text x="580" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">事务、约束、审计在这里</text>
  <text x="580" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">边缘只做读与增量</text>
  <path d="M 444 116 L 466 116 L 466 206 L 486 206" stroke="#0f172a" stroke-width="1.5" fill="none" marker-end="url(#ec-ed-arrow)"/>
  <path d="M 444 230 L 486 230" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <text x="700" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">写入必须回源，</text>
  <text x="700" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">或写进「可丢的队列」</text>
  <text x="700" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">再异步落库</text>

  <!-- 选型三问 -->
  <rect x="30" y="418" width="840" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="444" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">三问定档</text>
  <text x="52" y="468" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① 读到 500 毫秒前的旧值，业务能不能接受？② 复制到每个节点后，语义还成立吗？③ 写入失败时，能重试还是能丢弃？</text>
</svg>
