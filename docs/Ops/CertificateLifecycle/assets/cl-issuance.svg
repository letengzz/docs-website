<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    .d { fill: #fdeef0; stroke: #c0505f; stroke-width: 1.4; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 16px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .ar { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arw); }
  </style>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text class="t" x="440" y="28">签发链路：三个决定，一个结果</text>

  <rect class="a" x="24" y="56" width="190" height="86" rx="8"/>
  <text class="h" x="119" y="80">私钥</text>
  <text class="s" x="119" y="102">RSA-2048 或 ECDSA</text>
  <text class="s" x="119" y="122">RSA keygen ≈ 43 ms</text>

  <rect class="a" x="238" y="56" width="190" height="86" rx="8"/>
  <text class="h" x="333" y="80">CSR</text>
  <text class="s" x="333" y="102">公钥 + 主体 + 扩展</text>
  <text class="s" x="333" y="122">永不包含私钥</text>

  <rect class="b" x="452" y="56" width="190" height="86" rx="8"/>
  <text class="h" x="547" y="80">CA 签发</text>
  <text class="s" x="547" y="102">ACME 或私有 CA</text>
  <text class="s" x="547" y="122">扩展由 CA 决定</text>

  <rect class="b" x="666" y="56" width="190" height="86" rx="8"/>
  <text class="h" x="761" y="80">证书</text>
  <text class="s" x="761" y="102">公钥 + 身份 + 时间 + 用途</text>
  <text class="s" x="761" y="122">RSA 926 B / EC 723 B</text>

  <path class="ar" d="M214 99 L238 99"/>
  <path class="ar" d="M428 99 L452 99"/>
  <path class="ar" d="M642 99 L666 99"/>

  <text class="h" x="180" y="200">决定一：SAN 给哪些名字</text>
  <rect class="c" x="24" y="212" width="272" height="96" rx="8"/>
  <text class="s" x="160" y="236">*.board.example.com</text>
  <text class="s" x="160" y="258">覆盖 a.board.example.com ✅</text>
  <text class="s" x="160" y="278">不覆盖 a.b.board.example.com</text>
  <text class="s" x="160" y="298">（实测 error 62）</text>

  <text class="h" x="480" y="200">决定二：多长寿命</text>
  <rect class="c" x="324" y="212" width="272" height="96" rx="8"/>
  <text class="s" x="460" y="236">2026-03-15 起上限 200 天</text>
  <text class="s" x="460" y="258">2027 年 100 天，2029 年 47 天</text>
  <text class="s" x="460" y="278">LE shortlived 仅 160 小时</text>
  <text class="s" x="460" y="298">写死 60 天续期会直接失效</text>

  <text class="h" x="780" y="200">决定三：谁来签</text>
  <rect class="c" x="624" y="212" width="232" height="96" rx="8"/>
  <text class="s" x="740" y="236">公共 CA：进 CT 日志</text>
  <text class="s" x="740" y="258">私有 CA：可吊销、不进 CT</text>
  <text class="s" x="740" y="278">x509 -req 无 index.txt</text>
  <text class="s" x="740" y="298">要吊销必须用 openssl ca</text>

  <rect class="d" x="24" y="330" width="832" height="92" rx="8"/>
  <text class="h" x="440" y="354">两个必查项：CAA 与挑战类型</text>
  <text class="s" x="440" y="378">CAA 没列你的 CA 时，表现是「验证一直不完成」而不是报错</text>
  <text class="s" x="440" y="400">通配符只能用 dns-01；http-01 不支持通配符，会被直接拒绝</text>
</svg>
