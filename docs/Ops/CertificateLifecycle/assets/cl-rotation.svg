<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    .d { fill: #fdeef0; stroke: #c0505f; stroke-width: 1.4; }
    .gb { fill: #dbeafe; stroke: #4a7bd8; stroke-width: 1; }
    .gg { fill: #d7f5e2; stroke: #3aa76d; stroke-width: 1; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 16px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
  </style>
  <text class="t" x="440" y="28">轮换的三种粒度与重叠窗口</text>

  <rect class="a" x="24" y="48" width="268" height="92" rx="8"/>
  <text class="h" x="158" y="72">① 只换证书</text>
  <text class="s" x="158" y="94">复用私钥，只重签 CSR</text>
  <text class="s" x="158" y="114">客户端无感，pin 也不受影响</text>
  <text class="s" x="158" y="132">代价：密钥寿命 = 续期次数之和</text>

  <rect class="c" x="306" y="48" width="268" height="92" rx="8"/>
  <text class="h" x="440" y="72">② 换密钥</text>
  <text class="s" x="440" y="94">新私钥 + 新证书</text>
  <text class="s" x="440" y="114">pin 了叶子的客户端全部失败</text>
  <text class="s" x="440" y="132">建议：每年至少一次</text>

  <rect class="d" x="588" y="48" width="268" height="92" rx="8"/>
  <text class="h" x="722" y="72">③ 换 CA</text>
  <text class="s" x="722" y="94">信任锚变化，链完全变</text>
  <text class="s" x="722" y="114">必须分「加 / 换 / 减」三步</text>
  <text class="s" x="722" y="132">第三步不可逆，单独排期</text>

  <text class="h" x="120" y="186">时间轴：重叠窗口</text>

  <rect class="gb" x="120" y="200" width="380" height="26" rx="4"/>
  <text class="s" x="310" y="218">旧证书有效</text>
  <rect class="gg" x="360" y="234" width="380" height="26" rx="4"/>
  <text class="s" x="550" y="252">新证书有效</text>
  <rect class="c" x="360" y="268" width="140" height="24" rx="4"/>
  <text class="s" x="430" y="285">重叠</text>

  <text class="s" x="640" y="300">T_overlap ≥ T_deploy + T_propagate + T_client_cache</text>
  <text class="s" x="640" y="322">服务端证书：重叠几乎零成本（客户端只认 CA）</text>
  <text class="s" x="640" y="344">客户端证书 / 换 CA：信任库必须同时含新旧 CA</text>

  <rect class="d" x="24" y="366" width="832" height="82" rx="8"/>
  <text class="h" x="440" y="390">pin 是公钥，不是域名：换 key 就是硬切换（本机实测）</text>
  <text class="s" x="440" y="412">轮换前带旧 pin → 200；轮换后带旧 pin → curl (90) public key does not match pinned public key</text>
  <text class="s" x="440" y="434">轮换后不带 pin → 200；换新 pin → 200。错的是 pin，不是证书</text>
</svg>
