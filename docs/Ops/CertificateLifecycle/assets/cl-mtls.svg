<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    .d { fill: #fdeef0; stroke: #c0505f; stroke-width: 1.4; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 16px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .ar { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arw); }
  </style>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text class="t" x="440" y="28">mTLS：双向验证与四种拒绝形态</text>

  <rect class="a" x="40" y="60" width="150" height="80" rx="8"/>
  <text class="h" x="115" y="84">客户端</text>
  <text class="s" x="115" y="106">带 client.crt</text>
  <text class="s" x="115" y="124">EKU=clientAuth</text>

  <rect class="b" x="655" y="60" width="150" height="80" rx="8"/>
  <text class="h" x="730" y="84">服务端</text>
  <text class="s" x="730" y="106">ssl_verify_client on</text>
  <text class="s" x="730" y="124">信任锚 = 根 + 中间</text>

  <path class="ar" d="M190 84 L655 84"/>
  <text class="s" x="420" y="76">① 服务端证明自己（serverAuth）</text>

  <path class="ar" d="M655 118 L190 118"/>
  <text class="s" x="420" y="138">② 客户端证明自己（clientAuth）</text>

  <rect class="a" x="250" y="160" width="360" height="54" rx="8"/>
  <text class="s" x="430" y="182">身份放在 SAN：DNS:svc-team-board</text>
  <text class="s" x="430" y="202">授权看「签发者 + SAN」，不看 CN</text>

  <text class="h" x="180" y="252">四种拒绝，同一个 400</text>

  <rect class="d" x="24" y="264" width="196" height="88" rx="8"/>
  <text class="h" x="122" y="288">没带证书</text>
  <text class="s" x="122" y="310">400 No required</text>
  <text class="s" x="122" y="328">SSL certificate was sent</text>
  <text class="s" x="122" y="346">唯一能靠标题区分的</text>

  <rect class="c" x="236" y="264" width="196" height="88" rx="8"/>
  <text class="h" x="334" y="288">用途不符</text>
  <text class="s" x="334" y="310">400 The SSL certificate error</text>
  <text class="s" x="334" y="328">verify -purpose sslclient</text>
  <text class="s" x="334" y="346">返回 rc=2</text>

  <rect class="c" x="448" y="264" width="196" height="88" rx="8"/>
  <text class="h" x="546" y="288">已过期</text>
  <text class="s" x="546" y="310">400 The SSL certificate error</text>
  <text class="s" x="546" y="328">x509 -enddate</text>
  <text class="s" x="546" y="346">与用途不符无法区分</text>

  <rect class="c" x="660" y="264" width="196" height="88" rx="8"/>
  <text class="h" x="758" y="288">自签 / 链外</text>
  <text class="s" x="758" y="310">400 The SSL certificate error</text>
  <text class="s" x="758" y="328">verify → error 20</text>
  <text class="s" x="758" y="346">信任锚只给中间也会这样</text>

  <rect class="a" x="24" y="372" width="832" height="70" rx="8"/>
  <text class="h" x="440" y="396">排障只看一个地方：服务端的 $ssl_client_verify</text>
  <text class="s" x="440" y="418">SUCCESS / FAILED:reason / NONE 三态；它是代理注入的 header，应用层必须二次校验并限制来源</text>
</svg>
