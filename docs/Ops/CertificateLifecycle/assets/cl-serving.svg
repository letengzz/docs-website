<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    .d { fill: #fdeef0; stroke: #c0505f; stroke-width: 1.4; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 16px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .ar { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arw); }
  </style>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text class="t" x="440" y="28">部署链路：文件、进程、握手、客户端</text>

  <rect class="a" x="24" y="52" width="196" height="130" rx="8"/>
  <text class="h" x="122" y="76">四个文件</text>
  <text class="s" x="122" y="100">leaf.crt</text>
  <text class="s" x="122" y="120">inter.crt</text>
  <text class="s" x="122" y="140">fullchain.pem（叶子在前）</text>
  <text class="s" x="122" y="160">leaf.key（600）</text>

  <rect class="b" x="244" y="52" width="196" height="130" rx="8"/>
  <text class="h" x="342" y="76">nginx</text>
  <text class="s" x="342" y="100">ssl_certificate → fullchain</text>
  <text class="s" x="342" y="120">ssl_protocols 1.2 1.3</text>
  <text class="s" x="342" y="140">reload 后立即生效</text>
  <text class="s" x="342" y="160">顺序错 → 启动失败</text>

  <rect class="b" x="464" y="52" width="196" height="130" rx="8"/>
  <text class="h" x="562" y="76">握手</text>
  <text class="s" x="562" y="100">发 2 张证书</text>
  <text class="s" x="562" y="120">TLS1.3 1-RTT</text>
  <text class="s" x="562" y="140">会话票据默认不共享</text>
  <text class="s" x="562" y="160">OCSP stapling 需显式配</text>

  <rect class="c" x="684" y="52" width="172" height="130" rx="8"/>
  <text class="h" x="770" y="76">客户端</text>
  <text class="s" x="770" y="100">验链（本地信任库）</text>
  <text class="s" x="770" y="120">验名字（SAN）</text>
  <text class="s" x="770" y="140">验用途（EKU）</text>
  <text class="s" x="770" y="160">看时间（GMT）</text>

  <path class="ar" d="M220 117 L244 117"/>
  <path class="ar" d="M440 117 L464 117"/>
  <path class="ar" d="M660 117 L684 117"/>

  <text class="h" x="248" y="226">同一张证书、同一个客户端，唯一差别是「发不发中间证书」</text>

  <rect class="a" x="24" y="240" width="404" height="96" rx="8"/>
  <text class="h" x="226" y="264">fullchain（2 张）</text>
  <text class="s" x="226" y="288">curl --cacert root.crt → 200</text>
  <text class="s" x="226" y="308">Verify return code: 0 (ok)</text>
  <text class="s" x="226" y="328">客户端能自己走到根</text>

  <rect class="d" x="452" y="240" width="404" height="96" rx="8"/>
  <text class="h" x="654" y="264">leaf only（1 张）</text>
  <text class="s" x="654" y="288">curl → (60) unable to get local issuer certificate</text>
  <text class="s" x="654" y="308">verify error:num=20:unable to get local issuer</text>
  <text class="s" x="654" y="328">看起来像「证书坏了」，其实是「链缺一张」</text>

  <rect class="c" x="24" y="356" width="832" height="66" rx="8"/>
  <text class="h" x="440" y="380">协议版本：分清谁在拒绝</text>
  <text class="s" x="440" y="404">no protocols available = 客户端自己不允许；alert protocol version(70) = 服务端拒绝</text>
</svg>
