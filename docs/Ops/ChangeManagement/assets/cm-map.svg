<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 16px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
  </style>
  <text class="t" x="440" y="28">变更管理的九个问题：从「多大的事」到「拿什么证明」</text>

  <rect class="a" x="20" y="48" width="270" height="118" rx="8"/>
  <text class="h" x="155" y="72">1 体系概述</text>
  <text class="s" x="155" y="94">分级、授权、留痕三件事</text>
  <text class="s" x="155" y="112">什么时候不该走流程</text>
  <text class="s" x="155" y="134">判据 CHG-A ~ CHG-H</text>

  <rect class="a" x="305" y="48" width="270" height="118" rx="8"/>
  <text class="h" x="440" y="72">2 变更分级</text>
  <text class="s" x="440" y="94">影响面 × 可逆性 × 可观测性</text>
  <text class="s" x="440" y="112">标准 / 常规 / 紧急三档</text>
  <text class="s" x="440" y="134">判据 CLS-A ~ CLS-H</text>

  <rect class="a" x="590" y="48" width="270" height="118" rx="8"/>
  <text class="h" x="725" y="72">3 窗口与冻结期</text>
  <text class="s" x="725" y="94">窗口由业务节律决定</text>
  <text class="s" x="725" y="112">冻结期的三种来源</text>
  <text class="s" x="725" y="134">判据 CWN-A ~ CWN-H</text>

  <rect class="b" x="20" y="184" width="270" height="118" rx="8"/>
  <text class="h" x="155" y="208">4 审批留痕</text>
  <text class="s" x="155" y="230">批的是「哪个产物」</text>
  <text class="s" x="155" y="248">哈希链与篡改检测</text>
  <text class="s" x="155" y="270">判据 ATR-A ~ ATR-H</text>

  <rect class="b" x="305" y="184" width="270" height="118" rx="8"/>
  <text class="h" x="440" y="208">5 变更日历</text>
  <text class="s" x="440" y="230">冲突的四种类别</text>
  <text class="s" x="440" y="248">数据库级排他而不是先查后插</text>
  <text class="s" x="440" y="270">判据 CCL-A ~ CCL-H</text>

  <rect class="b" x="590" y="184" width="270" height="118" rx="8"/>
  <text class="h" x="725" y="208">6 高危变更</text>
  <text class="s" x="725" y="230">DDL / 权限 / 配置 / 流量</text>
  <text class="s" x="725" y="248">静态规则与双人复核</text>
  <text class="s" x="725" y="270">判据 HRS-A ~ HRS-H</text>

  <rect class="c" x="20" y="320" width="270" height="118" rx="8"/>
  <text class="h" x="155" y="344">7 紧急变更</text>
  <text class="s" x="155" y="366">破窗的边界与额度</text>
  <text class="s" x="155" y="384">事后补单补什么</text>
  <text class="s" x="155" y="406">判据 EMG-A ~ EMG-H</text>

  <rect class="c" x="305" y="320" width="270" height="118" rx="8"/>
  <text class="h" x="440" y="344">8 实战</text>
  <text class="s" x="440" y="366">加列 + 回填 + 切读的一次完整变更</text>
  <text class="s" x="440" y="384">十二步与 S1~S10 验收</text>
  <text class="s" x="440" y="406">判据 CHP-A ~ CHP-H</text>

  <rect class="c" x="590" y="320" width="270" height="118" rx="8"/>
  <text class="h" x="725" y="344">9 常见问题</text>
  <text class="s" x="725" y="366">流程空转 / 审批成橡皮章</text>
  <text class="s" x="725" y="384">分诊表与十二项自查</text>
  <text class="s" x="725" y="406">判据 CHQ-A ~ CHQ-H</text>
  <text class="s" x="440" y="458">虚线关系的读法：1 定边界 → 2/3 决定「多大的事、什么时候能做」 → 4/5 决定「谁批的、怎么证明」 → 6/7 处理例外 → 8 串起来</text>
</svg>
