<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>
  <text class="t" x="430" y="26">一次变更只有三件事，其余都是这三件事的载体</text>

  <rect class="a" x="40" y="52" width="230" height="120" rx="8"/>
  <text class="h" x="155" y="78">分级：多大的事</text>
  <text class="s" x="155" y="102">影响面（多少人 / 多少钱）</text>
  <text class="s" x="155" y="122">可逆性（能不能退回）</text>
  <text class="s" x="155" y="142">可观测性（多久能发现坏）</text>
  <text class="s" x="155" y="162">→ 决定「要不要批、批几层」</text>

  <rect class="a" x="315" y="52" width="230" height="120" rx="8"/>
  <text class="h" x="430" y="78">授权：谁说了算</text>
  <text class="s" x="430" y="102">Change Authority（授权人）</text>
  <text class="s" x="430" y="122">CAB 只给建议，不背决定</text>
  <text class="s" x="430" y="142">预授权清单（标准变更）</text>
  <text class="s" x="430" y="162">→ 决定「谁签字有效」</text>

  <rect class="a" x="590" y="52" width="230" height="120" rx="8"/>
  <text class="h" x="705" y="78">留痕：拿什么证明</text>
  <text class="s" x="705" y="102">批的是哪个 commit / digest</text>
  <text class="s" x="705" y="122">谁在什么时候批的</text>
  <text class="s" x="705" y="142">批准后产物有没有变</text>
  <text class="s" x="705" y="162">→ 决定「事后能不能还原」</text>

  <path class="arrow" d="M270 112 L305 112"/>
  <path class="arrow" d="M545 112 L580 112"/>

  <rect class="b" x="170" y="216" width="520" height="54" rx="8"/>
  <text class="h" x="430" y="240">一次「可被审计」的变更</text>
  <text class="s" x="430" y="260">分级说得清、授权查得到、留痕对得上产物</text>

  <path class="arrow" d="M430 172 L430 208"/>

  <rect class="c" x="40" y="300" width="240" height="62" rx="6"/>
  <text class="s" x="160" y="320">失效一：流程空转</text>
  <text class="s" x="160" y="338">所有变更都走全流程 → 审批变盖章</text>

  <rect class="c" x="310" y="300" width="240" height="62" rx="6"/>
  <text class="s" x="430" y="320">失效二：越权放行</text>
  <text class="s" x="430" y="338">有人能批，但没人对结果负责</text>

  <rect class="c" x="580" y="300" width="240" height="62" rx="6"/>
  <text class="s" x="700" y="320">失效三：无法追溯</text>
  <text class="s" x="700" y="338">只记「批了」，不记「批的是哪个产物」</text>
</svg>
