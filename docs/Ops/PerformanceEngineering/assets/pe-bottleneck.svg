<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="USE 方法的三列与四类资源信号、端到端延迟的四段拆解，以及三个观测视角">
  <title>瓶颈定位：USE 三列与四类资源</title>
  <defs>
    <marker id="pbn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">瓶颈定位：USE 三列与四类资源</text>
  <text x="30" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">先分清「在等服务」还是「在排队」，再谈优化。</text>
  <text x="32" y="118" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">① USE 三列</text>
  <text x="32" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">对每类资源问三遍</text>
  <rect x="200" y="96" width="150" height="36" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="212" y="119" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">四类资源</text>
  <rect x="356" y="96" width="170" height="36" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="368" y="119" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Utilization 利用率</text>
  <rect x="532" y="96" width="170" height="36" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="544" y="119" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Saturation 饱和度</text>
  <rect x="708" y="96" width="170" height="36" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="720" y="119" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Errors 错误</text>
  <rect x="200" y="132" width="150" height="44" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="159" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">CPU</text>
  <rect x="356" y="132" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="366" y="159" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">用户态 + 系统态占用率</text>
  <rect x="532" y="132" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="542" y="159" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">runqueue 长度、切换速率</text>
  <rect x="708" y="132" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="718" y="159" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">steal 时间、处理器错误</text>
  <rect x="200" y="180" width="150" height="44" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="207" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">内存 memory</text>
  <rect x="356" y="180" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="366" y="207" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">RSS 与 page cache 占用</text>
  <rect x="532" y="180" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="542" y="207" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">swap 换入换出、直接回收</text>
  <rect x="708" y="180" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="718" y="207" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">OOM killer 记录、分配失败</text>
  <rect x="200" y="228" width="150" height="44" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="255" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">磁盘 disk I/O</text>
  <rect x="356" y="228" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="366" y="255" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">设备 %util、IOPS 占用</text>
  <rect x="532" y="228" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="542" y="255" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">aqu-sz 队列长度、await</text>
  <rect x="708" y="228" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="718" y="255" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">I/O 错误、重试次数</text>
  <rect x="200" y="276" width="150" height="44" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="303" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">网络 network</text>
  <rect x="356" y="276" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="366" y="303" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">带宽占用、连接数占用</text>
  <rect x="532" y="276" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="542" y="303" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">重传率、TIME_WAIT 堆积</text>
  <rect x="708" y="276" width="170" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="718" y="303" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TCP 重传/丢包、网卡丢弃</text>
  <text x="32" y="356" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">② 端到端拆解</text>
  <text x="32" y="376" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">四段之和才是端到端</text>
  <rect x="200" y="344" width="237" height="44" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="214" y="371" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">排队等待 35%</text>
  <rect x="437" y="344" width="170" height="44" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="451" y="371" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">服务执行 25%</text>
  <rect x="607" y="344" width="203" height="44" rx="6" fill="#eef2ff" stroke="#818cf8"/>
  <text x="621" y="371" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#3730a3">下游等待 30%</text>
  <rect x="810" y="344" width="68" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="818" y="371" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155">客户端 10%</text>
  <text x="200" y="408" font-family="system-ui, sans-serif" font-size="10" fill="#334155">示例：端到端 100 ms = 排队等待 38 + 服务执行 22 + 下游等待 30 + 客户端 10（ms）。</text>
  <text x="32" y="466" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">③ 三个视角</text>
  <rect x="200" y="446" width="218" height="48" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="212" y="468" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">资源视角</text>
  <text x="212" y="485" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">mpstat / iostat / ss，只见饱和</text>
  <rect x="434" y="446" width="218" height="48" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="446" y="468" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">链路视角 trace</text>
  <text x="446" y="485" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">见调用关系，有采样代价</text>
  <rect x="668" y="446" width="210" height="48" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="680" y="468" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">代码视角 profile</text>
  <text x="680" y="485" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">见热点函数，需低频采样</text>
  <text x="30" y="540" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">招牌问题：CPU 不高但很慢——先分清「在等服务」还是「在排队」，再决定优化谁。</text>
</svg>
