<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="容量规划的三输入模型、水位线与排队放大倍数的关系，以及 HPA 的扩容与缩容行为">
  <title>容量规划：三输入模型与水位线</title>
  <defs>
    <marker id="pcp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">容量规划：三输入模型与水位线</text>
  <text x="30" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">容量不是一个数字，而是一条曲线：什么条件下、哪一层先到线、触发什么动作。</text>
  <text x="32" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">① 三输入模型</text>
  <text x="32" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">缺一个，结论就偏一档</text>
  <rect x="200" y="96" width="215" height="76" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="214" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">业务量</text>
  <text x="214" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#334155">DAU x 请求数 x 峰均比</text>
  <rect x="425" y="96" width="215" height="76" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="439" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">单实例能力</text>
  <text x="439" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#334155">恒定到达率压测实测值</text>
  <rect x="650" y="96" width="228" height="76" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="664" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">冗余策略</text>
  <text x="664" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#334155">N+1 / N+2 与水位线</text>
  <line x1="307" y1="172" x2="307" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#pcp-ar)"/>
  <line x1="532" y1="172" x2="532" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#pcp-ar)"/>
  <line x1="764" y1="172" x2="764" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#pcp-ar)"/>
  <rect x="200" y="196" width="678" height="58" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="214" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">所需实例数 = 峰值 ÷ (单实例能力 x 水位线)，再套 N+1</text>
  <text x="214" y="241" font-family="system-ui, sans-serif" font-size="10" fill="#334155">例：173.61 ÷ (120 x 50%) = 2.89 → 3 实例 → N+1 → 4 实例；单实例 43.40 QPS，利用率 36.2%</text>
  <text x="32" y="312" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">② 水位线为什么是 50%</text>
  <text x="32" y="332" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">从排队放大表倒推</text>
  <line x1="200" y1="400" x2="660" y2="400" stroke="#334155" stroke-width="1.5"/>
  <rect x="230" y="382" width="90" height="18" rx="3" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="230" y="376" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">2.00x</text>
  <rect x="380" y="355" width="90" height="45" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="380" y="349" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">5.00x</text>
  <rect x="530" y="310" width="90" height="90" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="530" y="304" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">10.00x</text>
  <text x="230" y="418" font-family="system-ui, sans-serif" font-size="10" fill="#334155">ρ=0.5</text>
  <text x="380" y="418" font-family="system-ui, sans-serif" font-size="10" fill="#334155">ρ=0.8</text>
  <text x="530" y="418" font-family="system-ui, sans-serif" font-size="10" fill="#334155">ρ=0.9</text>
  <text x="680" y="336" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">水位线 50% → ρ=0.5 → 放大 2.00x</text>
  <text x="680" y="356" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">水位线趋近 100% → ρ 趋近 1 → 放大趋于无穷</text>
  <text x="32" y="474" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">③ 触发与抑制</text>
  <text x="32" y="494" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">扩容快、缩容慢</text>
  <rect x="200" y="450" width="163" height="48" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="472" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">scaleUp 窗口 0 s</text>
  <text x="212" y="489" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">尖峰即刻扩容</text>
  <rect x="371" y="450" width="163" height="48" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="383" y="472" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">scaleDown 300 s</text>
  <text x="383" y="489" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">取窗口内最大推荐值</text>
  <rect x="542" y="450" width="163" height="48" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="554" y="472" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">容忍带 0.1</text>
  <text x="554" y="489" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">差异 10% 内不动作</text>
  <rect x="713" y="450" width="165" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="725" y="472" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">每 15 s 同步</text>
  <text x="725" y="489" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">多指标取最大值</text>
  <text x="30" y="540" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">缩容窗口内取「最大推荐值」，所以一次很快结束的尖峰不会立刻触发缩容。</text>
</svg>
