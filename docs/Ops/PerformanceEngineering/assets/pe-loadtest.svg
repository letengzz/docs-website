<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="压测的五类形态、开环与闭环负载模型，以及阶梯压测中膝点的判读">
  <title>压测的五类形态与三级阶梯</title>
  <defs>
    <marker id="pel-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">压测的五类形态与三级阶梯</text>
  <text x="30" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">压测不是把机器压到冒烟，而是量出「在哪一点开始不经济」。</text>

  <text x="30" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">① 五类压测</text>
  <text x="30" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">目的 / 时长 / 判据各异</text>
  <rect x="150" y="92" width="138" height="84" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="162" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">冒烟 smoke</text>
  <text x="162" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#334155">3~5 分钟</text>
  <text x="162" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：能跑通</text>
  <text x="162" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">误用：当性能结论</text>
  <rect x="298" y="92" width="138" height="84" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="310" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">基准 benchmark</text>
  <text x="310" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#334155">固定配置单次</text>
  <text x="310" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：可对比</text>
  <text x="310" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">误用：环境漂移</text>
  <rect x="446" y="92" width="138" height="84" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="458" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">负载 load</text>
  <text x="458" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#334155">设定期望峰值</text>
  <text x="458" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：达标率</text>
  <text x="458" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">误用：只压到能过</text>
  <rect x="594" y="92" width="138" height="84" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="606" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">压力 stress</text>
  <text x="606" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#334155">到 1.5 倍能力</text>
  <text x="606" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：过载行为</text>
  <text x="606" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">误用：不看恢复</text>
  <rect x="742" y="92" width="138" height="84" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="754" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">稳定性 soak</text>
  <text x="754" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#334155">数小时至数天</text>
  <text x="754" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：无泄漏</text>
  <text x="754" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">误用：短时替代</text>

  <text x="30" y="240" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">② 负载模型</text>
  <text x="30" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">测容量必须用开环</text>
  <rect x="150" y="206" width="352" height="84" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="164" y="230" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">开环 open：恒定到达率</text>
  <text x="164" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不管响应多慢，到达率不变</text>
  <text x="164" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#334155">k6 constant-arrival-rate / Vegeta 属此类</text>
  <rect x="520" y="206" width="356" height="84" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="534" y="230" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">闭环 closed：恒定并发</text>
  <text x="534" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#334155">响应变慢则发压变慢，自我限速</text>
  <text x="534" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#334155">测出的是「这个并发下」的延迟</text>

  <text x="30" y="352" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">③ 阶梯与膝点</text>
  <text x="30" y="372" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">量出开始不经济的那点</text>
  <line x1="160" y1="470" x2="876" y2="470" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="340" x2="160" y2="470" stroke="#334155" stroke-width="1.5"/>
  <text x="166" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#334155">延迟 p99</text>
  <polyline points="210,462 330,452 450,436 610,392 820,344" fill="none" stroke="#3730a3" stroke-width="2.5"/>
  <circle cx="210" cy="462" r="3.5" fill="#3730a3"/>
  <circle cx="330" cy="452" r="3.5" fill="#3730a3"/>
  <circle cx="450" cy="436" r="3.5" fill="#3730a3"/>
  <circle cx="610" cy="392" r="3.5" fill="#b45309"/>
  <circle cx="820" cy="344" r="3.5" fill="#b45309"/>
  <line x1="530" y1="352" x2="530" y2="470" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="538" y="366" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">膝点 500~600 RPS</text>
  <text x="190" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#334155">100</text>
  <text x="310" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#334155">200</text>
  <text x="430" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#334155">400</text>
  <text x="590" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#334155">800</text>
  <text x="800" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#334155">1600</text>
  <text x="160" y="508" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">前三档线性、第四档抬头、第五档竖直攀升；横轴单位 RPS。</text>
  <text x="30" y="540" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">恒定到达率才能规避协调遗漏：1000 并发下 1 秒停顿只记 1 个样本，p99 被系统性低估。</text>
</svg>
