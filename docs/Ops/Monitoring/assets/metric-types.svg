<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="300" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Prometheus 指标类型</text>
  <!-- Counter -->
  <g>
    <rect x="30" y="70" width="185" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="122" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Counter 计数器</text>
    <text x="122" y="125" text-anchor="middle" font-size="11" fill="#4b5563">只增不减</text>
    <text x="122" y="145" text-anchor="middle" font-size="11" fill="#4b5563">请求总数、错误数</text>
    <text x="122" y="185" text-anchor="middle" font-size="10" fill="#6b7280">rate() 求速率</text>
  </g>
  <!-- Gauge -->
  <g>
    <rect x="235" y="70" width="185" height="190" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="327" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">Gauge 仪表</text>
    <text x="327" y="125" text-anchor="middle" font-size="11" fill="#4b5563">可增可减</text>
    <text x="327" y="145" text-anchor="middle" font-size="11" fill="#4b5563">CPU、内存、温度</text>
    <text x="327" y="185" text-anchor="middle" font-size="10" fill="#6b7280">当前值直接查询</text>
  </g>
  <!-- Histogram -->
  <g>
    <rect x="440" y="70" width="185" height="190" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="532" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Histogram 直方图</text>
    <text x="532" y="125" text-anchor="middle" font-size="11" fill="#4b5563">分桶计数</text>
    <text x="532" y="145" text-anchor="middle" font-size="11" fill="#4b5563">请求耗时分布</text>
    <text x="532" y="185" text-anchor="middle" font-size="10" fill="#6b7280">histogram_quantile()</text>
  </g>
  <!-- Summary -->
  <g>
    <rect x="645" y="70" width="165" height="190" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="727" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">Summary 摘要</text>
    <text x="727" y="125" text-anchor="middle" font-size="11" fill="#4b5563">客户端预计算分位</text>
    <text x="727" y="145" text-anchor="middle" font-size="11" fill="#4b5563">如 0.5/0.9/0.99</text>
    <text x="727" y="185" text-anchor="middle" font-size="10" fill="#6b7280">无法跨实例聚合</text>
  </g>
  <text x="420" y="285" text-anchor="middle" font-size="12" fill="#475569">最佳实践：耗时用 Histogram（可聚合），计数用 Counter + rate，状态用 Gauge</text>
</svg>
