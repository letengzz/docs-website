<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>值班升级链路：从告警到人接单的三级阶梯</title>
<style>.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:12px;fill:#334155;font-weight:600}.s{font-size:11px;fill:#475569}.tag{font-size:10px;fill:#64748B}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.slate{fill:#F1F5F9;stroke:#94A3B8}</style>
<rect width="920" height="560" fill="#FFFFFF"/>
<text x="460" y="32" text-anchor="middle" class="h">升级链路：每一级都必须有「多久没人接就叫下一级」</text>
<text x="460" y="54" text-anchor="middle" class="tag">链路的验证判据只有一条：真的叫到过人。纸面上的链路在第一次真实故障时才会暴露它断在哪</text>

<rect x="40" y="76" width="200" height="120" rx="10" class="box blue"/>
<text x="140" y="100" text-anchor="middle" class="lt">第一级：当班值班人</text>
<text x="140" y="124" text-anchor="middle" class="tag">手机 + 应用推送 + 电话</text>
<text x="140" y="144" text-anchor="middle" class="tag">三通道同时打，不只发消息</text>
<text x="140" y="164" text-anchor="middle" class="tag">5 分钟内未确认 → 升级</text>
<text x="140" y="184" text-anchor="middle" class="tag">本人对自己负责的时段有义务</text>

<rect x="256" y="76" width="200" height="120" rx="10" class="box amber"/>
<text x="356" y="100" text-anchor="middle" class="lt">第二级：备份值班人</text>
<text x="356" y="124" text-anchor="middle" class="tag">与当班人不同人、不同地点</text>
<text x="356" y="144" text-anchor="middle" class="tag">能接手全部处置动作</text>
<text x="356" y="164" text-anchor="middle" class="tag">10 分钟未确认 → 再升级</text>
<text x="356" y="184" text-anchor="middle" class="tag">「备份」不是荣誉头衔</text>

<rect x="472" y="76" width="200" height="120" rx="10" class="box rose"/>
<text x="572" y="100" text-anchor="middle" class="lt">第三级：负责人与厂商</text>
<text x="572" y="124" text-anchor="middle" class="tag">业务负责人 + 技术负责人</text>
<text x="572" y="144" text-anchor="middle" class="tag">必要时拉云厂商 / 中间件厂商</text>
<text x="572" y="164" text-anchor="middle" class="tag">第三级的职责是决策与资源</text>
<text x="572" y="184" text-anchor="middle" class="tag">不是亲自上手改配置</text>

<rect x="688" y="76" width="192" height="120" rx="10" class="box slate"/>
<text x="784" y="100" text-anchor="middle" class="lt">链路失效的三种形态</text>
<text x="784" y="124" text-anchor="middle" class="tag">① 电话打不通（换号未更新）</text>
<text x="784" y="144" text-anchor="middle" class="tag">② 升级没人知道要按</text>
<text x="784" y="164" text-anchor="middle" class="tag">③ 全都睡在同一时区</text>
<text x="784" y="184" text-anchor="middle" class="tag">三者都靠演练才能发现</text>

<rect x="40" y="216" width="840" height="112" rx="10" class="box amber"/>
<text x="460" y="240" text-anchor="middle" class="lt">告警门禁：什么才有资格「叫醒人」</text>
<text x="460" y="264" text-anchor="middle" class="tag">可行动才告警：一条告警如果写不出对应的处置动作，它就不该变成电话，只能变成工单或看板上的一个数字</text>
<text x="460" y="284" text-anchor="middle" class="tag">夜间预算：一晚上叫醒同一个人超过两次，第二次之后的响应质量会断崖式下降，这时候要治的是告警而不是人</text>
<text x="460" y="304" text-anchor="middle" class="tag">抖动告警删除而不是降噪：反复自动恢复的告警每响一次都在教育值班人「可以忽略」，最终连真故障一起忽略</text>

<rect x="40" y="344" width="410" height="180" rx="10" class="box green"/>
<text x="245" y="368" text-anchor="middle" class="lt">轮值表能不能成立的四个算术条件</text>
<text x="245" y="392" text-anchor="middle" class="tag">① 人数：单时区 7×24 至少 6 人起步，</text>
<text x="245" y="408" text-anchor="middle" class="tag">人越少，人均夜间次数越高，流失越快</text>
<text x="245" y="432" text-anchor="middle" class="tag">② 班次：轮班长度必须容得下一次完整处置</text>
<text x="245" y="448" text-anchor="middle" class="tag">③ 交接：换班时未结案的必须有一条交接记录</text>
<text x="245" y="472" text-anchor="middle" class="tag">④ 兜底：请假、离职、连续值班撞车时谁补</text>
<text x="245" y="496" text-anchor="middle" class="tag">前两条是数学问题，后两条是管理问题</text>
<text x="245" y="514" text-anchor="middle" class="tag">但四条缺一条，表就只是贴在墙上的纸</text>

<rect x="470" y="344" width="410" height="180" rx="10" class="box blue"/>
<text x="675" y="368" text-anchor="middle" class="lt">值班体验决定这套体系能活多久</text>
<text x="675" y="392" text-anchor="middle" class="tag">值守是被占用的人生：白天补休、夜间补偿、</text>
<text x="675" y="408" text-anchor="middle" class="tag">免打扰时段之外的合理豁免，都要写清楚</text>
<text x="675" y="432" text-anchor="middle" class="tag">被误报叫醒要有「关闭这条告警」的权利，</text>
<text x="675" y="448" text-anchor="middle" class="tag">否则值班人会自己发明一套静音规则</text>
<text x="675" y="472" text-anchor="middle" class="tag">值班人应当有权在任何时刻把人叫起来，</text>
<text x="675" y="488" text-anchor="middle" class="tag">这条权限不设审批</text>
<text x="675" y="514" text-anchor="middle" class="tag">把「叫人来」当成能力，而不是麻烦别人</text>
</svg>
