<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL 8.0 → 8.4：三条路，选错会丢掉回退能力</text>
<text x="40" y="76" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">判据不是「哪条快」，是「出问题时能不能回到 8.0」</text>
<rect x="40" y="100" width="200" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="140.0" y="132.7" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL 8.0.x</text>
<line x1="240" y1="128" x2="300" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="246" y="120" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">先查版本</text>
<rect x="300" y="100" width="240" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="420.0" y="132.3" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">util.checkForServerUpgrade</text>
<line x1="540" y1="128" x2="600" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="600" y="100" width="320" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="760.0" y="132.3" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">8.0.37+ ? 否则先升 8.0.46</text>
<rect x="40" y="200" width="270" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="175.0" y="251.8" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">A. 原地升级</text>
<text x="175.0" y="270.2" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif"></text>
<text x="175.0" y="288.8" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">停服 · 原地换二进制</text>
<text x="175.0" y="307.2" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">最快 · 不可回退</text>
<rect x="345" y="200" width="270" height="150" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="480.0" y="251.8" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">B. 复制升级</text>
<text x="480.0" y="270.2" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif"></text>
<text x="480.0" y="288.8" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">8.4 从库追平 → 切主</text>
<text x="480.0" y="307.2" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">可回退 · 拓扑要改</text>
<rect x="650" y="200" width="270" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="785.0" y="251.8" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">C. dump/restore</text>
<text x="785.0" y="270.2" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif"></text>
<text x="785.0" y="288.8" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">逻辑导出 → 新实例</text>
<text x="785.0" y="307.2" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">最慢 · 跨两版可用</text>
<rect x="40" y="380" width="880" height="110" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="480.0" y="439.5" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">三个必须先改的断点：mysql_native_password 默认关闭（老账号登不上）· slave_* 变量与 START SLAVE 语法移除（复制脚本全废）· innodb_log_file_size 等参数被删（起不来）</text>
<text x="40" y="512" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">8.4 没有原地降级：唯一回退是「升级前的备份」或「逻辑导回 8.0」——所以升级前那次备份是整个方案的一部分，不是流程礼仪。</text>
</svg>
