<text x="665.0" y="400.2" font-size="13" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">怎么算通过</text>
<rect x="780" y="358" width="140" height="56" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<text x="850.0" y="381.2" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑩ 常见问题</text>
<text x="850.0" y="400.2" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分诊</text>
