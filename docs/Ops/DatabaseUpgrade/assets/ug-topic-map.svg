<text x="295.0" y="314.2" font-size="13" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">迁移</text>
<rect x="230" y="358" width="130" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
