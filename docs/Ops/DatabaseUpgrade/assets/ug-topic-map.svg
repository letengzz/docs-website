<line x1="360" y1="386" x2="398" y2="386" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="550" y1="386" x2="588" y2="386" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="740" y1="386" x2="778" y2="386" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="168" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">先判「该不该升、能不能升」</text>
<text x="340" y="250" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">两条迁移通道：持续同步 or 原地升级</text>
<text x="560" y="340" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">只有切换窗口这一段要停写</text>
<text x="40" y="500" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">实测前提：本页所有读数来自 PG 18.6 双实例（同一主版本，跨大版本语义一致），20 万订单 / 40 万明细 / 87 MB 库。</text>
