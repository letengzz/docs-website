<text x="295.0" y="400.2" font-size="13" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">8.0→8.4</text>
<rect x="230" y="444" width="130" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="295.0" y="467.2" font-size="13" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑦ PostgreSQL</text>
<text x="295.0" y="486.2" font-size="13" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">17→18</text>
<rect x="400" y="358" width="150" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
