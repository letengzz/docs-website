<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <rect width="880" height="540" fill="#FFFFFF"/>
  <text x="440" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E293B">GameDay 时间轴：半天演练日的五个阶段</text>

  <line x1="80" y1="150" x2="820" y2="150" stroke="#CBD5E1" stroke-width="6"/>

  <circle cx="120" cy="150" r="14" fill="#3B82F6"/>
  <circle cx="290" cy="150" r="14" fill="#22C55E"/>
  <circle cx="460" cy="150" r="14" fill="#F59E0B"/>
  <circle cx="630" cy="150" r="14" fill="#EC4899"/>
  <circle cx="790" cy="150" r="14" fill="#8B5CF6"/>

  <rect x="50" y="190" width="160" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">T-1 周 准备</text>
  <text x="130" y="246" text-anchor="middle" font-size="12.5" fill="#334155">定场景与稳态指标</text>
  <text x="130" y="268" text-anchor="middle" font-size="12.5" fill="#334155">检查回滚手段</text>
  <text x="130" y="290" text-anchor="middle" font-size="12.5" fill="#334155">通知相关团队</text>

  <rect x="220" y="190" width="160" height="130" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">T0 开场会</text>
  <text x="300" y="246" text-anchor="middle" font-size="12.5" fill="#334155">角色分工念一遍</text>
  <text x="300" y="268" text-anchor="middle" font-size="12.5" fill="#334155">明确中止条件</text>
  <text x="300" y="290" text-anchor="middle" font-size="12.5" fill="#334155">确认「演练」标记生效</text>

  <rect x="390" y="190" width="160" height="130" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="470" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#B45309">T0+1h 注入</text>
  <text x="470" y="246" text-anchor="middle" font-size="12.5" fill="#334155">按实验清单逐个执行</text>
  <text x="470" y="268" text-anchor="middle" font-size="12.5" fill="#334155">观察员实时记录</text>
  <text x="470" y="290" text-anchor="middle" font-size="12.5" fill="#334155">超红线立即急停</text>

  <rect x="560" y="190" width="160" height="130" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="640" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#BE185D">T+2h 恢复确认</text>
  <text x="640" y="246" text-anchor="middle" font-size="12.5" fill="#334155">全部注入回滚</text>
  <text x="640" y="268" text-anchor="middle" font-size="12.5" fill="#334155">指标回基线</text>
  <text x="640" y="290" text-anchor="middle" font-size="12.5" fill="#334155">告警恢复静默</text>

  <rect x="730" y="190" width="130" height="130" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="795" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D28D9">T+3h 记录会</text>
  <text x="795" y="246" text-anchor="middle" font-size="12.5" fill="#334155">逐实验过结论</text>
  <text x="795" y="268" text-anchor="middle" font-size="12.5" fill="#334155">弱点进改进队列</text>
  <text x="795" y="290" text-anchor="middle" font-size="12.5" fill="#334155">实验归档入库</text>

  <rect x="50" y="360" width="800" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="80" y="392" font-size="15" font-weight="bold" fill="#1E293B">五个角色，一次演练至少配齐四个</text>
  <text x="80" y="420" font-size="14" fill="#334155">指挥官（控节奏、唯一有权叫停）｜注入员（只执行清单内动作）｜观察员（盯面板记时间戳）</text>
  <text x="80" y="446" font-size="14" fill="#334155">通信员（对外通知、控「演练」标签）｜记录员（实验结论与改进项，可由观察员兼任）</text>
  <text x="80" y="476" font-size="13" fill="#64748B">纪律：注入员不做清单外动作；任何人都可以喊停，喊停后先恢复再讨论</text>
</svg>
