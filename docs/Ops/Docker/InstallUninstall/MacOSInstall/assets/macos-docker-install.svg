<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">macOS 安装 Docker：先选路线，再谈步骤</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">Intel 与 Apple Silicon 的安装包不同，授权方式也决定了能不能商用</text>

  <rect x="40" y="82" width="255" height="200" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="167" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">Docker Desktop</text>
  <text x="167" y="130" text-anchor="middle" font-size="11" fill="#6366f1">官方 GUI 方案</text>
  <line x1="60" y1="144" x2="275" y2="144" stroke="#c7d2fe" stroke-width="1"/>
  <text x="60" y="168" font-size="12" fill="#4b5563">.dmg 拖入 Applications 即可</text>
  <text x="60" y="190" font-size="12" fill="#4b5563">自带 GUI、Kubernetes 开关</text>
  <text x="60" y="212" font-size="12" fill="#4b5563">安装路径固定，无需额外配置</text>
  <text x="60" y="242" font-size="12" fill="#059669">上手成本最低</text>
  <text x="60" y="266" font-size="12" fill="#b91c1c">大企业商用需付费订阅</text>

  <rect x="312" y="82" width="255" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="439" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">Colima</text>
  <text x="439" y="130" text-anchor="middle" font-size="11" fill="#10b981">轻量替代 · 开源免费</text>
  <line x1="332" y1="144" x2="547" y2="144" stroke="#a7f3d0" stroke-width="1"/>
  <text x="332" y="168" font-size="12" font-family="monospace" fill="#1f2937">brew install colima docker</text>
  <text x="332" y="190" font-size="12" font-family="monospace" fill="#1f2937">colima start</text>
  <text x="332" y="212" font-size="12" fill="#4b5563">命令行容器运行时，无 GUI</text>
  <text x="332" y="242" font-size="12" fill="#059669">无授权限制，资源占用低</text>
  <text x="332" y="266" font-size="12" fill="#b91c1c">需自己配 docker context</text>

  <rect x="584" y="82" width="256" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="712" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">安装前先确认两件事</text>
  <line x1="604" y1="144" x2="820" y2="144" stroke="#fde68a" stroke-width="1"/>
  <text x="604" y="172" font-size="12" font-weight="bold" fill="#9a3412">① CPU 架构</text>
  <text x="604" y="194" font-size="12" fill="#4b5563">Apple Silicon → arm64 包</text>
  <text x="604" y="214" font-size="12" fill="#4b5563">Intel → x86_64 包</text>
  <text x="604" y="240" font-size="12" font-family="monospace" fill="#6b7280">uname -m</text>
  <text x="604" y="268" font-size="12" font-weight="bold" fill="#9a3412">② 用途与规模</text>
  <text x="604" y="288" font-size="11" fill="#4b5563">个人学习 / 企业内部 / 商业分发</text>

  <rect x="40" y="302" width="800" height="118" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="440" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#be123c">两个最常见的「装完了但用不了」</text>
  <text x="60" y="356" font-size="12" fill="#4b5563">① 装错架构包：Apple Silicon 上装 Intel 版需要 Rosetta，容器启动极慢甚至报 exec format error</text>
  <text x="60" y="378" font-size="12" fill="#4b5563">② 抢占端口：本机已有 5432 / 3306 / 6379 时，容器映射会失败，先查 lsof -i :5432</text>
  <text x="60" y="402" font-size="11" fill="#9f1239">安装完成后最小验证：docker run --rm hello-world（能跑通即链路正常）</text>
</svg>
