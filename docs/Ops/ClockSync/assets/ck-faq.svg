<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">六类症状的分诊路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一个「时间不对」，六条完全不同的修法</text>
  <rect x="280" y="60" width="200" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="78.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">症状：时间不对</text>
  <rect x="30" y="140" width="210" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="135" y="158.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">偏差大且抖动</text>
  <text x="135" y="175" text-anchor="middle" font-size="7.5" fill="#B45309">先看网络与丢包</text>
  <text x="135" y="192.25" text-anchor="middle" font-size="7.5" fill="#B45309">再看源是否 falseticker</text>
  <rect x="275" y="140" width="210" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="158.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">偏差小但一直长</text>
  <text x="380" y="175" text-anchor="middle" font-size="7.5" fill="#1D4ED8">freq 未收敛或被写死</text>
  <text x="380" y="192.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">看 drift 文件</text>
  <rect x="520" y="140" width="210" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="625" y="158.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">瞬间跳一大下</text>
  <text x="625" y="175" text-anchor="middle" font-size="7.5" fill="#6D28D9">step 或闰秒</text>
  <text x="625" y="192.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">查 makestep 与 smearing</text>
  <rect x="30" y="240" width="210" height="66" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="135" y="258.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">容器里更差</text>
  <text x="135" y="275" text-anchor="middle" font-size="7.5" fill="#0E7490">宿主时钟透传</text>
  <text x="135" y="292.25" text-anchor="middle" font-size="7.5" fill="#0E7490">virtio 时钟源</text>
  <rect x="275" y="240" width="210" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="258.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">偶发验证失败</text>
  <text x="380" y="275" text-anchor="middle" font-size="7.5" fill="#B91C1C">证书 notBefore</text>
  <text x="380" y="292.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">本地偏慢 1 s 即失败</text>
  <rect x="520" y="240" width="210" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="625" y="258.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">只有一台不对</text>
  <text x="625" y="275" text-anchor="middle" font-size="7.5" fill="#0F766E">硬件/温度</text>
  <text x="625" y="292.25" text-anchor="middle" font-size="7.5" fill="#0F766E">或该机被隔离出网</text>
  <line x1="380" y1="114" x2="135" y2="138" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="114" x2="380" y2="138" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="114" x2="625" y2="138" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="240" y1="206" x2="240" y2="238" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="206" x2="380" y2="238" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="730" y1="206" x2="730" y2="238" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="330" width="720" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="348.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">分诊顺序的一条纪律</text>
  <text x="380" y="365" text-anchor="middle" font-size="7.5" fill="#4338CA">先回答「偏差随时间怎么变」，再问「谁给的源」——反过来会一直在换源，而不去修频率</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
