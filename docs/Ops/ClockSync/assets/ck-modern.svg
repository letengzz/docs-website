<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="370" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">当前主线：chrony 与硬件时间戳</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">配置、观测读数与三个必设项</text>
  <rect x="20" y="62" width="230" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="135" y="80.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">配置在 /etc/chrony.conf</text>
  <text x="135" y="97" text-anchor="middle" font-size="7.5" fill="#4338CA">pool / server 带 iburst</text>
  <text x="135" y="114.25" text-anchor="middle" font-size="7.5" fill="#4338CA">makestep 1.0 3</text>
  <rect x="265" y="62" width="230" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="80.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">观测 chronyc tracking</text>
  <text x="380" y="97" text-anchor="middle" font-size="7.5" fill="#1D4ED8">offset / freq / skew</text>
  <text x="380" y="114.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">root delay / dispersion</text>
  <rect x="510" y="62" width="230" height="92" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="625" y="80.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">观测 chronyc sources</text>
  <text x="625" y="97" text-anchor="middle" font-size="7.5" fill="#0E7490">^*/+/-/x 状态符</text>
  <text x="625" y="114.25" text-anchor="middle" font-size="7.5" fill="#0E7490">每源的 offset 与 reach</text>
  <rect x="20" y="170" width="230" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="135" y="188.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">为什么默认更合适</text>
  <text x="135" y="205" text-anchor="middle" font-size="7.5" fill="#047857">间歇联网下收敛快</text>
  <text x="135" y="222.25" text-anchor="middle" font-size="7.5" fill="#047857">虚拟化与容器里更稳</text>
  <text x="135" y="239.5" text-anchor="middle" font-size="7.5" fill="#047857">原生支持 NTS</text>
  <rect x="265" y="170" width="230" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="188.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">三个必设项</text>
  <text x="380" y="205" text-anchor="middle" font-size="7.5" fill="#0F766E">iburst（首次快速取样）</text>
  <text x="380" y="222.25" text-anchor="middle" font-size="7.5" fill="#0F766E">makestep（起步才允许跳）</text>
  <text x="380" y="239.5" text-anchor="middle" font-size="7.5" fill="#0F766E">rtcsync（写回硬件钟）</text>
  <rect x="510" y="170" width="230" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="625" y="188.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">两条纪律</text>
  <text x="625" y="205" text-anchor="middle" font-size="7.5" fill="#B45309">生产永不开 makestep 全时段</text>
  <text x="625" y="222.25" text-anchor="middle" font-size="7.5" fill="#B45309">漂移率要落监控，不只看 offset</text>
  <rect x="20" y="282" width="720" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="300.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">状态：当前主线</text>
  <text x="380" y="317" text-anchor="middle" font-size="7.5" fill="#6D28D9">新项目一律用这一套；旧版页只做迁移映射</text>
  <text x="380" y="334.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">与 NTS / PTP 的边界见「来源可信与传输」一页</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
