<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="376" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">应用侧四条纪律与各自的失效读数</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一条都对应一类「时间跳一下就出错，且不报错」的缺陷</text>
  <rect x="20" y="62" width="350" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="195" y="80.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 超时用单调时钟</text>
  <text x="195" y="97" text-anchor="middle" font-size="7.5" fill="#1D4ED8">墙钟回拨 1 s：剩余时间从 20 s 变 21 s</text>
  <text x="195" y="114.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">墙钟前跳 0.35 s：提前 0.35 s 触发</text>
  <rect x="390" y="62" width="350" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="565" y="80.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② 去重窗口要能容忍回拨</text>
  <text x="565" y="97" text-anchor="middle" font-size="7.5" fill="#6D28D9">300 s 窗口回拨 90 s 后只剩 210 s</text>
  <text x="565" y="114.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">回拨 30 s 会让 15 条已处理事件重放</text>
  <rect x="20" y="174" width="350" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="195" y="192.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 租约用「期限 + 余量」表达</text>
  <text x="195" y="209" text-anchor="middle" font-size="7.5" fill="#B45309">偏差 5 s / 租约 30 s：重叠 5 s（16.7%）</text>
  <text x="195" y="226.25" text-anchor="middle" font-size="7.5" fill="#B45309">偏差 35 s：重叠 30 s，双主窗口成立</text>
  <rect x="390" y="174" width="350" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="192.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 排序存 「(时间, 误差界, 序号)」</text>
  <text x="565" y="209" text-anchor="middle" font-size="7.5" fill="#047857">偏差 σ 与真实差同量级时判错率近 50%</text>
  <text x="565" y="226.25" text-anchor="middle" font-size="7.5" fill="#047857">单调序号是唯一稳的因果序</text>
  <rect x="20" y="286" width="720" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="304.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">一个共同点</text>
  <text x="380" y="321" text-anchor="middle" font-size="7.5" fill="#B91C1C">四条纪律都不是「把时钟调准」能解决的</text>
  <text x="380" y="338.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">它们要求代码承认：墙上时间是可被修正的估计值</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
