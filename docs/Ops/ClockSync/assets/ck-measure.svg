<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">怎么证明「准」：四个时间戳与一条误差界</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">点估计谁都会算，能不能给出误差界才是工程问题</text>
  <text x="380" y="72" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">一次 NTP 交换的四个时间戳</text>
  <rect x="60" y="88" width="120" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="120" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">t1</text>
  <text x="120" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">客户端发出</text>
  <rect x="220" y="88" width="120" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="280" y="106.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">t2</text>
  <text x="280" y="123" text-anchor="middle" font-size="7.5" fill="#4338CA">服务器收到</text>
  <rect x="380" y="88" width="120" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="440" y="106.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">t3</text>
  <text x="440" y="123" text-anchor="middle" font-size="7.5" fill="#6D28D9">服务器发出</text>
  <rect x="540" y="88" width="120" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="600" y="106.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">t4</text>
  <text x="600" y="123" text-anchor="middle" font-size="7.5" fill="#0F766E">客户端收到</text>
  <line x1="180" y1="111" x2="218" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="340" y1="111" x2="378" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="500" y1="111" x2="538" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="158" width="340" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="190" y="176.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">能算出的两个量</text>
  <text x="190" y="193" text-anchor="middle" font-size="7.5" fill="#334155">offset = ((t2-t1) + (t3-t4)) / 2</text>
  <text x="190" y="210.25" text-anchor="middle" font-size="7.5" fill="#334155">delay  = (t4-t1) - (t3-t2)</text>
  <text x="190" y="227.5" text-anchor="middle" font-size="7.5" fill="#334155">两者都假设去回路径对称</text>
  <rect x="380" y="158" width="360" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="176.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">去回不对称时的偏差</text>
  <text x="560" y="193" text-anchor="middle" font-size="7.5" fill="#B91C1C">路径差 2 ms → 估计偏 +1.000 ms</text>
  <text x="560" y="210.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">路径差 50 ms → 估计偏 +25.001 ms</text>
  <text x="560" y="227.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">偏差恒等于路径差的一半</text>
  <rect x="20" y="268" width="340" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="286.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">多采几次的收益（2000 轮 × 8 次）</text>
  <text x="190" y="303" text-anchor="middle" font-size="7.5" fill="#047857">单次 RMS 1.946 ms</text>
  <text x="190" y="320.25" text-anchor="middle" font-size="7.5" fill="#047857">8 次均值 RMS 0.711 ms（降 2.7 倍）</text>
  <text x="190" y="337.5" text-anchor="middle" font-size="7.5" fill="#047857">取最小 RTT 2.018 ms（无收益）</text>
  <rect x="380" y="268" width="360" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="286.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">误差界怎么写成一句话</text>
  <text x="560" y="303" text-anchor="middle" font-size="7.5" fill="#B45309">|offset| + root delay/2 + root dispersion</text>
  <text x="560" y="320.25" text-anchor="middle" font-size="7.5" fill="#B45309">例：12 µs + 600 µs + 300 µs = 0.912 ms</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
