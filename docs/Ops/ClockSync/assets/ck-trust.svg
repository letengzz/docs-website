<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">来源可信与传输：NTS、伪装源与硬件时间戳</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">认证解决「谁在答」，不解决「答得对不对」</text>
  <rect x="20" y="62" width="340" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190" y="80.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">NTP 原味的三个缺口</text>
  <text x="190" y="97" text-anchor="middle" font-size="7.5" fill="#B91C1C">无认证：中间人可以伪造应答</text>
  <text x="190" y="114.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">无加密：谁都能看到你在跟谁对时</text>
  <text x="190" y="131.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">无绑定：应答与请求没有密码学关联</text>
  <rect x="380" y="62" width="360" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="80.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">NTS 补上的两件事</text>
  <text x="560" y="97" text-anchor="middle" font-size="7.5" fill="#047857">先做 TLS 1.3 握手，再导出密钥</text>
  <text x="560" y="114.25" text-anchor="middle" font-size="7.5" fill="#047857">后续 NTP 包全部带认证扩展字段</text>
  <line x1="360" y1="106" x2="378" y2="106" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="168" width="230" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="135" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">信任根在哪</text>
  <text x="135" y="203" text-anchor="middle" font-size="7.5" fill="#B45309">NTS 仍信任 DNS 与证书体系</text>
  <text x="135" y="220.25" text-anchor="middle" font-size="7.5" fill="#B45309">证书错了，时间也会跟着错</text>
  <rect x="265" y="168" width="230" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">防不住什么</text>
  <text x="380" y="203" text-anchor="middle" font-size="7.5" fill="#C2410C">源本身撒谎（falseticker）</text>
  <text x="380" y="220.25" text-anchor="middle" font-size="7.5" fill="#C2410C">同一上游全体偏移</text>
  <rect x="510" y="168" width="230" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="625" y="186.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">PTP 的取舍</text>
  <text x="625" y="203" text-anchor="middle" font-size="7.5" fill="#0F766E">硬件时间戳把误差压到亚微秒</text>
  <text x="625" y="220.25" text-anchor="middle" font-size="7.5" fill="#0F766E">要求交换机与网卡支持</text>
  <rect x="20" y="268" width="720" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="286.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">误差预算（RSS 合成，不是线性相加）</text>
  <text x="380" y="303" text-anchor="middle" font-size="7.5" fill="#4338CA">源 50 µs + 出口 200 µs + 交换机 60 µs + 网卡戳 50 µs + 取时 20 µs</text>
  <text x="380" y="320.25" text-anchor="middle" font-size="7.5" fill="#4338CA">RSS 221.4 µs，线性相加 380.0 µs（差 1.72 倍）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
