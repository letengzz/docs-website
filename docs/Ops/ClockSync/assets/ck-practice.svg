<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一台机器时间不对：七步定位</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先读后写；每一步都有可复跑的命令与期望</text>
  <rect x="20" y="70" width="168" height="88" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="104" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">1 量偏差</text>
  <text x="104" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">chronyc tracking</text>
  <rect x="202" y="70" width="168" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="286" y="88.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">2 看源</text>
  <text x="286" y="105" text-anchor="middle" font-size="7.5" fill="#1D4ED8">chronyc sources -v</text>
  <rect x="384" y="70" width="168" height="88" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="468" y="88.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">3 看频率</text>
  <text x="468" y="105" text-anchor="middle" font-size="7.5" fill="#0E7490">freq 与 skew 是否收敛</text>
  <rect x="566" y="70" width="168" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="650" y="88.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">4 看路径</text>
  <text x="650" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">root delay / 丢包</text>
  <rect x="20" y="178" width="168" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="104" y="196.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">5 看环境</text>
  <text x="104" y="213" text-anchor="middle" font-size="7.5" fill="#047857">虚拟化、温度、CPU 降频</text>
  <rect x="202" y="178" width="168" height="88" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="286" y="196.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">6 定性</text>
  <text x="286" y="213" text-anchor="middle" font-size="7.5" fill="#B45309">step 还是 slew</text>
  <rect x="384" y="178" width="168" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="468" y="196.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">7 收口</text>
  <text x="468" y="213" text-anchor="middle" font-size="7.5" fill="#6D28D9">误差界写进监控</text>
  <text x="380" y="300" text-anchor="middle" font-size="9" fill="#475569">前四步只读不写；第 5 步之前不要动配置</text>
  <rect x="20" y="318" width="350" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="195" y="336.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">输出必须带三个数</text>
  <text x="195" y="353" text-anchor="middle" font-size="7.5" fill="#334155">偏差 + 误差界 + 频率估计</text>
  <rect x="390" y="318" width="350" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="565" y="336.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">三个数缺一个</text>
  <text x="565" y="353" text-anchor="middle" font-size="7.5" fill="#B91C1C">结论就无法被别人复核</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
