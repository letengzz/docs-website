<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="376" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">时钟治理的七段链</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">源 → 同 → 稳 → 验 → 用 → 跨 → 治；三处失败不报错</text>
  <rect x="20" y="70" width="96" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="68" y="88.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">源</text>
  <text x="68" y="105" text-anchor="middle" font-size="7.5" fill="#4338CA">选谁授时</text>
  <text x="68" y="122.25" text-anchor="middle" font-size="7.5" fill="#4338CA">真源/层级</text>
  <rect x="132" y="70" width="96" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="180" y="88.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">同</text>
  <text x="180" y="105" text-anchor="middle" font-size="7.5" fill="#1D4ED8">伺服环路</text>
  <text x="180" y="122.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">slew/step</text>
  <rect x="244" y="70" width="96" height="58" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="292" y="88.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">稳</text>
  <text x="292" y="105" text-anchor="middle" font-size="7.5" fill="#0E7490">偏差与频率</text>
  <text x="292" y="122.25" text-anchor="middle" font-size="7.5" fill="#0E7490">温漂</text>
  <rect x="356" y="70" width="96" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="404" y="88.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">验</text>
  <text x="404" y="105" text-anchor="middle" font-size="7.5" fill="#0F766E">误差界</text>
  <text x="404" y="122.25" text-anchor="middle" font-size="7.5" fill="#0F766E">自证读数</text>
  <rect x="468" y="70" width="96" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="516" y="88.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">用</text>
  <text x="516" y="105" text-anchor="middle" font-size="7.5" fill="#047857">取时纪律</text>
  <text x="516" y="122.25" text-anchor="middle" font-size="7.5" fill="#047857">四种时钟</text>
  <rect x="580" y="70" width="96" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="628" y="88.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">跨</text>
  <text x="628" y="105" text-anchor="middle" font-size="7.5" fill="#B45309">可比性</text>
  <text x="628" y="122.25" text-anchor="middle" font-size="7.5" fill="#B45309">判先后</text>
  <rect x="692" y="70" width="48" height="58" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="716" y="88.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">治</text>
  <text x="716" y="105" text-anchor="middle" font-size="7.5" fill="#C2410C">变更</text>
  <text x="716" y="122.25" text-anchor="middle" font-size="7.5" fill="#C2410C">审计</text>
  <line x1="116" y1="99" x2="131" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="228" y1="99" x2="243" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="340" y1="99" x2="355" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="452" y1="99" x2="467" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="564" y1="99" x2="579" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="676" y1="99" x2="691" y2="99" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="160" width="340" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="190" y="178.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">三个「现在是几点」</text>
  <text x="190" y="195" text-anchor="middle" font-size="7.5" fill="#334155">瞬时 UTC：伺服出来的估计值，带误差界</text>
  <text x="190" y="212.25" text-anchor="middle" font-size="7.5" fill="#334155">挂钟本地时间：会跳、会被规则改写</text>
  <text x="190" y="229.5" text-anchor="middle" font-size="7.5" fill="#334155">单调间隔：只能测差值，不能跨机比</text>
  <rect x="380" y="160" width="360" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="178.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">五段失败是安静的</text>
  <text x="560" y="195" text-anchor="middle" font-size="7.5" fill="#B91C1C">源选错：层级对但根不对</text>
  <text x="560" y="212.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">slew 太慢：偏差长期存在却「已同步」</text>
  <text x="560" y="229.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">闰秒与回拨：超时、去重、排序同时失真</text>
  <rect x="20" y="276" width="340" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="190" y="294.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">两条判据口径</text>
  <text x="190" y="311" text-anchor="middle" font-size="7.5" fill="#6D28D9">准 = 偏差落在声明误差界内</text>
  <text x="190" y="328.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">稳 = 频率可估、可复现</text>
  <rect x="380" y="276" width="360" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="560" y="294.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">一个收口动作</text>
  <text x="560" y="311" text-anchor="middle" font-size="7.5" fill="#4338CA">任何结论必须带：哪台、偏差多少、误差界多大</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
