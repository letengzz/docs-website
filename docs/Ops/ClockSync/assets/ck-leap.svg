<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="408" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">闰秒：一天有 86401 秒</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">step 让某一秒出现两次或消失，smear 把它摊成 24 小时的斜率</text>
  <line x1="60" y1="250" x2="720" y2="250" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="60" y="266" text-anchor="start" font-size="8" fill="#64748B">23:59:00</text>
  <text x="330" y="266" text-anchor="middle" font-size="8" fill="#64748B">23:59:59</text>
  <text x="430" y="266" text-anchor="middle" font-size="8" fill="#991B1B" font-weight="bold">23:59:60</text>
  <text x="530" y="266" text-anchor="middle" font-size="8" fill="#64748B">00:00:00</text>
  <text x="700" y="266" text-anchor="start" font-size="8" fill="#64748B">00:00:01</text>
  <rect x="390" y="150" width="60" height="100" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="420" y="142" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">多出来的 1 秒</text>
  <text x="420" y="286" text-anchor="middle" font-size="8.5" fill="#991B1B">一天 86401 s</text>
  <rect x="20" y="310" width="230" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="135" y="328.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">step 一秒</text>
  <text x="135" y="345" text-anchor="middle" font-size="7.5" fill="#B91C1C">墙钟真的出现 23:59:60</text>
  <text x="135" y="362.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">跨这一秒的间隔多算 1 s</text>
  <rect x="265" y="310" width="230" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="328.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">smear（24 h）</text>
  <text x="380" y="345" text-anchor="middle" font-size="7.5" fill="#B45309">斜率 11.6 ppm，末尾累计 1.000 s</text>
  <text x="380" y="362.25" text-anchor="middle" font-size="7.5" fill="#B45309">居中 smear 最大偏差 0.500 s</text>
  <rect x="510" y="310" width="230" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="625" y="328.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">最该做的一件事</text>
  <text x="625" y="345" text-anchor="middle" font-size="7.5" fill="#047857">间隔一律读单调时钟</text>
  <text x="625" y="362.25" text-anchor="middle" font-size="7.5" fill="#047857">墙钟只用来打标签</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
