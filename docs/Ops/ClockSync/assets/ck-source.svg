<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="458" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">时间源的层级与选源约束</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">stratum 是跳数，不是精度；两头都坏时本地看不出</text>
  <rect x="300" y="60" width="160" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="78.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">真源</text>
  <text x="380" y="95" text-anchor="middle" font-size="7.5" fill="#B45309">GNSS / 原子钟</text>
  <text x="380" y="112.25" text-anchor="middle" font-size="7.5" fill="#B45309">北斗、GPS、铯钟</text>
  <rect x="300" y="138" width="160" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="156.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">Stratum 1</text>
  <text x="380" y="173" text-anchor="middle" font-size="7.5" fill="#4338CA">直连真源的服务器</text>
  <rect x="120" y="212" width="180" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="210" y="230.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">Stratum 2</text>
  <text x="210" y="247" text-anchor="middle" font-size="7.5" fill="#1D4ED8">经网络取时的服务器</text>
  <rect x="460" y="212" width="180" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="550" y="230.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">Stratum 2'</text>
  <text x="550" y="247" text-anchor="middle" font-size="7.5" fill="#1D4ED8">另一家上游</text>
  <rect x="120" y="286" width="180" height="52" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="210" y="304.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">Stratum 3</text>
  <text x="210" y="321" text-anchor="middle" font-size="7.5" fill="#0E7490">再下一层</text>
  <rect x="460" y="286" width="180" height="52" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="550" y="304.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">客户机</text>
  <text x="550" y="321" text-anchor="middle" font-size="7.5" fill="#0F766E">最终被同步的机器</text>
  <line x1="380" y1="116" x2="380" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="340" y1="190" x2="240" y2="210" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="420" y1="190" x2="520" y2="210" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="210" y1="264" x2="210" y2="284" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="520" y1="264" x2="520" y2="284" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="360" width="340" height="86" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="190" y="378.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">选源的三条硬约束</text>
  <text x="190" y="395" text-anchor="middle" font-size="7.5" fill="#334155">≥ 4 个源，且至少 2 个不同上游</text>
  <text x="190" y="412.25" text-anchor="middle" font-size="7.5" fill="#334155">不选同机房、同出口的源（共因失效）</text>
  <text x="190" y="429.5" text-anchor="middle" font-size="7.5" fill="#334155">层级只是距离提示，不是精度承诺</text>
  <rect x="380" y="360" width="360" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="378.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">两个安静的坏源</text>
  <text x="560" y="395" text-anchor="middle" font-size="7.5" fill="#B91C1C">层级在降但源其实在自说自话（falseticker）</text>
  <text x="560" y="412.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">所有源都慢同样的量（同一个上游）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
