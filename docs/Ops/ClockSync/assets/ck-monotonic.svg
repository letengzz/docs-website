<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="760" height="386" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="386" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">跨机可比性：时间戳能排序到什么程度</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判错概率由「真实差 / 偏差」的比值决定，与绝对精度无关</text>
  <rect x="20" y="60" width="340" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="78.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">同一台机器内</text>
  <text x="190" y="95" text-anchor="middle" font-size="7.5" fill="#047857">单调时钟可直接求差，误差只来自取时</text>
  <text x="190" y="112.25" text-anchor="middle" font-size="7.5" fill="#047857">频率误差在 10 ppm 下 1 小时约 36 ms</text>
  <rect x="380" y="60" width="360" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="78.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">跨机器</text>
  <text x="560" y="95" text-anchor="middle" font-size="7.5" fill="#B45309">两个单调时钟原点不同，差值无意义</text>
  <text x="560" y="112.25" text-anchor="middle" font-size="7.5" fill="#B45309">只能靠「墙钟 + 误差界」判断先后</text>
  <text x="380" y="176" text-anchor="middle" font-size="9" fill="#475569">真实先后差固定时，判错概率只取决于 真实差 / 时钟偏差σ</text>
  <rect x="30" y="194" width="220" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="140" y="212.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">差 1 ms，σ = 1 ms</text>
  <text x="140" y="229" text-anchor="middle" font-size="7.5" fill="#B91C1C">判错 23.98%</text>
  <rect x="270" y="194" width="220" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="212.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">差 10 ms，σ = 10 ms</text>
  <text x="380" y="229" text-anchor="middle" font-size="7.5" fill="#B91C1C">判错 23.98%</text>
  <rect x="510" y="194" width="220" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="212.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">差 100 ms，σ = 50 ms</text>
  <text x="620" y="229" text-anchor="middle" font-size="7.5" fill="#C2410C">判错 7.86%</text>
  <rect x="30" y="288" width="340" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="200" y="306.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">推论一</text>
  <text x="200" y="323" text-anchor="middle" font-size="7.5" fill="#6D28D9">同一量级的时间差不能靠时间戳定序</text>
  <text x="200" y="340.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">需要因果序时用逻辑时钟或单调序号</text>
  <rect x="380" y="288" width="360" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="560" y="306.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">推论二</text>
  <text x="560" y="323" text-anchor="middle" font-size="7.5" fill="#4338CA">误差界要跟着时间戳一起存</text>
  <text x="560" y="340.25" text-anchor="middle" font-size="7.5" fill="#4338CA">否则半年后没人能判断这条排序是否成立</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
