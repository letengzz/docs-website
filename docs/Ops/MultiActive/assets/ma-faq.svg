<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .q { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .r { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .w { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.5; }
    .bad { fill: #fdeeee; stroke: #c0504d; stroke-width: 1.5; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 12px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .line { stroke: #8a94a6; stroke-width: 1.3; fill: none; marker-end: url(#arA); }
    .lbl { font-size: 10px; fill: #7a8494; }
  </style>
  <defs>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="24">分诊：先定位「坏在哪一层」，再决定动什么</text>

  <rect class="q" x="330" y="42" width="200" height="44" rx="8"/>
  <text class="h" x="430" y="60">切换后大量 5xx / 超时</text>
  <text class="s" x="430" y="77">先别回切，先看是「谁在报错」</text>

  <rect class="w" x="40" y="116" width="230" height="60" rx="8"/>
  <text class="h" x="155" y="136">只有一部分用户报错</text>
  <text class="s" x="155" y="154">→ 路由问题：归属表 / 缓存旧路由</text>
  <text class="s" x="155" y="170">查网关路由命中率与单元分布</text>

  <rect class="w" x="315" y="116" width="230" height="60" rx="8"/>
  <text class="h" x="430" y="136">全部用户报错</text>
  <text class="s" x="430" y="154">→ 依赖问题：库连接 / 证书 / DNS</text>
  <text class="s" x="430" y="170">查新单元的启动期校验日志</text>

  <rect class="w" x="590" y="116" width="230" height="60" rx="8"/>
  <text class="h" x="705" y="136">写失败、读正常</text>
  <text class="s" x="705" y="154">→ 写归属问题：还在写旧单元</text>
  <text class="s" x="705" y="170">或新单元只读未解除</text>

  <rect class="bad" x="40" y="220" width="230" height="80" rx="8"/>
  <text class="h" x="155" y="242">错误率 &gt; 阈值 且 5 分钟不降</text>
  <text class="s" x="155" y="262">回切不是「撤回」，是又一次切流</text>
  <text class="s" x="155" y="280">回切前必须确认旧单元已追平</text>

  <rect class="r" x="315" y="220" width="230" height="80" rx="8"/>
  <text class="h" x="430" y="242">延迟升高但无错</text>
  <text class="s" x="430" y="262">多半是跨单元调用或冷缓存</text>
  <text class="s" x="430" y="280">看 P99 与缓存命中率两条曲线</text>

  <rect class="r" x="590" y="220" width="230" height="80" rx="8"/>
  <text class="h" x="705" y="242">数据对不上</text>
  <text class="s" x="705" y="262">先跑不变量校验，再跑两侧对账</text>
  <text class="s" x="705" y="280">两者结论不同，别混着修</text>

  <rect class="q" x="250" y="330" width="360" height="60" rx="8"/>
  <text class="h" x="430" y="352">三条永远先查的「元凶」</text>
  <text class="s" x="430" y="372">DNS 缓存 / 连接池旧连接 / 会话与令牌里写死了单元</text>

  <path class="line" d="M430 86 L430 100 M155 100 L705 100 M155 100 L155 116 M430 100 L430 116 M705 100 L705 116"/>
  <path class="line" d="M155 176 L155 200 L155 220"/>
  <path class="line" d="M430 176 L430 200 L430 220"/>
  <path class="line" d="M705 176 L705 200 L705 220"/>
  <path class="line" d="M430 300 L430 330"/>
</svg>
