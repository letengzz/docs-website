<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.5; }
    .d { fill: #f3eefc; stroke: #8b6fd0; stroke-width: 1.5; }
    .g { fill: #f6f7f9; stroke: #9aa3af; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .line { stroke: #8a94a6; stroke-width: 1.3; fill: none; }
    .dash { stroke: #b0b8c4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <text class="t" x="430" y="26">多活与单元化：十个问题的分工</text>
  <text class="s" x="430" y="46">先答「写下在哪」，再答「切多快」，最后才谈「几个机房」</text>

  <rect class="g" x="300" y="62" width="260" height="46" rx="8"/>
  <text class="h" x="430" y="82">写归属：单元化模型</text>
  <text class="s" x="430" y="100">CellModel · 判据 MAC</text>

  <rect class="a" x="30" y="140" width="180" height="72" rx="8"/>
  <text class="h" x="120" y="163">为什么是单元化</text>
  <text class="s" x="120" y="182">形态、必答四问、假多活</text>
  <text class="s" x="120" y="200">MAO</text>

  <rect class="a" x="240" y="140" width="180" height="72" rx="8"/>
  <text class="h" x="330" y="163">请求怎么找单元</text>
  <text class="s" x="330" y="182">归属表、四层路由、缓存</text>
  <text class="s" x="330" y="200">MAR</text>

  <rect class="a" x="450" y="140" width="180" height="72" rx="8"/>
  <text class="h" x="540" y="163">数据怎么过去</text>
  <text class="s" x="540" y="182">三种同步、回环、序列</text>
  <text class="s" x="540" y="200">MAS</text>

  <rect class="b" x="660" y="140" width="170" height="72" rx="8"/>
  <text class="h" x="745" y="163">撞上了怎么办</text>
  <text class="s" x="745" y="182">可合并 / 不可合并</text>
  <text class="s" x="745" y="200">MAX</text>

  <rect class="c" x="140" y="248" width="180" height="72" rx="8"/>
  <text class="h" x="230" y="271">怎么切过去</text>
  <text class="s" x="230" y="290">三段时间、灰度、回切</text>
  <text class="s" x="230" y="308">MAT</text>

  <rect class="c" x="350" y="248" width="180" height="72" rx="8"/>
  <text class="h" x="440" y="271">凭什么说切得动</text>
  <text class="s" x="440" y="290">五级演练、可证伪判据</text>
  <text class="s" x="440" y="308">MAD</text>

  <rect class="d" x="560" y="248" width="180" height="72" rx="8"/>
  <text class="h" x="650" y="271">这套值多少钱</text>
  <text class="s" x="650" y="290">乘法成本、收敛手段</text>
  <text class="s" x="650" y="308">MAE</text>

  <rect class="d" x="175" y="350" width="180" height="60" rx="8"/>
  <text class="h" x="265" y="372">落到一个真实系统</text>
  <text class="s" x="265" y="391">双单元 + 切流 S1~S10 · MAP</text>

  <rect class="g" x="395" y="350" width="180" height="60" rx="8"/>
  <text class="h" x="485" y="372">撞墙时的十二问</text>
  <text class="s" x="485" y="391">分诊、清单、术语 · MAF</text>

  <path class="line" d="M430 108 L430 128 M120 128 L745 128 M120 128 L120 140 M330 128 L330 140 M540 128 L540 140 M745 128 L745 140"/>
  <path class="line" d="M120 212 L120 230 L230 230 L230 248"/>
  <path class="line" d="M330 212 L330 230 L440 230 L440 248"/>
  <path class="line" d="M745 212 L745 230 L650 230 L650 248"/>
  <path class="dash" d="M230 320 L230 340 L265 340 L265 350"/>
  <path class="dash" d="M440 320 L440 340 L485 340 L485 350"/>
</svg>
