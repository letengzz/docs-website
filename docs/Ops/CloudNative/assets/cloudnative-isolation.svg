<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="446" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Serverless 的三种隔离模型与真实约束</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">冷启动、内存、运行时长这三条硬指标，直接决定哪些业务能上函数</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Serverless 平台的核心差异不在语言支持，而在「隔离单元」</text>
  <rect x="20" y="96" width="236" height="106" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="138" y="114.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">microVM 模型</text>
  <text x="138" y="131" text-anchor="middle" font-size="7.5" fill="#B91C1C">代表：AWS Lambda / 阿里云 FC</text>
  <text x="138" y="148.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">每个执行环境一个轻量虚拟机</text>
  <text x="138" y="165.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">隔离最强、可跑任意二进制</text>
  <text x="138" y="182.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">冷启动：约 100~600 ms</text>
  <rect x="268" y="96" width="236" height="106" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="386" y="114.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">V8 隔离模型</text>
  <text x="386" y="131" text-anchor="middle" font-size="7.5" fill="#047857">代表：Cloudflare Workers</text>
  <text x="386" y="148.25" text-anchor="middle" font-size="7.5" fill="#047857">同一进程内多个 V8 Isolate</text>
  <text x="386" y="165.5" text-anchor="middle" font-size="7.5" fill="#047857">冷启动约 1 ms、无容器启动</text>
  <text x="386" y="182.75" text-anchor="middle" font-size="7.5" fill="#047857">内存上限 128 MB、无文件系统</text>
  <rect x="516" y="96" width="236" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="634" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">容器预热模型</text>
  <text x="634" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">代表：阿里云 FC 弹性/常驻实例</text>
  <text x="634" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">镜像复用 + 最小实例常热</text>
  <text x="634" y="165.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">常驻实例彻底消除冷启动</text>
  <text x="634" y="182.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">代价：常驻即计费</text>
  <text x="380" y="224" text-anchor="middle" font-size="10" fill="#991B1B">三种模型的共同约束：执行环境是「一次性」的——不能依赖上一次调用的内存状态</text>
  <text x="40" y="254" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">对比表</text>
  <rect x="20" y="264" width="118" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="79" y="281" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="138" y="264" width="300" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="288" y="281" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">microVM（Lambda / FC）</text>
  <rect x="438" y="264" width="302" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="589" y="281" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">V8 隔离（Workers）</text>
  <rect x="20" y="290" width="118" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="79" y="306" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">冷启动量级</text>
  <rect x="138" y="290" width="300" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="306" text-anchor="middle" font-size="8.5" fill="#334155">100 ms ~ 数秒（取决于运行时与包体）</text>
  <rect x="438" y="290" width="302" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="589" y="306" text-anchor="middle" font-size="8.5" fill="#334155">约 1 ms（isolate 已在进程内）</text>
  <rect x="20" y="315" width="118" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="79" y="331" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">运行时长上限</text>
  <rect x="138" y="315" width="300" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="331" text-anchor="middle" font-size="8.5" fill="#334155">15 分钟（Lambda）/ 24 小时（FC 长任务）</text>
  <rect x="438" y="315" width="302" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="589" y="331" text-anchor="middle" font-size="8.5" fill="#334155">默认 30 s CPU，最高 5 分钟</text>
  <rect x="20" y="340" width="118" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="79" y="356" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">内存上限</text>
  <rect x="138" y="340" width="300" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="356" text-anchor="middle" font-size="8.5" fill="#334155">128 MB ~ 10 GB 可选</text>
  <rect x="438" y="340" width="302" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="589" y="356" text-anchor="middle" font-size="8.5" fill="#334155">固定 128 MB</text>
  <rect x="20" y="365" width="118" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="79" y="381" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">系统能力</text>
  <rect x="138" y="365" width="300" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="381" text-anchor="middle" font-size="8.5" fill="#334155">可写 /tmp、可起子进程、可自定义运行时</text>
  <rect x="438" y="365" width="302" height="25" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="589" y="381" text-anchor="middle" font-size="8.5" fill="#334155">无文件系统、无子进程与线程</text>
  <rect x="20" y="390" width="118" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="79" y="406" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">计费口径</text>
  <rect x="138" y="390" width="300" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="406" text-anchor="middle" font-size="8.5" fill="#334155">调用次数 + 时长 × 内存（GB·s）</text>
  <rect x="438" y="390" width="302" height="25" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="589" y="406" text-anchor="middle" font-size="8.5" fill="#334155">请求数 + CPU 毫秒</text>
  <text x="380" y="428" text-anchor="middle" font-size="10" fill="#6D28D9">选型判据：要跑任意二进制/大内存/长任务 → microVM；要高 QPS 低延迟的边缘请求改写 → V8 隔离</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
