<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="464" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">云成本治理的七个杠杆与三条护栏</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份账单，处理顺序不同，结果可以差一半</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">降本杠杆按「不改变功能前提下的收益/成本比」排序</text>
  <rect x="20" y="96" width="174" height="90" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="107" y="114.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">① 删除僵尸负载</text>
  <text x="107" y="131" text-anchor="middle" font-size="7.5" fill="#B91C1C">无人访问的环境</text>
  <text x="107" y="148.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">产出：立竿见影</text>
  <text x="107" y="165.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">风险：极低</text>
  <rect x="206" y="96" width="174" height="90" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="293" y="114.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">② 收紧 request</text>
  <text x="293" y="131" text-anchor="middle" font-size="7.5" fill="#C2410C">按 p95 + 20% 余量</text>
  <text x="293" y="148.25" text-anchor="middle" font-size="7.5" fill="#C2410C">产出：提升装箱率</text>
  <text x="293" y="165.5" text-anchor="middle" font-size="7.5" fill="#C2410C">风险：低</text>
  <rect x="392" y="96" width="174" height="90" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="479" y="114.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">③ 用 Spot</text>
  <text x="479" y="131" text-anchor="middle" font-size="7.5" fill="#B45309">无状态任务优先</text>
  <text x="479" y="148.25" text-anchor="middle" font-size="7.5" fill="#B45309">产出：省 60~90%</text>
  <text x="479" y="165.5" text-anchor="middle" font-size="7.5" fill="#B45309">风险：中（需可中断）</text>
  <rect x="578" y="96" width="174" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="665" y="114.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">④ 承诺折扣</text>
  <text x="665" y="131" text-anchor="middle" font-size="7.5" fill="#047857">保底量买 1 年</text>
  <text x="665" y="148.25" text-anchor="middle" font-size="7.5" fill="#047857">产出：省 30~40%</text>
  <text x="665" y="165.5" text-anchor="middle" font-size="7.5" fill="#047857">风险：中（锁定期）</text>
  <rect x="20" y="200" width="174" height="90" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="107" y="218.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">⑤ 架构换型</text>
  <text x="107" y="235" text-anchor="middle" font-size="7.5" fill="#0F766E">ARM 化 / 换存储档</text>
  <text x="107" y="252.25" text-anchor="middle" font-size="7.5" fill="#0F766E">产出：省约 30%</text>
  <text x="107" y="269.5" text-anchor="middle" font-size="7.5" fill="#0F766E">风险：中</text>
  <rect x="206" y="200" width="174" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="293" y="218.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">⑥ 存储分层</text>
  <text x="293" y="235" text-anchor="middle" font-size="7.5" fill="#1D4ED8">冷数据下沉低频/归档</text>
  <text x="293" y="252.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">产出：省 50%+</text>
  <text x="293" y="269.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">风险：低（注意取回费）</text>
  <rect x="392" y="200" width="174" height="90" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="479" y="218.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">⑦ 出网治理</text>
  <text x="479" y="235" text-anchor="middle" font-size="7.5" fill="#6D28D9">走内网端点与 CDN</text>
  <text x="479" y="252.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">产出：省掉 NAT 处理费</text>
  <text x="479" y="269.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">风险：低</text>
  <text x="380" y="320" text-anchor="middle" font-size="10" fill="#B91C1C">顺序很重要：先删、再收、后承诺。反过来做，等于为浪费提前付了一年的钱</text>
  <text x="40" y="350" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三条必须写进流程的护栏</text>
  <rect x="20" y="362" width="720" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="36" y="379" text-anchor="start" font-size="9" fill="#065F46">① 标签未通过的资源不允许进生产：没有 Owner 与 CostCenter 就创建失败</text>
  <rect x="20" y="392" width="720" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="36" y="409" text-anchor="start" font-size="9" fill="#065F46">② 任何承诺折扣（RI/SP/CUD）必须用「近 90 天 p50 用量」定基线，不用峰值</text>
  <rect x="20" y="422" width="720" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="36" y="439" text-anchor="start" font-size="9" fill="#065F46">③ 每月对账一次「承诺覆盖率」与「按需占比」，覆盖率低于 70% 说明估算偏保守</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
