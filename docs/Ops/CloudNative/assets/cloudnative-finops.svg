<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="462" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">FinOps 的三个阶段与单位成本口径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">按 FOCUS 规范统一多云的账单字段，才能把「总账」变成「可归因的单位成本」</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">FinOps 不是「砍预算」，而是一个能自我循环的三个阶段</text>
  <rect x="40" y="96" width="220" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="150" y="114.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">① Inform 看得见</text>
  <text x="150" y="131" text-anchor="middle" font-size="8" fill="#1D4ED8">给每一笔钱找到归属</text>
  <text x="150" y="149.4" text-anchor="middle" font-size="8" fill="#1D4ED8">标签 / 成本类别 / 分摊</text>
  <text x="150" y="167.8" text-anchor="middle" font-size="8" fill="#1D4ED8">产出：单位成本与趋势</text>
  <line x1="260" y1="144" x2="272" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="272" y="96" width="220" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="382" y="114.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">② Optimize 改得动</text>
  <text x="382" y="131" text-anchor="middle" font-size="8" fill="#047857">规格治理 · 承诺折扣 · 弹性</text>
  <text x="382" y="149.4" text-anchor="middle" font-size="8" fill="#047857">产出：可量化的节省清单</text>
  <line x1="492" y1="144" x2="504" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="504" y="96" width="220" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="614" y="114.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">③ Operate 持续跑</text>
  <text x="614" y="131" text-anchor="middle" font-size="8" fill="#6D28D9">预算告警 · 门禁 · 定期评审</text>
  <text x="614" y="149.4" text-anchor="middle" font-size="8" fill="#6D28D9">产出：异常在次日被发现</text>
  <line x1="660" y1="144" x2="726" y2="144" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="726" y1="144" x2="726" y2="226" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="726" y1="226" x2="150" y2="226" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="248" text-anchor="middle" font-size="9.5" fill="#64748B">闭环的意义：没有第三阶段，前两阶段的成果会在 2~3 个月内被新增长抹平</text>
  <text x="40" y="280" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">口径先行：别用「总账单」做目标</text>
  <rect x="20" y="292" width="236" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="138" y="310.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">单位成本</text>
  <text x="138" y="327" text-anchor="middle" font-size="7.5" fill="#1D4ED8">每千次请求的成本</text>
  <text x="138" y="344.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">每笔订单的基础设施成本</text>
  <text x="138" y="361.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可跨版本对比</text>
  <rect x="268" y="292" width="236" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="386" y="310.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">有效成本</text>
  <text x="386" y="327" text-anchor="middle" font-size="7.5" fill="#047857">EffectiveCost 口径</text>
  <text x="386" y="344.25" text-anchor="middle" font-size="7.5" fill="#047857">含折扣与预付摊分</text>
  <text x="386" y="361.5" text-anchor="middle" font-size="7.5" fill="#047857">FOCUS 字段名</text>
  <rect x="516" y="292" width="236" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="634" y="310.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">利用率</text>
  <text x="634" y="327" text-anchor="middle" font-size="7.5" fill="#B45309">CPU / 内存 / 存储三档</text>
  <text x="634" y="344.25" text-anchor="middle" font-size="7.5" fill="#B45309">看 p95 而非峰值</text>
  <text x="634" y="361.5" text-anchor="middle" font-size="7.5" fill="#B45309">决定 request 收紧幅度</text>
  <text x="40" y="400" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">FOCUS（FinOps Open Cost and Usage Specification）版本现状</text>
  <text x="380" y="424" text-anchor="middle" font-size="8.5" fill="#334155">1.0（2024-07）→ 1.1（2024-11）→ 1.2（2025-06，纳入 SaaS/PaaS）→ 1.3（2025-12，分摊/合同/时效性）</text>
  <text x="380" y="444" text-anchor="middle" font-size="8.5" fill="#64748B">主要云厂商与腾讯云、阿里云、华为云等均提供 FOCUS 数据集导出；1.4 在开发中</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
