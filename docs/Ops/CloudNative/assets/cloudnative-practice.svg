<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战迁移路径与验收判据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">迁不迁得成，取决于「功能一致 + 性能不退化 + 单位成本下降」三条是否同时成立</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">实战：把一个「图片缩略图接口」从自建 VM 迁到函数计算</text>
  <rect x="20" y="96" width="136" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="88" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">① 基线测量</text>
  <text x="88" y="131" text-anchor="middle" font-size="7" fill="#334155">记录 QPS 曲线</text>
  <text x="88" y="147.1" text-anchor="middle" font-size="7" fill="#334155">p95 延迟、CPU 水位</text>
  <text x="88" y="163.2" text-anchor="middle" font-size="7" fill="#334155">月度账单拆解</text>
  <line x1="156" y1="142" x2="168" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="168" y="96" width="136" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="236" y="114.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">② 拆出无状态部分</text>
  <text x="236" y="131" text-anchor="middle" font-size="7" fill="#1D4ED8">缩略图是纯计算</text>
  <text x="236" y="147.1" text-anchor="middle" font-size="7" fill="#1D4ED8">搬运到对象存储</text>
  <text x="236" y="163.2" text-anchor="middle" font-size="7" fill="#1D4ED8">元数据入托管库</text>
  <line x1="304" y1="142" x2="316" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="316" y="96" width="136" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="384" y="114.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">③ 容器化并本地跑通</text>
  <text x="384" y="131" text-anchor="middle" font-size="7" fill="#6D28D9">Dockerfile 固定版本</text>
  <text x="384" y="147.1" text-anchor="middle" font-size="7" fill="#6D28D9">本地 http 触发验证</text>
  <text x="384" y="163.2" text-anchor="middle" font-size="7" fill="#6D28D9">与基线结果逐张比对</text>
  <line x1="452" y1="142" x2="464" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="464" y="96" width="136" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="532" y="114.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">④ 灰度切流</text>
  <text x="532" y="131" text-anchor="middle" font-size="7" fill="#047857">1% → 10% → 50% → 100%</text>
  <text x="532" y="147.1" text-anchor="middle" font-size="7" fill="#047857">每档观察 30 分钟</text>
  <text x="532" y="163.2" text-anchor="middle" font-size="7" fill="#047857">错误率与 p95 双看</text>
  <line x1="600" y1="142" x2="612" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="612" y="96" width="136" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="680" y="114.2" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">⑤ 成本与回滚复核</text>
  <text x="680" y="131" text-anchor="middle" font-size="7" fill="#C2410C">单位成本对比</text>
  <text x="680" y="147.1" text-anchor="middle" font-size="7" fill="#C2410C">保留旧栈 7 天</text>
  <text x="680" y="163.2" text-anchor="middle" font-size="7" fill="#C2410C">一键回滚演练</text>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="bold">验收判据（三条同时成立才算迁成功）</text>
  <rect x="20" y="220" width="236" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="138" y="238.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">功能一致</text>
  <text x="138" y="255" text-anchor="middle" font-size="7.5" fill="#047857">同一组 200 张样图，输出哈希逐张一致</text>
  <rect x="268" y="220" width="236" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="386" y="238.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">性能不退化</text>
  <text x="386" y="255" text-anchor="middle" font-size="7.5" fill="#1D4ED8">同 QPS 下 p95 不高于基线 110%</text>
  <rect x="516" y="220" width="236" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="634" y="238.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">单位成本下降</text>
  <text x="634" y="255" text-anchor="middle" font-size="7.5" fill="#6D28D9">每万次调用成本 &lt; 基线（含冷启动与出网费）</text>
  <text x="40" y="312" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">本地可运行的验证脚本（节选，完整版见正文）</text>
  <rect x="20" y="324" width="720" height="112" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="36" y="346" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ curl -s -X POST https://&lt;fc-endpoint&gt;/2016-08-15/proxy/thumb/ -d @event.json | jq .</text>
  <text x="36" y="368" text-anchor="start" font-size="8.5" fill="#334155">{ "statusCode": 200, "body": { "key": "thumb/1001.jpg", "w": 320, "bytes": 18422 } }</text>
  <text x="36" y="390" text-anchor="start" font-size="8.5" fill="#1E3A8A">$ python compare.py --base base/ --new new/ --assert sha256   # 200 张样图逐张比对</text>
  <text x="36" y="412" text-anchor="start" font-size="8.5" fill="#334155">OK  200/200 identical | p95  基线 412ms -&gt; 函数 268ms | 成本 -58.3%</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
