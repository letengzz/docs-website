<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="364" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Serverless 排障决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">偶发超时、权限被拒、账单升高三类问题，排查路径完全不同</text>
  <rect x="300" y="76" width="160" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">函数出问题了</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类：别急着加内存</text>
  <line x1="380" y1="132" x2="134" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="168" width="228" height="106" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="134" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">偶发超时 / 长尾</text>
  <text x="134" y="203" text-anchor="middle" font-size="8" fill="#B45309">① 是否冷启动（看 Init Duration）</text>
  <text x="134" y="221.4" text-anchor="middle" font-size="8" fill="#B45309">② 出网或下游是否慢（看 span）</text>
  <text x="134" y="239.8" text-anchor="middle" font-size="8" fill="#B45309">③ 单次执行是否超上限</text>
  <text x="134" y="258.2" text-anchor="middle" font-size="8" fill="#B45309">④ 连接池是否每次新建</text>
  <line x1="380" y1="132" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="266" y="168" width="228" height="106" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">报错 / 权限被拒</text>
  <text x="380" y="203" text-anchor="middle" font-size="8" fill="#B91C1C">① 执行角色是否缺 Action</text>
  <text x="380" y="221.4" text-anchor="middle" font-size="8" fill="#B91C1C">② 资源 ARN 是否写全（通配无效）</text>
  <text x="380" y="239.8" text-anchor="middle" font-size="8" fill="#B91C1C">③ 环境变量与密钥是否读到</text>
  <text x="380" y="258.2" text-anchor="middle" font-size="8" fill="#B91C1C">④ 初始化快照里的凭证是否过期</text>
  <line x1="380" y1="132" x2="626" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="512" y="168" width="228" height="106" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="626" y="186.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">账单异常升高</text>
  <text x="626" y="203" text-anchor="middle" font-size="8" fill="#6D28D9">① 调用次数是否被循环放大</text>
  <text x="626" y="221.4" text-anchor="middle" font-size="8" fill="#6D28D9">② 内存规格是否过大（时长×内存）</text>
  <text x="626" y="239.8" text-anchor="middle" font-size="8" fill="#6D28D9">③ 最小实例数是否常热计费</text>
  <text x="626" y="258.2" text-anchor="middle" font-size="8" fill="#6D28D9">④ 是否漏配日志保留导致存储费</text>
  <text x="380" y="300" text-anchor="middle" font-size="10" fill="#1E3A8A">通用顺序：先看调用日志与 Init Duration → 再判断是「冷」问题还是「热」问题 → 最后才改规格</text>
  <text x="380" y="324" text-anchor="middle" font-size="9.5" fill="#6D28D9">两个最有效的观测项：Init Duration（冷启动占多少）与内存利用率曲线（规格选大还是选小）</text>
  <text x="380" y="348" text-anchor="middle" font-size="9.5" fill="#991B1B">反面教材：为了压掉长尾直接把最小实例数拉到 10——问题没定位，账单先涨十倍</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
