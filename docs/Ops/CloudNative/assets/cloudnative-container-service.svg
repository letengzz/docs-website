<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="462" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">托管容器服务选型与弹性实现</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">Kubernetes API 都一样，差别在控制面计费、节点弹性器与身份体系</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四个托管 K8s：控制面计费与弹性实现的差别，比 K8s 本身大得多</text>
  <rect x="20" y="94" width="110" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
  <text x="75" y="111" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">项目</text>
  <rect x="130" y="94" width="156" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
  <text x="208" y="111" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">AWS EKS</text>
  <rect x="286" y="94" width="156" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
  <text x="364" y="111" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">Azure AKS</text>
  <rect x="442" y="94" width="156" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
  <text x="520" y="111" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">Google GKE</text>
  <rect x="598" y="94" width="162" height="26" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.1"/>
  <text x="679" y="111" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">阿里云 ACK</text>
  <rect x="20" y="120" width="110" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="137" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">控制面费用</text>
  <rect x="130" y="120" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="137" text-anchor="middle" font-size="8" fill="#334155">0.10 美元/小时</text>
  <rect x="286" y="120" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="137" text-anchor="middle" font-size="8" fill="#334155">基础版免费</text>
  <rect x="442" y="120" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="137" text-anchor="middle" font-size="8" fill="#334155">标准版免费</text>
  <rect x="598" y="120" width="162" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="137" text-anchor="middle" font-size="8" fill="#334155">基础版免费</text>
  <rect x="20" y="146" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="163" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">节点弹性</text>
  <rect x="130" y="146" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="163" text-anchor="middle" font-size="8" fill="#334155">Karpenter（最灵活）</text>
  <rect x="286" y="146" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="163" text-anchor="middle" font-size="8" fill="#334155">Cluster Autoscaler</text>
  <rect x="442" y="146" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="163" text-anchor="middle" font-size="8" fill="#334155">Autopilot 免管节点</text>
  <rect x="598" y="146" width="162" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="163" text-anchor="middle" font-size="8" fill="#334155">ack-autoscaler</text>
  <rect x="20" y="172" width="110" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="189" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">抢占/Spot</text>
  <rect x="130" y="172" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="189" text-anchor="middle" font-size="8" fill="#334155">Spot 实例</text>
  <rect x="286" y="172" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="189" text-anchor="middle" font-size="8" fill="#334155">Spot VM</text>
  <rect x="442" y="172" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="189" text-anchor="middle" font-size="8" fill="#334155">Spot VM + 抢占式 TPU</text>
  <rect x="598" y="172" width="162" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="189" text-anchor="middle" font-size="8" fill="#334155">抢占式实例</text>
  <rect x="20" y="198" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="215" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">网络模型</text>
  <rect x="130" y="198" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="215" text-anchor="middle" font-size="8" fill="#334155">VPC CNI（Pod 用真 IP）</text>
  <rect x="286" y="198" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="215" text-anchor="middle" font-size="8" fill="#334155">Azure CNI / Overlay</text>
  <rect x="442" y="198" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="215" text-anchor="middle" font-size="8" fill="#334155">VPC-native 别名 IP</text>
  <rect x="598" y="198" width="162" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="215" text-anchor="middle" font-size="8" fill="#334155">Terway / Flannel</text>
  <rect x="20" y="224" width="110" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="241" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">身份体系</text>
  <rect x="130" y="224" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="241" text-anchor="middle" font-size="8" fill="#334155">IAM + IRSA</text>
  <rect x="286" y="224" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="241" text-anchor="middle" font-size="8" fill="#334155">Entra ID 工作负载身份</text>
  <rect x="442" y="224" width="156" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="241" text-anchor="middle" font-size="8" fill="#334155">Workload Identity</text>
  <rect x="598" y="224" width="162" height="26" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="241" text-anchor="middle" font-size="8" fill="#334155">RAM + RRSA</text>
  <rect x="20" y="250" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="75" y="267" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">适合谁</text>
  <rect x="130" y="250" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="208" y="267" text-anchor="middle" font-size="8" fill="#334155">AWS 原生团队</text>
  <rect x="286" y="250" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="364" y="267" text-anchor="middle" font-size="8" fill="#334155">微软生态与预算敏感</text>
  <rect x="442" y="250" width="156" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="520" y="267" text-anchor="middle" font-size="8" fill="#334155">最省运维（Autopilot）</text>
  <rect x="598" y="250" width="162" height="26" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="679" y="267" text-anchor="middle" font-size="8" fill="#334155">国内合规与本地生态</text>
  <text x="380" y="302" text-anchor="middle" font-size="10" fill="#3730A3">别只看控制面单价：数据引力（数据在哪）与身份体系（谁在用账号）通常才是真正的决定因素</text>
  <text x="40" y="330" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">弹性三件套的正确组合方式</text>
  <rect x="20" y="342" width="236" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="138" y="360.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">HPA</text>
  <text x="138" y="377" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按 CPU/QPS 扩 Pod</text>
  <text x="138" y="394.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">只改副本数</text>
  <text x="138" y="411.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不解决节点不够</text>
  <rect x="268" y="342" width="236" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="386" y="360.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">节点弹性</text>
  <text x="386" y="377" text-anchor="middle" font-size="7.5" fill="#6D28D9">Karpenter/CA 扩节点</text>
  <text x="386" y="394.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">决定新 Pod 落在哪</text>
  <text x="386" y="411.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">决定 bin-packing 效率</text>
  <rect x="516" y="342" width="236" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="634" y="360.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">VPA / 规格治理</text>
  <text x="634" y="377" text-anchor="middle" font-size="7.5" fill="#047857">按 p95 收紧 request</text>
  <text x="634" y="394.25" text-anchor="middle" font-size="7.5" fill="#047857">挤出碎片与僵尸负载</text>
  <text x="634" y="411.5" text-anchor="middle" font-size="7.5" fill="#047857">收益常大于扩缩容</text>
  <text x="380" y="446" text-anchor="middle" font-size="10" fill="#B91C1C">典型浪费：HPA 缩了 Pod，节点没缩 → 账单不变（平均集群 CPU 利用率仅约 13%）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
