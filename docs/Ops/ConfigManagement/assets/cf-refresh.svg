<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="19" font-weight="700" fill="#1f2d3d">一次发布在服务端与客户端之间走了几步</text>
<text x="28" y="60" font-size="12.5" fill="#5a6b7b">本机 Nacos 2.5.1 实测：括号里是实测读数，不是估算</text>
<line x1="28" y1="74" x2="932" y2="74" stroke="#c3ccd6" stroke-width="1"/>
<rect x="30" y="100" width="170" height="78" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="42" y="121" font-size="13" font-weight="700" fill="#1f2d3d">① 发布请求</text>
<text x="42" y="141.0" font-size="11.5" fill="#5a6b7b">POST /cs/configs</text>
<text x="42" y="157.5" font-size="11.5" fill="#5a6b7b">返回 200 = 已落库</text>
<rect x="230" y="100" width="170" height="78" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="242" y="121" font-size="13" font-weight="700" fill="#1f2d3d">② 服务端写库</text>
<text x="242" y="141.0" font-size="11.5" fill="#5a6b7b">config_info + history</text>
<text x="242" y="157.5" font-size="11.5" fill="#5a6b7b">同事务写一条历史</text>
<rect x="430" y="100" width="200" height="78" rx="8" fill="#fbeae6" stroke="#b5432f" stroke-width="1.4"/>
<text x="442" y="121" font-size="13" font-weight="700" fill="#1f2d3d">③ 内存缓存刷新</text>
<text x="442" y="141.0" font-size="11.5" fill="#5a6b7b">≤100 ms 窗口内读仍是旧值</text>
<text x="442" y="157.5" font-size="11.5" fill="#5a6b7b">实测：50 ms 旧 / 100 ms 新</text>
<rect x="660" y="100" width="270" height="78" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="672" y="121" font-size="13" font-weight="700" fill="#1f2d3d">④ 通知长轮询连接</text>
<text x="672" y="141.0" font-size="11.5" fill="#5a6b7b">挂起的请求被唤醒</text>
<text x="672" y="157.5" font-size="11.5" fill="#5a6b7b">实测唤醒耗时 ~200 ms</text>
<rect x="660" y="208" width="270" height="78" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="672" y="229" font-size="13" font-weight="700" fill="#1f2d3d">⑤ 客户端拉取全量</text>
<text x="672" y="249.0" font-size="11.5" fill="#5a6b7b">按 dataId 取最新内容</text>
<text x="672" y="265.5" font-size="11.5" fill="#5a6b7b">比对 md5，变了才回调</text>
<rect x="430" y="208" width="200" height="78" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="442" y="229" font-size="13" font-weight="700" fill="#1f2d3d">⑥ 回调 onReceive</text>
<text x="442" y="249.0" font-size="11.5" fill="#5a6b7b">应用自己决定怎么用</text>
<text x="442" y="265.5" font-size="11.5" fill="#5a6b7b">这里才是「生效」</text>
<rect x="230" y="208" width="170" height="78" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="242" y="229" font-size="13" font-weight="700" fill="#1f2d3d">⑦ 重建/重绑</text>
<text x="242" y="249.0" font-size="11.5" fill="#5a6b7b">@RefreshScope 重建 bean</text>
<text x="242" y="265.5" font-size="11.5" fill="#5a6b7b">连接池参数不重建</text>
<rect x="30" y="208" width="170" height="78" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="42" y="229" font-size="13" font-weight="700" fill="#1f2d3d">⑧ 可观测</text>
<text x="42" y="249.0" font-size="11.5" fill="#5a6b7b">日志 + 版本号</text>
<text x="42" y="265.5" font-size="11.5" fill="#5a6b7b">出问题按版本回滚</text>
<line x1="200" y1="139" x2="230" y2="139" stroke="#2b5c8a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="400" y1="139" x2="430" y2="139" stroke="#2b5c8a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="630" y1="139" x2="660" y2="139" stroke="#b5432f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="795" y1="178" x2="795" y2="208" stroke="#2f8f7d" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="660" y1="247" x2="630" y2="247" stroke="#2f8f7d" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="247" x2="400" y2="247" stroke="#c2703a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="230" y1="247" x2="200" y2="247" stroke="#c2703a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="312" width="900" height="76" rx="8" fill="#fbeae6" stroke="#b5432f" stroke-width="1.4"/>
<text x="42" y="333" font-size="13" font-weight="700" fill="#1f2d3d">三个「不等于」，是本页全部价值的浓缩</text>
<text x="42" y="353.0" font-size="11.5" fill="#5a6b7b">① 发布 200 ≠ 立即可读（缓存窗口 ≤100 ms）；② 客户端收到 ≠ 应用生效（回调里可以什么都不做）；</text>
<text x="42" y="369.5" font-size="11.5" fill="#5a6b7b">③ 应用生效 ≠ 行为正确（连接池大小、线程数这类启动期参数改了也不生效，必须重启）。</text>
<text x="30" y="416" font-size="12" fill="#5a6b7b" text-anchor="start" font-weight="normal">长轮询实测：内容不变时挂 29.51 s 返回空（超时 30 s）；挂起中第 3 s 发布 → 3.204 s 返回。</text>
<text x="30" y="440" font-size="12" fill="#5a6b7b" text-anchor="start" font-weight="normal">幂等发布实测：同内容重发 md5 不变、长轮询不唤醒；只加一行注释 md5 就变、照样唤醒 → 注释也算变更。</text>
</svg>
