<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="356" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">资源变更动作、依赖与生命周期</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">plan 会为每个资源标注一个动作；用 for_each 而不是 count 可让增删元素不牵连其他实例</text>
  <rect x="32" y="72" width="164" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="114" y="95.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">create</text>
  <text x="114" y="112.92" text-anchor="middle" font-size="9.5" fill="#047857">资源不存在，新建</text>
  <rect x="220" y="72" width="164" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="302" y="95.92" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">update in-place</text>
  <text x="302" y="112.92" text-anchor="middle" font-size="9.5" fill="#1D4ED8">属性可变，原地修改</text>
  <rect x="408" y="72" width="164" height="60" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="490" y="95.92" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">replace</text>
  <text x="490" y="112.92" text-anchor="middle" font-size="9.5" fill="#C2410C">属性不可变：先删后建</text>
  <rect x="596" y="72" width="164" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="678" y="95.92" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">destroy</text>
  <text x="678" y="112.92" text-anchor="middle" font-size="9.5" fill="#B91C1C">配置中移除，回收资源</text>
  <text x="380" y="168" text-anchor="middle" font-size="13" fill="#5B21B6" font-weight="bold">依赖关系</text>
  <rect x="32" y="182" width="224" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="144" y="208.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">隐式依赖（推荐）</text>
  <text x="144" y="225.92" text-anchor="middle" font-size="9.5" fill="#047857">在参数里引用别的资源属性即可</text>
  <line x1="258" y1="215" x2="288" y2="215" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="290" y="182" width="180" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="208.92" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">自动推导顺序</text>
  <text x="380" y="225.92" text-anchor="middle" font-size="9.5" fill="#6D28D9">解析为有向无环图</text>
  <line x1="472" y1="215" x2="502" y2="215" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="504" y="182" width="224" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="616" y="208.92" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">显式依赖 depends_on</text>
  <text x="616" y="225.92" text-anchor="middle" font-size="9.5" fill="#C2410C">仅在隐式依赖表达不出时使用</text>
  <text x="380" y="280" text-anchor="middle" font-size="13" fill="#854D0E" font-weight="bold">四个高频元参数</text>
  <rect x="32" y="294" width="168" height="48" rx="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="116" y="311.81" text-anchor="middle" font-size="10.5" fill="#854D0E" font-weight="bold">count / for_each</text>
  <text x="116" y="328.81" text-anchor="middle" font-size="8.5" fill="#A16207">批量创建；for_each 更稳定</text>
  <rect x="208" y="294" width="168" height="48" rx="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="292" y="311.81" text-anchor="middle" font-size="10.5" fill="#854D0E" font-weight="bold">depends_on</text>
  <text x="292" y="328.81" text-anchor="middle" font-size="8.5" fill="#A16207">补隐式依赖，慎用</text>
  <rect x="384" y="294" width="168" height="48" rx="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="468" y="311.81" text-anchor="middle" font-size="10.5" fill="#854D0E" font-weight="bold">lifecycle</text>
  <text x="468" y="328.81" text-anchor="middle" font-size="8.5" fill="#A16207">prevent_destroy / ignore_changes</text>
  <rect x="560" y="294" width="168" height="48" rx="6" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="644" y="311.81" text-anchor="middle" font-size="10.5" fill="#854D0E" font-weight="bold">provider</text>
  <text x="644" y="328.81" text-anchor="middle" font-size="8.5" fill="#A16207">多账户/多区域时指定 provider</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
