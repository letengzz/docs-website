<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="356" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">模块目录结构与调用关系</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">模块 = 一个可复用的 .tf 目录：对外只暴露变量与输出，内部实现可自由替换</text>
  <rect x="32" y="72" width="316" height="248" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="190" y="96" text-anchor="middle" font-size="12" fill="#5B21B6" font-weight="bold">模块目录结构（modules/network/）</text>
  <rect x="48" y="110" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="126.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">main.tf    资源定义，模块入口</text>
  <rect x="48" y="144" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="160.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">variables.tf    输入变量，必须写 type</text>
  <rect x="48" y="178" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="194.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">outputs.tf    对外输出，供上层引用</text>
  <rect x="48" y="212" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="228.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">versions.tf    required_providers 约束</text>
  <rect x="48" y="246" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="262.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">README.md    用法说明与最小示例</text>
  <rect x="48" y="280" width="284" height="28" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="190" y="296.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">*.tfvars    环境具体取值，不入库</text>
  <rect x="372" y="72" width="356" height="248" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="550" y="96" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">调用关系</text>
  <rect x="452" y="108" width="196" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="550" y="130.03" text-anchor="middle" font-size="11.5" fill="#5B21B6" font-weight="bold">root module</text>
  <text x="550" y="147.03" text-anchor="middle" font-size="9.5" fill="#6D28D9">main.tf 里写 module 块</text>
  <rect x="392" y="210" width="104" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="444" y="234.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">network</text>
  <text x="444" y="251.92" text-anchor="middle" font-size="9.5" fill="#047857">inputs / outputs</text>
  <rect x="508" y="210" width="104" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="234.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">compute</text>
  <text x="560" y="251.92" text-anchor="middle" font-size="9.5" fill="#047857">inputs / outputs</text>
  <rect x="624" y="210" width="104" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="676" y="234.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">storage</text>
  <text x="676" y="251.92" text-anchor="middle" font-size="9.5" fill="#047857">inputs / outputs</text>
  <line x1="480" y1="166" x2="444" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="550" y1="166" x2="560" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="620" y1="166" x2="676" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#5B21B6">inputs</text>
  <text x="586" y="190" text-anchor="middle" font-size="10" fill="#5B21B6">inputs</text>
  <line x1="700" y1="210" x2="640" y2="172" stroke="#059669" stroke-width="1.6" marker-end="url(#arwG)" stroke-dasharray="5 4"/>
  <text x="722" y="196" text-anchor="middle" font-size="10" fill="#047857">outputs</text>
  <line x1="60" y1="340" x2="104" y2="340" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="112" y="344" text-anchor="start" font-size="10.5" fill="#5B21B6">module 调用：root 通过 source + inputs 调用子模块</text>
  <line x1="470" y1="340" x2="514" y2="340" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwG)"/>
  <text x="522" y="344" text-anchor="start" font-size="10.5" fill="#047857">outputs 回流：上层用 module.xxx.yyy 引用</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arwG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>
</svg>
