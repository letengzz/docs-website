<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="370" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">安装 Terraform 与 terraform init 做了什么</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">Terraform 是单个静态二进制：下载解压即可用，无需包管理器运行时</text>
  <rect x="32" y="72" width="224" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="144" y="92.03" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">Linux（APT 官方源）</text>
  <text x="144" y="109.03" text-anchor="middle" font-size="9.5" fill="#1D4ED8">① 导入 HashiCorp GPG 公钥</text>
  <text x="144" y="126.03" text-anchor="middle" font-size="9.5" fill="#1D4ED8">② 添加官方 APT 源</text>
  <text x="144" y="143.03" text-anchor="middle" font-size="9.5" fill="#1D4ED8">③ apt install terraform</text>
  <rect x="268" y="72" width="224" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="92.03" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">macOS / Linux（Homebrew）</text>
  <text x="380" y="109.03" text-anchor="middle" font-size="9.5" fill="#047857">brew tap hashicorp/tap</text>
  <text x="380" y="126.03" text-anchor="middle" font-size="9.5" fill="#047857">brew install hashicorp/tap/terraform</text>
  <text x="380" y="143.03" text-anchor="middle" font-size="9.5" fill="#047857">自动跟进最新稳定版</text>
  <rect x="504" y="72" width="224" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="616" y="92.03" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">Windows</text>
  <text x="616" y="109.03" text-anchor="middle" font-size="9.5" fill="#C2410C">choco install terraform</text>
  <text x="616" y="126.03" text-anchor="middle" font-size="9.5" fill="#C2410C">或 scoop install terraform</text>
  <text x="616" y="143.03" text-anchor="middle" font-size="9.5" fill="#C2410C">或下载 zip 解压后加入 PATH</text>
  <text x="380" y="192" text-anchor="middle" font-size="13" fill="#5B21B6" font-weight="bold">terraform init 的四个动作</text>
  <rect x="32" y="206" width="160" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="112" y="230.92" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">① 解析配置</text>
  <text x="112" y="247.92" text-anchor="middle" font-size="9.5" fill="#6D28D9">读取 root module 的 .tf</text>
  <line x1="194" y1="237.0" x2="215" y2="237.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="217" y="206" width="160" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="297" y="230.92" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">② 装 provider</text>
  <text x="297" y="247.92" text-anchor="middle" font-size="9.5" fill="#1D4ED8">下载到 .terraform/providers</text>
  <line x1="379" y1="237.0" x2="400" y2="237.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="402" y="206" width="160" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="482" y="230.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">③ 装子模块</text>
  <text x="482" y="247.92" text-anchor="middle" font-size="9.5" fill="#047857">modules / registry / git</text>
  <line x1="564" y1="237.0" x2="585" y2="237.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="587" y="206" width="160" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="667" y="230.92" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">④ 连后端</text>
  <text x="667" y="247.92" text-anchor="middle" font-size="9.5" fill="#C2410C">初始化 state 存储与锁</text>
  <rect x="32" y="288" width="336" height="62" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="200" y="312.92" text-anchor="middle" font-size="11" fill="#854D0E" font-weight="bold">生成 .terraform.lock.hcl</text>
  <text x="200" y="329.92" text-anchor="middle" font-size="9.5" fill="#A16207">锁定 provider 版本与校验和，必须提交到 Git</text>
  <rect x="392" y="288" width="336" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="560" y="312.92" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="bold">验证收尾</text>
  <text x="560" y="329.92" text-anchor="middle" font-size="9.5" fill="#475569">terraform version 与 terraform providers 均应有输出</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
