<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">HCL2 块结构与八类常用块</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">HCL 是「块 + 参数 + 表达式」三件套：block "label" { key = value }</text>
  <rect x="32" y="72" width="330" height="286" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="197" y="96" text-anchor="middle" font-size="12.5" fill="#5B21B6" font-weight="bold">块语法骨架</text>
  <rect x="48" y="108" width="298" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="197" y="122.31" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">block_type "label" "name" {</text>
  <rect x="48" y="140" width="298" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="197" y="154.31" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">  key = expression     # 参数</text>
  <rect x="48" y="172" width="298" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="197" y="186.31" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">  nested { ... }       # 嵌套块</text>
  <rect x="48" y="204" width="298" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="197" y="218.31" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">}</text>
  <text x="197" y="254" text-anchor="middle" font-size="12" fill="#5B21B6" font-weight="bold">表达式能力</text>
  <rect x="48" y="266" width="298" height="80" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="197" y="274.31" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">var / local / resource 引用</text>
  <text x="197" y="291.31" text-anchor="middle" font-size="9.0" fill="#475569">运算符与条件 ? :</text>
  <text x="197" y="308.31" text-anchor="middle" font-size="9.0" fill="#475569">for 表达式与 splat</text>
  <text x="197" y="325.31" text-anchor="middle" font-size="9.0" fill="#475569">内置函数 min/max/cidrsubnet/format</text>
  <text x="197" y="342.31" text-anchor="middle" font-size="9.0" fill="#475569">? 与 count.index 配合</text>
  <text x="563" y="96" text-anchor="middle" font-size="12.5" fill="#065F46" font-weight="bold">八类常用块（按使用频率）</text>
  <rect x="398" y="108" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="125.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">terraform { }   required_version / required_providers / backend</text>
  <rect x="398" y="140" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="157.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">provider "aws" { }   区域、认证方式、默认标签</text>
  <rect x="398" y="172" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="189.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">variable "" { }   输入参数：type / default / validation</text>
  <rect x="398" y="204" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="221.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">locals { }   派生值：避免同一表达式写多次</text>
  <rect x="398" y="236" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="253.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">resource "" "" { }   真正要创建/管理的资源</text>
  <rect x="398" y="268" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="285.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">data "" "" { }   只读查询已有资源</text>
  <rect x="398" y="300" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="317.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">module "" { }   模块调用：source + 输入变量</text>
  <rect x="398" y="332" width="330" height="30" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="349.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">output "" { }   对外暴露结果，便于组合与调试</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
