<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">State 与远程后端（含状态锁）</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">state 是 Terraform 的「账本」：记录每个配置对象对应哪个真实资源 ID 与属性</text>
  <rect x="32" y="72" width="330" height="232" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <rect x="48" y="114" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="197" y="131.6" text-anchor="middle" font-size="10" fill="#991B1B">单人、临时环境可用</text>
  <rect x="48" y="149" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="197" y="166.6" text-anchor="middle" font-size="10" fill="#991B1B">多人协作会互相覆盖</text>
  <rect x="48" y="184" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="197" y="201.6" text-anchor="middle" font-size="10" fill="#991B1B">state 含明文密钥，不能进 Git</text>
  <rect x="48" y="219" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="197" y="236.6" text-anchor="middle" font-size="10" fill="#991B1B">电脑丢了等于资源失联</text>
  <rect x="48" y="254" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="197" y="271.6" text-anchor="middle" font-size="10" fill="#991B1B">无锁：并发 apply 会损坏状态</text>
  <text x="197" y="96" text-anchor="middle" font-size="12" fill="#991B1B" font-weight="bold">本地 state（terraform.tfstate）</text>
  <rect x="398" y="72" width="330" height="232" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <rect x="414" y="114" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="131.6" text-anchor="middle" font-size="10" fill="#065F46">对象存储保存 state（开版本控制）</text>
  <rect x="414" y="149" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="166.6" text-anchor="middle" font-size="10" fill="#065F46">DynamoDB 表提供状态锁</text>
  <rect x="414" y="184" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="201.6" text-anchor="middle" font-size="10" fill="#065F46">服务端加密 + 桶策略收权限</text>
  <rect x="414" y="219" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="236.6" text-anchor="middle" font-size="10" fill="#065F46">团队共享同一份真相</text>
  <rect x="414" y="254" width="298" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="563" y="271.6" text-anchor="middle" font-size="10" fill="#065F46">CI 与人工都走同一把锁</text>
  <text x="563" y="96" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">远程后端（S3 + DynamoDB）</text>
  <text x="380" y="326" text-anchor="middle" font-size="10.5" fill="#047857">状态锁保证同一时刻只有一次 apply 在改同一份 state；-lock=false 仅限只读场景</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
