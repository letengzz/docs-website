<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Terraform Core / Provider 架构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">Core 只管「编排」，真正调用云 API 的是 Provider——两者通过插件协议通信</text>
  <rect x="32" y="72" width="250" height="196" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="157" y="96" text-anchor="middle" font-size="12.5" fill="#5B21B6" font-weight="bold">Terraform Core（单一二进制）</text>
  <rect x="52" y="108" width="210" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="157" y="123.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">配置解析（HCL2）</text>
  <rect x="52" y="139" width="210" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="157" y="154.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">依赖图（Graph）</text>
  <rect x="52" y="170" width="210" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="157" y="185.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">变更计划（Plan）</text>
  <rect x="52" y="201" width="210" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="157" y="216.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">状态管理（State）</text>
  <rect x="52" y="232" width="210" height="26" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="157" y="247.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">CLI 与命令分发</text>
  <rect x="478" y="72" width="250" height="196" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="603" y="96" text-anchor="middle" font-size="12.5" fill="#065F46" font-weight="bold">Provider 插件（独立进程）</text>
  <rect x="498" y="108" width="210" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="603" y="123.31" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">hashicorp/aws</text>
  <rect x="498" y="139" width="210" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="603" y="154.31" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">hashicorp/azurerm</text>
  <rect x="498" y="170" width="210" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="603" y="185.31" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">hashicorp/google</text>
  <rect x="498" y="201" width="210" height="26" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="603" y="216.31" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">自定义 provider</text>
  <line x1="288" y1="140" x2="472" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="472" y1="190" x2="288" y2="190" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="133" text-anchor="middle" font-size="10.5" fill="#5B21B6">gRPC 插件协议</text>
  <text x="380" y="205" text-anchor="middle" font-size="10.5" fill="#047857">返回资源 Schema 与 CRUD 结果</text>
  <rect x="32" y="288" width="336" height="52" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="200" y="307.92" text-anchor="middle" font-size="11" fill="#854D0E" font-weight="bold">Registry：provider / module 下载源</text>
  <text x="200" y="324.92" text-anchor="middle" font-size="9.5" fill="#A16207">registry.terraform.io 或私有镜像</text>
  <rect x="392" y="288" width="336" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="560" y="307.92" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">Backend：state 存储</text>
  <text x="560" y="324.92" text-anchor="middle" font-size="9.5" fill="#1D4ED8">本地 / S3+DynamoDB / HCP Terraform</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
