<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：一套可复现的云上环境</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份代码在测试与生产各 apply 一次，两次结果结构完全一致，只有参数不同</text>
  <rect x="32" y="74" width="696" height="196" rx="12" fill="#FAFAFF" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="60" y="98" text-anchor="start" font-size="12.5" fill="#5B21B6" font-weight="bold">VPC 10.0.0.0/16</text>
  <rect x="52" y="112" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="152" y="137.03" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">public-subnet-a</text>
  <text x="152" y="154.03" text-anchor="middle" font-size="9.5" fill="#1D4ED8">10.0.1.0/24</text>
  <rect x="52" y="188" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="152" y="213.03" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">public-subnet-b</text>
  <text x="152" y="230.03" text-anchor="middle" font-size="9.5" fill="#1D4ED8">10.0.2.0/24</text>
  <rect x="292" y="112" width="176" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="137.03" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">Internet Gateway</text>
  <text x="380" y="154.03" text-anchor="middle" font-size="9.5" fill="#047857">路由表 0.0.0.0/0</text>
  <rect x="292" y="188" width="176" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="213.03" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">NAT / 跳板机</text>
  <text x="380" y="230.03" text-anchor="middle" font-size="9.5" fill="#C2410C">仅测试环境开启</text>
  <rect x="508" y="112" width="200" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="608" y="137.03" text-anchor="middle" font-size="11.5" fill="#991B1B" font-weight="bold">security-group</text>
  <text x="608" y="154.03" text-anchor="middle" font-size="9.5" fill="#B91C1C">仅放行 22 / 80 / 443</text>
  <rect x="508" y="188" width="200" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="608" y="213.03" text-anchor="middle" font-size="11.5" fill="#1E293B" font-weight="bold">EC2 实例 x2</text>
  <text x="608" y="230.03" text-anchor="middle" font-size="9.5" fill="#475569">user_data 装 nginx</text>
  <rect x="52" y="300" width="300" height="48" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="202" y="317.92" text-anchor="middle" font-size="11" fill="#854D0E" font-weight="bold">S3 桶：静态资源 + 访问日志</text>
  <text x="202" y="334.92" text-anchor="middle" font-size="9.5" fill="#A16207">开启版本控制与生命周期</text>
  <rect x="408" y="300" width="320" height="48" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="568" y="326.42" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">验收：terraform output 拿到公网地址，curl 返回 200</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
