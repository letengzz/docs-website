<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">版本状态与 Terraform / OpenTofu 分叉时间线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">2023-08-10 的许可证变更（1.6.0 起 BUSL 1.1）把同一个项目分成了两条线</text>
  <line x1="60" y1="96" x2="700" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="88" cy="96" r="6" fill="#DC2626"/>
  <text x="88" y="82" text-anchor="middle" font-size="10" fill="#991B1B">2023-08-10</text>
  <text x="88" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">MPL → BUSL 1.1</text>
  <text x="88" y="135" text-anchor="middle" font-size="9" fill="#64748B">1.6.0 起生效</text>
  <text x="88" y="148" text-anchor="middle" font-size="9" fill="#64748B">1.5.7 为最后 MPL 版</text>
  <circle cx="204" cy="96" r="6" fill="#059669"/>
  <text x="204" y="82" text-anchor="middle" font-size="10" fill="#065F46">2023-09-20</text>
  <text x="204" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">OpenTofu 进 LF</text>
  <text x="204" y="135" text-anchor="middle" font-size="9" fill="#64748B">从 1.5.6 分叉</text>
  <text x="204" y="148" text-anchor="middle" font-size="9" fill="#64748B">保持 MPL 2.0</text>
  <circle cx="320" cy="96" r="6" fill="#059669"/>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="#065F46">2024-01-10</text>
  <text x="320" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">OpenTofu 1.6 GA</text>
  <text x="320" y="135" text-anchor="middle" font-size="9" fill="#64748B">兼容 1.5.x 语法</text>
  <text x="320" y="148" text-anchor="middle" font-size="9" fill="#64748B">与 state 格式</text>
  <circle cx="436" cy="96" r="6" fill="#EA580C"/>
  <text x="436" y="82" text-anchor="middle" font-size="10" fill="#9A3412">2025-02-27</text>
  <text x="436" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">IBM 完成收购</text>
  <text x="436" y="135" text-anchor="middle" font-size="9" fill="#64748B">HashiCorp 并入</text>
  <text x="436" y="148" text-anchor="middle" font-size="9" fill="#64748B">许可人变为 IBM</text>
  <circle cx="552" cy="96" r="6" fill="#059669"/>
  <text x="552" y="82" text-anchor="middle" font-size="10" fill="#065F46">2025-04-23</text>
  <text x="552" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">OpenTofu 进</text>
  <text x="552" y="135" text-anchor="middle" font-size="10.5" fill="#0F172A">CNCF</text>
  <text x="552" y="150" text-anchor="middle" font-size="9" fill="#64748B">成为基金会</text>
  <text x="552" y="163" text-anchor="middle" font-size="9" fill="#64748B">治理项目</text>
  <circle cx="668" cy="96" r="6" fill="#7C3AED"/>
  <text x="668" y="82" text-anchor="middle" font-size="10" fill="#5B21B6">2026-08~09</text>
  <text x="668" y="120" text-anchor="middle" font-size="10.5" fill="#0F172A">Terraform 1.16</text>
  <text x="668" y="135" text-anchor="middle" font-size="10.5" fill="#0F172A">OpenTofu 1.12</text>
  <text x="668" y="150" text-anchor="middle" font-size="9" fill="#64748B">功能已实质分化</text>
  <text x="668" y="163" text-anchor="middle" font-size="9" fill="#64748B">state 仍互通</text>
  <text x="380" y="216" text-anchor="middle" font-size="13" fill="#5B21B6" font-weight="bold">版本状态速览（2026-09 核对）</text>
  <rect x="32" y="230" width="80" height="34" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="72" y="249.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">Terraform</text>
  <rect x="120" y="230" width="208" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="224" y="249.09" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">1.16.x 主线（1.16.2 / 2026-09-09）</text>
  <rect x="336" y="230" width="128" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="400" y="249.09" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">1.15.x 维护中</text>
  <rect x="472" y="230" width="256" height="34" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
  <text x="600" y="249.09" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">1.14 及更早仅存量；1.17 进入 beta</text>
  <rect x="32" y="270" width="80" height="34" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="72" y="289.31" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">OpenTofu</text>
  <rect x="120" y="270" width="208" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="224" y="289.09" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">1.12.x 主线（1.12.6 / 2026-08-19）</text>
  <rect x="336" y="270" width="128" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="400" y="289.09" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">1.11.x 维护中</text>
  <rect x="472" y="270" width="256" height="34" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
  <text x="600" y="289.09" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">1.10.x 及更早仅存量；1.13 进入 beta</text>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#64748B">共性：state 格式两边互通，terraform apply 与 tofu apply 可对同一 state 交替执行</text>
  <text x="380" y="350" text-anchor="middle" font-size="9.5" fill="#64748B">OpenTofu 独有：客户端 state 加密（1.7）、provider for_each（1.9）、OCI 仓库（1.10）、ephemeral 资源（1.11）、动态 prevent_destroy（1.12）</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#64748B">Terraform 独有：HCP Terraform / Terraform Enterprise 托管能力，以及 Stacks、Policy 等商业特性</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
