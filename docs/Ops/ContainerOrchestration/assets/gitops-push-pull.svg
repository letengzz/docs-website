<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85a4a"/>
    </marker>
    <marker id="gg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3aa76d"/>
    </marker>
  </defs>
  <style>
    .git { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .cd  { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; }
    .k8s { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .warn{ fill: #fdeeee; stroke: #d85a4a; stroke-width: 1.5; }
    .mut { fill: #f5f5f7; stroke: #999; stroke-width: 1.2; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .t2  { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <text class="t2" x="220" y="34">Push 模式（传统 CD）</text>
  <text class="t2" x="660" y="34">Pull 模式（GitOps）</text>

  <rect class="cd" x="60" y="70" width="200" height="60"/>
  <text x="160" y="95">CI 流水线</text>
  <text class="small" x="160" y="113">构建 + 测试 + 部署一把抓</text>
  <rect class="k8s" x="180" y="230" width="200" height="60"/>
  <text x="280" y="255">Kubernetes 集群</text>
  <text class="small" x="280" y="273">外面的人拿着凭据进来</text>
  <line x1="185" y1="130" x2="255" y2="230" marker-end="url(#ga)"/>
  <text class="small" x="130" y="185">kubectl apply</text>
  <text class="small" x="130" y="201">（集群凭据放在 CI 里）</text>
  <rect class="mut" x="60" y="330" width="320" height="46"/>
  <text class="small" x="220" y="350">集群怎么变成这样的？只能翻流水线日志与聊天记录</text>
  <text class="small" x="220" y="366">手工改过的配置、多环境差异、回滚点都不可复现</text>

  <rect class="git" x="560" y="70" width="200" height="60"/>
  <text x="660" y="95">Git 仓库（事实源）</text>
  <text class="small" x="660" y="113">声明式清单 + 变更历史</text>
  <rect class="cd" x="600" y="180" width="180" height="56"/>
  <text x="690" y="203">集群内控制器</text>
  <text class="small" x="690" y="221">Argo CD / Flux</text>
  <rect class="k8s" x="600" y="290" width="180" height="52"/>
  <text x="690" y="312">Kubernetes 集群</text>
  <text class="small" x="690" y="330">只接受内部拉取对齐</text>
  <line x1="660" y1="130" x2="680" y2="180" marker-end="url(#gg)"/>
  <line x1="690" y1="236" x2="690" y2="290" marker-end="url(#ga)"/>
  <text class="small" x="790" y="210">凭据不出集群</text>
  <text class="small" x="790" y="226">最小权限只读 Git</text>
  <rect class="mut" x="560" y="352" width="0" height="0"/>

</svg>