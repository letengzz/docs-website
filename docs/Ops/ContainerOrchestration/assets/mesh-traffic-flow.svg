<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="402" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">请求穿过网格的四级决策：入口 → 路由 → 策略 → 执行</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">VirtualService 定「去哪」，DestinationRule 定「怎么去」，混淆这两件事是配置事故的第一来源</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一个请求要依次穿过「入口 → 路由 → 策略 → 目标」，每一层都有明确的判定顺序</text>
  <rect x="30" y="94" width="168" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="114" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 入口</text>
  <text x="114" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">Gateway / Gateway API</text>
  <text x="114" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">只做 L4-L6：端口、TLS、host</text>
  <text x="114" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">与 VirtualService 或 HTTPRoute 绑定</text>
  <line x1="198" y1="140" x2="210" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="94" width="168" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="294" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 路由匹配</text>
  <text x="294" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">VirtualService / HTTPRoute</text>
  <text x="294" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">自上而下逐条评估</text>
  <text x="294" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">第一条命中即生效</text>
  <line x1="378" y1="140" x2="390" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="94" width="168" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="474" y="112.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 目的地策略</text>
  <text x="474" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">DestinationRule</text>
  <text x="474" y="146.25" text-anchor="middle" font-size="7.5" fill="#0F766E">子集 / 负载均衡</text>
  <text x="474" y="163.5" text-anchor="middle" font-size="7.5" fill="#0F766E">连接池 / 熔断 / TLS</text>
  <line x1="558" y1="140" x2="570" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="94" width="168" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="654" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 代理执行</text>
  <text x="654" y="129" text-anchor="middle" font-size="7.5" fill="#047857">Envoy（sidecar 或 waypoint）</text>
  <text x="654" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">超时、重试、镜像、改写</text>
  <text x="654" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">产出遥测数据</text>
  <line x1="30" y1="202" x2="730" y2="202" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="228" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">匹配规则的两条机械约定（写错就会「灰度不生效」）</text>
  <rect x="30" y="240" width="340" height="118" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="258.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">同一 match 内多条件 = AND</text>
  <text x="200" y="275" text-anchor="middle" font-size="8" fill="#1D4ED8">uri 前缀 /v1 且 header x-env=beta</text>
  <text x="200" y="293.4" text-anchor="middle" font-size="8" fill="#1D4ED8">→ 两个都要满足才命中</text>
  <text x="200" y="311.8" text-anchor="middle" font-size="8" fill="#1D4ED8">多写一个条件会缩小命中范围</text>
  <text x="200" y="330.2" text-anchor="middle" font-size="8" fill="#1D4ED8">「条件越多越精准」是对的，但漏配就永远不命中</text>
  <rect x="390" y="240" width="340" height="118" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="258.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">多条 match = OR · 无 match = 兜底</text>
  <text x="560" y="275" text-anchor="middle" font-size="8" fill="#B91C1C">同一条 route 下多个 match 块是「或」</text>
  <text x="560" y="293.4" text-anchor="middle" font-size="8" fill="#B91C1C">最后一条不写 match：接住其余全部流量</text>
  <text x="560" y="311.8" text-anchor="middle" font-size="8" fill="#B91C1C">官方明确建议每条 VirtualService 都要有兜底规则</text>
  <text x="560" y="330.2" text-anchor="middle" font-size="8" fill="#B91C1C">缺兜底 → 未命中流量被拒（503）</text>
  <text x="380" y="384" text-anchor="middle" font-size="9.5" fill="#6D28D9">排查顺序：先 istioctl analyze 看配置合法性，再用 istioctl proxy-config routes 看代理里真正生效的路由</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
