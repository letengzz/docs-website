<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="438" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Istio 版本时间线与支持窗口（2026-09 核对）</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">n+2 支持策略决定了升级是「每季度一次的小步」，不是「两年一次的大手术」</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">支持策略：minor 发布后支持到「再往后第 2 个 minor 发布 + 6 周」</text>
  <line x1="50" y1="150" x2="710" y2="150" stroke="#475569" stroke-width="2"/>
  <circle cx="110" cy="150" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#991B1B" font-weight="bold">1.28</text>
  <text x="110" y="172" text-anchor="middle" font-size="8" fill="#475569">2025-11-05</text>
  <rect x="70" y="182" width="80" height="20" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
  <text x="110" y="196" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">已 EOL</text>
  <circle cx="255" cy="150" r="7" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
  <text x="255" y="132" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">1.29</text>
  <text x="255" y="172" text-anchor="middle" font-size="8" fill="#475569">2026-02-16</text>
  <rect x="215" y="182" width="80" height="20" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.1"/>
  <text x="255" y="196" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">维护中</text>
  <circle cx="400" cy="150" r="7" fill="#0D9488" stroke="#FFFFFF" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#115E59" font-weight="bold">1.30</text>
  <text x="400" y="172" text-anchor="middle" font-size="8" fill="#475569">2026-05-14</text>
  <rect x="360" y="182" width="80" height="20" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.1"/>
  <text x="400" y="196" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">维护中</text>
  <circle cx="545" cy="150" r="7" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
  <text x="545" y="132" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">1.31</text>
  <text x="545" y="172" text-anchor="middle" font-size="8" fill="#475569">2026-08-31</text>
  <rect x="505" y="182" width="80" height="20" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="545" y="196" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">主线</text>
  <circle cx="665" cy="150" r="7" fill="#475569" stroke="#FFFFFF" stroke-width="2"/>
  <text x="665" y="132" text-anchor="middle" font-size="12" fill="#1E293B" font-weight="bold">1.32</text>
  <text x="665" y="172" text-anchor="middle" font-size="8" fill="#475569">待发布</text>
  <rect x="625" y="182" width="80" height="20" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="665" y="196" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">开发中</text>
  <text x="60" y="234" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">当前（2026-09 核对）该落在哪一版</text>
  <rect x="30" y="246" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="261" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">生产主线</text>
  <rect x="156" y="246" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="261" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.31.x</text>
  <rect x="360" y="246" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="261" text-anchor="middle" font-size="8.5" fill="#334155">1.31.0 于 2026-08-31 发布，1.31.1 / 2026-09-21 是最新补丁</text>
  <rect x="30" y="272" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="287" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">仍在支持</text>
  <rect x="156" y="272" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="287" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.30.x / 1.29.x</text>
  <rect x="360" y="272" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="287" text-anchor="middle" font-size="8.5" fill="#334155">1.29 预计 2026-10-12 EOL；1.30 预计 2026-12 EOL，之后只剩 1.31</text>
  <rect x="30" y="298" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="313" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">已 EOL</text>
  <rect x="156" y="298" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="313" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.28 及更早</text>
  <rect x="360" y="298" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="313" text-anchor="middle" font-size="8.5" fill="#334155">1.28 于 2026-07-01 结束支持，官方不保证其已知 CVE 全部修复</text>
  <rect x="30" y="324" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="339" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">无已知 CVE</text>
  <rect x="156" y="324" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="339" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.29.2+ / 1.30.0+ / 1.31.0+</text>
  <rect x="360" y="324" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="339" text-anchor="middle" font-size="8.5" fill="#334155">低于这些补丁号的版本存在已披露漏洞，升级优先于加功能</text>
  <rect x="30" y="350" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="365" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">K8s 兼容</text>
  <rect x="156" y="350" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="365" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.32 ~ 1.36</text>
  <rect x="360" y="350" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="365" text-anchor="middle" font-size="8.5" fill="#334155">1.31 与 1.30 官方支持 1.32-1.36；1.29 支持 1.31-1.35</text>
  <rect x="30" y="376" width="118" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="89" y="391" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">Envoy 对应</text>
  <rect x="156" y="376" width="196" height="22" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="254" y="391" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">1.31.x → release/v1.39</text>
  <rect x="360" y="376" width="370" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="545" y="391" text-anchor="middle" font-size="8.5" fill="#334155">1.30.x → v1.38；1.29.x → v1.37，排障时按对应分支读文档</text>
  <text x="380" y="420" text-anchor="middle" font-size="9.5" fill="#B91C1C">判据：选哪个版本看「支持窗口」而不是版本号大小——跨两个 minor 以上必须逐级升，不能跳</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
