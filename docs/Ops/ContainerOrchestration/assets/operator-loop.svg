<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="op-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .cr { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .loop { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .k8s { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="cr" x="40" y="60" width="200" height="70"/>
  <text x="140" y="90">自定义资源 CR</text>
  <text class="small" x="140" y="110">期望状态声明</text>

  <rect class="loop" x="330" y="60" width="200" height="70"/>
  <text x="430" y="90">Operator 控制器</text>
  <text class="small" x="430" y="110">调谐循环 Reconcile</text>

  <rect class="k8s" x="620" y="60" width="200" height="70"/>
  <text x="720" y="90">实际状态</text>
  <text class="small" x="720" y="110">Deployment / Service / 配置</text>

  <line x1="240" y1="95" x2="330" y2="95" marker-end="url(#op-arrow)"/>
  <line x1="530" y1="95" x2="620" y2="95" marker-end="url(#op-arrow)"/>

  <rect class="loop" x="330" y="200" width="200" height="54"/>
  <text x="430" y="228">对比 → 调整 → 重新声明</text>

  <line x1="620" y1="130" x2="620" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="620" y1="175" x2="530" y2="200" marker-end="url(#op-arrow)"/>

  <text class="small" x="430" y="290">模式：CRD 声明期望 + 控制器持续调谐（声明式运维）</text>
  <text class="small" x="430" y="310">框架：Operator SDK / kubebuilder / Kopf（Python）</text>
  <text class="small" x="430" y="330">典型：Prometheus Operator、Postgres Operator、Kro（RGD）</text>
</svg>
