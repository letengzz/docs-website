<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="go-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .git { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .cd { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .k8s { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="git" x="40" y="60" width="200" height="70"/>
  <text x="140" y="90">Git 仓库（唯一事实源）</text>
  <text class="small" x="140" y="110">应用清单 + Helm values</text>

  <rect class="cd" x="330" y="60" width="200" height="70"/>
  <text x="430" y="90">Argo CD</text>
  <text class="small" x="430" y="110">持续拉取 + 对比差异</text>

  <rect class="k8s" x="620" y="60" width="200" height="70"/>
  <text x="720" y="90">Kubernetes 集群</text>
  <text class="small" x="720" y="110">实际状态</text>

  <line x1="240" y1="95" x2="330" y2="95" marker-end="url(#go-arrow)"/>
  <line x1="530" y1="95" x2="620" y2="95" marker-end="url(#go-arrow)"/>

  <rect class="k8s" x="330" y="200" width="200" height="54"/>
  <text x="430" y="228">自动同步 / 手动审批</text>
  <text class="small" x="430" y="246">漂移检测 + 回滚</text>

  <line x1="720" y1="130" x2="720" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="720" y1="175" x2="555" y2="200" marker-end="url(#go-arrow)"/>

  <text class="small" x="430" y="290">GitOps 原则：声明式、版本化、可审计、自动收敛</text>
  <text class="small" x="430" y="310">Argo CD 3.x：ApplicationSet 多团队、Source Hydrator、安全删除</text>
  <text class="small" x="430" y="330">回滚 = git revert → 自动同步，无需 kubectl 手工操作</text>
</svg>
