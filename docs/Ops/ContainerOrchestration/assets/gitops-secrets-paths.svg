<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85a4a"/>
    </marker>
    <marker id="gg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3aa76d"/>
    </marker>
  </defs>
  <style>
    .git { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .cd  { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; }
    .k8s { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .warn{ fill: #fdeeee; stroke: #d85a4a; stroke-width: 1.5; }
    .mut { fill: #f5f5f7; stroke: #999; stroke-width: 1.2; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .t2  { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <text class="t2" x="450" y="32">密钥进 Git 的三条路（明文 Secret 永远不行）</text>

  <rect class="k8s" x="40" y="60" width="250" height="230"/>
  <text x="165" y="86" class="t2">路线 A：External Secrets</text>
  <text class="small" x="165" y="110">Git 里只放「指针」</text>
  <text class="small" x="165" y="132">ExternalSecret CR</text>
  <text class="small" x="165" y="154">  ↓ 控制器拉取</text>
  <text class="small" x="165" y="176">外部存储（Vault / 云 KMS）</text>
  <text class="small" x="165" y="202">轮换：改外部存储即可</text>
  <text class="small" x="165" y="224">Git 永远不含密文</text>
  <text class="small" x="165" y="248">适合：已上云或已有 Vault</text>
  <text class="small" x="165" y="268">ESO 2.11 / v1 稳定 API</text>

  <rect class="cd" x="320" y="60" width="250" height="230"/>
  <text x="445" y="86" class="t2">路线 B：Sealed Secrets</text>
  <text class="small" x="445" y="110">Git 里放「密文」</text>
  <text class="small" x="445" y="132">kubeseal 用集群公钥加密</text>
  <text class="small" x="445" y="154">  ↓ 控制器私钥解密</text>
  <text class="small" x="445" y="176">集群内生成普通 Secret</text>
  <text class="small" x="445" y="202">零外部依赖、最简单</text>
  <text class="small" x="445" y="224">轮换需重新加密提交</text>
  <text class="small" x="445" y="248">适合：小团队、密钥少</text>
  <text class="small" x="445" y="268">0.40.0（2026-09）</text>

  <rect class="git" x="600" y="60" width="250" height="230"/>
  <text x="725" y="86" class="t2">路线 C：SOPS + age</text>
  <text class="small" x="725" y="110">Git 里放「加密文件」</text>
  <text class="small" x="725" y="132">sops 加密 values/secrets</text>
  <text class="small" x="725" y="154">  ↓ 交付时解密</text>
  <text class="small" x="725" y="176">Flux decryption / KSOPS</text>
  <text class="small" x="725" y="202">整文件加密、可读差异</text>
  <text class="small" x="725" y="224">age 私钥放集群/KMS</text>
  <text class="small" x="725" y="248">适合：清单整体加密托管</text>
  <text class="small" x="725" y="268">Flux 原生内置解密</text>

  <rect class="warn" x="40" y="320" width="810" height="56"/>
  <text class="small" x="445" y="344">共同底线：明文 Secret 一旦提交过 Git，无论怎么删除都「从未真正删除」——正确处置是立即轮换该密钥，再讨论历史清理。</text>
  <text class="small" x="445" y="364">选型顺序建议：已有密钥库 → A；从零开始的小团队 → B 先跑起来，密钥多了再迁 A。</text>

</svg>