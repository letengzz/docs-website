<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="392" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">服务网格排错决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三类症状的排查路径完全不同：不通查配置同步，灰度无效查匹配，延迟查链路</text>
  <rect x="300" y="76" width="160" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">网格出问题了</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类，再动配置</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">不要一上来就重启代理</text>
  <line x1="380" y1="132" x2="120" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="168" width="190" height="108" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="125" y="186.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">流量不通 / 503</text>
  <text x="125" y="203" text-anchor="middle" font-size="8" fill="#B91C1C">① istioctl analyze 有无 error</text>
  <text x="125" y="221.4" text-anchor="middle" font-size="8" fill="#B91C1C">② proxy-status 是否 SYNCED</text>
  <text x="125" y="239.8" text-anchor="middle" font-size="8" fill="#B91C1C">③ 是否 mTLS 模式不匹配</text>
  <text x="125" y="258.2" text-anchor="middle" font-size="8" fill="#B91C1C">④ 目标是否在网格外（未注入/未入网格）</text>
  <line x1="380" y1="132" x2="375" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="285" y="168" width="190" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">灰度没效果</text>
  <text x="380" y="203" text-anchor="middle" font-size="8" fill="#B45309">① DestinationRule 的 subset 标签是否存在</text>
  <text x="380" y="221.4" text-anchor="middle" font-size="8" fill="#B45309">② VirtualService 是否绑定 Gateway</text>
  <text x="380" y="239.8" text-anchor="middle" font-size="8" fill="#B45309">③ 请求是否真的命中该规则</text>
  <text x="380" y="258.2" text-anchor="middle" font-size="8" fill="#B45309">④ 兜底规则是否吞掉了全部流量</text>
  <line x1="380" y1="132" x2="630" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="540" y="168" width="190" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="635" y="186.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">延迟变高</text>
  <text x="635" y="203" text-anchor="middle" font-size="8" fill="#0F766E">① waypoint 是否被跨节点跳转</text>
  <text x="635" y="221.4" text-anchor="middle" font-size="8" fill="#0F766E">② 是否重试风暴（看 attempts）</text>
  <text x="635" y="239.8" text-anchor="middle" font-size="8" fill="#0F766E">③ 连接池是否排队</text>
  <text x="635" y="258.2" text-anchor="middle" font-size="8" fill="#0F766E">④ 追踪里哪一段变长了</text>
  <text x="380" y="300" text-anchor="middle" font-size="9.5" fill="#1E3A8A">三条最有效的取证命令：istioctl analyze（配置）· istioctl proxy-config routes/clusters（代理里真实生效的东西）· Kiali（拓扑与指标）</text>
  <text x="380" y="324" text-anchor="middle" font-size="9.5" fill="#B91C1C">最容易搞错的一层：istioctl proxy-config 是「代理里实际生效的结果」，而 kubectl get 只是「你写的意图」——两者不一致时，先看 analyze</text>
  <text x="380" y="348" text-anchor="middle" font-size="9.5" fill="#64748B">两个高频误判：把 403 当 401 查（授权 vs 身份）· 把「配置写错了」当「网格有 bug」查</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#065F46">回滚优先：先摘掉 use-waypoint 标签或取消命名空间入网格，把业务恢复，再慢慢查配置</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
