<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="hm-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .chart { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .k8s { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="chart" x="40" y="60" width="200" height="70"/>
  <text x="140" y="90">Chart 包</text>
  <text class="small" x="140" y="110">模板 + values + 依赖</text>

  <rect class="mid" x="330" y="60" width="200" height="70"/>
  <text x="430" y="90">helm install/upgrade</text>
  <text class="small" x="430" y="110">渲染模板 → 生成清单</text>

  <rect class="k8s" x="620" y="60" width="200" height="70"/>
  <text x="720" y="90">Kubernetes API</text>
  <text class="small" x="720" y="110">创建/更新资源</text>

  <line x1="240" y1="95" x2="330" y2="95" marker-end="url(#hm-arrow)"/>
  <line x1="530" y1="95" x2="620" y2="95" marker-end="url(#hm-arrow)"/>

  <rect class="k8s" x="330" y="200" width="200" height="54"/>
  <text x="430" y="228">Release 状态记录</text>
  <text class="small" x="430" y="246">回滚 / 升级 / 卸载</text>

  <line x1="720" y1="130" x2="720" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="720" y1="175" x2="555" y2="200" marker-end="url(#hm-arrow)"/>

  <text class="small" x="430" y="290">核心概念：Chart / Release / Repository / Values</text>
  <text class="small" x="430" y="310">Helm 4：server-side apply、WASM 插件、内容寻址缓存</text>
  <text class="small" x="430" y="330">注意：Helm 3 于 2026-09 停止特性更新，2027-02 停止安全补丁</text>
</svg>
