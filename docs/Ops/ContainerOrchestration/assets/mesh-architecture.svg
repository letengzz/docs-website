<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Istio 架构：控制面与两种数据面模式</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">控制面只下发配置与证书，真正的流量处理全在数据面；数据面有两种，可以混用</text>
  <rect x="30" y="76" width="700" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">控制面 · istiod（单进程，无状态）</text>
  <text x="380" y="111" text-anchor="middle" font-size="8.5" fill="#6D28D9">配置分发（xDS）· 服务发现（WDS）· 证书签发（内置 CA · X.509 证书轮换）</text>
  <text x="380" y="130.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">监听 Istio CRD（VirtualService / Gateway / PeerAuthentication…）与 Gateway API 资源</text>
  <text x="380" y="150.1" text-anchor="middle" font-size="8.5" fill="#6D28D9">不参与数据转发：控制面挂掉，已下发的代理仍按最后一份配置继续工作</text>
  <line x1="220" y1="152" x2="220" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="540" y1="152" x2="540" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="190" width="330" height="124" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="195" y="208.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">数据面 A · Sidecar 模式（Envoy 旁路容器）</text>
  <text x="195" y="225" text-anchor="middle" font-size="8" fill="#1D4ED8">每个业务 Pod 注入一个 istio-proxy</text>
  <text x="195" y="243.4" text-anchor="middle" font-size="8" fill="#1D4ED8">L7 能力完整：HTTP 路由、重试、JWT、限流</text>
  <text x="195" y="261.8" text-anchor="middle" font-size="8" fill="#1D4ED8">成本随 Pod 数量线性增长（内存 + CPU + 升级次数）</text>
  <text x="195" y="280.2" text-anchor="middle" font-size="8" fill="#1D4ED8">引入靠命名空间标签自动注入；升级要重启 Pod</text>
  <rect x="400" y="190" width="330" height="124" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="208.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">数据面 B · Ambient 模式（ztunnel + waypoint）</text>
  <text x="565" y="225" text-anchor="middle" font-size="8" fill="#047857">节点级 ztunnel（Rust）：只做 L3/L4 与 mTLS，HBONE 隧道</text>
  <text x="565" y="243.4" text-anchor="middle" font-size="8" fill="#047857">按需部署 waypoint（Envoy）：要 L7 时才加</text>
  <text x="565" y="261.8" text-anchor="middle" font-size="8" fill="#047857">业务 Pod 零注入、零重启，采纳可逐命名空间推进</text>
  <text x="565" y="280.2" text-anchor="middle" font-size="8" fill="#047857">L4 与 L7 分层：不需要 L7 就别付 L7 的代价</text>
  <text x="380" y="342" text-anchor="middle" font-size="10" fill="#1E3A8A">两种模式可以在同一个网格里共存，工作负载之间照常互联——采纳节奏由业务决定，不由网格决定</text>
  <text x="380" y="366" text-anchor="middle" font-size="9.5" fill="#475569">选型判据：只要 L4 加密与授权 → Ambient；需要 HTTP 级治理且团队已熟悉 Envoy → Sidecar</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
