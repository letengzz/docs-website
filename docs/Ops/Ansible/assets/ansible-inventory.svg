<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">清单（Inventory）：组、子组与变量作用域</text>

  <rect x="250" y="50" width="260" height="44" rx="9" fill="#2563EB"/>
  <text x="380" y="70" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="bold">all（隐式顶级组）</text>
  <text x="380" y="86" text-anchor="middle" font-size="10.5" fill="#DBEAFE">group_vars/all.yml</text>

  <rect x="60" y="140" width="180" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#1E3A8A" font-weight="bold">children: web</text>
  <text x="150" y="182" text-anchor="middle" font-size="10.5" fill="#64748B">group_vars/web.yml</text>

  <rect x="290" y="140" width="180" height="52" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#1E3A8A" font-weight="bold">children: db</text>
  <text x="380" y="182" text-anchor="middle" font-size="10.5" fill="#64748B">group_vars/db.yml</text>

  <rect x="520" y="140" width="190" height="52" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="615" y="164" text-anchor="middle" font-size="12" fill="#9A3412" font-weight="bold">host_vars/web-01.yml</text>
  <text x="615" y="182" text-anchor="middle" font-size="10.5" fill="#64748B">主机级覆盖组级</text>

  <g font-size="11">
    <rect x="60" y="238" width="180" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="150" y="260" text-anchor="middle" fill="#334155">web-01  web-02</text>
    <rect x="290" y="238" width="180" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="380" y="260" text-anchor="middle" fill="#334155">db-01</text>
    <rect x="520" y="238" width="190" height="34" rx="7" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="615" y="260" text-anchor="middle" fill="#334155">localhost</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.6" fill="none">
    <line x1="320" y1="94" x2="150" y2="136"/>
    <line x1="380" y1="94" x2="380" y2="136"/>
    <line x1="440" y1="94" x2="615" y2="136"/>
    <line x1="150" y1="192" x2="150" y2="234"/>
    <line x1="380" y1="192" x2="380" y2="234"/>
    <line x1="615" y1="192" x2="615" y2="234"/>
  </g>

  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#64748B">优先级：主机变量 &gt; 组变量（子组 &gt; 父组）&gt; all；同层按 host_vars/group_vars 目录与文件顺序覆盖</text>
  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#64748B">子组属于父组的 children，父组变量对子组主机同样生效</text>
</svg>
