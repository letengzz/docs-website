<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="320" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：用角色批量交付生产 Web 服务器</text>

  <g font-size="11">
    <rect x="24" y="56" width="140" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="94" y="80" text-anchor="middle" font-size="12" fill="#1E3A8A" font-weight="bold">① 清单与变量</text>
    <text x="94" y="102" text-anchor="middle" fill="#334155">inventory.ini</text>
    <text x="94" y="120" text-anchor="middle" fill="#334155">group_vars/web.yml</text>
    <text x="94" y="138" text-anchor="middle" fill="#334155">host_vars/web-01.yml</text>

    <rect x="180" y="56" width="140" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="250" y="80" text-anchor="middle" font-size="12" fill="#1E3A8A" font-weight="bold">② 角色</text>
    <text x="250" y="102" text-anchor="middle" fill="#334155">common（基线）</text>
    <text x="250" y="120" text-anchor="middle" fill="#334155">nginx（Web）</text>
    <text x="250" y="138" text-anchor="middle" fill="#334155">templates 渲染配置</text>

    <rect x="336" y="56" width="140" height="96" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="406" y="80" text-anchor="middle" font-size="12" fill="#9A3412" font-weight="bold">③ 加密敏感值</text>
    <text x="406" y="102" text-anchor="middle" fill="#334155">ansible-vault</text>
    <text x="406" y="120" text-anchor="middle" fill="#334155">vault.yml</text>
    <text x="406" y="138" text-anchor="middle" fill="#334155">--vault-password-file</text>

    <rect x="492" y="56" width="140" height="96" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="562" y="80" text-anchor="middle" font-size="12" fill="#1E3A8A" font-weight="bold">④ 灰度执行</text>
    <text x="562" y="102" text-anchor="middle" fill="#334155">--check --diff</text>
    <text x="562" y="120" text-anchor="middle" fill="#334155">--limit web-01</text>
    <text x="562" y="138" text-anchor="middle" fill="#334155">serial: 1</text>

    <rect x="648" y="56" width="88" height="96" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="692" y="80" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">⑤ 验收</text>
    <text x="692" y="104" text-anchor="middle" fill="#334155">curl</text>
    <text x="692" y="122" text-anchor="middle" fill="#334155">幂等复跑</text>
    <text x="692" y="140" text-anchor="middle" fill="#334155">全绿</text>
  </g>

  <g stroke="#2563EB" stroke-width="1.7" fill="none" marker-end="url(#ar6)">
    <line x1="166" y1="104" x2="176" y2="104"/>
    <line x1="322" y1="104" x2="332" y2="104"/>
    <line x1="478" y1="104" x2="488" y2="104"/>
    <line x1="634" y1="104" x2="644" y2="104"/>
  </g>

  <rect x="60" y="184" width="640" height="112" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="380" y="208" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">关键验收命令</text>
  <text x="80" y="232" font-size="11" fill="#1D4ED8" font-family="Consolas, monospace">ansible-playbook -i inventory.ini site.yml --check --diff --limit web-01</text>
  <text x="80" y="254" font-size="11" fill="#1D4ED8" font-family="Consolas, monospace">ansible-playbook -i inventory.ini site.yml --vault-password-file .vault_pass</text>
  <text x="80" y="276" font-size="11" fill="#1D4ED8" font-family="Consolas, monospace">curl -sI http://web-01/ | head -1      # 期望 HTTP/1.1 200 OK</text>

  <defs>
    <marker id="ar6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
