<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">环境准备与首次连通验证</text>

  <g font-size="11.5">
    <rect x="24" y="60" width="160" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="104" y="86" text-anchor="middle" font-size="12.5" fill="#1E3A8A" font-weight="bold">① 装控制节点</text>
    <text x="104" y="108" text-anchor="middle" fill="#334155">pipx / pip 装</text>
    <text x="104" y="126" text-anchor="middle" fill="#334155">ansible-core 或 ansible</text>

    <rect x="204" y="60" width="160" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="284" y="86" text-anchor="middle" font-size="12.5" fill="#1E3A8A" font-weight="bold">② 配 SSH 免密</text>
    <text x="284" y="108" text-anchor="middle" fill="#334155">ssh-keygen + ssh-copy-id</text>
    <text x="284" y="126" text-anchor="middle" fill="#334155">known_hosts 预置</text>

    <rect x="384" y="60" width="160" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="464" y="86" text-anchor="middle" font-size="12.5" fill="#1E3A8A" font-weight="bold">③ 写清单</text>
    <text x="464" y="108" text-anchor="middle" fill="#334155">inventory.ini / .yml</text>
    <text x="464" y="126" text-anchor="middle" fill="#334155">ansible.cfg 指定路径</text>

    <rect x="564" y="60" width="172" height="86" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="650" y="86" text-anchor="middle" font-size="12.5" fill="#065F46" font-weight="bold">④ 验证</text>
    <text x="650" y="108" text-anchor="middle" fill="#334155">ansible all -m ping</text>
    <text x="650" y="126" text-anchor="middle" fill="#334155">全绿 = 通路 OK</text>
  </g>

  <g stroke="#2563EB" stroke-width="1.8" fill="none" marker-end="url(#ar2)">
    <line x1="186" y1="103" x2="200" y2="103"/>
    <line x1="366" y1="103" x2="380" y2="103"/>
    <line x1="546" y1="103" x2="560" y2="103"/>
  </g>

  <rect x="90" y="186" width="580" height="86" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">首次 ping 的预期输出（节选）</text>
  <text x="380" y="234" text-anchor="middle" font-size="10.5" fill="#475569" font-family="Consolas, monospace">web-01 | SUCCESS =&gt; &quot;ping&quot;: &quot;pong&quot;</text>
  <text x="380" y="254" text-anchor="middle" font-size="10.5" fill="#475569" font-family="Consolas, monospace">db-01  | UNREACHABLE! =&gt; SSH 或 Python 缺失（先排这个）</text>
  <text x="380" y="271" text-anchor="middle" font-size="10.5" fill="#64748B">unreachable 先查网络/SSH；failed 再查 Python 解释器与权限</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
