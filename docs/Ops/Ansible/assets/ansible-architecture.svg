<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Ansible 无代理（agentless）架构</text>

  <rect x="30" y="60" width="200" height="232" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-size="13.5" fill="#1E3A8A" font-weight="bold">控制节点（Control Node）</text>
  <g font-size="11" fill="#334155">
    <rect x="48" y="104" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="130" y="124" text-anchor="middle">ansible / ansible-playbook</text>
    <rect x="48" y="142" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="130" y="162" text-anchor="middle">清单 Inventory</text>
    <rect x="48" y="180" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="130" y="200" text-anchor="middle">Playbook / Role</text>
    <rect x="48" y="218" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="130" y="238" text-anchor="middle">模块 + Python 解释器</text>
  </g>
  <text x="130" y="272" text-anchor="middle" font-size="10.5" fill="#64748B">只需 Python，无需装 Agent</text>

  <rect x="530" y="60" width="200" height="232" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="630" y="88" text-anchor="middle" font-size="13.5" fill="#065F46" font-weight="bold">被管节点（Managed Nodes）</text>
  <g font-size="11" fill="#334155">
    <rect x="548" y="104" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="630" y="124" text-anchor="middle">SSH 服务（Linux/Unix）</text>
    <rect x="548" y="142" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="630" y="162" text-anchor="middle">WinRM（Windows）</text>
    <rect x="548" y="180" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="630" y="200" text-anchor="middle">Python 2.7+ / 3.9+</text>
    <rect x="548" y="218" width="164" height="30" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="630" y="238" text-anchor="middle">临时目录执行后删除</text>
  </g>
  <text x="630" y="272" text-anchor="middle" font-size="10.5" fill="#64748B">无需安装常驻进程</text>

  <g stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#ar1)">
    <line x1="234" y1="140" x2="524" y2="140"/>
  </g>
  <g stroke="#94A3B8" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar1)">
    <line x1="524" y1="220" x2="234" y2="220"/>
  </g>
  <text x="380" y="132" text-anchor="middle" font-size="11" fill="#1D4ED8">① 推送模块代码（SSH/stdin）</text>
  <text x="380" y="213" text-anchor="middle" font-size="11" fill="#64748B">② 回传 JSON 结果</text>

  <defs>
    <marker id="ar1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#64748B">幂等：同一 Playbook 跑 N 次，结果一致；有变更才报 changed</text>
</svg>
