<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">变量优先级（低 → 高，节选常用层）</text>

  <g font-size="11">
    <rect x="150" y="48" width="460" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="166" y="66" fill="#334155">role defaults/main.yml</text>
    <text x="594" y="66" text-anchor="end" fill="#94A3B8">最弱</text>

    <rect x="150" y="80" width="460" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="166" y="98" fill="#334155">inventory group_vars/all</text>

    <rect x="150" y="112" width="460" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="166" y="130" fill="#334155">group_vars/&lt;group&gt;（子组优于父组）</text>

    <rect x="150" y="144" width="460" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="166" y="162" fill="#334155">host_vars/&lt;host&gt;</text>

    <rect x="150" y="176" width="460" height="26" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
    <text x="166" y="194" fill="#334155">play 的 vars / vars_files</text>

    <rect x="150" y="208" width="460" height="26" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
    <text x="166" y="226" fill="#334155">task 的 vars / set_fact（register）</text>

    <rect x="150" y="240" width="460" height="26" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.3"/>
    <text x="166" y="258" fill="#334155">role 的 vars/main.yml</text>

    <rect x="150" y="272" width="460" height="26" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.3"/>
    <text x="166" y="290" fill="#334155">-e / --extra-vars（命令行）</text>
    <text x="594" y="290" text-anchor="end" fill="#DC2626">最强</text>
  </g>

  <line x1="130" y1="60" x2="130" y2="286" stroke="#2563EB" stroke-width="2" marker-end="url(#ar5)"/>
  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#64748B">完整优先级共 20 余层；排障时用 ansible-inventory --host &lt;主机&gt; 与 debug 变量确认最终取值</text>
  <text x="380" y="344" text-anchor="middle" font-size="11" fill="#64748B">经验法则：可变配置放 defaults，不该被覆盖的放 vars，主机差异放 host_vars</text>
</svg>
