<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ar-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .client { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .master { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .worker { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    .backend { fill: #f3f3f3; stroke: #888; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="client" x="40" y="130" width="140" height="60"/>
  <text x="110" y="160">客户端请求</text>
  <text class="small" x="110" y="178">浏览器 / App</text>

  <line x1="180" y1="160" x2="240" y2="160" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ar-arrow)"/>

  <rect class="master" x="240" y="20" width="160" height="50"/>
  <text x="320" y="42">master 进程</text>
  <text class="small" x="320" y="60">读取配置 / 管理 worker</text>

  <line x1="320" y1="70" x2="320" y2="100" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ar-arrow)"/>
  <line x1="280" y1="70" x2="170" y2="100" stroke="#4a7bd8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect class="worker" x="230" y="100" width="180" height="50"/>
  <text x="320" y="122">worker 进程 ×N</text>
  <text class="small" x="320" y="140">epoll 事件驱动处理连接</text>

  <line x1="320" y1="150" x2="320" y2="180" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ar-arrow)"/>

  <rect class="backend" x="240" y="180" width="160" height="60"/>
  <text x="320" y="205">后端服务</text>
  <text class="small" x="320" y="225">Tomcat / Spring Boot / Node</text>

  <rect class="backend" x="480" y="180" width="160" height="60"/>
  <text x="560" y="205">后端服务</text>
  <text class="small" x="560" y="225">Tomcat / Spring Boot / Node</text>

  <line x1="400" y1="210" x2="480" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text class="small" x="360" y="280">Nginx 进程模型：1 个 master + 多个 worker，连接由事件驱动处理</text>
  <text class="small" x="360" y="300">静态资源直接返回；动态请求反向代理给后端</text>
</svg>
