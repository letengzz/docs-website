<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .req { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .cfg { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .file { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <text x="190" y="28" text-anchor="middle" font-weight="bold">root：拼接 location 前缀</text>
  <text x="550" y="28" text-anchor="middle" font-weight="bold">alias：替换 location 前缀</text>

  <rect class="req" x="30" y="50" width="140" height="46"/>
  <text x="100" y="78">/static/a.css</text>

  <rect class="cfg" x="40" y="130" width="160" height="46"/>
  <text x="120" y="152">root /var/www/site</text>
  <text class="small" x="120" y="168">location /static/</text>

  <line x1="100" y1="96" x2="100" y2="130" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#sr-arrow)"/>
  <line x1="120" y1="176" x2="120" y2="205" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#sr-arrow)"/>

  <rect class="file" x="30" y="205" width="180" height="46"/>
  <text x="120" y="227">/var/www/site/static/a.css</text>
  <text class="small" x="120" y="243">前缀保留</text>

  <rect class="req" x="400" y="50" width="140" height="46"/>
  <text x="470" y="78">/static/a.css</text>

  <rect class="cfg" x="410" y="130" width="160" height="46"/>
  <text x="490" y="152">alias /var/www/files/</text>
  <text class="small" x="490" y="168">location /static/</text>

  <line x1="470" y1="96" x2="470" y2="130" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#sr-arrow)"/>
  <line x1="490" y1="176" x2="490" y2="205" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#sr-arrow)"/>

  <rect class="file" x="400" y="205" width="180" height="46"/>
  <text x="490" y="227">/var/www/files/a.css</text>
  <text class="small" x="490" y="243">前缀被替换</text>

  <text class="small" x="360" y="270">alias 末尾记得带 /，否则路径会拼接错误</text>
</svg>
