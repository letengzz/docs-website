<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="lb-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .client { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .lb { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    .node { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 12; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="client" x="40" y="120" width="150" height="60"/>
  <text x="115" y="147">多个客户端</text>
  <text class="small" x="115" y="167">海量请求</text>

  <line x1="190" y1="150" x2="250" y2="150" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lb-arrow)"/>

  <rect class="lb" x="250" y="115" width="200" height="70"/>
  <text x="350" y="142">Nginx 负载均衡</text>
  <text class="small" x="350" y="162">轮询 / 权重 / ip_hash</text>
  <text class="small" x="350" y="178">least_conn / 一致性哈希</text>

  <line x1="400" y1="125" x2="470" y2="75" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lb-arrow)"/>
  <line x1="430" y1="150" x2="500" y2="150" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lb-arrow)"/>
  <line x1="400" y1="175" x2="470" y2="225" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lb-arrow)"/>

  <rect class="node" x="470" y="45" width="200" height="55"/>
  <text x="570" y="68">后端 A（weight=3）</text>
  <text class="small" x="570" y="88">承接最多流量</text>

  <rect class="node" x="500" y="120" width="180" height="55"/>
  <text x="590" y="143">后端 B</text>
  <text class="small" x="590" y="163">正常承接</text>

  <rect class="node" x="470" y="195" width="200" height="55"/>
  <text x="570" y="218">后端 C（backup）</text>
  <text class="small" x="570" y="238">仅故障时启用</text>

  <text class="small" x="350" y="280">策略选择：同 IP 会话 → ip_hash；异构机器 → weight；动态扩容 → 一致性哈希</text>
</svg>
