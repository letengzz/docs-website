<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ch-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .main { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .block { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .leaf { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="main" x="250" y="20" width="200" height="46"/>
  <text x="350" y="40">main（全局）</text>
  <text class="small" x="350" y="56">worker_processes / user</text>

  <line x1="300" y1="66" x2="180" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ch-arrow)"/>
  <line x1="400" y1="66" x2="520" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ch-arrow)"/>

  <rect class="block" x="100" y="110" width="160" height="46"/>
  <text x="180" y="132">events</text>
  <text class="small" x="180" y="148">worker_connections</text>

  <rect class="block" x="440" y="110" width="160" height="46"/>
  <text x="520" y="132">http</text>
  <text class="small" x="520" y="148">include / gzip / upstream</text>

  <line x1="520" y1="156" x2="520" y2="190" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ch-arrow)"/>

  <rect class="block" x="440" y="190" width="160" height="46"/>
  <text x="520" y="212">server</text>
  <text class="small" x="520" y="228">listen / server_name</text>

  <line x1="480" y1="236" x2="370" y2="275" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ch-arrow)"/>
  <line x1="560" y1="236" x2="600" y2="275" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ch-arrow)"/>

  <rect class="leaf" x="250" y="275" width="240" height="46"/>
  <text x="370" y="297">location /api/</text>
  <text class="small" x="370" y="313">proxy_pass / root / return</text>

  <rect class="leaf" x="510" y="275" width="180" height="46"/>
  <text x="600" y="297">location /static/</text>
  <text class="small" x="600" y="313">alias / expires</text>

  <text class="small" x="350" y="345">指令必须放在正确的上下文中，否则 nginx -t 报错</text>
</svg>
