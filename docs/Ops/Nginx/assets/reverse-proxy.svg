<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="rp-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .client { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .nginx { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    .backend { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 12; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="client" x="40" y="125" width="150" height="60"/>
  <text x="115" y="152">客户端</text>
  <text class="small" x="115" y="172">不知道后端存在</text>

  <line x1="190" y1="155" x2="250" y2="155" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rp-arrow)"/>
  <text class="small" x="220" y="145">请求 api.example.com</text>

  <rect class="nginx" x="250" y="120" width="180" height="70"/>
  <text x="340" y="147">Nginx（反向代理）</text>
  <text class="small" x="340" y="167">proxy_pass 转发</text>
  <text class="small" x="340" y="183">透传 Host / 真实 IP</text>

  <line x1="430" y1="135" x2="500" y2="90" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rp-arrow)"/>
  <line x1="430" y1="175" x2="500" y2="220" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#rp-arrow)"/>

  <rect class="backend" x="500" y="55" width="180" height="55"/>
  <text x="590" y="78">后端服务 A</text>
  <text class="small" x="590" y="98">内网 8080</text>

  <rect class="backend" x="500" y="195" width="180" height="55"/>
  <text x="590" y="218">后端服务 B</text>
  <text class="small" x="590" y="238">内网 8081</text>

  <line x1="500" y1="110" x2="430" y2="140" stroke="#3aa76d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="500" y1="195" x2="430" y2="180" stroke="#3aa76d" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text class="small" x="360" y="270">反向代理：客户端只访问 Nginx，后端内网部署不暴露</text>
  <text class="small" x="360" y="290">配合 upstream 可同时实现负载均衡</text>
</svg>
