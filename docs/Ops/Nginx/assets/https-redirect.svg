<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="hs-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .http { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .nginx { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    .https { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 12; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="http" x="40" y="50" width="160" height="60"/>
  <text x="120" y="78">http://example.com</text>
  <text class="small" x="120" y="98">80 端口</text>

  <line x1="200" y1="80" x2="250" y2="80" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#hs-arrow)"/>

  <rect class="nginx" x="250" y="55" width="180" height="60"/>
  <text x="340" y="82">Nginx</text>
  <text class="small" x="340" y="102">return 301 跳转</text>

  <line x1="430" y1="80" x2="480" y2="80" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#hs-arrow)"/>

  <rect class="https" x="480" y="50" width="200" height="60"/>
  <text x="580" y="78">https://example.com</text>
  <text class="small" x="580" y="98">443 端口 + TLS 加密</text>

  <line x1="580" y1="110" x2="580" y2="150" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#hs-arrow)"/>

  <rect class="https" x="420" y="150" width="320" height="70"/>
  <text x="580" y="175">HTTPS server</text>
  <text class="small" x="580" y="195">ssl_certificate / ssl_protocols TLSv1.2+</text>
  <text class="small" x="580" y="212">http2 on / HSTS / OCSP Stapling</text>

  <line x1="420" y1="185" x2="360" y2="185" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect class="nginx" x="250" y="160" width="110" height="50"/>
  <text x="305" y="185">明文被拦截</text>
  <text class="small" x="305" y="200">不跳转的后果</text>

  <text class="small" x="360" y="270">强制 HTTPS：80 端口 301 → 443，避免明文访问与混合内容</text>
</svg>
