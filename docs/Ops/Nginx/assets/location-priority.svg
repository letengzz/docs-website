<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="lp-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .pri { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 10; }
    .mid { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    .low { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="pri" x="160" y="20" width="380" height="52"/>
  <text x="350" y="42">= 精确匹配（最高优先级）</text>
  <text class="small" x="350" y="60">location = /health</text>

  <line x1="350" y1="72" x2="350" y2="100" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lp-arrow)"/>

  <rect class="mid" x="160" y="100" width="380" height="52"/>
  <text x="350" y="122">^~ 前缀匹配（不再查正则）</text>
  <text class="small" x="350" y="140">location ^~ /static/</text>

  <line x1="350" y1="152" x2="350" y2="180" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lp-arrow)"/>

  <rect class="mid" x="160" y="180" width="380" height="52"/>
  <text x="350" y="202">~ / ~* 正则匹配（按书写顺序）</text>
  <text class="small" x="350" y="220">location ~* \.(js|css)$</text>

  <line x1="350" y1="232" x2="350" y2="260" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#lp-arrow)"/>

  <rect class="low" x="160" y="260" width="380" height="36"/>
  <text x="350" y="283">普通前缀匹配（最长优先）</text>

  <text class="small" x="600" y="160" text-anchor="middle">匹配顺序从上到下</text>
</svg>
