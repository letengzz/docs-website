  <text x="244" y="144.59" text-anchor="middle" font-size="7.0" fill="#047857">基线加固 · 访问控制 · 加密</text>
  <line x1="312" y1="134.0" x2="324" y2="134.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="326" y="104" width="132" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="392" y="127.59" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">检测 DETECT</text>
  <text x="392" y="144.59" text-anchor="middle" font-size="7.0" fill="#0F766E">扫描 · 监控 · 异常检测</text>
  <line x1="460" y1="134.0" x2="472" y2="134.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="474" y="104" width="132" height="60" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="540" y="127.59" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">响应 RESPOND</text>
  <text x="540" y="144.59" text-anchor="middle" font-size="7.0" fill="#C2410C">告警 · 隔离 · 应急响应</text>
  <line x1="608" y1="134.0" x2="620" y2="134.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="622" y="104" width="132" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="688" y="127.59" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">恢复 RECOVER</text>
  <text x="688" y="144.59" text-anchor="middle" font-size="7.0" fill="#6D28D9">备份恢复 · 复盘改进</text>
  <text x="380" y="208" text-anchor="middle" font-size="12.5" fill="#991B1B" font-weight="bold">威胁建模四步（STRIDE / 攻击树）</text>
