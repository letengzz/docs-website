<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">安全加固方法论：从资产到闭环</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先回答「保护什么、防谁、代价多少」，再决定投入——不做无差别堆砌</text>
  <text x="380" y="92" text-anchor="middle" font-size="12.5" fill="#5B21B6" font-weight="bold">NIST CSF 2.0 五功能：治理（Govern）贯穿全程</text>
  <rect x="30" y="104" width="132" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="96" y="127.59" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">识别 IDENTIFY</text>
  <text x="96" y="144.59" text-anchor="middle" font-size="7.0" fill="#1D4ED8">资产清单 · 数据分级 · 威胁建模</text>
  <line x1="164" y1="134.0" x2="176" y2="134.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
