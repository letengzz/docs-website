  <text x="480" y="257.92" text-anchor="middle" font-size="8.0" fill="#B91C1C">可能性 × 影响</text>
  <line x1="562" y1="247.0" x2="582" y2="247.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="584" y="220" width="160" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="664" y="240.92" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">④ 定对策</text>
  <text x="664" y="257.92" text-anchor="middle" font-size="8.0" fill="#B91C1C">缓解/转移/接受</text>
  <rect x="32" y="296" width="336" height="60" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="200" y="319.92" text-anchor="middle" font-size="11" fill="#854D0E" font-weight="bold">合规框架映射</text>
  <text x="200" y="336.92" text-anchor="middle" font-size="9.5" fill="#A16207">等保 2.0 / ISO 27001 / SOC 2 → 控制项映射到具体基线</text>
  <rect x="392" y="296" width="336" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
