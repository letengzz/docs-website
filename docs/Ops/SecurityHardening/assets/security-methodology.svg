  <text x="112" y="257.92" text-anchor="middle" font-size="8.0" fill="#B91C1C">标出信任边界</text>
  <line x1="194" y1="247.0" x2="214" y2="247.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
