  <line x1="378" y1="247.0" x2="398" y2="247.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="220" width="160" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
