<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">密钥与凭据治理：生命周期六阶段</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">密钥安全 = 不落库、不进 Git、最小可见、可轮换、可追溯、可吊销</text>
  <rect x="30" y="78" width="110" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="85" y="96.42" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">生成</text>
  <text x="85" y="113.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">高熵随机</text>
  <text x="85" y="130.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">KMS/Vault 生成</text>
  <line x1="141" y1="111.0" x2="151" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="152" y="78" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="207" y="96.42" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">存储</text>
  <text x="207" y="113.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">集中托管</text>
  <text x="207" y="130.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">加密静态存储</text>
  <line x1="263" y1="111.0" x2="273" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="274" y="78" width="110" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="329" y="96.42" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">分发</text>
  <text x="329" y="113.42" text-anchor="middle" font-size="7.0" fill="#047857">运行时注入</text>
  <text x="329" y="130.42" text-anchor="middle" font-size="7.0" fill="#047857">短期动态凭据</text>
  <line x1="385" y1="111.0" x2="395" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="396" y="78" width="110" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="451" y="96.42" text-anchor="middle" font-size="11" fill="#115E59" font-weight="bold">使用</text>
  <text x="451" y="113.42" text-anchor="middle" font-size="7.0" fill="#0F766E">内存读取</text>
  <text x="451" y="130.42" text-anchor="middle" font-size="7.0" fill="#0F766E">不落盘不打日志</text>
  <line x1="507" y1="111.0" x2="517" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="518" y="78" width="110" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="573" y="96.42" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">轮换</text>
  <text x="573" y="113.42" text-anchor="middle" font-size="7.0" fill="#C2410C">定期/事件驱动</text>
  <text x="573" y="130.42" text-anchor="middle" font-size="7.0" fill="#C2410C">自动滚动</text>
  <line x1="629" y1="111.0" x2="639" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="78" width="110" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="695" y="96.42" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">吊销</text>
  <text x="695" y="113.42" text-anchor="middle" font-size="7.0" fill="#B91C1C">泄漏即吊销</text>
  <text x="695" y="130.42" text-anchor="middle" font-size="7.0" fill="#B91C1C">审计追溯</text>
  <text x="198" y="182" text-anchor="middle" font-size="12" fill="#991B1B" font-weight="bold">反模式（写死在代码/配置里）</text>
  <rect x="32" y="194" width="336" height="152" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <rect x="48" y="224" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="200" y="241.6" text-anchor="middle" font-size="10" fill="#991B1B">硬编码在源码，进 Git 历史</text>
  <rect x="48" y="259" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="200" y="276.6" text-anchor="middle" font-size="10" fill="#991B1B">提交到 .env 且未 ignore</text>
  <rect x="48" y="294" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="200" y="311.6" text-anchor="middle" font-size="10" fill="#991B1B">CI 日志打印环境变量</text>
  <rect x="48" y="329" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="200" y="346.6" text-anchor="middle" font-size="10" fill="#991B1B">同一密钥全环境共用</text>
  <rect x="48" y="364" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.1"/>
  <text x="200" y="381.6" text-anchor="middle" font-size="10" fill="#991B1B">永不轮换，离职不吊销</text>
  <text x="563" y="182" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">正确做法（集中托管 + 动态）</text>
  <rect x="392" y="194" width="336" height="152" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <rect x="408" y="224" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="560" y="241.6" text-anchor="middle" font-size="10" fill="#065F46">源码只留占位符/引用</text>
  <rect x="408" y="259" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="560" y="276.6" text-anchor="middle" font-size="10" fill="#065F46">CI 用 OIDC 换短期凭据</text>
  <rect x="408" y="294" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="560" y="311.6" text-anchor="middle" font-size="10" fill="#065F46">Vault/KMS 按需下发</text>
  <rect x="408" y="329" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="560" y="346.6" text-anchor="middle" font-size="10" fill="#065F46">环境隔离、权限分离</text>
  <rect x="408" y="364" width="304" height="28" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.1"/>
  <text x="560" y="381.6" text-anchor="middle" font-size="10" fill="#065F46">定期轮换 + 泄漏检测扫描</text>
  <text x="380" y="366" text-anchor="middle" font-size="10" fill="#64748B">工具：HashiCorp Vault · 云 KMS/Secrets Manager · Sealed Secrets / External Secrets（K8s）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
