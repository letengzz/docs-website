<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">纵深防御：横向治理视角下的分层加固</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">任一层被突破都不等于失守——每层都要有独立的「预防 + 检测」控制；本文专题负责跨层的治理与流程</text>
  <rect x="32" y="76" width="224" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="144" y="96.03" text-anchor="middle" font-size="11.5" fill="#5B21B6" font-weight="bold">身份与访问</text>
  <text x="144" y="113.03" text-anchor="middle" font-size="8.0" fill="#6D28D9">最小权限 · MFA · 短期凭据 · 服务账号盘查</text>
  <rect x="272" y="76" width="224" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="384" y="96.03" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">主机与系统</text>
  <text x="384" y="113.03" text-anchor="middle" font-size="8.0" fill="#1D4ED8">SSH 加固 · 补丁 · auditd · MAC（SELinux/AppArmor）</text>
  <rect x="512" y="76" width="224" height="52" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="624" y="96.03" text-anchor="middle" font-size="11.5" fill="#115E59" font-weight="bold">容器运行时</text>
  <text x="624" y="113.03" text-anchor="middle" font-size="8.0" fill="#0F766E">非 root · 最小 capability · 只读根 · seccomp</text>
  <rect x="32" y="162" width="224" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="144" y="182.03" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">集群与编排</text>
  <text x="144" y="199.03" text-anchor="middle" font-size="8.0" fill="#047857">RBAC · NetworkPolicy · PSA · 策略即代码</text>
  <rect x="272" y="162" width="224" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="384" y="182.03" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">应用与依赖</text>
  <text x="384" y="199.03" text-anchor="middle" font-size="8.0" fill="#C2410C">SAST · 依赖扫描 · SBOM · 签名验签</text>
  <rect x="512" y="162" width="224" height="52" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="624" y="182.03" text-anchor="middle" font-size="11.5" fill="#854D0E" font-weight="bold">数据与密钥</text>
  <text x="624" y="199.03" text-anchor="middle" font-size="8.0" fill="#A16207">静态/传输加密 · 密钥托管 · 脱敏 · 备份</text>
  <text x="380" y="264" text-anchor="middle" font-size="10.5" fill="#991B1B">← 攻击者越往上突破，成本越高；治理动作贯穿每一层 →</text>
  <rect x="32" y="282" width="336" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="306.92" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">预防类控制（Preventive）</text>
  <text x="200" y="323.92" text-anchor="middle" font-size="9.5" fill="#047857">基线加固 · 最小权限 · 策略即代码 · 镜像签名</text>
  <rect x="392" y="282" width="336" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="560" y="306.92" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">检测类控制（Detective）</text>
  <text x="560" y="323.92" text-anchor="middle" font-size="9.5" fill="#1D4ED8">漏洞扫描 · 运行时检测 · 审计日志 · SIEM 告警</text>
  <rect x="32" y="356" width="696" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="378.92" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">响应类控制（Responsive）</text>
  <text x="380" y="395.92" text-anchor="middle" font-size="9.5" fill="#B91C1C">预案演练 · 隔离与熔断 · 密钥轮换 · 取证与恢复时间目标（RTO/RPO）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
