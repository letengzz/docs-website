<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">漏洞管理生命周期与优先级判定</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">重点不是「扫出多少」，而是「高危有没有被按时修完」——用 SLA 把生命周期管理起来</text>
  <rect x="30" y="78" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="85" y="96.42" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">发现</text>
  <text x="85" y="113.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">SCA/镜像/主机</text>
  <text x="85" y="130.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">扫描与情报订阅</text>
  <line x1="141" y1="111.0" x2="151" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="152" y="78" width="110" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="207" y="96.42" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">评估</text>
  <text x="207" y="113.42" text-anchor="middle" font-size="7.0" fill="#C2410C">CVSS + EPSS</text>
  <text x="207" y="130.42" text-anchor="middle" font-size="7.0" fill="#C2410C">+ KEV 可达性</text>
  <line x1="263" y1="111.0" x2="273" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="274" y="78" width="110" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="329" y="96.42" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">定级</text>
  <text x="329" y="113.42" text-anchor="middle" font-size="7.0" fill="#B91C1C">P0~P3</text>
  <text x="329" y="130.42" text-anchor="middle" font-size="7.0" fill="#B91C1C">对应修复 SLA</text>
  <line x1="385" y1="111.0" x2="395" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="396" y="78" width="110" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="451" y="96.42" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">修复</text>
  <text x="451" y="113.42" text-anchor="middle" font-size="7.0" fill="#047857">升级/打补丁</text>
  <text x="451" y="130.42" text-anchor="middle" font-size="7.0" fill="#047857">配置缓解</text>
  <line x1="507" y1="111.0" x2="517" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="518" y="78" width="110" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="573" y="96.42" text-anchor="middle" font-size="11" fill="#115E59" font-weight="bold">验证</text>
  <text x="573" y="113.42" text-anchor="middle" font-size="7.0" fill="#0F766E">复扫确认</text>
  <text x="573" y="130.42" text-anchor="middle" font-size="7.0" fill="#0F766E">回归测试</text>
  <line x1="629" y1="111.0" x2="639" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="78" width="110" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="695" y="96.42" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">闭环</text>
  <text x="695" y="113.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">度量存量</text>
  <text x="695" y="130.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">复盘复发</text>
  <text x="380" y="182" text-anchor="middle" font-size="12.5" fill="#991B1B" font-weight="bold">优先级判定：CVSS 不再是唯一标准</text>
  <rect x="32" y="196" width="120" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="92" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="160" y="196" width="240" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="280" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">含义</text>
  <rect x="408" y="196" width="320" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="568" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">在排序中的作用</text>
  <rect x="32" y="228" width="120" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="92" y="242.98" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">CVSS</text>
  <rect x="160" y="228" width="240" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="280" y="242.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">基础严重度评分（0~10）</text>
  <rect x="408" y="228" width="320" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="568" y="242.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">通用语言，但不看是否被利用</text>
  <rect x="32" y="257" width="120" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="92" y="271.98" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">EPSS</text>
  <rect x="160" y="257" width="240" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="280" y="271.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">被利用概率（0~1）</text>
  <rect x="408" y="257" width="320" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="568" y="271.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">预测「未来 30 天是否会被打」</text>
  <rect x="32" y="286" width="120" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="92" y="300.98" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">KEV</text>
  <rect x="160" y="286" width="240" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="280" y="300.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">CISA 已知被利用目录</text>
  <rect x="408" y="286" width="320" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="568" y="300.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">已在实际攻击中使用的漏洞</text>
  <rect x="32" y="315" width="120" height="26" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="92" y="329.98" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">可达性/暴露面</text>
  <rect x="160" y="315" width="240" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="280" y="329.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">组件是否真被调用、是否公网可达</text>
  <rect x="408" y="315" width="320" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="568" y="329.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">排除「装了但没用」的噪声</text>
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#991B1B">示例 SLA：KEV/P0 24 小时 · 高危 7 天 · 中危 30 天 · 低危 90 天（按团队容量调整）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
