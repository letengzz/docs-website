<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">基线合规闭环：从标准到门禁</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">基线不是一次性检查表，而是「标准 → 扫描 → 修复 → 复扫 → 门禁」持续运行的流水线</text>
  <rect x="30" y="78" width="110" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="85" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 选定标准</text>
  <text x="85" y="113.2" text-anchor="middle" font-size="7.0" fill="#6D28D9">CIS Benchmark</text>
  <text x="85" y="130.2" text-anchor="middle" font-size="7.0" fill="#6D28D9">对应系统版本</text>
  <line x1="141" y1="111.0" x2="151" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="152" y="78" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="207" y="87.7" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 自动扫描</text>
  <text x="207" y="104.7" text-anchor="middle" font-size="7.0" fill="#1D4ED8">kube-bench</text>
  <text x="207" y="121.7" text-anchor="middle" font-size="7.0" fill="#1D4ED8">Trivy config</text>
  <text x="207" y="138.7" text-anchor="middle" font-size="7.0" fill="#1D4ED8">Kubescape</text>
  <line x1="263" y1="111.0" x2="273" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="274" y="78" width="110" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="329" y="96.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 生成报告</text>
  <text x="329" y="113.2" text-anchor="middle" font-size="7.0" fill="#047857">fail/warn/pass</text>
  <text x="329" y="130.2" text-anchor="middle" font-size="7.0" fill="#047857">映射控制项编号</text>
  <line x1="385" y1="111.0" x2="395" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="396" y="78" width="110" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="451" y="87.7" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">④ 修复加固</text>
  <text x="451" y="104.7" text-anchor="middle" font-size="7.0" fill="#C2410C">sshd/sysctl</text>
  <text x="451" y="121.7" text-anchor="middle" font-size="7.0" fill="#C2410C">RBAC/PSA</text>
  <text x="451" y="138.7" text-anchor="middle" font-size="7.0" fill="#C2410C">策略即代码</text>
  <line x1="507" y1="111.0" x2="517" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="518" y="78" width="110" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="573" y="96.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">⑤ 复扫验证</text>
  <text x="573" y="113.2" text-anchor="middle" font-size="7.0" fill="#0F766E">全部 pass</text>
  <text x="573" y="130.2" text-anchor="middle" font-size="7.0" fill="#0F766E">或记录例外</text>
  <line x1="629" y1="111.0" x2="639" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="78" width="110" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="695" y="96.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑥ 接入门禁</text>
  <text x="695" y="113.2" text-anchor="middle" font-size="7.0" fill="#B91C1C">CI 阻断</text>
  <text x="695" y="130.2" text-anchor="middle" font-size="7.0" fill="#B91C1C">回归即失败</text>
  <text x="380" y="182" text-anchor="middle" font-size="12.5" fill="#1E3A8A" font-weight="bold">常用基线标准与对应检查工具</text>
  <rect x="32" y="196" width="224" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="144" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">基线标准</text>
  <rect x="264" y="196" width="160" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="344" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">作用对象</text>
  <rect x="432" y="196" width="296" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="580" y="212.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">推荐检查工具</text>
  <rect x="32" y="228" width="224" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="144" y="242.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">CIS Ubuntu 24.04 v2.0.0</text>
  <rect x="264" y="228" width="160" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="344" y="242.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">主机操作系统</text>
  <rect x="432" y="228" width="296" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="580" y="242.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">kube-bench 无 · 用 OpenSCAP / Lynis / 自研脚本</text>
  <rect x="32" y="257" width="224" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="144" y="271.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">CIS Kubernetes v1.12.0</text>
  <rect x="264" y="257" width="160" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="344" y="271.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">集群控制面与节点</text>
  <rect x="432" y="257" width="296" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="580" y="271.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">kube-bench · Kubescape</text>
  <rect x="32" y="286" width="224" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="144" y="300.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">CIS Docker v1.8.0</text>
  <rect x="264" y="286" width="160" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="344" y="300.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">Docker 守护进程与容器</text>
  <rect x="432" y="286" width="296" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="580" y="300.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">docker-bench-security</text>
  <rect x="32" y="315" width="224" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="144" y="329.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">CIS RHEL 9 v2.0.0 / WS2022 v4.0.0</text>
  <rect x="264" y="315" width="160" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="344" y="329.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">服务器操作系统</text>
  <rect x="432" y="315" width="296" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="580" y="329.87" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">OpenSCAP · Microsoft Security Baseline</text>
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#1E3A8A">CIS Level 1 = 基础线（几乎不影响功能）；Level 2 = 更严（可能限制功能，需评估）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
