<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">审计与检测：从日志到告警的闭环</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">没被采集的日志等于没有；能被绕过的检测等于没有——先保证「不丢日志」，再谈规则</text>
  <text x="380" y="90" text-anchor="middle" font-size="12.5" fill="#1E3A8A" font-weight="bold">日志源（谁在产生事件）</text>
  <rect x="30" y="102" width="110" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="85" y="119.7" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">主机审计</text>
  <text x="85" y="136.7" text-anchor="middle" font-size="7.0" fill="#1D4ED8">auditd / syslog</text>
  <rect x="152" y="102" width="110" height="48" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="207" y="119.7" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">容器运行时</text>
  <text x="207" y="136.7" text-anchor="middle" font-size="7.0" fill="#0F766E">Docker/K8s 审计</text>
  <rect x="274" y="102" width="110" height="48" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="329" y="119.7" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">K8s API Server</text>
  <text x="329" y="136.7" text-anchor="middle" font-size="7.0" fill="#047857">audit policy</text>
  <rect x="396" y="102" width="110" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="451" y="119.7" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">应用</text>
  <text x="451" y="136.7" text-anchor="middle" font-size="7.0" fill="#C2410C">登录/鉴权日志</text>
  <rect x="518" y="102" width="110" height="48" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="573" y="119.7" text-anchor="middle" font-size="10" fill="#854D0E" font-weight="bold">云平台</text>
  <text x="573" y="136.7" text-anchor="middle" font-size="7.0" fill="#A16207">CloudTrail/ActionTrail</text>
  <rect x="640" y="102" width="110" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="695" y="119.7" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">网络</text>
  <text x="695" y="136.7" text-anchor="middle" font-size="7.0" fill="#6D28D9">VPC Flow/防火墙</text>
  <line x1="380" y1="152" x2="380" y2="178" stroke="#7C3AED" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="200" y="180" width="360" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="205.42" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="bold">采集与归一化：集中存储（不可篡改 + 保留期）</text>
  <line x1="380" y1="228" x2="380" y2="252" stroke="#7C3AED" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="32" y="254" width="336" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="200" y="276.53" text-anchor="middle" font-size="11.5" fill="#991B1B" font-weight="bold">检测层</text>
  <text x="200" y="293.53" text-anchor="middle" font-size="8.0" fill="#B91C1C">SIEM 关联规则 · 运行时检测（Falco/eBPF）</text>
  <text x="200" y="310.53" text-anchor="middle" font-size="8.0" fill="#B91C1C">异常行为基线与阈值</text>
  <rect x="392" y="254" width="336" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="560" y="276.53" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">响应层</text>
  <text x="560" y="293.53" text-anchor="middle" font-size="8.0" fill="#C2410C">分级告警 · 值班与升级 · 自动隔离</text>
  <text x="560" y="310.53" text-anchor="middle" font-size="8.0" fill="#C2410C">取证快照 + 复盘改进</text>
  <text x="380" y="348" text-anchor="middle" font-size="9.5" fill="#991B1B">关键审计事件：提权（sudo/su）、密钥读取、RBAC 变更、Pod exec、异常外联、审计日志被关闭</text>
  <text x="380" y="368" text-anchor="middle" font-size="9.5" fill="#64748B">长期检测优于一次性扫描：攻击往往发生在扫描之间</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
