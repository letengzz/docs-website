<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">软件物料清单（SBOM）与供应链完整性</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「你的软件里到底有什么」是供应链安全的起点——SBOM 是配料表，签名与证明是防伪标签</text>
  <rect x="30" y="78" width="132" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="96" y="96.42" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">源码与依赖</text>
  <text x="96" y="113.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">直接/传递依赖</text>
  <text x="96" y="130.42" text-anchor="middle" font-size="7.0" fill="#1D4ED8">锁定版本</text>
  <line x1="163" y1="111.0" x2="177" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="178" y="78" width="132" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="244" y="96.42" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">生成 SBOM</text>
  <text x="244" y="113.42" text-anchor="middle" font-size="7.0" fill="#047857">Syft / cdxgen</text>
  <text x="244" y="130.42" text-anchor="middle" font-size="7.0" fill="#047857">SPDX / CycloneDX</text>
  <line x1="311" y1="111.0" x2="325" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="326" y="78" width="132" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="392" y="96.42" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">漏洞匹配</text>
  <text x="392" y="113.42" text-anchor="middle" font-size="7.0" fill="#C2410C">Grype 与 SBOM</text>
  <text x="392" y="130.42" text-anchor="middle" font-size="7.0" fill="#C2410C">比对漏洞库</text>
  <line x1="459" y1="111.0" x2="473" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="474" y="78" width="132" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="540" y="96.42" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">构建证明</text>
  <text x="540" y="113.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">SLSA provenance</text>
  <text x="540" y="130.42" text-anchor="middle" font-size="7.0" fill="#6D28D9">可复现构建</text>
  <line x1="607" y1="111.0" x2="621" y2="111.0" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="622" y="78" width="132" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="688" y="96.42" text-anchor="middle" font-size="11" fill="#115E59" font-weight="bold">签名入库</text>
  <text x="688" y="113.42" text-anchor="middle" font-size="7.0" fill="#0F766E">cosign 签名</text>
  <text x="688" y="130.42" text-anchor="middle" font-size="7.0" fill="#0F766E">验签后才部署</text>
  <text x="380" y="182" text-anchor="middle" font-size="12.5" fill="#065F46" font-weight="bold">两种主流 SBOM 格式与 SLSA 等级</text>
  <rect x="32" y="196" width="336" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="231.14" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold"></text>
  <text x="200" y="248.14" text-anchor="middle" font-size="8.0" fill="#047857">SPDX（Linux 基金会）</text>
  <text x="200" y="265.14" text-anchor="middle" font-size="8.0" fill="#047857">ISO/IEC 5962 标准 · 许可合规友好</text>
  <text x="200" y="282.14" text-anchor="middle" font-size="8.0" fill="#047857"></text>
  <text x="200" y="299.14" text-anchor="middle" font-size="8.0" fill="#047857">CycloneDX（OWASP）</text>
  <text x="200" y="316.14" text-anchor="middle" font-size="8.0" fill="#047857">安全导向 · 支持 VEX 漏洞可利用性声明</text>
  <rect x="392" y="196" width="336" height="150" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="560" y="231.14" text-anchor="middle" font-size="12" fill="#5B21B6" font-weight="bold"></text>
  <text x="560" y="248.14" text-anchor="middle" font-size="8.0" fill="#6D28D9">SLSA Level 1</text>
  <text x="560" y="265.14" text-anchor="middle" font-size="8.0" fill="#6D28D9">构建过程有文档、生成 provenance</text>
  <text x="560" y="282.14" text-anchor="middle" font-size="8.0" fill="#6D28D9"></text>
  <text x="560" y="299.14" text-anchor="middle" font-size="8.0" fill="#6D28D9">SLSA Level 2/3</text>
  <text x="560" y="316.14" text-anchor="middle" font-size="8.0" fill="#6D28D9">托管构建、签名、防篡改、隔离构建</text>
  <text x="380" y="364" text-anchor="middle" font-size="9.5" fill="#64748B">VEX（Vulnerability Exploitability eXchange）：声明某个漏洞在本产品中「不可利用」，减少误报</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
