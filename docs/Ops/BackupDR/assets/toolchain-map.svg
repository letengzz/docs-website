<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .cat { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .item { fill: #ffffff; stroke: #a9bcd8; stroke-width: 1.3; rx: 8; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 14px; font-weight: bold; }
    .small { font-size: 11px; fill: #666; }
  </style>

  <text class="t" x="430" y="28">按数据形态分四类，各选各的工具</text>

  <rect class="cat" x="20" y="48" width="195" height="332"/>
  <text class="t" x="117" y="76">关系型数据库</text>
  <rect class="item" x="36" y="92" width="163" height="52"/>
  <text x="117" y="112">逻辑导出</text>
  <text class="small" x="117" y="132">mysqldump / pg_dump</text>
  <rect class="item" x="36" y="154" width="163" height="52"/>
  <text x="117" y="174">物理热备</text>
  <text class="small" x="117" y="194">XtraBackup / pg_basebackup</text>
  <rect class="item" x="36" y="216" width="163" height="52"/>
  <text x="117" y="236">持续归档</text>
  <text class="small" x="117" y="256">binlog / WAL</text>
  <rect class="item" x="36" y="278" width="163" height="52"/>
  <text x="117" y="298">企业级方案</text>
  <text class="small" x="117" y="318">pgBackRest / MySQL Shell</text>
  <text class="small" x="117" y="356">目标：可做 PITR（按时间点恢复）</text>

  <rect class="cat" x="227" y="48" width="195" height="332"/>
  <text class="t" x="324" y="76">缓存 / KV</text>
  <rect class="item" x="243" y="92" width="163" height="52"/>
  <text x="324" y="112">快照持久化</text>
  <text class="small" x="324" y="132">Redis RDB / AOF</text>
  <rect class="item" x="243" y="154" width="163" height="52"/>
  <text x="324" y="174">复制存档</text>
  <text class="small" x="324" y="194">复制 RDB + 追加日志</text>
  <rect class="item" x="243" y="216" width="163" height="52"/>
  <text x="324" y="236">文档型</text>
  <text class="small" x="324" y="256">mongodump / mongorestore</text>
  <rect class="item" x="243" y="278" width="163" height="52"/>
  <text x="324" y="298">集群一致性</text>
  <text class="small" x="324" y="318">oplog / 快照</text>
  <text class="small" x="324" y="356">目标：区分「可重算」与「不可丢」</text>

  <rect class="cat" x="434" y="48" width="195" height="332"/>
  <text class="t" x="531" y="76">文件 / 对象</text>
  <rect class="item" x="450" y="92" width="163" height="52"/>
  <text x="531" y="112">去重加密备份</text>
  <text class="small" x="531" y="132">restic / borg</text>
  <rect class="item" x="450" y="154" width="163" height="52"/>
  <text x="531" y="174">增量同步</text>
  <text class="small" x="531" y="194">rsync / rclone</text>
  <rect class="item" x="450" y="216" width="163" height="52"/>
  <text x="531" y="236">版本化对象存储</text>
  <text class="small" x="531" y="256">S3 版本 + 对象锁</text>
  <rect class="item" x="450" y="278" width="163" height="52"/>
  <text x="531" y="298">包体压缩归档</text>
  <text class="small" x="531" y="318">tar + zstd</text>
  <text class="small" x="531" y="356">目标：满足 3-2-1 的异地质</text>

  <rect class="cat" x="641" y="48" width="195" height="332"/>
  <text class="t" x="738" y="76">集群 / 配置</text>
  <rect class="item" x="657" y="92" width="163" height="52"/>
  <text x="738" y="112">K8s 资源 + 卷</text>
  <text class="small" x="738" y="132">Velero + CSI 快照</text>
  <rect class="item" x="657" y="154" width="163" height="52"/>
  <text x="738" y="174">etcd 快照</text>
  <text class="small" x="738" y="194">etcdctl snapshot</text>
  <rect class="item" x="657" y="216" width="163" height="52"/>
  <text x="738" y="236">基础设施即代码</text>
  <text class="small" x="738" y="256">Terraform state</text>
  <rect class="item" x="657" y="278" width="163" height="52"/>
  <text x="738" y="298">密钥与配置</text>
  <text class="small" x="738" y="318">Secret 加密备份</text>
  <text class="small" x="738" y="356">目标：让「环境本身」也能重建</text>
</svg>
