<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .ev { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .ok { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    .t { font-size: 14px; font-weight: bold; }
    .line { stroke: #4a7bd8; stroke-width: 1.6; }
    .dash { stroke: #d99a3a; stroke-width: 1.4; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="rr-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
    <marker id="rr-arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d99a3a"/>
    </marker>
  </defs>

  <line class="line" x1="60" y1="150" x2="800" y2="150" marker-end="url(#rr-arrow)"/>
  <text class="small" x="800" y="176">时间</text>

  <rect class="ev" x="70" y="104" width="150" height="46"/>
  <text x="145" y="132">最后一次可用备份</text>
  <line class="line" x1="145" y1="150" x2="145" y2="96"/>

  <rect class="ok" x="620" y="104" width="150" height="46"/>
  <text x="695" y="132">业务恢复完成</text>
  <line class="line" x1="695" y1="150" x2="695" y2="96"/>

  <line class="dash" x1="400" y1="150" x2="400" y2="66" marker-end="url(#rr-arrow2)"/>
  <text class="t" x="400" y="56">故障发生</text>

  <line class="dash" x1="145" y1="196" x2="400" y2="196" marker-end="url(#rr-arrow2)"/>
  <line class="dash" x1="145" y1="190" x2="145" y2="204"/>
  <line class="dash" x1="400" y1="190" x2="400" y2="204"/>
  <text x="272" y="220">RPO（恢复点目标）</text>
  <text class="small" x="272" y="238">允许丢多少数据 —— 由「备份/复制频率」决定</text>

  <line class="line" x1="400" y1="262" x2="695" y2="262" marker-end="url(#rr-arrow)"/>
  <line class="line" x1="400" y1="256" x2="400" y2="270"/>
  <line class="line" x1="695" y1="256" x2="695" y2="270"/>
  <text x="547" y="286">RTO（恢复时间目标）</text>
  <text class="small" x="547" y="304">允许停多久 —— 由「发现 + 决策 + 恢复手段」共同决定</text>
</svg>
