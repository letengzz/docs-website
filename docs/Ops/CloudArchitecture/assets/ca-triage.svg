<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:12px;fill:#334155;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11px;fill:#64748B}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.slate{fill:#F1F5F9;stroke:#94A3B8}</style>
<rect width="920" height="560" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">云上问题分诊：先问「影响范围是哪一层」</text>
<text x="460" y="56" text-anchor="middle" class="tag">云上排障最容易犯的错是先看机器，而机器往往不是原因</text>

<rect x="40" y="84" width="840" height="46" rx="10" class="box blue"/>
<text x="460" y="112" text-anchor="middle" class="s">第一问：所有用户都受影响，还是只有一部分？只有一部分 → 先怀疑入口与 DNS，不要先看应用</text>

<rect x="40" y="146" width="200" height="182" rx="10" class="box rose"/>
<text x="140" y="172" text-anchor="middle" class="lt">全部用户不可用</text>
<text x="140" y="196" text-anchor="middle" class="tag">① 入口是否健康</text>
<text x="140" y="216" text-anchor="middle" class="tag">② 后端是否全部不健康</text>
<text x="140" y="236" text-anchor="middle" class="tag">③ 证书是否过期</text>
<text x="140" y="256" text-anchor="middle" class="tag">④ 安全组是否被改动</text>
<text x="140" y="276" text-anchor="middle" class="tag">⑤ 路由表 / NAT 是否断</text>
<text x="140" y="300" text-anchor="middle" class="tag">顺序固定，不要凭感觉跳</text>
<text x="140" y="320" text-anchor="middle" class="tag">前四项覆盖绝大多数「全挂」</text>

<rect x="256" y="146" width="200" height="182" rx="10" class="box amber"/>
<text x="356" y="172" text-anchor="middle" class="lt">部分用户不可用</text>
<text x="356" y="196" text-anchor="middle" class="tag">① DNS 解析是否一致</text>
<text x="356" y="216" text-anchor="middle" class="tag">② 是否有实例被摘除</text>
<text x="356" y="236" text-anchor="middle" class="tag">③ 是否跨可用区不均衡</text>
<text x="356" y="256" text-anchor="middle" class="tag">④ 会话保持是否把用户钉住</text>
<text x="356" y="276" text-anchor="middle" class="tag">⑤ 是否有地区性网络抖动</text>
<text x="356" y="300" text-anchor="middle" class="tag">典型根因：一个区的实例全被摘除</text>
<text x="356" y="320" text-anchor="middle" class="tag">但负载均衡未开跨可用区</text>

<rect x="472" y="146" width="200" height="182" rx="10" class="box green"/>
<text x="572" y="172" text-anchor="middle" class="lt">性能不达标</text>
<text x="572" y="196" text-anchor="middle" class="tag">① 是不是容量到顶（要扩容）</text>
<text x="572" y="216" text-anchor="middle" class="tag">② 是不是跨区流量拖慢</text>
<text x="572" y="236" text-anchor="middle" class="tag">③ 是不是规格族选错</text>
<text x="572" y="256" text-anchor="middle" class="tag">④ 是不是实例被限制（突发积分）</text>
<text x="572" y="276" text-anchor="middle" class="tag">⑤ 是不是磁盘 IOPS 打满</text>
<text x="572" y="300" text-anchor="middle" class="tag">先排除云侧配额与规格，再进应用</text>
<text x="572" y="320" text-anchor="middle" class="tag">否则会把云的问题当成代码的问题</text>

<rect x="688" y="146" width="192" height="182" rx="10" class="box slate"/>
<text x="784" y="172" text-anchor="middle" class="lt">成本异常</text>
<text x="784" y="196" text-anchor="middle" class="tag">① 是否有新资源被创建</text>
<text x="784" y="216" text-anchor="middle" class="tag">② 缩容是否真的生效</text>
<text x="784" y="236" text-anchor="middle" class="tag">③ 是否有孤儿资源</text>
<text x="784" y="256" text-anchor="middle" class="tag">④ 跨区流量是否突增</text>
<text x="784" y="276" text-anchor="middle" class="tag">⑤ 快照是否在无限增长</text>
<text x="784" y="300" text-anchor="middle" class="tag">先看「谁在花钱」再看「怎么省」</text>
<text x="784" y="320" text-anchor="middle" class="tag">顺序反了会省掉该花的钱</text>

<rect x="40" y="344" width="840" height="94" rx="10" class="box slate"/>
<text x="460" y="370" text-anchor="middle" class="lt">三条排查纪律</text>
<text x="90" y="392" text-anchor="start" class="tag">① 先看「影响范围」再看「单机指标」——云上单机指标通常只解释它自己</text>
<text x="90" y="412" text-anchor="start" class="tag">② 一次只改一个变量：同时改安全组与路由表，会让「哪一步修好的」永久丢失</text>
<text x="90" y="432" text-anchor="start" class="tag">③ 先确认是不是云侧配额或规格问题——把云的问题当成代码问题，会白改一遍应用</text>

<rect x="40" y="454" width="840" height="86" rx="10" class="box blue"/>
<text x="460" y="482" text-anchor="middle" class="s">恢复后必做的一件事：把这次故障的「判据」补进监控</text>
<text x="460" y="506" text-anchor="middle" class="tag">本次是「怎么发现的」→ 如果不是监控发现的，先补这条监控，再谈其他任何动作</text>
<text x="460" y="528" text-anchor="middle" class="tag">云上问题往往有「先兆指标」（如健康检查失败率），它们比结果指标更早、也更便宜</text>
</svg>
