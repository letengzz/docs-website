<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:13px;fill:#334155;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11px;fill:#64748B}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.slate{fill:#F1F5F9;stroke:#94A3B8}.arrow{stroke:#64748B;fill:none;stroke-width:2;marker-end:url(#cv)}.fd{fill:none;stroke:#8B5CF6;stroke-width:1.5;stroke-dasharray:6 5}.fdr{fill:none;stroke:#F43F5E;stroke-width:1.5;stroke-dasharray:6 5}</style>
<defs><marker id="cv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs>
<rect width="920" height="600" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">VPC 布局：一次定死、后面很难改的三件事</text>
<text x="460" y="56" text-anchor="middle" class="tag">网段划分 · 公有/私有子网的分工 · 私网出网路径（这三项创建后基本不可修改）</text>

<rect x="350" y="78" width="220" height="48" rx="10" class="box blue"/>
<text x="460" y="98" text-anchor="middle" class="lt">互联网网关（IGW）</text>
<text x="460" y="116" text-anchor="middle" class="tag">只挂在公有子网的路由表上</text>

<rect x="40" y="150" width="840" height="316" rx="12" class="fdr"/>
<text x="56" y="174" class="lt">VPC  10.0.0.0/16（地址空间：先大后小，改小容易、改大要重建）</text>

<rect x="66" y="188" width="388" height="256" rx="10" class="fd"/>
<text x="260" y="210" text-anchor="middle" class="lt">可用区 A</text>
<rect x="82" y="224" width="356" height="88" rx="8" class="box green"/>
<text x="260" y="248" text-anchor="middle" class="s">公有子网 10.0.1.0/24</text>
<text x="260" y="270" text-anchor="middle" class="tag">只放这些：负载均衡、NAT 网关、跳板入口</text>
<text x="260" y="292" text-anchor="middle" class="tag">应用实例一律不放在这里</text>
<rect x="82" y="326" width="356" height="100" rx="8" class="box amber"/>
<text x="260" y="350" text-anchor="middle" class="s">私有子网 10.0.11.0/24</text>
<text x="260" y="372" text-anchor="middle" class="tag">应用与数据：无公网 IP，出网走 NAT</text>
<text x="260" y="394" text-anchor="middle" class="tag">入站只允许来自负载均衡的安全组</text>
<text x="260" y="416" text-anchor="middle" class="tag">判据：curl 公网 IP 必须超时，而不是 403</text>

<rect x="466" y="188" width="388" height="256" rx="10" class="fd"/>
<text x="660" y="210" text-anchor="middle" class="lt">可用区 B（结构完全对称，仅网段不同）</text>
<rect x="482" y="224" width="356" height="88" rx="8" class="box green"/>
<text x="660" y="248" text-anchor="middle" class="s">公有子网 10.0.2.0/24</text>
<text x="660" y="270" text-anchor="middle" class="tag">第二个 NAT 网关放这里</text>
<text x="660" y="292" text-anchor="middle" class="tag">单 NAT 是隐性单点：它挂了整区无出网</text>
<rect x="482" y="326" width="356" height="100" rx="8" class="box amber"/>
<text x="660" y="350" text-anchor="middle" class="s">私有子网 10.0.12.0/24</text>
<text x="660" y="372" text-anchor="middle" class="tag">与 A 区实例同规格，由负载均衡分摊</text>
<text x="660" y="394" text-anchor="middle" class="tag">跨 AZ 流量按出向计费：这是架构决定的固定成本</text>
<text x="660" y="416" text-anchor="middle" class="tag">能同区完成的事，不要跨区做</text>

<line class="arrow" x1="420" y1="126" x2="260" y2="220"/>
<line class="arrow" x1="500" y1="126" x2="660" y2="220"/>

<rect x="40" y="486" width="406" height="94" rx="10" class="box slate"/>
<text x="243" y="512" text-anchor="middle" class="lt">安全组 与 网络 ACL 的分工</text>
<text x="243" y="536" text-anchor="middle" class="tag">安全组：作用于实例，有状态，只写允许，默认拒绝</text>
<text x="243" y="558" text-anchor="middle" class="tag">ACL：作用于子网，无状态，需双向写规则 —— 只在少数场景用</text>

<rect x="474" y="486" width="406" height="94" rx="10" class="box slate"/>
<text x="677" y="512" text-anchor="middle" class="lt">私网出网的三个出口</text>
<text x="677" y="536" text-anchor="middle" class="tag">NAT 网关（托管、按小时+流量计费）· 网关型私网端点（多数云产品免费且更快）</text>
<text x="677" y="558" text-anchor="middle" class="tag">代理（自建）——先问「这个目标有没有私网端点」，再决定要不要走 NAT</text>
</svg>
