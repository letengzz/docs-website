  <text x="48" y="324" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">不回答什么</text>
  <text x="48" y="348" font-family="system-ui, sans-serif" font-size="8" fill="#334155">不教 Prometheus 查询语法 → 监控告</text>
  <text x="48" y="361" font-family="system-ui, sans-serif" font-size="8" fill="#334155">警</text>
  <text x="48" y="374" font-family="system-ui, sans-serif" font-size="8" fill="#334155">不教日志采集器部署 → 日志体系</text>
  <text x="48" y="387" font-family="system-ui, sans-serif" font-size="8" fill="#334155">不教压测与容量 → 性能与容量工程</text>
  <rect x="32" y="414" width="200" height="122" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="438" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">本专题的判据纪律</text>
  <text x="48" y="462" font-family="system-ui, sans-serif" font-size="9" fill="#334155">每条设计决定都要能回答：</text>
  <text x="48" y="474" font-family="system-ui, sans-serif" font-size="9" fill="#334155">约定是什么、</text>
  <text x="48" y="486" font-family="system-ui, sans-serif" font-size="9" fill="#334155">定错会怎样、</text>
  <text x="48" y="498" font-family="system-ui, sans-serif" font-size="9" fill="#334155">怎么验证它没被破坏。</text>
  <text x="48" y="510" font-family="system-ui, sans-serif" font-size="9" fill="#334155">判据族前缀 OBV / OBM / OBC / OB</text>
  <text x="48" y="522" font-family="system-ui, sans-serif" font-size="9" fill="#334155">S / OBP / OBD / OBK / OBR / OBQ</text>
