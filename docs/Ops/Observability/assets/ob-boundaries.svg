<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="ob-boundaries.svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">四条边界：上观测平台之前必须回答的四个问题</text>
  <rect x="32" y="92" width="200" height="176" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">边界一 · 有监控 ≠ 有可观测</text>
  <text x="48" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#334155">监控回答的是「已知的未知」：</text>
  <text x="48" y="155" font-family="system-ui, sans-serif" font-size="10" fill="#334155">你先把问题想出来，再写规则。</text>
  <text x="48" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#334155">可观测性回答「未知的未知」：</text>
  <text x="48" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#334155">给足上下文，现场提问。</text>
  <text x="48" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：换一个没参与开发的人，</text>
  <text x="48" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#334155">他能不能自己回答「这次慢在哪</text>
  <text x="48" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#334155">」。</text>
  <rect x="248" y="92" width="200" height="176" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="264" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">边界二 · 三支柱 ≠ 三份数据</text>
  <text x="264" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#334155">指标、日志、链路分三个库存</text>
  <text x="264" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#334155">，</text>
  <text x="264" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#334155">然后靠人肉在三个界面之间</text>
  <text x="264" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#334155">对时间、拼接口，等于没有。</text>
  <text x="264" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：一个数字能不能一路点</text>
  <text x="264" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#334155">到</text>
  <text x="264" y="236" font-family="system-ui, sans-serif" font-size="11" fill="#334155">具体那一条请求。</text>
  <text x="264" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#334155">关联才是价值来源。</text>
  <rect x="464" y="92" width="200" height="176" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">边界三 · 采得多 ≠ 看得见</text>
  <text x="480" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#334155">采样决定了你能看到什么，</text>
  <text x="480" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#334155">也决定了你不能宣称什么。</text>
  <text x="480" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：看板上的错误率，</text>
  <text x="480" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#334155">分母是全量还是采样后的。</text>
  <text x="480" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#334155">采样后不做加权，</text>
  <text x="480" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#334155">错误率会被系统性放大。</text>
  <rect x="680" y="92" width="188" height="176" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="696" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">边界四 · 能力与账单同源</text>
  <text x="696" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#334155">数据量涨，能力涨，</text>
  <text x="696" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#334155">账单也涨，而且是线性的。</text>
  <text x="696" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：这套管道每多一个</text>
  <text x="696" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#334155">服务、每多一个标签，</text>
  <text x="696" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#334155">成本增加多少，</text>
  <text x="696" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#334155">有没有人算过。</text>
  <rect x="32" y="296" width="836" height="112" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">在这四条边界上最常被跳过的一句反问</text>
  <text x="48" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「这条数据留下来，是为了回答哪个问题？」——答不上来的字段、日志行、标签，都是纯成本。</text>
  <text x="48" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「这个问题答错了，我会在什么时候发现？」——答不上来，说明这条判据没有被验证过，只是还没被推</text>
  <text x="48" y="376" font-family="system-ui, sans-serif" font-size="11" fill="#334155">翻。</text>
  <text x="48" y="392" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「如果明天换掉整个后端，我需要改多少东西？」——这是判断「有没有被绑定」的唯一可操作方式。</text>
  <rect x="32" y="424" width="836" height="68" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#334155">四条边界都不需要上线才知道答案：它们可以在设计评审里问、在采集配置评审里查、在账单出来之</text>
  <text x="48" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#334155">前算。</text>
</svg>
