<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="ob-faq-triage.svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="650" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">排障分诊：先问「哪一层没有数据」，再问「为什么」</text>
  <rect x="32" y="92" width="836" height="86" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="48" y="118" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">第一步</text>
  <text x="120" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">数据完全没到后端</text>
  <text x="48" y="144" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">先看 Collector 的接收计数：receivers 侧为 0 → 应用侧没发或端口不通；receivers 有数而 exporters 为 0 → 管道配置或采样规则把它全丢</text>
  <text x="48" y="161" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">了。</text>
  <rect x="32" y="186" width="836" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">第二步</text>
  <text x="120" y="212" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">数据到了，但查不到可疑的请求</text>
  <text x="48" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">先确认采样规则：错误链路是否被「错误全留」策略覆盖；再看无界属性是否让查询条件失效（属性被删或改名）。</text>
  <rect x="32" y="280" width="836" height="86" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="48" y="306" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">第三步</text>
  <text x="120" y="306" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">链路查到了，但断成两截</text>
  <text x="48" y="332" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">按传播边界逐个排除：异步线程池、消息队列、自研 HTTP 头、跨语言调用。断点位置本身就是结论。</text>
  <rect x="32" y="374" width="836" height="86" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="48" y="400" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">第四步</text>
  <text x="120" y="400" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">链路完整，但看不出为什么慢</text>
  <text x="48" y="426" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">看 span 内部：缺少细粒度子 span（数据库语句、外部调用）时，只能加手动埋点；若已到 span 粒度极限，转持续剖析看函数级热点。</text>
  <rect x="32" y="468" width="836" height="86" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="494" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3" text-anchor="start">第五步</text>
  <text x="120" y="494" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">四类数据都有，但互相对不上</text>
  <text x="48" y="520" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">检查三件套：资源属性口径、时钟同步、trace_id 是否写进了日志的结构化字段（而不是只写在文本里）。</text>
  <rect x="32" y="570" width="836" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="594" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：每一步都能给出一个「数字或状态」作为结论，给不出的那一步就是当前真正卡住的地方。</text>
</svg>
