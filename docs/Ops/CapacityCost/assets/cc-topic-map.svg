<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="容量与成本治理专题地图：三个入口、九页分工、一个出口">
  <title>容量与成本治理 · 专题地图</title>
  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="26" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">三个入口进来，同一本账出去</text>
  <rect x="20" y="44" width="200" height="470" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="28" y="60" font-size="11" fill="#475569" font-weight="600" text-anchor="start">入口：你被问的是哪一句</text>
  <rect x="30" y="70" width="180" height="74" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="120.0" y="92" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">「这个月怎么涨了」</text>
  <text x="120.0" y="109" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">账单异常</text>
  <text x="120.0" y="124" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">要归因到人</text>
  <rect x="30" y="170" width="180" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="120.0" y="192" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">「还能扛多少」</text>
  <text x="120.0" y="209" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">容量与水位</text>
  <text x="120.0" y="224" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">要签字</text>
  <rect x="30" y="270" width="180" height="74" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="120.0" y="292" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">「能省多少」</text>
  <text x="120.0" y="309" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">降本指标</text>
  <text x="120.0" y="324" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">不许返工</text>
  <rect x="30" y="370" width="180" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="120.0" y="392" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">「明年预算」</text>
  <text x="120.0" y="409" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">承诺与预测</text>
  <rect x="240" y="44" width="620" height="470" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="248" y="60" font-size="11" fill="#475569" font-weight="600" text-anchor="start">九页分工：每一页只回答一个问题</text>
  <rect x="256" y="70" width="180" height="66" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="346.0" y="92" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">总览：三本账</text>
  <text x="346.0" y="109" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCO · 四个决策点</text>
  <rect x="452" y="70" width="180" height="66" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="542.0" y="92" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">容量台账与预测</text>
  <text x="542.0" y="109" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCF · 复核与门禁</text>
  <rect x="648" y="70" width="190" height="66" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="743.0" y="92" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">单位成本</text>
  <text x="743.0" y="109" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCU · 分母口径</text>
  <rect x="256" y="166" width="180" height="66" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="346.0" y="188" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">归集与分摊</text>
  <text x="346.0" y="205" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCA · 分摊到人</text>
  <rect x="452" y="166" width="180" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="542.0" y="188" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">预算与告警</text>
  <text x="542.0" y="205" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCB · 三类信号</text>
  <rect x="648" y="166" width="190" height="66" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="743.0" y="188" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">闲置治理</text>
  <text x="743.0" y="205" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCW · 回收与安全阀</text>
  <rect x="256" y="262" width="180" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="346.0" y="284" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">承诺折扣</text>
  <text x="346.0" y="301" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCK · 覆盖与利用</text>
  <rect x="452" y="262" width="180" height="66" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="542.0" y="284" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">实战：季度循环</text>
  <text x="542.0" y="301" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCP · 算例与报表</text>
  <rect x="648" y="262" width="190" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="743.0" y="284" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">常见问题</text>
  <text x="743.0" y="301" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">CCQ · 分诊与自查</text>
  <rect x="256" y="356" width="582" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="547.0" y="378" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">出口：一句能被机器判定的结论</text>
  <text x="547.0" y="395" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">「这个 namespace 上个月 4,180 元，其中 37% 是 idle，责任人张三，已进预算」</text>
  <text x="547.0" y="410" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">而不是「云账单有点贵」</text>
  <line x1="210" y1="107" x2="254" y2="103" stroke="#be123c" stroke-width="1.4" marker-end="url(#ar-rose)"/>
  <line x1="210" y1="207" x2="254" y2="199" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ar-blue)"/>
  <line x1="210" y1="307" x2="450" y2="296" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ar-teal)"/>
  <line x1="210" y1="400" x2="450" y2="372" stroke="#b45309" stroke-width="1.4" marker-end="url(#ar-amber)"/>
  <text x="450" y="470" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">九页之间不是阅读顺序，是「问题 → 归因 → 决策 → 门禁」的四段</text>
  <text x="450" y="492" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">同一批数字在四段里各被用一次；缺任何一段，结论都不可签字</text>
</svg>
