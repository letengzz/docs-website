<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="成本治理的季度循环：每月归集、找浪费、看趋势，每季度做承诺评审">
  <title>季度治理循环：月度三步、季度一步</title>
  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#f8fafc"/>
  <text x="450" y="26" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">治理的节奏比工具重要：每月三步，每季一步</text>
  <rect x="40" y="60" width="190" height="84" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="135.0" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">每月第 1 步</text>
  <text x="135.0" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">归集：账单 vs 分摊</text>
  <text x="135.0" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">误差 ( 1%</text>
  <rect x="260" y="60" width="190" height="84" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="355.0" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">每月第 2 步</text>
  <text x="355.0" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">找浪费：五类清单</text>
  <text x="355.0" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">本月回收额</text>
  <rect x="480" y="60" width="190" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="575.0" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">每月第 3 步</text>
  <text x="575.0" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">看趋势：单位成本</text>
  <text x="575.0" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">与预算偏差</text>
  <rect x="700" y="60" width="170" height="84" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="785.0" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">每季 1 步</text>
  <text x="785.0" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">承诺评审</text>
  <text x="785.0" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">买 / 不买 / 等到期</text>
  <line x1="232" y1="102" x2="258" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="452" y1="102" x2="478" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="672" y1="102" x2="698" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <rect x="40" y="186" width="830" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="455.0" y="208" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">每一步的产出必须是一份「能交给别人复核」的东西</text>
  <text x="455.0" y="225" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">归集 → 分摊报表 + 三条 SQL 读数    找浪费 → 回收清单（对象、金额、责任人、宽限期）</text>
  <text x="455.0" y="240" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">看趋势 → 单位成本曲线 + 预算偏差说明    承诺评审 → 覆盖率/利用率 + 本次决策与到期日</text>
  <line x1="785" y1="146" x2="785" y2="182" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ar-teal)"/>
  <text x="785.0" y="158.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">季度汇总</text>
  <rect x="40" y="292" width="830" height="108" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="60" y="318" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">反模式（这四件事做了等于没做）</text>
  <text x="60" y="342" font-size="11" fill="#475569" font-weight="400" text-anchor="start">① 只在月末看总账 —— 归因窗口已过，只能写说明</text>
  <text x="60" y="362" font-size="11" fill="#475569" font-weight="400" text-anchor="start">② 只做一次性专项 —— 省下的钱会在两个季度内被新需求吃掉</text>
  <text x="60" y="382" font-size="11" fill="#475569" font-weight="400" text-anchor="start">③ 只压单价不压用量 —— 单价降 20%、用量涨 50%，账单还是涨</text>
  <text x="450" y="424" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">本页不含「复盘」环节：循环的收口是下一轮的输入（预测与承诺），不是总结会</text>
</svg>
