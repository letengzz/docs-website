<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="预算线、预测线与异常尖峰在同一张时间轴上的三种形态">
  <title>预算、预测、异常：三类信号的区别</title>
  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450" y="26" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">三条线管三件事：预算管「允不允许」，预测管「来不来得及」，异常管「是不是现在」</text>
  <line x1="80" y1="380" x2="860" y2="380" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="80" y1="70" x2="80" y2="380" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="70" y="380" font-size="10" fill="#475569" font-weight="400" text-anchor="end">0</text>
  <text x="70" y="76" font-size="10" fill="#475569" font-weight="400" text-anchor="end">金额</text>
  <text x="860" y="398" font-size="10" fill="#475569" font-weight="400" text-anchor="end">时间（月内）</text>
  <line x1="80" y1="150" x2="860" y2="150" stroke="#be123c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="850" y="142" font-size="11" fill="#be123c" font-weight="600" text-anchor="end">预算 100,000</text>
  <polyline points="80,360 200,330 320,305 400,296 440,250 470,292 600,240 720,205 860,170" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <polyline points="720,205 790,172 860,132" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="700" y="200" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="end">实际</text>
  <text x="800" y="152" font-size="11" fill="#b45309" font-weight="600" text-anchor="middle">预测</text>
  <text x="452" y="238" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="middle">异常尖峰</text>
  <circle cx="440" cy="250" r="4" fill="#be123c"/>
  <text x="440" y="236" font-size="10" fill="#be123c" font-weight="600" text-anchor="middle">3 倍日均</text>
  <rect x="96" y="406" width="240" height="50" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
  <text x="216.0" y="428" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">预算：静态阈值</text>
  <text x="216.0" y="445" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">越线才响，早不了</text>
  <rect x="352" y="406" width="240" height="50" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="472.0" y="428" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">预测：趋势外推</text>
  <text x="472.0" y="445" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">提前 7~14 天，可能错</text>
  <rect x="608" y="406" width="200" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="708.0" y="428" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">异常：突变检测</text>
  <text x="708.0" y="445" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">分钟级，最吵</text>
  <text x="450" y="60" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">三类信号必须分开发、分开路由；合成一条告警的结果是三类都不被信任</text>
</svg>
