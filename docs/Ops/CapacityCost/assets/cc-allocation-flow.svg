<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="成本归集与分摊四道关口：标签归集、未分摊池、分摊规则、showback 报表">
  <title>从账单到分摊：四道关口</title>
  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#f8fafc"/>
  <text x="450" y="26" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">分摊做没做对，只看一条：Σ 分摊 = 账单</text>
  <rect x="30" y="62" width="170" height="78" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="115.0" y="84" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">账单总额</text>
  <text x="115.0" y="101" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">100,000 元</text>
  <text x="115.0" y="116" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">供应商计量</text>
  <rect x="240" y="62" width="170" height="78" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="325.0" y="84" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">标签归集</text>
  <text x="325.0" y="101" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">能挂上标签的部分</text>
  <text x="325.0" y="116" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">72,000 元</text>
  <rect x="450" y="62" width="180" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="540.0" y="84" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">未分摊池</text>
  <text x="540.0" y="101" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">无标签 / 共享资源</text>
  <text x="540.0" y="116" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">28,000 元</text>
  <rect x="670" y="62" width="200" height="78" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="770.0" y="84" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">分摊规则</text>
  <text x="770.0" y="101" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">idle + shared 三段式</text>
  <text x="770.0" y="116" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">按 request 与用量</text>
  <line x1="202" y1="101" x2="238" y2="101" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="412" y1="101" x2="448" y2="101" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="632" y1="101" x2="668" y2="101" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <rect x="240" y="200" width="630" height="76" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="555.0" y="222" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">showback 报表（每行必须能追回一条账单行）</text>
  <text x="555.0" y="239" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">namespace / 团队 / 环境 / 金额 / 直接成本 / idle 分摊 / 共享分摊 / 合计</text>
  <text x="555.0" y="254" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">误差 ) 1% 就不是舍入问题，是漏了一类资源</text>
  <line x1="770" y1="142" x2="770" y2="196" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#ar-violet)"/>
  <rect x="30" y="200" width="180" height="76" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="120" y="226" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">三个必答问题</text>
  <text x="120" y="246" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">谁的东西</text>
  <text x="120" y="262" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">算给谁</text>
  <rect x="30" y="310" width="840" height="84" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="450.0" y="332" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">验收口径：三条 SQL 就够</text>
  <text x="450.0" y="349" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">① 分摊合计 vs 账单合计（差 ( 1%）  ② 未分摊金额占比（目标 ( 5%）</text>
  <text x="450.0" y="364" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">③ 随机抽 3 个 namespace，手工按 spec 复算一次，与报表逐分对齐</text>
  <text x="450" y="416" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">分摊不是会计问题，是「谁有权改」的问题：分不到的账，没人会去省</text>
</svg>
