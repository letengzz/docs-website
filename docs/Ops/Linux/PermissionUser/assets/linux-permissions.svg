<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3a5f">Linux 文件权限模型</text>
  <rect x="30" y="55" width="700" height="40" fill="#eceff1" stroke="#546e7a" stroke-width="1"/>
  <text x="110" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">类型</text>
  <text x="290" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">属主 user</text>
  <text x="470" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">属组 group</text>
  <text x="650" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">其他 other</text>
  <rect x="30" y="95" width="700" height="44" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="110" y="122" text-anchor="middle" font-size="14" fill="#0d47a1">r w x</text>
  <text x="290" y="122" text-anchor="middle" font-size="14" fill="#0d47a1">4 2 1</text>
  <text x="470" y="122" text-anchor="middle" font-size="14" fill="#0d47a1">4 2 1</text>
  <text x="650" y="122" text-anchor="middle" font-size="14" fill="#0d47a1">4 2 1</text>
  <rect x="30" y="139" width="700" height="44" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1"/>
  <text x="110" y="166" text-anchor="middle" font-size="14" fill="#1b5e20">示例</text>
  <text x="290" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">rwx = 7</text>
  <text x="470" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">r-x = 5</text>
  <text x="650" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">r-- = 4</text>
  <rect x="30" y="205" width="700" height="100" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="380" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">chmod 754 app.sh</text>
  <text x="380" y="262" text-anchor="middle" font-size="14" fill="#5d4037">属主 rwx（7） · 属组 r-x（5） · 其他 r--（4）</text>
  <text x="380" y="288" text-anchor="middle" font-size="13" fill="#795548">读=4 写=2 执行=1，三个数字分别对应 属主 / 属组 / 其他</text>
  <rect x="30" y="320" width="700" height="28" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="1"/>
  <text x="380" y="339" text-anchor="middle" font-size="13" fill="#1f3a5f">目录的 x 表示可进入，w 表示可在其中创建/删除文件</text>
</svg>
