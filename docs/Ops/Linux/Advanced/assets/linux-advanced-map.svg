<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Linux 进阶知识地图</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="70" width="240" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="96" fill="#4338ca" font-weight="bold" font-size="14">① 自动化能力</text>
    <text x="160" y="116" fill="#4b5563" font-size="11">Shell 脚本编程</text>
    <text x="160" y="133" fill="#4b5563" font-size="11">文本处理进阶</text>
    <text x="160" y="150" fill="#4b5563" font-size="11">任务编排</text>
    <rect x="320" y="70" width="240" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="96" fill="#047857" font-weight="bold" font-size="14">② 服务与调度</text>
    <text x="440" y="116" fill="#4b5563" font-size="11">systemd unit 深入</text>
    <text x="440" y="133" fill="#4b5563" font-size="11">cron 与 systemd timer</text>
    <text x="440" y="150" fill="#4b5563" font-size="11">日志 journald</text>
    <rect x="600" y="70" width="240" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="720" y="96" fill="#b45309" font-weight="bold" font-size="14">③ 性能与容量</text>
    <text x="720" y="116" fill="#4b5563" font-size="11">CPU/内存/IO/网络</text>
    <text x="720" y="133" fill="#4b5563" font-size="11">sysctl 与 ulimit</text>
    <text x="720" y="150" fill="#4b5563" font-size="11">压测与容量规划</text>
    <rect x="40" y="250" width="240" height="120" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="276" fill="#be123c" font-weight="bold" font-size="14">④ 安全加固</text>
    <text x="160" y="296" fill="#4b5563" font-size="11">SSH 与防火墙</text>
    <text x="160" y="313" fill="#4b5563" font-size="11">SELinux/AppArmor</text>
    <text x="160" y="330" fill="#4b5563" font-size="11">基线巡检与审计</text>
    <rect x="320" y="250" width="240" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="440" y="276" fill="#6d28d9" font-weight="bold" font-size="14">⑤ 故障排查</text>
    <text x="440" y="296" fill="#4b5563" font-size="11">五层定位法</text>
    <text x="440" y="313" fill="#4b5563" font-size="11">常用工具链</text>
    <text x="440" y="330" fill="#4b5563" font-size="11">现场保留与复盘</text>
    <rect x="600" y="250" width="240" height="120" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="720" y="276" fill="#0f766e" font-weight="bold" font-size="14">⑥ 生产交付</text>
    <text x="720" y="296" fill="#4b5563" font-size="11">裸机到可用服务器</text>
    <text x="720" y="313" fill="#4b5563" font-size="11">容器宿主机要求</text>
    <text x="720" y="330" fill="#4b5563" font-size="11">交付检查清单</text>
</g>
  <text x="440" y="408" text-anchor="middle" font-size="13" fill="#475569">进阶 = 从「会用命令」到「能独立负责一台生产服务器」：自动化、服务、性能、安全、排障、交付六条主线</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
