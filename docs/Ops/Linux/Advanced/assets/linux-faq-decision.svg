<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">常见问题定位决策树</text>
  <g font-size="13" text-anchor="middle">
    <rect x="340" y="66" width="220" height="60" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="92" fill="#4338ca" font-weight="bold" font-size="14">服务起不来？</text>
    <text x="450" y="112" fill="#4b5563" font-size="11">先看 systemctl status 与 journalctl</text>
    <rect x="60" y="170" width="220" height="96" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="170" y="196" fill="#be123c" font-weight="bold" font-size="14">权限/端口类</text>
    <text x="170" y="216" fill="#4b5563" font-size="11">Permission denied → 属主与 SELinux</text>
    <text x="170" y="233" fill="#4b5563" font-size="11">Address already in use → ss -lntp</text>
    <rect x="340" y="170" width="220" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="196" fill="#b45309" font-weight="bold" font-size="14">资源类</text>
    <text x="450" y="216" fill="#4b5563" font-size="11">Cannot allocate memory → ulimit/OOM</text>
    <text x="450" y="233" fill="#4b5563" font-size="11">Too many open files → nofile 调大</text>
    <rect x="620" y="170" width="220" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="730" y="196" fill="#1d4ed8" font-weight="bold" font-size="14">配置类</text>
    <text x="730" y="216" fill="#4b5563" font-size="11">Exec format error → 架构/解释器</text>
    <text x="730" y="233" fill="#4b5563" font-size="11">env: not found → PATH 与 systemd 环境</text>
    <rect x="180" y="306" width="240" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="332" fill="#047857" font-weight="bold" font-size="14">磁盘类</text>
    <text x="300" y="352" fill="#4b5563" font-size="11">No space left → df -h / du -x 定位</text>
    <text x="300" y="369" fill="#4b5563" font-size="11">inode 用满 → df -i</text>
    <rect x="480" y="306" width="240" height="80" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="332" fill="#6d28d9" font-weight="bold" font-size="14">网络类</text>
    <text x="600" y="352" fill="#4b5563" font-size="11">Connection refused vs timeout 的区别</text>
    <text x="600" y="369" fill="#4b5563" font-size="11">DNS 解析失败 → resolvectl status</text>
    <path d="M 400 126 L 200 164" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 450 126 L 450 164" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 500 126 L 700 164" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 250 266 L 280 300" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 650 266 L 620 300" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="450" y="402" text-anchor="middle" font-size="13" fill="#475569">排查口诀：先看是否「活着」（状态/端口），再看是否「有资源」（内存/句柄/磁盘），最后才怀疑代码</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
