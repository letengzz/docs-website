<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">systemd 单元依赖与启动顺序</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="180" width="150" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="105" y="206" fill="#334155" font-weight="bold" font-size="14">sysinit.target</text>
    <text x="105" y="226" fill="#4b5563" font-size="11">基础设备就绪</text>
    <rect x="210" y="180" width="150" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="285" y="206" fill="#1d4ed8" font-weight="bold" font-size="14">basic.target</text>
    <text x="285" y="226" fill="#4b5563" font-size="11">基础服务可用</text>
    <rect x="390" y="90" width="170" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="475" y="116" fill="#047857" font-weight="bold" font-size="14">multi-user.target</text>
    <text x="475" y="136" fill="#4b5563" font-size="11">多用户命令行</text>
    <rect x="390" y="270" width="170" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="475" y="296" fill="#b45309" font-weight="bold" font-size="14">graphical.target</text>
    <text x="475" y="316" fill="#4b5563" font-size="11">图形界面</text>
    <rect x="600" y="60" width="240" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="720" y="86" fill="#4338ca" font-weight="bold" font-size="14">network-online.target</text>
    <text x="720" y="106" fill="#4b5563" font-size="11">网络真正可用后才启动依赖方</text>
    <rect x="600" y="190" width="240" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="720" y="216" fill="#6d28d9" font-weight="bold" font-size="14">After / Before</text>
    <text x="720" y="236" fill="#4b5563" font-size="11">只决定顺序，不代表依赖</text>
    <rect x="600" y="320" width="240" height="80" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="720" y="346" fill="#be123c" font-weight="bold" font-size="14">Requires / Wants</text>
    <text x="720" y="366" fill="#4b5563" font-size="11">正向依赖与弱依赖</text>
    <path d="M 180 220 L 204 220" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 360 210 L 384 140" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 360 230 C 372 230 378 300 384 306" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 475 90 L 475 60" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M 560 60 L 600 60" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M 720 170 L 720 186" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 720 290 L 720 314" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="440" y="408" text-anchor="middle" font-size="13" fill="#475569">常见坑：把 After=network.target 当成「有网」——需要真正等网络就绪请用 network-online.target</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
