<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Shell 脚本的结构与执行流程</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="70" width="180" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="130" y="96" fill="#334155" font-weight="bold" font-size="14">① 解释器与选项</text>
    <text x="130" y="116" fill="#4b5563" font-size="11">#!/usr/bin/env bash</text>
    <text x="130" y="133" fill="#4b5563" font-size="11">set -euo pipefail</text>
    <rect x="250" y="70" width="180" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="340" y="96" fill="#1d4ed8" font-weight="bold" font-size="14">② 变量与参数</text>
    <text x="340" y="116" fill="#4b5563" font-size="11">name=value</text>
    <text x="340" y="133" fill="#4b5563" font-size="11">$1 $@ $#</text>
    <rect x="460" y="70" width="180" height="90" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="550" y="96" fill="#0f766e" font-weight="bold" font-size="14">③ 流程控制</text>
    <text x="550" y="116" fill="#4b5563" font-size="11">if / case / for</text>
    <text x="550" y="133" fill="#4b5563" font-size="11">while / until</text>
    <rect x="670" y="70" width="170" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="755" y="96" fill="#047857" font-weight="bold" font-size="14">④ 函数与模块</text>
    <text x="755" y="116" fill="#4b5563" font-size="11">func() { ... }</text>
    <text x="755" y="133" fill="#4b5563" font-size="11">source 复用</text>
    <rect x="40" y="210" width="180" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="236" fill="#b45309" font-weight="bold" font-size="14">⑤ 错误处理</text>
    <text x="130" y="256" fill="#4b5563" font-size="11">trap ERR/EXIT</text>
    <text x="130" y="273" fill="#4b5563" font-size="11">$? 与 || exit</text>
    <text x="130" y="290" fill="#4b5563" font-size="11">临时文件清理</text>
    <rect x="250" y="210" width="180" height="100" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="340" y="236" fill="#6d28d9" font-weight="bold" font-size="14">⑥ 输入输出</text>
    <text x="340" y="256" fill="#4b5563" font-size="11">重定向 2&gt;&amp;1</text>
    <text x="340" y="273" fill="#4b5563" font-size="11">管道与 xargs</text>
    <text x="340" y="290" fill="#4b5563" font-size="11">IFS 与 read</text>
    <rect x="460" y="210" width="180" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="550" y="236" fill="#4338ca" font-weight="bold" font-size="14">⑦ 调试与校验</text>
    <text x="550" y="256" fill="#4b5563" font-size="11">bash -x / set -x</text>
    <text x="550" y="273" fill="#4b5563" font-size="11">shellcheck 静态检查</text>
    <text x="550" y="290" fill="#4b5563" font-size="11">PS4 增加行号</text>
    <rect x="670" y="210" width="170" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="755" y="236" fill="#0e7490" font-weight="bold" font-size="14">⑧ 工程化</text>
    <text x="755" y="256" fill="#4b5563" font-size="11">幂等设计</text>
    <text x="755" y="273" fill="#4b5563" font-size="11">日志与退出码</text>
    <text x="755" y="290" fill="#4b5563" font-size="11">CI 中调用</text>
    <path d="M 220 115 L 244 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 430 115 L 454 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 640 115 L 664 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 130 160 L 130 204" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 340 160 L 340 204" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 550 160 L 550 204" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 755 160 L 755 204" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="440" y="372" text-anchor="middle" font-size="13" fill="#475569">脚本第一行永远写 set -euo pipefail：未定义变量、命令失败、管道失败都会立刻退出，避免「静默错误」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
