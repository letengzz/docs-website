<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f3a5f">Linux 目录结构（FHS）</text>
  <rect x="330" y="50" width="100" height="36" rx="8" fill="#1f3a5f" stroke="#0d253f" stroke-width="2"/>
  <text x="380" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">/ 根目录</text>
  <line x1="360" y1="86" x2="140" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="86" x2="380" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="86" x2="620" y2="120" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="123" width="190" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="140" y="145" text-anchor="middle" font-size="13" fill="#0d47a1">/etc 配置文件</text>
  <rect x="285" y="123" width="190" height="34" rx="6" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="380" y="145" text-anchor="middle" font-size="13" fill="#1b5e20">/home 用户家目录</text>
  <rect x="525" y="123" width="190" height="34" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="620" y="145" text-anchor="middle" font-size="13" fill="#bf360c">/var 日志与数据</text>
  <line x1="140" y1="157" x2="140" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="157" x2="380" y2="185" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="157" x2="620" y2="185" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="188" width="190" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="140" y="210" text-anchor="middle" font-size="13" fill="#283593">/usr 系统软件</text>
  <rect x="285" y="188" width="190" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#283593">/tmp 临时文件</text>
  <rect x="525" y="188" width="190" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="620" y="210" text-anchor="middle" font-size="13" fill="#283593">/opt 第三方软件</text>
  <line x1="140" y1="222" x2="140" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="222" x2="380" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="222" x2="620" y2="250" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="253" width="190" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="140" y="275" text-anchor="middle" font-size="13" fill="#880e4f">/bin /sbin 命令</text>
  <rect x="285" y="253" width="190" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="380" y="275" text-anchor="middle" font-size="13" fill="#880e4f">/root root 家目录</text>
  <rect x="525" y="253" width="190" height="34" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="620" y="275" text-anchor="middle" font-size="13" fill="#880e4f">/dev 设备文件</text>
  <line x1="140" y1="287" x2="140" y2="315" stroke="#333" stroke-width="1.5"/>
  <line x1="380" y1="287" x2="380" y2="315" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="287" x2="620" y2="315" stroke="#333" stroke-width="1.5"/>
  <rect x="45" y="318" width="190" height="34" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="140" y="340" text-anchor="middle" font-size="13" fill="#311b92">/proc 进程信息</text>
  <rect x="285" y="318" width="190" height="34" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#311b92">/boot 引导文件</text>
  <rect x="525" y="318" width="190" height="34" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="620" y="340" text-anchor="middle" font-size="13" fill="#311b92">/mnt /media 挂载点</text>
  <rect x="45" y="375" width="670" height="30" rx="8" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="1"/>
  <text x="380" y="395" text-anchor="middle" font-size="13" fill="#1f3a5f">所有目录都挂在根目录 / 下，路径从 / 开始</text>
</svg>
