<text x="380.0" y="34" text-anchor="middle" font-size="19" font-family="sans-serif" font-weight="bold" fill="#0f172a">DNSSEC：四层 DS → DNSKEY → RRSIG</text>
<rect x="24.0" y="62" width="169.0" height="86" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="108.5" y="100.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">根信任锚</text>
<text x="108.5" y="117.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">预置 KSK</text>
<line x1="195.0" y1="105.0" x2="202.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8"/><polygon points="202.0,105.0 194.0,101.0 194.0,109.0" fill="#94a3b8"/>
<rect x="205.0" y="62" width="169.0" height="86" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="289.5" y="100.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">com</text>
<text x="289.5" y="117.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">DS 指向子区 KSK</text>
<line x1="376.0" y1="105.0" x2="383.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8"/><polygon points="383.0,105.0 375.0,101.0 375.0,109.0" fill="#94a3b8"/>
<rect x="386.0" y="62" width="169.0" height="86" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="470.5" y="100.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">example.com</text>
<text x="470.5" y="117.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">DS 指向子区 KSK</text>
<line x1="557.0" y1="105.0" x2="564.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8"/><polygon points="564.0,105.0 556.0,101.0 556.0,109.0" fill="#94a3b8"/>
<rect x="567.0" y="62" width="169.0" height="86" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="651.5" y="100.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">www</text>
<text x="651.5" y="117.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">RRSIG 覆盖 A</text>
<rect x="30" y="172" width="340" height="66" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="200.0" y="200.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">完整验证：任一篡改 → SERVFAIL</text>
<text x="200.0" y="217.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">本机 3 层篡改 + 过期 + 旧 DS 全被拒</text>
<rect x="390" y="172" width="340" height="66" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="560.0" y="200.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#0f172a">只验末级：换公钥重签照样通过</text>
<text x="560.0" y="217.5" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#475569">跳过的 3 层正是信任所在</text>
<text x="380.0" y="262" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">DNSSEC 给的是真实性，不是机密性；加密传输给的是机密性，不是真实性</text>
</svg>
