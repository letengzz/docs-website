<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img">
<rect x="0" y="0" width="760" height="232" fill="#ffffff"/>
<text x="380.0" y="34" text-anchor="middle" font-size="19" font-family="sans-serif" font-weight="bold" fill="#0f172a">ECS：调度精度与缓存代价是同一枚硬币</text>
<rect x="30" y="62" width="330" height="92" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="195.0" y="85.9" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#0f172a">无 ECS</text>
<text x="195.0" y="103.4" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">200 客户端 / 4 区域</text>
<text x="195.0" y="120.9" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">本地命中 50 = 25.0%</text>
<text x="195.0" y="138.4" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">缓存 1 条 / 命中率 92%</text>
<rect x="400" y="62" width="330" height="92" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="565.0" y="85.9" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#0f172a">有 ECS /24</text>
<text x="565.0" y="103.4" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">按子网归属调度</text>
<text x="565.0" y="120.9" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">本地命中 196 = 98.0%</text>
<text x="565.0" y="138.4" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">缓存 200 条 / 命中率 41%</text>
<text x="380.0" y="180" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">缓存键从「域名」变成「域名 + 客户端子网」，精度换命中率</text><text x="380.0" y="204" text-anchor="middle" font-size="12.5" font-family="sans-serif" fill="#475569">权重轮询 5:3:2，10,000 次分配最大偏差 2.93%</text>
</svg>
