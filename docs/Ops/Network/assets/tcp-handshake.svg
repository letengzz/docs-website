<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="tc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .cli { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .srv { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .msg { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="cli" x="40" y="60" width="180" height="54"/>
  <text x="130" y="90">客户端</text>

  <rect class="msg" x="330" y="40" width="200" height="44"/>
  <text x="430" y="67">1. SYN（seq=x）</text>
  <line x1="220" y1="80" x2="330" y2="65" marker-end="url(#tc-arrow)"/>

  <rect class="msg" x="330" y="110" width="200" height="44"/>
  <text x="430" y="137">2. SYN+ACK（seq=y, ack=x+1）</text>
  <line x1="530" y1="120" x2="220" y2="95" stroke="#3aa76d" marker-end="url(#tc-arrow)"/>

  <rect class="msg" x="330" y="180" width="200" height="44"/>
  <text x="430" y="207">3. ACK（ack=y+1）</text>
  <line x1="220" y1="165" x2="330" y2="195" marker-end="url(#tc-arrow)"/>

  <rect class="srv" x="630" y="60" width="190" height="54"/>
  <text x="725" y="90">服务端</text>

  <rect class="cli" x="40" y="280" width="180" height="54"/>
  <text x="130" y="308">四次挥手</text>
  <text class="small" x="130" y="326">FIN → ACK → FIN → ACK</text>

  <text class="small" x="430" y="250">状态：LISTEN → SYN_SENT → ESTABLISHED</text>
  <text class="small" x="430" y="330">半连接队列 / 全连接队列：SYN 洪水与 accept 积压的排查点</text>
</svg>
