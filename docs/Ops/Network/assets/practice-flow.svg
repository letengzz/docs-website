<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="200" height="70"/>
  <text x="140" y="92">故障现象</text>
  <text class="small" x="140" y="112">网站打不开 / 慢</text>

  <rect class="mid" x="310" y="60" width="240" height="70"/>
  <text x="430" y="92">分层排查</text>
  <text class="small" x="430" y="112">链路 → 网络 → 端口 → 应用</text>

  <rect class="out" x="620" y="60" width="200" height="70"/>
  <text x="720" y="92">定位与修复</text>
  <text class="small" x="720" y="112">抓包确认 / 配置调整</text>

  <line x1="240" y1="95" x2="310" y2="95" marker-end="url(#pf-arrow)"/>
  <line x1="550" y1="95" x2="620" y2="95" marker-end="url(#pf-arrow)"/>

  <rect class="out" x="310" y="200" width="240" height="54"/>
  <text x="430" y="228">沉淀排查文档</text>
  <text class="small" x="430" y="246">命令模板 + 案例库</text>

  <line x1="720" y1="130" x2="720" y2="170" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="720" y1="170" x2="555" y2="200" marker-end="url(#pf-arrow)"/>

  <text class="small" x="430" y="295">目标：任何「连不上/慢/丢包」问题 10 分钟内定位到层</text>
  <text class="small" x="430" y="315">配套：网络监控（ping/端口/证书到期）+ 告警</text>
</svg>
