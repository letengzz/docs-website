<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .out { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="40" y="60" width="230" height="70"/>
  <text x="155" y="90">1. 抓包</text>
  <text class="small" x="155" y="112">tcpdump 指定网卡/端口</text>

  <rect class="step" x="315" y="60" width="230" height="70"/>
  <text x="430" y="90">2. 保存</text>
  <text class="small" x="430" y="112">pcap 文件落盘</text>

  <rect class="step" x="590" y="60" width="230" height="70"/>
  <text x="705" y="90">3. 分析</text>
  <text class="small" x="705" y="112">Wireshark 过滤/追踪流</text>

  <line x1="270" y1="95" x2="315" y2="95" marker-end="url(#cf-arrow)"/>
  <line x1="545" y1="95" x2="590" y2="95" marker-end="url(#cf-arrow)"/>

  <rect class="out" x="315" y="200" width="230" height="60"/>
  <text x="430" y="228">常见定位</text>
  <text class="small" x="430" y="248">重传 / RST / 握手失败 / 慢启动</text>

  <line x1="705" y1="130" x2="705" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="705" y1="175" x2="550" y2="200" marker-end="url(#cf-arrow)"/>

  <text class="small" x="430" y="290">过滤：host / port / tcp.flags / http / tls.handshake</text>
  <text class="small" x="430" y="310">安全：抓包文件含敏感数据，注意脱敏与权限</text>
  <text class="small" x="430" y="330">HTTPS 抓包：需导出证书 + 客户端信任（测试环境）</text>
</svg>
