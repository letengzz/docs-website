<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="dn-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .srv { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="30" y="60" width="200" height="64"/>
  <text x="130" y="90">浏览器 / 应用</text>
  <text class="small" x="130" y="108">输入域名</text>

  <rect class="step" x="330" y="60" width="200" height="64"/>
  <text x="430" y="90">本地缓存</text>
  <text class="small" x="430" y="108">浏览器 + 系统 + hosts</text>

  <rect class="srv" x="630" y="60" width="200" height="64"/>
  <text x="730" y="90">递归 DNS 服务器</text>
  <text class="small" x="730" y="108">运营商 / 公共 DNS</text>

  <line x1="230" y1="92" x2="330" y2="92" marker-end="url(#dn-arrow)"/>
  <line x1="530" y1="92" x2="630" y2="92" marker-end="url(#dn-arrow)"/>

  <rect class="srv" x="630" y="210" width="200" height="54"/>
  <text x="730" y="238">根 / 顶级域 / 权威 DNS</text>

  <line x1="730" y1="124" x2="730" y2="210" marker-end="url(#dn-arrow)"/>
  <text class="small" x="740" y="160">逐级查询获得 IP</text>

  <text class="small" x="430" y="300">记录类型：A/AAAA（IP）、CNAME（别名）、MX（邮件）、TXT（验证）</text>
  <text class="small" x="430" y="320">排查：dig / nslookup 看解析结果，TTL 影响切换生效时间</text>
  <text class="small" x="430" y="340">常见坑：本地 hosts 污染、DNS 缓存未清、权威记录配置错误</text>
</svg>
