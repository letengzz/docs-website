<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">BM25：词频饱和、长度惩罚与三个可调参数</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">得分是相对量，跨查询不可比；排序稳定的前提是同一套参数与同一份统计</text>
  <text x="60" y="84" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">BM25 的词频饱和（k1=1.2，b=0.75，dl=avgdl）</text>
  <rect x="70" y="166" width="42" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="91" y="160" text-anchor="middle" font-size="8" fill="#334155">1.00</text>
  <text x="91" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=1</text>
  <rect x="132" y="148" width="42" height="68" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="153" y="142" text-anchor="middle" font-size="8" fill="#334155">1.38</text>
  <text x="153" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=2</text>
  <rect x="194" y="138" width="42" height="78" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="215" y="132" text-anchor="middle" font-size="8" fill="#334155">1.57</text>
  <text x="215" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=3</text>
  <rect x="256" y="128" width="42" height="88" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="277" y="122" text-anchor="middle" font-size="8" fill="#334155">1.77</text>
  <text x="277" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=5</text>
  <rect x="318" y="118" width="42" height="98" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="339" y="112" text-anchor="middle" font-size="8" fill="#334155">1.96</text>
  <text x="339" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=10</text>
  <rect x="380" y="113" width="42" height="103" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="401" y="107" text-anchor="middle" font-size="8" fill="#334155">2.08</text>
  <text x="401" y="232" text-anchor="middle" font-size="8.5" fill="#475569">tf=20</text>
  <line x1="60" y1="216" x2="470" y2="216" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="60" y="252" text-anchor="start" font-size="9" fill="#B91C1C">tf 从 1 涨到 10（10 倍），得分只从 1.00 涨到 1.96（不到 2 倍）</text>
  <rect x="500" y="74" width="230" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="615" y="92.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">三个参数各管一件事</text>
  <text x="615" y="109" text-anchor="middle" font-size="7.5" fill="#C2410C">k1：饱和速度（默认 1.2）</text>
  <text x="615" y="126.25" text-anchor="middle" font-size="7.5" fill="#C2410C">b：长度惩罚（默认 0.75）</text>
  <text x="615" y="143.5" text-anchor="middle" font-size="7.5" fill="#C2410C">字段 boost：先验权重</text>
  <rect x="500" y="182" width="230" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="615" y="200.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">b 的两种极端（tf=2）</text>
  <text x="615" y="217" text-anchor="middle" font-size="7.5" fill="#B45309">b=0：dl=400 与 dl=50 同分</text>
  <text x="615" y="234.25" text-anchor="middle" font-size="7.5" fill="#B45309">b=1：1.692 → 0.647（差 2.6 倍）</text>
  <rect x="500" y="290" width="230" height="90" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="615" y="308.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">k1 的宽容度（tf=10）</text>
  <text x="615" y="325" text-anchor="middle" font-size="7.5" fill="#0F766E">k1=0.6 → 倍数 1.86</text>
  <text x="615" y="342.25" text-anchor="middle" font-size="7.5" fill="#0F766E">k1=2.0 → 倍数 3.33</text>
  <text x="60" y="300" text-anchor="start" font-size="10" fill="#1E3A8A" font-weight="bold">排序器好坏不是「公式选对」，是「权重与归一化与业务对齐」</text>
  <rect x="60" y="314" width="400" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="260" y="332.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">两段式：召回靠词项，顺序靠业务</text>
  <text x="260" y="349" text-anchor="middle" font-size="7.5" fill="#047857">第一段：倒排召回 top 200（可用 ts_rank / BM25）</text>
  <text x="260" y="366.25" text-anchor="middle" font-size="7.5" fill="#047857">第二段：业务加权（时效 / 权限 / 置顶 / 质量分）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
