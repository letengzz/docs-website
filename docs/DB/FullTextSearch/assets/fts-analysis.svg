<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分析链：分词不是「配置项」，是索引契约</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">换分词器必须重建索引，且必须与查询侧用同一条链</text>
  <rect x="30" y="74" width="132" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">原始文本</text>
  <text x="96" y="109" text-anchor="middle" font-size="7.5" fill="#334155">大小写 / 全半角</text>
  <text x="96" y="126.25" text-anchor="middle" font-size="7.5" fill="#334155">HTML 标签 / 标点</text>
  <rect x="186" y="74" width="132" height="70" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="252" y="92.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">字符过滤</text>
  <text x="252" y="109" text-anchor="middle" font-size="7.5" fill="#0E7490">char_filter</text>
  <text x="252" y="126.25" text-anchor="middle" font-size="7.5" fill="#0E7490">去标签 · 映射</text>
  <rect x="342" y="74" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="417" y="92.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">分词</text>
  <text x="417" y="109" text-anchor="middle" font-size="7.5" fill="#1D4ED8">tokenizer</text>
  <text x="417" y="126.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">中文：三条路线</text>
  <rect x="516" y="74" width="214" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="623" y="92.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">词项过滤</text>
  <text x="623" y="109" text-anchor="middle" font-size="7.5" fill="#4338CA">停用词 · 同义词 · 词干</text>
  <text x="623" y="126.25" text-anchor="middle" font-size="7.5" fill="#4338CA">小写化 · 长度过滤</text>
  <line x1="162" y1="109" x2="186" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="318" y1="109" x2="342" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="492" y1="109" x2="516" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="516" y="168" width="214" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="623" y="186.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">落成词项流</text>
  <text x="623" y="203" text-anchor="middle" font-size="7.5" fill="#047857">「在线协作任务看板」</text>
  <text x="623" y="220.25" text-anchor="middle" font-size="7.5" fill="#047857">→ 在线 / 协作 / 任务 / 看板</text>
  <line x1="623" y1="144" x2="623" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="168" width="462" height="82" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="261" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">三条中文路线（必须选一条并写进契约）</text>
  <text x="261" y="203" text-anchor="middle" font-size="7.5" fill="#B45309">① 内置 parser：连续 CJK 当整词 → 只能走 bigram / 前缀</text>
  <text x="261" y="220.25" text-anchor="middle" font-size="7.5" fill="#B45309">② 外部分词器：zhparser / pg_jieba / ik / smartcn → 词库即契约</text>
  <text x="261" y="237.5" text-anchor="middle" font-size="7.5" fill="#B45309">③ 双写：分词词项 + 二元组，兼顾精确与回退</text>
  <text x="60" y="282" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">同一句话的切分差异（本机 Python 计算，非数据库实测）</text>
  <rect x="30" y="296" width="80" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="70" y="312" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">原文</text>
  <text x="122" y="312" text-anchor="start" font-size="8.5" fill="#334155">在线协作任务看板的跨租户搜索隔离（16 字）</text>
  <rect x="30" y="326" width="80" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="70" y="342" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">二元组</text>
  <text x="122" y="342" text-anchor="start" font-size="8.5" fill="#334155">15 个词项：在线 / 线协 / 协作 / 作任 / …（含噪声）</text>
  <rect x="30" y="356" width="80" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="70" y="372" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">分词</text>
  <text x="122" y="372" text-anchor="start" font-size="8.5" fill="#334155">9 个词项：在线 / 协作 / 任务 / 看板 / 的 / 跨 / 租户 / 搜索 / 隔离</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
