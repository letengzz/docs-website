<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">查询理解：五步链与零结果的四种真实原因</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">查询侧与索引侧必须共用同一条分析链，这是唯一不能妥协的一条</text>
  <rect x="30" y="74" width="700" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">输入：一段用户真的会打的字（含错别字、空格、符号、超长）</text>
  <text x="380" y="109" text-anchor="middle" font-size="7.5" fill="#334155">「协作 看版 权限」  「看板权限矩阵怎么配」</text>
  <rect x="30" y="146" width="128" height="84" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="94" y="164.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">归一化</text>
  <text x="94" y="181" text-anchor="middle" font-size="7.5" fill="#0E7490">全半角 · 大小写</text>
  <text x="94" y="198.25" text-anchor="middle" font-size="7.5" fill="#0E7490">去控制字符</text>
  <line x1="158" y1="188" x2="172" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="172" y="146" width="128" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="236" y="164.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">切词</text>
  <text x="236" y="181" text-anchor="middle" font-size="7.5" fill="#1D4ED8">与索引同一条链</text>
  <text x="236" y="198.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不许两套分析器</text>
  <line x1="300" y1="188" x2="314" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="146" width="128" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="378" y="164.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">纠错</text>
  <text x="378" y="181" text-anchor="middle" font-size="7.5" fill="#B45309">编辑距离 ≤ 2</text>
  <text x="378" y="198.25" text-anchor="middle" font-size="7.5" fill="#B45309">仅在零结果时启用</text>
  <line x1="442" y1="188" x2="456" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="456" y="146" width="128" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="520" y="164.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">扩展</text>
  <text x="520" y="181" text-anchor="middle" font-size="7.5" fill="#4338CA">同义词 / 上下位</text>
  <text x="520" y="198.25" text-anchor="middle" font-size="7.5" fill="#4338CA">带权重而非等价</text>
  <line x1="584" y1="188" x2="598" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="598" y="146" width="128" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="662" y="164.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">组装</text>
  <text x="662" y="181" text-anchor="middle" font-size="7.5" fill="#6D28D9">AND / OR / 短语</text>
  <text x="662" y="198.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">危险模式拦截</text>
  <text x="60" y="262" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">每一步都可能「帮倒忙」，判据是能否在评估集上证明它更好</text>
  <rect x="30" y="276" width="340" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="200" y="294.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">零结果的四种真实原因</text>
  <text x="200" y="311" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 切词与索引不一致（最常见）</text>
  <text x="200" y="328.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 同义词只配了一侧</text>
  <text x="200" y="345.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 过滤条件过严（时间 / 权限）</text>
  <text x="200" y="362.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">④ 拼写错误没有兜底</text>
  <rect x="390" y="276" width="340" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="294.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">兜底顺序（不许跳步）</text>
  <text x="560" y="311" text-anchor="middle" font-size="7.5" fill="#047857">放宽为 OR → 纠错重试 → 去掉最弱条件</text>
  <text x="560" y="328.25" text-anchor="middle" font-size="7.5" fill="#047857">仍为空则返回「相关推荐」并记录</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
