<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">写入到可见：refresh、段合并与别名切换</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「刚写进去搜不到」多数不是 bug，是没有把可见性口径写进契约</text>
  <rect x="30" y="74" width="150" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="92.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">写入</text>
  <text x="105" y="109" text-anchor="middle" font-size="7.5" fill="#1D4ED8">INSERT / UPDATE</text>
  <text x="105" y="126.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">事务提交</text>
  <rect x="206" y="74" width="150" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="281" y="92.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">内存缓冲</text>
  <text x="281" y="109" text-anchor="middle" font-size="7.5" fill="#4338CA">index buffer</text>
  <text x="281" y="126.25" text-anchor="middle" font-size="7.5" fill="#4338CA">按段（segment）组织</text>
  <rect x="382" y="74" width="176" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="470" y="92.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">refresh</text>
  <text x="470" y="109" text-anchor="middle" font-size="7.5" fill="#B45309">默认 1 s</text>
  <text x="470" y="126.25" text-anchor="middle" font-size="7.5" fill="#B45309">生成新的可搜索段</text>
  <rect x="584" y="74" width="146" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="657" y="92.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">查询可见</text>
  <text x="657" y="109" text-anchor="middle" font-size="7.5" fill="#047857">新段加入搜索</text>
  <text x="657" y="126.25" text-anchor="middle" font-size="7.5" fill="#047857">旧段仍可读</text>
  <line x1="180" y1="107" x2="206" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="356" y1="107" x2="382" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="558" y1="107" x2="584" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="168" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三个「多久可见」的口径，必须写进接口契约</text>
  <rect x="30" y="182" width="96" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="198" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">写后读</text>
  <text x="138" y="198" text-anchor="start" font-size="8.5" fill="#334155">同一事务内可见（数据库） / 默认 1 s（搜索引擎）</text>
  <rect x="30" y="212" width="96" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="228" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">段合并</text>
  <text x="138" y="228" text-anchor="start" font-size="8.5" fill="#334155">merge 期间不阻塞查询，但会吃 I/O 与 CPU</text>
  <rect x="30" y="242" width="96" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="258" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">别名切换</text>
  <text x="138" y="258" text-anchor="start" font-size="8.5" fill="#334155">重建完成前不切；切换是原子操作，回滚就是切回去</text>
  <text x="60" y="286" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">重建索引：四步，任何一步跳过都会「看起来成功」</text>
  <rect x="30" y="300" width="172" height="78" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="116" y="318.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">① 建新索引</text>
  <text x="116" y="335" text-anchor="middle" font-size="7.5" fill="#0E7490">v2 映射 + 新分析器</text>
  <rect x="206" y="300" width="172" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="292" y="318.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 全量回灌</text>
  <text x="292" y="335" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按主键游标分批</text>
  <text x="292" y="352.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">记录水位线</text>
  <rect x="382" y="300" width="172" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="468" y="318.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">③ 双向对账</text>
  <text x="468" y="335" text-anchor="middle" font-size="7.5" fill="#4338CA">按主键比条数</text>
  <text x="468" y="352.25" text-anchor="middle" font-size="7.5" fill="#4338CA">抽样比字段</text>
  <rect x="558" y="300" width="172" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="644" y="318.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 原子切换</text>
  <text x="644" y="335" text-anchor="middle" font-size="7.5" fill="#047857">别名指向 v2</text>
  <text x="644" y="352.25" text-anchor="middle" font-size="7.5" fill="#047857">旧索引保留 7 天</text>
  <line x1="202" y1="339" x2="206" y2="339" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="378" y1="339" x2="382" y2="339" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="554" y1="339" x2="558" y2="339" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
