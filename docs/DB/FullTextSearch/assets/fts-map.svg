<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">全文检索与搜索工程的六个环节</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">查询理解 → 分析 → 索引 → 召回 → 排序 → 评估，任何一环缺口都会表现为「搜不出来」或「搜得不准」</text>
  <rect x="30" y="80" width="325" height="78" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="192.5" y="98.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">① 查询理解</text>
  <text x="192.5" y="115" text-anchor="middle" font-size="7.5" fill="#0E7490">QueryUnderstanding</text>
  <text x="192.5" y="132.25" text-anchor="middle" font-size="7.5" fill="#0E7490">纠错 · 同义词 · 改写</text>
  <rect x="30" y="180" width="325" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="192.5" y="198.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 文本分析</text>
  <text x="192.5" y="215" text-anchor="middle" font-size="7.5" fill="#1D4ED8">TextAnalysis</text>
  <text x="192.5" y="232.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">分词 · 归一 · 词典</text>
  <rect x="30" y="280" width="325" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="192.5" y="298.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">③ 索引与更新</text>
  <text x="192.5" y="315" text-anchor="middle" font-size="7.5" fill="#4338CA">IndexDesign</text>
  <text x="192.5" y="332.25" text-anchor="middle" font-size="7.5" fill="#4338CA">IndexUpdate</text>
  <text x="192.5" y="349.5" text-anchor="middle" font-size="7.5" fill="#4338CA">倒排结构 · 增量同步</text>
  <rect x="405" y="80" width="325" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="567.5" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 召回</text>
  <text x="567.5" y="115" text-anchor="middle" font-size="7.5" fill="#047857">Overview</text>
  <text x="567.5" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">要不要上搜索引擎</text>
  <rect x="405" y="180" width="325" height="78" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="567.5" y="198.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑤ 相关性排序</text>
  <text x="567.5" y="215" text-anchor="middle" font-size="7.5" fill="#C2410C">Relevance</text>
  <text x="567.5" y="232.25" text-anchor="middle" font-size="7.5" fill="#C2410C">BM25 · 加权 · 混排</text>
  <rect x="405" y="280" width="325" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="567.5" y="298.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">⑥ 评估与性能</text>
  <text x="567.5" y="315" text-anchor="middle" font-size="7.5" fill="#0F766E">Evaluation</text>
  <text x="567.5" y="332.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Performance</text>
  <text x="567.5" y="349.5" text-anchor="middle" font-size="7.5" fill="#0F766E">指标 · 延迟 · 容量</text>
  <rect x="160" y="385" width="440" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="403.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">落地与分诊</text>
  <text x="380" y="420" text-anchor="middle" font-size="7.5" fill="#334155">Practice：一条可验收的完整链路</text>
  <text x="380" y="437.25" text-anchor="middle" font-size="7.5" fill="#334155">FAQ：八类症状分诊 · 上线自查</text>
  <line x1="192" y1="158" x2="192" y2="180" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="192" y1="258" x2="192" y2="280" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="567" y1="158" x2="567" y2="180" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="567" y1="258" x2="567" y2="280" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="355" y1="200" x2="405" y2="200" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="195" text-anchor="middle" font-size="7.5" fill="#64748B">分析结果</text>
  <line x1="405" y1="305" x2="355" y2="305" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="5 4"/>
  <text x="380" y="300" text-anchor="middle" font-size="7.5" fill="#64748B">查询词</text>
  <line x1="192" y1="358" x2="300" y2="385" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="568" y1="358" x2="460" y2="385" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
