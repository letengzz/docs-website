<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="432" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">倒排结构与 GIN：为什么「索引比表大」是正常的</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">posting 列表是空间换时间的直接代价，估算必须按词项数而不是行数</text>
  <rect x="30" y="74" width="190" height="118" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="125" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">文档</text>
  <text x="125" y="109" text-anchor="middle" font-size="7.5" fill="#334155">d1 在线协作看板</text>
  <text x="125" y="126.25" text-anchor="middle" font-size="7.5" fill="#334155">d2 看板权限矩阵</text>
  <text x="125" y="143.5" text-anchor="middle" font-size="7.5" fill="#334155">d3 协作与通知</text>
  <text x="125" y="160.75" text-anchor="middle" font-size="7.5" fill="#334155">d4 租户隔离</text>
  <rect x="268" y="74" width="240" height="118" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="388" y="92.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">倒排表（词项 → posting）</text>
  <text x="388" y="109" text-anchor="middle" font-size="7.5" fill="#047857">在线 → d1</text>
  <text x="388" y="126.25" text-anchor="middle" font-size="7.5" fill="#047857">协作 → d1, d3</text>
  <text x="388" y="143.5" text-anchor="middle" font-size="7.5" fill="#047857">看板 → d1, d2</text>
  <text x="388" y="160.75" text-anchor="middle" font-size="7.5" fill="#047857">租户 → d4</text>
  <line x1="220" y1="133" x2="268" y2="133" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="244" y="128" text-anchor="middle" font-size="7.5" fill="#64748B">分析</text>
  <rect x="556" y="74" width="174" height="118" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="643" y="92.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">查询</text>
  <text x="643" y="109" text-anchor="middle" font-size="7.5" fill="#1D4ED8">协作 AND 看板</text>
  <text x="643" y="126.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">→ 取交集 {d1}</text>
  <text x="643" y="143.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">→ 打分排序</text>
  <line x1="508" y1="133" x2="556" y2="133" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="216" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">GIN 索引的三块结构（PostgreSQL）</text>
  <rect x="30" y="230" width="220" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="140" y="248.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">entry tree</text>
  <text x="140" y="265" text-anchor="middle" font-size="7.5" fill="#4338CA">词项 → posting 链入口</text>
  <text x="140" y="282.25" text-anchor="middle" font-size="7.5" fill="#4338CA">按词项有序，二分定位</text>
  <rect x="270" y="230" width="220" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="248.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">posting tree / list</text>
  <text x="380" y="265" text-anchor="middle" font-size="7.5" fill="#6D28D9">行号（TID）列表</text>
  <text x="380" y="282.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">超过一页转为 posting tree</text>
  <rect x="510" y="230" width="220" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="620" y="248.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">pending list</text>
  <text x="620" y="265" text-anchor="middle" font-size="7.5" fill="#B45309">fastupdate 缓冲</text>
  <text x="620" y="282.25" text-anchor="middle" font-size="7.5" fill="#B45309">满 gin_pending_list_limit 才合并</text>
  <line x1="250" y1="276" x2="270" y2="276" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="490" y1="276" x2="510" y2="276" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="340" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">两个会静默失真的读数</text>
  <rect x="30" y="352" width="340" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="200" y="370.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">① 刚插入搜不到</text>
  <text x="200" y="387" text-anchor="middle" font-size="7.5" fill="#B91C1C">fastupdate 的 pending list 尚未合并</text>
  <text x="200" y="404.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">→ 查询会顺带扫它，结果正确但更慢</text>
  <rect x="390" y="352" width="340" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="560" y="370.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">② 索引比表大</text>
  <text x="560" y="387" text-anchor="middle" font-size="7.5" fill="#C2410C">tsvector 每词带位置列表</text>
  <text x="560" y="404.25" text-anchor="middle" font-size="7.5" fill="#C2410C">→ 100 万篇 × 120 词 ≈ 0.67 GiB</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
