<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战链路：四步落地与七条验收</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先用数据库原生能力做对，再考虑引入独立的搜索引擎</text>
  <rect x="30" y="74" width="700" height="48" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">目标：10 万条工单的全文搜索，租户内可见，1 秒内可搜到，改词库能灰度</text>
  <rect x="30" y="142" width="150" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="160.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 建模</text>
  <text x="105" y="177" text-anchor="middle" font-size="7.5" fill="#1D4ED8">tsvector 生成列</text>
  <text x="105" y="194.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">权重 A/B/C/D</text>
  <rect x="198" y="142" width="150" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="273" y="160.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 索引</text>
  <text x="273" y="177" text-anchor="middle" font-size="7.5" fill="#4338CA">GIN + 租户列</text>
  <text x="273" y="194.25" text-anchor="middle" font-size="7.5" fill="#4338CA">复合条件走同一索引</text>
  <rect x="366" y="142" width="150" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="441" y="160.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 查询</text>
  <text x="441" y="177" text-anchor="middle" font-size="7.5" fill="#047857">websearch_to_tsquery</text>
  <text x="441" y="194.25" text-anchor="middle" font-size="7.5" fill="#047857">两段式排序</text>
  <rect x="534" y="142" width="196" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="632" y="160.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">④ 运维</text>
  <text x="632" y="177" text-anchor="middle" font-size="7.5" fill="#B45309">别名 / 重建 / 评估集</text>
  <text x="632" y="194.25" text-anchor="middle" font-size="7.5" fill="#B45309">慢查询与容量</text>
  <line x1="180" y1="181" x2="198" y2="181" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="348" y1="181" x2="366" y2="181" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="516" y1="181" x2="534" y2="181" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="254" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">七条验收（全部可在本地 PostgreSQL 跑，不需要搜索引擎）</text>
  <text x="70" y="276" text-anchor="start" font-size="8.5" fill="#334155">S1 生成列与 GIN 存在，EXPLAIN 走 Bitmap Index Scan</text>
  <text x="70" y="298" text-anchor="start" font-size="8.5" fill="#334155">S2 租户条件在同一个索引里，跨租户查询返回 0 行</text>
  <text x="70" y="320" text-anchor="start" font-size="8.5" fill="#334155">S3 标题命中的文档排在只有正文命中的前面</text>
  <text x="70" y="342" text-anchor="start" font-size="8.5" fill="#334155">S4 新增文档在同事务内可见（读己之写）</text>
  <text x="70" y="364" text-anchor="start" font-size="8.5" fill="#334155">S5 词库变更后重建索引，别名原子切换</text>
  <text x="70" y="386" text-anchor="start" font-size="8.5" fill="#334155">S6 评估集 200 条，NDCG@10 有基线且可复算</text>
  <text x="70" y="408" text-anchor="start" font-size="8.5" fill="#334155">S7 慢查询日志里没有 &gt; 200 ms 的搜索</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
