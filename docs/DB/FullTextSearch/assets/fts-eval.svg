<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="422" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">评估闭环：四个环节与四个指标的盲区</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">没有基线的「感觉变好了」，等于没有改动</text>
  <rect x="30" y="74" width="168" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="114" y="92.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 评估集</text>
  <text x="114" y="109" text-anchor="middle" font-size="7.5" fill="#1D4ED8">分层抽样 200~500 查询</text>
  <text x="114" y="126.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">每条 3 档相关性标注</text>
  <rect x="222" y="74" width="168" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="306" y="92.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 离线指标</text>
  <text x="306" y="109" text-anchor="middle" font-size="7.5" fill="#4338CA">Recall@k / MRR</text>
  <text x="306" y="126.25" text-anchor="middle" font-size="7.5" fill="#4338CA">NDCG@10 / 零结果率</text>
  <rect x="414" y="74" width="168" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="498" y="92.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 回归门禁</text>
  <text x="498" y="109" text-anchor="middle" font-size="7.5" fill="#B45309">指标不得下降超过阈值</text>
  <text x="498" y="126.25" text-anchor="middle" font-size="7.5" fill="#B45309">延迟不得退化</text>
  <rect x="606" y="74" width="124" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="668" y="92.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 线上</text>
  <text x="668" y="109" text-anchor="middle" font-size="7.5" fill="#047857">A/B 或交错实验</text>
  <line x1="198" y1="116" x2="222" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="390" y1="116" x2="414" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="582" y1="116" x2="606" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="190" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">指标各有盲区，必须成对看</text>
  <rect x="30" y="204" width="96" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="219" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">Recall@10</text>
  <text x="138" y="219" text-anchor="start" font-size="8.5" fill="#334155">召回够不够</text>
  <text x="300" y="219" text-anchor="start" font-size="8.5" fill="#B91C1C">不反映顺序，全排后面也算对</text>
  <rect x="30" y="232" width="96" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="247" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">MRR</text>
  <text x="138" y="247" text-anchor="start" font-size="8.5" fill="#334155">第一条有多快出现</text>
  <text x="300" y="247" text-anchor="start" font-size="8.5" fill="#B91C1C">只看第一条，忽略后面的整体质量</text>
  <rect x="30" y="260" width="96" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="275" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">NDCG@10</text>
  <text x="138" y="275" text-anchor="start" font-size="8.5" fill="#334155">整体顺序质量</text>
  <text x="300" y="275" text-anchor="start" font-size="8.5" fill="#B91C1C">依赖标注的档位一致性</text>
  <rect x="30" y="288" width="96" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="78" y="303" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">零结果率</text>
  <text x="138" y="303" text-anchor="start" font-size="8.5" fill="#334155">最差体验的占比</text>
  <text x="300" y="303" text-anchor="start" font-size="8.5" fill="#B91C1C">可通过放宽到 OR 造假</text>
  <rect x="510" y="200" width="220" height="116" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="620" y="218.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">样本量（95% 置信，真算）</text>
  <text x="620" y="235" text-anchor="middle" font-size="7.5" fill="#0F766E">p=0.7，想分辨 ±10 个百分点</text>
  <text x="620" y="252.25" text-anchor="middle" font-size="7.5" fill="#0F766E">→ 每条查询约 81 个判定</text>
  <text x="620" y="269.5" text-anchor="middle" font-size="7.5" fill="#0F766E">想分辨 ±5 个百分点 → 323 个</text>
  <text x="620" y="286.75" text-anchor="middle" font-size="7.5" fill="#0F766E">200 条查询只能分辨约 6 个百分点</text>
  <text x="60" y="340" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">排序器 A 与 B 的 NDCG@5（同一组标注，真算）</text>
  <rect x="30" y="352" width="340" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="370.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">A：1.0000</text>
  <text x="200" y="387" text-anchor="middle" font-size="7.5" fill="#047857">最相关的 3 篇占了前三位</text>
  <rect x="390" y="352" width="340" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="370.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">B：0.5272</text>
  <text x="560" y="387" text-anchor="middle" font-size="7.5" fill="#B91C1C">把最相关的排到第 3 位，掉了一半</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
