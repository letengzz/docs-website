<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">ClickHouse 专题地图：从存储模型到规模化</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">列式存储 + MergeTree + 分区/排序/物化视图 + 副本分片，四层能力对应九个页面</text>
  <rect x="30" y="76" width="165" height="120" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="112.5" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 存储模型</text>
  <text x="112.5" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">列式存储：按列组织</text>
  <text x="112.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">同列类型一致，压缩率高</text>
  <text x="112.5" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">聚合只读需要的列</text>
  <text x="112.5" y="162.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">不适合频繁单行更新</text>
  <rect x="223" y="76" width="165" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="305.5" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 核心引擎</text>
  <text x="305.5" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">MergeTree 引擎族</text>
  <text x="305.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">数据按 part 追加写入</text>
  <text x="305.5" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">后台异步 Merge</text>
  <text x="305.5" y="162.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">主键是稀疏索引</text>
  <rect x="416" y="76" width="165" height="120" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="498.5" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 性能三板斧</text>
  <text x="498.5" y="111" text-anchor="middle" font-size="7.5" fill="#047857">分区：裁剪扫描范围</text>
  <text x="498.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">排序键：跳读数据</text>
  <text x="498.5" y="145.5" text-anchor="middle" font-size="7.5" fill="#047857">物化视图：预聚合</text>
  <text x="498.5" y="162.75" text-anchor="middle" font-size="7.5" fill="#047857">跳数索引：粗过滤</text>
  <rect x="609" y="76" width="121" height="120" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="669.5" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 规模化</text>
  <text x="669.5" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">副本：Replicated</text>
  <text x="669.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#0F766E">分片：Distributed</text>
  <text x="669.5" y="145.5" text-anchor="middle" font-size="7.5" fill="#0F766E">ZooKeeper/Keeper</text>
  <text x="669.5" y="162.75" text-anchor="middle" font-size="7.5" fill="#0F766E">扩容与再平衡</text>
  <text x="380" y="222" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">一条主线：为什么 OLAP 快 —— 少读列 · 稀疏跳读 · 预先算好 · 并行到底</text>
  <text x="60" y="252" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">专题结构</text>
  <rect x="30" y="264" width="700" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="282.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">九个页面的阅读路径</text>
  <text x="380" y="299" text-anchor="middle" font-size="8" fill="#334155">Overview（列式原理） → MergeTree（引擎与 part/merge 机制） → PartitionIndex（分区与索引） → SqlBasic（类型与 SQL）</text>
  <text x="380" y="317.4" text-anchor="middle" font-size="8" fill="#334155">MaterializedView（预聚合） → Cluster（副本与分片） → Practice（行为分析实战） → FAQ（反模式与排错）</text>
  <text x="380" y="335.8" text-anchor="middle" font-size="8" fill="#334155">选型前置判据：写入吞吐大、更新少、查询聚合多 —— 三者同时成立才选 ClickHouse</text>
  <text x="380" y="386" text-anchor="middle" font-size="10" fill="#B91C1C">定位一句话：分析极快的列式数据库，不是更快的 MySQL —— 事务与单行更新不是它的主场</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
