<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="490" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">副本与分片：Distributed 表只是路由，数据都在本地表</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">分片解决容量、副本解决可用 —— ReplicatedMergeTree 依赖 ClickHouse Keeper 协调复制</text>
  <text x="60" y="82" text-anchor="start" font-size="11" fill="#1E3A8A" font-weight="bold">应用视角：一张 Distributed 表</text>
  <rect x="280" y="92" width="200" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="110.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">Distributed 表 events_all</text>
  <text x="380" y="127" text-anchor="middle" font-size="8" fill="#6D28D9">只是一张「路由视图」</text>
  <text x="380" y="145.4" text-anchor="middle" font-size="8" fill="#6D28D9">不存数据</text>
  <text x="380" y="163.8" text-anchor="middle" font-size="8" fill="#6D28D9">按分片键 fan-out / 汇聚</text>
  <line x1="380" y1="162" x2="160" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="60" y="206" width="200" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="160" y="224.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">分片 1</text>
  <text x="160" y="241" text-anchor="middle" font-size="7.5" fill="#1D4ED8">副本 A（ch-1a）</text>
  <text x="160" y="258.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">副本 B（ch-1b）</text>
  <text x="160" y="275.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">ReplicatedMergeTree</text>
  <text x="160" y="292.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Keeper 同步元数据</text>
  <line x1="380" y1="162" x2="392" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="292" y="206" width="200" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="392" y="224.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">分片 2</text>
  <text x="392" y="241" text-anchor="middle" font-size="7.5" fill="#047857">副本 A（ch-2a）</text>
  <text x="392" y="258.25" text-anchor="middle" font-size="7.5" fill="#047857">副本 B（ch-2b）</text>
  <text x="392" y="275.5" text-anchor="middle" font-size="7.5" fill="#047857">每个分片是独立</text>
  <text x="392" y="292.75" text-anchor="middle" font-size="7.5" fill="#047857">MergeTree 数据集</text>
  <line x1="380" y1="162" x2="624" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="524" y="206" width="200" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="624" y="224.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">分片 3</text>
  <text x="624" y="241" text-anchor="middle" font-size="7.5" fill="#0F766E">副本 A（ch-3a）</text>
  <text x="624" y="258.25" text-anchor="middle" font-size="7.5" fill="#0F766E">副本 B（ch-3b）</text>
  <text x="624" y="275.5" text-anchor="middle" font-size="7.5" fill="#0F766E">分片间数据不相交</text>
  <text x="624" y="292.75" text-anchor="middle" font-size="7.5" fill="#0F766E">分片键决定去向</text>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#475569">写路径：Distributed 表按分片键把每行发给目标分片；分片内 ReplicatedMergeTree 经 Keeper 复制到副本</text>
  <text x="60" y="362" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">最小可用与踩坑提醒</text>
  <rect x="30" y="374" width="340" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="392.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">单机起步怎么留后路</text>
  <text x="200" y="409" text-anchor="middle" font-size="8" fill="#047857">单机用 MergeTree + 建表参数写全（库名、表名）</text>
  <text x="200" y="427.4" text-anchor="middle" font-size="8" fill="#047857">将来加副本只改引擎为 ReplicatedMergeTree</text>
  <text x="200" y="445.8" text-anchor="middle" font-size="8" fill="#047857">分片键从一开始就要设计（不是加机器时才想）</text>
  <rect x="390" y="374" width="340" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="560" y="392.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">两个高频坑</text>
  <text x="560" y="409" text-anchor="middle" font-size="8" fill="#B91C1C">查 Distributed 表带分片键 → 只扫目标分片；不带 → 广播全部分片</text>
  <text x="560" y="427.4" text-anchor="middle" font-size="8" fill="#B91C1C">副本是「表级别」的复制，不是整个实例 —— 两边建表语句必须完全一致</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
