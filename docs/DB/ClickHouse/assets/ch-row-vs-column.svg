  <text x="483" y="156" text-anchor="middle" font-size="8.5" fill="#B91C1C">行数越多浪费越大</text>
  <text x="483" y="186" text-anchor="middle" font-size="8.5" fill="#991B1B">适合：按行取整条</text>
  <text x="60" y="236" text-anchor="start" font-size="11" fill="#065F46" font-weight="bold">列式存储（ClickHouse）</text>
