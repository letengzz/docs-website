  <rect x="648" y="248" width="82" height="110" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="689" y="278" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">只读</text>
  <text x="689" y="296" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">age 一列</text>
  <text x="689" y="326" text-anchor="middle" font-size="8.5" fill="#047857">连续存放</text>
  <text x="689" y="342" text-anchor="middle" font-size="8.5" fill="#047857">压缩极好</text>
  <text x="380" y="400" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">结论：聚合查询（AVG/COUNT/GROUP BY）天然只碰少数几列 —— 列存把磁盘 IO 降到 1/n</text>
  <text x="380" y="422" text-anchor="middle" font-size="9.5" fill="#64748B">同列同类型 → 列级压缩（LZ4/ZSTD/专用编码）可达 10 倍以上；代价是单行更新与点查很弱</text>
