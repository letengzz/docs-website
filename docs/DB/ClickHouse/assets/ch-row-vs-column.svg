  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">行式 vs 列式：为什么聚合查询快了一个数量级</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">行式按行放数据，取一列要读整行；列式按列放数据，取一列只读那一列</text>
