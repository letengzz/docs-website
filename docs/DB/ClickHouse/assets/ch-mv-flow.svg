<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">物化视图：写入时预聚合的增量链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">MV 只对新写入的 part 增量计算，配合 AggregatingMergeTree 的 -State/-Merge 函数族使用</text>
  <rect x="30" y="84" width="150" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">明细表 events</text>
  <text x="105" y="119" text-anchor="middle" font-size="8" fill="#1D4ED8">INSERT 持续写入</text>
  <text x="105" y="137.4" text-anchor="middle" font-size="8" fill="#1D4ED8">保留原始明细</text>
  <text x="105" y="155.8" text-anchor="middle" font-size="8" fill="#1D4ED8">量大、查询慢</text>
  <line x1="180" y1="122" x2="240" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="210" y="117" text-anchor="middle" font-size="7.5" fill="#64748B">INSERT 时同步触发</text>
  <rect x="250" y="84" width="160" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="330" y="102.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">物化视图 mv_stats</text>
  <text x="330" y="119" text-anchor="middle" font-size="8" fill="#6D28D9">定义是一段 SELECT</text>
  <text x="330" y="137.4" text-anchor="middle" font-size="8" fill="#6D28D9">写入时增量计算</text>
  <text x="330" y="155.8" text-anchor="middle" font-size="8" fill="#6D28D9">结果落目标表</text>
  <line x1="410" y1="122" x2="470" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="480" y="84" width="130" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="545" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">目标表 stats</text>
  <text x="545" y="119" text-anchor="middle" font-size="8" fill="#047857">预聚合结果</text>
  <text x="545" y="137.4" text-anchor="middle" font-size="8" fill="#047857">行数少几个量级</text>
  <text x="545" y="155.8" text-anchor="middle" font-size="8" fill="#047857">毫秒级查询</text>
  <line x1="610" y1="122" x2="662" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="668" y="84" width="62" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="699" y="102.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">看板</text>
  <text x="699" y="119" text-anchor="middle" font-size="8" fill="#0F766E">直接查</text>
  <text x="699" y="137.4" text-anchor="middle" font-size="8" fill="#0F766E">目标表</text>
  <text x="380" y="190" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">关键机制：物化视图只处理「新写入的那一批 part」，不做全量重算 —— 成本与写入成正比，与历史数据量无关</text>
  <text x="60" y="222" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">两条铁律与一个补救</text>
  <rect x="30" y="234" width="226" height="108" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="143" y="252.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">铁律 1：只算新增</text>
  <text x="143" y="269" text-anchor="middle" font-size="8" fill="#B91C1C">每次 INSERT 只对本次数据聚合</text>
  <text x="143" y="287.4" text-anchor="middle" font-size="8" fill="#B91C1C">所以聚合函数要用 -State/-Merge 组合</text>
  <text x="143" y="305.8" text-anchor="middle" font-size="8" fill="#B91C1C">普通 sum() 在并行 part 下会算错</text>
  <rect x="272" y="234" width="226" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="385" y="252.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">铁律 2：视图不存数据</text>
  <text x="385" y="269" text-anchor="middle" font-size="8" fill="#B45309">MV 本身没有数据</text>
  <text x="385" y="287.4" text-anchor="middle" font-size="8" fill="#B45309">真实数据在 TO 目标表</text>
  <text x="385" y="305.8" text-anchor="middle" font-size="8" fill="#B45309">改逻辑 = 重建目标表并回填</text>
  <rect x="514" y="234" width="216" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="622" y="252.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">补救：历史回填</text>
  <text x="622" y="269" text-anchor="middle" font-size="8" fill="#0F766E">新建视图只覆盖增量</text>
  <text x="622" y="287.4" text-anchor="middle" font-size="8" fill="#0F766E">历史数据用 POPULATE</text>
  <text x="622" y="305.8" text-anchor="middle" font-size="8" fill="#0F766E">或 insert into 目标表重算</text>
  <text x="622" y="324.2" text-anchor="middle" font-size="8" fill="#0F766E">POPULATE 期间写入有缺口</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#1E3A8A">判断用不用 MV：查询固定且高频 → 预聚合；探索性分析 → 直接查明细表</text>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#64748B">同类能力：projection（25.8 起 lightweight projections 轻量化），代价更小但约束更多</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
