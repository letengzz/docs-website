<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">MergeTree：part 追加写入 + 后台合并 + 稀疏主键索引</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">理解 part 与 merge 是理解 ClickHouse 一切行为（去重、TTL、最终一致）的前提</text>
  <text x="60" y="82" text-anchor="start" font-size="11" fill="#1E3A8A" font-weight="bold">一次 INSERT = 一个 part（数据 part）</text>
  <rect x="30" y="94" width="138" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="99" y="112.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">part 20260929_1</text>
  <text x="99" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">按排序键有序</text>
  <text x="99" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">含主键稀疏索引</text>
  <text x="99" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">含每列压缩文件</text>
  <rect x="182" y="94" width="138" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="251" y="112.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">part 20260929_2</text>
  <text x="251" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">同样独立成 part</text>
  <text x="251" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">小 part 越多越慢</text>
  <rect x="334" y="94" width="138" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="403" y="112.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">part 20260929_3</text>
  <text x="403" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">每个 part 独立目录</text>
  <line x1="500" y1="136" x2="560" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="530" y="131" text-anchor="middle" font-size="7.5" fill="#64748B">后台线程异步 Merge</text>
  <rect x="570" y="94" width="160" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="650" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">更大的 part</text>
  <text x="650" y="129" text-anchor="middle" font-size="7.5" fill="#047857">多个小 part 合并</text>
  <text x="650" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">合并时才去重/重组</text>
  <text x="650" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">最终一致，不是即时</text>
  <text x="380" y="204" text-anchor="middle" font-size="9.5" fill="#B91C1C">写入即追加（log-structured merge 思想），UPDATE/DELETE 走 mutation 异步重写 —— 不要当 OLTP 库用</text>
  <text x="60" y="236" text-anchor="start" font-size="11" fill="#1E3A8A" font-weight="bold">主键索引是「稀疏」的：每 8192 行记一条（index_granularity）</text>
  <rect x="30" y="250" width="104" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="82" y="266" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">mark 0</text>
  <rect x="142" y="250" width="180" height="24" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="232" y="266" text-anchor="middle" font-size="8.5" fill="#334155">user_id=1001</text>
  <text x="360" y="266" text-anchor="middle" font-size="8" fill="#94A3B8">… 8192 行 …</text>
  <rect x="30" y="280" width="104" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="82" y="296" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">mark 1</text>
  <rect x="142" y="280" width="180" height="24" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="232" y="296" text-anchor="middle" font-size="8.5" fill="#334155">user_id=2043</text>
  <text x="360" y="296" text-anchor="middle" font-size="8" fill="#94A3B8">… 8192 行 …</text>
  <rect x="30" y="310" width="104" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="82" y="326" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">mark 2</text>
  <rect x="142" y="310" width="180" height="24" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="232" y="326" text-anchor="middle" font-size="8.5" fill="#334155">user_id=4890</text>
  <text x="360" y="326" text-anchor="middle" font-size="8" fill="#94A3B8">… 8192 行 …</text>
  <rect x="30" y="340" width="104" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="82" y="356" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">mark 3</text>
  <rect x="142" y="340" width="180" height="24" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="232" y="356" text-anchor="middle" font-size="8.5" fill="#334155">user_id=8156</text>
  <rect x="470" y="250" width="260" height="120" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="600" y="274" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">查找 user_id=5000 的过程</text>
  <text x="600" y="296" text-anchor="middle" font-size="8.5" fill="#B45309">① 稀疏索引二分定位两个 mark</text>
  <text x="600" y="314" text-anchor="middle" font-size="8.5" fill="#B45309">② 只解压这两个 granule 的列文件</text>
  <text x="600" y="332" text-anchor="middle" font-size="8.5" fill="#B45309">③ 精确过滤在内存里完成</text>
  <text x="600" y="356" text-anchor="middle" font-size="8.5" fill="#92400E">主键不做唯一约束，只决定</text>
  <text x="600" y="372" text-anchor="middle" font-size="8.5" fill="#92400E">数据在磁盘上的排列顺序</text>
  <text x="380" y="398" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">所以排序键设计 = 查询过滤条件的顺序：把最常等值过滤的列放最前</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
