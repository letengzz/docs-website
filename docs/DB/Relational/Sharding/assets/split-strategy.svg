<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="512" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">拆分策略与分片键设计</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四个拆分方向 + 分片键四条硬要求 + 四类分片算法，选错要重建数据</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四个方向：垂直按业务拆、水平按行拆</text>
  <rect x="30" y="94" width="164" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="112" y="112.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">垂直分库</text>
  <text x="112" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">按业务域拆到不同库</text>
  <text x="112" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">用户库 / 订单库 / 商品库</text>
  <text x="112" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">本质是「服务拆分的副产品」</text>
  <text x="112" y="180.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">边界清晰，但跨库 JOIN 消失</text>
  <rect x="206" y="94" width="164" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="288" y="112.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">垂直分表</text>
  <text x="288" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按冷热字段拆</text>
  <text x="288" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">常用列在前，大字段在后</text>
  <text x="288" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">减少单行长度与 IO</text>
  <text x="288" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">适合宽表与 text/blob</text>
  <rect x="382" y="94" width="164" height="108" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="464" y="112.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">水平分表</text>
  <text x="464" y="129" text-anchor="middle" font-size="7.5" fill="#047857">同结构按行拆</text>
  <text x="464" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">order_0 … order_3</text>
  <text x="464" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">解决单表行数过多</text>
  <text x="464" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">SQL 能力受损最小</text>
  <rect x="558" y="94" width="164" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="640" y="112.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">水平分库</text>
  <text x="640" y="129" text-anchor="middle" font-size="7.5" fill="#B45309">按行拆到不同数据源</text>
  <text x="640" y="146.25" text-anchor="middle" font-size="7.5" fill="#B45309">同时解决容量与写入</text>
  <text x="640" y="163.5" text-anchor="middle" font-size="7.5" fill="#B45309">需要分布式 ID 与事务</text>
  <text x="640" y="180.75" text-anchor="middle" font-size="7.5" fill="#B45309">复杂度最高</text>
  <text x="380" y="220" text-anchor="middle" font-size="10" fill="#6D28D9">实践中的组合：垂直分库（业务边界） + 水平分表（单表行数），水平分库只在写入真的扛不住时启用</text>
  <text x="60" y="252" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">分片键（Sharding Key）选择的四条硬要求</text>
  <rect x="30" y="264" width="380" height="26" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="46" y="281" text-anchor="start" font-size="8.5" fill="#1E3A8A" font-weight="bold">① 出现在绝大多数查询条件里</text>
  <text x="420" y="281" text-anchor="start" font-size="8.5" fill="#334155">90% 以上查询能定位到单个分片</text>
  <rect x="30" y="294" width="380" height="26" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="46" y="311" text-anchor="start" font-size="8.5" fill="#065F46" font-weight="bold">② 基数足够高且分布均匀</text>
  <text x="420" y="311" text-anchor="start" font-size="8.5" fill="#334155">避免热点；状态、性别、类型都不合格</text>
  <rect x="30" y="324" width="380" height="26" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="46" y="341" text-anchor="start" font-size="8.5" fill="#9A3412" font-weight="bold">③ 不可变</text>
  <text x="420" y="341" text-anchor="start" font-size="8.5" fill="#334155">一旦修改就要跨分片搬迁数据</text>
  <rect x="30" y="354" width="380" height="26" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="46" y="371" text-anchor="start" font-size="8.5" fill="#5B21B6" font-weight="bold">④ 与业务主键同源</text>
  <text x="420" y="371" text-anchor="start" font-size="8.5" fill="#334155">订单用 user_id 而非 order_id 分片，才能按用户查全量</text>
  <text x="60" y="396" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">常用分片算法</text>
  <text x="60" y="422" text-anchor="start" font-size="8.5" fill="#1E293B" font-weight="bold">取模 mod</text>
  <text x="220" y="422" text-anchor="start" font-size="8.5" fill="#334155">分布均匀、路由最快</text>
  <text x="450" y="422" text-anchor="start" font-size="8.5" fill="#64748B">扩容需迁移全部数据</text>
  <text x="60" y="446" text-anchor="start" font-size="8.5" fill="#1E293B" font-weight="bold">范围 range</text>
  <text x="220" y="446" text-anchor="start" font-size="8.5" fill="#334155">天然支持归档与区间查询</text>
  <text x="450" y="446" text-anchor="start" font-size="8.5" fill="#64748B">易产生写热点</text>
  <text x="60" y="470" text-anchor="start" font-size="8.5" fill="#1E293B" font-weight="bold">一致性哈希</text>
  <text x="220" y="470" text-anchor="start" font-size="8.5" fill="#334155">扩容只迁移 1/N 数据</text>
  <text x="450" y="470" text-anchor="start" font-size="8.5" fill="#64748B">实现与运维更复杂</text>
  <text x="60" y="494" text-anchor="start" font-size="8.5" fill="#1E293B" font-weight="bold">虚拟桶 / 双倍扩容</text>
  <text x="220" y="494" text-anchor="start" font-size="8.5" fill="#334155">兼顾均匀与扩容成本</text>
  <text x="450" y="494" text-anchor="start" font-size="8.5" fill="#64748B">需要额外维护映射表</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
