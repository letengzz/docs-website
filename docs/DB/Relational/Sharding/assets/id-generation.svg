<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分布式 ID：五种方案的取舍与雪花结构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">分片后 ID 必须全局唯一且趋势递增，否则索引与排序会一起变慢</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">分片后主键不能再靠单库自增：五种方案对照</text>
  <rect x="30" y="94" width="150" height="26" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="105" y="111" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">方案</text>
  <rect x="180" y="94" width="110" height="26" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="235" y="111" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">有序性</text>
  <rect x="290" y="94" width="110" height="26" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="345" y="111" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">性能</text>
  <rect x="400" y="94" width="140" height="26" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="470" y="111" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">外部依赖</text>
  <rect x="540" y="94" width="240" height="26" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="660" y="111" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">主要问题</text>
  <rect x="30" y="120" width="150" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="140" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">UUID v4</text>
  <rect x="180" y="120" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="235" y="140" text-anchor="middle" font-size="8" fill="#334155">无序</text>
  <rect x="290" y="120" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="140" text-anchor="middle" font-size="8" fill="#334155">高（本地生成）</text>
  <rect x="400" y="120" width="140" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="140" text-anchor="middle" font-size="8" fill="#334155">无</text>
  <rect x="540" y="120" width="240" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="140" text-anchor="middle" font-size="8" fill="#334155">36 字符、索引页分裂严重，不推荐做聚簇主键</text>
  <rect x="30" y="154" width="150" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="174" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">数据库自增</text>
  <rect x="180" y="154" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="235" y="174" text-anchor="middle" font-size="8" fill="#334155">有序</text>
  <rect x="290" y="154" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="174" text-anchor="middle" font-size="8" fill="#334155">低（单点）</text>
  <rect x="400" y="154" width="140" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="174" text-anchor="middle" font-size="8" fill="#334155">DB</text>
  <rect x="540" y="154" width="240" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="174" text-anchor="middle" font-size="8" fill="#334155">跨库不唯一；步长方案扩容要重配</text>
  <rect x="30" y="188" width="150" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="208" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">号段模式</text>
  <rect x="180" y="188" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="235" y="208" text-anchor="middle" font-size="8" fill="#334155">整体递增</text>
  <rect x="290" y="188" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="208" text-anchor="middle" font-size="8" fill="#334155">很高（批量取）</text>
  <rect x="400" y="188" width="140" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="208" text-anchor="middle" font-size="8" fill="#334155">DB / Redis</text>
  <rect x="540" y="188" width="240" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="208" text-anchor="middle" font-size="8" fill="#334155">取号段时 DB 抖动会造成尖刺；需双 buffer</text>
  <rect x="30" y="222" width="150" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="242" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">雪花算法 Snowflake</text>
  <rect x="180" y="222" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="235" y="242" text-anchor="middle" font-size="8" fill="#334155">趋势递增</text>
  <rect x="290" y="222" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="242" text-anchor="middle" font-size="8" fill="#334155">很高（本地生成）</text>
  <rect x="400" y="222" width="140" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="242" text-anchor="middle" font-size="8" fill="#334155">无</text>
  <rect x="540" y="222" width="240" height="34" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="242" text-anchor="middle" font-size="8" fill="#334155">强依赖时钟；回拨会重复，必须做回拨保护</text>
  <rect x="30" y="256" width="150" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="276" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">Redis INCR</text>
  <rect x="180" y="256" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="235" y="276" text-anchor="middle" font-size="8" fill="#334155">有序</text>
  <rect x="290" y="256" width="110" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="345" y="276" text-anchor="middle" font-size="8" fill="#334155">高</text>
  <rect x="400" y="256" width="140" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="470" y="276" text-anchor="middle" font-size="8" fill="#334155">Redis</text>
  <rect x="540" y="256" width="240" height="34" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="660" y="276" text-anchor="middle" font-size="8" fill="#334155">多引入一个强依赖组件；持久化与高可用要做好</text>
  <text x="60" y="314" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">雪花算法 64 bit 结构（默认位分配）</text>
  <rect x="30" y="326" width="90" height="44" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="75" y="344" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">1 bit 符号位</text>
  <text x="75" y="360" text-anchor="middle" font-size="7.5" fill="#334155">恒为 0</text>
  <rect x="126" y="326" width="210" height="44" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="231" y="344" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">41 bit 时间戳（毫秒）</text>
  <text x="231" y="360" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可用约 69 年</text>
  <rect x="342" y="326" width="190" height="44" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="437" y="344" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">10 bit 机器 / 数据中心</text>
  <text x="437" y="360" text-anchor="middle" font-size="7.5" fill="#047857">最多 1024 个节点</text>
  <rect x="538" y="326" width="200" height="44" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="638" y="344" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">12 bit 序列号</text>
  <text x="638" y="360" text-anchor="middle" font-size="7.5" fill="#B45309">同毫秒内最多 4096 个</text>
  <text x="380" y="396" text-anchor="middle" font-size="9.5" fill="#6D28D9">选型结论：业务主键用号段或雪花（本地生成、趋势递增），订单号另用「时间 + 业务码 + 随机」面向用户展现</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
