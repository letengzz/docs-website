<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="446" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">跨分片查询与分布式事务：四类昂贵 SQL</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">分片不是「透明的」，它会永久改变你写 SQL 的自由度</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">分片之后，这四类 SQL 会变得昂贵</text>
  <rect x="30" y="94" width="356" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="208" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">跨分片排序</text>
  <text x="208" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">ORDER BY 非分片键 → 各分片各排再归并</text>
  <text x="208" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">对策：让分片键进排序前缀</text>
  <text x="208" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">或把结果限制在 Top-N（归并代价可控）</text>
  <rect x="402" y="94" width="356" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="580" y="112.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">深分页</text>
  <text x="580" y="129" text-anchor="middle" font-size="8" fill="#B45309">LIMIT 100000, 20 → 每片都要扫 100020 行</text>
  <text x="580" y="147.4" text-anchor="middle" font-size="8" fill="#B45309">对策：游标分页（记住上一页末位）</text>
  <text x="580" y="165.8" text-anchor="middle" font-size="8" fill="#B45309">或改用「按时间范围筛选 + 索引」</text>
  <rect x="30" y="200" width="356" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="208" y="218.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">跨分片 JOIN</text>
  <text x="208" y="235" text-anchor="middle" font-size="8" fill="#6D28D9">两表分片键不同 → 笛卡尔积风险</text>
  <text x="208" y="253.4" text-anchor="middle" font-size="8" fill="#6D28D9">对策：绑定表（同键同算法）</text>
  <text x="208" y="271.8" text-anchor="middle" font-size="8" fill="#6D28D9">广播表（小字典表全量复制）或应用层组装</text>
  <rect x="402" y="200" width="356" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="580" y="218.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">分布式事务</text>
  <text x="580" y="235" text-anchor="middle" font-size="8" fill="#B91C1C">跨库写无法用单机事务保证</text>
  <text x="580" y="253.4" text-anchor="middle" font-size="8" fill="#B91C1C">对策：优先「本地事务 + 消息 + 对账」</text>
  <text x="580" y="271.8" text-anchor="middle" font-size="8" fill="#B91C1C">强一致场景才上 XA / Seata AT</text>
  <text x="60" y="320" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">聚合函数的改写陷阱（最容易出错的一类）</text>
  <rect x="30" y="332" width="130" height="22" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="95" y="347" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">AVG(x)</text>
  <text x="172" y="347" text-anchor="start" font-size="8.5" fill="#334155">改写为 SUM(x)/SUM(count)，否则是「各分片平均值的平均」，不是整体平均</text>
  <rect x="30" y="358" width="130" height="22" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="95" y="373" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">COUNT(DISTINCT x)</text>
  <text x="172" y="373" text-anchor="start" font-size="8.5" fill="#334155">需归并去重，代价高；能换成「先分组再计数」就别用</text>
  <rect x="30" y="384" width="130" height="22" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="95" y="399" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">ORDER BY + LIMIT</text>
  <text x="172" y="399" text-anchor="start" font-size="8.5" fill="#334155">排序字段必须带分片键，否则每片都要返回全量再归并</text>
  <rect x="30" y="410" width="130" height="22" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="95" y="425" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">GROUP BY 非分片键</text>
  <text x="172" y="425" text-anchor="start" font-size="8.5" fill="#334155">各分片分组结果再合并，注意分片边界处的分组可能被拆开</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
