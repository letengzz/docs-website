<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分库分表问题排查决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">查不到、变慢了、对不上：三类问题的排查入口完全不同</text>
  <rect x="300" y="76" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">分片后出问题</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分清是「设计问题」</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">还是「使用问题」</text>
  <line x1="380" y1="128" x2="380" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="148" x2="120" y2="176" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="176" width="180" height="116" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="120" y="194.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">查不到数据</text>
  <text x="120" y="211" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 分片键是否传了</text>
  <text x="120" y="228.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 值是否落在边界</text>
  <text x="120" y="245.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">（取模负数 / 大小写）</text>
  <text x="120" y="262.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 数据是否真在目标分片</text>
  <text x="120" y="280" text-anchor="middle" font-size="7.5" fill="#B91C1C">④ 广播表是否漏同步</text>
  <line x1="380" y1="148" x2="380" y2="176" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="290" y="176" width="180" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="194.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">性能反而更差</text>
  <text x="380" y="211" text-anchor="middle" font-size="7.5" fill="#B45309">① SQL 是否全路由（广播）</text>
  <text x="380" y="228.25" text-anchor="middle" font-size="7.5" fill="#B45309">② 深分页是否未改写</text>
  <text x="380" y="245.5" text-anchor="middle" font-size="7.5" fill="#B45309">③ 归并是否在内存做</text>
  <text x="380" y="262.75" text-anchor="middle" font-size="7.5" fill="#B45309">④ 分片是否倾斜（热点）</text>
  <text x="380" y="280" text-anchor="middle" font-size="7.5" fill="#B45309">⑤ 是否丢掉原有索引</text>
  <line x1="380" y1="148" x2="640" y2="176" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="550" y="176" width="180" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="640" y="194.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">数据不一致</text>
  <text x="640" y="211" text-anchor="middle" font-size="7.5" fill="#6D28D9">① 双写是否同一事务</text>
  <text x="640" y="228.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">② 迁移是否漏行</text>
  <text x="640" y="245.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">③ 分布式事务是否降级</text>
  <text x="640" y="262.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">④ 是否为「部分成功」</text>
  <text x="640" y="280" text-anchor="middle" font-size="7.5" fill="#6D28D9">⑤ 对账任务是否在跑</text>
  <text x="380" y="318" text-anchor="middle" font-size="10" fill="#1E3A8A">通用顺序：先看路由结果（这条 SQL 打到几个分片）→ 再看执行计划 → 最后才怀疑中间件</text>
  <text x="380" y="342" text-anchor="middle" font-size="9.5" fill="#B91C1C">最有效的动作：打开 SQL 路由日志，把「以为只查一片」的查询真实打到几片看清楚</text>
  <text x="380" y="364" text-anchor="middle" font-size="9.5" fill="#64748B">反面教材：一遇问题就加机器或改分片数——分片数是不可逆决策，改它等于重做一次迁移</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
