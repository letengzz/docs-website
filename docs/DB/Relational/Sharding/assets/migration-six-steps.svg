<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">平滑迁移六步法：从单库到分片的可控路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">核心原则：每一步都可停、可回滚，且「读」的切换永远排在「写」的切换之后</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">六步迁移：每一步都能停、都能回滚</text>
  <rect x="30" y="94" width="226" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">① 评估与定分片键</text>
  <text x="143" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">统计慢 SQL 与增长曲线</text>
  <text x="143" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">确定分片键与分片数</text>
  <text x="143" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">写入无法回退的决策</text>
  <line x1="256" y1="140" x2="268" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="94" width="226" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 建目标结构</text>
  <text x="381" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">建分片表与索引</text>
  <text x="381" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">准备分布式 ID 发号</text>
  <text x="381" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">双写前不动生产数据</text>
  <line x1="494" y1="140" x2="506" y2="140" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="94" width="226" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">③ 开启双写</text>
  <text x="619" y="129" text-anchor="middle" font-size="7.5" fill="#047857">新旧同写（同一事务）</text>
  <text x="619" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">写失败以旧为准并告警</text>
  <text x="619" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">此时读仍在旧表</text>
  <rect x="30" y="200" width="226" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="143" y="218.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 迁移与校验</text>
  <text x="143" y="235" text-anchor="middle" font-size="7.5" fill="#0F766E">存量数据分批搬</text>
  <text x="143" y="252.25" text-anchor="middle" font-size="7.5" fill="#0F766E">逐片行数 + 抽样比对</text>
  <text x="143" y="269.5" text-anchor="middle" font-size="7.5" fill="#0F766E">不一致则重跑该批</text>
  <line x1="256" y1="246" x2="268" y2="246" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="200" width="226" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="218.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">⑤ 灰度切读</text>
  <text x="381" y="235" text-anchor="middle" font-size="7.5" fill="#B45309">按用户/租户切 1% → 全量</text>
  <text x="381" y="252.25" text-anchor="middle" font-size="7.5" fill="#B45309">对比新旧结果差异</text>
  <text x="381" y="269.5" text-anchor="middle" font-size="7.5" fill="#B45309">异常一键切回旧表</text>
  <line x1="494" y1="246" x2="506" y2="246" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="200" width="226" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="619" y="218.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">⑥ 停旧路径</text>
  <text x="619" y="235" text-anchor="middle" font-size="7.5" fill="#B91C1C">确认无回滚需求</text>
  <text x="619" y="252.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">停双写、下线旧表</text>
  <text x="619" y="269.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">保留冷备与回滚脚本</text>
  <line x1="700" y1="140" x2="730" y2="140" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="730" y1="140" x2="730" y2="293" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="730" y1="293" x2="256" y2="293" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="bold">三个必须写进方案的判据</text>
  <rect x="30" y="334" width="110" height="22" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="85" y="349" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">切读判据</text>
  <text x="152" y="349" text-anchor="start" font-size="8.5" fill="#334155">新旧结果差异率 &lt; 0.01% 且持续 24 小时</text>
  <rect x="30" y="360" width="110" height="22" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="85" y="375" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">回滚判据</text>
  <text x="152" y="375" text-anchor="start" font-size="8.5" fill="#334155">任一环节异常 → 切回旧读，旧表数据仍然完整</text>
  <rect x="30" y="386" width="110" height="22" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="85" y="401" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">验收判据</text>
  <text x="152" y="401" text-anchor="start" font-size="8.5" fill="#334155">核心查询 P99 不劣化、行数与金额双对平</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
