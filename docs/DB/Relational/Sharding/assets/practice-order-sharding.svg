<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="388" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：订单系统分库分表</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">用户与订单用同一分片键做成绑定表，跨分片 JOIN 与跨分片事务都被提前消掉</text>
  <rect x="30" y="76" width="160" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="110" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">user 表</text>
  <text x="110" y="111" text-anchor="middle" font-size="7" fill="#6D28D9">按 user_id 分 2 库</text>
  <text x="110" y="127.1" text-anchor="middle" font-size="7" fill="#6D28D9">每个库 2 张表</text>
  <text x="110" y="143.2" text-anchor="middle" font-size="7" fill="#6D28D9">共 4 个分片</text>
  <rect x="230" y="76" width="160" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="310" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">order 表（绑定表）</text>
  <text x="310" y="111" text-anchor="middle" font-size="7" fill="#1D4ED8">同 user_id、同算法</text>
  <text x="310" y="127.1" text-anchor="middle" font-size="7" fill="#1D4ED8">与 user 同分片</text>
  <text x="310" y="143.2" text-anchor="middle" font-size="7" fill="#1D4ED8">JOIN 不跨库</text>
  <rect x="430" y="76" width="160" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="510" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">order_item 表（绑定表）</text>
  <text x="510" y="111" text-anchor="middle" font-size="7" fill="#047857">同 user_id、同算法</text>
  <text x="510" y="127.1" text-anchor="middle" font-size="7" fill="#047857">与 order 同分片</text>
  <text x="510" y="143.2" text-anchor="middle" font-size="7" fill="#047857">三表关联不跨库</text>
  <rect x="630" y="76" width="100" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="680" y="94.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">字典表（广播）</text>
  <text x="680" y="111" text-anchor="middle" font-size="7" fill="#B45309">小表全量复制</text>
  <text x="680" y="127.1" text-anchor="middle" font-size="7" fill="#B45309">每片一份</text>
  <text x="680" y="143.2" text-anchor="middle" font-size="7" fill="#B45309">只读</text>
  <line x1="190" y1="107" x2="230" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="390" y1="107" x2="430" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="590" y1="107" x2="630" y2="107" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="60" y="166" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">分片规则（ShardingSphere 5.5.x YAML 片段）</text>
  <text x="60" y="182" text-anchor="start" font-size="8" fill="#334155">rules:</text>
  <text x="60" y="200" text-anchor="start" font-size="8" fill="#334155">  - !SHARDING</text>
  <text x="60" y="218" text-anchor="start" font-size="8" fill="#334155">      tables:</text>
  <text x="60" y="236" text-anchor="start" font-size="8" fill="#334155">        t_order:</text>
  <text x="60" y="254" text-anchor="start" font-size="8" fill="#334155">          actualDataNodes: ds_${0..1}.t_order_${0..1}</text>
  <text x="60" y="272" text-anchor="start" font-size="8" fill="#334155">          tableStrategy: { standard: { shardingColumn: user_id,</text>
  <text x="60" y="290" text-anchor="start" font-size="8" fill="#334155">            shardingAlgorithmName: order_inline } }</text>
  <text x="60" y="308" text-anchor="start" font-size="8" fill="#334155">          databaseStrategy: { standard: { shardingColumn: user_id,</text>
  <text x="60" y="326" text-anchor="start" font-size="8" fill="#334155">            shardingAlgorithmName: db_inline } }</text>
  <text x="430" y="166" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">关键实测验证点</text>
  <text x="430" y="182" text-anchor="start" font-size="8" fill="#065F46">① 带 user_id 的查询只命中 1 个分片（看路由日志）</text>
  <text x="430" y="200" text-anchor="start" font-size="8" fill="#065F46">② 不带 user_id 的查询走 4 个分片（全路由，需评估）</text>
  <text x="430" y="218" text-anchor="start" font-size="8" fill="#065F46">③ 跨分片分页的结果总数与单库一致</text>
  <text x="430" y="236" text-anchor="start" font-size="8" fill="#065F46">④ order 与 order_item 的 JOIN 落在同一分片</text>
  <text x="430" y="254" text-anchor="start" font-size="8" fill="#065F46">⑤ 分片内自增（雪花）无重复、趋势递增</text>
  <text x="430" y="272" text-anchor="start" font-size="8" fill="#065F46">⑥ 迁移后行数 + 金额双对平</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#B91C1C">验收收尾：用 SQL 路由日志证明「该单片的单片、该全路由的全路由」，而不是「看起来能跑就行」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
