<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">要不要分库分表：一张决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先把「SQL 问题」「读瓶颈」「容量/写入瓶颈」分清，再决定动作</text>
  <rect x="300" y="76" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">数据库扛不住了</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">别急着拆</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">先定位瓶颈类型</text>
  <line x1="380" y1="128" x2="380" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="280" y="152" width="200" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="170.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">瓶颈在哪一类？</text>
  <text x="380" y="187" text-anchor="middle" font-size="7.5" fill="#1D4ED8">三类问题的对策完全不同</text>
  <line x1="380" y1="202" x2="380" y2="218" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="130" y1="218" x2="630" y2="218" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="130" y1="218" x2="130" y2="236" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="218" x2="380" y2="236" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="630" y1="218" x2="630" y2="236" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="60" y="236" width="150" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="135" y="254.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">SQL / 索引问题</text>
  <text x="135" y="271" text-anchor="middle" font-size="7" fill="#047857">表现：个别查询慢、CPU 高但数据量不大</text>
  <text x="135" y="287.1" text-anchor="middle" font-size="7" fill="#047857">对策：执行计划 → 加索引 → 改写 SQL</text>
  <text x="135" y="303.2" text-anchor="middle" font-size="7" fill="#047857">结论：不需要分片</text>
  <rect x="310" y="236" width="150" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="385" y="254.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">读多写少</text>
  <text x="385" y="271" text-anchor="middle" font-size="7" fill="#1D4ED8">表现：读 QPS 高、主库压力集中</text>
  <text x="385" y="287.1" text-anchor="middle" font-size="7" fill="#1D4ED8">对策：加从库 + 读写分离 + 缓存</text>
  <text x="385" y="303.2" text-anchor="middle" font-size="7" fill="#1D4ED8">结论：优先读写分离</text>
  <rect x="560" y="236" width="150" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="635" y="254.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">单机容量 / 写入瓶颈</text>
  <text x="635" y="271" text-anchor="middle" font-size="7" fill="#B91C1C">表现：单表 &gt; 数千万且持续增长、写入排队</text>
  <text x="635" y="287.1" text-anchor="middle" font-size="7" fill="#B91C1C">对策：归档冷数据 → 再评估分片</text>
  <text x="635" y="303.2" text-anchor="middle" font-size="7" fill="#B91C1C">结论：这时才轮到分片</text>
  <text x="380" y="356" text-anchor="middle" font-size="10" fill="#B91C1C">分片是「最后手段」：一旦拆开，跨分片 JOIN、全局排序、分布式事务都会变成永久成本</text>
  <text x="380" y="380" text-anchor="middle" font-size="9.5" fill="#64748B">可逆性递减：加索引 &lt; 加从库 &lt; 加缓存 &lt; 归档 &lt; 分片。能用前面的，就别用后面的</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
