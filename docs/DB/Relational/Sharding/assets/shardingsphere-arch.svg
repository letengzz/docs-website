<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="394" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">ShardingSphere 三种形态与五步内核</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">解析 → 路由 → 改写 → 执行 → 归并：理解这五步，才能预判每条 SQL 的执行代价</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">三种接入形态：选哪一种取决于「能不能改代码」</text>
  <rect x="30" y="94" width="226" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">ShardingSphere-JDBC</text>
  <text x="143" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">以 jar 形式嵌入应用</text>
  <text x="143" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">零额外网络跳数、性能最好</text>
  <text x="143" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">需改数据源配置与依赖</text>
  <text x="143" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">适合：Java 同构应用</text>
  <rect x="268" y="94" width="226" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">ShardingSphere-Proxy</text>
  <text x="381" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">独立进程，对应用伪装成 MySQL</text>
  <text x="381" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">任何语言与客户端都能接</text>
  <text x="381" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">多一跳网络、需独立运维</text>
  <text x="381" y="180.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">适合：异构语言、存量系统</text>
  <rect x="506" y="94" width="226" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">ShardingSphere-Agent</text>
  <text x="619" y="129" text-anchor="middle" font-size="7.5" fill="#047857">无侵入，挂 JVM agent</text>
  <text x="619" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">只做可观测与治理</text>
  <text x="619" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">不接管 SQL 路由</text>
  <text x="619" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">适合：先观测再决定改造</text>
  <text x="380" y="212" text-anchor="middle" font-size="10" fill="#6D28D9">混合部署是常态：核心写路径用 JDBC，数据平台与运维工具走 Proxy，两侧共享同一份规则</text>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">SQL 执行五步内核（所有形态共用）</text>
  <rect x="30" y="256" width="132" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="274.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">① 解析</text>
  <text x="96" y="291" text-anchor="middle" font-size="7.5" fill="#334155">SQL → AST</text>
  <text x="96" y="308.25" text-anchor="middle" font-size="7.5" fill="#334155">多方言支持</text>
  <line x1="162" y1="293" x2="172" y2="293" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="172" y="256" width="132" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="238" y="274.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 路由</text>
  <text x="238" y="291" text-anchor="middle" font-size="7.5" fill="#1D4ED8">算分片 → 定位数据源</text>
  <text x="238" y="308.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">单播 / 广播 / 多播</text>
  <line x1="304" y1="293" x2="314" y2="293" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="256" width="132" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="274.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">③ 改写</text>
  <text x="380" y="291" text-anchor="middle" font-size="7.5" fill="#6D28D9">表名补后缀</text>
  <text x="380" y="308.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">分页与聚合改写</text>
  <line x1="446" y1="293" x2="456" y2="293" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="456" y="256" width="132" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="522" y="274.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">④ 执行</text>
  <text x="522" y="291" text-anchor="middle" font-size="7.5" fill="#B45309">多数据源并行</text>
  <text x="522" y="308.25" text-anchor="middle" font-size="7.5" fill="#B45309">连接复用与限流</text>
  <line x1="588" y1="293" x2="598" y2="293" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="598" y="256" width="132" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="664" y="274.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">⑤ 归并</text>
  <text x="664" y="291" text-anchor="middle" font-size="7.5" fill="#047857">排序 / 聚合 / 分页</text>
  <text x="664" y="308.25" text-anchor="middle" font-size="7.5" fill="#047857">内存或流式</text>
  <text x="380" y="356" text-anchor="middle" font-size="10" fill="#065F46">治理入口：DistSQL（用 SQL 语法管规则）与治理中心，规则改动不必改代码重启</text>
  <text x="380" y="378" text-anchor="middle" font-size="9.5" fill="#B91C1C">注意：中间件能替你路由与归并，但不能替你选分片键——那是业务决策</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
