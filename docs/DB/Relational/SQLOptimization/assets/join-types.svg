<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="320" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">JOIN 三种连接算法</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="250" height="180" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="155" y="110" fill="#4338ca" font-weight="bold">NLJ 嵌套循环</text>
    <text x="155" y="138" fill="#4b5563" font-size="11">驱动表每行 → 内层表查索引</text>
    <text x="155" y="160" fill="#4b5563" font-size="11">被驱动表必须有索引</text>
    <text x="155" y="195" fill="#6b7280" font-size="10">适用：小表驱动大表</text>
    <text x="155" y="215" fill="#6b7280" font-size="10">最常用，性能可控</text>
    <rect x="300" y="80" width="250" height="180" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="425" y="110" fill="#b45309" font-weight="bold">BNL 块嵌套循环</text>
    <text x="425" y="138" fill="#4b5563" font-size="11">驱动表结果放入 Join Buffer</text>
    <text x="425" y="160" fill="#4b5563" font-size="11">批量与被驱动表匹配</text>
    <text x="425" y="195" fill="#6b7280" font-size="10">适用：无索引等值连接</text>
    <text x="425" y="215" fill="#6b7280" font-size="10">8.0.20 后不再使用</text>
    <rect x="570" y="80" width="240" height="180" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="690" y="110" fill="#047857" font-weight="bold">Hash Join</text>
    <text x="690" y="138" fill="#4b5563" font-size="11">小表建哈希表，大表探测</text>
    <text x="690" y="160" fill="#4b5563" font-size="11">无索引也高效（等值连接）</text>
    <text x="690" y="195" fill="#6b7280" font-size="10">8.0.18+ 默认可用</text>
    <text x="690" y="215" fill="#6b7280" font-size="10">适合大表无索引场景</text>
  </g>
  <text x="420" y="290" text-anchor="middle" font-size="13" fill="#475569">实践：被驱动表连接字段必有索引（NLJ）；无索引大表等值连接走 Hash Join；避免笛卡尔积</text>
</svg>
