<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="280" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">SQL 优化方法论</text>
  <g font-size="13" text-anchor="middle">
    <rect x="25" y="100" width="140" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="95" y="130" fill="#4338ca" font-weight="bold">1. 发现问题</text>
    <text x="95" y="152" fill="#4b5563" font-size="11">慢查询日志</text>
    <text x="95" y="172" fill="#6b7280" font-size="10">监控告警 / 用户反馈</text>
    <rect x="205" y="100" width="140" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="275" y="130" fill="#b45309" font-weight="bold">2. 定位分析</text>
    <text x="275" y="152" fill="#4b5563" font-size="11">EXPLAIN 执行计划</text>
    <text x="275" y="172" fill="#6b7280" font-size="10">锁等待 / 表结构</text>
    <rect x="385" y="100" width="140" height="90" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="455" y="130" fill="#be185d" font-weight="bold">3. 优化方案</text>
    <text x="455" y="152" fill="#4b5563" font-size="11">加索引 / 改写 SQL</text>
    <text x="455" y="172" fill="#6b7280" font-size="10">分页 / JOIN / 结构</text>
    <rect x="565" y="100" width="140" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="635" y="130" fill="#047857" font-weight="bold">4. 验证回归</text>
    <text x="635" y="152" fill="#4b5563" font-size="11">EXPLAIN ANALYZE</text>
    <text x="635" y="172" fill="#6b7280" font-size="10">耗时对比 / 压测</text>
    <rect x="745" y="100" width="80" height="90" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="785" y="130" fill="#6d28d9" font-weight="bold">5. 上线</text>
    <text x="785" y="152" fill="#4b5563" font-size="11">监控</text>
    <text x="785" y="172" fill="#6b7280" font-size="10">持续观察</text>
  </g>
  <path d="M 170 145 H 198" stroke="#6366f1" stroke-width="2.5" marker-end="url(#o1)"/>
  <path d="M 350 145 H 378" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#o1)"/>
  <path d="M 530 145 H 558" stroke="#ec4899" stroke-width="2.5" marker-end="url(#o1)"/>
  <path d="M 710 145 H 738" stroke="#10b981" stroke-width="2.5" marker-end="url(#o1)"/>
  <text x="420" y="240" text-anchor="middle" font-size="13" fill="#475569">原则：先量化再优化；一次只改一个变量；上线后必须验证与回归，防止“优化”引入新问题</text>
  <defs>
    <marker id="o1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
