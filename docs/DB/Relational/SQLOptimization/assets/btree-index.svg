<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">B+ 树索引结构（InnoDB）</text>
  <!-- root -->
  <g>
    <rect x="310" y="70" width="200" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="410" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">根节点（页）</text>
  </g>
  <path d="M 360 120 V 150" stroke="#6366f1" stroke-width="2" marker-end="url(#t1)"/>
  <path d="M 460 120 V 150" stroke="#6366f1" stroke-width="2" marker-end="url(#t1)"/>
  <!-- internal -->
  <g>
    <rect x="90" y="155" width="180" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="180" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">内部节点 1</text>
    <rect x="320" y="155" width="180" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="410" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">内部节点 2</text>
    <rect x="550" y="155" width="180" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="640" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">内部节点 3</text>
  </g>
  <path d="M 150 205 V 240" stroke="#10b981" stroke-width="2" marker-end="url(#t1)"/>
  <path d="M 410 205 V 240" stroke="#10b981" stroke-width="2" marker-end="url(#t1)"/>
  <path d="M 640 205 V 240" stroke="#10b981" stroke-width="2" marker-end="url(#t1)"/>
  <!-- leaf -->
  <g>
    <rect x="60" y="245" width="200" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">叶子节点（有序链表）</text>
    <rect x="310" y="245" width="200" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="410" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">叶子节点（有序链表）</text>
    <rect x="560" y="245" width="200" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="660" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">叶子节点（有序链表）</text>
  </g>
  <path d="M 265 268 H 303" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 515 268 H 553" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="330" text-anchor="middle" font-size="13" fill="#475569">叶子节点存数据（聚簇索引）或主键（二级索引），双向链表相连 → 范围查询高效、回表定位</text>
  <defs>
    <marker id="t1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
