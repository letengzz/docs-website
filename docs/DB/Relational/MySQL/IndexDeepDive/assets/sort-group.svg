<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sg-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .idx { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .fs { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="idx" x="40" y="40" width="240" height="70"/>
  <text x="160" y="70">索引排序</text>
  <text class="small" x="160" y="92">ORDER BY 与索引顺序一致</text>
  <text class="small" x="160" y="108">Extra 无 filesort</text>

  <rect class="fs" x="310" y="40" width="240" height="70"/>
  <text x="430" y="70">filesort</text>
  <text class="small" x="430" y="92">内存排序 / 磁盘归并</text>
  <text class="small" x="430" y="108">Extra: Using filesort</text>

  <rect class="mid" x="580" y="40" width="240" height="70"/>
  <text x="700" y="70">MRR 多范围读</text>
  <text class="small" x="700" y="92">回表按主键排序批量读取</text>
  <text class="small" x="700" y="108">减少随机 IO</text>

  <line x1="280" y1="75" x2="310" y2="75" marker-end="url(#sg-arrow)"/>
  <line x1="550" y1="75" x2="580" y2="75" marker-end="url(#sg-arrow)"/>

  <rect class="fs" x="310" y="180" width="240" height="60"/>
  <text x="430" y="208">GROUP BY 优化</text>
  <text class="small" x="430" y="228">索引有序 → 免临时表（Using temporary）</text>

  <line x1="700" y1="110" x2="700" y2="150" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="700" y1="150" x2="555" y2="180" marker-end="url(#sg-arrow)"/>

  <text class="small" x="430" y="280">排序优化：让 ORDER BY/GROUP BY 列与联合索引顺序一致</text>
  <text class="small" x="430" y="300">降序索引（8.0+）：ORDER BY a DESC 直接走索引</text>
  <text class="small" x="430" y="330">filesort 不一定慢：数据量小时内存排序很快，EXPLAIN 确认</text>
</svg>
