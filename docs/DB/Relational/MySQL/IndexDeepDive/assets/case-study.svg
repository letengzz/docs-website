<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cs-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .out { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="200" height="70"/>
  <text x="140" y="92">慢查询基线</text>
  <text class="small" x="140" y="112">3.2s / 全表扫描</text>

  <rect class="mid" x="310" y="60" width="240" height="70"/>
  <text x="430" y="92">定位与优化</text>
  <text class="small" x="430" y="112">EXPLAIN → 联合索引</text>

  <rect class="out" x="620" y="60" width="200" height="70"/>
  <text x="720" y="92">复测对比</text>
  <text class="small" x="720" y="112">18ms / Index Scan</text>

  <line x1="240" y1="95" x2="310" y2="95" marker-end="url(#cs-arrow)"/>
  <line x1="550" y1="95" x2="620" y2="95" marker-end="url(#cs-arrow)"/>

  <rect class="out" x="310" y="200" width="240" height="54"/>
  <text x="430" y="228">沉淀经验</text>
  <text class="small" x="430" y="246">索引设计清单 + 监控</text>

  <line x1="720" y1="130" x2="720" y2="170" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="720" y1="170" x2="555" y2="200" marker-end="url(#cs-arrow)"/>

  <text class="small" x="430" y="295">案例覆盖：慢查询定位、联合索引、覆盖索引、索引下推、排序优化</text>
  <text class="small" x="430" y="315">验证：EXPLAIN ANALYZE 前后对比 + rows 减少</text>
</svg>
