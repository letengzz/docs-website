<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cv-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .bad { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .good { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="bad" x="40" y="40" width="240" height="70"/>
  <text x="160" y="70">无覆盖：回表</text>
  <text class="small" x="160" y="92">索引查到主键 → 回表取整行</text>
  <text class="small" x="160" y="108">Extra: Using where</text>

  <rect class="good" x="310" y="40" width="240" height="70"/>
  <text x="430" y="70">覆盖索引</text>
  <text class="small" x="430" y="92">查询列都在索引中</text>
  <text class="small" x="430" y="108">Extra: Using index</text>

  <rect class="good" x="580" y="40" width="240" height="70"/>
  <text x="700" y="70">索引下推 ICP</text>
  <text class="small" x="700" y="92">联合索引无法利用的列下推过滤</text>
  <text class="small" x="700" y="108">Extra: Using index condition</text>

  <line x1="280" y1="75" x2="310" y2="75" marker-end="url(#cv-arrow)"/>
  <line x1="550" y1="75" x2="580" y2="75" marker-end="url(#cv-arrow)"/>

  <rect class="mid" x="310" y="180" width="240" height="60"/>
  <text x="430" y="208">覆盖索引写法</text>
  <text class="small" x="430" y="228">CREATE INDEX idx ON t (a,b) INCLUDE?</text>

  <rect class="mid" x="580" y="180" width="240" height="60"/>
  <text x="700" y="208">ICP 适用</text>
  <text class="small" x="700" y="228">联合索引 (a,b)，WHERE a=? AND b LIKE</text>

  <text class="small" x="430" y="290">覆盖索引：减少回表 → 减少 IO，性能接近「索引即表」</text>
  <text class="small" x="430" y="310">ICP：把 Server 层过滤下推到引擎层，减少回表次数</text>
  <text class="small" x="430" y="330">InnoDB 无 INCLUDE 语法，用「列补进索引」实现覆盖</text>
</svg>
