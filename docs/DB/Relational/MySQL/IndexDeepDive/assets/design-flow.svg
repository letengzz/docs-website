<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="df-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .out { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="40" y="60" width="230" height="70"/>
  <text x="155" y="90">1. 分析查询</text>
  <text class="small" x="155" y="112">高频 SQL / 慢查询日志</text>

  <rect class="step" x="315" y="60" width="230" height="70"/>
  <text x="430" y="90">2. 设计索引</text>
  <text class="small" x="430" y="112">等值前 / 范围后 / 覆盖</text>

  <rect class="step" x="590" y="60" width="230" height="70"/>
  <text x="705" y="90">3. 验证计划</text>
  <text class="small" x="705" y="112">EXPLAIN 看 key/rows/Extra</text>

  <line x1="270" y1="95" x2="315" y2="95" marker-end="url(#df-arrow)"/>
  <line x1="545" y1="95" x2="590" y2="95" marker-end="url(#df-arrow)"/>

  <rect class="out" x="315" y="200" width="230" height="60"/>
  <text x="430" y="228">4. 监控维护</text>
  <text class="small" x="430" y="248">冗余检查 / 不可见索引 / 重建</text>

  <line x1="705" y1="130" x2="705" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="705" y1="175" x2="555" y2="200" marker-end="url(#df-arrow)"/>

  <text class="small" x="430" y="300">原则：少量精良索引 &gt; 大量冗余索引；每多一个索引都增加写入成本</text>
  <text class="small" x="430" y="320">工具：sys.schema_unused_indexes / performance_schema 索引统计</text>
</svg>
