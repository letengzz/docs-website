<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .root { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .leaf { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 6; }
    .data { fill: #f3f0ff; stroke: #7b5cd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="root" x="370" y="30" width="120" height="46"/>
  <text x="430" y="58">根节点</text>

  <line x1="400" y1="76" x2="200" y2="130" marker-end="url(#bt-arrow)"/>
  <line x1="460" y1="76" x2="660" y2="130" marker-end="url(#bt-arrow)"/>

  <rect class="mid" x="110" y="132" width="180" height="46"/>
  <text x="200" y="160">中间节点（目录）</text>
  <rect class="mid" x="570" y="132" width="180" height="46"/>
  <text x="660" y="160">中间节点（目录）</text>

  <line x1="170" y1="178" x2="80" y2="235" marker-end="url(#bt-arrow)"/>
  <line x1="230" y1="178" x2="320" y2="235" marker-end="url(#bt-arrow)"/>
  <line x1="620" y1="178" x2="530" y2="235" marker-end="url(#bt-arrow)"/>
  <line x1="700" y1="178" x2="780" y2="235" marker-end="url(#bt-arrow)"/>

  <rect class="leaf" x="30" y="237" width="100" height="44"/>
  <text x="80" y="264">叶子 1</text>
  <rect class="leaf" x="270" y="237" width="100" height="44"/>
  <text x="320" y="264">叶子 2</text>
  <rect class="leaf" x="480" y="237" width="100" height="44"/>
  <text x="530" y="264">叶子 3</text>
  <rect class="leaf" x="730" y="237" width="100" height="44"/>
  <text x="780" y="264">叶子 4</text>

  <line x1="130" y1="259" x2="270" y2="259" stroke="#3aa76d" stroke-dasharray="5 4" marker-end="url(#bt-arrow)"/>
  <line x1="370" y1="259" x2="480" y2="259" stroke="#3aa76d" stroke-dasharray="5 4" marker-end="url(#bt-arrow)"/>
  <line x1="580" y1="259" x2="730" y2="259" stroke="#3aa76d" stroke-dasharray="5 4" marker-end="url(#bt-arrow)"/>

  <rect class="data" x="300" y="320" width="260" height="46"/>
  <text x="430" y="348">叶子节点：键 + 主键/行指针 + 双向链表</text>

  <text class="small" x="430" y="375">B+ 树特点：矮胖（扇出大）、叶子有序、范围查询高效</text>
</svg>
