<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pa-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .feat { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .use { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="feat" x="40" y="40" width="240" height="70"/>
  <text x="160" y="70">JSONB 文档能力</text>
  <text class="small" x="160" y="92">GIN 索引 / 路径查询</text>

  <rect class="feat" x="310" y="40" width="240" height="70"/>
  <text x="430" y="70">全文检索</text>
  <text class="small" x="430" y="92">tsvector / tsquery / 中文分词</text>

  <rect class="feat" x="580" y="40" width="240" height="70"/>
  <text x="700" y="70">分区表</text>
  <text class="small" x="700" y="92">范围 / 列表 / 哈希分区</text>

  <rect class="use" x="40" y="160" width="240" height="60"/>
  <text x="160" y="188">扩展生态</text>
  <text class="small" x="160" y="206">PostGIS / pgvector / pg_stat_statements</text>

  <rect class="use" x="310" y="160" width="240" height="60"/>
  <text x="430" y="188">物化视图</text>
  <text class="small" x="430" y="206">复杂查询预计算</text>

  <rect class="use" x="580" y="160" width="240" height="60"/>
  <text x="700" y="188">视图 / 存储过程 / 触发器</text>
  <text class="small" x="700" y="206">PL/pgSQL 等过程语言</text>

  <text class="small" x="430" y="270">JSONB：文档数据库能力融入关系型，灵活与约束兼得</text>
  <text class="small" x="430" y="290">pgvector：向量检索，AI 应用（RAG）常用</text>
  <text class="small" x="430" y="330">适合：复杂查询、地理空间、全文检索、混合数据模型</text>
</svg>
