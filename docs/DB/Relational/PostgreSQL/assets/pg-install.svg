<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pi-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .ok { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="40" y="60" width="230" height="70"/>
  <text x="155" y="90">1. 安装</text>
  <text class="small" x="155" y="112">apt / yum / 官方安装包 / Docker</text>

  <rect class="step" x="315" y="60" width="230" height="70"/>
  <text x="430" y="90">2. 初始化集群</text>
  <text class="small" x="430" y="112">initdb / postgresql.conf</text>

  <rect class="step" x="590" y="60" width="230" height="70"/>
  <text x="705" y="90">3. 启动与连接</text>
  <text class="small" x="705" y="112">pg_ctl / psql</text>

  <line x1="270" y1="95" x2="315" y2="95" marker-end="url(#pi-arrow)"/>
  <line x1="545" y1="95" x2="590" y2="95" marker-end="url(#pi-arrow)"/>

  <rect class="ok" x="315" y="200" width="230" height="60"/>
  <text x="430" y="228">4. 创建用户与数据库</text>
  <text class="small" x="430" y="248">CREATE USER / CREATE DATABASE</text>

  <line x1="705" y1="130" x2="705" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="705" y1="175" x2="545" y2="200" marker-end="url(#pi-arrow)"/>

  <text class="small" x="430" y="300">验证：psql -U postgres -h localhost -p 5432 -c "SELECT version();"</text>
  <text class="small" x="430" y="320">注意：Windows 用官方安装包（EDB）；macOS 可用 Homebrew</text>
</svg>
