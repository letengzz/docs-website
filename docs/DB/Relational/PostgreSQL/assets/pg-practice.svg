<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="po-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .in { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="in" x="40" y="60" width="200" height="70"/>
  <text x="140" y="92">需求设计</text>
  <text class="small" x="140" y="112">博客系统表结构</text>

  <rect class="mid" x="310" y="60" width="240" height="70"/>
  <text x="430" y="92">建表 + 查询</text>
  <text class="small" x="430" y="112">约束 / 索引 / JOIN</text>

  <rect class="out" x="620" y="60" width="200" height="70"/>
  <text x="720" y="92">优化与验证</text>
  <text class="small" x="720" y="112">EXPLAIN + 备份演练</text>

  <line x1="240" y1="95" x2="310" y2="95" marker-end="url(#po-arrow)"/>
  <line x1="550" y1="95" x2="620" y2="95" marker-end="url(#po-arrow)"/>

  <rect class="out" x="310" y="200" width="240" height="54"/>
  <text x="430" y="228">交付：可运行的库 + 文档</text>
  <text class="small" x="430" y="246">DDL / 查询 / 备份脚本</text>

  <line x1="720" y1="130" x2="720" y2="170" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="720" y1="170" x2="555" y2="200" marker-end="url(#po-arrow)"/>

  <text class="small" x="430" y="295">目标：用 PostgreSQL 特性（JSONB/全文/窗口函数）解决真实业务问题</text>
  <text class="small" x="430" y="315">验证：查询结果正确 + EXPLAIN 走索引 + 备份可恢复</text>
</svg>
