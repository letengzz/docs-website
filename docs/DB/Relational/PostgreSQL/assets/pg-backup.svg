<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pb-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .logical { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .phys { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .wal { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="logical" x="40" y="40" width="240" height="80"/>
  <text x="160" y="70">逻辑备份</text>
  <text class="small" x="160" y="92">pg_dump / pg_dumpall</text>
  <text class="small" x="160" y="108">跨版本 / 单库迁移</text>

  <rect class="phys" x="310" y="40" width="240" height="80"/>
  <text x="430" y="70">物理备份</text>
  <text class="small" x="430" y="92">pg_basebackup</text>
  <text class="small" x="430" y="108">全量 + PITR</text>

  <rect class="wal" x="580" y="40" width="240" height="80"/>
  <text x="700" y="70">WAL 归档</text>
  <text class="small" x="700" y="92">archive_mode / archive_command</text>
  <text class="small" x="700" y="108">支持时间点恢复</text>

  <line x1="280" y1="80" x2="310" y2="80" marker-end="url(#pb-arrow)"/>
  <line x1="550" y1="80" x2="580" y2="80" marker-end="url(#pb-arrow)"/>

  <rect class="logical" x="310" y="200" width="240" height="60"/>
  <text x="430" y="228">恢复演练</text>
  <text class="small" x="430" y="248">定期在测试环境还原验证</text>

  <line x1="700" y1="120" x2="700" y2="170" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="700" y1="170" x2="555" y2="200" marker-end="url(#pb-arrow)"/>

  <text class="small" x="430" y="300">备份三要素：全量 + WAL 归档 + 定期恢复演练</text>
  <text class="small" x="430" y="320">常用工具：pgBackRest / Barman（生产级）</text>
  <text class="small" x="430" y="340">云数据库：RDS 自动备份 + 一键恢复</text>
</svg>
