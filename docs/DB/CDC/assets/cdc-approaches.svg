<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="390" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0b162a">同步的四条路：从双写到日志订阅</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#64748b">判据不是「哪个先进」，而是「漏一条 / 重一条分别会怎样」</text>

  <g>
    <rect x="28" y="76" width="150" height="168" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="103" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0b162a">① 双写</text>
    <text x="103" y="122" text-anchor="middle" font-size="10.5" fill="#64748b">业务代码里同时写两处</text>
    <text x="103" y="146" text-anchor="middle" font-size="10.5" fill="#475569">延迟：最低</text>
    <text x="103" y="166" text-anchor="middle" font-size="10.5" fill="#475569">侵入：最高</text>
    <text x="103" y="192" text-anchor="middle" font-size="10.5" fill="#dc2626">第二处失败时</text>
    <text x="103" y="210" text-anchor="middle" font-size="10.5" fill="#dc2626">业务已经提交</text>
    <text x="103" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">只适合「结果可重算」</text>
  </g>

  <g>
    <rect x="190" y="76" width="150" height="168" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="265" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0b162a">② 定时全量扫描</text>
    <text x="265" y="122" text-anchor="middle" font-size="10.5" fill="#64748b">按 updated_at 拉增量</text>
    <text x="265" y="146" text-anchor="middle" font-size="10.5" fill="#475569">延迟：分钟~小时</text>
    <text x="265" y="166" text-anchor="middle" font-size="10.5" fill="#475569">侵入：无</text>
    <text x="265" y="192" text-anchor="middle" font-size="10.5" fill="#dc2626">硬删除扫不到</text>
    <text x="265" y="210" text-anchor="middle" font-size="10.5" fill="#dc2626">时间戳边界会丢</text>
    <text x="265" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">适合对账兜底</text>
  </g>

  <g>
    <rect x="352" y="76" width="150" height="168" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="427" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0b162a">③ 触发器</text>
    <text x="427" y="122" text-anchor="middle" font-size="10.5" fill="#64748b">写一张变更日志表</text>
    <text x="427" y="146" text-anchor="middle" font-size="10.5" fill="#475569">延迟：低</text>
    <text x="427" y="166" text-anchor="middle" font-size="10.5" fill="#475569">侵入：中（在库里）</text>
    <text x="427" y="192" text-anchor="middle" font-size="10.5" fill="#dc2626">触发器失败</text>
    <text x="427" y="210" text-anchor="middle" font-size="10.5" fill="#dc2626">会让业务写入一起失败</text>
    <text x="427" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">DDL 维护成本高</text>
  </g>

  <g>
    <rect x="514" y="76" width="138" height="168" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
    <text x="583" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#0b162a">④ 日志订阅</text>
    <text x="583" y="122" text-anchor="middle" font-size="10.5" fill="#0e7490">CDC · 本专题主线</text>
    <text x="583" y="146" text-anchor="middle" font-size="10.5" fill="#475569">延迟：毫秒~秒</text>
    <text x="583" y="166" text-anchor="middle" font-size="10.5" fill="#475569">侵入：零（只读日志）</text>
    <text x="583" y="192" text-anchor="middle" font-size="10.5" fill="#0e7490">顺序由日志保证</text>
    <text x="583" y="210" text-anchor="middle" font-size="10.5" fill="#0e7490">软删硬删都能捕获</text>
    <text x="583" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">代价：一个新的组件</text>
  </g>

  <line x1="30" y1="272" x2="650" y2="272" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="298" font-size="12" font-weight="600" fill="#334155">一句话判据（按顺序问自己）</text>
  <g font-size="11" fill="#475569">
    <text x="30" y="322">① 下游能不能「随时丢掉全量重算」？能 ⇒ 优先 ②，成本最低；</text>
    <text x="30" y="344">② 业务代码能不能接受多写一处、且容忍它失败？能 ⇒ ①，但必须接受「可能不一致」；</text>
    <text x="30" y="366">③ 需要捕获删除、需要毫秒级、且不想动业务代码 ⇒ 只有 ④；反过来，如果</text>
    <text x="30" y="384">表结构一周改三次、团队没人愿意维护新组件，④ 的账也可能算不过来。</text>
  </g>
</svg>
