<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="680" height="390" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0b162a">实战链路：博客平台 MySQL → ES 检索同步</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#64748b">把第 107 天的 ngram 搜索升级为独立检索库，同时让缓存失效有据可依</text>

  <rect x="28" y="80" width="130" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="93" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b162a">MySQL 8.4</text>
  <text x="93" y="124" text-anchor="middle" font-size="10" fill="#64748b">posts / comments</text>
  <text x="93" y="142" text-anchor="middle" font-size="10" fill="#64748b">ROW 格式 binlog</text>
  <text x="93" y="162" text-anchor="middle" font-size="10" fill="#0e7490">唯一事实来源</text>

  <rect x="182" y="80" width="140" height="96" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="252" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b162a">Debezium</text>
  <text x="252" y="124" text-anchor="middle" font-size="10" fill="#475569">Kafka Connect</text>
  <text x="252" y="142" text-anchor="middle" font-size="10" fill="#475569">一次快照 + 持续增量</text>
  <text x="252" y="162" text-anchor="middle" font-size="10" fill="#0e7490">键 = 主键 ⇒ 同键有序</text>

  <rect x="346" y="80" width="130" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="411" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b162a">Kafka</text>
  <text x="411" y="124" text-anchor="middle" font-size="10" fill="#64748b">按表建 topic</text>
  <text x="411" y="142" text-anchor="middle" font-size="10" fill="#64748b">分区数 = 消费者上限</text>
  <text x="411" y="162" text-anchor="middle" font-size="10" fill="#6d28d9">可多路复用下游</text>

  <rect x="500" y="80" width="152" height="96" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="576" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b162a">同步消费者</text>
  <text x="576" y="124" text-anchor="middle" font-size="10" fill="#64748b">幂等写 ES + 删缓存</text>
  <text x="576" y="142" text-anchor="middle" font-size="10" fill="#64748b">手动提交位点</text>
  <text x="576" y="162" text-anchor="middle" font-size="10" fill="#6d28d9">先写库后提交位点</text>

  <line x1="158" y1="128" x2="178" y2="128" stroke="#0891b2" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="322" y1="128" x2="342" y2="128" stroke="#0891b2" stroke-width="1.8" marker-end="url(#a5)"/>
  <line x1="476" y1="128" x2="496" y2="128" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a5)"/>

  <text x="30" y="212" font-size="12" font-weight="600" fill="#334155">三种事件在下游的处理（判据写死，不留解释空间）</text>
  <g font-size="10.5">
    <rect x="28" y="226" width="200" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="128" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0b162a">op = c / u（新增与更新）</text>
    <text x="128" y="270" text-anchor="middle" font-size="10" fill="#475569">ES：按 id UPSERT，写 after 全量字段</text>
    <text x="128" y="288" text-anchor="middle" font-size="10" fill="#475569">缓存：删除详情键（不是更新）</text>
    <text x="128" y="308" text-anchor="middle" font-size="10" fill="#64748b">未发布状态不写索引，与可见性口径一致</text>
    <text x="128" y="324" text-anchor="middle" font-size="10" fill="#0e7490">判据：源库改一次，检索表现为一次</text>

    <rect x="240" y="226" width="200" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="340" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">op = d（删除）</text>
    <text x="340" y="270" text-anchor="middle" font-size="10" fill="#78716c">ES：必须真的删掉文档</text>
    <text x="340" y="288" text-anchor="middle" font-size="10" fill="#78716c">缓存：同样要删</text>
    <text x="340" y="308" text-anchor="middle" font-size="10" fill="#dc2626">漏掉这一格 = 已删文章仍可搜到</text>
    <text x="340" y="324" text-anchor="middle" font-size="10" fill="#78716c">这正是定时任务方案补不上的洞</text>

    <rect x="452" y="226" width="200" height="104" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="552" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">op = r（快照）</text>
    <text x="552" y="270" text-anchor="middle" font-size="10" fill="#78716c">与增量走同一条写路径</text>
    <text x="552" y="288" text-anchor="middle" font-size="10" fill="#78716c">不许写「专门的导入逻辑」</text>
    <text x="552" y="308" text-anchor="middle" font-size="10" fill="#78716c">两条写法必然产生两套不一致</text>
    <text x="552" y="324" text-anchor="middle" font-size="10" fill="#b45309">判据：重灌后与增量结果逐条一致</text>
  </g>

  <rect x="28" y="346" width="624" height="34" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="42" y="368" font-size="10.5" fill="#0e7490">回滚与兜底只有一条路：把位点重置到过去、或者直接全量重灌——所以「下游能不能被清空重建」必须在上线前就确认。</text>
</svg>
