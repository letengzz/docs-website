<svg viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0b162a">上线后真正要看的东西</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#64748b">管道的失败方式几乎都是「安静地停住」，所以指标比日志重要</text>

  <text x="30" y="86" font-size="12" font-weight="600" fill="#334155">四个必看指标</text>
  <g>
    <rect x="28" y="98" width="150" height="76" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="103" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0b162a">同步延迟</text>
    <text x="103" y="140" text-anchor="middle" font-size="10" fill="#64748b">事件时间 vs 处理时间</text>
    <text x="103" y="158" text-anchor="middle" font-size="10" fill="#0e7490">唯一能发现「停住」的指标</text>

    <rect x="190" y="98" width="150" height="76" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="265" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0b162a">吞吐</text>
    <text x="265" y="140" text-anchor="middle" font-size="10" fill="#64748b">事件/秒、字节/秒</text>
    <text x="265" y="158" text-anchor="middle" font-size="10" fill="#64748b">对比源库写入量</text>

    <rect x="352" y="98" width="150" height="76" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="427" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0b162a">失败与重试</text>
    <text x="427" y="140" text-anchor="middle" font-size="10" fill="#64748b">错误计数、重试次数</text>
    <text x="427" y="158" text-anchor="middle" font-size="10" fill="#dc2626">重试一直涨 = 下游不可写</text>

    <rect x="514" y="98" width="138" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="583" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0b162a">位点老化</text>
    <text x="583" y="140" text-anchor="middle" font-size="10" fill="#64748b">位点距今多久</text>
    <text x="583" y="158" text-anchor="middle" font-size="10" fill="#6d28d9">接近保留期必须升级告警</text>
  </g>

  <line x1="30" y1="198" x2="650" y2="198" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="222" font-size="12" font-weight="600" fill="#334155">四类故障与处置顺序</text>

  <g font-size="10.5">
    <rect x="28" y="236" width="148" height="106" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="102" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">源库重启 / 主从切换</text>
    <text x="102" y="278" text-anchor="middle" font-size="10" fill="#78716c">先看位点是否还在</text>
    <text x="102" y="296" text-anchor="middle" font-size="10" fill="#78716c">GTID 模式可自动接上</text>
    <text x="102" y="314" text-anchor="middle" font-size="10" fill="#78716c">file+pos 要按 GTID 对齐</text>
    <text x="102" y="332" text-anchor="middle" font-size="10" fill="#475569">处置：等自愈 → 对不上则重灌</text>

    <rect x="188" y="236" width="148" height="106" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="262" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">位点过期</text>
    <text x="262" y="278" text-anchor="middle" font-size="10" fill="#78716c">报错「找不到 binlog」</text>
    <text x="262" y="296" text-anchor="middle" font-size="10" fill="#78716c">没有中间态可修</text>
    <text x="262" y="314" text-anchor="middle" font-size="10" fill="#78716c">只能重新全量</text>
    <text x="262" y="332" text-anchor="middle" font-size="10" fill="#475569">预防：延长保留期 + 位点老化告警</text>

    <rect x="348" y="236" width="148" height="106" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="422" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">下游不可写</text>
    <text x="422" y="278" text-anchor="middle" font-size="10" fill="#78716c">集群写满、映射冲突</text>
    <text x="422" y="296" text-anchor="middle" font-size="10" fill="#78716c">管道会一直重试</text>
    <text x="422" y="314" text-anchor="middle" font-size="10" fill="#78716c">延迟持续上涨</text>
    <text x="422" y="332" text-anchor="middle" font-size="10" fill="#475569">处置：先止血下游，再等积压消化</text>

    <rect x="508" y="236" width="144" height="106" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="580" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">DDL 漂移</text>
    <text x="580" y="278" text-anchor="middle" font-size="10" fill="#78716c">源库加列、改类型</text>
    <text x="580" y="296" text-anchor="middle" font-size="10" fill="#78716c">下游映射失配</text>
    <text x="580" y="314" text-anchor="middle" font-size="10" fill="#78716c">表现为单表突然全失败</text>
    <text x="580" y="332" text-anchor="middle" font-size="10" fill="#475569">处置：DDL 走变更流程，两侧同步</text>
  </g>
</svg>
