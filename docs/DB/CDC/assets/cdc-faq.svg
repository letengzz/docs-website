<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0b162a">排障分诊：先看哪个信号</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#64748b">CDC 的问题几乎都能用「延迟 + 位点 + 错误日志」三样定位</text>

  <rect x="256" y="76" width="168" height="42" rx="21" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="340" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b162a">现象是什么？</text>

  <line x1="340" y1="118" x2="340" y2="136" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="118" y1="136" x2="562" y2="136" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="118" y1="136" x2="118" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="266" y1="136" x2="266" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="414" y1="136" x2="414" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a6)"/>
  <line x1="562" y1="136" x2="562" y2="152" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a6)"/>

  <g font-size="10.5">
    <rect x="28" y="156" width="180" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="118" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">数据不一致</text>
    <text x="118" y="200" text-anchor="middle" font-size="10" fill="#78716c">① 下游是不是「没删」？</text>
    <text x="118" y="218" text-anchor="middle" font-size="10" fill="#78716c">② 幂等键是不是主键？</text>
    <text x="118" y="236" text-anchor="middle" font-size="10" fill="#78716c">③ 回填顺序是否旧覆盖新？</text>
    <text x="118" y="258" text-anchor="middle" font-size="10" fill="#475569">兜底：全量重灌 + 抽查对账</text>

    <rect x="220" y="156" width="180" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="310" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">延迟一直涨</text>
    <text x="310" y="200" text-anchor="middle" font-size="10" fill="#78716c">① 下游写入是否在报错？</text>
    <text x="310" y="218" text-anchor="middle" font-size="10" fill="#78716c">② 有没有超大事务？</text>
    <text x="310" y="236" text-anchor="middle" font-size="10" fill="#78716c">③ 消费并行度够不够？</text>
    <text x="310" y="258" text-anchor="middle" font-size="10" fill="#475569">注意：涨到保留期就变丢数据</text>

    <rect x="412" y="156" width="180" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
    <text x="502" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">启动就报错</text>
    <text x="502" y="200" text-anchor="middle" font-size="10" fill="#78716c">① server_id 是否重复？</text>
    <text x="502" y="218" text-anchor="middle" font-size="10" fill="#78716c">② 账号有 REPLICATION 权限？</text>
    <text x="502" y="236" text-anchor="middle" font-size="10" fill="#78716c">③ binlog 是否过期？</text>
    <text x="502" y="258" text-anchor="middle" font-size="10" fill="#475569">前两条可修，第三条只能重灌</text>

    <rect x="604" y="156" width="48" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="628" y="220" text-anchor="middle" font-size="10" fill="#94a3b8">其它</text>
  </g>

  <rect x="28" y="292" width="624" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="42" y="314" font-size="11.5" font-weight="600" fill="#0e7490">先把「能不能重灌」确认掉，再排查细节</text>
  <text x="42" y="334" font-size="10.5" fill="#475569">凡是无法重灌的下游，任何一次修复都会变成一次不可控的风险操作。</text>
</svg>
