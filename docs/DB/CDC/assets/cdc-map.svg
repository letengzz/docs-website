<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0b162a">数据同步与 CDC 专题地图</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#64748b">把「源库发生了什么」变成「下游该变成什么样」的一条可靠管道</text>

  <!-- sources -->
  <text x="30" y="88" font-size="11" font-weight="600" fill="#0891b2">数据源</text>
  <rect x="30" y="98" width="132" height="112" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="96" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#0b162a">MySQL</text>
  <text x="96" y="142" text-anchor="middle" font-size="10.5" fill="#64748b">binlog（ROW 格式）</text>
  <text x="96" y="160" text-anchor="middle" font-size="10.5" fill="#64748b">GTID / file+pos 位点</text>
  <text x="96" y="178" text-anchor="middle" font-size="10.5" fill="#64748b">本专题的主线</text>
  <text x="96" y="196" text-anchor="middle" font-size="10.5" fill="#dc2626">binlog 被清理 ⇒ 丢</text>

  <!-- core -->
  <rect x="200" y="98" width="150" height="112" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="275" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0b162a">CDC 管道</text>
  <text x="275" y="146" text-anchor="middle" font-size="10.5" fill="#475569">① 订阅日志</text>
  <text x="275" y="164" text-anchor="middle" font-size="10.5" fill="#475569">② 解析成变更事件</text>
  <text x="275" y="182" text-anchor="middle" font-size="10.5" fill="#475569">③ 位点 / 幂等 / 重试</text>

  <!-- sinks -->
  <text x="388" y="88" font-size="11" font-weight="600" fill="#7c3aed">下游</text>
  <rect x="388" y="98" width="262" height="112" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="519" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0b162a">搜索索引 · 缓存 · 数仓 · 图库</text>
  <text x="519" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">Elasticsearch / Redis / ClickHouse / Neo4j</text>
  <text x="519" y="162" text-anchor="middle" font-size="10.5" fill="#64748b">下游只承诺「最终一致」</text>
  <text x="519" y="184" text-anchor="middle" font-size="10.5" fill="#64748b">一致性的账要算在管道上</text>
  <text x="519" y="202" text-anchor="middle" font-size="10.5" fill="#64748b">不在下游某一次写入上</text>

  <line x1="162" y1="154" x2="196" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="350" y1="154" x2="384" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- pages -->
  <line x1="30" y1="238" x2="650" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="262" font-size="11" font-weight="600" fill="#334155">九个正文页的阅读顺序</text>

  <g font-size="11">
    <rect x="30" y="276" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="42" y="297" font-size="12" font-weight="600" fill="#0b162a">① 概述与选型</text>
    <text x="42" y="316" font-size="10" fill="#64748b">四种同步做法 | 什么时候不用</text>

    <rect x="241" y="276" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="253" y="297" font-size="12" font-weight="600" fill="#0b162a">② binlog 原理</text>
    <text x="253" y="316" font-size="10" fill="#64748b">ROW 事件 | GTID | 必需参数</text>

    <rect x="452" y="276" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="464" y="297" font-size="12" font-weight="600" fill="#0b162a">③ Debezium</text>
    <text x="464" y="316" font-size="10" fill="#64748b">Kafka Connect | 快照四模式</text>

    <rect x="30" y="340" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="42" y="361" font-size="12" font-weight="600" fill="#0b162a">④ Canal 与 Maxwell</text>
    <text x="42" y="380" font-size="10" fill="#64748b">国产路线 | 轻量 JSON 直出</text>

    <rect x="241" y="340" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="253" y="361" font-size="12" font-weight="600" fill="#0b162a">⑤ Flink CDC</text>
    <text x="253" y="380" font-size="10" fill="#64748b">增量快照 | YAML 整库同步</text>

    <rect x="452" y="340" width="198" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="464" y="361" font-size="12" font-weight="600" fill="#0b162a">⑥ 一致性保障</text>
    <text x="464" y="380" font-size="10" fill="#64748b">顺序 | 幂等 | 对账与重灌</text>
  </g>
</svg>
