<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="438" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">全链路压测：压测标透传与影子路由</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">影子库能不能用，取决于压测标能否贯穿全链路 + 所有写入口都接在中间件上</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#B91C1C" font-weight="bold">压测标从入口一路带到 SQL，任何一跳丢了标，那一段就写进生产</text>
  <rect x="30" y="96" width="108" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="84" y="114.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">压测工具</text>
  <text x="84" y="131" text-anchor="middle" font-size="7" fill="#334155">x-shadow: true</text>
  <text x="84" y="147.1" text-anchor="middle" font-size="7" fill="#334155">x-shadow-tag</text>
  <line x1="138" y1="129" x2="150" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="150" y="96" width="108" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="204" y="114.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">网关</text>
  <text x="204" y="131" text-anchor="middle" font-size="7" fill="#1D4ED8">识标 → 写 MDC</text>
  <text x="204" y="147.1" text-anchor="middle" font-size="7" fill="#1D4ED8">随请求下传</text>
  <line x1="258" y1="129" x2="270" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="96" width="108" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="324" y="114.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">业务服务</text>
  <text x="324" y="131" text-anchor="middle" font-size="7" fill="#6D28D9">拦截器统一注入</text>
  <text x="324" y="147.1" text-anchor="middle" font-size="7" fill="#6D28D9">HTTP 头透传</text>
  <line x1="378" y1="129" x2="390" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="96" width="108" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="444" y="114.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">MQ 生产者</text>
  <text x="444" y="131" text-anchor="middle" font-size="7" fill="#0F766E">消息属性携带</text>
  <text x="444" y="147.1" text-anchor="middle" font-size="7" fill="#0F766E">user property</text>
  <line x1="498" y1="129" x2="510" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="96" width="108" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="564" y="114.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">MQ 消费者</text>
  <text x="564" y="131" text-anchor="middle" font-size="7" fill="#047857">从属性恢复 MDC</text>
  <text x="564" y="147.1" text-anchor="middle" font-size="7" fill="#047857">再传给下游</text>
  <line x1="618" y1="129" x2="630" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="630" y="96" width="108" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="684" y="114.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">中间件</text>
  <text x="684" y="131" text-anchor="middle" font-size="7" fill="#B45309">按标路由影子库</text>
  <text x="684" y="147.1" text-anchor="middle" font-size="7" fill="#B45309">SIMPLE_HINT</text>
  <line x1="30" y1="182" x2="730" y2="182" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="210" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三个最容易漏的入口（漏一个就污染生产）</text>
  <rect x="30" y="222" width="226" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="143" y="240.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">消息队列</text>
  <text x="143" y="257" text-anchor="middle" font-size="7.5" fill="#B91C1C">HTTP 标透传了</text>
  <text x="143" y="274.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">MQ 消息没带标</text>
  <text x="143" y="291.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">异步链路整段写生产</text>
  <rect x="268" y="222" width="226" height="80" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="381" y="240.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">定时任务 / 离线脚本</text>
  <text x="381" y="257" text-anchor="middle" font-size="7.5" fill="#C2410C">不经过用户请求</text>
  <text x="381" y="274.25" text-anchor="middle" font-size="7.5" fill="#C2410C">天生没有压测标</text>
  <text x="381" y="291.5" text-anchor="middle" font-size="7.5" fill="#C2410C">必须显式声明是否压测</text>
  <rect x="506" y="222" width="226" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="619" y="240.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">第三方回调</text>
  <text x="619" y="257" text-anchor="middle" font-size="7.5" fill="#B45309">外部系统不带你的标</text>
  <text x="619" y="274.25" text-anchor="middle" font-size="7.5" fill="#B45309">压测期需明确策略</text>
  <text x="619" y="291.5" text-anchor="middle" font-size="7.5" fill="#B45309">隔离还是直接跳过</text>
  <text x="380" y="322" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">按「标一定会丢」来设计，而不是假设它一定能传下去</text>
  <text x="60" y="352" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">验收判据</text>
  <rect x="30" y="364" width="700" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="382" text-anchor="middle" font-size="8.5" fill="#047857">带标写入 → 影子库有数据、生产库 0 行；无标写入 → 生产库有数据（规则没把正常流量劫持）</text>
  <text x="380" y="401.55" text-anchor="middle" font-size="8.5" fill="#047857">压测标丢失计数恒为 0；清理脚本连跑两遍结果都为 0（幂等）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
