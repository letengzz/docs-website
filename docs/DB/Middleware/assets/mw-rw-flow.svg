<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">读写分离链路与延迟窗口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">写主读从只有一句话，难的是「写后读」这四种场景的取舍</text>
  <rect x="30" y="78" width="120" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="90" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">应用</text>
  <text x="90" y="113" text-anchor="middle" font-size="8" fill="#334155">写 + 读</text>
  <rect x="180" y="78" width="150" height="54" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="255" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">中间件</text>
  <text x="255" y="113" text-anchor="middle" font-size="8" fill="#6D28D9">按规则选路</text>
  <rect x="360" y="78" width="150" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="435" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">主库（写）</text>
  <text x="435" y="113" text-anchor="middle" font-size="8" fill="#1D4ED8">binlog 推送</text>
  <rect x="360" y="190" width="150" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="435" y="208.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">从库（读）</text>
  <text x="435" y="225" text-anchor="middle" font-size="8" fill="#047857">异步重放 binlog</text>
  <rect x="560" y="78" width="170" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="645" y="96.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">写事务提交成功</text>
  <text x="645" y="113" text-anchor="middle" font-size="8" fill="#B91C1C">此刻从库还没看到</text>
  <rect x="560" y="190" width="170" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="645" y="208.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">延迟窗口</text>
  <text x="645" y="225" text-anchor="middle" font-size="8" fill="#B45309">P99 才是真实延迟</text>
  <line x1="150" y1="105" x2="180" y2="105" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="330" y1="105" x2="360" y2="105" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="330" y1="96" x2="435" y2="190" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="510" y1="105" x2="560" y2="105" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="435" y1="132" x2="435" y2="190" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="510" y1="217" x2="560" y2="217" stroke="#D97706" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="217" x2="330" y2="217" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="268" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">「刚写完读不到」不是 bug，是异步复制的固有结果</text>
  <text x="60" y="300" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四条让「读到自己刚写的」路线</text>
  <rect x="30" y="312" width="166" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="113" y="330.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">强制主库（局部）</text>
  <text x="113" y="347" text-anchor="middle" font-size="7.5" fill="#1D4ED8">写后 N 秒内读走主库</text>
  <text x="113" y="364.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">首选，覆盖九成场景</text>
  <rect x="208" y="312" width="166" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="291" y="330.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">写后返回完整结果</text>
  <text x="291" y="347" text-anchor="middle" font-size="7.5" fill="#047857">前端不再回查</text>
  <text x="291" y="364.25" text-anchor="middle" font-size="7.5" fill="#047857">只解决写接口自己</text>
  <rect x="386" y="312" width="166" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="469" y="330.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">事务内全走主库</text>
  <text x="469" y="347" text-anchor="middle" font-size="7.5" fill="#6D28D9">INSERT 后 SELECT 必须可读</text>
  <text x="469" y="364.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">中间件默认行为要验证</text>
  <rect x="564" y="312" width="166" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="647" y="330.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">按时间戳等待 GTID</text>
  <text x="647" y="347" text-anchor="middle" font-size="7.5" fill="#B45309">强一致读、对账类</text>
  <text x="647" y="364.25" text-anchor="middle" font-size="7.5" fill="#B45309">实现复杂、可能阻塞</text>
  <text x="380" y="404" text-anchor="middle" font-size="9.5" fill="#B91C1C">铁律：从库一律只给只读账号——让「路由错误」立刻变成显式报错，而不是静默写错</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
