<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="490" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：为订单服务接入中间件的上线路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">从量化到验收的四步，每一步都带判据与回退动作</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四步推进：每一步都有判据，都能回退</text>
  <rect x="30" y="96" width="166" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="113" y="114.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 先量化</text>
  <text x="113" y="131" text-anchor="middle" font-size="7" fill="#334155">读:写比例 / 连接峰值</text>
  <text x="113" y="147.1" text-anchor="middle" font-size="7" fill="#334155">慢查询 Top 10</text>
  <text x="113" y="163.2" text-anchor="middle" font-size="7" fill="#334155">判据：Top10 平均 &lt; 10ms 再分离</text>
  <line x1="196" y1="142" x2="208" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="208" y="96" width="166" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="291" y="114.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">② 影子库压测</text>
  <text x="291" y="131" text-anchor="middle" font-size="7" fill="#0F766E">建影子库 + 接规则</text>
  <text x="291" y="147.1" text-anchor="middle" font-size="7" fill="#0F766E">阶梯加压找拐点</text>
  <text x="291" y="163.2" text-anchor="middle" font-size="7" fill="#0F766E">产出：拐点/瓶颈/扩容三张表</text>
  <line x1="374" y1="142" x2="386" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="96" width="166" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="469" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">③ 读写分离灰度</text>
  <text x="469" y="131" text-anchor="middle" font-size="7" fill="#1D4ED8">单实例 → 10% → 全量</text>
  <text x="469" y="147.1" text-anchor="middle" font-size="7" fill="#1D4ED8">延迟告警联动降级</text>
  <text x="469" y="163.2" text-anchor="middle" font-size="7" fill="#1D4ED8">回退：改一个环境变量</text>
  <line x1="552" y1="142" x2="564" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="564" y="96" width="166" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="647" y="114.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 收口与验收</text>
  <text x="647" y="131" text-anchor="middle" font-size="7" fill="#047857">从库降只读账号</text>
  <text x="647" y="147.1" text-anchor="middle" font-size="7" fill="#047857">连接数达标</text>
  <text x="647" y="163.2" text-anchor="middle" font-size="7" fill="#047857">验收：六项清单 + 演练记录</text>
  <text x="60" y="220" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">上线路径上的三个判断点</text>
  <rect x="30" y="232" width="700" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="250" text-anchor="middle" font-size="8.5" fill="#B91C1C">顺序铁律：先把慢查询 Top 10 优化到 10ms 以内，再做读写分离——带着慢 SQL 分离，等于把它复制成三份</text>
  <text x="380" y="269.55" text-anchor="middle" font-size="8.5" fill="#B91C1C">退出路径必须在阶段 ③ 之前演练：把 DB_HOST 从代理改回主库，确认业务正常且不改代码</text>
  <text x="60" y="316" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">验收清单（六项，缺一不可）</text>
  <rect x="30" y="328" width="342" height="36" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="46" y="343" text-anchor="start" font-size="9" fill="#1E3A8A" font-weight="bold">路由正确性</text>
  <text x="46" y="357" text-anchor="start" font-size="8" fill="#1D4ED8">写与事务落主库，普通读落从库</text>
  <rect x="388" y="328" width="342" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="404" y="343" text-anchor="start" font-size="9" fill="#3730A3" font-weight="bold">写后读一致</text>
  <text x="404" y="357" text-anchor="start" font-size="8" fill="#4338CA">带 force_master 能读到刚写的</text>
  <rect x="30" y="372" width="342" height="36" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="46" y="387" text-anchor="start" font-size="9" fill="#065F46" font-weight="bold">从库只读</text>
  <text x="46" y="401" text-anchor="start" font-size="8" fill="#047857">向从库写必须报 1290</text>
  <rect x="388" y="372" width="342" height="36" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="404" y="387" text-anchor="start" font-size="9" fill="#115E59" font-weight="bold">连接数下降</text>
  <text x="404" y="401" text-anchor="start" font-size="8" fill="#0F766E">Threads_connected 峰值达标</text>
  <rect x="30" y="416" width="342" height="36" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="46" y="431" text-anchor="start" font-size="9" fill="#92400E" font-weight="bold">退出路径</text>
  <text x="46" y="445" text-anchor="start" font-size="8" fill="#B45309">切回主库业务正常（人工演练）</text>
  <rect x="388" y="416" width="342" height="36" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="404" y="431" text-anchor="start" font-size="9" fill="#9A3412" font-weight="bold">延迟联动</text>
  <text x="404" y="445" text-anchor="start" font-size="8" fill="#C2410C">超阈值自动摘除该从库（人工演练）</text>
  <text x="380" y="472" text-anchor="middle" font-size="9.5" fill="#0F766E">压测真正的产出不是 TPS 数字，而是「扩容对应表」——没有对应表的压测等于没压</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
