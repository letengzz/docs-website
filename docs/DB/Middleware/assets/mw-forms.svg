<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="466" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三种中间件形态与部署纪律</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">形态决定运维成本，纪律决定它会不会变成新的单点</text>
  <rect x="30" y="78" width="226" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">驱动增强（客户端）</text>
  <text x="143" y="113" text-anchor="middle" font-size="8" fill="#1D4ED8">jar 嵌进应用改写 JDBC</text>
  <text x="143" y="131.4" text-anchor="middle" font-size="8" fill="#1D4ED8">ShardingSphere-JDBC</text>
  <text x="143" y="149.8" text-anchor="middle" font-size="8" fill="#1D4ED8">少一跳网络 · 语言绑定</text>
  <text x="143" y="168.2" text-anchor="middle" font-size="8" fill="#1D4ED8">版本升级要动所有应用</text>
  <rect x="268" y="78" width="226" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">独立代理（服务端）</text>
  <text x="381" y="113" text-anchor="middle" font-size="8" fill="#6D28D9">独立进程伪装成 MySQL/PG</text>
  <text x="381" y="131.4" text-anchor="middle" font-size="8" fill="#6D28D9">ProxySQL / Proxy / Router</text>
  <text x="381" y="149.8" text-anchor="middle" font-size="8" fill="#6D28D9">语言无关 · 可独立发布</text>
  <text x="381" y="168.2" text-anchor="middle" font-size="8" fill="#6D28D9">多一跳 · 它挂了全挂</text>
  <rect x="506" y="78" width="226" height="108" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="96.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">数据库侧原生</text>
  <text x="619" y="113" text-anchor="middle" font-size="8" fill="#047857">由数据库或托管服务提供</text>
  <text x="619" y="131.4" text-anchor="middle" font-size="8" fill="#047857">InnoDB Cluster + Router</text>
  <text x="619" y="149.8" text-anchor="middle" font-size="8" fill="#047857">少一个自研组件</text>
  <text x="619" y="168.2" text-anchor="middle" font-size="8" fill="#047857">能力受限 · 厂商锁定</text>
  <text x="380" y="212" text-anchor="middle" font-size="9.5" fill="#1E3A8A">选型路径：技术栈是否清一色 JVM？ → 是选驱动增强；有多语言或改不动的存量系统 → 选代理</text>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">代理独有、也最容易被低估的一项能力</text>
  <rect x="30" y="256" width="700" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="274" text-anchor="middle" font-size="8.5" fill="#B91C1C">「出事时能不能五分钟退回单库」——驱动增强要改配置重启应用，代理改一条规则即可生效</text>
  <text x="380" y="293.55" text-anchor="middle" font-size="8.5" fill="#B91C1C">评价新组件的标准里，退出成本应与收益同等权重（这也是「退出路径必须演练」的由来）</text>
  <text x="60" y="340" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四条部署纪律</text>
  <rect x="30" y="352" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="367" text-anchor="start" font-size="8.5" fill="#334155">· 代理必须无状态 + 多实例，前面挂 L4（MySQL 私有协议 L7 解析不了）</text>
  <rect x="30" y="378" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="393" text-anchor="start" font-size="8.5" fill="#334155">· 代理与业务同可用区：多一跳是固定成本，别让跨区放大它</text>
  <rect x="30" y="404" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="419" text-anchor="start" font-size="8.5" fill="#334155">· 实例数按连接数算，不按 QPS 算（每实例都要维持到后端的连接）</text>
  <rect x="30" y="430" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="46" y="445" text-anchor="start" font-size="8.5" fill="#334155">· 配置集中管理（版本库 / 配置中心），配置本身就是生产代码</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
