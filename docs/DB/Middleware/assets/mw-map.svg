<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="438" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数据库中间件专题地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">从「它在哪一层」到「怎么上线验收」，一页看清六个子页的关系</text>
  <rect x="30" y="76" width="700" height="40" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="101" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">夹在应用与数据库之间的一层：管「发给谁、怎么改、怎么合」</text>
  <rect x="30" y="128" width="166" height="100" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="113" y="146.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">为什么需要它</text>
  <text x="113" y="163" text-anchor="middle" font-size="7.5" fill="#6D28D9">扩展与治理不落地到业务代码</text>
  <text x="113" y="180.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">四件事：读写分离 / 分片</text>
  <text x="113" y="197.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">影子压测 / 连接复用</text>
  <rect x="208" y="128" width="166" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="291" y="146.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">形态怎么选</text>
  <text x="291" y="163" text-anchor="middle" font-size="7.5" fill="#1D4ED8">驱动增强：少一跳、语言绑定</text>
  <text x="291" y="180.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">独立代理：语言无关、可独立发布</text>
  <text x="291" y="197.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">数据库侧原生：少一个自研组件</text>
  <rect x="386" y="128" width="166" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="469" y="146.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">五个主战场</text>
  <text x="469" y="163" text-anchor="middle" font-size="7.5" fill="#047857">读写分离（读旧数据怎么办）</text>
  <text x="469" y="180.25" text-anchor="middle" font-size="7.5" fill="#047857">影子库（压测不污染生产）</text>
  <text x="469" y="197.5" text-anchor="middle" font-size="7.5" fill="#047857">连接治理 / 代理运维 / 跨库事务</text>
  <rect x="564" y="128" width="166" height="100" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="647" y="146.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">代价与边界</text>
  <text x="647" y="163" text-anchor="middle" font-size="7.5" fill="#B91C1C">多一跳、多一个故障点</text>
  <text x="647" y="180.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">只读 SQL 解析、新语法可能不认</text>
  <text x="647" y="197.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">配置即生产代码、退出成本要算</text>
  <text x="60" y="254" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">六个子页的阅读顺序</text>
  <rect x="30" y="266" width="226" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="143" y="284.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">中间件全景与选型</text>
  <text x="143" y="301" text-anchor="middle" font-size="8" fill="#4338CA">Overview/</text>
  <line x1="256" y1="291" x2="268" y2="291" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="266" width="226" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="284.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">读写分离工程化</text>
  <text x="381" y="301" text-anchor="middle" font-size="8" fill="#1D4ED8">ReadWriteSplit/</text>
  <line x1="494" y1="291" x2="506" y2="291" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="266" width="226" height="50" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="619" y="284.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">影子库与全链路压测</text>
  <text x="619" y="301" text-anchor="middle" font-size="8" fill="#0F766E">ShadowDatabase/</text>
  <rect x="30" y="328" width="226" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="346.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">代理形态与运维</text>
  <text x="143" y="363" text-anchor="middle" font-size="8" fill="#6D28D9">ProxyMode/</text>
  <line x1="256" y1="353" x2="268" y2="353" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="328" width="226" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="381" y="346.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">连接治理</text>
  <text x="381" y="363" text-anchor="middle" font-size="8" fill="#047857">ConnectionGovernance/</text>
  <line x1="494" y1="353" x2="506" y2="353" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="328" width="226" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="619" y="346.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">中间件视角的分布式事务</text>
  <text x="619" y="363" text-anchor="middle" font-size="8" fill="#B45309">DistributedTransaction/</text>
  <text x="380" y="398" text-anchor="middle" font-size="9.5" fill="#475569">最后两页：实战（订单服务接入：压测 → 灰度 → 验收）· 常见问题（六类症状的定位路径）</text>
  <text x="380" y="422" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">一句话：分片专题回答「要不要拆」，本专题回答「加不加这一层、加了怎么不出事」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
