<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>从暴力检索到近似检索：三条路线与「什么时候不需要向量库」</title>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">为什么必须「近似」：先看清暴力检索的账</text>
  <text x="380" y="52" text-anchor="middle" font-size="10.5" fill="#64748B">100 万条 768 维向量，一次查询就是 7.68 亿次乘加——数量级决定了架构，不是偏好</text>

  <rect x="28" y="70" width="330" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="46" y="90" font-size="10.5" fill="#1E3A8A" font-weight="bold">暴力检索（Flat / 精确）</text>
  <text x="46" y="110" font-size="8.5" fill="#1D4ED8">100 万 × 768 维 = 7.68 亿次乘加 / 查询</text>
  <text x="46" y="128" font-size="8.5" fill="#1D4ED8">召回率恒为 100%，无参数、无训练、无重建</text>
  <text x="46" y="146" font-size="8.5" fill="#1D4ED8">内存 = N × d × 4B，不含任何索引开销</text>
  <text x="46" y="164" font-size="8.5" fill="#1D4ED8">10 万条以内通常只要几毫秒——先量再选</text>
  <text x="46" y="186" font-size="8.5" fill="#1E3A8A" font-weight="bold">适用：语料小、或「漏一条就是事故」</text>

  <rect x="374" y="70" width="358" height="128" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="392" y="90" font-size="10.5" fill="#5B21B6" font-weight="bold">近似检索（ANN）的三条路线</text>
  <text x="392" y="110" font-size="8.5" fill="#6D28D9">① 图路线：HNSW / DiskANN（Vamana）——本质是「有导航的图」</text>
  <text x="392" y="128" font-size="8.5" fill="#6D28D9">② 倒排路线：IVF / IVF-PQ——先粗聚类定位，再在簇内算</text>
  <text x="392" y="146" font-size="8.5" fill="#6D28D9">③ 分区路线：SPFresh / HFresh——把空间切小、只读命中的分区</text>
  <text x="392" y="164" font-size="8.5" fill="#6D28D9">三条路线都在同一件事上做权衡：召回 ↔ 延迟 ↔ 内存</text>
  <text x="392" y="186" font-size="8.5" fill="#5B21B6" font-weight="bold">「近似」不等于「不准」：调参后可稳定在 95%~99%</text>

  <text x="60" y="228" font-size="11" fill="#0F172A" font-weight="bold">四条必须先定下来的边界</text>
  <rect x="28" y="240" width="170" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="44" y="260" font-size="9.5" fill="#1E293B" font-weight="bold">① 数据边界</text>
  <text x="44" y="278" font-size="8" fill="#334155">向量是派生物</text>
  <text x="44" y="294" font-size="8" fill="#334155">删除源数据必须</text>
  <text x="44" y="310" font-size="8" fill="#334155">同步删向量</text>
  <text x="44" y="326" font-size="8" fill="#334155">（否则越权可见）</text>

  <rect x="206" y="240" width="170" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="222" y="260" font-size="9.5" fill="#1E293B" font-weight="bold">② 一致性边界</text>
  <text x="222" y="278" font-size="8" fill="#334155">与业务库不是</text>
  <text x="222" y="294" font-size="8" fill="#334155">同一个事务域</text>
  <text x="222" y="310" font-size="8" fill="#334155">接受秒级~分钟级</text>
  <text x="222" y="326" font-size="8" fill="#334155">最终一致</text>

  <rect x="384" y="240" width="170" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="400" y="260" font-size="9.5" fill="#1E293B" font-weight="bold">③ 精度边界</text>
  <text x="400" y="278" font-size="8" fill="#334155">「查不到」是正常</text>
  <text x="400" y="294" font-size="8" fill="#334155">输出，必须能区分</text>
  <text x="400" y="310" font-size="8" fill="#334155">「确实没有」与</text>
  <text x="400" y="326" font-size="8" fill="#334155">「索引没搜到」</text>

  <rect x="562" y="240" width="170" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="578" y="260" font-size="9.5" fill="#1E293B" font-weight="bold">④ 成本边界</text>
  <text x="578" y="278" font-size="8" fill="#334155">内存比磁盘贵约</text>
  <text x="578" y="294" font-size="8" fill="#334155">一个数量级</text>
  <text x="578" y="310" font-size="8" fill="#334155">容量规划必须在</text>
  <text x="578" y="326" font-size="8" fill="#334155">写入之前完成</text>

  <rect x="28" y="350" width="704" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="44" y="370" font-size="10" fill="#065F46" font-weight="bold">什么时候不需要向量数据库</text>
  <text x="44" y="390" font-size="8.5" fill="#047857">语料 &lt; 10 万条 → 暴力检索足够；已有 Postgres → pgvector 省掉一条数据链路；只需关键词精确匹配 → 全文索引更便宜；</text>
  <text x="44" y="404" font-size="8.5" fill="#047857">只是「做一次离线聚类」→ 用库而不是服务。引入一个独立服务之前，先回答「它替我解决了哪一条边界」。</text>
</svg>
