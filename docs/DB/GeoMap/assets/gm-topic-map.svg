<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">地理信息与地图工程：四层链路与最贵的三类错</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">入库 → 查询 → 出图 → 交付，每层都有一个「过去了就改不动」的决定</text>
  <rect x="22" y="72" width="172" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="108" y="90.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">入库层</text>
  <text x="108" y="107" text-anchor="middle" font-size="7.5" fill="#4338CA">坐标系与投影</text>
  <text x="108" y="124.25" text-anchor="middle" font-size="7.5" fill="#4338CA">空间建模</text>
  <text x="108" y="141.5" text-anchor="middle" font-size="7.5" fill="#4338CA">GiST / SP-GiST</text>
  <text x="108" y="190" text-anchor="middle" font-size="8" fill="#64748B">位置怎么记</text>
  <rect x="206" y="72" width="172" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="292" y="90.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">查询层</text>
  <text x="292" y="107" text-anchor="middle" font-size="7.5" fill="#1D4ED8">距离与谓词</text>
  <text x="292" y="124.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">最近邻 KNN</text>
  <text x="292" y="141.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">围栏与轨迹</text>
  <text x="292" y="190" text-anchor="middle" font-size="8" fill="#64748B">关系怎么算</text>
  <rect x="390" y="72" width="172" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="476" y="90.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">出图层</text>
  <text x="476" y="107" text-anchor="middle" font-size="7.5" fill="#0F766E">瓦片切片</text>
  <text x="476" y="124.25" text-anchor="middle" font-size="7.5" fill="#0F766E">前端渲染</text>
  <text x="476" y="141.5" text-anchor="middle" font-size="7.5" fill="#0F766E">命中与交互</text>
  <text x="476" y="190" text-anchor="middle" font-size="8" fill="#64748B">怎么给人看</text>
  <rect x="574" y="72" width="172" height="104" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="660" y="90.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">交付层</text>
  <text x="660" y="107" text-anchor="middle" font-size="7.5" fill="#B45309">合规闸门</text>
  <text x="660" y="124.25" text-anchor="middle" font-size="7.5" fill="#B45309">实战验收</text>
  <text x="660" y="141.5" text-anchor="middle" font-size="7.5" fill="#B45309">常见问题</text>
  <text x="660" y="190" text-anchor="middle" font-size="8" fill="#64748B">能不能上线</text>
  <line x1="196" y1="124" x2="204" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="124" x2="388" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="564" y1="124" x2="572" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="218" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">一条链路：数据进来时是「坐标」，出去时是「像素」——每一层都可能悄悄改变它的含义</text>
  <rect x="22" y="240" width="716" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="258" text-anchor="middle" font-size="8.5" fill="#B91C1C">最贵的错 —— 坐标系没标注：同一地点两套坐标差数百米</text>
  <rect x="22" y="302" width="716" height="50" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="320" text-anchor="middle" font-size="8.5" fill="#C2410C">最烦的错 —— 用度当米：把 0.01° 当成 10 m，形状都变了</text>
  <rect x="22" y="364" width="716" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="382" text-anchor="middle" font-size="8.5" fill="#6D28D9">最隐蔽的错 —— 瓦片只靠 TTL 不靠版本：新旧数据混着看</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
