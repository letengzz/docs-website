<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="434" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">围栏判定的四个状态与滞回死区</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">几何只判「在不在」，工程要判「该不该报一次」</text>
  <text x="150" y="96" text-anchor="middle" font-size="9.5" fill="#334155" font-weight="bold">围栏半径 r，滞回带 h</text>
  <circle cx="150" cy="212" r="88" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="150" cy="212" r="64" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="150" y="208" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">IN 区</text>
  <text x="150" y="224" text-anchor="middle" font-size="8" fill="#047857">（r − h 以内）</text>
  <line x1="150" y1="124" x2="150" y2="112" stroke="#059669" stroke-width="1.2"/>
  <text x="150" y="106" text-anchor="middle" font-size="8" fill="#059669">r − h：入口阈值</text>
  <line x1="150" y1="300" x2="150" y2="312" stroke="#2563EB" stroke-width="1.2"/>
  <text x="150" y="326" text-anchor="middle" font-size="8" fill="#2563EB">r + h：出口阈值</text>
  <text x="150" y="262" text-anchor="middle" font-size="7.5" fill="#64748B">进入需持续 T 秒</text>
  <rect x="330" y="76" width="190" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="425" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">OUT</text>
  <text x="425" y="111" text-anchor="middle" font-size="8" fill="#334155">初始 / 远离围栏</text>
  <rect x="330" y="146" width="190" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="425" y="164.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">NEAR</text>
  <text x="425" y="181" text-anchor="middle" font-size="8" fill="#1D4ED8">靠近，但未确认</text>
  <rect x="330" y="216" width="190" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="425" y="234.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">IN</text>
  <text x="425" y="251" text-anchor="middle" font-size="8" fill="#047857">已进入（上报 enter）</text>
  <rect x="330" y="286" width="190" height="54" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="425" y="304.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">LEAVING</text>
  <text x="425" y="321" text-anchor="middle" font-size="8" fill="#C2410C">越过 r + h（上报 exit）</text>
  <line x1="425" y1="130" x2="425" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="425" y1="200" x2="425" y2="214" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="425" y1="270" x2="425" y2="284" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="520" y1="313" x2="536" y2="313" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="536" y1="313" x2="536" y2="243" stroke="#F59E0B" stroke-width="1.2"/>
  <line x1="536" y1="243" x2="522" y2="243" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="566" y="334" text-anchor="middle" font-size="7.5" fill="#B45309">回到 r − h 内</text>
  <rect x="549" y="76" width="196" height="120" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="647" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">三个不变量</text>
  <text x="647" y="111" text-anchor="middle" font-size="7.2" fill="#0F766E">① 只在下标变化时写事件</text>
  <text x="647" y="127.56" text-anchor="middle" font-size="7.2" fill="#0F766E">② 幂等键 (device,fence,seq)</text>
  <text x="647" y="144.12" text-anchor="middle" font-size="7.2" fill="#0F766E">③ accuracy 参与判定</text>
  <rect x="549" y="210" width="196" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="647" y="228.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">抽稀（本机 1200 点）</text>
  <text x="647" y="245" text-anchor="middle" font-size="7.5" fill="#6D28D9">1 m → 33.58%</text>
  <text x="647" y="262.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">5 m → 3.33%</text>
  <text x="647" y="279.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">20 m → 0.17%（过度）</text>
  <rect x="15" y="366" width="730" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="384" text-anchor="middle" font-size="8.5" fill="#B91C1C">没有滞回 + 没有幂等：站在边界上的人一分钟能刷出十几条进出记录</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
