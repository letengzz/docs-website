<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="466" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">渲染管线的五段与三个错位点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">前端只有一种坐标：屏幕像素；争论要落到「这个像素从哪来」</text>
  <rect x="22" y="76" width="132" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="88" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">数据 4326</text>
  <text x="88" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">GeoJSON / MVT</text>
  <line x1="156" y1="118" x2="168" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="170" y="76" width="132" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="236" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">瓦片 3857</text>
  <text x="236" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">ST_TileEnvelope</text>
  <line x1="304" y1="118" x2="316" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="318" y="76" width="132" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="384" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">样式 layers</text>
  <text x="384" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">面→线→点→标注</text>
  <line x1="452" y1="118" x2="464" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="466" y="76" width="132" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="532" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">GPU 绘制</text>
  <text x="532" y="111" text-anchor="middle" font-size="7.5" fill="#047857">WebGL2</text>
  <line x1="600" y1="118" x2="612" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="614" y="76" width="132" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="680" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">像素</text>
  <text x="680" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">点击与命中</text>
  <text x="380" y="186" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">每一段都可能悄悄换掉「位置」的含义</text>
  <rect x="22" y="204" width="716" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="222" text-anchor="middle" font-size="8.5" fill="#B91C1C">错位点一：底图 GCJ-02 + 数据 WGS84 → 整体偏数百米</text>
  <rect x="22" y="262" width="716" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="380" y="280" text-anchor="middle" font-size="8.5" fill="#C2410C">错位点二：ST_MakeEnvelope 用经纬度包框 → 要素压到瓦片角落</text>
  <rect x="22" y="320" width="716" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="338" text-anchor="middle" font-size="8.5" fill="#6D28D9">错位点三：命中框 1 px → 手指点不中（触控要 ≥ 44 px）</text>
  <rect x="22" y="384" width="350" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="197" y="402.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">MapLibre GL JS 6.x</text>
  <text x="197" y="419" text-anchor="middle" font-size="8" fill="#334155">仅 ESM、强制 WebGL2、样式规范 v25</text>
  <rect x="388" y="384" width="350" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="563" y="402.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">Leaflet 1.9.x</text>
  <text x="563" y="419" text-anchor="middle" font-size="8" fill="#334155">栅格优先、DOM 标记、少量要素更省心</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
