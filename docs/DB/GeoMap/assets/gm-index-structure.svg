<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">从几何到索引：外包框是唯一的加速入口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">GiST 只负责排除，最后一步永远精确计算；形状决定排除率</text>
  <rect x="24" y="76" width="150" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="99" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">几何</text>
  <text x="99" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">Polygon / Line / Point</text>
  <text x="99" y="128.25" text-anchor="middle" font-size="7.5" fill="#4338CA">带 SRID 的 WKB</text>
  <line x1="178" y1="118" x2="204" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="208" y="76" width="150" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="283" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">外包框 bbox</text>
  <text x="283" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">最小外接矩形</text>
  <text x="283" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">索引只认它</text>
  <line x1="362" y1="118" x2="388" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="392" y="76" width="150" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="467" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">GiST 树</text>
  <text x="467" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">按 bbox 嵌套</text>
  <text x="467" y="128.25" text-anchor="middle" font-size="7.5" fill="#0F766E">自顶向下剪枝</text>
  <line x1="546" y1="118" x2="572" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="576" y="76" width="160" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="656" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">候选行</text>
  <text x="656" y="111" text-anchor="middle" font-size="7.5" fill="#047857">少数进入精算</text>
  <text x="656" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">其余被排除</text>
  <text x="380" y="190" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">两级过滤：先用 bbox 排除「肯定不在」，再逐行精确计算</text>
  <rect x="24" y="206" width="348" height="116" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="198" y="224.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">外包框放大率（本机 2000 次随机）</text>
  <text x="198" y="241" text-anchor="middle" font-size="7.5" fill="#C2410C">圆：1.2732（恒为 4/π）</text>
  <text x="198" y="258.25" text-anchor="middle" font-size="7.5" fill="#C2410C">旋转长条：中位 11.888</text>
  <text x="198" y="275.5" text-anchor="middle" font-size="7.5" fill="#C2410C">P95 22.299，最大 25.633</text>
  <rect x="392" y="206" width="344" height="116" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="564" y="224.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">三种索引结构</text>
  <text x="564" y="241" text-anchor="middle" font-size="7.5" fill="#334155">GiST：通用，支持 KNN 排序</text>
  <text x="564" y="258.25" text-anchor="middle" font-size="7.5" fill="#334155">SP-GiST：点密集、只做框选</text>
  <text x="564" y="275.5" text-anchor="middle" font-size="7.5" fill="#334155">BRIN：物理顺序与空间强相关</text>
  <rect x="24" y="336" width="712" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="354" text-anchor="middle" font-size="8.5" fill="#B91C1C">慢的根因往往不是「没建索引」，而是「外包框不贴合」——放大 20 倍就要精算 20 倍的行</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
