<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="418" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四个基本问题与三段链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一段都有一个不可逆决定，改它要同时动数据、接口、缓存</text>
  <rect x="22" y="76" width="350" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="197" y="94.2" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">① 位置怎么记</text>
  <text x="197" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">坐标系 / 轴序 / 小数位</text>
  <text x="197" y="128.25" text-anchor="middle" font-size="7.5" fill="#4338CA">失效：整体偏移数百米</text>
  <text x="197" y="145.5" text-anchor="middle" font-size="7.5" fill="#4338CA">手段：src_crs + typmod</text>
  <rect x="388" y="76" width="350" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="563" y="94.2" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">② 关系怎么算</text>
  <text x="563" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">距离 / 包含 / 最近邻</text>
  <text x="563" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">失效：用度当米，形状变形</text>
  <text x="563" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">手段：geography 或投影</text>
  <rect x="22" y="192" width="350" height="100" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="197" y="210.2" text-anchor="middle" font-size="11" fill="#115E59" font-weight="bold">③ 范围怎么取</text>
  <text x="197" y="227" text-anchor="middle" font-size="7.5" fill="#0F766E">外包框 / 网格 / 瓦片</text>
  <text x="197" y="244.25" text-anchor="middle" font-size="7.5" fill="#0F766E">失效：扫全表或丢要素</text>
  <text x="197" y="261.5" text-anchor="middle" font-size="7.5" fill="#0F766E">手段：GiST + 分块</text>
  <rect x="388" y="192" width="350" height="100" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="563" y="210.2" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">④ 怎么给人看</text>
  <text x="563" y="227" text-anchor="middle" font-size="7.5" fill="#B45309">底图 / 图层 / 命中</text>
  <text x="563" y="244.25" text-anchor="middle" font-size="7.5" fill="#B45309">失效：点得中但选不中</text>
  <text x="563" y="261.5" text-anchor="middle" font-size="7.5" fill="#B45309">手段：同源坐标 + 容差</text>
  <line x1="372" y1="126" x2="388" y2="126" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="372" y1="242" x2="388" y2="242" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">先分类再动手：四类问题的排查路径完全不重叠</text>
  <rect x="22" y="344" width="716" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="362.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">三段链路</text>
  <text x="380" y="379" text-anchor="middle" font-size="8.5" fill="#334155">入库（原始坐标 → 带 SRID 的几何）→ 查询（条件 → 候选与距离）→ 出图（要素 → 瓦片 → 像素）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
