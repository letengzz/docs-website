<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="398" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">瓦片金字塔：编号、分辨率、体积与缓存版本</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">预生成是「存储换延迟」；层级越高，总量增长越快</text>
  <rect x="20" y="78" width="150" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="95" y="96" text-anchor="middle" font-size="8.5" fill="#4338CA">z=10 · 4 块 · 117.27 m/px</text>
  <rect x="20" y="126" width="220" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="144" text-anchor="middle" font-size="8.5" fill="#1D4ED8">z=12 · 42 块 · 29.32 m/px</text>
  <rect x="20" y="174" width="300" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="170" y="192" text-anchor="middle" font-size="8.5" fill="#0F766E">z=14 · 437 块 · 7.33 m/px</text>
  <rect x="20" y="222" width="400" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="220" y="240" text-anchor="middle" font-size="8.5" fill="#047857">z=16 · 6 624 块 · 1.83 m/px</text>
  <rect x="20" y="270" width="520" height="40" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="280" y="288" text-anchor="middle" font-size="8.5" fill="#B45309">z=18 · 104 390 块 · 0.46 m/px</text>
  <rect x="586" y="78" width="154" height="158" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="663" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">缓存四件事</text>
  <text x="663" y="113" text-anchor="middle" font-size="7.2" fill="#334155">版本号进 URL</text>
  <text x="663" y="129.56" text-anchor="middle" font-size="7.2" fill="#334155">immutable + 长 TTL</text>
  <text x="663" y="146.12" text-anchor="middle" font-size="7.2" fill="#334155">空瓦片 200 + 空体</text>
  <text x="663" y="162.68" text-anchor="middle" font-size="7.2" fill="#334155">换版保留 7 天</text>
  <rect x="20" y="330" width="720" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="348" text-anchor="middle" font-size="8.5" fill="#6D28D9">层级每升一级，瓦片数约 ×4：z=14 一个城市 437 块，z=18 是 104 390 块——差 200 倍</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
