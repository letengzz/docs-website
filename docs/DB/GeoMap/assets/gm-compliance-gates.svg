<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="396" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">地图合规的五道闸门</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">底图 → 精度 → 要素 → 审图号 → 交付，任何一道都不可灰度</text>
  <rect x="20" y="80" width="132" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="86" y="98.2" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">① 底图来源</text>
  <text x="86" y="115" text-anchor="middle" font-size="7" fill="#4338CA">标准地图 / 有资质服务商</text>
  <text x="86" y="131.1" text-anchor="middle" font-size="7" fill="#4338CA">不自绘国界与界线</text>
  <line x1="154" y1="132" x2="164" y2="132" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="166" y="80" width="132" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="232" y="98.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">② 精度上限</text>
  <text x="232" y="115" text-anchor="middle" font-size="7" fill="#1D4ED8">平面不优于 10 m</text>
  <text x="232" y="131.1" text-anchor="middle" font-size="7" fill="#1D4ED8">高程 15 m，影像 0.5 m</text>
  <line x1="300" y1="132" x2="310" y2="132" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="312" y="80" width="132" height="104" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="378" y="98.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">③ 不得表示</text>
  <text x="378" y="115" text-anchor="middle" font-size="7" fill="#C2410C">军事设施、核设施</text>
  <text x="378" y="131.1" text-anchor="middle" font-size="7" fill="#C2410C">重要管线、基准站</text>
  <line x1="446" y1="132" x2="456" y2="132" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="458" y="80" width="132" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="524" y="98.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">④ 审图号</text>
  <text x="524" y="115" text-anchor="middle" font-size="7" fill="#0F766E">送审并核发</text>
  <text x="524" y="131.1" text-anchor="middle" font-size="7" fill="#0F766E">显著位置标注</text>
  <line x1="592" y1="132" x2="602" y2="132" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="604" y="80" width="132" height="104" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="670" y="98.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">⑤ 交付形态</text>
  <text x="670" y="115" text-anchor="middle" font-size="7" fill="#B45309">离线包带 source.json</text>
  <text x="670" y="131.1" text-anchor="middle" font-size="7" fill="#B45309">含有效期与回收</text>
  <rect x="20" y="206" width="350" height="104" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="224.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">两条容易漏的边界</text>
  <text x="195" y="241" text-anchor="middle" font-size="7.5" fill="#B91C1C">「只画业务点」不构成豁免：有地图图形即受约束</text>
  <text x="195" y="258.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">标注式例外不等于可以表示禁止内容</text>
  <rect x="388" y="206" width="352" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="564" y="224.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">规范有效期</text>
  <text x="564" y="241" text-anchor="middle" font-size="7.5" fill="#6D28D9">自然资规〔2023〕2 号：实施起 5 年</text>
  <text x="564" y="258.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">2023-02-06 → 约 2028-02 复核</text>
  <text x="564" y="275.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">把复核日期写进发布检查单</text>
  <rect x="20" y="324" width="720" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="342" text-anchor="middle" font-size="8.5" fill="#334155">判据：脚本只能证明「配置里写了审图号」，证明不了「这个号适用于这张图」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
