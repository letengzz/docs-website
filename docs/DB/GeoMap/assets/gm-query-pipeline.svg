<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一条空间查询的两级过滤</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">优化的全部内容：让第一级排除得更多、让第二级算得更少</text>
  <rect x="24" y="76" width="168" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="108" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">SQL 谓词</text>
  <text x="108" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">ST_DWithin</text>
  <text x="108" y="128.25" text-anchor="middle" font-size="7.5" fill="#4338CA">ST_Covers / &lt;-&gt;</text>
  <text x="108" y="145.5" text-anchor="middle" font-size="7.5" fill="#4338CA">&amp;&amp; 预过滤</text>
  <line x1="196" y1="122" x2="222" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="226" y="76" width="168" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="310" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">bbox 过滤</text>
  <text x="310" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">走 GiST 索引</text>
  <text x="310" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">排除大部分行</text>
  <line x1="398" y1="122" x2="424" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="428" y="76" width="150" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="503" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">精确计算</text>
  <text x="503" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">球面 / 平面</text>
  <text x="503" y="128.25" text-anchor="middle" font-size="7.5" fill="#0F766E">逐行判定</text>
  <line x1="582" y1="122" x2="606" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="610" y="76" width="126" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="673" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">排序取前 N</text>
  <text x="673" y="111" text-anchor="middle" font-size="7.5" fill="#047857">KNN 有序扫描</text>
  <text x="673" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">键集分页</text>
  <rect x="24" y="194" width="168" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="108" y="212" text-anchor="middle" font-size="8" fill="#047857">ST_DWithin：✅ 可用</text>
  <rect x="204" y="194" width="168" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="288" y="212" text-anchor="middle" font-size="8" fill="#047857">ST_Covers：✅ 可用</text>
  <rect x="384" y="194" width="168" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="468" y="212" text-anchor="middle" font-size="8" fill="#047857">&lt;-&gt; KNN：✅ 有序扫描</text>
  <rect x="564" y="194" width="168" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="648" y="212" text-anchor="middle" font-size="8" fill="#B91C1C">ST_Distance(…) &lt; r：❌ 全表</text>
  <text x="380" y="276" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">同一个语义，两种写法：差别只在「列有没有被函数包住」</text>
  <rect x="24" y="292" width="348" height="100" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="198" y="310.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">单位跟着类型走</text>
  <text x="198" y="327" text-anchor="middle" font-size="7.5" fill="#C2410C">geography + 1000 = 1000 米</text>
  <text x="198" y="344.25" text-anchor="middle" font-size="7.5" fill="#C2410C">geometry(4326) + 0.01 = 0.01 度</text>
  <text x="198" y="361.5" text-anchor="middle" font-size="7.5" fill="#C2410C">geometry(3857) + 1000 = 被放大的米</text>
  <rect x="392" y="292" width="344" height="100" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="564" y="310.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">0.01° 在北京的形状</text>
  <text x="564" y="327" text-anchor="middle" font-size="7.5" fill="#B45309">东西向 855.1 m，南北向 1110.3 m</text>
  <text x="564" y="344.25" text-anchor="middle" font-size="7.5" fill="#B45309">长轴是短轴的 1.298 倍</text>
  <text x="564" y="361.5" text-anchor="middle" font-size="7.5" fill="#B45309">北纬 60° 处变成 2 倍</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
