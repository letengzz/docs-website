<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="执行身份被切换的三个位置">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">三个「执行身份」切换点：策略在这之后就管不到了</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">RLS 与 GRANT 判的都是 current_user；谁能改 current_user，谁就能越过前两道</text>

  <rect x="24" y="76" width="180" height="56" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="114" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">调用者 app_rw</text>
  <text x="114" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">策略按它判</text>

  <path d="M 204 104 L 268 104" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="272" y="72" width="212" height="64" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="288" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">① 视图（默认）</text>
  <text x="288" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">以视图所有者身份执行</text>

  <rect x="500" y="72" width="236" height="64" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="516" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">security_invoker = true</text>
  <text x="516" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">改回调用者身份，策略重新生效</text>

  <rect x="272" y="160" width="212" height="64" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="288" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">② SECURITY DEFINER 函数</text>
  <text x="288" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">以函数所有者的身份执行</text>

  <rect x="500" y="160" width="236" height="64" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="516" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">SET search_path = public, pg_temp</text>
  <text x="516" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">锁死对象解析顺序，防同名劫持</text>

  <rect x="272" y="248" width="212" height="64" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="288" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">③ SET ROLE / SET SESSION AUTH</text>
  <text x="288" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">连接池里的复位失败会带到下个请求</text>

  <rect x="500" y="248" width="236" height="64" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="516" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">RESET ROLE + DISCARD ALL</text>
  <text x="516" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">还连接前把身份与 GUC 一起复位</text>

  <rect x="24" y="336" width="712" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">实测：未固定 search_path 的函数被同名表劫持</text>
  <text x="40" y="382" font-family="monospace" font-size="11.5" fill="#334155">attacker: CREATE SCHEMA evil; CREATE TABLE evil.audit_log(...); SET search_path = evil, public;</text>
  <text x="40" y="400" font-family="monospace" font-size="11.5" fill="#334155">SELECT write_log('confidential');  →  public.audit_log 仍是 1 行，evil.audit_log 变成 1 行</text>
  <text x="40" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#b91c1c">加 SET search_path 后同一攻击写入 0 行；但 SET search_path 会活过 RESET ROLE，排查时先 SHOW search_path。</text>
</svg>
