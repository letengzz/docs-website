<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="权限故障的四种症状与分诊顺序">
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">四种症状，四组检查，顺序不能颠倒</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">先把「谁在执行」查清，再查「授权够不够」，最后才怀疑策略写法</text>

  <rect x="24" y="76" width="164" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="106" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">permission denied</text>
  <text x="106" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">对象特权 / schema USAGE</text>

  <rect x="208" y="76" width="164" height="70" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.3"/>
  <text x="290" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">查到了 0 行</text>
  <text x="290" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">策略上下文 / 身份被切换</text>

  <rect x="392" y="76" width="164" height="70" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="474" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">看到了别人的行</text>
  <text x="474" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">视图 / 函数 / BYPASSRLS</text>

  <rect x="576" y="76" width="160" height="70" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="656" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">审计里查不到</text>
  <text x="656" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">身份未区分 / 日志级别</text>

  <line x1="106" y1="146" x2="106" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>
  <line x1="290" y1="146" x2="290" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>
  <line x1="474" y1="146" x2="474" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>
  <line x1="656" y1="146" x2="656" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e293b">
    <text x="30" y="200">SELECT current_user, session_user;</text>
    <text x="30" y="220">has_table_privilege(...)</text>
    <text x="30" y="240">SHOW search_path;</text>

    <text x="214" y="200">SHOW app.tenant_id;</text>
    <text x="214" y="220">coalesce vs 空串</text>
    <text x="214" y="240">EXPLAIN 看策略</text>

    <text x="398" y="200">\d+ 视图 / pg_policies</text>
    <text x="398" y="220">prosecdef · proconfig</text>
    <text x="398" y="240">rolbypassrls</text>

    <text x="582" y="200">log_statement 级别</text>
    <text x="582" y="220">application_name</text>
    <text x="582" y="240">审计表是否被写</text>
  </g>

  <rect x="24" y="264" width="712" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">一条万能第一步：把「你以为的身份」打出来</text>
  <text x="40" y="310" font-family="monospace" font-size="11.5" fill="#334155">SELECT session_user, current_user, current_setting('search_path'),</text>
  <text x="40" y="328" font-family="monospace" font-size="11.5" fill="#334155">       current_setting('app.tenant_id', true) AS tenant;</text>
  <text x="40" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">session_user 是连接进来的账号，current_user 是此刻干活的角色；两者不同就说明有 SET ROLE 或安全定义函数。</text>
  <text x="40" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#b91c1c">tenant 显示空串（不是 null）说明有人 SET LOCAL 过又复位了——空串和没设过是两回事。</text>
</svg>
