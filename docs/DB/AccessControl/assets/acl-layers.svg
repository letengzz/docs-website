<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="一条 SQL 通过六道权限闸门的判定链">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">一条查询要过六道闸门</text>
  <text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">任何一道失败，后面的都不用看；任何一道被「绕过」，审计里就少一段证据</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="24" y="78" width="330" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="40" y="102" font-size="13" font-weight="700" fill="#1d4ed8">① 连接认证</text>
    <text x="40" y="122" font-size="11.5" fill="#334155">pg_hba：scram-sha-256 / peer / cert</text>

    <rect x="404" y="78" width="330" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="420" y="102" font-size="13" font-weight="700" fill="#1d4ed8">② 登录角色</text>
    <text x="420" y="122" font-size="11.5" fill="#334155">LOGIN / NOLOGIN、是否超级用户、BYPASSRLS</text>

    <rect x="404" y="158" width="330" height="58" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.3"/>
    <text x="420" y="182" font-size="13" font-weight="700" fill="#047857">③ 组角色与 SET ROLE</text>
    <text x="420" y="202" font-size="11.5" fill="#334155">NOINHERIT 时必须显式 SET ROLE 才拿到特权</text>

    <rect x="24" y="158" width="330" height="58" rx="7" fill="#f0fdf4" stroke="#059669" stroke-width="1.3"/>
    <text x="40" y="182" font-size="13" font-weight="700" fill="#047857">④ schema 与对象特权</text>
    <text x="40" y="202" font-size="11.5" fill="#334155">USAGE on schema、SELECT / INSERT、列级 GRANT</text>

    <rect x="24" y="238" width="330" height="58" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="40" y="262" font-size="13" font-weight="700" fill="#b45309">⑤ 行级策略（RLS）</text>
    <text x="40" y="282" font-size="11.5" fill="#334155">USING 过滤可见行，WITH CHECK 拦非法写入</text>

    <rect x="404" y="238" width="330" height="58" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="420" y="262" font-size="13" font-weight="700" fill="#b45309">⑥ 执行身份是否被切换</text>
    <text x="420" y="282" font-size="11.5" fill="#334155">视图 default 以所有者执行；SECURITY DEFINER 同</text>
  </g>

  <path d="M 354 107 L 404 107" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M 569 136 L 569 158" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M 404 187 L 354 187" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M 189 216 L 189 238" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M 354 267 L 404 267" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="24" y="316" width="712" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="40" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">实测：第 ⑤ 与第 ⑥ 道之间那条缝</text>
  <text x="40" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">租户 acme 的账号直查表：1 行（策略生效）；同名视图默认以所有者执行：2 行（策略被绕过）。</text>
  <text x="40" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">表加 FORCE ROW LEVEL SECURITY 后视图才回到 1 行；视图加 security_invoker = true 也能回到 1 行。</text>
  <text x="40" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">另一个方向：TRUNCATE 在 RLS 表上照样清空全部租户——RLS 是行级设施，管不到「表级一次性动作」。</text>
  <text x="40" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">这两条都不是配置写错，而是「以为策略管的是数据，其实管的是当前执行角色对行的读写」。</text>
</svg>
