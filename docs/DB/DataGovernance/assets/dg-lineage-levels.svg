<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="860" height="500" fill="#FFFFFF"/>
  <text x="430" y="32" text-anchor="middle" font-size="17" fill="#0F172A" font-weight="bold">血缘的两个粒度、四种来源与可信度分级</text>
  <text x="430" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">粒度决定能回答什么问题，来源决定它能被信到什么程度</text>

  <rect x="36" y="74" width="392" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="232" y="98" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">表级血缘</text>
  <text x="56" y="124" font-size="9.5" fill="#1D4ED8">记录：A 表 → 作业 J → B 表</text>
  <text x="56" y="146" font-size="9.5" fill="#1D4ED8">能答：改 B 表结构，哪些作业会挂</text>
  <text x="56" y="168" font-size="9.5" fill="#64748B">成本：低（从作业配置与调度 DAG 就能拿）</text>
  <text x="56" y="190" font-size="9.5" fill="#64748B">覆盖：几乎全（正规调度链路都能覆盖）</text>
  <text x="56" y="212" font-size="9.5" fill="#B91C1C">盲区：同一张表里改了哪个字段，答不出</text>

  <rect x="432" y="74" width="392" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="628" y="98" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">列级血缘</text>
  <text x="452" y="124" font-size="9.5" fill="#047857">记录：A.amt → 变换 → B.pay_amount</text>
  <text x="452" y="146" font-size="9.5" fill="#047857">能答：删这一列，哪些报表会少字段</text>
  <text x="452" y="168" font-size="9.5" fill="#64748B">成本：高（必须解析 SQL，且要跟方言）</text>
  <text x="452" y="190" font-size="9.5" fill="#64748B">覆盖：只到能被解析的那部分 SQL</text>
  <text x="452" y="212" font-size="9.5" fill="#B91C1C">盲区：SELECT *、动态 SQL、UDF 内部</text>

  <rect x="36" y="242" width="788" height="128" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
  <text x="430" y="266" text-anchor="middle" font-size="11.5" fill="#1E293B" font-weight="bold">四种来源：只有前两种是自动的</text>
  <text x="56" y="292" font-size="9.5" fill="#334155">① 作业 / 调度框架上报（表级，最可靠，前提是作业真的在框架里跑）</text>
  <text x="56" y="314" font-size="9.5" fill="#334155">② SQL 解析（列级，覆盖取决于语法：UNION / 窗口函数 / CTE / 子查询别名各有坑）</text>
  <text x="56" y="336" font-size="9.5" fill="#334155">③ 人工登记（动态 SQL、脚本直连、手工补数——必须给它们一个入口）</text>
  <text x="56" y="358" font-size="9.5" fill="#B91C1C">④ 手画（不采集，只用于讲解；一旦当依据用，失效时没有任何提示）</text>

  <rect x="36" y="386" width="788" height="94" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
  <text x="430" y="410" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">可信度三级：每条边都要带一个等级与刷新时间</text>
  <text x="56" y="436" font-size="9.5" fill="#C2410C">A 级（自动 + 近 24h 刷新）：可以作为阻断级变更评审的依据</text>
  <text x="56" y="458" font-size="9.5" fill="#C2410C">B 级（自动但已超期 / 人工登记）：可以用于圈定影响范围，但须人工复核</text>
  <text x="56" y="478" font-size="9.5" fill="#991B1B">C 级（手画 / 无来源）：只能当文档看；变更评审不得据此判断「无影响」</text>
</svg>
