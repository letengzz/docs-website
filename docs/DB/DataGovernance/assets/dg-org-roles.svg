<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="860" height="470" fill="#FFFFFF"/>
  <text x="430" y="32" text-anchor="middle" font-size="17" fill="#0F172A" font-weight="bold">三类角色、两条流程与一条度量</text>
  <text x="430" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">角色按「出了问题谁被叫」划分；流程按「什么事必须走一道手续」划分</text>

  <rect x="36" y="74" width="788" height="118" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="430" y="98" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">三类角色：切分标准是「谁有权做决定」，不是「谁写代码」</text>
  <rect x="56" y="112" width="248" height="66" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="180" y="134" text-anchor="middle" font-size="10.5" fill="#1D4ED8" font-weight="bold">负责人（Owner）</text>
  <text x="180" y="154" text-anchor="middle" font-size="9" fill="#1D4ED8">定口径、担结果、批变更</text>
  <text x="180" y="170" text-anchor="middle" font-size="8.5" fill="#64748B">一个资产一个责任人，必须是自然人</text>
  <rect x="316" y="112" width="248" height="66" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="440" y="134" text-anchor="middle" font-size="10.5" fill="#1D4ED8" font-weight="bold">管理员（Steward）</text>
  <text x="440" y="154" text-anchor="middle" font-size="9" fill="#1D4ED8">守标准、管目录、审登记</text>
  <text x="440" y="170" text-anchor="middle" font-size="8.5" fill="#64748B">通常按业务域设置，数量少而稳</text>
  <rect x="576" y="112" width="228" height="66" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="690" y="134" text-anchor="middle" font-size="10.5" fill="#1D4ED8" font-weight="bold">保管人（Custodian）</text>
  <text x="690" y="154" text-anchor="middle" font-size="9" fill="#1D4ED8">跑链路、修故障、执行规则</text>
  <text x="690" y="170" text-anchor="middle" font-size="8.5" fill="#64748B">与 Owner 常常不是同一人</text>

  <rect x="36" y="204" width="788" height="128" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
  <text x="430" y="228" text-anchor="middle" font-size="11.5" fill="#9A3412" font-weight="bold">两条必须走手续的流程</text>
  <rect x="56" y="242" width="378" height="76" rx="7" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.4"/>
  <text x="245" y="264" text-anchor="middle" font-size="10.5" fill="#C2410C" font-weight="bold">① 口径变更受理</text>
  <text x="245" y="284" text-anchor="middle" font-size="9" fill="#C2410C">受理 → 影响范围（查血缘）→ 裁决 → 生效日</text>
  <text x="245" y="302" text-anchor="middle" font-size="8.5" fill="#64748B">关键：必须有「裁决人」，且生效日要提前公告</text>
  <rect x="446" y="242" width="358" height="76" rx="7" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.4"/>
  <text x="625" y="264" text-anchor="middle" font-size="10.5" fill="#C2410C" font-weight="bold">② 质量失败分诊与闭环</text>
  <text x="625" y="284" text-anchor="middle" font-size="9" fill="#C2410C">触发 → 定级 → 指派 → 修/废弃 → 补回</text>
  <text x="625" y="302" text-anchor="middle" font-size="8.5" fill="#64748B">关键：每个时刻都有时限，超时能升级</text>

  <rect x="36" y="344" width="788" height="112" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="430" y="368" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">治理自身的度量：投入指标与结果指标必须成对出现</text>
  <rect x="56" y="382" width="378" height="60" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="245" y="404" text-anchor="middle" font-size="10" fill="#047857" font-weight="bold">投入指标（会被口径放大，单独看必被优化）</text>
  <text x="245" y="426" text-anchor="middle" font-size="9" fill="#047857">资产数 · 规则数 · 覆盖率 · 培训人次</text>
  <rect x="446" y="382" width="358" height="60" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="625" y="404" text-anchor="middle" font-size="10" fill="#047857" font-weight="bold">结果指标（真正衡量治理有没有用）</text>
  <text x="625" y="426" text-anchor="middle" font-size="9" fill="#047857">口径争议闭环天数 · 提前发现比例 · 返工工时</text>
</svg>
