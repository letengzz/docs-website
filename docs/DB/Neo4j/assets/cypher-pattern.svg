<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="280" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0b162a">Cypher：把要找的图「画」出来</text>

  <!-- graph -->
  <circle cx="140" cy="150" r="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="140" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">User</text>
  <text x="140" y="163" text-anchor="middle" font-size="10" fill="#065f46">uid=u2</text>
  <circle cx="330" cy="110" r="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="330" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">User</text>
  <text x="330" y="123" text-anchor="middle" font-size="10" fill="#065f46">?</text>
  <circle cx="520" cy="160" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Post</text>
  <text x="520" y="177" text-anchor="middle" font-size="10" fill="#1e3a5f">views&gt;100</text>

  <line x1="168" y1="140" x2="298" y2="116" stroke="#10b981" stroke-width="2.5" marker-end="url(#c1)"/>
  <text x="233" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">FOLLOWS</text>
  <line x1="352" y1="128" x2="492" y2="150" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#c2)"/>
  <text x="422" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">LIKED</text>

  <!-- code -->
  <rect x="90" y="212" width="500" height="44" rx="8" fill="#0f172a"/>
  <text x="340" y="230" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="Menlo, monospace">MATCH (u:User {uid:$uid})-[:FOLLOWS]->(f:User)-[:LIKED]->(p:Post)</text>
  <text x="340" y="248" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Menlo, monospace">WHERE p.views > 100 RETURN p.title</text>

  <text x="640" y="150" text-anchor="middle" font-size="11" fill="#64748b">问：u2 关注的人</text>
  <text x="640" y="168" text-anchor="middle" font-size="11" fill="#64748b">赞过什么？</text>
  <text x="340" y="270" text-anchor="middle" font-size="11.5" fill="#334155">声明式：描述「形状 + 条件」，引擎自己决定怎么走——同一模式，小图遍历、大图走索引</text>
  <defs>
    <marker id="c1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#10b981"/></marker>
    <marker id="c2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
