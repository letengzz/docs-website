<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="380" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0b162a">同一段业务，两种存法：「谁关注了谁」</text>

  <!-- left: relational -->
  <rect x="30" y="56" width="290" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">关系型：join 出关系</text>
  <rect x="50" y="98" width="120" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="110" y="120" text-anchor="middle" font-size="12" fill="#1e3a5f">users 表</text>
  <rect x="180" y="98" width="120" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="240" y="120" text-anchor="middle" font-size="12" fill="#1e3a5f">posts 表</text>
  <rect x="115" y="176" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="175" y="198" text-anchor="middle" font-size="12" fill="#334155">follows 关联表</text>
  <line x1="110" y1="132" x2="160" y2="176" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="240" y1="132" x2="192" y2="176" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a1)"/>
  <text x="175" y="240" text-anchor="middle" font-size="11" fill="#64748b">二度人脉 = follows ⋈ follows ⋈ users</text>
  <text x="175" y="260" text-anchor="middle" font-size="11" fill="#b91c1c">跳数 +1，join 层数 +1，代价指数增长</text>
  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#334155">擅长：按行取数、事务、聚合</text>

  <!-- right: graph -->
  <rect x="360" y="56" width="290" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">图：关系即数据</text>
  <circle cx="450" cy="140" r="26" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="145" text-anchor="middle" font-size="12" fill="#065f46">用户A</text>
  <circle cx="560" cy="120" r="26" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" font-size="12" fill="#065f46">用户B</text>
  <circle cx="505" cy="230" r="26" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="505" y="235" text-anchor="middle" font-size="12" fill="#1e3a5f">文章P</text>
  <line x1="474" y1="150" x2="536" y2="130" stroke="#10b981" stroke-width="2" marker-end="url(#a2)"/>
  <text x="505" y="132" text-anchor="middle" font-size="10" fill="#059669">FOLLOWS</text>
  <line x1="553" y1="144" x2="522" y2="206" stroke="#3b82f6" stroke-width="2" marker-end="url(#a3)"/>
  <text x="563" y="180" text-anchor="middle" font-size="10" fill="#2563eb">LIKED</text>
  <text x="505" y="290" text-anchor="middle" font-size="11" fill="#64748b">二度人脉 = 沿指针走两步</text>
  <text x="505" y="310" text-anchor="middle" font-size="11" fill="#047857">跳数 +1，遍历步数 +1，代价线性</text>

  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#10b981"/></marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
