<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="330" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0b162a">应用集成：MySQL 管账本 + Neo4j 管关系</text>

  <!-- app -->
  <rect x="270" y="56" width="140" height="46" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="340" y="76" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b162a">应用层</text>
  <text x="340" y="93" text-anchor="middle" font-size="10" fill="#64748b">业务事务边界</text>

  <!-- mysql -->
  <g>
    <ellipse cx="170" cy="180" rx="95" ry="46" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">MySQL</text>
    <text x="170" y="196" text-anchor="middle" font-size="10" fill="#1e3a5f">账本 · 事务 · 聚合</text>
  </g>
  <!-- neo4j -->
  <g>
    <ellipse cx="510" cy="180" rx="95" ry="46" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="510" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Neo4j</text>
    <text x="510" y="196" text-anchor="middle" font-size="10" fill="#065f46">关系 · 遍历 · 图算法</text>
  </g>

  <line x1="245" y1="102" x2="195" y2="136" stroke="#3b82f6" stroke-width="2" marker-end="url(#i1)"/>
  <line x1="435" y1="102" x2="485" y2="136" stroke="#10b981" stroke-width="2" marker-end="url(#i2)"/>

  <!-- sync routes -->
  <text x="340" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">两条库之间怎么同步（三选一，别三管齐下）</text>
  <g>
    <rect x="60" y="278" width="180" height="40" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
    <text x="150" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#0b162a">双写（入口少）</text>
    <text x="150" y="311" text-anchor="middle" font-size="9.5" fill="#64748b">同一业务边界内写两边 + 补偿</text>
  </g>
  <g>
    <rect x="255" y="278" width="180" height="40" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
    <text x="345" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#0b162a">CDC 管道（入口多）</text>
    <text x="345" y="311" text-anchor="middle" font-size="9.5" fill="#64748b">binlog → Kafka → 写图</text>
  </g>
  <g>
    <rect x="450" y="278" width="180" height="40" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
    <text x="540" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#0b162a">定时对账（容忍 T+1）</text>
    <text x="540" y="311" text-anchor="middle" font-size="9.5" fill="#64748b">离线重建，简单可靠</text>
  </g>

  <defs>
    <marker id="i1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b82f6"/></marker>
    <marker id="i2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#10b981"/></marker>
  </defs>
</svg>
