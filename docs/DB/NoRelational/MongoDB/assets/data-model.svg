<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .rel { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .doc { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .title { font-size: 15px; font-weight: bold; text-anchor: middle; fill: #222; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; text-anchor: middle; }
  </style>

  <text class="title" x="180" y="30">关系型（MySQL）</text>
  <text class="title" x="560" y="30">文档型（MongoDB）</text>

  <rect class="rel" x="40" y="55" width="280" height="60"/>
  <text x="180" y="78">表 users（固定列）</text>
  <text class="small" x="180" y="98">id | name | age | tags 表</text>

  <rect class="doc" x="420" y="55" width="280" height="60"/>
  <text x="560" y="78">集合 users（文档灵活）</text>
  <text class="small" x="560" y="98">每条文档字段可不同</text>

  <rect class="rel" x="40" y="135" width="280" height="50"/>
  <text x="180" y="157">行 1：1 | 张三 | 25 |（tags 需要另一张表）</text>

  <rect class="doc" x="420" y="135" width="280" height="50"/>
  <text x="560" y="157">{ _id, name, age, tags: [...] }</text>

  <rect class="rel" x="40" y="205" width="280" height="50"/>
  <text x="180" y="227">行 2：2 | 李四 | 30 |（缺列填 NULL）</text>

  <rect class="doc" x="420" y="205" width="280" height="50"/>
  <text x="560" y="227">{ _id, name, address: {...} }</text>

  <text class="small" x="180" y="280">表结构固定，需要 JOIN</text>
  <text class="small" x="560" y="280">结构灵活，内嵌数组/对象</text>
</svg>
