<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3a5f">Redis 内存淘汰策略分类</text>
  <rect x="285" y="55" width="190" height="50" rx="10" fill="#1f3a5f" stroke="#0d253f" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">maxmemory-policy</text>
  <line x1="380" y1="105" x2="380" y2="140" stroke="#333" stroke-width="2"/>
  <polygon points="374,138 380,150 386,138" fill="#333"/>
  <rect x="285" y="153" width="190" height="50" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="380" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#880e4f">noeviction</text>
  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#ad1457">不淘汰，写入报错</text>
  <line x1="300" y1="203" x2="180" y2="240" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="203" x2="580" y2="240" stroke="#333" stroke-width="2"/>
  <rect x="40" y="243" width="280" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="180" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">allkeys（任意 key）</text>
  <text x="180" y="295" text-anchor="middle" font-size="13" fill="#37474f">allkeys-lru / allkeys-lfu</text>
  <text x="180" y="316" text-anchor="middle" font-size="13" fill="#37474f">allkeys-random</text>
  <rect x="440" y="243" width="280" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="580" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#bf360c">volatile（仅过期 key）</text>
  <text x="580" y="295" text-anchor="middle" font-size="13" fill="#5d4037">volatile-lru / volatile-lfu</text>
  <text x="580" y="316" text-anchor="middle" font-size="13" fill="#5d4037">volatile-random / volatile-ttl</text>
</svg>
