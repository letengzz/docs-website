<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Redis 持久化：RDB、AOF 与多部分 AOF（MP-AOF）</text>

  <!-- RDB -->
  <rect x="40" y="56" width="240" height="150" rx="12" fill="#fef2f2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="160" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">RDB 快照</text>
  <text x="60" y="108" font-size="11.5" fill="#7f1d1d">BGSAVE 生成全量二进制快照</text>
  <text x="60" y="130" font-size="11.5" fill="#7f1d1d">文件：dump.rdb</text>
  <text x="60" y="152" font-size="11.5" fill="#7f1d1d">优点：文件小、恢复快</text>
  <text x="60" y="174" font-size="11.5" fill="#7f1d1d">缺点：两次快照间可能丢数据</text>
  <text x="60" y="196" font-size="11.5" fill="#991b1b">fork 时有内存与阻塞开销</text>

  <!-- AOF -->
  <rect x="310" y="56" width="240" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">AOF 追加日志</text>
  <text x="330" y="108" font-size="11.5" fill="#1e3a8a">记录每条写命令，重放恢复</text>
  <text x="330" y="130" font-size="11.5" fill="#1e3a8a">everysec 最多丢 1 秒数据</text>
  <text x="330" y="152" font-size="11.5" fill="#1e3a8a">always 最可靠、性能最差</text>
  <text x="330" y="174" font-size="11.5" fill="#1e3a8a">文件会膨胀 → BGREWRITEAOF</text>
  <text x="330" y="196" font-size="11.5" fill="#1e3a8a">混合持久化：RDB 头 + 增量尾</text>

  <!-- MP-AOF -->
  <rect x="580" y="56" width="240" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">多部分 AOF（MP-AOF）</text>
  <text x="600" y="108" font-size="11.5" fill="#14532d">Redis 7.0 起默认启用</text>
  <text x="600" y="130" font-size="11.5" fill="#14532d">base 文件 + 多个 incr 文件</text>
  <text x="600" y="152" font-size="11.5" fill="#14532d">重写时无需重写全量日志</text>
  <text x="600" y="174" font-size="11.5" fill="#14532d">目录：appendonlydir/</text>
  <text x="600" y="196" font-size="11.5" fill="#166534">8.10 起可配合 BACKUP 命令备份</text>

  <!-- config -->
  <rect x="40" y="230" width="780" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="430" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">推荐配置组合</text>
  <text x="62" y="278" font-size="11.5" fill="#78350f">appendonly yes　appendfsync everysec　aof-use-rdb-preamble yes（混合持久化）</text>
  <text x="62" y="300" font-size="11.5" fill="#78350f">save 900 1 / 300 10 / 60 10000（保留 RDB 作为备份与主从全量同步来源）</text>
  <text x="62" y="320" font-size="11.5" fill="#92400e">重要数据再叠加主从复制；但复制不能替代持久化——误删会同步到所有副本</text>

  <!-- restore flow -->
  <rect x="40" y="342" width="780" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="430" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">恢复流程</text>
  <text x="430" y="390" text-anchor="middle" font-size="11.5" fill="#475569">停止实例 → 确认 appendonlydir / dump.rdb 就位 → 启动自动加载 → INFO persistence 校验状态 ok</text>
</svg>
