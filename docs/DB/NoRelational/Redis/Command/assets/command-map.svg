<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Redis 通用命令分类速查</text>

  <rect x="30" y="56" width="190" height="140" rx="12" fill="#fef2f2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="125" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Key 操作</text>
  <text x="48" y="108" font-size="11.5" fill="#7f1d1d">SET / GET / EXISTS / TYPE</text>
  <text x="48" y="130" font-size="11.5" fill="#7f1d1d">DEL（同步） / UNLINK（异步）</text>
  <text x="48" y="152" font-size="11.5" fill="#7f1d1d">RENAME / MOVE / RANDOMKEY</text>
  <text x="48" y="174" font-size="11.5" fill="#7f1d1d">DBSIZE / SELECT</text>

  <rect x="236" y="56" width="190" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="331" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">过期与遍历</text>
  <text x="254" y="108" font-size="11.5" fill="#1e3a8a">EXPIRE / PEXPIRE / PERSIST</text>
  <text x="254" y="130" font-size="11.5" fill="#1e3a8a">TTL / PTTL</text>
  <text x="254" y="152" font-size="11.5" fill="#1e3a8a">SCAN（游标遍历，替代 KEYS）</text>
  <text x="254" y="174" font-size="11.5" fill="#1e3a8a">批量：MSET / MGET / DEL 多 key</text>

  <rect x="442" y="56" width="190" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="537" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">内存与诊断</text>
  <text x="460" y="108" font-size="11.5" fill="#14532d">MEMORY USAGE / DOCTOR / STATS</text>
  <text x="460" y="130" font-size="11.5" fill="#14532d">OBJECT ENCODING / FREQ</text>
  <text x="460" y="152" font-size="11.5" fill="#14532d">INFO / SLOWLOG / LATENCY</text>
  <text x="460" y="174" font-size="11.5" fill="#14532d">HOTKEYS（8.6+ 热 key 检测）</text>

  <rect x="648" y="56" width="182" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="739" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">原子与脚本</text>
  <text x="666" y="108" font-size="11.5" fill="#78350f">SET key val NX EX ttl</text>
  <text x="666" y="130" font-size="11.5" fill="#78350f">MULTI / EXEC（事务）</text>
  <text x="666" y="152" font-size="11.5" fill="#78350f">EVAL / EVALSHA / SCRIPT LOAD</text>
  <text x="666" y="174" font-size="11.5" fill="#78350f">WAIT num timeout</text>

  <rect x="30" y="216" width="800" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="430" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">8.x 值得关注的命令变化</text>
  <text x="54" y="264" font-size="11.5" fill="#4c1d95">8.6：HOTKEYS（热 key 检测）　8.8：INCREX（限流计数）　8.10：HIMPORT / BACKUP / LMOVEM</text>
  <text x="54" y="284" font-size="11.5" fill="#4c1d95">8.10：SUNIONCARD / SDIFFCARD（不物化结果的集合基数）、SCRIPT_RUNNER 命令标志</text>

  <rect x="30" y="308" width="800" height="74" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="430" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">生产环境禁用</text>
  <text x="54" y="356" font-size="11.5" fill="#7f1d1d">KEYS *　FLUSHALL / FLUSHDB（如需使用加 ASYNC）　MONITOR 长时间开启　无 NX·EX 的锁命令</text>
  <text x="54" y="376" font-size="11.5" fill="#7f1d1d">运维类高危命令建议用 ACL 或 rename-command 关闭</text>
</svg>
