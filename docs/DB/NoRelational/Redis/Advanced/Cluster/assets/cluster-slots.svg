<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Redis Cluster：16384 个哈希槽分片</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#6b7280">slot = CRC16(key) mod 16384；每个主节点负责一段槽，从节点负责故障接管</text>

  <!-- client -->
  <rect x="40" y="80" width="130" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">客户端</text>
  <text x="105" y="123" text-anchor="middle" font-size="11" fill="#4338ca">本地缓存槽映射</text>
  <path d="M172 108 L212 108" stroke="#6366f1" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- slot bar -->
  <rect x="216" y="88" width="600" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="217" y="89" width="198" height="38" fill="#fecaca" stroke="#dc382d"/>
  <rect x="416" y="89" width="198" height="38" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="615" y="89" width="200" height="38" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="316" y="113" text-anchor="middle" font-size="11.5" fill="#991b1b">0 – 5460</text>
  <text x="515" y="113" text-anchor="middle" font-size="11.5" fill="#1e40af">5461 – 10922</text>
  <text x="715" y="113" text-anchor="middle" font-size="11.5" fill="#166534">10923 – 16383</text>

  <!-- masters -->
  <rect x="216" y="164" width="190" height="70" rx="10" fill="#fef2f2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="311" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Master-1 :7001</text>
  <text x="311" y="208" text-anchor="middle" font-size="11" fill="#b91c1c">slots 0-5460</text>
  <text x="311" y="225" text-anchor="middle" font-size="10.5" fill="#7f1d1d">configEpoch / 槽位信息</text>

  <rect x="420" y="164" width="190" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="515" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Master-2 :7002</text>
  <text x="515" y="208" text-anchor="middle" font-size="11" fill="#1d4ed8">slots 5461-10922</text>
  <text x="515" y="225" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Gossip 心跳（端口+10000）</text>

  <rect x="626" y="164" width="190" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="721" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Master-3 :7003</text>
  <text x="721" y="208" text-anchor="middle" font-size="11" fill="#15803d">slots 10923-16383</text>
  <text x="721" y="225" text-anchor="middle" font-size="10.5" fill="#14532d">cluster-node-timeout 判定下线</text>

  <!-- replicas -->
  <rect x="216" y="266" width="190" height="58" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <text x="311" y="290" text-anchor="middle" font-size="12" fill="#991b1b">Replica-1 :7004</text>
  <text x="311" y="309" text-anchor="middle" font-size="10.5" fill="#b91c1c">主节点故障后提升接管槽</text>

  <rect x="420" y="266" width="190" height="58" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="5 4"/>
  <text x="515" y="290" text-anchor="middle" font-size="12" fill="#1e40af">Replica-2 :7005</text>
  <text x="515" y="309" text-anchor="middle" font-size="10.5" fill="#1d4ed8">参与选举（需多数主节点投票）</text>

  <rect x="626" y="266" width="190" height="58" rx="10" fill="#ffffff" stroke="#86efac" stroke-dasharray="5 4"/>
  <text x="721" y="290" text-anchor="middle" font-size="12" fill="#166534">Replica-3 :7006</text>
  <text x="721" y="309" text-anchor="middle" font-size="10.5" fill="#15803d">复制偏移量决定优先级</text>

  <!-- redirects -->
  <rect x="216" y="348" width="280" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="356" y="371" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">MOVED / ASK 重定向</text>
  <text x="356" y="391" text-anchor="middle" font-size="10.5" fill="#b45309">MOVED 更新映射；ASK 仅本次改发目标节点</text>

  <rect x="520" y="348" width="296" height="62" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="668" y="371" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">Hash Tag：user:{1001}:name</text>
  <text x="668" y="391" text-anchor="middle" font-size="10.5" fill="#6d28d9">{} 内容参与 CRC16，多 key 同槽才能批量操作</text>

  <path d="M430 128 L311 162" stroke="#dc382d" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M515 128 L515 162" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M600 128 L721 162" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a2)"/>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
