<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Redis 版本演进与支持周期（2026 年 9 月核对）</text>

  <!-- axis -->
  <line x1="60" y1="96" x2="810" y2="96" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 7.2 / 7.4 -->
  <circle cx="110" cy="96" r="6" fill="#94a3b8"/>
  <rect x="52" y="112" width="118" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="111" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">7.2 / 7.4</text>
  <text x="111" y="154" text-anchor="middle" font-size="10.5" fill="#475569">Extended</text>
  <text x="111" y="172" text-anchor="middle" font-size="10.5" fill="#475569">EOL 2029-12-01</text>
  <text x="111" y="190" text-anchor="middle" font-size="10.5" fill="#64748b">存量主力，建议升级</text>

  <!-- 8.0 -->
  <circle cx="240" cy="96" r="6" fill="#f59e0b"/>
  <rect x="182" y="112" width="118" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="241" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">8.0</text>
  <text x="241" y="154" text-anchor="middle" font-size="10.5" fill="#b45309">Standard</text>
  <text x="241" y="172" text-anchor="middle" font-size="10.5" fill="#b45309">EOL 2026-12-01</text>
  <text x="241" y="190" text-anchor="middle" font-size="10.5" fill="#92400e">即将到期，尽快升级</text>

  <!-- 8.2 -->
  <circle cx="370" cy="96" r="6" fill="#16a34a"/>
  <rect x="312" y="112" width="118" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="371" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">8.2</text>
  <text x="371" y="154" text-anchor="middle" font-size="10.5" fill="#15803d">Extended</text>
  <text x="371" y="172" text-anchor="middle" font-size="10.5" fill="#15803d">EOL 2030-09-01</text>
  <text x="371" y="190" text-anchor="middle" font-size="10.5" fill="#166534">长期支持最长</text>

  <!-- 8.4 -->
  <circle cx="500" cy="96" r="6" fill="#2563eb"/>
  <rect x="442" y="112" width="118" height="86" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="501" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">8.4</text>
  <text x="501" y="154" text-anchor="middle" font-size="10.5" fill="#1d4ed8">Standard</text>
  <text x="501" y="172" text-anchor="middle" font-size="10.5" fill="#1d4ed8">原子槽迁移</text>
  <text x="501" y="190" text-anchor="middle" font-size="10.5" fill="#1e40af">FT.HYBRID 混合检索</text>

  <!-- 8.6 -->
  <circle cx="630" cy="96" r="6" fill="#8b5cf6"/>
  <rect x="572" y="112" width="118" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="631" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">8.6</text>
  <text x="631" y="154" text-anchor="middle" font-size="10.5" fill="#6d28d9">Standard（8.6.2）</text>
  <text x="631" y="172" text-anchor="middle" font-size="10.5" fill="#6d28d9">HOTKEYS 热 key</text>
  <text x="631" y="190" text-anchor="middle" font-size="10.5" fill="#5b21b6">LRM 淘汰 / Stream 幂等</text>

  <!-- 8.8 + 8.10 -->
  <circle cx="760" cy="96" r="6" fill="#dc382d"/>
  <rect x="702" y="112" width="120" height="86" rx="10" fill="#fef2f2" stroke="#dc382d" stroke-width="1.6"/>
  <text x="762" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">8.8 / 8.10</text>
  <text x="762" y="154" text-anchor="middle" font-size="10.5" fill="#b91c1c">Standard · 最新 GA</text>
  <text x="762" y="172" text-anchor="middle" font-size="10.5" fill="#b91c1c">8.10：BACKUP</text>
  <text x="762" y="190" text-anchor="middle" font-size="10.5" fill="#991b1b">紧凑哈希 / 新命令集</text>

  <!-- rule box -->
  <rect x="52" y="228" width="770" height="90" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text x="437" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">支持策略：Standard 只在下个小版本发布后 6 个月；Extended 自发布起 5 年</text>
  <text x="72" y="276" font-size="11.5" fill="#4338ca">因此版本号大 ≠ 支持久：8.6（Standard）的支持窗口可能短于 8.2（Extended）</text>
  <text x="72" y="298" font-size="11.5" fill="#4338ca">生产选型：要长期稳定选 Extended（8.2 / 7.2 / 7.4），要最新能力选 8.10 并保证能跟随小版本升级</text>

  <!-- upgrade path -->
  <rect x="52" y="336" width="770" height="106" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="437" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">升级路径</text>
  <rect x="76" y="374" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="151" y="399" text-anchor="middle" font-size="11.5" fill="#166534">6.2 及更早（仅存量）</text>
  <rect x="264" y="374" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="339" y="399" text-anchor="middle" font-size="11.5" fill="#166534">7.4（先补齐）</text>
  <rect x="452" y="374" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80"/>
  <text x="527" y="399" text-anchor="middle" font-size="11.5" fill="#166534">8.2 Extended</text>
  <rect x="640" y="374" width="150" height="40" rx="8" fill="#ffffff" stroke="#dc382d"/>
  <text x="715" y="399" text-anchor="middle" font-size="11.5" fill="#991b1b">8.10 最新特性</text>
  <path d="M226 394 L262 394" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a6)"/>
  <path d="M414 394 L450 394" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a6)"/>
  <path d="M602 394 L638 394" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a6)"/>
  <text x="437" y="432" text-anchor="middle" font-size="11" fill="#15803d">顺序：先升从库 → 手动切换 → 升原主库；RDB 不可降级，升级前必须备份</text>

  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
