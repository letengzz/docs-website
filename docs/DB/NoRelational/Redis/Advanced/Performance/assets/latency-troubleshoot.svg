<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">延迟问题排查路径：从指标到根因</text>

  <!-- step 1 -->
  <rect x="40" y="60" width="180" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="130" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">① 建立基线</text>
  <text x="130" y="106" text-anchor="middle" font-size="10.5" fill="#4338ca">--latency</text>
  <text x="130" y="124" text-anchor="middle" font-size="10.5" fill="#4338ca">--intrinsic-latency</text>
  <text x="130" y="140" text-anchor="middle" font-size="10.5" fill="#4338ca">INFO stats</text>

  <!-- step 2 -->
  <rect x="248" y="60" width="180" height="86" rx="10" fill="#fee2e2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="338" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">② 慢命令</text>
  <text x="338" y="106" text-anchor="middle" font-size="10.5" fill="#b91c1c">SLOWLOG GET 10</text>
  <text x="338" y="124" text-anchor="middle" font-size="10.5" fill="#b91c1c">KEYS / HGETALL 大对象</text>
  <text x="338" y="140" text-anchor="middle" font-size="10.5" fill="#b91c1c">Lua 长脚本</text>

  <!-- step 3 -->
  <rect x="456" y="60" width="180" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="546" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">③ 大 key / 热 key</text>
  <text x="546" y="106" text-anchor="middle" font-size="10.5" fill="#b45309">--bigkeys / --memkeys</text>
  <text x="546" y="124" text-anchor="middle" font-size="10.5" fill="#b45309">HOTKEYS（8.6+）</text>
  <text x="546" y="140" text-anchor="middle" font-size="10.5" fill="#b45309">OBJECT FREQ</text>

  <!-- step 4 -->
  <rect x="664" y="60" width="164" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="746" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">④ 运行事件</text>
  <text x="746" y="106" text-anchor="middle" font-size="10.5" fill="#6d28d9">LATENCY LATEST</text>
  <text x="746" y="124" text-anchor="middle" font-size="10.5" fill="#6d28d9">fork / aof-fsync</text>
  <text x="746" y="140" text-anchor="middle" font-size="10.5" fill="#6d28d9">eviction-cycle</text>

  <path d="M222 103 L246 103" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a5)"/>
  <path d="M430 103 L454 103" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a5)"/>
  <path d="M638 103 L662 103" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a5)"/>

  <!-- causes table -->
  <rect x="40" y="170" width="788" height="196" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="430" y="194" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">常见根因与对策</text>

  <text x="62" y="222" font-size="11.5" font-weight="600" fill="#475569">根因</text>
  <text x="250" y="222" font-size="11.5" font-weight="600" fill="#475569">现象</text>
  <text x="560" y="222" font-size="11.5" font-weight="600" fill="#475569">处理</text>
  <line x1="52" y1="230" x2="816" y2="230" stroke="#cbd5e1"/>

  <text x="62" y="252" font-size="11" fill="#1f2937">大 key 操作</text>
  <text x="250" y="252" font-size="11" fill="#475569">偶发毫秒级卡顿</text>
  <text x="560" y="252" font-size="11" fill="#166534">拆分 / UNLINK / 分批</text>

  <text x="62" y="276" font-size="11" fill="#1f2937">AOF always</text>
  <text x="250" y="276" font-size="11" fill="#475569">写延迟随磁盘抖动</text>
  <text x="560" y="276" font-size="11" fill="#166534">改 everysec + SSD</text>

  <text x="62" y="300" font-size="11" fill="#1f2937">fork 阻塞</text>
  <text x="250" y="300" font-size="11" fill="#475569">latest_fork_usec 高</text>
  <text x="560" y="300" font-size="11" fill="#166534">控制内存 ≤32G、关 THP</text>

  <text x="62" y="324" font-size="11" fill="#1f2937">内存淘汰</text>
  <text x="250" y="324" font-size="11" fill="#475569">evicted_keys 增长</text>
  <text x="560" y="324" font-size="11" fill="#166534">扩容 / 治理无 TTL key</text>

  <text x="62" y="348" font-size="11" fill="#1f2937">Swap / 连接池</text>
  <text x="250" y="348" font-size="11" fill="#475569">延迟到秒级或应用排队</text>
  <text x="560" y="348" font-size="11" fill="#166534">关 swap / 调池 + 超时</text>

  <!-- bottom -->
  <rect x="40" y="384" width="788" height="42" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="410" text-anchor="middle" font-size="11.5" fill="#166534">先测量再调参：命中率、QPS、P99、内存碎片率、复制延迟五项指标同时看，单看一项容易误判</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
