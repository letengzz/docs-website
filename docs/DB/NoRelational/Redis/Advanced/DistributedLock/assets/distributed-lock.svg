<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">分布式锁：加锁、续期、释放的正确姿势</text>

  <!-- clients -->
  <rect x="40" y="72" width="150" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="115" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">客户端 A</text>
  <text x="115" y="114" text-anchor="middle" font-size="10.5" fill="#4338ca">value = uuid-A</text>

  <rect x="40" y="200" width="150" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="115" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">客户端 B</text>
  <text x="115" y="242" text-anchor="middle" font-size="10.5" fill="#4338ca">value = uuid-B</text>

  <!-- redis -->
  <rect x="330" y="112" width="200" height="140" rx="12" fill="#fef2f2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="430" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Redis</text>
  <rect x="350" y="152" width="160" height="34" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#7f1d1d">lock:order:1001 → uuid-A</text>
  <text x="430" y="208" text-anchor="middle" font-size="11" fill="#b91c1c">TTL 10s（防死锁）</text>
  <text x="430" y="232" text-anchor="middle" font-size="10.5" fill="#9f1239">watchdog 每 1/3 TTL 续期</text>

  <path d="M192 98 L328 132" stroke="#6366f1" stroke-width="1.6" marker-end="url(#a4)"/>
  <path d="M328 176 L192 224" stroke="#dc382d" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="252" y="146" font-size="10.5" fill="#4338ca">SET NX EX → OK</text>
  <text x="230" y="212" font-size="10.5" fill="#b91c1c">已被占用 → (nil)</text>

  <!-- steps -->
  <rect x="560" y="64" width="272" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="696" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">加锁（一条命令，原子）</text>
  <text x="576" y="110" font-size="11" fill="#15803d">SET lock:order:1001 uuid-A NX EX 10</text>
  <text x="576" y="132" font-size="11" fill="#15803d">NX：不存在才设置（互斥）</text>
  <text x="576" y="152" font-size="11" fill="#15803d">EX：自动过期（防死锁）</text>
  <text x="576" y="172" font-size="11" fill="#15803d">uuid：唯一值（防误删）</text>

  <rect x="560" y="200" width="272" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="696" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">释放（Lua 校验持有者）</text>
  <text x="576" y="246" font-size="11" fill="#b45309">if GET(key) == ARGV[1] then</text>
  <text x="576" y="266" font-size="11" fill="#b45309">  return DEL(key)</text>
  <text x="576" y="286" font-size="11" fill="#b45309">else return 0 end</text>
  <text x="576" y="308" font-size="10.5" fill="#92400e">绝不直接 DEL，否则会删掉别人的锁</text>

  <path d="M560 124 L534 150" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a4)"/>
  <path d="M560 260 L534 214" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#a4)"/>

  <!-- bottom warnings -->
  <rect x="40" y="334" width="782" height="98" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="430" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">三条铁律</text>
  <text x="64" y="382" font-size="11.5" fill="#7f1d1d">1. 不用 SETNX + EXPIRE 两步：中间崩溃会造成永不过期的死锁</text>
  <text x="64" y="402" font-size="11.5" fill="#7f1d1d">2. 锁只是降低冲突概率；主从切换、GC 停顿都可能并发持锁 → 业务必须幂等</text>
  <text x="64" y="422" font-size="11.5" fill="#7f1d1d">3. 关键逻辑用「唯一索引 / 状态机 / 去重表」兜底，锁不承担正确性</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
