<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="860" height="450" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">实战拓扑：1 主 2 从 + 3 哨兵 + 应用接入</text>

  <!-- app -->
  <rect x="330" y="56" width="200" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Spring Boot 应用</text>
  <text x="430" y="100" text-anchor="middle" font-size="10.5" fill="#4338ca">Lettuce 连接池 + Redisson 锁</text>
  <text x="430" y="116" text-anchor="middle" font-size="10.5" fill="#4338ca">Cache Aside + 防穿透 / 防击穿</text>

  <!-- sentinels -->
  <rect x="40" y="152" width="780" height="78" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">哨兵集群（3 节点，quorum = 2）</text>
  <rect x="70" y="188" width="200" height="34" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="170" y="210" text-anchor="middle" font-size="11.5" fill="#92400e">sentinel-1 :26379</text>
  <rect x="330" y="188" width="200" height="34" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="430" y="210" text-anchor="middle" font-size="11.5" fill="#92400e">sentinel-2 :26380</text>
  <rect x="590" y="188" width="200" height="34" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="690" y="210" text-anchor="middle" font-size="11.5" fill="#92400e">sentinel-3 :26381</text>

  <path d="M430 122 L430 150" stroke="#6366f1" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="520" y="142" font-size="10.5" fill="#4338ca">询问当前主库地址</text>

  <!-- master -->
  <rect x="330" y="262" width="200" height="72" rx="10" fill="#fee2e2" stroke="#dc382d" stroke-width="1.8"/>
  <text x="430" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">redis-master :6379</text>
  <text x="430" y="306" text-anchor="middle" font-size="10.5" fill="#b91c1c">AOF everysec + 混合持久化</text>
  <text x="430" y="323" text-anchor="middle" font-size="10.5" fill="#b91c1c">min-replicas-to-write 1</text>

  <!-- replicas -->
  <rect x="70" y="262" width="200" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">redis-replica-1 :6380</text>
  <text x="170" y="306" text-anchor="middle" font-size="10.5" fill="#1d4ed8">replica-read-only yes</text>
  <text x="170" y="323" text-anchor="middle" font-size="10.5" fill="#1d4ed8">可承接读流量</text>

  <rect x="590" y="262" width="200" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="690" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">redis-replica-2 :6381</text>
  <text x="690" y="306" text-anchor="middle" font-size="10.5" fill="#1d4ed8">replica-priority 100</text>
  <text x="690" y="323" text-anchor="middle" font-size="10.5" fill="#1d4ed8">主库故障后可被提升</text>

  <path d="M330 298 L272 298" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a7)"/>
  <path d="M530 298 L588 298" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="301" y="290" text-anchor="middle" font-size="10" fill="#1d4ed8">复制</text>
  <text x="559" y="290" text-anchor="middle" font-size="10" fill="#1d4ed8">复制</text>

  <path d="M430 234 L430 260" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="520" y="252" font-size="10.5" fill="#92400e">监控 / 故障转移</text>

  <!-- footer -->
  <rect x="40" y="360" width="780" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">验收要点</text>
  <text x="66" y="406" font-size="11" fill="#15803d">① INFO replication 显示 1 主 2 从、master_link_status:up　② SENTINEL ckquorum 返回 OK</text>
  <text x="66" y="424" font-size="11" fill="#15803d">③ 主库宕机后 30 秒内自动切换，应用无需重启　④ 命中率 &gt; 90%，SLOWLOG LEN = 0</text>

  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
