<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Redis 进阶能力地图</text>

  <!-- client layer -->
  <rect x="40" y="60" width="800" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="440" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">应用接入层</text>
  <text x="440" y="105" text-anchor="middle" font-size="12" fill="#4338ca">连接池 · Pipeline · Lua · 分布式锁 · 缓存策略（Cache Aside / 多级缓存）</text>

  <!-- arrows down -->
  <path d="M440 122 L440 148" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ha layer -->
  <rect x="40" y="152" width="800" height="96" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">高可用与扩展层</text>
  <rect x="70" y="190" width="220" height="42" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="180" y="216" text-anchor="middle" font-size="12" fill="#065f46">主从复制（读写分离）</text>
  <rect x="330" y="190" width="220" height="42" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="440" y="216" text-anchor="middle" font-size="12" fill="#065f46">哨兵（自动故障转移）</text>
  <rect x="590" y="190" width="220" height="42" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="700" y="216" text-anchor="middle" font-size="12" fill="#065f46">Cluster（分片扩容）</text>

  <path d="M440 248 L440 274" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- node layer -->
  <rect x="40" y="278" width="800" height="70" rx="10" fill="#fef2f2" stroke="#dc382d" stroke-width="1.5"/>
  <text x="440" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">单节点内核层</text>
  <text x="440" y="324" text-anchor="middle" font-size="12" fill="#b91c1c">数据结构 · 过期与淘汰 · RDB / AOF（MP-AOF）· 内存与碎片 · 慢查询</text>

  <!-- side pillars -->
  <rect x="40" y="366" width="380" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="230" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">稳定性治理</text>
  <text x="230" y="412" text-anchor="middle" font-size="12" fill="#b45309">穿透 / 击穿 / 雪崩 · 热点 Key · 大 Key · 一致性</text>

  <rect x="460" y="366" width="380" height="72" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="650" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">性能与版本</text>
  <text x="650" y="412" text-anchor="middle" font-size="12" fill="#6d28d9">延迟排查 · 内存优化 · 8.x 版本演进与升级迁移</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
