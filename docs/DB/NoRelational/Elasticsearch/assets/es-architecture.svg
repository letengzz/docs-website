<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Elasticsearch 集群架构：节点、分片与副本</text>
  <!-- client -->
  <rect x="40" y="70" width="120" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="100" y="90" text-anchor="middle" font-size="13">应用 / Kibana</text>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#6b7280">REST 请求</text>
  <!-- master node -->
  <rect x="220" y="60" width="160" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="84" text-anchor="middle" font-size="13" font-weight="bold">Master 节点</text>
  <text x="300" y="102" text-anchor="middle" font-size="11" fill="#6b7280">管理集群状态、分片分配</text>
  <line x1="160" y1="92" x2="218" y2="92" stroke="#64748b" stroke-width="2"/>
  <!-- data nodes -->
  <rect x="440" y="60" width="300" height="230" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="590" y="84" text-anchor="middle" font-size="12" fill="#6b7280">Data 节点（存储 + 执行查询）</text>
  <g font-size="12">
    <rect x="460" y="96" width="120" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="520" y="120" text-anchor="middle" font-weight="bold">Node 1</text>
    <text x="520" y="138" text-anchor="middle">P0（主分片）</text>
    <text x="520" y="154" text-anchor="middle">R2（副本）</text>
    <rect x="600" y="96" width="120" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="660" y="120" text-anchor="middle" font-weight="bold">Node 2</text>
    <text x="660" y="138" text-anchor="middle">P1（主分片）</text>
    <text x="660" y="154" text-anchor="middle">R0（副本）</text>
    <rect x="460" y="186" width="120" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="520" y="210" text-anchor="middle" font-weight="bold">Node 3</text>
    <text x="520" y="228" text-anchor="middle">P2（主分片）</text>
    <text x="520" y="244" text-anchor="middle">R1（副本）</text>
    <rect x="600" y="186" width="120" height="70" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="660" y="210" text-anchor="middle" font-weight="bold">Node 4</text>
    <text x="660" y="228" text-anchor="middle">R0 / R1 / R2</text>
    <text x="660" y="244" text-anchor="middle">（副本分片）</text>
  </g>
  <line x1="380" y1="92" x2="438" y2="92" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#6b7280">索引 orders 被切成</text>
  <text x="300" y="176" text-anchor="middle" font-size="11" fill="#6b7280">3 主分片 × 2 副本</text>
  <text x="390" y="322" text-anchor="middle" font-size="12" fill="#6b7280">主分片与副本分片永远分布在不同节点；主分片宕机时副本提升为主，保证可用性</text>
</svg>
