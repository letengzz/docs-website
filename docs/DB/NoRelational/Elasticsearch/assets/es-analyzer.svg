<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#005571"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">分析器（Analyzer）处理链：一条文本如何变成可检索的词</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="90" width="130" height="56" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="95" y="114" text-anchor="middle">原始文本</text>
    <text x="95" y="132" text-anchor="middle" font-size="11" fill="#6b7280">"Elasticsearch 教程"</text>
    <rect x="210" y="90" width="130" height="56" rx="10" fill="#f0fdfa" stroke="#005571"/>
    <text x="275" y="114" text-anchor="middle">Character Filters</text>
    <text x="275" y="132" text-anchor="middle" font-size="11" fill="#6b7280">清洗（去 HTML 等）</text>
    <rect x="390" y="90" width="140" height="56" rx="10" fill="#f0fdfa" stroke="#005571"/>
    <text x="460" y="114" text-anchor="middle">Tokenizer</text>
    <text x="460" y="132" text-anchor="middle" font-size="11" fill="#6b7280">切词：elasticsearch / 教程</text>
    <rect x="580" y="90" width="170" height="56" rx="10" fill="#f0fdfa" stroke="#005571"/>
    <text x="665" y="114" text-anchor="middle">Token Filters</text>
    <text x="665" y="132" text-anchor="middle" font-size="11" fill="#6b7280">小写化 / 停用词 / 词干化</text>
    <line x1="160" y1="118" x2="208" y2="118" stroke="#005571" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="340" y1="118" x2="388" y2="118" stroke="#005571" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="530" y1="118" x2="578" y2="118" stroke="#005571" stroke-width="2" marker-end="url(#arr3)"/>
  </g>
  <rect x="130" y="190" width="520" height="70" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="390" y="218" text-anchor="middle" font-size="13" fill="#92400e">中文场景：标准分词器按「单字」切分 → 检索质量差</text>
  <text x="390" y="242" text-anchor="middle" font-size="12" fill="#92400e">需安装 IK / smartcn 等中文分析器，按词典做语义分词</text>
</svg>
