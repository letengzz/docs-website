<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#005571"/>
    </marker>
  </defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">索引写入与近实时搜索：refresh / flush / merge</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="80" width="150" height="60" rx="10" fill="#f8fafc" stroke="#64748b"/>
    <text x="105" y="106" text-anchor="middle">客户端写入</text>
    <text x="105" y="124" text-anchor="middle" font-size="11" fill="#6b7280">index / bulk 请求</text>
    <rect x="230" y="80" width="170" height="60" rx="10" fill="#f0fdfa" stroke="#005571"/>
    <text x="315" y="106" text-anchor="middle">Memory Buffer + Translog</text>
    <text x="315" y="124" text-anchor="middle" font-size="11" fill="#6b7280">先写内存索引与事务日志</text>
    <rect x="450" y="80" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="525" y="106" text-anchor="middle">refresh（默认 1s）</text>
    <text x="525" y="124" text-anchor="middle" font-size="11" fill="#6b7280">生成新 segment，可被搜索</text>
    <rect x="640" y="80" width="110" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="695" y="106" text-anchor="middle">flush</text>
    <text x="695" y="124" text-anchor="middle" font-size="11" fill="#6b7280">segment 落盘</text>
    <line x1="180" y1="110" x2="228" y2="110" stroke="#005571" stroke-width="2" marker-end="url(#arr4)"/>
    <line x1="400" y1="110" x2="448" y2="110" stroke="#005571" stroke-width="2" marker-end="url(#arr4)"/>
    <line x1="600" y1="110" x2="638" y2="110" stroke="#005571" stroke-width="2" marker-end="url(#arr4)"/>
  </g>
  <rect x="80" y="180" width="620" height="110" rx="10" fill="#f0fdfa" stroke="#005571"/>
  <text x="390" y="210" text-anchor="middle" font-size="13" fill="#0f766e">关键结论</text>
  <text x="390" y="234" text-anchor="middle" font-size="12" fill="#334155">写入 → refresh 间隔内不可见 ⇒ ES 是「近实时（NRT）」而非实时</text>
  <text x="390" y="260" text-anchor="middle" font-size="12" fill="#334155">段（segment）不可变：删除/更新只打标记，由后台 merge 真正回收空间</text>
  <text x="390" y="282" text-anchor="middle" font-size="11" fill="#6b7280">这也是「ES 更新文档 = 删除旧文档 + 新增」说法的来源</text>
</svg>
