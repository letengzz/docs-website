<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">ER 模型的核心概念地图</text>
  <!-- 中心：实体 -->
  <rect x="310" y="120" width="140" height="56" rx="8" fill="#2563EB"/>
  <text x="380" y="144" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">实体 Entity</text>
  <text x="380" y="164" text-anchor="middle" font-size="11" fill="#DBEAFE">现实对象：用户、订单</text>
  <!-- 属性 -->
  <rect x="60" y="60" width="150" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="82" text-anchor="middle" font-size="14" fill="#1E3A8A" font-weight="bold">属性 Attribute</text>
  <text x="135" y="100" text-anchor="middle" font-size="11" fill="#1E3A8A">简单 / 复合 / 多值 / 派生</text>
  <!-- 关系 -->
  <rect x="60" y="230" width="150" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="135" y="252" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">关系 Relationship</text>
  <text x="135" y="270" text-anchor="middle" font-size="11" fill="#065F46">1:1 / 1:N / M:N</text>
  <!-- 键 -->
  <rect x="550" y="60" width="150" height="50" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="625" y="82" text-anchor="middle" font-size="14" fill="#9A3412" font-weight="bold">键 Key</text>
  <text x="625" y="100" text-anchor="middle" font-size="11" fill="#9A3412">超键 / 候选键 / 主键 / 外键</text>
  <!-- 基数 -->
  <rect x="550" y="230" width="150" height="50" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text x="625" y="252" text-anchor="middle" font-size="14" fill="#9D174D" font-weight="bold">基数 Cardinality</text>
  <text x="625" y="270" text-anchor="middle" font-size="11" fill="#9D174D">最少 / 最多参与个数</text>
  <!-- 弱实体 -->
  <rect x="310" y="260" width="140" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="380" y="282" text-anchor="middle" font-size="14" fill="#5B21B6" font-weight="bold">弱实体 Weak Entity</text>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#5B21B6">依赖强实体存在（如订单项）</text>
  <!-- 连线 -->
  <line x1="212" y1="92" x2="306" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="212" y1="250" x2="306" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="548" y1="92" x2="454" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="548" y1="250" x2="454" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="380" y1="258" x2="380" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="380" y="330" text-anchor="middle" font-size="12" fill="#64748B">实体是骨架，属性是血肉，键负责唯一标识，关系与基数描述实体间如何关联，弱实体表达「依附存在」</text>
</svg>
