<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">实战 ERD：内容社区平台（users / articles / comments / tags / likes）</text>
  <!-- users -->
  <g>
    <rect x="30" y="50" width="160" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="30" y="50" width="160" height="28" rx="6" fill="#2563EB"/>
    <text x="110" y="69" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">users</text>
    <text x="40" y="96" font-size="11" fill="#0F172A">🔑 id</text>
    <text x="40" y="116" font-size="11" fill="#0F172A">　 username (uk)</text>
    <text x="40" y="136" font-size="11" fill="#0F172A">　 email (uk)</text>
  </g>
  <!-- articles -->
  <g>
    <rect x="300" y="40" width="170" height="150" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="300" y="40" width="170" height="28" rx="6" fill="#059669"/>
    <text x="385" y="59" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">articles</text>
    <text x="310" y="86" font-size="11" fill="#0F172A">🔑 id</text>
    <text x="310" y="106" font-size="11" fill="#B91C1C">⛓ author_id → users</text>
    <text x="310" y="126" font-size="11" fill="#0F172A">　 title / content</text>
    <text x="310" y="146" font-size="11" fill="#0F172A">　 status / view_count</text>
    <text x="310" y="166" font-size="11" fill="#0F172A">　 published_at</text>
  </g>
  <!-- comments -->
  <g>
    <rect x="560" y="40" width="170" height="130" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <rect x="560" y="40" width="170" height="28" rx="6" fill="#EA580C"/>
    <text x="645" y="59" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">comments</text>
    <text x="570" y="86" font-size="11" fill="#0F172A">🔑 id</text>
    <text x="570" y="106" font-size="11" fill="#B91C1C">⛓ article_id → articles</text>
    <text x="570" y="126" font-size="11" fill="#B91C1C">⛓ user_id → users</text>
    <text x="570" y="146" font-size="11" fill="#0F172A">　 parent_id（自关联）</text>
  </g>
  <!-- tags -->
  <g>
    <rect x="30" y="240" width="160" height="90" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="30" y="240" width="160" height="28" rx="6" fill="#7C3AED"/>
    <text x="110" y="259" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">tags</text>
    <text x="40" y="286" font-size="11" fill="#0F172A">🔑 id</text>
    <text x="40" y="306" font-size="11" fill="#0F172A">　 name (uk)</text>
  </g>
  <!-- article_tags -->
  <g>
    <rect x="300" y="240" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
    <rect x="300" y="240" width="170" height="28" rx="6" fill="#0891B2"/>
    <text x="385" y="259" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">article_tags（关联表）</text>
    <text x="310" y="286" font-size="11" fill="#B91C1C">⛓ article_id　⛓ tag_id</text>
    <text x="310" y="306" font-size="11" fill="#0F172A">　 PK(article_id, tag_id)</text>
  </g>
  <!-- likes -->
  <g>
    <rect x="560" y="240" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
    <rect x="560" y="240" width="170" height="28" rx="6" fill="#DB2777"/>
    <text x="645" y="259" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">article_likes（关联表）</text>
    <text x="570" y="286" font-size="11" fill="#B91C1C">⛓ article_id　⛓ user_id</text>
    <text x="570" y="306" font-size="11" fill="#0F172A">　 PK(article_id, user_id)</text>
  </g>
  <!-- 关系线 -->
  <g stroke="#0F172A" stroke-width="1.8">
    <line x1="190" y1="105" x2="298" y2="105"/>
    <line x1="470" y1="115" x2="558" y2="105"/>
    <line x1="385" y1="190" x2="385" y2="238"/>
    <line x1="110" y1="160" x2="110" y2="238"/>
    <line x1="470" y1="285" x2="558" y2="285"/>
  </g>
  <g font-size="10" fill="#334155">
    <text x="196" y="96">1 : N</text>
    <text x="490" y="96">1 : N</text>
    <text x="394" y="218">1 : N</text>
    <text x="118" y="200">1 : N</text>
    <text x="496" y="276">M : N</text>
  </g>
  <!-- 说明 -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="352" width="700" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="46" y="376">要点：M:N 一律拆成关联表并以「联合主键」防重复；comments.parent_id 自关联实现楼中楼；统计字段（view_count）属于受控冗余</text>
  </g>
</svg>
