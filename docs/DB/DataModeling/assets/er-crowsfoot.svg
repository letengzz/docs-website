<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="320" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">Crow's Foot（鸦爪）表示法：users 1 : N articles</text>
  <!-- users 表 -->
  <g>
    <rect x="60" y="70" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="60" y="70" width="200" height="34" rx="6" fill="#2563EB"/>
    <text x="160" y="92" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">users</text>
    <text x="72" y="126" font-size="12" fill="#0F172A">🔑 id  BIGINT PK</text>
    <text x="72" y="150" font-size="12" fill="#0F172A">　 username  VARCHAR(50)</text>
    <text x="72" y="174" font-size="12" fill="#0F172A">　 email  VARCHAR(100)</text>
    <text x="72" y="198" font-size="12" fill="#0F172A">　 created_at  DATETIME</text>
  </g>
  <!-- articles 表 -->
  <g>
    <rect x="500" y="70" width="200" height="174" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="500" y="70" width="200" height="34" rx="6" fill="#059669"/>
    <text x="600" y="92" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">articles</text>
    <text x="512" y="126" font-size="12" fill="#0F172A">🔑 id  BIGINT PK</text>
    <text x="512" y="150" font-size="12" fill="#B91C1C">⛓ user_id  BIGINT FK</text>
    <text x="512" y="174" font-size="12" fill="#0F172A">　 title  VARCHAR(200)</text>
    <text x="512" y="198" font-size="12" fill="#0F172A">　 content  TEXT</text>
    <text x="512" y="222" font-size="12" fill="#0F172A">　 created_at  DATETIME</text>
  </g>
  <!-- 关系线 + 鸦爪 -->
  <line x1="260" y1="145" x2="496" y2="145" stroke="#0F172A" stroke-width="2.5"/>
  <!-- 一端：双竖线（恰好一个） -->
  <line x1="266" y1="133" x2="266" y2="157" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="274" y1="133" x2="274" y2="157" stroke="#0F172A" stroke-width="2.5"/>
  <!-- 多端：圆圈 + 鸦爪（零或多个） -->
  <circle cx="472" cy="145" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <path d="M484 133 L496 145 L484 157" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  <path d="M478 133 L490 145 L478 157" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  <text x="300" y="128" font-size="12" fill="#0F172A">恰好一个（||）</text>
  <text x="392" y="128" font-size="12" fill="#0F172A">零或多个（O&lt;）</text>
  <text x="380" y="176" text-anchor="middle" font-size="12" fill="#64748B">一个用户可以写零篇或多篇文章；每篇文章必须属于恰好一个用户</text>
  <!-- 图例 -->
  <g font-size="12" fill="#334155">
    <rect x="60" y="266" width="640" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="76" y="290">图例：| = 一个　O = 零　&lt; = 多个　　|| = 恰好一个　O| = 零或一个　|&lt; = 一或多个　O&lt; = 零或多个</text>
  </g>
</svg>
