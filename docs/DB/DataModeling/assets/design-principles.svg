<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="320" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">设计原则速览：命名、字段、键、通用列、演进</text>
  <g font-size="12">
    <!-- 命名 -->
    <rect x="40" y="56" width="210" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="145" y="82" text-anchor="middle" font-size="14" fill="#1E3A8A" font-weight="bold">命名规范</text>
    <text x="145" y="108" text-anchor="middle" fill="#1E3A8A">小写蛇形：article_tags</text>
    <text x="145" y="130" text-anchor="middle" fill="#1E3A8A">表名复数、布尔 is_/has_</text>
    <text x="145" y="152" text-anchor="middle" fill="#1E3A8A">不用保留字、不缩写黑话</text>
    <!-- 字段 -->
    <rect x="275" y="56" width="210" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="380" y="82" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">字段设计</text>
    <text x="380" y="108" text-anchor="middle" fill="#065F46">类型够用就好：TINYINT 状态</text>
    <text x="380" y="130" text-anchor="middle" fill="#065F46">金额用 DECIMAL 不用 FLOAT</text>
    <text x="380" y="152" text-anchor="middle" fill="#065F46">NOT NULL + 默认值优先</text>
    <!-- 主键 -->
    <rect x="510" y="56" width="210" height="110" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="615" y="82" text-anchor="middle" font-size="14" fill="#9A3412" font-weight="bold">主键策略</text>
    <text x="615" y="108" text-anchor="middle" fill="#9A3412">代理主键 BIGINT 自增/雪花</text>
    <text x="615" y="130" text-anchor="middle" fill="#9A3412">业务唯一性交给唯一索引</text>
    <text x="615" y="152" text-anchor="middle" fill="#9A3412">关联表用联合主键</text>
    <!-- 通用列 -->
    <rect x="40" y="190" width="210" height="110" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="145" y="216" text-anchor="middle" font-size="14" fill="#5B21B6" font-weight="bold">通用审计列</text>
    <text x="145" y="242" text-anchor="middle" fill="#5B21B6">created_at / updated_at</text>
    <text x="145" y="264" text-anchor="middle" fill="#5B21B6">created_by / updated_by</text>
    <text x="145" y="286" text-anchor="middle" fill="#5B21B6">deleted（逻辑删除）</text>
    <!-- 演进 -->
    <rect x="275" y="190" width="210" height="110" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text x="380" y="216" text-anchor="middle" font-size="14" fill="#9D174D" font-weight="bold">模型演进</text>
    <text x="380" y="242" text-anchor="middle" fill="#9D174D">只增不改：加列可回滚</text>
    <text x="380" y="264" text-anchor="middle" fill="#9D174D">改列走「加新列→双写→切换」</text>
    <text x="380" y="286" text-anchor="middle" fill="#9D174D">迁移脚本纳入 Git 管理</text>
    <!-- 反模式 -->
    <rect x="510" y="190" width="210" height="110" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="615" y="216" text-anchor="middle" font-size="14" fill="#7F1D1D" font-weight="bold">常见反模式</text>
    <text x="615" y="242" text-anchor="middle" fill="#7F1D1D">EAV 万能键值表</text>
    <text x="615" y="264" text-anchor="middle" fill="#7F1D1D">多值字段逗号分隔</text>
    <text x="615" y="286" text-anchor="middle" fill="#7F1D1D">无主见表 / 全靠外键约束兜底</text>
  </g>
</svg>
