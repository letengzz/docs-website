<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数仓五层：职责与禁令</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">ODS 保真 · DWD 保细 · DWS 保用 · ADS 保准 · DIM 保稳</text>
  <rect x="60" y="76" width="640" height="44" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="100" y="103" font-size="9.5" fill="#1E293B" font-weight="bold">数据源</text>
  <text x="300" y="103" font-size="8" fill="#334155">业务库 · 埋点 · 日志 · 第三方　→　CDC 快照 + 增量同步</text>
  <rect x="60" y="128" width="640" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="100" y="148" font-size="9.5" fill="#1E3A8A" font-weight="bold">ODS 贴源</text>
  <text x="100" y="166" font-size="8" fill="#1D4ED8">只做分区、装载时间、按主键去重　｜　禁止：业务口径计算、跨源 Join</text>
  <rect x="60" y="182" width="640" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="100" y="202" font-size="9.5" fill="#065F46" font-weight="bold">DWD 明细</text>
  <text x="100" y="220" font-size="8" fill="#047857">清洗、去重、标准化、维度代理键　｜　禁止：出报表口径</text>
  <rect x="60" y="236" width="640" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="100" y="256" font-size="9.5" fill="#115E59" font-weight="bold">DWS 汇总</text>
  <text x="100" y="274" font-size="8" fill="#0F766E">按主题与常用维度轻度聚合，只放可加度量　｜　禁止：混装多主题</text>
  <rect x="60" y="290" width="640" height="46" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="100" y="310" font-size="9.5" fill="#9A3412" font-weight="bold">ADS 应用</text>
  <text x="100" y="328" font-size="8" fill="#C2410C">面向报表/看板的最终口径　｜　禁止：被任何层反向引用</text>
  <rect x="60" y="344" width="640" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="100" y="364" font-size="9.5" fill="#5B21B6" font-weight="bold">DIM 维度</text>
  <text x="100" y="382" font-size="8" fill="#6D28D9">被 DWD/DWS/ADS 引用，自身只引用 ODS　｜　禁止：存放度量</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
