<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">OLTP 与 OLAP：为什么要建数仓</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">两者的最优数据形态天然冲突，硬放在一个库里两边都做不好</text>
  <rect x="40" y="80" width="300" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="190" y="103" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">OLTP（在线交易）</text>
  <text x="60" y="126" font-size="8" fill="#4338CA">单行读写、按主键定位</text>
  <text x="60" y="144" font-size="8" fill="#4338CA">高并发短事务、毫秒级响应</text>
  <text x="60" y="162" font-size="8" fill="#4338CA">规范化（3NF），冗余最低</text>
  <text x="60" y="180" font-size="8" fill="#4338CA">只保留当前状态，历史会丢失</text>
  <text x="60" y="198" font-size="8" fill="#4338CA">写入正确性优先</text>
  <text x="60" y="216" font-size="8" fill="#64748B">代表：MySQL / PostgreSQL</text>
  <rect x="420" y="80" width="300" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="570" y="103" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">OLAP（分析）</text>
  <text x="440" y="126" font-size="8" fill="#047857">全表扫描、聚合、多表 Join</text>
  <text x="440" y="144" font-size="8" fill="#047857">低并发长查询、秒到分钟级</text>
  <text x="440" y="162" font-size="8" fill="#047857">反规范化（宽表/星型），容忍冗余</text>
  <text x="440" y="180" font-size="8" fill="#047857">必须保留历史可追溯</text>
  <text x="440" y="198" font-size="8" fill="#047857">查询效率优先</text>
  <text x="440" y="216" font-size="8" fill="#64748B">代表：Hive / Spark / ClickHouse / 云数仓</text>
  <rect x="60" y="252" width="640" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="274" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">数仓的位置：把 OLTP 的数据搬运并重组为 OLAP 友好的形态</text>
  <text x="380" y="294" text-anchor="middle" font-size="8" fill="#334155">同步（CDC）→ 分层（ODS/DWD/DWS/ADS）→ 口径集中 → 对外提供一致指标</text>
  <rect x="60" y="322" width="640" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="344" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">直接查业务库的四个代价</text>
  <text x="380" y="364" text-anchor="middle" font-size="8" fill="#B91C1C">拖垮线上 · 口径各写各的 · 历史无法追溯 · 跨源无法统一</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
