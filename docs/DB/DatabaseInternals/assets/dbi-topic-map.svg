<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title>数据库内核与存储引擎专题地图</title>
  <rect width="900" height="600" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">数据库内核与存储引擎：七块结构，一条闭环</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#64748B">从上往下是「一次查询的一生」，从左往右是「三种放大的取舍」</text>

  <rect x="40" y="96" width="820" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">概述：四层分工 + 三种放大</text>
  <text x="450" y="144" text-anchor="middle" font-size="12" fill="#334155">连接 → 编译 → 执行 → 存储 ｜ 读放大 / 写放大 / 空间放大</text>

  <rect x="40" y="186" width="255" height="104" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="167" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">页与缓冲池</text>
  <text x="167" y="236" text-anchor="middle" font-size="12" fill="#334155">8 KB 页 · Clock-Sweep</text>
  <text x="167" y="256" text-anchor="middle" font-size="12" fill="#334155">脏页与检查点</text>
  <text x="167" y="276" text-anchor="middle" font-size="12" fill="#334155">命中率为什么会骗人</text>

  <rect x="322" y="186" width="255" height="104" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#B45309">B+ 树</text>
  <text x="450" y="236" text-anchor="middle" font-size="12" fill="#334155">3 层树撑住一亿行</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#334155">页分裂 · 最左前缀</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#334155">回表为什么散</text>

  <rect x="604" y="186" width="256" height="104" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="732" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#6D28D9">LSM 树</text>
  <text x="732" y="236" text-anchor="middle" font-size="12" fill="#334155">memtable → SSTable</text>
  <text x="732" y="256" text-anchor="middle" font-size="12" fill="#334155">compaction 三策略</text>
  <text x="732" y="276" text-anchor="middle" font-size="12" fill="#334155">写放大 3× 到 31×</text>

  <rect x="40" y="314" width="255" height="104" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="167" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#BE185D">WAL 与恢复</text>
  <text x="167" y="364" text-anchor="middle" font-size="12" fill="#334155">LSN · 组提交</text>
  <text x="167" y="384" text-anchor="middle" font-size="12" fill="#334155">ARIES 三阶段</text>
  <text x="167" y="404" text-anchor="middle" font-size="12" fill="#334155">提交之后凭什么不丢</text>

  <rect x="322" y="314" width="255" height="104" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#C2410C">执行器</text>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#334155">火山 vs 向量化</text>
  <text x="450" y="384" text-anchor="middle" font-size="12" fill="#334155">三种 join · loops</text>
  <text x="450" y="404" text-anchor="middle" font-size="12" fill="#334155">落盘与并行</text>

  <rect x="604" y="314" width="256" height="104" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="732" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0E7490">优化器</text>
  <text x="732" y="364" text-anchor="middle" font-size="12" fill="#334155">代价模型与选择率</text>
  <text x="732" y="384" text-anchor="middle" font-size="12" fill="#334155">独立性假设的失真</text>
  <text x="732" y="404" text-anchor="middle" font-size="12" fill="#334155">计划为什么会变</text>

  <rect x="40" y="442" width="400" height="86" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="240" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">实战：七步内核级体检</text>
  <text x="240" y="492" text-anchor="middle" font-size="12" fill="#334155">定环境 → 看计划 → 数页 → 查相关性 → 看树高 → 算写放大 → 改一处重测</text>
  <text x="240" y="512" text-anchor="middle" font-size="12" fill="#64748B">每步一条命令，一个判读规则</text>

  <rect x="462" y="442" width="398" height="86" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="661" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">常见问题：症状分诊</text>
  <text x="661" y="492" text-anchor="middle" font-size="12" fill="#334155">六类症状 → 四层归属 → 十二问 → 20 项自查</text>
  <text x="661" y="512" text-anchor="middle" font-size="12" fill="#64748B">先定位层，再谈优化</text>

  <text x="450" y="562" text-anchor="middle" font-size="12" fill="#94A3B8">全专题 9 页 / 71 条判据，每条判据只回答：约定是什么 · 定错会怎样 · 怎么验证</text>
</svg>
