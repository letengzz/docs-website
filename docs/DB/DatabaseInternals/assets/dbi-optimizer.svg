<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>优化器：四步生成计划、代价模型与独立性假设造成的估算误差</title>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E293B">优化器只做算术，所以它的结论受限于假设</text>

  <rect x="50" y="60" width="180" height="62" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1D4ED8">① 解析 parse</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#334155">SQL → 语法树</text>

  <rect x="252" y="60" width="180" height="62" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="342" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">② 重写 rewrite</text>
  <text x="342" y="106" text-anchor="middle" font-size="11" fill="#334155">视图 · 规则 · 行级安全</text>

  <rect x="454" y="60" width="180" height="62" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="544" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#B45309">③ 逻辑优化</text>
  <text x="544" y="106" text-anchor="middle" font-size="11" fill="#334155">谓词下推 · 等价变换</text>

  <rect x="656" y="60" width="194" height="62" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="753" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">④ 物理优化</text>
  <text x="753" y="106" text-anchor="middle" font-size="11" fill="#7F1D1D">选算法 · 估代价 ← 会算错</text>

  <path d="M230 91 L252 91" stroke="#94A3B8" stroke-width="2" marker-end="url(#a7)"/>
  <path d="M432 91 L454 91" stroke="#94A3B8" stroke-width="2" marker-end="url(#a7)"/>
  <path d="M634 91 L656 91" stroke="#94A3B8" stroke-width="2" marker-end="url(#a7)"/>
  <defs>
    <marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <text x="140" y="140" text-anchor="middle" font-size="10" fill="#64748B">不看代价</text>
  <text x="342" y="140" text-anchor="middle" font-size="10" fill="#64748B">不看代价</text>
  <text x="544" y="140" text-anchor="middle" font-size="10" fill="#64748B">不看代价（只求等价）</text>
  <text x="753" y="140" text-anchor="middle" font-size="10" fill="#991B1B">唯一看代价的一步</text>

  <rect x="50" y="162" width="800" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="66" y="184" font-size="13" font-weight="bold" fill="#1E293B">代价 = 页成本 + CPU 成本（五个参数，本机默认值）</text>
  <text x="66" y="208" font-size="12" fill="#334155">seq_page_cost = 1.0　　random_page_cost = 4.0　　cpu_tuple_cost = 0.01</text>
  <text x="66" y="228" font-size="12" fill="#334155">cpu_index_tuple_cost = 0.005　　cpu_operator_cost = 0.0025　　effective_cache_size = 4 GB</text>
  <text x="66" y="252" font-size="12" fill="#be123c">random_page_cost=4 是机械盘时代的默认值；SSD 上应降到 1.1～2.0，否则系统性高估索引代价</text>
  <text x="66" y="272" font-size="11" fill="#64748B">代价单位是「页访问当量」，不是秒 —— 只能同查询内比较，不能跨查询换算</text>

  <text x="50" y="312" font-size="13" font-weight="bold" fill="#BE185D">独立性假设的实测失真：两列完全相关</text>

  <text x="50" y="340" font-size="12" fill="#334155">估算 rows = 25,540（100000 × 0.5 × 0.5）</text>
  <rect x="50" y="348" width="255" height="26" rx="4" fill="#FDA4AF" stroke="#F43F5E"/>
  <text x="312" y="366" font-size="12" font-weight="bold" fill="#9F1239">25,540</text>

  <text x="50" y="398" font-size="12" fill="#334155">实际 rows = 50,000（b=1 不带来额外过滤）</text>
  <rect x="50" y="406" width="500" height="26" rx="4" fill="#86EFAC" stroke="#22C55E"/>
  <text x="557" y="424" font-size="12" font-weight="bold" fill="#15803D">50,000</text>

  <text x="50" y="456" font-size="12" fill="#be123c">误差 1.96 倍：连接时误差会相乘 ⇒ 两表各差 2 倍就是 4 倍 ⇒ 计划整体翻转</text>

  <rect x="50" y="474" width="800" height="66" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="66" y="496" font-size="12" fill="#15803D">三条修正：① 倾斜列提高 statistics（100 → 500）　② 强相关列建 create statistics (dependencies)　③ 改写查询让条件不再相乘</text>
  <text x="66" y="516" font-size="12" fill="#166534">验证扩展统计是否生效：建完后必须再 analyze 一次，估算 rows 应从 25,540 变成接近 50,000</text>
  <text x="66" y="534" font-size="11" fill="#64748B">PG 18 起 EXPLAIN ANALYZE 默认带 Buffers；pg_upgrade 保留统计信息（升级后不必等 analyze 恢复性能）</text>
</svg>
