  <rect x="96" y="150" width="150" height="200" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="8"/>
  <rect x="126" y="126" width="150" height="200" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="8"/>
