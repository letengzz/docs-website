  <circle cx="316" cy="322" r="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="8"/>
  <circle cx="416" cy="322" r="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="8"/>
  <line x1="316" y1="274" x2="316" y2="304" stroke="#22C55E" stroke-width="8"/>
  <line x1="416" y1="274" x2="416" y2="304" stroke="#22C55E" stroke-width="8"/>
  <!-- WAL：代表日志先行 -->
  <path d="M120 372 L392 372" stroke="#EC4899" stroke-width="14" stroke-linecap="round"/>
  <path d="M348 340 L392 372 L348 404" fill="none" stroke="#EC4899" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
