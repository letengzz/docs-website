  <line x1="176" y1="140" x2="286" y2="140" stroke="#93C5FD" stroke-width="8" stroke-linecap="round"/>
  <line x1="176" y1="166" x2="286" y2="166" stroke="#93C5FD" stroke-width="8" stroke-linecap="round"/>
  <line x1="176" y1="192" x2="246" y2="192" stroke="#93C5FD" stroke-width="8" stroke-linecap="round"/>
  <!-- B+ 树：代表索引 -->
