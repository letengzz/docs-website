<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">写放大：一次行更新在磁盘上留下的四个痕迹</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">WAL 里 96% 是整页副本（FPI）——它只在「检查点后第一次改某页」时发生，但它决定了复制与备份的账单</text>
<rect x="36" y="94" width="200" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="118" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">① WAL 记录</text>
<text x="48" y="140" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">60 B/记录（无 FPI）</text>
<text x="48" y="158" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">约 1.1~1.3 倍的行数据</text>
<rect x="252" y="94" width="230" height="76" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="264" y="118" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 整页副本 FPI</text>
<text x="264" y="140" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">8 KB / 页，检查点后首改</text>
<text x="264" y="158" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">882~1,177 B/记录（含 FPI）</text>
<rect x="498" y="94" width="200" height="76" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="510" y="118" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 数据页落盘</text>
<text x="510" y="140" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每 30 s 1,020~2,417 页</text>
<text x="510" y="158" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">随机写，1 倍体积</text>
<rect x="714" y="94" width="210" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="726" y="118" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 双写（MySQL）</text>
<text x="726" y="140" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">innodb_doublewrite = ON</text>
<text x="726" y="158" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">稳定的 2 倍数据写</text>
<rect x="36" y="186" width="888" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="210" font-size="12" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">本机四组读数（pgbench -N -c 8，15 秒，checkpoint_timeout=30s）</text>
<text x="48" y="232" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">fpw=on 首段：3,292.1 TPS｜WAL 263.0 MB｜FPI 30,973（96%）｜1,177 B/记录</text>
<text x="48" y="250" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">fpw=on 后续：3,007.2 TPS｜WAL 174.3 MB｜FPI 20,152（95%）｜882 B/记录</text>
<rect x="36" y="278" width="432" height="112" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="48" y="302" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">正确做法：开压缩（wal_compression=zstd）</text>
<text x="48" y="324" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">27,143 张整页副本（原始 222 MB）→ 整段 WAL 32.5 MB</text>
<text x="48" y="342" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">140 B/记录，TPS 3,504.6（+16.5%）</text>
<text x="48" y="360" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">复制带宽需求：11.6 MB/s → 2.2 MB/s（一天 1.0 TB → 187 GB）</text>
<text x="48" y="380" font-size="10" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">用 CPU 换 WAL：CPU 已 >70% 的库会变慢</text>
<rect x="488" y="278" width="436" height="112" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="500" y="302" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">错误做法：关掉 full_page_writes</text>
<text x="500" y="324" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">WAL 174.3 MB → 14.0 MB（12.5×），TPS 3,441.6（+14.5%）</text>
<text x="500" y="342" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价：一次部分写就留下无法修复的坏页</text>
<text x="500" y="360" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">只能从备份恢复，而备份链可能已经滚过那个时间点</text>
<text x="500" y="380" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">省下的 WAL 账单，赔上的是可恢复性</text>
</svg>
