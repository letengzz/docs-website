<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">症状分诊：从现象反查参数</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">最常见的错误不是「不知道参数」，而是「症状指向了错误的参数」</text>
<rect x="36" y="94" width="288" height="130" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="48" y="118" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">看存储层</text>
<text x="48" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">命中率低 / 物理读高</text>
<text x="48" y="162" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ shared_buffers、页缓存</text>
<text x="48" y="182" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">大查询偶发慢十倍</text>
<text x="48" y="202" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ work_mem（看 Sort Method）</text>
<rect x="340" y="94" width="288" height="130" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="352" y="118" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">看写路径</text>
<text x="352" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">写入不高但 WAL 飞涨</text>
<text x="352" y="162" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ FPI、wal_compression</text>
<text x="352" y="182" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">固定时刻 IO 尖峰</text>
<text x="352" y="202" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 检查点 / 备份撞车</text>
<rect x="644" y="94" width="280" height="130" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="656" y="118" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">看并发与维护</text>
<text x="656" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">并发一上内存就满</text>
<text x="656" y="162" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ work_mem × 连接 × 并行</text>
<text x="656" y="182" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">表只增不减</text>
<text x="656" y="202" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ autovacuum 阈值 / 长事务</text>
<rect x="36" y="242" width="888" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="266" font-size="12" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">三条最短路径</text>
<text x="48" y="288" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">命中率低但延迟正常 → 不是问题（页缓存兜住了）｜命中率高但延迟高 → 查 CPU/锁/网络，不是存储</text>
<rect x="36" y="322" width="432" height="86" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="48" y="346" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">参数救不了的，别硬调</text>
<text x="48" y="368" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">缺索引 / 单表 20 亿行 / 800 个 idle 连接</text>
<text x="48" y="388" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">CPU 打满 / 云盘 IOPS 到顶 / 事务里有 HTTP</text>
<rect x="488" y="322" width="436" height="86" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="500" y="346" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">上线自查十二项</text>
<text x="500" y="368" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">生效性 / 内存上界 / 落盘 / 检查点 / WAL / 并行</text>
<text x="500" y="388" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">膨胀 / 长事务 / per-table 覆盖 / 回滚条件 / 噪声带</text>
</svg>
