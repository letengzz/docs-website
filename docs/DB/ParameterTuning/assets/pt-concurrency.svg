<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">并发参数的三角：连接、worker、内存</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">三个上限各自独立，小的那个说了算——并行度设 4 却只启 3 个，就是 worker 池撞墙</text>
<rect x="40" y="100" width="250" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="52" y="126" font-size="12.5" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">max_connections</text>
<text x="52" y="150" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">默认 100｜本单 200</text>
<text x="52" y="170" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">空闲连接 2.65 MB（实测）</text>
<text x="52" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">50 连接 → +132.6 MiB</text>
<text x="52" y="210" font-size="10" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">每连接一个进程</text>
<rect x="356" y="100" width="250" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="368" y="126" font-size="12.5" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">max_worker_processes</text>
<text x="368" y="150" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">默认 8｜本单 16</text>
<text x="368" y="170" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行 + autovacuum + 复制 + IO</text>
<text x="368" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">共享一个池，最容易撞墙</text>
<text x="368" y="210" font-size="10" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">≥ 并行 + 3 + 4</text>
<rect x="672" y="100" width="248" height="120" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="684" y="126" font-size="12.5" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">workers_per_gather</text>
<text x="684" y="150" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">默认 2｜本单 3</text>
<text x="684" y="170" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每个 worker 各拿一份 work_mem</text>
<text x="684" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">内存上界 × (1+并行度)</text>
<text x="684" y="210" font-size="10" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行是「借内存换时间」</text>
<line x1="290" y1="160" x2="356" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="606" y1="160" x2="672" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="36" y="240" width="888" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="264" font-size="12" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行度实测（97 MB 表聚合，串行 212.6 ms）</text>
<text x="48" y="286" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1 worker → 128.6 ms（1.65×）｜2 → 93.9 ms（2.26×）｜设 4 却只启 3 → 77.7 ms（2.74×）</text>
<text x="48" y="306" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">加速比永远低于 worker 数：启动开销 + 结果合并 + 扫描的串行段</text>
<rect x="36" y="332" width="432" height="74" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="48" y="356" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">PG 18 新增异步 IO</text>
<text x="48" y="378" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">io_method=worker｜io_workers=3｜effective_io_concurrency=16</text>
<text x="48" y="396" font-size="10" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">io_workers 也占 max_worker_processes 名额</text>
<rect x="488" y="332" width="436" height="74" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="500" y="356" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">连接单价 = 2.65 MB（空闲）</text>
<text x="500" y="378" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">干活时再加 work_mem × 节点数 × (1+并行)</text>
<text x="500" y="396" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">按 2.65 MB × 500 算「只要 1.3 GB」是幻觉</text>
</svg>
