<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">数据库参数与内核调优：四类参数与五个必失点</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">调参不是把值调大，而是把有限资源按负载形状重新分配——每一份都要说清「代价由谁承担」</text>
<rect x="36" y="96" width="212" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="120" font-size="12.5" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 预算</text>
<text x="48" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">shared_buffers</text>
<text x="48" y="159" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">work_mem</text>
<text x="48" y="176" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">maintenance_work_mem</text>
<text x="48" y="199" font-size="10" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">先算收入，再谈支出</text>
<rect x="264" y="96" width="212" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="276" y="120" font-size="12.5" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 节奏</text>
<text x="276" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">checkpoint_timeout</text>
<text x="276" y="159" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">max_wal_size</text>
<text x="276" y="176" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">completion_target</text>
<text x="276" y="199" font-size="10" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">刷盘摊平到时间线</text>
<rect x="492" y="96" width="212" height="120" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="504" y="120" font-size="12.5" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 并发</text>
<text x="504" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">max_connections</text>
<text x="504" y="159" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">max_worker_processes</text>
<text x="504" y="176" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">parallel_workers_per_gather</text>
<text x="504" y="199" font-size="10" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">三个上限谁先撞墙</text>
<rect x="720" y="96" width="204" height="120" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="732" y="120" font-size="12.5" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 维护</text>
<text x="732" y="142" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">autovacuum_*</text>
<text x="732" y="159" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">fillfactor</text>
<text x="732" y="176" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">default_statistics_target</text>
<text x="732" y="199" font-size="10" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">垃圾数据怎么收</text>
<line x1="248" y1="156" x2="264" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="476" y1="156" x2="492" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="704" y1="156" x2="720" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="36" y="236" width="888" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="260" font-size="12.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">五个必失点（本机 2026-10-23 实测，PostgreSQL 18.6 / MySQL 8.4.11）</text>
<text x="48" y="283" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1 命中率当目标：缓冲池 128MB→1GB，命中率 82.57%→98.04%，TPS 24,572→24,506（噪声内）</text>
<text x="48" y="301" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">2 work_mem 当单查询参数：单条只快 6.2%，8 并发内存 +130MB→+604MB</text>
<text x="48" y="319" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">3 小看整页写：WAL 里 96% 是 FPI；关掉后 WAL 小 12.5 倍、TPS 只涨 14.5%</text>
<rect x="36" y="348" width="888" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="48" y="372" font-size="12.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">4 并发参数各调各的 → 内存上界 (1+并行度)×work_mem×连接数 可达 19.3 GB（16 GB 机器）</text>
<text x="48" y="395" font-size="12.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">5 指望 autovacuum 默认值收拾大表 → 阈值 = 50 + 0.2×行数，千万行表要 200 万死元组</text>
<text x="48" y="420" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">五步顺序：定预算 → 定节奏 → 定并发 → 定维护 → 定验证（顺序不能换，每步依赖上一步的结论）</text>
</svg>
