<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">内存预算：三个池子抢同一块物理内存</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">给缓冲池太多，页缓存就没了——「缓冲池没命中的读」全部变成磁盘 IO</text>
<rect x="36" y="94" width="888" height="52" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="117" font-size="12" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">物理内存 16 GB（8C16G 专用库）</text>
<text x="48" y="135" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">可用 = 16 − 2(OS) − 0.8(100 连接 × 8MB 保守估计) ≈ 13.2 GB</text>
<rect x="36" y="158" width="260" height="76" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="182" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">共享缓冲 25%</text>
<text x="48" y="203" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">shared_buffers = 3.3 GB → 取 4 GB</text>
<text x="48" y="221" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">库自己管，改完要重启</text>
<rect x="304" y="158" width="300" height="76" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="316" y="182" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">页缓存 50%~60%</text>
<text x="316" y="203" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">OS 管，数据库的第二层缓存</text>
<text x="316" y="221" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">effective_cache_size 只是「告诉规划器」</text>
<rect x="612" y="158" width="312" height="76" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="624" y="182" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">工作内存 5%~15%</text>
<text x="624" y="203" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">work_mem × 并发 × (1+并行度)</text>
<text x="624" y="221" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">按时分配、用完归还（PG）</text>
<rect x="36" y="252" width="888" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="276" font-size="12" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">本机实测：加缓冲池买到了什么</text>
<text x="48" y="298" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">128MB → 1GB：命中率 82.57% → 98.04%（+15.5pp）｜物理读 2.68 GB → 307 MB（−8.9×）｜TPS 24,572 → 24,506（−0.3%，噪声内）</text>
<text x="48" y="318" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">结论：省下的是「页缓存 → 共享缓冲」的内存拷贝，不是磁盘 IO —— 命中率是解释性指标，不是目标</text>
<rect x="36" y="352" width="432" height="70" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="48" y="376" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">PostgreSQL：改缓冲池要重启</text>
<text x="48" y="398" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">ALTER SYSTEM → pending_restart = t → 排维护窗口</text>
<rect x="488" y="352" width="436" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="500" y="376" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL：可以在线扩</text>
<text x="500" y="398" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">256.8MB 表：128MB 池 1.34 s → 1GB 池 0.94 s（1.43×），无需重启</text>
</svg>
