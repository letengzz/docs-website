<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三个保留期与唯一的正确清理顺序</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">混用它们会得到两种灾难：盘越用越多，或时间旅行查到一半报错</text>

  <rect x="30" y="72" width="700" height="34" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="45" y="94" font-size="9" fill="#065F46">① 快照保留期（snapshot retention）——决定「读者能回到多久以前」，7 天 / 合规 30~90 天</text>

  <rect x="30" y="112" width="700" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="45" y="134" font-size="9" fill="#1E3A8A">② 最小保留快照数（min-snapshots-to-keep）——防止「一天只提交一次时把历史删光」，5~10</text>

  <rect x="30" y="152" width="700" height="34" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
  <text x="45" y="174" font-size="9" fill="#9A3412">③ 孤儿判定年龄（orphan min-age）——必须 ≥ 最长写事务 × 2，常取 3 天</text>

  <text x="30" y="214" font-size="10.5" fill="#0F172A" font-weight="bold">清理顺序（不可交换）</text>

  <rect x="30" y="226" width="160" height="58" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="246" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">expire_snapshots</text>
  <text x="110" y="263" text-anchor="middle" font-size="7.8" fill="#047857">旧快照移出元数据</text>
  <text x="110" y="277" text-anchor="middle" font-size="7.8" fill="#047857">→ 文件变成无引用</text>

  <rect x="212" y="226" width="160" height="58" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="292" y="246" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">等一个孤儿窗口</text>
  <text x="292" y="263" text-anchor="middle" font-size="7.8" fill="#475569">保证期间没有新事务</text>
  <text x="292" y="277" text-anchor="middle" font-size="7.8" fill="#475569">还在引用这些文件</text>

  <rect x="394" y="226" width="160" height="58" rx="7" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="474" y="246" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">remove_orphan_files</text>
  <text x="474" y="263" text-anchor="middle" font-size="7.8" fill="#C2410C">只删「无引用 且</text>
  <text x="474" y="277" text-anchor="middle" font-size="7.8" fill="#C2410C">mtime 早于 min-age」</text>

  <rect x="576" y="226" width="154" height="58" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="653" y="246" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">才轮到存储层规则</text>
  <text x="653" y="263" text-anchor="middle" font-size="7.8" fill="#B91C1C">且不要给 data/ 前缀</text>
  <text x="653" y="277" text-anchor="middle" font-size="7.8" fill="#B91C1C">配过期删除</text>

  <line x1="190" y1="255" x2="212" y2="255" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="372" y1="255" x2="394" y2="255" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="554" y1="255" x2="576" y2="255" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar2)"/>
  <defs>
    <marker id="ar2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="30" y="304" width="700" height="26" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="380" y="321" text-anchor="middle" font-size="8.5" fill="#991B1B">顺序反了：先清孤儿 → 旧快照仍引用 → 删不掉；把 min-age 调成 0 → 删掉正在写的文件，提交后表指向不存在的文件</text>

  <rect x="30" y="340" width="700" height="26" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="380" y="357" text-anchor="middle" font-size="8.5" fill="#92400E">删除承诺的四段：T+0 逻辑删除 → T+保留期 快照过期 → +孤儿窗口 物理删除 → +备份周期 副本过期；每段都要证据</text>
</svg>
