<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一次原子提交的六步：只有第 ⑥ 步在改状态</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">① ~ ⑤ 全是「写新对象」，失败只留垃圾；⑥ 才是分界线</text>

  <rect x="30" y="72" width="700" height="34" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="380" y="94" text-anchor="middle" font-size="9" fill="#334155">读者看到的「旧快照」在这一步之后仍然完整可用（快照隔离）</text>

  <rect x="30" y="118" width="700" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="45" y="140" font-size="9" fill="#1E3A8A">① 读当前快照与 schema（拿到基线 snapshot_id）</text>
  <text x="715" y="140" text-anchor="end" font-size="8" fill="#1D4ED8">元数据层 · 失败=无副作用</text>

  <rect x="30" y="160" width="700" height="34" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="45" y="182" font-size="9" fill="#9A3412">② 写数据文件（新路径，读者不可见）</text>
  <text x="715" y="182" text-anchor="end" font-size="8" fill="#C2410C">存储层 · 失败=孤儿文件</text>

  <rect x="30" y="202" width="700" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="45" y="224" font-size="9" fill="#1E3A8A">③ 写 manifest（登记新文件 + 列统计 + 分区值）</text>
  <text x="715" y="224" text-anchor="end" font-size="8" fill="#1D4ED8">元数据层 · 失败=孤儿 manifest</text>

  <rect x="30" y="244" width="700" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="45" y="266" font-size="9" fill="#1E3A8A">④ 写 manifest list（指向新旧全部 manifest）</text>
  <text x="715" y="266" text-anchor="end" font-size="8" fill="#1D4ED8">元数据层</text>

  <rect x="30" y="286" width="700" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="45" y="308" font-size="9" fill="#1E3A8A">⑤ 写新 metadata.json（不改旧的）</text>
  <text x="715" y="308" text-anchor="end" font-size="8" fill="#1D4ED8">元数据层</text>

  <rect x="30" y="330" width="700" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="45" y="355" font-size="9.5" fill="#065F46" font-weight="bold">⑥ catalog CAS：assert 基线仍为旧快照 → 把指针换成新 metadata</text>
  <text x="715" y="355" text-anchor="end" font-size="8" fill="#047857">唯一的分界线</text>

  <rect x="30" y="382" width="340" height="34" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="200" y="403" text-anchor="middle" font-size="8.5" fill="#065F46">成功 → 新快照对所有读者可见（原子）</text>
  <rect x="390" y="382" width="340" height="34" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.1"/>
  <text x="560" y="403" text-anchor="middle" font-size="8.5" fill="#991B1B">409 → 基线过期，必须基于新快照重新规划</text>
</svg>
