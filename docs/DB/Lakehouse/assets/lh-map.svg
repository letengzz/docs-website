<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">数据湖与湖仓一体：四层结构与十个落点</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">对象存储 → 文件格式 → 表格式 → catalog；每一层都有一类「不报错但数据错」的失效</text>

  <rect x="30" y="76" width="700" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="380" y="98" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">存储层：S3 / OSS / HDFS（只有 PUT/GET，没有原子 rename）</text>
  <text x="380" y="118" text-anchor="middle" font-size="8.5" fill="#64748B">请求上限 · 单对象强一致 · 列目录昂贵</text>

  <rect x="30" y="146" width="700" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="380" y="168" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">文件格式层：Parquet / ORC（列存、编码、row group、统计）</text>
  <text x="380" y="188" text-anchor="middle" font-size="8.5" fill="#64748B">压缩率与块大小强相关 · 统计是 data skipping 的原料</text>

  <rect x="30" y="216" width="700" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="238" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">表格式层：Iceberg / Delta / Hudi / Paimon（快照、模式、分区、删除）</text>
  <text x="380" y="258" text-anchor="middle" font-size="8.5" fill="#047857">成员由元数据决定，不由路径决定；提交 = 写新文件 + 换指针</text>

  <rect x="30" y="286" width="700" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="308" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">catalog 层：REST catalog / Polaris / Glue / HMS（名字解析 + 提交互斥）</text>
  <text x="380" y="328" text-anchor="middle" font-size="8.5" fill="#1D4ED8">没有 CAS 的 catalog，等于没有 catalog</text>

  <text x="30" y="372" font-size="11" fill="#0F172A" font-weight="bold">十个落点</text>

  <rect x="30" y="382" width="130" height="54" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="95" y="401" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">① 总览</text>
  <text x="95" y="417" text-anchor="middle" font-size="7.5" fill="#4338CA">四层 · 五个必失点</text>
  <text x="95" y="429" text-anchor="middle" font-size="7.5" fill="#4338CA">LHO</text>

  <rect x="172" y="382" width="130" height="54" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="237" y="401" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">② 表格式</text>
  <text x="237" y="417" text-anchor="middle" font-size="7.5" fill="#4338CA">三种元数据 · 删除语义</text>
  <text x="237" y="429" text-anchor="middle" font-size="7.5" fill="#4338CA">LHT</text>

  <rect x="314" y="382" width="130" height="54" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="379" y="401" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">③ 元数据与 catalog</text>
  <text x="379" y="417" text-anchor="middle" font-size="7.5" fill="#4338CA">规模 · 指针 · 重写</text>
  <text x="379" y="429" text-anchor="middle" font-size="7.5" fill="#4338CA">LHM</text>

  <rect x="456" y="382" width="130" height="54" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="521" y="401" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">④ 提交协议</text>
  <text x="521" y="417" text-anchor="middle" font-size="7.5" fill="#047857">CAS · 冲突 · 重试</text>
  <text x="521" y="429" text-anchor="middle" font-size="7.5" fill="#047857">LHW</text>

  <rect x="598" y="382" width="130" height="54" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="663" y="401" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">⑤ 增量读</text>
  <text x="663" y="417" text-anchor="middle" font-size="7.5" fill="#047857">边界 · 水位 · 去重</text>
  <text x="663" y="429" text-anchor="middle" font-size="7.5" fill="#047857">LHI</text>

  <rect x="30" y="446" width="130" height="54" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="95" y="465" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">⑥ 小文件治理</text>
  <text x="95" y="481" text-anchor="middle" font-size="7.5" fill="#C2410C">四面成本 · compaction</text>
  <text x="95" y="493" text-anchor="middle" font-size="7.5" fill="#C2410C">LHC</text>

  <rect x="172" y="446" width="130" height="54" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="237" y="465" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">⑦ 保留与清理</text>
  <text x="237" y="481" text-anchor="middle" font-size="7.5" fill="#C2410C">快照 · 孤儿 · 合规</text>
  <text x="237" y="493" text-anchor="middle" font-size="7.5" fill="#C2410C">LHR</text>

  <rect x="314" y="446" width="130" height="54" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="379" y="465" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">⑧ 引擎与裁剪</text>
  <text x="379" y="481" text-anchor="middle" font-size="7.5" fill="#0F766E">四层裁剪 · 聚簇</text>
  <text x="379" y="493" text-anchor="middle" font-size="7.5" fill="#0F766E">LHQ</text>

  <rect x="456" y="446" width="130" height="54" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="521" y="465" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">⑨ 实战</text>
  <text x="521" y="481" text-anchor="middle" font-size="7.5" fill="#0F766E">S1~S10 验收</text>
  <text x="521" y="493" text-anchor="middle" font-size="7.5" fill="#0F766E">LHP</text>

  <rect x="598" y="446" width="130" height="54" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="663" y="465" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">⑩ 常见问题</text>
  <text x="663" y="481" text-anchor="middle" font-size="7.5" fill="#0F766E">八类分诊 · 自查</text>
  <text x="663" y="493" text-anchor="middle" font-size="7.5" fill="#0F766E">LHF</text>
</svg>
