<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三层元数据与它的规模：5000 个小文件 vs 200 个大文件</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">同一份数据，元数据体积差 25 倍；而元数据是每次规划都要读的东西</text>

  <rect x="30" y="76" width="210" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="135" y="96" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">表级 metadata.json</text>
  <text x="135" y="114" text-anchor="middle" font-size="8" fill="#047857">当前快照 id · schema · 分区规格</text>
  <text x="135" y="130" text-anchor="middle" font-size="8" fill="#047857">快照历史列表</text>
  <text x="135" y="143" text-anchor="middle" font-size="7.5" fill="#059669">数量：1（几 KB ~ 几 MB）</text>

  <rect x="270" y="76" width="210" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="375" y="96" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">快照级 manifest list</text>
  <text x="375" y="114" text-anchor="middle" font-size="8" fill="#1D4ED8">指向哪些 manifest</text>
  <text x="375" y="130" text-anchor="middle" font-size="8" fill="#1D4ED8">每个 manifest 的分区上下界</text>
  <text x="375" y="143" text-anchor="middle" font-size="7.5" fill="#2563EB">数量：= manifest 数</text>

  <rect x="510" y="76" width="220" height="70" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="96" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">文件级 manifest</text>
  <text x="620" y="114" text-anchor="middle" font-size="8" fill="#C2410C">每条 entry：路径 · 大小 · 行数</text>
  <text x="620" y="130" text-anchor="middle" font-size="8" fill="#C2410C">列级 lower/upper bounds · 分区值</text>
  <text x="620" y="143" text-anchor="middle" font-size="7.5" fill="#EA580C">每条实测约 576 B</text>

  <text x="30" y="180" font-size="10.5" fill="#0F172A" font-weight="bold">同一份数据，两种布局</text>

  <rect x="30" y="192" width="340" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="200" y="212" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">未治理：5,000 个 1 MB 文件</text>
  <text x="200" y="232" text-anchor="middle" font-size="8.5" fill="#991B1B">清单条目 5,000 条</text>
  <text x="200" y="250" text-anchor="middle" font-size="8.5" fill="#991B1B">元数据合计 ≈ 2,812 KiB</text>
  <text x="200" y="268" text-anchor="middle" font-size="8.5" fill="#991B1B">规划打开文件数 = manifest 数 × 2 + 1</text>
  <text x="200" y="283" text-anchor="middle" font-size="8" fill="#B91C1C">按 400 条/manifest → 13 个 manifest</text>

  <rect x="390" y="192" width="340" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="560" y="212" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">compaction 后：200 个 128 MB 文件</text>
  <text x="560" y="232" text-anchor="middle" font-size="8.5" fill="#047857">清单条目 200 条</text>
  <text x="560" y="250" text-anchor="middle" font-size="8.5" fill="#047857">元数据合计 ≈ 112 KiB（25 倍差）</text>
  <text x="560" y="268" text-anchor="middle" font-size="8.5" fill="#047857">规划打开文件数同步下降</text>
  <text x="560" y="283" text-anchor="middle" font-size="8" fill="#059669">按 400 条/manifest → 1 个 manifest</text>

  <text x="30" y="318" font-size="10.5" fill="#0F172A" font-weight="bold">只增不并的后果：规划成本跟「提交次数」成正比</text>
  <rect x="30" y="328" width="700" height="30" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="380" y="348" text-anchor="middle" font-size="8.5" fill="#334155">1,000 次提交且不重写 manifest → 快照引用 1,000 个 manifest → 规划要打开约 2,001 个元数据文件（按 1 ms/请求 ≈ 2 s，还没读一行数据）</text>

  <rect x="30" y="368" width="700" height="24" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="380" y="384" text-anchor="middle" font-size="8.5" fill="#92400E">所以 rewrite_manifests 与 rewrite_data_files 必须成对调度：前者管「打开几个文件」，后者管「每个文件多大」</text>
</svg>
