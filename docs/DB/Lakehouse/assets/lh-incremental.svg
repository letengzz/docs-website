<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">增量读交付的是「文件变化」，不是「业务变化」</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">同一条链路里，append 该发、compaction 不该发，但两者的快照长得很像</text>

  <text x="30" y="80" font-size="10.5" fill="#0F172A" font-weight="bold">快照时间线（S0 → S5）</text>

  <circle cx="80" cy="112" r="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="80" y="116" text-anchor="middle" font-size="8" fill="#065F46">S0</text>
  <circle cx="210" cy="112" r="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="210" y="116" text-anchor="middle" font-size="8" fill="#065F46">S1</text>
  <circle cx="340" cy="112" r="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="340" y="116" text-anchor="middle" font-size="8" fill="#065F46">S2</text>
  <circle cx="470" cy="112" r="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="470" y="116" text-anchor="middle" font-size="8" fill="#9A3412">S3</text>
  <circle cx="600" cy="112" r="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="600" y="116" text-anchor="middle" font-size="8" fill="#1E3A8A">S4</text>
  <circle cx="700" cy="112" r="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="700" y="116" text-anchor="middle" font-size="8" fill="#065F46">S5</text>

  <line x1="90" y1="112" x2="200" y2="112" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="220" y1="112" x2="330" y2="112" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="350" y1="112" x2="460" y2="112" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="480" y1="112" x2="590" y2="112" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="610" y1="112" x2="690" y2="112" stroke="#94A3B8" stroke-width="1.4"/>

  <text x="145" y="136" text-anchor="middle" font-size="7.5" fill="#047857">append</text>
  <text x="275" y="136" text-anchor="middle" font-size="7.5" fill="#047857">append</text>
  <text x="405" y="136" text-anchor="middle" font-size="7.5" fill="#C2410C">rewrite</text>
  <text x="535" y="136" text-anchor="middle" font-size="7.5" fill="#1D4ED8">delete</text>
  <text x="650" y="136" text-anchor="middle" font-size="7.5" fill="#047857">append</text>

  <rect x="300" y="150" width="220" height="46" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="410" y="168" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">S3 是 compaction（rewrite）</text>
  <text x="410" y="185" text-anchor="middle" font-size="7.8" fill="#C2410C">业务数据一行没变，但删了 500 个文件、加了 40 个文件</text>

  <text x="30" y="228" font-size="10.5" fill="#0F172A" font-weight="bold">下游的正确做法：按变更类型分流</text>

  <rect x="30" y="238" width="700" height="30" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="45" y="258" font-size="8.5" fill="#334155">operation = append / overwrite / delete → 业务变更，正常下发（overwrite 要带「整体替换」标记）</text>

  <rect x="30" y="274" width="700" height="30" rx="5" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.1"/>
  <text x="45" y="294" font-size="8.5" fill="#9A3412">operation = replace 但 summary 里有 rewritten-files-count → 布局变更，不下发业务事件</text>

  <rect x="30" y="310" width="700" height="30" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.1"/>
  <text x="45" y="330" font-size="8.5" fill="#065F46">水位写外部存储（sync_watermark），先写下游再推进；消费端 upsert 或按分区覆盖 → 重放安全</text>

  <rect x="30" y="350" width="700" height="22" rx="4" fill="#FEF2F2"/>
  <text x="380" y="365" text-anchor="middle" font-size="8.5" fill="#991B1B">只看「快照变了」就重放的下游，每天会被 compaction 触发一次全量重算——跑得对，但白跑</text>
</svg>
