<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL 5.7：没有 INSTANT 时的三条路</text>
<text x="40" y="80" font-size="14" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">已停止维护 · 仅存量项目，数字均为估算</text>
<rect x="40" y="110" width="280" height="240" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="58" y="146" font-size="15" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">直接 ALTER</text>
<text x="58" y="182" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· ALGORITHM=INPLACE</text>
<text x="58" y="212" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· LOCK=NONE</text>
<text x="58" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 整表重建，允许读写</text>
<text x="58" y="300" font-size="12" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败要重来</text>
<rect x="340" y="110" width="280" height="240" rx="12" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="358" y="146" font-size="15" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">pt-online-schema-change</text>
<text x="358" y="182" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 影子表 + 触发器</text>
<text x="358" y="212" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 分批拷贝</text>
<text x="358" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· RENAME 切换</text>
<text x="358" y="300" font-size="12" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">触发器有额外写开销</text>
<rect x="640" y="110" width="280" height="240" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
<text x="658" y="146" font-size="15" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">gh-ost</text>
<text x="658" y="182" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 影子表 + 读 binlog</text>
<text x="658" y="212" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 可在从库拷贝</text>
<text x="658" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 可动态限速/暂停</text>
<text x="658" y="300" font-size="12" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">需 binlog_format=ROW</text>
<rect x="40" y="380" width="880" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="60" y="414" font-size="14" font-weight="600" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">5.7 缺的三件事：无 INSTANT（加列必重建）、无原子 DDL（崩了留中间态）、CHECK 不生效。</text>
<text x="60" y="446" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">所以执行前必须有一次验证过恢复的备份，且所有时长按「重建」估算，不能按 8.4 的 INSTANT 估。</text>
</svg>
