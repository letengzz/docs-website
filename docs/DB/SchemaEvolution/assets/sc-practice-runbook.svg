<text x="40" y="80" font-size="14" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL 8.4.11 / 50 万行 / 单批 1 万</text>
<text x="40" y="134" font-size="13" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">T-30m</text>
