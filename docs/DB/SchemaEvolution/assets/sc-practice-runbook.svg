<text x="176" y="200" font-size="14" font-weight="600" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">expand 加列</text>
<text x="500" y="200" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.091 s，表空间不变</text>
<text x="40" y="258" font-size="13" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">T+30m</text>
