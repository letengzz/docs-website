<text x="500" y="448" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">null=0 / mismatch=0 / 水位终点</text>
<text x="40" y="500" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每一步都有「退出条件」：读数不对就停在这一步，不推进下一步。</text>
