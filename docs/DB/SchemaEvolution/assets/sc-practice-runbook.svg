<text x="176" y="262" font-size="14" font-weight="600" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">代码双写</text>
<text x="500" y="262" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">单语句写两列，观察 30 min</text>
