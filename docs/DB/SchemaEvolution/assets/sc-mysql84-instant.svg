<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">MySQL 8.4：INSTANT 改的是元数据，不是行</text>
<text x="40" y="80" font-size="14" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">50 万行 / 76 MB 表，三次加列后文件仍为 76 MB</text>
<rect x="60" y="110" width="300" height="300" rx="12" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="80" y="146" font-size="15" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">数据字典</text>
<text x="80" y="182" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 列定义 + 默认值</text>
<text x="80" y="214" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 行版本号 +1</text>
<text x="80" y="246" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 旧行不重写</text>
<text x="80" y="300" font-size="12" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">total_row_versions</text>
<rect x="80" y="316" width="260" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="96" y="344" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">建表 1 → 加列 2</text>
<text x="96" y="370" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">删列 4 → 再删 5</text>
<line x1="360" y1="260" x2="440" y2="260" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="446" y="110" width="454" height="300" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
<text x="466" y="146" font-size="15" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">实测读数（每次 0.085 ~ 0.097 s）</text>
<text x="466" y="182" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">ADD COLUMN NULL  → 成功</text>
<text x="466" y="216" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">ADD COLUMN NOT NULL DEFAULT 0 → 成功</text>
<text x="466" y="250" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">ADD COLUMN ... AFTER k → 成功</text>
<text x="466" y="284" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">MODIFY int→bigint → ERROR 1846</text>
<text x="466" y="318" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">DROP 被索引列 → ERROR 1845</text>
<text x="466" y="352" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">默认值 uuid() → ERROR 1674</text>
<text x="40" y="470" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">报错比降级安全：写 ALGORITHM=INSTANT，做不到就立刻失败，而不是悄悄变成重建。</text>
</svg>
