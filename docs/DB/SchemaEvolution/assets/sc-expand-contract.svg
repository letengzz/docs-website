<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">扩展-收缩：一次变更拆成三次发布</text>
<text x="40" y="80" font-size="14" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每个阶段的退出条件都可验证</text>
<rect x="40" y="110" width="280" height="250" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.7"/>
<text x="60" y="146" font-size="19" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">expand</text>
<text x="60" y="172" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">只做加法</text>
<text x="60" y="208" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 加可空列 / 加表 / 加索引</text>
<text x="60" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 代码双写两列</text>
<text x="60" y="276" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 读仍读旧列</text>
<line x1="320" y1="235" x2="346" y2="235" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="350" y="110" width="280" height="250" rx="12" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.7"/>
<text x="370" y="146" font-size="19" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">migrate</text>
<text x="370" y="172" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">搬数据</text>
<text x="370" y="208" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 分批回填历史行</text>
<text x="370" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 校验 null = 0</text>
<text x="370" y="276" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 读切到新列（开关）</text>
<line x1="630" y1="235" x2="656" y2="235" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="660" y="110" width="280" height="250" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.7"/>
<text x="680" y="146" font-size="19" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">contract</text>
<text x="680" y="172" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">拆旧结构</text>
<text x="680" y="208" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 停写旧列</text>
<text x="680" y="242" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 加 NOT NULL</text>
<text x="680" y="276" font-size="13" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 删旧列 / 删索引</text>
<rect x="40" y="390" width="880" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="60" y="422" font-size="14" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">顺序铁律：加动作「库先」，删动作「码先」；读切换用开关，停写旧列用发布。</text>
<text x="60" y="452" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每个阶段之间都要有一个「观察期」，观察期内不推进下一步。</text>
</svg>
