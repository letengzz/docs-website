<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="432" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选型决策树：先问时效，再看约束</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">顺序错了会既花掉集群预算，又没解决业务问题</text>
  <rect x="300" y="76" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">下游多久要用</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先答这一问</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">再谈引擎</text>
  <line x1="380" y1="128" x2="380" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="168" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">T+1 或更慢（报表 / 对账 / 训练）</text>
  <rect x="60" y="178" width="200" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="160" y="196.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">批处理栈</text>
  <text x="160" y="213" text-anchor="middle" font-size="8" fill="#1D4ED8">Hive 4 / Spark 4</text>
  <text x="160" y="231.4" text-anchor="middle" font-size="8" fill="#1D4ED8">HDFS 或对象存储 + 湖表</text>
  <text x="160" y="249.8" text-anchor="middle" font-size="8" fill="#1D4ED8">调度器编排 DAG</text>
  <text x="160" y="268.2" text-anchor="middle" font-size="8" fill="#1D4ED8">判据：吞吐与成本优先</text>
  <text x="380" y="224" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">分钟级（告警 / 风控 / 监控）</text>
  <rect x="280" y="178" width="200" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="196.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">流处理栈</text>
  <text x="380" y="213" text-anchor="middle" font-size="8" fill="#6D28D9">Flink 2 / Spark 微批</text>
  <text x="380" y="231.4" text-anchor="middle" font-size="8" fill="#6D28D9">Kafka + 状态与检查点</text>
  <text x="380" y="249.8" text-anchor="middle" font-size="8" fill="#6D28D9">判据：延迟与一致性优先</text>
  <text x="680" y="224" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">秒级且要更新</text>
  <rect x="500" y="178" width="230" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="615" y="196.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">实时 OLAP / 服务化</text>
  <text x="615" y="213" text-anchor="middle" font-size="8" fill="#0F766E">ClickHouse / Doris</text>
  <text x="615" y="231.4" text-anchor="middle" font-size="8" fill="#0F766E">湖表 + 物化视图</text>
  <text x="615" y="249.8" text-anchor="middle" font-size="8" fill="#0F766E">判据：点查与聚合延迟</text>
  <line x1="30" y1="296" x2="730" y2="296" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="320" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四个一票否决项</text>
  <rect x="30" y="332" width="196" height="20" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="128" y="346" text-anchor="middle" font-size="8" fill="#991B1B" font-weight="bold">团队没有流运维能力</text>
  <rect x="234" y="332" width="496" height="20" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="482" y="346" text-anchor="middle" font-size="8" fill="#334155">先做批 + 定时导出，别硬上流</text>
  <rect x="30" y="356" width="196" height="20" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="128" y="370" text-anchor="middle" font-size="8" fill="#991B1B" font-weight="bold">数据量 &lt; 单机可处理</text>
  <rect x="234" y="356" width="496" height="20" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="482" y="370" text-anchor="middle" font-size="8" fill="#334155">先把单机库与索引用好，别上集群</text>
  <rect x="30" y="380" width="196" height="20" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="128" y="394" text-anchor="middle" font-size="8" fill="#991B1B" font-weight="bold">下游只读一次且不怕旧</text>
  <rect x="234" y="380" width="496" height="20" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="482" y="394" text-anchor="middle" font-size="8" fill="#334155">批更便宜，流是纯成本</text>
  <rect x="30" y="404" width="196" height="20" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="128" y="418" text-anchor="middle" font-size="8" fill="#991B1B" font-weight="bold">没有幂等与重跑设计</text>
  <rect x="234" y="404" width="496" height="20" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="482" y="418" text-anchor="middle" font-size="8" fill="#334155">任何引擎都会给你重复数据</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
