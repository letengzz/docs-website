<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="398" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">HDFS 与 YARN：存储与资源调度</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">HDFS 把「大文件 + 高吞吐」做成默认，YARN 把集群 CPU/内存切成容器分给作业</text>
  <rect x="300" y="76" width="160" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">客户端 Client</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">读写请求 / 元数据操作</text>
  <rect x="280" y="168" width="200" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">NameNode（元数据）</text>
  <text x="380" y="203" text-anchor="middle" font-size="7.5" fill="#6D28D9">目录树 / 块映射 / 副本位置</text>
  <text x="380" y="220.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">单点，靠 QJM 做 HA</text>
  <rect x="30" y="264" width="150" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="105" y="282.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">DataNode A</text>
  <text x="105" y="299" text-anchor="middle" font-size="7.5" fill="#0F766E">块 1 / 块 3</text>
  <text x="105" y="316.25" text-anchor="middle" font-size="7.5" fill="#0F766E">本地磁盘直读</text>
  <rect x="200" y="264" width="150" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="275" y="282.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">DataNode B</text>
  <text x="275" y="299" text-anchor="middle" font-size="7.5" fill="#0F766E">块 1 / 块 2</text>
  <text x="275" y="316.25" text-anchor="middle" font-size="7.5" fill="#0F766E">机架感知：跨机架</text>
  <rect x="370" y="264" width="150" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="445" y="282.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">DataNode C</text>
  <text x="445" y="299" text-anchor="middle" font-size="7.5" fill="#0F766E">块 2 / 块 3</text>
  <text x="445" y="316.25" text-anchor="middle" font-size="7.5" fill="#0F766E">默认 3 副本</text>
  <rect x="540" y="264" width="190" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="635" y="282.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">YARN（资源调度）</text>
  <text x="635" y="299" text-anchor="middle" font-size="7.5" fill="#B45309">ResourceManager / NodeManager</text>
  <text x="635" y="316.25" text-anchor="middle" font-size="7.5" fill="#B45309">容器化分配 CPU 与内存</text>
  <line x1="380" y1="132" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="340" y1="230" x2="105" y2="230" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="105" y1="230" x2="105" y2="264" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="105" y1="256" x2="105" y2="264" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="420" y1="230" x2="275" y2="230" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="275" y1="230" x2="275" y2="264" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="275" y1="256" x2="275" y2="264" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="460" y1="230" x2="445" y2="230" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="445" y1="230" x2="445" y2="264" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="445" y1="256" x2="445" y2="264" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="356" text-anchor="middle" font-size="10" fill="#1E3A8A">名字节点管「在哪」、数据节点管「是什么」、YARN 管「用谁跑」</text>
  <text x="380" y="380" text-anchor="middle" font-size="9.5" fill="#B91C1C">一条硬约束：HDFS 适合「一次写入、多次读、大文件、追加」，不适合随机改写</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
