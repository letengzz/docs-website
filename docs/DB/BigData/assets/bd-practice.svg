<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="376" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：从 binlog 到实时看板的端到端链路</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">六跳链路，每一跳都有可核对的判据；对不上账的链路等于没链路</text>
  <rect x="22" y="78" width="106" height="76" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="75" y="96.2" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">业务库 MySQL</text>
  <text x="75" y="113" text-anchor="middle" font-size="6.8" fill="#334155">binlog 开启</text>
  <text x="75" y="128.64" text-anchor="middle" font-size="6.8" fill="#334155">ROW 格式</text>
  <line x1="128" y1="116" x2="144" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="144" y="78" width="106" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="197" y="96.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">CDC 采集</text>
  <text x="197" y="113" text-anchor="middle" font-size="6.8" fill="#1D4ED8">Flink CDC / Debezium</text>
  <text x="197" y="128.64" text-anchor="middle" font-size="6.8" fill="#1D4ED8">全量+增量切换</text>
  <line x1="250" y1="116" x2="266" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="266" y="78" width="106" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="319" y="96.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">Kafka</text>
  <text x="319" y="113" text-anchor="middle" font-size="6.8" fill="#6D28D9">按主键分区</text>
  <text x="319" y="128.64" text-anchor="middle" font-size="6.8" fill="#6D28D9">保证 key 内有序</text>
  <line x1="372" y1="116" x2="388" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="388" y="78" width="106" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="441" y="96.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">Flink 作业</text>
  <text x="441" y="113" text-anchor="middle" font-size="6.8" fill="#047857">去重 / 关联维表</text>
  <text x="441" y="128.64" text-anchor="middle" font-size="6.8" fill="#047857">水位线 + 状态</text>
  <line x1="494" y1="116" x2="510" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="78" width="106" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="563" y="96.2" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">湖表 / OLAP</text>
  <text x="563" y="113" text-anchor="middle" font-size="6.8" fill="#0F766E">Iceberg 快照</text>
  <text x="563" y="128.64" text-anchor="middle" font-size="6.8" fill="#0F766E">或写入 CK 明细</text>
  <line x1="616" y1="116" x2="632" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="632" y="78" width="106" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="685" y="96.2" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">看板 / 告警</text>
  <text x="685" y="113" text-anchor="middle" font-size="6.8" fill="#B45309">聚合结果查询</text>
  <text x="685" y="128.64" text-anchor="middle" font-size="6.8" fill="#B45309">口径与批侧对齐</text>
  <text x="380" y="176" text-anchor="middle" font-size="10" fill="#1E3A8A">每一跳都可能是「数据变样」的地方，所以每一跳都要有可核对的判据</text>
  <rect x="30" y="194" width="226" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="212.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">① 源端</text>
  <text x="143" y="229" text-anchor="middle" font-size="8" fill="#1D4ED8">binlog 位点与库时间可比</text>
  <rect x="268" y="194" width="226" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="212.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">② 采集</text>
  <text x="381" y="229" text-anchor="middle" font-size="8" fill="#6D28D9">全量条数 = 增量起点条数</text>
  <rect x="506" y="194" width="226" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="212.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">③ 传输</text>
  <text x="619" y="229" text-anchor="middle" font-size="8" fill="#047857">Kafka 位点与 CDC 位点对得上</text>
  <rect x="30" y="268" width="226" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="143" y="286.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 计算</text>
  <text x="143" y="303" text-anchor="middle" font-size="8" fill="#0F766E">去重后条数 = 源端变更条数</text>
  <rect x="268" y="268" width="226" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="286.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">⑤ 落库</text>
  <text x="381" y="303" text-anchor="middle" font-size="8" fill="#B45309">湖表快照行数与明细可对账</text>
  <rect x="506" y="268" width="226" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="619" y="286.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">⑥ 出口</text>
  <text x="619" y="303" text-anchor="middle" font-size="8" fill="#C2410C">看板数字与批侧同口径一致</text>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#B91C1C">验收口径：先让批侧与流侧对同一段时间跑出同一个数，再谈延迟</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
