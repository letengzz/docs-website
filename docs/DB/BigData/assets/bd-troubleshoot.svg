<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="356" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">大数据作业排查决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">慢、错、不稳三类问题的排查路径完全不同，混在一起查只会白花时间</text>
  <rect x="300" y="76" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">作业不对劲</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">别急着重跑</text>
  <line x1="380" y1="128" x2="130" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="160" width="200" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="130" y="178.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">慢 / 跑不完</text>
  <text x="130" y="195" text-anchor="middle" font-size="7.8" fill="#B45309">① 扫了多少分区与文件</text>
  <text x="130" y="212.94" text-anchor="middle" font-size="7.8" fill="#B45309">② 是否数据倾斜（看单 Task）</text>
  <text x="130" y="230.88" text-anchor="middle" font-size="7.8" fill="#B45309">③ Shuffle 大小与落盘</text>
  <text x="130" y="248.82" text-anchor="middle" font-size="7.8" fill="#B45309">④ 资源是否被挤占</text>
  <line x1="380" y1="128" x2="380" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="280" y="160" width="200" height="108" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="178.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">数据不对</text>
  <text x="380" y="195" text-anchor="middle" font-size="7.8" fill="#B91C1C">① 口径变了没（维度/时区）</text>
  <text x="380" y="212.94" text-anchor="middle" font-size="7.8" fill="#B91C1C">② 重复：幂等键是否生效</text>
  <text x="380" y="230.88" text-anchor="middle" font-size="7.8" fill="#B91C1C">③ 迟到数据是否落侧输出</text>
  <text x="380" y="248.82" text-anchor="middle" font-size="7.8" fill="#B91C1C">④ 分区边界是否闭合</text>
  <line x1="380" y1="128" x2="630" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="160" width="200" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="630" y="178.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">时好时坏</text>
  <text x="630" y="195" text-anchor="middle" font-size="7.8" fill="#6D28D9">① 上游是否补数/重放</text>
  <text x="630" y="212.94" text-anchor="middle" font-size="7.8" fill="#6D28D9">② 小文件与 compaction 节奏</text>
  <text x="630" y="230.88" text-anchor="middle" font-size="7.8" fill="#6D28D9">③ 检查点是否超时</text>
  <text x="630" y="248.82" text-anchor="middle" font-size="7.8" fill="#6D28D9">④ 元数据是否被并发改</text>
  <text x="380" y="292" text-anchor="middle" font-size="10" fill="#1E3A8A">通用顺序：先确认「这是数据问题还是计算问题」→ 再看单 Task 与数据分布</text>
  <text x="380" y="316" text-anchor="middle" font-size="9.5" fill="#64748B">三个最有效的动作：看作业时间轴、看单 Task 指标、对上游条数做一次计数核对</text>
  <text x="380" y="340" text-anchor="middle" font-size="9.5" fill="#B91C1C">反面：不看指标就直接调大并行度 / 加内存——大部分时候只会让问题更贵</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
