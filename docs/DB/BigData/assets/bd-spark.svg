<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="392" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Spark：DAG、Stage 与 Shuffle</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">Driver 拆图、Executor 干活，Stage 之间的 Shuffle 决定这个作业要花多少时间与磁盘</text>
  <rect x="30" y="78" width="130" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="95" y="96.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">Driver</text>
  <text x="95" y="113" text-anchor="middle" font-size="7.5" fill="#6D28D9">拆 DAG / 调度 Task</text>
  <text x="95" y="130.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">维护作业状态</text>
  <rect x="180" y="78" width="150" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="255" y="96.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">DAG Scheduler</text>
  <text x="255" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按 Shuffle 边界切 Stage</text>
  <rect x="350" y="78" width="170" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="435" y="96.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">Task Scheduler</text>
  <text x="435" y="113" text-anchor="middle" font-size="7.5" fill="#047857">把 Task 分给 Executor</text>
  <rect x="540" y="78" width="190" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="635" y="96.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">Executor × N</text>
  <text x="635" y="113" text-anchor="middle" font-size="7.5" fill="#0F766E">线程池跑 Task</text>
  <text x="635" y="130.25" text-anchor="middle" font-size="7.5" fill="#0F766E">堆内 + 堆外缓存</text>
  <line x1="160" y1="108" x2="180" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="330" y1="108" x2="350" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="520" y1="108" x2="540" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="168" width="700" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">Shuffle：Stage 之间唯一的重排数据的地方</text>
  <text x="380" y="203" text-anchor="middle" font-size="8" fill="#B45309">Map 侧写「按下游分区排好序」的临时文件 → Reduce 侧拉取 → 也可能落盘</text>
  <text x="380" y="221.4" text-anchor="middle" font-size="8" fill="#B45309">它同时是性能瓶颈与故障放大点：数据倾斜、磁盘打满、拉取失败都发生在这一段</text>
  <line x1="380" y1="138" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="30" y1="248" x2="730" y2="248" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="274" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三种运行形态</text>
  <rect x="30" y="286" width="226" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="143" y="304.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">本地模式 local[*]</text>
  <text x="143" y="321" text-anchor="middle" font-size="7.5" fill="#334155">单 JVM 多线程</text>
  <text x="143" y="338.25" text-anchor="middle" font-size="7.5" fill="#334155">开发调试专用</text>
  <rect x="268" y="286" width="226" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="304.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">Standalone / YARN</text>
  <text x="381" y="321" text-anchor="middle" font-size="7.5" fill="#1D4ED8">集群资源自己或 YARN 管</text>
  <text x="381" y="338.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">长期存量部署常见</text>
  <rect x="506" y="286" width="226" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="619" y="304.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">Kubernetes</text>
  <text x="619" y="321" text-anchor="middle" font-size="7.5" fill="#0F766E">按作业起 Pod</text>
  <text x="619" y="338.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Spark 4 主线形态</text>
  <text x="380" y="374" text-anchor="middle" font-size="10" fill="#B91C1C">调优只做两件事：把 Shuffle 变小（少重排），把倾斜摊平（别让一个 key 扛全部）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
