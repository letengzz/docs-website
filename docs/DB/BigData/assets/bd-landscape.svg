<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="408" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">大数据生态全景：四层组件与四条主线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">没有「一把梭」的大数据栈，只有与数据时效、团队规模、运维预算匹配的那一套</text>
  <rect x="30" y="78" width="166" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="113" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">计算层</text>
  <text x="113" y="113" text-anchor="middle" font-size="7.5" fill="#6D28D9">MapReduce（历史）</text>
  <text x="113" y="130.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">Spark 4.x / 3.5 LTS</text>
  <text x="113" y="147.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">Flink 2.x / 1.20 LTS</text>
  <text x="113" y="164.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">Trino / Presto（交互）</text>
  <rect x="210" y="78" width="166" height="116" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="293" y="96.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">存储层</text>
  <text x="293" y="113" text-anchor="middle" font-size="7.5" fill="#0F766E">HDFS（Hadoop 3.5）</text>
  <text x="293" y="130.25" text-anchor="middle" font-size="7.5" fill="#0F766E">对象存储 S3 / OSS</text>
  <text x="293" y="147.5" text-anchor="middle" font-size="7.5" fill="#0F766E">湖表 Iceberg / Paimon</text>
  <text x="293" y="164.75" text-anchor="middle" font-size="7.5" fill="#0F766E">HBase / Kudu（随机读）</text>
  <rect x="390" y="78" width="166" height="116" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="473" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">SQL 与元数据</text>
  <text x="473" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Hive 4.x（Tez 为主）</text>
  <text x="473" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Hive Metastore（HMS）</text>
  <text x="473" y="147.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Iceberg REST Catalog</text>
  <text x="473" y="164.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Spark SQL / Flink SQL</text>
  <rect x="570" y="78" width="166" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="653" y="96.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">调度与消息</text>
  <text x="653" y="113" text-anchor="middle" font-size="7.5" fill="#B45309">Airflow / DolphinScheduler</text>
  <text x="653" y="130.25" text-anchor="middle" font-size="7.5" fill="#B45309">Kafka（数据总线）</text>
  <text x="653" y="147.5" text-anchor="middle" font-size="7.5" fill="#B45309">Flink CDC（入湖）</text>
  <text x="653" y="164.75" text-anchor="middle" font-size="7.5" fill="#B45309">YARN / K8s（资源）</text>
  <text x="380" y="214" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四层各管一件事：算、存、描述、驱动</text>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四条主线</text>
  <rect x="30" y="256" width="130" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="95" y="272" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">批处理路线</text>
  <rect x="168" y="256" width="562" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="449" y="272" text-anchor="middle" font-size="8.5" fill="#334155">HDFS → Hive/Spark → 结果表 → 报表。要吞吐，容忍小时级延迟</text>
  <rect x="30" y="284" width="130" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="95" y="300" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">流处理路线</text>
  <rect x="168" y="284" width="562" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="449" y="300" text-anchor="middle" font-size="8.5" fill="#334155">binlog → Kafka → Flink → 湖表/OLAP → 看板。要延迟，容忍重算</text>
  <rect x="30" y="312" width="130" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="95" y="328" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">湖仓路线</text>
  <rect x="168" y="312" width="562" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="449" y="328" text-anchor="middle" font-size="8.5" fill="#334155">湖表当唯一存储，批流共用一份数据，靠快照与元数据治一致</text>
  <rect x="30" y="340" width="130" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="95" y="356" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">选型第一判据</text>
  <rect x="168" y="340" width="562" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="449" y="356" text-anchor="middle" font-size="8.5" fill="#334155">先问「下游多久要用到这份数据」，再谈引擎与组件</text>
  <text x="380" y="390" text-anchor="middle" font-size="9.5" fill="#6D28D9">本专题按组件组织；大版本差异集中在「选型与架构决策」页按版本分节呈现</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
