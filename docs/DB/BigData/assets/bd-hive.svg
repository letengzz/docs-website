<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Hive：从 HiveQL 到分布式作业</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">写的是 SQL，跑的是分布式 DAG；性能由分区、分桶、文件格式三件事决定</text>
  <rect x="30" y="78" width="116" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="88" y="96.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">HiveQL</text>
  <text x="88" y="113" text-anchor="middle" font-size="7" fill="#334155">解析 / 校验</text>
  <text x="88" y="129.1" text-anchor="middle" font-size="7" fill="#334155">元数据来自 HMS</text>
  <line x1="146" y1="114" x2="172" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="172" y="78" width="116" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="230" y="96.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">逻辑计划</text>
  <text x="230" y="113" text-anchor="middle" font-size="7" fill="#1D4ED8">优化器改写</text>
  <text x="230" y="129.1" text-anchor="middle" font-size="7" fill="#1D4ED8">分区裁剪</text>
  <line x1="288" y1="114" x2="314" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="78" width="116" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="372" y="96.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">物理计划</text>
  <text x="372" y="113" text-anchor="middle" font-size="7" fill="#6D28D9">决定算子与并发</text>
  <text x="372" y="129.1" text-anchor="middle" font-size="7" fill="#6D28D9">MAPJOIN / 分桶</text>
  <line x1="430" y1="114" x2="456" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="456" y="78" width="116" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="514" y="96.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">Tez / MR 引擎</text>
  <text x="514" y="113" text-anchor="middle" font-size="7" fill="#047857">DAG 执行</text>
  <text x="514" y="129.1" text-anchor="middle" font-size="7" fill="#047857">容器复用</text>
  <line x1="572" y1="114" x2="598" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="598" y="78" width="116" height="72" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="656" y="96.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">HDFS / 湖表</text>
  <text x="656" y="113" text-anchor="middle" font-size="7" fill="#0F766E">ORC / Parquet</text>
  <text x="656" y="129.1" text-anchor="middle" font-size="7" fill="#0F766E">分区目录</text>
  <text x="380" y="172" text-anchor="middle" font-size="10" fill="#6D28D9">Hive 是「SQL → 计划 → 分布式作业」的翻译层，自己不存数据也不管资源</text>
  <text x="60" y="204" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三个决定性能的东西</text>
  <rect x="30" y="216" width="226" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="234.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">分区 Partition</text>
  <text x="143" y="251" text-anchor="middle" font-size="8" fill="#1D4ED8">按业务日期切目录</text>
  <text x="143" y="269.4" text-anchor="middle" font-size="8" fill="#1D4ED8">让优化器能裁剪：只扫需要的分区</text>
  <text x="143" y="287.8" text-anchor="middle" font-size="8" fill="#1D4ED8">过细 = 小文件灾难</text>
  <rect x="268" y="216" width="226" height="90" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="234.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">分桶 Bucket</text>
  <text x="381" y="251" text-anchor="middle" font-size="8" fill="#6D28D9">按哈希切成固定份数</text>
  <text x="381" y="269.4" text-anchor="middle" font-size="8" fill="#6D28D9">让 JOIN 变成桶对桶的 MAPJOIN</text>
  <text x="381" y="287.8" text-anchor="middle" font-size="8" fill="#6D28D9">建表时定死，改要重写</text>
  <rect x="506" y="216" width="226" height="90" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="619" y="234.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">文件格式与压缩</text>
  <text x="619" y="251" text-anchor="middle" font-size="8" fill="#0F766E">列存 ORC / Parquet</text>
  <text x="619" y="269.4" text-anchor="middle" font-size="8" fill="#0F766E">谓词下推 + 列裁剪</text>
  <text x="619" y="287.8" text-anchor="middle" font-size="8" fill="#0F766E">ZSTD 兼顾率与速度</text>
  <text x="380" y="330" text-anchor="middle" font-size="10" fill="#B91C1C">排障顺序：先看扫了多少分区与文件（数据量），再看是否倾斜，最后才调参数</text>
  <text x="380" y="354" text-anchor="middle" font-size="9.5" fill="#64748B">Hive 4 起默认执行引擎是 Tez，Hive on Spark 已移除；3.x 已停止维护</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
