<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="362" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Flink：时间语义、状态与端到端一致性</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先定「按什么时间算」，再定「状态存哪」，最后才谈「结果怎么保证不重不丢」</text>
  <rect x="30" y="78" width="226" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="96.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">时间语义 Time Semantics</text>
  <text x="143" y="113" text-anchor="middle" font-size="8" fill="#1D4ED8">事件时间 / 处理时间 / 摄入时间</text>
  <text x="143" y="131.4" text-anchor="middle" font-size="8" fill="#1D4ED8">以事件时间为准才算得对</text>
  <text x="143" y="149.8" text-anchor="middle" font-size="8" fill="#1D4ED8">代价：结果要等水位线</text>
  <rect x="267" y="78" width="226" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">水位线 Watermark</text>
  <text x="380" y="113" text-anchor="middle" font-size="8" fill="#6D28D9">「不会再有更早的数据了」</text>
  <text x="380" y="131.4" text-anchor="middle" font-size="8" fill="#6D28D9">驱动窗口触发与迟到判定</text>
  <text x="380" y="149.8" text-anchor="middle" font-size="8" fill="#6D28D9">允许迟到 + 侧输出兜底</text>
  <rect x="504" y="78" width="226" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="617" y="96.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">状态 State</text>
  <text x="617" y="113" text-anchor="middle" font-size="8" fill="#0F766E">Keyed State / Operator State</text>
  <text x="617" y="131.4" text-anchor="middle" font-size="8" fill="#0F766E">状态后端：内存 / RocksDB</text>
  <text x="617" y="149.8" text-anchor="middle" font-size="8" fill="#0F766E">决定容量与恢复时间</text>
  <rect x="30" y="176" width="354" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="207" y="194.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">检查点 Checkpoint（一致性快照）</text>
  <text x="207" y="211" text-anchor="middle" font-size="8" fill="#047857">按间隔把「状态 + 位点」切成一致快照</text>
  <text x="207" y="229.4" text-anchor="middle" font-size="8" fill="#047857">对齐 + 屏障：Exactly-Once 的来源</text>
  <text x="207" y="247.8" text-anchor="middle" font-size="8" fill="#047857">恢复点 / 保存点：savepoint 可改并发度</text>
  <rect x="396" y="176" width="334" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="563" y="194.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">两阶段提交 TwoPhaseCommit（写出）</text>
  <text x="563" y="211" text-anchor="middle" font-size="8" fill="#B45309">预提交写外部系统 → 检查点完成才提交</text>
  <text x="563" y="229.4" text-anchor="middle" font-size="8" fill="#B45309">窗口/文件滚动与提交绑定在一起</text>
  <text x="563" y="247.8" text-anchor="middle" font-size="8" fill="#B45309">前提：Sink 必须支持事务或幂等</text>
  <text x="380" y="296" text-anchor="middle" font-size="10" fill="#B91C1C">一条判据：能不能保证「不重不丢」，看它的 Sink 支不支持两阶段提交</text>
  <text x="380" y="320" text-anchor="middle" font-size="9.5" fill="#64748B">反面：一边要求 Exactly-Once，一边把结果写进不支持事务的下游</text>
  <text x="380" y="344" text-anchor="middle" font-size="9.5" fill="#6D28D9">Flink 2.x 把「状态与检查点」做成了主线；1.20 是 1.x 最后维护线</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
