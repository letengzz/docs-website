<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">时序数据模型：一行 = 时间戳 + 标签集 + 指标值集</text>
  <!-- 数据行示意 -->
  <g font-size="12">
    <rect x="30" y="50" width="700" height="34" rx="4" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="44" y="72" fill="#1E3A8A" font-weight="bold">time（时间戳）</text>
    <text x="210" y="72" fill="#1E3A8A" font-weight="bold">tags（标签：索引维度）</text>
    <text x="500" y="72" fill="#1E3A8A" font-weight="bold">fields（字段：真实值）</text>

    <rect x="30" y="88" width="700" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="44" y="108" fill="#334155">2026-09-14T10:00:00Z</text>
    <text x="210" y="108" fill="#334155">host=srv-01, region=cn-east</text>
    <text x="500" y="108" fill="#334155">cpu=42.5, mem=61.2</text>

    <rect x="30" y="122" width="700" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="44" y="142" fill="#334155">2026-09-14T10:00:01Z</text>
    <text x="210" y="142" fill="#334155">host=srv-01, region=cn-east</text>
    <text x="500" y="142" fill="#334155">cpu=43.1, mem=61.4</text>

    <rect x="30" y="156" width="700" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="44" y="176" fill="#334155">2026-09-14T10:00:01Z</text>
    <text x="210" y="176" fill="#334155">host=srv-02, region=cn-north</text>
    <text x="500" y="176" fill="#334155">cpu=18.7, mem=47.9</text>
  </g>
  <!-- 概念对应 -->
  <g font-size="12">
    <rect x="30" y="206" width="220" height="112" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="140" y="230" text-anchor="middle" fill="#065F46" font-weight="bold">Measurement / 超级表</text>
    <text x="46" y="254" fill="#334155">一类指标的逻辑容器</text>
    <text x="46" y="276" fill="#334155">相当于「表」</text>
    <text x="46" y="298" fill="#64748B">cpu_usage / Weather</text>

    <rect x="270" y="206" width="220" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="380" y="230" text-anchor="middle" fill="#9A3412" font-weight="bold">Tag / 标签列</text>
    <text x="286" y="254" fill="#334155">只有有限取值、用于过滤与分组</text>
    <text x="286" y="276" fill="#334155">会建索引（高基数需警惕）</text>
    <text x="286" y="298" fill="#64748B">host / region / device_id</text>

    <rect x="510" y="206" width="220" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="620" y="230" text-anchor="middle" fill="#1E3A8A" font-weight="bold">Field / 指标列</text>
    <text x="526" y="254" fill="#334155">随时间变化的真实测量值</text>
    <text x="526" y="276" fill="#334155">被压缩存储、可做聚合</text>
    <text x="526" y="298" fill="#64748B">cpu / mem / temperature</text>
  </g>
</svg>
