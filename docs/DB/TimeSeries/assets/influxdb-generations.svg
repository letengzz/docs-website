<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">InfluxDB 三代演进：引擎换了两次，查询语言回归 SQL</text>
  <defs>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker>
  </defs>
  <g font-size="12">
    <rect x="24" y="56" width="220" height="180" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="134" y="82" text-anchor="middle" font-size="13" fill="#9A3412" font-weight="bold">InfluxDB 1.x（2016）</text>
    <text x="40" y="108" fill="#334155">引擎：TSM（自研 LSM 变体）</text>
    <text x="40" y="130" fill="#334155">语言：InfluxQL（类 SQL）</text>
    <text x="40" y="152" fill="#334155">生态：Telegraf + Chronograf</text>
    <text x="40" y="174" fill="#334155">　　　+ Kapacitor（TICK 全家桶）</text>
    <text x="40" y="200" fill="#64748B">状态：仍在维护（1.13.x），</text>
    <text x="40" y="220" fill="#64748B">大量存量、仅建议存量使用</text>

    <rect x="270" y="56" width="220" height="180" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2"/>
    <text x="380" y="82" text-anchor="middle" font-size="13" fill="#713F12" font-weight="bold">InfluxDB 2.x（2020）</text>
    <text x="286" y="108" fill="#334155">引擎：TSM 演进版</text>
    <text x="286" y="130" fill="#334155">语言：Flux（函数式管道）</text>
    <text x="286" y="152" fill="#334155">形态：单二进制 + 内置 UI</text>
    <text x="286" y="174" fill="#334155">任务调度、通知规则一体化</text>
    <text x="286" y="200" fill="#64748B">状态：仍在支持（2.9.x），</text>
    <text x="286" y="220" fill="#64748B">Flux 学习成本高、与 SQL 割裂</text>

    <rect x="516" y="56" width="220" height="180" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="626" y="82" text-anchor="middle" font-size="13" fill="#1E3A8A" font-weight="bold">InfluxDB 3（2025~）</text>
    <text x="532" y="108" fill="#334155">引擎：IOx（Rust 重写）</text>
    <text x="532" y="130" fill="#334155">栈：Arrow / DataFusion /</text>
    <text x="532" y="150" fill="#334155">　　　Parquet / Flight</text>
    <text x="532" y="172" fill="#334155">语言：SQL 为主 + 兼容 InfluxQL</text>
    <text x="532" y="198" fill="#64748B">Core 开源单机 / Enterprise 商业</text>
    <text x="532" y="220" fill="#64748B">当前主线，最新 3.11（2026-07）</text>
  </g>
  <g stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrT)">
    <line x1="248" y1="146" x2="266" y2="146"/>
    <line x1="494" y1="146" x2="512" y2="146"/>
  </g>
  <g>
    <rect x="24" y="256" width="712" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="44" y="282" font-size="13" fill="#0F172A" font-weight="bold">选型结论：</text>
    <text x="44" y="306" font-size="12" fill="#334155">新项目直接用 InfluxDB 3（Core 开源版做近端高速写入，Enterprise 做长历史与集群）；存量 1.x/2.x 可按兼容写入端点迁移，迁移前先确认 Flux 任务与 Kapacitor 告警的替代方案。</text>
    <text x="44" y="330" font-size="12" fill="#64748B">注意：InfluxDB 3 Core 不是 1.x/2.x 的"升级版直替"，是新的产品形态（无内置 Flux、无集群）。</text>
  </g>
</svg>
