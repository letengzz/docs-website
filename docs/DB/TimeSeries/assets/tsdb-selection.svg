<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">时序库选型决策树</text>
  <g font-size="12">
    <rect x="290" y="46" width="180" height="40" rx="8" fill="#2563EB"/>
    <text x="380" y="71" text-anchor="middle" fill="#FFFFFF" font-weight="bold">数据是「时间 + 标签 + 数值」？</text>
    <rect x="290" y="110" width="180" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="380" y="135" text-anchor="middle" fill="#475569">否 → 用关系型 / 文档库</text>

    <rect x="60" y="180" width="200" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="160" y="204" text-anchor="middle" fill="#1E3A8A" font-weight="bold">指标监控 / IT 运维</text>
    <text x="74" y="228" fill="#334155">Prometheus + 远程存储，或 InfluxDB</text>
    <text x="74" y="250" fill="#64748B">生态：Grafana / Telegraf 成熟</text>

    <rect x="280" y="180" width="200" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="380" y="204" text-anchor="middle" fill="#065F46" font-weight="bold">物联网 / 工业设备</text>
    <text x="294" y="228" fill="#334155">TDengine（国产、超表模型、</text>
    <text x="294" y="250" fill="#334155">单机吞吐高、有企业版支持）</text>

    <rect x="500" y="180" width="200" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="600" y="204" text-anchor="middle" fill="#9A3412" font-weight="bold">大规模分析 / 云原生</text>
    <text x="514" y="228" fill="#334155">InfluxDB 3（Parquet + SQL，</text>
    <text x="514" y="250" fill="#334155">对象存储友好）或 ClickHouse</text>
  </g>
  <g stroke="#94A3B8" stroke-width="1.6" fill="none">
    <line x1="380" y1="86" x2="380" y2="106"/>
    <line x1="330" y1="130" x2="180" y2="176"/>
    <line x1="380" y1="150" x2="380" y2="176"/>
    <line x1="430" y1="130" x2="580" y2="176"/>
  </g>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#64748B">先按场景选，再按「团队熟悉度 + 社区生态 + 商业支持」收敛到一个候选，最后用真实数据压测验证</text>
</svg>
