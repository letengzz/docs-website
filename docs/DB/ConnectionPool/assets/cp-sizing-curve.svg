<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system,Segoe UI,Noto Sans CJK SC,sans-serif">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937">池大小与吞吐：实测曲线上的那个「膝点」</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<line x1="90" y1="400" x2="880" y2="400" stroke="#4b5563" stroke-width="1.5"/>
<line x1="90" y1="400" x2="90" y2="90" stroke="#4b5563" stroke-width="1.5"/>
<text x="886" y="434" font-size="12.5" fill="#4b5563" text-anchor="end" font-weight="400">并发连接数</text>
<text x="96" y="84" font-size="12.5" fill="#4b5563" text-anchor="start" font-weight="400">TPS</text>
<polyline points="174.0,232.5 258.0,150.7 426.0,158.5 762.0,188.4" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="174.0" cy="232.5" r="5" fill="#1d4ed8"/>
<text x="174.0" y="218.49777777777777" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">2,692</text>
<text x="174.0" y="424" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400">c=8</text>
<circle cx="258.0" cy="150.7" r="5" fill="#1d4ed8"/>
<text x="258.0" y="136.67555555555555" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">4,007</text>
<text x="258.0" y="424" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400">c=16</text>
<circle cx="426.0" cy="158.5" r="5" fill="#1d4ed8"/>
<text x="426.0" y="144.51555555555555" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">3,881</text>
<text x="426.0" y="424" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400">c=32</text>
<circle cx="762.0" cy="188.4" r="5" fill="#1d4ed8"/>
<text x="762.0" y="174.44444444444446" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">3,400</text>
<text x="762.0" y="424" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400">c=64</text>
<line x1="258.0" y1="150.7" x2="258.0" y2="400" stroke="#047857" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="268.0" y="330" font-size="12.5" fill="#047857" text-anchor="start" font-weight="700">膝点：4,007 TPS / 3.99 ms</text>
<text x="268.0" y="352" font-size="11.5" fill="#047857" text-anchor="start" font-weight="400">再往上加连接，吞吐不再涨</text>
<text x="420.0" y="250" font-size="12" fill="#b45309" text-anchor="start" font-weight="400">翻倍并发：吞吐 −3.2%、延迟 +106%</text>
<text x="762.0" y="300" font-size="12" fill="#b91c1c" text-anchor="end" font-weight="400">c=64：吞吐 −15.2%、延迟 +371%</text>
<text x="90" y="462" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="400">同一批机器、同一个 pgbench 脚本（-T 10s、-j 8），唯一变量是并发连接数 c。</text>
<text x="90" y="486" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">结论：池不是越大越好——过了膝点，多出来的连接既不增加吞吐，又按「每连接 1.4 MiB」线性吃内存，还按「每连接一个进程」吃调度。</text>
</svg>
