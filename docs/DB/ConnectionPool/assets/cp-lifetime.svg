<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system,Segoe UI,Noto Sans CJK SC,sans-serif">
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937">连接生命周期：五个阀门谁先关</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<line x1="60" y1="250" x2="900" y2="250" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="120" cy="250" r="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="120" y="226" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">建立</text>
<text x="120" y="278" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">TCP + 认证</text>
<text x="120" y="295" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">2.1~4.2 ms</text>
<circle cx="300" cy="250" r="9" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
<text x="300" y="226" font-size="13.5" fill="#047857" text-anchor="middle" font-weight="700">活跃</text>
<text x="300" y="278" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">借出中</text>
<text x="300" y="295" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">持有时长计时</text>
<circle cx="480" cy="250" r="9" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="480" y="226" font-size="13.5" fill="#b45309" text-anchor="middle" font-weight="700">空闲</text>
<text x="480" y="278" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">idleTimeout</text>
<text x="480" y="295" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">默认 10 min</text>
<circle cx="660" cy="250" r="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="660" y="226" font-size="13.5" fill="#b91c1c" text-anchor="middle" font-weight="700">达龄</text>
<text x="660" y="278" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">maxLifetime</text>
<text x="660" y="295" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">默认 30 min</text>
<circle cx="840" cy="250" r="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.5"/>
<text x="840" y="226" font-size="13.5" fill="#4b5563" text-anchor="middle" font-weight="700">被回收</text>
<text x="840" y="278" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="400">建连次数 +1</text>
<rect x="40" y="60" width="420" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="250.0" y="84" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">服务端一侧还有两个阀门</text>
<text x="250.0" y="104" font-size="12" fill="#4b5563" text-anchor="middle">wait_timeout（MySQL 默认 28,800 s）</text>
<text x="250.0" y="121" font-size="12" fill="#4b5563" text-anchor="middle">idle_in_transaction_session_timeout（PG）</text>
<rect x="500" y="60" width="420" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="710.0" y="84" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">本仓踩过的坑：谁先关决定报什么错</text>
<text x="710.0" y="104" font-size="11.5" fill="#4b5563" text-anchor="middle">服务端先关 → 复用时拿到已死连接，首个请求失败</text>
<text x="710.0" y="121" font-size="11.5" fill="#4b5563" text-anchor="middle">池先关 → 平滑换命，只是建连次数上升</text>
<rect x="40" y="350" width="880" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="480.0" y="374" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">判据：池的 maxLifetime 必须 &lt; 服务端 wait_timeout − 余量（建议 ≥ 120 s）；缺这一条，空闲后首个请求就是偶发 500</text>
<text x="40" y="444" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="400">注：HikariCP 的 keepaliveTime 自 6.2.1 起默认 2 分钟（此前默认关闭），用于在空闲期主动探活；它救不了「服务端已经单方面关掉」的连接，只降低概率。</text>
</svg>
