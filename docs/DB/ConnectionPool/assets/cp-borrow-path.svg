<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system,Segoe UI,Noto Sans CJK SC,sans-serif">
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2937">一次借用的完整路径：从 getConnection() 到归还</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="30" y="80" width="170" height="86" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="115.0" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">业务线程</text>
<text x="115.0" y="124" font-size="12" fill="#4b5563" text-anchor="middle">getConnection()</text>
<text x="115.0" y="141" font-size="12" fill="#4b5563" text-anchor="middle">用连接执行 SQL</text>
<text x="115.0" y="158" font-size="12" fill="#4b5563" text-anchor="middle">close() 归还</text>
<rect x="240" y="80" width="200" height="86" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="340.0" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">池（本地对象）</text>
<text x="340.0" y="124" font-size="12" fill="#4b5563" text-anchor="middle">空闲队列 poll</text>
<text x="340.0" y="141" font-size="12" fill="#4b5563" text-anchor="middle">借出时长计时开始</text>
<text x="340.0" y="158" font-size="12" fill="#4b5563" text-anchor="middle">归还时 reset + 校验</text>
<rect x="480" y="80" width="190" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="575.0" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">校验三问</text>
<text x="575.0" y="124" font-size="12" fill="#4b5563" text-anchor="middle">连接是否 closed</text>
<text x="575.0" y="141" font-size="12" fill="#4b5563" text-anchor="middle">是否超过 maxLifetime</text>
<text x="575.0" y="158" font-size="12" fill="#4b5563" text-anchor="middle">网络是否还活着</text>
<rect x="710" y="80" width="220" height="86" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="820.0" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">服务端 backend</text>
<text x="820.0" y="124" font-size="12" fill="#4b5563" text-anchor="middle">每连接一个进程</text>
<text x="820.0" y="141" font-size="12" fill="#4b5563" text-anchor="middle">私有内存 ~1.4 MiB</text>
<text x="820.0" y="158" font-size="12" fill="#4b5563" text-anchor="middle">槽位受 max_connections 约束</text>
<line x1="200" y1="123" x2="240" y2="123" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="220.0" y="116.0" font-size="12" fill="#1d4ed8" text-anchor="middle">借</text>
<line x1="440" y1="123" x2="480" y2="123" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="460.0" y="116.0" font-size="12" fill="#1d4ed8" text-anchor="middle">验</text>
<line x1="670" y1="123" x2="710" y2="123" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="690.0" y="116.0" font-size="12" fill="#1d4ed8" text-anchor="middle">发</text>
<rect x="240" y="220" width="200" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="340.0" y="244" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">等待队列（有界）</text>
<text x="340.0" y="264" font-size="12" fill="#4b5563" text-anchor="middle">connectionTimeout=30s</text>
<text x="340.0" y="281" font-size="12" fill="#4b5563" text-anchor="middle">超时抛 SQLTransient</text>
<text x="340.0" y="298" font-size="12" fill="#4b5563" text-anchor="middle">队头优先 = 公平性</text>
<line x1="119" y1="166" x2="300" y2="220" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="200" y="200" font-size="12" fill="#1d4ed8" text-anchor="middle">池已满 → 排队</text>
<line x1="330" y1="220" x2="330" y2="172" stroke="#047857" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="392" y="200" font-size="12" fill="#047857" text-anchor="middle">有归还 → 唤醒</text>
<rect x="620" y="220" width="300" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="770.0" y="244" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">归还时最容易漏的三件事</text>
<text x="770.0" y="264" font-size="11.5" fill="#4b5563" text-anchor="middle">① 会话状态未清理（SET/临时表/游标）</text>
<text x="770.0" y="281" font-size="11.5" fill="#4b5563" text-anchor="middle">② 事务未结束（autocommit=false）</text>
<text x="770.0" y="298" font-size="11.5" fill="#4b5563" text-anchor="middle">③ 归还的不是借出的那个物理连接</text>
<line x1="760" y1="166" x2="760" y2="220" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="760.0" y="186.0" font-size="12" fill="#b91c1c" text-anchor="middle">close()</text>
<rect x="30" y="360" width="900" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="384" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">四条必测读数</text>
<text x="480.0" y="404" font-size="12" fill="#4b5563" text-anchor="middle">① 借出等待 P99（不是平均）② 借出到归还的持有时长分布 ③ 空闲连接数随时间的锯齿 ④ 建连次数 / 分钟（突增 = 池在漏或在换命）</text>
<text x="30" y="462" font-size="11.5" fill="#4b5563" text-anchor="start" font-weight="400">注：图中「服务端 backend」一行是 PostgreSQL 口径；MySQL 是「每连接一个线程 + 会话内存」，数量级相同、量级差异见第 1 章表格。</text>
</svg>
