<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15.5" fill="#0F172A" font-weight="bold">四档存储：判定维度与相对成本</text>
  <text x="380" y="48" text-anchor="middle" font-size="10.2" fill="#64748B">分层的第一性原理是「缩小热层」，不是「把冷层做得更便宜」</text>

  <g>
    <rect x="24" y="70" width="170" height="120" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="109" y="92" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">热</text>
    <text x="109" y="112" text-anchor="middle" font-size="7.8" fill="#B91C1C">近 30~90 天</text>
    <text x="109" y="130" text-anchor="middle" font-size="7.8" fill="#B91C1C">NVMe / 内存缓存</text>
    <text x="109" y="148" text-anchor="middle" font-size="7.8" fill="#B91C1C">0.1 ~ 1 ms</text>
    <text x="109" y="170" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">1.0×</text>

    <rect x="208" y="70" width="170" height="120" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
    <text x="293" y="92" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="bold">温</text>
    <text x="293" y="112" text-anchor="middle" font-size="7.8" fill="#B45309">90 天 ~ 1 年</text>
    <text x="293" y="130" text-anchor="middle" font-size="7.8" fill="#B45309">SSD / 普通云盘</text>
    <text x="293" y="148" text-anchor="middle" font-size="7.8" fill="#B45309">1 ~ 10 ms</text>
    <text x="293" y="170" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">0.3 ~ 0.6×</text>

    <rect x="392" y="70" width="170" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="477" y="92" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">冷</text>
    <text x="477" y="112" text-anchor="middle" font-size="7.8" fill="#1D4ED8">1 ~ 3 年</text>
    <text x="477" y="130" text-anchor="middle" font-size="7.8" fill="#1D4ED8">大容量 HDD / 低频盘</text>
    <text x="477" y="148" text-anchor="middle" font-size="7.8" fill="#1D4ED8">10 ~ 100 ms</text>
    <text x="477" y="170" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">0.1 ~ 0.2×</text>

    <rect x="576" y="70" width="160" height="120" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
    <text x="656" y="92" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">冰</text>
    <text x="656" y="112" text-anchor="middle" font-size="7.8" fill="#334155">3 年以上</text>
    <text x="656" y="130" text-anchor="middle" font-size="7.8" fill="#334155">对象存储 / 归档型</text>
    <text x="656" y="148" text-anchor="middle" font-size="7.8" fill="#334155">100 ms ~ 分钟级取回</text>
    <text x="656" y="170" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">0.01 ~ 0.05×</text>
  </g>

  <rect x="24" y="206" width="712" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="40" y="226" font-size="9.5" fill="#115E59" font-weight="bold">做法 A：SET TABLESPACE（本机实测）</text>
  <text x="40" y="246" font-size="7.8" fill="#0F766E">11 MB 分区搬迁 247.993 ms ｜ 路径 base/17628/17757 → pg_tblspc/20747/PG_18_/17628/20748 ｜ 搬完查询 16.280 ms ｜ SQL 改动：0 行</text>
  <text x="40" y="262" font-size="7.8" fill="#B45309">只锁这一个分区；但仍共享 shared_buffers、WAL 与备份窗口 —— 解决「贵盘占用」，不解决「备份体积」</text>

  <rect x="24" y="282" width="348" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="40" y="302" font-size="9.3" fill="#1E293B" font-weight="bold">做法 B：外部表 / Parquet</text>
  <text x="40" y="320" font-size="7.6" fill="#334155">单价再降一个数量级，备份变快</text>
  <text x="40" y="336" font-size="7.6" fill="#B91C1C">代价：换查询入口 + 维护文件映射</text>

  <rect x="388" y="282" width="348" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="404" y="302" font-size="9.3" fill="#1E293B" font-weight="bold">做法 C：双写 + 应用层路由</text>
  <text x="404" y="320" font-size="7.6" fill="#334155">可按租户精细路由，冷库可换引擎</text>
  <text x="404" y="336" font-size="7.6" fill="#B91C1C">代价：永久的一致性维护负担</text>

  <text x="24" y="382" font-size="8.6" fill="#475569">选择顺序不能反：</text>
  <text x="122" y="382" font-size="8.6" fill="#065F46" font-weight="bold">先 A（零 SQL 改动、当天可上线）→ 体积影响备份时再 B → 冷数据要被另一类查询使用时才 C。</text>
</svg>
