<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分区分表与冷热分离：九个页面，一条时间轴</text>
  <text x="380" y="52" text-anchor="middle" font-size="10.5" fill="#64748B">主线：热数据留在小表里 → 分区让「删」变成「摘」 → 冷数据搬到便宜盘 → 过期有据可查</text>

  <rect x="24" y="76" width="164" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="106" y="96" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 总览</text>
  <text x="106" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">四层结构 / 五个必失点</text>
  <text x="106" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先问「删得掉吗」</text>

  <rect x="204" y="76" width="164" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="286" y="96" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 分区策略</text>
  <text x="286" y="113" text-anchor="middle" font-size="7.5" fill="#4338CA">RANGE / LIST / HASH</text>
  <text x="286" y="129" text-anchor="middle" font-size="7.5" fill="#4338CA">分区键与粒度</text>

  <rect x="384" y="76" width="164" height="72" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="466" y="96" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 分区维护</text>
  <text x="466" y="113" text-anchor="middle" font-size="7.5" fill="#0F766E">ATTACH / DETACH</text>
  <text x="466" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">默认分区与身份列</text>

  <rect x="564" y="76" width="172" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="650" y="96" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">④ 跨分区查询</text>
  <text x="650" y="113" text-anchor="middle" font-size="7.5" fill="#B91C1C">裁剪失效的四种写法</text>
  <text x="650" y="129" text-anchor="middle" font-size="7.5" fill="#B91C1C">全局唯一做不到</text>

  <rect x="24" y="184" width="222" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="135" y="204" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 冷热分层</text>
  <text x="135" y="221" text-anchor="middle" font-size="7.5" fill="#B45309">热 / 温 / 冷 / 冰 四档</text>
  <text x="135" y="237" text-anchor="middle" font-size="7.5" fill="#B45309">表空间、对象存储、访问代理</text>
  <text x="135" y="253" text-anchor="middle" font-size="7.5" fill="#B45309">成本按 GB·月 摊开算</text>

  <rect x="270" y="184" width="222" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="204" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">⑥ 在线归档</text>
  <text x="381" y="221" text-anchor="middle" font-size="7.5" fill="#6D28D9">冻结边界 → 搬运 → 校验 → 摘除</text>
  <text x="381" y="237" text-anchor="middle" font-size="7.5" fill="#6D28D9">双向差集与可回滚</text>
  <text x="381" y="253" text-anchor="middle" font-size="7.5" fill="#6D28D9">不带 CHECK 的回挂慢 6 倍</text>

  <rect x="516" y="184" width="220" height="86" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="626" y="204" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">⑦ 保留与合规删除</text>
  <text x="626" y="221" text-anchor="middle" font-size="7.5" fill="#334155">TTL / 保留矩阵 / 法定留存</text>
  <text x="626" y="237" text-anchor="middle" font-size="7.5" fill="#334155">删除要能证明删干净</text>
  <text x="626" y="253" text-anchor="middle" font-size="7.5" fill="#334155">备份里的那份怎么办</text>

  <rect x="24" y="308" width="342" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="195" y="328" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">⑧ 实战：审计日志的 13 个月</text>
  <text x="195" y="345" text-anchor="middle" font-size="7.5" fill="#047857">完整 DDL + 四条约束 + 分区模板</text>
  <text x="195" y="361" text-anchor="middle" font-size="7.5" fill="#047857">S1~S10 验收序列，全部本机可跑</text>

  <rect x="394" y="308" width="342" height="76" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="565" y="328" text-anchor="middle" font-size="10" fill="#831843" font-weight="bold">⑨ 常见问题与分诊</text>
  <text x="565" y="345" text-anchor="middle" font-size="7.5" fill="#9D174D">八类症状分诊表 / 十二问</text>
  <text x="565" y="361" text-anchor="middle" font-size="7.5" fill="#9D174D">十二项上线自查 + 术语表</text>

  <line x1="24" y1="416" x2="736" y2="416" stroke="#E2E8F0" stroke-width="1.4"/>
  <text x="24" y="438" font-size="9" fill="#475569">一条判据贯穿全篇：</text>
  <text x="150" y="438" font-size="9" fill="#B91C1C" font-weight="bold">任何「删数据」的方案，都必须先回答「摘下来之后，那一天的数据还在不在别处」。</text>
</svg>
