<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#ffffff"/>
  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1e293b">提示词安全与评估 · 专题地图</text>
  <text x="24" y="62" font-size="12" fill="#64748b">核心页 6 篇 + 实战 1 篇 + FAQ 1 篇：攻击面 → 注入 → 防护 → 越狱 → 红队 → 评估集 → 门禁</text>

  <!-- 第一行：认知 -->
  <g font-family="sans-serif">
    <rect x="24" y="84" width="196" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="122" y="112" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">攻击面全景与 OWASP</text>
    <text x="122" y="132" font-size="11" fill="#6b21a8" text-anchor="middle">Overview · 先读</text>

    <rect x="244" y="84" width="196" height="64" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="342" y="112" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">提示注入深入</text>
    <text x="342" y="132" font-size="11" fill="#b91c1c" text-anchor="middle">Injection · 直接 / 间接 / 多级</text>

    <rect x="464" y="84" width="196" height="64" rx="10" fill="#fffbeb" stroke="#d97706"/>
    <text x="562" y="112" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">越狱与对抗</text>
    <text x="562" y="132" font-size="11" fill="#b45309" text-anchor="middle">Jailbreak · 手法分类与防守</text>

    <path d="M220 116 H244 M440 116 H464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 第二行：防线与验证 -->
    <rect x="24" y="180" width="196" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="122" y="208" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">防护工程</text>
    <text x="122" y="228" font-size="11" fill="#166534" text-anchor="middle">Defense · 纵深防御五层</text>

    <rect x="244" y="180" width="196" height="64" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="342" y="208" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">红队测试</text>
    <text x="342" y="228" font-size="11" fill="#1d4ed8" text-anchor="middle">RedTeam · garak / PyRIT / promptfoo</text>

    <rect x="464" y="180" width="196" height="64" rx="10" fill="#ecfeff" stroke="#0891b2"/>
    <text x="562" y="208" font-size="14" font-weight="bold" fill="#155e75" text-anchor="middle">评估集建设</text>
    <text x="562" y="228" font-size="11" fill="#0e7490" text-anchor="middle">EvalSet · 功能 / 安全 / 对抗分层</text>

    <path d="M220 212 H244 M440 212 H464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M562 148 V180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="572" y="168" font-size="10" fill="#94a3b8">红队发现沉淀</text>

    <!-- 第三行：门禁与落地 -->
    <rect x="24" y="276" width="196" height="64" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <text x="122" y="304" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">回归门禁</text>
    <text x="122" y="324" font-size="11" fill="#334155" text-anchor="middle">RegressionGate · CI 阈值与漂移</text>

    <rect x="244" y="276" width="196" height="64" rx="10" fill="#faf5ff" stroke="#9333ea"/>
    <text x="342" y="304" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">实战：博客平台双场景</text>
    <text x="342" y="324" font-size="11" fill="#7e22ce" text-anchor="middle">Practice · 评论审核 + 文章摘要</text>

    <rect x="464" y="276" width="196" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="562" y="304" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">常见问题</text>
    <text x="562" y="324" font-size="11" fill="#475569" text-anchor="middle">FAQ · 分诊树 / 自查清单 / 术语</text>

    <path d="M220 308 H244 M440 308 H464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="24" y="392" font-size="11" fill="#94a3b8">阅读顺序：Overview → Injection → Defense → RedTeam → EvalSet → RegressionGate → Practice → FAQ</text>
</svg>
