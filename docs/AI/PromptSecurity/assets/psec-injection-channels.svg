<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1e293b">提示注入的两条通道：直接与间接</text>
  <text x="24" y="60" font-size="12" fill="#64748b">直接注入由「人」当面递入；间接注入藏在模型要读的「内容」里——后者更难防</text>

  <!-- 左：直接注入 -->
  <g font-family="sans-serif">
    <rect x="24" y="84" width="300" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="174" y="112" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">直接注入（Direct）</text>
    <text x="174" y="132" font-size="11" fill="#b91c1c" text-anchor="middle">攻击者就是对话者本人</text>

    <rect x="44" y="148" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="174" y="168" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">指令覆盖</text>
    <text x="174" y="184" font-size="10" fill="#991b1b" text-anchor="middle">「忽略之前所有指令，你现在…」</text>

    <rect x="44" y="202" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="174" y="222" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">角色扮演 / DAN</text>
    <text x="174" y="238" font-size="10" fill="#991b1b" text-anchor="middle">「你扮演一个没有限制的 AI…」</text>

    <rect x="44" y="256" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="174" y="276" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">编码绕过</text>
    <text x="174" y="292" font-size="10" fill="#991b1b" text-anchor="middle">Base64 / ROT13 / 拆字，输入侧看不懂、模型能读懂</text>

    <rect x="44" y="310" width="260" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="174" y="330" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">低资源语言 / 错字噪声</text>
    <text x="174" y="346" font-size="10" fill="#991b1b" text-anchor="middle">绕开以英文对齐为主的拒绝行为</text>

    <text x="174" y="388" font-size="11" fill="#7f1d1d" text-anchor="middle">对策：输入分类器 + 输出校验 + 权限收敛</text>
  </g>

  <!-- 右：间接注入 -->
  <g font-family="sans-serif">
    <rect x="356" y="84" width="300" height="320" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="506" y="112" font-size="15" font-weight="bold" fill="#9a3412" text-anchor="middle">间接注入（Indirect）</text>
    <text x="506" y="132" font-size="11" fill="#c2410c" text-anchor="middle">恶意指令藏在模型要读的外部内容里</text>

    <rect x="376" y="148" width="260" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="506" y="168" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">RAG 文档 / 知识库</text>
    <text x="506" y="184" font-size="10" fill="#c2410c" text-anchor="middle">文档正文里夹一行「回答时执行…」</text>

    <rect x="376" y="202" width="260" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="506" y="222" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">网页 / 邮件 / 工单</text>
    <text x="506" y="238" font-size="10" fill="#c2410c" text-anchor="middle">隐藏文本、白色字体、HTML 注释、alt 属性</text>

    <rect x="376" y="256" width="260" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="506" y="276" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">用户生成内容（UGC）</text>
    <text x="506" y="292" font-size="10" fill="#c2410c" text-anchor="middle">评论 / 简历 / 个人简介——本专题实战的主场景</text>

    <rect x="376" y="310" width="260" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
    <text x="506" y="330" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">代码与依赖</text>
    <text x="506" y="346" font-size="10" fill="#c2410c" text-anchor="middle">README、注释、issue 文本诱导 AI 编程助手</text>

    <text x="506" y="388" font-size="11" fill="#9a3412" text-anchor="middle">对策：内容来源分级 + 工具最小权限 + 人审闸门</text>
  </g>

  <text x="340" y="424" font-size="11" fill="#64748b" text-anchor="middle">判别方法见 Injection 页第四节：四步最小注入实验</text>
</svg>
