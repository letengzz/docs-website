<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1e293b">纵深防御五层：每一层挡什么、挡不住什么</text>
  <text x="24" y="60" font-size="12" fill="#64748b">任何一层都可能被绕过，安全来自五层叠加，而不是任何一层「足够强」</text>

  <g font-family="sans-serif">
    <!-- 层 1 模型层 -->
    <rect x="40" y="84" width="600" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="64" y="108" font-size="13.5" font-weight="bold" fill="#4c1d95">⑤ 模型层</text>
    <text x="64" y="126" font-size="10.5" fill="#6b21a8">对齐训练 + 供应商内置审核（omni-moderation 等）</text>
    <text x="640" y="108" font-size="10" fill="#7e22ce" text-anchor="end">挡：常见越狱</text>
    <text x="640" y="126" font-size="10" fill="#9f1239" text-anchor="end">挡不住：自适应对抗</text>

    <!-- 层 2 分类器层 -->
    <rect x="40" y="152" width="600" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="64" y="176" font-size="13.5" font-weight="bold" fill="#1e3a8a">④ 分类器层</text>
    <text x="64" y="194" font-size="10.5" fill="#1d4ed8">Llama Guard 4 / Prompt Guard 2 / 自训小模型：输入、输出双侧筛查</text>
    <text x="640" y="176" font-size="10" fill="#1d4ed8" text-anchor="end">挡：已知模式的注入与违规内容</text>
    <text x="640" y="194" font-size="10" fill="#9f1239" text-anchor="end">挡不住：新变体、编码绕过</text>

    <!-- 层 3 框架层 -->
    <rect x="40" y="220" width="600" height="56" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="64" y="244" font-size="13.5" font-weight="bold" fill="#155e75">③ 编排框架层</text>
    <text x="64" y="262" font-size="10.5" fill="#0e7490">NeMo Guardrails 五类 rails / Guardrails AI 校验器：把检查固化成可测试的配置</text>
    <text x="640" y="244" font-size="10" fill="#0e7490" text-anchor="end">挡：越权动作、流程偏离</text>
    <text x="640" y="262" font-size="10" fill="#9f1239" text-anchor="end">挡不住：rails 顺序配错的静默失效</text>

    <!-- 层 4 提示词层 -->
    <rect x="40" y="288" width="600" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="64" y="312" font-size="13.5" font-weight="bold" fill="#14532d">② 提示词层</text>
    <text x="64" y="330" font-size="10.5" fill="#166534">结构化分隔 + 输出契约 + 系统提示词纪律（不放机密、不当鉴权）</text>
    <text x="640" y="312" font-size="10" fill="#166534" text-anchor="end">挡：朴素覆盖、提高攻击成本</text>
    <text x="640" y="330" font-size="10" fill="#9f1239" text-anchor="end">挡不住：决心足够的注入者</text>

    <!-- 层 5 应用层 -->
    <rect x="40" y="356" width="600" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="64" y="380" font-size="13.5" font-weight="bold" fill="#9a3412">① 应用层（最后一道、最重要）</text>
    <text x="64" y="398" font-size="10.5" fill="#c2410c">最小权限 + 输出消毒 + 人审闸门 + 审计日志——不依赖模型「听话」的硬边界</text>
    <text x="640" y="380" font-size="10" fill="#c2410c" text-anchor="end">挡：损害兑现</text>
    <text x="640" y="398" font-size="10" fill="#166534" text-anchor="end">这是唯一不依赖概率的一层</text>
  </g>
</svg>
