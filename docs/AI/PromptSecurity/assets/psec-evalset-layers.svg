<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1e293b">评估集四层结构：每层回答一个问题</text>
  <text x="24" y="60" font-size="12" fill="#64748b">功能层保证「能干活」，安全层保证「不越界」，对抗层沉淀「被攻破过的样子」，哨兵层盯住「悄悄变坏的模型」</text>

  <g font-family="sans-serif">
    <rect x="24" y="84" width="632" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="48" y="110" font-size="13.5" font-weight="bold" fill="#1e3a8a">L1 功能层 —— 「任务完成得对不对？」</text>
    <text x="48" y="130" font-size="10.5" fill="#1d4ed8">正常输入的准确性 / 格式合规（JSON Schema 可解析）/ 关键字段存在；断言为主，可全自动</text>
    <text x="640" y="110" font-size="10.5" fill="#1d4ed8" text-anchor="end">建议规模：50~200 条</text>
    <text x="640" y="130" font-size="10.5" fill="#9f1239" text-anchor="end">门禁：必须 100% 通过</text>

    <rect x="24" y="168" width="632" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="48" y="194" font-size="13.5" font-weight="bold" fill="#14532d">L2 安全策略层 —— 「该拒的拒了吗？不该说的说了吗？」</text>
    <text x="48" y="214" font-size="10.5" fill="#166534">拒绝类（越权请求、他人数据）、泄露类（系统提示词、内部规则）、越权动作类；期望输出明确唯一</text>
    <text x="640" y="194" font-size="10.5" fill="#166534" text-anchor="end">建议规模：30~100 条</text>
    <text x="640" y="214" font-size="10.5" fill="#9f1239" text-anchor="end">门禁：违规 0 条（红线）</text>

    <rect x="24" y="252" width="632" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="48" y="278" font-size="13.5" font-weight="bold" fill="#991b1b">L3 对抗层 —— 「红队攻破过的样本，还会再破吗？」</text>
    <text x="48" y="298" font-size="10.5" fill="#b91c1c">红队有效发现直接沉淀：直接注入、间接注入载体、越狱话术、多轮升级链；每条附攻击者视角说明</text>
    <text x="640" y="278" font-size="10.5" fill="#b91c1c" text-anchor="end">规模随红队持续增长</text>
    <text x="640" y="298" font-size="10.5" fill="#9f1239" text-anchor="end">门禁：复现率 ≤ 基线且不高于上版</text>

    <rect x="24" y="336" width="632" height="72" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="48" y="362" font-size="13.5" font-weight="bold" fill="#581c87">L4 哨兵层 —— 「供应商悄悄换模型了吗？」</text>
    <text x="48" y="382" font-size="10.5" fill="#7e22ce">固定输入 + 固定参数 + 固定随机种子的基准输出指纹；定期重跑比对，漂移超阈值先报警再发版</text>
    <text x="640" y="362" font-size="10.5" fill="#7e22ce" text-anchor="end">建议规模：20~50 条锚点样本</text>
    <text x="640" y="382" font-size="10.5" fill="#9f1239" text-anchor="end">门禁：漂移率超阈值阻断发布</text>
  </g>
</svg>
