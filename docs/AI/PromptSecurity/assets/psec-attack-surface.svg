<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1e293b">LLM 应用的攻击面：五个入口，一个核心事实</text>
  <text x="24" y="60" font-size="12" fill="#64748b">模型把「指令」和「数据」读进同一条通道——五个入口进来的文本都是候选指令</text>

  <!-- 中心模型 -->
  <rect x="260" y="180" width="160" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="216" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">模型 + 应用编排</text>
  <text x="340" y="238" font-size="11" fill="#6b21a8" text-anchor="middle">指令与数据同通道</text>
  <text x="340" y="256" font-size="11" fill="#6b21a8" text-anchor="middle">输出具有概率性</text>

  <!-- 五个入口 -->
  <g font-family="sans-serif">
    <rect x="24" y="84" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="114" y="108" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">① 用户输入</text>
    <text x="114" y="126" font-size="10.5" fill="#b91c1c" text-anchor="middle">直接注入 · 越狱</text>

    <rect x="24" y="160" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="114" y="184" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">② RAG 检索内容</text>
    <text x="114" y="202" font-size="10.5" fill="#b91c1c" text-anchor="middle">间接注入 · 投毒（LLM08）</text>

    <rect x="24" y="236" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="114" y="260" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">③ 外部工具返回</text>
    <text x="114" y="278" font-size="10.5" fill="#b91c1c" text-anchor="middle">网页 / 邮件 / API 响应</text>

    <rect x="476" y="84" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="566" y="108" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">④ 系统提示词</text>
    <text x="566" y="126" font-size="10.5" fill="#b91c1c" text-anchor="middle">泄露即暴露规则（LLM07）</text>

    <rect x="476" y="160" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="566" y="184" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">⑤ 模型输出</text>
    <text x="566" y="202" font-size="10.5" fill="#b91c1c" text-anchor="middle">进下游前的消毒（LLM05）</text>

    <!-- 连线 -->
    <path d="M204 112 C 240 130, 250 160, 262 190" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#ra)"/>
    <path d="M204 188 H258" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ra)"/>
    <path d="M204 264 C 240 246, 250 216, 262 262" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#ra)"/>
    <path d="M476 112 C 440 130, 430 160, 418 190" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#ra)"/>
    <path d="M418 262 C 440 240, 450 216, 476 188" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#ra)" />

    <!-- 输出与副作用 -->
    <rect x="476" y="260" width="180" height="72" rx="10" fill="#fff7ed" stroke="#ea580c"/>
    <text x="566" y="286" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">副作用出口</text>
    <text x="566" y="304" font-size="10.5" fill="#c2410c" text-anchor="middle">工具调用 · 数据库 · 邮件 · 代码</text>
    <text x="566" y="320" font-size="10.5" fill="#c2410c" text-anchor="middle">权限越大，注入损失越大（LLM06）</text>
    <path d="M420 276 H474" stroke="#ea580c" stroke-width="1.6" marker-end="url(#oa)"/>

    <!-- 底部结论 -->
    <rect x="24" y="356" width="632" height="60" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <text x="340" y="382" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">核心事实：注入利用的是设计特性而非可修补的缺陷——无法「根治」，只能收敛损害</text>
    <text x="340" y="402" font-size="11" fill="#334155" text-anchor="middle">对策是纵深防御 + 评估门禁（Defense / EvalSet / RegressionGate），不是一条「更狠的系统提示词」</text>
  </g>
  <defs>
    <marker id="ra" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#dc2626"/>
    </marker>
    <marker id="oa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
