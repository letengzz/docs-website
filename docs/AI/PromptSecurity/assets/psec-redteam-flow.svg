<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <rect width="680" height="260" fill="#ffffff"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1e293b">红队测试六步闭环</text>
  <text x="24" y="60" font-size="12" fill="#64748b">每一步的产出都回流：发现进评估集、修复进回归门禁、残余风险进威胁建模的下一轮</text>

  <g font-family="sans-serif">
    <rect x="24" y="84" width="180" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="114" y="110" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 范围与授权</text>
    <text x="114" y="130" font-size="10" fill="#1d4ed8" text-anchor="middle">只打自有系统 · 记录预算上限</text>
    <text x="114" y="146" font-size="10" fill="#1d4ed8" text-anchor="middle">指定负责人与报告去向</text>

    <rect x="244" y="84" width="180" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="334" y="110" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">② 威胁建模</text>
    <text x="334" y="130" font-size="10" fill="#6b21a8" text-anchor="middle">列资产、入口、副作用</text>
    <text x="334" y="146" font-size="10" fill="#6b21a8" text-anchor="middle">映射 OWASP LLM Top 10</text>

    <rect x="464" y="84" width="180" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="554" y="110" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">③ 自动化扫描</text>
    <text x="554" y="130" font-size="10" fill="#b91c1c" text-anchor="middle">garak 探针族 / promptfoo redteam</text>
    <text x="554" y="146" font-size="10" fill="#b91c1c" text-anchor="middle">广度优先，几分钟一个族</text>

    <rect x="24" y="176" width="180" height="72" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="114" y="202" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">④ 人工对抗</text>
    <text x="114" y="222" font-size="10" fill="#c2410c" text-anchor="middle">多轮升级链（Crescendo / TAP）</text>
    <text x="114" y="238" font-size="10" fill="#c2410c" text-anchor="middle">业务上下文攻击，机器想不到</text>

    <rect x="244" y="176" width="180" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="334" y="202" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">⑤ 报告与分级</text>
    <text x="334" y="222" font-size="10" fill="#166534" text-anchor="middle">发现 / 复现步骤 / 影响 / 建议</text>
    <text x="334" y="238" font-size="10" fill="#166534" text-anchor="middle">按「损害是否兑现」分级</text>

    <rect x="464" y="176" width="180" height="72" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="554" y="202" font-size="13" font-weight="bold" fill="#155e75" text-anchor="middle">⑥ 修复与复测</text>
    <text x="554" y="222" font-size="10" fill="#0e7490" text-anchor="middle">修复后用同一探针族复测</text>
    <text x="554" y="238" font-size="10" fill="#0e7490" text-anchor="middle">有效发现沉淀进评估集（L3）</text>

    <path d="M204 120 H244 M424 120 H464" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
    <path d="M554 156 V176" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
    <path d="M464 212 H424 M244 212 H204" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
    <path d="M114 156 C 114 60, 554 60, 554 84" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a1)"/>
    <text x="334" y="72" font-size="10" fill="#94a3b8" text-anchor="middle">⑥ → ①：残余风险与新攻击面进入下一轮</text>
  </g>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
