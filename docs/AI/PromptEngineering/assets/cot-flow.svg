<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cot-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .q { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .ans { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="q" x="30" y="90" width="150" height="60"/>
  <text x="105" y="117">复杂问题</text>
  <text class="small" x="105" y="137">数学 / 逻辑 / 多步</text>

  <line x1="180" y1="120" x2="220" y2="120" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#cot-arrow)"/>

  <rect class="step" x="220" y="30" width="150" height="52"/>
  <text x="295" y="52">步骤 1：列已知条件</text>
  <text class="small" x="295" y="70">理解问题</text>

  <line x1="370" y1="56" x2="410" y2="56" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#cot-arrow)"/>

  <rect class="step" x="410" y="30" width="150" height="52"/>
  <text x="485" y="52">步骤 2：分步计算</text>
  <text class="small" x="485" y="70">逐步推理</text>

  <line x1="560" y1="56" x2="600" y2="56" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#cot-arrow)"/>

  <rect class="ans" x="600" y="30" width="100" height="52"/>
  <text x="650" y="52">步骤 3：结论</text>
  <text class="small" x="650" y="70">输出答案</text>

  <line x1="485" y1="82" x2="485" y2="120" stroke="#4a7bd8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="485" y1="120" x2="560" y2="120" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#cot-arrow)"/>

  <rect class="step" x="220" y="120" width="340" height="52"/>
  <text x="390" y="142">自一致性（Self-Consistency）</text>
  <text class="small" x="390" y="160">多次采样取多数票答案</text>

  <line x1="390" y1="172" x2="390" y2="205" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#cot-arrow)"/>

  <rect class="ans" x="280" y="205" width="220" height="46"/>
  <text x="390" y="233">更可靠的最终答案</text>

  <text class="small" x="360" y="268">提示词：请一步一步思考，最后给出答案</text>
</svg>
