<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="324" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">一致性指标：κ 会被流行度吃掉，区间不会</text>
<text x="36" y="70" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">报告里没有区间的 κ 数字不要写进任何汇报；阈值要写成「CI 下限 ≥ X」</text>
<text x="36" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">流行度把 κ 吃掉（300 条 / 3 标注者 / 8% 错误率）</text>
<rect x="84" y="159.5" width="44" height="112.5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="106" y="153.5" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.750</text>
<rect x="136" y="171.95" width="44" height="100.05000000000001" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="158" y="165.95" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.667</text>
<text x="132" y="292" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">流行度 50%</text>
<rect x="224" y="153.5" width="44" height="118.5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="246" y="147.5" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.790</text>
<rect x="276" y="205.7" width="44" height="66.3" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="298" y="199.7" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.442</text>
<text x="272" y="292" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">流行度 90%</text>
<rect x="364" y="151.55" width="44" height="120.45" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="386" y="145.55" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.803</text>
<rect x="416" y="229.85" width="44" height="42.150000000000006" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
<text x="438" y="223.85" font-size="10.5" font-weight="700" fill="#be123c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.281</text>
<text x="412" y="292" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">流行度 95%</text>
<text x="36" y="314" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">蓝 = 原始一致率（越偏越高）　红 = κ（越偏越低）：同一批标注质量，κ 从 0.667 掉到 0.281</text>
<text x="516" y="104" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">样本量决定区间宽度（自助法 200 次）</text>
<text x="516" y="143" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">n=50</text>
<line x1="667" y1="139" x2="818" y2="139" stroke="#6d28d9" stroke-width="2"/>
<circle cx="738" cy="139" r="3.5" fill="#6d28d9"/>
<text x="896" y="143" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.502</text>
<text x="516" y="173" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">n=100</text>
<line x1="632" y1="169" x2="744" y2="169" stroke="#6d28d9" stroke-width="2"/>
<circle cx="679" cy="169" r="3.5" fill="#6d28d9"/>
<text x="896" y="173" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.374</text>
<text x="516" y="203" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">n=200</text>
<line x1="666" y1="199" x2="738" y2="199" stroke="#6d28d9" stroke-width="2"/>
<circle cx="703" cy="199" r="3.5" fill="#6d28d9"/>
<text x="896" y="203" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.240</text>
<text x="516" y="233" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">n=400</text>
<line x1="686" y1="229" x2="739" y2="229" stroke="#6d28d9" stroke-width="2"/>
<circle cx="712" cy="229" r="3.5" fill="#6d28d9"/>
<text x="896" y="233" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.174</text>
<text x="516" y="263" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">n=800</text>
<line x1="695" y1="259" x2="735" y2="259" stroke="#6d28d9" stroke-width="2"/>
<circle cx="716" cy="259" r="3.5" fill="#6d28d9"/>
<text x="896" y="263" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.131</text>
<text x="516" y="306" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">区间宽度 ≈ 1/√n：把宽度减半要 4 倍样本；n=50 的点估计不可与 n=100 相比</text>
</svg>
