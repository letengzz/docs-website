<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">三种来源与三阶段配比</text>
<text x="36" y="70" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">真实为主干、改造做扩增、合成补长尾；配比按失败类型调，不按省钱调</text>
<rect x="36" y="104" width="288" height="116" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="124" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">真实采集</text>
<text x="48" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">日志 / 工单 / 录音</text>
<text x="48" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">成本：清洗与授权最贵</text>
<text x="48" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">风险：只覆盖已发生的事</text>
<text x="48" y="202" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">必需场景：原话与噪声</text>
<rect x="342" y="104" width="288" height="116" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="354" y="124" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">改造增强</text>
<text x="354" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">改写 / 加噪 / 换序</text>
<text x="354" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">成本：中等</text>
<text x="354" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">风险：改坏语义、放大偏置</text>
<text x="354" y="202" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">必需场景：同义不同表述</text>
<rect x="648" y="104" width="288" height="116" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="660" y="124" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">合成生成</text>
<text x="660" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">模型 / 模板 / 程序</text>
<text x="660" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">成本：边际趋零、验证最贵</text>
<text x="660" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">风险：假得一样、事实幻觉</text>
<text x="660" y="202" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">必需场景：长尾与对抗样本</text>
<text x="36" y="254" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">三阶段配比（按「缺什么」调整，不是固定值）</text>
<text x="36" y="296" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">种子 200~500 条</text>
<rect x="240" y="282" width="336.0" height="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="408.0" y="296" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">70%</text>
<rect x="576.0" y="282" width="144.0" height="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="648.0" y="296" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">30%</text>
<text x="36" y="336" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">扩增到 5,000 条</text>
<rect x="240" y="322" width="144.0" height="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="312.0" y="336" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">30%</text>
<rect x="384.0" y="322" width="192.0" height="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="480.0" y="336" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">40%</text>
<rect x="576.0" y="322" width="144.0" height="20" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="648.0" y="336" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">30%</text>
<text x="36" y="376" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">补长尾到 10,000 条</text>
<rect x="240" y="362" width="72.0" height="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="276.0" y="376" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">15%</text>
<rect x="312.0" y="362" width="120.0" height="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="372.0" y="376" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">25%</text>
<rect x="432.0" y="362" width="288.0" height="20" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="576.0" y="376" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">60%</text>
<text x="240" y="418" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">真实 30% → 15%　改造 25%　合成 0% → 60%：长尾越来越依赖合成，但验收集里的真实样本不能低于 60%</text>
</svg>
