<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="344" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">标注规范的四段结构与准入闸门</text>
<text x="36" y="70" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">把「我觉得」写成可裁决的条文：交给第三方也能标出同样的结果</text>
<rect x="36" y="104" width="212" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="48" y="124" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 任务定义</text>
<text x="48" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">一句话任务</text>
<text x="48" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">输入是什么</text>
<text x="48" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">输出取值集合</text>
<line x1="248" y1="156" x2="262" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="262" y="104" width="212" height="104" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="274" y="124" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 判定规则</text>
<text x="274" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">按优先级排列</text>
<text x="274" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">每条有命中条件</text>
<text x="274" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">多命中取最小号</text>
<line x1="474" y1="156" x2="488" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="488" y="104" width="212" height="104" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="500" y="124" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 边界例</text>
<text x="500" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">每类 3 正例</text>
<text x="500" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">每类 3 反例</text>
<text x="500" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">反例来自吵过的样本</text>
<line x1="700" y1="156" x2="714" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="714" y="104" width="212" height="104" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="726" y="124" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 裁决流程</text>
<text x="726" y="154" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">分歧怎么升级</text>
<text x="726" y="170" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">谁裁决</text>
<text x="726" y="186" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">结果回写规范</text>
<text x="36" y="244" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">schema：先定结构，再定标签</text>
<text x="36" y="268" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">item_id　labels.{intent, sentiment, ...}　meta.{guideline_version, annotator, confidence, note}</text>
<text x="36" y="290" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">必填三件：guideline_version（解释「为什么这批不一样」）、annotator（算一致性）、UNKNOWN（允许弃权）</text>
<text x="36" y="322" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">准入闸门：20 道黄金题（含 5 道陷阱题）正确率 ≥ 85% → 试标 50 条 κ ≥ 0.6 → 前 200 条 100% 复核</text>
</svg>
