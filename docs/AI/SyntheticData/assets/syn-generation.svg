<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="416" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">五种造法与三档验证器</text>
<text x="36" y="70" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">造法决定「可能造出什么」，验证器决定「最后留下什么」，两者相乘才是有效产能</text>
<rect x="36" y="104" width="172" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="48" y="124" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">模板生成</text>
<text x="48" y="154" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">组合空间是硬上限</text>
<text x="48" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">最便宜也最易同质</text>
<rect x="220" y="104" width="172" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="232" y="124" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">程序化生成</text>
<text x="232" y="154" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">真值免费且 100% 正确</text>
<text x="232" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">适合可判定的任务</text>
<rect x="404" y="104" width="172" height="92" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="416" y="124" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">种子演化</text>
<text x="416" y="154" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">深度：变难</text>
<text x="416" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">广度：变种（易造假多样）</text>
<rect x="588" y="104" width="172" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="600" y="124" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">蒸馏</text>
<text x="600" y="154" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">教师生成 / 教师打分</text>
<text x="600" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">注意许可与版本锁定</text>
<rect x="772" y="104" width="172" height="92" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="784" y="124" font-size="12" font-weight="700" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">自我批判重写</text>
<text x="784" y="154" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">提升单条质量</text>
<text x="784" y="170" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">不提升多样性</text>
<text x="36" y="230" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">验证器三档：各挡一类错误</text>
<rect x="36" y="252" width="288" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="274" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">硬规则</text>
<text x="312" y="274" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">100% 覆盖</text>
<text x="48" y="296" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· schema / 范围</text>
<text x="48" y="313" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 事实一致性</text>
<text x="48" y="330" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 禁词</text>
<rect x="342" y="252" width="288" height="112" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="354" y="274" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">软模型</text>
<text x="618" y="274" font-size="11" font-weight="700" fill="#0f766e" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">100% 可采样</text>
<text x="354" y="296" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 切题 / 套话</text>
<text x="354" y="313" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 难度分档</text>
<text x="354" y="330" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 幻觉</text>
<rect x="648" y="252" width="288" height="112" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="660" y="274" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">人工抽检</text>
<text x="924" y="274" font-size="11" font-weight="700" fill="#be123c" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">5%~10%</text>
<text x="660" y="296" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 必含软模型高分档</text>
<text x="660" y="313" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 唯一能发现</text>
<text x="660" y="330" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 验证器自身偏差</text>
<text x="36" y="392" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">产出比 = 生成量 × 通过率；通过率的分母必须能按 reason code 分解，否则无法判断该改提示词还是改验证器</text>
</svg>
