<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-label="商品图搜与说明书截图检索的实战管线结构">
  <title>实战管线：离线两条支路、在线四步、一份契约</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="510" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">实战管线：离线两条支路、在线四步、一份契约</text>
  <rect x="30" y="60" width="170" height="60" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="115.0" y="84" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">商品图</text>
  <text x="115.0" y="104" font-size="11" fill="#475569" text-anchor="middle">jpg / png</text>
  <rect x="30" y="135" width="170" height="60" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="115.0" y="159" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">说明书 PDF</text>
  <text x="115.0" y="179" font-size="11" fill="#475569" text-anchor="middle">每页渲染 150 DPI</text>
  <rect x="240" y="60" width="190" height="60" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="335.0" y="84" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">图像编码</text>
  <text x="335.0" y="104" font-size="11" fill="#475569" text-anchor="middle">单向量</text>
  <rect x="240" y="135" width="190" height="80" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="335.0" y="159" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">页面编码</text>
  <text x="335.0" y="179" font-size="10" fill="#475569" text-anchor="middle">单向量（粗排）</text>
  <text x="335.0" y="196" font-size="10" fill="#475569" text-anchor="middle">patch 多向量（精排）</text>
  <rect x="470" y="90" width="180" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="560.0" y="114" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">统一元数据</text>
  <text x="560.0" y="134" font-size="10" fill="#475569" text-anchor="middle">meta.jsonl + manifest</text>
  <line x1="200" y1="90" x2="238" y2="90" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arb)"/>
  <line x1="200" y1="165" x2="238" y2="172" stroke="#0f766e" stroke-width="1.6" marker-end="url(#art)"/>
  <line x1="430" y1="90" x2="468" y2="115" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="172" x2="468" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="690" y="60" width="180" height="60" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="780.0" y="84" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">在线查询</text>
  <text x="780.0" y="104" font-size="11" fill="#475569" text-anchor="middle">文本 / 图片</text>
  <rect x="690" y="135" width="180" height="60" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="780.0" y="159" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">四步链路</text>
  <text x="780.0" y="179" font-size="11" fill="#475569" text-anchor="middle">召回→融合→折叠→重排</text>
  <line x1="780" y1="120" x2="780" y2="133" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="650" y="215" width="220" height="80" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="760.0" y="239" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">输出契约</text>
  <text x="760.0" y="259" font-size="10" fill="#475569" text-anchor="middle">doc_id / page_no / bbox</text>
  <text x="760.0" y="276" font-size="10" fill="#475569" text-anchor="middle">mode / degraded</text>
  <line x1="780" y1="195" x2="780" y2="213" stroke="#be123c" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="30" y="250" width="300" height="58" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="180.0" y="274" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">命令 1 索引完整性</text>
  <text x="180.0" y="294" font-size="10" fill="#475569" text-anchor="middle">行数 + 跳过数 = 总页数</text>
  <rect x="30" y="320" width="300" height="58" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="180.0" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">命令 2 契约校验</text>
  <text x="180.0" y="364" font-size="10" fill="#475569" text-anchor="middle">八个必填字段齐全</text>
  <rect x="30" y="390" width="300" height="58" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="180.0" y="414" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">命令 3 折叠去重</text>
  <text x="180.0" y="434" font-size="10" fill="#475569" text-anchor="middle">不同文档数 = 期望值</text>
  <rect x="360" y="330" width="510" height="118" rx="7" fill="#fef2f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="615.0" y="354" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">一条硬边界</text>
  <text x="615.0" y="374" font-size="10" fill="#475569" text-anchor="middle">project/ 只放文档；所有命令由读者在自己的工程里执行</text>
  <text x="615.0" y="391" font-size="10" fill="#475569" text-anchor="middle">三条命令全绿只证明结构正确，效果仍需回到 200 条评估集</text>
</svg>
