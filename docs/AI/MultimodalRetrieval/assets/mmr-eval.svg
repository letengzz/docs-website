<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="评估三层结构与五类查询分层，三个指标与一条回归门禁">
  <title>评估三层：召回、排序、端到端</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">评估三层：召回、排序、端到端</text>
  <rect x="30" y="70" width="240" height="130" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="150.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">召回层</text>
  <text x="150.0" y="114" font-size="11" fill="#475569" text-anchor="middle">Recall@N</text>
  <text x="150.0" y="131" font-size="11" fill="#475569" text-anchor="middle">问：有没有漏</text>
  <rect x="30" y="215" width="240" height="130" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="150.0" y="239" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">排序层</text>
  <text x="150.0" y="259" font-size="11" fill="#475569" text-anchor="middle">nDCG@10 / MRR</text>
  <text x="150.0" y="276" font-size="11" fill="#475569" text-anchor="middle">问：排得对不对</text>
  <rect x="30" y="360" width="240" height="90" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="150.0" y="384" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">端到端</text>
  <text x="150.0" y="404" font-size="11" fill="#475569" text-anchor="middle">任务成功率 / 追问率</text>
  <line x1="270" y1="135" x2="308" y2="135" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="270" y1="280" x2="308" y2="280" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="310" y="70" width="250" height="250" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="435.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">五类查询（共 200 条）</text>
  <text x="435.0" y="114" font-size="12" fill="#475569" text-anchor="middle">关键词 25%</text>
  <text x="435.0" y="131" font-size="12" fill="#475569" text-anchor="middle">自然语言 30%</text>
  <text x="435.0" y="148" font-size="12" fill="#475569" text-anchor="middle">图搜图 20%</text>
  <text x="435.0" y="165" font-size="12" fill="#475569" text-anchor="middle">截图找页 15%</text>
  <text x="435.0" y="182" font-size="12" fill="#475569" text-anchor="middle">混合属性 10%</text>
  <text x="435.0" y="199" font-size="12" fill="#475569" text-anchor="middle">→ 比例贴近线上分布</text>
  <rect x="590" y="70" width="280" height="120" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="730.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">硬负样本 ≥ 20%</text>
  <text x="730.0" y="114" font-size="11" fill="#475569" text-anchor="middle">近重复 / 同模板 / 语义近邻</text>
  <text x="730.0" y="131" font-size="11" fill="#475569" text-anchor="middle">取排名 5~20 且人工判 0</text>
  <rect x="590" y="205" width="280" height="115" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="730.0" y="229" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">回归门禁</text>
  <text x="730.0" y="249" font-size="11" fill="#475569" text-anchor="middle">Recall@50 降 > 3pt：阻断</text>
  <text x="730.0" y="266" font-size="11" fill="#475569" text-anchor="middle">nDCG@10 降 > 2pt：阻断</text>
  <rect x="310" y="340" width="560" height="110" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="590.0" y="364" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">一条统计纪律：200 条样本只能分辨约 8 个百分点</text>
  <text x="590.0" y="384" font-size="11" fill="#475569" text-anchor="middle">小于 5pt 的差异在噪声范围内；要坐实它，扩样本或做配对检验</text>
</svg>
