<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="常见问题分诊路径：现象、最可能坏的层、第一条检查">
  <title>分诊路径：从现象到层，再到一条可执行的检查</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">分诊路径：从现象到层，再到一条可执行的检查</text>
  <rect x="30" y="70" width="180" height="70" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="120.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">现象</text>
  <text x="120.0" y="114" font-size="11" fill="#475569" text-anchor="middle">结果不对 / 很慢 / 串号</text>
  <line x1="210" y1="105" x2="258" y2="105" stroke="#be123c" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="260" y="70" width="180" height="70" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="350.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">定位层</text>
  <text x="350.0" y="114" font-size="11" fill="#475569" text-anchor="middle">通道 / 索引 / 融合 / 缓存</text>
  <line x1="440" y1="105" x2="488" y2="105" stroke="#b45309" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="490" y="70" width="180" height="70" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="580.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">一条检查</text>
  <text x="580.0" y="114" font-size="11" fill="#475569" text-anchor="middle">日志 / 字段 / 计数</text>
  <line x1="670" y1="105" x2="718" y2="105" stroke="#0f766e" stroke-width="1.6" marker-end="url(#art)"/>
  <rect x="720" y="70" width="150" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="795.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">结论</text>
  <text x="795.0" y="114" font-size="11" fill="#475569" text-anchor="middle">修 or 观测</text>
  <rect x="30" y="190" width="260" height="120" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="160.0" y="214" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">未调用</text>
  <text x="160.0" y="234" font-size="11" fill="#475569" text-anchor="middle">通道无日志</text>
  <text x="160.0" y="251" font-size="11" fill="#475569" text-anchor="middle">开关没开</text>
  <text x="160.0" y="268" font-size="11" fill="#475569" text-anchor="middle">字段拼错</text>
  <rect x="310" y="190" width="260" height="120" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="440.0" y="214" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">不准</text>
  <text x="440.0" y="234" font-size="11" fill="#475569" text-anchor="middle">模型不适配</text>
  <text x="440.0" y="251" font-size="11" fill="#475569" text-anchor="middle">切分/表示错</text>
  <text x="440.0" y="268" font-size="11" fill="#475569" text-anchor="middle">未去重</text>
  <rect x="590" y="190" width="260" height="120" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="720.0" y="214" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">不可用</text>
  <text x="720.0" y="234" font-size="11" fill="#475569" text-anchor="middle">延迟超预算</text>
  <text x="720.0" y="251" font-size="11" fill="#475569" text-anchor="middle">显存打满</text>
  <text x="720.0" y="268" font-size="11" fill="#475569" text-anchor="middle">降级未暴露</text>
  <text x="450" y="345" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">先确认「有没有被调用」，再怀疑「准不准」——大量问题其实是集成问题</text>
  <rect x="30" y="370" width="840" height="70" rx="7" fill="#fef2f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="394" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">两个高频真因</text>
  <text x="450.0" y="414" font-size="11" fill="#475569" text-anchor="middle">缓存键漏了租户（安全事故）· 入库漏页（静默缺数据）</text>
</svg>
