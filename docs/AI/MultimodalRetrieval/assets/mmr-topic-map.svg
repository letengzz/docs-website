<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="多模态检索与重排专题地图：从查询理解到重排的五段链路">
  <title>多模态检索与重排：五段链路、九页分工</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">多模态检索与重排：五段链路、九页分工</text>
  <rect x="25" y="70" width="150" height="96" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="100.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">① 查询理解</text>
  <text x="100.0" y="114" font-size="9" fill="#475569" text-anchor="middle">文本归一化 / 属性抽取</text>
  <text x="100.0" y="131" font-size="9" fill="#475569" text-anchor="middle">图片编码</text>
  <rect x="200" y="70" width="150" height="96" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="275.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">② 三路召回</text>
  <text x="275.0" y="114" font-size="9" fill="#475569" text-anchor="middle">BM25 / 稠密文本</text>
  <text x="275.0" y="131" font-size="9" fill="#475569" text-anchor="middle">视觉多向量</text>
  <rect x="375" y="70" width="150" height="96" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="450.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">③ 融合去重</text>
  <text x="450.0" y="114" font-size="9" fill="#475569" text-anchor="middle">RRF 融合</text>
  <text x="450.0" y="131" font-size="9" fill="#475569" text-anchor="middle">按 doc_id 折叠</text>
  <rect x="550" y="70" width="150" height="96" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="625.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">④ 重排</text>
  <text x="625.0" y="114" font-size="9" fill="#475569" text-anchor="middle">交叉编码 / 后期交互</text>
  <text x="625.0" y="131" font-size="9" fill="#475569" text-anchor="middle">listwise</text>
  <rect x="725" y="70" width="150" height="96" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="800.0" y="94" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">⑤ 输出契约</text>
  <text x="800.0" y="114" font-size="9" fill="#475569" text-anchor="middle">doc_id / page_no</text>
  <text x="800.0" y="131" font-size="9" fill="#475569" text-anchor="middle">bbox / mode</text>
  <line x1="175" y1="118" x2="196" y2="118" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="350" y1="118" x2="371" y2="118" stroke="#0f766e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="525" y1="118" x2="546" y2="118" stroke="#b45309" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="700" y1="118" x2="721" y2="118" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="25" y="210" width="150" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="100.0" y="234" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">总览</text>
  <text x="100.0" y="254" font-size="9" fill="#475569" text-anchor="middle">三种范式</text>
  <text x="100.0" y="271" font-size="9" fill="#475569" text-anchor="middle">五个必失点</text>
  <rect x="200" y="210" width="150" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="275.0" y="234" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">图文向量</text>
  <text x="275.0" y="254" font-size="9" fill="#475569" text-anchor="middle">对比学习 / 维度</text>
  <text x="275.0" y="271" font-size="9" fill="#475569" text-anchor="middle">模型格局</text>
  <rect x="375" y="210" width="150" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="450.0" y="234" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">视觉文档</text>
  <text x="450.0" y="254" font-size="9" fill="#475569" text-anchor="middle">MaxSim / patch</text>
  <text x="450.0" y="271" font-size="9" fill="#475569" text-anchor="middle">工具链</text>
  <rect x="550" y="210" width="150" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="625.0" y="234" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">混合召回</text>
  <text x="625.0" y="254" font-size="9" fill="#475569" text-anchor="middle">三路融合</text>
  <text x="625.0" y="271" font-size="9" fill="#475569" text-anchor="middle">跨模态改写</text>
  <rect x="725" y="210" width="150" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="800.0" y="234" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">重排</text>
  <text x="800.0" y="254" font-size="9" fill="#475569" text-anchor="middle">候选深度</text>
  <text x="800.0" y="271" font-size="9" fill="#475569" text-anchor="middle">延迟与校准</text>
  <text x="450" y="322" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">支撑层：评估（200 条分层评估集）· 服务化（三层索引 / 批处理 / 降级）· 实战（商品图搜 + 说明书截图）</text>
  <rect x="25" y="342" width="260" height="78" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="155.0" y="366" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">评估</text>
  <text x="155.0" y="386" font-size="9" fill="#475569" text-anchor="middle">Recall@k / nDCG</text>
  <text x="155.0" y="403" font-size="9" fill="#475569" text-anchor="middle">回归门禁</text>
  <rect x="320" y="342" width="260" height="78" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="450.0" y="366" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">服务化</text>
  <text x="450.0" y="386" font-size="9" fill="#475569" text-anchor="middle">分层索引 / 缓存</text>
  <text x="450.0" y="403" font-size="9" fill="#475569" text-anchor="middle">批处理 / 降级</text>
  <rect x="615" y="342" width="260" height="78" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="745.0" y="366" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">实战</text>
  <text x="745.0" y="386" font-size="9" fill="#475569" text-anchor="middle">契约 / 冷启动</text>
  <text x="745.0" y="403" font-size="9" fill="#475569" text-anchor="middle">三条验收命令</text>
  <rect x="25" y="440" width="850" height="76" rx="7" fill="#fef2f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="450.0" y="464" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">一条贯穿全专题的纪律：相似度只用于召回，相关性由重排或业务规则判定</text>
  <text x="450.0" y="484" font-size="10" fill="#475569" text-anchor="middle">任何一步「看起来能用但不准」，都要先问：这一层是被调用了，还是被调用了但判断错了</text>
</svg>
