<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="三档重排对照：交叉编码器、后期交互、listwise，以及延迟与成本权衡">
  <title>三档重排：交互越深，越准也越慢</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">三档重排：交互越深，越准也越慢</text>
  <rect x="30" y="70" width="200" height="74" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="130.0" y="112.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">交叉编码器</text>
  <text x="250" y="100" font-size="11" font-weight="400" fill="#334155" text-anchor="start">查询+文档拼接进模型</text>
  <text x="520" y="100" font-size="11" font-weight="400" fill="#334155" text-anchor="start">精度高</text>
  <text x="650" y="100" font-size="11" font-weight="400" fill="#0f766e" text-anchor="start">中延迟</text>
  <rect x="30" y="158" width="200" height="74" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="130.0" y="200.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">后期交互</text>
  <text x="250" y="188" font-size="11" font-weight="400" fill="#334155" text-anchor="start">各自编码 + MaxSim</text>
  <text x="520" y="188" font-size="11" font-weight="400" fill="#334155" text-anchor="start">精度中高</text>
  <text x="650" y="188" font-size="11" font-weight="400" fill="#0f766e" text-anchor="start">低延迟</text>
  <rect x="30" y="246" width="200" height="74" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="130.0" y="288.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">listwise</text>
  <text x="250" y="276" font-size="11" font-weight="400" fill="#334155" text-anchor="start">一次读多个候选联合排序</text>
  <text x="520" y="276" font-size="11" font-weight="400" fill="#334155" text-anchor="start">精度最高</text>
  <text x="650" y="276" font-size="11" font-weight="400" fill="#be123c" text-anchor="start">高延迟</text>
  <rect x="30" y="334" width="200" height="74" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="130.0" y="376.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">多模态交叉编码</text>
  <text x="250" y="364" font-size="11" font-weight="400" fill="#334155" text-anchor="start">查询 + 页面截图进模型</text>
  <text x="520" y="364" font-size="11" font-weight="400" fill="#334155" text-anchor="start">精度高</text>
  <text x="650" y="364" font-size="11" font-weight="400" fill="#be123c" text-anchor="start">高延迟（视觉 token 贵）</text>
  <text x="250" y="62" font-size="11" font-weight="600" fill="#64748b" text-anchor="start">交互方式</text>
  <text x="520" y="62" font-size="11" font-weight="600" fill="#64748b" text-anchor="start">精度</text>
  <text x="650" y="62" font-size="11" font-weight="600" fill="#64748b" text-anchor="start">延迟（100 候选）</text>
  <rect x="30" y="425" width="830" height="42" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="445.0" y="451.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">先定延迟预算，再选档位：80 ms 的预算里塞不进 listwise，再准也没用</text>
</svg>
