<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="me-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .agent { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    .short { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .long { fill: #fff7e6; stroke: #d99a2b; stroke-width: 1.5; rx: 10; }
    .store { fill: #f3f3f3; stroke: #888; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="agent" x="250" y="90" width="220" height="60"/>
  <text x="360" y="117">Agent（LLM）</text>
  <text class="small" x="360" y="137">决策 + 生成</text>

  <line x1="250" y1="105" x2="180" y2="80" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#me-arrow)"/>
  <line x1="250" y1="135" x2="180" y2="210" stroke="#d99a2b" stroke-width="1.5" marker-end="url(#me-arrow)"/>

  <rect class="short" x="30" y="45" width="180" height="55"/>
  <text x="120" y="67">短期记忆</text>
  <text class="small" x="120" y="87">消息历史 / 滑动窗口</text>

  <rect class="long" x="30" y="185" width="180" height="55"/>
  <text x="120" y="207">长期记忆</text>
  <text class="small" x="120" y="227">偏好 / 历史结论</text>

  <line x1="470" y1="120" x2="540" y2="120" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#me-arrow)"/>

  <rect class="store" x="540" y="90" width="150" height="60"/>
  <text x="615" y="117">记忆存储</text>
  <text class="small" x="615" y="137">向量库 / Redis / DB</text>

  <text class="small" x="360" y="180">任务中：上下文 + 中间结果（工作记忆）</text>
  <text class="small" x="360" y="200">任务后：关键结论写回长期记忆</text>
  <text class="small" x="360" y="220">新任务：检索相关记忆注入提示词</text>
  <text class="small" x="360" y="260">安全：脱敏、按用户隔离、可删除</text>
  <text class="small" x="360" y="280">记忆污染：校验与更新机制，错误结论不长期生效</text>
</svg>
