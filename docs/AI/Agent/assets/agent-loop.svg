<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="al-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .goal { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .tool { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    .done { fill: #eefaf0; stroke: #3aa76d; stroke-width: 2; rx: 12; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="goal" x="250" y="20" width="220" height="46"/>
  <text x="360" y="39">用户目标</text>
  <text class="small" x="360" y="57">“帮我订一张周五去北京的票”</text>

  <line x1="360" y1="66" x2="360" y2="95" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#al-arrow)"/>

  <rect class="step" x="270" y="95" width="180" height="46"/>
  <text x="360" y="118">Thought（思考）</text>
  <text class="small" x="360" y="134">拆解任务，决定下一步</text>

  <line x1="360" y1="141" x2="360" y2="170" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#al-arrow)"/>

  <rect class="step" x="270" y="170" width="180" height="46"/>
  <text x="360" y="193">Action（行动）</text>
  <text class="small" x="360" y="209">调用工具</text>

  <line x1="450" y1="193" x2="510" y2="193" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#al-arrow)"/>

  <rect class="tool" x="510" y="170" width="180" height="46"/>
  <text x="600" y="193">工具执行</text>
  <text class="small" x="600" y="209">搜索 / 下单 / 代码</text>

  <line x1="600" y1="216" x2="360" y2="246" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#al-arrow)"/>
  <text class="small" x="530" y="240">Observation 回填</text>

  <line x1="360" y1="216" x2="360" y2="246" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#al-arrow)"/>

  <rect class="done" x="270" y="246" width="180" height="40"/>
  <text x="360" y="271">完成 / 再次循环</text>

  <text class="small" x="360" y="295">ReAct：Thought → Action → Observation 循环，设最大步数防止死循环</text>
</svg>
