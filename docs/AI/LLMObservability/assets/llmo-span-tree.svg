<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="LLM 请求的 Span 树与字段">
  <title>Span 树</title>
  <rect x="0" y="0" width="900" height="560" fill="#f7fafc"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="24" font-weight="bold" fill="#16324f">一次 RAG 问答的 Span 树</text>
    <text x="30" y="66" font-size="14" fill="#5a6b7b">关键：retrieve 与 chat 是兄弟而非父子，否则「检索耗时占比」无法计算。</text>
    <rect x="60" y="92" width="200" height="62" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="2"/>
    <text x="76" y="118" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">POST /api/ask</text>
    <text x="76" y="138" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">HTTP 入口</text>
    <text x="244" y="138" font-size="12" fill="#2d7d9a" font-weight="bold" text-anchor="end">root</text>
    <rect x="330" y="92" width="200" height="62" rx="10" fill="#ffffff" stroke="#3fae8c" stroke-width="2"/>
    <text x="346" y="118" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">ask_question</text>
    <text x="346" y="138" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">应用逻辑</text>
    <text x="514" y="138" font-size="12" fill="#3fae8c" font-weight="bold" text-anchor="end">CHAIN</text>
    <rect x="600" y="92" width="240" height="62" rx="10" fill="#ffffff" stroke="#c47a2c" stroke-width="2"/>
    <text x="616" y="118" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">rewrite_query（可选）</text>
    <text x="616" y="138" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">查询改写</text>
    <text x="824" y="138" font-size="12" fill="#c47a2c" font-weight="bold" text-anchor="end">LLM</text>
    <rect x="330" y="200" width="200" height="62" rx="10" fill="#ffffff" stroke="#c47a2c" stroke-width="2"/>
    <text x="346" y="226" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">retrieve</text>
    <text x="346" y="246" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">向量检索</text>
    <text x="514" y="246" font-size="12" fill="#c47a2c" font-weight="bold" text-anchor="end">RETRIEVER</text>
    <rect x="600" y="200" width="240" height="62" rx="10" fill="#ffffff" stroke="#c47a2c" stroke-width="2"/>
    <text x="616" y="226" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">rerank（可选）</text>
    <text x="616" y="246" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">重排</text>
    <text x="824" y="246" font-size="12" fill="#c47a2c" font-weight="bold" text-anchor="end">CHAIN</text>
    <rect x="330" y="308" width="200" height="62" rx="10" fill="#ffffff" stroke="#6b5bd2" stroke-width="2"/>
    <text x="346" y="334" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">chat</text>
    <text x="346" y="354" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">生成回答</text>
    <text x="514" y="354" font-size="12" fill="#6b5bd2" font-weight="bold" text-anchor="end">LLM</text>
    <path d="M260 123 H330" stroke="#8a97a3" stroke-width="2" fill="none"/>
    <path d="M530 123 H600" stroke="#8a97a3" stroke-width="2" fill="none"/>
    <path d="M430 154 V200" stroke="#8a97a3" stroke-width="2" fill="none"/>
    <path d="M530 231 H600" stroke="#8a97a3" stroke-width="2" fill="none"/>
    <path d="M430 262 V308" stroke="#8a97a3" stroke-width="2" fill="none"/>
    <rect x="600" y="308" width="270" height="62" rx="10" fill="#eaf1f7"/>
    <text x="620" y="334" font-size="12" fill="#8a97a3" font-weight="normal" text-anchor="start">必带字段（LLM span）</text>
    <text x="620" y="356" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">request_model / response_model / tokens</text>
    <rect x="30" y="392" width="840" height="128" rx="10" fill="#eaf1f7"/>
    <text x="52" y="420" font-size="14" fill="#16324f" font-weight="bold" text-anchor="start">三条硬纪律</text>
    <text x="52" y="448" font-size="12.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">1. 双字段查询：coalesce(新名, 旧名)。绝不把 prompt_tokens 与 input_tokens 相加。</text>
    <text x="52" y="472" font-size="12.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">2. 内部保留自己的模型，只在导出边界映射成 gen_ai.*（Development 级不可当表结构）。</text>
    <text x="52" y="496" font-size="12.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">3. 记版本矩阵并带日期：框架 / 插桩 / SDK / 导出器 / 平台 / OTEL_SEMCONV_STABILITY_OPT_IN。</text>
  </g>
</svg>
