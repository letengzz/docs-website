<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="四类方案在四个维度上的取舍">
  <title>平台选型</title>
  <rect x="0" y="0" width="900" height="520" fill="#f7fafc"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="24" font-weight="bold" fill="#16324f">四类方案 × 四个维度</text>
    <text x="30" y="66" font-size="14" fill="#5a6b7b">功能清单差异很小；决定成败的是这四行。</text>
    <text x="30" y="100" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start"></text>
    <rect x="214" y="96" width="154" height="30" rx="6" fill="#eaf1f7"/>
    <text x="291.0" y="116" font-size="12.5" fill="#16324f" font-weight="bold" text-anchor="middle">数据边界</text>
    <rect x="376" y="96" width="154" height="30" rx="6" fill="#eaf1f7"/>
    <text x="453.0" y="116" font-size="12.5" fill="#16324f" font-weight="bold" text-anchor="middle">成本形状</text>
    <rect x="538" y="96" width="154" height="30" rx="6" fill="#eaf1f7"/>
    <text x="615.0" y="116" font-size="12.5" fill="#16324f" font-weight="bold" text-anchor="middle">许可与可退出</text>
    <rect x="700" y="96" width="154" height="30" rx="6" fill="#eaf1f7"/>
    <text x="777.0" y="116" font-size="12.5" fill="#16324f" font-weight="bold" text-anchor="middle">治理与所有权</text>
    <rect x="30" y="136" width="174" height="78" rx="10" fill="#2d7d9a"/>
    <text x="117" y="172" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">SaaS 一体化</text>
    <text x="117" y="194" font-size="11" fill="#eef4f7" font-weight="normal" text-anchor="middle">代表方案见正文</text>
    <rect x="214" y="136" width="154" height="78" rx="8" fill="#ffffff" stroke="#2d7d9a" stroke-width="1.5"/>
    <text x="224" y="166" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">数据在厂商云</text>
    <rect x="376" y="136" width="154" height="78" rx="8" fill="#ffffff" stroke="#2d7d9a" stroke-width="1.5"/>
    <text x="386" y="166" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">按 trace 与存储计量</text>
    <rect x="538" y="136" width="154" height="78" rx="8" fill="#ffffff" stroke="#2d7d9a" stroke-width="1.5"/>
    <text x="548" y="166" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">闭源自托管仅供企业档</text>
    <rect x="700" y="136" width="154" height="78" rx="8" fill="#ffffff" stroke="#2d7d9a" stroke-width="1.5"/>
    <text x="710" y="166" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">母公司策略可变更时点</text>
    <rect x="30" y="224" width="174" height="78" rx="10" fill="#3fae8c"/>
    <text x="117" y="260" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">开源可自托管</text>
    <text x="117" y="282" font-size="11" fill="#eef4f7" font-weight="normal" text-anchor="middle">代表方案见正文</text>
    <rect x="214" y="224" width="154" height="78" rx="8" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="224" y="254" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">可全内网</text>
    <rect x="376" y="224" width="154" height="78" rx="8" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="386" y="254" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">免订阅但自付运维</text>
    <rect x="538" y="224" width="154" height="78" rx="8" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="548" y="254" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">核心 MIT、可自托管</text>
    <rect x="700" y="224" width="154" height="78" rx="8" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="710" y="254" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">已并入 ClickHouse</text>
    <rect x="30" y="312" width="174" height="78" rx="10" fill="#c47a2c"/>
    <text x="117" y="348" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">OTel 原生</text>
    <text x="117" y="370" font-size="11" fill="#eef4f7" font-weight="normal" text-anchor="middle">代表方案见正文</text>
    <rect x="214" y="312" width="154" height="78" rx="8" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="224" y="342" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">可全内网</text>
    <rect x="376" y="312" width="154" height="78" rx="8" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="386" y="342" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">评估能力内含</text>
    <rect x="538" y="312" width="154" height="78" rx="8" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="548" y="342" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">ELv2 非 OSI 开源</text>
    <rect x="700" y="312" width="154" height="78" rx="8" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="710" y="342" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">被收购计划进行中</text>
    <rect x="30" y="400" width="174" height="78" rx="10" fill="#6b5bd2"/>
    <text x="117" y="436" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">自建管道</text>
    <text x="117" y="458" font-size="11" fill="#eef4f7" font-weight="normal" text-anchor="middle">代表方案见正文</text>
    <rect x="214" y="400" width="154" height="78" rx="8" fill="#ffffff" stroke="#6b5bd2" stroke-width="1.5"/>
    <text x="224" y="430" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">完全自控</text>
    <rect x="376" y="400" width="154" height="78" rx="8" fill="#ffffff" stroke="#6b5bd2" stroke-width="1.5"/>
    <text x="386" y="430" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">复用既有基础设施</text>
    <rect x="538" y="400" width="154" height="78" rx="8" fill="#ffffff" stroke="#6b5bd2" stroke-width="1.5"/>
    <text x="548" y="430" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">取决于自选组件</text>
    <rect x="700" y="400" width="154" height="78" rx="8" fill="#ffffff" stroke="#6b5bd2" stroke-width="1.5"/>
    <text x="710" y="430" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="start">自己就是所有者</text>
  </g>
  <rect x="30" y="488" width="840" height="26" rx="8" fill="#eaf1f7"/>
    <text x="52" y="506" font-size="12" fill="#16324f" font-weight="normal" text-anchor="start">决策顺序：数据能否出境 → 是否已在某生态 → 是否已有 OTel 管道 → 团队规模与预算。第一个「是」就会筛掉大部分候选。</text>
</svg>
