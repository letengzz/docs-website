<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="在线评估的分层采样与打分闭环">
  <title>在线评估</title>
  <rect x="0" y="0" width="900" height="520" fill="#f7fafc"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="24" font-weight="bold" fill="#16324f">在线评估：分层采样与打分闭环</text>
    <text x="30" y="66" font-size="14" fill="#5a6b7b">成本的主体只在「正常流量」那一层，其余各层一律 100% 保留。</text>
    <rect x="30" y="96" width="180" height="300" rx="10" fill="#eaf1f7"/>
    <text x="120" y="124" font-size="14" fill="#16324f" font-weight="bold" text-anchor="middle">线上真实流量</text>
    <rect x="44" y="142" width="152" height="36" rx="6" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="54" y="165" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">报错 / 超时</text>
    <text x="188" y="165" font-size="12" fill="#3fae8c" font-weight="bold" text-anchor="end">100%</text>
    <rect x="44" y="183" width="152" height="36" rx="6" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="54" y="206" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">finish_reason=length</text>
    <text x="188" y="206" font-size="12" fill="#3fae8c" font-weight="bold" text-anchor="end">100%</text>
    <rect x="44" y="224" width="152" height="36" rx="6" fill="#ffffff" stroke="#3fae8c" stroke-width="1.5"/>
    <text x="54" y="247" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">检索 status != hit</text>
    <text x="188" y="247" font-size="12" fill="#3fae8c" font-weight="bold" text-anchor="end">100%</text>
    <rect x="44" y="265" width="152" height="36" rx="6" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="54" y="288" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">负反馈 / 人工标注</text>
    <text x="188" y="288" font-size="12" fill="#c47a2c" font-weight="bold" text-anchor="end">100%</text>
    <rect x="44" y="306" width="152" height="36" rx="6" fill="#ffffff" stroke="#c47a2c" stroke-width="1.5"/>
    <text x="54" y="329" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">延迟超阈值</text>
    <text x="188" y="329" font-size="12" fill="#c47a2c" font-weight="bold" text-anchor="end">50%~100%</text>
    <rect x="44" y="347" width="152" height="36" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="54" y="370" font-size="11.5" fill="#16324f" font-weight="normal" text-anchor="start">正常流量</text>
    <text x="188" y="370" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">1%~5%</text>
    <text x="240" y="246" font-size="20" fill="#8a97a3" font-weight="normal" text-anchor="middle">→</text>
    <rect x="272" y="96" width="190" height="130" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="2"/>
    <text x="367" y="126" font-size="15" fill="#16324f" font-weight="bold" text-anchor="middle">规则型先行</text>
    <text x="367" y="152" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="middle">格式 / 引用存在性 / 长度</text>
    <text x="367" y="174" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="middle">零成本、可复现</text>
    <text x="367" y="200" font-size="11.5" fill="#2d7d9a" font-weight="normal" text-anchor="middle">能表达的一律不用裁判</text>
    <rect x="272" y="240" width="190" height="156" rx="10" fill="#ffffff" stroke="#6b5bd2" stroke-width="2"/>
    <text x="367" y="270" font-size="15" fill="#16324f" font-weight="bold" text-anchor="middle">裁判型收尾</text>
    <text x="367" y="296" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="middle">忠实度 / 相关性 / 有害性</text>
    <text x="367" y="320" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="middle">先用 30~50 条人工锚校准</text>
    <text x="367" y="344" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="middle">固定种子与温度</text>
    <text x="367" y="372" font-size="11.5" fill="#6b5bd2" font-weight="normal" text-anchor="middle">judge_version 必须落盘</text>
    <text x="492" y="170" font-size="20" fill="#8a97a3" font-weight="normal" text-anchor="middle">→</text>
    <rect x="524" y="96" width="346" height="130" rx="10" fill="#ffffff" stroke="#3fae8c" stroke-width="2"/>
    <text x="544" y="126" font-size="15" fill="#16324f" font-weight="bold" text-anchor="start">分数挂回 Trace</text>
    <text x="544" y="152" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">低分样本 → 打开现场 → 看当时的完整上下文</text>
    <text x="544" y="176" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">→ 一键回流为离线样本（带 source_trace_id）</text>
    <text x="544" y="200" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">→ 进入人工标注队列，人是最终结论</text>
    <rect x="524" y="240" width="346" height="156" rx="10" fill="#eaf1f7"/>
    <text x="544" y="268" font-size="14" fill="#16324f" font-weight="bold" text-anchor="start">成本量级感受</text>
    <text x="544" y="294" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">正常流量采样 10% → 3%：裁判花费约降 70%</text>
    <text x="544" y="318" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">payload 保留 90 天 → 14 天：存储约降 85%</text>
    <text x="544" y="348" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="start">先做保留期与采样率，再谈换供应商。</text>
    <text x="544" y="374" font-size="12" fill="#5a6b7b" font-weight="normal" text-anchor="start">评估器从 1 个加到 3 个 = 成本乘三。</text>
  </g>
</svg>
