<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="级联链路与全双工模型的信号流向对比">
  <title>级联链路与全双工模型</title>
  <rect x="0" y="0" width="900" height="520" fill="#f7fafc"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="23" font-weight="bold" fill="#16324f">半双工 vs 全双工：差别不在延迟，在「能不能重叠」</text>
    <text x="30" y="64" font-size="13" fill="#5a6b7b">同样的端到端延迟，重叠能力不同，体感完全不同。</text>

    <text x="30" y="104" font-size="17" font-weight="bold" fill="#2d7d9a">级联链路（半双工）：四段串行，中间只有文本</text>

    <rect x="30" y="122" width="128" height="60" rx="10" fill="#2d7d9a"/>
    <text x="94" y="158" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">VAD</text>

    <rect x="174" y="122" width="128" height="60" rx="10" fill="#3fae8c"/>
    <text x="238" y="158" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">ASR</text>

    <rect x="318" y="122" width="128" height="60" rx="10" fill="#c47a2c"/>
    <text x="382" y="158" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">LLM</text>

    <rect x="462" y="122" width="128" height="60" rx="10" fill="#6b5bd2"/>
    <text x="526" y="158" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">TTS</text>

    <rect x="606" y="122" width="264" height="60" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="624" y="148" font-size="12" fill="#c0392b" font-weight="bold">纯文本连接 — 语气、语速、情绪全丢</text>
    <text x="624" y="168" font-size="12" fill="#16324f">模型说话时无法「听」，也无位置发反馈音</text>

    <text x="30" y="222" font-size="17" font-weight="bold" fill="#3fae8c">全双工模型：两路同时，模型自己决定何时开口</text>

    <rect x="30" y="240" width="180" height="60" rx="10" fill="#3fae8c"/>
    <text x="120" y="276" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">用户音频（持续）</text>

    <rect x="240" y="240" width="300" height="60" rx="10" fill="#2d7d9a"/>
    <text x="390" y="270" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">全双工模型</text>
    <text x="390" y="290" font-size="11" fill="#eaf4f8" text-anchor="middle">Mimi codec + Helium 7B + 内心独白</text>

    <rect x="570" y="240" width="300" height="60" rx="10" fill="#c47a2c"/>
    <text x="720" y="276" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">输出音频（可与输入重叠）</text>

    <rect x="30" y="316" width="410" height="88" rx="10" fill="#ffffff" stroke="#3fae8c" stroke-width="2"/>
    <text x="48" y="342" font-size="14" font-weight="bold" fill="#3fae8c">能做的三件事</text>
    <text x="48" y="366" font-size="12" fill="#16324f">① 重叠对话 · ② 自然打断 · ③ 反馈音（嗯、对）</text>
    <text x="48" y="390" font-size="12" fill="#5a6b7b">Moshi：理论 160ms / 实测约 200ms，Apache-2.0</text>

    <rect x="460" y="316" width="410" height="88" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="478" y="342" font-size="14" font-weight="bold" fill="#c0392b">要接受的三件事</text>
    <text x="478" y="366" font-size="12" fill="#16324f">推理质量低于「好 LLM + 级联」；可控性弱</text>
    <text x="478" y="390" font-size="12" fill="#16324f">Moshi 发布节奏已停滞 —— 当基线，不当生产依赖</text>

    <rect x="30" y="424" width="840" height="78" rx="10" fill="#eaf4f8" stroke="#6b5bd2" stroke-width="2"/>
    <text x="48" y="450" font-size="15" font-weight="bold" fill="#16324f">混合架构：外圈端到端负责自然，内核文本负责质量</text>
    <text x="48" y="474" font-size="12" fill="#16324f">实时模型跑对话循环并负责出声；遇到需要推理或工具的问题，通过函数调用</text>
    <text x="48" y="492" font-size="12" fill="#16324f">派给更强的文本模型，先用填充语拖住对话，结果回来后再注入会话。</text>
  </g>
</svg>
