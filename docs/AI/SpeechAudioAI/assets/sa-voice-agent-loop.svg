<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="语音智能体的会话循环与四个实时指标">
  <title>语音智能体：会话循环、工具调用与四个实时指标</title>
  <rect x="0" y="0" width="900" height="500" fill="#f7fafc"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="23" font-weight="bold" fill="#16324f">语音智能体：任何超过 400ms 的计算都要被盖住</text>
    <text x="30" y="64" font-size="13" fill="#5a6b7b">沉默在电话里会被理解为「断了」——这是它和文本 Agent 的根本差别。</text>

    <text x="30" y="102" font-size="17" font-weight="bold" fill="#16324f">会话循环与工具调用（用填充语盖住等待）</text>

    <rect x="30" y="120" width="168" height="62" rx="10" fill="#2d7d9a"/>
    <text x="114" y="148" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">LISTENING</text>
    <text x="114" y="168" font-size="11" fill="#eaf4f8" text-anchor="middle">收用户语音</text>

    <rect x="214" y="120" width="168" height="62" rx="10" fill="#c47a2c"/>
    <text x="298" y="148" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">THINKING</text>
    <text x="298" y="168" font-size="11" fill="#fdf3e6" text-anchor="middle">生成 / 调工具</text>

    <rect x="398" y="120" width="168" height="62" rx="10" fill="#3fae8c"/>
    <text x="482" y="148" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">SPEAKING</text>
    <text x="482" y="168" font-size="11" fill="#eaf4f8" text-anchor="middle">播放音频</text>

    <rect x="582" y="120" width="288" height="62" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="600" y="146" font-size="12" fill="#c0392b" font-weight="bold">THINKING + user_speech 必须存在</text>
    <text x="600" y="168" font-size="12" fill="#16324f">否则生成的音频会在稍后突然开播</text>

    <rect x="30" y="200" width="410" height="94" rx="10" fill="#fdf3e6" stroke="#c47a2c" stroke-width="2"/>
    <text x="48" y="226" font-size="14" font-weight="bold" fill="#c47a2c">工具调用不冻结对话的四种做法</text>
    <text x="48" y="250" font-size="12" fill="#16324f">① 同步阻塞（最差）  ② 填充语前置（最实用）</text>
    <text x="48" y="272" font-size="12" fill="#16324f">③ 异步函数调用（Gemini Live 原生支持）</text>
    <text x="48" y="290" font-size="12" fill="#16324f">④ 结果注入会话后再播报</text>

    <rect x="460" y="200" width="410" height="94" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="1.5"/>
    <text x="478" y="226" font-size="14" font-weight="bold" fill="#2d7d9a">填充语的选择</text>
    <text x="478" y="250" font-size="12" fill="#16324f">查数据 &lt; 3s：「好的，我看一下」（备 3~5 条轮换）</text>
    <text x="478" y="272" font-size="12" fill="#16324f">&gt; 8s：必须给进度，否则用户会挂断</text>
    <text x="478" y="290" font-size="12" fill="#c0392b">敏感操作（转账/改单）不要填充，改用确认</text>

    <text x="30" y="332" font-size="17" font-weight="bold" fill="#16324f">四个实时专属指标（通用指标在这里都不够用）</text>

    <rect x="30" y="350" width="198" height="130" rx="10" fill="#ffffff" stroke="#2d7d9a" stroke-width="2"/>
    <text x="129" y="378" font-size="14" font-weight="bold" fill="#2d7d9a" text-anchor="middle">首包延迟</text>
    <text x="129" y="404" font-size="12" fill="#16324f" text-anchor="middle">用户说完 → 听到第一个音</text>
    <text x="129" y="430" font-size="12" fill="#3fae8c" text-anchor="middle">P50 &lt; 700ms</text>
    <text x="129" y="452" font-size="12" fill="#3fae8c" text-anchor="middle">P95 &lt; 1.2s</text>
    <text x="129" y="472" font-size="11" fill="#5a6b7b" text-anchor="middle">盯尾部，不看平均</text>

    <rect x="240" y="350" width="198" height="130" rx="10" fill="#ffffff" stroke="#3fae8c" stroke-width="2"/>
    <text x="339" y="378" font-size="14" font-weight="bold" fill="#3fae8c" text-anchor="middle">打断成功率</text>
    <text x="339" y="404" font-size="12" fill="#16324f" text-anchor="middle">开口后 250ms 内停止</text>
    <text x="339" y="430" font-size="12" fill="#3fae8c" text-anchor="middle">&gt; 95%</text>
    <text x="339" y="452" font-size="12" fill="#16324f" text-anchor="middle">打断失败不是「错误」</text>
    <text x="339" y="472" font-size="11" fill="#5a6b7b" text-anchor="middle">所以成功率查不出来</text>

    <rect x="450" y="350" width="198" height="130" rx="10" fill="#ffffff" stroke="#c47a2c" stroke-width="2"/>
    <text x="549" y="378" font-size="14" font-weight="bold" fill="#c47a2c" text-anchor="middle">端点误判率</text>
    <text x="549" y="404" font-size="12" fill="#16324f" text-anchor="middle">判早（抢话）+ 判晚</text>
    <text x="549" y="430" font-size="12" fill="#3fae8c" text-anchor="middle">抢话率 &lt; 3%</text>
    <text x="549" y="452" font-size="12" fill="#16324f" text-anchor="middle">用回滚窗口触发率近似</text>
    <text x="549" y="472" font-size="11" fill="#5a6b7b" text-anchor="middle">最伤体验，却无错误日志</text>

    <rect x="660" y="350" width="210" height="130" rx="10" fill="#ffffff" stroke="#6b5bd2" stroke-width="2"/>
    <text x="765" y="378" font-size="14" font-weight="bold" fill="#6b5bd2" text-anchor="middle">挂断率 / 会话时长</text>
    <text x="765" y="404" font-size="12" fill="#16324f" text-anchor="middle">用户主动结束的比例</text>
    <text x="765" y="430" font-size="12" fill="#3fae8c" text-anchor="middle">按业务建基线</text>
    <text x="765" y="452" font-size="12" fill="#16324f" text-anchor="middle">唯一与业务直接挂钩</text>
    <text x="765" y="472" font-size="11" fill="#5a6b7b" text-anchor="middle">按分布看，不按平均</text>
  </g>
</svg>
