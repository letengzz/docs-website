<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="382" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">多模态问题排查决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三类问题的排查路径完全不同，第一步是分对类</text>
  <rect x="300" y="76" width="160" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">多模态出问题</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类再动手</text>
  <line x1="380" y1="132" x2="130" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="168" width="220" height="116" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="130" y="186.2" text-anchor="middle" font-size="9.8" fill="#991B1B" font-weight="bold">起不来 / 直接报错</text>
  <text x="130" y="203" text-anchor="middle" font-size="8" fill="#B91C1C">① ffmpeg / ffprobe 能否跑</text>
  <text x="130" y="221.4" text-anchor="middle" font-size="8" fill="#B91C1C">② CUDA 与轮子版本是否匹配</text>
  <text x="130" y="239.8" text-anchor="middle" font-size="8" fill="#B91C1C">③ max-model-len 是否过大</text>
  <text x="130" y="258.2" text-anchor="middle" font-size="8" fill="#B91C1C">④ 是否多 worker 各占一份显存</text>
  <line x1="380" y1="132" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="168" width="220" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="9.8" fill="#92400E" font-weight="bold">结果不准 / 内容乱</text>
  <text x="380" y="203" text-anchor="middle" font-size="8" fill="#B45309">① 方向校正与长边是否设对</text>
  <text x="380" y="221.4" text-anchor="middle" font-size="8" fill="#B45309">② 音频是否归一 16 kHz</text>
  <text x="380" y="239.8" text-anchor="middle" font-size="8" fill="#B45309">③ 结构性任务是否误用 VLM</text>
  <text x="380" y="258.2" text-anchor="middle" font-size="8" fill="#B45309">④ 是否缺热词表或后处理</text>
  <line x1="380" y1="132" x2="630" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="520" y="168" width="220" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="630" y="186.2" text-anchor="middle" font-size="9.8" fill="#5B21B6" font-weight="bold">请求成功但内容错</text>
  <text x="630" y="203" text-anchor="middle" font-size="8" fill="#6D28D9">① 非空校验是否做了</text>
  <text x="630" y="221.4" text-anchor="middle" font-size="8" fill="#6D28D9">② 重复循环是否检测</text>
  <text x="630" y="239.8" text-anchor="middle" font-size="8" fill="#6D28D9">③ 完整性校验是否做了</text>
  <text x="630" y="258.2" text-anchor="middle" font-size="8" fill="#6D28D9">③ 业务规则是否复核</text>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#1E3A8A">通用顺序：确认现象 → 最小复现 → 三段二分（预处理 / 模型 / 后处理）→ 回归验证</text>
  <text x="380" y="338" text-anchor="middle" font-size="9.5" fill="#B91C1C">最贵的三个动作：一上来换更大的模型 · 同时改多个参数 · 只看「请求成功」</text>
  <text x="380" y="364" text-anchor="middle" font-size="9.5" fill="#334155">最有效的三个动作：固定输入做最小复现 · 分开统计预处理与推理耗时 · 拿完整样本从头看一遍</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
