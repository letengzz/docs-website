<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">语音链路：级联式与端到端，以及延迟预算怎么分</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">VAD → ASR → LLM → TTS 四段各自独立，延迟也必须按段预算</text>
  <rect x="24" y="80" width="110" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="79" y="98.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">音频输入</text>
  <text x="79" y="115" text-anchor="middle" font-size="7.5" fill="#334155">任意格式</text>
  <line x1="134" y1="113" x2="142" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="142" y="80" width="110" height="66" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="197" y="98.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">VAD</text>
  <text x="197" y="115" text-anchor="middle" font-size="7.5" fill="#0E7490">去静音</text>
  <text x="197" y="132.25" text-anchor="middle" font-size="7.5" fill="#0E7490">抑制幻觉</text>
  <line x1="252" y1="113" x2="260" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="260" y="80" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="315" y="98.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">ASR</text>
  <text x="315" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">语音转文字</text>
  <text x="315" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">带时间戳</text>
  <line x1="370" y1="113" x2="378" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="378" y="80" width="110" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="433" y="98.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">LLM</text>
  <text x="433" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">理解与生成</text>
  <line x1="488" y1="113" x2="496" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="496" y="80" width="110" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="551" y="98.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">TTS</text>
  <text x="551" y="115" text-anchor="middle" font-size="7.5" fill="#047857">文字转语音</text>
  <line x1="606" y1="113" x2="614" y2="113" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="614" y="80" width="110" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="669" y="98.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">音频输出</text>
  <text x="669" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">流式播放</text>
  <text x="380" y="166" text-anchor="middle" font-size="8.5" fill="#1E3A8A">级联式：每段可替换、可观测、可本地化；代价是延迟叠加与误差逐级放大</text>
  <rect x="24" y="182" width="200" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="124" y="200.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">音频输入</text>
  <text x="124" y="217" text-anchor="middle" font-size="7.5" fill="#334155">一个麦克风流</text>
  <rect x="248" y="182" width="264" height="62" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="380" y="200.2" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">端到端语音模型</text>
  <text x="380" y="217" text-anchor="middle" font-size="7.5" fill="#BE185D">直接吃音频、吐音频</text>
  <rect x="536" y="182" width="200" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="636" y="200.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">音频输出</text>
  <text x="636" y="217" text-anchor="middle" font-size="7.5" fill="#0F766E">延迟最低</text>
  <line x1="224" y1="205" x2="248" y2="205" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="512" y1="205" x2="536" y2="205" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="536" y1="226" x2="512" y2="226" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="262" text-anchor="middle" font-size="8.5" fill="#9D174D">端到端：延迟低、能捕捉语气；代价是私有化难、贵、可控性弱</text>
  <text x="60" y="292" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">延迟预算（目标端到端 &lt; 800 ms）</text>
  <rect x="30" y="304" width="150" height="22" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="105" y="319" text-anchor="middle" font-size="8.5" fill="#155E75" font-weight="bold">VAD 判定</text>
  <rect x="190" y="304" width="120" height="22" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="250" y="319" text-anchor="middle" font-size="8.5" fill="#0E7490">100~200 ms</text>
  <text x="324" y="319" text-anchor="start" font-size="8.5" fill="#334155">阈值别太保守，宁可早切</text>
  <rect x="30" y="332" width="150" height="22" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="105" y="347" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">ASR</text>
  <rect x="190" y="332" width="120" height="22" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="250" y="347" text-anchor="middle" font-size="8.5" fill="#1D4ED8">100~300 ms</text>
  <text x="324" y="347" text-anchor="start" font-size="8.5" fill="#334155">流式识别，小模型优先</text>
  <rect x="30" y="360" width="150" height="22" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="105" y="375" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">LLM 首 token</text>
  <rect x="190" y="360" width="120" height="22" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="250" y="375" text-anchor="middle" font-size="8.5" fill="#6D28D9">100~300 ms</text>
  <text x="324" y="375" text-anchor="start" font-size="8.5" fill="#334155">第一个 token 就走 TTS</text>
  <rect x="30" y="388" width="150" height="22" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="105" y="403" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">TTS 首包</text>
  <rect x="190" y="388" width="120" height="22" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="250" y="403" text-anchor="middle" font-size="8.5" fill="#047857">100~200 ms</text>
  <text x="324" y="403" text-anchor="start" font-size="8.5" fill="#334155">选原生流式模型</text>
  <text x="380" y="436" text-anchor="middle" font-size="9.5" fill="#B91C1C">只优化其中一段，总延迟改善往往不到 10%——四条加起来才是体验</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
