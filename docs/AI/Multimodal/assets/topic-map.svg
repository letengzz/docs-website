  <rect x="130" y="80" width="200" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="230" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">多模态应用概述</text>
  <text x="230" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">概念、模态矩阵与三条路线</text>
  <rect x="430" y="80" width="200" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="530" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">环境搭建</text>
  <text x="530" y="115" text-anchor="middle" font-size="7.5" fill="#334155">CUDA / FFmpeg / 显存规划</text>
  <line x1="330" y1="106" x2="430" y2="106" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="530" y1="132" x2="530" y2="160" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="95" y1="160" x2="665" y2="160" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="95" y1="160" x2="95" y2="175" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="285" y1="160" x2="285" y2="175" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="475" y1="160" x2="475" y2="175" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="665" y1="160" x2="665" y2="175" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="175" width="170" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="95" y="193.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">图像与文档理解</text>
  <text x="95" y="210" text-anchor="middle" font-size="7.5" fill="#1D4ED8">VLM 问答 / OCR</text>
  <text x="95" y="227.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">版面解析与结构化</text>
  <rect x="200" y="175" width="170" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="285" y="193.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">语音处理</text>
  <text x="285" y="210" text-anchor="middle" font-size="7.5" fill="#047857">VAD / ASR / TTS</text>
  <text x="285" y="227.25" text-anchor="middle" font-size="7.5" fill="#047857">级联式语音对话</text>
  <rect x="390" y="175" width="170" height="70" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="475" y="193.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">视频处理</text>
  <text x="475" y="210" text-anchor="middle" font-size="7.5" fill="#0E7490">抽帧与关键帧</text>
  <text x="475" y="227.25" text-anchor="middle" font-size="7.5" fill="#0E7490">时间戳对齐、摘要</text>
  <rect x="580" y="175" width="170" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="665" y="193.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">模型接入与选型</text>
  <text x="665" y="210" text-anchor="middle" font-size="7.5" fill="#B45309">云 API / vLLM</text>
  <text x="665" y="227.25" text-anchor="middle" font-size="7.5" fill="#B45309">本地 Ollama</text>
  <line x1="95" y1="245" x2="95" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="285" y1="245" x2="285" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="475" y1="245" x2="475" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>
