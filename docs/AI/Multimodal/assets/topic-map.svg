  <line x1="95" y1="272" x2="665" y2="272" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="380" y1="272" x2="380" y2="300" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="500" y="267" text-anchor="middle" font-size="7.5" fill="#64748B">按业务选 1~2 条链路深入</text>
  <rect x="180" y="300" width="400" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="318.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">实战：图片问答 + 语音转写服务</text>
  <text x="380" y="335" text-anchor="middle" font-size="7.5" fill="#4338CA">用 FastAPI 把两条链路合成一个可运行的服务</text>
  <line x1="380" y1="354" x2="380" y2="395" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="500" y="378" text-anchor="middle" font-size="7.5" fill="#64748B">效果不稳先看这里</text>
  <rect x="180" y="395" width="400" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="413.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">常见问题与最佳实践</text>
  <text x="380" y="430" text-anchor="middle" font-size="7.5" fill="#B91C1C">识别不准 · 显存爆 · 延迟高 · 幻觉与合规</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
