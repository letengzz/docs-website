<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">多模态环境的四层结构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">自下而上装，自上而下查；最底层出问题时表现最诡异</text>
  <rect x="30" y="84" width="118" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="89" y="102.2" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">系统层</text>
  <rect x="160" y="84" width="570" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="445" y="102" text-anchor="middle" font-size="8.2" fill="#B91C1C">FFmpeg / ffprobe：解码、抽帧、重采样的地基</text>
  <text x="445" y="120.86" text-anchor="middle" font-size="8.2" fill="#B91C1C">缺了它 → 多模态模型可能启动即卡死</text>
  <line x1="380" y1="138" x2="380" y2="152" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="152" width="118" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="89" y="170.2" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="bold">驱动层</text>
  <rect x="160" y="152" width="570" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="445" y="170" text-anchor="middle" font-size="8.2" fill="#B45309">NVIDIA 驱动 + CUDA Runtime：决定能用的 CUDA 上限</text>
  <text x="445" y="188.86" text-anchor="middle" font-size="8.2" fill="#B45309">轮子的 CUDA 版本不能高于驱动支持上限</text>
  <line x1="380" y1="206" x2="380" y2="220" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="220" width="118" height="54" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="89" y="238.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">运行时层</text>
  <rect x="160" y="220" width="570" height="54" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="445" y="238" text-anchor="middle" font-size="8.2" fill="#6D28D9">Python 3.11~3.13 + 独立虚拟环境（venv / conda）</text>
  <text x="445" y="256.86" text-anchor="middle" font-size="8.2" fill="#6D28D9">依赖体积大，不要污染系统 Python</text>
  <line x1="380" y1="274" x2="380" y2="288" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="288" width="118" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="89" y="306.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">框架层</text>
  <rect x="160" y="288" width="570" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="445" y="306" text-anchor="middle" font-size="8.2" fill="#047857">PyTorch / transformers / faster-whisper / FastAPI</text>
  <text x="445" y="324.86" text-anchor="middle" font-size="8.2" fill="#047857">版本矩阵不匹配 → 能 import 但一跑就崩</text>
  <text x="380" y="372" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">自检顺序：ffmpeg → nvidia-smi → torch.cuda.is_available() → 环境自检脚本</text>
  <text x="380" y="394" text-anchor="middle" font-size="9" fill="#B91C1C">四层里最常被忽略的是系统层：它不是 Python 包，装不上也报不出清晰的错</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
