<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">模型接入的三种形态与选型四维度</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选型的第一个问题不是「哪个模型强」，而是「数据能不能出网」</text>
  <rect x="30" y="76" width="222" height="152" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="141" y="94.2" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">云端 API</text>
  <text x="141" y="111" text-anchor="middle" font-size="8.4" fill="#1D4ED8">数据出网</text>
  <text x="141" y="130.32" text-anchor="middle" font-size="8.4" fill="#1D4ED8">起步成本≈0</text>
  <text x="141" y="149.64" text-anchor="middle" font-size="8.4" fill="#1D4ED8">旗舰模型可用</text>
  <text x="141" y="168.96" text-anchor="middle" font-size="8.4" fill="#1D4ED8">按 token 计费</text>
  <text x="141" y="188.28" text-anchor="middle" font-size="8.4" fill="#1D4ED8">适合：验证期与波动负载</text>
  <rect x="269" y="76" width="222" height="152" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">自托管 vLLM</text>
  <text x="380" y="111" text-anchor="middle" font-size="8.4" fill="#6D28D9">数据不出内网</text>
  <text x="380" y="130.32" text-anchor="middle" font-size="8.4" fill="#6D28D9">固定硬件成本</text>
  <text x="380" y="149.64" text-anchor="middle" font-size="8.4" fill="#6D28D9">受显存限制</text>
  <text x="380" y="168.96" text-anchor="middle" font-size="8.4" fill="#6D28D9">运维负担高</text>
  <text x="380" y="188.28" text-anchor="middle" font-size="8.4" fill="#6D28D9">适合：稳定量 + 强合规</text>
  <rect x="508" y="76" width="222" height="152" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="94.2" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">本地 Ollama</text>
  <text x="619" y="111" text-anchor="middle" font-size="8.4" fill="#047857">数据不出本机</text>
  <text x="619" y="130.32" text-anchor="middle" font-size="8.4" fill="#047857">一台开发机即可</text>
  <text x="619" y="149.64" text-anchor="middle" font-size="8.4" fill="#047857">2B~30B 级模型</text>
  <text x="619" y="168.96" text-anchor="middle" font-size="8.4" fill="#047857">运维负担低</text>
  <text x="619" y="188.28" text-anchor="middle" font-size="8.4" fill="#047857">适合：内网小工具与调试</text>
  <text x="380" y="250" text-anchor="middle" font-size="10.5" fill="#0F172A" font-weight="bold">选型四维度：按业务约束倒推，而不是按模型排行榜正推</text>
  <rect x="30" y="264" width="148" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="104" y="280" text-anchor="middle" font-size="8.8" fill="#1E293B" font-weight="bold">数据合规</text>
  <rect x="190" y="264" width="540" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="206" y="280" text-anchor="start" font-size="8.5" fill="#334155">严禁出网 → 自托管或本地；可出网 → 再比成本</text>
  <rect x="30" y="294" width="148" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="104" y="310" text-anchor="middle" font-size="8.8" fill="#1E293B" font-weight="bold">请求量级</text>
  <rect x="190" y="294" width="540" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="206" y="310" text-anchor="start" font-size="8.5" fill="#334155">量小先用云 API，等账单覆盖硬件成本再迁自托管</text>
  <rect x="30" y="324" width="148" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="104" y="340" text-anchor="middle" font-size="8.8" fill="#1E293B" font-weight="bold">延迟要求</text>
  <rect x="190" y="324" width="540" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="206" y="340" text-anchor="start" font-size="8.5" fill="#334155">实时对话优先端到端或就近自托管</text>
  <rect x="30" y="354" width="148" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="104" y="370" text-anchor="middle" font-size="8.8" fill="#1E293B" font-weight="bold">运维能力</text>
  <rect x="190" y="354" width="540" height="24" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="206" y="370" text-anchor="start" font-size="8.5" fill="#334155">没有 GPU 运维人力时，自托管的隐性成本会被低估</text>
  <text x="380" y="400" text-anchor="middle" font-size="9.5" fill="#4F46E5">三者的公共接口都是 OpenAI 兼容协议——业务代码只依赖协议，换后端只改配置</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
