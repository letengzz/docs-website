<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="480" height="480" fill="#FFFFFF"/>
  <rect x="40" y="40" width="400" height="400" rx="48" fill="#F5F3FF" stroke="#7C3AED" stroke-width="4"/>

  <!-- 图像：太阳 + 山 -->
