  <!-- 文档：文本行 -->
  <rect x="250" y="250" width="150" height="150" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <rect x="288" y="286" width="90" height="80" rx="8" fill="none" stroke="#059669" stroke-width="3"/>
  <line x1="302" y1="312" x2="364" y2="312" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <line x1="302" y1="330" x2="364" y2="330" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <line x1="302" y1="348" x2="338" y2="348" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

  <!-- 中心：融合 -->
  <circle cx="240" cy="240" r="44" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
  <path d="M240,212 L249,231 L268,240 L249,249 L240,268 L231,249 L212,240 L231,231 Z" fill="#7C3AED"/>
