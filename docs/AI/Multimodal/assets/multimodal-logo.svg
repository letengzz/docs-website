  <circle cx="170" cy="124" r="10" fill="#2563EB"/>
  <path d="M98,196 L132,150 L160,180 L188,140 L212,196 Z" fill="#2563EB" opacity="0.85"/>

  <!-- 语音：波形条 -->
  <rect x="250" y="80" width="150" height="150" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5"/>
  <rect x="277" y="160" width="14" height="30" rx="7" fill="#0D9488"/>
  <rect x="301" y="130" width="14" height="60" rx="7" fill="#0D9488"/>
  <rect x="325" y="100" width="14" height="90" rx="7" fill="#0D9488"/>
  <rect x="349" y="130" width="14" height="60" rx="7" fill="#0D9488"/>
  <rect x="373" y="160" width="14" height="30" rx="7" fill="#0D9488"/>

  <!-- 视频：播放三角 -->
  <rect x="80" y="250" width="150" height="150" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <path d="M138,290 L188,325 L138,360 Z" fill="#EA580C"/>
  <rect x="100" y="300" width="16" height="50" rx="4" fill="#EA580C" opacity="0.55"/>
