<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="422" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">图像与文档理解的三条路线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一张图，路线不同，准确率、成本与可调性完全不同</text>
  <rect x="30" y="80" width="108" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="84" y="98.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">路线 A</text>
  <text x="84" y="120" text-anchor="middle" font-size="7" fill="#1D4ED8">原生 VLM</text>
  <rect x="152" y="80" width="108" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="206" y="98.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">图像</text>
  <line x1="260" y1="111" x2="269" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="269" y="80" width="108" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="323" y="98.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">视觉编码</text>
  <line x1="377" y1="111" x2="386" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="80" width="108" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="440" y="98.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">语义推理</text>
  <line x1="494" y1="111" x2="503" y2="111" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="503" y="80" width="108" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="557" y="98.2" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">文本答案</text>
  <text x="380" y="158" text-anchor="middle" font-size="8.5" fill="#1E3A8A">集成最简，但单位成本高、可控性弱；适合通用问答与描述</text>
  <rect x="30" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="84" y="194.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">路线 B</text>
  <text x="84" y="216" text-anchor="middle" font-size="7" fill="#047857">流水线式</text>
  <rect x="152" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="206" y="194.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">页面</text>
  <line x1="260" y1="207" x2="269" y2="207" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="269" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="323" y="194.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">版面检测</text>
  <line x1="377" y1="207" x2="386" y2="207" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="440" y="194.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">分块裁切</text>
  <line x1="494" y1="207" x2="503" y2="207" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="503" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="557" y="194.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">逐块识别</text>
  <line x1="611" y1="207" x2="620" y2="207" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="620" y="176" width="108" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="674" y="194.2" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">合并输出</text>
  <text x="380" y="254" text-anchor="middle" font-size="8.5" fill="#065F46">每步可单独调，短输出不易跑偏；代价是跨页上下文会丢失</text>
  <rect x="30" y="272" width="108" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="84" y="290.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">路线 C</text>
  <text x="84" y="312" text-anchor="middle" font-size="7" fill="#6D28D9">端到端</text>
  <rect x="152" y="272" width="108" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="206" y="290.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">整页图</text>
  <line x1="260" y1="303" x2="269" y2="303" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="269" y="272" width="108" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="323" y="290.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">文档 VLM</text>
  <line x1="377" y1="303" x2="386" y2="303" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="272" width="108" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="440" y="290.2" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">Markdown</text>
  <text x="380" y="350" text-anchor="middle" font-size="8.5" fill="#5B21B6">部署最简单，但对表格弱、会幻觉：出错时往往「通顺但不对」</text>
  <text x="380" y="382" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">选择口径：结构规整选 B，版式混乱选 C，通用问答选 A</text>
  <text x="380" y="404" text-anchor="middle" font-size="9" fill="#475569">共同前提：任何路线之前都要先做方向校正与限长边</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
