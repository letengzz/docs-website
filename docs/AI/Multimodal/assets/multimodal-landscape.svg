<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="436" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">多模态应用全景：四类模态、四层结构与落地面</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">从原始信号到可用结果，中间每一步都有可替换、可单独优化的环节</text>
  <rect x="25" y="76" width="170" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="94.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">图像</text>
  <text x="110" y="111" text-anchor="middle" font-size="8" fill="#1D4ED8">图像问答 / 描述</text>
  <text x="110" y="129.4" text-anchor="middle" font-size="8" fill="#1D4ED8">OCR / 版面解析</text>
  <line x1="110" y1="138" x2="110" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="205" y="76" width="170" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="290" y="94.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">语音</text>
  <text x="290" y="111" text-anchor="middle" font-size="8" fill="#0F766E">VAD / ASR / TTS</text>
  <text x="290" y="129.4" text-anchor="middle" font-size="8" fill="#0F766E">实时语音对话</text>
  <line x1="290" y1="138" x2="290" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="385" y="76" width="170" height="62" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="470" y="94.2" text-anchor="middle" font-size="10.5" fill="#9A3412" font-weight="bold">视频</text>
  <text x="470" y="111" text-anchor="middle" font-size="8" fill="#C2410C">抽帧 / 关键帧</text>
  <text x="470" y="129.4" text-anchor="middle" font-size="8" fill="#C2410C">时间戳对齐 / 摘要</text>
  <line x1="470" y1="138" x2="470" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="565" y="76" width="170" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="650" y="94.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">文档</text>
  <text x="650" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">版面检测 / 表格</text>
  <text x="650" y="129.4" text-anchor="middle" font-size="8" fill="#6D28D9">票据与档案抽取</text>
  <line x1="650" y1="138" x2="650" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="25" y="160" width="710" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="178" text-anchor="middle" font-size="9" fill="#065F46">预处理与归一化：方向校正 · 限长边 · 16 kHz 单声道 · 场景切分</text>
  <text x="380" y="194" text-anchor="middle" font-size="8" fill="#047857">这一步决定效果上限，收益通常大于换模型</text>
  <line x1="380" y1="204" x2="380" y2="224" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="25" y="224" width="710" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="242" text-anchor="middle" font-size="9" fill="#5B21B6">模型层：原生 VLM · 专用 OCR / ASR · 文档 VLM · 端到端语音</text>
  <text x="380" y="258" text-anchor="middle" font-size="8" fill="#6D28D9">看清与看懂是两个问题，交给不同的模型</text>
  <line x1="380" y1="268" x2="380" y2="288" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="25" y="288" width="710" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="306" text-anchor="middle" font-size="9" fill="#1E3A8A">接入层：云端 API ｜ 自托管 vLLM ｜ 本地 Ollama</text>
  <text x="380" y="322" text-anchor="middle" font-size="8" fill="#1D4ED8">三者统一走 OpenAI 兼容协议，业务代码只依赖协议</text>
  <line x1="380" y1="332" x2="380" y2="352" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="25" y="352" width="226" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="138" y="370.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">文档流水线</text>
  <text x="138" y="387" text-anchor="middle" font-size="8" fill="#047857">批量入库 / 抽取</text>
  <rect x="267" y="352" width="226" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="370.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">语音助手</text>
  <text x="380" y="387" text-anchor="middle" font-size="8" fill="#0F766E">转写 / 实时对话</text>
  <rect x="509" y="352" width="226" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="622" y="370.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">视频理解</text>
  <text x="622" y="387" text-anchor="middle" font-size="8" fill="#B45309">摘要 / 事件定位</text>
  <text x="380" y="420" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">记住三条省钱口诀：图像靠裁 · 音频靠切 · 视频靠抽帧</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
