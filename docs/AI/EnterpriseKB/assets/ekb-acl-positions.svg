<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="权限过滤施加位置对比：索引前裁剪、检索时过滤、生成后过滤；以及预过滤与后过滤的精度差别">
  <title>权限过滤的三个施加位置与预 / 后过滤的差别</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">权限过滤的三个施加位置与预 / 后过滤的差别</text>
  <rect x="30" y="76" width="272" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="104" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">① 索引前裁剪</text>
  <text x="48" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">每个用户一份索引</text>
  <text x="48" y="156" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">❌ 不现实</text>
  <text x="48" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">索引数 = 用户数；权限一变全部重建</text>
  <rect x="316" y="76" width="272" height="118" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="334" y="104" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3" text-anchor="start">② 检索时过滤</text>
  <text x="334" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">条件随查询下发，取回前排掉</text>
  <text x="334" y="156" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="start">✅ 唯一正确</text>
  <text x="334" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">越权内容从不进入候选集</text>
  <rect x="602" y="76" width="272" height="118" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="620" y="104" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">③ 生成后过滤</text>
  <text x="620" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">先读全部，再检查 / 删改答案</text>
  <text x="620" y="156" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">❌ 不成立</text>
  <text x="620" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">改述、概括、编号引用都能带出信息</text>
  <text x="32" y="232" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">同样在「检索时」，实现方式还有两种——差别只在引擎的哪一侧过滤：</text>
  <rect x="30" y="248" width="400" height="200" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="52" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">预过滤（pre-filter）</text>
  <text x="52" y="302" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">先缩小候选集，再在候选集里做 ANN 检索</text>
  <text x="52" y="328" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="start">选择性 1% 时：top_20 仍返回 20 条可见</text>
  <text x="52" y="352" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">代价：候选集小 → 图遍历可走的路变少</text>
  <text x="52" y="376" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">极端情况下退化为暴力扫描</text>
  <text x="52" y="410" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">✅ 精度可控，是生产默认选择</text>
  <text x="52" y="432" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">推荐：权限字段建成可下推的过滤类型</text>
  <rect x="470" y="248" width="400" height="200" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="492" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">后过滤（post-filter）</text>
  <text x="492" y="302" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">先 ANN 取回 top_k，再按条件丢掉不可见的</text>
  <text x="492" y="328" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="start">选择性 1% 时：约 0.2 条 → 五次四次为空</text>
  <text x="492" y="352" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">代价：无需索引侧支持，实现最简单</text>
  <text x="492" y="376" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">危险：「查不到」与「本来就没有」同形</text>
  <text x="492" y="410" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">⚠️ 只适合选择性接近 100% 的场景</text>
  <text x="492" y="432" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">推荐：把 top_k 调多大都救不回来</text>
  <text x="32" y="484" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">判读纪律：管理员能答、受限账号答不出、且源文档确实对其可见 → 这是权限缺陷，不是「他没权限」。</text>
</svg>
