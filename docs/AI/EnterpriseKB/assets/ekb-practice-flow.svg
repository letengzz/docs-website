<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="企业知识库落地七步流程与 EKB 判据">
  <title>实战七步：给一家公司立起合规的企业知识库</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">实战七步：给一家公司立起合规的企业知识库</text>
  <rect x="30" y="76" width="840" height="54" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="46" y="99" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">第 1 步</text>
  <text x="130" y="99" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">定场景与权限盘点</text>
  <text x="130" y="119" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">抽 30 份文档确认「谁能打开」</text>
  <text x="700" y="110" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f766e" text-anchor="start">边界是否成立</text>
  <rect x="30" y="136" width="840" height="54" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="46" y="159" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">第 2 步</text>
  <text x="130" y="159" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">接一个源 + 权限随 chunk</text>
  <text x="130" y="179" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">选权限边界最清楚的 wiki</text>
  <text x="700" y="170" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f766e" text-anchor="start">ACL-1 ~ ACL-3</text>
  <rect x="30" y="196" width="840" height="54" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="46" y="219" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">第 3 步</text>
  <text x="130" y="219" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">跑一次越权测试</text>
  <text x="130" y="239" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">受限账号问另一个部门的问题</text>
  <text x="700" y="230" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f766e" text-anchor="start">越权召回 = 0</text>
  <rect x="30" y="256" width="840" height="54" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="46" y="279" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">第 4 步</text>
  <text x="130" y="279" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">补删除与权限传播</text>
  <text x="130" y="299" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">删文档 / 改权限，测量生效时延</text>
  <text x="700" y="290" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">能报出分钟数</text>
  <rect x="30" y="316" width="840" height="54" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="46" y="339" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">第 5 步</text>
  <text x="130" y="339" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">建三类题集</text>
  <text x="130" y="359" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">该答 / 不该答 / 库里没有</text>
  <text x="700" y="350" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">B 类 ≥ 20 条</text>
  <rect x="30" y="376" width="840" height="54" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="46" y="399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">第 6 步</text>
  <text x="130" y="399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">接权限门禁与留痕</text>
  <text x="130" y="419" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">越权召回 ≥ 1 即阻断</text>
  <text x="700" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="start">ACL-4 ~ ACL-7</text>
  <rect x="30" y="436" width="840" height="54" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="46" y="459" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="start">第 7 步</text>
  <text x="130" y="459" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">运营与例行巡检</text>
  <text x="130" y="479" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">bad case 分诊 + 每周评估</text>
  <text x="700" y="470" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#3730a3" text-anchor="start">EKB-A ~ EKB-H</text>
  <text x="32" y="506" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">七步的共同纪律：每一步都有「可判定的通过标准」，不通过就不进下一步 —— 覆盖面永远是最后扩的。</text>
  <text x="32" y="528" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">最不该跳的是第 3 步：越权测试只需要一次手工请求，成本最低，却拦住了最严重的那个默认行为。</text>
</svg>
