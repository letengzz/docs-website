<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="企业知识库问题分诊：按现象定位到对应页面">
  <title>企业知识库问题分诊：按现象定位到页</title>
  <rect x="0" y="0" width="900" height="480" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">问题分诊：先看现象，再看证据</text>
  <text x="32" y="66" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">查询顺序很重要 —— 先查权限与语料，再查检索与生成。</text>
  <rect x="30" y="86" width="840" height="56" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="50" y="111" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">看到不该看的</text>
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">服务身份 / 单路召回 / 缓存键</text>
  <text x="700" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">权限隔离</text>
  <rect x="30" y="148" width="840" height="56" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="50" y="173" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">该看的看不到</text>
  <text x="50" y="192" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">后过滤选择性 / 组未展开 / 过滤过严</text>
  <text x="700" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">权限隔离 · 评估</text>
  <rect x="30" y="210" width="840" height="56" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="50" y="235" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">内容过期或已下架</text>
  <text x="50" y="254" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">增量不同步 / 删除未传播 / 无责任人</text>
  <text x="700" y="244" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">数据治理与审计</text>
  <rect x="30" y="272" width="840" height="56" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="50" y="297" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">明明有却找不到</text>
  <text x="50" y="316" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">解析静默丢内容 / 切分跨权限域</text>
  <text x="700" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1">接入与解析</text>
  <rect x="30" y="334" width="840" height="56" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="50" y="359" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">答得对但不可信</text>
  <text x="50" y="378" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">忠实复述了作废口径</text>
  <text x="700" y="368" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f766e">问答评估（第三类指标）</text>
  <rect x="30" y="396" width="840" height="56" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="50" y="421" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#5b21b6">系统没人用</text>
  <text x="50" y="440" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">过度拒答 / 漏权</text>
  <text x="700" y="430" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">运营与迭代</text>
  <text x="32" y="468" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#b91c1c">判读纪律：现象「看不到」既可能是漏权也可能是被过滤 —— 两者在界面上长得一样，要靠用例区分。</text>
</svg>
