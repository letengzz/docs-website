  <text x="32" y="512" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">阅读顺序：1 → 2 → 3 →（4 / 5 并行）→ 6 → 7 → 8；权限不通过，质量分数不看。</text>
  <text x="32" y="536" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="start">核心判据：越权召回必须恒为 0 —— 它不是「尽量少」，而是「一条都不许有」。</text>
