<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="企业语料接入与解析流水线：五种语料形状、切分与权限边界、增量同步四动作">
  <title>接入与解析：权限元数据必须随 chunk 走</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">接入与解析：权限元数据必须随 chunk 走</text>
  <text x="32" y="74" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">企业语料的五种形状（按权限复杂度排序，接入顺序建议从下往上）</text>
  <rect x="30" y="92" width="400" height="44" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="46" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">版式文档</text>
  <text x="140" y="112" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">PDF / Office / 扫描件</text>
  <text x="46" y="129" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">权限清晰，先接</text>
  <rect x="30" y="142" width="400" height="44" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="46" y="162" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="start">结构化页面</text>
  <text x="140" y="162" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Wiki / 在线文档</text>
  <text x="46" y="179" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">页面 + 空间双层权限</text>
  <rect x="30" y="192" width="400" height="44" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="46" y="212" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">表格与数据</text>
  <text x="140" y="212" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">电子表格 / BI 报表</text>
  <text x="46" y="229" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">常与业务权限耦合</text>
  <rect x="30" y="242" width="400" height="44" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="46" y="262" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">协作内容</text>
  <text x="140" y="262" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">IM / 邮件 / 评论</text>
  <text x="46" y="279" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">会话级权限，最复杂</text>
  <rect x="30" y="292" width="400" height="44" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="46" y="312" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">代码与工单</text>
  <text x="140" y="312" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">代码库 / 缺陷系统</text>
  <text x="46" y="329" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">仓库级 + 分支可见性</text>
  <rect x="450" y="92" width="420" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="468" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">权限元数据随 chunk 走的理由</text>
  <text x="468" y="146" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">索引的最小单元是 chunk，不是文档；</text>
  <text x="468" y="168" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">权限若只存在文档表里，检索时要额外反查 ——</text>
  <text x="468" y="190" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">延迟与一致性都成问题；</text>
  <text x="468" y="212" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">存在 chunk 上，过滤条件可与查询一起下推，</text>
  <text x="468" y="234" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">一次请求完成；</text>
  <text x="468" y="256" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">三个必需字段：readers（组 ID）/ source_id /</text>
  <text x="468" y="278" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">doc_version；</text>
  <text x="468" y="300" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">组 ID 而非组名 —— 组名会改，ID 不会。</text>
  <text x="32" y="368" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">切分与权限边界的冲突：一个 chunk 只能属于一个权限域</text>
  <rect x="30" y="384" width="840" height="60" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="48" y="408" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="start">反例：前句「公司差旅标准见附表」（公开）+ 后句「高管标准为 3 倍」（仅管理层可见）</text>
  <text x="48" y="430" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">chunk 只有一个权限字段 → 无论取哪个值，都会有一方看到不该看的或看不到该看的，且不报错。</text>
  <text x="32" y="476" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="start">增量同步的四个必要动作：① 先删后写　② 删除对账　③ 权限重抽　④ 水位记录</text>
  <text x="32" y="500" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">四件少做任何一件，都会留下长期脏数据；而它们都不会让流程报错。</text>
</svg>
