<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .l1 { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .l2 { fill: #e8f0ff; stroke: #3f6fc4; stroke-width: 1.5; }
    .l3 { fill: #e2e9fb; stroke: #3562b0; stroke-width: 1.5; }
    .l4 { fill: #d9e2f7; stroke: #2a54a0; stroke-width: 1.5; }
    .l5 { fill: #cfd9f3; stroke: #1f4690; stroke-width: 1.5; }
    .ind { fill: #f0ecff; stroke: #7a5bd8; stroke-width: 1.5; }
    .ok  { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .t2  { font-size: 15px; font-weight: bold; }
    .small { font-size: 11px; fill: #555; }
    .ar { stroke: #4a7bd8; stroke-width: 1.4; }
    .arv{ stroke: #7a5bd8; stroke-width: 1.4; fill: none; }
  </style>

  <text class="t2" x="450" y="26">AI 编程助手的能力分层：五层不是五个工具，是同一个能力的五档自主度</text>

  <rect class="l1" x="120" y="50" width="360" height="56"/>
  <text x="300" y="72">L1　行内补全（Completion）</text>
  <text class="small" x="300" y="92">写下一行 / 补完一个函数体 · Tab 接受</text>

  <rect class="l2" x="120" y="116" width="360" height="56"/>
  <text x="300" y="138">L2　下一步编辑（Next Edit）</text>
  <text class="small" x="300" y="158">预测你刚改完之后的下一处 diff，跨行跨块</text>

  <rect class="l3" x="120" y="182" width="360" height="56"/>
  <text x="300" y="204">L3　对话与多文件编辑（Chat / Edit）</text>
  <text class="small" x="300" y="224">先出计划再改，diff 逐块接受或拒绝</text>

  <rect class="l4" x="120" y="248" width="360" height="56"/>
  <text x="300" y="270">L4　编辑器内 Agent（Agent Mode）</text>
  <text class="small" x="300" y="290">读仓库 → 计划 → 改多文件 → 跑命令 → 看报错 → 再改</text>

  <rect class="l5" x="120" y="314" width="360" height="56"/>
  <text x="300" y="336">L5　平台与云 Agent（Cloud / CI）</text>
  <text class="small" x="300" y="356">接一个 issue / 定时任务，出 PR 等人评审</text>

  <line class="ar" x1="480" y1="78" x2="496" y2="78" marker-end="url(#cl)"/>
  <line class="ar" x1="480" y1="144" x2="496" y2="144" marker-end="url(#cl)"/>
  <line class="ar" x1="480" y1="210" x2="496" y2="210" marker-end="url(#cl)"/>
  <line class="ar" x1="480" y1="276" x2="496" y2="276" marker-end="url(#cl)"/>
  <line class="ar" x1="480" y1="342" x2="496" y2="342" marker-end="url(#cl)"/>

  <rect class="ind" x="510" y="50" width="360" height="120"/>
  <text x="690" y="74" font-weight="bold">自主度沿箭头递增</text>
  <text class="small" x="690" y="96">L1~L2：AI 不需要被「管」，错了不采纳即可</text>
  <text class="small" x="690" y="114">L3：需要人看 diff，评审单位从「行」变成「块」</text>
  <text class="small" x="690" y="134">L4~L5：AI 会跑命令、会提交，必须先谈权限</text>

  <rect class="ok" x="510" y="186" width="360" height="120"/>
  <text x="690" y="210" font-weight="bold">因此团队规范的重心也随层移动</text>
  <text class="small" x="690" y="232">L1~L2 阶段：谈「补全采纳率」就够了</text>
  <text class="small" x="690" y="252">L3~L4 阶段：必须谈「指令文件 + diff 评审纪律」</text>
  <text class="small" x="690" y="272">L5 阶段：必须谈「门禁、权限、审计与回滚」</text>

  <text class="small" x="450" y="424">一句话：层越往上，写代码的时间越少，看代码的时间越多——这是本专题全部结论的起点</text>
  <text class="small" x="450" y="446">（对应数据见度量页：9.8 小时写作 vs 11.4 小时评审）</text>
</svg>
