<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">大模型应用的技术栈分层</text>

  <!-- 应用层 -->
  <rect x="40" y="60" width="560" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">应用层：业务系统与交互</text>
  <text x="320" y="110" text-anchor="middle" font-size="11" fill="#3730a3">客服工作台 / 工单系统 / 知识库问答 / 报表助手 / 代码助手</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#6b7280">对外提供 API、Web、IM 渠道；负责权限、审计与业务校验</text>

  <!-- 编排层 -->
  <rect x="40" y="164" width="560" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">编排层：把模型能力变成可控流程</text>
  <g font-size="11" fill="#065f46">
    <text x="70" y="216">提示词与结构化输出</text>
    <text x="70" y="240">工具 / 函数调用</text>
    <text x="70" y="264">上下文与记忆管理</text>
    <text x="330" y="216">RAG 检索与引用</text>
    <text x="330" y="240">Agent 循环与多步编排</text>
    <text x="330" y="264">重试、降级与人工兜底</text>
  </g>

  <!-- 模型层 -->
  <rect x="40" y="298" width="560" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">模型层：模型服务与接入协议</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#92400e">Responses API（新项目主线） / Chat Completions（存量兼容）</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#92400e">推理模型与通用模型分级 · 嵌入模型 · 兼容 OpenAI 协议的第三方与本地模型</text>
  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#6b7280">统一用环境变量配置 base_url / api_key，便于切换供应商</text>

  <!-- 工程能力 -->
  <rect x="622" y="60" width="238" height="348" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="741" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">横向工程能力</text>
  <g font-size="11" fill="#5b21b6">
    <text x="646" y="116">成本控制</text>
    <text x="646" y="138">令牌预算 / 缓存 / 批处理</text>
    <text x="646" y="168">限流与容错</text>
    <text x="646" y="190">并发控制 / 退避 / 降级</text>
    <text x="646" y="220">评测与回归</text>
    <text x="646" y="242">评测集 / 灰度 / A·B</text>
    <text x="646" y="272">可观测性</text>
    <text x="646" y="294">调用链 / 令牌 / 延迟</text>
    <text x="646" y="324">安全与合规</text>
    <text x="646" y="346">注入防护 / 脱敏 / 审计</text>
    <text x="646" y="376">工程化</text>
    <text x="646" y="396">配置管理 / 版本化提示词</text>
  </g>
</svg>
