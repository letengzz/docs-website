<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">工具调用（Function Calling）五步循环</text>

  <rect x="40" y="64" width="240" height="86" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">① 带上工具发起请求</text>
  <text x="160" y="116" text-anchor="middle" font-size="10" fill="#3730a3">tools 传入 JSON Schema 定义</text>
  <text x="160" y="136" text-anchor="middle" font-size="10" fill="#6b7280">建议 strict: true</text>

  <path d="M 282 107 H 316" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#tl)"/>

  <rect x="318" y="64" width="240" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="438" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">② 收到工具调用请求</text>
  <text x="438" y="116" text-anchor="middle" font-size="10" fill="#5b21b6">output 中 type=function_call</text>
  <text x="438" y="136" text-anchor="middle" font-size="10" fill="#6b7280">含 call_id / name / arguments</text>

  <path d="M 560 107 H 594" stroke="#8b5cf6" stroke-width="2.5" fill="none" marker-end="url(#tl2)"/>

  <rect x="596" y="64" width="264" height="86" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="728" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">③ 应用侧执行</text>
  <text x="728" y="116" text-anchor="middle" font-size="10" fill="#065f46">校验参数 → 调用内部 API / 数据库</text>
  <text x="728" y="136" text-anchor="middle" font-size="10" fill="#6b7280">超时、鉴权、权限校验都在这里</text>

  <path d="M 728 152 V 196 H 160 V 210" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#tl3)"/>

  <rect x="40" y="212" width="380" height="94" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">④ 回传工具结果</text>
  <text x="230" y="264" text-anchor="middle" font-size="10" fill="#92400e">追加 {"type":"function_call_output","call_id":...,"output":...}</text>
  <text x="230" y="286" text-anchor="middle" font-size="10" fill="#92400e">结果统一为字符串，推荐 JSON；无返回值也要回 "success"</text>

  <path d="M 422 259 H 456" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#tl4)"/>

  <rect x="458" y="212" width="402" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="659" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">⑤ 再次请求，得到最终回答或继续调用</text>
  <text x="659" y="264" text-anchor="middle" font-size="10" fill="#1e3a8a">模型可能一次返回多个 function_call（并行调用）</text>
  <text x="659" y="286" text-anchor="middle" font-size="10" fill="#1e3a8a">循环直到模型给出自然语言答复或触发步数上限</text>

  <!-- 要点 -->
  <rect x="40" y="326" width="820" height="118" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="352" font-size="13" font-weight="bold" fill="#1f2937">工程要点</text>
  <text x="60" y="378" font-size="11" fill="#374151">strict 模式要求：每个对象的 additionalProperties 必须为 false，properties 中所有字段都必须出现在 required 里，可选字段用 ["string","null"] 表达。</text>
  <text x="60" y="402" font-size="11" fill="#374151">工具定义会占用输入令牌并按输入计费：一次可见的工具数量越少，选择越准、成本越低；工具很多时可用工具检索（tool_search）按需加载。</text>
  <text x="60" y="426" font-size="11" fill="#374151">并行调用可用 parallel_tool_calls 控制；执行侧必须假定"可能同时收到多个调用"，并对每个 call_id 单独返回结果。</text>

  <defs>
    <marker id="tl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="tl2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="tl3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="tl4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
