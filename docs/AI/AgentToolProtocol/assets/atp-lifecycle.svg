<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">一次调用的四个时间点：超时不会取消工作</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">客户端 800 ms 放弃、工具 1500 ms 才跑完、重试 2 次 → 3 次物理执行；幂等键决定副作用几次</text>

<text x="36" y="112" font-size="11" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">客户端</text>
<text x="36" y="238" font-size="11" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">服务端</text>

<line x1="110" y1="100" x2="110" y2="300" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="330" y1="100" x2="330" y2="300" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="550" y1="100" x2="550" y2="300" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="770" y1="100" x2="770" y2="300" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="110" y="96" font-size="9.5" fill="#64748b" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0 ms</text>
<text x="330" y="96" font-size="9.5" fill="#64748b" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">800 ms 超时</text>
<text x="550" y="96" font-size="9.5" fill="#64748b" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">1600 ms</text>
<text x="770" y="96" font-size="9.5" fill="#64748b" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">2400 ms</text>

<rect x="110" y="122" width="220" height="28" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="220" y="141" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">第 1 次：发出 → 等到 800 ms 放弃</text>
<rect x="330" y="122" width="220" height="28" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="440" y="141" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">第 2 次重试：同样 800 ms 放弃</text>
<rect x="550" y="122" width="220" height="28" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="660" y="141" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">第 3 次重试：也用尽</text>
<line x1="330" y1="136" x2="352" y2="136" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ah)" opacity="0"/>
<text x="700" y="176" font-size="10.5" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">逻辑调用 1 次</text>

<rect x="110" y="212" width="300" height="30" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="260" y="232" font-size="10" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">执行 1：1200~1800 ms 跑完</text>
<rect x="210" y="250" width="300" height="30" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="360" y="270" font-size="10" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">执行 2：重叠，且不知道第 1 次已成功</text>
<rect x="310" y="288" width="300" height="30" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="460" y="308" font-size="10" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">执行 3：取消未到达，照跑</text>

<rect x="36" y="342" width="288" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="50" y="366" font-size="11.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">无幂等键：3 次副作用</text>
<text x="50" y="388" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">重复扣款 / 重复发货；日志只显示 1 次成功</text>

<rect x="336" y="342" width="288" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="350" y="366" font-size="11.5" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">有幂等键：1 次副作用</text>
<text x="350" y="388" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">键用业务标识（订单号 + 动作），不用请求 id</text>

<rect x="636" y="342" width="288" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="650" y="366" font-size="11.5" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">实现取消：省下 100%</text>
<text x="650" y="388" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">实测平均每次白跑 1497 ms，400 次共 598.8 s</text>
</svg>
