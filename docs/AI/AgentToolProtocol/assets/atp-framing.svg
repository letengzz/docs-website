<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">两种分帧方式与它们的失败点</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">换行分界靠「行」定界，长度前缀靠「数」定界；前者便宜，后者不会解析半包</text>

<text x="36" y="106" font-size="12.5" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">A · 换行分界（MCP stdio）</text>
<rect x="36" y="118" width="300" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="48" y="147" font-size="10.5" fill="#1e3a8a" font-family="PingFang SC, Helvetica, Arial, sans-serif">{"jsonrpc":"2.0","id":1,...}</text>
<text x="344" y="147" font-size="13" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">\n</text>
<rect x="368" y="118" width="300" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="380" y="147" font-size="10.5" fill="#1e3a8a" font-family="PingFang SC, Helvetica, Arial, sans-serif">{"jsonrpc":"2.0","id":2,...}</text>
<text x="676" y="147" font-size="13" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">\n</text>

<line x1="560" y1="106" x2="560" y2="178" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="568" y="104" font-size="10.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">切在这里</text>
<text x="36" y="192" font-size="10.5" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">一次 read() 停在行中间 → 拿到半个 JSON → json.loads 抛异常（实测 173 个切点里 170 个失败，98.3%）</text>

<text x="36" y="232" font-size="12.5" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">B · 长度前缀（LSP 系）</text>
<rect x="36" y="244" width="176" height="46" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="46" y="264" font-size="10" fill="#115e59" font-family="PingFang SC, Helvetica, Arial, sans-serif">Content-Length: 177</text>
<text x="46" y="282" font-size="10" fill="#115e59" font-family="PingFang SC, Helvetica, Arial, sans-serif">\r\n\r\n（23 B 帧头）</text>
<rect x="212" y="244" width="360" height="46" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="224" y="273" font-size="10.5" fill="#115e59" font-family="PingFang SC, Helvetica, Arial, sans-serif">body：精确 177 字节，少一个就等，多一个就切</text>
<line x1="188" y1="267" x2="212" y2="267" stroke="#0f766e" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="590" y="264" font-size="10.5" fill="#115e59" font-family="PingFang SC, Helvetica, Arial, sans-serif">头没读齐就不解析，</text>
<text x="590" y="282" font-size="10.5" fill="#115e59" font-family="PingFang SC, Helvetica, Arial, sans-serif">天然不会出现半包</text>

<rect x="36" y="318" width="288" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="50" y="342" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">帧头开销</text>
<text x="50" y="364" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">小帧 17.6% / 中帧 11.5%</text>
<text x="50" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">大帧 4.4%（23 B 固定）</text>

<rect x="336" y="318" width="288" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="350" y="342" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">解析成本</text>
<text x="350" y="364" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">换行 2.92 µs/帧</text>
<text x="350" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">长度前缀 3.11 µs/帧（+0.19）</text>

<rect x="636" y="318" width="288" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="650" y="342" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">串行往返 p50</text>
<text x="650" y="364" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">换行 0.069 ms</text>
<text x="650" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">长度前缀 0.072 ms（差 3 µs）</text>
</svg>
