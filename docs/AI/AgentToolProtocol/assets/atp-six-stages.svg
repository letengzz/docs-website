<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">一次工具调用穿过的六段</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">三段在客户端、两段在服务端、一段在回填层；三个交界是事故高发区</text>

<rect x="36" y="96" width="138" height="196" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="47" y="122" font-size="11.5" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 装配</text>
<text x="47" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">工具面 →</text>
<text x="47" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">带 schema</text>
<text x="47" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">的清单</text>
<text x="47" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="47" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">工具太多</text>
<text x="47" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">同名覆盖</text>
<text x="47" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">宿主应用</text>

<rect x="186" y="96" width="138" height="196" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="197" y="122" font-size="11.5" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 出参</text>
<text x="197" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">清单 + 对话</text>
<text x="197" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 一个调用</text>
<text x="197" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">意图</text>
<text x="197" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="197" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">选错工具</text>
<text x="197" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">类型漂移</text>
<text x="197" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">模型</text>

<rect x="336" y="96" width="138" height="196" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="347" y="122" font-size="11.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 编码</text>
<text x="347" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">意图 →</text>
<text x="347" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">一行 JSON-RPC</text>
<text x="347" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">（一帧）</text>
<text x="347" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="347" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">日志污染</text>
<text x="347" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">半包解析</text>
<text x="347" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">传输层</text>

<rect x="486" y="96" width="138" height="196" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="497" y="122" font-size="11.5" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 校验</text>
<text x="497" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">参数 →</text>
<text x="497" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">合法 / 不合法</text>
<text x="497" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">（1.61 µs）</text>
<text x="497" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="497" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">只校验类型</text>
<text x="497" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">漏掉 4 类</text>
<text x="497" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">服务端</text>

<rect x="636" y="96" width="138" height="196" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="647" y="122" font-size="11.5" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑤ 执行</text>
<text x="647" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">合法参数 →</text>
<text x="647" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">真实世界的</text>
<text x="647" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">变化</text>
<text x="647" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="647" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">重复执行</text>
<text x="647" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">取消不生效</text>
<text x="647" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">服务端</text>

<rect x="786" y="96" width="138" height="196" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="797" y="122" font-size="11.5" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑥ 回填</text>
<text x="797" y="146" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">结果 → 下一轮</text>
<text x="797" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">上下文（可能</text>
<text x="797" y="182" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">被截断）</text>
<text x="797" y="216" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">失败：</text>
<text x="797" y="233" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">静默截断</text>
<text x="797" y="250" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">结果含指令</text>
<text x="797" y="277" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">宿主应用</text>

<line x1="174" y1="194" x2="186" y2="194" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="324" y1="194" x2="336" y2="194" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="474" y1="194" x2="486" y2="194" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="624" y1="194" x2="636" y2="194" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="774" y1="194" x2="786" y2="194" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="36" y="314" width="288" height="98" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="50" y="340" font-size="12" font-weight="700" fill="#c2410c" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界 A：②→③</text>
<text x="50" y="363" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">模型的「参数」是文本里的 JSON</text>
<text x="50" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">可能带换行、带代码块、带未转义引号</text>
<text x="50" y="403" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 见 Transport</text>

<rect x="336" y="314" width="288" height="98" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="350" y="340" font-size="12" font-weight="700" fill="#c2410c" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界 B：③→⑤</text>
<text x="350" y="363" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">一次逻辑调用可能变成 1 次或 3 次</text>
<text x="350" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">物理执行，只有服务端知道几次</text>
<text x="350" y="403" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 见 Invocation</text>

<rect x="636" y="314" width="288" height="98" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="650" y="340" font-size="12" font-weight="700" fill="#c2410c" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界 C：⑥→①</text>
<text x="650" y="363" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">结果会改变下一轮工具面</text>
<text x="650" y="383" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">看到「权限不足」后模型会换工具</text>
<text x="650" y="403" font-size="10" fill="#64748b" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 链路其实是环</text>
</svg>
