<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">193 KB 的结果，8 KB 的预算，目标在 62.2% 处</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">三种截断策略里两种会丢目标；真正的解法是把分页下推到工具侧</text>

<rect x="36" y="96" width="888" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="48" y="123" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">完整结果 193.1 KB · 900 条订单</text>
<line x1="36" y1="118" x2="924" y2="118" stroke="#cbd5e1" stroke-width="0"/>
<line x1="589" y1="96" x2="589" y2="140" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="597" y="152" font-size="10.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">目标（第 560 条）在 62.2%</text>

<text x="36" y="192" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">策略 1 · 只留头部 8 KB</text>
<rect x="236" y="178" width="64" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<rect x="300" y="178" width="624" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="300" y="214" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">注入 4.1%，目标丢失</text>

<text x="36" y="252" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">策略 2 · 头尾各半（4 + 4 KB）</text>
<rect x="236" y="238" width="44" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<rect x="280" y="238" width="580" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3"/>
<rect x="860" y="238" width="64" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<text x="280" y="274" font-size="10" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">注入 4.1%，目标仍在中间 —— 同样丢失</text>

<text x="36" y="312" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">策略 3 · 分页 20 行 + total + cursor</text>
<rect x="236" y="298" width="30" height="20" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.1"/>
<text x="276" y="313" font-size="10" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">注入 4.3 KB · 总共 900 条 · cursor=p2</text>
<text x="590" y="313" font-size="10" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">可检索，但定位到第 560 条要翻 29 页</text>

<rect x="36" y="342" width="288" height="66" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="50" y="366" font-size="11" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">首选：工具侧分页</text>
<text x="50" y="386" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">limit / cursor 进 schema，</text>
<text x="50" y="401" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">total 与 cursor 进 structuredContent</text>

<rect x="336" y="342" width="288" height="66" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="350" y="366" font-size="11" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">次选：工具侧聚合</text>
<text x="350" y="386" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">把「查 900 条」变成</text>
<text x="350" y="401" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">「PAID 状态共 N 条」</text>

<rect x="636" y="342" width="288" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="650" y="366" font-size="11" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">最坏：静默截断</text>
<text x="650" y="386" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">模型看到「没有这条」，</text>
<text x="650" y="401" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">然后用很自信的语气说查无此单</text>
</svg>
