<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Agent 主循环与中间件的六个钩子</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">create_agent 就是这条循环的封装；定制点全部收敛到中间件，不要去改框架源码</text>
  <rect x="30" y="96" width="148" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="104" y="114.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">输入消息</text>
  <rect x="214" y="96" width="148" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="288" y="114.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">模型决策</text>
  <rect x="398" y="96" width="148" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="472" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">工具执行</text>
  <rect x="582" y="96" width="148" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="656" y="114.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">结果回填</text>
  <text x="104" y="122" text-anchor="middle" font-size="8" fill="#475569">messages</text>
  <text x="288" y="122" text-anchor="middle" font-size="8" fill="#5B21B6">tool_calls?</text>
  <text x="472" y="122" text-anchor="middle" font-size="8" fill="#1E3A8A">并行/串行</text>
  <text x="656" y="122" text-anchor="middle" font-size="8" fill="#115E59">回到模型</text>
  <line x1="178" y1="127" x2="214" y2="127" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="362" y1="127" x2="398" y2="127" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="546" y1="127" x2="582" y2="127" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="656" y1="158" x2="288" y2="158" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="472" y="153" text-anchor="middle" font-size="7.5" fill="#64748B">循环（还有工具调用就继续）</text>
  <line x1="288" y1="158" x2="288" y2="158" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="288" y1="96" x2="288" y2="82" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="288" y="76" text-anchor="middle" font-size="8" fill="#64748B">没有工具调用 → 结束</text>
  <text x="380" y="196" text-anchor="middle" font-size="9.5" fill="#475569">循环的终止条件是「模型不再请求工具」，不是「达到某个步数」——步数上限是安全阀，不是控制手段</text>
  <rect x="30" y="214" width="700" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="232.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">中间件在循环上的六个钩子</text>
  <text x="380" y="249" text-anchor="middle" font-size="8" fill="#4338CA">before_agent     调用 Agent 之前      加载记忆、校验输入</text>
  <text x="380" y="267.4" text-anchor="middle" font-size="8" fill="#4338CA">before_model     每次模型调用之前    改提示词、裁剪消息</text>
  <text x="380" y="285.8" text-anchor="middle" font-size="8" fill="#4338CA">wrap_model_call  包裹模型调用        换模型、换工具集</text>
  <text x="380" y="304.2" text-anchor="middle" font-size="8" fill="#4338CA">wrap_tool_call   包裹工具调用        拦截与改写工具执行</text>
  <text x="380" y="322.6" text-anchor="middle" font-size="8" fill="#4338CA">after_model      每次模型响应之后    校验输出、加护栏</text>
  <text x="380" y="341" text-anchor="middle" font-size="8" fill="#4338CA">after_agent      Agent 结束之后      落库、清理</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
