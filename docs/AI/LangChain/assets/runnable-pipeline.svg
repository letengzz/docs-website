<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">从 Chain 到 Runnable：LCEL 管道与组合子</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">核心抽象是 Runnable；| 只是语法糖，真正决定工程能力的是那几个组合子</text>
  <rect x="40" y="84" width="176" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="128" y="102.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">Prompt 模板</text>
  <text x="128" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">变量占位</text>
  <text x="128" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">消息列表</text>
  <line x1="216" y1="123" x2="280" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="248" y="118" text-anchor="middle" font-size="7.5" fill="#64748B">|</text>
  <rect x="280" y="84" width="176" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="368" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">Model</text>
  <text x="368" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">init_chat_model</text>
  <text x="368" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">统一初始化</text>
  <line x1="456" y1="123" x2="520" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="488" y="118" text-anchor="middle" font-size="7.5" fill="#64748B">|</text>
  <rect x="520" y="84" width="176" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="608" y="102.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">Parser</text>
  <text x="608" y="119" text-anchor="middle" font-size="7.5" fill="#0F766E">结构化解析</text>
  <text x="608" y="136.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Pydantic 校验</text>
  <text x="380" y="190" text-anchor="middle" font-size="9.5" fill="#6D28D9">LCEL：用 | 把 Runnable 串起来，得到的是又一个 Runnable——可再次组合</text>
  <rect x="30" y="214" width="132" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="96" y="232.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">batch</text>
  <text x="96" y="249" text-anchor="middle" font-size="7" fill="#047857">批量并发</text>
  <text x="96" y="265.1" text-anchor="middle" font-size="7" fill="#047857">输入是列表</text>
  <rect x="174" y="214" width="132" height="76" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="240" y="232.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">stream</text>
  <text x="240" y="249" text-anchor="middle" font-size="7" fill="#0E7490">逐块产出</text>
  <text x="240" y="265.1" text-anchor="middle" font-size="7" fill="#0E7490">首字延迟低</text>
  <rect x="318" y="214" width="132" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="384" y="232.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">retry</text>
  <text x="384" y="249" text-anchor="middle" font-size="7" fill="#B45309">失败重试</text>
  <text x="384" y="265.1" text-anchor="middle" font-size="7" fill="#B45309">指数退避</text>
  <rect x="462" y="214" width="132" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="528" y="232.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">fallback</text>
  <text x="528" y="249" text-anchor="middle" font-size="7" fill="#C2410C">降级模型</text>
  <text x="528" y="265.1" text-anchor="middle" font-size="7" fill="#C2410C">端点切换</text>
  <rect x="606" y="214" width="132" height="76" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="672" y="232.2" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">with_retry 组合</text>
  <text x="672" y="249" text-anchor="middle" font-size="7" fill="#BE185D">可嵌套任意层</text>
  <text x="672" y="265.1" text-anchor="middle" font-size="7" fill="#BE185D">语义清晰</text>
  <text x="380" y="312" text-anchor="middle" font-size="9.5" fill="#0F766E">组合子是 Runnable 的价值所在：重试、降级、并发、流式都不需要改业务代码</text>
  <rect x="30" y="326" width="700" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="344.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">Chain 去哪了</text>
  <text x="380" y="361" text-anchor="middle" font-size="8" fill="#334155">v1 把 LLMChain / ConversationChain 等具体 Chain 迁到 langchain-classic；核心包保留的是 Runnable 这层抽象。</text>
  <text x="380" y="379.4" text-anchor="middle" font-size="8" fill="#334155">结论：新代码组合 Runnable，不要去找「现成的 Chain」；存量代码装 langchain-classic 并改导入路径。</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
