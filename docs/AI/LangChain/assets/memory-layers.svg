<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="366" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四层记忆：会话内 / 压缩 / 跨会话 / 外置状态</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「记忆」不是一个开关，而是四层机制的组合；分层错了，后面全是补丁</text>
  <rect x="30" y="76" width="700" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">第 1 层：会话内消息（短期）</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">checkpointer + thread_id 决定「这一轮对话记得什么」；换 thread_id 就是新会话。</text>
  <rect x="30" y="146" width="340" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="164.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 2 层：预算内裁剪（压缩）</text>
  <text x="200" y="181" text-anchor="middle" font-size="8" fill="#1D4ED8">SummarizationMiddleware 在令牌超阈值时</text>
  <text x="200" y="199.4" text-anchor="middle" font-size="8" fill="#1D4ED8">把早期消息压成摘要；trigger 可配令牌数</text>
  <rect x="390" y="146" width="340" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="164.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">第 3 层：跨会话长期记忆</text>
  <text x="560" y="181" text-anchor="middle" font-size="8" fill="#0F766E">按用户/业务维度存储的独立记忆库，</text>
  <text x="560" y="199.4" text-anchor="middle" font-size="8" fill="#0F766E">检索后再注入——与 RAG 同源但目的不同</text>
  <rect x="30" y="236" width="700" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="254.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">第 4 层：外置状态（LangGraph 检查点）</text>
  <text x="380" y="271" text-anchor="middle" font-size="8" fill="#047857">图的每一步状态都落检查点，进程重启后可从任意检查点恢复；</text>
  <text x="380" y="289.4" text-anchor="middle" font-size="8" fill="#047857">这才是「服务重启不丢上下文」的实现方式，不要用内存字典硬撑。</text>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#B91C1C">常见错误：把四层混成一层——用内存列表当记忆、用提示词当数据库</text>
  <text x="380" y="350" text-anchor="middle" font-size="9.5" fill="#475569">判定口诀：对话内的用检查点，跨会话的用检索，装不下的用摘要</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
