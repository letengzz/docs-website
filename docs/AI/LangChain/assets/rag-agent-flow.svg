<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：带人工审批的检索增强 Agent</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把中间件、检索、图与中断串成一条可验收的链路，而不是堆一个能跑的 demo</text>
  <rect x="30" y="80" width="110" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="85" y="98.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">用户提问</text>
  <text x="85" y="115" text-anchor="middle" font-size="7" fill="#334155">原始问题</text>
  <line x1="140" y1="122" x2="152" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="152" y="80" width="110" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="207" y="98.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">安全与脱敏</text>
  <text x="207" y="115" text-anchor="middle" font-size="7" fill="#B91C1C">PII 中间件</text>
  <text x="207" y="131.1" text-anchor="middle" font-size="7" fill="#B91C1C">拦截/改写</text>
  <line x1="262" y1="122" x2="274" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="274" y="80" width="110" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="329" y="98.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">检索</text>
  <text x="329" y="115" text-anchor="middle" font-size="7" fill="#1D4ED8">向量 + 关键词</text>
  <text x="329" y="131.1" text-anchor="middle" font-size="7" fill="#1D4ED8">返回带来源片段</text>
  <line x1="384" y1="122" x2="396" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="396" y="80" width="110" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="451" y="98.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">生成</text>
  <text x="451" y="115" text-anchor="middle" font-size="7" fill="#6D28D9">带引用作答</text>
  <text x="451" y="131.1" text-anchor="middle" font-size="7" fill="#6D28D9">结构化输出</text>
  <line x1="506" y1="122" x2="518" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="518" y="80" width="110" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="573" y="98.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">审批</text>
  <text x="573" y="115" text-anchor="middle" font-size="7" fill="#B45309">写操作前中断</text>
  <text x="573" y="131.1" text-anchor="middle" font-size="7" fill="#B45309">人工确认</text>
  <line x1="628" y1="122" x2="640" y2="122" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="80" width="110" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="695" y="98.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">执行与审计</text>
  <text x="695" y="115" text-anchor="middle" font-size="7" fill="#047857">调工具</text>
  <text x="695" y="131.1" text-anchor="middle" font-size="7" fill="#047857">写审计日志</text>
  <text x="380" y="186" text-anchor="middle" font-size="9.5" fill="#6D28D9">六段链路里，中间件负责把关（第 2、4 段），LangGraph 负责分支与中断（第 5 段）</text>
  <text x="60" y="216" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">验收五条（可执行）</text>
  <rect x="30" y="228" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="120" y="243" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">grep -c 无来源引用</text>
  <rect x="218" y="228" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="474" y="243" text-anchor="middle" font-size="8.5" fill="#334155">生成的每个论断都能指回片段</text>
  <rect x="30" y="254" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="120" y="269" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">两次生成结果一致</text>
  <rect x="218" y="254" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="474" y="269" text-anchor="middle" font-size="8.5" fill="#334155">temperature 与种子可控</text>
  <rect x="30" y="280" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="120" y="295" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">注入样本被拦</text>
  <rect x="218" y="280" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="474" y="295" text-anchor="middle" font-size="8.5" fill="#334155">PII 与提示注入用例通过</text>
  <rect x="30" y="306" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="120" y="321" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">断点续跑</text>
  <rect x="218" y="306" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="474" y="321" text-anchor="middle" font-size="8.5" fill="#334155">进程 kill 后能恢复上下文</text>
  <rect x="30" y="332" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="120" y="347" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">拒绝时退出码非 0</text>
  <rect x="218" y="332" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="474" y="347" text-anchor="middle" font-size="8.5" fill="#334155">门禁可进 CI</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
