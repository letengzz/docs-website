<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="376" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">装配器六步与 10 条断言</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">输入预算 + 材料 + 问题，输出上下文与一份可复算的账</text><rect x="28" y="92" width="268" height="62" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="42" y="118" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">1  算配额</text><text x="42" y="138" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">quota ≤ 0 走降级</text><rect x="316" y="92" width="268" height="62" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="330" y="118" font-size="12.5" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">2  去重</text><text x="330" y="138" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">内容指纹 SHA-1</text><rect x="604" y="92" width="268" height="62" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="618" y="118" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">3  稳定排序</text><text x="618" y="138" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">分数 → 权威 → id</text><rect x="28" y="170" width="268" height="62" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="42" y="196" font-size="12.5" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">4  选入</text><text x="42" y="216" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">含元数据成本</text><rect x="316" y="170" width="268" height="62" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="330" y="196" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">5  排布</text><text x="330" y="216" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">最高分在前、次高分在后</text><rect x="604" y="170" width="268" height="62" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="618" y="196" font-size="12.5" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">6  冲突/降级</text><text x="618" y="216" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">同键不同值必记录</text><rect x="28" y="262" width="844" height="96" rx="8" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="44" y="286" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">实测：9 块材料 / 上下文 1,149 token / 总 2,149 of 6,000 / 冲突 1 条</text><text x="44" y="310" font-size="12" fill="#15803d" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">10 / 10 PASS  EXIT=0</text><text x="44" y="332" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">反向探针：PROBE=dedupe → 仅 C7 FAIL；PROBE=order → 仅 C8 FAIL（9/10，EXIT=1）</text><text x="44" y="350" font-size="11" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">「恰好一条变红」比「全绿」更有说服力：它证明每条断言只盯一个机制。</text></svg>