<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" width="900" height="316" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="316" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">一次请求的预算分账</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">固定开销先扣，剩下的才是可自由分配的检索槽位</text><text x="28" y="112" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">声明窗口 8,000</text><rect x="210" y="96" width="520.0" height="30" rx="4" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><text x="220" y="116" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">固定 12,500</text><text x="746" y="116" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">占 156.2%，一个槽位都放不下</text><text x="28" y="160" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">声明窗口 32,000</text><rect x="210" y="144" width="202.8" height="30" rx="4" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><text x="220" y="164" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">固定 12,500</text><rect x="412.8" y="144" width="317.2" height="30" rx="4" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="422.8" y="164" font-size="11" fill="#0f766e" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">可分配 19,500</text><text x="746" y="164" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">32 个检索槽位</text><text x="28" y="208" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">声明窗口 128,000</text><rect x="210" y="192" width="52.0" height="30" rx="4" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><rect x="262.0" y="192" width="468.0" height="30" rx="4" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="272.0" y="212" font-size="11" fill="#0f766e" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">可分配 115,500</text><text x="746" y="212" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">192 个检索槽位</text><rect x="28" y="244" width="844" height="56" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="44" y="268" font-size="13" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">结论：预算表必须写 effective_limit。</text><text x="44" y="288" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">取窗口的 60%~75%，并把输出预留当成「先扣掉的固定项」——预留 0 时任何长回答都会挤掉输入，而挤掉哪段不由你决定。</text></svg>