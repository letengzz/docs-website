<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="292" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">上下文七段链</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">每一段都有一种「不报错」的失败方式；本册按这一段一页展开</text><rect x="28" y="96" width="116" height="78" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="86.0" y="126" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">定</text><text x="86.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">预算与配额</text><text x="86.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">定窗口/配额/预留</text><line x1="145" y1="135" x2="151" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="152" y="96" width="116" height="78" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="210.0" y="126" font-size="18" fill="#4338ca" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">编</text><text x="210.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">选材</text><text x="210.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">检索/工具/历史</text><line x1="269" y1="135" x2="275" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="276" y="96" width="116" height="78" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="334.0" y="126" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">压</text><text x="334.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">压缩</text><text x="334.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">摘要/去重/结构化</text><line x1="393" y1="135" x2="399" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="400" y="96" width="116" height="78" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="458.0" y="126" font-size="18" fill="#4338ca" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">置</text><text x="458.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">排布</text><text x="458.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">顺序/边界/冲突</text><line x1="517" y1="135" x2="523" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="524" y="96" width="116" height="78" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="582.0" y="126" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">缓</text><text x="582.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">缓存</text><text x="582.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">前缀稳定/块对齐</text><line x1="641" y1="135" x2="647" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="648" y="96" width="116" height="78" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="706.0" y="126" font-size="18" fill="#4338ca" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">测</text><text x="706.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">评测</text><text x="706.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">样本量/门禁</text><line x1="765" y1="135" x2="771" y2="135" stroke="#9aa8bd" stroke-width="1.3" marker-end="url(#ah)"/><rect x="772" y="96" width="116" height="78" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="830.0" y="126" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">守</text><text x="830.0" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">守护</text><text x="830.0" y="164" font-size="10" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">降级/注入边界</text><rect x="28" y="196" width="844" height="74" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1"/><text x="44" y="222" font-size="13" fill="#b45309" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">五段失败是安静的：</text><text x="44" y="244" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">材料选漏不报错 · 压缩丢数字不报错 · 位置放错不报错 · 前缀不命中只是更贵 · 样本不足只是结论不可信</text><text x="44" y="262" font-size="12" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">只有「守」会主动暴露（它对应安全事件），其余六段必须靠断言。</text></svg>