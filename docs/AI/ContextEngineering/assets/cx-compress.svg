<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="360" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">抽取式压缩：体积与事实是两笔账</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">本机对 3,324 篇 Markdown 做「保留标题/表格/列表/首句」的压缩</text><rect x="28" y="92" width="380" height="150" rx="8" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="44" y="116" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">字符：21,949,555 → 11,927,671</text><rect x="44" y="130" width="340" height="26" rx="4" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="44" y="130" width="184.756" height="26" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="48" y="148" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">54.34%</text><text x="44" y="182" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">页面中位 58.97%，最差 100.00%</text><text x="44" y="204" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">（整页都是表格/列表时压不动）</text><text x="44" y="228" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">压缩比是内容形态的函数，不是常数</text><rect x="424" y="92" width="448" height="150" rx="8" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="440" y="116" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">事实保留率（同一批文本）</text><text x="440" y="148" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">判据 ID</text><rect x="510" y="136" width="300" height="16" rx="3" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="510" y="136" width="275.67" height="16" rx="3" fill="#15803d" stroke="#15803d" stroke-width="1"/><text x="820" y="149" font-size="11" fill="#15803d" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">91.89%</text><text x="440" y="174" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">行内代码</text><rect x="510" y="162" width="300" height="16" rx="3" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="510" y="162" width="245.37000000000003" height="16" rx="3" fill="#4338ca" stroke="#4338ca" stroke-width="1"/><text x="820" y="175" font-size="11" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">81.79%</text><text x="440" y="200" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">URL</text><rect x="510" y="188" width="300" height="16" rx="3" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="510" y="188" width="234.81" height="16" rx="3" fill="#4338ca" stroke="#4338ca" stroke-width="1"/><text x="820" y="201" font-size="11" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">78.27%</text><text x="440" y="226" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">数字</text><rect x="510" y="214" width="300" height="16" rx="3" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="510" y="214" width="171.39" height="16" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="820" y="227" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">57.13%</text><rect x="28" y="258" width="844" height="62" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><text x="44" y="282" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">省了一半体积，丢了四成数字。</text><text x="44" y="302" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">压缩必须带「不可压清单」：数字与单位、否定与限定、条件前提、主体归属、标识符、否定性约束——要么原样保留，要么整句丢弃。</text><text x="44" y="340" font-size="11.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">结构化压缩（schema + 缺字段即失败）保真最高；生成式摘要只用于历史与导航层。</text></svg>