<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="356" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">五段排布：常量在前，变量在后</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">同一份前缀稳定，缓存才有东西可复用；任务与收束各出现一次</text><rect x="28" y="92" width="420" height="36" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="44" y="116" font-size="12.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">① 角色与总则</text><text x="320" y="116" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">极低</text><text x="392" y="116" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">最前</text><rect x="28" y="138" width="420" height="36" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="44" y="162" font-size="12.5" fill="#0f766e" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">② 工具与能力</text><text x="320" y="162" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">低</text><text x="392" y="162" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">紧跟①</text><rect x="28" y="184" width="420" height="36" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="44" y="208" font-size="12.5" fill="#4338ca" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">③ 任务与输出契约</text><text x="320" y="208" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">每请求</text><text x="392" y="208" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">材料之前</text><rect x="28" y="230" width="420" height="36" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1"/><text x="44" y="254" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">④ 材料（doc 块）</text><text x="320" y="254" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">每请求</text><text x="392" y="254" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">中间</text><rect x="28" y="276" width="420" height="36" rx="6" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="44" y="300" font-size="12.5" fill="#4338ca" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">⑤ 收束与复述</text><text x="320" y="300" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">每请求</text><text x="392" y="300" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">最后</text><text x="28" y="340" font-size="11" fill="#0f766e" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">常量区（①②）</text><text x="130" y="340" font-size="11" fill="#4338ca" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">变量区（③④⑤）</text><rect x="470" y="92" width="402" height="214" rx="8" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="486" y="116" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">三条排布纪律</text><text x="486" y="142" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">1  每条材料成对闭合、带 id 与来源</text><text x="486" y="164" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">2  不可信内容只进材料区（注入闸）</text><text x="486" y="186" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">3  同键冲突按「权威 → 时效 → 显式冲突」</text><text x="486" y="216" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">元数据成本：9 块 × 18 = 162 token（2.7%）</text><text x="486" y="238" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">192 槽位时升到 3.8%，必须计入预算</text><text x="486" y="268" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">首尾各放一个高分片段，中段放低分</text><text x="486" y="290" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">排布不稳定 → 缓存失效 + 无法 diff</text></svg>