<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="320" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">门禁的样本量：先算，再定阈值</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">单侧 α=0.05、power=0.8 时检出退化所需样本（二项近似）</text><rect x="28" y="84" width="700" height="34" rx="6" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><text x="38" y="106" font-size="11.5" fill="#5b6b82" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">基线</text><text x="158" y="106" font-size="11.5" fill="#5b6b82" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">−5 点</text><text x="310" y="106" font-size="11.5" fill="#5b6b82" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">−3 点</text><text x="462" y="106" font-size="11.5" fill="#5b6b82" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">−2 点</text><text x="614" y="106" font-size="11.5" fill="#5b6b82" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">−1 点</text><rect x="28" y="118" width="700" height="40" rx="4" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="38" y="143" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0.90</text><text x="158" y="143" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">253</text><text x="310" y="143" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">670</text><text x="462" y="143" font-size="12" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">1,471</text><text x="614" y="143" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">5,728</text><rect x="28" y="158" width="700" height="40" rx="4" fill="#fbfcfe" stroke="#d7e0ec" stroke-width="1"/><text x="38" y="183" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0.70</text><text x="158" y="183" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">534</text><text x="310" y="183" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">1,469</text><text x="462" y="183" font-size="12" fill="#b45309" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">3,286</text><text x="614" y="183" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">13,065</text><rect x="28" y="208" width="700" height="62" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="44" y="232" font-size="12" fill="#4338ca" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">能检出 5 点 → 253 条够；想抓 2 点 → 1,471 条；承诺抓 1 点 → 5,728 条起。</text><text x="44" y="254" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">阈值要定在「可检出」范围内，否则门禁长期在噪声里红灯，最后所有人都学会忽略它。</text><rect x="748" y="84" width="124" height="186" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1"/><text x="760" y="108" font-size="11.5" fill="#b45309" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">多重比较</text><text x="760" y="132" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">10 个指标</text><text x="760" y="152" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">各用 0.05</text><text x="760" y="178" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">误报 40.1%</text><text x="760" y="202" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">Bonferroni</text><text x="760" y="222" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">α=0.005</text><text x="760" y="246" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">样本约 ×1.6</text><text x="28" y="300" font-size="11.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">四类指标分开统计：正确率 · 引用正确率 · 格式合规率 · 拒答率（修法完全不同）。</text></svg>