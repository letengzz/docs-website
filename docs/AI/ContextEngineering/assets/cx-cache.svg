<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="378" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">前缀缓存：一个时间戳就归零</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">20 轮会话，固定前缀 3,000 token（23 块），每轮新增 1,536 token（12 块）</text><text x="28" y="112" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">稳定前缀在前</text><rect x="300" y="98" width="460" height="22" rx="4" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><rect x="300" y="98" width="302.22" height="22" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="772" y="114" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">65.7%</text><text x="28" y="132" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">460 / 700 块可复用；成本降到 40.9%</text><text x="28" y="174" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">检索结果插在 system 后</text><rect x="300" y="160" width="460" height="22" rx="4" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><text x="772" y="176" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0.0%</text><text x="28" y="194" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">第 0 块就变，后面全废</text><text x="28" y="236" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">时间戳写在最前</text><rect x="300" y="222" width="460" height="22" rx="4" fill="#eef2f8" stroke="#cbd6e6" stroke-width="1"/><text x="772" y="238" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0.0%</text><text x="28" y="256" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">同上：一个动态字段毁掉全部</text><rect x="28" y="292" width="844" height="66" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="44" y="316" font-size="12.5" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">20 轮累计命中 95.4%（251 / 263 块）</text><text x="44" y="338" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">轮次越多缓存越值钱；替换式摘要省 30% token 却把命中打到 0，按 0.1× 口径总成本从 0.145 涨到 0.70。</text></svg>