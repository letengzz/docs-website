<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="452" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">截断策略的位置保真</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">预算压到原文 25% 时，不同位置的事实被保留的概率（本机 3,324 篇实测）</text><text x="172" y="378" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0-20%</text><text x="296" y="378" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">20-40%</text><text x="420" y="378" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">40-60%</text><text x="544" y="378" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">60-80%</text><text x="668" y="378" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="middle" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">80-100%</text><line x1="120" y1="358.0" x2="740" y2="358.0" stroke="#e6ecf4" stroke-width="1"/><text x="108" y="362.0" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">0</text><line x1="120" y1="295.5" x2="740" y2="295.5" stroke="#e6ecf4" stroke-width="1"/><text x="108" y="299.5" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">25</text><line x1="120" y1="233.0" x2="740" y2="233.0" stroke="#e6ecf4" stroke-width="1"/><text x="108" y="237.0" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">50</text><line x1="120" y1="170.5" x2="740" y2="170.5" stroke="#e6ecf4" stroke-width="1"/><text x="108" y="174.5" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">75</text><line x1="120" y1="108.0" x2="740" y2="108.0" stroke="#e6ecf4" stroke-width="1"/><text x="108" y="112.0" font-size="11" fill="#5b6b82" font-weight="400" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">100</text><line x1="120" y1="358" x2="740" y2="358" stroke="#9aa8bd" stroke-width="1.2"/><rect x="146" y="108.0" width="22" height="250.0" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><rect x="270" y="306.75" width="22" height="51.25" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><rect x="394" y="358.0" width="22" height="1" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><rect x="518" y="358.0" width="22" height="1" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><rect x="642" y="358.0" width="22" height="1" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><rect x="780" y="118" width="12" height="12" rx="2" fill="#b91c1c" stroke="#b91c1c" stroke-width="1"/><text x="800" y="129" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">头部保留</text><rect x="172" y="213.5" width="22" height="144.5" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="296" y="358.0" width="22" height="1" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="420" y="358.0" width="22" height="1" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="544" y="358.0" width="22" height="1" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="668" y="188.5" width="22" height="169.5" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1"/><rect x="780" y="144" width="12" height="12" rx="2" fill="#b45309" stroke="#b45309" stroke-width="1"/><text x="800" y="155" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">首尾各半</text><rect x="198" y="290.0" width="22" height="68.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><rect x="322" y="300.0" width="22" height="58.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><rect x="446" y="297.75" width="22" height="60.25" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><rect x="570" y="299.75" width="22" height="58.25" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><rect x="694" y="289.5" width="22" height="68.5" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><rect x="780" y="170" width="12" height="12" rx="2" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="800" y="181" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">结构等距</text><rect x="120" y="384" width="660" height="52" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><text x="136" y="406" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">「首尾各半」在 25% 预算下中段保留率 0.0%——它把模型最忽略的中段整段砍掉了。</text><text x="136" y="426" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">预算翻倍也不消偏见：头部保留从 25% 到 50%，60% 之后仍为 0.0%，偏见只是往后移。</text></svg>