<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="asc-data-gates.svg">
  <title>进模型之前的三道闸：最小化 → 识别与降级 → 出域复查</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">进模型之前的三道闸：最小化 → 识别与降级 → 出域复查</text>
  <rect x="32" y="68" width="264" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="46" y="82" width="236" height="26" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="58" y="100" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">闸 1 · 字段白名单</text>
  <text x="46" y="130" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">不该发的不发出去</text>
  <text x="46" y="152" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">敏感数据根本不在场</text>
  <text x="46" y="172" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">成本：成本 ≈ 0</text>
  <text x="46" y="190" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">失效：保守 / 激进相反</text>
  <rect x="318" y="68" width="264" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="332" y="82" width="236" height="26" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="344" y="100" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">闸 2 · 识别与降级</text>
  <text x="332" y="130" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">三档识别 + 五档降级</text>
  <text x="332" y="152" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">漏检一个字段 = 一条外泄</text>
  <text x="332" y="172" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">成本：每次请求都要跑</text>
  <text x="332" y="190" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">失效：保守 / 激进相反</text>
  <rect x="604" y="68" width="264" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="618" y="82" width="236" height="26" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="630" y="100" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">闸 3 · 出域复查</text>
  <text x="618" y="130" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">接收方变了就重新过闸</text>
  <text x="618" y="152" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">接收方不同 → 结论不同</text>
  <text x="618" y="172" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">成本：一次扫描 + 一次记录</text>
  <text x="618" y="190" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">失效：保守 / 激进相反</text>
  <line x1="296" y1="134" x2="312" y2="134" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="582" y1="134" x2="598" y2="134" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="32" y="220" width="836" height="96" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="48" y="244" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">五种降级档位</text>
  <text x="48" y="262" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">掩码 110105********002X</text>
  <text x="294" y="262" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">近似不可逆 · 结构泄露</text>
  <text x="560" y="262" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">要展示、不需跨请求关联</text>
  <text x="48" y="272" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">假名化 用户#7f3a</text>
  <text x="294" y="272" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">可逆（映射表在你手里）</text>
  <text x="560" y="272" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">需跨请求关联</text>
  <text x="48" y="282" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">令牌化 TOK_5ff0b5abba23</text>
  <text x="294" y="282" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">可逆性由你决定 · 格式安全</text>
  <text x="560" y="282" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">交给下游处理又要还原</text>
  <text x="48" y="292" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">泛化 30-39 岁 / 华东</text>
  <text x="294" y="292" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">不可逆（降精度）</text>
  <text x="560" y="292" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">只做聚合统计</text>
  <text x="48" y="302" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="700" fill="#14532d" text-anchor="start" letter-spacing="0">不可逆摘要 sha256(salt+s)</text>
  <text x="294" y="302" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">不可逆 · 只能判相等</text>
  <text x="560" y="302" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">去重、比对</text>
  <line x1="48" y1="270" x2="852" y2="270" stroke="#e2e8f0"/>
  <rect x="32" y="332" width="836" height="118" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="48" y="356" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#9a3412" text-anchor="start" letter-spacing="0">为什么最小化排第一</text>
  <text x="48" y="380" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#7c2d12" text-anchor="start" letter-spacing="0">· 脱敏是在下游修上游的错：数据一旦进了内存、日志、异常栈、APM 采样，就已经在你边界内「在场」了。</text>
  <text x="48" y="402" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#7c2d12" text-anchor="start" letter-spacing="0">· 最小化把「必然要脱敏」降成「偶尔要脱敏」——失效概率从 100% 变成「用户在自由文本里手写敏感信息」的比例。</text>
  <text x="48" y="424" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#7c2d12" text-anchor="start" letter-spacing="0">· 《个人信息保护法》对「匿名化」要求「无法识别且不能复原」两个条件；掩码两个都不满足，令牌化取决于你是否留着映射表。</text>
  <rect x="32" y="462" width="836" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="48" y="486" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">三个必留读数</text>
  <text x="160" y="486" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">pii_types（命中类型集合）· pii_masked（降级条数，0 是合法值）· 日志落地前命中数必须为 0</text>
  <text x="48" y="510" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">判据：出站请求体 PII 命中 = 0；日志里不得出现未脱敏手机号 / 身份证号 / 银行卡号</text>
  <rect x="32" y="534" width="836" height="62" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="48" y="558" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#3730a3" text-anchor="start" letter-spacing="0">一句话</text>
  <text x="120" y="558" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="400" fill="#4338ca" text-anchor="start" letter-spacing="0">数据闸门的判据是「进去的东西少了多少」，不是「我们用了什么脱敏产品」。</text>
  <text x="48" y="582" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">关掉它，读数必须变：pii_masked 归零，出站含 PII 条数上升。</text>
</svg>
