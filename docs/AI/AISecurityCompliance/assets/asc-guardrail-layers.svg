<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="asc-guardrail-layers.svg">
  <title>运行时护栏：五层闸门 + 四种静默失效形态</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="19" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">运行时护栏：五层闸门 + 四种静默失效形态</text>
  <rect x="32" y="64" width="548" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="44" y="76" width="146" height="24" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="93" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="700" fill="#78350f" text-anchor="start" letter-spacing="0">1 · 工具白名单</text>
  <text x="204" y="93" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">不在表里的工具根本不存在</text>
  <text x="204" y="117" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">模型知道 schema 也调不到</text>
  <rect x="32" y="148" width="548" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="44" y="160" width="146" height="24" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="177" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="700" fill="#78350f" text-anchor="start" letter-spacing="0">2 · 参数校验</text>
  <text x="204" y="177" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">类型 + 范围 + 枚举</text>
  <text x="204" y="201" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">模型给的 id 常是字符串</text>
  <rect x="32" y="232" width="548" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="44" y="244" width="146" height="24" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="261" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="700" fill="#78350f" text-anchor="start" letter-spacing="0">3 · 执行身份</text>
  <text x="204" y="261" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">上溯到终端用户，不用服务账号</text>
  <text x="204" y="285" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">用服务账号 = 抹掉「谁做的」</text>
  <rect x="32" y="316" width="548" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="44" y="328" width="146" height="24" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="345" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="700" fill="#78350f" text-anchor="start" letter-spacing="0">4 · 审批闸门</text>
  <text x="204" y="345" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">写 / 执行 / 外发 默认拒绝</text>
  <text x="204" y="369" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">一句话删库、一封邮件外发</text>
  <rect x="32" y="400" width="548" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="44" y="412" width="146" height="24" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="56" y="429" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="700" fill="#78350f" text-anchor="start" letter-spacing="0">5 · 预算与速率</text>
  <text x="204" y="429" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0">按会话与工具双维度</text>
  <text x="204" y="453" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">一次死循环烧完月度额度</text>
  <rect x="600" y="64" width="268" height="388" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="616" y="88" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start" letter-spacing="0">四种失效形态（都不报错）</text>
  <rect x="616" y="118" width="236" height="68" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="630" y="142" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start" letter-spacing="0">旁路</text>
  <text x="630" y="164" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">新加的工具没走护栏</text>
  <rect x="616" y="202" width="236" height="68" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="630" y="226" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start" letter-spacing="0">默认放行</text>
  <text x="630" y="248" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">except / 超时 / 缺配置 → allow</text>
  <rect x="616" y="286" width="236" height="68" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="630" y="310" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start" letter-spacing="0">超时即放行</text>
  <text x="630" y="332" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">审批超时分支写成放行</text>
  <rect x="616" y="370" width="236" height="68" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="630" y="394" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start" letter-spacing="0">单点</text>
  <text x="630" y="416" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="10.5" font-weight="400" fill="#334155" text-anchor="start" letter-spacing="0">护栏是唯一一层，宕机即全通</text>
  <rect x="32" y="466" width="836" height="60" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="48" y="490" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#9a3412" text-anchor="start" letter-spacing="0">排查顺序</text>
  <text x="160" y="490" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#7c2d12" text-anchor="start" letter-spacing="0">先查默认值（所有 default / except: pass / if not config）→ 再查旁路 → 再查超时分支 → 最后查单点</text>
  <text x="48" y="514" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">判据：拒绝理由是一组<tspan font-weight="700">稳定错误码</tspan>（TOOL_NOT_ALLOWED / BUDGET_EXCEEDED / APPROVAL_REQUIRED / ARG_MISSING / ARG_INVALID）</text>
  <rect x="32" y="538" width="836" height="58" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="48" y="562" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="700" fill="#3730a3" text-anchor="start" letter-spacing="0">最难的一条</text>
  <text x="160" y="562" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="12" font-weight="400" fill="#4338ca" text-anchor="start" letter-spacing="0">GR-H：把护栏关掉试一次，下游必须仍然拒绝。只在文档里写「下游也有校验」不算。</text>
  <text x="48" y="586" font-family='system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif' font-size="11" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0">输出即不可信输入：模型输出不得落到 SQL / Shell / innerHTML / 直连 URL 四类位置。</text>
</svg>
