<svg xmlns="http://www.w3.org/2000/svg" width="860" height="372" viewBox="0 0 860 372" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">组成变化：两个切片都变好，整体反而变差</text>

  <text class="h" x="200" y="60">旧版（难题 50%）</text>
  <text class="h" x="620" y="60">新版（难题 90%）</text>

  <rect class="b" x="60" y="76" width="234" height="54" rx="4"/>
  <text class="m" x="177" y="98">简单题 0.900 × 500</text>
  <text class="m" x="177" y="118">难题 0.600 × 500</text>

  <rect class="c" x="60" y="140" width="234" height="54" rx="4"/>
  <text class="h" x="177" y="163">整体 0.750</text>
  <text class="s" x="177" y="182">（0.9×0.5 + 0.6×0.5）</text>

  <rect class="b" x="500" y="76" width="234" height="54" rx="4"/>
  <text class="m" x="617" y="98">简单题 0.950 × 100</text>
  <text class="m" x="617" y="118">难题 0.650 × 900</text>

  <rect class="c" x="500" y="140" width="234" height="54" rx="4"/>
  <text class="h" x="617" y="163">整体 0.680</text>
  <text class="s" x="617" y="182">（0.95×0.1 + 0.65×0.9）</text>

  <path class="arrow" d="M300 163 L454 163"/>
  <text class="s" x="377" y="152">同为 +5pt</text>
  <text class="h" x="377" y="186">整体 −7pt</text>

  <rect class="d" x="60" y="228" width="674" height="56" rx="8"/>
  <text class="m" x="397" y="252">这不是模型退化，是尺子换了刻度：难题占比从 50% 变成 90%。</text>
  <text class="m" x="397" y="272">对比时切片权重必须一致；配额确实要改，就按新权重重算历史，否则曲线会出现假台阶。</text>

  <rect class="a" x="60" y="302" width="674" height="52" rx="8"/>
  <text class="m" x="397" y="324">三种聚合各回答一个问题：微平均＝随机抽一条；宏平均＝各类平均水平；</text>
  <text class="m" x="397" y="344">加权平均＝按真实流量折算。报告里必须写用的是哪个。</text>

</svg>
