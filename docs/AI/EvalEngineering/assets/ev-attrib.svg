<svg xmlns="http://www.w3.org/2000/svg" width="860" height="356" viewBox="0 0 860 356" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">归因四步：先排除不可比，再逐层下钻</text>

  <rect class="a" x="26" y="50" width="190" height="150" rx="8"/>
  <text class="h" x="121" y="76">① 指纹核对</text>
  <text class="s" x="121" y="100">dataset_hash</text>
  <text class="s" x="121" y="118">judge_version</text>
  <text class="s" x="121" y="136">采样参数 / 依赖快照</text>
  <text class="m" x="121" y="166">不一致 → 停止归因</text>
  <text class="s" x="121" y="186">先对齐再说</text>

  <path class="arrow" d="M220 125 L246 125"/>

  <rect class="b" x="250" y="50" width="190" height="150" rx="8"/>
  <text class="h" x="345" y="76">② 切片差分</text>
  <text class="s" x="345" y="100">版本 × 切片矩阵</text>
  <text class="s" x="345" y="118">一格大动 → 专门问题</text>
  <text class="s" x="345" y="136">多格同降 → 系统性</text>
  <text class="m" x="345" y="166">长问题 −16pt</text>
  <text class="s" x="345" y="186">归因范围立刻收窄</text>

  <path class="arrow" d="M444 125 L470 125"/>

  <rect class="d" x="474" y="50" width="190" height="150" rx="8"/>
  <text class="h" x="569" y="76">③ 样本聚类</text>
  <text class="s" x="569" y="100">基线过、当前挂</text>
  <text class="s" x="569" y="118">同类同错占 60%+</text>
  <text class="s" x="569" y="136">集中在某特征</text>
  <text class="m" x="569" y="166">24 条退步</text>
  <text class="s" x="569" y="186">19 条是「引入外部事实」</text>

  <path class="arrow" d="M668 125 L694 125"/>

  <rect class="c" x="698" y="50" width="136" height="150" rx="8"/>
  <text class="h" x="766" y="76">④ 变更二分</text>
  <text class="s" x="766" y="100">单变量回滚</text>
  <text class="s" x="766" y="118">bisect 子集</text>
  <text class="s" x="766" y="136">开关法</text>
  <text class="m" x="766" y="166">#A 修 18/24</text>
  <text class="s" x="766" y="186">主因：召回不足</text>

  <rect class="g" x="26" y="222" width="808" height="48" rx="8"/>
  <text class="m" x="430" y="244">回放五要素：输入（含 context 顺序）/ 提示词哈希 / 判官版本 / 采样参数 / 依赖快照</text>
  <text class="s" x="430" y="262">缺一件，「再跑一次」得到的就不是同一个结果，对比也没意义</text>

  <rect class="d" x="26" y="286" width="808" height="52" rx="8"/>
  <text class="m" x="430" y="308">最常见的浪费：看到红就去看最近的代码改动。若红来自昨天补的 20 条难样本，</text>
  <text class="m" x="430" y="328">代码里根本没有原因——先对齐指纹，再看分数，最后看代码。</text>

</svg>
