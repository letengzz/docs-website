<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">一致性：原始一致率会白送分，κ 把它扣掉</text>

  <text class="m" x="150" y="60">人工</text>
  <text class="m" x="330" y="60">判 pass</text>
  <text class="m" x="520" y="60">判 fail</text>

  <rect class="g" x="220" y="72" width="150" height="56" rx="4"/>
  <text class="m" x="295" y="96">判 pass</text>
  <text class="s" x="295" y="116">tp / 都过</text>

  <rect class="g" x="380" y="72" width="150" height="56" rx="4"/>
  <text class="m" x="455" y="96">判 fail</text>
  <text class="s" x="455" y="116">fn / 甲过乙不过</text>

  <rect class="g" x="220" y="138" width="150" height="56" rx="4"/>
  <text class="m" x="295" y="162">fp / 甲过乙不过</text>

  <rect class="g" x="380" y="138" width="150" height="56" rx="4"/>
  <text class="m" x="455" y="162">tn / 都不过</text>

  <rect class="a" x="560" y="72" width="270" height="122" rx="8"/>
  <text class="h" x="695" y="96">κ 的三个读数</text>
  <text class="m" x="695" y="120">50/50：po .900 → κ .798</text>
  <text class="m" x="695" y="142">缺陷 5%：po .977 → κ .684</text>
  <text class="m" x="695" y="164">缺陷 2%：po .987 → κ .495</text>
  <text class="s" x="695" y="184">同样是「几乎全对」，含义完全不同</text>

  <rect class="c" x="60" y="220" width="770" height="56" rx="8"/>
  <text class="m" x="445" y="244">98.7% 的一致率，κ 只有 0.495：因为样本 98% 都是 pass，判官永远说 pass 也能拿到 98%。</text>
  <text class="m" x="445" y="264">κ 扣掉这份「白送的分」，剩下的才是真本事。</text>

  <rect class="d" x="60" y="294" width="770" height="52" rx="8"/>
  <text class="m" x="445" y="316">报告 κ 时必须同时给：N、标签分布、po、混淆矩阵。少一项，κ 就无法被质疑。</text>
  <text class="m" x="445" y="336">≥3 人用 Fleiss κ；有序档位用加权 κ 或 α——别硬套 Cohen。</text>

</svg>
