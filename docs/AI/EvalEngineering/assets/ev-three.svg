<svg xmlns="http://www.w3.org/2000/svg" width="860" height="386" viewBox="0 0 860 386" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">三种有效性：串联的，不是并列的</text>

  <rect class="a" x="60" y="50" width="740" height="66" rx="8"/>
  <text class="h" x="120" y="78">构念有效性</text>
  <text class="m" x="330" y="76">样本与评分真的在测「我们关心的能力」吗</text>
  <text class="m" x="330" y="98">症状：题目有歧义、只认一种句式、用关键词代替正确性</text>

  <path class="arrow" d="M430 120 L430 136"/>

  <rect class="a" x="60" y="140" width="740" height="66" rx="8"/>
  <text class="h" x="120" y="168">内部有效性</text>
  <text class="m" x="330" y="166">分数变化真的只来自本次改动吗</text>
  <text class="m" x="330" y="188">症状：数据/判官/参数/缓存一起变，只归因给提示词</text>

  <path class="arrow" d="M430 210 L430 226"/>

  <rect class="a" x="60" y="230" width="740" height="66" rx="8"/>
  <text class="h" x="120" y="258">外部有效性</text>
  <text class="m" x="330" y="256">这个结论推得到真实流量上吗</text>
  <text class="m" x="330" y="278">症状：离线全是干净短问，线上是长上下文 + 口语 + 多轮</text>

  <rect class="c" x="60" y="318" width="740" height="48" rx="8"/>
  <text class="m" x="430" y="338">构念错了 → 精确地测错东西；内部不干净 → 把噪声放大到线上；</text>
  <text class="m" x="430" y="356">外部推得再远也一样。所以顺序是：先对题，再控变量，最后谈推广。</text>

</svg>
