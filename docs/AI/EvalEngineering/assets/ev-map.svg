<svg xmlns="http://www.w3.org/2000/svg" width="860" height="386" viewBox="0 0 860 386" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">四个问题，十条路径：评测工程的分工</text>
  <rect class="a" x="20" y="46" width="196" height="250" rx="8"/>
  <text class="h" x="118" y="72">测得准</text>
  <text class="s" x="118" y="94">判据真的在测那件事吗</text>
  <text class="m" x="118" y="120">全景：三种有效性</text>
  <text class="m" x="118" y="144">评测集：配额与冻结</text>
  <text class="m" x="118" y="168">判官：偏差与校准</text>
  <text class="m" x="118" y="192">人工：κ 与仲裁</text>
  <text class="s" x="118" y="224">产出：一个可被质疑的</text>
  <text class="s" x="118" y="240">判据 + 适用范围</text>

  <rect class="b" x="228" y="46" width="196" height="250" rx="8"/>
  <text class="h" x="326" y="72">量得稳</text>
  <text class="s" x="326" y="94">这个数带多大误差</text>
  <text class="m" x="326" y="120">指标口径：六种含义</text>
  <text class="m" x="326" y="144">区间：bootstrap</text>
  <text class="m" x="326" y="168">检验：McNemar 配对</text>
  <text class="m" x="326" y="192">样本量：MDE</text>
  <text class="s" x="326" y="224">产出：点估计 + 区间</text>
  <text class="s" x="326" y="240">+ 显著性结论</text>

  <rect class="d" x="436" y="46" width="196" height="250" rx="8"/>
  <text class="h" x="534" y="72">拦得住</text>
  <text class="s" x="534" y="94">门禁能不能拦住发布</text>
  <text class="m" x="534" y="120">三层闸门 L1/L2/L3</text>
  <text class="m" x="534" y="144">阈值来自历史分布</text>
  <text class="m" x="534" y="168">四态：pass/warn/</text>
  <text class="m" x="534" y="186">fail/error</text>
  <text class="m" x="534" y="212">豁免：范围与期限</text>
  <text class="s" x="534" y="240">产出：一条能证伪的</text>
  <text class="s" x="534" y="256">退出码</text>

  <rect class="c" x="644" y="46" width="196" height="250" rx="8"/>
  <text class="h" x="742" y="72">说得清</text>
  <text class="s" x="742" y="94">红了之后归因到哪</text>
  <text class="m" x="742" y="120">指纹核对</text>
  <text class="m" x="742" y="144">切片差分矩阵</text>
  <text class="m" x="742" y="168">样本级聚类</text>
  <text class="m" x="742" y="192">变更二分</text>
  <text class="m" x="742" y="216">单样本回放</text>
  <text class="s" x="742" y="240">产出：一条可交接的</text>
  <text class="s" x="742" y="256">归因记录</text>

  <path class="arrow" d="M216 170 L224 170"/>
  <path class="arrow" d="M424 170 L432 170"/>
  <path class="arrow" d="M632 170 L640 170"/>

  <rect class="g" x="20" y="316" width="820" height="46" rx="6"/>
  <text class="m" x="430" y="336">两条贯穿线：实战（从零搭流水线 S1~S10）· 常见问题（十类现象分诊）</text>
  <text class="s" x="430" y="354">判据族：EVO / EVD / EVJ / EVM / EVA / EVS / EVG / EVR / EVP / EVQ，共 80 条</text>

</svg>
