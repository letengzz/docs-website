<svg xmlns="http://www.w3.org/2000/svg" width="860" height="338" viewBox="0 0 860 338" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <style>
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .c { fill: #fdeeee; stroke: #c95555; stroke-width: 1.5; }
    .d { fill: #fff8e6; stroke: #d9a441; stroke-width: 1.5; }
    .g { fill: #f4f5f7; stroke: #9aa3b2; stroke-width: 1.2; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .m { font-size: 11px; fill: #2b2b2b; }
    .arrow { stroke: #8a94a6; stroke-width: 1.5; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="t" x="430" y="26">三把尺子：区间、配对检验、最小可检测效应</text>

  <rect class="a" x="24" y="48" width="258" height="196" rx="8"/>
  <text class="h" x="153" y="74">① 区间（误差棒）</text>
  <text class="m" x="153" y="100">n=50 → ±11.0pt</text>
  <text class="m" x="153" y="122">n=100 → ±8.5pt</text>
  <text class="m" x="153" y="144">n=300 → ±4.5pt</text>
  <text class="m" x="153" y="166">n=1000 → ±2.6pt</text>
  <text class="s" x="153" y="196">bootstrap，固定种子</text>
  <text class="s" x="153" y="214">区间重叠＝分不出</text>

  <rect class="b" x="300" y="48" width="258" height="196" rx="8"/>
  <text class="h" x="429" y="74">② 配对检验</text>
  <text class="m" x="429" y="100">只看不一致对 b/c</text>
  <text class="m" x="429" y="122">9 vs 21 → p=.043</text>
  <text class="m" x="429" y="144">15 vs 27 → p=.088</text>
  <text class="m" x="429" y="166">净差都是 12</text>
  <text class="s" x="429" y="196">显著性看不一致对总数</text>
  <text class="s" x="429" y="214">不看「净差」</text>

  <rect class="d" x="576" y="48" width="258" height="196" rx="8"/>
  <text class="h" x="705" y="74">③ 样本量（MDE）</text>
  <text class="m" x="705" y="100">n=100 → 7.9pt</text>
  <text class="m" x="705" y="122">n=300 → 4.6pt</text>
  <text class="m" x="705" y="144">n=1000 → 2.5pt</text>
  <text class="s" x="705" y="174">先定「要分辨多大」</text>
  <text class="s" x="705" y="192">再定跑多少条</text>
  <text class="s" x="705" y="214">α=.05，power=.8</text>

  <rect class="c" x="24" y="266" width="810" height="56" rx="8"/>
  <text class="m" x="429" y="290">门禁阈值 = 基线 − max(2 × 实测抖动, MDE)。容差小于噪声，门禁必然时红时绿；</text>
  <text class="m" x="429" y="310">基线随每次运行滚动，缓慢退步永远不会被发现。</text>

</svg>
