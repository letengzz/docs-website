<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">端云路由：合规 → 能力 → 网络 → 置信度 → 预算</text>
  <text x="380.0" y="52" text-anchor="middle" font-size="10.5" fill="#64748B">顺序不能换：合规是硬约束，不能被降级路径绕过</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
  <rect x="34" y="76" width="134" height="62" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="101.0" y="96" text-anchor="middle" font-size="9.4" fill="#DC2626" font-weight="bold">① 合规</text>
  <text x="101.0" y="114" text-anchor="middle" font-size="7.8" fill="#64748B">禁止出端？</text>
  <line x1="168" y1="107" x2="180" y2="107" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="180" y="76" width="134" height="62" rx="7" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="247.0" y="96" text-anchor="middle" font-size="9.4" fill="#EA580C" font-weight="bold">② 能力</text>
  <text x="247.0" y="114" text-anchor="middle" font-size="7.8" fill="#64748B">端侧就绪？输入不太长？</text>
  <line x1="314" y1="107" x2="326" y2="107" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="326" y="76" width="134" height="62" rx="7" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.4"/>
  <text x="393.0" y="96" text-anchor="middle" font-size="9.4" fill="#CA8A04" font-weight="bold">③ 网络</text>
  <text x="393.0" y="114" text-anchor="middle" font-size="7.8" fill="#64748B">云端可达？</text>
  <line x1="460" y1="107" x2="472" y2="107" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="472" y="76" width="134" height="62" rx="7" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.4"/>
  <text x="539.0" y="96" text-anchor="middle" font-size="9.4" fill="#0891B2" font-weight="bold">④ 置信度</text>
  <text x="539.0" y="114" text-anchor="middle" font-size="7.8" fill="#64748B">端侧分数 ≥ 阈值？</text>
  <line x1="606" y1="107" x2="618" y2="107" stroke="#CBD5E1" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="618" y="76" width="134" height="62" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="685.0" y="96" text-anchor="middle" font-size="9.4" fill="#7C3AED" font-weight="bold">⑤ 预算</text>
  <text x="685.0" y="114" text-anchor="middle" font-size="7.8" fill="#64748B">热/电量/时间够？</text>
  <line x1="380" y1="138" x2="380" y2="168" stroke="#16A34A" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="390" y="160" font-size="8.4" fill="#15803D">全部通过 → 端侧</text>
  <rect x="160" y="172" width="200" height="54" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/>
  <text x="260.0" y="192" text-anchor="middle" font-size="9.6" fill="#16A34A" font-weight="bold">走端侧</text>
  <text x="260.0" y="210" text-anchor="middle" font-size="8" fill="#64748B">省流量/隐私/离线可用</text>
  <text x="260.0" y="224" text-anchor="middle" font-size="8" fill="#64748B">记录 reason=edge_ok</text>
  <rect x="390" y="172" width="200" height="54" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="490.0" y="192" text-anchor="middle" font-size="9.6" fill="#2563EB" font-weight="bold">走云端</text>
  <text x="490.0" y="210" text-anchor="middle" font-size="8" fill="#64748B">质量更好/长输入</text>
  <text x="490.0" y="224" text-anchor="middle" font-size="8" fill="#64748B">记录 reason=low_conf 等</text>
  <rect x="610" y="172" width="130" height="54" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="675.0" y="192" text-anchor="middle" font-size="9.6" fill="#DC2626" font-weight="bold">明确失败</text>
  <text x="675.0" y="210" text-anchor="middle" font-size="7.8" fill="#64748B">保留用户输入</text>
  <text x="675.0" y="224" text-anchor="middle" font-size="7.8" fill="#64748B">给出可重试</text>
  <line x1="40" y1="242" x2="720" y2="242" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="264" font-size="9.6" fill="#0F172A" font-weight="bold">失败矩阵：用户看到什么（必须提前填完）</text>
  <rect x="40" y="276" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="291" font-size="8" fill="#334155">端可用 / 云可用</text>
  <text x="300" y="291" font-size="8" fill="#16A34A">正常结果（不提示走了哪条路）</text>
  <rect x="40" y="302" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="317" font-size="8" fill="#334155">端不可用 / 云可用</text>
  <text x="300" y="317" font-size="8" fill="#16A34A">正常结果</text>
  <rect x="40" y="328" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="343" font-size="8" fill="#334155">端可用 / 云不可达</text>
  <text x="300" y="343" font-size="8" fill="#CA8A04">结果 + 角标「离线」</text>
  <rect x="40" y="354" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="369" font-size="8" fill="#334155">都不可用</text>
  <text x="300" y="369" font-size="8" fill="#EA580C">明确说明 + 可重试 + 保留输入</text>
  <rect x="40" y="380" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="395" font-size="8" fill="#334155">端超时 / 云可用</text>
  <text x="300" y="395" font-size="8" fill="#CA8A04">结果（必要时提示「已切换」）</text>
  <rect x="40" y="406" width="680" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
  <text x="52" y="421" font-size="8" fill="#334155">合规禁出端 + 端不可用</text>
  <text x="300" y="421" font-size="8" fill="#DC2626">「该内容仅支持设备内处理」——不得偷偷上云</text>
  <text x="380" y="452" text-anchor="middle" font-size="9" fill="#64748B">每个决策都要记 reason：上线后统计分布，才知道端侧到底省了多少请求（edge 占比 40%~80% 为健康）</text>
</svg>
