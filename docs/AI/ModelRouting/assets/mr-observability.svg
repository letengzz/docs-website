<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="决策日志九字段与三张看板">
  <title>一次决策的九个字段，回答三个问题</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="490" fill="#f8fafc"/>
  <text x="450.0" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">一次决策的九个字段，回答三个问题</text>
  <rect x="30" y="62" width="470" height="330" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="46" y="86" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">一条决策日志（JSONL）</text>
  <rect x="46" y="104" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="115" y="125" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">request_id</text>
  <text x="115" y="142" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">全链路</text>
  <rect x="194" y="104" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="263" y="125" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">policy_version</text>
  <text x="263" y="142" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">按哪套规则</text>
  <rect x="342" y="104" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="411" y="125" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">route_reason</text>
  <text x="411" y="142" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">为什么</text>
  <rect x="46" y="170" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="115" y="191" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">candidates</text>
  <text x="115" y="208" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">有什么可选</text>
  <rect x="194" y="170" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="263" y="191" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">chosen_model</text>
  <text x="263" y="208" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">实际用谁</text>
  <rect x="342" y="170" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="411" y="191" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">fallback_depth</text>
  <text x="411" y="208" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">降了几级</text>
  <rect x="46" y="236" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="115" y="257" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">verifier_score</text>
  <text x="115" y="274" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">验证器给几分</text>
  <rect x="194" y="236" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="263" y="257" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">usage / cost</text>
  <text x="263" y="274" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">花了多少</text>
  <rect x="342" y="236" width="138" height="52" rx="5" fill="#f5f3ff" stroke="#cbd5e1"/>
  <text x="411" y="257" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">latency 分段</text>
  <text x="411" y="274" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">慢在哪</text>
  <text x="46" y="372" font-size="9.2" fill="#be123c" text-anchor="start" font-weight="400">失败请求也要写一条（至少含错误码与 fallback_depth）</text>
  <rect x="580" y="30" width="290" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="54" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">成本瀑布</text>
  <text x="596" y="74" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">全用大模型 → 节省 → 重试 → 账单</text>
  <line x1="504" y1="63" x2="574" y2="63" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <rect x="580" y="130" width="290" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="154" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">路由桑基图</text>
  <text x="596" y="174" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">请求 → 分支 → 模型 → 结果</text>
  <line x1="504" y1="163" x2="574" y2="163" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <rect x="580" y="230" width="290" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="254" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">质量分层</text>
  <text x="596" y="274" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">按难度/租户/意图的准确率</text>
  <line x1="504" y1="263" x2="574" y2="263" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <rect x="580" y="330" width="290" height="62" rx="7" fill="#fff1f2" stroke="#be123c"/>
  <text x="596" y="352" font-size="9.8" fill="#be123c" text-anchor="start" font-weight="700">第四张图不要做：模型调用量趋势</text>
  <text x="596" y="370" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">它对决策没有帮助，只会占满大屏。</text>
  <text x="30" y="424" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">三个问题：钱花在哪（cost_delta）· 质量掉在哪（误接受率）· 策略何时开始漂（未命中率 / 分数分布）。</text>
  <text x="30" y="448" font-size="10.2" fill="#475569" text-anchor="start" font-weight="400">没有 cost_delta，「我们省了 60%」永远是一句无法验证的话。</text>
</svg>
