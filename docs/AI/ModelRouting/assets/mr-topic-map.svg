<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="模型路由七跳链路：网关、信号、决策、执行、验证、交付、回流">
  <title>模型路由与降级：一次请求的七跳</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450.0" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">模型路由与降级：一次请求的七跳</text>
<rect x="30" y="72" width="160" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="110.0" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">① 客户端</text>
  <text x="110.0" y="112" font-size="9.6" fill="#475569" text-anchor="middle">deadline / 租户</text>
<rect x="200" y="72" width="160" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="280.0" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">② 网关入口</text>
  <text x="280.0" y="112" font-size="9.6" fill="#475569" text-anchor="middle">鉴权 · 配额 · 预算</text>
<rect x="370" y="72" width="160" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="450.0" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">③ 信号层</text>
  <text x="450.0" y="112" font-size="9.6" fill="#475569" text-anchor="middle">难度 · 意图 · 约束</text>
<rect x="540" y="72" width="160" height="66" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="620.0" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">④ 决策层</text>
  <text x="620.0" y="112" font-size="9.6" fill="#475569" text-anchor="middle">选档 · 定降级序</text>
<rect x="710" y="72" width="160" height="66" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="790.0" y="94" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">⑤ 执行层</text>
  <text x="790.0" y="112" font-size="9.6" fill="#475569" text-anchor="middle">超时 · 重试 · 熔断</text>
  <line x1="190" y1="105" x2="200" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="360" y1="105" x2="370" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="530" y1="105" x2="540" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="700" y1="105" x2="710" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="250" width="160" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="110.0" y="272" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">⑥ 验证器</text>
  <text x="110.0" y="290" font-size="9.6" fill="#475569" text-anchor="middle">分数 · 断言 · 抽样</text>
<rect x="200" y="250" width="160" height="66" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="280.0" y="272" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">⑦ 交付</text>
  <text x="280.0" y="290" font-size="9.6" fill="#475569" text-anchor="middle">降级标记 · 质量声明</text>
<rect x="370" y="250" width="160" height="66" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="450.0" y="272" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">供应商 A</text>
  <text x="450.0" y="290" font-size="9.6" fill="#475569" text-anchor="middle">主区域</text>
<rect x="540" y="250" width="160" height="66" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="620.0" y="272" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">供应商 B</text>
  <text x="620.0" y="290" font-size="9.6" fill="#475569" text-anchor="middle">跨云 / 跨模型家族</text>
<rect x="710" y="250" width="160" height="66" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="790.0" y="272" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">本地模型</text>
  <text x="790.0" y="290" font-size="9.6" fill="#475569" text-anchor="middle">降级最后一档</text>
  <line x1="790" y1="138" x2="790" y2="244" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="782" y="200" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="400">三档候选</text>
  <path d="M 110 250 L 110 210 L 450 210 L 450 138" fill="none" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="280" y="204" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="400">结果回流：成本 / 质量 / 延迟 → 标定阈值</text>
  <text x="30" y="356" font-size="10" fill="#475569" text-anchor="start" font-weight="400">候选池顺序即降级顺序：A（主区域）→ B（跨云 / 跨模型家族）→ 本地（最后一档）</text>
  <text x="30" y="376" font-size="10" fill="#be123c" text-anchor="start" font-weight="400">降级事件单独记账，不与「策略降档」混算——否则永远分不清是省钱还是兜底。</text>
  <text x="30" y="420" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">四层职责：入口不做决策 · 信号不调大模型 · 决策不做 IO · 执行不改规则</text>
  <rect x="30" y="440" width="14" height="14" rx="3" fill="#1d4ed8"/>
  <text x="50" y="452" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">入口</text>
  <rect x="140" y="440" width="14" height="14" rx="3" fill="#0f766e"/>
  <text x="160" y="452" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">信号/决策</text>
  <rect x="250" y="440" width="14" height="14" rx="3" fill="#b45309"/>
  <text x="270" y="452" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">执行</text>
  <rect x="360" y="440" width="14" height="14" rx="3" fill="#6d28d9"/>
  <text x="380" y="452" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">验证</text>
  <rect x="470" y="440" width="14" height="14" rx="3" fill="#be123c"/>
  <text x="490" y="452" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">交付</text>
  <rect x="30" y="470" width="840" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="45" y="490" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">读法：②⑤ 是「省不省钱」的关键，⑥ 是「敢不敢降档」的关键，⑦ 是「用户知不知道」的关键。</text>
  <text x="45" y="508" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">七跳里任何一跳缺失，系统都会表现为「能用但说不清」——不报错，只是没人敢改。</text>
</svg>
