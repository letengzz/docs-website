<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="超时预算条形图：1次、2次、3次尝试的切分">
  <title>3000ms 的三段预算：重试越多，每次越早放弃</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450.0" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">3000ms 的三段预算：重试越多，每次越早放弃</text>
  <text x="40" y="128" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">1 次尝试</text>
  <rect x="90.0" y="110" width="7.8" height="30" fill="#475569" opacity="0.25" stroke="#475569"/>
  <rect x="97.8" y="110" width="5.2" height="30" fill="#0f766e" opacity="0.25" stroke="#0f766e"/>
  <rect x="103.0" y="110" width="728.0" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="467.0" y="130" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">单次超时 2800ms</text>
  <rect x="831.0" y="110" width="39.0" height="30" fill="#cbd5e1" opacity="0.18" stroke="#cbd5e1"/>
  <text x="40" y="238" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">2 次尝试</text>
  <rect x="90.0" y="220" width="7.8" height="30" fill="#475569" opacity="0.25" stroke="#475569"/>
  <rect x="97.8" y="220" width="5.2" height="30" fill="#0f766e" opacity="0.25" stroke="#0f766e"/>
  <rect x="103.0" y="220" width="31.2" height="30" fill="#b45309" opacity="0.25" stroke="#b45309"/>
  <rect x="134.2" y="220" width="348.4" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="308.4" y="240" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">尝试 1340ms</text>
  <rect x="482.6" y="220" width="348.4" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="656.8000000000001" y="240" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">尝试 1340ms</text>
  <rect x="831.0" y="220" width="39.0" height="30" fill="#cbd5e1" opacity="0.18" stroke="#cbd5e1"/>
  <text x="40" y="348" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">3 次尝试</text>
  <rect x="90.0" y="330" width="7.8" height="30" fill="#475569" opacity="0.25" stroke="#475569"/>
  <rect x="97.8" y="330" width="5.2" height="30" fill="#0f766e" opacity="0.25" stroke="#0f766e"/>
  <rect x="103.0" y="330" width="31.2" height="30" fill="#b45309" opacity="0.25" stroke="#b45309"/>
  <rect x="134.2" y="330" width="211.4" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="239.89" y="350" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">尝试 813ms</text>
  <rect x="345.6" y="330" width="62.4" height="30" fill="#b45309" opacity="0.25" stroke="#b45309"/>
  <rect x="408.0" y="330" width="211.4" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="513.6700000000001" y="350" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">尝试 813ms</text>
  <rect x="619.4" y="330" width="211.4" height="30" fill="#1d4ed8" opacity="0.25" stroke="#1d4ed8"/>
  <text x="725.05" y="350" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="400">尝试 813ms</text>
  <rect x="830.7" y="330" width="39.0" height="30" fill="#cbd5e1" opacity="0.18" stroke="#cbd5e1"/>
  <text x="90" y="92" font-size="9" fill="#475569" text-anchor="start" font-weight="400">0ms</text>
  <text x="870.0" y="92" font-size="9" fill="#475569" text-anchor="end" font-weight="400">3000ms</text>
  <text x="40" y="400" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">1 次：几乎不重试，靠超时保底。2 次：通用选择，单次预算砍半。3 次：只适合本身很快的小模型。</text>
  <rect x="40" y="416" width="820" height="38" rx="6" fill="#fff1f2" stroke="#be123c"/>
  <text x="56" y="440" font-size="10.4" fill="#be123c" text-anchor="start" font-weight="600">铁律：单次 P95 已超过超时上限 60% 时，不要重试——重试只会把「慢」变成「慢且失败两次」。</text>
</svg>
