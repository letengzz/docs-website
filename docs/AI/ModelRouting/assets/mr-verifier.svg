<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="验证器四档：成本、准确率、误接受率">
  <title>验证器质量决定级联的位置</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450.0" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">验证器质量决定级联的位置</text>
  <text x="40" y="74" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">验证器</text>
  <text x="230" y="74" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">每请求成本（越短越省）</text>
  <text x="510" y="74" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">准确率（0.90 → 1.00）</text>
  <text x="790" y="74" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">误接受率</text>
  <rect x="40" y="100" width="820" height="64" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="128" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">很粗（AUC≈0.70）</text>
  <text x="56" y="146" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">成本 6.62 / 准确率 0.945</text>
  <rect x="230" y="122" width="211" height="18" rx="4" fill="#be123c" opacity="0.75"/>
  <text x="447.4722222222222" y="136" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">6.62</text>
  <rect x="510" y="122" width="103" height="18" rx="4" fill="#be123c" opacity="0.55"/>
  <text x="619.4999999999998" y="136" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">0.945</text>
  <text x="790" y="136" font-size="11" fill="#be123c" text-anchor="start" font-weight="700">4.8%</text>
  <rect x="40" y="182" width="820" height="64" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="210" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">中等（AUC≈0.83）</text>
  <text x="56" y="228" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">成本 5.51 / 准确率 0.978</text>
  <rect x="230" y="204" width="176" height="18" rx="4" fill="#b45309" opacity="0.75"/>
  <text x="412.0138888888889" y="218" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">5.51</text>
  <rect x="510" y="204" width="179" height="18" rx="4" fill="#b45309" opacity="0.55"/>
  <text x="695.3999999999999" y="218" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">0.978</text>
  <text x="790" y="218" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">1.5%</text>
  <rect x="40" y="264" width="820" height="64" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="292" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">较准（AUC≈0.93）</text>
  <text x="56" y="310" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">成本 4.21 / 准确率 0.995</text>
  <rect x="230" y="286" width="134" height="18" rx="4" fill="#0f766e" opacity="0.75"/>
  <text x="370.4861111111111" y="300" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">4.21</text>
  <rect x="510" y="286" width="218" height="18" rx="4" fill="#0f766e" opacity="0.55"/>
  <text x="734.5" y="300" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">0.995</text>
  <text x="790" y="300" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700">0.2%</text>
  <rect x="40" y="346" width="820" height="64" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="374" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">很准（AUC≈0.98）</text>
  <text x="56" y="392" font-size="9.2" fill="#475569" text-anchor="start" font-weight="400">成本 3.33 / 准确率 0.997</text>
  <rect x="230" y="368" width="106" height="18" rx="4" fill="#15803d" opacity="0.75"/>
  <text x="342.375" y="382" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">3.33</text>
  <rect x="510" y="368" width="223" height="18" rx="4" fill="#15803d" opacity="0.55"/>
  <text x="739.0999999999999" y="382" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">0.997</text>
  <text x="790" y="382" font-size="11" fill="#15803d" text-anchor="start" font-weight="700">0.0%</text>
  <text x="40" y="446" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">同一套级联、同一阈值，只换验证器：成本降一半、准确率升 5 个百分点——比换模型有效得多。</text>
</svg>
