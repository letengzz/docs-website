<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">推理请求调度与批处理：七段链路与九族判据</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">从「请求进来」到「决定加几张卡」，每一段都有自己的读数与代价，缺一段就有一类失败查不出来</text>
<rect x="36" y="110" width="122" height="120" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="48" y="134" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 看</text>
<text x="48" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">七段链路</text>
<text x="48" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">三种资源</text>
<text x="48" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">五个必失点</text>
<line x1="158" y1="170" x2="164" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="164" y="110" width="122" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="176" y="134" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 收</text>
<text x="176" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">准入三闸</text>
<text x="176" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">队列上限</text>
<text x="176" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">拒绝语义</text>
<line x1="286" y1="170" x2="292" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="292" y="110" width="122" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="304" y="134" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 成形</text>
<text x="304" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">静态 / 连续</text>
<text x="304" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">填充浪费</text>
<text x="304" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">分块 prefill</text>
<line x1="414" y1="170" x2="420" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="420" y="110" width="122" height="120" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="432" y="134" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 显存</text>
<text x="432" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">KV 块</text>
<text x="432" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">抢占与重算</text>
<text x="432" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">前缀复用</text>
<line x1="542" y1="170" x2="548" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="548" y="110" width="122" height="120" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="560" y="134" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑤ 分级</text>
<text x="560" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">TTFT / TPOT</text>
<text x="560" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">优先级</text>
<text x="560" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">防饿死</text>
<line x1="670" y1="170" x2="676" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="676" y="110" width="122" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="688" y="134" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑥ 弹性</text>
<text x="688" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">冷启动六段</text>
<text x="688" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">就绪闸门</text>
<text x="688" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">预热池</text>
<line x1="798" y1="170" x2="804" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="804" y="110" width="122" height="120" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="816" y="134" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑦ 兜底</text>
<text x="816" y="156" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">重试放大</text>
<text x="816" y="173" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">降级阶梯</text>
<text x="816" y="190" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">熔断</text>
<rect x="36" y="258" width="888" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="282" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">判据层：9 族 72 条（IFO / IFA / IFB / IFK / IFS / IFC / IFL / IFP / IFX）</text>
<text x="48" y="304" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每页 8 条，逐族前缀唯一；每条必须回答「看什么现象、判成什么、不满足时改哪里」</text>
<rect x="36" y="366" width="434" height="78" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="48" y="390" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">读数层：四个数必须分开</text>
<text x="48" y="412" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">queue_wait / prefill_ms / tpot_ms / batch_size_at_admit</text>
<rect x="490" y="366" width="434" height="78" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="502" y="390" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">算式层：三个口径不能混用</text>
<text x="502" y="412" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">峰值吞吐 / 可用容量 / 规划容量</text>
</svg>
