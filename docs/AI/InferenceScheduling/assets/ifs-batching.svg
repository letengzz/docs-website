<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">四种批策略与批内时间轴</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">批大小不是参数，是到达率与等待策略的乘积——想凑大批只能等，等来的延迟比省下的算力更贵</text>
<rect x="36" y="100" width="424" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="48" y="124" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">静态批：等满一批再算</text>
<text x="48" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">批内所有请求同时开始、按最长的结束</text>
<text x="48" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">短的等长的；padding 浪费 66%~155%</text>
<text x="48" y="180" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">低负载下 TTFT 4,441 ms</text>
<rect x="476" y="100" width="448" height="120" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="488" y="124" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">连续批：每步一格，完成即让位</text>
<text x="488" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">新请求补进刚空出的位置</text>
<text x="488" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">无 padding；TTFT 56.9 ms</text>
<text x="488" y="180" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">所有主流引擎默认开启</text>
<rect x="36" y="240" width="288" height="92" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="48" y="264" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">批=1</text>
<text x="48" y="286" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">6.35 ms/token</text>
<text x="48" y="303" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">157 tok/s</text>
<rect x="336" y="240" width="288" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="348" y="264" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">批=8</text>
<text x="348" y="286" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1.10 ms/token</text>
<text x="348" y="303" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">909 tok/s</text>
<rect x="636" y="240" width="288" height="92" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="648" y="264" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">批=32</text>
<text x="648" y="286" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">0.54 ms/token</text>
<text x="648" y="303" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1,860 tok/s</text>
<rect x="36" y="348" width="434" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="372" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">分块 prefill</text>
<text x="48" y="394" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">长 prompt 切块插进 decode 流</text>
<text x="48" y="411" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价：长 prompt 的 TTFT 变成多步</text>
<rect x="490" y="348" width="434" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="502" y="372" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">P/D 分离</text>
<text x="502" y="394" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">prefill 与 decode 分实例，KV 走高速链路</text>
<text x="502" y="411" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价：部署复杂 + KV 传输</text>
<rect x="36" y="456" width="888" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="480" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">结论：固定开销占 batch=1 时 94% 的时间</text>
<text x="48" y="502" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">「调大 batch_size 提吞吐」只有在「真的有那么多请求同时在等」时才成立；否则只是把等待换成填充浪费</text>
</svg>
