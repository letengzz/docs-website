<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">TTFT 与 TPOT：两段预算与分级队列</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">一个「端到端延迟」指标无法同时约束这两个方向相反的合同</text>
<rect x="36" y="100" width="424" height="108" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="48" y="124" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">TTFT = 排队 + prefill</text>
<text x="48" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">由「等多久」与「输入多长」决定</text>
<text x="48" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">优化方向：小批、前缀复用</text>
<text x="48" y="180" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">预算例：100 + 350 + 50 = 500 ms</text>
<rect x="476" y="100" width="448" height="108" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="488" y="124" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">TPOT = 每个输出 token 的间隔</text>
<text x="488" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">由 decode 的批大小决定</text>
<text x="488" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">优化方向：更大批、更低精度</text>
<text x="488" y="180" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">预算例：≤ 50 ms/token</text>
<rect x="36" y="230" width="888" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="48" y="254" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">均值 45.0 ms 达标，p99 128.9 ms 违约——两个结论同时成立</text>
<text x="48" y="276" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">p50 42.1 / p95 60.3 / p99 128.9(2.9×) / p99.9 443.9(9.9×)：用均值定义 SLO 等于承诺「大部分人还行」</text>
<rect x="36" y="340" width="424" height="88" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="48" y="364" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">饱和时分级：短请求 p50 120,021 → 3,437 ms</text>
<text x="48" y="386" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">35 倍；p99 179,773 → 12,262 ms（14.7 倍）</text>
<rect x="476" y="340" width="448" height="88" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="488" y="364" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">轻载时分级：一位小数都不差</text>
<text x="488" y="386" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">64.3 vs 64.3 ms —— 分级是拥塞时的规则，不是常态优化</text>
</svg>
