<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">冷启动六段与就绪闸门</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">扩容是唯一「越急越不管用」的手段——等副本起来，请求早已被重试放大三倍</text>
<rect x="36" y="100" width="142" height="78" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="48" y="124" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 调度</text>
<text x="48" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1~60 s</text>
<line x1="178" y1="139" x2="188" y2="139" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="188" y="100" width="142" height="78" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="200" y="124" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 拉镜像</text>
<text x="200" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">5~120 s</text>
<line x1="330" y1="139" x2="340" y2="139" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="340" y="100" width="142" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="352" y="124" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 读权重</text>
<text x="352" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1.7~280 s</text>
<line x1="482" y1="139" x2="492" y2="139" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="492" y="100" width="142" height="78" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="504" y="124" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 初始化</text>
<text x="504" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">2~60 s</text>
<line x1="634" y1="139" x2="644" y2="139" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="644" y="100" width="142" height="78" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="656" y="124" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑤ warmup</text>
<text x="656" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">1~30 s</text>
<line x1="786" y1="139" x2="796" y2="139" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="796" y="100" width="142" height="78" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="808" y="124" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑥ 接流</text>
<text x="808" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">0</text>
<rect x="36" y="204" width="288" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="48" y="228" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">普通云盘 500 MB/s</text>
<text x="48" y="250" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">14 GB → 28 s</text>
<text x="48" y="267" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">140 GB → 280 s</text>
<rect x="336" y="204" width="288" height="100" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="348" y="228" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">NVMe 3 GB/s</text>
<text x="348" y="250" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">14 GB → 4.7 s</text>
<text x="348" y="267" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">140 GB → 47 s</text>
<rect x="636" y="204" width="288" height="100" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="648" y="228" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">本机沙箱 8.2 GB/s</text>
<text x="648" y="250" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">14 GB → 1.7 s（内存承载）</text>
<text x="648" y="267" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">只能当上限参考</text>
<rect x="36" y="324" width="888" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="48" y="348" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">就绪闸门：端口通 ≠ 能接流</text>
<text x="48" y="370" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">weights / graph / warmup / kv_pool 四条件全满足才返回 200；liveness 只看进程，不要把 warmup 塞进去</text>
<text x="48" y="387" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">宽限期 ≥ max_tokens × TPOT（2000 token × 50 ms = 100 s，而 k8s 默认只有 30 s）</text>
</svg>
