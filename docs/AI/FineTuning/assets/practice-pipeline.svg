<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战八步：从目标到可验收的 adapter</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一步都要留下能核对的产物，否则出问题时无法定位</text>
  <rect x="10" y="88" width="170" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="95" y="106.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">① 定目标</text>
  <text x="95" y="123" text-anchor="middle" font-size="7.5" fill="#6D28D9">先写清验收标准</text>
  <rect x="200" y="88" width="170" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="285" y="106.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">② 备数据</text>
  <text x="285" y="123" text-anchor="middle" font-size="7.5" fill="#047857">200~2000 条起步</text>
  <rect x="390" y="88" width="170" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">③ 搭环境</text>
  <text x="475" y="123" text-anchor="middle" font-size="7.5" fill="#334155">算显存、装依赖</text>
  <rect x="580" y="88" width="170" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="665" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">④ 小规模试跑</text>
  <text x="665" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先跑百步看 loss</text>
  <line x1="180" y1="117" x2="200" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="370" y1="117" x2="390" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="117" x2="580" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="665" y1="146" x2="665" y2="176" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="95" y1="176" x2="665" y2="176" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="95" y1="176" x2="95" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="190" width="170" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="95" y="208.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">⑤ 全量训练</text>
  <text x="95" y="225" text-anchor="middle" font-size="7.5" fill="#6D28D9">留检查点与日志</text>
  <rect x="200" y="190" width="170" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="285" y="208.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">⑥ 评测对照</text>
  <text x="285" y="225" text-anchor="middle" font-size="7.5" fill="#B45309">与基座同题比</text>
  <rect x="390" y="190" width="170" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="475" y="208.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">⑦ 导出 adapter</text>
  <text x="475" y="225" text-anchor="middle" font-size="7.5" fill="#0F766E">记摘要与配置</text>
  <rect x="580" y="190" width="170" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="665" y="208.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">⑧ 上线与回滚</text>
  <text x="665" y="225" text-anchor="middle" font-size="7.5" fill="#B91C1C">预热 + 回滚路径</text>
  <line x1="180" y1="219" x2="200" y2="219" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="370" y1="219" x2="390" y2="219" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="219" x2="580" y2="219" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="282" text-anchor="middle" font-size="8" fill="#64748B">顺序不是死板的：④ 发现问题就回到 ②，⑥ 不达标就回到 ⑤</text>
  <rect x="40" y="298" width="680" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="316.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">全程要留下的产物</text>
  <text x="380" y="333" text-anchor="middle" font-size="7.5" fill="#4338CA">数据集版本 · 训练配置 · adapter 权重 · 评测报告 · 部署清单</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
