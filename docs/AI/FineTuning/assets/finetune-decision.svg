<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="352" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">先判断改的是「行为」还是「知识」</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三条路的成本、可逆性与迭代速度差别极大——选错的代价是几周时间</text>
  <rect x="230" y="72" width="300" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="90.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">要模型改变的是什么？</text>
  <line x1="380" y1="116" x2="380" y2="146" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="125" y1="146" x2="635" y2="146" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="125" y1="146" x2="125" y2="170" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="146" x2="380" y2="170" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="635" y1="146" x2="635" y2="170" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="170" width="230" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="125" y="188.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">行为 / 格式 / 风格</text>
  <text x="125" y="205" text-anchor="middle" font-size="7.5" fill="#047857">回答口吻、字段结构</text>
  <text x="125" y="222.25" text-anchor="middle" font-size="7.5" fill="#047857">工具调用习惯、领域术语</text>
  <rect x="265" y="170" width="230" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="188.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">知识 / 事实</text>
  <text x="380" y="205" text-anchor="middle" font-size="7.5" fill="#1D4ED8">每天在变的业务数据</text>
  <text x="380" y="222.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">必须可引用、可溯源</text>
  <rect x="520" y="170" width="230" height="88" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="635" y="188.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">只是指令没说清</text>
  <text x="635" y="205" text-anchor="middle" font-size="7.5" fill="#B45309">换个说法就对</text>
  <text x="635" y="222.25" text-anchor="middle" font-size="7.5" fill="#B45309">缺示例或约束</text>
  <line x1="125" y1="258" x2="125" y2="286" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="380" y1="258" x2="380" y2="286" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="635" y1="258" x2="635" y2="286" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="10" y="286" width="230" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="125" y="304.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">→ 微调</text>
  <rect x="265" y="286" width="230" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="304.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">→ RAG 检索增强</text>
  <rect x="520" y="286" width="230" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="635" y="304.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">→ 提示词工程</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
