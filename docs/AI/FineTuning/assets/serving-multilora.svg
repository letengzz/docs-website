<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="352" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">两种上线方式：合并权重，还是多 LoRA 热插拔</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">合并简单但不可逆；多 LoRA 省卡，代价是 adapter 治理</text>
  <rect x="40" y="88" width="320" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="200" y="106.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">方式一：合并权重</text>
  <text x="200" y="123" text-anchor="middle" font-size="7.5" fill="#334155">merge_and_unload → 一个独立模型</text>
  <rect x="40" y="168" width="320" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="186.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">优点：没有运行时代价</text>
  <text x="200" y="203" text-anchor="middle" font-size="7.5" fill="#1D4ED8">缺点：不可逆，每个变体一份权重</text>
  <rect x="400" y="88" width="320" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="560" y="106.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">方式二：多 LoRA 热插拔</text>
  <text x="560" y="123" text-anchor="middle" font-size="7.5" fill="#6D28D9">底座常驻，按请求的 model 字段路由</text>
  <rect x="400" y="168" width="320" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="186.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">优点：一张卡服务多租户</text>
  <text x="560" y="203" text-anchor="middle" font-size="7.5" fill="#047857">代价：分组 GEMM 延迟与换入开销</text>
  <line x1="200" y1="146" x2="200" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="146" x2="560" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="256" width="680" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="274.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">运维要点</text>
  <text x="380" y="291" text-anchor="middle" font-size="7.5" fill="#B91C1C">--max-loras 决定单批能同时激活几个 adapter；--max-cpu-loras 是换入池，配小了就是 30~50 ms 的冷换入</text>
  <text x="380" y="308.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">启动时逐个预热；给每个 adapter 记内容摘要并写进日志，否则原地更新后再也说不清线上是哪一版</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
