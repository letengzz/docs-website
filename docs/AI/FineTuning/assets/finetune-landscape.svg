<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">大模型微调专题地图：从数据到上线的一条闭环</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">微调改的是行为，不是知识；能上线的前提是评测能证明它确实变好了</text>
  <rect x="40" y="80" width="300" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">数据工程</text>
  <text x="190" y="115" text-anchor="middle" font-size="7.5" fill="#047857">来源 · 清洗 · 格式 · 划分</text>
  <rect x="420" y="80" width="300" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="570" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">环境与显存预算</text>
  <text x="570" y="115" text-anchor="middle" font-size="7.5" fill="#334155">先算得下多少可训练参数</text>
  <line x1="340" y1="106" x2="420" y2="106" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="170" width="300" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="190" y="188.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">LoRA / QLoRA</text>
  <text x="190" y="205" text-anchor="middle" font-size="7.5" fill="#6D28D9">低秩增量与 4 bit 底座</text>
  <line x1="190" y1="132" x2="190" y2="170" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="420" y="170" width="300" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="570" y="188.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">SFT 与偏好对齐</text>
  <text x="570" y="205" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先教格式，再对齐偏好</text>
  <line x1="340" y1="196" x2="420" y2="196" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="260" width="300" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="190" y="278.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">评测与回归门禁</text>
  <text x="190" y="295" text-anchor="middle" font-size="7.5" fill="#B45309">同题对照基座，达标才上线</text>
  <line x1="190" y1="222" x2="190" y2="260" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="420" y="260" width="300" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="570" y="278.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">服务化</text>
  <text x="570" y="295" text-anchor="middle" font-size="7.5" fill="#4338CA">合并权重，或多 LoRA 热插拔</text>
  <line x1="340" y1="286" x2="420" y2="286" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="190" y1="312" x2="190" y2="338" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="570" y1="312" x2="570" y2="338" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="190" y1="338" x2="570" y2="338" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="380" y1="338" x2="380" y2="352" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="180" y="352" width="400" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="370.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">实战：7B 模型 LoRA 端到端</text>
  <text x="380" y="387" text-anchor="middle" font-size="7.5" fill="#B91C1C">数据 → 训练 → 评测 → 服务，每一步都留下可核对的产物</text>
  <text x="380" y="422" text-anchor="middle" font-size="8" fill="#64748B">任一环节不达标就回到上一步——微调是迭代，不是一次性流水线</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
