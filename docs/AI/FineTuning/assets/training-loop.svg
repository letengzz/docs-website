<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">训练与对齐：两个阶段、两个目标</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">SFT 教「怎么做」，对齐教「哪一种做法更好」</text>
  <rect x="40" y="88" width="320" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">SFT：在标注样本上学「怎么做」</text>
  <text x="200" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">输入 → 输出 的示范</text>
  <rect x="400" y="88" width="320" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="560" y="106.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">只对回答段计算损失</text>
  <text x="560" y="123" text-anchor="middle" font-size="7.5" fill="#6D28D9">token masking：用户提问不计入 loss</text>
  <line x1="360" y1="118" x2="400" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="186" width="320" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="204.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">DPO：用偏好对学「哪种更好」</text>
  <text x="200" y="221" text-anchor="middle" font-size="7.5" fill="#047857">chosen / rejected，不需要奖励模型</text>
  <rect x="400" y="186" width="320" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="204.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">GRPO / RLVR：用可验证奖励</text>
  <text x="560" y="221" text-anchor="middle" font-size="7.5" fill="#B45309">答案能判对错时，采样效率更高</text>
  <line x1="360" y1="216" x2="400" y2="216" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="200" y1="148" x2="200" y2="186" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="148" x2="560" y2="186" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="286" width="680" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="304.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">两条路线的共同前提</text>
  <text x="380" y="321" text-anchor="middle" font-size="7.5" fill="#B91C1C">都只更新 adapter；都必须在同一批 held-out 题上与基座对照，否则无法判断是否真的变好</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
