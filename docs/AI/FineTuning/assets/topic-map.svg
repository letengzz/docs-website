<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="524" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">大模型微调专题：四阶段九页地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先想清楚再备料，先备料再训练；验证不过就回退，不靠感觉上线</text>
  <rect x="40" y="78" width="680" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="54" y="119" font-size="10" fill="#5B21B6" font-weight="bold">① 想清楚</text>
  <text x="117" y="118.5" font-size="8" fill="#6D28D9">Overview：先判断该改行为还是补知识，算清投入产出</text>
  <rect x="40" y="164" width="680" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="54" y="205" font-size="10" fill="#065F46" font-weight="bold">② 备料</text>
  <text x="107" y="196.5" font-size="8" fill="#047857">Environment：驱动与框架对齐、显存预算</text>
  <text x="107" y="212.5" font-size="8" fill="#047857">Dataset：来源、清洗、chat template、划分与版本化</text>
  <rect x="40" y="250" width="680" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="54" y="291" font-size="10" fill="#1E3A8A" font-weight="bold">③ 训练</text>
  <text x="107" y="282.5" font-size="8" fill="#1D4ED8">LoRA：低秩增量与 4 bit 底座的取舍</text>
  <text x="107" y="298.5" font-size="8" fill="#1D4ED8">SFT：SFT → 偏好对齐（DPO/ORPO）的顺序与坑</text>
  <rect x="40" y="336" width="680" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="54" y="377" font-size="10" fill="#92400E" font-weight="bold">④ 验证与上线</text>
  <text x="137" y="368.5" font-size="8" fill="#B45309">Evaluation：同题对照基座、设发布门禁</text>
  <text x="137" y="384.5" font-size="8" fill="#B45309">Serving：合并权重或多 LoRA 热插拔</text>
  <line x1="25" y1="152" x2="25" y2="164" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="238" x2="25" y2="250" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="324" x2="25" y2="336" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="424" width="330" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="205" y="442.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">Practice：7B 端到端实战</text>
  <text x="205" y="459" text-anchor="middle" font-size="7.5" fill="#B91C1C">把四个阶段串成一条可复现的流水线</text>
  <rect x="390" y="424" width="330" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="555" y="442.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">FAQ：排错与经验</text>
  <text x="555" y="459" text-anchor="middle" font-size="7.5" fill="#334155">loss 不降、答非所问、OOM 怎么查</text>
  <line x1="205" y1="410" x2="205" y2="424" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="555" y1="410" x2="555" y2="424" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="380" y="506" text-anchor="middle" font-size="8" fill="#64748B">每一环都留下可核对的产物：数据快照、adapter、评测报告——三者对不上就说明流程漏了一步</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
