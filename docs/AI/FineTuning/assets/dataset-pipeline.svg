<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="336" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">微调数据的五段流水线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">效果上限由数据决定——算法只是在逼近数据里已有的规律</text>
  <rect x="10" y="88" width="132" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="76" y="106.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">① 采集</text>
  <text x="76" y="123" text-anchor="middle" font-size="7.5" fill="#047857">真实 trace 优先</text>
  <text x="76" y="140.25" text-anchor="middle" font-size="7.5" fill="#047857">合成需标来源</text>
  <rect x="162" y="88" width="132" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="228" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 清洗</text>
  <text x="228" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">去重 · 去噪</text>
  <text x="228" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">去 PII · 纠标签</text>
  <rect x="314" y="88" width="132" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="106.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">③ 格式化</text>
  <text x="380" y="123" text-anchor="middle" font-size="7.5" fill="#6D28D9">chat template</text>
  <text x="380" y="140.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">messages 为主</text>
  <rect x="466" y="88" width="132" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="532" y="106.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">④ 划分</text>
  <text x="532" y="123" text-anchor="middle" font-size="7.5" fill="#B45309">train / val</text>
  <text x="532" y="140.25" text-anchor="middle" font-size="7.5" fill="#B45309">holdout 隔离</text>
  <rect x="618" y="88" width="132" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="684" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">⑤ 版本化</text>
  <text x="684" y="123" text-anchor="middle" font-size="7.5" fill="#334155">数据 + adapter</text>
  <text x="684" y="140.25" text-anchor="middle" font-size="7.5" fill="#334155">成对存档</text>
  <line x1="142" y1="136" x2="162" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="294" y1="136" x2="314" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="446" y1="136" x2="466" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="598" y1="136" x2="618" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="246" width="680" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="264.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">每次训练前跑一遍的体检清单</text>
  <text x="380" y="281" text-anchor="middle" font-size="7.5" fill="#B91C1C">格式一致性 · 标签抽样核对 · 长度分布 · 类别均衡 · 与 holdout 无重叠 · 无重复样本</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
