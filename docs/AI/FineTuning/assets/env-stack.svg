<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="448" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">微调环境的四层依赖</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">显存预算要在第 0 步算完——装完才发现装不下最费时间</text>
  <rect x="40" y="80" width="680" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="54" y="111" font-size="10" fill="#1E293B" font-weight="bold">① 系统层</text>
  <text x="117" y="110.5" font-size="8" fill="#334155">NVIDIA 驱动与 CUDA 运行时（能装哪个 wheel 由驱动上限决定）</text>
  <rect x="40" y="148" width="680" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="54" y="179" font-size="10" fill="#1E3A8A" font-weight="bold">② 框架层</text>
  <text x="117" y="178.5" font-size="8" fill="#1D4ED8">PyTorch（wheel 的 CUDA 版本必须与本机匹配）与 FlashAttention</text>
  <rect x="40" y="216" width="680" height="54" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="54" y="247" font-size="10" fill="#5B21B6" font-weight="bold">③ 库层</text>
  <text x="107" y="246.5" font-size="8" fill="#6D28D9">transformers · peft · trl · bitsandbytes · datasets · accelerate</text>
  <rect x="40" y="284" width="680" height="54" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="54" y="315" font-size="10" fill="#065F46" font-weight="bold">④ 模型与数据层</text>
  <text x="147" y="314.5" font-size="8" fill="#047857">权重缓存目录 · 数据集 · chat template（对话模板必须显式固化）</text>
  <line x1="25" y1="134" x2="25" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="202" x2="25" y2="216" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="270" x2="25" y2="284" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="356" width="680" height="68" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="374.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">先算显存，再动手装环境</text>
  <text x="380" y="391" text-anchor="middle" font-size="7.5" fill="#B91C1C">7B QLoRA：约 24 GB 起；7B BF16 LoRA：约 40 GB 级；7B 全参微调：80 GB 级（含优化器状态）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
