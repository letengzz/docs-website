<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="288" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">微调排障决策树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先分清是「没学会」「学坏了」还是「没生效」——三类的检查点完全不同</text>
  <rect x="230" y="72" width="300" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="90.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">结果不对，先定位阶段</text>
  <line x1="380" y1="116" x2="380" y2="146" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="125" y1="146" x2="635" y2="146" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="125" y1="146" x2="125" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="146" x2="380" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="635" y1="146" x2="635" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="10" y="168" width="230" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="125" y="186.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">loss 不降 / 不收敛</text>
  <text x="125" y="203" text-anchor="middle" font-size="7.5" fill="#B91C1C">数据格式与模板不一致</text>
  <text x="125" y="220.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">学习率过大、目标模块没命中</text>
  <rect x="265" y="168" width="230" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">学会了但变笨了</text>
  <text x="380" y="203" text-anchor="middle" font-size="7.5" fill="#B45309">过拟合：数据太少或跑太久</text>
  <text x="380" y="220.25" text-anchor="middle" font-size="7.5" fill="#B45309">灾难性遗忘：混入通用数据</text>
  <rect x="520" y="168" width="230" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="635" y="186.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">上线后看不出变化</text>
  <text x="635" y="203" text-anchor="middle" font-size="7.5" fill="#1D4ED8">adapter 没真正加载</text>
  <text x="635" y="220.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">请求没指定 model 字段</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
