<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">显存预算：一次推理到底占用了什么</text>

  <rect x="30" y="60" width="820" height="120" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="86" font-size="13" font-weight="bold" fill="#1f2937">显存构成</text>
  <rect x="55" y="100" width="200" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="155" y="124" text-anchor="middle" font-size="11" fill="#3730a3">模型权重</text>
  <text x="155" y="144" text-anchor="middle" font-size="10" fill="#6b7280">参数量 × 每参数字节数</text>
  <rect x="265" y="100" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="365" y="124" text-anchor="middle" font-size="11" fill="#065f46">KV Cache</text>
  <text x="365" y="144" text-anchor="middle" font-size="10" fill="#6b7280">随上下文与并发线性增长</text>
  <rect x="475" y="100" width="180" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565" y="124" text-anchor="middle" font-size="11" fill="#92400e">运行时开销</text>
  <text x="565" y="144" text-anchor="middle" font-size="10" fill="#6b7280">框架、CUDA、缓冲区</text>
  <rect x="665" y="100" width="160" height="56" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="745" y="124" text-anchor="middle" font-size="11" fill="#b91c1c">安全余量</text>
  <text x="745" y="144" text-anchor="middle" font-size="10" fill="#6b7280">建议留 15%~25%</text>

  <rect x="30" y="196" width="400" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="230" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">权重估算速查</text>
  <text x="52" y="250" font-size="11" fill="#3730a3">7B 模型：FP16 约 14GB ｜ INT8 约 7GB ｜ 4 位约 4GB</text>
  <text x="52" y="276" font-size="11" fill="#3730a3">14B 模型：FP16 约 28GB ｜ INT8 约 14GB ｜ 4 位约 8GB</text>
  <text x="52" y="302" font-size="11" fill="#3730a3">32B 模型：FP16 约 64GB ｜ INT8 约 32GB ｜ 4 位约 18GB</text>
  <text x="52" y="326" font-size="10" fill="#6b7280">估算值仅含权重，实际还要加上 KV Cache 与运行时开销</text>

  <rect x="450" y="196" width="400" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">KV Cache 为何容易被低估</text>
  <text x="472" y="250" font-size="11" fill="#065f46">它与「上下文长度 × 并发数 × 层数 × 隐藏维度」成正比</text>
  <text x="472" y="276" font-size="11" fill="#065f46">上下文从 4K 提到 32K，KV Cache 可能增长数倍</text>
  <text x="472" y="302" font-size="11" fill="#065f46">长文档问答、Agent 多轮任务最容易在这里爆显存</text>
  <text x="472" y="326" font-size="10" fill="#6b7280">缓解：限制最大上下文、KV 量化、降低并发、分块处理</text>

  <rect x="30" y="360" width="820" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="386" font-size="12" font-weight="bold" fill="#1f2937">排查顺序</text>
  <text x="50" y="410" font-size="11" fill="#374151">加载即 OOM → 模型/量化等级太大；运行中 OOM → 上下文或并发过高；间歇性 OOM → 缺少安全余量或存在内存碎片。</text>
  <text x="50" y="428" font-size="10" fill="#6b7280">先用小上下文、单并发跑通，再逐步加压找到硬件上限，最后按上限的 70% 设定生产参数。</text>
</svg>
