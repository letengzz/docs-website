<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">本地模型部署问题排查地图</text>

  <rect x="330" y="56" width="240" height="50" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">先看现象</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#6b7280">起不来 / 慢 / 质量差 / 不稳定</text>
  <path d="M 450 108 V 132" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <line x1="120" y1="132" x2="780" y2="132" stroke="#9ca3af" stroke-width="2"/>

  <path d="M 120 132 V 156" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#t1)"/>
  <rect x="30" y="160" width="180" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">① 启动失败</text>
  <text x="120" y="208" text-anchor="middle" font-size="10" fill="#7f1d1d">端口占用 / 权限不足</text>
  <text x="120" y="226" text-anchor="middle" font-size="10" fill="#7f1d1d">显存不足（加载即 OOM）</text>
  <text x="120" y="244" text-anchor="middle" font-size="10" fill="#7f1d1d">驱动与 CUDA 不匹配</text>
  <text x="120" y="268" text-anchor="middle" font-size="10" fill="#6b7280">→ 查日志首行报错</text>

  <path d="M 330 132 V 156" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#t1)"/>
  <rect x="250" y="160" width="180" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">② 太慢</text>
  <text x="340" y="208" text-anchor="middle" font-size="10" fill="#92400e">未用 GPU（回退 CPU）</text>
  <text x="340" y="226" text-anchor="middle" font-size="10" fill="#92400e">上下文输出过长</text>
  <text x="340" y="244" text-anchor="middle" font-size="10" fill="#92400e">并发过高导致排队</text>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#6b7280">→ 看 TTFT 与 GPU 利用率</text>

  <path d="M 470 132 V 156" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#t1)"/>
  <rect x="470" y="160" width="180" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="560" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">③ 质量差</text>
  <text x="560" y="208" text-anchor="middle" font-size="10" fill="#1e3a8a">量化等级过低</text>
  <text x="560" y="226" text-anchor="middle" font-size="10" fill="#1e3a8a">模型能力与任务不匹配</text>
  <text x="560" y="244" text-anchor="middle" font-size="10" fill="#1e3a8a">上下文被截断</text>
  <text x="560" y="268" text-anchor="middle" font-size="10" fill="#6b7280">→ 换更高等级量化对比</text>

  <path d="M 700 132 V 156" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#t1)"/>
  <rect x="690" y="160" width="180" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="780" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">④ 不稳定</text>
  <text x="780" y="208" text-anchor="middle" font-size="10" fill="#5b21b6">间歇 OOM（余量不足）</text>
  <text x="780" y="226" text-anchor="middle" font-size="10" fill="#5b21b6">请求超时 / 被限流</text>
  <text x="780" y="244" text-anchor="middle" font-size="10" fill="#5b21b6">模型被自动卸载重载</text>
  <text x="780" y="268" text-anchor="middle" font-size="10" fill="#6b7280">→ 记录显存峰值与重载次数</text>

  <rect x="30" y="326" width="840" height="118" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="352" font-size="13" font-weight="bold" fill="#1f2937">通用四步法</text>
  <text x="50" y="378" font-size="11" fill="#374151">1. 看日志：引擎启动日志、模型加载日志、OOM 堆栈，先确认是环境问题还是参数问题。</text>
  <text x="50" y="402" font-size="11" fill="#374151">2. 看资源：显存占用峰值、GPU 利用率、CPU 与内存，确认瓶颈在哪。</text>
  <text x="50" y="426" font-size="11" fill="#374151">3. 做对照：固定输入与参数，对比"单并发 vs 多并发""FP16 vs 4 位""短上下文 vs 长上下文"。</text>
  <text x="50" y="444" font-size="11" fill="#374151">4. 留记录：把环境快照（驱动/CUDA/引擎/模型/参数）写进文档，避免重复踩坑。</text>

  <defs>
    <marker id="t1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
