<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">本地推理性能指标与优化手段</text>

  <rect x="30" y="60" width="260" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">延迟类指标</text>
  <text x="52" y="114" font-size="11" fill="#3730a3">TTFT：首令牌时间（体感快慢）</text>
  <text x="52" y="138" font-size="11" fill="#3730a3">TPOT：每输出令牌耗时</text>
  <text x="52" y="162" font-size="11" fill="#3730a3">端到端延迟 = TTFT + TPOT × 输出长度</text>
  <text x="52" y="190" font-size="10" fill="#6b7280">交互式场景优先优化 TTFT</text>

  <rect x="310" y="60" width="260" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">吞吐类指标</text>
  <text x="332" y="114" font-size="11" fill="#065f46">tokens/s：整体生成速率</text>
  <text x="332" y="138" font-size="11" fill="#065f46">requests/s：完成请求数</text>
  <text x="332" y="162" font-size="11" fill="#065f46">并发数：同时在处理的请求</text>
  <text x="332" y="190" font-size="10" fill="#6b7280">批量任务优先优化吞吐</text>

  <rect x="590" y="60" width="260" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">资源类指标</text>
  <text x="612" y="114" font-size="11" fill="#92400e">显存占用与峰值</text>
  <text x="612" y="138" font-size="11" fill="#92400e">GPU 利用率与显存带宽</text>
  <text x="612" y="162" font-size="11" fill="#92400e">CPU / 内存（CPU 推理场景）</text>
  <text x="612" y="190" font-size="10" fill="#6b7280">利用率低说明瓶颈在别处</text>

  <rect x="30" y="232" width="820" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="258" font-size="13" font-weight="bold" fill="#1f2937">优化手段与代价</text>
  <text x="50" y="286" font-size="11" fill="#374151">① 降量化等级（FP16 → INT8 → 4 位）：显存下降、吞吐上升，质量可能小幅下降。</text>
  <text x="50" y="312" font-size="11" fill="#374151">② 批处理 / 连续批处理：显著提升吞吐，但单请求延迟可能变差（vLLM 的核心优势）。</text>
  <text x="50" y="338" font-size="11" fill="#374151">③ 限制上下文长度与输出长度：直接降低 KV Cache 与生成时间，收益最确定。</text>
  <text x="50" y="364" font-size="11" fill="#374151">④ KV Cache 量化 / 分页：长上下文场景省显存，注意精度影响。</text>
  <text x="50" y="390" font-size="11" fill="#374151">⑤ 多卡并行 / 多实例：提升总吞吐，但通信开销与运维复杂度上升。</text>
  <text x="50" y="410" font-size="10" fill="#6b7280">原则：先确定 SLA（TTFT / 端到端延迟 / 并发），再在满足 SLA 的前提下最大化吞吐。</text>
</svg>
