<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">生产化四件套：部署 · 可观测 · 评估回归 · 成本与安全</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">从 notebook 到生产的四道门槛，每一道都要有判据</text>

  <!-- deploy -->
  <rect x="30" y="76" width="340" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="98" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">① 部署形态</text>
  <rect x="48" y="110" width="140" height="30" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="118" y="130" text-anchor="middle" font-size="9" fill="#1E3A8A">自托管 FastAPI（默认选）</text>
  <rect x="202" y="110" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="277" y="130" text-anchor="middle" font-size="9" fill="#1E3A8A">langgraph-cli 本地调试</text>
  <rect x="48" y="152" width="140" height="30" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="118" y="172" text-anchor="middle" font-size="9" fill="#1E3A8A">LangGraph Platform（托管）</text>
  <rect x="202" y="152" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="277" y="172" text-anchor="middle" font-size="9" fill="#1E3A8A">长任务 → 异步 run + 状态查询</text>

  <!-- observability -->
  <rect x="400" y="76" width="330" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="98" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">② 可观测</text>
  <rect x="418" y="110" width="130" height="30" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="483" y="130" text-anchor="middle" font-size="9" fill="#065F46">LangSmith（官方平台）</text>
  <rect x="562" y="110" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="637" y="130" text-anchor="middle" font-size="9" fill="#065F46">Langfuse（开源可自托管）</text>
  <rect x="418" y="152" width="294" height="30" rx="7" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="565" y="172" text-anchor="middle" font-size="9" fill="#047857">三条纪律：run_id 贯穿 ｜ 节点级埋点 ｜ 异常定位到节点</text>

  <!-- evaluation -->
  <rect x="30" y="212" width="340" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="200" y="234" text-anchor="middle" font-size="11.5" fill="#92400E" font-weight="bold">③ 评估回归（三处漂移源都要有判据）</text>
  <rect x="48" y="246" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
  <text x="96" y="264" text-anchor="middle" font-size="8.5" fill="#92400E">节点级单测</text>
  <rect x="154" y="246" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
  <text x="202" y="264" text-anchor="middle" font-size="8.5" fill="#92400E">流程级评估集</text>
  <rect x="260" y="246" width="92" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/>
  <text x="306" y="264" text-anchor="middle" font-size="8.5" fill="#92400E">上线前 diff</text>
  <text x="200" y="296" text-anchor="middle" font-size="8.5" fill="#B45309">评估集进 CI；提示词 / 模型版本 / 图结构改动必跑</text>

  <!-- cost & security -->
  <rect x="400" y="212" width="330" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="565" y="234" text-anchor="middle" font-size="11.5" fill="#991B1B" font-weight="bold">④ 成本与安全</text>
  <text x="418" y="258" font-size="9" fill="#991B1B">· 按节点记 token / 费用，单次 run 预算上限熔断</text>
  <text x="418" y="276" font-size="9" fill="#991B1B">· 模型分级：轻决策小模型，核心生成大模型</text>
  <text x="418" y="294" font-size="9" fill="#991B1B">· 工具白名单 + 高危工具过审批；注入过滤</text>
  <text x="418" y="312" font-size="9" fill="#991B1B">· 日志与检查点库不落敏感全文，权限按生产库管理</text>

  <!-- checklist -->
  <rect x="30" y="338" width="700" height="28" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.1"/>
  <text x="380" y="356.5" text-anchor="middle" font-size="9.5" fill="#334155">上线检查清单 7 条（见正文第 5 节）：生产 checkpointer · 审批兜底 · run_id 贯穿 · 评估进 CI · 预算熔断 · 保留策略 · 降级预案</text>

  <defs>
  </defs>
</svg>
