<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战全景：发布流水线（LangGraph）与研究小组（CrewAI）</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">图管审批与恢复，Crew 管内容生产——接口就是 draft 与 output_pydantic</text>

  <!-- pipeline -->
  <rect x="30" y="76" width="700" height="130" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="50" y="98" font-size="11.5" fill="#1E3A8A" font-weight="bold">案例一：带审批的发布流水线（thread_id = post-101）</text>
  <rect x="50" y="112" width="80" height="36" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="90" y="134" text-anchor="middle" font-size="9.5" fill="#1E3A8A">generate</text>
  <rect x="146" y="112" width="92" height="36" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="192" y="129" text-anchor="middle" font-size="9.5" fill="#1E3A8A">compliance</text>
  <text x="192" y="143" text-anchor="middle" font-size="8" fill="#475569">风险标记 → 追加</text>
  <rect x="254" y="112" width="74" height="36" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="291" y="134" text-anchor="middle" font-size="9.5" fill="#1E3A8A">rewrite</text>
  <rect x="344" y="112" width="100" height="36" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="394" y="129" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">approval 审批</text>
  <text x="394" y="143" text-anchor="middle" font-size="8" fill="#92400E">interrupt，可隔天</text>
  <rect x="460" y="112" width="74" height="36" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="497" y="134" text-anchor="middle" font-size="9.5" fill="#065F46">publish</text>
  <rect x="550" y="112" width="66" height="36" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/>
  <text x="583" y="134" text-anchor="middle" font-size="9.5" fill="#334155">END</text>
  <path d="M 130 130 L 146 130 M 238 130 L 254 130 M 328 130 L 344 130 M 444 130 L 460 130 M 534 130 L 550 130" stroke="#475569" stroke-width="1.2"/>
  <path d="M 291 148 L 291 166 L 205 166 L 205 148" stroke="#2563EB" stroke-width="1.1" fill="none" marker-end="url(#arrBl)"/>
  <text x="248" y="163" text-anchor="middle" font-size="8" fill="#1D4ED8">改完再审（revision ≥ 2 终止）</text>
  <text x="640" y="126" font-size="8.5" fill="#475569">拒绝 → END</text>
  <text x="640" y="141" font-size="8.5" fill="#475569">编辑 → 改稿</text>
  <text x="640" y="156" font-size="8.5" fill="#475569">批准 → publish</text>
  <text x="50" y="190" font-size="9" fill="#475569">持久化：SqliteSaver（开发）→ PostgresSaver（生产）；kill -9 后同 thread_id 恢复，从审批断点继续</text>

  <!-- crew -->
  <rect x="30" y="222" width="700" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="50" y="244" font-size="11.5" fill="#5B21B6" font-weight="bold">案例二：研究小组（CrewAI，sequential）</text>
  <rect x="50" y="254" width="170" height="36" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="135" y="270" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">分析师：5 条有出处的事实</text>
  <text x="135" y="284" text-anchor="middle" font-size="8" fill="#475569">不确定的标「待核实」</text>
  <rect x="260" y="254" width="190" height="36" rx="7" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="355" y="270" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">编辑：一页简报（context 传入）</text>
  <text x="355" y="284" text-anchor="middle" font-size="8" fill="#475569">output_pydantic=Brief 结构化产出</text>
  <path d="M 220 272 L 260 272" stroke="#7C3AED" stroke-width="1.3" marker-end="url(#arrV)"/>
  <rect x="480" y="254" width="230" height="36" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="595" y="270" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">两个案例怎么连</text>
  <text x="595" y="284" text-anchor="middle" font-size="8.5" fill="#475569">Crew 可作为 generate 节点的实现</text>

  <defs>
    <marker id="arrBl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrV" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
