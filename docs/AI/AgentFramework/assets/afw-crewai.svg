<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">CrewAI：Agent / Task / Crew / Flow 四个构件</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">backstory 就是提示词；expected_output 就是验收标准；控制流交给 Flow</text>

  <!-- sequential crew -->
  <rect x="30" y="78" width="330" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="195" y="102" text-anchor="middle" font-size="12" fill="#5B21B6" font-weight="bold">Crew（sequential 默认）</text>
  <rect x="50" y="116" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="115" y="133" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">Agent 分析师</text>
  <text x="115" y="148" text-anchor="middle" font-size="8.5" fill="#475569">role/goal/backstory + 工具</text>
  <rect x="210" y="116" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="275" y="133" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">Agent 作者</text>
  <text x="275" y="148" text-anchor="middle" font-size="8.5" fill="#475569">context=[research]</text>
  <path d="M 180 137 L 210 137" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrV)"/>
  <text x="195" y="130" text-anchor="middle" font-size="8" fill="#6D28D9">产出传递</text>
  <rect x="50" y="172" width="290" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="195" y="189" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">Task：description + expected_output</text>
  <text x="195" y="204" text-anchor="middle" font-size="8.5" fill="#475569">output_pydantic 让下游接结构，不接散文</text>

  <!-- hierarchical -->
  <rect x="400" y="78" width="330" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="565" y="102" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Crew（hierarchical）</text>
  <rect x="470" y="114" width="190" height="34" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
  <text x="565" y="135" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">管理者 Agent（自动生成）</text>
  <rect x="418" y="168" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="463" y="192" text-anchor="middle" font-size="9.5" fill="#92400E">执行者 A</text>
  <rect x="520" y="168" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="565" y="192" text-anchor="middle" font-size="9.5" fill="#92400E">执行者 B</text>
  <rect x="622" y="168" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="667" y="192" text-anchor="middle" font-size="9.5" fill="#92400E">执行者 C</text>
  <path d="M 540 148 L 468 168 M 565 148 L 565 168 M 590 148 L 662 168" stroke="#D97706" stroke-width="1.2" fill="none"/>
  <text x="565" y="226" text-anchor="middle" font-size="8.5" fill="#B45309">能 sequential 就 sequential：管理者也是模型，会分派失误</text>

  <!-- flow layer -->
  <rect x="30" y="244" width="700" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="50" y="268" font-size="12" fill="#1E3A8A" font-weight="bold">Flows：要精确控制流时的结构化层（事件驱动状态机）</text>
  <rect x="50" y="278" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="110" y="295" text-anchor="middle" font-size="9" fill="#1E3A8A">@start 起点步骤</text>
  <path d="M 170 291 L 200 291" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrBl)"/>
  <rect x="202" y="278" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="267" y="295" text-anchor="middle" font-size="9" fill="#1E3A8A">@listen 监听产出</text>
  <path d="M 332 291 L 362 291" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrBl)"/>
  <rect x="364" y="278" width="170" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="449" y="295" text-anchor="middle" font-size="9" fill="#1E3A8A">分支 / 重试 / 转人工写在代码里</text>
  <path d="M 534 291 L 564 291" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arrBl)"/>
  <rect x="566" y="278" width="150" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="641" y="295" text-anchor="middle" font-size="9" fill="#1E3A8A">多个 Crew 作为步骤被编排</text>

  <!-- boundary -->
  <rect x="30" y="330" width="700" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="50" y="350" font-size="10.5" fill="#065F46" font-weight="bold">与 LangGraph 的分工边界</text>
  <text x="50" y="368" font-size="9.5" fill="#047857">协作语义（谁负责什么、产出给谁）→ Agent/Task；控制流（分支、循环、审批、隔天恢复）→ Flow / LangGraph</text>

  <defs>
    <marker id="arrV" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrBl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
