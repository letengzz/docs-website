<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" width="920" height="424" role="img" aria-label="七段资金链：从「开户」到「头寸与度量」">
<title>七段资金链：从「开户」到「头寸与度量」</title>
<rect x="0" y="0" width="920" height="424" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段资金链：从「开户」到「头寸与度量」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">越靠前的段偏一天，越靠后的段错一个月；只有付款这一段会当场报错</text>
<rect x="24" y="92" width="208" height="128" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">① 账户与开户</text>
<text x="38" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">账户主数据 / 币种</text>
<text x="38" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">质押与冻结</text>
<text x="38" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<line x1="232" y1="156" x2="244" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="248" y="92" width="208" height="128" rx="8" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
<text x="262" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">② 收款与认领</text>
<text x="262" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">到账流水</text>
<text x="262" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">匹配到发票</text>
<text x="262" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<line x1="456" y1="156" x2="468" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="472" y="92" width="208" height="128" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="486" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">③ 付款与排程</text>
<text x="486" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">批次 / 指令</text>
<text x="486" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">白名单与复核</text>
<text x="486" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d">失败：显性</text>
<line x1="680" y1="156" x2="692" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="696" y="92" width="208" height="128" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="710" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">④ 头寸与调拨</text>
<text x="710" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">多银行多币种</text>
<text x="710" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">日终切点</text>
<text x="710" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<path d="M 800 220 L 800 236 L 128 236 L 128 248" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="24" y="248" width="208" height="128" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="38" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑤ 13 周预测</text>
<text x="38" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">账龄曲线</text>
<text x="38" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">累计偏差</text>
<text x="38" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<line x1="232" y1="312" x2="244" y2="312" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="248" y="248" width="208" height="128" rx="8" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
<text x="262" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑥ 银行对账</text>
<text x="262" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">对账单解析</text>
<text x="262" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">未达账项</text>
<text x="262" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">失败：半显性</text>
<line x1="456" y1="312" x2="468" y2="312" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="472" y="248" width="208" height="128" rx="8" fill="#ecfccb" stroke="#d9f99d" stroke-width="1.5"/>
<text x="486" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑦ 投融资与度量</text>
<text x="486" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">额度与计息</text>
<text x="486" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">DSO / CCC</text>
<text x="486" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<text x="28" y="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c">七段里有五段的失败是安静的：钱少了一笔、晚了一天、多了 3 分，系统都不会报错。</text>

</svg>
