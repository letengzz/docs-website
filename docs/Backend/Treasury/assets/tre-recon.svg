<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 428" width="920" height="428" role="img" aria-label="余额调节表与四种匹配口径">
<title>余额调节表与四种匹配口径</title>
<rect x="0" y="0" width="920" height="428" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">余额调节表与四种匹配口径</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">调节表只有一种写法：银行 − 未达收款 + 未达付款 = 企业账面</text>
<rect x="24" y="92" width="560" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="38" y="115" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a">银行对账单期末余额</text>
<text x="560" y="115" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="end">41,820.00</text>
<rect x="24" y="136" width="560" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="38" y="159" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a">减：企业已记、银行未记（未达收款）</text>
<text x="560" y="159" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="end">0.00</text>
<text x="596" y="159" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8">在途支票</text>
<rect x="24" y="180" width="560" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="38" y="203" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a">加：银行已付、企业未记（未达付款）</text>
<text x="560" y="203" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="end">180.00</text>
<text x="596" y="203" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8">手续费</text>
<rect x="24" y="224" width="560" height="36" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
<text x="38" y="247" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a">= 企业账面余额</text>
<text x="560" y="247" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="700">42,000.00</text>
<text x="24" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">匹配口径（同一份 5,000 行对账单）</text>
<text x="28" y="318" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">金额 + 同日</text>
<text x="220" y="318" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">31.76%</text>
<text x="28" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">金额 + ±3 天</text>
<text x="220" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d">98.44%</text>
<text x="28" y="370" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">金额单键</text>
<text x="220" y="370" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d">98.50% / 435 行歧义</text>
<text x="28" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">参考号</text>
<text x="220" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d">98.42%</text>
<text x="460" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">记账日与起息日差 1~2 天是常态，</text>
<text x="460" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c">「同日匹配」会把 68% 的正常行判成未达。</text>
<text x="460" y="388" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">参考号最稳，但要求对端在摘要里带上它——</text>
<text x="460" y="408" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">这就是 ISO 20022 强调结构化 remittance 的原因。</text>

</svg>
