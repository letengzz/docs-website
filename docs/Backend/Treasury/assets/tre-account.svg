<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="账户余额的四个字段与价值日期">
<title>账户余额的四个字段与价值日期</title>
<rect x="0" y="0" width="920" height="360" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">账户余额的四个字段与价值日期</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一笔钱，记账日是今天，可用日可能是下周一</text>
<rect x="24" y="92" width="420" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">一个账户在库里是四行数，不是一行</text>
<text x="44" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">book_amt</text>
<text x="200" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">账面余额：银行说了算</text>
<text x="44" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">frozen_amt</text>
<text x="200" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">冻结 / 质押：在账上但动不了</text>
<text x="44" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">in_transit_amt</text>
<text x="200" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">在途：已收未清算</text>
<text x="44" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">value_date</text>
<text x="200" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">价值日期：真正能用的那天</text>
<text x="476" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">记账日 ≠ 价值日期：一笔 T+1 的钱在月末会「迟到」</text>
<line x1="490" y1="160" x2="880" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="500" cy="160" r="4" fill="#64748b"/>
<text x="500" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">11-26</text>
<text x="500" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">周四</text>
<circle cx="590" cy="160" r="4" fill="#64748b"/>
<text x="590" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">11-27</text>
<text x="590" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">周五</text>
<circle cx="680" cy="160" r="4" fill="#64748b"/>
<text x="680" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">11-28</text>
<text x="680" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">周六</text>
<circle cx="770" cy="160" r="4" fill="#64748b"/>
<text x="770" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">11-29</text>
<text x="770" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">周日</text>
<circle cx="860" cy="160" r="4" fill="#64748b"/>
<text x="860" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">11-30</text>
<text x="860" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">月末</text>
<rect x="590" y="214" width="240" height="54" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="604" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a">周五 17:00 后到账</text>
<text x="604" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c">可用日顺延到下周一 12-01</text>
<text x="490" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">本月最后 5 天收款 846 笔，其中 178 笔（21.0%）可用日落到次月。</text>
<text x="28" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c">结论：头寸必须按 value_date 取数，按记账日算出来的月末余额会高估 3.40%。</text>

</svg>
