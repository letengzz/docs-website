<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 408" width="920" height="408" role="img" aria-label="短期资金的三层来源与计息基准">
<title>短期资金的三层来源与计息基准</title>
<rect x="0" y="0" width="920" height="408" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">短期资金的三层来源与计息基准</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一笔钱，换一种借法就换一个成本口径</text>
<text x="28" y="96" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">短期资金的三层来源与各自的真实成本</text>
<rect x="24" y="112" width="284" height="100" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
<text x="38" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">第一层：自有现金</text>
<text x="38" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">0 成本，但有机会成本</text>
<text x="38" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">活期 0.2% / 理财 2.1%</text>
<text x="38" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c">闲置也是成本</text>
<rect x="324" y="112" width="284" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="338" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">第二层：银行额度</text>
<text x="338" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">透支 / 流贷，随借随还</text>
<text x="338" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">年化 4.2%，ACT/360</text>
<text x="338" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c">额度不用也要承诺费</text>
<rect x="624" y="112" width="284" height="100" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text x="638" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">第三层：票据贴现</text>
<text x="638" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">把应收变成现金</text>
<text x="638" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#1d4ed8">2.28%，最长 6 个月</text>
<text x="638" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c">保证金被冻结</text>
<text x="28" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">计息基准差 1.39%：同样 100 万、4.2%、45 天</text>
<rect x="24" y="266" width="420" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">ACT/360  5,250.00</text>
<text x="40" y="312" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">ACT/365  5,178.08</text>
<text x="40" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">差 71.92（1.39%）—— 合同写哪个分母，就是 1.39% 的价差</text>
<rect x="468" y="266" width="428" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="484" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">票据 100 万 / 2.28% / 182 天</text>
<text x="484" y="312" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">贴现息 11,526.67，到手 988,473.33</text>
<text x="484" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d">同期流贷利息 17,441.67 → 省 5,915.00</text>
<text x="28" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">低成本的钱都有前置条件：票据要真实交易背景，透支要授信额度，自有现金要「本来就闲着」。</text>

</svg>
