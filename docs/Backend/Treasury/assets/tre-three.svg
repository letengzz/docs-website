<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="三个「有多少钱」：账面、可用、头寸">
<title>三个「有多少钱」：账面、可用、头寸</title>
<rect x="0" y="0" width="760" height="410" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三个「有多少钱」：账面、可用、头寸</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">差额 235,000 = 冻结 120,000 + 在途 80,000 + 未达 35,000</text>
<rect x="24" y="92" width="560" height="76" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="40" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">账面余额</text>
<text x="40" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">银行对账单 / 总账 1002</text>
<text x="596" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#0f172a" text-anchor="end" font-weight="700">1,000,000.00</text>
<text x="596" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="end">看起来最多的那个数</text>
<rect x="24" y="184" width="560" height="76" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text x="40" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">可用余额</text>
<text x="40" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">账面 − 冻结 120,000 − 在途 80,000</text>
<text x="596" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#0f172a" text-anchor="end" font-weight="700">800,000.00</text>
<text x="596" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="end">今天真正能付出去的钱</text>
<rect x="24" y="276" width="560" height="76" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="40" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">头寸</text>
<text x="40" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">可用 + 未达 −35,000</text>
<text x="596" y="310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#0f172a" text-anchor="end" font-weight="700">765,000.00</text>
<text x="596" y="332" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="end">按价值日期排完队之后的净额</text>
<text x="28" y="390" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">三个数都对，但回答的是三个不同的问题；混用一个，就会出现「账上明明有钱却付不出去」。</text>

</svg>
