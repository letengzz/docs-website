<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" width="920" height="448" role="img" aria-label="收款认领的四种口径与自动率">
<title>收款认领的四种口径与自动率</title>
<rect x="0" y="0" width="920" height="448" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">收款认领的四种口径与自动率</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">口径越多不等于越准；关键是把「认不出」显式收进未认领池</text>
<rect x="24" y="92" width="680" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="38" y="117" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">到账流水</text>
<text x="716" y="117" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">3,000 笔</text>
<rect x="24" y="148" width="212" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="38" y="173" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">仅按金额唯一</text>
<text x="248" y="173" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">300 笔 · 10.0%</text>
<rect x="24" y="204" width="445" height="40" rx="8" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
<text x="38" y="229" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">金额 + 客户 + 未核销</text>
<text x="481" y="229" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">1,647 笔 · 54.9%</text>
<rect x="24" y="260" width="405" height="40" rx="8" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
<text x="38" y="285" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">备注带发票号</text>
<text x="441" y="285" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">1,418 笔 · 47.3%</text>
<rect x="24" y="316" width="508" height="40" rx="8" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
<text x="38" y="341" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">码 ∪ 金额+客户（流水线）</text>
<text x="544" y="341" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">2,009 笔 · 67.0%</text>
<rect x="24" y="380" width="300" height="52" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="38" y="402" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">剩下 17.0% 进未认领池</text>
<text x="38" y="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">511 笔：金额重复且备注无码</text>
<text x="352" y="404" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">金额重复：887 个金额被 2,576 张发票共用（80.5%）——纯金额匹配的死穴。</text>
<text x="352" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c">认领率不是算法问题，是「客户写不写备注」的问题。</text>

</svg>
