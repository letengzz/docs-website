<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="盲态的四道闸：破盲很少是「有人偷看」，多半是流程给的暗示">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="940" height="420" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">盲态的四道闸：破盲很少是「有人偷看」，多半是流程给的暗示</text>
<rect x="40" y="76" width="200" height="96" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="140.0" y="120.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#3730a3">闸 1 随机化</text>
<text x="140.0" y="137.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">区组大小随机</text>
<text x="140.0" y="151.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">分配不可推</text>
<line x1="240" y1="124" x2="262" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="264" y="76" width="200" height="96" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="364.0" y="120.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f766e">闸 2 包装</text>
<text x="364.0" y="137.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">药盒外观一致</text>
<text x="364.0" y="151.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">标签不含组别</text>
<line x1="464" y1="124" x2="486" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="488" y="76" width="200" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="588.0" y="120.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">闸 3 评估</text>
<text x="588.0" y="137.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">评估者与给药者分离</text>
<text x="588.0" y="151.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">评估只看数据</text>
<line x1="688" y1="124" x2="710" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="76" width="200" height="96" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="812.0" y="120.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#9f1239">闸 4 揭盲</text>
<text x="812.0" y="137.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">信封 + 医学监查员</text>
<text x="812.0" y="151.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">开启必须留痕</text>
<text x="40" y="212" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">紧急揭盲信封 480 个，开启 27 个（5.6%）</text>
<text x="40" y="236" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">其中真紧急 19 个，可避免 8 个（29.6%）——先打给医学监查员，这 8 个都能在 2 小时内答复</text>
<text x="40" y="272" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#9f1239">「可推断」比「被看到」更常见</text>
<text x="40" y="296" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 安慰剂组不掉头发，试验组掉 → 受试者自己就猜到了</text>
<text x="40" y="318" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 肝酶升高的模式在两个臂上不同 → 研究者从化验单猜到组别</text>
<text x="40" y="340" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 药盒按到货顺序摆放 → 药房知道下一盒是新批还是旧批</text>
<rect x="560" y="262" width="340" height="130" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="730.0" y="323.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#166534">20 名评估者猜组别</text>
<text x="730.0" y="340.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">命中 52.0%（随机 50%）</text>
<text x="730.0" y="354.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">二项检验 p = 0.310</text>
<text x="730.0" y="368.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">→ 未发现系统性破盲</text>
</svg>
