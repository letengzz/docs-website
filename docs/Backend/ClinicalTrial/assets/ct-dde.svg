<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="双录入把转录错误压到 0.21%，但对源数据错误一无所知">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">双录入把转录错误压到 0.21%，但对源数据错误一无所知</text>
<rect x="40" y="80" width="190" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="135.0" y="111.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b45309">病历 / 检验单</text>
<text x="135.0" y="128.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">唯一事实来源</text>
<rect x="280" y="60" width="170" height="56" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="365.0" y="84.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#3730a3">录入员 A</text>
<text x="365.0" y="101.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">0.28% 出错</text>
<rect x="280" y="132" width="170" height="56" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="365.0" y="156.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#3730a3">录入员 B</text>
<text x="365.0" y="173.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">独立第二遍</text>
<line x1="230" y1="100" x2="280" y2="88" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="230" y1="120" x2="280" y2="158" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="490" y="96" width="180" height="70" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="580.0" y="127.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f766e">逐字段比对</text>
<text x="580.0" y="144.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">不一致 1,929 处</text>
<line x1="450" y1="88" x2="490" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450" y1="160" x2="490" y2="142" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="710" y="96" width="190" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="805.0" y="127.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#166534">第三方裁定</text>
<text x="805.0" y="144.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">残留 2 处（0.21%）</text>
<line x1="670" y1="131" x2="710" y2="131" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="40" y="230" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#9f1239">但同一批 345,600 个单元格里，源数据本身错了 2,557 个（0.74%）</text>
<text x="40" y="254" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">双录检查的是「A 和 B 打得一样吗」，不是「病历上就是这个数吗」——转录错误与源数据错误比是 1 : 2.6</text>
<text x="40" y="296" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">SDV 抽样的真实盲区</text>
<rect x="40" y="308" width="420" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="250.0" y="335.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#b45309">按受试者随机抽 10%</text>
<text x="250.0" y="352.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">各中心错误率 0.88%~8.44%，随机抽到的是平均值 → 发现 10.0%</text>
<rect x="480" y="308" width="420" height="62" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="690.0" y="335.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#9f1239">按中心整站抽 10%（2/12 站）</text>
<text x="690.0" y="352.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">抽中高错误率中心 31.0%，抽错 0.0% → 全或无</text>
</svg>
