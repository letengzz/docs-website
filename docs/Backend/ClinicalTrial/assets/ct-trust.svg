<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="三个「这份数据可不可信」：源数据、录入数据、分析数据">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">三个「这份数据可不可信」：源数据、录入数据、分析数据</text>
<rect x="40" y="74" width="200" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="140.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#b45309">源数据</text>
<text x="140.0" y="132.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">病历、检验单、影像</text>
<rect x="40" y="190" width="200" height="90" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="140.0" y="231.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#3730a3">录入数据</text>
<text x="140.0" y="248.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">eCRF 里的那个数</text>
<rect x="40" y="306" width="200" height="76" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="140.0" y="340.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#0f766e">分析数据</text>
<text x="140.0" y="357.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">SDTM / 分析集</text>
<line x1="240" y1="119" x2="340" y2="119" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="240" y1="235" x2="340" y2="235" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="240" y1="344" x2="340" y2="344" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="340" y="74" width="268" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="474.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b45309">SDV 源数据核查</text>
<text x="474.0" y="132.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">抽样 10% 只能看 10%</text>
<text x="474.0" y="146.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">整站抽 2 站：最好 31.0%</text>
<rect x="340" y="190" width="268" height="90" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="474.0" y="231.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#3730a3">双录入 + 逻辑核查</text>
<text x="474.0" y="248.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">转录错误残留 0.21%</text>
<text x="474.0" y="262.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">源数据错误 0 检出</text>
<rect x="340" y="306" width="268" height="76" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="474.0" y="340.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f766e">程序化校验 + 锁库</text>
<text x="474.0" y="357.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">人群定义、缺失处理</text>
<text x="474.0" y="371.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">锁库后仍改 146 条</text>
<rect x="636" y="74" width="268" height="302" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="770.0" y="221.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#334155">问一句就能定性</text>
<text x="770.0" y="238.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">「这个数和病历上一样吗」→ 源数据</text>
<text x="770.0" y="252.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">「两个录入员打的一样吗」→ 录入</text>
<text x="770.0" y="266.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">「换个分析集还是这个结论吗」→ 分析</text>
<line x1="608" y1="119" x2="636" y2="119" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="608" y1="235" x2="636" y2="235" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="608" y1="344" x2="636" y2="344" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
