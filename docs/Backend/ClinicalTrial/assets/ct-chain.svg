<text x="278.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#3730a3">筛</text>
<text x="278.0" y="132.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">入排判定</text>
<line x1="349" y1="119" x2="374" y2="119" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="376" y="80" width="140" height="78" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="446.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#0f766e">随</text>
<text x="446.0" y="132.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">随机发药</text>
<line x1="517" y1="119" x2="542" y2="119" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="544" y="80" width="140" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="614.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#b45309">录</text>
<text x="614.0" y="132.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">录入质疑</text>
<rect x="40" y="210" width="140" height="78" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="110.0" y="245.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#3730a3">评</text>
<text x="110.0" y="262.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">评估编码</text>
<rect x="208" y="210" width="140" height="78" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="278.0" y="245.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#9f1239">揭</text>
<text x="278.0" y="262.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">盲态与揭盲</text>
<rect x="376" y="210" width="140" height="78" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="446.0" y="245.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#0f766e">锁</text>
<text x="446.0" y="262.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">锁库留痕</text>
<line x1="374" y1="249" x2="350" y2="249" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="206" y1="249" x2="182" y2="249" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="614,159 614,185 446,185" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<line x1="446" y1="185" x2="446" y2="208" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="724" y="80" width="176" height="208" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="812.0" y="180.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#334155">证据链</text>
<text x="812.0" y="197.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">谁在何时改了</text>
<text x="812.0" y="211.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">改前值 / 改后值</text>
<text x="812.0" y="225.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">为什么改</text>
<text x="40" y="300" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#9f1239">失败安静的环节</text>
<text x="40" y="326" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 价：拿到旧版方案建库，字段少了没人报错</text>
<text x="40" y="348" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 随：药盒按到货顺序发，错配 92.3% 不报错</text>
<text x="40" y="370" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 录：单录入，转录错误率 0.28% 不报错</text>
<text x="40" y="392" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 锁：锁库后仍能改，audit 缺理由 3.1% 不报错</text>
<text x="560" y="300" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">唯一显性的两段</text>
<text x="560" y="326" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 筛：筛败立即产生筛查失败记录</text>
<text x="560" y="348" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">· 揭：紧急揭盲必须留开启记录</text>
<text x="560" y="386" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">其余五段只能靠「可复核的证据」发现</text>
</svg>
