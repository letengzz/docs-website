<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-label="筛选漏斗与访视窗：越窗率由窗宽决定，不由中心决定">
<defs>
</defs>
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">筛选漏斗与访视窗：越窗率由窗宽决定，不由中心决定</text>
<rect x="40" y="72" width="420" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="250.0" y="105.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">筛查 2,400</text>
<rect x="40" y="146" width="320" height="56" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="200.0" y="179.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#3730a3">符合入排 1,215</text>
<rect x="40" y="220" width="200" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="140.0" y="253.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f766e">签署并随机 480</text>
<rect x="40" y="294" width="150" height="56" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="115.0" y="327.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#166534">完成 12 访视 412</text>
<text x="40" y="372" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">方案顺序平均 9.67 步 / 按性价比排序 9.16 步（省 5.3%）</text>
<text x="40" y="396" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">入排 14 条：8 条纳入 + 6 条排除，先测贵的还是先测便宜的，只影响成本不影响结论</text>
<text x="540" y="96" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">访视窗：名义第 28 天 ±3 天</text>
<line x1="540" y1="130" x2="880" y2="130" stroke="#6b7280" stroke-width="2"/>
<line x1="540" y1="122" x2="540" y2="138" stroke="#1f2937" stroke-width="2"/>
<text x="540" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">第 1 访视</text>
<rect x="522" y="96" width="36" height="20" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
<text x="540" y="110" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#0f766e">±3</text>
<line x1="690" y1="122" x2="690" y2="138" stroke="#1f2937" stroke-width="2"/>
<text x="690" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">第 2 访视</text>
<rect x="672" y="96" width="36" height="20" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
<text x="690" y="110" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#0f766e">±3</text>
<line x1="840" y1="122" x2="840" y2="138" stroke="#1f2937" stroke-width="2"/>
<text x="840" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">第 3 访视</text>
<rect x="822" y="96" width="36" height="20" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
<text x="840" y="110" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#0f766e">±3</text>
<text x="540" y="210" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">越窗率（N(0,2.4) 偏移模拟 5,280 次访视）</text>
<rect x="540" y="222" width="80" height="40" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="580.0" y="238.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#3730a3">±2 天</text>
<text x="580.0" y="255.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">20.6%</text>
<rect x="628" y="222" width="80" height="40" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="668.0" y="238.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#3730a3">±3 天</text>
<text x="668.0" y="255.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">9.1%</text>
<rect x="716" y="222" width="80" height="40" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="756.0" y="238.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#3730a3">±5 天</text>
<text x="756.0" y="255.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">1.2%</text>
<rect x="804" y="222" width="80" height="40" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="844.0" y="238.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#3730a3">±7 天</text>
<text x="844.0" y="255.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">0.1%</text>
<text x="540" y="300" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">窗期不是「越宽越好」：放宽到 ±7 天只剩 0.1% 越窗，</text>
<text x="540" y="322" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">但真正该发生的访视会被拖成「下一访视的前一天」。</text>
<text x="540" y="356" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">受试者号必须是「中心-序号」定长拼接：</text>
<text x="540" y="378" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9f1239">中心 1 序号 12 与中心 11 序号 2 都是「112」。</text>
</svg>
