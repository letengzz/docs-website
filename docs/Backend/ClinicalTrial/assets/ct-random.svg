<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="分配隐藏：固定区组的最后一位，一定是补齐的那一位">
<defs>
</defs>
<rect x="0" y="0" width="940" height="380" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">分配隐藏：固定区组的最后一位，一定是补齐的那一位</text>
<text x="60" y="82" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">区组 1（已知 3 例）</text>
<rect x="60" y="90" width="46" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="83.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f766e">试验</text>
<rect x="114" y="90" width="46" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="137.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#b45309">对照</text>
<rect x="168" y="90" width="46" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="191.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f766e">试验</text>
<text x="60" y="150" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">→ 第 4 例必然是「对照」</text>
<text x="330" y="82" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">区组 2（已知 3 例）</text>
<rect x="330" y="90" width="46" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="353.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#b45309">对照</text>
<rect x="384" y="90" width="46" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="407.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f766e">试验</text>
<rect x="438" y="90" width="46" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="461.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#b45309">对照</text>
<text x="330" y="150" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">→ 第 4 例必然是「试验」</text>
<text x="610" y="82" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">区组 3（已知 3 例）</text>
<rect x="610" y="90" width="46" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="633.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f766e">试验</text>
<rect x="664" y="90" width="46" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="687.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f766e">试验</text>
<rect x="718" y="90" width="46" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="741.0" y="115.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#b45309">对照</text>
<text x="610" y="150" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">→ 第 4 例必然是「对照」</text>
<text x="60" y="190" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#9f1239">固定区组 4：末位命中率 100%，可推断位置占 25%</text>
<text x="60" y="214" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">区组 2 → 占 50%；区组 6 → 16.7%；区组 8 → 12.5%</text>
<text x="60" y="250" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#166534">区组大小在 4/6 之间随机后：</text>
<text x="60" y="274" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">观察者不知道区组在哪结束，一律假设「这是末位」→ 命中率 20.0%</text>
<text x="60" y="300" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">这就是「分配隐藏」的全部内容：不是把信封藏好，</text>
<text x="60" y="322" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">而是让下一个人的组别在逻辑上不可推。</text>
<rect x="600" y="236" width="300" height="96" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="750.0" y="280.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#9f1239">药盒号 ≠ 随机号</text>
<text x="750.0" y="297.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">37 例筛败 → 之后 443 例（92.3%）错配</text>
</svg>
