<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="370" fill="#ffffff"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">五个指标与五个分母</text>
<text x="36" y="62" font-size="12" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母选错，所有指标都会变好看：按请求算卡顿，卡顿率永远接近 0</text>

<rect x="36" y="86" width="170" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="121" y="110" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">起播时间</text>
<text x="121" y="132" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母 = 会话</text>
<text x="121" y="152" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">续播不算起播</text>

<rect x="222" y="86" width="170" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="307" y="110" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">卡顿（频次）</text>
<text x="307" y="132" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母 = 会话</text>
<text x="307" y="152" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">不是 waiting 事件</text>

<rect x="408" y="86" width="170" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="493" y="110" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">卡顿时长占比</text>
<text x="493" y="132" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母 = 播放时长</text>
<text x="493" y="152" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">需要心跳才算得出</text>

<rect x="594" y="86" width="170" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="679" y="110" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">平均码率</text>
<text x="679" y="132" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母 = 播放时长</text>
<text x="679" y="152" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">不是请求数</text>

<rect x="780" y="86" width="144" height="86" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="852" y="110" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片失败率</text>
<text x="852" y="132" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分母 = 请求数</text>
<text x="852" y="152" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">基础设施指标</text>

<rect x="36" y="188" width="888" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="52" y="210" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">成本换算：10 万次播放 × 90 秒，单价 ¥0.24/GB</text>

<rect x="52" y="222" width="150" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="127" y="240" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">播放次数 × 时长</text>
<text x="127" y="256" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">× 平均码率</text>
<line x1="202" y1="243" x2="228" y2="243" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="228" y="222" width="130" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="293" y="240" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">÷ 8 ÷ 1024</text>
<text x="293" y="256" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">= 出口 GB</text>
<line x1="358" y1="243" x2="384" y2="243" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="384" y="222" width="130" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="449" y="240" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">× 单价</text>
<text x="449" y="256" font-size="10" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">= 成本</text>

<line x1="528" y1="210" x2="528" y2="326" stroke="#cbd5e1" stroke-width="1"/>

<text x="548" y="240" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">只有 480p（1.0 Mbps）：1098.6 GB → ¥263.67</text>
<text x="548" y="260" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">ABR 混合（2.2 Mbps）：2417.0 GB → ¥580.08</text>
<text x="548" y="280" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">只有 1080p（4.0 Mbps）：4394.5 GB → ¥1054.69</text>
<text x="548" y="304" font-size="10.5" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">边际成本：平均码率每 +0.1 Mbps → +109.9 GB ≈ +¥26.37</text>
<text x="52" y="296" font-size="10" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">千次播放成本：¥2.64 / ¥5.80 / ¥10.55</text>
<text x="52" y="316" font-size="10" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">命中率只影响回源流量，不减 CDN 出口</text>

<rect x="36" y="348" width="888" height="1" fill="none"/>
</svg>
