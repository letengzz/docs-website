<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">入库的四步与三种失败面</text>
<text x="36" y="62" font-size="12" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">唯一直接吃用户上行带宽的一段：断、重、错的代价都与文件大小成正比</text>

<rect x="36" y="88" width="204" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="138" y="112" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 签名</text>
<text x="138" y="134" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">key / 方法 / 有效期</text>
<text x="138" y="152" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">大小上限四者绑死</text>
<text x="138" y="170" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">key 由服务端生成</text>

<rect x="264" y="88" width="204" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="366" y="112" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 分片上传</text>
<text x="366" y="134" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">5 / 8 / 16 / 32 MB</text>
<text x="366" y="152" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">断点续传 ≤ 1 块</text>
<text x="366" y="170" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">浪费恒为 0.5%</text>

<rect x="492" y="88" width="204" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="594" y="112" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 校验</text>
<text x="594" y="134" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">整文件 SHA-256</text>
<text x="594" y="152" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">2 GB ≈ 2.5 s CPU</text>
<text x="594" y="170" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片 ETag ≠ 文件哈希</text>

<rect x="720" y="88" width="204" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="822" y="112" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 内容寻址</text>
<text x="822" y="134" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">sha256 + profile</text>
<text x="822" y="152" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">幂等 + 秒传 + 去重</text>
<text x="822" y="170" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">引用计数防越权</text>

<line x1="240" y1="134" x2="264" y2="134" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="468" y1="134" x2="492" y2="134" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="696" y1="134" x2="720" y2="134" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="36" y="216" font-size="12" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">三种失败面（每一种都会让下游多花一次钱）</text>

<rect x="36" y="230" width="288" height="76" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
<text x="52" y="252" font-size="11.5" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">断：90% 处断网</text>
<text x="52" y="272" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">无续传要重传 1843 MB</text>
<text x="52" y="290" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">有续传最多重传 1 块（≤32 MB）</text>

<rect x="336" y="230" width="288" height="76" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
<text x="352" y="252" font-size="11.5" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">重：同一文件转两遍</text>
<text x="352" y="272" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">用文件名当身份 → 覆盖 + 重复转码</text>
<text x="352" y="290" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">用哈希+profile → 天然幂等</text>

<rect x="636" y="230" width="288" height="76" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
<text x="652" y="252" font-size="11.5" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">错：秒传越权</text>
<text x="652" y="272" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">「哈希存在即拥有」= 按哈希猜内容</text>
<text x="652" y="290" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">业务引用与存储对象分开记</text>

<rect x="36" y="322" width="888" height="26" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="52" y="340" font-size="10.5" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">元数据必抽七个字段：duration / width / height / r_frame_rate / codec_name / pix_fmt / rotation</text>
</svg>
