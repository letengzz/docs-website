<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img">
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片边界、GOP 与清单的三层关系</text>
<text x="36" y="62" font-size="12" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片只能切在 IDR 上；能不能整除，决定 IDR 间隔是恒定还是抖动</text>

<text x="36" y="94" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">对齐：GOP 2 s × 分片 4 s（4 = 2 × 2）</text>

<rect x="120" y="104" width="600" height="26" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<rect x="120" y="104" width="150" height="26" fill="#dbeafe" stroke="none"/>
<rect x="420" y="104" width="150" height="26" fill="#dbeafe" stroke="none"/>
<rect x="120" y="104" width="600" height="26" rx="3" fill="none" stroke="#1d4ed8" stroke-width="1"/>
<line x1="270" y1="98" x2="270" y2="136" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="420" y1="98" x2="420" y2="136" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="570" y1="98" x2="570" y2="136" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="120" y1="98" x2="120" y2="136" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="720" y1="98" x2="720" y2="136" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="195" y1="104" x2="195" y2="130" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="345" y1="104" x2="345" y2="130" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="495" y1="104" x2="495" y2="130" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="645" y1="104" x2="645" y2="130" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 2"/>
<text x="112" y="94" font-size="9.5" fill="#b91c1c" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">IDR</text>
<text x="120" y="150" font-size="9.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">0s</text>
<text x="420" y="150" font-size="9.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">8s</text>
<text x="720" y="150" font-size="9.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">16s</text>
<text x="740" y="120" font-size="10" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片 4 s，每片 1 刀</text>
<text x="740" y="140" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">60 s 内 30 个 IDR</text>
<text x="740" y="158" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">相对码率 +11.7%</text>

<text x="36" y="200" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">错位：GOP 3 s × 分片 4 s（4 ÷ 3 不是整数）</text>

<rect x="120" y="210" width="600" height="26" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<line x1="120" y1="204" x2="120" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="165" y1="204" x2="165" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="270" y1="204" x2="270" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="420" y1="204" x2="420" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="570" y1="204" x2="570" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="720" y1="204" x2="720" y2="242" stroke="#b91c1c" stroke-width="1.6"/>
<text x="142" y="262" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">1s</text>
<text x="217" y="262" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">2s</text>
<text x="345" y="262" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">3s</text>
<text x="740" y="220" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">边界强制补 IDR</text>
<text x="740" y="238" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">间隔在 1/2/3 s 抖动</text>
<text x="740" y="256" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">缓冲估算从此不可信</text>

<rect x="36" y="286" width="288" height="76" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
<text x="52" y="308" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">第一层：编码流</text>
<text x="52" y="328" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">IDR 由 -g / -keyint_min 决定</text>
<text x="52" y="346" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">必须关掉 sc_threshold</text>

<rect x="336" y="286" width="288" height="76" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
<text x="352" y="308" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">第二层：分片</text>
<text x="352" y="328" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">-hls_time 必须是 GOP 的整数倍</text>
<text x="352" y="346" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">每片可独立解码</text>

<rect x="636" y="286" width="288" height="76" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
<text x="652" y="308" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">第三层：清单</text>
<text x="652" y="328" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">TARGETDURATION ≥ 最长片时长</text>
<text x="652" y="346" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">ENDLIST 缺失 = 被当成直播</text>
</svg>
