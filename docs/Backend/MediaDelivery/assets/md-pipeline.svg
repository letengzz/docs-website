<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">五段链路与四条交接契约</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每段单独都能跑通；四条契约不成立，接起来就有事故</text>

<rect x="36" y="96" width="168" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="120" y="122" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 入库</text>
<text x="120" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">源文件 → 对象键</text>
<text x="120" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">哈希 + 元数据</text>
<text x="120" y="190" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：同名覆盖</text>

<rect x="216" y="96" width="168" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="300" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 转码</text>
<text x="300" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">源 + 档 → 多档流</text>
<text x="300" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">CPU 密集</text>
<text x="300" y="190" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：阶梯拍脑袋</text>

<rect x="396" y="96" width="168" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="480" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 封装</text>
<text x="480" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">流 → 分片 + 清单</text>
<text x="480" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">IO 密集</text>
<text x="480" y="190" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：边界不对齐</text>

<rect x="576" y="96" width="168" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="660" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 分发</text>
<text x="660" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片 → 边缘 URL</text>
<text x="660" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">带宽成本主力</text>
<text x="660" y="190" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：键带签名</text>

<rect x="756" y="96" width="168" height="112" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="840" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑤ 播放</text>
<text x="840" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">URL → 屏幕画面</text>
<text x="840" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">受终端与网络支配</text>
<text x="840" y="190" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：ABR 无缓冲意识</text>

<line x1="204" y1="152" x2="216" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="384" y1="152" x2="396" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="564" y1="152" x2="576" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="744" y1="152" x2="756" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="204" y="224" width="180" height="52" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="294" y="244" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">C1 哈希 + profile</text>
<text x="294" y="264" font-size="10" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一文件只转一次</text>

<rect x="384" y="224" width="180" height="52" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="474" y="244" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">C2 GOP 严格恒定</text>
<text x="474" y="264" font-size="10" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">分片 = GOP × 整数</text>

<rect x="564" y="224" width="180" height="52" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="654" y="244" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">C3 对象键 ≠ 缓存键</text>
<text x="654" y="264" font-size="10" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">签名不进键</text>

<rect x="744" y="224" width="180" height="52" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="834" y="244" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">C4 清单与切片同版本</text>
<text x="834" y="264" font-size="10" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">路径带版本段</text>

<rect x="36" y="300" width="888" height="68" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="52" y="322" font-size="11.5" font-weight="700" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">一个必须记住的比例</text>
<text x="52" y="344" font-size="10.5" fill="#166534" font-family="PingFang SC, Helvetica, Arial, sans-serif">观众体感由「封装 + 播放」决定；账单由「转码 + 分发」决定。看到体验差先去前两段，看到贵先看后两段。</text>
<text x="52" y="362" font-size="10" fill="#166534" font-family="PingFang SC, Helvetica, Arial, sans-serif">方向搞反，就会花一周改编码参数，而问题在缓存键上。</text>
</svg>
