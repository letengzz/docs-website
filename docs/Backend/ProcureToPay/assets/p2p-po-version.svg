<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="订单版本：收货必须对版本，不能对订单号">
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">订单版本：收货必须对版本，不能对订单号</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">改一次数量就生成一个新版本；收货单记的是「按哪一版收的」，否则超收永远算不出来</text>
<rect x="30" y="92" width="200" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">PO-1001 v1</text>
<text x="130.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">100 件 @ 12.50</text>
<text x="130" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">2026-03-02 生效</text>
<rect x="254" y="92" width="200" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">PO-1001 v2</text>
<text x="354.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">120 件 @ 12.50</text>
<text x="354" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">2026-03-09 生效</text>
<rect x="478" y="92" width="200" height="86" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="578.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">PO-1001 v3</text>
<text x="578.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">80 件 @ 12.80</text>
<text x="578" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">2026-03-15 生效</text>
<line x1="230" y1="135" x2="250" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="135" x2="474" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="218" width="880" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="242.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">收货单必须存 po_version，只存 po_no 时：按 v2 的 120 收 100 件算欠 20，实际 v3 只要求 80</text>
<rect x="30" y="282" width="290" height="74" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="175.0" y="315.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">累计口径</text>
<text x="175.0" y="333.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Σ已收 ≤ 当前版本数量 × (1+超收允差)</text>
<rect x="340" y="282" width="290" height="74" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="485.0" y="315.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">价格口径</text>
<text x="485.0" y="333.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">按收货时点的版本价暂估，不按最新价</text>
<rect x="650" y="282" width="260" height="74" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="780.0" y="315.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">变更口径</text>
<text x="780.0" y="333.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">数量减少不得低于已收 + 在途</text>
<text x="30" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">三条口径写在收货侧，不写在订单侧：订单不知道「已经收了多少」，它只知道「允许收多少」</text>
<text x="30" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">价格变更只影响未收部分——已经暂估入库的部分要用价差调整单冲回，不能改历史</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
