<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="三单匹配：不是「对不对」，是「差在哪一类」">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三单匹配：不是「对不对」，是「差在哪一类」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">把差额分到四类，才有对应的动作；分不出来的一律叫「其他差异」，最后都变成人工翻邮件</text>
<rect x="30" y="92" width="200" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="125.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">订单 PO</text>
<text x="130.0" y="143.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">数量 / 单价 / 税率 / 版本</text>
<rect x="30" y="186" width="200" height="74" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="130.0" y="219.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">收货 GR</text>
<text x="130.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">实收数量 / 批次 / 质检态</text>
<rect x="30" y="280" width="200" height="74" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="130.0" y="313.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">发票 INV</text>
<text x="130.0" y="331.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">开票数量 / 金额 / 税额</text>
<line x1="230" y1="129" x2="286" y2="129" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="230" y1="223" x2="286" y2="223" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="230" y1="317" x2="286" y2="317" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="286" y="150" width="180" height="140" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="376.0" y="216.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">匹配引擎</text>
<text x="376.0" y="234.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">键配 + 容差 + 差异分类</text>
<line x1="466" y1="180" x2="516" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="466" y1="220" x2="516" y2="220" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="466" y1="260" x2="516" y2="290" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="516" y="120" width="394" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="713.0" y="144.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">自动通过 → 生成应付</text>
<text x="713.0" y="162.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">在容差内，直接过账</text>
<rect x="516" y="192" width="394" height="56" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="713.0" y="216.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">挂账待查 → GR/IR / 差异科目</text>
<text x="713.0" y="234.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">超容差，冻结付款</text>
<rect x="516" y="264" width="394" height="56" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="713.0" y="288.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">扣款单 / 借记单 → 抵减下期</text>
<text x="713.0" y="306.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">价差可归因到供应商</text>
<text x="30" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">四类差异各自有唯一动作，写不出动作的差异说明分类不够细：</text>
<rect x="30" y="396" width="208" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="134.0" y="419.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">价差</text>
<text x="134.0" y="437.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">单价不符 → 扣款</text>
<rect x="252" y="396" width="208" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="356.0" y="419.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">量差</text>
<text x="356.0" y="437.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">数量不符 → 补货/退货</text>
<rect x="474" y="396" width="208" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="578.0" y="419.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">税差</text>
<text x="578.0" y="437.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">税率或税额不符 → 退回重开</text>
<rect x="696" y="396" width="208" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="800.0" y="419.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">费差</text>
<text x="800.0" y="437.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">运费/杂费未入单 → 补订单行</text>
<text x="470" y="468" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">键配（po_no+行号）5,000 次查询 7.7 ms；按 SKU+金额全表比对 25,000,000 次——先键配，再模糊配</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
