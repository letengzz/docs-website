<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="预算占用：占用是一笔写操作，不是一次查询">
<rect x="0" y="0" width="940" height="430" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">预算占用：占用是一笔写操作，不是一次查询</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">「还有没有预算」必须在同一条语句里问完并扣掉，否则并发下一定超占</text>
<rect x="30" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 提申请</text>
<text x="130.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">金额 + 科目 + 期间</text>
<rect x="254" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 预算校验</text>
<text x="354.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">条件更新原子扣减</text>
<rect x="478" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="578.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 占用</text>
<text x="578.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">used += amount</text>
<rect x="702" y="92" width="200" height="78" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="802.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 下单</text>
<text x="802.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">PO 引用 budget_id</text>
<line x1="230" y1="131" x2="250" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="131" x2="474" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="678" y1="131" x2="698" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="130" y1="170" x2="130" y2="232" stroke="#64748b" stroke-width="1.6"/>
<line x1="130" y1="232" x2="130" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="232" width="200" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="130.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">取消 / 关闭 → 释放</text>
<text x="130.0" y="275.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">used -= amount</text>
<rect x="254" y="232" width="200" height="58" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="354.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">超期未下单 → 结转</text>
<text x="354.0" y="275.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">按期间重算</text>
<rect x="478" y="232" width="412" height="58" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="684.0" y="266.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">8 线程 × 25 笔 × 10 万元 / 预算 500 万（本机实测）</text>
<rect x="478" y="300" width="412" height="44" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="684.0" y="326.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">先查后写：56 笔通过、超占 6,000 元；条件更新：恰好 50 笔、超占 0</text>
<text x="30" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">预算维度必须四元组齐全：期间 + 科目 + 成本中心 + 项目；少一个维度，超占就查不出来</text>
<text x="30" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">释放只认「终态」：申请取消、订单关闭、收货完成三种终态各自释放一次，重复释放比超占更难发现</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
