<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="七段链：钱在路上，账在纸上">
<rect x="0" y="0" width="940" height="430" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段链：钱在路上，账在纸上</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">订单说该买什么、收货说到了什么、发票说要付多少——三份文件由三个部门在三个时点写，差额只能靠挂账兜住</text>
<rect x="30" y="92" width="200" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 需求申请</text>
<text x="130.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">PR + 预算占用</text>
<rect x="254" y="92" width="200" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 寻源比价</text>
<text x="354.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">RFQ / 密封报价</text>
<rect x="478" y="92" width="200" height="82" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="578.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 采购订单</text>
<text x="578.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">PO 版本与分批</text>
<rect x="702" y="92" width="200" height="82" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="802.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 收货质检</text>
<text x="802.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">ASN + 允差</text>
<line x1="230" y1="133" x2="250" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="133" x2="474" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="678" y1="133" x2="698" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="802" y1="176" x2="802" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="702" y="210" width="200" height="82" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="802.0" y="247.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 三单匹配</text>
<text x="802.0" y="265.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">容差 + 差异分类</text>
<rect x="478" y="210" width="200" height="82" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="578.0" y="247.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 付款排程</text>
<text x="578.0" y="265.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">账期 + 折扣 + 回单</text>
<rect x="254" y="210" width="200" height="82" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="354.0" y="247.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑦ 供应商治理</text>
<text x="354.0" y="265.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">准入 / 绩效 / 退出</text>
<line x1="702" y1="251" x2="682" y2="251" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="478" y1="251" x2="458" y2="251" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="316" width="880" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="342.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">安静的三段：收货差量、匹配差额、付款折扣——三段都不会报错，只会默默挂账</text>
<text x="470" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">每段都有自己的成功定义：采购=单下了 / 仓库=货收了 / 财务=票记了 / 出纳=钱付了</text>
<text x="470" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">四份证据：pr_no · po_no + po_version · gr_no · invoice_no + payment_batch</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
