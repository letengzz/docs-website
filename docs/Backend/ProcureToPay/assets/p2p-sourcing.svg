<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="寻源：先定比价口径，再谈价格">
<rect x="0" y="0" width="940" height="430" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">寻源：先定比价口径，再谈价格</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">密封报价的全部工程目的，是让「谁先报」和「谁看过别人的价」都不影响结果</text>
<rect x="30" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 需求归集</text>
<text x="130.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">合并同料号需求</text>
<rect x="254" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 发标</text>
<text x="354.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">密封 + 截止时点</text>
<rect x="478" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="578.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 开标</text>
<text x="578.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">截止后统一解密</text>
<rect x="702" y="92" width="200" height="78" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="802.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 定标</text>
<text x="802.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">评分 + 价格条款</text>
<line x1="230" y1="131" x2="250" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="131" x2="474" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="678" y1="131" x2="698" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="590" y1="180" x2="590" y2="214" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="598" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="400">截止时点：此前任何一方都不得看到报价</text>
<rect x="30" y="224" width="200" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="130.0" y="252.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">价格</text>
<text x="130.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">折算到可比口径</text>
<rect x="254" y="224" width="200" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="354.0" y="252.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">质量</text>
<text x="354.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">批次合格率</text>
<rect x="478" y="224" width="200" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="578.0" y="252.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">交付</text>
<text x="578.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">准时率 / 提前期</text>
<rect x="702" y="224" width="200" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="802.0" y="252.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">服务</text>
<text x="802.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">响应与配合</text>
<text x="30" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">四维必须各自归一化到同一量纲后再加权——否则权重写在纸上、实际由量纲决定</text>
<rect x="30" y="336" width="880" height="44" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="362.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">本机实测：质量 0~100 与价格指数 0~5 直接加权 → S1 第一；价格折算到 0~100 后 → S2/S4 并列第一</text>
<text x="470" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">同一批数据、同一组权重，只因量纲没归一，排序整体反转——供应商看到的「评分」就是这么错的</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
