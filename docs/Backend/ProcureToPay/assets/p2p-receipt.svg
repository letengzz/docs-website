<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="收货：一张收货单要同时喂饱仓库和财务">
<rect x="0" y="0" width="940" height="420" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">收货：一张收货单要同时喂饱仓库和财务</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">仓库要「货在哪」，财务要「暂估多少」，两件事在同一次过账里完成</text>
<rect x="30" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① ASN 预报</text>
<text x="130.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">供应商提前通知</text>
<rect x="254" y="92" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 收货过账</text>
<text x="354.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">按行 + 批次</text>
<rect x="478" y="92" width="200" height="78" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="578.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 质检判定</text>
<text x="578.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">四态之一</text>
<rect x="702" y="92" width="200" height="78" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="802.0" y="127.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 暂估入账</text>
<text x="802.0" y="145.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">GR/IR 挂账</text>
<line x1="230" y1="131" x2="250" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="131" x2="474" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="678" y1="131" x2="698" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="200" width="208" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="134.0" y="235.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">合格</text>
<rect x="252" y="200" width="208" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="356.0" y="235.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">让步接收</text>
<rect x="474" y="200" width="208" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="578.0" y="235.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">待检</text>
<rect x="696" y="200" width="208" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="800.0" y="235.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">拒收</text>
<text x="30" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="400">质检四态决定两件事：能不能入库、能不能算「已收」——「待检」不算已收，否则暂估会提前</text>
<rect x="30" y="306" width="880" height="44" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="332.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">本机实测（到货量偏差 N(0,3%)，1,000 行）：允差 0% → 仅 9.1% 自动通过；2% → 51.8%；5% → 89.7%</text>
<text x="470" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">允差不是「宽松度」，是「把多少人工成本换成多少错收风险」——它必须写进供应商合同，不能只写在代码里</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
</svg>
