<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img">
<rect width="820" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 3　四个状态、四条合法边：其余都是「不该发生」</text>
<rect x="80" y="90" width="180" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="170.0" y="112" font-size="13" fill="#475569" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">inactive</text>
<text x="170.0" y="131" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">无异常</text>
<rect x="320" y="90" width="180" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
<text x="410.0" y="112" font-size="13" fill="#475569" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">pending</text>
<text x="410.0" y="131" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">已命中、未到 for</text>
<rect x="560" y="90" width="180" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="650.0" y="112" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">firing</text>
<text x="650.0" y="131" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">已通知到人</text>
<rect x="560" y="250" width="180" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="650.0" y="272" font-size="13" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">resolved</text>
<text x="650.0" y="291" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">已恢复、已关闭</text>
<line x1="260.0" y1="118.0" x2="310.0" y2="118.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<polygon points="318.0,118.0 310.0,118.0 312.9,111.9 312.9,124.1" fill="#2563eb"/>
<text x="289" y="108" font-size="10.5" fill="#2563eb" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">命中</text>
<line x1="500.0" y1="118.0" x2="550.0" y2="118.0" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<polygon points="558.0,118.0 550.0,118.0 552.9,111.9 552.9,124.1" fill="#b91c1c"/>
<text x="529" y="108" font-size="10.5" fill="#b91c1c" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">持续 ≥ for</text>
<line x1="650.0" y1="156.0" x2="650.0" y2="240.0" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<polygon points="650.0,248.0 650.0,240.0 656.1,242.9 643.9,242.9" fill="#047857"/>
<text x="658" y="205" font-size="10.5" fill="#047857" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">连续 N 点正常</text>
<line x1="560.0" y1="285.0" x2="268.0" y2="285.0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
<polygon points="260.0,285.0 268.0,285.0 265.1,291.1 265.1,278.9" fill="#94a3b8"/>
<line x1="260.0" y1="285.0" x2="260.0" y2="164.0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
<polygon points="260.0,156.0 260.0,164.0 253.9,161.1 266.1,161.1" fill="#94a3b8"/>
<text x="300" y="305" font-size="10.5" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">回到 inactive（下一拍重新计数）</text>
<rect x="60" y="330" width="700" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="410.0" y="352" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三条被触发器挡住的边</text>
<text x="410.0" y="371.5" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">pending → resolved（跳过 firing：没通知过就关，等于没发生）</text>
<text x="410.0" y="387.0" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">firing → pending（回退：告警条数会重复计）</text>
<text x="410.0" y="402.5" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">resolved → firing（终态复活：同一次故障被记成两次）</text>
</svg>
