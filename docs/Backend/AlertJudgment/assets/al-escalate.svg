<rect x="70" y="70" width="190" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="165.0" y="92" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">L1 值班</text>
<text x="165.0" y="111.5" font-size="12" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">预算 5 min</text>
<line x1="260.0" y1="105.0" x2="300.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
