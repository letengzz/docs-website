<text x="645.0" y="92" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">L3 主管</text>
<text x="645.0" y="111.5" font-size="12" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">预算 30 min</text>
<rect x="76" y="148" width="79.1" height="18" rx="9.0" fill="#047857"/>
<text x="115.55" y="161" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">白天认领 92%</text>
<rect x="76" y="170" width="79.1" height="18" rx="9.0" fill="#b91c1c"/>
<text x="115.55" y="183" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">夜间认领 55%</text>
<text x="70" y="210" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">λ = 3 次/天，30 天实测</text>
<text x="70" y="232" font-size="11" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">方案</text>
<text x="300" y="232" font-size="11" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">未认领</text>
<text x="440" y="232" font-size="11" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p90 响应</text>
<text x="70" y="252" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">单级 5 min</text>
<text x="300" y="252" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">27.3%</text>
<text x="440" y="252" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">279 s</text>
<text x="70" y="278" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">两级 5 → 15</text>
<text x="300" y="278" font-size="12" fill="#b45309" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">13.5%</text>
<text x="440" y="278" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">311 s</text>
<text x="70" y="304" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三级 5 → 15 → 30</text>
<text x="300" y="304" font-size="12" fill="#047857" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1.1%</text>
<text x="440" y="304" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">522 s</text>
<rect x="540" y="210" width="230" height="130" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="655.0" y="232" font-size="13.5" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">夜间的账</text>
<text x="655.0" y="251.5" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">39 个夜间事件里</text>
<text x="655.0" y="267.0" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">单级有 22 个（56.4%）</text>
<text x="655.0" y="282.5" font-size="11.5" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">到早上才被认领</text>
<text x="70" y="400" font-size="11.5" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">升级链的代价是 p90 从 279s 涨到 522s——它不是免费的保险，是换来的。</text>
</svg>
