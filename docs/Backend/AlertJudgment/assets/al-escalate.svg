<text x="405.0" y="111.5" font-size="12" fill="#475569" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">预算 15 min</text>
<line x1="500.0" y1="105.0" x2="540.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
