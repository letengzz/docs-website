<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img">
<rect width="820" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 2　同一个 60 秒，两个评估时刻读到两个不同的数</text>
<rect x="350.0" y="96" width="140.0" height="80" fill="#fef2f2" stroke="none"/>
<line x1="350.0" y1="96" x2="350.0" y2="176" stroke="#b91c1c" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="490.0" y1="96" x2="490.0" y2="176" stroke="#b91c1c" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="420.0" y="90" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">30s 尖峰</text>
<line x1="70" y1="176" x2="630" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="70.0" y1="176" x2="70.0" y2="183" stroke="#94a3b8"/>
<text x="70.0" y="198" font-size="10.5" fill="#94a3b8" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">0s</text>
<line x1="140.0" y1="176" x2="140.0" y2="180" stroke="#94a3b8"/>
<line x1="210.0" y1="176" x2="210.0" y2="183" stroke="#94a3b8"/>
<text x="210.0" y="198" font-size="10.5" fill="#94a3b8" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">30s</text>
<line x1="280.0" y1="176" x2="280.0" y2="180" stroke="#94a3b8"/>
<line x1="350.0" y1="176" x2="350.0" y2="183" stroke="#94a3b8"/>
<text x="350.0" y="198" font-size="10.5" fill="#94a3b8" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">60s</text>
<line x1="420.0" y1="176" x2="420.0" y2="180" stroke="#94a3b8"/>
<line x1="490.0" y1="176" x2="490.0" y2="183" stroke="#94a3b8"/>
<text x="490.0" y="198" font-size="10.5" fill="#94a3b8" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">90s</text>
<line x1="560.0" y1="176" x2="560.0" y2="180" stroke="#94a3b8"/>
<line x1="630.0" y1="176" x2="630.0" y2="183" stroke="#94a3b8"/>
<text x="630.0" y="198" font-size="10.5" fill="#94a3b8" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">120s</text>
<rect x="350.0" y="106" width="280.0" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="490.0" y="120" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口 [60,120]　读到尖峰</text>
<rect x="70.0" y="138" width="280.0" height="20" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="210.0" y="152" font-size="10.5" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口 [0,60]　差一点</text>
<text x="518.0" y="172" font-size="10.5" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">评估步长 60s</text>
<rect x="70" y="239" width="3" height="28" fill="#2563eb"/>
<text x="84" y="252" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口 60s（4 点）</text>
<text x="310" y="252" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">与 300s 窗口的读数差 23.5%</text>
<rect x="70" y="279" width="3" height="28" fill="#6d28d9"/>
<text x="84" y="292" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口 300s（20 点）</text>
<text x="310" y="292" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">同一突发被抹平，差 8.1%</text>
<rect x="70" y="319" width="3" height="28" fill="#b91c1c"/>
<text x="84" y="332" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口 15s（= 步长）</text>
<text x="310" y="332" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">取不到 2 个点 → 100% 的时刻静默</text>
<rect x="70" y="359" width="3" height="28" fill="#b45309"/>
<text x="84" y="372" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">步长 60s / 故障 30s</text>
<text x="310" y="372" font-size="12" fill="#475569" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">漏检 50%：故障短于步长</text>
<text x="70" y="404" font-size="11.5" fill="#94a3b8" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">窗口长度不是精度参数，是「你回答的是哪一个问题」：瞬时、趋势，还是窗口均值。</text>
</svg>
