<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="418" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">成本问题分诊：先分类，再动手</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一句「成本不对」，在四类问题里对应四套完全不同的排查路径</text>
  <rect x="270" y="74" width="220" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">成本数不对</text>
  <text x="380" y="109" text-anchor="middle" font-size="7.5" fill="#334155">先定位是哪一类</text>
  <rect x="16" y="160" width="176" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="104" y="178.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">单位成本偏高/低</text>
  <text x="104" y="195" text-anchor="middle" font-size="7.5" fill="#B45309">查分母：约当产量</text>
  <text x="104" y="212.25" text-anchor="middle" font-size="7.5" fill="#B45309">查分子：分摊基数</text>
  <rect x="206" y="160" width="176" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="294" y="178.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">总额对不上总账</text>
  <text x="294" y="195" text-anchor="middle" font-size="7.5" fill="#B91C1C">查漏过账 / 期间</text>
  <text x="294" y="212.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">查含税口径</text>
  <rect x="396" y="160" width="176" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="484" y="178.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">差异科目余额大</text>
  <text x="484" y="195" text-anchor="middle" font-size="7.5" fill="#6D28D9">查标准价是否过期</text>
  <text x="484" y="212.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">查差异分摊顺序</text>
  <rect x="586" y="160" width="158" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="665" y="178.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">月结跑不动</text>
  <text x="665" y="195" text-anchor="middle" font-size="7.5" fill="#1D4ED8">查依赖顺序</text>
  <text x="665" y="212.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">查重跑是否追加</text>
  <line x1="340" y1="130" x2="104" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="130" x2="294" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="400" y1="130" x2="484" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="440" y1="130" x2="664" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="16" y="274" width="728" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="292.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">四类问题的排查入口完全不同</text>
  <text x="380" y="309" text-anchor="middle" font-size="7.5" fill="#0F766E">单位成本问题看分母；总额问题看过账；差异问题看版本；性能问题看依赖</text>
  <rect x="16" y="350" width="728" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="368.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">一条禁止项</text>
  <text x="380" y="385" text-anchor="middle" font-size="7.5" fill="#B91C1C">勾稽不平就调账，会让「差异」永久失去被解释的机会</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
