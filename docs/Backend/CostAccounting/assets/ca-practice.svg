<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="382" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：一个月成本核算的六步闭环</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每步一张表、每步可重跑、最后一步说了算</text>
  <rect x="14" y="80" width="116" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="72" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 1 步 建表</text>
  <text x="72" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">要素 / 中心 / 对象 / 期间</text>
  <text x="72" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">五列唯一键</text>
  <rect x="138" y="80" width="116" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="196" y="98.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">第 2 步 归集</text>
  <text x="196" y="115" text-anchor="middle" font-size="7.5" fill="#4338CA">入库、工时、费用入池</text>
  <text x="196" y="132.25" text-anchor="middle" font-size="7.5" fill="#4338CA">带来源单号</text>
  <rect x="262" y="80" width="116" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="320" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">第 3 步 计价</text>
  <text x="320" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">重算出库成本</text>
  <text x="320" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">按方法分支</text>
  <rect x="386" y="80" width="116" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="444" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">第 4 步 分摊</text>
  <text x="444" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">辅助 → 基本 → 对象</text>
  <text x="444" y="132.25" text-anchor="middle" font-size="7.5" fill="#0F766E">守恒校验</text>
  <rect x="510" y="80" width="116" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="568" y="98.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">第 5 步 结转</text>
  <text x="568" y="115" text-anchor="middle" font-size="7.5" fill="#C2410C">完工 / 在制 / 销售成本</text>
  <text x="568" y="132.25" text-anchor="middle" font-size="7.5" fill="#C2410C">三条分录</text>
  <rect x="634" y="80" width="116" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="692" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">第 6 步 勾稽</text>
  <text x="692" y="115" text-anchor="middle" font-size="7.5" fill="#047857">三道等式 + 试算平衡</text>
  <text x="692" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">不过则拒绝关账</text>
  <line x1="130" y1="128" x2="138" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="254" y1="128" x2="262" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="378" y1="128" x2="386" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="502" y1="128" x2="510" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="626" y1="128" x2="634" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="14" y="204" width="732" height="60" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="222.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">每一步都落一张表、都能单独重跑</text>
  <text x="380" y="239" text-anchor="middle" font-size="7.5" fill="#334155">同一期间重跑任一步，结果必须与上一次逐行相同（幂等），否则不允许进入下一步</text>
  <rect x="14" y="282" width="356" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="192" y="300.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">可运行验证</text>
  <text x="192" y="317" text-anchor="middle" font-size="7.5" fill="#047857">SQLite 一份 schema + 一组 SQL</text>
  <text x="192" y="334.25" text-anchor="middle" font-size="7.5" fill="#047857">六个数对得上就算过</text>
  <rect x="390" y="282" width="356" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="568" y="300.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">不许做的事</text>
  <text x="568" y="317" text-anchor="middle" font-size="7.5" fill="#B91C1C">手工改明细凑平衡</text>
  <text x="568" y="334.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">跳过勾稽直接关账</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
