<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三方勾稽：台账、明细、总账与利润表</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">成本算得对不对，最终只能由「四张表能不能对上」来回答</text>
  <rect x="16" y="80" width="176" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="104" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">存货台账</text>
  <text x="104" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">数量 × 单价</text>
  <text x="104" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按仓库 / 批次</text>
  <rect x="204" y="80" width="176" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="292" y="98.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">成本明细</text>
  <text x="292" y="115" text-anchor="middle" font-size="7.5" fill="#4338CA">按工单 / 对象</text>
  <text x="292" y="132.25" text-anchor="middle" font-size="7.5" fill="#4338CA">要素级明细</text>
  <rect x="392" y="80" width="176" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="480" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">总账余额</text>
  <text x="480" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">存货 / 生产成本</text>
  <text x="480" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">科目级汇总</text>
  <rect x="580" y="80" width="164" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="662" y="98.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">利润表</text>
  <text x="662" y="115" text-anchor="middle" font-size="7.5" fill="#C2410C">主营业务成本</text>
  <text x="662" y="132.25" text-anchor="middle" font-size="7.5" fill="#C2410C">本期结转额</text>
  <line x1="192" y1="128" x2="204" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="128" x2="392" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="568" y1="128" x2="580" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="16" y="200" width="728" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="218.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">三道等式（月结必须同时成立）</text>
  <text x="380" y="235" text-anchor="middle" font-size="7.5" fill="#047857">① 台账金额 = 总账存货余额　② 成本明细合计 = 生产成本余额 + 本期结转　③ 本期结转 = 利润表营业成本</text>
  <rect x="16" y="278" width="352" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="192" y="296.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">差异的三种来路</text>
  <text x="192" y="313" text-anchor="middle" font-size="7.5" fill="#B45309">漏过账 / 重复过账</text>
  <text x="192" y="330.25" text-anchor="middle" font-size="7.5" fill="#B45309">期间错位（跨期入库）</text>
  <text x="192" y="347.5" text-anchor="middle" font-size="7.5" fill="#B45309">口径不同（含税 / 不含税）</text>
  <rect x="392" y="278" width="352" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="568" y="296.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">对不上时先做什么</text>
  <text x="568" y="313" text-anchor="middle" font-size="7.5" fill="#B91C1C">按「对象 × 期间」二分</text>
  <text x="568" y="330.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">再按「单据类型」四分</text>
  <text x="568" y="347.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">别先调账</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
