<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三阶分步分摊：辅助 → 基本 → 对象</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">分摊不是「按比例分一下」，而是一组必须守恒的等式</text>
  <rect x="16" y="78" width="200" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="116" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">一阶：辅助生产</text>
  <text x="116" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">供电 / 供水 / 机修</text>
  <text x="116" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先在内部分配</text>
  <rect x="280" y="78" width="200" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">二阶：基本生产</text>
  <text x="380" y="113" text-anchor="middle" font-size="7.5" fill="#4338CA">车间制造费用</text>
  <text x="380" y="130.25" text-anchor="middle" font-size="7.5" fill="#4338CA">按动因吸收</text>
  <rect x="544" y="78" width="200" height="90" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="644" y="96.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">三阶：成本对象</text>
  <text x="644" y="113" text-anchor="middle" font-size="7.5" fill="#0F766E">工单 / 产品 / 批次</text>
  <text x="644" y="130.25" text-anchor="middle" font-size="7.5" fill="#0F766E">期末结清</text>
  <line x1="216" y1="123" x2="280" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="248" y="118" text-anchor="middle" font-size="7.5" fill="#64748B">交互分配</text>
  <line x1="480" y1="123" x2="544" y2="123" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="512" y="118" text-anchor="middle" font-size="7.5" fill="#64748B">分步结转</text>
  <rect x="16" y="196" width="236" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="134" y="214.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">动因可选</text>
  <text x="134" y="231" text-anchor="middle" font-size="7.5" fill="#B45309">电量 / 吨位 / 工时 / 面积</text>
  <text x="134" y="248.25" text-anchor="middle" font-size="7.5" fill="#B45309">必须有计量来源</text>
  <rect x="262" y="196" width="236" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="214.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">顺序法 vs 代数法</text>
  <text x="380" y="231" text-anchor="middle" font-size="7.5" fill="#6D28D9">顺序法：一次单向，快</text>
  <text x="380" y="248.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">代数法：解方程，准</text>
  <rect x="508" y="196" width="236" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="626" y="214.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">回摊（正反算）</text>
  <text x="626" y="231" text-anchor="middle" font-size="7.5" fill="#334155">已分摊后发现错</text>
  <text x="626" y="248.25" text-anchor="middle" font-size="7.5" fill="#334155">要能反算回原中心</text>
  <rect x="16" y="296" width="728" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="314.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">分摊的两条不变式</text>
  <text x="380" y="331" text-anchor="middle" font-size="7.5" fill="#047857">① Σ 分出去的 = Σ 收到的（一分不留）；② 同一期间重复分摊必须整批覆盖</text>
  <rect x="16" y="372" width="728" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="390.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">最常见的安静错误：分摊基数为 0 时静默跳过</text>
  <text x="380" y="407" text-anchor="middle" font-size="7.5" fill="#B91C1C">跳过不报错 → 这个中心永远有一笔余额挂在账上，月结时才被发现</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
