<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">约当产量：把「一堆半成品」折成一个数</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">在制品不是「数量」，而是「按完工程度折算后的数量」</text>
  <rect x="16" y="78" width="224" height="108" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="128" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">期初在制</text>
  <text x="128" y="113" text-anchor="middle" font-size="7.5" fill="#334155">数量 20 / 完工程度 60%</text>
  <text x="128" y="130.25" text-anchor="middle" font-size="7.5" fill="#334155">约当 12</text>
  <rect x="268" y="78" width="224" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">本期投入</text>
  <text x="380" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">数量 100</text>
  <text x="380" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">材料一次投 / 工费渐投</text>
  <rect x="520" y="78" width="224" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="632" y="96.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">期末在制</text>
  <text x="632" y="113" text-anchor="middle" font-size="7.5" fill="#B45309">数量 40 / 完工程度 50%</text>
  <text x="632" y="130.25" text-anchor="middle" font-size="7.5" fill="#B45309">约当 20</text>
  <text x="380" y="214" text-anchor="middle" font-size="9" fill="#0F172A" font-weight="bold">约当产量（工费口径）= 完工 80 + 期末在制 20 = 100</text>
  <rect x="16" y="234" width="728" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="252.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">为什么要分口径</text>
  <text x="380" y="269" text-anchor="middle" font-size="7.5" fill="#6D28D9">材料一次投入时，期末在制的材料约当 = 全数 40；工费按进度只算 20</text>
  <rect x="16" y="312" width="352" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="192" y="330.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">分母错了会怎样</text>
  <text x="192" y="347" text-anchor="middle" font-size="7.5" fill="#B91C1C">单位成本偏低 → 完工成本偏低</text>
  <text x="192" y="364.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">差额全压进期末存货</text>
  <rect x="392" y="312" width="352" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="568" y="330.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">副产物 / 联产品</text>
  <text x="568" y="347" text-anchor="middle" font-size="7.5" fill="#0F766E">先扣副产物净收入</text>
  <text x="568" y="364.25" text-anchor="middle" font-size="7.5" fill="#0F766E">再按售价或重量分联产品</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
