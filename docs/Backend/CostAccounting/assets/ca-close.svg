<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">月末结账：八步依赖链与它的两个逃生口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">结账的难点不是算，而是「顺序错了要整条重来」</text>
  <rect x="16" y="76" width="172" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="102" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 截止</text>
  <text x="102" y="111" text-anchor="middle" font-size="7.5" fill="#334155">单据不许再进本期</text>
  <rect x="204" y="76" width="172" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="290" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 期末库存</text>
  <text x="290" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">盘点 / 冻结</text>
  <rect x="392" y="76" width="172" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="478" y="94.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">③ 存货计价</text>
  <text x="478" y="111" text-anchor="middle" font-size="7.5" fill="#4338CA">出库成本重算</text>
  <rect x="580" y="76" width="164" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="662" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">④ 分摊</text>
  <text x="662" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">辅助 → 基本</text>
  <rect x="580" y="176" width="164" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="662" y="194.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">⑤ 完工与在制</text>
  <text x="662" y="211" text-anchor="middle" font-size="7.5" fill="#0F766E">约当产量</text>
  <rect x="392" y="176" width="172" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="478" y="194.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑥ 销售成本结转</text>
  <text x="478" y="211" text-anchor="middle" font-size="7.5" fill="#C2410C">出库 → 损益</text>
  <rect x="204" y="176" width="172" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="290" y="194.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑦ 差异分摊</text>
  <text x="290" y="211" text-anchor="middle" font-size="7.5" fill="#B45309">标准成本才跑</text>
  <rect x="16" y="176" width="172" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="102" y="194.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">⑧ 勾稽与试算</text>
  <text x="102" y="211" text-anchor="middle" font-size="7.5" fill="#047857">三道等式</text>
  <line x1="188" y1="109" x2="204" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="109" x2="392" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="564" y1="109" x2="580" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="662" y1="142" x2="662" y2="176" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="209" x2="564" y2="209" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="392" y1="209" x2="376" y2="209" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="204" y1="209" x2="188" y2="209" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="16" y="276" width="728" height="62" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="294.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">依赖是一条链，不是一个集合</text>
  <text x="380" y="311" text-anchor="middle" font-size="7.5" fill="#4338CA">③ 必须在 ② 之后（没有期末数量算不了出库成本）；⑦ 必须在 ⑤ 之后（差异要按实际产量摊）</text>
  <rect x="16" y="354" width="352" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="192" y="372.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">可重跑（幂等）</text>
  <text x="192" y="389" text-anchor="middle" font-size="7.5" fill="#047857">每个任务按「期间 + 任务」唯一键</text>
  <text x="192" y="406.25" text-anchor="middle" font-size="7.5" fill="#047857">重跑覆盖，不追加</text>
  <rect x="392" y="354" width="352" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="568" y="372.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">反结账</text>
  <text x="568" y="389" text-anchor="middle" font-size="7.5" fill="#B91C1C">解冻 → 反向冲销 → 重跑到断点</text>
  <text x="568" y="406.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">不是「删数据」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
