<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="408" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">七段成本链：从一张发票到一张利润表</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">成本不是「算出来的一个数」，而是一条有先后、有依赖、有勾稽的链</text>
  <text x="380" y="84" text-anchor="middle" font-size="8" fill="#64748B">物流 / 工时 / 费用 三类投入，最后都要落到「这一个对象、这一期」上</text>
  <rect x="14" y="104" width="172" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="100" y="122.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 要素归集</text>
  <text x="100" y="139" text-anchor="middle" font-size="7.5" fill="#1D4ED8">材料 / 人工 / 制造费用</text>
  <text x="100" y="156.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按发票与工时进入</text>
  <rect x="204" y="104" width="172" height="76" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="290" y="122.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 对象归集</text>
  <text x="290" y="139" text-anchor="middle" font-size="7.5" fill="#4338CA">成本中心 / 工单 / 批次</text>
  <text x="290" y="156.25" text-anchor="middle" font-size="7.5" fill="#4338CA">直接归集，一对一</text>
  <rect x="394" y="104" width="172" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="480" y="122.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">③ 内部结转</text>
  <text x="480" y="139" text-anchor="middle" font-size="7.5" fill="#6D28D9">辅助生产 → 基本生产</text>
  <text x="480" y="156.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">交互分配 / 分步结转</text>
  <rect x="584" y="104" width="172" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="670" y="122.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 完工与在制</text>
  <text x="670" y="139" text-anchor="middle" font-size="7.5" fill="#0F766E">约当产量、副产物</text>
  <text x="670" y="156.25" text-anchor="middle" font-size="7.5" fill="#0F766E">把总额切成两半</text>
  <rect x="584" y="216" width="172" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="670" y="234.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 差异分析</text>
  <text x="670" y="251" text-anchor="middle" font-size="7.5" fill="#B45309">价差 / 量差 / 产量差</text>
  <text x="670" y="268.25" text-anchor="middle" font-size="7.5" fill="#B45309">标准成本才有</text>
  <rect x="394" y="216" width="172" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="480" y="234.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑥ 结转销售成本</text>
  <text x="480" y="251" text-anchor="middle" font-size="7.5" fill="#C2410C">出库成本 → 主营业务成本</text>
  <text x="480" y="268.25" text-anchor="middle" font-size="7.5" fill="#C2410C">随发货与确认</text>
  <rect x="204" y="216" width="172" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="290" y="234.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">⑦ 勾稽与月结</text>
  <text x="290" y="251" text-anchor="middle" font-size="7.5" fill="#047857">台账 ⇄ 明细 ⇄ 总账</text>
  <text x="290" y="268.25" text-anchor="middle" font-size="7.5" fill="#047857">三道等式同时成立</text>
  <line x1="186" y1="142" x2="204" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="142" x2="394" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="566" y1="142" x2="584" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="670" y1="180" x2="670" y2="216" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="584" y1="254" x2="566" y2="254" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="394" y1="254" x2="376" y2="254" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="14" y="320" width="354" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="191" y="338.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">安静失败的四段</text>
  <text x="191" y="355" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ ④ ⑤ ⑥ 错了都不报错，只让数字慢慢偏</text>
  <text x="191" y="372.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">月结的勾稽是唯一会当场报错的一道</text>
  <rect x="392" y="320" width="354" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="569" y="338.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">本册的主线</text>
  <text x="569" y="355" text-anchor="middle" font-size="7.5" fill="#334155">算得出来 → 分得下去 → 对得上账</text>
  <text x="569" y="372.25" text-anchor="middle" font-size="7.5" fill="#334155">判据不是「成本是多少」，而是「凭什么是这个数」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
