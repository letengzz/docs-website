<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">存货计价的四种方法：同一组数据，四个答案</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">方法决定的不只是数字，还决定「差异记在哪里、由谁解释」</text>
  <rect x="16" y="78" width="172" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="102" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">先进先出 FIFO</text>
  <text x="102" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按层（layer）消耗</text>
  <text x="102" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">出库成本取最早未耗层</text>
  <text x="102" y="147.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">期末存货 = 剩余层合计</text>
  <rect x="196" y="78" width="172" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="282" y="96.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">移动加权平均</text>
  <text x="282" y="113" text-anchor="middle" font-size="7.5" fill="#4338CA">每次入库重算单价</text>
  <text x="282" y="130.25" text-anchor="middle" font-size="7.5" fill="#4338CA">出库成本 = 当前单价 × 量</text>
  <text x="282" y="147.5" text-anchor="middle" font-size="7.5" fill="#4338CA">单价随入库漂移</text>
  <rect x="376" y="78" width="172" height="150" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="462" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">月末一次加权</text>
  <text x="462" y="113" text-anchor="middle" font-size="7.5" fill="#6D28D9">期间内单价固定</text>
  <text x="462" y="130.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">出库先按暂价挂账</text>
  <text x="462" y="147.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">月末补差一次</text>
  <rect x="556" y="78" width="188" height="150" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="650" y="96.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">标准成本</text>
  <text x="650" y="113" text-anchor="middle" font-size="7.5" fill="#B45309">出库按标准价</text>
  <text x="650" y="130.25" text-anchor="middle" font-size="7.5" fill="#B45309">实际与标准之差入差异</text>
  <text x="650" y="147.5" text-anchor="middle" font-size="7.5" fill="#B45309">月末分摊差异</text>
  <rect x="16" y="250" width="728" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="268.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">四种方法在同一组数据上必然给出不同的「本期出库成本」</text>
  <text x="380" y="285" text-anchor="middle" font-size="7.5" fill="#334155">差异不是错，是一笔必须被解释的金额：要么改价、要么进差异科目</text>
  <rect x="16" y="332" width="350" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="191" y="350.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">选型的三个判据</text>
  <text x="191" y="367" text-anchor="middle" font-size="7.5" fill="#0F766E">批次可追溯？→ FIFO / 批次</text>
  <text x="191" y="384.25" text-anchor="middle" font-size="7.5" fill="#0F766E">价格波动大且要平滑？→ 加权</text>
  <text x="191" y="401.5" text-anchor="middle" font-size="7.5" fill="#0F766E">要考核采购？→ 标准成本</text>
  <rect x="394" y="332" width="350" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="569" y="350.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">共同的坑</text>
  <text x="569" y="367" text-anchor="middle" font-size="7.5" fill="#B91C1C">负库存时任何方法都算不出成本</text>
  <text x="569" y="384.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">跨期入库必须回写上一期或进差异</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
