<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="偏好五维模型与四段退订传播">
  <rect x="0" y="0" width="900" height="460" fill="#f8fafc"/>
  <text x="32" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">偏好不是开关，是「类别 × 通道」矩阵 + 三个附加维度</text>
  <text x="32" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">压成一个布尔值的代价：用户只能全关，然后连验证码也收不到</text>

  <text x="32" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">类别 × 通道（前两维，必存）</text>

  <text x="128" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">站内信</text>
  <text x="182" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">推送</text>
  <text x="230" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">短信</text>
  <text x="278" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">邮件</text>
  <text x="326" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">IM</text>

  <text x="40" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">事务</text>
  <rect x="112" y="130" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="134" y="147" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">必达</text>
  <rect x="162" y="130" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="184" y="147" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">必达</text>
  <rect x="212" y="130" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="234" y="147" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">必达</text>
  <rect x="262" y="130" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="284" y="147" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">可退</text>
  <rect x="312" y="130" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="334" y="147" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>

  <text x="40" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">协同</text>
  <rect x="112" y="162" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="134" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">默认开</text>
  <rect x="162" y="162" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="184" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">可退</text>
  <rect x="212" y="162" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="234" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>
  <rect x="262" y="162" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="284" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>
  <rect x="312" y="162" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="334" y="179" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>

  <text x="40" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">系统</text>
  <rect x="112" y="194" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="134" y="211" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">默认开</text>
  <rect x="162" y="194" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="184" y="211" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">可退</text>
  <rect x="212" y="194" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="234" y="211" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>
  <rect x="262" y="194" width="44" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="284" y="211" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">默认开</text>
  <rect x="312" y="194" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="334" y="211" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>

  <text x="40" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">营销</text>
  <rect x="112" y="226" width="44" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="134" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#991b1b">默认关</text>
  <rect x="162" y="226" width="44" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="184" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#991b1b">默认关</text>
  <rect x="212" y="226" width="44" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="234" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#991b1b">默认关</text>
  <rect x="262" y="226" width="44" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="284" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#991b1b">默认关</text>
  <rect x="312" y="226" width="44" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="334" y="243" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">—</text>

  <text x="32" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">另外三维：作用域（全局/租户/项目/会话）· 时间（静默 + 退订生效时刻）· 豁免（法律必达）</text>
  <text x="32" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c">营销型默认只能是「关」：默认开 = 给每个新用户默认订阅商业信息</text>

  <text x="408" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">退订四段传播：少一段就漏</text>
  <defs><marker id="npr1" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>

  <rect x="408" y="104" width="464" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="422" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#1e40af">1 入口</text>
  <text x="480" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">一键退订 / 偏好页 / 回复 TD / 客服</text>
  <text x="422" y="137" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">需登录或二次确认 → 用户改去点「举报」</text>

  <line x1="640" y1="144" x2="640" y2="156" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#npr1)"/>

  <rect x="408" y="158" width="464" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="422" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#1e40af">2 状态</text>
  <text x="480" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">state=off + reason + 时间戳</text>
  <text x="422" y="191" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">只写布尔 → 默认值调整会洗掉用户意志</text>

  <line x1="640" y1="198" x2="640" y2="210" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#npr1)"/>

  <rect x="408" y="212" width="464" height="40" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="422" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#92400e">3 队列</text>
  <text x="480" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#78350f">撤销「已排队未发出」的消息</text>
  <text x="422" y="245" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">只影响新建 → 实测万级投放漏发 6 条差异</text>

  <line x1="640" y1="252" x2="640" y2="264" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#npr1)"/>

  <rect x="408" y="266" width="464" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="422" y="284" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#1e40af">4 下游</text>
  <text x="480" y="284" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">数仓 / 推荐 / 第三方 ESP 抑制名单</text>
  <text x="422" y="299" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">漏同步 → 换个系统继续发</text>

  <rect x="32" y="322" width="840" height="106" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#0f172a">静默时段的时区陷阱（本机实测，Python 3.13 / zoneinfo）</text>
  <text x="48" y="366" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">同一 tzinfo 的两个 datetime 相减「忽略偏移」，得到墙钟差 24 小时；换 UTC 换算后：纽约 2026-03-08 为 23 小时、2026-11-01 为 25 小时</text>
  <text x="48" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">后果：22:00–08:00 的静默窗口在切换日实际是 9 或 11 小时；「本地一天」的配额同样会漂移一小时</text>
  <text x="48" y="406" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">做法：先 .astimezone(utc) 再比较，或全程用整数时间戳；时区取自用户表字段，不从 IP 实时推断</text>
</svg>
