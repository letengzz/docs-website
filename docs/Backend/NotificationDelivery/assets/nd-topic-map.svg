<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="消息通知与触达工程 · 九页地图">
  <rect x="0" y="0" width="920" height="500" fill="#f8fafc"/>
  <text x="36" y="38" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">消息通知与触达工程 · 九页地图</text>
  <text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">三条主线：该不该发（决策）· 发得出去（投递）· 读得回来（收件箱与证据）</text>

  <text x="36" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">主线一：该不该发</text>
  <rect x="36" y="104" width="196" height="74" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="134" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">总览 NDO</text>
  <text x="134" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">七段链 · 五个必失点</text>
  <rect x="254" y="104" width="196" height="74" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="352" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">偏好 NDP</text>
  <text x="352" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">五维矩阵 · 退订传播</text>
  <rect x="472" y="104" width="196" height="74" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="570" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">频控 NDT</text>
  <text x="570" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">三种窗口 · 折叠与优先</text>
  <rect x="690" y="104" width="196" height="74" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="788" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">模板 NDM</text>
  <text x="788" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">变量契约 · 版本化</text>

  <text x="36" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">主线二：发得出去</text>
  <rect x="36" y="226" width="262" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="167" y="258" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">通道矩阵 NDC</text>
  <text x="167" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">能力边界 · 降级不双发</text>
  <rect x="322" y="226" width="262" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="453" y="258" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">投递与回执 NDD</text>
  <text x="453" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">outbox · 乱序不回退</text>
  <rect x="608" y="226" width="262" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="739" y="258" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">度量与止血 NDR</text>
  <text x="739" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">三个分母 · 五步止血</text>

  <text x="36" y="336" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">主线三：读得回来</text>
  <rect x="36" y="348" width="262" height="74" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="167" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#5b21b6">收件箱 NDI</text>
  <text x="167" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4c1d95">未读数 · 写扩散</text>
  <rect x="322" y="348" width="262" height="74" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="453" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9a3412">实战 NDX</text>
  <text x="453" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7c2d12">5 表 6 接口 · S1~S10</text>
  <rect x="608" y="348" width="262" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="739" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#991b1b">三条底线</text>
  <text x="739" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7f1d1d">频控边界 · 退订复核 · 送达</text>

  <text x="36" y="456" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">阅读顺序建议：NDO → NDC → NDP → NDT → NDM → NDD → NDI → NDR → NDX（按七段链顺序，实战放最后）</text>
  <text x="36" y="478" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">不建版本目录：换代的是通道方接口，判据跟问题走</text>
</svg>
