<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="三种窗口算法的边界行为与折叠效果">
  <rect x="0" y="0" width="900" height="460" fill="#f8fafc"/>
  <text x="32" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">频控的差别只在边界：固定窗口在跨格时放过 2 倍配额</text>
  <text x="32" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">本机实测：限 10 条/24h，第 86,390 秒发 10 条，第 86,410 秒（跨格 20 秒后）再发 10 条</text>

  <rect x="32" y="76" width="252" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="48" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#991b1b">固定窗口</text>
  <text x="48" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">20 / 20 通过</text>
  <text x="48" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">按自然日/对齐切格，边界两侧各算一格</text>
  <text x="48" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">用户感受：半夜连推 20 条</text>
  <text x="48" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">均匀 48 次/天：放行 10 条</text>

  <rect x="296" y="76" width="252" height="120" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="312" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#0f766e">滑动窗口</text>
  <text x="312" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f766e">10 / 20 通过</text>
  <text x="312" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">有序集合，剔除 24h 外记录后计数</text>
  <text x="312" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">精确，但每用户要存一个列表</text>
  <text x="312" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">均匀 48 次/天：放行 10 条</text>

  <rect x="560" y="76" width="308" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="576" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#1e40af">令牌桶</text>
  <text x="576" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1e40af">10 / 20 通过</text>
  <text x="576" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">容量 = 突发上限，速率 = 长期均值</text>
  <text x="576" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">均匀 48 次/天：放行 12 条（多放 2 条）</text>
  <text x="576" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">日上限要按 rate×24h 算，不是 capacity</text>

  <text x="32" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">优先级：双队列是性价比最高的一个改动（1 worker 500 条/s，营销 700 条/s）</text>

  <rect x="32" y="240" width="410" height="96" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="48" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#991b1b">FIFO 单队列</text>
  <text x="48" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">验证码平均等待 26.16 s，p99 51.82 s</text>
  <text x="48" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">营销平均等待 26.17 s，p99 51.82 s</text>
  <text x="48" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#7f1d1d">「验证码延迟 52 秒」不是故障，是排队结果</text>

  <rect x="458" y="240" width="410" height="96" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="474" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#0f766e">双队列（事务先出）</text>
  <text x="474" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">验证码平均等待 0.00 s，p99 0.00 s</text>
  <text x="474" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">营销平均等待 26.36 s，p99 52.19 s（+0.7%）</text>
  <text x="474" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">代价几乎为零，收益是「验证码不再被活动拖死」</text>

  <text x="32" y="368" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">折叠 digest：1,000 个事件 / 200 用户 / 3 类事件（1 小时内随机分布）</text>
  <text x="32" y="392" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">60 s 窗口 → 994 条（1.01×）｜ 300 s → 943 条（1.06×）｜ 1,800 s → 788 条（1.27×）</text>
  <text x="32" y="414" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309">短窗口几乎没有折叠效果；压缩比上限由「用户 × 类型」决定（本例理论下限 600）</text>
  <text x="32" y="436" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">折叠必须分级：首条立即发 → 后续进窗口合并 → 窗口到期若 ≥2 条补一条摘要</text>
</svg>
