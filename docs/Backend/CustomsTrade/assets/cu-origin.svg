<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><title>原产地判定</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">原产地不是「在哪儿生产的」，是「按哪条规则判出来的」</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">先看是否完全获得，再看 PSR；累积与微小含量只改判定输入，不改判定规则</text><rect x="330" y="86" width="240" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450.0" y="113.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">这批货有非原产材料吗？</text><path d="M330,108 L200,108 L200,146" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="90" y="148" width="220" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="200.0" y="166.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="600">否 → WO / PE</text><text x="200.0" y="185.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">完全获得 / 完全用原产材料</text><path d="M450,131 L450,168" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="330" y="170" width="240" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/><text x="450.0" y="188.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="600">是 → 查 PSR（六位税号）</text><text x="450.0" y="207.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">产品特定原产地规则</text><path d="M450,215 L450,236 L145,236" fill="none" stroke="#cbd5e1" stroke-width="1.4"/><path d="M450,236 L705,236" fill="none" stroke="#cbd5e1" stroke-width="1.4"/><path d="M145.0,236 L145.0,254" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="50" y="254" width="190" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.0" y="276" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">CTC 归类改变</text><text x="145.0" y="295" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">章 / 品目 / 子目</text><path d="M335.0,236 L335.0,254" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="260" y="254" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="335.0" y="276" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">RVC ≥ 40%</text><text x="335.0" y="295" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">（FOB−VNM）÷ FOB</text><path d="M490.0,236 L490.0,254" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="430" y="254" width="120" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="490.0" y="276" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">CR 化学反应</text><text x="490.0" y="295" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">仅 29 / 38 章</text><path d="M705.0,236 L705.0,254" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="570" y="254" width="270" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="705.0" y="276" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">都不过 → 看 DMI</text><text x="705.0" y="295" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">非原产材料 ≤ FOB 10%</text><rect x="50" y="344" width="790" height="34" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="445" y="366" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#b45309" font-weight="normal">累积（ACU）不是第四个标准：它只改变「哪些材料算原产」，判定仍回到 PSR 或 RVC</text><text x="40" y="408" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="normal">本机 3,000 票：不累积通过 63.27% → 累积后 90.80%（+27.53 点）；RVC 落在 35%~45% 临界带的占 21.03%</text><text x="40" y="432" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">「仅因累积才通过」的 826 票若按不通过处理，同一批货要多缴关税约 1,001.82 万元</text></svg>