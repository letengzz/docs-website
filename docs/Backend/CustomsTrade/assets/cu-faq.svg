<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><title>排障决策树</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">「税算错了」先问哪一句</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">五种最常见的原因，按排查成本从低到高排</text><rect x="340" y="84" width="220" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450.0" y="111.0" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">税额和预期不符</text><path d="M450,129 C450,160 110,150 110,186" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ah)"/><rect x="40" y="186" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.2"/><text x="115" y="208" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="600">差 1 分</text><text x="115" y="228" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">舍分顺序（逐票/汇总）</text><path d="M450,129 C450,160 278,150 278,186" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ah)"/><rect x="208" y="186" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#1d4ed8" stroke-width="1.2"/><text x="283" y="208" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="600">差 1%</text><text x="283" y="228" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">汇率适用日 or 运保费漏报</text><path d="M450,129 C450,160 446,150 446,186" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ah)"/><rect x="376" y="186" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="1.2"/><text x="451" y="208" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">差 5% 以上</text><text x="451" y="228" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">税则归类</text><path d="M450,129 C450,160 614,150 614,186" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ah)"/><rect x="544" y="186" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#b91c1c" stroke-width="1.2"/><text x="619" y="208" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">差 17%</text><text x="619" y="228" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">消费税当价外税算</text><path d="M450,129 C450,160 782,150 782,186" fill="none" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ah)"/><rect x="712" y="186" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#b91c1c" stroke-width="1.2"/><text x="787" y="208" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">差 10 倍</text><text x="787" y="228" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">计量单位（千件↔件）</text><rect x="40" y="300" width="820" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450" y="326" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">排查顺序：先看单位与精度（1 分钟），再看汇率与运保费（10 分钟），最后才动税号（要走归类复核）</text><text x="450" y="347" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">顺序反了，就会用「改税号」去修一个「单位错」的问题</text><rect x="40" y="384" width="820" height="54" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="450" y="408" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#b45309" font-weight="normal">所有差额都要能落到「哪一票、哪一项、哪个字段」；落不下去的差额不是差额，是噪声</text></svg>