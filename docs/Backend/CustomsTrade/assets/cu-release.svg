<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><title>四个清没清</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">「清关」是四件事，报表只记了其中一件</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">放行不等于结关：本机 95.53% 的票两者不同日，从放行到结关平均 12.54 天</text><path d="M70,150 L840,150" fill="none" stroke="#cbd5e1" stroke-width="2"/><circle cx="70" cy="150" r="9" fill="#0f766e"/><text x="70" y="118" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">申报接受</text><text x="70" y="182" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">回执 Receipt</text><circle cx="250" cy="150" r="9" fill="#0f766e"/><text x="250" y="118" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">税款结清</text><text x="250" y="182" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">税单 paid_at</text><circle cx="430" cy="150" r="9" fill="#0f766e"/><text x="430" y="118" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">放行</text><text x="430" y="182" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">允许提离</text><circle cx="590" cy="150" r="9" fill="#0f766e"/><text x="590" y="118" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">提离</text><text x="590" y="182" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">堆场出场</text><circle cx="800" cy="150" r="9" fill="#b45309"/><text x="800" y="118" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">结关</text><text x="800" y="182" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">舱单核销</text><path d="M439,136 L581,136" fill="none" stroke="#b45309" stroke-width="1.2"/><text x="510" y="128" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#b45309" font-weight="600">2.48 天</text><path d="M599,136 L791,136" fill="none" stroke="#b45309" stroke-width="1.2"/><text x="695" y="128" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#b45309" font-weight="600">10.06 天</text><rect x="40" y="232" width="400" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="240" y="258" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">放行 → 提离 平均 2.48 天</text><text x="240" y="282" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">堆场、码头、车队的时间不在海关系统里</text><rect x="460" y="232" width="400" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="660" y="258" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">提离 → 结关 平均 10.06 天</text><text x="660" y="282" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">舱单核销、退运、查验后续都在这一段</text><rect x="40" y="322" width="820" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="450" y="346" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">布控查验率 4.32%，查验时长 P50 9 h / P90 24 h / 最长 114 h</text><text x="450" y="366" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">放行只说明海关允许提离；单证是否已核销，要另看结关回执</text></svg>