idth="170" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="545.0" y="312" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">manual</text><text x="545.0" y="331" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">加工贸易手册</text><rect x="660" y="290" width="170" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="745.0" y="312" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">manual_close</text><text x="745.0" y="331" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">核销 + 短少</text><rect x="460" y="380" width="170" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="545.0" y="402" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">manual_item</text><text x="545.0" y="421" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">料件</text><path d="M345,134 L345,178" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M230,206 L258,206" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M430,206 L458,206" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M630,206 L658,206" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M145,290 L145,234" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M145,380 L145,344" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M63