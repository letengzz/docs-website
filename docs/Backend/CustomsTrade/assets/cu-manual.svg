<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><title>手册平衡式</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">手册核销只有一个等式，但四个项都靠申报</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">左边是海关账，右边是企业账；等式不平的那天，就是补税或处罚的那天</text><rect x="60" y="100" width="780" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450" y="130" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="600">进口料件量  =  出口成品量 × 单耗 ×（1 + 工艺损耗） + 结余 + 内销</text><text x="450" y="155" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">（单位耗料量由海关核定，企业「如实申报、据实核销」）</text><rect x="60" y="200" width="180" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/><text x="150" y="226" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="600">进口 10,000 件</text><text x="150" y="246" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">手册备案</text><rect x="260" y="200" width="180" height="58" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="350" y="226" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#0f766e" font-weight="600">出口 8,000 件</text><text x="350" y="246" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">实际复出口</text><rect x="460" y="200" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="550" y="226" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">单耗 1.18</text><text x="550" y="246" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">每件成品耗料</text><rect x="660" y="200" width="180" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="750" y="226" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">损耗 3%</text><text x="750" y="246" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">工艺损耗</text><rect x="60" y="284" width="380" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="250" y="308" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">理论耗用 = 8,000 × 1.18 × 1.03 = 9,723.2</text><text x="250" y="328" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">结余 = 10,000 − 9,723.2 = 276.8 件（短少）</text><rect x="460" y="284" width="380" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="650" y="308" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">短少 276 件 × 12.5 元 = 3,450.00 元补税</text><text x="650" y="328" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">另按日加收缓税利息（自料件进口之日）</text><text x="40" y="380" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">内销 5,000 件：按成品状态 469,048.80 元 vs 按料件折算 41,930.12 元 —— 差 10.2 倍，方向由「报验状态」决定</text></svg>