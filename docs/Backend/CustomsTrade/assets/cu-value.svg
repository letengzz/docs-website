<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><title>三个值多少钱</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">同一批货的三个价钱，谁也推不出谁</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">右下角那一步是唯一「除」而不是「乘」的地方</text><rect x="40" y="100" width="240" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/><text x="160" y="128" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="600">发票价 FOB</text><text x="160" y="150" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">USD 100,000</text><text x="160" y="172" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">卖方义务到此为止</text><path d="M281,145 L329,145" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="330" y="100" width="250" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="455" y="128" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="600">+ 运费 + 保险费</text><text x="455" y="150" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">起卸前，含附加费</text><text x="455" y="172" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#b45309" font-weight="normal">漏报即少缴税</text><path d="M581,145 L629,145" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="630" y="100" width="230" height="90" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="745" y="128" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="600">完税价格</text><text x="745" y="150" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">CIF × 计征汇率</text><text x="745" y="172" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">四舍五入到分</text><text x="40" y="240" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" text-anchor="start" fill="#1f2937" font-weight="700">再往下：税基不是完税价格</text><rect x="40" y="256" width="260" height="70" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/><text x="170" y="282" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#b45309" font-weight="600">关税 = 完税价格 × 税率</text><text x="170" y="303" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">价外税，直接乘</text><rect x="320" y="256" width="320" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="480" y="282" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">消费税 =（完税价＋关税）÷（1−r）× r</text><text x="480" y="303" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">价内税，必须先还原含税价</text><rect x="660" y="256" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="760" y="282" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">增值税</text><text x="760" y="303" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">（完税价＋关税＋消费税）× 13%</text><rect x="40" y="348" width="820" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450" y="370" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">三个数只有第一个能直接从合同抄下来；后两个都必须由系统算、并且能被税单反算回去</text><text x="450" y="390" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">「完税价格对不对」永远不能靠看合同回答，只能靠重算四个加项和一次汇率</text></svg>