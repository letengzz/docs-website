<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><title>完税价格构成</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">完税价格是「三个加项 + 一次乘法」，不是「发票价」</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">本机样本：FOB 19.47 亿 → 完税价格 20.67 亿（+6.12%），加项只占 5.77% 却决定全部税基</text><rect x="40" y="120" width="772.6777999999999" height="54" rx="0" fill="#1d4ed822" stroke="#1d4ed8" stroke-width="1"/><text x="426.33889999999997" y="153" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700">94.23%</text><rect x="812.6777999999999" y="120" width="44.7392" height="54" rx="0" fill="#b4530922" stroke="#b45309" stroke-width="1"/><text x="835.0473999999999" y="153" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700">5.46%</text><rect x="857.4169999999999" y="120" width="2.583" height="54" rx="0" fill="#b91c1c22" stroke="#b91c1c" stroke-width="1"/><rect x="40" y="120" width="820" height="54" rx="0" fill="none" stroke="#cbd5e1" stroke-width="1.4"/><rect x="40" y="180" width="820" height="40" rx="4" fill="#f1f5f9" stroke="none" stroke-width="0"/><rect x="52" y="192" width="12" height="12" rx="2" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/><text x="74" y="204" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">FOB 货价（成交价格）</text><text x="430" y="204" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">合同上的数，海关不一定认</text><text x="700" y="204" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="end" fill="#1f2937" font-weight="normal">19.47 亿</text><text x="790" y="204" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="end" fill="#1d4ed8" font-weight="normal">94.23%</text><rect x="52" y="236" width="12" height="12" rx="2" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="74" y="248" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">运费 + 保险费</text><text x="430" y="248" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">运抵境内输入地点起卸前，含海运附加费</text><text x="700" y="248" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="end" fill="#1f2937" font-weight="normal">1.13 亿</text><text x="790" y="248" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="end" fill="#b45309" font-weight="normal">5.46%</text><rect x="40" y="268" width="820" height="40" rx="4" fill="#f1f5f9" stroke="none" stroke-width="0"/><rect x="52" y="280" width="12" height="12" rx="2" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="74" y="292" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="normal">特许权使用费</text><text x="430" y="292" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">与货物有关且构成销售条件才计入</text><text x="700" y="292" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="end" fill="#1f2937" font-weight="normal">650 万</text><text x="790" y="292" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="end" fill="#b91c1c" font-weight="normal">0.32%</text><rect x="52" y="324" width="12" height="12" rx="2" fill="#0f766e" stroke="#0f766e" stroke-width="0"/><text x="74" y="336" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="600">合计 = 完税价格</text><text x="430" y="336" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">再乘「上月第三个星期三」的计征汇率</text><text x="700" y="336" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="end" fill="#1f2937" font-weight="600">20.67 亿</text><text x="790" y="336" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="end" fill="#0f766e" font-weight="normal">100%</text><text x="40" y="388" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="normal">漏报运保费的代价：本机少计完税价格 1.13 亿元，按综合税负 31.88% 折算少缴税约 3,595.38 万元</text></svg>