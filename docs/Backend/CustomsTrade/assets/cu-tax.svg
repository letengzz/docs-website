<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><title>三税计算链</title><text x="40" y="40" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#1f2937" font-weight="700">三税是一条链：前一个的输出是后一个的输入</text><text x="40" y="64" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="start" fill="#6b7280" font-weight="normal">所以「消费税算错」会同时让增值税算错，错两次</text><rect x="40" y="96" width="190" height="64" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/><text x="135" y="122" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="600">完税价格</text><text x="135" y="143" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">749,842.80</text><path d="M231,128 L279,128" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="280" y="96" width="190" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="375" y="122" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">× 关税率 25%</text><text x="375" y="143" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#b45309" font-weight="normal">关税 187,460.70</text><path d="M471,128 L519,128" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><rect x="520" y="96" width="220" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/><text x="630" y="122" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="middle" fill="#b91c1c" font-weight="600">（完税价＋关税）÷ (1−r)</text><text x="630" y="143" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="normal">消费税 527,233.22</text><rect x="40" y="250" width="820" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="450" y="274" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="13.5" text-anchor="middle" fill="#1f2937" font-weight="600">增值税 =（完税价格 + 关税 + 消费税）× 13% = 190,389.77</text><text x="450" y="297" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="normal">若消费税按「直接乘」算成 337,429.26，增值税会跟着少 24,674.51</text><text x="40" y="348" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">手算示例：完税价 100,000 / 关税率 25% / 消费税率 36%</text><text x="40" y="372" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">消费税 70,312.50（错算 45,000.00，少 25,312.50）→ 增值税 25,390.63（错算 22,100.00）</text></svg>