<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278">
  <rect width="760" height="278" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">驻留键：不是标签，是写入路径上的硬约束</text>
  <path d="M224,106 L280,106" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M480,106 L536,106" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="200" height="88" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">请求</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">带 region 与 subject</text>
  <rect x="280" y="62" width="200" height="88" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="294" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">解析</text>
  <text x="294" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">region → residency_zone</text>
  <rect x="536" y="62" width="200" height="88" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="550" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">落库</text>
  <text x="550" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">按驻留区分区写入</text>
  <rect x="140" y="178" width="480" height="52" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="154" y="202" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">缺驻留键：只能全表扫；实测 50,000 行 × 100 次，扫描 153.482 ms vs 分区 0.070 ms</text>
  <rect x="20" y="230" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="252" font-family="sans-serif" font-size="13" fill="#1E293B">驻留键不允许为空，也不允许由展示语言推导——语言与法域是两件事</text>
</svg>
