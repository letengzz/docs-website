<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292">
  <rect width="760" height="292" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">时间字段契约：一行记录至少要能回答四个问题</text>
  <path d="M192,138 L192,152" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M558,138 L558,152" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="344" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">occurred_at_utc</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">TIMESTAMPTZ，唯一可比较的时刻</text>
  <rect x="380" y="62" width="356" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="394" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">zone_id</text>
  <text x="394" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">IANA 名称，不是 +08:00</text>
  <rect x="24" y="152" width="344" height="76" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="176" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">local_wall + fold</text>
  <text x="38" y="196" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">展示用，禁止做主键</text>
  <rect x="380" y="152" width="356" height="76" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="394" y="176" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">tzdb_version / biz_date</text>
  <text x="394" y="196" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">解释与归属用，必须落库</text>
  <rect x="20" y="244" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="266" font-family="sans-serif" font-size="13" fill="#1E293B">缺 zone_id：无法还原当地时间；缺 tzdb_version：规则改了之后历史无法解释</text>
</svg>
