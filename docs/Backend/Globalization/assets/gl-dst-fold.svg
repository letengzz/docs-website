<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">夏令时两个切换日：折叠 ≠ 间隙，两者的失败方向相反</text>
  <path d="M364,118 L396,118" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="340" height="112" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">折叠 Fall back · 25 小时</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">本地 01:30 出现两次</text>
  <text x="38" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">fold=0 → 05:30Z</text>
  <text x="38" y="146" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">fold=1 → 06:30Z</text>
  <rect x="396" y="62" width="340" height="112" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="410" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">间隙 Spring forward · 23 小时</text>
  <text x="410" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">本地 02:30 根本不存在</text>
  <text x="410" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">fold 外推给两个 UTC</text>
  <text x="410" y="146" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">回转检验才抓得住</text>
  <rect x="24" y="192" width="712" height="52" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="216" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">实测：折叠日 1500 个真实分钟中 60 个重复（4.00%）；用本地时间做唯一键会吞掉第二个 01:30</text>
  <rect x="20" y="252" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="274" font-family="sans-serif" font-size="13" fill="#1E293B">固定偏移存一年：New York 有 65.19% 的小时会错 1 小时，Lord Howe 错 30 分钟</text>
</svg>
