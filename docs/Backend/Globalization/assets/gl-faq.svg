<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292">
  <rect width="760" height="292" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">排障分诊：先问「错在哪个时间层」</text>
  <rect x="24" y="62" width="220" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">差整小时？</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查 ZoneId 与偏移</text>
  <rect x="270" y="62" width="220" height="76" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="284" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">少/多一行？</text>
  <text x="284" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查折叠与本地唯一键</text>
  <rect x="516" y="62" width="220" height="76" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="530" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">报表对不上？</text>
  <text x="530" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查日切与归属日</text>
  <rect x="24" y="166" width="220" height="76" rx="9" fill="#EDE9FE" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">显示怪异？</text>
  <text x="38" y="210" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查 locale 协商链</text>
  <rect x="270" y="166" width="220" height="76" rx="9" fill="#EDE9FE" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="284" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">灰度不一致？</text>
  <text x="284" y="210" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查开通时刻口径</text>
  <rect x="516" y="166" width="220" height="76" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="530" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">只剩历史？</text>
  <text x="530" y="210" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">查 tzdb 版本留痕</text>
  <rect x="20" y="244" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="266" font-family="sans-serif" font-size="13" fill="#1E293B">六类症状对应六个层；先定位层，再改字段，不要直接改展示字符串</text>
</svg>
