<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286">
  <rect width="760" height="286" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">当前日期时间 API（主线）：Instant / ZoneId / Temporal / ICU</text>
  <path d="M250,108 L267,108" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M493,108 L510,108" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="226" height="92" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">java.time</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">Instant / ZonedDateTime</text>
  <text x="38" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">ZoneId + fold 语义</text>
  <rect x="267" y="62" width="226" height="92" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="281" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">JS Temporal</text>
  <text x="281" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">ZonedDateTime</text>
  <text x="281" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">disambiguation 显式</text>
  <rect x="510" y="62" width="226" height="92" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="524" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">ICU4J / CLDR</text>
  <text x="524" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">格式化与日历</text>
  <text x="524" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">地区数据可版本化</text>
  <rect x="140" y="180" width="480" height="52" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="154" y="204" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">三条线共用同一条原则：时刻用 UTC，解释靠 ZoneId，展示靠 locale</text>
  <rect x="20" y="238" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="260" font-family="sans-serif" font-size="13" fill="#1E293B">新代码一律走本目录；旧目录的内容不改写，只补迁移映射</text>
