<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282">
  <rect width="760" height="282" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">营业日切点：同一个 UTC 日被切成不同的业务日</text>
  <path d="M244,106 L270,106" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M490,106 L516,106" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="220" height="88" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">UTC 日</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">00:00Z ~ 24:00Z</text>
  <text x="38" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">唯一、可比较</text>
  <rect x="270" y="62" width="220" height="88" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="284" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">本地日</text>
  <text x="284" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">按 ZoneId 平移</text>
  <text x="284" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">22.60% 归属不同</text>
  <rect x="516" y="62" width="220" height="88" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="530" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">营业日</text>
  <text x="530" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">再减 4 小时切点</text>
  <text x="530" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">22.87% 归属不同</text>
  <rect x="140" y="178" width="480" height="54" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="154" y="202" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">逐日平均差额 9.6 行（占日均 3.50%），单日最大 41 行（14.97%）</text>
  <rect x="20" y="234" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="256" font-family="sans-serif" font-size="13" fill="#1E293B">日切点要随地区与 tzdb 一起版本化：改切点等于改历史报表口径</text>
</svg>
