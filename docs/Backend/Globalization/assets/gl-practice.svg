<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292">
  <rect width="760" height="292" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">实战：五张表、十条断言与一个反向探针</text>
  <path d="M194,100 L216,100" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M386,100 L408,100" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M578,100 L600,100" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="62" width="170" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">1 建表</text>
  <text x="38" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">event / day / rollout</text>
  <rect x="216" y="62" width="170" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="230" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">2 写折叠日</text>
  <text x="230" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">两条 01:30</text>
  <rect x="408" y="62" width="170" height="76" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="422" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">3 反向探针</text>
  <text x="422" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">偏移写法须被抓</text>
  <rect x="600" y="62" width="136" height="76" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="614" y="86" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">4 断言</text>
  <text x="614" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">10/10 PASS</text>
  <rect x="140" y="172" width="480" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="154" y="196" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">折叠日两时刻 / 本地键重复 / UTC 唯一 / ZoneId 形态 / 日切主键 / 灰度 UTC / 驻留键 / tzdb 版本</text>
  <rect x="20" y="244" width="720" height="34" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="34" y="266" font-family="sans-serif" font-size="13" fill="#1E293B">反向探针是判据的一部分：把 zone_id 改成偏移后断言必须仍成立，否则门禁是假的</text>
