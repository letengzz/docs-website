<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw-rc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">三套账与四种差异形状</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">相等不是目标，说清差异的形状才是</text>
<rect x="24" y="70" width="220" height="74" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="90" font-size="10.5" font-weight="700" fill="#1e3a8a">账簿</text>
<text x="34" y="108" font-size="9.2" fill="#334155">收入确认日（权责发生）</text>
<text x="34" y="124" font-size="9.2" fill="#334155">1,405,461.45 元</text>
<text x="34" y="138" font-size="9.2" fill="#881337">缺：票号，无法逐票追</text>
<rect x="270" y="70" width="220" height="74" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="280" y="90" font-size="10.5" font-weight="700" fill="#78350f">发票</text>
<text x="280" y="108" font-size="9.2" fill="#334155">开票日</text>
<text x="280" y="124" font-size="9.2" fill="#334155">蓝 1,415,872.00 − 红 10,410.55</text>
<text x="280" y="138" font-size="9.2" fill="#881337">缺：收入确认，预收会虚增</text>
<rect x="516" y="70" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="526" y="90" font-size="10.5" font-weight="700" fill="#115e59">申报</text>
<text x="526" y="108" font-size="9.2" fill="#334155">所属期（义务时点）</text>
<text x="526" y="124" font-size="9.2" fill="#334155">销项 128,778.69 元</text>
<text x="526" y="138" font-size="9.2" fill="#881337">缺：明细，只有合计</text>
<text x="24" y="176" font-size="11" font-weight="700" fill="#0f172a">四种形状（本机 3,000 笔）</text>
<rect x="24" y="188" width="170" height="80" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="34" y="208" font-size="10.5" font-weight="700" fill="#115e59">一致</text>
<text x="34" y="226" font-size="12" fill="#115e59">2,117</text>
<text x="34" y="244" font-size="9.2" fill="#334155">账 = 票，同月</text>
<text x="34" y="260" font-size="9.2" fill="#334155">无需处置</text>
<rect x="206" y="188" width="170" height="80" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="216" y="208" font-size="10.5" font-weight="700" fill="#1e3a8a">时点不同</text>
<text x="216" y="226" font-size="12" fill="#1e3a8a">343</text>
<text x="216" y="244" font-size="9.2" fill="#334155">本月账、次月票</text>
<text x="216" y="260" font-size="9.2" fill="#334155">登记，次月验证抵消</text>
<rect x="388" y="188" width="170" height="80" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="398" y="208" font-size="10.5" font-weight="700" fill="#78350f">仅账无票</text>
<text x="398" y="226" font-size="12" fill="#78350f">190</text>
<text x="398" y="244" font-size="9.2" fill="#334155">免税 / 未开票收入</text>
<text x="398" y="260" font-size="9.2" fill="#334155">补开或说明</text>
<rect x="570" y="188" width="166" height="80" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="580" y="208" font-size="10.5" font-weight="700" fill="#881337">仅票无账 / 金额不等</text>
<text x="580" y="226" font-size="12" fill="#881337">175 / 175</text>
<text x="580" y="244" font-size="9.2" fill="#334155">预收 / 票开错</text>
<text x="580" y="260" font-size="9.2" fill="#334155">逐票核，最严重</text>
<rect x="24" y="284" width="350" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="304" font-size="10.5" font-weight="700" fill="#0f172a">汇总差额</text>
<text x="34" y="322" font-size="9.4" fill="#334155">账 2,921,695.49 − 票 2,897,883.90</text>
<text x="34" y="340" font-size="9.4" fill="#334155">= 23,811.59 元</text>
<text x="34" y="360" font-size="9.4" fill="#881337">差额本身没有意义，构成才有</text>
<rect x="392" y="284" width="344" height="90" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="402" y="304" font-size="10.5" font-weight="700" fill="#4c1d95">闭环五步</text>
<text x="402" y="322" font-size="9.4" fill="#334155">票税勾稽 → 账票比对 → 差异登记</text>
<text x="402" y="340" font-size="9.4" fill="#334155">→ 跨期确认 → 出具说明</text>
<text x="402" y="360" font-size="9.4" fill="#334155">分类金额必须能加总回原差额</text>
<rect x="24" y="388" width="712" height="36" rx="6" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="410" font-size="9.6" fill="#881337">红票带符号是前提：裸 SUM 会让差额凭空多出 20,821.10 元，看起来像「票多开了」</text>
</svg>
