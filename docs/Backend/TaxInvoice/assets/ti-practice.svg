<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">十张表与三层约束</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">每条判据都要有一条能被机器判定的语句</text>
<rect x="24" y="70" width="712" height="96" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="90" font-size="10.5" font-weight="700" fill="#1e3a8a">第一层：列级约束（写错就插不进去）</text>
<text x="34" y="110" font-size="9.2" fill="#334155">tax_rate UNIQUE(item,rate,effective_from)　quota CHECK(used ≤ limit)</text>
<text x="34" y="128" font-size="9.2" fill="#334155">invoice UNIQUE(no) + CHECK(gross = net + tax)　invoice_line UNIQUE(invoice_id,line_no)</text>
<text x="34" y="146" font-size="9.2" fill="#334155">deduction CHECK(转出 ≤ 税额) + CHECK(转出必有原因)　tax_return 两条守恒 CHECK</text>
<text x="34" y="162" font-size="9.2" fill="#881337">recon_diff shape / status 必须是枚举——自由文本一年后无法统计</text>
<rect x="24" y="180" width="712" height="86" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="34" y="200" font-size="10.5" font-weight="700" fill="#78350f">第二层：四个触发器（跨行规则）</text>
<text x="34" y="220" font-size="9.2" fill="#334155">trg_rate_valid：税率必须在有效期内 → RATE_NOT_EFFECTIVE</text>
<text x="34" y="238" font-size="9.2" fill="#334155">trg_red_guard：本次 + 历史 ≤ 原票 → RED_OVER　trg_line_cap：行合计 ≤ 票面 → LINE_OVER</text>
<text x="34" y="256" font-size="9.2" fill="#334155">trg_quota：检查与占用在同一条语句里 → QUOTA_EXCEEDED</text>
<rect x="24" y="280" width="712" height="76" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="34" y="300" font-size="10.5" font-weight="700" fill="#115e59">第三层：断言与负向探针（脚本层）</text>
<text x="34" y="318" font-size="9.2" fill="#334155">S1~S10 十条 COUNT(*) 断言，全部返回 0 才算通过</text>
<text x="34" y="336" font-size="9.2" fill="#334155">N1~N6 六个「必须失败」用例：RED_OVER / UNIQUE / RATE_NOT_EFFECTIVE / CHECK×2 / QUOTA_EXCEEDED</text>
<rect x="24" y="370" width="170" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="390" font-size="9.4" fill="#334155">发票 388 张</text>
<text x="34" y="408" font-size="9.4" fill="#334155">明细行 797 行</text>
<rect x="206" y="370" width="170" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="216" y="390" font-size="9.4" fill="#334155">销项蓝 336 张</text>
<text x="216" y="408" font-size="9.4" fill="#334155">红 12 / 进项 40</text>
<rect x="388" y="370" width="170" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="398" y="390" font-size="9.4" fill="#334155">应纳 123,308.83 元</text>
<text x="398" y="408" font-size="9.4" fill="#334155">附加税 14,797.06 元</text>
<rect x="570" y="370" width="166" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="580" y="390" font-size="9.4" fill="#334155">账票差 0.00 元</text>
<text x="580" y="408" font-size="9.4" fill="#334155">差异台账 11 笔</text>
</svg>
