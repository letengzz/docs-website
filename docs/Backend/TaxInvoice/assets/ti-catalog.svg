<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">三层判定：税目 → 计税方法 → 税率</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">税率是判定的结果，不是商品的属性</text>
<rect x="24" y="70" width="210" height="96" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="90" font-size="11" font-weight="700" fill="#1e3a8a">第一层 税目</text>
<text x="34" y="108" font-size="9.4" fill="#334155">货物 / 服务 / 无形资产 / 不动产</text>
<text x="34" y="124" font-size="9.4" fill="#334155">由商品主数据决定</text>
<text x="34" y="142" font-size="9.4" fill="#881337">错：出口货物按 13% 开</text>
<text x="34" y="158" font-size="9.4" fill="#881337">→ 用错整张税率表</text>
<rect x="258" y="70" width="210" height="96" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="268" y="90" font-size="11" font-weight="700" fill="#78350f">第二层 计税方法</text>
<text x="268" y="108" font-size="9.4" fill="#334155">一般 / 简易 / 差额 / 免税</text>
<text x="268" y="124" font-size="9.4" fill="#334155">由纳税人资格与业务类型定</text>
<text x="268" y="142" font-size="9.4" fill="#881337">错：把兼营当混合销售</text>
<text x="268" y="158" font-size="9.4" fill="#881337">→ 多缴 25.5% 的税</text>
<rect x="492" y="70" width="244" height="96" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="502" y="90" font-size="11" font-weight="700" fill="#115e59">第三层 税率（带生效期）</text>
<text x="502" y="108" font-size="9.4" fill="#334155">13% / 9% / 6% / 0% / 征收率 3%</text>
<text x="502" y="124" font-size="9.4" fill="#334155">按 issue_date 取当时有效行</text>
<text x="502" y="142" font-size="9.4" fill="#881337">错：用新税率补开旧票</text>
<text x="502" y="158" font-size="9.4" fill="#881337">→ RATE_NOT_EFFECTIVE</text>
<text x="24" y="196" font-size="11" font-weight="700" fill="#0f172a">四种算法，四个结果（本机算例）</text>
<rect x="24" y="208" width="170" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="228" font-size="10.5" font-weight="700" fill="#0f172a">一般计税 13%</text>
<text x="34" y="246" font-size="9.4" fill="#334155">11,300 元含税</text>
<text x="34" y="262" font-size="9.4" fill="#334155">税额 1,300.00 元</text>
<text x="34" y="278" font-size="9.4" fill="#334155">进项可抵</text>
<rect x="206" y="208" width="170" height="82" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="216" y="228" font-size="10.5" font-weight="700" fill="#115e59">兼营分拆</text>
<text x="216" y="246" font-size="9.4" fill="#334155">6,780 元 13%</text>
<text x="216" y="262" font-size="9.4" fill="#334155">4,520 元 6%</text>
<text x="216" y="278" font-size="9.4" fill="#334155">税额 1,035.85 元</text>
<rect x="388" y="208" width="170" height="82" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="398" y="228" font-size="10.5" font-weight="700" fill="#78350f">差额征税</text>
<text x="398" y="246" font-size="9.4" fill="#334155">10,600 − 8,480</text>
<text x="398" y="262" font-size="9.4" fill="#334155">基数 2,120 元</text>
<text x="398" y="278" font-size="9.4" fill="#334155">税额 120.00 元</text>
<rect x="570" y="208" width="166" height="82" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="580" y="228" font-size="10.5" font-weight="700" fill="#881337">简易 3%</text>
<text x="580" y="246" font-size="9.4" fill="#334155">11,300 ÷ 1.03</text>
<text x="580" y="262" font-size="9.4" fill="#334155">税额 329.13 元</text>
<text x="580" y="278" font-size="9.4" fill="#334155">进项不可抵</text>
<rect x="24" y="310" width="712" height="98" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="34" y="330" font-size="11" font-weight="700" fill="#4c1d95">三条落地纪律</text>
<text x="34" y="350" font-size="9.6" fill="#334155">① 台账按 (item, rate, effective_from) 唯一，只「关旧行 + 插新行」，不 UPDATE 税率</text>
<text x="34" y="368" font-size="9.6" fill="#334155">② 0% 与免税是两个枚举值：一个可退进项，一个要转出</text>
<text x="34" y="386" font-size="9.6" fill="#334155">③ 优惠写进 tax_preference 表并带有效期，不写成 if (type === 'SOFTWARE')</text>
</svg>
