<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw-sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">三个切分点：行、税率组、整单</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">公式没有争议，取整的位置有</text>
<rect x="24" y="70" width="712" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="92" font-size="10.5" font-weight="700" fill="#0f172a">含税 1,130.00 元，13%</text>
<text x="34" y="112" font-size="9.6" fill="#334155">不含税 = round(113000 × 100 ÷ 113) = 100000（1,000.00 元）；税额 = 13000（130.00 元）</text>
<rect x="24" y="146" width="228" height="92" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="166" font-size="11" font-weight="700" fill="#1e3a8a">行级</text>
<text x="34" y="184" font-size="9.4" fill="#334155">每行先算，再相加</text>
<text x="34" y="200" font-size="9.4" fill="#334155">适合：多税率、有明细</text>
<text x="34" y="218" font-size="9.4" fill="#881337">余数分散在每一行</text>
<text x="34" y="232" font-size="9.4" fill="#881337">行数越多差得越多</text>
<rect x="266" y="146" width="228" height="92" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="276" y="166" font-size="11" font-weight="700" fill="#78350f">税率组</text>
<text x="276" y="184" font-size="9.4" fill="#334155">同税率先合并再分离</text>
<text x="276" y="200" font-size="9.4" fill="#334155">适合：申报要按税率分行</text>
<text x="276" y="218" font-size="9.4" fill="#881337">组内与组间不能混用</text>
<text x="276" y="232" font-size="9.4" fill="#881337">否则双重取整</text>
<rect x="508" y="146" width="228" height="92" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="518" y="166" font-size="11" font-weight="700" fill="#115e59">整单</text>
<text x="518" y="184" font-size="9.4" fill="#334155">整张票一次分离</text>
<text x="518" y="200" font-size="9.4" fill="#334155">适合：单税率、无明细</text>
<text x="518" y="218" font-size="9.4" fill="#881337">行金额凑不出合计</text>
<text x="518" y="232" font-size="9.4" fill="#881337">不支持多税率</text>
<text x="24" y="268" font-size="10" fill="#475569">唯一不能做的是「同一张票上两处用不同切分点」：1,000 单实测 284 单（28.4%）不同，累计 3.07 元</text>
<rect x="24" y="284" width="350" height="132" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="304" font-size="11" font-weight="700" fill="#881337">折扣分摊：逐行四舍五入</text>
<text x="34" y="322" font-size="9.4" fill="#334155">7 行共 3,600 元，折扣 100 元</text>
<text x="34" y="338" font-size="9.4" fill="#334155">33.33 + 22.22 + 16.67 + 11.11</text>
<text x="34" y="354" font-size="9.4" fill="#334155">+ 8.33 + 5.56 + 2.78 = 100.00</text>
<text x="34" y="374" font-size="9.4" fill="#881337">换一组数据：41.2% 的单据</text>
<text x="34" y="390" font-size="9.4" fill="#881337">合计 ≠ 折扣，最大差 2 分</text>
<text x="34" y="406" font-size="9.4" fill="#334155">→ 凭证不平，补调整分录</text>
<rect x="392" y="284" width="344" height="132" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="402" y="304" font-size="11" font-weight="700" fill="#115e59">最大余数法：余数归集</text>
<text x="402" y="322" font-size="9.4" fill="#334155">① 每行 floor(行金额 × 折扣 ÷ 合计)</text>
<text x="402" y="338" font-size="9.4" fill="#334155">② 余数 = 折扣 − Σfloor</text>
<text x="402" y="354" font-size="9.4" fill="#334155">③ 按小数部分从大到小逐分发放</text>
<text x="402" y="374" font-size="9.4" fill="#115e59">校验：SUM(分摊) = 折扣额</text>
<text x="402" y="390" font-size="9.4" fill="#334155">同余数按行号稳定排序</text>
<text x="402" y="406" font-size="9.4" fill="#334155">可复算、可审计、不留调整分录</text>
</svg>
