<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">红冲：三种情形与两道闸门</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">这是全册唯一能把已确认收入改小的动作</text>
<rect x="24" y="70" width="170" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="90" font-size="11" font-weight="700" fill="#0f172a">作废</text>
<text x="34" y="108" font-size="9.4" fill="#334155">仅纸质票、当月</text>
<text x="34" y="124" font-size="9.4" fill="#334155">号码不回收</text>
<text x="34" y="140" font-size="9.4" fill="#881337">数电票没有这个动作</text>
<rect x="206" y="70" width="170" height="80" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="216" y="90" font-size="11" font-weight="700" fill="#1e3a8a">红冲（全额）</text>
<text x="216" y="108" font-size="9.4" fill="#334155">退回 / 开错 / 中止</text>
<text x="216" y="124" font-size="9.4" fill="#334155">一张等额负数票</text>
<text x="216" y="140" font-size="9.4" fill="#334155">占额度</text>
<rect x="388" y="70" width="170" height="80" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="398" y="90" font-size="11" font-weight="700" fill="#78350f">红冲（部分）</text>
<text x="398" y="108" font-size="9.4" fill="#334155">部分退回 / 折让</text>
<text x="398" y="124" font-size="9.4" fill="#334155">可多次</text>
<text x="398" y="140" font-size="9.4" fill="#881337">累计 ≤ 原票</text>
<rect x="570" y="70" width="166" height="80" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="580" y="90" font-size="11" font-weight="700" fill="#4c1d95">换开</text>
<text x="580" y="108" font-size="9.4" fill="#334155">抬头 / 税号错</text>
<text x="580" y="124" font-size="9.4" fill="#334155">先红冲再重开</text>
<text x="580" y="140" font-size="9.4" fill="#334155">新 revision</text>
<text x="24" y="178" font-size="11" font-weight="700" fill="#0f172a">闸门一：谁发起，取决于受票方有没有确认</text>
<rect x="24" y="190" width="712" height="60" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="34" y="210" font-size="9.6" fill="#334155">未做用途确认 / 未入账：开票方直接红冲，无需对方确认</text>
<text x="34" y="230" font-size="9.6" fill="#334155">已确认：走《红字发票信息确认单》，对方确认后开票；发起后 72 小时未确认自动作废</text>
<text x="24" y="278" font-size="11" font-weight="700" fill="#0f172a">闸门二：累计上限（本机三次 40% 实测）</text>
<rect x="24" y="290" width="240" height="88" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="310" font-size="10.5" font-weight="700" fill="#881337">无守卫</text>
<text x="34" y="328" font-size="9.4" fill="#334155">第一次 40 分 → 40%</text>
<text x="34" y="344" font-size="9.4" fill="#334155">第二次 40 分 → 80%</text>
<text x="34" y="360" font-size="9.4" fill="#334155">第三次 40 分 → 120%</text>
<text x="34" y="376" font-size="9.6" fill="#881337">结果：1,200.00 / 1,000.00</text>
<rect x="284" y="290" width="240" height="88" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="294" y="310" font-size="10.5" font-weight="700" fill="#115e59">有守卫</text>
<text x="294" y="328" font-size="9.4" fill="#334155">第一次 40 分 → 40%</text>
<text x="294" y="344" font-size="9.4" fill="#334155">第二次 40 分 → 80%</text>
<text x="294" y="360" font-size="9.4" fill="#334155">第三次被拒 RED_OVER</text>
<text x="294" y="376" font-size="9.6" fill="#115e59">结果：800.00 / 1,000.00</text>
<rect x="544" y="290" width="192" height="88" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="554" y="310" font-size="10.5" font-weight="700" fill="#78350f">差额征税蓝票</text>
<text x="554" y="328" font-size="9.4" fill="#334155">只能全额红冲</text>
<text x="554" y="344" font-size="9.4" fill="#334155">扣除额拆不开</text>
<text x="554" y="360" font-size="9.4" fill="#334155">partial_red_allowed=0</text>
<text x="554" y="376" font-size="9.4" fill="#881337">政策明令禁止部分红冲</text>
<rect x="24" y="394" width="712" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="415" font-size="9.6" fill="#334155">红票存正数、用 kind 区分方向：裸 SUM 会让销项虚增 1,810.46 元（+1.4%）、收入虚增 20,821.10 元</text>
</svg>
