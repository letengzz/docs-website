<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw-is" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">一次开票：四个动作与三道闸门</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">号码、额度、义务三者同时发生，失败方式各不相同</text>
<rect x="24" y="70" width="150" height="64" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="90" font-size="11" font-weight="700" fill="#1e3a8a">开票请求</text>
<text x="34" y="108" font-size="9.2" fill="#334155">订单 + revision</text>
<text x="34" y="124" font-size="9.2" fill="#334155">幂等键 = 业务键</text>
<line x1="176" y1="102" x2="200" y2="102" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw-is)"/>
<rect x="204" y="66" width="280" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="214" y="86" font-size="11" font-weight="700" fill="#0f172a">四件事在同一事务里</text>
<text x="214" y="106" font-size="9.4" fill="#334155">① 取号：INSERT … SELECT MAX(no)+1</text>
<text x="214" y="124" font-size="9.4" fill="#334155">② 占额度：used + net ≤ limit</text>
<text x="214" y="142" font-size="9.4" fill="#334155">③ 算金额：net / tax / gross 恒等</text>
<text x="214" y="160" font-size="9.4" fill="#334155">④ 定义务日：obligation_date</text>
<text x="214" y="182" font-size="9.2" fill="#881337">失败要整笔回滚，不留半张票</text>
<text x="214" y="200" font-size="9.2" fill="#881337">额度与号必须同进同退</text>
<rect x="500" y="66" width="236" height="150" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="510" y="86" font-size="11" font-weight="700" fill="#115e59">三道闸门</text>
<text x="510" y="106" font-size="9.4" fill="#334155">UNIQUE(no)：号码不重复</text>
<text x="510" y="124" font-size="9.4" fill="#334155">QUOTA_EXCEEDED：额度不超</text>
<text x="510" y="142" font-size="9.4" fill="#334155">RATE_NOT_EFFECTIVE：税率有效</text>
<text x="510" y="164" font-size="9.2" fill="#115e59">20 线程 × 20 张实测：</text>
<text x="510" y="182" font-size="9.2" fill="#334155">无唯一键 21 组重号 / 38 个空号</text>
<text x="510" y="200" font-size="9.2" fill="#334155">有唯一键 0 / 0</text>
<rect x="24" y="236" width="228" height="92" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="34" y="256" font-size="11" font-weight="700" fill="#78350f">20 位号码</text>
<text x="34" y="274" font-size="9.4" fill="#334155">1–2 年 / 3–4 省级区域</text>
<text x="34" y="290" font-size="9.4" fill="#334155">5 渠道 / 6–20 顺序码</text>
<text x="34" y="308" font-size="9.4" fill="#881337">本地自增会跨区域撞号</text>
<text x="34" y="322" font-size="9.4" fill="#881337">跨年回绕后不可排序</text>
<rect x="266" y="236" width="228" height="92" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="276" y="256" font-size="11" font-weight="700" fill="#4c1d95">月度总额度</text>
<text x="276" y="274" font-size="9.4" fill="#334155">分母是「不含税」金额</text>
<text x="276" y="290" font-size="9.4" fill="#334155">10,000 元额度实测：</text>
<text x="276" y="308" font-size="9.4" fill="#334155">已开 9,961.29 元</text>
<text x="276" y="322" font-size="9.4" fill="#334155">超额被拒 52 张，应支持拆票</text>
<rect x="508" y="236" width="228" height="92" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="518" y="256" font-size="11" font-weight="700" fill="#881337">购买方税号</text>
<text x="518" y="274" font-size="9.4" fill="#334155">18 位，第 18 位模 31 校验</text>
<text x="518" y="290" font-size="9.4" fill="#334155">3,000 例改一位：</text>
<text x="518" y="308" font-size="9.4" fill="#334155">检出 2,897 例（100.0%）</text>
<text x="518" y="322" font-size="9.4" fill="#334155">校验位挡手误，挡不住伪造</text>
<rect x="24" y="344" width="712" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="364" font-size="10.5" font-weight="700" fill="#0f172a">幂等键的三档选择</text>
<text x="34" y="382" font-size="9.4" fill="#334155">随机 UUID：双击产生两张票　|　业务键 (order_no, revision)：一张　|　订单号唯一：一张但改单后无法重开</text>
<text x="34" y="398" font-size="9.4" fill="#334155">同 revision 幂等，新 revision 走「红冲 + 重开」——幂等与重开是两件事</text>
<rect x="24" y="418" width="712" height="22" rx="6" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="433" font-size="9.4" fill="#1e3a8a">票面要素里不能自动生成的是「项目名称」与「备注」——恰恰是稽查时最先看的两个字段</text>
</svg>
