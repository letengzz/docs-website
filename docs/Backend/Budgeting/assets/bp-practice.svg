<text x="352" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">N1 往冻结版插行 · N2 承诺无预算维度 · N3 分摊比例超 1 · N4 同一 PO 行号重复</text>
<text x="352" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">本机实测：C1~C5 全 0，N1~N4 4/4 PASS，EXIT=0</text>
<text x="24" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">四本账 CC01/6001/2026-07：预算 260,000 / 承诺 90,000 / 实际 150,000 / 可用 20,000</text>
</svg>
