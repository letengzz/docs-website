<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="额度释放曲线与四个控制点">
<title>额度释放曲线与四个控制点</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">年预算按季节因子释放到月，额度在四个时点被占用</text>
<line x1="40" y1="190" x2="900" y2="190" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="56" y="146.6" width="56" height="43.4" rx="4" fill="#bae6fd" stroke="none"/>
<text x="84.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">1月</text>
<rect x="126" y="151.6" width="56" height="38.4" rx="4" fill="#bae6fd" stroke="none"/>
<text x="154.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">2月</text>
<rect x="196" y="128.0" width="56" height="62.0" rx="4" fill="#bae6fd" stroke="none"/>
<text x="224.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">3月</text>
<rect x="266" y="124.9" width="56" height="65.1" rx="4" fill="#bae6fd" stroke="none"/>
<text x="294.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">4月</text>
<rect x="336" y="128.0" width="56" height="62.0" rx="4" fill="#bae6fd" stroke="none"/>
<text x="364.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">5月</text>
<rect x="406" y="130.5" width="56" height="59.5" rx="4" fill="#bae6fd" stroke="none"/>
<text x="434.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">6月</text>
<rect x="476" y="137.3" width="56" height="52.7" rx="4" fill="#bae6fd" stroke="none"/>
<text x="504.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">7月</text>
<rect x="546" y="137.3" width="56" height="52.7" rx="4" fill="#bae6fd" stroke="none"/>
<text x="574.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">8月</text>
<rect x="616" y="120.6" width="56" height="69.4" rx="4" fill="#bae6fd" stroke="none"/>
<text x="644.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">9月</text>
<rect x="686" y="117.5" width="56" height="72.5" rx="4" fill="#bae6fd" stroke="none"/>
<text x="714.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">10月</text>
<rect x="756" y="121.8" width="56" height="68.2" rx="4" fill="#fecaca" stroke="none"/>
<text x="784.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">11月</text>
<rect x="826" y="92.0" width="56" height="98.0" rx="4" fill="#bae6fd" stroke="none"/>
<text x="854.0" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">12月</text>
<line x1="40" y1="138.3" x2="900" y2="138.3" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="742" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400">等分线 1/12</text>
<text x="56" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">11 月季节额度 1,100,000；一笔 1,050,000 的申请在等分口径下被挡（差 50,000），在季节口径下放行（余 50,000）。</text>
<rect x="40" y="252" width="196" height="62" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="54" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">① 申请</text>
<text x="54" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">占用 = 0</text>
<rect x="252" y="252" width="196" height="62" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="266" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">② 下单</text>
<text x="266" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">承诺占用</text>
<rect x="464" y="252" width="196" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="478" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">③ 收货</text>
<text x="478" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">转实际</text>
<rect x="676" y="252" width="196" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="690" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">④ 付款</text>
<text x="690" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">只影响现金</text>
<text x="24" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">控制点必须在 ②：本机读数下，7 月 74.1% 的额度在月末仍处于「已承诺未收货」，只按实际控制等于放弃一半额度。</text>
</svg>
