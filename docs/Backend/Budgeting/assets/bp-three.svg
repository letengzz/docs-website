<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="三个预算与四本账">
<title>三个预算与四本账</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">同一个词，三种身份：授权 / 目标 / 预测</text>
<rect x="24" y="54" width="286" height="88" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="38" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">授权（Appropriation）</text>
<text x="38" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">「最多能花多少」</text>
<text x="38" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="400">超了就是违规</text>
<rect x="324" y="54" width="286" height="88" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="338" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">目标（Target）</text>
<text x="338" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">「应该花多少」</text>
<text x="338" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">偏了要解释</text>
<rect x="624" y="54" width="286" height="88" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="638" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">预测（Forecast）</text>
<text x="638" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">「将会花多少」</text>
<text x="638" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">错了要改动作</text>
<text x="24" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">四本账必须同维度（版本 / 责任中心 / 科目 / 期间）</text>
<rect x="24" y="200" width="196" height="74" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="38" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">预算</text>
<text x="38" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">1,100,000</text>
<text x="224" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#94a3b8" font-weight="700">−</text>
<rect x="250" y="200" width="196" height="74" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="264" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">承诺</text>
<text x="264" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">− 260,000</text>
<text x="450" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#94a3b8" font-weight="700">−</text>
<rect x="476" y="200" width="196" height="74" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="490" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">实际</text>
<text x="490" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">− 640,000</text>
<text x="676" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#94a3b8" font-weight="700">=</text>
<rect x="702" y="200" width="196" height="74" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="716" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">可用</text>
<text x="716" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700">= 200,000</text>
<text x="24" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">四本账只有「可用」会归零；前三本各自都可疑，因为它们的差值恰好被第四本吸收。</text>
<text x="24" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">本机读数：7 月承诺 2,756,517.38，月末已收货 714,236.25（25.9%）—— 74.1% 的额度处于「已花但未记」。</text>
</svg>
