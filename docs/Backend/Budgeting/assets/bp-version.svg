<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="版本链与冻结">
<title>版本链与冻结</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">版本是单向的：初版 → 调整 → 追加 → 冻结；冻结后只读</text>
<rect x="24" y="56" width="196" height="78" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="38" y="82" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V1 初版</text>
<text x="38" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="400">2025-12-20 冻结</text>
<line x1="222" y1="95" x2="246" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="252" y="56" width="196" height="78" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="266" y="82" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V1a 调整</text>
<text x="266" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">+120 行</text>
<line x1="450" y1="95" x2="474" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="480" y="56" width="196" height="78" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="494" y="82" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V1b 追加</text>
<text x="494" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#a21caf" font-weight="400">+40 行</text>
<line x1="678" y1="95" x2="702" y2="95" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="708" y="56" width="196" height="78" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="722" y="82" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V2 当前</text>
<text x="722" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">唯一 current</text>
<rect x="24" y="158" width="430" height="106" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">冻结版永久保留</text>
<text x="40" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">冻结版是「上期数」的唯一来源：</text>
<text x="40" y="222" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">12 月 25 日之后仍接受调整 120 行 / 3,576,543.49，</text>
<text x="40" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">这些行会同时进入本期与下期，次月对账必差。</text>
<rect x="474" y="158" width="442" height="106" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="490" y="182" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">漏掉版本条件的 join</text>
<text x="490" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">版本表 × 明细表不带 ver → 初版被并两次：</text>
<text x="490" y="222" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">53,026,185.93 变 102,551,730.02，</text>
<text x="490" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">虚增 49,525,544.09（93.4%），而试算仍然平。</text>
</svg>
