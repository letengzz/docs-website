<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="差异的分解树">
<title>差异的分解树</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">总差必须被五支分完，残差为零才算「解释完了」</text>
<rect x="380" y="52" width="180" height="40" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="470" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">总差 +2,760</text>
<line x1="470" y1="92" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="92" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="92" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="92" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="92" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="118" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="118" y1="116" x2="118" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="40" y="140" width="156" height="66" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="118" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">价格 +960</text>
<text x="118" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">单价变了</text>
<line x1="470" y1="116" x2="294" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="294" y1="116" x2="294" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="216" y="140" width="156" height="66" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="294" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">数量 +3,000</text>
<text x="294" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">量变了</text>
<line x1="470" y1="116" x2="470" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="470" y1="116" x2="470" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="392" y="140" width="156" height="66" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="470" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">结构 −1,200</text>
<text x="470" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">高低价占比变了</text>
<line x1="470" y1="116" x2="646" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="646" y1="116" x2="646" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="568" y="140" width="156" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="646" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">汇率 +200,000</text>
<text x="646" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">外币折算</text>
<line x1="470" y1="116" x2="822" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="822" y1="116" x2="822" y2="140" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="744" y="140" width="156" height="66" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="822" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">一次性 +1,800,000</text>
<text x="822" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">不可比</text>
<text x="24" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">只做价量两分解：合计 +3,960，残差 −1,200（占总额 43.5%）—— 结构差被算进了「数量」，</text>
<text x="24" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">于是「量买多了」的责任落到采购头上，而真正的原因是高价品占比上升。</text>
<text x="24" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">外币 100 万美元、汇率 7.0 → 7.2：差 200,000 全部是汇率，不是费用超支；</text>
<text x="24" y="312" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">年预算 1,200 万、实际 1,380 万（执行率 115%），剔除一次性 180 万后正好 100%。</text>
</svg>
