<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="责任中心树与矩阵归属">
<title>责任中心树与矩阵归属</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">层级树只能有一个父节点；矩阵归属用权重表达</text>
<rect x="430" y="52" width="80" height="34" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="470" y="74" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">集团</text>
<rect x="240" y="116" width="100" height="34" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="290" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0369a1" font-weight="700" text-anchor="middle">BU1</text>
<rect x="600" y="116" width="100" height="34" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="650" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0369a1" font-weight="700" text-anchor="middle">BU2</text>
<line x1="470" y1="86" x2="470" y2="102" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="290" y1="102" x2="650" y2="102" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="290" y1="102" x2="290" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="650" y1="102" x2="650" y2="116" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="80" y="190" width="120" height="34" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="140" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="700" text-anchor="middle">D1 研发</text>
<line x1="140" y1="190" x2="290" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="140" y1="190" x2="650" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="300" y="190" width="120" height="34" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="360" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="700" text-anchor="middle">D2 销售</text>
<line x1="360" y1="190" x2="290" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="540" y="190" width="120" height="34" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="600" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="700" text-anchor="middle">D3 交付</text>
<line x1="600" y1="190" x2="650" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="740" y="190" width="120" height="34" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="800" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="700" text-anchor="middle">D4 市场</text>
<line x1="800" y1="190" x2="290" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="800" y1="190" x2="650" y2="152" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="24" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">D1 挂两条线（BU1 50% / BU2 50%），D4 挂（BU1 70% / BU2 30%）</text>
<text x="24" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">直接 SUM(D1..D4) 按「部门 × 归属线」展开 = 34,900,000</text>
<text x="24" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" font-weight="700">叶子去重再加权 = 23,200,000 → 虚增 11,700,000（50.4%）</text>
<text x="24" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">本机读数：加权 8,200,000 vs 直接相加 16,400,000 —— 同一个部门被数了两遍。</text>
</svg>
