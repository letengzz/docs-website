<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">实战：一份事件流，三个读模型，两个接口</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">订单中心的读侧全部由投影生成；写侧只追加，不 UPDATE</text>
<rect x="40" y="120" width="220" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="150.0" y="165.5" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事件表</text>
<text x="150.0" y="180.5" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">order / stock / payment</text>
<rect x="330" y="120" width="280" height="78" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="470.0" y="156.6" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">order_list</text>
<text x="470.0" y="171.1" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">列表页：状态 + 金额</text>
<line x1="262" y1="168" x2="328" y2="158" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="330" y="216" width="280" height="78" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="470.0" y="252.6" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">order_timeline</text>
<text x="470.0" y="267.1" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">详情页：时间线</text>
<line x1="262" y1="168" x2="328" y2="254" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="330" y="312" width="280" height="78" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="470.0" y="348.6" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">stock_ledger</text>
<text x="470.0" y="363.1" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">库存流水：预占/释放</text>
<line x1="262" y1="168" x2="328" y2="350" stroke="#b45309" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="680" y="120" width="240" height="78" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="800.0" y="156.6" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">GET /orders</text>
<text x="800.0" y="171.1" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读 order_list</text>
<rect x="680" y="216" width="240" height="78" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="800.0" y="252.6" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">GET /orders/{no}/timeline</text>
<text x="800.0" y="267.1" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读 order_timeline</text>
<rect x="680" y="312" width="240" height="78" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="800.0" y="348.6" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">GET /stocks/{sku}/ledger</text>
<text x="800.0" y="363.1" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读 stock_ledger</text>
<line x1="610" y1="152" x2="678" y2="158" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="610" y1="248" x2="678" y2="254" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="610" y1="344" x2="678" y2="350" stroke="#b45309" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="40" y="440" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">验收：下单一次 ⇒ 事件表 +1 行、三个读模型各 +1 行、位点 +1；重复投递一次 ⇒ 读模型行数不变</text>
<text x="40" y="464" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">重建：TRUNCATE 任一读模型并把位点归零 ⇒ 重放后与重建前的快照逐行一致</text>
</svg>
