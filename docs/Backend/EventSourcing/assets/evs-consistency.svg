<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读模型总会落后一点：关键是把「落后多少」变成可读的数</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">event_watermark 与 processed_seq 的差就是滞后；能不能等，取决于读的人是谁</text>
<rect x="40" y="116" width="210" height="84" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="145.0" y="155.5" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">写请求</text>
<text x="145.0" y="170.5" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">命令 → 校验 → 追加</text>
<rect x="300" y="116" width="210" height="84" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="405.0" y="155.5" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事件表</text>
<text x="405.0" y="170.5" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">max(global_seq) = 252,000</text>
<rect x="560" y="116" width="200" height="84" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="660.0" y="155.5" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">投影器</text>
<text x="660.0" y="170.5" font-size="12" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">processed_seq</text>
<rect x="810" y="116" width="110" height="84" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="865.0" y="155.5" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读模型</text>
<text x="865.0" y="170.5" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">最新位点</text>
<line x1="250" y1="158" x2="298" y2="158" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="510" y1="158" x2="558" y2="158" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="760" y1="158" x2="808" y2="158" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)"/>
<text x="48" y="240" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">三种读的人，三种答案</text>
<rect x="40" y="256" width="880" height="54" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="56" y="278" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">刚写完的人</text>
<text x="220" y="278" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">必须看到自己那一版</text>
<text x="460" y="278" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">带 version 令牌轮询读模型，超时回退读事件流</text>
<rect x="40" y="320" width="880" height="54" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="56" y="342" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">列表页 / 详情页</text>
<text x="220" y="342" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">可以慢 1~2 秒</text>
<text x="460" y="342" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">直接读读模型，页面上不承诺实时</text>
<rect x="40" y="384" width="880" height="54" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="56" y="406" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">报表 / 对账</text>
<text x="220" y="406" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">可以慢几分钟</text>
<text x="460" y="406" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">读读模型 + 定时抽样重算比对</text>
<rect x="40" y="452" width="880" height="54" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="480.0" y="483.8" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">滞后 = (max(global_seq) - processed_seq) 事件数 ÷ 投影吞吐 ⇒ 换算成秒；只报事件数不报秒，值班的人看不懂</text>
</svg>
