<text x="748" y="160" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">同一个事务</text>
<text x="748" y="180" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">要么都成，要么都不成</text>
<rect x="40" y="330" width="420" height="120" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="250.0" y="373.1" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">全量重建（影子表）</text>
<text x="250.0" y="387.6" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">① CREATE TABLE read_model_new (LIKE …)</text>
<text x="250.0" y="402.1" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">② 从 global_seq = 0 重放</text>
<text x="250.0" y="416.6" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">③ BEGIN; RENAME 双表; COMMIT;</text>
<rect x="490" y="330" width="430" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="705.0" y="373.1" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">两条禁令</text>
<text x="705.0" y="387.6" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">① 不做双写（业务事务里同时写事件与读模型）</text>
<text x="705.0" y="402.1" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">② 不把读模型当真相（重建一次就全丢）</text>
<text x="705.0" y="416.6" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">违反任一条，重建能力就等于零</text>
</svg>
