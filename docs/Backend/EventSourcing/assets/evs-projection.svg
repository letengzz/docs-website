<rect x="280" y="150" width="190" height="120" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="375.0" y="200.0" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">投影器</text>
<text x="375.0" y="215.0" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">批量 500 / 事务</text>
<text x="375.0" y="230.0" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">同事务写位点</text>
<line x1="242" y1="190" x2="278" y2="200" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)"/>
