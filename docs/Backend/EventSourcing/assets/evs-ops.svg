<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="490" fill="#ffffff"/>
<text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">运维三件事：分区、归档、演练重放</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事件表只增不减；能删的只有「已经不在保留期内」的整个分区，且必须先归档</text>
<text x="48" y="118" font-size="12" font-weight="700" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">按 global_seq 区间分区（每月一个）</text>
<rect x="40" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="110" y="155" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p01</text>
<text x="110" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 热</text>
<rect x="190" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="260" y="155" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p02</text>
<text x="260" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 热</text>
<rect x="340" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="410" y="155" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p03</text>
<text x="410" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 热</text>
<rect x="490" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<text x="560" y="155" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p04</text>
<text x="560" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 热</text>
<rect x="640" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
<text x="710" y="155" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p05</text>
<text x="710" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 冷</text>
<rect x="790" y="132" width="140" height="56" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
<text x="860" y="155" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">events_p06</text>
<text x="860" y="174" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">只读 / 冷</text>
<rect x="40" y="222" width="420" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="250.0" y="260.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">归档：COPY 到对象存储</text>
<text x="250.0" y="274.8" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">按分区导出 + 校验和 + 保留 DDL</text>
<text x="250.0" y="289.3" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">恢复时按同一分区边界导回</text>
<rect x="500" y="222" width="420" height="96" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="710.0" y="260.3" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">演练重放：影子读模型</text>
<text x="710.0" y="274.8" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">在同一份事件上重建，不动线上表</text>
<text x="710.0" y="289.3" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">比对行数与聚合值，再切换</text>
<rect x="40" y="344" width="880" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="480.0" y="372.3" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">三条红线</text>
<text x="480.0" y="386.8" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">① 不 UPDATE / DELETE 单条事件（要改就追加补偿事件）</text>
<text x="480.0" y="401.3" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">② 删分区前必须归档并验证可读；③ 重放必须限速，否则投影库先崩</text>
<text x="40" y="460" font-size="12" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">容量：300 B/事件 ⇒ 1 亿事件约 30 GB；索引约占 20%，留一倍余量做重建与归档</text>
</svg>
