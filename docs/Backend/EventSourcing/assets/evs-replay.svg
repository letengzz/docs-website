<text x="48" y="336" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">从 49,800 开始 200 条</text>
<rect x="290" y="324" width="4" height="18" rx="3" fill="#0f766e" opacity="0.18"/>
