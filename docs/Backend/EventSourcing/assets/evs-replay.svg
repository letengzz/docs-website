<rect x="48" y="366" width="400" height="92" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="248.0" y="402.3" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">快照间隔不是拍脑袋</text>
<text x="248.0" y="416.8" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">间隔 N ⇒ 重建上限 ≈ N × 0.35 µs</text>
<text x="248.0" y="431.3" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">N=500 时约 0.2 ms，N=50,000 时约 17 ms</text>
<rect x="480" y="366" width="440" height="92" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="700.0" y="395.1" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">快照的三种失效方式</text>
<text x="700.0" y="409.6" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">① 快照与事件不在同一事务 → 少折或多折一条</text>
<text x="700.0" y="424.1" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">② 快照结构随代码改 → 旧快照读不出来</text>
<text x="700.0" y="438.6" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">③ 把快照当真相 → 事故时无法回答「当时为什么」</text>
</svg>
