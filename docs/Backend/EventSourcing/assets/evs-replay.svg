<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">同一台机器同一份 50k 事件流，尾巴越短越便宜（PostgreSQL 18.6 实测）</text>
<text x="48" y="118" font-size="12" font-weight="700" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事件流（stream_version 递增）</text>
