<text x="48" y="302" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">从 45,000 开始 5,000 条</text>
<rect x="290" y="290" width="53" height="18" rx="3" fill="#1d4ed8" opacity="0.18"/>
