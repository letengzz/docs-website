<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事件是不可变历史：兼容只能靠「读的时候翻译」</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">三种变更里只有一种可以直接改字段；另两种必须走新类型或 upcaster</text>
<rect x="40" y="112" width="210" height="150" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="145" y="140" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">加字段（可选）</text>
<text x="145" y="176" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">OrderPaid{v1} → OrderPaid{v1+channel}</text>
<text x="145" y="208" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">旧事件缺字段 ⇒ 读时给默认值</text>
<text x="145" y="226" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve"></text>
<text x="145" y="250" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">允许</text>
<rect x="265" y="112" width="210" height="150" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<text x="370" y="140" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">改语义（同名不同义）</text>
<text x="370" y="176" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">amount 从「元」改成「分」</text>
<text x="370" y="208" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">历史事件会被按新语义解释 ⇒ 账错</text>
<text x="370" y="226" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve"></text>
<text x="370" y="250" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">禁止</text>
<rect x="490" y="112" width="210" height="150" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<text x="595" y="140" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">删字段 / 改类型</text>
<text x="595" y="176" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">amount: int → string</text>
<text x="595" y="208" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">旧事件反序列化直接失败</text>
<text x="595" y="226" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve"></text>
<text x="595" y="250" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">禁止</text>
<rect x="715" y="112" width="210" height="150" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="820" y="140" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">新增事件类型</text>
<text x="820" y="176" font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">OrderPartiallyRefunded</text>
<text x="820" y="208" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">折叠器不认识的类型要显式忽略或报错</text>
<text x="820" y="226" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve"></text>
<text x="820" y="250" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">需要评审</text>
<rect x="40" y="290" width="880" height="86" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="480.0" y="323.3" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">upcaster：v1 事件读出来先翻译成当前形态，再交给折叠器</text>
<text x="480.0" y="337.8" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">EventV1 ──upcast──▶ EventV2 ──upcast──▶ EventV3(当前)</text>
<text x="480.0" y="352.3" font-size="11.5" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">链表只增不删；每加一级要补一条 golden event 回放测试</text>
<rect x="40" y="396" width="880" height="76" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="480.0" y="431.6" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">信封里的版本字段是给「翻译器」用的，不是给业务用的</text>
<text x="480.0" y="446.1" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">event_type=OrderPaid + event_version=1 → 反序列化到 OrderPaidV1 → upcast → OrderPaidV3</text>
</svg>
