<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Kafka 可靠性三段与 Exactly-Once 语义</text>

  <!-- 三段 -->
  <rect x="30" y="60" width="260" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">① 生产者不丢 / 不重</text>
  <text x="50" y="114" font-size="11" fill="#3730a3">acks=all（默认）</text>
  <text x="50" y="136" font-size="11" fill="#3730a3">enable.idempotence=true（默认）</text>
  <text x="50" y="158" font-size="11" fill="#3730a3">retries &gt; 0、max.in.flight ≤ 5</text>
  <text x="50" y="180" font-size="11" fill="#3730a3">delivery.timeout.ms 覆盖整条链路</text>
  <text x="50" y="200" font-size="10" fill="#6b7280">事务场景：transactional.id + 事务 API</text>

  <rect x="310" y="60" width="280" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">② Broker 不丢</text>
  <text x="330" y="114" font-size="11" fill="#065f46">replication.factor ≥ 3（生产）</text>
  <text x="330" y="136" font-size="11" fill="#065f46">min.insync.replicas ≥ 2</text>
  <text x="330" y="158" font-size="11" fill="#065f46">unclean.leader.election.enable=false</text>
  <text x="330" y="180" font-size="11" fill="#065f46">多副本跨机架分布（broker.rack）</text>
  <text x="330" y="200" font-size="10" fill="#6b7280">磁盘故障 + 副本不足时宁可拒绝写入</text>

  <rect x="610" y="60" width="260" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">③ 消费者不丢 / 幂等</text>
  <text x="630" y="114" font-size="11" fill="#92400e">enable.auto.commit=false</text>
  <text x="630" y="136" font-size="11" fill="#92400e">业务成功后手动 commitSync</text>
  <text x="630" y="158" font-size="11" fill="#92400e">业务侧去重（唯一键 / 状态机）</text>
  <text x="630" y="180" font-size="11" fill="#92400e">isolation.level=read_committed（事务）</text>
  <text x="630" y="200" font-size="10" fill="#6b7280">先处理后提交 = at-least-once</text>

  <!-- 语义对比 -->
  <rect x="30" y="232" width="840" height="170" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="258" font-size="14" font-weight="bold" fill="#1f2937">投递语义对照</text>
  <line x1="50" y1="274" x2="850" y2="274" stroke="#e5e7eb"/>
  <text x="50" y="298" font-size="12" font-weight="bold" fill="#4b5563">最多一次（at-most-once）</text>
  <text x="330" y="298" font-size="12" fill="#374151">先提交位移再处理业务：进程崩溃会丢消息，适合可丢的埋点</text>
  <text x="50" y="326" font-size="12" font-weight="bold" fill="#4b5563">至少一次（at-least-once）</text>
  <text x="330" y="326" font-size="12" fill="#374151">先处理再提交位移：默认推荐，需业务幂等，可能重复</text>
  <text x="50" y="354" font-size="12" font-weight="bold" fill="#4b5563">精确一次（exactly-once）</text>
  <text x="330" y="354" font-size="12" fill="#374151">幂等生产者 + 事务 + read_committed：Kafka 内部端到端精确一次</text>
  <text x="50" y="382" font-size="11" fill="#6b7280">注意：事务只覆盖「Kafka 读→处理→Kafka 写」这条链路；写 MySQL 等外部系统仍需本地事务/幂等表配合</text>
</svg>
