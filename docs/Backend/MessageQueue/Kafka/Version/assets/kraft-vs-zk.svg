<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Kafka 3.x（ZooKeeper）→ 4.x（KRaft）架构演进</text>

  <!-- 3.x ZooKeeper -->
  <g>
    <rect x="30" y="70" width="360" height="300" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">3.x：ZooKeeper 模式（仅存量）</text>
    <rect x="60" y="120" width="300" height="60" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="210" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">ZooKeeper 集群（3 或 5 节点）</text>
    <text x="210" y="167" text-anchor="middle" font-size="11" fill="#7f1d1d">保存 broker / topic / ACL / 控制器选举元数据</text>
    <path d="M 210 182 V 206" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#zkA)"/>
    <rect x="60" y="208" width="300" height="70" rx="8" fill="#ffffff" stroke="#ef4444"/>
    <text x="210" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Broker 集群</text>
    <text x="210" y="253" text-anchor="middle" font-size="11" fill="#7f1d1d">自行选举 Controller（ZooKeeper 抢锁）</text>
    <text x="210" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">元数据与数据分离、运维需两套组件</text>
    <rect x="60" y="292" width="300" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="210" y="314" text-anchor="middle" font-size="11" fill="#991b1b">状态：3.9.x 为 ZooKeeper 最后一代</text>
    <text x="210" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">本库保留其配置说明，标注「仅存量集群使用」</text>
  </g>

  <!-- 迁移箭头 -->
  <g>
    <path d="M 400 220 H 458" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#moveA)"/>
    <text x="429" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">迁移</text>
    <text x="429" y="248" text-anchor="middle" font-size="11" fill="#4b5563">KIP-866</text>
    <text x="429" y="266" text-anchor="middle" font-size="11" fill="#4b5563">先升 3.9 再转</text>
  </g>

  <!-- 4.x KRaft -->
  <g>
    <rect x="470" y="70" width="360" height="300" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="650" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#4338ca">4.x：KRaft 模式（当前稳定版）</text>
    <rect x="500" y="120" width="300" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="650" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Controller Quorum（Raft 选主）</text>
    <text x="650" y="167" text-anchor="middle" font-size="11" fill="#4338ca">元数据写入内部主题 __cluster_metadata 日志</text>
    <path d="M 650 182 V 206" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#krA)"/>
    <rect x="500" y="208" width="300" height="70" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="650" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Broker 集群</text>
    <text x="650" y="253" text-anchor="middle" font-size="11" fill="#4338ca">元数据由 controller 推送，无需额外中间件</text>
    <text x="650" y="270" text-anchor="middle" font-size="11" fill="#4338ca">角色由 process.roles 决定，可合并部署</text>
    <rect x="500" y="292" width="300" height="58" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="650" y="314" text-anchor="middle" font-size="11" fill="#3730a3">4.3.1 为当前支持版本（2026-06-25 发布）</text>
    <text x="650" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">4.0 起不再支持 ZooKeeper，必须 KRaft</text>
  </g>

  <defs>
    <marker id="zkA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="krA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="moveA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
