<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Kafka 分区日志存储与读写路径</text>

  <!-- Broker 内部 -->
  <rect x="30" y="60" width="380" height="360" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">Broker 内部</text>

  <rect x="52" y="104" width="150" height="52" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="127" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">网络线程池</text>
  <text x="127" y="145" text-anchor="middle" font-size="10" fill="#374151">num.network.threads=3</text>

  <rect x="238" y="104" width="150" height="52" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="313" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">IO 线程池</text>
  <text x="313" y="145" text-anchor="middle" font-size="10" fill="#374151">num.io.threads=8</text>

  <path d="M 202 130 H 236" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#sA)"/>

  <rect x="52" y="176" width="336" height="42" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="220" y="203" text-anchor="middle" font-size="12" fill="#065f46">请求队列（按分区排队，保证单分区串行追加）</text>

  <path d="M 220 218 V 240" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#sA)"/>

  <rect x="52" y="242" width="336" height="158" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="220" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">/data/kafka/orders-0/（一个分区一个目录）</text>
  <rect x="70" y="276" width="130" height="46" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="135" y="296" text-anchor="middle" font-size="11" fill="#065f46">00000000000000000000.log</text>
  <text x="135" y="313" text-anchor="middle" font-size="10" fill="#6b7280">消息本体（顺序追加）</text>
  <rect x="212" y="276" width="158" height="20" rx="6" fill="#f0fdf4" stroke="#34d399"/>
  <text x="291" y="291" text-anchor="middle" font-size="10" fill="#065f46">.index（偏移量稀疏索引）</text>
  <rect x="212" y="302" width="158" height="20" rx="6" fill="#f0fdf4" stroke="#34d399"/>
  <text x="291" y="317" text-anchor="middle" font-size="10" fill="#065f46">.timeindex（时间戳索引）</text>
  <rect x="70" y="330" width="300" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="220" y="347" text-anchor="middle" font-size="10" fill="#92400e">Active Segment：唯一可写的段，写满 1GiB（log.segment.bytes）滚动</text>
  <rect x="70" y="360" width="300" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="220" y="380" text-anchor="middle" font-size="11" fill="#4338ca">保留策略：cleanup.policy=delete / compact</text>

  <!-- 读写路径 -->
  <rect x="450" y="60" width="400" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">写路径（Produce）</text>
  <text x="470" y="116" font-size="12" fill="#1e3a8a">1. 追加到 Active Segment 末尾（顺序写，不用随机 IO）</text>
  <text x="470" y="142" font-size="12" fill="#1e3a8a">2. 写入 OS Page Cache，由内核刷盘（Kafka 不主动 fsync 每条）</text>
  <text x="470" y="168" font-size="12" fill="#1e3a8a">3. 按需更新 .index / .timeindex 稀疏索引</text>
  <text x="470" y="194" font-size="12" fill="#1e3a8a">4. 副本按 acks 策略 ACK 给生产者</text>
  <text x="470" y="218" font-size="11" fill="#6b7280">结论：写吞吐取决于顺序写 + 页缓存 + 批量，而不是磁盘随机性能</text>

  <rect x="450" y="250" width="400" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">读路径（Fetch）</text>
  <text x="470" y="306" font-size="12" fill="#92400e">1. 消费者携带 offset 请求分区数据</text>
  <text x="470" y="332" font-size="12" fill="#92400e">2. 先查 .index 定位最近的物理位置（不逐条索引）</text>
  <text x="470" y="358" font-size="12" fill="#92400e">3. 从 Page Cache 取数据，命中则零拷贝（sendfile）直达网卡</text>
  <text x="470" y="384" font-size="12" fill="#92400e">4. 未命中则从磁盘读取并回填页缓存</text>
  <text x="470" y="408" font-size="11" fill="#6b7280">结论：消费能跟上生产时几乎不产生磁盘 IO；积压越大磁盘压力越高</text>

  <defs>
    <marker id="sA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
