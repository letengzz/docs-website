<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">消息队列集群拓扑（高可用）</text>
  <!-- 客户端 -->
  <rect x="300" y="55" width="220" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">客户端（生产 / 消费）</text>
  <text x="410" y="102" text-anchor="middle" font-size="11" fill="#4b5563">连接多个节点，故障自动切换</text>
  <!-- 负载 -->
  <path d="M 350 120 V 145" stroke="#6366f1" stroke-width="2"/>
  <path d="M 470 120 V 145" stroke="#6366f1" stroke-width="2"/>
  <!-- 节点 -->
  <g>
    <rect x="130" y="150" width="150" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="205" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">节点 1</text>
    <text x="205" y="200" text-anchor="middle" font-size="11" fill="#4b5563">Leader / 镜像主</text>
    <text x="205" y="222" text-anchor="middle" font-size="11" fill="#6b7280">写入 + 分发</text>
  </g>
  <g>
    <rect x="335" y="150" width="150" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="410" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">节点 2</text>
    <text x="410" y="200" text-anchor="middle" font-size="11" fill="#4b5563">Follower / 镜像从</text>
    <text x="410" y="222" text-anchor="middle" font-size="11" fill="#6b7280">同步副本</text>
  </g>
  <g>
    <rect x="540" y="150" width="150" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="615" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">节点 3</text>
    <text x="615" y="200" text-anchor="middle" font-size="11" fill="#4b5563">Follower / 仲裁者</text>
    <text x="615" y="222" text-anchor="middle" font-size="11" fill="#6b7280">参与投票</text>
  </g>
  <!-- 节点间同步 -->
  <path d="M 285 200 H 330" stroke="#10b981" stroke-width="2" marker-end="url(#carrow)"/>
  <path d="M 490 200 H 535" stroke="#10b981" stroke-width="2" marker-end="url(#carrow)"/>
  <text x="410" y="196" text-anchor="middle" font-size="10" fill="#10b981">复制/仲裁</text>
  <!-- 存储 -->
  <g>
    <rect x="130" y="280" width="560" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="410" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">存储层：Kafka 分区副本 ISR / RabbitMQ 镜像队列或 Quorum 队列</text>
    <text x="410" y="330" text-anchor="middle" font-size="12" fill="#475569">多数派确认后才算成功 → 单节点故障不丢数据，自动选主继续服务</text>
  </g>
  <text x="410" y="380" text-anchor="middle" font-size="12" fill="#6b7280">部署建议：节点跨机架/可用区；配置 + 元数据同样需要持久化；客户端配置全部节点地址</text>
  <defs>
    <marker id="carrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
