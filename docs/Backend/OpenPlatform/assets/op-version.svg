<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="API 版本从 GA 到下线的时间轴与三个观测点">
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">版本与弃用：破坏性变更的代价可以被「提前量」买下来</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">没有弃用公告的破坏性变更，等于把迁移成本一次性转嫁给所有集成方</text>
<line x1="70" y1="200" x2="880" y2="200" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="120" cy="200" r="7" fill="#0f766e"/>
<text x="120" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f766e" text-anchor="middle">v1 GA</text>
<text x="120" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">稳定</text>
<circle cx="300" cy="200" r="7" fill="#2563eb"/>
<text x="300" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">v2 GA</text>
<text x="300" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">v1 进入维护</text>
<circle cx="480" cy="200" r="7" fill="#b45309"/>
<text x="480" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b45309" text-anchor="middle">v1 公告弃用</text>
<text x="480" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">官方信 + 文档横幅</text>
<circle cx="720" cy="200" r="7" fill="#b91c1c"/>
<text x="720" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle">v1 Sunset</text>
<text x="720" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">410 Gone</text>
<circle cx="830" cy="200" r="7" fill="#64748b"/>
<text x="830" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">v1 下线</text>
<text x="830" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">文档归档</text>
<rect x="120" y="268" width="240" height="26" rx="13.0" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="240.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">同一时刻最多两条版本在线</text>
<rect x="380" y="268" width="300" height="26" rx="13.0" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="530.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">弃用窗口 ≥ 12 个月（企业客户按合同）</text>
<rect x="700" y="268" width="180" height="26" rx="13.0" fill="#fef2f2" stroke="#fecaca"/>
<text x="790.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">Sunset 后返回 410</text>
<text x="470" y="336" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">判断「能不能弃用」不看公告发了多久，只看一条：近 30 天该版本调用量占比是否 &lt; 1% 且没有任何付费方在用</text>
</svg>
