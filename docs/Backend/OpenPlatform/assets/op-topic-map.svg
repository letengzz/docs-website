<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="开放平台专题地图：接入、运行、治理三组八页">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">专题地图：一份开放合同被拆成八件事</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">接入 → 运行 → 治理，三段之间各有一次「口径交接」</text>
<rect x="40" y="122" width="148" height="26" rx="13.0" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="114.0" y="139.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">接入</text>
<text x="114" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">能不能进来</text>
<rect x="208" y="92" width="214" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="315.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">Overview</text>
<text x="315.0" y="152.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">七段链与四条边界</text>
<rect x="448" y="92" width="214" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="555.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">AppCredential</text>
<text x="555.0" y="152.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">应用与凭证签名</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="470" y1="178" x2="470" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="240" width="148" height="26" rx="13.0" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="114.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">运行</text>
<text x="114" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">进来之后怎么算</text>
<rect x="208" y="210" width="214" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
