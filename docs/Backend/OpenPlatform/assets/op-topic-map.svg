<text x="555.0" y="250.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">EventWebhook</text>
<text x="555.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">事件订阅与重投</text>
<line x1="470" y1="296" x2="470" y2="326" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="358" width="148" height="26" rx="13.0" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="114.0" y="375.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">治理</text>
<text x="114" y="404" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">怎么改、怎么退</text>
<rect x="208" y="328" width="214" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="315.0" y="368.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">VersionLifecycle</text>
<text x="315.0" y="388.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">版本与弃用</text>
<rect x="448" y="328" width="214" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="555.0" y="368.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">Practice</text>
<text x="555.0" y="388.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">端到端最小平台</text>
<text x="700" y="139" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle"></text>
