<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="开放平台七段接入链与三处断点">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段接入链：每段的「成功」由不同的人定义</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">应用方以为接上了、平台方以为计上了、财务以为收到了——三件事</text>
<rect x="30" y="96" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">① 注册应用</text>
<text x="130.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">拿到 client_id</text>
<rect x="258" y="96" width="200" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="358.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">② 授权</text>
<text x="358.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">拿到 access_token</text>
<rect x="486" y="96" width="200" height="78" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="586.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">③ 调用</text>
<text x="586.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">服务端返回 2xx</text>
<rect x="714" y="96" width="200" height="78" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="814.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">④ 计量</text>
<text x="814.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">用量落进 usage 表</text>
<rect x="30" y="220" width="200" height="78" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="130.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 配额</text>
<text x="130.0" y="277.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">没被 429 挡住</text>
<rect x="258" y="220" width="200" height="78" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="358.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 结算</text>
<text x="358.0" y="277.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">账单与用量对得上</text>
<rect x="486" y="220" width="200" height="78" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="586.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">⑦ 退出</text>
<text x="586.0" y="277.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">密钥撤销、版本下线</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="898" y1="174" x2="898" y2="220" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="880" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">回环</text>
<rect x="30" y="330" width="250" height="26" rx="13.0" fill="#fef2f2" stroke="#fecaca"/>
<text x="155.0" y="347.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">断点一：授权成功但 scope 不够</text>
<rect x="300" y="330" width="250" height="26" rx="13.0" fill="#fef2f2" stroke="#fecaca"/>
<text x="425.0" y="347.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">断点二：调用成功但没计量</text>
<rect x="570" y="330" width="250" height="26" rx="13.0" fill="#fef2f2" stroke="#fecaca"/>
<text x="695.0" y="347.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">断点三：计了量但账单不认</text>
<text x="470" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">三处断点共同的特征：上游都返回了成功，且都没有事务能同时覆盖两侧</text>
<text x="470" y="408" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">所以每一段都要有「可对账的键」：app_id / trace_id / usage_id / invoice_line_id</text>
</svg>
