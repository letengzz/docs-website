<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="webhook 投递状态机：outbox、退避重投、死信与重放">
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">事件订阅：失败是常态，所以「送达」要有明确的终点</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">重试不是越多越好：上限 5 次时 0.02% 未送达，提到 8 次只是把尾巴拉长</text>
<rect x="30" y="100" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="115.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">业务事务提交</text>
<text x="115.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">同一事务写 outbox</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="200" y1="135" x2="246" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="246" y="100" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="331.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">outbox 扫描</text>
<text x="331.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">按 event_id 顺序取</text>
<line x1="416" y1="135" x2="462" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="462" y="100" width="180" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="552.0" y="133.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">投递（HTTP POST）</text>
<text x="552.0" y="153.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">带签名 + event_id</text>
<line x1="642" y1="120" x2="700" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="642" y1="150" x2="700" y2="178" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="700" y="66" width="200" height="62" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="800.0" y="101.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">2xx：标记 delivered</text>
<rect x="700" y="150" width="200" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="800.0" y="185.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">非 2xx：按退避重投</text>
<line x1="800" y1="212" x2="800" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="700" y="250" width="200" height="62" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="800.0" y="279.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">超过上限 → 死信</text>
<text x="800.0" y="299.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">保留 7 天，可手动重放</text>
<line x1="700" y1="281" x2="560" y2="281" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="360" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="455.0" y="279.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">重放接口</text>
<text x="455.0" y="299.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">POST /webhooks/replay</text>
<line x1="455" y1="250" x2="455" y2="174" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="330" width="300" height="26" rx="13.0" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="180.0" y="347.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="600">接收方必须按 event_id 去重（重投是设计行为）</text>
<rect x="350" y="330" width="300" height="26" rx="13.0" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="500.0" y="347.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="600">顺序只在单个聚合内保证，跨聚合不保证</text>
<text x="470" y="392" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">退避序列 1s/4s/16s/64s/256s：5 次重试覆盖约 5.7 分钟，跨过绝大多数发版与重启窗口</text>
</svg>
