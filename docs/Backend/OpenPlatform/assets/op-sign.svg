<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="签名串五段拼接与两端验签步骤">
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">签名串：五个字段的拼接顺序也是协议的一部分</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">换一个字段、换一个分隔符、换一次 URL 编码，两侧签名就永远对不上</text>
<rect x="40" y="92" width="164" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="122.0" y="122.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">method</text>
<rect x="216" y="92" width="164" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="298.0" y="122.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">path</text>
<rect x="392" y="92" width="164" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="474.0" y="122.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">query</text>
<rect x="568" y="92" width="164" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="650.0" y="122.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">body_sha256</text>
<rect x="744" y="92" width="164" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="826.0" y="122.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="600">ts · nonce</text>
<text x="470" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">按固定顺序用换行符拼成一串（顺序写进文档，不许两头各猜一套）</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="470" y1="176" x2="470" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="196" width="860" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="56" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f172a">POST\n/v1/orders\napp_id=app_7f3a91&page=2\n9f2c41d8…（body 的 SHA-256 hex）\n1790000000 · 7c1e9a04</text>
<text x="820" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" text-anchor="end">五段，四换行</text>
<line x1="470" y1="282" x2="470" y2="302" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="302" width="400" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">客户端：HMAC-SHA256(secret, 串) → hex</text>
<text x="240.0" y="351.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">头部带 app_id / ts / nonce / signature</text>
<rect x="468" y="302" width="432" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="684.0" y="331.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">服务端五步：查密钥 → 校时钟 → 查重放 → 重算 → 验 scope</text>
<text x="684.0" y="351.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">任一步失败都不进入业务逻辑</text>
<text x="470" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">本机读数：2 KB 体 HMAC-SHA256 中位 7.3 µs、p99 28.4 µs —— 签名从来不是瓶颈，查密钥与去重才是</text>
<text x="470" y="418" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">时钟窗口取 ±300s、nonce 保留 600s：窗口越宽越好用，越窄越难被重放</text>
</svg>
