<svg xmlns="http://www.w3.org/2000/svg" width="820" height="368" viewBox="0 0 820 368" role="img">
<title>图 4　关联膨胀：40,000 单变 93,574 行，金额虚高 2.344 倍</title>
<rect width="820" height="368" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 4　关联膨胀：40,000 单变 93,574 行，金额虚高 2.344 倍</text>
<rect x="40" y="70" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="140.0" y="101.0" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">orders 40,000 行</text>
<text x="140.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">SUM = 1,814,179,432</text>
<rect x="300" y="70" width="180" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="390.0" y="101.0" font-size="13.5" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">JOIN items</text>
<text x="390.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">平均 2.34 行/单</text>
<rect x="540" y="70" width="240" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="660.0" y="101.0" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">93,574 行 → 4,251,721,905</text>
<text x="660.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">同一笔钱被数了 2.344 次</text>
<line x1="242" y1="105" x2="290" y2="105" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="298,105 290,105 292.9,111.1 292.9,98.9" fill="#94a3b8"/>
<line x1="482" y1="105" x2="530" y2="105" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="538,105 530,105 532.9,111.1 532.9,98.9" fill="#94a3b8"/>
<text x="40" y="186" font-size="13" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三种「去重」写法，只有一种对</text>
<rect x="40" y="202" width="236" height="86" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="158.0" y="241.0" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">不去重：SUM(o.amount)</text>
<text x="158.0" y="260.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2.344× 虚高</text>
<rect x="292" y="202" width="236" height="86" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="410.0" y="241.0" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">SUM(DISTINCT amount)</text>
<text x="410.0" y="260.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1,457,452,224（−19.7%）</text>
<rect x="544" y="202" width="236" height="86" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="662.0" y="241.0" font-size="13.5" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">先去重再聚合</text>
<text x="662.0" y="260.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">子查询 group by order_id</text>
<text x="40" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">「金额相同」的两笔订单会被 DISTINCT 合并——去重写在值上，不是在行上。</text>
<text x="40" y="344" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">判据：任何报表 SQL 的 SUM 分母上，都必须能说出「这张表一个业务对象几行」。</text>
</svg>
