<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img">
<title>图 8　导出五环与排队上限的取舍</title>
<rect width="820" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 8　导出五环与排队上限的取舍</text>
<rect x="30" y="66" width="140" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="100.0" y="95.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">导出请求</text>
<text x="100.0" y="114.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行数+条件</text>
<circle cx="12" cy="99.0" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="12" y="104.0" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1</text>
<rect x="200" y="66" width="150" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="275.0" y="95.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">限额判定</text>
<text x="275.0" y="114.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">队列上限 5</text>
<circle cx="182" cy="99.0" r="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="182" y="104.0" font-size="13" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2</text>
<rect x="380" y="66" width="150" height="66" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="455.0" y="95.0" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">生成文件</text>
<text x="455.0" y="114.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">40,000 行/55 ms</text>
<circle cx="362" cy="99.0" r="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="362" y="104.0" font-size="13" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3</text>
<rect x="560" y="66" width="110" height="66" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="615.0" y="95.0" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">脱敏水印</text>
<text x="615.0" y="114.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">按角色</text>
<circle cx="542" cy="99.0" r="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="542" y="104.0" font-size="13" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">4</text>
<rect x="690" y="66" width="100" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="740.0" y="95.0" font-size="12.5" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">签名链接</text>
<text x="740.0" y="114.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">15 分钟</text>
<circle cx="672" cy="99.0" r="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="672" y="104.0" font-size="13" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">5</text>
<line x1="172" y1="99" x2="190" y2="99" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="198,99 190,99 192.9,105.1 192.9,92.9" fill="#94a3b8"/>
<line x1="352" y1="99" x2="370" y2="99" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="378,99 370,99 372.9,105.1 372.9,92.9" fill="#94a3b8"/>
<line x1="532" y1="99" x2="550" y2="99" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="558,99 550,99 552.9,105.1 552.9,92.9" fill="#94a3b8"/>
<line x1="672" y1="99" x2="680" y2="99" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="688,99 680,99 682.9,105.1 682.9,92.9" fill="#94a3b8"/>
<text x="40" y="172" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">到达 8 次/分、2 个 worker、单任务 12 s 的排队结果（本机仿真 60 分钟）</text>
<text x="40" y="205" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">不设上限</text>
<rect x="150" y="190" width="300" height="20" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="458" y="205" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p95 783.1 s</text>
<text x="40" y="239" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">队列上限 20</text>
<rect x="150" y="224" width="81" height="20" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="239" y="239" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p95 210.8 s</text>
<text x="40" y="273" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">队列上限 5</text>
<rect x="150" y="258" width="25" height="20" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="183" y="273" font-size="11.5" fill="#047857" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p95 66.1 s</text>
<text x="40" y="316" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">上限 5 的代价是 24.2% 的请求被直接拒（明确的 429），换来 p95 从 783 s 降到 66 s。</text>
<text x="40" y="340" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">「无限排队」不是更宽容：它把拒绝推迟到用户已经等了一刻钟之后。</text>
</svg>
