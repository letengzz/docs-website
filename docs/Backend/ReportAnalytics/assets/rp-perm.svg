<svg xmlns="http://www.w3.org/2000/svg" width="820" height="344" viewBox="0 0 820 344" role="img">
<title>图 7　过滤位置决定合计行是否可信</title>
<rect width="820" height="344" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 7　过滤位置决定合计行是否可信</text>
<text x="40" y="70" font-size="13" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">同一个用户、同一张报表，两种过滤位置给出两个合计</text>
<rect x="40" y="88" width="350" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="215.0" y="153.0" font-size="13.5" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">下推：先过滤再聚合</text>
<text x="62" y="128" font-size="12" fill="#065f46" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">WHERE owner IN (30 人)</text>
<text x="62" y="152" font-size="12" fill="#065f46" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">GROUP BY region → 合计 394,643,731</text>
<text x="62" y="176" font-size="12" fill="#065f46" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">明细和 = 合计（自洽）</text>
<rect x="430" y="88" width="350" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="605.0" y="153.0" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">事后裁剪：先聚合再筛行</text>
<text x="452" y="128" font-size="12" fill="#991b1b" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">GROUP BY region → 4 行全量</text>
<text x="452" y="152" font-size="12" fill="#991b1b" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">再按 owner 过滤 → 行没了，合计行留着</text>
<text x="452" y="176" font-size="12" fill="#991b1b" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">报表合计 1,814,179,432（4.60×）</text>
<rect x="40" y="232" width="740" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="410.0" y="259.0" font-size="13.5" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行列级权限的四个判定点</text>
<text x="410.0" y="278.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行：租户/机构/本人 · 列：敏感字段 · 单元格：脱敏 · 导出：同一套规则</text>
<text x="40" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">判据：任一报表的「合计行」必须能由它自己的明细行加总得到；做不到就是过滤位置错了。</text>
</svg>
