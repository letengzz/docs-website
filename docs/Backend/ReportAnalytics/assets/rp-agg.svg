<rect x="460" y="70" width="150" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="535.0" y="101.0" font-size="13.5" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">命中？</text>
<text x="535.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行数/跨度校验</text>
<circle cx="442" cy="105.0" r="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="442" y="110.0" font-size="13" fill="#6d28d9" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3</text>
<rect x="640" y="70" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
<text x="715.0" y="101.0" font-size="13.5" fill="#047857" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">输出</text>
<text x="715.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">带口径标签</text>
<circle cx="622" cy="105.0" r="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
