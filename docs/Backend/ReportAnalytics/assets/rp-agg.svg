<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img">
<title>图 6　预聚合命中与回退：命中率不是唯一指标</title>
<rect width="820" height="350" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">图 6　预聚合命中与回退：命中率不是唯一指标</text>
<rect x="30" y="70" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="115.0" y="101.0" font-size="13.5" fill="#475569" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">请求</text>
<text x="115.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">维度+过滤+时间</text>
