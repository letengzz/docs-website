<text x="330.0" y="120.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">按维度组合选表</text>
<circle cx="212" cy="105.0" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
