<path d="M535 142 L535 176 L360 176 L360 200" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 4"/>
<polygon points="360,208 360,200 366.1,202.9 353.9,202.9" fill="#b91c1c"/>
<text x="548" y="170" font-size="11" fill="#b91c1c" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">未命中：回退明细</text>
<rect x="230" y="208" width="380" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="420.0" y="234.0" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">回退明细查询（必须计数）</text>
<text x="420.0" y="253.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">回退率是一个可告警的数</text>
<rect x="30" y="208" width="170" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="115.0" y="234.0" font-size="13.5" fill="#b45309" font-weight="600" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存三档</text>
<text x="115.0" y="253.0" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结果 / 片段 / 无</text>
<text x="40" y="306" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三个必须落库的数：命中率、回退率、单次回退耗时。只记命中率 = 只记好消息。</text>
<text x="40" y="330" font-size="12" fill="#475569" font-weight="400" text-anchor="start" opacity="1.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存键必须带「权限范围 + 口径版本」，否则 A 看到的数会被 B 复用。</text>
</svg>
