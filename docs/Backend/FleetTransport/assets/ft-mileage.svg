<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" height="344" role="img" aria-label="里程：计划、实际、计费，三条线不会自己收敛">

<rect width="680" height="344" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">里程：计划、实际、计费，三条线不会自己收敛</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">本机 12,000 单：计划 4,088,357 km / GPS 4,381,457 km / 计费 4,272,333 km</text>
<text x="24" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">计划里程（路网最短）</text>
<rect x="60" y="100" width="464.58602272727273" height="18" rx="4" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="532.5860227272727" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b" text-anchor="start" font-weight="700">4,088,357</text>
<text x="24" y="142" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">GPS 累计（含绕行）</text>
<rect x="60" y="150" width="497.8928409090909" height="18" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="565.8928409090909" y="164" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">4,381,457</text>
<text x="24" y="192" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">计费里程（协议 = 计划×1.045）</text>
<rect x="60" y="200" width="485.49238636363634" height="18" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="553.4923863636363" y="214" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0d9488" text-anchor="start" font-weight="700">4,272,333</text>
<rect x="24" y="236" width="632" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">实际 ÷ 计划</text>
<text x="150" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">+7.17%</text>
<text x="230" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">绕行：P50 7.2%，P90 13.0%</text>
<text x="40" y="282" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">计费 ÷ 计划</text>
<text x="150" y="282" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0d9488" text-anchor="start" font-weight="700">+4.50%</text>
<text x="230" y="282" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">协议约定按计划里程加 4.5%</text>
<text x="40" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">计费 ÷ 实际</text>
<text x="150" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e11d48" text-anchor="start" font-weight="700">−2.49%</text>
<text x="230" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">按计费里程收款，比实际跑少 2.49%</text>
<text x="24" y="326" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">三者之间没有一个「正确值」——只有一个「合同约定的值」；三条都要存，差异做成里程差异表。</text>
</svg>
