<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="时效：同一个车队，三个「准时率」">

<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">时效：同一个车队，三个「准时率」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">差别不在司机，在缓冲——承诺 45 min / 计划 18 min / 预测 25 min</text>
<text x="24" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">对客承诺</text>
<text x="24" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">缓冲 45 min</text>
<rect x="150" y="80" width="400" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="150" y="80" width="372.0" height="26" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="560" y="98" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">93.0%</text>
<text x="24" y="154" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">调度计划</text>
<text x="24" y="172" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">缓冲 18 min</text>
<rect x="150" y="138" width="400" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="150" y="138" width="338.0" height="26" rx="5" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="560" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0d9488" text-anchor="start" font-weight="700">84.5%</text>
<text x="24" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">在途预测</text>
<text x="24" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">缓冲 25 min</text>
<rect x="150" y="196" width="400" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="150" y="196" width="332.0" height="26" rx="5" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="560" y="214" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">83.0%</text>
<rect x="24" y="258" width="632" height="60" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">晚点分布：2,655 单（22.1%）晚点，均值 35.9 min，P90 73 min</text>
<text x="40" y="300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">三个率之间没有谁对谁错；错的是把它们都叫「准时率」放进同一张考核表。</text>
</svg>
