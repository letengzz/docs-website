<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="装载：三个口径，两个装得下，一个装不下">

<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">装载：三个口径，两个装得下，一个装不下</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">4,691 个车次的本机读数：体积 81.2% / 载重 62.5% / 超载 12.6%</text>
<text x="24" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">体积装载率</text>
<rect x="210" y="78" width="300" height="22" rx="4" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="210" y="78" width="243.60000000000002" height="22" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="520" y="93" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">81.2%</text>
<text x="24" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">箱内还能塞，账面「装满」</text>
<text x="24" y="154" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">载重利用率</text>
<rect x="210" y="140" width="300" height="22" rx="4" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="210" y="140" width="187.5" height="22" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="520" y="155" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0d9488" text-anchor="start" font-weight="700">62.5%</text>
<text x="24" y="180" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">离 100% 还差 4.5 吨</text>
<text x="24" y="216" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">按体积装满后载重超限</text>
<rect x="210" y="202" width="300" height="22" rx="4" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="210" y="202" width="37.8" height="22" rx="4" fill="#e11d48" stroke="#e11d48" stroke-width="1"/>
<text x="520" y="217" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e11d48" text-anchor="start" font-weight="700">12.6%</text>
<text x="24" y="242" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">593 / 4,691 车次</text>
<rect x="24" y="268" width="632" height="52" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
<text x="40" y="290" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#115e59" text-anchor="start" font-weight="700">把「装满」定义成体积，是最常见的错</text>
<text x="40" y="308" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f766e" text-anchor="start" font-weight="400">57.9% 的车次里，体积与载重两个口径差超过 15 个百分点——只看一个必然误判</text>
</svg>
