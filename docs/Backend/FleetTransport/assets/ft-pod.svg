<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="回单：结算的唯一钥匙，也是最容易缺的那一把">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">回单：结算的唯一钥匙，也是最容易缺的那一把</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">缺回单不是「资料不全」，是「这笔钱暂时不能认」</text>
<rect x="24" y="92" width="88" height="56" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="68" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">已装车</text>
<text x="68" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="400">装</text>
<line x1="112" y1="120" x2="128" y2="120" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="160" y="92" width="88" height="56" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="204" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">已送达</text>
<text x="204" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="400">签</text>
<line x1="248" y1="120" x2="264" y2="120" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="296" y="92" width="88" height="56" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="700">回单有效</text>
<text x="340" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="400">存</text>
<line x1="384" y1="120" x2="400" y2="120" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="432" y="92" width="88" height="56" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="476" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="700">可开运费行</text>
<text x="476" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="400">算</text>
<line x1="520" y1="120" x2="536" y2="120" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="568" y="92" width="88" height="56" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="612" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">可进结算批</text>
<text x="612" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="400">结</text>
<rect x="24" y="176" width="300" height="140" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
<text x="40" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9f1239" text-anchor="start" font-weight="700">回单缺失的三种形态</text>
<text x="40" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#be123c" text-anchor="start" font-weight="400">· 电子回单未上传（8.05%）</text>
<text x="40" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#be123c" text-anchor="start" font-weight="400">· 纸质回单在途丢失（2.19%）</text>
<text x="40" y="268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#be123c" text-anchor="start" font-weight="400">· 签收数与件数不符（短签）</text>
<text x="40" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#9f1239" text-anchor="start" font-weight="700">→ 挂账 210 万元（按均单 2,176 元）</text>
<rect x="348" y="176" width="308" height="140" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="364" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">三个闸门（都在触发器里）</text>
<text x="364" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">1. 一单只能一条 VALID 回单</text>
<text x="364" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">2. 无有效回单不许开运费行</text>
<text x="364" y="268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">3. 回单 VOID 后运费行同步冻结</text>
<text x="364" y="290" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">4. 短签必须带 signed_qty</text>
</svg>
