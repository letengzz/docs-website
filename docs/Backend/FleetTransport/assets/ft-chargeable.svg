<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="计费重：max(实重, 体积 × 抛比) 里的那个抛比">

<rect width="680" height="330" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">计费重：max(实重, 体积 × 抛比) 里的那个抛比</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">同一批货、同一单价，只换抛比，计费重差 48.6%</text>
<text x="24" y="104" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">实重（过磅）</text>
<rect x="190" y="84" width="380" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="190" y="84" width="216.78911627906976" height="26" rx="5" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="580" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="700">49,063 t</text>
<text x="664" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="400">0</text>
<text x="24" y="158" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">1:6000 → 167 kg/m³</text>
<rect x="190" y="138" width="380" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="190" y="138" width="251.69432558139536" height="26" rx="5" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="580" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0d9488" text-anchor="start" font-weight="700">56,962 t</text>
<text x="664" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="400">+16.10%</text>
<text x="24" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">1:3000 → 333 kg/m³</text>
<rect x="190" y="192" width="380" height="26" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="190" y="192" width="356.9591860465116" height="26" rx="5" fill="#e11d48" stroke="#e11d48" stroke-width="1"/>
<text x="580" y="210" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e11d48" text-anchor="start" font-weight="700">80,786 t</text>
<text x="664" y="210" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="400">+64.66%</text>
<rect x="24" y="254" width="632" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
<text x="40" y="276" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9a3412" text-anchor="start" font-weight="700">71.9% 的票按 1:3000 判为泡货；而计费重只是「报价的基数」</text>
<text x="40" y="294" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="400">泡货越多，抛比这一行字越贵——它决定了 8,627 张票按体积而不是按过磅计费</text>
</svg>
