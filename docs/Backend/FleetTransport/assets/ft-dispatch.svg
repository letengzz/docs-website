<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-label="派车：五道闸门，顺序不能换">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="680" height="360" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">派车：五道闸门，顺序不能换</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">先筛「能不能拉」，再筛「谁去拉」，最后才比「谁便宜」</text>
<rect x="24" y="76" width="118" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="76" width="118" height="3" rx="1.5" fill="#2563eb"/>
<text x="34" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">① 车型匹配</text>
<text x="34" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">容积 / 载重 / 温控</text>
<text x="34" y="140" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">第 1 关</text>
<line x1="144" y1="114" x2="152" y2="114" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="154" y="76" width="118" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="154" y="76" width="118" height="3" rx="1.5" fill="#2563eb"/>
<text x="164" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">② 时窗匹配</text>
<text x="164" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">装货窗 + 送达窗</text>
<text x="164" y="140" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">第 2 关</text>
<line x1="274" y1="114" x2="282" y2="114" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="284" y="76" width="118" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="284" y="76" width="118" height="3" rx="1.5" fill="#d97706"/>
<text x="294" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">③ 司机合规</text>
<text x="294" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">驾照 / 连续 4h / 日累计</text>
<text x="294" y="140" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">第 3 关</text>
<line x1="404" y1="114" x2="412" y2="114" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="414" y="76" width="118" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="414" y="76" width="118" height="3" rx="1.5" fill="#0d9488"/>
<text x="424" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">④ 成本排序</text>
<text x="424" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">空驶距离 + 回程货源</text>
<text x="424" y="140" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">第 4 关</text>
<line x1="534" y1="114" x2="542" y2="114" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="544" y="76" width="118" height="76" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="544" y="76" width="118" height="3" rx="1.5" fill="#e11d48"/>
<text x="554" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">⑤ 锁车锁人</text>
<text x="554" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">唯一键 + 条件更新</text>
<text x="554" y="140" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">第 5 关</text>
<text x="24" y="190" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">实测：跳过第 3 关会发生什么</text>
<rect x="24" y="210" width="632" height="30" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="38" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">单段连续驾驶 &gt; 4 h</text>
<text x="400" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">27.7%</text>
<text x="490" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">1,107 / 4,000 车次</text>
<rect x="24" y="246" width="632" height="30" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="38" y="266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">日累计 &gt; 10 h</text>
<text x="400" y="266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">10.6%</text>
<text x="490" y="266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">423 / 4,000 车次</text>
<rect x="24" y="282" width="632" height="30" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="38" y="302" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">插入强制休息后每车次多耗</text>
<text x="400" y="302" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">0.87 h</text>
<text x="490" y="302" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">按 4h 休息 + 20min 计</text>
<text x="24" y="340" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#e11d48" text-anchor="start" font-weight="400">跳过第 5 关：两台调度同时派同一台车 → 一趟拉两单货，只有装车时才发现</text>
</svg>
