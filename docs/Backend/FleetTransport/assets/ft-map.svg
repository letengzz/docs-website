<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="专题地图：从一张委托单到一张运费账单">

<rect width="680" height="400" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">专题地图：从一张委托单到一张运费账单</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">上半圈是「这一车装了什么」，下半圈是「这一趟跑了多少、该收多少」</text>
<rect x="24" y="70" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="70" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="40" y="98" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">需求与计费重</text>
<text x="40" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">Demand</text>
<text x="40" y="138" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">抛比与三个重量</text>
<rect x="246" y="70" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="246" y="70" width="4" height="86" rx="2" fill="#2563eb"/>
<text x="262" y="98" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">配载与装载</text>
<text x="262" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">Loading</text>
<text x="262" y="138" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">体积 · 载重 · 轴荷</text>
<rect x="468" y="70" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="468" y="70" width="4" height="86" rx="2" fill="#0d9488"/>
<text x="484" y="98" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">派车与调度</text>
<text x="484" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">Dispatch</text>
<text x="484" y="138" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">车 · 人 · 时 · 钱</text>
<rect x="468" y="178" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="468" y="178" width="4" height="86" rx="2" fill="#0d9488"/>
<text x="484" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">在途与轨迹</text>
<text x="484" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">Tracking</text>
<text x="484" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">计划 / 实际 / 计费</text>
<rect x="246" y="178" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="246" y="178" width="4" height="86" rx="2" fill="#d97706"/>
<text x="262" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">签收与回单</text>
<text x="262" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">ProofOfDelivery</text>
<text x="262" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">回单是结算的钥匙</text>
<rect x="24" y="178" width="188" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="178" width="4" height="86" rx="2" fill="#d97706"/>
<text x="40" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">运费结算</text>
<text x="40" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">Settlement</text>
<text x="40" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">四段构成与对账</text>
<rect x="24" y="292" width="632" height="84" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="318" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">三个贯穿全链的数</text>
<text x="40" y="340" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">装了多少：计费重 / 装载率 / 轴荷</text>
<text x="264" y="340" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">跑了多少：计划里程 / GPS 里程 / 计费里程</text>
<text x="40" y="360" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">该收多少：基础运费 + 燃油 + 等待 − 扣款</text>
<text x="264" y="360" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">该花多少：重驶 + 空驶 + 人工 + 路桥</text>
</svg>
