<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-label="成本：空驶不是「浪费」，是一段有单价的里程">

<rect width="680" height="350" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">成本：空驶不是「浪费」，是一段有单价的里程</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">本机 4,381,457 km：重驶 71.0% / 空驶 29.0%，吨公里成本 1.162 元</text>
<text x="24" y="78" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">里程结构</text>
<rect x="24" y="88" width="632" height="30" rx="5" fill="#eef2f7" stroke="#eef2f7" stroke-width="1"/>
<rect x="24" y="88" width="448.71999999999997" height="30" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="40" y="108" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#ffffff" text-anchor="start" font-weight="700">重驶 3,110,834 km（71.0%）</text>
<text x="640" y="108" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b" text-anchor="end" font-weight="400">空驶 1,270,622 km（29.0%）</text>
<text x="24" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">成本四项（元，按本机规模折算）</text>
<text x="24" y="178" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">燃油（重驶 2.55 + 空驶 ×0.86）</text>
<rect x="300" y="164" width="285.2" height="16" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="593.2" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#2563eb" text-anchor="start" font-weight="700">8,556,000</text>
<text x="24" y="208" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">路桥（仅重驶 0.92）</text>
<rect x="300" y="194" width="95.4" height="16" rx="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="403.4" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0d9488" text-anchor="start" font-weight="700">2,862,000</text>
<text x="24" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">人工（按总里程 1.34）</text>
<rect x="300" y="224" width="195.7" height="16" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="503.7" y="236" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="700">5,871,000</text>
<text x="24" y="268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">其他（保险/维保/折旧）</text>
<rect x="300" y="254" width="72.10000000000001" height="16" rx="3" fill="#64748b" stroke="#64748b" stroke-width="1"/>
<text x="380.1" y="266" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">2,163,000</text>
<rect x="24" y="290" width="632" height="44" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
<text x="40" y="312" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#075985" text-anchor="start" font-weight="700">把空驶从 34.4%（单程直送）压到 7.8%（循环取货），同一批货的总里程降 28.6%</text>
<text x="40" y="328" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0369a1" text-anchor="start" font-weight="400">但循环取货会用时效换成本：每多一个点，末点到达时间往后推 25~40 分钟。</text>
</svg>
