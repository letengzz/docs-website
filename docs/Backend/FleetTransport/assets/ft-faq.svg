<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="排障：先问「哪一段的数不对」，再问「为什么」">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">排障：先问「哪一段的数不对」，再问「为什么」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">运输的工单 90% 是「数不对」，而四个数各有各的源头</text>
<rect x="252" y="66" width="176" height="44" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="1"/>
<text x="340" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">客户说：数不对</text>
<line x1="340" y1="110" x2="102" y2="158" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="24" y="158" width="156" height="62" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="102" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">吨位/件数不符</text>
<text x="102" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="400">查计费重与抛比</text>
<line x1="340" y1="110" x2="258" y2="158" stroke="#d97706" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="180" y="158" width="156" height="62" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="258" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">运费差几十块</text>
<text x="258" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="400">查燃油与等待费</text>
<line x1="340" y1="110" x2="414" y2="158" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="336" y="158" width="156" height="62" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="414" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">到货晚了</text>
<text x="414" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="400">查三口径时效</text>
<line x1="340" y1="110" x2="570" y2="158" stroke="#e11d48" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="492" y="158" width="156" height="62" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="570" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">结算被扣款</text>
<text x="570" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#e11d48" text-anchor="middle" font-weight="400">查回单与短签</text>
<text x="24" y="250" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">四个入口对应四张表，不要从「账单」开始查</text>
<text x="24" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">账单是四段金额的和：任何一段错，账单都对；任何一段缺证据，账单都不可复核。</text>
<text x="24" y="300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">顺序：回单 → 里程 → 计费重 → 附加费。回单缺失时后面三项都不用查，因为这笔钱本来就不该进本期。</text>
</svg>
