<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-label="同一趟车，九个数字，三套口径">

<rect width="680" height="348" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">同一趟车，九个数字，三套口径</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">装了多少 / 跑了多少 / 该收多少——每列三个数各有各的合法来源</text>
<rect x="24" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="68" width="200" height="34" rx="10" fill="#f8fafc"/>
<rect x="24" y="68" width="200" height="3" rx="1.5" fill="#2563eb"/>
<text x="124" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">装了多少</text>
<text x="38" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">实重（过磅）</text>
<text x="38" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">49,062.8 t</text>
<text x="210" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">路政 / 保险</text>
<text x="38" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">体积重 1:3000</text>
<text x="38" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">80,785.5 t</text>
<text x="210" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">商务报价</text>
<text x="38" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">体积重 1:6000</text>
<text x="38" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">56,962.4 t</text>
<text x="210" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">零担合同</text>
<rect x="38" y="236" width="172" height="32" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<text x="124" y="257" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">计费重差 48.6%</text>
<rect x="240" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="240" y="68" width="200" height="34" rx="10" fill="#f8fafc"/>
<rect x="240" y="68" width="200" height="3" rx="1.5" fill="#0d9488"/>
<text x="340" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">跑了多少</text>
<text x="254" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">计划里程</text>
<text x="254" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">4,088,357 km</text>
<text x="426" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">报价基准</text>
<text x="254" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">GPS 里程</text>
<text x="254" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">4,381,457 km</text>
<text x="426" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">成本核算</text>
<text x="254" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">计费里程</text>
<text x="254" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">4,272,333 km</text>
<text x="426" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">合同结算</text>
<rect x="254" y="236" width="172" height="32" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="257" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="700">计费比实际少 2.49%</text>
<rect x="456" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="456" y="68" width="200" height="34" rx="10" fill="#f8fafc"/>
<rect x="456" y="68" width="200" height="3" rx="1.5" fill="#d97706"/>
<text x="556" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">该收多少</text>
<text x="470" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">基础运费</text>
<text x="470" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">合同单价</text>
<text x="642" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">谈出来的</text>
<text x="470" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">附加费</text>
<text x="470" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">燃油 + 等待</text>
<text x="642" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">每天在变</text>
<text x="470" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">扣款</text>
<text x="470" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">短签 / 破损</text>
<text x="642" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400">要有证据</text>
<rect x="470" y="236" width="172" height="32" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
<text x="556" y="257" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">等待费漏报 39.5%</text>
<text x="24" y="312" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">九个数字里只有「基础运费」是谈出来的；其余八个都是算出来的，算错了不会报错。</text>
<text x="24" y="332" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">所以数据模型要存「原料」（实重、体积、三条里程），而不是只存「结果」。</text>
</svg>
