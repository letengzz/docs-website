<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="专题地图" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="560" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">专题地图：从一条需求，到一份能签的合同</text><rect x="40" y="70" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="70" width="5" height="130" rx="2" fill="#2563eb"/><text x="60" y="100" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">方法</text><text x="60" y="126" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">采购方式与限额</text><text x="60" y="150" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">规避招标的四种形状</text><text x="60" y="178" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Method/index.md</text><rect x="320" y="70" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="320" y="70" width="5" height="130" rx="2" fill="#2563eb"/><text x="340" y="100" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">文件</text><text x="340" y="126" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">资格条件与评分办法</text><text x="340" y="150" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">条件写进标书，竞争就被写死</text><text x="340" y="178" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Document/index.md</text><rect x="600" y="70" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="600" y="70" width="5" height="130" rx="2" fill="#d97706"/><text x="620" y="100" font-size="11" fill="#d97706" font-weight="700" text-anchor="start">时间</text><text x="620" y="126" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">公告、发售与澄清</text><text x="620" y="150" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">五个法定期限，两种日</text><text x="620" y="178" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Timeline/index.md</text><rect x="40" y="220" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="220" width="5" height="130" rx="2" fill="#d97706"/><text x="60" y="250" font-size="11" fill="#d97706" font-weight="700" text-anchor="start">投标</text><text x="60" y="276" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">递交、保证金与撤回</text><text x="60" y="300" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">钱先到，文件才算到</text><text x="60" y="328" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Bid/index.md</text><rect x="320" y="220" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="320" y="220" width="5" height="130" rx="2" fill="#dc2626"/><text x="340" y="250" font-size="11" fill="#dc2626" font-weight="700" text-anchor="start">开标</text><text x="340" y="276" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">解密、唱标与记录</text><text x="340" y="300" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">同一秒钟，两种时钟</text><text x="340" y="328" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Opening/index.md</text><rect x="600" y="220" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="600" y="220" width="5" height="130" rx="2" fill="#dc2626"/><text x="620" y="250" font-size="11" fill="#dc2626" font-weight="700" text-anchor="start">评标</text><text x="620" y="276" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">专家、打分与汇总</text><text x="620" y="300" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">去不去极值，冠军会换人</text><text x="620" y="328" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Evaluation/index.md</text><rect x="40" y="370" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="370" width="5" height="130" rx="2" fill="#059669"/><text x="60" y="400" font-size="11" fill="#059669" font-weight="700" text-anchor="start">定标</text><text x="60" y="426" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">公示、异议与合同</text><text x="60" y="450" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">三个 3 日、一个 30 日</text><text x="60" y="478" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Award/index.md</text><rect x="320" y="370" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="320" y="370" width="5" height="130" rx="2" fill="#7c3aed"/><text x="340" y="400" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="start">串标</text><text x="340" y="426" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">设备、报价与关系</text><text x="340" y="450" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">召回 65% 的规则看着很准</text><text x="340" y="478" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Collusion/index.md</text><rect x="600" y="370" width="260" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="600" y="370" width="5" height="130" rx="2" fill="#1f2937"/><text x="620" y="400" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">实战</text><text x="620" y="426" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">11 表 / 8 触发器 / 19 断言</text><text x="620" y="450" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">能被判定的才叫设计</text><text x="620" y="478" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">Practice/index.md</text><text x="40" y="540" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">阅读顺序：方法 → 文件 → 时间 → 投标 → 开标 → 评标 → 定标 → 串标 → 实战</text></svg>