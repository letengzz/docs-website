<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="七段链与失败是否安静" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="570" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">七段链：每一段都有自己的「成功定义」</text><rect x="40" y="66" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="94" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="99" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">1</text><text x="100" y="91" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">立</text><text x="122" y="110" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">确定采购方式与限额</text><rect x="596" y="79" width="72" height="30" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="632" y="99" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">显性</text><line x1="310" y1="122" x2="310" y2="136" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="136" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="164" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="169" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">2</text><text x="100" y="161" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">编</text><text x="122" y="180" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">资格条件 + 评分办法</text><rect x="596" y="149" width="72" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632" y="169" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="192" x2="310" y2="206" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="206" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="234" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="239" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">3</text><text x="100" y="231" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">发</text><text x="122" y="250" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">公告、发售、澄清</text><rect x="596" y="219" width="72" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632" y="239" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="262" x2="310" y2="276" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="276" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="304" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="309" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">4</text><text x="100" y="301" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">投</text><text x="122" y="320" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">递交、保证金、撤回</text><rect x="596" y="289" width="72" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632" y="309" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="332" x2="310" y2="346" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="346" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="374" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="379" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">5</text><text x="100" y="371" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">开</text><text x="122" y="390" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">解密、唱标、记录</text><rect x="596" y="359" width="72" height="30" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="632" y="379" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">显性</text><line x1="310" y1="402" x2="310" y2="416" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="416" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="444" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="449" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">6</text><text x="100" y="441" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">评</text><text x="122" y="460" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">抽取、打分、汇总</text><rect x="596" y="429" width="72" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632" y="449" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="472" x2="310" y2="486" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="486" width="540" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="514" r="15" fill="#eff6ff" stroke="#2563eb"/><text x="72" y="519" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">7</text><text x="100" y="511" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">定</text><text x="122" y="530" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">公示、异议、合同</text><rect x="596" y="499" width="72" height="30" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="632" y="519" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">显性</text><rect x="690" y="66" width="180" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="780" y="94" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">四段安静的失败</text><text x="780" y="120" font-size="13" fill="#dc2626" font-weight="600" text-anchor="middle">编 / 发 / 投 / 评</text><text x="780" y="148" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">不报错，只留偏差</text><text x="780" y="170" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">偏差在年度审计时才显形</text><text x="780" y="194" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">届时已无法追溯单笔</text><rect x="690" y="232" width="180" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="780" y="260" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">三段显性失败</text><text x="780" y="286" font-size="13" fill="#059669" font-weight="600" text-anchor="middle">立 / 开 / 定</text><text x="780" y="314" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">当场的冲突会拦住</text><text x="780" y="336" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">但「拦得对不对」</text><text x="780" y="358" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">是另一个问题</text></svg>