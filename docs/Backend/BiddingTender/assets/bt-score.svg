<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="评标汇总与价格分" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="420" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">两种汇总口径、一条价格分曲线</text><rect x="40" y="66" width="400" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="94" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">300 个项目：算术平均 vs 去掉最高最低</text><text x="60" y="124" font-size="14" fill="#dc2626" font-weight="700" text-anchor="start">第一名变化 13 / 300（4.33%）</text><text x="60" y="148" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">相邻名次分差 &lt; 0.10 分：117 / 2,306（5.07%）</text><text x="60" y="172" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">客观分复核不一致 238 / 2,606（9.13%）</text><text x="60" y="196" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">专家个人分偏离 &gt; 1.5σ：70 / 2,090（3.35%）</text><text x="60" y="228" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">4.33% 看起来小，但它是「同一批标书</text><text x="60" y="248" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">换一种加法就换一个中标人」</text><line x1="500" y1="250" x2="840" y2="250" stroke="#cbd5e1"/><line x1="500" y1="250" x2="500" y2="100" stroke="#cbd5e1"/><text x="670.0" y="60" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">价格分 = 基准价 / 投标价 × 30</text><polyline points="500.0,100.0 503.4,100.7 506.8,101.5 510.2,102.2 513.6,102.9 517.0,103.7 520.4,104.4 523.8,105.1 527.2,105.8 530.6,106.5 534.0,107.1 537.4,107.8 540.8,108.5 544.2,109.2 547.6,109.8 551.0,110.5 554.4,111.1 557.8,111.8 561.2,112.4 564.6,113.0 568.0,113.6 571.4,114.3 574.8,114.9 578.2,115.5 581.6,116.1 585.0,116.7 588.4,117.3 591.8,117.8 595.2,118.4 598.6,119.0 602.0,119.6 605.4,120.1 608.8,120.7 612.2,121.2 615.6,121.8 619.0,122.3 622.4,122.9 625.8,123.4 629.2,123.9 632.6,124.5 636.0,125.0 639.4,125.5 642.8,126.0 646.2,126.5 649.6,127.0 653.0,127.6 656.4,128.0 659.8,128.5 663.2,129.0 666.6,129.5 670.0,130.0 673.4,130.5 676.8,131.0 680.2,131.4 683.6,131.9 687.0,132.4 690.4,132.8 693.8,133.3 697.2,133.7 700.6,134.2 704.0,134.6 707.4,135.1 710.8,135.5 714.2,135.9 717.6,136.4 721.0,136.8 724.4,137.2 727.8,137.6 731.2,138.1 734.6,138.5 738.0,138.9 741.4,139.3 744.8,139.7 748.2,140.1 751.6,140.5 755.0,140.9 758.4,141.3 761.8,141.7 765.2,142.1 768.6,142.5 772.0,142.9 775.4,143.2 778.8,143.6 782.2,144.0 785.6,144.4 789.0,144.7 792.4,145.1 795.8,145.5 799.2,145.8 802.6,146.2 806.0,146.6 809.4,146.9 812.8,147.3 816.2,147.6 819.6,148.0 823.0,148.3 826.4,148.6 829.8,149.0 833.2,149.3 836.6,149.7 840.0,150.0" fill="none" stroke="#2563eb" stroke-width="2.5"/><line x1="500" y1="250" x2="500" y2="255" stroke="#cbd5e1"/><text x="500.0" y="270" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">0%</text><text x="500.0" y="92.0" font-size="10" fill="#2563eb" font-weight="" text-anchor="middle">30.00</text><line x1="568" y1="250" x2="568" y2="255" stroke="#cbd5e1"/><text x="568.0" y="270" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">+10%</text><text x="568.0" y="105.63636363636365" font-size="10" fill="#2563eb" font-weight="" text-anchor="middle">27.27</text><line x1="670" y1="250" x2="670" y2="255" stroke="#cbd5e1"/><text x="670.0" y="270" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">+25%</text><text x="670.0" y="122.0" font-size="10" fill="#2563eb" font-weight="" text-anchor="middle">24.00</text><line x1="840" y1="250" x2="840" y2="255" stroke="#cbd5e1"/><text x="840.0" y="270" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">+50%</text><text x="840.0" y="142.0" font-size="10" fill="#2563eb" font-weight="" text-anchor="middle">20.00</text><line x1="496" y1="250" x2="500" y2="250" stroke="#cbd5e1"/><text x="492" y="254.0" font-size="10" fill="#64748b" font-weight="" text-anchor="end">0</text><line x1="496" y1="200" x2="500" y2="200" stroke="#cbd5e1"/><text x="492" y="204.0" font-size="10" fill="#64748b" font-weight="" text-anchor="end">10</text><line x1="496" y1="150" x2="500" y2="150" stroke="#cbd5e1"/><text x="492" y="154.0" font-size="10" fill="#64748b" font-weight="" text-anchor="end">20</text><line x1="496" y1="100" x2="500" y2="100" stroke="#cbd5e1"/><text x="492" y="104.0" font-size="10" fill="#64748b" font-weight="" text-anchor="end">30</text><rect x="40" y="290" width="400" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="318" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">价格分不是线性的</text><text x="60" y="342" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">800 万基准价：880 万得 27.27 分，1,000 万得 24.00 分</text><text x="60" y="364" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">200 万价差 = 3.27 分；而技术分往往只差 1~2 分</text><text x="60" y="386" font-size="11" fill="#dc2626" font-weight="600" text-anchor="start">所以「价格权重 30」不等于「价格不决定胜负」</text></svg>