<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="围标串标识别规则的召回与精度" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="530" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">五条规则的召回与精度：没有一条同时高</text><rect x="40" y="66" width="820" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="300" y="92" width="10" height="10" rx="2" fill="#2563eb"/><text x="316" y="102" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">召回</text><rect x="370" y="92" width="10" height="10" rx="2" fill="#d97706"/><text x="386" y="102" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">精度</text><text x="60" y="128" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">同一 MAC 地址</text><rect x="300" y="114" width="324" height="12" rx="3" fill="#2563eb" opacity="0.85"/><text x="630.5" y="124" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">64.9%</text><rect x="300" y="130" width="500" height="12" rx="3" fill="#d97706" opacity="0.85"/><text x="806.0" y="140" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">100.0%</text><text x="60" y="180" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">同一文档创建者</text><rect x="300" y="166" width="500" height="12" rx="3" fill="#2563eb" opacity="0.85"/><text x="806.0" y="176" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">100.0%</text><rect x="300" y="182" width="224" height="12" rx="3" fill="#d97706" opacity="0.85"/><text x="530.5" y="192" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">44.9%</text><text x="60" y="232" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">同一 IP /24 网段</text><rect x="300" y="218" width="324" height="12" rx="3" fill="#2563eb" opacity="0.85"/><text x="630.5" y="228" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">64.9%</text><rect x="300" y="234" width="362" height="12" rx="3" fill="#d97706" opacity="0.85"/><text x="668.5" y="244" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">72.5%</text><text x="60" y="284" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">报价差异 &lt; 0.12%</text><rect x="300" y="270" width="494" height="12" rx="3" fill="#2563eb" opacity="0.85"/><text x="800.0" y="280" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">98.8%</text><rect x="300" y="286" width="227" height="12" rx="3" fill="#d97706" opacity="0.85"/><text x="533.0" y="296" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">45.4%</text><text x="60" y="336" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">MAC 或（创建者+雷同）</text><rect x="300" y="322" width="494" height="12" rx="3" fill="#2563eb" opacity="0.85"/><text x="800.0" y="332" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">98.8%</text><rect x="300" y="338" width="500" height="12" rx="3" fill="#d97706" opacity="0.85"/><text x="806.0" y="348" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">100.0%</text><text x="40" y="420" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">真串标 171 笔 = 45 组强信号（同机同人，111 笔）+ 30 组弱信号（异机同人，60 笔）</text><text x="40" y="444" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">只查 MAC：召回上限就是 64.9%，因为弱信号组不共享设备指纹</text><text x="40" y="466" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">加上「创建者」：召回 100%，精度掉到 44.9% —— 标书代做本身合法，同一个人做十份标书不是串标</text><text x="40" y="492" font-size="11" fill="#059669" font-weight="600" text-anchor="start">组合规则把两者相乘成「同机 + 同人」与「同人 + 报价雷同」两条分支：召回 98.8%、精度 100%</text><text x="40" y="514" font-size="11" fill="#059669" font-weight="600" text-anchor="start">结论：串标识别不是「找一条最准的规则」，是「让每条规则只在它能判的那一段发言」</text></svg>