<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="公告与时间轴" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="380" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">五个法定期限，落在两种「日」上</text><line x1="60" y1="150" x2="850" y2="150" stroke="#64748b" stroke-width="2"/><circle cx="60" cy="150" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="60" y="190" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">发售</text><text x="60" y="208" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">≥5 日</text><text x="60" y="226" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">条例 §16</text><line x1="60" y1="150" x2="60" y2="156" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/><circle cx="230" cy="150" r="7" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/><text x="230" y="90" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">发出→截止</text><text x="230" y="108" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">≥20 日</text><text x="230" y="126" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">招标投标法 §24</text><line x1="230" y1="150" x2="230" y2="102" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/><circle cx="420" cy="150" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="420" y="190" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">澄清/修改</text><text x="420" y="208" font-size="13" fill="#dc2626" font-weight="700" text-anchor="middle">≥15 日前</text><text x="420" y="226" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">条例 §21</text><line x1="420" y1="150" x2="420" y2="156" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/><circle cx="600" cy="150" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="90" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">截止＝开标</text><text x="600" y="108" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">同一时间</text><text x="600" y="126" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">法 §34</text><line x1="600" y1="150" x2="600" y2="102" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/><circle cx="720" cy="150" r="7" fill="#ffffff" stroke="#059669" stroke-width="2.5"/><text x="720" y="190" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">公示</text><text x="720" y="208" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">≥3 日</text><text x="720" y="226" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">条例 §54</text><line x1="720" y1="150" x2="720" y2="156" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/><circle cx="840" cy="150" r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><text x="840" y="90" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">签约</text><text x="840" y="108" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="middle">≤30 日</text><text x="840" y="126" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">法 §46</text><line x1="840" y1="150" x2="840" y2="102" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/><rect x="40" y="240" width="820" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="268" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">同一条公告的两种读法（本机按 2026 年国庆放假日历折算）</text><text x="60" y="294" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">2026-09-28 发公告 + 20 自然日 → 截止 2026-10-18，区间内只有 10 个工作日（含 7 天法定假日）</text><text x="60" y="318" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">若把「20 日」当成「20 个工作日」→ 截止 2026-10-26，比正确口径多给 5 个工作日</text><text x="60" y="344" font-size="12" fill="#dc2626" font-weight="600" text-anchor="start">本机 500 个项目：公告期折算不足 5 个工作日 25.60%；准备期不足 20 日 12.60%；澄清未顺延 26.40%</text></svg>