<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="投标保证金生命周期" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="390" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">保证金的一生：缴、持、退、扣</text><rect x="80" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="155" y="140" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">缴纳</text><text x="155" y="162" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">≤ 估算价 2%</text><rect x="300" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="375" y="140" font-size="15" fill="#d97706" font-weight="700" text-anchor="middle">持有</text><text x="375" y="162" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">占用投标人资金</text><rect x="520" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="595" y="140" font-size="15" fill="#059669" font-weight="700" text-anchor="middle">退还</text><text x="595" y="162" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">签约后 5 日内</text><rect x="740" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1"/><text x="815" y="140" font-size="15" fill="#dc2626" font-weight="700" text-anchor="middle">扣除</text><text x="815" y="162" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">撤销/违规情形</text><line x1="230" y1="145" x2="300" y2="145" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="450" y1="145" x2="520" y2="145" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="670" y1="145" x2="740" y2="145" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="220" width="820" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="248" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">本机读数（1,800 份投标 / 8,079 万元保证金）</text><text x="60" y="276" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">逾期退还 419 笔（23.28%），平均逾期 4.3 天，最长 27 天，累计资金占用 7,447.75 万元·天</text><text x="60" y="300" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">按 LPR 3.45% 折算：应付利息 7,039.66 元 —— 「忘了退」的成本不是零，只是不记账</text><text x="60" y="324" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">保函费率 1.5%/年、平均占用 60 天：保函费 199,211.23 元 vs 现金占用 7,447.75 万元·天</text><text x="60" y="350" font-size="11" fill="#2563eb" font-weight="400" text-anchor="start">条例 §57：退还保证金及银行同期存款利息；§35：撤回投标 5 日内退；§26：不得超过估算价 2%</text></svg>