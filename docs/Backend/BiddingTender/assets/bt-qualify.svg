<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="资格条件与竞争度" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="400" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">两条「本地」条件，把 40 家潜在投标人筛成 3.5 家</text><text x="60" y="78" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">4,000 家样本：逐条过滤后的通过率</text><rect x="60" y="96" width="320" height="34" rx="6" fill="#2563eb" opacity="0.18" stroke="#2563eb"/><text x="72" y="118" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">注册资本 ≥ 1000 万</text><text x="390.4" y="118" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">62.0%</text><rect x="60" y="142" width="247" height="34" rx="6" fill="#7c3aed" opacity="0.18" stroke="#7c3aed"/><text x="72" y="164" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">ISO9001</text><text x="317.48799999999994" y="164" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="start">44.6%</text><rect x="60" y="188" width="209" height="34" rx="6" fill="#d97706" opacity="0.18" stroke="#d97706"/><text x="72" y="210" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">近 3 年本地同类业绩 ≥ 3</text><text x="279.1" y="210" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">35.5%</text><rect x="60" y="234" width="97" height="34" rx="6" fill="#dc2626" opacity="0.18" stroke="#dc2626"/><text x="72" y="256" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">本地设有分公司</text><text x="167.296" y="256" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">8.9%</text><text x="60" y="288" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">最终通过 355 / 4,000 = 8.88% → 折算 40 家潜在投标人只剩 3.5 家</text><text x="60" y="310" font-size="12" fill="#059669" font-weight="600" text-anchor="start">去掉后两条（业绩与分公司）：1,750 / 4,000 = 43.75% → 17.5 家（4.93 倍）</text><rect x="600" y="78" width="260" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="720" y="104" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">后果：流标</text><text x="720" y="130" font-size="14" fill="#dc2626" font-weight="700" text-anchor="middle">严格条件 33.00%</text><text x="720" y="152" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">（400 次模拟，132 次投标人 &lt; 3）</text><text x="720" y="190" font-size="14" fill="#059669" font-weight="700" text-anchor="middle">放宽后 0.00%</text><text x="720" y="212" font-size="10" fill="#64748b" font-weight="" text-anchor="middle">（400 次模拟，0 次）</text><text x="720" y="250" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">投标人 &lt; 3 不得开标</text><text x="720" y="270" font-size="11" fill="#64748b" font-weight="" text-anchor="middle">（条例第四十四条）</text></svg>