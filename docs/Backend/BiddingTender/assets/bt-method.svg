<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="采购方式与限额" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="530" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">限额、方式与「化整为零」</text><rect x="40" y="66" width="380" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="94" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">16 号令第五条：单项合同估算价</text><rect x="60" y="120" width="200" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="68" y="138" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">施工</text><text x="270" y="138" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">400 万元</text><rect x="60" y="176" width="150" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="68" y="194" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">重要设备、材料</text><text x="270" y="194" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">200 万元</text><rect x="60" y="232" width="100" height="26" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="68" y="250" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">勘察、设计、监理</text><text x="270" y="250" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">100 万元</text><text x="60" y="306" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">合计达标同样必须招标——</text><text x="60" y="326" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">「同一项目中可以合并进行的采购」</text><text x="60" y="346" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">合计达到标准的，必须招标。</text><rect x="450" y="66" width="410" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="470" y="94" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">达到标准后的四种走向</text><circle cx="484" cy="128" r="5" fill="#059669"/><text x="500" y="133" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">公开招标</text><text x="500" y="152" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">默认路径</text><circle cx="484" cy="186" r="5" fill="#d97706"/><text x="500" y="191" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">邀请招标</text><text x="500" y="210" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">仅两种法定情形</text><circle cx="484" cy="244" r="5" fill="#2563eb"/><text x="500" y="249" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">竞争性磋商</text><text x="500" y="268" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">非依法必招项目</text><circle cx="484" cy="302" r="5" fill="#dc2626"/><text x="500" y="307" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">单一来源</text><text x="500" y="326" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">五种可不招标情形</text><text x="40" y="400" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">本机读数（1,351 条需求 / 36.64 亿元）：达标准 531 条（39.30%），其中 69 条（12.99%）未走公开招标，涉及 3.65 亿元</text><rect x="40" y="418" width="820" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="60" y="446" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">「化整为零」的判定不是看单笔金额，是看「能不能合并」</text><text x="60" y="470" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">同采购人 + 同品目 + 60 天窗 + 每包 ≥25% 限额 + 合计 ≥1.5×限额：命中 217 个窗口，组级召回 91.11%、窗口精度 63.59%</text><text x="60" y="492" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">同一批数据换成「≥3 包即算」的粗规则：窗口 253 个（大量重复）——窗口怎么切，比阈值定多少更影响结论</text></svg>