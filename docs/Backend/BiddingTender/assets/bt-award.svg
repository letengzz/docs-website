<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="定标、公示与合同" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="400" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">定标的三把时钟与一次「回头」</text><rect x="60" y="80" width="160" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="140" y="108" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">评标报告</text><text x="140" y="132" font-size="9" fill="#64748b" font-weight="" text-anchor="middle">评标委员会提交</text><rect x="250" y="80" width="160" height="78" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="330" y="108" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">公示候选人</text><text x="330" y="132" font-size="9" fill="#64748b" font-weight="" text-anchor="middle">收到报告 3 日内，公示 ≥3 日</text><rect x="470" y="80" width="160" height="78" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="550" y="108" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="middle">确定中标人</text><text x="550" y="132" font-size="9" fill="#64748b" font-weight="" text-anchor="middle">15 日内（地方规定）</text><rect x="690" y="80" width="160" height="78" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="770" y="108" font-size="14" fill="#059669" font-weight="700" text-anchor="middle">签合同</text><text x="770" y="132" font-size="9" fill="#64748b" font-weight="" text-anchor="middle">中标通知书发出 30 日内</text><line x1="220" y1="119" x2="248" y2="119" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="410" y1="119" x2="438" y2="119" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="630" y1="119" x2="658" y2="119" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><path d="M770,164 L770,186 L330,186 L330,164" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="550" y="206" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">异议 / 投诉：答复前暂停，可能回到公示甚至重评</text><rect x="40" y="230" width="820" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="258" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">本机读数（300 个项目）</text><text x="60" y="286" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">中标人放弃 12 个（4.00%）——顺延第二候选人时，价格与工期都要重新核</text><text x="60" y="310" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">中标价 ≠ 合同价 38 个（12.67%），合计差 −290,513.61 元（合同价整体略低于中标价）</text><text x="60" y="334" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">签约超过 30 日 34 个（11.33%）——合同一旦跨年，预算年度就对不上</text><text x="60" y="362" font-size="11" fill="#2563eb" font-weight="400" text-anchor="start">履约保证金上限 10%：1,000 万合同 = 100 万；按 5% = 50 万（条例 §58）</text></svg>