<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="开标与客户端时钟偏差" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="420" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">截止时刻：服务器时间说了算，客户端时间不算</text><line x1="60" y1="150" x2="840" y2="150" stroke="#64748b" stroke-width="2"/><line x1="450" y1="90" x2="450" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="450" y="82" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">投标截止 09:30:00</text><rect x="360" y="128" width="180" height="44" fill="#d97706" opacity="0.14"/><text x="450" y="198" font-size="11" fill="#d97706" font-weight="600" text-anchor="middle">截止前后各 300 秒：判定最脆弱的区间</text><text x="120" y="198" font-size="12" fill="#64748b" font-weight="" text-anchor="middle">已受理</text><text x="760" y="198" font-size="12" fill="#64748b" font-weight="" text-anchor="middle">拒收</text><rect x="40" y="230" width="400" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="258" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">本机读数：1,800 份投标</text><text x="60" y="284" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">迟到投标 49 笔（2.72%）</text><text x="60" y="306" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">客户端时钟偏差：中位 31.0 s，P95 90.9 s</text><text x="60" y="328" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">临界 128 笔中，改用客户端时间判定：</text><text x="60" y="350" font-size="13" fill="#dc2626" font-weight="700" text-anchor="start">误拒 14 笔（10.94%），误收 0 笔</text><text x="60" y="374" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">偏差是单向的：只会把准时说成迟到</text><rect x="460" y="230" width="400" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="480" y="258" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">解密与唱标</text><text x="480" y="284" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">解密失败 24 笔（1.33%）</text><text x="480" y="306" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">窗口内重试成功 60%，仍有 10 笔无法开标</text><text x="480" y="328" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">唱标价 ≠ 投标函价 14 笔（0.78%）</text><text x="480" y="352" font-size="12" fill="#dc2626" font-weight="600" text-anchor="start">两者都以投标函为准，但记录必须两份都留</text><text x="480" y="374" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">否则「当场没异议」会变成事后无据</text></svg>