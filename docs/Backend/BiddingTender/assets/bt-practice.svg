e="12" fill="#1f2937" font-weight="400" text-anchor="start">expert</text><text x="616" y="156" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">expert_assign</text><text x="616" y="190" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">score</text><rect x="320" y="300" width="260" height="108" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="336" y="326" font-size="12" fill="#059669" font-weight="700" text-anchor="start">定标段</text><text x="336" y="352" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">award</text><text x="336" y="386" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">contract</text><line x1="300" y1="110" x2="320" y2="110" stroke="#64748b" stroke-width="1.4" marker-end="url(#ahb)"/><line x1="580" y1="110" x2="600" y2="110" stroke="#64748b" stroke-width="1.4" marker-end="url(#ahb)"/><path d="M450,240 L450,300" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ahb)"/><text x="40" y="400" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">8 个触发器把「制度」写成「约束」：</text><circle cx="44" cy="414" r="3" fill="#059669"/><text x="56" y="418" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">截止后拒收</text><circle cx="44" cy="444" r="3" fill="#059669"/><text x="56" y="448" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">保证金超 2% 拒绝</text><circle cx="44" cy="474" r="3" fill="#059669"/><text x="56" y="478" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">分数越界拒绝</text><circle cx="44" cy="504" r="3" fill="#059669"/><text x="56" y="508" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">未解密不进评标</text><circle cx="464" cy="414" r="3" fill="#059669"/><text x="476" y="418" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">中标价＝投标价</text><circle cx="464" cy="444" r="3" fill="#059669"/><text x="476" y="448" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">中标人须属本项目</text><circle cx="464" cy="474" r="3" fill="#059669"/><text x="476" y="478" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">关联专家不入库</text><circle cx="464" cy="504" r="3" fill="#059669"/><text x="476" y="508" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">未公示不得签约</text><text x="40" y="500" font-size="12" fill="#059669" font-weight="600" text-anchor="start">19 条断言：C1~C11 不变量、N1~N7 负向必拒、P1 正例必放 —— 实测 PASS 19 / FAIL 0 / EXIT 0</text></svg>