<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img">
<title>四个对象：批次定义、运行实例、分区、判据</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四个对象：批次定义、运行实例、分区、判据</text>
<rect x="24" y="70" width="196" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="122.0" y="104.0" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">batch_job</text>
<text x="122.0" y="123.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">作业：谁负责、SLA 几点</text>
<rect x="24" y="160" width="196" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="122.0" y="194.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">batch_run</text>
<text x="122.0" y="213.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">一次运行：data_date + attempt</text>
<rect x="24" y="250" width="196" height="52" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="122.0" y="273.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">attempt 递增</text>
<text x="122.0" y="292.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">重跑只加一行，不改历史</text>
<line x1="220" y1="107" x2="262" y2="107" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="220" y1="197" x2="262" y2="197" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="262" y="70" width="220" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.0" y="104.0" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">job_dependency</text>
<text x="372.0" y="123.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">谁等谁：是有向图，不是链</text>
<rect x="262" y="160" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="372.0" y="194.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">partition_registry</text>
<text x="372.0" y="213.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">一行 = 一个 (job, data_date)</text>
<rect x="262" y="250" width="220" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="372.0" y="273.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">readiness_check</text>
<text x="372.0" y="292.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">一行 = 一条判据的结果</text>
<line x1="482" y1="197" x2="524" y2="197" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="524" y="70" width="156" height="74" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="602.0" y="104.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">state</text>
<text x="602.0" y="123.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">READY/EMPTY/BLOCKED</text>
<rect x="524" y="160" width="156" height="74" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="602.0" y="194.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">checksum</text>
<text x="602.0" y="213.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行数-金额，改了就变</text>
<rect x="524" y="250" width="156" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="602.0" y="273.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">water_mark</text>
<text x="602.0" y="292.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">max(业务时间)</text>
<rect x="700" y="70" width="156" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="778.0" y="104.0" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">batch_audit</text>
<text x="778.0" y="123.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">谁改了阈值、谁重跑</text>
<text x="24" y="326" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">「跑完了」是 batch_run 的事，「能用了」是 partition_registry 的事——把两者合成一个状态字段，是第一个错。</text>
<text x="24" y="352" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测：只有运行记录、没有分区登记时，下游能看到的只有「跑过」，看不到「这一天是空的」。</text>
<text x="24" y="378" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">attempt 只增不改：重跑必须新增一条，否则「上次跑成什么样」永久消失。</text>
</svg>
