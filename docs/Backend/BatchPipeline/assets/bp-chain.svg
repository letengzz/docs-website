<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img">
<title>七段链：定 → 触 → 跑 → 落 → 判 → 补 → 对</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="300" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">七段链：定 → 触 → 跑 → 落 → 判 → 补 → 对</text>
<rect x="24" y="86" width="106" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="77.0" y="131.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">定</text>
<text x="77.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">批次与数据日期</text>
<line x1="130" y1="134" x2="142" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="142" y="86" width="106" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="195.0" y="131.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">触</text>
<text x="195.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分区级依赖</text>
<line x1="248" y1="134" x2="260" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="260" y="86" width="106" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="313.0" y="131.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">跑</text>
<text x="313.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">一次运行一实例</text>
<line x1="366" y1="134" x2="378" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="378" y="86" width="106" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="431.0" y="131.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">落</text>
<text x="431.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">原子覆盖分区</text>
<line x1="484" y1="134" x2="496" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="496" y="86" width="106" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="549.0" y="131.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">判</text>
<text x="549.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四条判据有盲区</text>
<line x1="602" y1="134" x2="614" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="614" y="86" width="106" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="667.0" y="131.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">补</text>
<text x="667.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">按天级联推进</text>
<line x1="720" y1="134" x2="732" y2="134" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="732" y="86" width="106" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="785.0" y="131.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">对</text>
<text x="785.0" y="150.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四个数逐日核平</text>
<text x="24" y="216" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">链上任何一段都可以粗糙上线，只有「落」和「对」必须一次做对：落错分区没人报错，对不出来没人敢用。</text>
<text x="24" y="240" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">七段里最贵的是「判」——它决定的不是「跑没跑完」，而是「这一天的数据敢不敢给业务看」。</text>
<text x="24" y="264" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">「补」是唯一一段会把工作量乘起来的环节：改动 1 天，下游要重算 3 个分区。</text>
</svg>
