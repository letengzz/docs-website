<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img">
<title>三个日期：调度日、数据日、分区日</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三个日期：调度日、数据日、分区日</text>
<line x1="60" y1="200" x2="840" y2="200" stroke="#cbd5e1" stroke-width="1.6"/>
<line x1="60" y1="192" x2="60" y2="208" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="250" y1="192" x2="250" y2="208" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="440" y1="192" x2="440" y2="208" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="630" y1="192" x2="630" y2="208" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="820" y1="192" x2="820" y2="208" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="60" y="228" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">S-1 00:00</text>
<text x="250" y="228" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">S-1 23:00</text>
<text x="440" y="228" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">S 00:28</text>
<text x="630" y="228" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">S 02:00</text>
<text x="820" y="228" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">S 07:00</text>
<rect x="60" y="170" width="190" height="10" rx="4" fill="#ecfdf5" stroke="#0d9488" stroke-width="1"/>
<text x="155" y="160" font-size="10.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">数据日 S-1 的业务</text>
<circle cx="60" cy="200" r="5" fill="#0d9488"/>
<circle cx="250" cy="200" r="5" fill="#0d9488"/>
<circle cx="440" cy="200" r="5" fill="#2563eb"/>
<circle cx="630" cy="200" r="5" fill="#b45309"/>
<rect x="24" y="56" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="124.0" y="83.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">① 调度日 S</text>
<text x="124.0" y="102.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">02:00 触发这一次运行</text>
<rect x="244" y="56" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="344.0" y="83.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">② 数据日 S-1</text>
<text x="344.0" y="102.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">文件里装的是哪一天</text>
<rect x="464" y="56" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="564.0" y="83.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">③ 分区日 S-1</text>
<text x="564.0" y="102.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">写进哪个 dt，必须等于②</text>
<rect x="684" y="56" width="172" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="770.0" y="83.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">④ SLA 07:00</text>
<text x="770.0" y="102.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">下游要能开始取数</text>
<text x="24" y="262" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">① 与 ② 差 1 天是正常的（T+1）；② 与 ③ 差 1 天是 bug：数据对、分区错，那天的分区永远是空的。</text>
<text x="24" y="286" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测：取数日与分区日都用 date('now') 时，60 次运行全部 exit 0、真正读到数据 0 次。</text>
<text x="24" y="310" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">反过来「分区用 S、取数用 S-1」数据是对的，但每天都覆盖同一个 S 分区，S-1 分区永远缺。</text>
</svg>
