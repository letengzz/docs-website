<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img">
<title>任务级依赖与分区级依赖：差在哪一步</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">任务级依赖与分区级依赖：差在哪一步</text>
<rect x="24" y="62" width="150" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="99.0" y="90.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">ods_order</text>
<text x="99.0" y="109.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">09-10 分区 0 行</text>
<line x1="174" y1="93" x2="208" y2="93" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="208" y="62" width="150" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="283.0" y="90.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dwd_order</text>
<text x="283.0" y="109.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">任务 SUCCESS</text>
<line x1="358" y1="93" x2="392" y2="93" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="392" y="62" width="150" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="467.0" y="90.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dws_order_day</text>
<text x="467.0" y="109.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">产出 0 行</text>
<line x1="542" y1="93" x2="576" y2="93" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="576" y="62" width="150" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="651.0" y="90.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">ads_report_day</text>
<text x="651.0" y="109.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">报表 0 元</text>
<rect x="746" y="62" width="110" height="62" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="801.0" y="90.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结果</text>
<text x="801.0" y="109.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四层全绿</text>
<line x1="24" y1="150" x2="856" y2="150" stroke="#cbd5e1" stroke-width="1"/>
<rect x="24" y="168" width="150" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="99.0" y="198.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">ods_order</text>
<text x="99.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">state = EMPTY</text>
<line x1="174" y1="201" x2="208" y2="201" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="208" y="168" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="283.0" y="198.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dwd_order</text>
<text x="283.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">BLOCKED：不跑</text>
<rect x="392" y="168" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="467.0" y="198.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dws_order_day</text>
<text x="467.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">BLOCKED：不跑</text>
<rect x="576" y="168" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="651.0" y="198.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">ads_report_day</text>
<text x="651.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">BLOCKED：不跑</text>
<rect x="746" y="168" width="110" height="66" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="801.0" y="198.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结果</text>
<text x="801.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">停在源头</text>
<text x="24" y="268" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">上排：依赖边上传的是「上游任务成没成功」。0 行也是一种成功，于是 0 元一路穿过四层，每一层都是绿色。</text>
<text x="24" y="292" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">下排：依赖边上传的是「这一天这个分区能不能用」。EMPTY 也是显式登记的状态，下游据此停在 BLOCKED。</text>
<text x="24" y="316" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">差别不在 DAG 怎么画，而在依赖边上传递的是「状态」还是「分区」——后者要多一张表，也要多一条判据。</text>
</svg>
