<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img">
<title>07:00 之前的预算：到达 + 轮询 + 计算</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="300" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">07:00 之前的预算：到达 + 轮询 + 计算</text>
<rect x="40" y="90" width="800" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="40" y="90" width="118" height="46" fill="#eff6ff" stroke="#2563eb"/>
<rect x="158" y="90" width="86" height="46" fill="#fffbeb" stroke="#b45309"/>
<rect x="244" y="90" width="200" height="46" fill="#ecfdf5" stroke="#0d9488"/>
<text x="99" y="118" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">到达 31 min</text>
<text x="201" y="118" font-size="11" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">轮询 30</text>
<text x="344" y="118" font-size="11" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">计算 75 min</text>
<text x="470" y="118" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">← 中位就绪 136 min（02:16）</text>
<line x1="740" y1="72" x2="740" y2="150" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="746" y="68" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">07:00 SLA</text>
<rect x="40" y="162" width="700" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="56" y="184" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">尾部 10% 的日子：上游 05:00 之后才到 → 就绪 08:00 之后，直接超 SLA</text>
<text x="24" y="226" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测 60 天里超 SLA 8 天。把计算提速 50% 救回 2 天；把轮询改成事件驱动（省 30 min）救回 0 天——</text>
<text x="24" y="250" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">因为那 8 天里最小的超标幅度是 35 min，30 min 的优化落在门槛以下。</text>
<text x="24" y="274" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">预算要按「最差那天」算，不是按中位数算；中位数只告诉你平常几点能出门。</text>
</svg>
