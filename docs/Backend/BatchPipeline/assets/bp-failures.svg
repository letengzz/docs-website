<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img">
<title>五个安静的失败：面板全是绿的</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">五个安静的失败：面板全是绿的</text>
<rect x="24" y="62" width="300" height="42" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="174.0" y="87.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">空分区当成成功</text>
<text x="344" y="89" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">60 次 exit 0，其中 6 次真读到 0 行</text>
<rect x="24" y="112" width="300" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="174.0" y="137.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分区落错一天</text>
<text x="344" y="139" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">每天覆盖同一个分区，被覆盖那天永久空白</text>
<rect x="24" y="162" width="300" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="174.0" y="187.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">追加而不是覆盖</text>
<text x="344" y="189" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1,916 行 → 5,748 行（3.0×）</text>
<rect x="24" y="212" width="300" height="42" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="174.0" y="237.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缺的天不是 0 是不存在</text>
<text x="344" y="239" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">10 月只有 24 天，日均高 29.17%</text>
<rect x="24" y="262" width="300" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="174.0" y="287.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">重跑没带走下游</text>
<text x="344" y="289" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dwd 差 1,916 行，ads 仍是旧值</text>
<text x="24" y="322" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">五个的共同点：接口 200、报表能打开、调度面板全绿——只有对账或复核才会暴露。</text>
<text x="24" y="344" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">其中前两条最贵：它们不改任何数字，只让「某一天」这个维度悄悄错位。</text>
</svg>
