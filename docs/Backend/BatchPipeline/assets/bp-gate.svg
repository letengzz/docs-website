<text x="24" y="374" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四条并列写进门禁，任何一条不过就停在 BLOCKED——门禁的价值在「不许过」，不在「尽量过」。</text>
