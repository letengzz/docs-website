<text x="300" y="62" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行数</text>
<text x="470" y="62" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">金额（分）</text>
