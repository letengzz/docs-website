<text x="300" y="101" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">106,747 行</text>
<text x="470" y="101" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">48,021,023,529</text>
<rect x="24" y="128" width="250" height="46" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="149.0" y="155.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dws_order_day</text>
<text x="300" y="157" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">106,747 行</text>
<text x="470" y="157" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">48,021,023,529</text>
<rect x="24" y="184" width="250" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="149.0" y="211.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dwd_order（重跑一天）</text>
<text x="300" y="213" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">108,663 行</text>
<text x="470" y="213" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">48,880,128,268</text>
<rect x="24" y="240" width="250" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="267.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">ods_order</text>
<text x="300" y="269" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">106,747 行</text>
<text x="470" y="269" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">48,021,023,529</text>
<text x="650" y="100" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">差额 1,916 行</text>
<text x="650" y="122" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">859,104,739 分</text>
<text x="650" y="152" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">正好等于被重跑的</text>
<text x="650" y="174" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">那一天</text>
<text x="24" y="314" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三个数各自都能自证：ods 说源就是这样，dwd 说表里就有这么多，ads 说按分区汇总就这个数。</text>
<text x="24" y="340" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">对账不是「让四个数相等」，而是「让任意两个数的差都能被一句话解释」——解释不了的那个差，就是下一个事故。</text>
</svg>
