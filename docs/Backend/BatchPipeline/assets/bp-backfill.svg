<text x="817.0" y="217.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分区</text>
<text x="24" y="258" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测：ods_order 一个分区改动牵连 3 个下游节点——补 1 天 = 3 个分区，补 7 天 = 21 个，补 30 天 = 90 个。</text>
<text x="24" y="282" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">串行跑 30 个分区 113.6 ms，5 线程并行 153.5 ms（0.74×）：补数不是「并行就快」，单写者会把并行变慢。</text>
<text x="24" y="306" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">所以补数必须先算「这次改动要重算多少个分区」，再决定窗口与限流，而不是先点「全量重跑」。</text>
