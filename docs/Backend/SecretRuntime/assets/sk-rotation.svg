<text x="44" y="288" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">SELECT COUNT(*) FROM service_instance</text>
<text x="44" y="306" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">WHERE active_version &lt; :new  → 必须为 0</text>
<rect x="444" y="244" width="408" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="460" y="266" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">并发轮换必须 CAS</text>
<text x="460" y="288" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">无条件下 10,000 次里 3,480 次（34.8%）</text>
<text x="460" y="306" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">丢更新；WHERE version = :old 后为 0</text>
