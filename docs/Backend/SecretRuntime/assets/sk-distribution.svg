<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img">
<title>缓存 TTL 是安全参数：吊销后还有多少请求用旧密钥</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="330" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存 TTL 是安全参数：吊销后还有多少请求用旧密钥</text>
<text x="28" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">20 万请求/天（2.3148 rps），KMS 调用量与吊销残留同时随 TTL 变化</text>
<rect x="28" y="80" width="262" height="176" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="44" y="108" font-size="15" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">TTL = 30 s</text>
<text x="44" y="136" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">KMS 调用/天</text>
<text x="274" y="136" font-size="14" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2,880</text>
<text x="44" y="166" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存命中率</text>
<text x="274" y="166" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">98.56%</text>
<line x1="44" y1="180" x2="274" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="206" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">吊销后残留请求</text>
<text x="274" y="206" font-size="18" fill="#0d9488" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">69</text>
<text x="44" y="232" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">占总请求</text>
<text x="274" y="232" font-size="13" fill="#0d9488" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">0.0345%</text>
<rect x="310" y="80" width="262" height="176" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="326" y="108" font-size="15" fill="#2563eb" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">TTL = 300 s</text>
<text x="326" y="136" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">KMS 调用/天</text>
<text x="556" y="136" font-size="14" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">288</text>
<text x="326" y="166" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存命中率</text>
<text x="556" y="166" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">99.856%</text>
<line x1="326" y1="180" x2="556" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="326" y="206" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">吊销后残留请求</text>
<text x="556" y="206" font-size="18" fill="#2563eb" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">694</text>
<text x="326" y="232" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">占总请求</text>
<text x="556" y="232" font-size="13" fill="#2563eb" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">0.347%</text>
<rect x="592" y="80" width="262" height="176" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="608" y="108" font-size="15" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">TTL = 3600 s</text>
<text x="608" y="136" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">KMS 调用/天</text>
<text x="838" y="136" font-size="14" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">24</text>
<text x="608" y="166" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存命中率</text>
<text x="838" y="166" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">99.988%</text>
<line x1="608" y1="180" x2="838" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="608" y="206" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">吊销后残留请求</text>
<text x="838" y="206" font-size="18" fill="#b91c1c" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">8,333</text>
<text x="608" y="232" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">占总请求</text>
<text x="838" y="232" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">4.1665%</text>
<rect x="28" y="274" width="824" height="42" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="44" y="292" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">命中率 99.988% 看起来最漂亮，代价是 4.1665% 的请求在吊销后仍能用旧密钥。</text>
<text x="44" y="310" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结论：TTL 与并行期都要按「吊销窗口」评审，不能只看性能曲线。</text>
</svg>
