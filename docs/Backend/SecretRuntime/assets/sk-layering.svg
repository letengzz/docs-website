<text x="676" y="222" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">第几版（关键）</text>
<rect x="28" y="244" width="196" height="50" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
<text x="40" y="265" font-size="12" fill="#2563eb" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">alg / nonce</text>
<text x="40" y="284" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">算法与随机数</text>
