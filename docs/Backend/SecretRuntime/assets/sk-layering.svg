<text x="252" y="284" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">被包装的 DEK</text>
<rect x="452" y="244" width="196" height="50" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
