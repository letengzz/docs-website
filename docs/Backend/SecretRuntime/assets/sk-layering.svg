<text x="676" y="265" font-size="12" fill="#2563eb" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">tag</text>
<text x="676" y="284" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">完整性校验</text>
<rect x="28" y="306" width="824" height="28" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="440" y="325" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">少了 kek_version：12 个版本下 20 万条密文只有 16,750 条可解（失败 91.625%）</text>
</svg>
