<text x="40" y="222" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">识别格式</text>
<rect x="240" y="182" width="196" height="50" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/>
