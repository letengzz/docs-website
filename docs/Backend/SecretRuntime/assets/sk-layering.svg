<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img">
<title>信封加密：KEK 只包 DEK，密文头把版本写死</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="340" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">信封加密：KEK 只包 DEK，密文头把版本写死</text>
<rect x="28" y="70" width="210" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="44" y="96" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">KEK（主密钥）</text>
<text x="44" y="118" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">留在 KMS / HSM，永不落盘</text>
<text x="44" y="138" font-size="11" fill="#2563eb" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">状态：ACTIVE / DECRYPT_ONLY</text>
<rect x="288" y="70" width="230" height="84" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="304" y="96" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">DEK（数据密钥）</text>
<text x="304" y="118" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">每份数据一把，被 KEK 包装</text>
<text x="304" y="138" font-size="11" fill="#0d9488" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">进程内缓存，TTL 决定吊销窗口</text>
<rect x="568" y="70" width="284" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="584" y="96" font-size="14" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">密文（自描述）</text>
<text x="584" y="118" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">magic | format_version | key_id</text>
<text x="584" y="138" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">kek_version | nonce | tag | data</text>
