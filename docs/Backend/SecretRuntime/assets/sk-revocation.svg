<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img">
<title>吊销传播：从「点了吊销」到「真的不能用」</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="320" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">吊销传播：从「点了吊销」到「真的不能用」</text>
<line x1="50" y1="130" x2="830" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="50" cy="130" r="7" fill="#2563eb"/>
<text x="50" y="108" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">签发</text>
<text x="50" y="154" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">credential</text>
<circle cx="210" cy="130" r="7" fill="#2563eb"/>
<text x="210" y="108" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">泄露</text>
<text x="210" y="154" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">detection lag 14d</text>
<circle cx="390" cy="130" r="7" fill="#2563eb"/>
<text x="390" y="108" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">点吊销</text>
<text x="390" y="154" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">revoke_event</text>
<circle cx="570" cy="130" r="7" fill="#2563eb"/>
<text x="570" y="108" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">传播</text>
<text x="570" y="154" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">主动失效 / 自省</text>
<circle cx="750" cy="130" r="7" fill="#2563eb"/>
<text x="750" y="108" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">真失效</text>
<text x="750" y="154" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存全过期</text>
<rect x="50" y="182" width="330" height="96" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="66" y="206" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">被动过期（只等 TTL）</text>
<text x="66" y="230" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3600s → 8,333 次请求仍可用（4.1665%）</text>
<text x="66" y="252" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">300s → 694 次；30s → 69 次</text>
<text x="66" y="270" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">「吊销完成」没有可判定定义</text>
<rect x="400" y="182" width="430" height="96" rx="6" fill="#ecfdf5" stroke="#0d9488" stroke-width="1"/>
<text x="416" y="206" font-size="12" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">主动失效 + 双时间戳</text>
<text x="416" y="230" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">revoke_event(revoked_at, propagated_at)</text>
<text x="416" y="252" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">推送失效 / 令牌自省 / 短路清单三选一或组合</text>
<text x="416" y="270" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">完成判据：所有使用点回执 + 缓存最晚时刻已过</text>
<rect x="28" y="290" width="824" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="440" y="307" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">凭据吊销 ≠ KEK 版本禁用：后者会让所有历史密文同时失效</text>
</svg>
