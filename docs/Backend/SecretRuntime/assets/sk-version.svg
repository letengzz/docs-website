<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img">
<title>版本绑定：密文自己说清用了哪一版</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="320" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">版本绑定：密文自己说清用了哪一版</text>
<rect x="28" y="70" width="400" height="190" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="48" y="100" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">方案 A：外部映射表 / 用「当前版本」解</text>
<text x="48" y="128" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">密文里没有版本号</text>
<text x="48" y="152" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">轮换后 current = v12</text>
<rect x="48" y="166" width="360" height="34" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
<text x="64" y="189" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">可解 16,750 / 200,000 → 失败 91.625%</text>
<text x="48" y="226" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">失败是安静的：老数据直到被读才报错</text>
<text x="48" y="246" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">且轮换当天监控全绿</text>
<rect x="452" y="70" width="400" height="190" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="472" y="100" font-size="13" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">方案 B：密文头自带 key_id + version</text>
<text x="472" y="128" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">解密时按密文里的版本取 KEK</text>
<text x="472" y="152" font-size="11.5" fill="#0f172a" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">旧版本保持 DECRYPT_ONLY</text>
<rect x="472" y="166" width="360" height="34" rx="5" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="488" y="189" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">可解 200,000 / 200,000 → 失败 0%</text>
<text x="472" y="226" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">按 key_version 建索引：11.514 → 0.5389 ms</text>
<text x="472" y="246" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">快 21.4×，泄露后能圈定影响面</text>
<line x1="428" y1="165" x2="452" y2="165" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="28" y="278" width="824" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="440" y="298" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">并发轮换还要 CAS：无条件下 34.8% 丢失更新 → 条件更新后 0</text>
</svg>
