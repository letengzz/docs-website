<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">身份从 ServiceAccount 到 SPIFFE ID 再到证书</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">mTLS 证明「你是谁」，授权决定「你能做什么」，两者不可互替</text>
  <rect x="26" y="78" width="200" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="126" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">Kubernetes 身份</text>
  <text x="126" y="113" text-anchor="middle" font-size="7.5" fill="#334155">ServiceAccount</text>
  <text x="126" y="130.25" text-anchor="middle" font-size="7.5" fill="#334155">默认 default ← 大坑</text>
  <rect x="262" y="78" width="236" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">SPIFFE ID</text>
  <text x="380" y="113" text-anchor="middle" font-size="7.5" fill="#6D28D9">spiffe://cluster.local</text>
  <text x="380" y="130.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">/ns/&lt;ns&gt;/sa/&lt;sa&gt;</text>
  <rect x="534" y="78" width="200" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="634" y="96.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">X.509 证书</text>
  <text x="634" y="113" text-anchor="middle" font-size="7.5" fill="#B91C1C">默认 24h</text>
  <text x="634" y="130.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">过期即 mTLS 失败</text>
  <line x1="226" y1="109" x2="258" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="498" y1="109" x2="530" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="160" text-anchor="middle" font-size="8.5" fill="#475569">信任根：自签 10 年，或接入外部 CA（Vault / cert-manager）</text>
  <rect x="26" y="180" width="224" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="138" y="198.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">PERMISSIVE（默认）</text>
  <text x="138" y="215" text-anchor="middle" font-size="7.5" fill="#B45309">明文 + mTLS 都收</text>
  <text x="138" y="232.25" text-anchor="middle" font-size="7.5" fill="#B45309">迁移期用</text>
  <rect x="266" y="180" width="224" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="378" y="198.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">STRICT</text>
  <text x="378" y="215" text-anchor="middle" font-size="7.5" fill="#047857">只收 mTLS</text>
  <text x="378" y="232.25" text-anchor="middle" font-size="7.5" fill="#047857">稳定期必须切</text>
  <rect x="506" y="180" width="224" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="618" y="198.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">DISABLE</text>
  <text x="618" y="215" text-anchor="middle" font-size="7.5" fill="#334155">完全不启用</text>
  <text x="618" y="232.25" text-anchor="middle" font-size="7.5" fill="#334155">特例端口</text>
  <text x="380" y="262" text-anchor="middle" font-size="8.5" fill="#334155">PeerAuthentication 三模式：作用域 网格 → 命名空间 → 工作负载，越具体优先级越高</text>
  <rect x="26" y="280" width="344" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="198" y="298.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">ALLOW：出现即默认拒绝</text>
  <text x="198" y="315" text-anchor="middle" font-size="7.5" fill="#1D4ED8">没被允许的请求全部 403</text>
  <text x="198" y="332.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">principals 不带 spiffe:// 前缀</text>
  <rect x="390" y="280" width="344" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="562" y="298.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">DENY：永远优先</text>
  <text x="562" y="315" text-anchor="middle" font-size="7.5" fill="#B91C1C">与书写顺序无关</text>
  <text x="562" y="332.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">适合「先禁掉已知坏来源」</text>
  <text x="380" y="396" text-anchor="middle" font-size="9" fill="#1E293B">四层叠加才完整：NetworkPolicy（可达）→ mTLS（身份）→ 授权（服务级）→ 网关（用户级）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
