<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四个问题如何收敛成一次选型决策</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">问题①决定「要不要」，问题②③④决定「做多深」</text>
  <rect x="30" y="84" width="246" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="153" y="102.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">① 凭什么互信</text>
  <text x="153" y="119" text-anchor="middle" font-size="7.5" fill="#B91C1C">内网 / IP 白名单（现状）</text>
  <rect x="30" y="150" width="246" height="54" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="153" y="168.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">② 多久失败</text>
  <text x="153" y="185" text-anchor="middle" font-size="7.5" fill="#C2410C">超时靠框架默认（现状）</text>
  <rect x="30" y="216" width="246" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="153" y="234.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 谁调了谁</text>
  <text x="153" y="251" text-anchor="middle" font-size="7.5" fill="#B45309">只有入口日志（现状）</text>
  <rect x="30" y="282" width="246" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="153" y="300.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">④ 不改代码切流</text>
  <text x="153" y="317" text-anchor="middle" font-size="7.5" fill="#1D4ED8">灰度要发版（现状）</text>
  <rect x="430" y="84" width="300" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="580" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">只缺 ①：最小形态</text>
  <text x="580" y="119" text-anchor="middle" font-size="7.5" fill="#047857">ambient 不开 waypoint</text>
  <text x="580" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">只拿 mTLS + 四层授权</text>
  <text x="580" y="153.5" text-anchor="middle" font-size="7.5" fill="#047857">代价最小、风险最低</text>
  <rect x="430" y="196" width="300" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="580" y="214.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">缺 2 项以上：L7 形态</text>
  <text x="580" y="231" text-anchor="middle" font-size="7.5" fill="#C2410C">waypoint + 路由/重试/灰度</text>
  <text x="580" y="248.25" text-anchor="middle" font-size="7.5" fill="#C2410C">要算跳数与 waypoint 容量</text>
  <text x="580" y="265.5" text-anchor="middle" font-size="7.5" fill="#C2410C">治理规则要有人 review</text>
  <rect x="430" y="308" width="300" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="580" y="326.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">都不缺：先别装</text>
  <text x="580" y="343" text-anchor="middle" font-size="7.5" fill="#334155">框架内治理 + SDK 已够</text>
  <text x="580" y="360.25" text-anchor="middle" font-size="7.5" fill="#334155">固定成本摊不薄</text>
  <text x="580" y="377.5" text-anchor="middle" font-size="7.5" fill="#334155">等真痛点出现再上</text>
  <line x1="278" y1="111" x2="426" y2="132" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="278" y1="177" x2="426" y2="150" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="278" y1="243" x2="426" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="278" y1="309" x2="426" y2="186" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="352" y="366" text-anchor="middle" font-size="8" fill="#475569">同一套判断，四种落点</text>
  <text x="380" y="408" text-anchor="middle" font-size="9.5" fill="#1E293B">判据：先写「我缺什么」清单，再选形态——不是先选产品再找理由</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
