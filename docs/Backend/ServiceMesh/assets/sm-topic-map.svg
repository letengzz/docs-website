  <text x="116" y="111" text-anchor="middle" font-size="7.5" fill="#B91C1C">内网 / IP 白名单</text>
  <rect x="212" y="76" width="168" height="54" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
