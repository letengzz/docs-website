  <text x="296" y="111" text-anchor="middle" font-size="7.5" fill="#C2410C">超时靠框架默认</text>
  <rect x="392" y="76" width="168" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="476" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 谁调了谁</text>
  <text x="476" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">只有入口日志</text>
  <rect x="572" y="76" width="168" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="656" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">④ 不改代码切流</text>
  <text x="656" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">灰度要发版</text>
  <line x1="116" y1="148" x2="644" y2="148" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="180" y="168" width="400" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="186.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">五档成熟度  L0 → L4</text>
  <text x="380" y="203" text-anchor="middle" font-size="7.5" fill="#6D28D9">L0 无治理 · L1 框架内 · L2 仅 L4 · L3 含 L7 · L4 有成本账</text>
