  <line x1="296" y1="132" x2="296" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="476" y1="132" x2="476" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="656" y1="132" x2="656" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="148" x2="380" y2="166" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="28" y="254" width="224" height="68" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="140" y="272.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">选型与形态</text>
