  <text x="380" y="289" text-anchor="middle" font-size="7.5" fill="#B91C1C">Identity：SPIFFE + mTLS</text>
  <text x="380" y="306.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">PeerAuthentication / Policy</text>
  <rect x="508" y="254" width="224" height="68" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="620" y="272.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">流量治理</text>
  <text x="620" y="289" text-anchor="middle" font-size="7.5" fill="#C2410C">Traffic：路由优先级</text>
  <text x="620" y="306.25" text-anchor="middle" font-size="7.5" fill="#C2410C">超时预算 / 重试放大</text>
  <rect x="28" y="338" width="224" height="68" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="140" y="356.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">观测与性能</text>
  <text x="140" y="373" text-anchor="middle" font-size="7.5" fill="#0F766E">Observability：基数</text>
  <text x="140" y="390.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Performance：每跳与每 Pod</text>
  <rect x="268" y="338" width="224" height="68" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="356.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">故障与迁移</text>
  <text x="380" y="373" text-anchor="middle" font-size="7.5" fill="#B45309">Failure：四类爆炸半径</text>
  <text x="380" y="390.25" text-anchor="middle" font-size="7.5" fill="#B45309">Migration：双栈与回退</text>
  <rect x="508" y="338" width="224" height="68" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="620" y="356.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">实战与 FAQ</text>
  <text x="620" y="373" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Practice：kind 全链路</text>
  <text x="620" y="390.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">FAQ：四类分诊</text>
  <line x1="380" y1="222" x2="380" y2="250" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="404" y="240" text-anchor="start" font-size="7.5" fill="#64748B">按需取章</text>
  <rect x="28" y="426" width="704" height="40" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="444" text-anchor="middle" font-size="7.5" fill="#334155">三条底线：先答「凭什么互信」 · 只做与业务无关的治理 · 网格自身可用性单独设计</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
