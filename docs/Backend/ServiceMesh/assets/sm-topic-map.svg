<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="482" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">服务网格专题地图：四个问题、五档成熟度与十页分工</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先定位自己缺什么，再决定买 mTLS、买 L7 治理，还是什么都不买</text>
  <rect x="32" y="76" width="168" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
