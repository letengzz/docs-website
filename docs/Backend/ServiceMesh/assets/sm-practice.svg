<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实验链的六个验收点与依赖顺序</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">照着敲能不能通：每一步都有反向用例，避免「配了但没生效」</text>
  <rect x="20" y="80" width="112" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="76" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 起集群</text>
  <text x="76" y="115" text-anchor="middle" font-size="7.5" fill="#334155">kind 三节点</text>
  <text x="76" y="132.25" text-anchor="middle" font-size="7.5" fill="#334155">kubectl get nodes</text>
  <rect x="144" y="80" width="112" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="200" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② 装 ambient</text>
  <text x="200" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">istiod/cni/ztunnel</text>
  <text x="200" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">全 Running</text>
  <line x1="132" y1="117" x2="142" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="80" width="112" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="324" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">③ 进网格</text>
  <text x="324" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">打 dataplane-mode</text>
  <text x="324" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">ztunnel-config 可见</text>
  <line x1="256" y1="117" x2="266" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="392" y="80" width="112" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="448" y="98.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">④ mTLS STRICT</text>
  <text x="448" y="115" text-anchor="middle" font-size="7.5" fill="#B91C1C">网格内 200</text>
  <text x="448" y="132.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">网格外失败</text>
  <line x1="380" y1="117" x2="390" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="516" y="80" width="112" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="572" y="98.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑤ 授权</text>
  <text x="572" y="115" text-anchor="middle" font-size="7.5" fill="#C2410C">允许 200</text>
  <text x="572" y="132.25" text-anchor="middle" font-size="7.5" fill="#C2410C">未列出 403</text>
  <line x1="504" y1="117" x2="514" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="640" y="80" width="112" height="74" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="696" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">⑥ 灰度+注入</text>
  <text x="696" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">权重 90/10</text>
  <text x="696" y="132.25" text-anchor="middle" font-size="7.5" fill="#0F766E">504 且 ≈1s</text>
  <line x1="628" y1="117" x2="638" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="174" text-anchor="middle" font-size="8.5" fill="#475569">六步串成一条可复跑的验收链，每步都能单独停下来验收</text>
  <rect x="24" y="194" width="350" height="94" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="199" y="212.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">每一步的判据形态</text>
  <text x="199" y="229" text-anchor="middle" font-size="7.5" fill="#6D28D9">命令 + 期望输出 + 不通过先看什么</text>
  <text x="199" y="246.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">不要「跑通了」这种无法复核的结论</text>
  <rect x="390" y="194" width="346" height="94" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="563" y="212.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">清理即回滚</text>
  <text x="563" y="229" text-anchor="middle" font-size="7.5" fill="#334155">kind delete cluster 即可复原</text>
  <text x="563" y="246.25" text-anchor="middle" font-size="7.5" fill="#334155">实验不留残留：ns、CRD、镜像</text>
  <rect x="24" y="304" width="712" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="322" text-anchor="middle" font-size="7.5" fill="#B45309">本机限制：本库所在环境无容器运行时，Practice 页命令按官方 Quickstart 编写、未在本机执行</text>
  <text x="380" y="339.25" text-anchor="middle" font-size="7.5" fill="#B45309">凡标「期望」的输出都是文档化行为，读者执行时以本机读数为准</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
