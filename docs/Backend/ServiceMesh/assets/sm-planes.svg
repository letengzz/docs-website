<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三种数据面形态与请求路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选型的第一个问题不是「哪个快」，而是「L7 需求有多少」</text>
  <rect x="26" y="76" width="226" height="176" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="139" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">Sidecar（每 Pod 一个）</text>
  <text x="139" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">istio-init 改 iptables</text>
  <text x="139" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">15001 出向 / 15006 入向</text>
  <text x="139" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">Envoy 同时做 L4 与 L7</text>
  <text x="139" y="162.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">代价：Pod 数 × 100m/128Mi</text>
  <text x="139" y="180" text-anchor="middle" font-size="7.5" fill="#6D28D9">升级要跟着 Pod 重启</text>
  <rect x="266" y="76" width="226" height="176" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="379" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">Ambient（每节点一个）</text>
  <text x="379" y="111" text-anchor="middle" font-size="7.5" fill="#0F766E">ztunnel：L4 + mTLS（HBONE）</text>
  <text x="379" y="128.25" text-anchor="middle" font-size="7.5" fill="#0F766E">waypoint：按需的 Envoy</text>
  <text x="379" y="145.5" text-anchor="middle" font-size="7.5" fill="#0F766E">L7 规则必须要有 waypoint</text>
  <text x="379" y="162.75" text-anchor="middle" font-size="7.5" fill="#0F766E">代价：每节点 200m 起</text>
  <text x="379" y="180" text-anchor="middle" font-size="7.5" fill="#0F766E">升级不动业务 Pod</text>
  <rect x="506" y="76" width="228" height="176" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="620" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">CNI / eBPF</text>
  <text x="620" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">内核转发，省一次上下文</text>
  <text x="620" y="128.25" text-anchor="middle" font-size="7.5" fill="#B45309">L4 策略由 eBPF 执行</text>
  <text x="620" y="145.5" text-anchor="middle" font-size="7.5" fill="#B45309">L7 仍需 Envoy</text>
  <text x="620" y="162.75" text-anchor="middle" font-size="7.5" fill="#B45309">Cilium 1.20 起 mTLS 换轨</text>
  <text x="620" y="180" text-anchor="middle" font-size="7.5" fill="#B45309">与 CNI 绑定，迁移成本高</text>
  <text x="140" y="272" text-anchor="middle" font-size="8.5" fill="#5B21B6">L7 需求少 → 选它</text>
  <text x="379" y="272" text-anchor="middle" font-size="8.5" fill="#0F766E">要 L7 但不想动 Pod → 选它</text>
  <text x="620" y="272" text-anchor="middle" font-size="8.5" fill="#92400E">已用该 CNI 且以 L4 为主 → 选它</text>
  <rect x="26" y="292" width="708" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="310" text-anchor="middle" font-size="7.5" fill="#334155">共同点：配置模型相同（VirtualService / DestinationRule / AuthorizationPolicy）</text>
  <text x="380" y="327.25" text-anchor="middle" font-size="7.5" fill="#334155">差异点：规则由谁执行、排障看哪份日志、升级影响多大——见 Architecture 与 Failure 两页</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
