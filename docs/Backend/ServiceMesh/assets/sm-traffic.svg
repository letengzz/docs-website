<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">路由、超时、重试与熔断在同一条链路上的位置</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">配置之间会互相放大：一条超时 + 一条重试，算错就能把小故障变成雪崩</text>
  <rect x="24" y="80" width="132" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="90" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">调用方</text>
  <text x="90" y="115" text-anchor="middle" font-size="7.5" fill="#334155">Envoy / ztunnel</text>
  <rect x="180" y="80" width="220" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="290" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">VirtualService</text>
  <text x="290" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">匹配顺序：特殊规则在前</text>
  <text x="290" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">权重 / 头 / 超时 / 重试</text>
  <rect x="424" y="80" width="220" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="534" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">DestinationRule</text>
  <text x="534" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">subset 定义</text>
  <text x="534" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">连接池 + 异常摘除</text>
  <rect x="668" y="80" width="68" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="702" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">v1/v2</text>
  <text x="702" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">按标签</text>
  <line x1="156" y1="108" x2="176" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="400" y1="108" x2="420" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="644" y1="108" x2="664" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="40" y="168" text-anchor="start" font-size="9" fill="#0F172A">超时预算自外向内递减（任何一层反向 = 内层超时永不触发）</text>
  <rect x="28" y="180" width="156" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="106" y="198.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">入口网关</text>
  <text x="106" y="215" text-anchor="middle" font-size="7.5" fill="#047857">3s</text>
  <rect x="210" y="180" width="156" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="288" y="198.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">订单服务</text>
  <text x="288" y="215" text-anchor="middle" font-size="7.5" fill="#0F766E">2s</text>
  <line x1="186" y1="203" x2="206" y2="203" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="392" y="180" width="156" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="470" y="198.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">库存服务</text>
  <text x="470" y="215" text-anchor="middle" font-size="7.5" fill="#B45309">800ms</text>
  <line x1="368" y1="203" x2="388" y2="203" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="574" y="180" width="156" height="46" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="652" y="198.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">数据库</text>
  <text x="652" y="215" text-anchor="middle" font-size="7.5" fill="#C2410C">300ms</text>
  <line x1="550" y1="203" x2="570" y2="203" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="24" y="248" width="350" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="199" y="266.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">重试放大：只在最靠近失败点的一层重试</text>
  <text x="199" y="283" text-anchor="middle" font-size="7.5" fill="#B91C1C">入口 3 × 订单 3 × 库存 3 = 27 倍</text>
  <text x="199" y="300.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">默认只重试「未到达」类失败</text>
  <text x="199" y="317.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">非幂等写：attempts: 0</text>
  <rect x="390" y="248" width="346" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="563" y="266.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">熔断默认值（要按副本数校准）</text>
  <text x="563" y="283" text-anchor="middle" font-size="7.5" fill="#C2410C">consecutive5xxErrors 5 / interval 10s</text>
  <text x="563" y="300.25" text-anchor="middle" font-size="7.5" fill="#C2410C">baseEjectionTime 30s / max 10%</text>
  <text x="563" y="317.5" text-anchor="middle" font-size="7.5" fill="#C2410C">3 副本时 10% 等于摘不掉</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#1E293B">判据：apply 成功 ≠ 生效——用 proxy-config route 读实际下发的路由表</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
