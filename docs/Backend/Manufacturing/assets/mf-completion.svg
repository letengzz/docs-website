<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="img" aria-label="完工入库与批次追溯：召回范围是设计出来的">
<title>完工入库与批次追溯：召回范围是设计出来的</title>
<rect x="0" y="0" width="920" height="392" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">完工入库与批次追溯：召回范围是设计出来的</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">只记工单不记批次，一次召回要停整条线；记了批次只停 8.3% 的成品</text>
<rect x="24.0" y="88.0" width="200.0" height="88.0" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">12 个原料批</text>
<text x="40.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">每批 2.5 t 钢板</text>
<text x="40.0" y="156.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">批号 L-ST-01 … 12</text>
<rect x="252.0" y="88.0" width="200.0" height="88.0" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="268.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">工单 MO-1001</text>
<text x="268.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">领 2 个原料批</text>
<text x="268.0" y="156.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">产出 1 个成品批</text>
<rect x="480.0" y="88.0" width="200.0" height="88.0" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="496.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">240 个成品批</text>
<text x="496.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">每批 20 件 = 4,800 件</text>
<text x="496.0" y="156.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">批号 FG-20261101-xx</text>
<rect x="708.0" y="88.0" width="188.0" height="88.0" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="724.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#b91c1c" font-weight="700">1 个原料批出事</text>
<text x="724.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">精确命中 20 批</text>
<text x="724.0" y="156.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">400 件 = 8.3%</text>
<line x1="224.0" y1="132.0" x2="252.0" y2="132.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="452.0" y1="132.0" x2="480.0" y2="132.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="680.0" y1="132.0" x2="708.0" y2="132.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="24.0" y="200.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="224.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">正向追溯（原料 → 成品）</text>
<text x="40.0" y="246.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">L-ST-01 → 20 个成品批 → 400 件 → 停 400 件</text>
<text x="40.0" y="266.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">用于：供应商来料不合格、原料批被监管点名</text>
<rect x="472.0" y="200.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="488.0" y="224.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">反向追溯（成品 → 原料）</text>
<text x="488.0" y="246.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">FG-…-01 → L-ST-01 / L-BT-01 → 2 个供应商</text>
<text x="488.0" y="266.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">用于：客户投诉、成品检测异常要定责</text>
<rect x="24.0" y="292.0" width="872.0" height="78.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="40.0" y="316.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">断链的代价：18% 的成品批没有原料批号（44 批）→ 反向追溯只能回落到工单，召回再加 880 件</text>
<text x="40.0" y="340.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">更糟的是「只记工单不记批次」：一个原料批出事，整张工单 4,800 件全停，召回范围放大 12 倍</text>
<text x="40.0" y="360.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">入库时就要写 mf_lot_link，而不是月末从领料记录里「推」出来</text>
</svg>
