<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="七段生产执行链：从「排产」到「结算」">
<title>七段生产执行链：从「排产」到「结算」</title>
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">七段生产执行链：从「排产」到「结算」</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">越靠前的段错一天，越靠后的段错一个月；只有报工这一段会当场报错</text>
<rect x="24.0" y="92.0" width="118.0" height="122.0" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">① 排产</text>
<text x="38.0" y="138.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">产能与交期</text>
<text x="38.0" y="156.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">负荷 ρ</text>
<text x="38.0" y="202.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.0" fill="#b91c1c">失败：安静</text>
