<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 386" width="920" height="386" role="img" aria-label="良率漏斗：投入 5,000 件最后变成多少良品">
<title>良率漏斗：投入 5,000 件最后变成多少良品</title>
<rect x="0" y="0" width="920" height="386" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">良率漏斗：投入 5,000 件最后变成多少良品</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">返工件要走第二圈，第二圈也要算投入；否则良率会被算高、报废率会被算高</text>
<rect x="24.0" y="88.0" width="240.0" height="66.0" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">投入 5,000 件</text>
<text x="40.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">一次通过 4,500（90.0%）</text>
<rect x="300.0" y="88.0" width="240.0" height="66.0" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="316.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">返工 350 件</text>
<text x="316.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">80% 通过 → 280 件良品</text>
<rect x="576.0" y="88.0" width="240.0" height="66.0" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="592.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">报废 150 件</text>
<text x="592.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">真实报废率 3.0%</text>
<line x1="264.0" y1="121.0" x2="300.0" y2="121.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="540.0" y1="121.0" x2="576.0" y2="121.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="144.0,154.0 144.0,186.0 420.0,186.0 420.0,154.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<text x="440.0" y="182.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">返工件回到 OP10，需要第二次投入</text>
<rect x="24.0" y="204.0" width="424.0" height="82.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="40.0" y="228.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">不追踪返工：报废率算成 10.0%</text>
<text x="40.0" y="250.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">「投入 − 良品」= 500 件全算报废，真实只有 150 件</text>
<text x="40.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">后果：报废损失虚增 3.3 倍，改善方向被带偏</text>
<rect x="472.0" y="204.0" width="424.0" height="82.0" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="488.0" y="228.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b45309" font-weight="700">不冲减投入：良率算成 95.6%</text>
<text x="488.0" y="250.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">4,780 / 5,000，真实是 4,780 / 5,350 = 89.3%</text>
<text x="488.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">后果：越返工越「高效」，指标反向激励</text>
<rect x="24.0" y="302.0" width="872.0" height="68.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="326.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">口径三条：① 返工单独计一次投入；② 返工良品计入良品但冲减新增投入；③ 返工不计入直通率（RTY）</text>
<text x="40.0" y="348.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">RTY（一次通过率）与最终良率是两个指标 —— 前者看过程稳不稳，后者看料用掉多少</text>
</svg>
