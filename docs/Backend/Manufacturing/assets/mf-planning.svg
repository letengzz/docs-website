<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" width="920" height="424" role="img" aria-label="有限产能：500 张工单挤在 20 个工作中心上">
<title>有限产能：500 张工单挤在 20 个工作中心上</title>
<rect x="0" y="0" width="920" height="424" fill="#f8fafc"/>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">有限产能：500 张工单挤在 20 个工作中心上</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">同一批工单只换派工规则，延期单数从 77 张降到 39 张；换 SPT 流程最短但最大延期 25.4 天</text>
<text x="28.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">规则</text>
<text x="120.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">延期单数</text>
<text x="300.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">平均延期</text>
<text x="450.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">最大延期</text>
<text x="610.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">平均流程</text>
<text x="760.0" y="96.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">结论</text>
<rect x="24.0" y="110.0" width="872.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="40.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">FIFO</text>
<text x="120.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">77 单 / 15.4%</text>
<text x="300.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">0.42 天</text>
<text x="450.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">6.9 天</text>
<text x="610.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">6.3 天</text>
<text x="760.0" y="137.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">先到先做</text>
<rect x="24.0" y="160.0" width="872.0" height="44.0" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="40.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">EDD</text>
<text x="120.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">39 单 / 7.8%</text>
<text x="300.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">0.16 天</text>
<text x="450.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">3.7 天</text>
<text x="610.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">6.4 天</text>
<text x="760.0" y="187.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">交期最紧先做</text>
<rect x="24.0" y="210.0" width="872.0" height="44.0" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.0"/>
<text x="40.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">SPT</text>
<text x="120.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">45 单 / 9.0%</text>
<text x="300.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">0.54 天</text>
<text x="450.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">25.4 天</text>
<text x="610.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">4.0 天</text>
<text x="760.0" y="237.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">最短工时不饿死</text>
<rect x="24.0" y="260.0" width="872.0" height="44.0" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1.0"/>
<text x="40.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">CR</text>
<text x="120.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">113 单 / 22.6%</text>
<text x="300.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">0.34 天</text>
<text x="450.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">4.2 天</text>
<text x="610.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.0" fill="#475569">7.8 天</text>
<text x="760.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">临界比</text>
<rect x="24.0" y="322.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="346.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">无限产能算出来的交期是假的</text>
<text x="40.0" y="368.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">只按标准工时排：8,000 件 = 120.0 h = 8.6 天</text>
<text x="40.0" y="388.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">按实际节拍 157.3 h，再除 95% 负荷 → 11.8 天</text>
<rect x="472.0" y="322.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="488.0" y="346.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b45309" font-weight="700">先做的规则会饿死后面的单</text>
<text x="488.0" y="368.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">SPT 平均流程 −38.1%，但最大延期从 3.7 涨到 25.4 天</text>
<text x="488.0" y="388.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">承诺交期要用「最紧的那张」验，不是用平均值验</text>
</svg>
