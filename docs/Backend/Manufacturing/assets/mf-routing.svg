<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="img" aria-label="工艺路线：工序、工作中心与标准工时">
<title>工艺路线：工序、工作中心与标准工时</title>
<rect x="0" y="0" width="920" height="392" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">工艺路线：工序、工作中心与标准工时</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">路线是「做哪些工序」，工时是「每道工序占这台设备多久」；两者一起才能排产</text>
<rect x="24.0" y="92.0" width="150.0" height="96.0" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">OP10 下料</text>
<text x="36.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">WC-CUT</text>
<text x="36.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">0.8 min/件</text>
<line x1="174.0" y1="140.0" x2="190.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="190.0" y="92.0" width="150.0" height="96.0" rx="8" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="202.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">OP20 焊接</text>
<text x="202.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">WC-WELD</text>
<text x="202.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">1.2 min/件</text>
<line x1="340.0" y1="140.0" x2="356.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="356.0" y="92.0" width="150.0" height="96.0" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="368.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">OP30 打磨</text>
<text x="368.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">WC-GRIND</text>
<text x="368.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">0.5 min/件</text>
<line x1="506.0" y1="140.0" x2="522.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="522.0" y="92.0" width="150.0" height="96.0" rx="8" fill="#fae8ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="534.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">OP40 装配</text>
<text x="534.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">WC-ASM</text>
<text x="534.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">1.6 min/件</text>
<line x1="672.0" y1="140.0" x2="688.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="688.0" y="92.0" width="150.0" height="96.0" rx="8" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="700.0" y="116.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">OP50 包装</text>
<text x="700.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">WC-PACK</text>
<text x="700.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">0.3 min/件</text>
<rect x="24.0" y="208.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="232.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">标准工时怎么来</text>
<text x="40.0" y="254.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">秒表测时 × 评比系数 + 宽放（疲劳 / 私事 / 作业）</text>
<text x="40.0" y="274.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">合计 4.4 min/件 × 100 件 = 440 min ≈ 7.3 h 工时</text>
<rect x="472.0" y="208.0" width="424.0" height="78.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="488.0" y="232.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">替代工序与返修路线</text>
<text x="488.0" y="254.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">OP20 有两台设备 → 用 (路线版本, 替代号) 定唯一</text>
<text x="488.0" y="274.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">同一工单不能两条路线混报工时</text>
<rect x="24.0" y="300.0" width="872.0" height="74.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="40.0" y="324.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">路线版本必须随工单快照</text>
<text x="40.0" y="346.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">主数据里改一条工时，正在生产的 300 张工单的差异会同时变 —— 工时差异从此无法归因</text>
<text x="40.0" y="364.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">正确做法：下达时把 route_version 写进工单，报工只认工单上的那份</text>
</svg>
