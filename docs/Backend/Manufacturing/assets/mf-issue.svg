<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 386" width="920" height="386" role="img" aria-label="领料、退料与倒冲：三条流落到同一个库存账户">
<title>领料、退料与倒冲：三条流落到同一个库存账户</title>
<rect x="0" y="0" width="920" height="386" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28.0" y="34.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.0" fill="#0f172a" font-weight="700">领料、退料与倒冲：三条流落到同一个库存账户</text>
<text x="28.0" y="56.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#475569">倒冲把「领料」这一步省掉了，代价是库存由「报工数 × BOM」反推 —— 误差全部沉到期末盘点</text>
<rect x="24.0" y="88.0" width="276.0" height="92.0" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="40.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">① 实际领料（推式）</text>
<text x="40.0" y="134.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">按工单需求领：2.5 kg × 1,200 = 3,000 kg</text>
<text x="40.0" y="152.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">批次号落 mf_issue，账实一起动</text>
<rect x="322.0" y="88.0" width="276.0" height="92.0" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="338.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">② 倒冲（拉式）</text>
<text x="338.0" y="134.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">报工 1,200 件 → 自动扣 3,000 kg</text>
<text x="338.0" y="152.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">不领料就没有批次号，追溯断在原料侧</text>
<rect x="620.0" y="88.0" width="276.0" height="92.0" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="636.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.0" fill="#0f172a" font-weight="700">③ 退料与报废</text>
<text x="636.0" y="134.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">退回 5 kg 用负数冲（kind=RETURN）</text>
<text x="636.0" y="152.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">报废件不报工 → 料扣了、产出没有</text>
<line x1="162.0" y1="180.0" x2="162.0" y2="206.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="460.0" y1="180.0" x2="460.0" y2="206.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="758.0" y1="180.0" x2="758.0" y2="206.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="24.0" y="206.0" width="872.0" height="68.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="230.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">三个流都写 mf_issue（kind ∈ ISSUE / RETURN），库存账户只有一个口径</text>
<text x="40.0" y="252.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">库存变动 = Σ ISSUE − Σ RETURN；倒冲也是一条 ISSUE，只是 lot 由系统按 FEFO 分配</text>
<rect x="24.0" y="292.0" width="424.0" height="74.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="40.0" y="316.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">倒冲误差 105 kg（3.38%）= 3,990 元</text>
<text x="40.0" y="338.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">1,200 件 × 2.5 kg 应扣 3,000，实际耗 3,105（含 3% 工艺损耗）</text>
<text x="40.0" y="358.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">报废 36 件未扣料再叠 90 kg（3,420 元）</text>
<rect x="472.0" y="292.0" width="424.0" height="74.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="488.0" y="316.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">两条防线</text>
<text x="488.0" y="338.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">① 倒冲前校验库存余额，不足则挂起工单而不是扣成负数</text>
<text x="488.0" y="358.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">② 月末用「实际耗用 − 倒冲数」做一次盘点差异归因</text>
</svg>
