<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="392" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">从单体到微服务的四步迁移与验收判据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">绞杀者模式：新写在旁边，老的一点点被替换掉</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#B91C1C" font-weight="bold">顺序不能反：先理代码边界，再理数据边界</text>
  <rect x="30" y="96" width="172" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="116" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 单体内模块化</text>
  <text x="116" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">按业务能力划包边界</text>
  <text x="116" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">禁止跨模块直接改表</text>
  <text x="116" y="165.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">验收：静态检查拦住非法 import</text>
  <line x1="202" y1="148" x2="216" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="216" y="96" width="172" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="302" y="114.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② 抽出第一个服务</text>
  <text x="302" y="131" text-anchor="middle" font-size="7.5" fill="#6D28D9">挑读多写少、依赖少的模块</text>
  <text x="302" y="148.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">老单体通过接口调用它</text>
  <text x="302" y="165.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">验收：可独立部署 + 灰度可回滚</text>
  <line x1="388" y1="148" x2="402" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="402" y="96" width="172" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="488" y="114.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">③ 引入网关与注册中心</text>
  <text x="488" y="131" text-anchor="middle" font-size="7.5" fill="#4338CA">统一入口与鉴权</text>
  <text x="488" y="148.25" text-anchor="middle" font-size="7.5" fill="#4338CA">服务间从写死 IP 改名字发现</text>
  <text x="488" y="165.5" text-anchor="middle" font-size="7.5" fill="#4338CA">验收：上下线对调用方透明</text>
  <line x1="574" y1="148" x2="588" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="588" y="96" width="172" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="674" y="114.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 数据拆分</text>
  <text x="674" y="131" text-anchor="middle" font-size="7.5" fill="#0F766E">一个数据一个属主</text>
  <text x="674" y="148.25" text-anchor="middle" font-size="7.5" fill="#0F766E">跨库查询改接口组合</text>
  <text x="674" y="165.5" text-anchor="middle" font-size="7.5" fill="#0F766E">验收：无跨服务直接访问表</text>
  <line x1="30" y1="218" x2="730" y2="218" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="244" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">每一步的验收判据不满足，就不要进入下一步</text>
  <rect x="30" y="262" width="226" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="143" y="280.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">常见失败模式</text>
  <text x="143" y="297" text-anchor="middle" font-size="7.5" fill="#B91C1C">一上来就分库分表</text>
  <text x="143" y="314.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">→ 服务边界未清，跨库 JOIN 遍地</text>
  <text x="143" y="331.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">→ 比单体更慢更脆</text>
  <rect x="268" y="262" width="226" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="381" y="280.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">正确顺序</text>
  <text x="381" y="297" text-anchor="middle" font-size="7.5" fill="#047857">先理代码边界</text>
  <text x="381" y="314.25" text-anchor="middle" font-size="7.5" fill="#047857">→ 数据边界自然浮现</text>
  <text x="381" y="331.5" text-anchor="middle" font-size="7.5" fill="#047857">→ 每一步都可回滚</text>
  <rect x="506" y="262" width="226" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="619" y="280.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">判断依据</text>
  <text x="619" y="297" text-anchor="middle" font-size="7.5" fill="#334155">能否独立部署（不牵连他人）</text>
  <text x="619" y="314.25" text-anchor="middle" font-size="7.5" fill="#334155">能否独立回滚（不改别人）</text>
  <text x="619" y="331.5" text-anchor="middle" font-size="7.5" fill="#334155">出问题能否定位到单个模块</text>
  <text x="380" y="374" text-anchor="middle" font-size="9.5" fill="#64748B">最省事的起点：先让「模块边界」在代码里可见，再谈进程与库的拆分</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
