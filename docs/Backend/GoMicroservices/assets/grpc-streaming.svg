<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="510" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">gRPC 四种流模式与各自的适用场景</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一个 service 里可以混用四种模式，按接口语义各取所需</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四种流模式：声明方式决定能力边界</text>
  <rect x="30" y="92" width="190" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="125" y="110.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">一元 Unary</text>
  <rect x="230" y="92" width="230" height="78" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="345" y="136" text-anchor="middle" font-size="8" fill="#334155">rpc F(Req) returns (Resp)</text>
  <rect x="472" y="92" width="258" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="601" y="110" text-anchor="middle" font-size="7.5" fill="#1D4ED8">一次请求一次响应</text>
  <text x="601" y="127.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">99% 的业务接口</text>
  <text x="601" y="144.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可被网关缓存与重试</text>
  <rect x="30" y="184" width="190" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="125" y="202.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">服务端流</text>
  <rect x="230" y="184" width="230" height="78" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="345" y="228" text-anchor="middle" font-size="8" fill="#334155">rpc F(Req) returns (stream R)</text>
  <rect x="472" y="184" width="258" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="601" y="202" text-anchor="middle" font-size="7.5" fill="#6D28D9">大结果集导出</text>
  <text x="601" y="219.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">日志跟随、订阅推送</text>
  <text x="601" y="236.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">边生成边消费，内存恒定</text>
  <rect x="30" y="276" width="190" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="125" y="294.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">客户端流</text>
  <rect x="230" y="276" width="230" height="78" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="345" y="320" text-anchor="middle" font-size="8" fill="#334155">rpc F(stream Req) returns (Resp)</text>
  <rect x="472" y="276" width="258" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="601" y="294" text-anchor="middle" font-size="7.5" fill="#0F766E">批量上传、指标上报</text>
  <text x="601" y="311.25" text-anchor="middle" font-size="7.5" fill="#0F766E">多次一元的往返开销太高</text>
  <text x="601" y="328.5" text-anchor="middle" font-size="7.5" fill="#0F766E">服务端聚合后一次返回</text>
  <rect x="30" y="368" width="190" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="125" y="386.2" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="bold">双向流</text>
  <rect x="230" y="368" width="230" height="78" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.1"/>
  <text x="345" y="412" text-anchor="middle" font-size="8" fill="#334155">rpc F(stream Req) returns (stream R)</text>
  <rect x="472" y="368" width="258" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="601" y="386" text-anchor="middle" font-size="7.5" fill="#B45309">实时对话、双向同步</text>
  <text x="601" y="403.25" text-anchor="middle" font-size="7.5" fill="#B45309">真正的全双工交互</text>
  <text x="601" y="420.5" text-anchor="middle" font-size="7.5" fill="#B45309">连接长期保持</text>
  <text x="380" y="470" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">选流式还是分页：问「结果集大小是否可预测、是否要边生成边消费」</text>
  <text x="380" y="492" text-anchor="middle" font-size="9.5" fill="#B91C1C">流式里必须检查 Send/Recv 的错误并立刻退出，否则客户端断开后服务端仍在空跑</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
