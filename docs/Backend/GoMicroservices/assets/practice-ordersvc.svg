<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">订单服务的工程布局与创建订单调用链</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">事务边界在 logic 层，提交只在一处发生</text>
  <text x="190" y="76" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">工程布局：依赖方向单向</text>
  <rect x="30" y="88" width="330" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="195" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">cmd/order</text>
  <text x="195" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">入口：读配置 → 装依赖 → 起服务 → 等信号</text>
  <line x1="195" y1="134" x2="195" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="144" width="330" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="195" y="162.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">internal/server</text>
  <text x="195" y="179" text-anchor="middle" font-size="7.5" fill="#6D28D9">协议转换、参数校验、错误映射</text>
  <line x1="195" y1="190" x2="195" y2="200" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="200" width="330" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="195" y="218.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">internal/logic</text>
  <text x="195" y="235" text-anchor="middle" font-size="7.5" fill="#4338CA">业务规则、事务编排（不 import http/grpc）</text>
  <line x1="195" y1="246" x2="195" y2="256" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="256" width="330" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="195" y="274.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">internal/repository</text>
  <text x="195" y="291" text-anchor="middle" font-size="7.5" fill="#0F766E">数据访问实现</text>
  <line x1="195" y1="302" x2="195" y2="312" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="312" width="330" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="195" y="330.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">internal/model</text>
  <text x="195" y="347" text-anchor="middle" font-size="7.5" fill="#334155">数据结构 + 仓储接口</text>
  <line x1="195" y1="358" x2="195" y2="368" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="368" width="330" height="46" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="195" y="386.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">internal/svc</text>
  <text x="195" y="403" text-anchor="middle" font-size="7.5" fill="#0E7490">依赖容器 ServiceContext</text>
  <text x="580" y="76" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">一次创建订单的调用链</text>
  <rect x="400" y="88" width="330" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="565" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">HTTP POST</text>
  <text x="565" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">/order/create</text>
  <line x1="565" y1="146" x2="565" y2="156" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="156" width="330" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="565" y="174.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">幂等检查</text>
  <text x="565" y="191" text-anchor="middle" font-size="7.5" fill="#B45309">Redis 快速路径</text>
  <line x1="565" y1="214" x2="565" y2="224" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="224" width="330" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="565" y="242.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">事务</text>
  <text x="565" y="259" text-anchor="middle" font-size="7.5" fill="#6D28D9">扣库存（条件更新）</text>
  <text x="565" y="276.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">建订单（同一事务）</text>
  <line x1="565" y1="282" x2="565" y2="292" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="292" width="330" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="310.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">写回幂等结果</text>
  <text x="565" y="327" text-anchor="middle" font-size="7.5" fill="#047857">TTL 长于事务</text>
  <line x1="565" y1="350" x2="565" y2="360" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="400" y="360" width="330" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="565" y="378.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">回应 order_id</text>
  <text x="565" y="395" text-anchor="middle" font-size="7.5" fill="#0F766E">唯一键兜底</text>
  <text x="380" y="448" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">幂等的最终判据是「数据库里只有一行」，不是「返回了同一个 order_id」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
