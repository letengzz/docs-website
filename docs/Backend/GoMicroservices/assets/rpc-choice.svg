<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Go 微服务技术栈分层与协议选型</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">左边是进程内部，中间是服务之间，右边是治理平面</text>
  <text x="110" y="76" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">① 服务进程内部</text>
  <rect x="30" y="88" width="160" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">传输层</text>
  <text x="110" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">net/http · gRPC</text>
  <line x1="110" y1="146" x2="110" y2="156" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="156" width="160" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="110" y="174.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">logic 层</text>
  <text x="110" y="191" text-anchor="middle" font-size="7.5" fill="#6D28D9">业务规则与事务</text>
  <line x1="110" y1="214" x2="110" y2="224" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="224" width="160" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="110" y="242.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">repository</text>
  <text x="110" y="259" text-anchor="middle" font-size="7.5" fill="#4338CA">数据访问实现</text>
  <line x1="110" y1="282" x2="110" y2="292" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="292" width="160" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="110" y="310.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">存储</text>
  <text x="110" y="327" text-anchor="middle" font-size="7.5" fill="#0F766E">MySQL · Redis</text>
  <text x="390" y="76" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">② 服务之间怎么说话</text>
  <rect x="240" y="88" width="300" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="390" y="106.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">HTTP + JSON</text>
  <text x="390" y="123" text-anchor="middle" font-size="7.5" fill="#047857">对外 API、浏览器直连</text>
  <text x="390" y="140.25" text-anchor="middle" font-size="7.5" fill="#047857">调试友好（curl）</text>
  <rect x="240" y="156" width="300" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="390" y="174.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">gRPC + Protobuf</text>
  <text x="390" y="191" text-anchor="middle" font-size="7.5" fill="#6D28D9">内部同步调用</text>
  <text x="390" y="208.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">编译期类型约束</text>
  <rect x="240" y="224" width="300" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="390" y="242.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">消息队列</text>
  <text x="390" y="259" text-anchor="middle" font-size="7.5" fill="#B45309">异步解耦、削峰</text>
  <text x="390" y="276.25" text-anchor="middle" font-size="7.5" fill="#B45309">最终一致性</text>
  <text x="670" y="76" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">③ 谁在管它们</text>
  <rect x="580" y="88" width="150" height="58" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="655" y="106.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">注册发现</text>
  <text x="655" y="123" text-anchor="middle" font-size="7.5" fill="#0E7490">etcd · Nacos · K8s</text>
  <rect x="580" y="156" width="150" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="655" y="174.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">配置中心</text>
  <text x="655" y="191" text-anchor="middle" font-size="7.5" fill="#4338CA">热更新 · 分环境</text>
  <rect x="580" y="224" width="150" height="58" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="655" y="242.2" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">可观测</text>
  <text x="655" y="259" text-anchor="middle" font-size="7.5" fill="#BE185D">Trace · Metrics</text>
  <rect x="580" y="292" width="150" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="655" y="310.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">治理</text>
  <text x="655" y="327" text-anchor="middle" font-size="7.5" fill="#B91C1C">超时 · 重试 · 熔断</text>
  <line x1="200" y1="200" x2="240" y2="200" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="550" y1="200" x2="580" y2="200" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="380" y="366" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">选型判据：需要立即拿到结果 → gRPC；调用方是浏览器 → REST；不需要立即结果 → 消息队列</text>
  <text x="380" y="390" text-anchor="middle" font-size="9.5" fill="#64748B">三种链路各管一段，不要为了「统一」把它们合并成一种</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
