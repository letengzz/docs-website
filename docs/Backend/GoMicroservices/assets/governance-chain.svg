<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">服务治理的六个环节与三组关键参数</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">治理能力只应在一个层次实现：要么应用层，要么基础设施层</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">一次跨服务调用经过的六个环节，缺一个都会在压力下暴露</text>
  <rect x="30" y="94" width="226" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 注册发现</text>
  <text x="143" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">调用方怎么知道服务在哪</text>
  <text x="143" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">缺失 → IP 写死，扩容要重启</text>
  <line x1="256" y1="134" x2="268" y2="134" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="94" width="226" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 负载均衡</text>
  <text x="381" y="129" text-anchor="middle" font-size="7.5" fill="#4338CA">多个实例时选哪个</text>
  <text x="381" y="146.25" text-anchor="middle" font-size="7.5" fill="#4338CA">缺失 → 流量压到第一个实例</text>
  <line x1="494" y1="134" x2="506" y2="134" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="94" width="226" height="80" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">③ 超时</text>
  <text x="619" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">一次调用最多等多久</text>
  <text x="619" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">缺失 → 慢实例占满 goroutine</text>
  <rect x="30" y="190" width="226" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="143" y="208.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 重试</text>
  <text x="143" y="225" text-anchor="middle" font-size="7.5" fill="#0F766E">瞬时故障要不要再试</text>
  <text x="143" y="242.25" text-anchor="middle" font-size="7.5" fill="#0F766E">缺失 → 抖动变为用户可见失败</text>
  <line x1="256" y1="230" x2="268" y2="230" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="268" y="190" width="226" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="208.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 熔断限流</text>
  <text x="381" y="225" text-anchor="middle" font-size="7.5" fill="#B45309">下游挂了 / 请求过多怎么办</text>
  <text x="381" y="242.25" text-anchor="middle" font-size="7.5" fill="#B45309">缺失 → 故障沿调用链放大</text>
  <line x1="494" y1="230" x2="506" y2="230" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="506" y="190" width="226" height="80" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="619" y="208.2" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">⑥ 可观测</text>
  <text x="619" y="225" text-anchor="middle" font-size="7.5" fill="#BE185D">出问题从哪查</text>
  <text x="619" y="242.25" text-anchor="middle" font-size="7.5" fill="#BE185D">缺失 → 只能挨个服务 tail -f</text>
  <line x1="700" y1="134" x2="730" y2="134" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="730" y1="134" x2="730" y2="270" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="730" y1="270" x2="258" y2="270" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="302" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">顺序不能乱：先有超时，再谈重试；先能观测，再调阈值</text>
  <text x="60" y="336" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三组必须先想清楚的参数</text>
  <rect x="30" y="344" width="226" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="362.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">超时预算</text>
  <text x="143" y="379" text-anchor="middle" font-size="7.5" fill="#1D4ED8">上游 800ms → 下游 A 300ms / B 400ms</text>
  <text x="143" y="396.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">下游超时绝不允许大于上游剩余时间</text>
  <rect x="268" y="344" width="226" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="362.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">重试纪律</text>
  <text x="381" y="379" text-anchor="middle" font-size="7.5" fill="#B45309">只重试幂等操作 + 指数退避 + 抖动</text>
  <text x="381" y="396.25" text-anchor="middle" font-size="7.5" fill="#B45309">必须有全局重试预算，否则放大成雪崩</text>
  <rect x="506" y="344" width="226" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="619" y="362.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">熔断口径</text>
  <text x="619" y="379" text-anchor="middle" font-size="7.5" fill="#B91C1C">只统计技术失败（超时、内部错误）</text>
  <text x="619" y="396.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">把业务失败算进去会误熔断正常请求</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
