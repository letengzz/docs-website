<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="批量代付：一次付款，五个必须对上的东西">
<title>批量代付：一次付款，五个必须对上的东西</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="320" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">批量代付：一次付款，五个必须对上的东西</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">付款文件出了系统，正确性就只剩回执能证明；没有回执的批次，等于没付</text>
<rect x="30" y="92" width="168" height="130" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="44" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">① 批次</text>
<text x="44" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">单号集合</text>
<text x="44" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">+ 合计金额</text>
<line x1="200" y1="157" x2="216" y2="157" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="216" y="92" width="168" height="130" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="230" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">② 收款人</text>
<text x="230" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">账户、开户行</text>
<text x="230" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">、姓名三一致</text>
<line x1="386" y1="157" x2="402" y2="157" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="402" y="92" width="168" height="130" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="416" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">③ 去重</text>
<text x="416" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">同一单不得</text>
<text x="416" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">出现在两批</text>
<line x1="572" y1="157" x2="588" y2="157" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="588" y="92" width="168" height="130" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="602" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">④ 银行文件</text>
<text x="602" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">固定宽度</text>
<text x="602" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">+ 校验位</text>
<line x1="758" y1="157" x2="774" y2="157" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="774" y="92" width="168" height="130" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="788" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">⑤ 回执</text>
<text x="788" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">成功 / 失败 / 未知</text>
<text x="788" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三态分别处理</text>
<text x="30" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">「未知」是最贵的一态：超时、连接重置、回执丢失都落在这里。当作失败重付 → 重复付款；</text>
<text x="30" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">当作成功不查 → 员工没收到钱。唯一正确的做法是「以银行对账文件为准，逐笔反查」。</text>
<text x="30" y="304" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">单据侧必须有 UNIQUE(claim_id) 的支付记录：同一张单能被插两次，才谈得上重复付款。</text>
</svg>
