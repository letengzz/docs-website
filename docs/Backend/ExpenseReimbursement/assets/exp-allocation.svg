<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="三个日期，三种归属">
<title>三个日期，三种归属</title>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">三个日期，三种归属</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">发生期决定费用属于哪个月，报销期决定钱什么时候动，支付期决定现金流落在哪一天</text>
<line x1="60" y1="150" x2="900" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="120" cy="150" r="6" fill="#0369a1"/>
<text x="120" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0369a1" font-weight="700" text-anchor="middle">12-18</text>
<text x="120" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">费用发生</text>
<circle cx="400" cy="150" r="6" fill="#c2410c"/>
<text x="400" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c2410c" font-weight="700" text-anchor="middle">01-09</text>
<text x="400" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">提单报销</text>
<circle cx="700" cy="150" r="6" fill="#15803d"/>
<text x="700" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#15803d" font-weight="700" text-anchor="middle">02-03</text>
<text x="700" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">实际支付</text>
<rect x="120" y="196" width="780" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="136" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="start">费用归属期：2026-12（权责发生制，与付款无关）</text>
<rect x="400" y="250" width="500" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="416" y="275" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#c2410c" font-weight="600" text-anchor="start">现金流出：2027-02（收付实现制，与费用无关）</text>
<text x="30" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">读数：12 月发生次年 1 月才提单 2,234 张（18.62%）、517 万元；按「已发生未报」预提只能覆盖 79.1%，缺口 108 万元。</text>
</svg>
