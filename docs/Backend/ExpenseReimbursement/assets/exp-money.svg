<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="三个金额，三条不同的减项">
<title>三个金额，三条不同的减项</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">三个金额，三条不同的减项</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">申报额减政策 = 核准额，核准额减借款与已付 = 实付额；任何一步合并，都会让「为什么少了」无法回答</text>
<rect x="40" y="96" width="240" height="120" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="58" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">申报额</text>
<text x="58" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">员工填的合计</text>
<text x="58" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#0369a1" font-weight="700" text-anchor="start">2,580.00</text>
<line x1="282" y1="156" x2="320" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="320" y="96" width="240" height="120" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="338" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">核准额</text>
<text x="338" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">扣超标 + 加定额调整</text>
<text x="338" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#b45309" font-weight="700" text-anchor="start">2,520.00</text>
<line x1="562" y1="156" x2="600" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="600" y="96" width="240" height="120" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="618" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">实付额</text>
<text x="618" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">扣借款核销 - 已预付</text>
<text x="618" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#15803d" font-weight="700" text-anchor="start">1,620.00</text>
<rect x="40" y="240" width="880" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">申报额 → 核准额：住宿 min(680,600)×3 = 1,800（少 240）、补贴 100×4 = 400（多 100）、交通 80×4 = 320（多 80）</text>
<text x="56" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">核准额 → 实付额：借款 5,000 已核销 3,120，本次报销 2,520，抵冲后应付 1,620；差额不是「少报」，是「不是现金」</text>
</svg>
