<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="差标不是一张表，是四层串联的解析器">
<title>差标不是一张表，是四层串联的解析器</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">差标不是一张表，是四层串联的解析器</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">制度条款 → 差标矩阵 → 适用判定 → 单据校验；任何一层用「默认值」兜底，都会把超标变成合规</text>
<rect x="30" y="92" width="200" height="150" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="44" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">① 制度条款</text>
<text x="44" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">办法、实施细则、</text>
<text x="44" y="161" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">董事会决议</text>
<line x1="44" y1="182" x2="216" y2="182" stroke="#fde68a" stroke-width="1"/>
<text x="44" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="start">谁适用、上限多少、</text>
<text x="44" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="start">超了谁承担</text>
<line x1="232" y1="167" x2="248" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="260" y="92" width="200" height="150" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="274" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">② 差标矩阵</text>
<text x="274" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">地区 × 职级 × 项目</text>
<text x="274" y="161" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">× 生效期</text>
<line x1="274" y1="182" x2="446" y2="182" stroke="#bae6fd" stroke-width="1"/>
<text x="274" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="600" text-anchor="start">同一城市两个价，</text>
<text x="274" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="600" text-anchor="start">因为生效期不同</text>
<line x1="462" y1="167" x2="478" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="490" y="92" width="200" height="150" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="504" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">③ 适用判定</text>
<text x="504" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">谁、去哪、几天、</text>
<text x="504" y="161" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">什么类型</text>
<line x1="504" y1="182" x2="676" y2="182" stroke="#bbf7d0" stroke-width="1"/>
<text x="504" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">属地还是属人；</text>
<text x="504" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">自然日还是夜数</text>
<line x1="692" y1="167" x2="708" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="720" y="92" width="200" height="150" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="734" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">④ 单据校验</text>
<text x="734" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">明细逐行比对</text>
<text x="734" y="161" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">限额与定额</text>
<line x1="734" y1="182" x2="906" y2="182" stroke="#ddd6fe" stroke-width="1"/>
<text x="734" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6d28d9" font-weight="600" text-anchor="start">超标要说明，</text>
<text x="734" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6d28d9" font-weight="600" text-anchor="start">说明要挂审批</text>
<text x="30" y="282" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本机读数：3,000 次出差里，伙食+市内交通按日历天 3,610,260 元、按住宿夜数 3,070,260 元，</text>
<text x="30" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">差 540,000 元（14.96%）——差的不是标准，是「天数」这一层的口径。</text>
<text x="30" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">同一张差标表，改一行「按夜数」的实现，全公司一年少发 54 万，且没有任何一处报错。</text>
</svg>
