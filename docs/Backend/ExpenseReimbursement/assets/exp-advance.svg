<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="借款的两笔账：余额对了，账龄可能全错">
<title>借款的两笔账：余额对了，账龄可能全错</title>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">借款的两笔账：余额对了，账龄可能全错</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">同一批业务、同一个总余额，核销顺序一换，逾期笔数差一倍</text>
<text x="30" y="88" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">先借先冲（FIFO）</text>
<text x="500" y="88" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">后借先冲（LIFO）</text>
<rect x="30" y="100" width="420" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">旧账 30~90 天 未清</text>
<text x="46" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#15803d" font-weight="700" text-anchor="start">986 笔</text>
<text x="150" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">笔 / 4,706,132.75 元</text>
<rect x="500" y="100" width="420" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="516" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">旧账 30~90 天 未清</text>
<text x="516" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#be123c" font-weight="700" text-anchor="start">2,000 笔</text>
<text x="620" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">笔 / 12,298,301.38 元</text>
<text x="30" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">两法总余额完全相同（5,386,684.24 元，占借款 14.46%），差的是「哪一笔还挂着」——</text>
<text x="30" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">而逾期、坏账、离职追缴全都按「单笔账龄」算，不按总余额算。</text>
<text x="30" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本机读数：3,629 张借款单、3,726 万元；两法逾期笔数差 1,014 笔（102.84%）。</text>
<text x="30" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">离职未清 240 人 × 3,600 元 = 864,000 元，多数在离职结算时已无法追回。</text>
</svg>
