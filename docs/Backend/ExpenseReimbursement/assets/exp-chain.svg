<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">四段失败是安静的——单据全绿、金额能加总，只有「这笔该不该报」没人回答</text>
