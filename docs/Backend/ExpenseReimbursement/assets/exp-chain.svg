<text x="842" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">产物见正文</text>
<text x="26" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">「申」是唯一会当场报错的一段：没申请、没预算、事由为空，系统立刻拦下。</text>
<text x="26" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">从「行」开始，每一段的输入都是上一段认为对的东西——上一段错了，这一段没有能力发现。</text>
