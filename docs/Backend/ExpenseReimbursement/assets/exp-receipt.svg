<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="一张发票要过三道门：真、合规、相关">
<title>一张发票要过三道门：真、合规、相关</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">一张发票要过三道门：真、合规、相关</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">过了「真」只说明税务局有这张票；能报能扣，还要过抬头税号与业务相关性</text>
<rect x="30" y="92" width="250" height="150" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="44" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">发票（29,720 行）</text>
<text x="44" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">¹ 票号 20 位</text>
<text x="44" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">² 开票日期</text>
<text x="44" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">³ 销售方</text>
<text x="44" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">⁴ 金额与税额</text>
<text x="44" y="216" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">⁵ 抬头与税号</text>
<rect x="320" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="334" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">门一：真</text>
<text x="334" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">查验平台有无此票</text>
<text x="334" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">每天每票限查 5 次</text>
<text x="334" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">不过 → 退回 / 转出</text>
<line x1="512" y1="167" x2="538" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="538" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="552" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">门二：合规</text>
<text x="552" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">抬头全称 + 18 位税号</text>
<text x="552" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">个人抬头不得抵扣</text>
<text x="552" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#c2410c" font-weight="600" text-anchor="start">不过 → 退回 / 转出</text>
<line x1="730" y1="167" x2="756" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="756" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="770" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">门三：相关</text>
<text x="770" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">时间、地点、事由</text>
<text x="770" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">对得上这次出差</text>
<text x="770" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">不过 → 退回 / 转出</text>
<text x="30" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本机读数：抬头与全称不一致 624 张（5.20%）、税号错 372 张（3.10%）、抬头为个人 215 张（1.79%）。</text>
<text x="30" y="298" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">后两类合计 397,750 元——能报（公司确实花了），但不可抵进项、且按工资薪金代扣个税。</text>
<text x="30" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">「能报」与「能扣」是两件事，合成一个字段，就会用「已报销」误当成「已合规」。</text>
</svg>
