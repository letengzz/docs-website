<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="同样是 5% 的样本，命中率差 12 倍">
<title>同样是 5% 的样本，命中率差 12 倍</title>
<rect x="0" y="0" width="960" height="320" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">同样是 5% 的样本，命中率差 12 倍</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">随机抽样保证「无偏」，风险导向保证「有效」；两者的差别在问题金额的覆盖率上</text>
<rect x="160" y="235.83333333333334" width="150" height="14.166666666666668" rx="4" fill="#94a3b8"/>
<text x="235" y="223.83333333333334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">15 张</text>
<text x="235" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="600" text-anchor="middle">随机抽样 5%</text>
<text x="235" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">2.5%</text>
<rect x="460" y="80.0" width="150" height="170.0" rx="4" fill="#be123c"/>
<text x="535" y="68.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">180 张</text>
<text x="535" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="600" text-anchor="middle">风险导向 5%</text>
<text x="535" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="middle">30.0%</text>
<line x1="120" y1="250" x2="820" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="120" y="96" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">命中问题单据数（问题单据共 360 张，占 3.00%）</text>
<text x="120" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">覆盖问题金额：随机 25,900 元 vs 风险导向 936,000 元 —— 差的不是工作量，是「问题金额有没有被看见」。</text>
</svg>
