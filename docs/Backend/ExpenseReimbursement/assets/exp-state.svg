<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="单据的八态与九条迁移">
<title>单据的八态与九条迁移</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">单据的八态与九条迁移</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">状态是「谁该动手」的唯一依据；把 RETURNED 与 REJECTED 合成一个态，就再也算不出退回率</text>
<rect x="40" y="96" width="168" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="52" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">草稿</text>
<text x="52" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="600" text-anchor="start">DRAFT</text>
<rect x="220" y="96" width="168" height="62" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="232" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">已提交</text>
<text x="232" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="600" text-anchor="start">SUBMITTED</text>
<rect x="400" y="96" width="168" height="62" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="412" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">政策校验</text>
<text x="412" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#6d28d9" font-weight="600" text-anchor="start">CHECKING</text>
<rect x="580" y="96" width="168" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="592" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">退回补正</text>
<text x="592" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="start">RETURNED</text>
<rect x="760" y="96" width="168" height="62" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="772" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">已核准</text>
<text x="772" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">APPROVED</text>
<rect x="760" y="214" width="168" height="62" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="772" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">已支付</text>
<text x="772" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">PAID</text>
<rect x="580" y="214" width="168" height="62" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="592" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">已驳回</text>
<text x="592" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">REJECTED</text>
<rect x="400" y="214" width="168" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="412" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">已撤回</text>
<text x="412" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="600" text-anchor="start">WITHDRAWN</text>
<line x1="210" y1="127" x2="218" y2="127" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="390" y1="127" x2="398" y2="127" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="570" y1="127" x2="578" y2="127" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="750" y1="127" x2="758" y2="127" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="844" y1="160" x2="844" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="760" y1="245" x2="750" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="578" y1="245" x2="570" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="40" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">两条「非前进」迁移必须单独记：RETURNED → SUBMITTED（补正后重提）与 APPROVED → RETURNED（复核发现错）。</text>
<text x="40" y="322" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">只记状态不记迁移，「这张单被退了几次」就答不出来——而退回率正是 37% 成本的那一段。</text>
</svg>
