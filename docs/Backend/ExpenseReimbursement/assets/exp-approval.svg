<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="审批路由：三个维度，一张矩阵">
<title>审批路由：三个维度，一张矩阵</title>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">审批路由：三个维度，一张矩阵</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">金额定级数、类型定角色、组织定人；漏掉任何一个维度，都留下一条自审或越权的路</text>
<text x="30" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">级数矩阵（金额 × 类型）</text>
<rect x="30" y="104" width="560" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="700" text-anchor="start">金额</text>
<text x="200" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="700" text-anchor="start">差旅 / 日常</text>
<text x="360" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="700" text-anchor="start">业务招待</text>
<text x="490" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="700" text-anchor="start">培训 / 其他</text>
<line x1="44" y1="138" x2="576" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">≤ 5,000</text>
<text x="200" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">一级：直属主管</text>
<text x="360" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">一级：直属主管 + 财务</text>
<text x="490" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">二级</text>
<line x1="44" y1="180" x2="576" y2="180" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">5,000 ~ 20,000</text>
<text x="200" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">二级：+ 部门负责人</text>
<text x="360" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">二级：+ 财务负责人</text>
<text x="490" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">二级</text>
<line x1="44" y1="222" x2="576" y2="222" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">> 20,000</text>
<text x="200" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三级：+ 分管副总</text>
<text x="360" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三级：+ 总经理</text>
<text x="490" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三级</text>
<text x="30" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本机读数：>5,000 的 1,174 张（9.78%）需二级、>20,000 的 48 张（0.40%）需三级。</text>
<text x="30" y="328" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">阈值从 5,000 调到 5,500，192 张（1.60%）立刻掉档——调阈值是最安静的越权。</text>
<rect x="620" y="104" width="310" height="176" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="636" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">三条短路</text>
<text x="636" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="600" text-anchor="start">① 申请人 = 审批人（自审）</text>
<text x="636" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">   144 张 / 311,992 元</text>
<text x="636" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="600" text-anchor="start">② 审批人离职，链断无转交</text>
<text x="636" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">   96 张挂在空节点上</text>
<text x="636" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="600" text-anchor="start">③ 应二级只走一级</text>
<text x="636" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">   252 张（2.10%）</text>
</svg>
