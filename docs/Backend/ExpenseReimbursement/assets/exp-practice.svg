<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="七张表的主语都是「一张单」">
<title>七张表的主语都是「一张单」</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">七张表的主语都是「一张单」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">policy 只读、claim 只追加、line 与 invoice 从属、advance 独立、approval 与 payment 是流水</text>
<rect x="30" y="88" width="250" height="84" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="42" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">expense_policy</text>
<text x="42" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">grade, city_tier</text>
<text x="42" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">lodging_limit, effective_from</text>
<rect x="300" y="88" width="250" height="84" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="312" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">expense_claim</text>
<text x="312" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">claim_no UQ, emp_no</text>
<text x="312" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">status, total_amount</text>
<rect x="590" y="88" width="250" height="84" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="602" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">claim_line</text>
<text x="602" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">claim_id FK</text>
<text x="602" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">line_type, amount</text>
<rect x="590" y="200" width="250" height="84" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="602" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">invoice</text>
<text x="602" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">inv_no UQ, claim_id FK</text>
<text x="602" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">title, tax_no</text>
<rect x="30" y="200" width="250" height="84" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="42" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">advance</text>
<text x="42" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">emp_no, amount</text>
<text x="42" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">balance >= 0</text>
<rect x="300" y="200" width="250" height="84" rx="8" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
<text x="312" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">approval</text>
<text x="312" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">claim_id FK, level</text>
<text x="312" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">UNIQUE(claim_id, level)</text>
<rect x="300" y="300" width="250" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="312" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">payment</text>
<text x="312" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">claim_id UQ FK</text>
<text x="312" y="362" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">amount, paid_at</text>
<line x1="280" y1="130" x2="298" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="550" y1="130" x2="588" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="550" y1="130" x2="588" y2="242" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="155" y1="172" x2="155" y2="198" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="300" y1="172" x2="300" y2="198" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="425" y1="242" x2="425" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="30" y="358" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三个约束就是三条判据：invoice.inv_no 唯一（一票一报）、advance.balance ≥ 0（不得透支核销）、payment.claim_id 唯一（一单不付两次）。</text>
</svg>
