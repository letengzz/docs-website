<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" width="760" height="438" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="438" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">复式记账：一次业务 = 一组借贷相等的分录</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">会计恒等式：资产 = 负债 + 所有者权益；有借必有贷，借贷必相等</text>
  <rect x="20" y="84" width="200" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="120" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">一个业务事件</text>
  <text x="120" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">用户充值 100.00 元</text>
  <text x="120" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">渠道已确认到账</text>
  <line x1="224" y1="126" x2="246" y2="126" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="250" y="84" width="260" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">生成一组分录（同组不可拆）</text>
  <text x="380" y="119" text-anchor="middle" font-size="7.5" fill="#047857">借：银行存款 100.00</text>
  <text x="380" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">贷：用户余额 100.00</text>
  <line x1="514" y1="126" x2="536" y2="126" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="540" y="84" width="200" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="640" y="102.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">两条不变式</text>
  <text x="640" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">总借 = 总贷</text>
  <text x="640" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">余额 = 分录累加</text>
  <rect x="20" y="186" width="232" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="136" y="204.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">充值</text>
  <text x="136" y="221" text-anchor="middle" font-size="7.5" fill="#047857">借 银行存款 100.00</text>
  <text x="136" y="238.25" text-anchor="middle" font-size="7.5" fill="#047857">贷 用户余额 100.00</text>
  <rect x="264" y="186" width="232" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="204.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">消费</text>
  <text x="380" y="221" text-anchor="middle" font-size="7.5" fill="#0F766E">借 用户余额 39.90</text>
  <text x="380" y="238.25" text-anchor="middle" font-size="7.5" fill="#0F766E">贷 平台收入 39.90</text>
  <rect x="508" y="186" width="232" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="624" y="204.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">退款（反向冲正）</text>
  <text x="624" y="221" text-anchor="middle" font-size="7.5" fill="#B91C1C">借 用户余额 100.00</text>
  <text x="624" y="238.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">贷 银行存款 100.00</text>
  <rect x="20" y="292" width="356" height="122" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="198" y="310.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">科目与方向（示例）</text>
  <text x="198" y="327" text-anchor="middle" font-size="7.5" fill="#4338CA">资产类：借增贷减（银行存款 / 应收）</text>
  <text x="198" y="344.25" text-anchor="middle" font-size="7.5" fill="#4338CA">负债类：贷增借减（用户余额 / 应付）</text>
  <text x="198" y="361.5" text-anchor="middle" font-size="7.5" fill="#4338CA">收入类：贷增（平台服务费）</text>
  <text x="198" y="378.75" text-anchor="middle" font-size="7.5" fill="#4338CA">费用类：借增（渠道手续费）</text>
  <rect x="392" y="292" width="352" height="122" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="568" y="310.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">三条硬约束</text>
  <text x="568" y="327" text-anchor="middle" font-size="7.5" fill="#B45309">① 分录只插入，永不更新与删除</text>
  <text x="568" y="344.25" text-anchor="middle" font-size="7.5" fill="#B45309">② 同一业务单号的分录组必须整体提交</text>
  <text x="568" y="361.5" text-anchor="middle" font-size="7.5" fill="#B45309">③ 余额是派生值，允许随时重算校验</text>
  <text x="568" y="378.75" text-anchor="middle" font-size="7.5" fill="#B45309">④ 冲正不是删除：错的分录必须留着</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
