<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：从一笔支付到日终打平</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一笔钱在四张表上的完整旅程，每一步都给出可执行判据</text>
  <rect x="14" y="88" width="232" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 支付成功</text>
  <text x="130" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">写入支付单</text>
  <text x="130" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">状态置为 SUCCESS</text>
  <rect x="260" y="88" width="232" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="376" y="106.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">② 记一组分录</text>
  <text x="376" y="123" text-anchor="middle" font-size="7.5" fill="#047857">借 银行存款 100.00</text>
  <text x="376" y="140.25" text-anchor="middle" font-size="7.5" fill="#047857">贷 用户余额 100.00</text>
  <rect x="506" y="88" width="232" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="622" y="106.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 更新余额</text>
  <text x="622" y="123" text-anchor="middle" font-size="7.5" fill="#0F766E">可用余额 +100.00</text>
  <text x="622" y="140.25" text-anchor="middle" font-size="7.5" fill="#0F766E">账面 = 分录累加</text>
  <rect x="14" y="200" width="232" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="130" y="218.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">④ 消费扣减</text>
  <text x="130" y="235" text-anchor="middle" font-size="7.5" fill="#6D28D9">借 用户余额 39.90</text>
  <text x="130" y="252.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">贷 平台收入 39.90</text>
  <rect x="260" y="200" width="232" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="376" y="218.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 日终清分</text>
  <text x="376" y="235" text-anchor="middle" font-size="7.5" fill="#B45309">按渠道汇总清分</text>
  <text x="376" y="252.25" text-anchor="middle" font-size="7.5" fill="#B45309">扣手续费出结算单</text>
  <rect x="506" y="200" width="232" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="622" y="218.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑥ 对账打平</text>
  <text x="622" y="235" text-anchor="middle" font-size="7.5" fill="#B91C1C">四方差集应为空</text>
  <text x="622" y="252.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">借方合计 = 贷方合计</text>
  <rect x="14" y="314" width="732" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="332.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">六步判据（读者可照做）</text>
  <text x="380" y="349" text-anchor="middle" font-size="7.5" fill="#4338CA">① 支付单状态唯一，且金额与订单应付完全一致</text>
  <text x="380" y="366.25" text-anchor="middle" font-size="7.5" fill="#4338CA">② 同一 biz_no 只有一组分录，且 SUM(借) = SUM(贷)</text>
  <text x="380" y="383.5" text-anchor="middle" font-size="7.5" fill="#4338CA">③ 余额表 = 分录表按账户聚合的结果（重算一致）</text>
  <text x="380" y="400.75" text-anchor="middle" font-size="7.5" fill="#4338CA">④ 扣减后可用余额 ≥ 0，全库不存在负余额账户</text>
  <text x="380" y="418" text-anchor="middle" font-size="7.5" fill="#4338CA">⑤ 结算单金额 = 清分明细合计 − 手续费合计</text>
  <text x="380" y="435.25" text-anchor="middle" font-size="7.5" fill="#4338CA">⑥ 对账报告差异 0 笔，或差异均已挂账并有处理记录</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
