<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="366" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一笔钱走过的四层：谁记什么、谁是真相</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">越靠上越易变，越靠下越不可变；对账就是把四层互相钉住</text>
  <rect x="20" y="84" width="172" height="106" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="106" y="102.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 业务单</text>
  <text x="106" y="119" text-anchor="middle" font-size="7.5" fill="#334155">订单 / 合同 / 工单</text>
  <text x="106" y="136.25" text-anchor="middle" font-size="7.5" fill="#334155">回答：为什么收这笔钱</text>
  <text x="106" y="153.5" text-anchor="middle" font-size="7.5" fill="#334155">可取消、可改价</text>
  <rect x="204" y="84" width="172" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="290" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 支付单</text>
  <text x="290" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">渠道流水与回执</text>
  <text x="290" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">回答：钱从哪条通道进来</text>
  <text x="290" y="153.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可失败、可退款</text>
  <rect x="388" y="84" width="172" height="106" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="474" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 账务分录</text>
  <text x="474" y="119" text-anchor="middle" font-size="7.5" fill="#047857">借 / 贷 成对记录</text>
  <text x="474" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">回答：钱在账户间怎么动</text>
  <text x="474" y="153.5" text-anchor="middle" font-size="7.5" fill="#047857">不可改，只能冲正</text>
  <rect x="572" y="84" width="172" height="106" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="658" y="102.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">④ 结算单</text>
  <text x="658" y="119" text-anchor="middle" font-size="7.5" fill="#B45309">对外的打款凭据</text>
  <text x="658" y="136.25" text-anchor="middle" font-size="7.5" fill="#B45309">回答：和谁、何时结清</text>
  <text x="658" y="153.5" text-anchor="middle" font-size="7.5" fill="#B45309">按周期 T+1 / T+N</text>
  <line x1="192" y1="137" x2="200" y2="137" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="137" x2="384" y2="137" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="137" x2="568" y2="137" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="212" width="356" height="130" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="198" y="230.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">四条边界</text>
  <text x="198" y="247" text-anchor="middle" font-size="7.5" fill="#6D28D9">① 账 ≠ 单 ≠ 流水：三者生命周期不同</text>
  <text x="198" y="264.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">② 账本是唯一真相：余额是分录的派生值</text>
  <text x="198" y="281.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">③ 错账不能改只能冲：用反向分录修正</text>
  <text x="198" y="298.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">④ 没有对账就没有账：只信自己等于没记</text>
  <rect x="392" y="212" width="352" height="130" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="568" y="230.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">什么时候不该自建账务</text>
  <text x="568" y="247" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 只有一种收款方式、没有分账需求</text>
  <text x="568" y="264.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 平台不沉淀资金（渠道直连商户）</text>
  <text x="568" y="281.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 团队里没有对得上财务口径的人</text>
  <text x="568" y="298.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">→ 用渠道对账单或第三方账务更省</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
