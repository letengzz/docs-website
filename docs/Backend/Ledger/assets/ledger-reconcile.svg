<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="392" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">对账：四方数据、四类差异、四种处置</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">以「渠道交易号 + 金额 + 状态」为键做双向差集，差异必须逐笔登记</text>
  <rect x="10" y="84" width="176" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="98" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 渠道账单</text>
  <text x="98" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">渠道导出的明细</text>
  <text x="98" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">外部事实</text>
  <rect x="198" y="84" width="176" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="286" y="102.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">② 业务订单</text>
  <text x="286" y="119" text-anchor="middle" font-size="7.5" fill="#0F766E">我方订单状态</text>
  <text x="286" y="136.25" text-anchor="middle" font-size="7.5" fill="#0F766E">业务事实</text>
  <rect x="386" y="84" width="176" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="474" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 账务分录</text>
  <text x="474" y="119" text-anchor="middle" font-size="7.5" fill="#047857">我方账本</text>
  <text x="474" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">会计事实</text>
  <rect x="574" y="84" width="176" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="662" y="102.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">④ 银行流水</text>
  <text x="662" y="119" text-anchor="middle" font-size="7.5" fill="#B45309">资金实际进出</text>
  <text x="662" y="136.25" text-anchor="middle" font-size="7.5" fill="#B45309">最终事实</text>
  <rect x="10" y="186" width="360" height="116" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190" y="204.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">四类差异</text>
  <text x="190" y="221" text-anchor="middle" font-size="7.5" fill="#B91C1C">长款：渠道有、我方无</text>
  <text x="190" y="238.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">短款：我方有、渠道无</text>
  <text x="190" y="255.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">金额不符：疑似篡改或串单</text>
  <text x="190" y="272.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">状态不符：一方成功、一方待处理</text>
  <rect x="390" y="186" width="360" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="570" y="204.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">处置口径</text>
  <text x="570" y="221" text-anchor="middle" font-size="7.5" fill="#6D28D9">长款 → 自动补记 + 人工复核</text>
  <text x="570" y="238.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">短款 → 挂账 + 排查 + 冲正</text>
  <text x="570" y="255.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">金额不符 → 绝不自动改，转人工</text>
  <text x="570" y="272.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">状态不符 → 复用幂等入口补处理</text>
  <rect x="10" y="316" width="740" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="334.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">一条纪律</text>
  <text x="380" y="351" text-anchor="middle" font-size="7.5" fill="#334155">对账任务必须幂等且可重跑：同一天跑两次，结论与账面都不能变</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
