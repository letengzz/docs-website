<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">账务与清结算 · 专题地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">钱怎么被记下来、怎么被核对、怎么被打平 —— 九页一条线</text>
  <rect x="10" y="80" width="176" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="98" y="98.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">总览：四条边界</text>
  <text x="98" y="115" text-anchor="middle" font-size="7.5" fill="#1D4ED8">账 ≠ 单 ≠ 流水</text>
  <text x="98" y="132.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">账本才是唯一真相</text>
  <text x="98" y="149.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">什么时候不该自建</text>
  <rect x="198" y="80" width="176" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="286" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">复式记账</text>
  <text x="286" y="115" text-anchor="middle" font-size="7.5" fill="#047857">会计恒等式</text>
  <text x="286" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">科目表与分录</text>
  <text x="286" y="149.5" text-anchor="middle" font-size="7.5" fill="#047857">借贷方向不能反</text>
  <rect x="386" y="80" width="176" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="474" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">账户、余额与流水</text>
  <text x="474" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">账户树与冻结</text>
  <text x="474" y="132.25" text-anchor="middle" font-size="7.5" fill="#0F766E">余额表 vs 流水表</text>
  <text x="474" y="149.5" text-anchor="middle" font-size="7.5" fill="#0F766E">热点账户怎么扛</text>
  <rect x="574" y="80" width="176" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="662" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">记账幂等与一致性</text>
  <text x="662" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">业务单号唯一键</text>
  <text x="662" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">分录组唯一约束</text>
  <text x="662" y="149.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">重试与乱序安全</text>
  <rect x="10" y="188" width="176" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="98" y="206.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">清分与结算</text>
  <text x="98" y="223" text-anchor="middle" font-size="7.5" fill="#B45309">交易 → 清分 → 结算</text>
  <text x="98" y="240.25" text-anchor="middle" font-size="7.5" fill="#B45309">手续费与分账</text>
  <text x="98" y="257.5" text-anchor="middle" font-size="7.5" fill="#B45309">结算周期与划付</text>
  <rect x="198" y="188" width="176" height="84" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="286" y="206.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">对账体系与差错</text>
  <text x="286" y="223" text-anchor="middle" font-size="7.5" fill="#B91C1C">四方数据双向差集</text>
  <text x="286" y="240.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">差异四分类</text>
  <text x="286" y="257.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">挂账、冲正、长短款</text>
  <rect x="386" y="188" width="176" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="474" y="206.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">实战：一天闭环</text>
  <text x="474" y="223" text-anchor="middle" font-size="7.5" fill="#4338CA">完整 DDL 与分录</text>
  <text x="474" y="240.25" text-anchor="middle" font-size="7.5" fill="#4338CA">日终结算与打平</text>
  <text x="474" y="257.5" text-anchor="middle" font-size="7.5" fill="#4338CA">可执行判据清单</text>
  <rect x="574" y="188" width="176" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="662" y="206.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">常见问题与排错</text>
  <text x="662" y="223" text-anchor="middle" font-size="7.5" fill="#334155">钱对不上先查什么</text>
  <text x="662" y="240.25" text-anchor="middle" font-size="7.5" fill="#334155">性能与容量</text>
  <text x="662" y="257.5" text-anchor="middle" font-size="7.5" fill="#334155">审计与合规</text>
  <rect x="10" y="300" width="240" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="318.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">先读这三页</text>
  <text x="130" y="335" text-anchor="middle" font-size="7.5" fill="#1D4ED8">总览 → 复式记账</text>
  <text x="130" y="352.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">→ 账户、余额与流水</text>
  <rect x="260" y="300" width="240" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="318.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">再读这三页</text>
  <text x="380" y="335" text-anchor="middle" font-size="7.5" fill="#047857">记账幂等 → 清分结算</text>
  <text x="380" y="352.25" text-anchor="middle" font-size="7.5" fill="#047857">→ 对账体系与差错</text>
  <rect x="510" y="300" width="240" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="630" y="318.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">最后动手</text>
  <text x="630" y="335" text-anchor="middle" font-size="7.5" fill="#C2410C">实战：一天闭环</text>
  <text x="630" y="352.25" text-anchor="middle" font-size="7.5" fill="#C2410C">卡住了翻 FAQ</text>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">一句话：账务不是「多一张表」，而是同一笔钱必须在两处留下互为因果的记录。</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
