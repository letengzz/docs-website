<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" width="860" height="304">
  <rect width="860" height="304" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">滞后监控：同一串数字，两种完全不同的严重度</text>
  <rect x="24" y="74" width="390" height="138" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">条数 lag = 20,000</text>
  <text x="38" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">低峰 200 行/s → 100 s</text>
  <text x="38" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">高峰 10,000 行/s → 2 s</text>
  <text x="38" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">同一数字差 50 倍</text>
  <rect x="434" y="74" width="402" height="138" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="448" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">突发 10 s</text>
  <text x="448" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">入 10,000/s、出 8,000/s</text>
  <text x="448" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">条数 lag 20,000</text>
  <text x="448" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">时间滞后仅 2.00 s</text>
  <rect x="24" y="230" width="812" height="54" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="256" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">SLA 要写时间</text>
  <text x="38" y="278" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">「lag &amp;lt; 5,000 条」在低峰等于允许落后 25 秒，在高峰只等于 0.5 秒</text>
</svg>
