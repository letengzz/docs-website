<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" width="860" height="304">
  <rect width="860" height="304" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">顺序与分区键：分区键决定了「有序」的边界</text>
  <rect x="24" y="74" width="250" height="128" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">按 event_id 分区</text>
  <text x="38" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">同聚合相邻事件打散</text>
  <text x="38" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">跨分区 87.50%（8 分区）</text>
  <text x="38" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">下游可能先删后插</text>
  <rect x="305" y="74" width="250" height="128" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="319" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">按 aggregate_id 分区</text>
  <text x="319" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">同一聚合恒落同一分区</text>
  <text x="319" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">跨分区 0.00%</text>
  <text x="319" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">分区内 FIFO 即因果序</text>
  <rect x="586" y="74" width="250" height="128" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="600" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">按 table_name 分区</text>
  <text x="600" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">跨 3 表事务打散</text>
  <text x="600" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">98.53% 至少跨两分区</text>
  <text x="600" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">主表事件未必先到</text>
  <rect x="24" y="226" width="812" height="58" rx="9" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="252" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">顺序的边界</text>
  <text x="38" y="274" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">能承诺的只有「同一聚合内有序」；跨分区无全局序，需要版本号或因果依赖来收敛</text>
</svg>
