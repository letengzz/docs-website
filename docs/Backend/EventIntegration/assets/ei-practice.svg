<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" width="860" height="386">
  <rect width="860" height="386" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">实战：十条断言与一个反向探针</text>
  <rect x="24" y="74" width="394" height="46" rx="8" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="38" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A1 事务边界</text>
  <text x="38" y="112" font-family="sans-serif" font-size="12" fill="#475569">双写 100 / outbox 0</text>
  <rect x="438" y="74" width="394" height="46" rx="8" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="452" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A2 幂等</text>
  <text x="452" y="112" font-family="sans-serif" font-size="12" fill="#475569">重放 1000 条被拒</text>
  <rect x="24" y="130" width="394" height="46" rx="8" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="38" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A3 分区键</text>
  <text x="38" y="168" font-family="sans-serif" font-size="12" fill="#475569">同聚合 0 跨区</text>
  <rect x="438" y="130" width="394" height="46" rx="8" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="452" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A4 快照接缝</text>
  <text x="452" y="168" font-family="sans-serif" font-size="12" fill="#475569">0 丢 0 重 0 回退</text>
  <rect x="24" y="186" width="394" height="46" rx="8" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="38" y="206" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A5 版本条件</text>
  <text x="38" y="224" font-family="sans-serif" font-size="12" fill="#475569">旧值不覆盖新值</text>
  <rect x="438" y="186" width="394" height="46" rx="8" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="452" y="206" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A6 DDL</text>
  <text x="452" y="224" font-family="sans-serif" font-size="12" fill="#475569">删列被门禁拒绝</text>
  <rect x="24" y="242" width="394" height="46" rx="8" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="38" y="262" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A7 回放</text>
  <text x="38" y="280" font-family="sans-serif" font-size="12" fill="#475569">20,000 行一致</text>
  <rect x="438" y="242" width="394" height="46" rx="8" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="452" y="262" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">A8 对账</text>
  <text x="452" y="280" font-family="sans-serif" font-size="12" fill="#475569">分块 100% 命中</text>
  <rect x="24" y="314" width="812" height="52" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="340" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">反向探针（必须变红才算真测得）</text>
  <text x="38" y="362" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">删掉 UNIQUE(event_id) 后重复必须落库；去掉 version 条件后 59,859 行必须回退</text>
</svg>
