<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" width="860" height="304">
  <rect width="860" height="304" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">跨系统一致：抽样会漏，分块校验和能定位；lag 要按时间算</text>
  <rect x="24" y="74" width="250" height="128" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">抽样 0.1%</text>
  <text x="38" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">100 行样本</text>
  <text x="38" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">命中 4.88%</text>
  <text x="38" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">漏检 95.12%</text>
  <rect x="305" y="74" width="250" height="128" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="319" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">抽样 1% / 10%</text>
  <text x="319" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">命中 39.35% / 99.33%</text>
  <text x="319" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">漏检 60.65% / 0.67%</text>
  <text x="319" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">差异 50 / 100,000 行</text>
  <rect x="586" y="74" width="250" height="128" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="600" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">分块校验和</text>
  <text x="600" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">100 块 × 1,000 行</text>
  <text x="600" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">命中 100.00%</text>
  <text x="600" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">且能定位到具体块</text>
  <rect x="24" y="226" width="812" height="58" rx="9" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="252" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">条数 lag 不是时间 lag</text>
  <text x="38" y="274" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">同为 20,000 条 lag：200/s 低峰 = 100 s，10,000/s 高峰 = 2 s，差 50×</text>
</svg>
