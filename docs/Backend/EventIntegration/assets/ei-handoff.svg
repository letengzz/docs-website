<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" width="860" height="304">
  <rect width="860" height="304" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">全量与增量的接缝：丢、重、以及「回退」第三种错</text>
  <rect x="24" y="74" width="250" height="128" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">T0 快照开始</text>
  <text x="38" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">1,000,000 行、耗时 60 s</text>
  <text x="38" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">按主键顺序扫描</text>
  <text x="38" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">写入 2,000 行/s</text>
  <rect x="305" y="74" width="250" height="128" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="319" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">T0~T1 窗口</text>
  <text x="319" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">窗口内变更 120,000 条</text>
  <text x="319" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">49.88% 落在已扫描区</text>
  <text x="319" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">快照里这些行是旧值</text>
  <rect x="586" y="74" width="250" height="128" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="600" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">T1 快照结束</text>
  <text x="600" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">从 T1 订阅 → 丢 120,000</text>
  <text x="600" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">从 T0 订阅 → 重 120,000</text>
  <text x="600" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">占最终量 10.71%</text>
  <path d="M274,138 L303,138" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M555,138 L584,138" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="226" width="812" height="58" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="252" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">去重键对了，版本判定错了，结果还是错</text>
  <text x="38" y="274" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">无条件 upsert 会把 59,859 行的新值回退成旧值 → 必须 WHERE version &amp;lt; :incoming</text>
</svg>
