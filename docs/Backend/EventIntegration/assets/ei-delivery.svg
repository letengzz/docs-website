<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 304" width="860" height="304">
  <rect width="860" height="304" fill="#F8FAFC"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E293B">至少一次投递：重复是常态，幂等是下游的责任</text>
  <rect x="24" y="74" width="250" height="128" rx="9" fill="#EFF6FF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">100 批 × 500 条</text>
  <text x="38" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">共 50,000 事件</text>
  <text x="38" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">位点每批提交一次</text>
  <text x="38" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">位点写入 100 次</text>
  <rect x="305" y="74" width="250" height="128" rx="9" fill="#FEE2E2" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="319" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">2 批位点未提交</text>
  <text x="319" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">处理完成、提交前崩溃</text>
  <text x="319" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">整批重放 1,000 条</text>
  <text x="319" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">重复率 2.00%</text>
  <rect x="586" y="74" width="250" height="128" rx="9" fill="#DCFCE7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="600" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">UNIQUE(event_id)</text>
  <text x="600" y="122" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">下游仍 50,000 行</text>
  <text x="600" y="142" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">拒掉 1,000 条</text>
  <text x="600" y="162" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">累加指标偏差归零</text>
  <path d="M274,138 L303,138" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M555,138 L584,138" stroke="#94A3B8" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <rect x="24" y="226" width="812" height="58" rx="9" fill="#FEF3C7" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="38" y="252" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">位点粒度是成本参数</text>
  <text x="38" y="274" font-family="sans-serif" font-size="13" font-weight="400" fill="#475569">改成每条提交：位点写入 50,000 次，放大 100×；批越大越省，但崩溃重放越贵</text>
</svg>
