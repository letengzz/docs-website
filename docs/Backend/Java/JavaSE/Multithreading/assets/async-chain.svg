<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ac-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3aa76d"/>
    </marker>
  </defs>
  <style>
    .task { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 10; }
    .combine { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .end { fill: #fff7e6; stroke: #d99a2b; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="task" x="20" y="90" width="130" height="50"/>
  <text x="85" y="110">supplyAsync</text>
  <text class="small" x="85" y="128">查询订单</text>

  <line x1="150" y1="115" x2="190" y2="115" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ac-arrow)"/>

  <rect class="task" x="190" y="90" width="130" height="50"/>
  <text x="255" y="110">thenApply</text>
  <text class="small" x="255" y="128">计算金额</text>

  <line x1="320" y1="115" x2="360" y2="115" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ac-arrow)"/>

  <rect class="task" x="360" y="90" width="130" height="50"/>
  <text x="425" y="110">thenCompose</text>
  <text class="small" x="425" y="128">查库存（异步）</text>

  <line x1="490" y1="115" x2="530" y2="115" stroke="#3aa76d" stroke-width="1.5" marker-end="url(#ac-arrow)"/>

  <rect class="combine" x="530" y="90" width="140" height="50"/>
  <text x="600" y="110">thenCombine</text>
  <text class="small" x="600" y="128">合并优惠结果</text>

  <line x1="600" y1="140" x2="600" y2="180" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#ac-arrow)"/>

  <rect class="end" x="530" y="180" width="140" height="50"/>
  <text x="600" y="200">thenAccept</text>
  <text class="small" x="600" y="218">返回/落库</text>

  <rect class="combine" x="190" y="190" width="220" height="50"/>
  <text x="300" y="210">allOf / anyOf</text>
  <text class="small" x="300" y="228">等待全部或任一完成</text>

  <line x1="425" y1="140" x2="300" y2="190" stroke="#4a7bd8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ac-arrow)"/>

  <rect class="end" x="20" y="190" width="150" height="50"/>
  <text x="95" y="210">exceptionally / handle</text>
  <text class="small" x="95" y="228">异常兜底与恢复</text>

  <text class="small" x="380" y="260">CompletableFuture 让异步任务“链式编排”，避免回调地狱和 Future.get() 阻塞</text>
</svg>
