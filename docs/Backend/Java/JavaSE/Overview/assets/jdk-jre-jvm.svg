<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="10" y="10" width="700" height="440" rx="12" fill="#f3f6fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="360" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3a5f">JDK（Java 开发工具包）</text>
  <rect x="40" y="80" width="640" height="250" rx="10" fill="#e8f4ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b5e20">JRE（Java 运行时环境）</text>
  <rect x="70" y="140" width="280" height="160" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="210" y="175" text-anchor="middle" font-size="18" font-weight="bold" fill="#bf360c">JVM（Java 虚拟机）</text>
  <text x="210" y="205" text-anchor="middle" font-size="14" fill="#5d4037">执行字节码</text>
  <text x="210" y="230" text-anchor="middle" font-size="14" fill="#5d4037">屏蔽操作系统差异</text>
  <rect x="380" y="140" width="270" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="515" y="175" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">核心类库</text>
  <text x="515" y="205" text-anchor="middle" font-size="14" fill="#37474f">java.lang / java.util</text>
  <text x="515" y="230" text-anchor="middle" font-size="14" fill="#37474f">java.io / java.net 等</text>
  <rect x="40" y="360" width="640" height="70" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="360" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#311b92">开发工具</text>
  <text x="360" y="416" text-anchor="middle" font-size="14" fill="#4527a0">javac 编译器 · java 启动器 · jar 打包 · jshell 等</text>
</svg>
