<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="sel-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .act { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.5; }
  </style>

  <rect class="box" x="300" y="20" width="220" height="46"/>
  <text x="410" y="48">Selector.select() 阻塞</text>

  <line x1="410" y1="66" x2="410" y2="110" marker-end="url(#sel-arrow)"/>

  <rect class="act" x="300" y="112" width="220" height="46"/>
  <text x="410" y="140">SelectionKey 就绪集合</text>

  <line x1="410" y1="158" x2="410" y2="200" marker-end="url(#sel-arrow)"/>

  <rect class="box" x="300" y="202" width="220" height="46"/>
  <text x="410" y="230">按 key.readyOps 分发处理</text>

  <line x1="300" y1="225" x2="120" y2="225" marker-end="url(#sel-arrow)"/>
  <line x1="520" y1="225" x2="700" y2="225" marker-end="url(#sel-arrow)"/>

  <rect class="act" x="20" y="250" width="200" height="46"/>
  <text x="120" y="278">OP_ACCEPT：接入新连接</text>
  <rect class="act" x="300" y="250" width="220" height="46"/>
  <text x="410" y="278">OP_READ / OP_WRITE：读写</text>
  <rect class="act" x="600" y="250" width="200" height="46"/>
  <text x="700" y="278">业务线程池处理</text>

  <line x1="410" y1="248" x2="410" y2="320" marker-end="url(#sel-arrow)"/>
  <text class="small" x="430" y="300">处理完重新 select</text>

  <text class="small" x="410" y="350">Reactor 模式：一个线程通过 Selector 管理成千上万连接，事件就绪才分发</text>
  <text class="small" x="410" y="370">对比 BIO：一个连接一个线程，连接多了线程数爆炸</text>
</svg>
