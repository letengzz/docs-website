<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cb-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .src { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .buf { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .dst { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.5; }
  </style>

  <rect class="src" x="30" y="80" width="180" height="52"/>
  <text x="120" y="110">Channel（源）</text>

  <rect class="buf" x="300" y="80" width="220" height="52"/>
  <text x="410" y="110">ByteBuffer</text>
  <text class="small" x="410" y="128">position / limit / capacity</text>

  <rect class="dst" x="610" y="80" width="180" height="52"/>
  <text x="700" y="110">Channel（目标）</text>

  <line x1="210" y1="106" x2="300" y2="106" marker-end="url(#cb-arrow)"/>
  <text class="small" x="255" y="95">channel.read(buffer)</text>

  <line x1="520" y1="106" x2="610" y2="106" marker-end="url(#cb-arrow)"/>
  <text class="small" x="565" y="95">buffer.flip()</text>
  <text class="small" x="565" y="130">channel.write(buffer)</text>

  <rect class="buf" x="300" y="190" width="220" height="46"/>
  <text x="410" y="218">缓冲区状态：capacity ≥ limit ≥ position ≥ 0</text>

  <line x1="410" y1="132" x2="410" y2="190" marker-end="url(#cb-arrow)"/>

  <text class="small" x="410" y="265">读写套路：allocate → put/read → flip → get/write → clear/compact</text>
  <text class="small" x="410" y="285">零拷贝：transferTo/transferFrom 直接在 Channel 间搬运，不经过用户态 Buffer</text>
</svg>
