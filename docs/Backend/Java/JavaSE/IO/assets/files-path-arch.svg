<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3aa76d"/>
    </marker>
  </defs>
  <style>
    .api { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .sys { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .dir { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #3aa76d; stroke-width: 1.3; }
  </style>

  <rect class="dir" x="300" y="20" width="180" height="46"/>
  <text x="390" y="48">File 类（java.io.File）</text>

  <rect class="api" x="300" y="110" width="180" height="46"/>
  <text x="390" y="138">Path（java.nio.file.Path）</text>

  <rect class="api" x="540" y="110" width="200" height="46"/>
  <text x="640" y="138">Files 工具类</text>

  <line x1="390" y1="66" x2="390" y2="110" marker-end="url(#fp-arrow)"/>
  <text class="small" x="400" y="95">演进，1.7+</text>

  <line x1="480" y1="133" x2="540" y2="133" marker-end="url(#fp-arrow)"/>

  <rect class="sys" x="40" y="110" width="200" height="46"/>
  <text x="140" y="138">文件系统（FileSystem）</text>

  <line x1="240" y1="133" x2="300" y2="133" marker-end="url(#fp-arrow)"/>
  <text class="small" x="268" y="123">default</text>

  <rect class="api" x="40" y="220" width="200" height="46"/>
  <text x="140" y="248">Files.walk / DirectoryStream</text>
  <rect class="api" x="300" y="220" width="200" height="46"/>
  <text x="400" y="248">Files.readString / writeString</text>
  <rect class="api" x="560" y="220" width="180" height="46"/>
  <text x="650" y="248">Files.walkFileTree</text>

  <line x1="140" y1="156" x2="140" y2="220" marker-end="url(#fp-arrow)"/>
  <line x1="390" y1="156" x2="400" y2="220" marker-end="url(#fp-arrow)"/>
  <line x1="640" y1="156" x2="650" y2="220" marker-end="url(#fp-arrow)"/>

  <text class="small" x="390" y="310">核心：File 侧重兼容旧代码；Path + Files 才是日常开发首选</text>
  <text class="small" x="390" y="335">读写：Files.readAllBytes / readString / writeString（Java 11+ 读、Java 7+ 写）</text>
</svg>
