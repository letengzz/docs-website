<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="nio-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .core { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 10; }
    .sub { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .low { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.3; }
  </style>

  <rect class="core" x="260" y="20" width="300" height="52"/>
  <text x="410" y="50">java.nio 核心三件套</text>

  <line x1="310" y1="72" x2="120" y2="120" marker-end="url(#nio-arrow)"/>
  <line x1="410" y1="72" x2="410" y2="120" marker-end="url(#nio-arrow)"/>
  <line x1="510" y1="72" x2="700" y2="120" marker-end="url(#nio-arrow)"/>

  <rect class="sub" x="40" y="122" width="160" height="46"/>
  <text x="120" y="149">Channel 通道</text>
  <rect class="sub" x="330" y="122" width="160" height="46"/>
  <text x="410" y="149">Buffer 缓冲区</text>
  <rect class="sub" x="620" y="122" width="160" height="46"/>
  <text x="700" y="149">Selector 选择器</text>

  <line x1="120" y1="168" x2="120" y2="210" marker-end="url(#nio-arrow)"/>
  <line x1="410" y1="168" x2="410" y2="210" marker-end="url(#nio-arrow)"/>
  <line x1="700" y1="168" x2="700" y2="210" marker-end="url(#nio-arrow)"/>

  <rect class="low" x="20" y="212" width="200" height="44"/>
  <text x="120" y="239">FileChannel / SocketChannel</text>
  <rect class="low" x="310" y="212" width="200" height="44"/>
  <text x="410" y="239">ByteBuffer / CharBuffer</text>
  <rect class="low" x="600" y="212" width="200" height="44"/>
  <text x="700" y="239">SelectionKey / OP_READ</text>

  <line x1="200" y1="234" x2="310" y2="234" stroke="#3aa76d" stroke-dasharray="5 4" marker-end="url(#nio-arrow)"/>
  <line x1="510" y1="234" x2="600" y2="234" stroke="#3aa76d" stroke-dasharray="5 4" marker-end="url(#nio-arrow)"/>

  <rect class="sub" x="270" y="290" width="280" height="46"/>
  <text x="410" y="318">NIO.2：Files / Path / watch service</text>

  <line x1="410" y1="256" x2="410" y2="290" marker-end="url(#nio-arrow)"/>

  <text class="small" x="410" y="350">工作方式：Channel 负责连接数据源，Buffer 负责搬运数据，Selector 监听多路 IO 事件</text>
</svg>
