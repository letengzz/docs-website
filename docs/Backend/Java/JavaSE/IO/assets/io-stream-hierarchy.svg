<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="io-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .base { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .impl { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .abs { fill: #f3f0ff; stroke: #7b5cd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.3; }
  </style>

  <rect class="base" x="330" y="20" width="160" height="42"/>
  <text x="410" y="46">IO 流</text>

  <line x1="370" y1="62" x2="150" y2="100" marker-end="url(#io-arrow)"/>
  <line x1="450" y1="62" x2="660" y2="100" marker-end="url(#io-arrow)"/>

  <rect class="abs" x="40" y="100" width="220" height="42"/>
  <text x="150" y="126">字节流：InputStream / OutputStream</text>
  <rect class="abs" x="560" y="100" width="220" height="42"/>
  <text x="670" y="126">字符流：Reader / Writer</text>

  <line x1="110" y1="142" x2="80" y2="180" marker-end="url(#io-arrow)"/>
  <line x1="190" y1="142" x2="230" y2="180" marker-end="url(#io-arrow)"/>
  <line x1="620" y1="142" x2="590" y2="180" marker-end="url(#io-arrow)"/>
  <line x1="720" y1="142" x2="750" y2="180" marker-end="url(#io-arrow)"/>

  <rect class="impl" x="20" y="182" width="120" height="40"/>
  <text x="80" y="207">FileInputStream</text>
  <rect class="impl" x="170" y="182" width="120" height="40"/>
  <text x="230" y="207">BufferedInputStream</text>
  <rect class="impl" x="530" y="182" width="120" height="40"/>
  <text x="590" y="207">FileReader</text>
  <rect class="impl" x="680" y="182" width="120" height="40"/>
  <text x="740" y="207">BufferedReader</text>

  <line x1="80" y1="222" x2="80" y2="260" marker-end="url(#io-arrow)"/>
  <line x1="230" y1="222" x2="230" y2="260" marker-end="url(#io-arrow)"/>
  <line x1="590" y1="222" x2="590" y2="260" marker-end="url(#io-arrow)"/>
  <line x1="740" y1="222" x2="740" y2="260" marker-end="url(#io-arrow)"/>

  <rect class="impl" x="20" y="262" width="120" height="40"/>
  <text x="80" y="287">ObjectInputStream</text>
  <rect class="impl" x="170" y="262" width="120" height="40"/>
  <text x="230" y="287">ByteArrayInputStream</text>
  <rect class="impl" x="530" y="262" width="120" height="40"/>
  <text x="590" y="287">InputStreamReader</text>
  <rect class="impl" x="680" y="262" width="120" height="40"/>
  <text x="740" y="287">StringReader</text>

  <rect class="base" x="250" y="340" width="320" height="52"/>
  <text x="410" y="362">NIO（java.nio）</text>
  <text class="small" x="410" y="380">Channel / Buffer / Selector / Files 与 Path</text>

  <line x1="410" y1="302" x2="410" y2="340" stroke-dasharray="5 4" marker-end="url(#io-arrow)"/>
  <text class="small" x="430" y="322">1.7+ 推荐（NIO.2 / AIO）</text>

  <text class="small" x="410" y="405">选择依据：文本 → 字符流；二进制 → 字节流；大文件/网络高并发 → NIO</text>
</svg>
