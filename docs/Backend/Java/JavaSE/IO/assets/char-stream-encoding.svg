<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="cs-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .abs { fill: #f3f0ff; stroke: #7b5cd8; stroke-width: 1.5; rx: 8; }
    .impl { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .mid { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.3; }
  </style>

  <rect class="mid" x="310" y="20" width="200" height="42"/>
  <text x="410" y="46">String（字符）</text>

  <rect class="impl" x="40" y="110" width="200" height="42"/>
  <text x="140" y="136">Writer / OutputStreamWriter</text>
  <rect class="impl" x="580" y="110" width="200" height="42"/>
  <text x="680" y="136">Reader / InputStreamReader</text>

  <line x1="360" y1="62" x2="180" y2="110" marker-end="url(#cs-arrow)"/>
  <line x1="460" y1="62" x2="640" y2="110" marker-end="url(#cs-arrow)"/>
  <text class="small" x="215" y="98">write（编码）</text>
  <text class="small" x="630" y="98">read（解码）</text>

  <rect class="mid" x="310" y="200" width="200" height="42"/>
  <text x="410" y="226">byte[]（字节）</text>

  <line x1="140" y1="152" x2="390" y2="200" marker-end="url(#cs-arrow)"/>
  <line x1="680" y1="152" x2="440" y2="200" marker-end="url(#cs-arrow)"/>

  <text class="small" x="410" y="280">关键：字符编码必须显式指定（UTF-8），否则依赖平台默认编码</text>
  <text class="small" x="410" y="300">FileReader/FileWriter 使用平台默认编码，建议改用 InputStreamReader 指定 charset</text>
</svg>
