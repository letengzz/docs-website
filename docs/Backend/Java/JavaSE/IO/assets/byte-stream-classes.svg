<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="bs-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .abs { fill: #f3f0ff; stroke: #7b5cd8; stroke-width: 1.5; rx: 8; }
    .impl { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.3; }
  </style>

  <rect class="abs" x="300" y="20" width="180" height="42"/>
  <text x="390" y="46">InputStream</text>

  <line x1="330" y1="62" x2="140" y2="105" marker-end="url(#bs-arrow)"/>
  <line x1="380" y1="62" x2="380" y2="105" marker-end="url(#bs-arrow)"/>
  <line x1="450" y1="62" x2="640" y2="105" marker-end="url(#bs-arrow)"/>

  <rect class="impl" x="60" y="107" width="160" height="40"/>
  <text x="140" y="132">FileInputStream</text>
  <rect class="impl" x="300" y="107" width="160" height="40"/>
  <text x="380" y="132">BufferedInputStream</text>
  <rect class="impl" x="560" y="107" width="160" height="40"/>
  <text x="640" y="132">ByteArrayInputStream</text>

  <rect class="abs" x="300" y="190" width="180" height="42"/>
  <text x="390" y="216">OutputStream</text>

  <line x1="330" y1="232" x2="140" y2="270" marker-end="url(#bs-arrow)"/>
  <line x1="380" y1="232" x2="380" y2="270" marker-end="url(#bs-arrow)"/>
  <line x1="450" y1="232" x2="640" y2="270" marker-end="url(#bs-arrow)"/>

  <rect class="impl" x="60" y="272" width="160" height="40"/>
  <text x="140" y="297">FileOutputStream</text>
  <rect class="impl" x="300" y="272" width="160" height="40"/>
  <text x="380" y="297">BufferedOutputStream</text>
  <rect class="impl" x="560" y="272" width="160" height="40"/>
  <text x="640" y="297">ObjectOutputStream</text>

  <text class="small" x="390" y="325">常用组合：FileInputStream + BufferedInputStream；读大文件用 read(byte[], off, len)</text>
</svg>
