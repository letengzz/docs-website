<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="pd-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .loader { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 10; }
    .bootstrap { fill: #fff7e6; stroke: #d99a2b; stroke-width: 1.5; rx: 10; }
    text { fill: #222; font-size: 14px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="bootstrap" x="180" y="20" width="280" height="50"/>
  <text x="320" y="42">Bootstrap ClassLoader</text>
  <text class="small" x="320" y="60">JDK 核心类（rt 核心 / java.lang）</text>

  <line x1="320" y1="70" x2="320" y2="100" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pd-arrow)"/>

  <rect class="loader" x="180" y="100" width="280" height="50"/>
  <text x="320" y="122">Platform ClassLoader（JDK 9+）</text>
  <text class="small" x="320" y="140">模块化平台类</text>

  <line x1="320" y1="150" x2="320" y2="180" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pd-arrow)"/>

  <rect class="loader" x="180" y="180" width="280" height="50"/>
  <text x="320" y="202">Application ClassLoader</text>
  <text class="small" x="320" y="220">classpath 上的应用类</text>

  <line x1="320" y1="230" x2="320" y2="260" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#pd-arrow)"/>

  <rect class="loader" x="140" y="260" width="360" height="50"/>
  <text x="320" y="282">加载请求：先向上委托，父类加载失败再自己加载</text>
  <text class="small" x="320" y="300">避免重复加载 + 保护核心类安全</text>

  <text class="small" x="320" y="330">打破双亲委派：JDBC SPI（线程上下文加载器）、Tomcat、热部署</text>
</svg>
