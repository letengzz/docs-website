<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="gc-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .rec { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .col { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .removed { fill: #f3f3f3; stroke: #999; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="rec" x="220" y="20" width="280" height="46"/>
  <text x="360" y="40">怎么选垃圾收集器？</text>
  <text class="small" x="360" y="58">先定堆大小与延迟目标</text>

  <line x1="260" y1="66" x2="150" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#gc-arrow)"/>
  <line x1="360" y1="66" x2="360" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#gc-arrow)"/>
  <line x1="460" y1="66" x2="570" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#gc-arrow)"/>

  <rect class="col" x="60" y="110" width="180" height="70"/>
  <text x="150" y="135">大多数服务</text>
  <text class="small" x="150" y="155">G1（默认）</text>
  <text class="small" x="150" y="172">停顿目标 + 整堆 Region</text>

  <rect class="col" x="270" y="110" width="180" height="70"/>
  <text x="360" y="135">超大堆 / 低延迟</text>
  <text class="small" x="360" y="155">ZGC</text>
  <text class="small" x="360" y="172">亚毫秒停顿、分代模式</text>

  <rect class="col" x="480" y="110" width="180" height="70"/>
  <text x="570" y="135">低延迟替代</text>
  <text class="small" x="570" y="155">Shenandoah</text>
  <text class="small" x="570" y="172">并发整理对象</text>

  <rect class="col" x="60" y="210" width="180" height="60"/>
  <text x="150" y="232">吞吐优先 / 小堆</text>
  <text class="small" x="150" y="252">Parallel</text>

  <rect class="removed" x="270" y="210" width="180" height="60"/>
  <text x="360" y="232">CMS</text>
  <text class="small" x="360" y="252">JDK 14 已移除</text>

  <rect class="col" x="480" y="210" width="180" height="60"/>
  <text x="570" y="232">学习 / 诊断</text>
  <text class="small" x="570" y="252">Epsilon（不回收）</text>

  <text class="small" x="360" y="300">G1 默认；ZGC/Shenandoah 以 CPU 与内存换低延迟；先压测再选型</text>
</svg>
