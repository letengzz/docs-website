<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="choice-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .q { fill: #fff7e6; stroke: #d99a2b; stroke-width: 2; rx: 12; }
    .ans { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 12px; fill: #666; }
  </style>

  <rect class="q" x="220" y="20" width="280" height="46"/>
  <text x="360" y="39">需求是什么？</text>
  <text class="small" x="360" y="57">先回答“顺序/去重/键值/并发”</text>

  <line x1="250" y1="66" x2="140" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="360" y1="66" x2="360" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="470" y1="66" x2="580" y2="110" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>

  <rect class="ans" x="60" y="110" width="160" height="44"/>
  <text x="140" y="130">有序列表 / 按索引</text>
  <text class="small" x="140" y="146">ArrayList</text>

  <rect class="ans" x="280" y="110" width="160" height="44"/>
  <text x="360" y="130">去重</text>
  <text class="small" x="360" y="146">HashSet</text>

  <rect class="ans" x="500" y="110" width="160" height="44"/>
  <text x="580" y="130">键值对</text>
  <text class="small" x="580" y="146">HashMap</text>

  <line x1="140" y1="154" x2="140" y2="185" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="360" y1="154" x2="360" y2="185" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="580" y1="154" x2="580" y2="185" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>

  <rect class="q" x="60" y="185" width="160" height="34"/>
  <text x="140" y="207">需要顺序？</text>

  <rect class="q" x="280" y="185" width="160" height="34"/>
  <text x="360" y="207">需要顺序/排序？</text>

  <rect class="q" x="500" y="185" width="160" height="34"/>
  <text x="580" y="207">并发共享？</text>

  <line x1="70" y1="219" x2="70" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="186" y1="219" x2="186" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="302" y1="219" x2="302" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="418" y1="219" x2="418" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="534" y1="219" x2="534" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>
  <line x1="650" y1="219" x2="650" y2="252" stroke="#4a7bd8" stroke-width="1.5" marker-end="url(#choice-arrow)"/>

  <rect class="ans" x="15" y="255" width="110" height="38"/>
  <text x="70" y="271">是</text>
  <text class="small" x="70" y="287">LinkedList</text>

  <rect class="ans" x="131" y="255" width="110" height="38"/>
  <text x="186" y="271">否</text>
  <text class="small" x="186" y="287">ArrayList</text>

  <rect class="ans" x="247" y="255" width="110" height="38"/>
  <text x="302" y="271">插入序</text>
  <text class="small" x="302" y="287">LinkedHashSet</text>

  <rect class="ans" x="363" y="255" width="110" height="38"/>
  <text x="418" y="271">排序</text>
  <text class="small" x="418" y="287">TreeSet</text>

  <rect class="ans" x="479" y="255" width="110" height="38"/>
  <text x="534" y="271">是</text>
  <text class="small" x="534" y="287">ConcurrentHashMap</text>

  <rect class="ans" x="595" y="255" width="110" height="38"/>
  <text x="650" y="271">否</text>
  <text class="small" x="650" y="287">HashMap</text>

  <text class="small" x="360" y="330">补充：去重 + 插入顺序 = LinkedHashSet；键有序 = TreeMap；读多写少 = CopyOnWriteArrayList</text>
  <text class="small" x="360" y="350">线程安全 = ConcurrentHashMap / CopyOnWriteArrayList / BlockingQueue</text>
  <text class="small" x="360" y="390">完整对比与选型见各专题页与 FAQ</text>
</svg>
