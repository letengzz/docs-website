<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .title { fill: #222; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .cell { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .node { fill: #fff7e6; stroke: #d99a2b; stroke-width: 1.5; rx: 8; }
    .arrow { stroke: #3aa76d; stroke-width: 1.5; }
    .small { font-size: 12px; fill: #666; text-anchor: middle; }
  </style>

  <text class="title" x="180" y="30">ArrayList：连续数组</text>
  <text class="title" x="560" y="30">LinkedList：双向链表</text>

  <rect class="cell" x="30" y="60" width="70" height="50"/>
  <text x="65" y="90" text-anchor="middle">A</text>
  <rect class="cell" x="100" y="60" width="70" height="50"/>
  <text x="135" y="90" text-anchor="middle">B</text>
  <rect class="cell" x="170" y="60" width="70" height="50"/>
  <text x="205" y="90" text-anchor="middle">C</text>
  <rect class="cell" x="240" y="60" width="70" height="50"/>
  <text x="275" y="90" text-anchor="middle">D</text>
  <rect class="cell" x="310" y="60" width="40" height="50" fill="#f3f3f3" stroke="#999"/>
  <text x="330" y="90" text-anchor="middle">…</text>

  <line x1="30" y1="140" x2="350" y2="140" class="arrow"/>
  <text class="small" x="190" y="160">按下标访问 O(1)，中间插入/删除 O(n)</text>

  <rect class="node" x="400" y="60" width="150" height="46"/>
  <text x="475" y="86" text-anchor="middle">A ⇄ B ⇄ C ⇄ D</text>

  <line x1="475" y1="106" x2="475" y2="140" class="arrow"/>
  <text class="small" x="540" y="160">头尾插入/删除 O(1)，按下标访问 O(n)</text>

  <text class="small" x="190" y="220">随机访问/遍历多 → ArrayList（缓存友好）</text>
  <text class="small" x="190" y="240">频繁头尾操作/当队列栈 → LinkedList 或 ArrayDeque</text>
  <text class="small" x="190" y="260">不要只看“插入 O(1)”，要先找到位置再插入</text>
</svg>
