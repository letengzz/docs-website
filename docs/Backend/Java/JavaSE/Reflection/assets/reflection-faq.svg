<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="fq-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .warn { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .ok { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="box" x="40" y="40" width="220" height="60"/>
  <text x="150" y="68">反射慢？</text>
  <text class="small" x="150" y="88">比直接调用慢，可缓存 + 批量</text>

  <rect class="warn" x="300" y="40" width="220" height="60"/>
  <text x="410" y="68">setAccessible 滥用？</text>
  <text class="small" x="410" y="88">突破封装，Java 9+ 模块受限</text>

  <rect class="ok" x="560" y="40" width="220" height="60"/>
  <text x="670" y="68">动态代理怎么选？</text>
  <text class="small" x="670" y="88">有接口用 JDK，无接口用 CGLIB</text>

  <rect class="box" x="40" y="170" width="220" height="60"/>
  <text x="150" y="198">注解找不到？</text>
  <text class="small" x="150" y="218">Retention 必须是 RUNTIME</text>

  <rect class="warn" x="300" y="170" width="220" height="60"/>
  <text x="410" y="198">Spring AOP 失效？</text>
  <text class="small" x="410" y="218">自调用不走代理，final 方法不可代理</text>

  <rect class="ok" x="560" y="170" width="220" height="60"/>
  <text x="670" y="198">反射泛型信息？</text>
  <text class="small" x="670" y="218">Type / ParameterizedType 读取</text>

  <text class="small" x="410" y="275">原则：框架层大胆用反射，业务代码谨慎用；能用编译期解决就不用运行期反射</text>
</svg>
