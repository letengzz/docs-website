<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="or-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .ent { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .db { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="ent" x="40" y="50" width="220" height="70"/>
  <text x="150" y="80">实体类 + 注解</text>
  <text class="small" x="150" y="100">@Table / @Column</text>
  <text class="small" x="150" y="116">@Id 标注主键</text>

  <rect class="mid" x="310" y="50" width="220" height="70"/>
  <text x="420" y="80">MiniORM 框架</text>
  <text class="small" x="420" y="100">反射读取注解 → 拼 SQL</text>
  <text class="small" x="420" y="116">ResultSet → 实体映射</text>

  <rect class="db" x="580" y="50" width="220" height="70"/>
  <text x="690" y="80">JDBC / 数据库</text>
  <text class="small" x="690" y="100">INSERT / SELECT</text>
  <text class="small" x="690" y="116">类型转换</text>

  <line x1="260" y1="85" x2="310" y2="85" marker-end="url(#or-arrow)"/>
  <line x1="530" y1="85" x2="580" y2="85" marker-end="url(#or-arrow)"/>

  <rect class="db" x="310" y="210" width="220" height="60"/>
  <text x="420" y="238">save(entity) → INSERT</text>
  <text class="small" x="420" y="258">find(id) → SELECT</text>

  <rect class="mid" x="310" y="300" width="220" height="40"/>
  <text x="420" y="325">扩展：级联 / 缓存 / 延迟加载</text>

  <line x1="420" y1="120" x2="420" y2="210" marker-end="url(#or-arrow)"/>
  <line x1="420" y1="270" x2="420" y2="300" marker-end="url(#or-arrow)"/>

  <text class="small" x="690" y="180">MyBatis 也是「注解 + 反射」的集大成者</text>
</svg>
