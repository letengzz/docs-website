<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="rf-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .src { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .meta { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="src" x="40" y="40" width="200" height="60"/>
  <text x="140" y="66">.class 字节码文件</text>
  <text class="small" x="140" y="86">磁盘 / 网络 / 动态生成</text>

  <rect class="mid" x="320" y="40" width="200" height="60"/>
  <text x="420" y="66">ClassLoader 类加载</text>
  <text class="small" x="420" y="86">加载 → 链接 → 初始化</text>

  <rect class="meta" x="600" y="40" width="200" height="60"/>
  <text x="700" y="66">Class&lt;T&gt; 对象</text>
  <text class="small" x="700" y="86">方法区的类型元数据镜像</text>

  <line x1="240" y1="70" x2="320" y2="70" marker-end="url(#rf-arrow)"/>
  <line x1="520" y1="70" x2="600" y2="70" marker-end="url(#rf-arrow)"/>

  <rect class="meta" x="40" y="190" width="180" height="52"/>
  <text x="130" y="218">Field 字段</text>
  <rect class="meta" x="240" y="190" width="180" height="52"/>
  <text x="330" y="218">Method 方法</text>
  <rect class="meta" x="440" y="190" width="180" height="52"/>
  <text x="530" y="218">Constructor 构造器</text>
  <rect class="meta" x="640" y="190" width="180" height="52"/>
  <text x="730" y="218">Annotation 注解</text>

  <line x1="650" y1="100" x2="170" y2="190" marker-end="url(#rf-arrow)"/>
  <line x1="680" y1="100" x2="370" y2="190" marker-end="url(#rf-arrow)"/>
  <line x1="710" y1="100" x2="570" y2="190" marker-end="url(#rf-arrow)"/>
  <line x1="730" y1="100" x2="770" y2="190" marker-end="url(#rf-arrow)"/>

  <rect class="src" x="240" y="290" width="360" height="54"/>
  <text x="420" y="318">框架应用：Spring IOC / MyBatis / ORM / 动态代理</text>
  <line x1="420" y1="242" x2="420" y2="290" marker-end="url(#rf-arrow)"/>

  <text class="small" x="420" y="360">核心：运行时拿到 Class 对象 → 获取成员元数据 → 动态调用 / 读写 / 生成代理</text>
</svg>
