<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="an-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .def { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .use { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .proc { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="def" x="40" y="40" width="220" height="70"/>
  <text x="150" y="70">@interface 定义</text>
  <text class="small" x="150" y="92">@Target / @Retention</text>
  <text class="small" x="150" y="106">@Inherited / @Repeatable</text>

  <rect class="use" x="310" y="40" width="220" height="70"/>
  <text x="420" y="70">@注解 使用</text>
  <text class="small" x="420" y="92">标注类 / 方法 / 字段</text>
  <text class="small" x="420" y="106">附属于成员元数据</text>

  <rect class="proc" x="580" y="40" width="220" height="70"/>
  <text x="690" y="70">运行时处理</text>
  <text class="small" x="690" y="92">getAnnotations / isAnnotationPresent</text>
  <text class="small" x="690" y="106">APT 编译期处理</text>

  <line x1="260" y1="75" x2="310" y2="75" marker-end="url(#an-arrow)"/>
  <line x1="530" y1="75" x2="580" y2="75" marker-end="url(#an-arrow)"/>

  <rect class="proc" x="170" y="180" width="500" height="80"/>
  <text x="420" y="210">Retention 决定注解生命周期</text>
  <text class="small" x="420" y="234">SOURCE：编译期丢弃（@Override）</text>
  <text class="small" x="420" y="252">CLASS：class 文件中（默认，运行期不可反射）</text>
  <text class="small" x="420" y="270">RUNTIME：JVM 保留，可反射读取（框架注解）</text>

  <line x1="420" y1="110" x2="420" y2="180" marker-end="url(#an-arrow)"/>

  <text class="small" x="420" y="320">框架例子：@Component / @Transactional / @Table / @Column</text>
</svg>
