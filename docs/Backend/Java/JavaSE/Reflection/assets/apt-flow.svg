<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="apt-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .src { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mid { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .out { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="src" x="40" y="40" width="220" height="60"/>
  <text x="150" y="66">源码 + 注解</text>
  <text class="small" x="150" y="86">@AutoService / @Builder</text>

  <rect class="mid" x="310" y="40" width="220" height="60"/>
  <text x="420" y="66">javac 调用注解处理器</text>
  <text class="small" x="420" y="86">javax.annotation.processing</text>

  <rect class="out" x="580" y="40" width="220" height="60"/>
  <text x="690" y="66">生成源码 / 校验</text>
  <text class="small" x="690" y="86">JavaPoet / javax.lang.model</text>

  <line x1="260" y1="70" x2="310" y2="70" marker-end="url(#apt-arrow)"/>
  <line x1="530" y1="70" x2="580" y2="70" marker-end="url(#apt-arrow)"/>

  <rect class="out" x="310" y="180" width="220" height="54"/>
  <text x="420" y="208">编译期代码生成</text>
  <text class="small" x="420" y="226">Lombok / MapStruct</text>

  <line x1="690" y1="100" x2="690" y2="160" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="690" y1="160" x2="420" y2="180" marker-end="url(#apt-arrow)"/>

  <rect class="mid" x="580" y="180" width="220" height="54"/>
  <text x="690" y="208">运行时不再需要反射</text>
  <text class="small" x="690" y="226">性能更优，提前发现错误</text>

  <text class="small" x="420" y="285">对比：运行期反射处理注解灵活但慢；编译期 APT 生成代码快但需重新编译</text>
  <text class="small" x="420" y="305">典型：Lombok @Getter/@Builder、MapStruct @Mapper 都是 APT</text>
</svg>
