<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="ct-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .act { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="step" x="40" y="40" width="220" height="54"/>
  <text x="150" y="68">Class.getConstructor</text>
  <text class="small" x="150" y="86">按参数类型精确匹配</text>

  <rect class="step" x="300" y="40" width="220" height="54"/>
  <text x="410" y="68">Constructor 对象</text>
  <text class="small" x="410" y="86">getParameterCount / 泛型信息</text>

  <rect class="act" x="560" y="40" width="220" height="54"/>
  <text x="670" y="68">newInstance(args)</text>
  <text class="small" x="670" y="86">创建实例（推荐方式）</text>

  <line x1="260" y1="67" x2="300" y2="67" marker-end="url(#ct-arrow)"/>
  <line x1="520" y1="67" x2="560" y2="67" marker-end="url(#ct-arrow)"/>

  <rect class="step" x="40" y="180" width="220" height="54"/>
  <text x="150" y="208">Class.newInstance</text>
  <text class="small" x="150" y="226">已废弃（Java 9+），仅无参构造</text>

  <rect class="act" x="300" y="180" width="220" height="54"/>
  <text x="410" y="208">私有构造</text>
  <text class="small" x="410" y="226">setAccessible(true) 后可调用</text>

  <line x1="260" y1="207" x2="300" y2="207" marker-end="url(#ct-arrow)"/>

  <text class="small" x="410" y="275">Spring 等框架通过构造器反射完成依赖注入与实例化</text>
</svg>
