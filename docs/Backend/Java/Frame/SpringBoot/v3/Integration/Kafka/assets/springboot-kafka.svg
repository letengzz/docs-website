<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">SpringBoot 与 Kafka 的整合结构</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">生产者由 KafkaTemplate 统一出口，消费者靠 @KafkaListener 注册后由容器托管线程</text>

  <rect x="40" y="86" width="230" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">应用（Spring 容器）</text>
  <line x1="60" y1="128" x2="250" y2="128" stroke="#c7d2fe" stroke-width="1"/>
  <text x="60" y="152" font-size="11" font-family="monospace" fill="#1f2937">@Service</text>
  <text x="60" y="172" font-size="11" font-family="monospace" fill="#1f2937">KafkaTemplate.send(...)</text>
  <text x="60" y="196" font-size="11" fill="#4b5563">序列化：JsonSerializer</text>
  <text x="60" y="218" font-size="11" fill="#4b5563">发送结果：CompletableFuture</text>

  <rect x="300" y="86" width="250" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="425" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Kafka Cluster</text>
  <line x1="320" y1="128" x2="530" y2="128" stroke="#fde68a" stroke-width="1"/>
  <text x="320" y="152" font-size="11" fill="#4b5563">Topic 分区（partition）</text>
  <text x="320" y="174" font-size="11" fill="#4b5563">分区内有序，跨分区无序</text>
  <text x="320" y="198" font-size="11" fill="#4b5563">副本（replica）做容错</text>
  <text x="320" y="220" font-size="11" fill="#4b5563">__consumer_offsets 记录位点</text>

  <rect x="580" y="86" width="260" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">消费侧</text>
  <line x1="600" y1="128" x2="820" y2="128" stroke="#a7f3d0" stroke-width="1"/>
  <text x="600" y="152" font-size="11" font-family="monospace" fill="#1f2937">@KafkaListener(topics=...)</text>
  <text x="600" y="174" font-size="11" fill="#4b5563">容器并发度 = concurrency</text>
  <text x="600" y="198" font-size="11" fill="#4b5563">ack 模式决定何时提交位点</text>
  <text x="600" y="220" font-size="11" fill="#4b5563">反序列化 KeyValueDeserializer</text>

  <path d="M270 161 L298 161" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M550 161 L578 161" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="40" y="256" width="800" height="96" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="440" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#be123c">三条最容易出问题的配置</text>
  <text x="60" y="308" font-size="12" fill="#4b5563">① 消费并发度 concurrency 超过分区数 → 多出来的消费者线程一直空转，拿不到任何分区</text>
  <text x="60" y="330" font-size="12" fill="#4b5563">② 手动提交位点却先提交后处理 → 处理失败时消息已「消费成功」，消息静默丢失</text>
  <text x="60" y="350" font-size="11" fill="#9f1239">③ 未设置 group-id 或重复 → 每次重启都从头消费，或与别的应用互相抢分区</text>

  <rect x="40" y="366" width="800" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">版本要点（2026-10 核对）</text>
  <text x="440" y="416" text-anchor="middle" font-size="12" fill="#4b5563">Kafka 4.x 起只支持 KRaft，ZooKeeper 已移除；3.9.x 是 ZooKeeper 模式最后一代，仅存量集群使用</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
