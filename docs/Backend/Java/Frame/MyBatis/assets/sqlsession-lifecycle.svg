<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">SqlSessionUtils：把三件事固定下来</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">工厂只建一次 · 会话用完必关 · 事务边界明确</text>

  <rect x="45" y="82" width="380" height="268" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="235" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#be123c">✗ 每次调用都重建</text>
  <text x="235" y="138" text-anchor="middle" font-size="11" font-family="monospace" fill="#9f1239">new SqlSessionFactoryBuilder().build(is)</text>
  <line x1="70" y1="154" x2="400" y2="154" stroke="#fecdd3" stroke-width="1"/>
  <text x="72" y="180" font-size="12" fill="#4b5563">1. 每次都解析 XML、重建 Configuration</text>
  <text x="72" y="204" font-size="12" fill="#4b5563">2. openSession(true) — 自动提交</text>
  <text x="72" y="228" font-size="12" fill="#4b5563">3. 没有 close() — 连接不归还</text>
  <text x="72" y="252" font-size="12" fill="#4b5563">4. InputStream 未关闭</text>
  <text x="72" y="276" font-size="12" fill="#4b5563">5. 吞掉 IOException，丢失线索</text>
  <text x="235" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#be123c">结果：耗时成倍 + 连接池耗尽</text>
  <text x="235" y="334" text-anchor="middle" font-size="11" fill="#9f1239">多条 SQL 也无法组成一个事务</text>

  <rect x="455" y="82" width="380" height="268" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="645" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">✓ 单例工厂 + ThreadLocal</text>
  <text x="645" y="138" text-anchor="middle" font-size="11" font-family="monospace" fill="#065f46">static volatile SqlSessionFactory factory</text>
  <line x1="480" y1="154" x2="810" y2="154" stroke="#a7f3d0" stroke-width="1"/>
  <text x="482" y="180" font-size="12" fill="#4b5563">1. 双检锁，全局只构建一次</text>
  <text x="482" y="204" font-size="12" fill="#4b5563">2. ThreadLocal 持有当前会话</text>
  <text x="482" y="228" font-size="12" fill="#4b5563">3. finally 中 close() 并 remove()</text>
  <text x="482" y="252" font-size="12" fill="#4b5563">4. 显式 commit() / rollback()</text>
  <text x="482" y="276" font-size="12" fill="#4b5563">5. 异常带原因抛出，便于定位</text>
  <text x="645" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">结果：一次构建，多线程各用各的</text>
  <text x="645" y="334" text-anchor="middle" font-size="11" fill="#065f46">同线程内多次取到同一个会话 → 可共享事务</text>

  <rect x="45" y="368" width="790" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">并发安全边界：SqlSessionFactory 线程安全，SqlSession 不是</text>
  <text x="440" y="418" text-anchor="middle" font-size="12" fill="#64748b">工厂可以全局共享；会话必须「一个线程一个」，跨线程复用会出现结果串台与事务错乱</text>
  <text x="440" y="438" text-anchor="middle" font-size="11" fill="#94a3b8">一旦接入 mybatis-spring，交由 SqlSessionTemplate 管理，不要再自行 openSession</text>
</svg>
