<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="rag-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .doc { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .vec { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    .llm { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="doc" x="40" y="50" width="200" height="70"/>
  <text x="140" y="80">文档切片（Chunk）</text>
  <text class="small" x="140" y="100">加载 → 切分 → Embedding</text>

  <rect class="vec" x="310" y="50" width="200" height="70"/>
  <text x="410" y="80">向量数据库</text>
  <text class="small" x="410" y="100">Milvus / pgvector / ES</text>

  <line x1="240" y1="85" x2="310" y2="85" marker-end="url(#rag-arrow)"/>

  <rect class="llm" x="580" y="50" width="200" height="70"/>
  <text x="680" y="80">大语言模型（LLM）</text>
  <text class="small" x="680" y="100">生成最终回答</text>

  <line x1="510" y1="85" x2="580" y2="85" marker-end="url(#rag-arrow)"/>
  <text class="small" x="545" y="75">检索结果作为上下文</text>

  <rect class="doc" x="40" y="200" width="200" height="60"/>
  <text x="140" y="228">用户提问</text>

  <rect class="vec" x="310" y="200" width="200" height="60"/>
  <text x="410" y="228">相似度检索 TopK</text>

  <line x1="240" y1="230" x2="310" y2="230" marker-end="url(#rag-arrow)"/>
  <line x1="510" y1="230" x2="680" y2="175" stroke="#4a7bd8" stroke-dasharray="5 4"/>
  <line x1="680" y1="175" x2="680" y2="290" stroke="#4a7bd8"/>
  <text class="small" x="695" y="250">问答：检索 + 生成</text>

  <rect class="llm" x="580" y="200" width="200" height="60"/>
  <text x="680" y="228">回答用户</text>

  <text class="small" x="410" y="310">RAG = 检索增强生成：先用向量检索找到相关资料，再交给 LLM 生成答案</text>
  <text class="small" x="410" y="330">LangChain4j 提供 DocumentSplitter / EmbeddingStore / ContentRetriever 全链路 API</text>
</svg>
