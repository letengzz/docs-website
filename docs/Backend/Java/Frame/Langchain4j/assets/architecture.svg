<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7bd8"/>
    </marker>
  </defs>
  <style>
    .core { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; rx: 8; }
    .mod { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; rx: 8; }
    .ext { fill: #fff3e0; stroke: #e8852d; stroke-width: 1.5; rx: 8; }
    text { fill: #222; font-size: 13px; text-anchor: middle; }
    .small { font-size: 11px; fill: #666; }
    line { stroke: #4a7bd8; stroke-width: 1.4; }
  </style>

  <rect class="core" x="290" y="30" width="240" height="54"/>
  <text x="410" y="61">LangChain4j 核心</text>

  <line x1="350" y1="84" x2="130" y2="130" marker-end="url(#arch-arrow)"/>
  <line x1="410" y1="84" x2="410" y2="130" marker-end="url(#arch-arrow)"/>
  <line x1="470" y1="84" x2="690" y2="130" marker-end="url(#arch-arrow)"/>

  <rect class="mod" x="40" y="132" width="180" height="60"/>
  <text x="130" y="160">模型接入</text>
  <text class="small" x="130" y="178">OpenAI / 本地模型</text>

  <rect class="mod" x="320" y="132" width="180" height="60"/>
  <text x="410" y="160">对话与记忆</text>
  <text class="small" x="410" y="178">ChatMemory / 会话管理</text>

  <rect class="mod" x="600" y="132" width="180" height="60"/>
  <text x="690" y="160">工具调用</text>
  <text class="small" x="690" y="178">Function Calling / Tools</text>

  <rect class="ext" x="40" y="240" width="180" height="54"/>
  <text x="130" y="268">RAG 检索</text>
  <rect class="ext" x="320" y="240" width="180" height="54"/>
  <text x="410" y="268">AI 服务接入</text>
  <rect class="ext" x="600" y="240" width="180" height="54"/>
  <text x="690" y="268">Spring Boot 集成</text>

  <line x1="130" y1="192" x2="130" y2="240" marker-end="url(#arch-arrow)"/>
  <line x1="410" y1="192" x2="410" y2="240" marker-end="url(#arch-arrow)"/>
  <line x1="690" y1="192" x2="690" y2="240" marker-end="url(#arch-arrow)"/>

  <text class="small" x="410" y="325">架构：核心 API + 模型抽象 + 记忆/工具/RAG 模块 + 框架集成</text>
  <text class="small" x="410" y="345">设计目标：Java 开发者用统一 API 接入各类 LLM 与向量库</text>
</svg>
