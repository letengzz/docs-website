<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Spring 疑难问题的三条主线</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b7280">先归因，再搜错误信息——多数问题不在语法，而在容器行为</text>

  <rect x="40" y="82" width="255" height="290" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="167" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">① 代理边界</text>
  <text x="167" y="134" text-anchor="middle" font-size="11" fill="#6366f1">注解失效类问题</text>
  <line x1="62" y1="150" x2="272" y2="150" stroke="#c7d2fe" stroke-width="1"/>
  <text x="60" y="176" font-size="12" font-weight="bold" fill="#3730a3">@Transactional 不回滚</text>
  <text x="60" y="196" font-size="11" fill="#4b5563">同类方法内部调用</text>
  <text x="60" y="214" font-size="11" fill="#4b5563">方法非 public</text>
  <text x="60" y="232" font-size="11" fill="#4b5563">对象是 new 出来的</text>
  <text x="60" y="250" font-size="11" fill="#4b5563">异常被 catch 吞掉</text>
  <text x="60" y="278" font-size="12" font-weight="bold" fill="#3730a3">@Async / @Cacheable</text>
  <text x="60" y="298" font-size="11" fill="#4b5563">同一个根因：没走代理</text>
  <text x="167" y="336" text-anchor="middle" font-size="11" fill="#6366f1">自检：AopUtils.isAopProxy(bean)</text>

  <rect x="312" y="82" width="255" height="290" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="439" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">② 生命周期</text>
  <text x="439" y="134" text-anchor="middle" font-size="11" fill="#10b981">启动与状态类问题</text>
  <line x1="334" y1="150" x2="544" y2="150" stroke="#a7f3d0" stroke-width="1"/>
  <text x="332" y="176" font-size="12" font-weight="bold" fill="#065f46">循环依赖</text>
  <text x="332" y="196" font-size="11" fill="#4b5563">BeanCurrentlyInCreation</text>
  <text x="332" y="214" font-size="11" fill="#4b5563">构造器注入无法解环</text>
  <text x="332" y="242" font-size="12" font-weight="bold" fill="#065f46">单例持有可变状态</text>
  <text x="332" y="262" font-size="11" fill="#4b5563">并发下字段被共享覆盖</text>
  <text x="332" y="290" font-size="12" font-weight="bold" fill="#065f46">初始化顺序</text>
  <text x="332" y="310" font-size="11" fill="#4b5563">@PostConstruct 里用未就绪依赖</text>
  <text x="439" y="336" text-anchor="middle" font-size="11" fill="#10b981">自检：--debug 看条件装配报告</text>

  <rect x="584" y="82" width="255" height="290" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="711" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">③ 依赖解析</text>
  <text x="711" y="134" text-anchor="middle" font-size="11" fill="#f97316">找不到 / 找太多</text>
  <line x1="606" y1="150" x2="816" y2="150" stroke="#fed7aa" stroke-width="1"/>
  <text x="604" y="176" font-size="12" font-weight="bold" fill="#9a3412">NoSuchBeanDefinition</text>
  <text x="604" y="196" font-size="11" fill="#4b5563">不在扫描包内 / 缺注解</text>
  <text x="604" y="214" font-size="11" fill="#4b5563">被 @Conditional 排除</text>
  <text x="604" y="242" font-size="12" font-weight="bold" fill="#9a3412">NoUniqueBeanDefinition</text>
  <text x="604" y="262" font-size="11" fill="#4b5563">同类型多实现</text>
  <text x="604" y="280" font-size="11" fill="#4b5563">用 @Qualifier / @Primary</text>
  <text x="604" y="308" font-size="12" font-weight="bold" fill="#9a3412">javax → jakarta</text>
  <text x="604" y="328" font-size="11" fill="#4b5563">Spring 6 与旧依赖混用</text>

  <rect x="40" y="390" width="799" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="424" text-anchor="middle" font-size="12" fill="#334155">Spring 6 的硬门槛：JDK 17+ 与 Jakarta EE 9+（包名由 javax.* 迁移为 jakarta.*），旧教程代码直接照抄常在此处翻车</text>
</svg>
