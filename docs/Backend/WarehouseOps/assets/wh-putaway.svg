<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="四种上架策略：省的是拣选，付的是上架">
<title>四种上架策略：省的是拣选，付的是上架</title>
<rect x="0" y="0" width="880" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">四种上架策略：省的是拣选，付的是上架</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">本机读数：2000 个 SKU、60% 热销、1000 次拣选</text>
<rect x="60" y="183" width="40" height="157" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="108" y="184" width="40" height="156" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="175" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">219.38</text>
<text x="128" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">217.04</text>
<text x="104" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">看见空位就放</text>
<rect x="260" y="193" width="40" height="147" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<rect x="308" y="187" width="40" height="153" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="280" y="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">204.85</text>
<text x="328" y="179" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">213.05</text>
<text x="304" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">随机空位</text>
<rect x="460" y="235" width="40" height="105" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="508" y="196" width="40" height="144" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480" y="227" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">147.01</text>
<text x="528" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">200.6</text>
<text x="504" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">ABC 分区</text>
<rect x="660" y="245" width="40" height="95" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<rect x="708" y="245" width="40" height="95" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="680" y="237" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">132.47</text>
<text x="728" y="237" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">132.87</text>
<text x="704" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">就近填空</text>
<line x1="40" y1="340" x2="840" y2="340" stroke="#94a3b8" stroke-width="1.4"/>
<text x="60" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">深色柱 = 拣选侧平均行走（m）  浅色柱 = 上架侧平均行走（m）</text>
<text x="640" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">为什么「就近填空」不是答案</text>
<text x="640" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">它把库位往门口压，拣选与上架都省，</text>
<text x="640" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">代价是同 SKU 分散、扩容与退货无位可放；</text>
<text x="640" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">ABC 的拣选收益要靠波次路径才兑现。</text>
</svg>
