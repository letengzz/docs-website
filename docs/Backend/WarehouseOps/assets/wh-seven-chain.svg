<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="七段库内作业链：每一段都有自己的「完成」定义">
<title>七段库内作业链：每一段都有自己的「完成」定义</title>
<rect x="0" y="0" width="980" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">七段库内作业链：每一段都有自己的「完成」定义</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">六段的失败是安静的——货照样出，只是数量、库位、成本对不上</text>
<rect x="20" y="88" width="124" height="92" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="82" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 到货预约</text>
<text x="82" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">月台与卸货位</text>
<text x="82" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：显性</text>
<line x1="144" y1="134" x2="154" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="156" y="88" width="124" height="92" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="218" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 收货上架</text>
<text x="218" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">数量 + 库位</text>
<text x="218" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="280" y1="134" x2="290" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="292" y="88" width="124" height="92" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 库存记账</text>
<text x="354" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">余量 + 流水</text>
<text x="354" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="416" y1="134" x2="426" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="428" y="88" width="124" height="92" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="490" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 波次拣选</text>
<text x="490" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">拣货单行</text>
<text x="490" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="552" y1="134" x2="562" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="564" y="88" width="124" height="92" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="626" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 复核打包</text>
<text x="626" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">包裹 + 称重</text>
<text x="626" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="688" y1="134" x2="698" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="700" y="88" width="124" height="92" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="762" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 出库交接</text>
<text x="762" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">交接单签收</text>
<text x="762" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="824" y1="134" x2="834" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="836" y="88" width="124" height="92" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="898" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑦ 循环盘点</text>
<text x="898" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">差异与调整</text>
<text x="898" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：最后一道</text>
<text x="28" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">「完成」的三种含义必须分开：作业完成（人干完了）/ 单据完成（系统记账了）/ 库存完成（可售池变了）</text>
<rect x="20" y="240" width="306" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">截至 ② 收货</text>
<text x="34" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">账面有货、货位没有 → 短拣</text>
<rect x="20" y="314" width="306" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">截至 ⑤ 打包</text>
<text x="34" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">包裹发出、订单未回写 → 重复发货</text>
<rect x="20" y="388" width="306" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="414" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">截至 ⑥ 交接</text>
<text x="34" y="434" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">承运商签收、系统未关单 → 超卖</text>
<text x="348" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">「安静」的含义：没有异常，只有一列数字慢慢偏离</text>
<text x="348" y="284" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">本机读数（200 单 / 575 行）：单单拣货 31,611.2 m，波次 20 单 3,446.4 m</text>
<text x="348" y="304" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">拣货位 4.9% 的拣货任务出现短拣，而账面上每个库位都有货</text>
<text x="348" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">盘点抽 500 个库位（10%）：随机抽样只覆盖 10.6% 的差异金额</text>
</svg>
