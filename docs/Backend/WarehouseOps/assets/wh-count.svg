<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="盘点抽样的目的不是「点完」，是「用最少的库位找到最多的差异」">
<title>盘点抽样的目的不是「点完」，是「用最少的库位找到最多的差异」</title>
<rect x="0" y="0" width="880" height="380" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">盘点抽样的目的不是「点完」，是「用最少的库位找到最多的差异」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">本机读数：5000 个库位、206 条差异、差异金额 315,664.02 元</text>
