<text x="525" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">A 类 20%</text>
<text x="643" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">B 类 40%</text>
<text x="761" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">C 类 40%</text>
<text x="458" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">命中 39 条 / 64,383.93 元（差异金额覆盖 20.4%）</text>
<text x="458" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">同样 500 个库位，覆盖翻倍——因为差异集中在 A 类</text>
<text x="24" y="362" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">两者都不是「更准」，而是回答了不同的问题：随机抽样估总体，分层抽样找高价值差异。</text>
