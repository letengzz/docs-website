<text x="38" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">看起来「点了 10%」，实际只覆盖了一成风险</text>
