<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="四个作业指标，四个必须写清的分母">
<title>四个作业指标，四个必须写清的分母</title>
<rect x="0" y="0" width="900" height="420" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">四个作业指标，四个必须写清的分母</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">同一个波次，三个分母给出三个达成率</text>
<rect x="24" y="84" width="852" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">一个波次：20 单 / 58 行 / 143 件，完成 16 单 / 52 行 / 121 件</text>
<rect x="60" y="130" width="80" height="96" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="100" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">80.0%</text>
<text x="100" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">按单</text>
<text x="152" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">16 / 20</text>
<rect x="330" y="119" width="80" height="107" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="370" y="111" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">89.66%</text>
<text x="370" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">按行</text>
<text x="422" y="173" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">52 / 58</text>
<rect x="600" y="125" width="80" height="101" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="640" y="117" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">84.62%</text>
<text x="640" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">按件</text>
<text x="692" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">121 / 143</text>
<text x="24" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">四个指标与它们的分母</text>
<rect x="24" y="274" width="400" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="291" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">UPH 每小时件数</text>
<text x="440" y="291" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">件 / 作业工时（不含等待）</text>
<rect x="24" y="300" width="400" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="317" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">行走占比</text>
<text x="440" y="317" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">行走时间 / 拣选总时间</text>
<rect x="24" y="326" width="400" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="343" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">波次达成率</text>
<text x="440" y="343" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">完成单（或行/件）/ 波次计划单</text>
<rect x="24" y="352" width="400" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="34" y="369" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">短拣率</text>
<text x="440" y="369" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">短拣行 / 拣货行，同一时间窗</text>
<text x="24" y="394" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">本机读数：短拣率 4.9%（1000 个拣货任务里 49 个在货位找不到货），而账面每个库位都有货。</text>
</svg>
