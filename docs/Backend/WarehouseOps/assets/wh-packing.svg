<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="复核、打包与交接：三道能「看见」的闸门">
<title>复核、打包与交接：三道能「看见」的闸门</title>
<rect x="0" y="0" width="920" height="340" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">复核、打包与交接：三道能「看见」的闸门</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">拣选错了只有在这里能被拦住；过了交接，错误的成本从「返工」变成「赔付」</text>
<rect x="24" y="88" width="276" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="40" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 扫码复核</text>
<text x="40" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">行 × 件双计数</text>
<text x="40" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">错行 / 少件 / 错 SKU</text>
<rect x="324" y="88" width="276" height="104" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="340" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 装箱与称重</text>
<text x="340" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">理论重 vs 实重</text>
<text x="340" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">漏装（≥3% 才抓得到）</text>
<rect x="624" y="88" width="276" height="104" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="640" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">③ 交接签收</text>
<text x="640" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">包裹数 × 交接单</text>
<text x="640" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">少交 / 多交 / 错车</text>
<line x1="300" y1="140" x2="320" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="600" y1="140" x2="620" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="24" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">称重复核的检出率曲线（漏装占整包理论重的比例 → 检出率）</text>
<rect x="60" y="327" width="56" height="3" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="88" y="319" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">3.05%</text>
<text x="88" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">0.5%</text>
<rect x="190" y="324" width="56" height="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="218" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">5.75%</text>
<text x="218" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">1%</text>
<rect x="320" y="311" width="56" height="19" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="348" y="303" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">17.35%</text>
<text x="348" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">2%</text>
<rect x="450" y="248" width="56" height="82" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="478" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">71.75%</text>
<text x="478" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">5%</text>
<text x="600" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">容差 3%（下限 30 g）+ 称重噪声 1.5%</text>
<text x="600" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">⇒ 小件漏装基本抓不到，</text>
<text x="600" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">   必须靠扫码行计数兜住</text>
</svg>
