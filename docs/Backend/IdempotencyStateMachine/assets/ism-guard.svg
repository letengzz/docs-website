<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <rect width="880" height="560" fill="#FFFFFF"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">并发护栏：四道锁各挡一件事</text>
  <text x="440" y="60" text-anchor="middle" font-size="12" fill="#64748B">唯一键挡重复、CAS 挡越级、版本号挡覆盖、fencing 挡过期持有者</text>

  <!-- 左：丢失更新时序 -->
  <rect x="30" y="80" width="420" height="290" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#B91C1C">丢失更新是怎么发生的</text>

  <text x="70" y="136" font-size="11" font-weight="bold" fill="#475569">会话 A</text>
  <text x="300" y="136" font-size="11" font-weight="bold" fill="#475569">会话 B</text>

  <rect x="55" y="146" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="68" y="168" font-size="10" fill="#334155">select qty → 读到 10</text>

  <rect x="290" y="146" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="303" y="168" font-size="10" fill="#334155">select qty → 读到 10</text>

  <rect x="55" y="192" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="68" y="214" font-size="10" fill="#334155">update set qty = 9</text>

  <rect x="290" y="192" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="303" y="214" font-size="10" fill="#334155">update set qty = 8</text>

  <rect x="55" y="238" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="68" y="260" font-size="10" fill="#334155">commit</text>

  <rect x="290" y="238" width="140" height="34" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="303" y="260" font-size="10" font-weight="bold" fill="#B91C1C">commit → 最终 8</text>

  <text x="240" y="300" text-anchor="middle" font-size="11" fill="#B91C1C">A 的扣减凭空消失，两个事务都没报错</text>

  <rect x="55" y="316" width="375" height="40" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="68" y="334" font-size="10" fill="#334155">修法：where version = 7（乐观锁）</text>
  <text x="68" y="350" font-size="10" fill="#334155">或 set qty = qty - 1（原子表达式）</text>

  <!-- 右：四道护栏 -->
  <rect x="470" y="80" width="380" height="290" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="660" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">四道护栏的边界</text>

  <rect x="490" y="124" width="340" height="54" rx="7" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="504" y="144" font-size="12" font-weight="bold" fill="#1E293B">唯一键</text>
  <text x="504" y="164" font-size="10" fill="#475569">挡「同一业务键插两次」；挡不了同一行的两次更新</text>

  <rect x="490" y="186" width="340" height="54" rx="7" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="504" y="206" font-size="12" font-weight="bold" fill="#1E293B">条件更新 CAS</text>
  <text x="504" y="226" font-size="10" fill="#475569">挡「基于状态的越级迁移」；挡不了字段级覆盖</text>

  <rect x="490" y="248" width="340" height="54" rx="7" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="504" y="268" font-size="12" font-weight="bold" fill="#1E293B">版本号（乐观锁）</text>
  <text x="504" y="288" font-size="10" fill="#475569">挡丢失更新；冲突要重试，重试有上限</text>

  <rect x="490" y="310" width="340" height="46" rx="7" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="504" y="330" font-size="12" font-weight="bold" fill="#1E293B">fencing token</text>
  <text x="504" y="347" font-size="10" fill="#475569">挡「锁过期了我还在写」；必须与业务写同语句</text>

  <!-- 底部：fencing -->
  <rect x="30" y="392" width="820" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="50" y="418" font-size="13" font-weight="bold" fill="#1E293B">fencing token 为什么必需</text>

  <rect x="50" y="430" width="200" height="50" rx="7" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="150" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">进程 1 拿锁，token = 7</text>
  <text x="150" y="468" text-anchor="middle" font-size="10" fill="#475569">租期 30 秒</text>

  <rect x="50" y="486" width="200" height="36" rx="7" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="150" y="509" text-anchor="middle" font-size="10" fill="#B91C1C">第 31 秒才发出写</text>

  <rect x="330" y="430" width="230" height="92" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="445" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E293B">存储层校验令牌</text>
  <text x="445" y="472" text-anchor="middle" font-size="10" fill="#475569">写入时要求 token ≥ 当前最大值</text>
  <text x="445" y="492" text-anchor="middle" font-size="10" fill="#475569">旧令牌 → 影响 0 行，写被拒</text>
  <text x="445" y="512" text-anchor="middle" font-size="10" fill="#15803D">这才叫「过期持有者写不进来」</text>

  <rect x="640" y="430" width="190" height="92" rx="7" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="735" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">只靠锁会怎样</text>
  <text x="735" y="474" text-anchor="middle" font-size="10" fill="#475569">两个进程同时写同一行</text>
  <text x="735" y="494" text-anchor="middle" font-size="10" fill="#475569">各自都认为「我持有锁」</text>
  <text x="735" y="512" text-anchor="middle" font-size="10" fill="#B91C1C">资金类场景不可接受</text>
</svg>
