<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <rect width="880" height="560" fill="#FFFFFF"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">补偿与对账：三个动作，一条时间线</text>
  <text x="440" y="60" text-anchor="middle" font-size="12" fill="#64748B">回滚管「还没生效」、补偿管「已生效要抵消」、对账管「补偿有没有漏」</text>

  <!-- 时间线 -->
  <line x1="70" y1="120" x2="820" y2="120" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="120" cy="120" r="7" fill="#22C55E"/>
  <circle cx="300" cy="120" r="7" fill="#22C55E"/>
  <circle cx="470" cy="120" r="7" fill="#EF4444"/>
  <circle cx="650" cy="120" r="7" fill="#F59E0B"/>
  <circle cx="800" cy="120" r="7" fill="#3B82F6"/>

  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#15803D">扣库存</text>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="#15803D">写订单</text>
  <text x="470" y="104" text-anchor="middle" font-size="11" fill="#B91C1C">扣余额失败</text>
  <text x="650" y="104" text-anchor="middle" font-size="11" fill="#B45309">补偿库存</text>
  <text x="800" y="104" text-anchor="middle" font-size="11" fill="#1D4ED8">T+1 对账</text>

  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#64748B">已提交</text>
  <text x="300" y="142" text-anchor="middle" font-size="10" fill="#64748B">已提交</text>
  <text x="470" y="142" text-anchor="middle" font-size="10" fill="#64748B">此处已回不去</text>
  <text x="650" y="142" text-anchor="middle" font-size="10" fill="#64748B">语义相反的新操作</text>
  <text x="800" y="142" text-anchor="middle" font-size="10" fill="#64748B">发现漏掉的补偿</text>

  <rect x="40" y="168" width="810" height="58" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="56" y="190" font-size="12" font-weight="bold" fill="#B91C1C">转折点：第一个事务提交之后，ROLLBACK 已经无效</text>
  <text x="56" y="210" font-size="11" fill="#475569">从这一刻起，系统只能「往前修」，所有「当作没发生」的想法都要放弃</text>

  <!-- 三种处置 -->
  <rect x="40" y="248" width="250" height="150" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="165" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">回滚</text>
  <text x="165" y="300" text-anchor="middle" font-size="11" fill="#475569">单库单事务内</text>
  <text x="165" y="322" text-anchor="middle" font-size="11" fill="#475569">未提交 → 直接 ROLLBACK</text>
  <text x="165" y="344" text-anchor="middle" font-size="11" fill="#475569">提交后 → 完全无效</text>
  <text x="165" y="374" text-anchor="middle" font-size="10" fill="#64748B">唯一免费的「撤销」</text>

  <rect x="315" y="248" width="250" height="150" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <text x="440" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">补偿</text>
  <text x="440" y="300" text-anchor="middle" font-size="11" fill="#475569">写一个语义相反的新操作</text>
  <text x="440" y="322" text-anchor="middle" font-size="11" fill="#475569">按逆序执行：C⁻¹ → B⁻¹ → A⁻¹</text>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#475569">任务表带 (biz_type, biz_id) 唯一</text>
  <text x="440" y="374" text-anchor="middle" font-size="10" fill="#64748B">补偿本身必须幂等</text>

  <rect x="590" y="248" width="260" height="150" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="720" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D28D9">对账</text>
  <text x="720" y="300" text-anchor="middle" font-size="11" fill="#475569">两份独立记录比对</text>
  <text x="720" y="322" text-anchor="middle" font-size="11" fill="#475569">我有你无 / 你无我有 / 金额 / 状态</text>
  <text x="720" y="344" text-anchor="middle" font-size="11" fill="#475569">金额差只挂账，不自动改</text>
  <text x="720" y="374" text-anchor="middle" font-size="10" fill="#64748B">唯一能发现「补偿也漏了」</text>

  <!-- 不可补偿 -->
  <rect x="40" y="418" width="810" height="114" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="444" font-size="13" font-weight="bold" fill="#1E293B">三类「看起来能补偿、实际不能」</text>

  <rect x="56" y="456" width="250" height="62" rx="7" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="70" y="476" font-size="11" font-weight="bold" fill="#B91C1C">对外通知</text>
  <text x="70" y="494" font-size="10" fill="#475569">短信、推送、webhook 发出即不可撤回</text>
  <text x="70" y="510" font-size="10" fill="#475569">对策：放在提交之后 + 去重键</text>

  <rect x="316" y="456" width="250" height="62" rx="7" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="330" y="476" font-size="11" font-weight="bold" fill="#B91C1C">已被消费的资源</text>
  <text x="330" y="494" font-size="10" fill="#475569">加回库存 ≠ 恢复原状，可能超卖</text>
  <text x="330" y="510" font-size="10" fill="#475569">对策：预留（reserve）而非扣减</text>

  <rect x="576" y="456" width="258" height="62" rx="7" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="590" y="476" font-size="11" font-weight="bold" fill="#B91C1C">有时间窗的操作</text>
  <text x="590" y="494" font-size="10" fill="#475569">券过期、积分已结算，反向会破坏报表</text>
  <text x="590" y="510" font-size="10" fill="#475569">对策：走人工处置，不自动补偿</text>
</svg>
