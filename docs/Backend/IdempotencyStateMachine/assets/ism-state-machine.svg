<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570">
  <rect width="880" height="570" fill="#FFFFFF"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">状态机：五元组、迁移表与条件更新</text>
  <text x="440" y="60" text-anchor="middle" font-size="12" fill="#64748B">迁移表回答「允不允许」，条件更新回答「真的发生了吗」</text>

  <!-- 左：五元组 -->
  <rect x="30" y="80" width="330" height="330" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="195" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">五元组：少一个都不算状态机</text>

  <rect x="50" y="124" width="290" height="50" rx="7" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="64" y="145" font-size="12" font-weight="bold" fill="#1E293B">状态 State</text>
  <text x="64" y="163" font-size="11" fill="#475569">state 列 + 取值约束（外键表或 CHECK）</text>

  <rect x="50" y="182" width="290" height="50" rx="7" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="64" y="203" font-size="12" font-weight="bold" fill="#1E293B">事件 Event</text>
  <text x="64" y="221" font-size="11" fill="#475569">接口动作或消息类型，必须能区分「谁让它变的」</text>

  <rect x="50" y="240" width="290" height="50" rx="7" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="64" y="261" font-size="12" font-weight="bold" fill="#1E293B">迁移 Transition</text>
  <text x="64" y="279" font-size="11" fill="#475569">(from_state, event) 作主键，禁止一态两出边</text>

  <rect x="50" y="298" width="290" height="50" rx="7" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="64" y="319" font-size="12" font-weight="bold" fill="#1E293B">守卫 Guard</text>
  <text x="64" y="337" font-size="11" fill="#475569">余额、库存、审批等附加条件，失败要能区分</text>

  <rect x="50" y="356" width="290" height="44" rx="7" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="64" y="375" font-size="12" font-weight="bold" fill="#1E293B">副作用 Effect</text>
  <text x="64" y="392" font-size="11" fill="#475569">与迁移同事务写 outbox，不直接调外部</text>

  <!-- 右：迁移矩阵 -->
  <rect x="390" y="80" width="460" height="330" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="620" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">迁移矩阵：6 状态 × 5 事件 = 30 格</text>

  <!-- 表头 -->
  <rect x="410" y="122" width="96" height="30" rx="4" fill="#E2E8F0"/>
  <text x="458" y="142" text-anchor="middle" font-size="10" fill="#334155">状态 / 事件</text>

  <rect x="510" y="122" width="64" height="30" rx="4" fill="#E2E8F0"/>
  <text x="542" y="142" text-anchor="middle" font-size="10" fill="#334155">pay</text>
  <rect x="578" y="122" width="64" height="30" rx="4" fill="#E2E8F0"/>
  <text x="610" y="142" text-anchor="middle" font-size="10" fill="#334155">cancel</text>
  <rect x="646" y="122" width="64" height="30" rx="4" fill="#E2E8F0"/>
  <text x="678" y="142" text-anchor="middle" font-size="10" fill="#334155">ship</text>
  <rect x="714" y="122" width="64" height="30" rx="4" fill="#E2E8F0"/>
  <text x="746" y="142" text-anchor="middle" font-size="10" fill="#334155">refund</text>
  <rect x="782" y="122" width="58" height="30" rx="4" fill="#E2E8F0"/>
  <text x="811" y="142" text-anchor="middle" font-size="10" fill="#334155">complete</text>

  <!-- CREATED -->
  <rect x="410" y="156" width="96" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="458" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">CREATED</text>
  <rect x="510" y="156" width="64" height="34" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="542" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">PAID</text>
  <rect x="578" y="156" width="64" height="34" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="610" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">CANCEL</text>
  <rect x="646" y="156" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="678" y="178" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="714" y="156" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="746" y="178" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="782" y="156" width="58" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="811" y="178" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>

  <!-- PAID -->
  <rect x="410" y="194" width="96" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="458" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">PAID</text>
  <rect x="510" y="194" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="542" y="216" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="578" y="194" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="610" y="216" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="646" y="194" width="64" height="34" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="678" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">SHIP</text>
  <rect x="714" y="194" width="64" height="34" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="746" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">REFUND</text>
  <rect x="782" y="194" width="58" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="811" y="216" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>

  <!-- SHIPPED -->
  <rect x="410" y="232" width="96" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="458" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">SHIPPED</text>
  <rect x="510" y="232" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="542" y="254" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="578" y="232" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="610" y="254" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="646" y="232" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="678" y="254" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="714" y="232" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="746" y="254" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="782" y="232" width="58" height="34" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="811" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">DONE</text>

  <!-- COMPLETED -->
  <rect x="410" y="270" width="96" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="458" y="292" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">COMPLETED</text>
  <rect x="510" y="270" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="542" y="292" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="578" y="270" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="610" y="292" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="646" y="270" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="678" y="292" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="714" y="270" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="746" y="292" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="782" y="270" width="58" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="811" y="292" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>

  <!-- CANCELLED -->
  <rect x="410" y="308" width="96" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="458" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">CANCELLED</text>
  <rect x="510" y="308" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="542" y="330" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="578" y="308" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="610" y="330" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="646" y="308" width="64" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="678" y="330" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>
  <rect x="714" y="308" width="64" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="746" y="330" text-anchor="middle" font-size="11" fill="#94A3B8">—</text>
  <rect x="782" y="308" width="58" height="34" rx="4" fill="#FEE2E2" stroke="#FECACA"/>
  <text x="811" y="330" text-anchor="middle" font-size="11" fill="#B91C1C">409</text>

  <text x="620" y="366" text-anchor="middle" font-size="11" fill="#475569">绿色 = 迁移表里的合法边；409 = 非法边（必须拒绝且状态不变）</text>
  <text x="620" y="388" text-anchor="middle" font-size="11" fill="#475569">30 格里只有 6 格是绿的，剩下 24 格每格都要有用例</text>

  <!-- 底部：条件更新 -->
  <rect x="30" y="430" width="820" height="112" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="50" y="456" font-size="13" font-weight="bold" fill="#1D4ED8">条件更新：唯一可信的判据是影响行数</text>
  <text x="50" y="482" font-size="12" fill="#334155">update orders set state = 'SHIPPED', version = version + 1</text>
  <text x="50" y="502" font-size="12" fill="#334155"> where id = $1 and state = 'PAID' returning id, state, version;</text>
  <text x="50" y="528" font-size="12" fill="#475569">1 行 = 迁移成功　｜　0 行 = 不存在（404）或状态不符（409），必须再查一次区分</text>
</svg>
