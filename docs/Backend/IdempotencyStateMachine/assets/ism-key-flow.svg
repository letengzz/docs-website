<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640">
  <rect width="880" height="640" fill="#FFFFFF"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">幂等键的完整生命周期</text>
  <text x="440" y="60" text-anchor="middle" font-size="12" fill="#64748B">插入优先（让唯一索引裁决），而不是先查后写</text>

  <!-- ① 请求 -->
  <rect x="330" y="84" width="220" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="440" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">① 收到带键的请求</text>
  <text x="440" y="126" text-anchor="middle" font-size="11" fill="#475569">Idempotency-Key + body</text>

  <!-- ② 指纹 -->
  <rect x="330" y="156" width="220" height="52" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="440" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803D">② 算指纹</text>
  <text x="440" y="198" text-anchor="middle" font-size="11" fill="#475569">method + path + 规范化 body</text>

  <!-- ③ 插入 -->
  <rect x="330" y="228" width="220" height="56" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="440" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">③ 插入键行（in_progress）</text>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#475569">on conflict do nothing returning</text>

  <!-- 决策菱形 -->
  <path d="M 440 306 L 520 356 L 440 406 L 360 356 Z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="440" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#6D28D9">插入成功？</text>
  <text x="440" y="370" text-anchor="middle" font-size="10" fill="#6D28D9">（影响行数）</text>

  <line x1="440" y1="136" x2="440" y2="154" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="440" y1="208" x2="440" y2="226" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="440" y1="284" x2="440" y2="304" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- 左分支：1 行 -->
  <line x1="360" y1="356" x2="240" y2="356" stroke="#22C55E" stroke-width="2"/>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#15803D">是（1 行）</text>

  <rect x="40" y="330" width="200" height="52" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="140" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">④ 执行业务</text>
  <text x="140" y="372" text-anchor="middle" font-size="11" fill="#475569">状态迁移 + 事件 + outbox</text>

  <rect x="40" y="400" width="200" height="52" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="140" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">⑤ 同事务落结果</text>
  <text x="140" y="442" text-anchor="middle" font-size="11" fill="#475569">completed + code + body</text>

  <line x1="140" y1="382" x2="140" y2="398" stroke="#22C55E" stroke-width="1.5"/>

  <!-- 右分支：0 行 -->
  <line x1="520" y1="356" x2="640" y2="356" stroke="#EF4444" stroke-width="2"/>
  <text x="580" y="346" text-anchor="middle" font-size="11" fill="#B91C1C">否（0 行）</text>

  <rect x="640" y="300" width="210" height="52" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="745" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#B91C1C">⑥ 读已有键行</text>
  <text x="745" y="342" text-anchor="middle" font-size="11" fill="#475569">比指纹 / 看状态</text>

  <rect x="640" y="372" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="656" y="392" font-size="11" font-weight="bold" fill="#B91C1C">completed 且指纹一致</text>
  <text x="656" y="410" font-size="11" fill="#475569">→ 原样回放首次响应</text>

  <rect x="640" y="428" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="656" y="448" font-size="11" font-weight="bold" fill="#B91C1C">completed 但指纹不同</text>
  <text x="656" y="466" font-size="11" fill="#475569">→ 422，不复用旧结果</text>

  <rect x="640" y="484" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="656" y="504" font-size="11" font-weight="bold" fill="#B91C1C">in_progress</text>
  <text x="656" y="522" font-size="11" fill="#475569">→ 409 + Retry-After</text>

  <line x1="745" y1="352" x2="745" y2="370" stroke="#FCA5A5" stroke-width="1.5"/>
  <line x1="745" y1="418" x2="745" y2="426" stroke="#FCA5A5" stroke-width="1.5"/>
  <line x1="745" y1="474" x2="745" y2="482" stroke="#FCA5A5" stroke-width="1.5"/>

  <!-- 接管 -->
  <rect x="330" y="440" width="220" height="70" rx="8" fill="#FEFCE8" stroke="#FDE047" stroke-width="2"/>
  <text x="440" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#854D0E">⑦ 锁超时接管</text>
  <text x="440" y="484" text-anchor="middle" font-size="11" fill="#475569">locked_at 早于 now() - 60s</text>
  <text x="440" y="502" text-anchor="middle" font-size="11" fill="#475569">影响 1 行 → 允许重跑</text>

  <path d="M 640 507 C 580 507 560 480 552 476" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="600" y="530" text-anchor="middle" font-size="10" fill="#854D0E">不再永久 409</text>

  <!-- 底部 -->
  <rect x="40" y="560" width="810" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="582" font-size="12" font-weight="bold" fill="#1E293B">三个必须一起满足</text>
  <text x="56" y="604" font-size="11" fill="#475569">唯一索引裁决 · 指纹挡误用 · 响应体可回放（只有状态码不算完成）</text>
</svg>
