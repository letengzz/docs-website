<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="最小单位与 exponent 三种取值">
<title>最小单位与 exponent 三种取值</title>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">最小单位不是两位小数：ISO 4217 的 exponent 有 0、2、3 三种</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">把「×100」写死，等于假设全世界只有两位小数的货币</text>
<rect x="30" y="86" width="280" height="112" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="170" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">exponent = 0</text>
<text x="170" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">JPY · KRW · CLP · ISK</text>
<text x="170" y="157" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">整数元，没有小数位</text>
<text x="170" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">1235 就是 1,235 元</text>
<rect x="330" y="86" width="280" height="112" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">exponent = 2</text>
<text x="470" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">CNY · USD · EUR · GBP</text>
<text x="470" y="157" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">分，两位小数</text>
<text x="470" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">123457 是 1,234.57 元</text>
<rect x="630" y="86" width="280" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="770" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">exponent = 3</text>
<text x="770" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">KWD · BHD · TND · IQD</text>
<text x="770" y="157" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">千分之一，三位小数</text>
<text x="770" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">1234567 是 1,234.567</text>
<rect x="30" y="220" width="880" height="74" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="243.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">写死两位小数的代价</text>
<text x="470.0" y="261.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">JPY 每笔按「分」处理 → 虚增 99 倍；500 笔合计 1,253 亿日元</text>
<text x="470.0" y="276.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">KWD 的第三位被抹掉 → 每笔少 0.003，方向固定、永远不报警</text>
<rect x="30" y="308" width="430" height="66" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="245.0" y="336.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">正确做法</text>
<text x="245.0" y="354.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">币种表存 minor_unit，金额只存整数最小单位</text>
<rect x="480" y="308" width="430" height="66" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="695.0" y="327.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">存储上限</text>
<text x="695.0" y="345.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">INT32 存分上限 21,474,836.47 元</text>
<text x="695.0" y="360.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">JPY 走分制则上限 21.47 亿日元</text>
</svg>
