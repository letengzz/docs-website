<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="三套口径与报表折算差额">
<title>三套口径与报表折算差额</title>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">多币种对账：三套口径，三个合计，谁也替不了谁</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">把三套口径混成一个合计，是最容易通过审核、也最容易出错的做法</text>
<polygon points="470,96 830,300 110,300" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">交易币 4,553,516.21</text>
<text x="838" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="end" font-weight="600">记账币 32,436,517.33</text>
<text x="102" y="322" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">结算币 33,094,955.90</text>
<text x="560" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="400">汇率差 2.03%</text>
<text x="300" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="400">时点差</text>
<text x="470" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">差异 658,438.57</text>
<line x1="30" y1="330" x2="910" y2="330" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="30" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">报表折算：资产按期末、损益按平均、权益按历史 → 差额 60,000.00 计入 CTA；全用期末则 CTA=0，差额被塞进权益 54,000、损益 6,000</text>
</svg>
