<text x="340.6" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">折本位币入账</text>
<text x="340.6" y="151.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
