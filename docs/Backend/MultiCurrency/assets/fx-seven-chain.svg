<text x="471.40000000000003" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">核销与已实现</text>
<text x="471.40000000000003" y="151.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="530.4000000000001" y1="132" x2="541.2" y2="132" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="543.2" y="88" width="118" height="88" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="602.2" y="118.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 重估</text>
<text x="602.2" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">期末调余额</text>
<text x="602.2" y="151.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="661.2" y1="132" x2="672.0" y2="132" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="674.0" y="88" width="118" height="88" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
