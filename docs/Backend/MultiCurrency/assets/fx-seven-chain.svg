<text x="733.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">折算与 CTA</text>
<text x="733.0" y="151.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：安静</text>
<line x1="792.0" y1="132" x2="802.8" y2="132" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="804.8000000000001" y="88" width="118" height="88" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="863.8000000000001" y="118.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑦ 对账</text>
<text x="863.8000000000001" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">三套口径对齐</text>
<text x="863.8000000000001" y="151.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">错：最后一道</text>
<line x1="20" y1="200" x2="920" y2="200" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="20" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">为什么「安静」：金额类错误不会抛异常，也不会让接口返回 500</text>
<rect x="20" y="250" width="150" height="28" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1.2"/>
<text x="95" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">单位错</text>
<text x="188" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">exp=0 的货币按两位处理</text>
<text x="600" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="400">整张单差 99 倍</text>
<rect x="20" y="284" width="150" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.2"/>
<text x="95" y="303" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">时点错</text>
<text x="188" y="303" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">记账时重取汇率</text>
<text x="600" y="303" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="400">客户确认价与账面价不一致</text>
<rect x="20" y="318" width="150" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="95" y="337" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">顺序错</text>
<text x="188" y="337" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">汇率先舍到两位再乘</text>
<text x="600" y="337" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="400">2,000 笔全差，合计 33,605.90 元</text>
<rect x="20" y="352" width="150" height="28" rx="6" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="95" y="371" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">方向错</text>
<text x="188" y="371" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">该乘写成除</text>
<text x="600" y="371" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="400">金额差 98.03%</text>
