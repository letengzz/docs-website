<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="取整顺序与最大余数法">
<title>取整顺序与最大余数法</title>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">取整：先舍后加与先加后舍，差的是「谁承担余数」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">分摊到分的时候，余数必须有明确归属，不能消失</text>
<rect x="30" y="86" width="400" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">逐行取整（错误）</text>
<text x="50" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">行 1  33.33   行 2  33.33</text>
<text x="50" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">行 3  33.33</text>
<text x="50" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">合计 99.99 ≠ 折扣 100.00</text>
<rect x="450" y="86" width="460" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">合计取整 + 最大余数法（正确）</text>
<text x="470" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">先按比例算余数，再按余数从大到小补 1 分</text>
<text x="470" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">补完再算，合计严格等于 100.00</text>
<text x="470" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="600">本机 2,000 单：0 单不闭合</text>
<line x1="30" y1="226" x2="910" y2="226" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="30" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">两个读数：逐行独立四舍五入 483/2,000 单（24.1%）不闭合；逐行算税 634/2,000 张（31.7%）差 1 分</text>
<rect x="30" y="272" width="280" height="66" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="170.0" y="300.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">舍入模式</text>
<text x="170.0" y="318.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">构造 .xx5：HALF_UP 与 HALF_EVEN 500/1,000 不同</text>
<rect x="330" y="272" width="280" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="300.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">尾差归属</text>
<text x="470.0" y="318.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">写死一行承担，或按最大余数</text>
<rect x="630" y="272" width="280" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="770.0" y="300.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">校验</text>
<text x="770.0" y="318.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">sum(明细) == 总额 写进断言</text>
</svg>
