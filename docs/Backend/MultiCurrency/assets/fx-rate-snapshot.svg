<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="汇率快照与生效时点">
<title>汇率快照与生效时点</title>
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">汇率不是一个数，是一次带时点的快照</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">同一货币对在同一天至少有中间价、买入价、卖出价三条线</text>
<circle cx="90" cy="120" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
<rect x="30" y="146" width="120" height="62" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="90" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">报价</text>
<text x="90" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">中间 / 买 / 卖</text>
<line x1="102" y1="120" x2="202" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="270" cy="120" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
<rect x="210" y="146" width="120" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="270" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">发布</text>
<text x="270" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">生效 00:00</text>
<line x1="282" y1="120" x2="382" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="450" cy="120" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
<rect x="390" y="146" width="120" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="450" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">下单</text>
<text x="450" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">锁汇写快照</text>
<line x1="462" y1="120" x2="562" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="630" cy="120" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
<rect x="570" y="146" width="120" height="62" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="630" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">记账</text>
<text x="630" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">只认快照</text>
<line x1="642" y1="120" x2="742" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="810" cy="120" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
<rect x="750" y="146" width="120" height="62" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="810" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">重估</text>
<text x="810" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">期末价另存</text>
<line x1="30" y1="224" x2="900" y2="224" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="30" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">三条线：中间价用于估值，买入/卖出价用于实际换汇，点差是真实成本</text>
<rect x="30" y="268" width="280" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="170.0" y="296.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">30 点 = 0.0030</text>
<text x="170.0" y="314.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">100 万美元多付 3,000 元（4.2 bp）</text>
<rect x="330" y="268" width="280" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">精度 6 位够用</text>
<text x="470.0" y="305.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">4 位：100 万美元差 44 元</text>
<text x="470.0" y="320.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">2 位：差 3,456 元</text>
<rect x="630" y="268" width="280" height="66" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="770.0" y="287.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">缺一天就错一天</text>
<text x="770.0" y="305.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">跨日 0.47%：1,000 单全变</text>
<text x="770.0" y="320.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">合计差 317,096.06 元</text>
</svg>
