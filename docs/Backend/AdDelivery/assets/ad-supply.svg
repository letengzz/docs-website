<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="供应链的四个角色与三份透明文件">
<rect x="0" y="0" width="920" height="400" fill="#F8FAFC"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">供应链的四个角色与三份透明文件</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">钱流与数据流方向相反，节点数可以不同——这就是「凭空多出一笔成本」的来源</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748B"/></marker></defs>
<rect x="28" y="88" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="123.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">媒体 Publisher</text>
<text x="123.0" y="143.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">有流量，卖库存</text>
<rect x="246" y="88" width="190" height="78" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="341.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">SSP</text>
<text x="341.0" y="143.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">聚合库存，出 sellers.json</text>
<rect x="464" y="88" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="559.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">ADX / Exchange</text>
<text x="559.0" y="143.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">撮合与定价（一价/二价）</text>
<rect x="682" y="88" width="190" height="78" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="777.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">DSP</text>
<text x="777.0" y="143.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">出价、预估、频控、预算</text>
<line x1="218" y1="118" x2="242" y2="118" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="436" y1="118" x2="460" y2="118" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="654" y1="118" x2="678" y2="118" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="28" y="196" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">钱流：广告主 → DSP → ADX → SSP → 媒体（可少一跳：纯技术方 hp=0）</text>
<text x="28" y="216" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">数据流：媒体 → SSP → ADX → DSP（bid request 反向走）</text>
<text x="28" y="256" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">三份文件互相校验，缺一不可</text>
<rect x="28" y="270" width="276" height="88" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="166.0" y="310.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">ads.txt / app-ads.txt</text>
<text x="166.0" y="330.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">谁有权卖我的库存（DIRECT/RESELLER）</text>
<rect x="322" y="270" width="276" height="88" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="460.0" y="310.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">sellers.json</text>
<text x="460.0" y="330.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">账号 ID 背后的法人 + 是否过账</text>
<rect x="616" y="270" width="276" height="88" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="754.0" y="310.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">SupplyChain Object</text>
<text x="754.0" y="330.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">这次请求实际经过了谁（hp）</text>
</svg>
