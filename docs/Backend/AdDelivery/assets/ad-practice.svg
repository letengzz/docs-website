<text x="84.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">校验 tmax</text>
<line x1="140" y1="129" x2="154" y2="129" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
