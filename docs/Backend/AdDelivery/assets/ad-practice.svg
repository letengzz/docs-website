<rect x="284" y="90" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="340.0" y="125.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">③ frequency</text>
<text x="340.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">命中换候选</text>
<line x1="396" y1="129" x2="410" y2="129" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="412" y="90" width="112" height="78" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="468.0" y="125.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">④ budget</text>
<text x="468.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">原子冻结</text>
<line x1="524" y1="129" x2="538" y2="129" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="540" y="90" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="596.0" y="125.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">⑤ score</text>
<text x="596.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">eCPM 排序</text>
<line x1="652" y1="129" x2="666" y2="129" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="668" y="90" width="112" height="78" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="724.0" y="125.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">⑥ pricing</text>
<text x="724.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">一价/二价</text>
<line x1="780" y1="129" x2="794" y2="129" stroke="#64748B" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="796" y="90" width="112" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="852.0" y="125.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">⑦ billing</text>
<text x="852.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">渲染后计费</text>
<text x="28" y="208" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">六张表：campaign / campaign_budget / frequency_counter / billing_detail / auction_log / report_snapshot</text>
<rect x="28" y="232" width="132" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="94.0" y="259.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">WIN</text>
<text x="94.0" y="279.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">正常</text>
<rect x="176" y="232" width="132" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="242.0" y="259.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1E293B">NO_BID</text>
<text x="242.0" y="279.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">无合适出价</text>
<rect x="324" y="232" width="132" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
