<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="eCPM 排序与一价二价">
<rect x="0" y="0" width="920" height="400" fill="#F8FAFC"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">eCPM 排序与一价二价</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B">出价高不代表价值高：45.72% 的竞价里两种排序的赢家不同</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748B"/></marker></defs>
<rect x="28" y="84" width="416" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="236.0" y="128.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">按出价排序</text>
<text x="236.0" y="148.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">3.0 元 × 0.1% = 0.003 元/千次</text>
<rect x="476" y="84" width="416" height="96" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="684.0" y="128.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">按 eCPM 排序</text>
<text x="684.0" y="148.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">1.0 元 × 5% = 0.050 元/千次（高 16 倍）</text>
<text x="28" y="214" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">本机 10,000 次竞价（5 候选，种子 20261026）</text>
<rect x="28" y="228" width="276" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="166.0" y="265.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">赢家不同 45.72%</text>
<text x="166.0" y="285.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">多花 22.6%，少买 18.8% 价值</text>
<rect x="322" y="228" width="276" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="460.0" y="265.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">一价 16,673.4</text>
<text x="460.0" y="285.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同批真值出价</text>
<rect x="616" y="228" width="276" height="82" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="754.0" y="265.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1E293B">二价 13,317.0</text>
<text x="754.0" y="285.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">一价多收 25.20%</text>
<text x="28" y="348" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">压价 0.80 后一价回落到 13,348.6 ≈ 二价：换机制不会自动多赚，只是多了一层猜价成本</text>
</svg>
