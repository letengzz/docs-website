<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">fencing token：序号单调，闸门在资源侧</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 DLF-A~DLF-H；实测 PostgreSQL 18.6：UPDATE 1 / UPDATE 1 / UPDATE 0</text>
  <rect x="24" y="84" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="99" y="104" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">锁服务签发</text>
  <text x="99" y="122" text-anchor="middle" font-size="7.5" fill="#1D4ED8">INCR / revision / czxid</text>
  <text x="99" y="139" text-anchor="middle" font-size="7.5" fill="#1D4ED8">单调递增，不允许回退</text>
  <rect x="196" y="84" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="271" y="104" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">持有者写入</text>
  <text x="271" y="122" text-anchor="middle" font-size="7.5" fill="#4338CA">带上自己拿到的 token</text>
  <text x="271" y="139" text-anchor="middle" font-size="7.5" fill="#4338CA">不判断「我还持有吗」</text>
  <rect x="368" y="84" width="170" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="453" y="104" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">资源侧判定</text>
  <text x="453" y="122" text-anchor="middle" font-size="7.5" fill="#B91C1C">WHERE :token &gt; last_token</text>
  <text x="453" y="139" text-anchor="middle" font-size="7.5" fill="#B91C1C">与写入在同一事务，无法绕过</text>
  <rect x="560" y="84" width="176" height="70" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="648" y="104" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">结果只有两种</text>
  <text x="648" y="122" text-anchor="middle" font-size="7.5" fill="#0F766E">影响 1 行 = 合法写入</text>
  <text x="648" y="139" text-anchor="middle" font-size="7.5" fill="#0F766E">影响 0 行 = 已失锁，必须停手</text>
  <line x1="174" y1="119" x2="194" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw3)"/>
  <line x1="346" y1="119" x2="366" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw3)"/>
  <line x1="538" y1="119" x2="558" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw3)"/>
  <text x="24" y="196" font-size="9.5" fill="#0F172A" font-weight="bold">一次三写：A 拿 token=1，B 拿 token=2，A 醒来后重放 token=1</text>
  <rect x="24" y="208" width="222" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="135" y="228" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">① token=1（A）</text>
  <text x="135" y="246" text-anchor="middle" font-size="7.5" fill="#047857">WHERE 1 &gt; 0 → UPDATE 1</text>
  <text x="135" y="263" text-anchor="middle" font-size="7.5" fill="#047857">balance 100 → 90，last_token=1</text>
  <text x="135" y="280" text-anchor="middle" font-size="7.5" fill="#047857">正常扣减</text>
  <rect x="266" y="208" width="222" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="377" y="228" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">② token=2（B）</text>
  <text x="377" y="246" text-anchor="middle" font-size="7.5" fill="#047857">WHERE 2 &gt; 1 → UPDATE 1</text>
  <text x="377" y="263" text-anchor="middle" font-size="7.5" fill="#047857">balance 90 → 80，last_token=2</text>
  <text x="377" y="280" text-anchor="middle" font-size="7.5" fill="#047857">新持有者接管</text>
  <rect x="508" y="208" width="228" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="622" y="228" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">③ token=1（A 重放）</text>
  <text x="622" y="246" text-anchor="middle" font-size="7.5" fill="#B91C1C">WHERE 1 &gt; 2 → UPDATE 0</text>
  <text x="622" y="263" text-anchor="middle" font-size="7.5" fill="#B91C1C">balance 仍为 80，last_token 仍为 2</text>
  <text x="622" y="280" text-anchor="middle" font-size="7.5" fill="#B91C1C">旧写者被闸门拦住 —— 唯一的安全保证</text>
  <rect x="24" y="304" width="344" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="196" y="324" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">能用的 token 生成方式</text>
  <text x="196" y="342" text-anchor="middle" font-size="7.5" fill="#334155">etcd 事务 revision（最干净：创建即拿号）</text>
  <text x="196" y="359" text-anchor="middle" font-size="7.5" fill="#334155">ZK czxid / Redis INCR / 数据库序列</text>
  <text x="196" y="376" text-anchor="middle" font-size="7.5" fill="#334155">前提：与「发锁」绑定，且序列键不带过期</text>
  <text x="196" y="393" text-anchor="middle" font-size="7.5" fill="#334155">每个资源独立记 last_token</text>
  <rect x="392" y="304" width="344" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="564" y="324" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">不能用的生成方式</text>
  <text x="564" y="342" text-anchor="middle" font-size="7.5" fill="#B45309">时间戳：NTP 回拨 / 多机偏移 / 快照恢复</text>
  <text x="564" y="359" text-anchor="middle" font-size="7.5" fill="#B45309">UUID / 随机数：无单调性</text>
  <text x="564" y="376" text-anchor="middle" font-size="7.5" fill="#B45309">客户端本地计数：两个持有者会撞号</text>
  <text x="564" y="393" text-anchor="middle" font-size="7.5" fill="#B45309">只写日志不校验：评审以为有闸门</text>
  <defs>
    <marker id="arw3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
