<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分布式锁与选主：九个页面，一条主线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">主线：拿到锁 → 锁会过期 → 过期后拦住旧写者 → 选主与分区 → 运行与落地</text>
  <rect x="24" y="84" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="99" y="104" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 总览</text>
  <text x="99" y="121" text-anchor="middle" font-size="7.5" fill="#1D4ED8">三性质 / 五种失效</text>
  <text x="99" y="137" text-anchor="middle" font-size="7.5" fill="#1D4ED8">五问决策树</text>
  <rect x="200" y="84" width="150" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="275" y="104" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 三种实现</text>
  <text x="275" y="121" text-anchor="middle" font-size="7.5" fill="#4338CA">数据库 / Redis / etcd</text>
  <text x="275" y="137" text-anchor="middle" font-size="7.5" fill="#4338CA">正确性托付给谁</text>
  <rect x="376" y="84" width="150" height="70" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="451" y="104" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 租约与续期</text>
  <text x="451" y="121" text-anchor="middle" font-size="7.5" fill="#0F766E">T &gt; P + R + S</text>
  <text x="451" y="137" text-anchor="middle" font-size="7.5" fill="#0F766E">看门狗与停顿</text>
  <rect x="552" y="84" width="184" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="644" y="104" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">④ fencing token</text>
  <text x="644" y="121" text-anchor="middle" font-size="7.5" fill="#B91C1C">单调序号 + 资源侧拒绝</text>
  <text x="644" y="137" text-anchor="middle" font-size="7.5" fill="#B91C1C">唯一真正的兜底</text>
  <rect x="24" y="196" width="222" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="135" y="216" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 选主与领导权</text>
  <text x="135" y="233" text-anchor="middle" font-size="7.5" fill="#B45309">「总有且只有一个」不同于「最多一个」</text>
  <text x="135" y="250" text-anchor="middle" font-size="7.5" fill="#B45309">ZK 顺序节点 / etcd revision / K8s Lease</text>
  <text x="135" y="267" text-anchor="middle" font-size="7.5" fill="#B45309">丢权必须停手（session.Done）</text>
  <rect x="270" y="196" width="222" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="216" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">⑥ 脑裂与分区</text>
  <text x="381" y="233" text-anchor="middle" font-size="7.5" fill="#6D28D9">三种成因：切换 / 停顿 / 分区</text>
  <text x="381" y="250" text-anchor="middle" font-size="7.5" fill="#6D28D9">quorum 把脑裂变成不可用</text>
  <text x="381" y="267" text-anchor="middle" font-size="7.5" fill="#6D28D9">旧写者只能由资源拒绝</text>
  <rect x="516" y="196" width="220" height="86" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="626" y="216" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">⑦ 运行面</text>
  <text x="626" y="233" text-anchor="middle" font-size="7.5" fill="#334155">四个指标 / 四类演练</text>
  <text x="626" y="250" text-anchor="middle" font-size="7.5" fill="#334155">五段式排查手册</text>
  <text x="626" y="267" text-anchor="middle" font-size="7.5" fill="#334155">kill -STOP 是最便宜的注入</text>
  <rect x="24" y="320" width="342" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="195" y="340" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">⑧ 实战：三条链路</text>
  <text x="195" y="357" text-anchor="middle" font-size="7.5" fill="#047857">定时任务单例 ／ 库存扣减 ／ 主备切换</text>
  <text x="195" y="374" text-anchor="middle" font-size="7.5" fill="#047857">五类故障注入 + S1~S10 验收序列</text>
  <rect x="394" y="320" width="342" height="76" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="565" y="340" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">⑨ 常见问题与分诊</text>
  <text x="565" y="357" text-anchor="middle" font-size="7.5" fill="#BE185D">按症状进入：卡住 / 写错 / 服务异常</text>
  <text x="565" y="374" text-anchor="middle" font-size="7.5" fill="#BE185D">十二问 + 十二项上线清单 + 术语表</text>
  <rect x="24" y="414" width="712" height="30" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="380" y="433" text-anchor="middle" font-size="8" fill="#0F172A">判据族 DLO / DLI / DLL / DLF / DLE / DLS / DLR / DLP / DLQ —— 九族各八条，共 72 条</text>
  <line x1="174" y1="119" x2="198" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="350" y1="119" x2="374" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="526" y1="119" x2="550" y2="119" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="644" y1="154" x2="644" y2="176" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="644" y1="176" x2="130" y2="176" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="130" y1="176" x2="130" y2="194" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="246" y1="238" x2="268" y2="238" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="492" y1="238" x2="514" y2="238" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="626" y1="282" x2="626" y2="300" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="626" y1="300" x2="195" y2="300" stroke="#94A3B8" stroke-width="1.6"/>
  <line x1="195" y1="300" x2="195" y2="318" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="366" y1="358" x2="392" y2="358" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
