<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选主的四个状态：丢权那一格最容易被跳过</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">判据 DLE-A~DLE-H；目标是「总有且只有一个」，不是「最多一个」</text>
  <rect x="40" y="96" width="150" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="115" y="118" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">CANDIDATE</text>
  <text x="115" y="136" text-anchor="middle" font-size="7.5" fill="#1D4ED8">持续 campaign（带超时）</text>
  <text x="115" y="152" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不执行业务写</text>
  <rect x="232" y="96" width="150" height="66" rx="8" fill="#DCFCE7" stroke="#059669" stroke-width="1.6"/>
  <text x="307" y="118" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">LEADER</text>
  <text x="307" y="136" text-anchor="middle" font-size="7.5" fill="#047857">执行主逻辑，每轮判定租约</text>
  <text x="307" y="152" text-anchor="middle" font-size="7.5" fill="#047857">单批 ≤ 租约的 1/5</text>
  <rect x="424" y="96" width="150" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="499" y="118" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">STEPPING_DOWN</text>
  <text x="499" y="136" text-anchor="middle" font-size="7.5" fill="#B45309">续约失败 / 收到 SIGTERM</text>
  <text x="499" y="152" text-anchor="middle" font-size="7.5" fill="#B45309">立即停手 + 清理 + Resign</text>
  <rect x="616" y="96" width="120" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="676" y="118" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">FOLLOWER</text>
  <text x="676" y="136" text-anchor="middle" font-size="7.5" fill="#334155">观察当前主</text>
  <text x="676" y="152" text-anchor="middle" font-size="7.5" fill="#334155">等待下一轮 campaign</text>
  <line x1="190" y1="129" x2="230" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw4)"/>
  <text x="210" y="122" text-anchor="middle" font-size="7" fill="#64748B">当选</text>
  <line x1="382" y1="129" x2="422" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw4)"/>
  <text x="402" y="122" text-anchor="middle" font-size="7" fill="#64748B">丢权</text>
  <line x1="574" y1="129" x2="614" y2="129" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw4)"/>
  <text x="594" y="122" text-anchor="middle" font-size="7" fill="#64748B">让位完成</text>
  <path d="M676,162 L676,186 L115,186 L115,164" fill="none" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw4)"/>
  <text x="395" y="182" text-anchor="middle" font-size="7" fill="#64748B">重新参选</text>
  <rect x="24" y="206" width="228" height="98" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="138" y="226" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">ZooKeeper</text>
  <text x="138" y="244" text-anchor="middle" font-size="7.5" fill="#4338CA">临时顺序节点：序号最小者为主</text>
  <text x="138" y="261" text-anchor="middle" font-size="7.5" fill="#4338CA">只监听前驱（避免惊群）</text>
  <text x="138" y="278" text-anchor="middle" font-size="7.5" fill="#4338CA">会话断 → 节点消失 → 让位</text>
  <text x="138" y="295" text-anchor="middle" font-size="7.5" fill="#4338CA">有公平性（序号 = 先来后到）</text>
  <rect x="266" y="206" width="228" height="98" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="380" y="226" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">etcd</text>
  <text x="380" y="244" text-anchor="middle" font-size="7.5" fill="#0F766E">Session（租约保活）+ Election</text>
  <text x="380" y="261" text-anchor="middle" font-size="7.5" fill="#0F766E">Campaign 阻塞直到当选</text>
  <text x="380" y="278" text-anchor="middle" font-size="7.5" fill="#0F766E">session.Done() 必须被消费</text>
  <text x="380" y="295" text-anchor="middle" font-size="7.5" fill="#0F766E">Resign 缩短切换时间</text>
  <rect x="508" y="206" width="228" height="98" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="622" y="226" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">Kubernetes Lease</text>
  <text x="622" y="244" text-anchor="middle" font-size="7.5" fill="#B45309">leaseDuration 15s / renew 10s</text>
  <text x="622" y="261" text-anchor="middle" font-size="7.5" fill="#B45309">retryPeriod 2s，资源锁类型 leases</text>
  <text x="622" y="278" text-anchor="middle" font-size="7.5" fill="#B45309">holderIdentity / renewTime 可读</text>
  <text x="622" y="295" text-anchor="middle" font-size="7.5" fill="#B45309">leaseTransitions 反映主是否抖动</text>
  <rect x="24" y="322" width="712" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="380" y="342" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">反例：选主成功之后再也不看状态</text>
  <text x="380" y="361" text-anchor="middle" font-size="7.5" fill="#B91C1C">if (campaign()) { while (true) { processNextBatch(); sleep(1000); } } —— 循环里没有任何地方能读到「我已经不是主」</text>
  <text x="380" y="379" text-anchor="middle" font-size="7.5" fill="#B91C1C">正例：每轮 isLeader() → resign() → return；单批缩短到租约 1/5；SIGTERM 时显式让位</text>
  <text x="380" y="397" text-anchor="middle" font-size="7.5" fill="#B91C1C">即使三样都做了，仍要假定旧主可能写出最后一笔 —— 这就是 fencing 存在的理由</text>
  <defs>
    <marker id="arw4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
