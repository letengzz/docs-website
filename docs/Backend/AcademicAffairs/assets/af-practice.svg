<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320"><rect width="1000" height="320" fill="#ffffff"/><text x="30" y="38" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">把判定写进约束：9 表 / 4 触发器 / 13 条断言</text><rect x="40" y="76" width="280" height="150" rx="8" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="1.2"/><text x="180" y="104" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">9 张表</text><text x="60" y="130" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">student</text><text x="190" y="130" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">student_status</text><text x="60" y="150" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">program_requirement</text><text x="190" y="150" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">grade</text><text x="60" y="170" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">section</text><text x="190" y="170" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">slot_occupancy</text><text x="60" y="190" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">enrollment</text><text x="190" y="190" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">credit_recognize</text><text x="60" y="210" font-size="10" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">audit_result</text><rect x="350" y="76" width="280" height="150" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1.2"/><text x="490" y="104" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">4 个触发器</text><text x="370" y="132" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">· status_no_overlap</text><text x="370" y="154" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">· grade_immutable</text><text x="370" y="176" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">· enroll_cap</text><text x="370" y="198" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">· audit_version</text><rect x="660" y="76" width="300" height="150" rx="8" fill="#e8f6ec" stroke="#15803d" stroke-width="1.2"/><text x="810" y="104" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">13 条断言</text><text x="680" y="132" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">C1~C9 正向：不该出现的东西确实没有</text><text x="680" y="156" font-size="11" fill="#374151" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">N1~N4 负向：不该写进去的确实写不进去</text><text x="680" y="180" font-size="11" fill="#15803d" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">退出码 = 0 → 可直接进 CI</text><text x="680" y="204" font-size="11" fill="#15803d" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">本机 13/13 PASS，EXIT=0</text><text x="30" y="262" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">只有正向断言 = 只验证「现在没坏」；只有负向断言 = 只验证「不允许坏」</text><text x="30" y="288" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">两个 NULL 陷阱：to_date 为 NULL 表示「至今」，必须 COALESCE；OLD.score &lt;&gt; NEW.score 在 NULL 上不成立</text></svg>