<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><rect width="1000" height="330" fill="#ffffff"/><text x="30" y="38" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">成绩单不是查询结果，是「那一刻的不可变快照 + 一个可复算的指纹」</text><rect x="40" y="80" width="200" height="130" rx="8" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="1.2"/><text x="140" y="108" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">系统当前</text><text x="140" y="134" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">绩点 2.85</text><text x="140" y="158" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">补考已录入</text><text x="140" y="180" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">（打印后变化）</text><line x1="240" y1="145" x2="300" y2="145" stroke="#9ca3af" stroke-width="1.6"/><polygon points="300,145 292.7,148.4 292.7,141.6" fill="#9ca3af"/><rect x="310" y="80" width="240" height="130" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.2"/><text x="430" y="108" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">快照 transcript_snapshot</text><text x="430" y="134" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">绩点 2.83 / 总学分 171</text><text x="430" y="156" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">printed_at / printed_by</text><text x="430" y="178" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">rule_version = 4.0-v3</text><text x="430" y="200" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">fingerprint = sha256(明细)</text><line x1="550" y1="145" x2="610" y2="145" stroke="#9ca3af" stroke-width="1.6"/><polygon points="610,145 602.7,148.4 602.7,141.6" fill="#9ca3af"/><rect x="620" y="80" width="200" height="130" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/><text x="720" y="108" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">纸 / PDF</text><text x="720" y="134" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">二维码 → /verify/id</text><text x="720" y="158" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">指纹与纸上一致</text><text x="720" y="182" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">作废后显示「已作废」</text><text x="840" y="118" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">验真方</text><text x="840" y="142" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">① 查 id</text><text x="840" y="162" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">② 比指纹</text><text x="840" y="182" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">③ 看是否作废</text><text x="30" y="250" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">本机：打印 1,200 份，打印后成绩变更 84 条（7.00%）——没有快照，这 84 份纸与系统永久不一致</text><text x="30" y="276" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">指纹必须覆盖「顺序」与「格式」：不 ORDER BY seq、不统一两位小数，验真就会误判</text><text x="30" y="302" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">快照只存结论不存明细，等于把「为什么是 2.83」这件事永久丢掉</text></svg>