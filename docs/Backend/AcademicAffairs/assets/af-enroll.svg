<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340"><rect width="1000" height="340" fill="#ffffff"/><text x="30" y="38" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">12 个线程抢 45 个位：三种写法，三种结果</text><rect x="30" y="80" width="180" height="62" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.2"/><text x="120" y="118" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">先查后改</text><text x="230" y="108" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">120 成功 / used = 14</text><text x="230" y="130" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">明细 120 行配 14 的计数器</text><rect x="30" y="156" width="180" height="62" rx="8" fill="#e8f6ec" stroke="#15803d" stroke-width="1.2"/><text x="120" y="194" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">条件更新</text><text x="230" y="184" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">45 成功 / 75 失败 / used = 45</text><text x="230" y="206" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">判断与写入同一条语句</text><rect x="30" y="232" width="180" height="62" rx="8" fill="#e8f6ec" stroke="#15803d" stroke-width="1.2"/><text x="120" y="270" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">先插后判</text><text x="230" y="260" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">45 成功 / 75 失败 / used = 45</text><text x="230" y="282" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">唯一键兜底，事务内回滚</text><text x="30" y="310" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">「超发」不是多收了 75 个人，是 120 行明细配一个 14 的计数器——数据自己都不自洽</text></svg>