<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340"><rect width="1000" height="340" fill="#ffffff"/><text x="30" y="38" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">总学分够、模块不够：96.86% 与 77.03% 之间的 139 人</text><rect x="60" y="80" width="380" height="60" rx="8" fill="#e8f1fb" stroke="#1d4ed8" stroke-width="1.2"/><text x="80" y="118" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">已获学分 ≥ 160</text><text x="360" y="118" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">679 人（96.86%）</text><rect x="60" y="156" width="380" height="60" rx="8" fill="#f1ecfb" stroke="#6d28d9" stroke-width="1.2"/><text x="80" y="194" font-size="14" fill="#6d28d9" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">四个模块都达标</text><text x="360" y="194" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">540 人（77.03%）</text><line x1="250" y1="146" x2="250" y2="146" stroke="#b91c1c" stroke-width="1.6"/><polygon points="250,146 242.7,149.4 242.7,142.6" fill="#b91c1c"/><text x="60" y="250" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">139 人落在中间：平均 171.11 学分，缺的那 4 分在必修里</text><text x="60" y="276" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">缺项分布：必修 135 / 专业选修 31 / 实践 21 / 通识 21</text><text x="520" y="100" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">四个 95% 的合取</text><text x="520" y="128" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">1 条要求</text><rect x="600" y="116" width="304.0" height="14" rx="3" fill="#fbe3c0" stroke="#b45309" stroke-width="0.8"/><text x="912.0" y="128" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">95.00%</text><text x="520" y="154" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">2 条要求</text><rect x="600" y="142" width="288.8" height="14" rx="3" fill="#fbe3c0" stroke="#b45309" stroke-width="0.8"/><text x="896.8" y="154" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">90.25%</text><text x="520" y="180" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">3 条要求</text><rect x="600" y="168" width="274.368" height="14" rx="3" fill="#fbe3c0" stroke="#b45309" stroke-width="0.8"/><text x="882.3679999999999" y="180" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">85.74%</text><text x="520" y="206" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">4 条要求</text><rect x="600" y="194" width="260.64000000000004" height="14" rx="3" fill="#fbe3c0" stroke="#b45309" stroke-width="0.8"/><text x="868.6400000000001" y="206" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">81.45%</text><text x="520" y="250" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">每加一条要求就乘一次：这就是「每条都只差一点点」</text><text x="520" y="274" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">合起来拦下一大批人的原因</text><text x="30" y="322" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal"  font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">审核结论必须带 program_version 与 gaps：只有布尔值的结果，等于告诉学生「你不行」却不说差什么</text></svg>