<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="考核：及格线是一道测量题">
<title>考核：及格线是一道测量题</title>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">考核：及格线是一道测量题</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">25 题里 3 道无效题，剔掉后及格率从 61.37% 掉到 51.76%——那 12 分是白送的</text>
<rect x="28" y="84" width="420" height="258" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="44" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">分数分布与 60 分线</text>
<rect x="60" y="292" width="34" height="8" rx="3" fill="#fecdd3" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="77" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">0-40</text>
<rect x="114" y="284" width="34" height="16" rx="3" fill="#fecdd3" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="131" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">40-50</text>
<rect x="168" y="266" width="34" height="34" rx="3" fill="#fde68a" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="185" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">50-60</text>
<rect x="222" y="238" width="34" height="62" rx="3" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="239" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">60-70</text>
<rect x="276" y="222" width="34" height="78" rx="3" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="293" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">70-80</text>
<rect x="330" y="248" width="34" height="52" rx="3" fill="#bae6fd" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="347" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">80-90</text>
<rect x="384" y="282" width="34" height="18" rx="3" fill="#bae6fd" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="401" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">90-100</text>
<line x1="208" y1="120" x2="208" y2="300" stroke="#be123c" stroke-width="1.5"/>
<text x="214" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">60 分及格线</text>
<text x="44" y="336" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">58~62 区间 415 人（10.38%）——及格线的全部争议都在这一小段</text>
<rect x="470" y="84" width="462" height="120" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="486" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">舍入：同一个分数，两种判法</text>
<text x="486" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">原始分判及格 2,991 人（74.78%）</text>
<text x="486" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">先四舍五入到整数再判 3,047 人（76.17%）</text>
<text x="486" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="start">多放行 56 人 = 1.39 个百分点</text>
<text x="486" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">59.45 保留 1 位：HALF_UP 59.5 / HALF_EVEN 59.4</text>
<rect x="470" y="216" width="462" height="126" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="486" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">无效题：不是「难」，是「测不出东西」</text>
<text x="486" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">正确率 ≥0.97 的送分题 1 道</text>
<text x="486" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">区分度为负的题 2 道（高手反而做错）</text>
<text x="486" y="298" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">合计 3 道 / 12 分；剔除后按 22 题等比换算</text>
<text x="486" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="600" text-anchor="start">及格率 61.37% → 51.76%（−9.61 点）</text>
</svg>
