<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="专题地图：十章怎么串起来">
<title>专题地图：十章怎么串起来</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">专题地图：十章怎么串起来</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">从「谁该会什么」到「报表怎么出」，中间隔着一个判定点和一条有效期</text>
<rect x="60" y="90" width="170" height="72" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="74" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">矩阵</text>
<text x="74" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">谁该会什么</text>
<rect x="250" y="90" width="170" height="72" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="264" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">排期学时</text>
<text x="264" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">学了多久</text>
<rect x="440" y="90" width="170" height="72" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="454" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">考核</text>
<text x="454" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">算不算会</text>
<rect x="630" y="90" width="170" height="72" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="644" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">证书</text>
<text x="644" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">凭证与有效期</text>
<rect x="350" y="200" width="170" height="72" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="364" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">准入</text>
<text x="364" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">能不能干活</text>
<rect x="630" y="200" width="170" height="72" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="644" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">复训</text>
<text x="644" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">什么时候再学</text>
<rect x="350" y="310" width="170" height="72" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="364" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">度量</text>
<text x="364" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">报表与分母</text>
<rect x="630" y="310" width="170" height="72" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="644" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">实战</text>
<text x="644" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">八张表与九条断言</text>
<line x1="230" y1="126" x2="250" y2="126" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="420" y1="126" x2="440" y2="126" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="610" y1="126" x2="630" y2="126" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="715" y1="162" x2="500" y2="200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="715" y1="162" x2="715" y2="200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="435" y1="236" x2="435" y2="310" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="520" y1="236" x2="630" y2="310" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="435" y1="346" x2="630" y2="346" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="60" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">① 矩阵定「该会什么」，④ 考核定「会不会」，</text>
<text x="60" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">⑤ 证书定「有没有凭证」，⑥ 准入把它们变成一次拦截。</text>
<text x="60" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">②③ 在中间提供「学了多久」的证据，</text>
<text x="60" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">⑦ 保证这条证据不会在某个日期之后突然失效。</text>
<text x="60" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">⑧ 度量把七段的结果折成四个带分母的数，</text>
<text x="60" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">⑨ 实战把它们落成八张表与九条断言。</text>
</svg>
