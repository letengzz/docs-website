<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="上岗准入：判定点在哪里">
<title>上岗准入：判定点在哪里</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">上岗准入：判定点在哪里</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">在册 3,000 人、在岗 2,648 人；缺强制资质 719 人，宽限 30 天把 13.9% 的拦截变成放行</text>
<rect x="28" y="84" width="196" height="96" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="44" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">在册（headcount）</text>
<text x="44" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">3,000 人</text>
<text x="44" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400" text-anchor="start">含休假 / 借调 / 待离职</text>
<rect x="28" y="196" width="196" height="96" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="44" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">在岗（ACTIVE）</text>
<text x="44" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">2,648 人（88.27%）</text>
<text x="44" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400" text-anchor="start">休假 170、借调 122、待离职 60</text>
<rect x="280" y="130" width="210" height="116" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="296" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">判定点（gate）</text>
<text x="296" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">岗位要求 ∩ 有效证书</text>
<text x="296" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">∩ 级别 ≥ min_level</text>
<text x="296" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">∩ 状态 ∈ {ACTIVE}</text>
<text x="296" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400" text-anchor="start">缺一项就拦截</text>
<rect x="546" y="84" width="380" height="96" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="562" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">拦截 719 人（在岗口径 27.15%）</text>
<text x="562" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">同一批人：分母换成在册是 23.97%</text>
<text x="562" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="400" text-anchor="start">两个数都对，但只有一个能写进合规报告</text>
<rect x="546" y="196" width="380" height="96" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="562" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">宽限：0 / 7 / 30 天 → 719 / 690 / 619</text>
<text x="562" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">多给 30 天，13.9% 的拦截直接消失</text>
<text x="562" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4338ca" font-weight="400" text-anchor="start">宽限期必须写进「谁批的、为什么」</text>
<line x1="224" y1="132" x2="276" y2="170" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="224" y1="244" x2="276" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="490" y1="170" x2="542" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="490" y1="210" x2="542" y2="240" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="28" y="330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">判定点必须在「真实动作发生的地方」：门禁刷卡、开机登录、派工接单。只做报表校验的准入，等于没有准入。</text>
</svg>
