<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="从计划到学时：三个口径与一处指纹">
<title>从计划到学时：三个口径与一处指纹</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">从计划到学时：三个口径与一处指纹</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">报名名义 66,480 h、签到在场 65,035.5 h、去重名义 64,024 h——三个数都叫「学时」</text>
<rect x="28" y="84" width="214" height="108" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="44" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">班次（sess）</text>
<text x="44" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">容量、讲师、起止时间</text>
<text x="44" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">多日班次按天展开签到</text>
<text x="44" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400" text-anchor="start">容量在报名时占用，取消时释放</text>
<rect x="272" y="84" width="214" height="108" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="288" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">报名（enrollment）</text>
<text x="288" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">ENROLLED / ATTENDED</text>
<text x="288" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">NO_SHOW / CANCELLED</text>
<text x="288" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400" text-anchor="start">同一人同一班次只能报一次</text>
<rect x="516" y="84" width="214" height="108" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="532" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">签到（attendance）</text>
<text x="532" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">每天一行：(enroll_id, date)</text>
<text x="532" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">SCAN 与 MANUAL 必须分开记</text>
<text x="532" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400" text-anchor="start">补录要留 source 与人</text>
<rect x="760" y="84" width="172" height="108" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="776" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">学时三口径</text>
<text x="776" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">报名 / 在场 / 去重</text>
<text x="776" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a21caf" font-weight="600" text-anchor="start">−2.17% / −3.69%</text>
<text x="776" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">差额要能逐条解释</text>
<line x1="242" y1="138" x2="268" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="486" y1="138" x2="512" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="730" y1="138" x2="756" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="28" y="216" width="452" height="108" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="44" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">补录指纹：9.44% 的签到行是补录</text>
<text x="44" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">866 条里 749 条（86.49%）晚于当日下课时间</text>
<text x="44" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">其中 671 条落在下课后 2 小时内（占晚于下课的 89.6%）</text>
<text x="44" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="400" text-anchor="start">一次批量补 40 人的班，和现场逐人签到，在库里长得一样</text>
<rect x="496" y="216" width="436" height="108" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="512" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">年底突击：12 月开班学时占 16.73%</text>
<text x="512" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">而 12 月只有 31/365 = 8.49% 的日历天（1.97 倍）</text>
<text x="512" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">跨年 3 个班次整批归开课月，343.9 h 记到错误的年度</text>
<text x="512" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4338ca" font-weight="400" text-anchor="start">学时归属期必须是「按天摊」而不是「按班次记」</text>
</svg>
