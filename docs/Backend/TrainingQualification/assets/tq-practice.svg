<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="实战：八张表、三个触发器、九条断言">
<title>实战：八张表、三个触发器、九条断言</title>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">实战：八张表、三个触发器、九条断言</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">C1~C5 全 0、N1~N4 全部被拒、EXIT=0——判据是「能被违反」，不是「跑通了」</text>
<rect x="28" y="84" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="111" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">employee</text>
<rect x="28" y="140" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="167" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">qual_type</text>
<rect x="28" y="196" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="223" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">position_req</text>
<rect x="236" y="84" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="248" y="111" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">cert</text>
<rect x="236" y="140" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="248" y="167" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">course</text>
<rect x="236" y="196" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="248" y="223" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">sess</text>
<rect x="236" y="252" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="248" y="279" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">enrollment</text>
<rect x="28" y="252" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="279" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">attendance</text>
<rect x="452" y="84" width="480" height="212" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="468" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="start">三个触发器（把不变量写进库里）</text>
<text x="468" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">trg_cert_no_overlap：有效期不得重叠 → E_OVERLAP</text>
<text x="468" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">trg_enroll_capacity：报名不得超容量 → E_CAPACITY</text>
<text x="468" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">trg_att_requires_attended：只有到场才能签到 → E_NOT_ATTENDED</text>
<line x1="468" y1="190" x2="916" y2="190" stroke="#fde68a" stroke-width="1"/>
<text x="468" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">五条自检（全部期望 0）</text>
<text x="468" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">C1 重叠对数 / C2 超容量班次 / C3 过期未翻状态</text>
<text x="468" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">C4 到场却无签到 / C5 学时超课程名义时长</text>
<text x="468" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">四条负向（全部期望被拒）N1~N4</text>
<rect x="28" y="312" width="904" height="44" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="46" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="600" text-anchor="start">判定顺序很重要：先 CHECK / 触发器挡住脏数据，再谈报表。库里允许重叠，报表就永远算不准「今天有效几张证」。</text>
</svg>
