<text x="314" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">逐日签到学时</text>
<text x="314" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">到底学多久</text>
<line x1="314" y1="168" x2="412" y2="168" stroke="#bbf7d0" stroke-width="1"/>
<text x="314" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">失败：安静</text>
<text x="314" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">产物见正文</text>
<line x1="426" y1="159" x2="438" y2="159" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="440" y="84" width="122" height="156" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="452" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">④ 考</text>
<text x="452" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">考核与及格线</text>
<text x="452" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">算不算会了</text>
<line x1="452" y1="168" x2="550" y2="168" stroke="#f5d0fe" stroke-width="1"/>
<text x="452" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a21caf" font-weight="600" text-anchor="start">失败：半显性</text>
<text x="452" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">会自己喊</text>
<line x1="564" y1="159" x2="576" y2="159" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="578" y="84" width="122" height="156" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="590" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">⑤ 证</text>
<text x="590" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">证书与有效期</text>
<text x="590" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">凭证在哪</text>
<line x1="590" y1="168" x2="688" y2="168" stroke="#fecdd3" stroke-width="1"/>
<text x="590" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">失败：安静</text>
<text x="590" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">产物见正文</text>
<line x1="702" y1="159" x2="714" y2="159" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="716" y="84" width="122" height="156" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="728" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">⑥ 用</text>
<text x="728" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">上岗准入校验</text>
<text x="728" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">能不能干活</text>
<line x1="728" y1="168" x2="826" y2="168" stroke="#c7d2fe" stroke-width="1"/>
<text x="728" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4338ca" font-weight="600" text-anchor="start">失败：显性</text>
<text x="728" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">会自己喊</text>
<line x1="840" y1="159" x2="852" y2="159" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="854" y="84" width="122" height="156" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="866" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">⑦ 复</text>
<text x="866" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">到期与复训</text>
<text x="866" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">什么时候再学</text>
<line x1="866" y1="168" x2="964" y2="168" stroke="#e2e8f0" stroke-width="1"/>
<text x="866" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="600" text-anchor="start">失败：安静</text>
<text x="866" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">产物见正文</text>
<text x="26" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">七段里只有「① 需」「⑥ 用」会当场报错；②③⑤⑦ 失败时页面照常渲染、报表照常出数——到期那张证在系统里仍然写着 VALID。</text>
</svg>
