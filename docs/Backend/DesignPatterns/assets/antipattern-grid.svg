<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">常见反模式与对照写法</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="68" width="840" height="52" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="99" text-anchor="middle" fill="#be123c" font-size="14" font-weight="bold">单例滥用</text>
    <text x="400" y="99" text-anchor="middle" fill="#4b5563" font-size="12">把一切工具类都做成单例/静态</text>
    <text x="650" y="99" text-anchor="middle" fill="#065f46" font-size="12">→ 改为无状态工具方法或依赖注入</text>
    <rect x="30" y="128" width="840" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="159" text-anchor="middle" fill="#b45309" font-size="14" font-weight="bold">过度抽象</text>
    <text x="400" y="159" text-anchor="middle" fill="#4b5563" font-size="12">为一个实现预留三层接口</text>
    <text x="650" y="159" text-anchor="middle" fill="#065f46" font-size="12">→ 先写具体实现，出现第二个实现再抽象</text>
    <rect x="30" y="188" width="840" height="52" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="219" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="bold">模式堆砌</text>
    <text x="400" y="219" text-anchor="middle" fill="#4b5563" font-size="12">为了用模式而引入工厂+策略+模板</text>
    <text x="650" y="219" text-anchor="middle" fill="#065f46" font-size="12">→ 以「可读性」为准，能直写就直写</text>
    <rect x="30" y="248" width="840" height="52" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="279" text-anchor="middle" fill="#be185d" font-size="14" font-weight="bold">上帝类</text>
    <text x="400" y="279" text-anchor="middle" fill="#4b5563" font-size="12">一个类 2000 行、承担全部职责</text>
    <text x="650" y="279" text-anchor="middle" fill="#065f46" font-size="12">→ 按变化原因拆分（单一职责）</text>
    <rect x="30" y="308" width="840" height="52" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="339" text-anchor="middle" fill="#c2410c" font-size="14" font-weight="bold">继承代替组合</text>
    <text x="400" y="339" text-anchor="middle" fill="#4b5563" font-size="12">深达 5 层的继承树</text>
    <text x="650" y="339" text-anchor="middle" fill="#065f46" font-size="12">→ 优先组合；继承只用于「是一种」</text>
    <rect x="30" y="368" width="840" height="52" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="160" y="399" text-anchor="middle" fill="#0e7490" font-size="14" font-weight="bold">异常吞没</text>
    <text x="400" y="399" text-anchor="middle" fill="#4b5563" font-size="12">catch(Exception e) {} 不处理</text>
    <text x="650" y="399" text-anchor="middle" fill="#065f46" font-size="12">→ 要么处理，要么包装后向上抛</text>
</g>
    <text x="160" y="52" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="bold">反模式</text>
    <text x="400" y="52" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="bold">典型表现</text>
    <text x="650" y="52" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="bold">改成</text>
  <text x="450" y="432" text-anchor="middle" font-size="13" fill="#475569">判断标准很简单：这段抽象去掉之后，新来的同事是更容易看懂还是更难看懂？</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
