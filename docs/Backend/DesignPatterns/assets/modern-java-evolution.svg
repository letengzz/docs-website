<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">现代 Java 特性如何「吃掉」经典模式</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="76" width="400" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="240" y="102" fill="#334155" font-weight="bold" font-size="14">过去要写一个类</text>
    <text x="240" y="122" fill="#4b5563" font-size="11">// 策略模式：一个接口 + 若干实现类</text>
    <text x="240" y="139" fill="#4b5563" font-size="11">interface Discount { int apply(int p); }</text>
    <text x="240" y="156" fill="#4b5563" font-size="11">class Vip implements Discount { ... }</text>
    <text x="240" y="173" fill="#4b5563" font-size="11">class NewUser implements Discount { ... }</text>
    <text x="240" y="190" fill="#4b5563" font-size="11">// 需要工厂或 Map 做分发</text>
    <rect x="460" y="76" width="400" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="660" y="102" fill="#047857" font-weight="bold" font-size="14">现在一行就够了</text>
    <text x="660" y="122" fill="#4b5563" font-size="11">// 函数式接口 + Lambda</text>
    <text x="660" y="139" fill="#4b5563" font-size="11">Map&lt;String, ToIntFunction&lt;Integer&gt;&gt; RULES =</text>
    <text x="660" y="156" fill="#4b5563" font-size="11">    Map.of("vip", p -&gt; p * 8 / 10,</text>
    <text x="660" y="173" fill="#4b5563" font-size="11">           "new", p -&gt; p - 20);</text>
    <text x="660" y="190" fill="#4b5563" font-size="11">// 传行为，不传类</text>
    <rect x="40" y="248" width="200" height="152" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="274" fill="#1d4ed8" font-weight="bold" font-size="14">Records</text>
    <text x="140" y="294" fill="#4b5563" font-size="11">替代「只有数据」的 DTO 类</text>
    <text x="140" y="311" fill="#4b5563" font-size="11">自动生成 equals/hashCode/toString</text>
    <text x="140" y="328" fill="#4b5563" font-size="11">省掉大量重复的 getter/setter</text>
    <rect x="255" y="248" width="200" height="152" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="355" y="274" fill="#b45309" font-weight="bold" font-size="14">Sealed + 模式匹配</text>
    <text x="355" y="294" fill="#4b5563" font-size="11">替代 Visitor 的大部分场景</text>
    <text x="355" y="311" fill="#4b5563" font-size="11">switch 可直接对类型分支</text>
    <text x="355" y="328" fill="#4b5563" font-size="11">穷尽性由编译器检查</text>
    <rect x="470" y="248" width="190" height="152" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="565" y="274" fill="#6d28d9" font-weight="bold" font-size="14">Optional</text>
    <text x="565" y="294" fill="#4b5563" font-size="11">明确表达「可能没有值」</text>
    <text x="565" y="311" fill="#4b5563" font-size="11">减少 null 判断的样板</text>
    <text x="565" y="328" fill="#4b5563" font-size="11">不要用它做流程控制</text>
    <rect x="675" y="248" width="185" height="152" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="767" y="274" fill="#0f766e" font-weight="bold" font-size="14">虚拟线程</text>
    <text x="767" y="294" fill="#4b5563" font-size="11">替代「为了并发而引入复杂池化」</text>
    <text x="767" y="311" fill="#4b5563" font-size="11">把异步回调整理成同步写法</text>
    <text x="767" y="328" fill="#4b5563" font-size="11">与结构化并发配合更清晰</text>
</g>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#475569">结论：模式没消失，只是从「类的组合」下沉成了「函数的组合」；理解意图仍然重要</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
