<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="340" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Spring 中的设计模式</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="180" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="120" y="110" fill="#4338ca" font-weight="bold">单例模式</text>
    <text x="120" y="134" fill="#4b5563" font-size="11">Bean 默认单例</text>
    <text x="120" y="154" fill="#6b7280" font-size="10">IoC 容器管理</text>
    <rect x="230" y="80" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="110" fill="#047857" font-weight="bold">工厂模式</text>
    <text x="320" y="134" fill="#4b5563" font-size="11">BeanFactory</text>
    <text x="320" y="154" fill="#6b7280" font-size="10">FactoryBean 自定义</text>
    <rect x="430" y="80" width="180" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="520" y="110" fill="#b45309" font-weight="bold">代理模式</text>
    <text x="520" y="134" fill="#4b5563" font-size="11">AOP 动态代理</text>
    <text x="520" y="154" fill="#6b7280" font-size="10">事务/缓存切面</text>
    <rect x="630" y="80" width="180" height="100" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="720" y="110" fill="#be185d" font-weight="bold">模板方法</text>
    <text x="720" y="134" fill="#4b5563" font-size="11">JdbcTemplate</text>
    <text x="720" y="154" fill="#6b7280" font-size="10">RestTemplate</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="210" width="180" height="100" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="120" y="240" fill="#6d28d9" font-weight="bold">观察者模式</text>
    <text x="120" y="264" fill="#4b5563" font-size="11">ApplicationEvent</text>
    <text x="120" y="284" fill="#6b7280" font-size="10">@EventListener</text>
    <rect x="230" y="210" width="180" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="320" y="240" fill="#b91c1c" font-weight="bold">责任链</text>
    <text x="320" y="264" fill="#4b5563" font-size="11">拦截器/过滤器</text>
    <text x="320" y="284" fill="#6b7280" font-size="10">AOP 通知链</text>
    <rect x="430" y="210" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="520" y="240" fill="#047857" font-weight="bold">适配器</text>
    <text x="520" y="264" fill="#4b5563" font-size="11">HandlerAdapter</text>
    <text x="520" y="284" fill="#6b7280" font-size="10">日志/缓存适配</text>
    <rect x="630" y="210" width="180" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="720" y="240" fill="#b45309" font-weight="bold">策略模式</text>
    <text x="720" y="264" fill="#4b5563" font-size="11">HandlerMapping</text>
    <text x="720" y="284" fill="#6b7280" font-size="10">事务管理器</text>
  </g>
</svg>
