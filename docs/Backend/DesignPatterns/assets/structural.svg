<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="330" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">结构型模式：类与对象怎么组合</text>
  <g font-size="13" text-anchor="middle">
    <rect x="25" y="80" width="185" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="117" y="110" fill="#4338ca" font-weight="bold">代理 Proxy</text>
    <text x="117" y="134" fill="#4b5563" font-size="11">控制访问，增强功能</text>
    <text x="117" y="154" fill="#6b7280" font-size="10">Spring AOP 动态代理</text>
    <text x="117" y="176" fill="#6b7280" font-size="10">MyBatis Mapper</text>
    <rect x="230" y="80" width="185" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="322" y="110" fill="#047857" font-weight="bold">装饰器 Decorator</text>
    <text x="322" y="134" fill="#4b5563" font-size="11">动态叠加职责</text>
    <text x="322" y="154" fill="#6b7280" font-size="10">IO 流包装</text>
    <text x="322" y="176" fill="#6b7280" font-size="10">缓存/日志包装</text>
    <rect x="435" y="80" width="185" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="527" y="110" fill="#b45309" font-weight="bold">适配器 Adapter</text>
    <text x="527" y="134" fill="#4b5563" font-size="11">接口转换兼容</text>
    <text x="527" y="154" fill="#6b7280" font-size="10">日志框架适配</text>
    <text x="527" y="176" fill="#6b7280" font-size="10">HandlerAdapter</text>
    <rect x="640" y="80" width="175" height="120" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="727" y="110" fill="#be185d" font-weight="bold">外观 Facade</text>
    <text x="727" y="134" fill="#4b5563" font-size="11">统一入口简化调用</text>
    <text x="727" y="154" fill="#6b7280" font-size="10">Service 层封装</text>
    <text x="727" y="176" fill="#6b7280" font-size="10">门面 API</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="117" y="240">组合 Composite：树形结构（菜单）</text>
    <text x="322" y="240">桥接 Bridge：抽象与实现分离</text>
    <text x="527" y="240">享元 Flyweight：共享复用（常量池）</text>
    <text x="420" y="275">核心思想：通过组合/包装扩展职责，避免继承爆炸；运行时更灵活</text>
  </g>
</svg>
