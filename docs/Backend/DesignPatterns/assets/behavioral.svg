<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="360" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">行为型模式：对象怎么协作</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="80" width="180" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="120" y="110" fill="#4338ca" font-weight="bold">策略 Strategy</text>
    <text x="120" y="134" fill="#4b5563" font-size="11">算法可替换</text>
    <text x="120" y="154" fill="#6b7280" font-size="10">支付方式、优惠策略</text>
    <rect x="230" y="80" width="180" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="110" fill="#047857" font-weight="bold">模板方法</text>
    <text x="320" y="134" fill="#4b5563" font-size="11">骨架固定，步骤可定制</text>
    <text x="320" y="154" fill="#6b7280" font-size="10">JdbcTemplate、AQS</text>
    <rect x="430" y="80" width="180" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="520" y="110" fill="#b45309" font-weight="bold">观察者 Observer</text>
    <text x="520" y="134" fill="#4b5563" font-size="11">状态变化通知订阅者</text>
    <text x="520" y="154" fill="#6b7280" font-size="10">Spring 事件、MQ</text>
    <rect x="630" y="80" width="180" height="110" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="720" y="110" fill="#be185d" font-weight="bold">责任链 Chain</text>
    <text x="720" y="134" fill="#4b5563" font-size="11">请求逐级处理</text>
    <text x="720" y="154" fill="#6b7280" font-size="10">过滤器、拦截器</text>
  </g>
  <g font-size="12" fill="#4b5563">
    <text x="120" y="235">状态 State：状态机流转（订单状态）</text>
    <text x="320" y="235">迭代器 Iterator：统一遍历</text>
    <text x="520" y="235">命令 Command：请求对象化（撤销）</text>
    <text x="720" y="235">中介者 Mediator：解耦交互</text>
    <text x="320" y="265">备忘录 Memento / 访问者 Visitor / 解释器 Interpreter</text>
  </g>
  <text x="420" y="315" text-anchor="middle" font-size="13" fill="#475569">核心思想：把变化的行为封装成对象/方法，用组合与委托实现运行时可变</text>
  <text x="420" y="338" text-anchor="middle" font-size="12" fill="#6b7280">策略解决“怎么做”，观察者解决“通知谁”，责任链解决“谁来处理”</text>
</svg>
