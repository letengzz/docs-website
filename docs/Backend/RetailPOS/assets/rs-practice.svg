<text x="40" y="290" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">三条触发器（不是应用层校验，是数据库层兜底）</text>
<rect x="40" y="308" width="44" height="30" rx="6" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="62" y="329" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">T1</text>
<text x="100" y="329" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2937" font-weight="600">同店同日票号唯一</text>
<text x="330" y="329" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">两台终端各自从 1 发号 → 11.62% 重号</text>
<rect x="40" y="350" width="44" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="62" y="371" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#b45309" font-weight="600">T2</text>
<text x="100" y="371" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2937" font-weight="600">支付累计不超过应收</text>
<text x="330" y="371" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">超收记成第二笔收款 → 账上多钱</text>
<rect x="40" y="392" width="44" height="30" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="62" y="413" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#0f766e" font-weight="600">T3</text>
<text x="100" y="413" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2937" font-weight="600">退货累计不超过原行</text>
<text x="330" y="413" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">没有额度字段 → 退到负数</text>
<text x="460.0" y="456" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">13 条断言全过（C1~C7 / N1~N5 / P1），退出码 0</text>
