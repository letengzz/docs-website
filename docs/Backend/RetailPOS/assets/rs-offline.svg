<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-label="离线收银：本地先成立，联网再对账">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
  <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
  <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
  </marker>
</defs>
<rect x="0" y="0" width="920" height="450" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">离线收银：本地先成立，联网再对账</text>

<rect x="40" y="70" width="240" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="160.0" y="102.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">终端本地库</text>
<text x="160.0" y="122.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">SQLite / 文件队列</text>
<rect x="340" y="70" width="240" height="72" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="460.0" y="102.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f766e">补传队列</text>
<text x="460.0" y="122.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">(store_id, seq) 去重</text>
<rect x="640" y="70" width="240" height="72" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="760.0" y="102.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#3730a3">中心入库</text>
<text x="760.0" y="122.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">按 ticket_id 幂等</text>
<line x1="282" y1="106" x2="336" y2="106" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="582" y1="106" x2="636" y2="106" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="309" y="97" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">断网堆积</text>
<text x="609" y="97" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">重试</text>
<text x="40" y="188" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">四个必须离线成立的判断</text>
<circle cx="52" cy="222" r="11" fill="#ccfbf1" stroke="#0f766e"/>
<text x="52" y="226" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600">1</text>
<text x="72" y="227" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">票号唯一（终端号进票号）</text>
<circle cx="492" cy="222" r="11" fill="#ccfbf1" stroke="#0f766e"/>
<text x="492" y="226" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600">2</text>
<text x="512" y="227" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">价目可用（本地缓存 + 版本号）</text>
<circle cx="52" cy="280" r="11" fill="#ccfbf1" stroke="#0f766e"/>
<text x="52" y="284" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600">3</text>
<text x="72" y="285" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">金额可算（优惠顺序固定）</text>
<circle cx="492" cy="280" r="11" fill="#ccfbf1" stroke="#0f766e"/>
<text x="492" y="284" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600">4</text>
<text x="512" y="285" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">退货可查（本地保留原单索引）</text>
<rect x="40" y="330" width="840" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="359.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">重试 8% → 入库虚增 8%：按自增 id 1,296 行 / 按 (store_id, ticket_no) 1,200 行</text>
<text x="460.0" y="379.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">幂等键不在应用层，在唯一约束上</text>
<text x="460.0" y="436" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">实测：终端慢 3 分钟，日终前 10 分钟的 200 笔里有多少笔跨日，取决于切点写在哪</text>
</svg>
