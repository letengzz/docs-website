<text x="154.0" y="260.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">票价 − 优惠 + 凑整</text>
<rect x="344" y="205" width="252" height="78" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="470.0" y="240.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b45309">钱箱现金</text>
<text x="470.0" y="260.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">期初 + 现金收 − 现金退 − 缴款</text>
<rect x="660" y="205" width="252" height="78" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="786.0" y="240.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f766e">渠道到账</text>
<text x="786.0" y="260.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">电子实收 − 手续费（逐笔取整）</text>
<line x1="280" y1="244" x2="340" y2="244" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah-a)" stroke-dasharray="4 3"/>
<line x1="596" y1="244" x2="656" y2="244" stroke="#0f766e" stroke-width="1.6" marker-end="url(#ah-t)" stroke-dasharray="4 3"/>
<text x="24" y="320" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">四段失败是安静的（不报错、不留日志、只是数不对）</text>
<rect x="28" y="324" width="26" height="20" rx="5" fill="#ffe4e6" stroke="#9f1239"/>
<text x="41" y="339" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">价</text>
<text x="66" y="339" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">终端还在用上一版价目，收错了也没人知道</text>
<rect x="28" y="352" width="26" height="20" rx="5" fill="#ffe4e6" stroke="#9f1239"/>
<text x="41" y="367" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">折</text>
<text x="66" y="367" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">优惠按行四舍五入，整单差 1 分，日结才炸</text>
<rect x="28" y="380" width="26" height="20" rx="5" fill="#ffe4e6" stroke="#9f1239"/>
<text x="41" y="395" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">退</text>
<text x="66" y="395" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">跨店退、部分退没扣额度，退到负数才发现</text>
<rect x="28" y="408" width="26" height="20" rx="5" fill="#ffe4e6" stroke="#9f1239"/>
<text x="41" y="423" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">结</text>
<text x="66" y="423" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">钱箱与系统差 3 元，被当成「收银员手抖」</text>
<text x="470.0" y="456" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">种子 20261103 · 30,000 单实测：价目滞后 6.12%、分摊不闭合 13.75%、跨店退 916 笔</text>
</svg>
