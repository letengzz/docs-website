<rect x="288" y="70" width="116" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="346.0" y="103.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#0f766e">收</text>
<text x="346.0" y="123.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">点单·挂单</text>
<line x1="405" y1="107.0" x2="416" y2="107.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="418" y="70" width="116" height="74" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="476.0" y="103.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#b45309">折</text>
<text x="476.0" y="123.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">优惠·凑整</text>
<line x1="535" y1="107.0" x2="546" y2="107.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="548" y="70" width="116" height="74" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="606.0" y="103.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#3730a3">付</text>
<text x="606.0" y="123.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">组合支付</text>
<line x1="665" y1="107.0" x2="676" y2="107.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="678" y="70" width="116" height="74" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
