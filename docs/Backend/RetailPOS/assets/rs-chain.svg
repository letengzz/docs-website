<text x="736.0" y="123.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">原单退货</text>
<line x1="795" y1="107.0" x2="806" y2="107.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="808" y="70" width="116" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="866.0" y="103.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#0f766e">结</text>
<text x="866.0" y="123.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">班结·对账</text>
<text x="24" y="190" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">同一笔钱，三个不同的数：三处各自成立，合起来不一定成立</text>
<rect x="28" y="205" width="252" height="78" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
