<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">剖析工具选择：先按症状分类，再选工具</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">选错工具的代价不是「没收获」，而是拿出一份看起来专业、指向完全错误方向的报告</text>

  <!-- symptom row -->
  <rect x="40" y="76" width="700" height="52" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="58" y="98" font-size="11" fill="#334155" font-weight="bold">第一步：把症状说成一句可以被证伪的话</text>
  <text x="58" y="118" font-size="10" fill="#475569">「接口慢」→ 是 CPU 忙、等锁、等 IO，还是 GC 在停？四种情况的修复方式互不通用</text>

  <!-- four columns -->
  <rect x="40" y="142" width="168" height="180" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="124" y="164" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">CPU 忙</text>
  <text x="124" y="186" text-anchor="middle" font-size="9.5" fill="#1E40AF">症状：CPU 打满、</text>
  <text x="124" y="201" text-anchor="middle" font-size="9.5" fill="#1E40AF">吞吐上不去</text>
  <text x="124" y="228" text-anchor="middle" font-size="9.5" fill="#1D4ED8" font-weight="bold">先看</text>
  <text x="124" y="248" text-anchor="middle" font-size="9" fill="#475569">async-profiler</text>
  <text x="124" y="263" text-anchor="middle" font-size="9" fill="#475569">-e cpu 火焰图</text>
  <text x="124" y="288" text-anchor="middle" font-size="9" fill="#475569">JFR 事件视图</text>
  <text x="124" y="308" text-anchor="middle" font-size="8.5" fill="#64748B">看最宽的那条栈顶</text>

  <rect x="220" y="142" width="168" height="180" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="304" y="164" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">等锁 / 阻塞</text>
  <text x="304" y="186" text-anchor="middle" font-size="9.5" fill="#7F1D1D">症状：CPU 不高、</text>
  <text x="304" y="201" text-anchor="middle" font-size="9.5" fill="#7F1D1D">延迟却很高</text>
  <text x="304" y="228" text-anchor="middle" font-size="9.5" fill="#B91C1C" font-weight="bold">先看</text>
  <text x="304" y="248" text-anchor="middle" font-size="9" fill="#475569">async-profiler</text>
  <text x="304" y="263" text-anchor="middle" font-size="9" fill="#475569">-e lock / wall</text>
  <text x="304" y="288" text-anchor="middle" font-size="9" fill="#475569">jstack 多次采样</text>
  <text x="304" y="308" text-anchor="middle" font-size="8.5" fill="#64748B">比较同一线程多次栈</text>

  <rect x="400" y="142" width="168" height="180" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="484" y="164" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">GC 停顿</text>
  <text x="484" y="186" text-anchor="middle" font-size="9.5" fill="#6D28D9">症状：周期性毛刺、</text>
  <text x="484" y="201" text-anchor="middle" font-size="9.5" fill="#6D28D9">P99 远高于 P50</text>
  <text x="484" y="228" text-anchor="middle" font-size="9.5" fill="#7C3AED" font-weight="bold">先看</text>
  <text x="484" y="248" text-anchor="middle" font-size="9" fill="#475569">GC 日志（.log 或</text>
  <text x="484" y="263" text-anchor="middle" font-size="9" fill="#475569">-Xlog:gc*）</text>
  <text x="484" y="288" text-anchor="middle" font-size="9" fill="#475569">jcmd GC.heap_info</text>
  <text x="484" y="308" text-anchor="middle" font-size="8.5" fill="#64748B">先分清「停顿时长」与「频率」</text>

  <rect x="580" y="142" width="160" height="180" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="660" y="164" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">内存增长</text>
  <text x="660" y="186" text-anchor="middle" font-size="9.5" fill="#065F46">症状：运行久了</text>
  <text x="660" y="201" text-anchor="middle" font-size="9.5" fill="#065F46">OOM 或换页</text>
  <text x="660" y="228" text-anchor="middle" font-size="9.5" fill="#047857" font-weight="bold">先看</text>
  <text x="660" y="248" text-anchor="middle" font-size="9" fill="#475569">async-profiler</text>
  <text x="660" y="263" text-anchor="middle" font-size="9" fill="#475569">-e alloc 分配热点</text>
  <text x="660" y="288" text-anchor="middle" font-size="9" fill="#475569">jmap / JOL 快照</text>
  <text x="660" y="308" text-anchor="middle" font-size="8.5" fill="#64748B">看「谁在造对象」</text>

  <!-- bottom -->
  <rect x="40" y="334" width="700" height="52" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="58" y="354" font-size="10.5" fill="#334155" font-weight="bold">两条纪律</text>
  <text x="58" y="374" font-size="10" fill="#475569">① 采样型剖析器都有偏差：wall-clock 看等待、cpu 看占用、alloc 看分配量，三者不能互相替代 ② 剖析只负责指出「哪一行」，改动与验收仍要回到可复现的基线</text>
</svg>
