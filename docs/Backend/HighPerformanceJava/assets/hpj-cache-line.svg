<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="360" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">伪共享：两个线程改各自的字段，却在抢同一条缓存行</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">单线程跑得飞快、并发一开就崩到十分之一——它不是算法问题，是内存布局问题</text>

  <!-- bad -->
  <rect x="40" y="76" width="700" height="124" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="58" y="98" font-size="12" fill="#991B1B" font-weight="bold">有伪共享：两个 volatile 字段落在同一条 64 字节缓存行里</text>
  <rect x="60" y="112" width="660" height="44" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.4"/>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#7F1D1D">一条缓存行（典型 64 字节）被两个核心同时持有</text>
  <rect x="80" y="136" width="180" height="16" rx="3" fill="#DC2626"/>
  <text x="170" y="148" text-anchor="middle" font-size="8.5" fill="#FFFFFF">线程 A 的计数器</text>
  <rect x="520" y="136" width="180" height="16" rx="3" fill="#DC2626"/>
  <text x="610" y="148" text-anchor="middle" font-size="8.5" fill="#FFFFFF">线程 B 的计数器</text>
  <text x="58" y="178" font-size="10" fill="#7F1D1D">A 写一下 → 缓存行在 B 的核心里失效；B 写一下 → 又反过来。每写一次都是一次缓存行来回搬运（cache line ping-pong）</text>
  <text x="58" y="194" font-size="10" fill="#991B1B" font-weight="bold">症状：CPU 使用率不高、吞吐上不去、火焰图里看不到热点方法，只有缓存失效计数爆表</text>

  <!-- good -->
  <rect x="40" y="210" width="700" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="58" y="232" font-size="12" fill="#065F46" font-weight="bold">消除方式：把两个字段分开到不同缓存行（填充），或干脆不共享</text>

  <rect x="60" y="246" width="200" height="34" rx="5" fill="#A7F3D0" stroke="#059669" stroke-width="1.2"/>
  <text x="160" y="267" text-anchor="middle" font-size="9.5" fill="#065F46">A 字段 + 7 个 long 填充</text>
  <rect x="270" y="246" width="150" height="34" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="345" y="267" text-anchor="middle" font-size="9" fill="#64748B">缓存行 #1</text>
  <rect x="430" y="246" width="200" height="34" rx="5" fill="#A7F3D0" stroke="#059669" stroke-width="1.2"/>
  <text x="530" y="267" text-anchor="middle" font-size="9.5" fill="#065F46">B 字段 + 7 个 long 填充</text>
  <rect x="640" y="246" width="80" height="34" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="680" y="267" text-anchor="middle" font-size="9" fill="#64748B">缓存行 #2</text>

  <text x="58" y="300" font-size="10" fill="#065F46">首选：@sun.misc.Contended + -XX:-RestrictContended（HotSpot 默认只允许 JDK 内部类使用填充，应用类要用必须显式放开）</text>
  <text x="58" y="318" font-size="10" fill="#065F46">次选：把「每个线程各写一份、最后再汇总」当默认设计（LongAdder 就是这个思路），而不是硬扛填充</text>
  <text x="58" y="334" font-size="10" fill="#047857">先确认再动手：先看是不是真的热点，填充会让对象变大、内存带宽变差——它是取舍不是免费的午餐</text>
</svg>
