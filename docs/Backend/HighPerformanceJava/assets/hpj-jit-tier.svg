<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分层编译：代码在运行时才变成机器码</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一个方法会被反复「重新编译得更快」，直到它足够热；去优化则把它打回去重来</text>

  <!-- tiers -->
  <rect x="40" y="76" width="150" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="115" y="98" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="bold">Tier 0 解释器</text>
  <text x="115" y="116" text-anchor="middle" font-size="9" fill="#475569">带 profile 计数</text>

  <rect x="212" y="76" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="287" y="98" text-anchor="middle" font-size="11.5" fill="#1E3A8A" font-weight="bold">Tier 1~3 C1</text>
  <text x="287" y="116" text-anchor="middle" font-size="9" fill="#1E40AF">快编译、弱优化、带 profile</text>

  <rect x="384" y="76" width="170" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="469" y="98" text-anchor="middle" font-size="11.5" fill="#5B21B6" font-weight="bold">Tier 4 C2</text>
  <text x="469" y="116" text-anchor="middle" font-size="9" fill="#6D28D9">慢编译、激进优化、峰值性能</text>

  <rect x="576" y="76" width="164" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="658" y="98" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">持续再优化</text>
  <text x="658" y="116" text-anchor="middle" font-size="9" fill="#065F46">更热的路径继续被重塑</text>

  <path d="M 190 104 L 212 104" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 362 104 L 384 104" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 554 104 L 576 104" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="287" y="150" text-anchor="middle" font-size="9.5" fill="#64748B">方法调用计数 + 回边计数越阈值</text>

  <!-- key optimizations -->
  <rect x="40" y="170" width="340" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="58" y="192" font-size="12" fill="#1E3A8A" font-weight="bold">C2 最影响性能的四类优化</text>
  <text x="58" y="214" font-size="10" fill="#1E40AF">① 方法内联：小方法直接铺开，是其它优化的前提</text>
  <text x="58" y="234" font-size="10" fill="#1E40AF">② 逃逸分析：对象不逃逸则消除锁、拆散、放栈上</text>
  <text x="58" y="254" font-size="10" fill="#1E40AF">③ 分支预测与循环优化：按 profile 重排与展开</text>
  <text x="58" y="274" font-size="10" fill="#1E40AF">④ 去虚化：单实现点的虚调用改成直接调用</text>

  <rect x="400" y="170" width="340" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="418" y="192" font-size="12" fill="#991B1B" font-weight="bold">三条去优化（deopt）路径</text>
  <text x="418" y="214" font-size="10" fill="#7F1D1D">① 假设失败：新类加载让「只有一个实现」不再成立</text>
  <text x="418" y="234" font-size="10" fill="#7F1D1D">② 激进假设被打破：数组类型不匹配等 uncommon trap</text>
  <text x="418" y="254" font-size="10" fill="#7F1D1D">③ 编译结果被替换：C2 版本替换 C1 版本时切栈</text>
  <text x="418" y="274" font-size="10" fill="#7F1D1D">后果：回到解释器重新热身——所以「偶发变慢」常是它</text>

  <rect x="40" y="304" width="700" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="58" y="326" font-size="11" fill="#334155" font-weight="bold">观测入口（不改代码就能看到编译行为）</text>
  <text x="58" y="348" font-size="10" fill="#475569">-XX:+PrintCompilation 看编译与去优化事件 ｜ -XX:+UnlockDiagnosticVMOptions -XX:+PrintInlining 看内联决策</text>
  <text x="58" y="368" font-size="10" fill="#475569">-XX:+PrintFlagsFinal 查当前 JDK 的真实默认值（网上抄的参数常常已经不存在） ｜ JITWatch 可视化</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
