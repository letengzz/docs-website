<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">优化从哪一层开始：收益递减、代价递增</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">越靠上的层，改动越小、收益越大；越靠下的层，越依赖测量数据才能动手</text>

  <!-- layer 1 -->
  <rect x="40" y="76" width="700" height="62" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="60" y="100" font-size="12.5" fill="#991B1B" font-weight="bold">L1 算法与数据规模</text>
  <text x="60" y="120" font-size="10.5" fill="#7F1D1D">复杂度写错（O(n²) 套在 n=10⁵）、N+1 查询、把全量数据读进内存再筛</text>
  <text x="720" y="110" text-anchor="end" font-size="11" fill="#B91C1C" font-weight="bold">收益 10~1000×</text>

  <!-- layer 2 -->
  <rect x="40" y="146" width="700" height="62" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="60" y="170" font-size="12.5" fill="#9A3412" font-weight="bold">L2 架构与交互次数</text>
  <text x="60" y="190" font-size="10.5" fill="#7C2D12">一次 RPC 拆成五次、循环里发请求、缓存没命中、串行调用可并行</text>
  <text x="720" y="180" text-anchor="end" font-size="11" fill="#C2410C" font-weight="bold">收益 2~20×</text>

  <!-- layer 3 -->
  <rect x="40" y="216" width="700" height="62" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="60" y="240" font-size="12.5" fill="#1E3A8A" font-weight="bold">L3 实现与数据结构</text>
  <text x="60" y="260" font-size="10.5" fill="#1E40AF">集合选型与容量预估、字符串拼接、装箱、正则重复编译、序列化方式、锁粒度</text>
  <text x="720" y="250" text-anchor="end" font-size="11" fill="#1D4ED8" font-weight="bold">收益 1.2~5×</text>

  <!-- layer 4 -->
  <rect x="40" y="286" width="700" height="62" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="60" y="310" font-size="12.5" fill="#5B21B6" font-weight="bold">L4 运行时与部署形态</text>
  <text x="60" y="330" font-size="10.5" fill="#6D28D9">JIT 预热与 AOT cache、GC 选型与堆规划、CPU/内存配额、容器限流</text>
  <text x="720" y="320" text-anchor="end" font-size="11" fill="#6D28D9" font-weight="bold">收益 1.1~3×</text>

  <path d="M 24 92 L 24 332" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrGrey)"/>
  <text x="16" y="212" text-anchor="middle" font-size="9.5" fill="#64748B" transform="rotate(-90 16 212)">先测量，再往下走一层</text>

  <defs>
    <marker id="arrGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="40" y="360" width="700" height="26" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="390" y="377" text-anchor="middle" font-size="10.5" fill="#334155">动手顺序：定指标口径 → 建可复现基线 → 用剖析器定位到具体方法 → 只改这一处 → 回归同一口径</text>
</svg>
