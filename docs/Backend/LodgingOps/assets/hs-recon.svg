<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img">
<title>渠道对账：四形状与「净额陷阱」</title>
<rect x="0" y="0" width="860" height="340" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">OTA 结算单与 PMS 台账的差，从来不是一笔</text>
<text x="28" y="54" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">1,784 张 OTA 单、房费 2,021,592.84 元：四种形状同时存在</text>
<text x="28" y="100" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">漏单 23 单</text>
