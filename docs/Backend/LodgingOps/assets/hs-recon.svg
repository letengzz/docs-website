<text x="560" y="100" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="start">20,436.86</text>
<text x="28" y="140" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">重复 5 单</text>
<rect x="150" y="124" width="400" height="20" rx="3" fill="#e2e8f0"/><rect x="150" y="124" width="73.7" height="20" rx="3" fill="#b45309"/>
<text x="560" y="140" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="start">3,766.80</text>
<text x="28" y="180" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">房价差 43 单</text>
