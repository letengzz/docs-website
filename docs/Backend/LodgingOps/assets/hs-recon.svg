<text x="454" y="298" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">四类绝对值相加：净额只暴露 70.8% 的问题金额</text>
