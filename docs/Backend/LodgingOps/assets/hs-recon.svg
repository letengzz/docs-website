<text x="560" y="180" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="start">1,229.02</text>
<text x="28" y="220" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">佣金差 39 单</text>
<rect x="150" y="204" width="400" height="20" rx="3" fill="#e2e8f0"/><rect x="150" y="204" width="6.9" height="20" rx="3" fill="#6d28d9"/>
<text x="560" y="220" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="start">352.84</text>
<rect x="28" y="252" width="386" height="62" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="44" y="276" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">净额 18,251.92 元</text>
<text x="44" y="298" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">漏 + 价差 + 佣金差 − 重复 = 一张「看起来还行」的表</text>
<rect x="438" y="252" width="394" height="62" rx="8" ry="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
