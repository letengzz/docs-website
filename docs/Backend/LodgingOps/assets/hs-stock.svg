<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img">
<title>可售库存：四数减法</title>
<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">物理房 120 − 维修 3.05 − 锁房 0.73 = 可售 116.22（60 天均值）</text>
<text x="28" y="54" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">可售不是一个常量，是一晚一算的减法；渠道拿到的是这个减法之后的结果</text>
<text x="28" y="102" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">物理房</text>
<rect x="150" y="84" width="520.0" height="26" rx="4" fill="#475569" opacity="0.25"/>
<rect x="150" y="84" width="520.0" height="26" rx="4" fill="none" stroke="#475569" stroke-width="1"/>
<text x="680.0" y="102" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" font-weight="600" text-anchor="start">120</text>
<text x="28" y="148" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">− 维修 OOO</text>
<rect x="150" y="130" width="13.2" height="26" rx="4" fill="#b91c1c" opacity="0.25"/>
<rect x="150" y="130" width="13.2" height="26" rx="4" fill="none" stroke="#b91c1c" stroke-width="1"/>
<text x="173.21666666666667" y="148" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">3.05</text>
<text x="28" y="194" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">− 锁房</text>
<rect x="150" y="176" width="3.2" height="26" rx="4" fill="#b45309" opacity="0.25"/>
<rect x="150" y="176" width="3.2" height="26" rx="4" fill="none" stroke="#b45309" stroke-width="1"/>
<text x="163.16333333333333" y="194" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">0.73</text>
<text x="28" y="240" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">= 可售</text>
<rect x="150" y="222" width="503.6" height="26" rx="4" fill="#0f766e" opacity="0.25"/>
<rect x="150" y="222" width="503.6" height="26" rx="4" fill="none" stroke="#0f766e" stroke-width="1"/>
<text x="663.62" y="240" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f766e" font-weight="600" text-anchor="start">116.22</text>
<text x="700" y="100" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="start">本机 60 晚</text>
<text x="700" y="120" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">住满 18 晚</text>
<text x="700" y="140" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">拒单 600 单</text>
<text x="700" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">16.30%</text>
<rect x="28" y="276" width="804" height="56" rx="8" ry="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="44" y="300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">维修与锁房吃掉 227 个房晚 = 物理房晚的 3.15%——这部分是「有房但不能卖」，不是「没需求」</text>
<text x="44" y="320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">把 OOO 算进分母，入住率会凭空低 3 个点；不算进分母，渠道会以为还有房可卖</text>
</svg>
