<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img">
<title>七段链：四段的失败是安静的</title>
<rect x="0" y="0" width="860" height="320" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="34" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start">从一间房被挂出来，到这一晚的钱被确认</text>
<text x="28" y="54" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">七段里四段不会报错——房还是那间房，单还是那单，只有口径变了</text>
<rect x="28" y="96" width="98" height="74" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="77.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">① 建</text>
<text x="77.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">房型 / 物理房</text>
<text x="77.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle">安静</text>
<line x1="128" y1="133" x2="138" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="140" y="96" width="98" height="74" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="189.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">② 排</text>
<text x="189.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">房态 / 锁房</text>
<text x="189.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle">安静</text>
<line x1="240" y1="133" x2="250" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="252" y="96" width="98" height="74" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="301.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">③ 价</text>
<text x="301.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">日历价 / 限制</text>
<text x="301.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle">安静</text>
<line x1="352" y1="133" x2="362" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="364" y="96" width="98" height="74" rx="8" ry="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="413.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">④ 订</text>
<text x="413.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">担保 / 超售</text>
<text x="413.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600" text-anchor="middle">显性</text>
<line x1="464" y1="133" x2="474" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="476" y="96" width="98" height="74" rx="8" ry="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="525.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">⑤ 住</text>
<text x="525.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">入住 / 换房</text>
<text x="525.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#0f766e" font-weight="600" text-anchor="middle">显性</text>
<line x1="576" y1="133" x2="586" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="588" y="96" width="98" height="74" rx="8" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="637.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">⑥ 退</text>
<text x="637.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">取消 / 罚金</text>
<text x="637.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#b45309" font-weight="600" text-anchor="middle">半显性</text>
<line x1="688" y1="133" x2="698" y2="133" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="700" y="96" width="98" height="74" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="749.0" y="122" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">⑦ 结</text>
<text x="749.0" y="142" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">夜审 / 对账</text>
<text x="749.0" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle">安静</text>
<rect x="28" y="196" width="804" height="44" rx="8" ry="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="44" y="223" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="start">四段「安静」的共同形态：库里每一行都对，报表每一列都能加，只有「这一晚到底卖没卖出去」没人能自证</text>
<text x="28" y="268" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">安静 ≠ 无害：建错了房型要到第一次超卖才发现，价错了要到月末对账才发现，结错了要等渠道来函</text>
<text x="28" y="288" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">显性的两段（订、住）有客人当场投诉，反而是最不容易积压的两段</text>
</svg>
