<text x="682" y="226" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">ChannelRecon</text>
<text x="682" y="250" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">对账与佣金</text>
<rect x="28" y="330" width="804" height="54" rx="8" ry="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="44" y="354" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">落地面：11 张表 / 4 个触发器 / 8 条断言 / 80 条判据（10 族）</text>
<text x="44" y="374" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">读者按「房 → 价 → 住 → 钱」的顺序读，每一段只回答一个问题：这一晚的那个数，凭什么</text>
