<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="三个「他有多强」">
<rect width="680" height="330" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">三个「他有多强」：真实实力 / 隐藏 MMR / 显示段位分</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">同一名玩家，三个数在同一秒都「对」，却互不相等</text>
<rect x="24" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="70" width="200" height="3" rx="1.5" fill="#94a3b8" opacity="1.0"/>
<text x="124" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">真实实力</text>
<text x="124" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">谁也不知道</text>
<text x="38" y="136" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">抽样 20,000 人</text>
<text x="38" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">σ = 250 分</text>
<text x="38" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">只有出题人能看见</text>
<rect x="236" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="236" y="70" width="200" height="3" rx="1.5" fill="#2563eb" opacity="1.0"/>
<text x="336" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">隐藏 MMR</text>
<text x="336" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">系统知道但不公开</text>
<text x="250" y="136" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">Elo 32 分/局更新</text>
<text x="250" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">100 场后 RMSE 94.4</text>
<text x="250" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">配对只看这个</text>
<rect x="448" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="448" y="70" width="200" height="3" rx="1.5" fill="#0d9488" opacity="1.0"/>
<text x="548" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">显示段位分</text>
<text x="548" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">玩家只看这个</text>
<text x="462" y="136" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">取整到 10 分</text>
<text x="462" y="156" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">与 MMR 平均差 2.50</text>
<text x="462" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">决定段位标签与奖励</text>
<rect x="24" y="236" width="632" height="46" rx="10" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="4 3"/>
<text x="38" y="256" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">本机：跨两个大段的人真实实力差 824 分；同一个「王者」段内，真实实力跨度就有 327 分</text>
<text x="38" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">→ 段位是「分位数」，不是「能力值」；把段位当能力用，一切匹配规则都会算错</text>
<text x="24" y="306" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">三个数各有各的合法用途，谁也不能替谁</text>
</svg>
