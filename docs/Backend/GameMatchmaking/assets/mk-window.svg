<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="窗口放宽：用质量换时间">
<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">把窗口从 ±50 放到 ±400：等待从 25 秒掉到 0 秒，跨度从 287 分涨到 482 分</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">同一份 2 万人池、同一到达率（1.6 人/秒），只改窗口</text>
<rect x="24" y="70" width="632" height="168" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">窗口</text>
<text x="130" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">等待 P50</text>
<text x="218" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">等待 P90</text>
<text x="310" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">跨度 P50</text>
<text x="400" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">跨度 P90</text>
<text x="480" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">跨度&gt;500 的局</text>
<text x="576" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" opacity="1.0">扩池局占比</text>
<line x1="32" y1="100" x2="648" y2="100" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">±50</text>
<text x="130" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">25s</text>
<text x="218" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">70s</text>
<text x="310" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">287 分</text>
<text x="400" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">397 分</text>
<text x="480" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">1.0%</text>
<text x="576" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">62.5%</text>
<line x1="32" y1="132" x2="648" y2="132" stroke="#eef2f7" stroke-width="1"/>
<text x="40" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">±100</text>
<text x="130" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">15s</text>
<text x="218" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">50s</text>
<text x="310" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">304 分</text>
<text x="400" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">423 分</text>
<text x="480" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">2.4%</text>
<text x="576" y="152" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">25.4%</text>
<line x1="32" y1="162" x2="648" y2="162" stroke="#eef2f7" stroke-width="1"/>
<text x="40" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">±200</text>
<text x="130" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">5s</text>
<text x="218" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">25s</text>
<text x="310" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">345 分</text>
<text x="400" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">491 分</text>
<text x="480" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">8.4%</text>
<text x="576" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">9.4%</text>
<line x1="32" y1="192" x2="648" y2="192" stroke="#eef2f7" stroke-width="1"/>
<text x="40" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">±400</text>
<text x="130" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">0s</text>
<text x="218" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">15s</text>
<text x="310" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">482 分</text>
<text x="400" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">638 分</text>
<text x="480" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">44.7%</text>
<text x="576" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">2.8%</text>
<text x="24" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">「扩池局占比」是隐性成本：62.5% 的局在 ±50 下是靠「等久了才放宽」凑成的</text>
<text x="24" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">它不是免费的质量，而是「先给你一个承诺、再自己推翻」</text>
<text x="24" y="312" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">选窗口不是选一个数，是选一条曲线上的点：等多久 / 差多少 / 有多少局靠扩池兜底</text>
</svg>
