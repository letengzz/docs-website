<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-label="榜单：并列、分片与归并">
<rect width="680" height="316" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">5 万人的整数分榜单，前 100 名只占 5 种分值</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">同分的人怎么排，决定了「第 100 名」到底是谁</text>
<rect x="24" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="50" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S1</text>
<text x="50" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="84" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="110" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S2</text>
<text x="110" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="144" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="170" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S3</text>
<text x="170" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="204" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="230" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S4</text>
<text x="230" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="264" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="290" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S5</text>
<text x="290" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="324" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="350" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S6</text>
<text x="350" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="384" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="410" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S7</text>
<text x="410" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<rect x="444" y="78" width="52" height="60" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="470" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">S8</text>
<text x="470" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">前 100</text>
<line x1="500" y1="108" x2="553.0" y2="108.0" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="560.0,108.0 553.0,104.6 553.0,111.4" fill="#2563eb"/>
<rect x="566" y="78" width="90" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="611" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">归并</text>
<text x="611" y="120" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">12.0 ms</text>
<rect x="24" y="164" width="632" height="30" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="164" width="3" height="30" rx="4" fill="#dc2626" opacity="1.0"/>
<text x="38" y="184" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">按 score 排序</text>
<text x="210" y="184" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">第 100 行 = 2,995 分</text>
<text x="400" y="184" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">同分 27 人，谁上谁下随机</text>
<rect x="24" y="202" width="632" height="30" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="202" width="3" height="30" rx="4" fill="#16a34a" opacity="1.0"/>
<text x="38" y="222" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">按 (score, player_id)</text>
<text x="210" y="222" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">第 100 行稳定</text>
<text x="400" y="222" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700" opacity="1.0">同一秒两次查询同一个人</text>
<rect x="24" y="240" width="632" height="30" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="240" width="3" height="30" rx="4" fill="#d97706" opacity="1.0"/>
<text x="38" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">dense_rank</text>
<text x="210" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">第 100 行 = 第 5 名</text>
<text x="400" y="260" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700" opacity="1.0">「并列第 5」与「第 100 位」不是一回事</text>
<text x="24" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">榜单的每一个「第 N 名」都要能回答：同分怎么排、多久刷新、跨赛季怎么算</text>
</svg>
