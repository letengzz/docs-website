<text x="98" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">全量对局记录</text>
<line x1="174" y1="109" x2="177.0" y2="109.0" stroke="#dbe3ef" stroke-width="1.2"/>
