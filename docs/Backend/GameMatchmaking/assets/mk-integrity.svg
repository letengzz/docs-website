<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="作弊检测：规则、误伤与处置">
<rect width="680" height="330" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">一条「互刷」规则能抓全，但要先算清楚误伤多少人</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">本机 400 个互刷账号 + 5,000 个正常玩家</text>
<rect x="24" y="78" width="148" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
