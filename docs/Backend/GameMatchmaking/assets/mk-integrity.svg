<text x="260" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">标记 460 人</text>
<text x="260" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">同对手≥5 场且胜率≥0.9</text>
<line x1="336" y1="109" x2="339.0" y2="109.0" stroke="#dbe3ef" stroke-width="1.2"/>
<polygon points="346.0,109.0 339.0,105.6 339.0,112.4" fill="#dbe3ef"/>
<rect x="348" y="78" width="148" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
<rect x="348" y="78" width="148" height="3" rx="1.5" fill="#dc2626" opacity="1.0"/>
<text x="422" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">确认 400 人</text>
<text x="422" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">人工复核 + 对局回放</text>
<line x1="498" y1="109" x2="501.0" y2="109.0" stroke="#dbe3ef" stroke-width="1.2"/>
<polygon points="508.0,109.0 501.0,105.6 501.0,112.4" fill="#dbe3ef"/>
<rect x="510" y="78" width="148" height="62" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<rect x="510" y="78" width="148" height="3" rx="1.5" fill="#7c3aed" opacity="1.0"/>
<text x="584" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">误伤 60 人</text>
<text x="584" y="122" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">精度 87.0%</text>
<rect x="24" y="168" width="632" height="32" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="168" width="3" height="32" rx="4" fill="#dc2626" opacity="1.0"/>
<text x="38" y="189" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">挂机 120 s</text>
<text x="180" y="189" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">判定 5.16%</text>
<text x="330" y="189" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">1.5 倍阈值内回归 190 人</text>
<rect x="24" y="208" width="632" height="32" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="208" width="3" height="32" rx="4" fill="#d97706" opacity="1.0"/>
<text x="38" y="229" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">挂机 180 s</text>
<text x="180" y="229" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700" opacity="1.0">判定 1.36%</text>
<text x="330" y="229" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">回归 52 人</text>
<rect x="24" y="248" width="632" height="32" rx="6" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="248" width="3" height="32" rx="4" fill="#16a34a" opacity="1.0"/>
<text x="38" y="269" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">挂机 300 s</text>
<text x="180" y="269" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700" opacity="1.0">判定 0.14%</text>
<text x="330" y="269" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">回归 6 人</text>
<text x="24" y="300" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">阈值越低召回越高、误伤越大；判罚之前先把「误伤成本」写进规则表</text>
<text x="24" y="318" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">4v5 按队均分算胜率 50.21%，按队总分算 7.29%——实力函数选错，掉线判定全线失效</text>
</svg>
