<text x="24" y="306" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">交替使用（前 20 场 K=64、之后 K=32）才能同时拿到「快」和「准」</text>
