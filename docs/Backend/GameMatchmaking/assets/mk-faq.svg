<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="680" height="336" role="img" aria-label="排障分诊树">
<rect width="680" height="336" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">先问「哪一段的数不对」，再问「为什么」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">五个症状，五条最短路径</text>
<circle cx="32" cy="84" r="5" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="46" y="88" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">玩家说「我明明赢了却掉分」</text>
<text x="300" y="88" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">结算段</text>
<text x="360" y="88" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">查 settle_log 是否有两条、mmr_history 的 delta 符号</text>
<circle cx="32" cy="130" r="5" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="46" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">玩家说「排了 5 分钟没进」</text>
<text x="300" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700" opacity="1.0">配对段</text>
<text x="360" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">查 queue_ticket 的 mmr_snapshot 与窗口、池内人数</text>
<circle cx="32" cy="176" r="5" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="46" y="180" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">玩家说「队友差太多」</text>
<text x="300" y="180" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700" opacity="1.0">建池/评分段</text>
<text x="360" y="180" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">查局的跨度、扩池标记、RD 是否过大</text>
<circle cx="32" cy="222" r="5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="46" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">运营说「段位通胀了」</text>
<text x="300" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700" opacity="1.0">赛季段</text>
<text x="360" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">查 season_point 与 MMR 的差、重置比、定级赛人数</text>
<circle cx="32" cy="268" r="5" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="46" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">运营说「榜上有人并列」</text>
<text x="300" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0d9488" text-anchor="start" font-weight="700" opacity="1.0">榜单段</text>
<text x="360" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">查排序键是否含 player_id、刷新周期</text>
<line x1="32" y1="84" x2="32" y2="264" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="316" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">五条路径覆盖本册 10 章 80 条判据里最常被问到的部分</text>
</svg>
