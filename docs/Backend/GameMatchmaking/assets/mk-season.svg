<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="赛季软重置：压缩的是分数，不是顺序">
<rect width="680" height="340" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">软重置把分数往中间压，但「谁强谁弱」的顺序一点没变</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">同一批 2 万人，压缩比 0.5 / 0.6 / 0.75</text>
<rect x="70" y="90" width="240" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="190.0" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">压缩比 0.5</text>
<line x1="90" y1="165" x2="290" y2="165" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="288" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400" opacity="1.0">1500</text>
<circle cx="110" cy="129.0" r="4" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="110" y="119.0" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700" opacity="1.0">王者</text>
<circle cx="164" cy="160.5" r="4" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="164" y="150.5" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">钻石</text>
<circle cx="218" cy="183.0" r="4" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="218" y="173.0" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="700" opacity="1.0">黄金</text>
<text x="90" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">分标准差 106.2</text>
<text x="90" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">±100 内人数 10,382</text>
<text x="90" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">段位标签变化 71.7%</text>
<rect x="370" y="90" width="240" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="490.0" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">压缩比 0.75</text>
<line x1="390" y1="165" x2="590" y2="165" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="588" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="end" font-weight="400" opacity="1.0">1500</text>
<circle cx="410" cy="111.0" r="4" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="410" y="101.0" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700" opacity="1.0">王者</text>
<circle cx="464" cy="158.25" r="4" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="464" y="148.25" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700" opacity="1.0">钻石</text>
<circle cx="518" cy="192.0" r="4" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="518" y="182.0" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="700" opacity="1.0">黄金</text>
<text x="390" y="202" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">分标准差 159.2</text>
<text x="390" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">±100 内人数 7,246</text>
<text x="390" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700" opacity="1.0">段位标签变化 34.9%</text>
<text x="24" y="268" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">三种压缩比的「局内实力跨度」完全相同（P50 281 / P90 392）：单调压缩保持相邻关系</text>
<text x="24" y="286" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">软重置不改「谁和谁配」，只改「他挂什么段位」和「池子有多挤」</text>
<text x="24" y="318" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">代价在别处：71.7% 的人段位标签变了，55% 胜率要 53 场才回到 1800 分</text>
</svg>
