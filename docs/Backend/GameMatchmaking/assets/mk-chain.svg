<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">建池 → 评分 → 配对 → 开局 → 结算 → 赛季 → 榜单</text>
