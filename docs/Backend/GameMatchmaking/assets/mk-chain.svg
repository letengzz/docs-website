<text x="535.0" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">赛季</text>
<text x="535.0" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">分怎么清</text>
<text x="535.0" y="148" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700" opacity="1.0">安静</text>
<line x1="577" y1="121" x2="580.0" y2="121.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="587.0,121.0 580.0,117.6 580.0,124.4" fill="#cbd5e1"/>
<rect x="588" y="84" width="82" height="74" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="588" y="84" width="82" height="3" rx="1.5" fill="#16a34a" opacity="1.0"/>
<text x="629.0" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">榜单</text>
<text x="629.0" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">他排第几</text>
<text x="629.0" y="148" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="400" opacity="1.0">半显性</text>
<text x="24" y="186" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">「安静」的意思是：这一段的错不会让任何人报错，只会在三个月后变成一句「我怎么掉段了」</text>
<circle cx="30" cy="202" r="4" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="44" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">安静的四段</text>
<text x="124" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">建池 · 评分 · 结算 · 赛季</text>
<circle cx="30" cy="226" r="4" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="44" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">半显性两段</text>
<text x="124" y="230" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">配对 · 榜单</text>
<circle cx="30" cy="250" r="4" fill="#16a34a" stroke="none" stroke-width="1"/>
<text x="44" y="254" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" opacity="1.0">显性一段</text>
<text x="124" y="254" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400" opacity="1.0">开局（人没到齐会卡住）</text>
<text x="24" y="278" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" opacity="1.0">本册 10 章按这条链展开，每章 8 条判据</text>
</svg>
