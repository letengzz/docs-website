<polygon points="399.0,121.0 392.0,117.6 392.0,124.4" fill="#cbd5e1"/>
<rect x="400" y="84" width="82" height="74" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="400" y="84" width="82" height="3" rx="1.5" fill="#dc2626" opacity="1.0"/>
<text x="441.0" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">结算</text>
<text x="441.0" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">这一局值多少分</text>
<text x="441.0" y="148" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700" opacity="1.0">安静</text>
<line x1="483" y1="121" x2="486.0" y2="121.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="493.0,121.0 486.0,117.6 486.0,124.4" fill="#cbd5e1"/>
