<polygon points="211.0,121.0 204.0,117.6 204.0,124.4" fill="#cbd5e1"/>
<rect x="212" y="84" width="82" height="74" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="212" y="84" width="82" height="3" rx="1.5" fill="#7c3aed" opacity="1.0"/>
<text x="253.0" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">配对</text>
