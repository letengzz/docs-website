<text x="159.0" y="112" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" opacity="1.0">评分</text>
<text x="159.0" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400" opacity="1.0">他有多强</text>
<text x="159.0" y="148" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700" opacity="1.0">安静</text>
