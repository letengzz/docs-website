<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" width="760" height="415" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="415" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Mutation 的三个必须写死：串行、两通道、幂等键</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">顶层字段串行执行，但整段不是一个事务——第二个失败，第一个已经提交</text>
  <text x="30" y="72" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">① 串行 ≠ 原子</text>
  <rect x="30" y="84" width="320" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190.0" y="109.3" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">createOrder</text>
  <text x="190.0" y="126.1" text-anchor="middle" font-size="7.5" fill="#047857">已提交，不可撤</text>
  <rect x="30" y="158" width="320" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190.0" y="183.3" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">reserveStock</text>
  <text x="190.0" y="200.1" text-anchor="middle" font-size="7.5" fill="#B91C1C">抛错 → 进 errors[]</text>
  <rect x="30" y="232" width="320" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="190.0" y="257.3" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">writeLedger</text>
  <text x="190.0" y="274.1" text-anchor="middle" font-size="7.5" fill="#B45309">仍然执行（spec 要求按序跑完）</text>
  <line x1="190" y1="144" x2="190" y2="156" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="190" y1="218" x2="190" y2="230" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <text x="390" y="72" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">② 两个错误通道各管一段</text>
  <rect x="390" y="84" width="340" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="560.0" y="108.0" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">errors[]：协议 / 字段级失败</text>
  <text x="560.0" y="124.7" text-anchor="middle" font-size="7.5" fill="#334155">第二个字段抛错 → 该字段 null</text>
  <text x="560.0" y="141.4" text-anchor="middle" font-size="7.5" fill="#334155">客户端拿到的是「部分成功」</text>
  <rect x="390" y="170" width="340" height="74" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560.0" y="193.9" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">payload.userErrors[]：业务拒绝</text>
  <text x="560.0" y="210.7" text-anchor="middle" font-size="7.5" fill="#0F766E">库存不足、余额不足、状态冲突</text>
  <text x="560.0" y="227.4" text-anchor="middle" font-size="7.5" fill="#0F766E">data 完整，字段本身为 null</text>
  <text x="390" y="260" text-anchor="start" font-size="8.5" fill="#64748B">判据：userErrors 非空时 errors 必须为空；反之亦然，不允许同一件事两边都写</text>
  <text x="30" y="300" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">③ 幂等键必须是 input 字段，不是 HTTP 头</text>
  <rect x="30" y="312" width="700" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380.0" y="335.3" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">createEnrollment(input: { idempotencyKey: "…" })</text>
  <text x="380.0" y="352.1" text-anchor="middle" font-size="7.5" fill="#1D4ED8">同一个 key 第二次提交 → 返回第一次的 payload（同 id、同 createdAt），不是 409</text>
  <text x="380" y="390" text-anchor="middle" font-size="9.5" fill="#B91C1C">本机栅栏实测（20 并发卡在「预检后、写入前」）：只有预检落 20 行，加唯一索引落 1 行</text>
  <defs>
    <marker id="arw7C3AED" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
