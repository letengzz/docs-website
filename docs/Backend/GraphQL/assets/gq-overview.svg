<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一次 GraphQL 请求的四个阶段与三种「打了几次库」</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四个阶段各有自己的失败形态；同一句 data 背后可能是 201 次数据库往返</text>
  <rect x="30" y="78" width="166" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="113.0" y="101.0" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 解析 parse</text>
  <text x="113.0" y="117.7" text-anchor="middle" font-size="7.5" fill="#1D4ED8">语法树</text>
  <text x="113.0" y="134.4" text-anchor="middle" font-size="7.5" fill="#1D4ED8">失败＝400</text>
  <rect x="208" y="78" width="166" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="291.0" y="101.0" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">② 校验 validate</text>
  <text x="291.0" y="117.7" text-anchor="middle" font-size="7.5" fill="#047857">按 schema 验</text>
  <text x="291.0" y="134.4" text-anchor="middle" font-size="7.5" fill="#047857">失败＝400</text>
  <rect x="386" y="78" width="166" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="469.0" y="101.0" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 执行 execute</text>
  <text x="469.0" y="117.7" text-anchor="middle" font-size="7.5" fill="#B45309">resolver 树</text>
  <text x="469.0" y="134.4" text-anchor="middle" font-size="7.5" fill="#B45309">失败＝200</text>
  <rect x="564" y="78" width="166" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="647.0" y="101.0" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">④ 序列化</text>
  <text x="647.0" y="117.7" text-anchor="middle" font-size="7.5" fill="#6D28D9">按请求裁剪</text>
  <text x="647.0" y="134.4" text-anchor="middle" font-size="7.5" fill="#6D28D9">失败＝200</text>
  <line x1="196" y1="114" x2="206" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="374" y1="114" x2="384" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="552" y1="114" x2="562" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="30" y1="162" x2="730" y2="162" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="176" text-anchor="middle" font-size="8.5" fill="#64748B">前两个阶段只碰 schema、不碰数据库；后两个阶段才真正打库——所以「贵不贵」要到 ③ 才知道</text>
  <text x="30" y="206" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">同一句 data 背后的三种往返量</text>
  <rect x="30" y="218" width="224" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="142.0" y="241.9" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">列表本身：1 次</text>
  <text x="142.0" y="258.7" text-anchor="middle" font-size="7.5" fill="#047857">listCourses 一条 SQL</text>
  <text x="142.0" y="275.4" text-anchor="middle" font-size="7.5" fill="#047857">页大小 first 决定行数</text>
  <rect x="268" y="218" width="224" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380.0" y="241.9" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">每个 item 的关联字段：N 次</text>
  <text x="380.0" y="258.7" text-anchor="middle" font-size="7.5" fill="#B91C1C">逐条查 author / tags</text>
  <text x="380.0" y="275.4" text-anchor="middle" font-size="7.5" fill="#B91C1C">N=200 时共 201 次</text>
  <rect x="506" y="218" width="224" height="74" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="618.0" y="241.9" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">resolver 内部再嵌一层：N×M 次</text>
  <text x="618.0" y="258.7" text-anchor="middle" font-size="7.5" fill="#BE185D">字段里又开一个循环</text>
  <text x="618.0" y="275.4" text-anchor="middle" font-size="7.5" fill="#BE185D">只有看日志才发现</text>
  <text x="30" y="318" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">错误有两个通道，别混成一个</text>
  <rect x="30" y="330" width="343" height="56" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="201.5" y="353.3" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">errors[]：请求级 / 字段级失败</text>
  <text x="201.5" y="370.1" text-anchor="middle" font-size="7.5" fill="#334155">data 里对应位置为 null，HTTP 仍是 200</text>
  <rect x="387" y="330" width="343" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="558.5" y="353.3" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">payload.userErrors[]：业务拒绝</text>
  <text x="558.5" y="370.1" text-anchor="middle" font-size="7.5" fill="#0F766E">data 完整返回，HTTP 也是 200</text>
  <text x="380" y="402" text-anchor="middle" font-size="9.5" fill="#B91C1C">把「库存不足」写进 errors[] 的接口，客户端会当成崩溃而不是提示</text>
  <defs>
    <marker id="arw7C3AED" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
