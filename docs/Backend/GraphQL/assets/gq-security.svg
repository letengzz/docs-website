<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">鉴权必须落在三处：连接、字段、对象</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">只做前两处时，任何一条 where 缺失都把别人的数据原样吐出来</text>
  <text x="30" y="74" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">① 三处鉴权，第三处只能自己写</text>
  <rect x="30" y="86" width="380" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="220.0" y="101.0" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">连接层：谁在请求</text>
  <text x="220.0" y="117.7" text-anchor="middle" font-size="7.5" fill="#1D4ED8">token → viewer</text>
  <text x="220.0" y="134.4" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不过就是匿名</text>
  <rect x="30" y="152" width="380" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="220.0" y="166.9" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">字段层：能不能看这个字段</text>
  <text x="220.0" y="183.7" text-anchor="middle" font-size="7.5" fill="#047857">schema 指令 / resolver 包装</text>
  <text x="220.0" y="200.4" text-anchor="middle" font-size="7.5" fill="#047857">viewer.email 只给本人</text>
  <rect x="30" y="218" width="380" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="220.0" y="232.9" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">对象层：能不能看这一行</text>
  <text x="220.0" y="249.7" text-anchor="middle" font-size="7.5" fill="#B91C1C">resolver 里的 where 条件</text>
  <text x="220.0" y="266.4" text-anchor="middle" font-size="7.5" fill="#B91C1C">没有通用中间件可代劳</text>
  <line x1="220" y1="142" x2="220" y2="150" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="220" y1="208" x2="220" y2="216" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <text x="430" y="74" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">② 四个滥用面与处置</text>
  <rect x="430" y="86" width="300" height="28" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.4"/>
  <text x="442" y="105" font-size="8.5" fill="#9D174D" font-weight="bold">深度炸弹</text>
  <text x="560" y="105" font-size="8.5" fill="#BE185D">处置：depth ≤ 8</text>
  <rect x="430" y="122" width="300" height="28" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.4"/>
  <text x="442" y="141" font-size="8.5" fill="#9D174D" font-weight="bold">宽度炸弹</text>
  <text x="560" y="141" font-size="8.5" fill="#BE185D">处置：别名数 ≤ 30</text>
  <rect x="430" y="158" width="300" height="28" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.4"/>
  <text x="442" y="177" font-size="8.5" fill="#9D174D" font-weight="bold">批处理放大</text>
  <text x="560" y="177" font-size="8.5" fill="#BE185D">处置：单请求 1 个操作</text>
  <rect x="430" y="194" width="300" height="28" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.4"/>
  <text x="442" y="213" font-size="8.5" fill="#9D174D" font-weight="bold">内省爬取</text>
  <text x="560" y="213" font-size="8.5" fill="#BE185D">处置：匿名关闭内省</text>
  <text x="30" y="306" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">③ 内省与持久化查询：省的是流量，不是「越多越好」</text>
  <rect x="30" y="318" width="166" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="113.0" y="334.9" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">内省响应体积</text>
  <text x="113.0" y="351.7" text-anchor="middle" font-size="7.5" fill="#B45309">60 类型 = 142.9 KiB</text>
  <text x="113.0" y="368.4" text-anchor="middle" font-size="7.5" fill="#B45309">120 类型 = 285.7 KiB</text>
  <rect x="208" y="318" width="166" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="291.0" y="334.9" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">短查询 APQ</text>
  <text x="291.0" y="351.7" text-anchor="middle" font-size="7.5" fill="#0F766E">287 → 193 B（32.8%）</text>
  <text x="291.0" y="368.4" text-anchor="middle" font-size="7.5" fill="#0F766E">含 700 B 头只省 9.5%</text>
  <rect x="386" y="318" width="166" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="469.0" y="334.9" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">长文档 APQ</text>
  <text x="469.0" y="351.7" text-anchor="middle" font-size="7.5" fill="#047857">1,718 → 182 B（89.4%）</text>
  <text x="469.0" y="368.4" text-anchor="middle" font-size="7.5" fill="#047857">含头仍省 63.5%</text>
  <rect x="564" y="318" width="166" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="647.0" y="334.9" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">GET + Cookie</text>
  <text x="647.0" y="351.7" text-anchor="middle" font-size="7.5" fill="#B91C1C">可被第三方页面读取</text>
  <text x="647.0" y="368.4" text-anchor="middle" font-size="7.5" fill="#B91C1C">必须开 CSRF 防护</text>
  <text x="380" y="402" text-anchor="middle" font-size="9.5" fill="#B91C1C">把「省 98%」当普适结论是错的：短查询在固定请求头面前几乎不省</text>
  <defs>
    <marker id="arw7C3AED" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
