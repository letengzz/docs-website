<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">往返次数、批大小与「只限深度等于没限成本」</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">N+1 不是慢，是慢在两个数量级上；而复杂度闸门只认乘积，不认层数</text>
  <text x="30" y="74" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">① 200 条列表 × 每个 item 1 个关联字段：201 次 vs 2 次</text>
  <text x="30" y="100" text-anchor="start" font-size="8.5" fill="#991B1B">朴素</text>
  <rect x="90" y="88" width="560" height="18" rx="3" fill="#FCA5A5" stroke="#DC2626" stroke-width="1"/>
  <text x="660" y="101" text-anchor="start" font-size="8.5" fill="#991B1B">201 次 · 72.35 ms</text>
  <text x="30" y="132" text-anchor="start" font-size="8.5" fill="#047857">DataLoader</text>
  <rect x="90" y="120" width="6" height="18" rx="3" fill="#6EE7B7" stroke="#059669" stroke-width="1"/>
  <text x="104" y="133" text-anchor="start" font-size="8.5" fill="#047857">2 次 · 2.70 ms　—— 相差 100.5 倍，省 96.3%</text>
  <text x="30" y="168" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">② 批大小决定收益上限（同一条 SQL 里放多少个 key）</text>
  <rect x="30" y="180" width="166" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="113.0" y="195.9" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">batch = 10</text>
  <text x="113.0" y="212.7" text-anchor="middle" font-size="7.5" fill="#B45309">21 次往返</text>
  <text x="113.0" y="229.4" text-anchor="middle" font-size="7.5" fill="#B45309">9.6 倍</text>
  <rect x="208" y="180" width="166" height="58" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="291.0" y="195.9" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">batch = 50</text>
  <text x="291.0" y="212.7" text-anchor="middle" font-size="7.5" fill="#0F766E">5 次往返</text>
  <text x="291.0" y="229.4" text-anchor="middle" font-size="7.5" fill="#0F766E">40.2 倍</text>
  <rect x="386" y="180" width="166" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="469.0" y="195.9" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">batch = 100</text>
  <text x="469.0" y="212.7" text-anchor="middle" font-size="7.5" fill="#1D4ED8">3 次往返</text>
  <text x="469.0" y="229.4" text-anchor="middle" font-size="7.5" fill="#1D4ED8">67.0 倍</text>
  <rect x="564" y="180" width="166" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="647.0" y="195.9" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">batch = 500</text>
  <text x="647.0" y="212.7" text-anchor="middle" font-size="7.5" fill="#047857">2 次往返</text>
  <text x="647.0" y="229.4" text-anchor="middle" font-size="7.5" fill="#047857">100.5 倍</text>
  <text x="30" y="268" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">③ 复杂度是「层数 × 每层扇出」的乘积</text>
  <rect x="30" y="280" width="700" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="46" y="300" font-size="8.5" fill="#334155" font-family="Consolas, monospace">cost = 1 + Σ ( child_cost × list_multiplier )   —— list_multiplier 取 first，缺省 10</text>
  <text x="46" y="320" font-size="8.5" fill="#334155" font-family="Consolas, monospace">depth 3 · 每层 first:100 → 2,010,101　|　depth 4 → 201,010,101　|　depth 5 → 20,101,010,101</text>
  <rect x="30" y="344" width="343" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="201.5" y="365.3" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">只限 depth ≤ 8、不限 first</text>
  <text x="201.5" y="382.1" text-anchor="middle" font-size="7.5" fill="#B91C1C">深度 3 的 first:100 已经是 200 万成本</text>
  <rect x="387" y="344" width="343" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="558.5" y="365.3" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">两道闸门分开设</text>
  <text x="558.5" y="382.1" text-anchor="middle" font-size="7.5" fill="#047857">depth 防递归炸栈，cost 防扫库</text>
  <text x="380" y="414" text-anchor="middle" font-size="9.5" fill="#B91C1C">本机读数：depth 3 每层 first:100 展开 1,010,100 个节点、6,000,000 次叶子字段解析</text>
  <defs>
  </defs>
</svg>
