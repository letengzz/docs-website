<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">六类具名类型、四种修饰符与 NonNull 的 null 冒泡</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">GraphQL 的字段默认可空——「补个感叹号」是最常见的自伤</text>
  <text x="30" y="72" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">SDL 只承认这六种具名类型</text>
  <rect x="30" y="84" width="160" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110.0" y="103.3" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">object 对象</text>
  <text x="110.0" y="120.1" text-anchor="middle" font-size="7.5" fill="#1D4ED8">一组字段，最常用</text>
  <rect x="200" y="84" width="160" height="48" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="280.0" y="103.3" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">scalar 标量</text>
  <text x="280.0" y="120.1" text-anchor="middle" font-size="7.5" fill="#047857">Int Float String ID</text>
  <rect x="30" y="140" width="160" height="48" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="110.0" y="159.3" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">enum 枚举</text>
  <text x="110.0" y="176.1" text-anchor="middle" font-size="7.5" fill="#B45309">取值集合，客户端是字符串</text>
  <rect x="200" y="140" width="160" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="280.0" y="159.3" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">interface 接口</text>
  <text x="280.0" y="176.1" text-anchor="middle" font-size="7.5" fill="#6D28D9">被多类型共享的字段</text>
  <rect x="30" y="196" width="160" height="48" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="110.0" y="215.3" text-anchor="middle" font-size="9.5" fill="#9D174D" font-weight="bold">union 联合</text>
  <text x="110.0" y="232.1" text-anchor="middle" font-size="7.5" fill="#BE185D">只共享「是其中之一」</text>
  <rect x="200" y="196" width="160" height="48" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="280.0" y="215.3" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">input 输入对象</text>
  <text x="280.0" y="232.1" text-anchor="middle" font-size="7.5" fill="#0F766E">只能做参数，不能返回</text>
  <text x="400" y="72" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">四种修饰符 = 可空性 × 列表</text>
  <rect x="400" y="84" width="120" height="34" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="106" text-anchor="middle" font-size="11" fill="#1E293B" font-family="Consolas, monospace">T</text>
  <text x="532" y="105" text-anchor="start" font-size="8.5" fill="#334155">可空、单个</text>
  <rect x="400" y="126" width="120" height="34" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="148" text-anchor="middle" font-size="11" fill="#1E293B" font-family="Consolas, monospace">T!</text>
  <text x="532" y="147" text-anchor="start" font-size="8.5" fill="#334155">非空、单个（会被 null 冒泡打穿）</text>
  <rect x="400" y="168" width="120" height="34" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#1E293B" font-family="Consolas, monospace">[T]</text>
  <text x="532" y="189" text-anchor="start" font-size="8.5" fill="#334155">可空列表、元素可空</text>
  <rect x="400" y="210" width="120" height="34" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#1E293B" font-family="Consolas, monospace">[T!]!</text>
  <text x="532" y="231" text-anchor="start" font-size="8.5" fill="#334155">非空列表、元素非空</text>
  <text x="30" y="268" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">NonNull 违约 ⇒ null 向上冒泡：最近的「可空父级」整块变 null</text>
  <rect x="30" y="280" width="160" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="110.0" y="299.9" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">Lesson.durationSec</text>
  <text x="110.0" y="316.7" text-anchor="middle" font-size="7.5" fill="#B91C1C">resolver 返回了 null</text>
  <text x="110.0" y="333.4" text-anchor="middle" font-size="7.5" fill="#B91C1C">但 schema 写的是 Int!</text>
  <rect x="200" y="280" width="160" height="66" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="280.0" y="299.9" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">Lesson 整个对象</text>
  <text x="280.0" y="316.7" text-anchor="middle" font-size="7.5" fill="#B45309">NonNull 无法承载 null</text>
  <text x="280.0" y="333.4" text-anchor="middle" font-size="7.5" fill="#B45309">错误记在 Lesson 这条路径</text>
  <rect x="370" y="280" width="160" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="450.0" y="299.9" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">lessons 列表元素</text>
  <text x="450.0" y="316.7" text-anchor="middle" font-size="7.5" fill="#0F766E">列表元素类型是 [Lesson]</text>
  <text x="450.0" y="333.4" text-anchor="middle" font-size="7.5" fill="#0F766E">可空 → 这一个元素变 null</text>
  <rect x="540" y="280" width="160" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="620.0" y="299.9" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">Course.lessons</text>
  <text x="620.0" y="316.7" text-anchor="middle" font-size="7.5" fill="#6D28D9">若再标成 [Lesson!]!</text>
  <text x="620.0" y="333.4" text-anchor="middle" font-size="7.5" fill="#6D28D9">整张课程页一起 500</text>
  <line x1="190" y1="313" x2="198" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="360" y1="313" x2="368" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <line x1="530" y1="313" x2="538" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw7C3AED)"/>
  <text x="380" y="366" text-anchor="middle" font-size="9" fill="#64748B">兄弟字段不受影响——除非父级也被标成非空；这就是「全标 ! 」的代价</text>
  <text x="380" y="396" text-anchor="middle" font-size="9.5" fill="#B91C1C">本页读数：把 12 个可空字段一次性改成非空后，一次上游抖动让整个课程页返回 null</text>
  <defs>
    <marker id="arw7C3AED" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
