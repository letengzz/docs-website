<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="入职交接的四个断点" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="460" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">交接：账面到位 100%，实际到岗 92.98%</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">从「接了 Offer」到「在系统里有工号」，中间有四个各自能失败的断点</text><rect x="60" y="96" width="180" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="150" y="124" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">接 Offer</text><text x="150" y="158" font-size="22" fill="#059669" font-weight="700" text-anchor="middle">171</text><text x="150" y="180" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">系统里的成功</text><line x1="240" y1="144" x2="270" y2="144" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="270" y="96" width="180" height="96" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="360" y="124" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">背调未清</text><text x="360" y="158" font-size="22" fill="#d97706" font-weight="700" text-anchor="middle">9</text><text x="360" y="180" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">5.26% 被卡住</text><line x1="450" y1="144" x2="480" y2="144" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="480" y="96" width="180" height="96" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1"/><text x="570" y="124" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">未到岗</text><text x="570" y="158" font-size="22" fill="#dc2626" font-weight="700" text-anchor="middle">12</text><text x="570" y="180" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">7.02% 的减法</text><line x1="660" y1="144" x2="690" y2="144" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="690" y="96" width="180" height="96" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="780" y="124" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">实际到岗</text><text x="780" y="158" font-size="22" fill="#059669" font-weight="700" text-anchor="middle">159</text><text x="780" y="180" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">工号已开</text><rect x="40" y="218" width="400" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="246" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">主数据交接的五个必填字段</text><text x="60" y="276" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">1. 工号（由 HR 系统发号，不由招聘生成）</text><text x="60" y="304" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">2. 部门与成本中心（决定费用归到哪里）</text><text x="60" y="332" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">3. 直属上级（决定审批链第一跳）</text><text x="60" y="360" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">4. 入职日（决定社保与薪资起算）</text><text x="60" y="388" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">5. 用工性质（决定合同与试用期）</text><rect x="470" y="218" width="390" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="490" y="246" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">缺字段的三种来源</text><text x="490" y="276" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">① 背调结果没回写，入职单被跳过</text><text x="490" y="302" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">② 一人两份有效 Offer，建了两条任职</text><text x="490" y="328" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">③ Offer 改了入职日，招聘侧没同步</text><text x="490" y="362" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">实测：8.77% 的入职记录缺至少一个字段；</text><text x="490" y="384" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">1.17% 建了两条任职（2 人）</text></svg>