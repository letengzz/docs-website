<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="筛选损耗与误杀" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="460" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">筛选：2,081 条被筛掉的投递</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">抽检 400 条，64 条（16.00%）实际满足硬条件；按此外推，333 条被误杀</text><rect x="40" y="96" width="380" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">2,081 条的去向（抽检 400 条）</text><rect x="60" y="142" width="340" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="72" y="168" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">误杀 64 条 = 16.00%</text><rect x="60" y="190" width="340" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="72" y="216" font-size="12" fill="#059669" font-weight="700" text-anchor="start">确不符合 336 条 = 84.00%</text><text x="60" y="258" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">外推全量：2,081 × 16.00% ≈ 333 条</text><text x="60" y="280" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">按每 100 条误杀 16 条计，一个 3,000 人的</text><text x="60" y="302" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">候选人池会白丢约 480 个可用的人</text><rect x="450" y="96" width="410" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="470" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">误杀的三种来源</text><text x="470" y="152" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">① 同义词：JD 写「K8s」，简历写「Kubernetes」</text><text x="470" y="178" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">② 格式：工作年限写成「3 年 6 个月」</text><text x="470" y="204" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">③ 时间：简历里含「至今」，被当成缺结束时间</text><text x="470" y="236" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">关键词法在本机命中 1,369 条（38.06%），</text><text x="470" y="258" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">结构化解析在抽检 400 份里多命中 76 份（19.00%）。</text><text x="470" y="288" font-size="11" fill="#dc2626" font-weight="400" text-anchor="start">两个数不能相加：关键词命中包含在结构化的候选里。</text><rect x="40" y="346" width="820" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="60" y="372" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">筛掉一条投递的成本是 0，筛错一个人的成本是「他再也不会投第二次」——而这一条不会出现在任何报表里。</text><text x="60" y="394" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">所以「筛掉率」必须配「复核抽样率」一起看：只报前者，等于只报了效率的一半。</text></svg>