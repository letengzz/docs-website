<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="评分者的宽严与排序" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="460" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">评分者宽严：SD 3.14 分就足以改写排序</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">18 位面试官的偏移均值 −0.14 分，极差 12.23 分；校正后 98.66% 的人名次变了</text><rect x="40" y="96" width="400" height="250" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">宽严分布（模拟 18 位面试官）</text><line x1="60" y1="300" x2="420" y2="300" stroke="#cbd5e1" stroke-width="1.2"/><rect x="70" y="149.20000000000002" width="14" height="150.79999999999998" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="89" y="180.4" width="14" height="119.6" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="108" y="198.60000000000002" width="14" height="101.39999999999999" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="127" y="222.0" width="14" height="78.0" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="146" y="237.6" width="14" height="62.4" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="165" y="253.2" width="14" height="46.800000000000004" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="184" y="268.8" width="14" height="31.2" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="203" y="281.8" width="14" height="18.2" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="222" y="294.8" width="14" height="5.2" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="241" y="297.4" width="14" height="2.6" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="260" y="287.0" width="14" height="13.0" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="279" y="276.6" width="14" height="23.400000000000002" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="298" y="258.4" width="14" height="41.6" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="317" y="242.8" width="14" height="57.2" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="336" y="222.0" width="14" height="78.0" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="355" y="201.2" width="14" height="98.8" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="374" y="177.8" width="14" height="122.2" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="393" y="133.6" width="14" height="166.4" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="70" y="330" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">偏严 9 位（负）/ 偏宽 9 位（正），同一份答卷在不同人手里差 12 分</text><rect x="470" y="96" width="390" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="490" y="122" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">不校正的后果</text><text x="490" y="148" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">名次变化 735 / 745 = 98.66%</text><text x="490" y="174" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">及格名单进出 82 人 = 45.05%</text><text x="490" y="196" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">只看 1 位面试官的人占 18.12%</text><rect x="470" y="230" width="390" height="116" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="490" y="256" font-size="12" fill="#059669" font-weight="700" text-anchor="start">能做的三件事</text><text x="490" y="282" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">① 至少 2 位面试官 / 人</text><text x="490" y="304" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">② 汇总前减掉评分者均值</text><text x="490" y="326" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">③ 校准会只对「边界人」开</text><rect x="40" y="372" width="820" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="60" y="398" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">去极值只改变 3.89% 的结论，说明它不是主要矛盾：真正的偏差在「谁评的」，不在「最高最低那两个分」。</text></svg>