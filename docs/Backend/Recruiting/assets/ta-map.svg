<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="专题地图" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="520" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">专题地图：从一条编制，到一条任职记录</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">七段各一页，加上总览、实战与 FAQ</text><rect x="40" y="96" width="190" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><circle cx="70" cy="126" r="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/><text x="70" y="131" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">提</text><text x="92" y="131" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">招聘需求与编制</text><text x="56" y="162" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Requisition</text><text x="56" y="188" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">42 需求 / 171 HC</text><rect x="250" y="96" width="190" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><circle cx="280" cy="126" r="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1"/><text x="280" y="131" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">寻</text><text x="302" y="131" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">渠道、人才库与归因</text><text x="266" y="162" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Sourcing</text><text x="266" y="188" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">6 渠道 / 2,400 人</text><rect x="460" y="96" width="190" height="120" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><circle cx="490" cy="126" r="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/><text x="490" y="131" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="middle">筛</text><text x="512" y="131" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">简历解析与筛选</text><text x="476" y="162" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Screening</text><text x="476" y="188" font-size="10" fill="#7c3aed" font-weight="600" text-anchor="start">2,081 条被筛</text><rect x="670" y="96" width="190" height="120" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><circle cx="700" cy="126" r="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1"/><text x="700" y="131" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="middle">面</text><text x="722" y="131" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">面试排期与日历</text><text x="686" y="162" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Interview</text><text x="686" y="188" font-size="10" fill="#7c3aed" font-weight="600" text-anchor="start">1,543 场</text><rect x="40" y="246" width="190" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><circle cx="70" cy="276" r="14" fill="#f8fafc" stroke="#d97706" stroke-width="1"/><text x="70" y="281" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">评</text><text x="92" y="281" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">评估、评分卡与校准</text><text x="56" y="312" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Evaluation</text><text x="56" y="338" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">18 位面试官</text><rect x="250" y="246" width="190" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><circle cx="280" cy="276" r="14" fill="#f8fafc" stroke="#d97706" stroke-width="1"/><text x="280" y="281" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">签</text><text x="302" y="281" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">Offer 与录用审批</text><text x="266" y="312" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Offer</text><text x="266" y="338" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">238 份 / 71.85%</text><rect x="460" y="246" width="190" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/><circle cx="490" cy="276" r="14" fill="#f8fafc" stroke="#059669" stroke-width="1"/><text x="490" y="281" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">接</text><text x="512" y="281" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">背调与入职交接</text><text x="476" y="312" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Handoff</text><text x="476" y="338" font-size="10" fill="#059669" font-weight="600" text-anchor="start">159 人到岗</text><rect x="40" y="400" width="400" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="60" y="426" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">总览：七段链与三个「同一个人」</text><text x="60" y="448" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">先看这一页，再决定读哪几页</text><rect x="460" y="400" width="400" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="480" y="426" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">实战：10 表 / 4 触发器 / 22 条断言</text><text x="480" y="448" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">能被脚本判定的，才叫设计</text></svg>