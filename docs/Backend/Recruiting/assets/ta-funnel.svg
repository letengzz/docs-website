<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="招聘漏斗与逐段转化" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="520" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">漏斗：3,597 条投递 → 171 人接 Offer</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">每一段的转化率都要带分母，否则「转化率 4.75%」这句话没有意义</text><text x="40" y="108" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">投递</text><rect x="150" y="90" width="640.0" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="800.0" y="110" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">3,597</text><text x="300" y="110" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">100.00%</text><text x="390" y="110" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">3,597 条 / 2,400 人</text><text x="40" y="164" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">过筛</text><rect x="150" y="146" width="269.7358910202947" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="429.7358910202947" y="166" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">1,516</text><text x="300" y="166" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">42.15%</text><text x="390" y="166" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">硬条件 + 结构化匹配</text><text x="40" y="220" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">进面</text><rect x="150" y="202" width="132.55490686683348" height="30" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="292.55490686683345" y="222" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="start">745</text><text x="300" y="222" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">20.71%</text><text x="390" y="222" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">1,543 场面试</text><text x="40" y="276" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">评估通过</text><rect x="150" y="258" width="103.37503475118154" height="30" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="263.37503475118154" y="278" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="start">581</text><text x="300" y="278" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">16.15%</text><text x="390" y="278" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">评分卡 + 校准会</text><text x="40" y="332" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">发 Offer</text><rect x="150" y="314" width="42.34639977759244" height="30" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="202.34639977759244" y="334" font-size="13" fill="#d97706" font-weight="700" text-anchor="start">238</text><text x="300" y="334" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">6.62%</text><text x="390" y="334" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">超发 39.18%</text><text x="40" y="388" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">接 Offer</text><rect x="150" y="370" width="30.42535446205171" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="190.4253544620517" y="390" font-size="13" fill="#059669" font-weight="700" text-anchor="start">171</text><text x="300" y="390" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">4.75%</text><text x="390" y="390" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 71.85%</text><text x="40" y="444" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">实际到岗</text><rect x="150" y="426" width="28.290241868223518" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="188.29024186822352" y="446" font-size="13" fill="#059669" font-weight="700" text-anchor="start">159</text><text x="300" y="446" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">4.42%</text><text x="390" y="446" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">未到岗 7.02%</text><text x="40" y="486" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">段转化：42.15% → 49.14% → 77.99% → 40.96% → 71.85%；「投递→入职 4.75%」这个数在四个不同分母下都成立，但只有写明分母才能比较。</text></svg>