<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="编制水位：HC 与实际到岗" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="520" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">编制水位：171 个 HC，159 个人</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">每一级三条水位线：编制 / 已接 Offer / 实际到岗；差额全部落在最后一步，但损耗率差一倍</text><rect x="80" y="207.0" width="40" height="153.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="132" y="207.0" width="40" height="153.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><rect x="184" y="219.0" width="40" height="141.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="100" y="199.0" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">51</text><text x="152" y="199.0" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">51</text><text x="204" y="211.0" font-size="11" fill="#059669" font-weight="700" text-anchor="middle">47</text><text x="152" y="384" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">L3</text><text x="152" y="404" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">到位 92.2%</text><rect x="280" y="144.0" width="40" height="216.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="332" y="144.0" width="40" height="216.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><rect x="384" y="156.0" width="40" height="204.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="300" y="136.0" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">72</text><text x="352" y="136.0" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">72</text><text x="404" y="148.0" font-size="11" fill="#059669" font-weight="700" text-anchor="middle">68</text><text x="352" y="384" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">L4</text><text x="352" y="404" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">到位 94.4%</text><rect x="480" y="252.0" width="40" height="108.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="532" y="252.0" width="40" height="108.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><rect x="584" y="264.0" width="40" height="96.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="500" y="244.0" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">36</text><text x="552" y="244.0" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">36</text><text x="604" y="256.0" font-size="11" fill="#059669" font-weight="700" text-anchor="middle">32</text><text x="552" y="384" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">L5</text><text x="552" y="404" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">到位 88.9%</text><rect x="680" y="324.0" width="40" height="36.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><rect x="732" y="324.0" width="40" height="36.0" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><rect x="784" y="324.0" width="40" height="36.0" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="700" y="316.0" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">12</text><text x="752" y="316.0" font-size="11" fill="#d97706" font-weight="700" text-anchor="middle">12</text><text x="804" y="316.0" font-size="11" fill="#059669" font-weight="700" text-anchor="middle">12</text><text x="752" y="384" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">L6</text><text x="752" y="404" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">到位 100.0%</text><line x1="60" y1="360" x2="860" y2="360" stroke="#cbd5e1" stroke-width="1.2"/><text x="60" y="424" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">蓝 = HC（编制）　橙 = 已接 Offer　绿 = 实际到岗</text><rect x="40" y="436" width="820" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="60" y="462" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start">缺口全部在「接了 Offer → 真正到岗」这一步，但损耗率差一倍：L5 11.1%、L3 7.8%、L4 5.6%、L6 0。</text><text x="60" y="486" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">同一条链、同一个环节、三种原因（资深岗多有竞品、管理岗承诺更稳），平均成 7.02% 之后谁也不用改。</text></svg>