<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="三个同一个人" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="440" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">三个「同一个人」：3,597 / 2,400 / 164</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">同一批人，在三个口径下是三个数；混用就会算出三种「入职人数」</text><rect x="40" y="96" width="240" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="160" y="126" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">投递条数</text><text x="160" y="166" font-size="26" fill="#2563eb" font-weight="700" text-anchor="middle">3,597</text><text x="160" y="196" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">一条记录 = 一次投递</text><rect x="330" y="96" width="240" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/><text x="450" y="126" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">去重候选人</text><text x="450" y="166" font-size="26" fill="#7c3aed" font-weight="700" text-anchor="middle">2,400</text><text x="450" y="196" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">按人合并后的档案</text><rect x="620" y="96" width="240" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="740" y="126" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">入职人数</text><text x="740" y="166" font-size="26" fill="#059669" font-weight="700" text-anchor="middle">164</text><text x="740" y="196" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">按人去重后的实际入职</text><line x1="280" y1="156" x2="330" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="570" y1="156" x2="620" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="246" width="820" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="274" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">三条口径各自成立，但只能在各自的报表里用：</text><text x="60" y="300" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">投递条数用来算渠道效率；候选人数用来算人才库规模；入职人数用来算 Headcount。混用一次，就多算 7 个人（4.09%）。</text><rect x="40" y="344" width="820" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="60" y="370" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">重复的形状：38.83% 的人投过不止一次，32.17% 的人跨过渠道。</text><text x="60" y="392" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">「同一个人」不是靠姓名判的，是靠手机号/邮箱/证件三键归一后的一次合并决定——合并错了，后面每一步都在算错人。</text></svg>