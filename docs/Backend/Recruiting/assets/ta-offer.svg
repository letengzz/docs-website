<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Offer 超发与接受率" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="420" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">Offer：超发倍数只由接受率决定</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 71.85% → 想要 171 人到岗，就要发 238 份；多发的那 67 份不是浪费，是价格</text><rect x="40" y="96" width="400" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">超发倍数 = 1 / 接受率 − 1</text><text x="70" y="162" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 80%</text><rect x="180" y="146" width="110" height="26" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="190" y="164" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">+25.00%</text><text x="70" y="196" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 72%</text><rect x="180" y="180" width="171" height="26" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="190" y="198" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">+38.89%</text><text x="70" y="230" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 70%</text><rect x="180" y="214" width="188" height="26" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="190" y="232" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">+42.86%</text><text x="70" y="264" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">接受率 60%</text><rect x="180" y="248" width="293" height="26" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="190" y="266" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">+66.67%</text><rect x="470" y="96" width="390" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="490" y="122" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">本机：238 / 171 → 超发 39.18%</text><text x="490" y="150" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">接受 171、拒绝 67，接受率 71.85%</text><text x="490" y="172" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">被撤回（接了但没坑）6 份 = 2.52%</text><rect x="470" y="208" width="390" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="490" y="234" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">超发的代价不在钱，在人</text><text x="490" y="260" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">撤回一份已接受的 Offer，等于把一个人</text><text x="490" y="282" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">从「已入职」改回「再找工作」</text><rect x="40" y="312" width="820" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="60" y="338" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">带宽校验：238 份里有 27 份（11.34%）报价落在级别带宽外——超上限 14、破下限 13。</text><text x="60" y="360" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">超上限要特批，破下限会在半年内被内部公平性追平；两者都不该由「填表的人」当场决定。</text></svg>