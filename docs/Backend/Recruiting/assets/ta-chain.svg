<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="招聘七段链与失败是否安静" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="660" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">七段链：每一段都有自己的「成功定义」</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">业务方看到的是「招到人了」，系统看到的是七个各自能失败的判定</text><rect x="40" y="86" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="116" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="121" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">1</text><text x="100" y="112" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">提</text><text x="122" y="133" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">编制、级别、薪酬带宽</text><rect x="596" y="103" width="72" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632.0" y="121" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="146" x2="310" y2="160" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="160" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="190" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="195" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">2</text><text x="100" y="186" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">寻</text><text x="122" y="207" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">渠道、人才库、归因</text><rect x="596" y="177" width="72" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632.0" y="195" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="220" x2="310" y2="234" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="234" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="264" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="269" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">3</text><text x="100" y="260" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">筛</text><text x="122" y="281" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">解析、硬条件、误杀</text><rect x="596" y="251" width="72" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632.0" y="269" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="294" x2="310" y2="308" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="308" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="338" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="343" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">4</text><text x="100" y="334" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">面</text><text x="122" y="355" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">排期、日历、取消</text><rect x="596" y="325" width="72" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="632.0" y="343" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">显性</text><line x1="310" y1="368" x2="310" y2="382" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="382" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="412" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="417" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">5</text><text x="100" y="408" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">评</text><text x="122" y="429" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">评分卡、宽严、校准</text><rect x="596" y="399" width="72" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632.0" y="417" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><line x1="310" y1="442" x2="310" y2="456" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="456" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="486" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="491" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">6</text><text x="100" y="482" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">签</text><text x="122" y="503" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">超发、带宽、失效</text><rect x="596" y="473" width="72" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="632.0" y="491" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">显性</text><line x1="310" y1="516" x2="310" y2="530" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="40" y="530" width="540" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><circle cx="72" cy="560" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="72" y="565" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">7</text><text x="100" y="556" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">接</text><text x="122" y="577" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">背调、爽约、交接</text><rect x="596" y="547" width="72" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="632.0" y="565" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">安静</text><rect x="690" y="86" width="180" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="780" y="114" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">五段安静的失败</text><text x="780" y="140" font-size="13" fill="#dc2626" font-weight="600" text-anchor="middle">提 / 寻 / 筛 / 评 / 接</text><text x="780" y="168" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">不报错，只留一个偏差</text><text x="780" y="190" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">偏差按批次累加</text><text x="780" y="212" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">在季度报表上才显形</text><text x="780" y="236" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">届时已难追溯到人</text><rect x="690" y="274" width="180" height="168" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="780" y="302" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">两段显性的失败</text><text x="780" y="328" font-size="13" fill="#059669" font-weight="600" text-anchor="middle">面 / 签</text><text x="780" y="356" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">当场就有人喊停</text><text x="780" y="378" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">但「停得对不对」</text><text x="780" y="400" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">是另一个问题：</text><text x="780" y="424" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">排期冲突会被人绕过去</text><rect x="40" y="604" width="830" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="60" y="634" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">七段的共同形状：系统返回了一个「合法」的结果，但那个结果不成立——直到第 2 周面试，才发现第 1 周的需求根本没人批。</text></svg>