<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="面试排期的交集概率" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="440" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">排期：需要 3 个人同时有空</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">单场面试的可行概率 = 每位面试官空闲率的乘积；这张表决定「为什么排一场要一天」</text><rect x="40" y="96" width="470" height="250" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">面试官数 k × 单人空闲率 p → 单时段命中率</text><text x="70" y="152" font-size="12" fill="#64748b" font-weight="600" text-anchor="start">p = 0.35</text><rect x="70" y="166" width="130" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="135" y="188" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">k=2</text><text x="135" y="210" font-size="15" fill="#d97706" font-weight="700" text-anchor="middle">12.25%</text><text x="135" y="228" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">期望试 8.2 次</text><rect x="215" y="166" width="130" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="280" y="188" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">k=3</text><text x="280" y="210" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">4.29%</text><text x="280" y="228" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">期望试 23.3 次</text><rect x="360" y="166" width="130" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="425" y="188" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">k=4</text><text x="425" y="210" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">1.50%</text><text x="425" y="228" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">期望试 66.6 次</text><text x="70" y="268" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">20 个候选时段里，k=3 仍有 41.63% 的概率一个都不成</text><text x="70" y="292" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">k=4 时升到 73.90% —— 终面面板越大，越不是「多问几句」</text><text x="70" y="316" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">而是「多一个必须同时有空的人」</text><rect x="530" y="96" width="330" height="250" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="550" y="124" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">负载为什么会集中</text><text x="550" y="152" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">谁有空就排谁 → 偏好资深面试官</text><rect x="550" y="166" width="290" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="570" y="188" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">最忙 20% 承担 52.30% 的场次</text><text x="570" y="210" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">最忙 / 最闲 = 8.96×</text><text x="550" y="248" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">实测（随机指派）：最忙 20% 25.15%</text><text x="550" y="270" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">均匀应为 22.2%，CV 10.2%</text><text x="550" y="296" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">两者差别在于「指派规则」：</text><text x="550" y="318" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">随机 → 略偏；按资历 → 严重偏斜</text></svg>