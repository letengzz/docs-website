<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="实战的十张表" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="540" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">实战的十张表：一条投递走完七段</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">每条边都是一次「可以写错」的机会；四张表上有触发器把不变量钉住</text><rect x="40" y="96" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="122" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">requisition</text><text x="60" y="144" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">编制 / 级别 / 带宽 / 状态</text><rect x="40" y="186" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="212" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">candidate</text><text x="60" y="234" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">人才库：三键归一后的一个人</text><rect x="40" y="276" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="302" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">application</text><text x="60" y="324" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">人 × 岗位 × 渠道（部分唯一）</text><rect x="330" y="276" width="240" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="350" y="302" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">screening</text><text x="350" y="324" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">结构化字段 + 判定 + 理由</text><rect x="610" y="276" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="630" y="302" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">interview_round</text><text x="630" y="324" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">轮次 / 面试官 / 时段（唯一）</text><rect x="610" y="186" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="630" y="212" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">score</text><text x="630" y="234" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">逐维度 / 逐面试官 / 原始分</text><rect x="610" y="96" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="630" y="122" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">offer</text><text x="630" y="144" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">版本 / 报价 / 状态机</text><rect x="330" y="96" width="240" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="350" y="122" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">approval</text><text x="350" y="144" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">审批节点 / 结论 / 时点</text><rect x="330" y="396" width="530" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="350" y="422" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">onboarding（入职单）</text><text x="350" y="444" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">入职日 / 背调结论 / 工号 / 部门 / 上级</text><rect x="40" y="396" width="250" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="422" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">background_check</text><text x="60" y="444" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">项目 / 状态 / 结论 / 有效期</text><line x1="165" y1="170" x2="165" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="165" y1="260" x2="165" y2="276" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="290" y1="313" x2="330" y2="313" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="570" y1="313" x2="610" y2="313" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="735" y1="276" x2="735" y2="260" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="735" y1="186" x2="735" y2="170" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="610" y1="133" x2="570" y2="133" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="450" y1="170" x2="450" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 165 350 L 165 396" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 290 433 L 330 433" fill="none" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#ah)"/><text x="40" y="500" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">触发器把四条「不许」钉在库上：同人同岗重复报名、进度（分数）不得改写、一份作答只判一次、未过背调不许建入职单。</text></svg>