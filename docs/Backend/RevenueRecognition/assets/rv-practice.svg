<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="实战：本机跑通一条「合同 → 收入」闭环">
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">实战：本机跑通一条「合同 → 收入」闭环</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">SQLite 九张表 + 十步流水 + 三个必须失败的反向用例</text>
<rect x="20" y="84" width="900" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="111.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">① 建库建表（9 张） → ② 灌合同与义务 → ③ 算交易价格 → ④ 分摊并闭合 → ⑤ 生成排期</text>
<rect x="20" y="146" width="900" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="173.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 按月确认（幂等写入） → ⑦ 结转成本 → ⑧ 变更追补 → ⑨ 出三张表 → ⑩ 断言六条不变式</text>
<rect x="20" y="222" width="288" height="92" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="700">负向 1</text>
<text x="36" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">同一期间确认两次</text>
<text x="36" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">唯一键必须拦下</text>
<rect x="325" y="222" width="288" height="92" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="341" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="700">负向 2</text>
<text x="341" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">分摊合计 ≠ 合同额</text>
<text x="341" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">断言必须报错</text>
<rect x="630" y="222" width="288" height="92" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="646" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="700">负向 3</text>
<text x="646" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">变更后不追补</text>
<text x="646" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">累计对比必须不等</text>
<text x="20" y="342" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">正向十条命令都能跑通不算通过；三个负向用例里有一个「没报错」，才说明守卫真的没了</text>
<line x1="20" y1="360" x2="920" y2="360" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="20" y="384" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">本机读数（Python 3.13.12 + SQLite 3.50.4，种子 20261031）：</text>
<text x="20" y="404" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">10 万行确认明细：逐行 139.6 ms / executemany 79.0 ms（1.77×）；按月聚合 37.2 ms</text>
<text x="20" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">无唯一键重跑 3 次 = 600 行 / 60,000 元；有唯一键 = 200 行 / 20,000 元（正好一次）</text>
</svg>
