<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-label="月结七步：把明细账压成三张披露表">
<rect x="0" y="0" width="940" height="460" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">月结七步：把明细账压成三张披露表</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">披露不是「把数字抄到附注」，而是证明「每个数都能追到一条明细」</text>
<rect x="20" y="84" width="116" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="78.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">锁账期</text>
<line x1="136" y1="110" x2="148" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="150" y="84" width="116" height="52" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="208.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">确认收入</text>
<line x1="266" y1="110" x2="278" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="280" y="84" width="116" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="338.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">结转成本</text>
<line x1="396" y1="110" x2="408" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="410" y="84" width="116" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="468.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">对余额</text>
<line x1="526" y1="110" x2="538" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="540" y="84" width="116" height="52" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="598.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">出分解表</text>
<line x1="656" y1="110" x2="668" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="670" y="84" width="116" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="728.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">写附注</text>
<line x1="786" y1="110" x2="798" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="800" y="84" width="116" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="858.0" y="114.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">留痕归档</text>
<rect x="20" y="176" width="288" height="86" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">收入分解表</text>
<text x="36" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">按产品 / 地区 / 时点，三向合计必须相等</text>
<rect x="325" y="176" width="288" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="341" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">合同余额表</text>
<text x="341" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">合同资产、合同负债的期初 + 本期 − 期末</text>
<rect x="630" y="176" width="288" height="86" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="646" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">剩余履约义务</text>
<text x="646" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">RPO：已分摊未确认的部分</text>
<line x1="20" y1="286" x2="920" y2="286" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="20" y="310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">本机读数：按标签表 join 后合计虚增 50.37%（22,539,179.36 → 33,891,186.10）</text>
<text x="20" y="330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">   —— 一条收入被打上两个标签，就在分解表里被数了两次；先去重再加总，差 0.00</text>
<text x="20" y="352" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">RPO 两口径：按合同总额 420,000 vs 按已分摊未确认 345,000，差 75,000（约束与未开始部分）</text>
<text x="20" y="374" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">月结切点：<'2026-02-01' 与 <='2026-01-31' 相差 164,521.32 —— 1 月 31 日当天 654 条整天丢失</text>
<text x="20" y="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">所以账期字段一律存「期间」而不是「时间戳边界」；边界比较只在报表层出现一次</text>
<text x="20" y="428" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">每一步都要留下可重跑的证据：期间号、批次号、行数、金额合计、执行人</text>
</svg>
