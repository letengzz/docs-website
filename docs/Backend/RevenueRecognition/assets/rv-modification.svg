<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="合同变更：三种处理，三条收入曲线">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">合同变更：三种处理，三条收入曲线</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">选错分支不会报错，只会让此后每一期都差一个固定金额</text>
<rect x="370" y="76" width="200" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="103.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">变更请求</text>
<line x1="470" y1="122" x2="470" y2="144" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="146" width="340" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470.0" y="178.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">新增的商品可明确区分吗</text>
<line x1="300" y1="174" x2="190" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="160" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">否</text>
<line x1="640" y1="174" x2="750" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="700" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">是</text>
<rect x="40" y="212" width="300" height="62" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="190.0" y="239.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">累计追补（cumulative catch-up）</text>
<text x="190.0" y="257.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">视同原合同的一部分</text>
<rect x="600" y="212" width="300" height="62" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="750.0" y="247.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">再判：按单独售价定价吗</text>
<line x1="660" y1="274" x2="620" y2="306" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="600" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">是</text>
<line x1="840" y1="274" x2="880" y2="306" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="872" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">否</text>
<rect x="470" y="308" width="300" height="62" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="620.0" y="335.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">单独合同</text>
<text x="620.0" y="353.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">新价按新合同摊</text>
<rect x="790" y="308" width="130" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="855.0" y="335.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">终止并新建</text>
<text x="855.0" y="353.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">剩余重算</text>
<line x1="20" y1="388" x2="920" y2="388" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="20" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">本机读数（原 12 月 12 万，第 7 月加 6 个月、追加对价 4 万 / 单独售价 6 万）：</text>
<text x="20" y="432" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">第 7 月单月：① 16,666.67 / ② 8,333.33 / ③ 8,888.89；三法总额都是 160,000.00</text>
<text x="20" y="452" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">累计追补还要额外做一笔 −6,666.67 的冲回 —— 这一笔最容易被漏掉</text>
</svg>
