<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="可变对价：估计值要先被「约束」砍一刀">
<rect x="0" y="0" width="940" height="430" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">可变对价：估计值要先被「约束」砍一刀</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">期望值给的是平均数，准则要的是「极可能不会大额转回」的那个数</text>
<rect x="20" y="86" width="900" height="24" rx="12" fill="#e2e8f0"/>
<rect x="20" y="86" width="620" height="24" rx="12" fill="#bbf7d0"/>
<text x="30" y="103" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#14532d" text-anchor="start" font-weight="600">约束区间：可计入交易价格的部分</text>
<text x="650" y="103" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start" font-weight="400">超出部分：只能等不确定性消除</text>
<line x1="640" y1="80" x2="640" y2="122" stroke="#0f766e" stroke-width="2"/>
<text x="640" y="74" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">上限</text>
<line x1="20" y1="80" x2="20" y2="122" stroke="#0f766e" stroke-width="2"/>
<text x="20" y="74" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">下限</text>
<line x1="180" y1="126" x2="180" y2="146" stroke="#1d4ed8" stroke-width="2"/>
<text x="180" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">期望值</text>
<text x="180" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">37,500</text>
<line x1="420" y1="126" x2="420" y2="146" stroke="#b45309" stroke-width="2"/>
<text x="420" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">最可能金额</text>
<text x="420" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">0</text>
<line x1="640" y1="126" x2="640" y2="146" stroke="#0f766e" stroke-width="2"/>
<text x="640" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">约束后上限</text>
<text x="640" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">22,500</text>
<text x="20" y="216" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">100 万合同、四档返利（0/5%/10%/15%，概率 50/30/15/5）：期望值 3.75% = 37,500 元</text>
<text x="20" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">最可能金额法取概率最大的一档 = 0 元；两者差 37,500，接近合同额的 4%</text>
<line x1="20" y1="258" x2="920" y2="258" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect x="20" y="276" width="288" height="76" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="164.0" y="310.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">退货权</text>
<text x="164.0" y="328.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">退款负债 + 应收退货成本</text>
<rect x="326" y="276" width="288" height="76" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="310.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">返利与罚款</text>
<text x="470.0" y="328.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">按最可能金额或期望值</text>
<rect x="632" y="276" width="288" height="76" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="776.0" y="310.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">重大融资成分</text>
<text x="776.0" y="328.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">> 12 个月要折现</text>
<text x="20" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">本机读数：估计退货率 5%、实际 7.3% → 计提缺口 115,000 元（占销售额 2.30%）</text>
<text x="20" y="402" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">24 期 × 12,000 折现 6%：融资成分 17,245.61 元（5.99%）；12 个月临界处只差 381.07 元</text>
</svg>
