<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-label="五步法：每一步都要落成一张表或一个字段">
<rect x="0" y="0" width="940" height="500" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">五步法：每一步都要落成一张表或一个字段</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">「按准则做」不是判据；「这一步的产物是哪一列」才是</text>
<rect x="20" y="84" width="300" height="66" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="38" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">① 识别合同</text>
<text x="38" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">五要件全部满足才建合同</text>
<line x1="322" y1="117" x2="352" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="354" y="84" width="330" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="372" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
<text x="372" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">contract / 五要件布尔列</text>
<rect x="20" y="162" width="300" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">② 识别义务</text>
<text x="38" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">可明确区分 + 一系列实质相同</text>
<line x1="322" y1="195" x2="352" y2="195" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="354" y="162" width="330" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="372" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
<text x="372" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">performance_obligation</text>
<rect x="20" y="240" width="300" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="38" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">③ 确定价格</text>
<text x="38" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">固定 + 可变 − 约束 + 融资成分</text>
<line x1="322" y1="273" x2="352" y2="273" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="354" y="240" width="330" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="372" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
<text x="372" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">transaction_price 快照</text>
<rect x="20" y="318" width="300" height="66" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="38" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">④ 分摊价格</text>
<text x="38" y="366" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">相对单独售价，闭合到分</text>
<line x1="322" y1="351" x2="352" y2="351" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="354" y="318" width="330" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="372" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
<text x="372" y="366" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">po_allocation（带余数）</text>
<rect x="20" y="396" width="300" height="66" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="38" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">⑤ 确认收入</text>
<text x="38" y="444" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" text-anchor="start" font-weight="400">时段按进度、时点按控制权</text>
<line x1="322" y1="429" x2="352" y2="429" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="354" y="396" width="330" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="372" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">产物</text>
<text x="372" y="444" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">rev_schedule / rev_entry</text>
<text x="20" y="482" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">五步全部发生在「收入还没发生」的时候：①~④ 错了，第 ⑤ 步一定是错得整整齐齐</text>
</svg>
