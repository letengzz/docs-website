<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-label="专题地图：五段确认链与十页">
<rect x="0" y="0" width="940" height="468" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">专题地图：五段确认链与十页</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">上一排是链上的五段，下一排是支撑它们的九组内容</text>
<rect x="20" y="88" width="160" height="66" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="100.0" y="117.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 识别合同</text>
<text x="100.0" y="135.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">五要件 / 合并</text>
<line x1="180" y1="121" x2="203" y2="121" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="205" y="88" width="160" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="285.0" y="117.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 识别义务</text>
<text x="285.0" y="135.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">可明确区分</text>
<line x1="365" y1="121" x2="388" y2="121" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="390" y="88" width="160" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470.0" y="117.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 确定价格</text>
<text x="470.0" y="135.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">可变 / 融资成分</text>
<line x1="550" y1="121" x2="573" y2="121" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="575" y="88" width="160" height="66" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="655.0" y="117.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 分摊价格</text>
<text x="655.0" y="135.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">单独售价 / 舍入</text>
<line x1="735" y1="121" x2="758" y2="121" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="760" y="88" width="160" height="66" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="840.0" y="117.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 确认收入</text>
<text x="840.0" y="135.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">时段 / 时点</text>
<text x="20" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">只有 ⑤ 会进利润表；① 到 ④ 全部发生在「收入还没有发生」的时候，所以它们的错都只能事后发现</text>
<line x1="20" y1="196" x2="920" y2="196" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect x="20" y="220" width="82" height="58" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="61" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">总览</text>
<text x="61" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVO</text>
<rect x="112" y="220" width="82" height="58" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="153" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">五步法</text>
<text x="153" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVF</text>
<rect x="204" y="220" width="82" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="245" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">时段时点</text>
<text x="245" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVT</text>
<rect x="296" y="220" width="82" height="58" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="337" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">合同余额</text>
<text x="337" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVB</text>
<rect x="388" y="220" width="82" height="58" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="429" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">可变对价</text>
<text x="429" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVV</text>
<rect x="480" y="220" width="82" height="58" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="521" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">变更退款</text>
<text x="521" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVM</text>
<rect x="572" y="220" width="82" height="58" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="613" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">分摊</text>
<text x="613" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVA</text>
<rect x="664" y="220" width="82" height="58" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="705" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">披露月结</text>
<text x="705" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVD</text>
<rect x="756" y="220" width="82" height="58" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="797" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">实战</text>
<text x="797" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVX</text>
<rect x="848" y="220" width="82" height="58" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="889" y="246" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="600">FAQ</text>
<text x="889" y="265" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RVQ</text>
<text x="20" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">每一页对应一族 8 条判据：看什么现象、判成什么、不满足时改哪里</text>
<rect x="20" y="330" width="288" height="108" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="164.0" y="380.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 时点判错</text>
<text x="164.0" y="398.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">收入整体平移一个期间</text>
<rect x="326" y="330" width="288" height="108" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="380.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 分摊不闭合</text>
<text x="470.0" y="398.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">明细加起来 ≠ 合同额</text>
<rect x="632" y="330" width="288" height="108" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="776.0" y="380.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 变更不追补</text>
<text x="776.0" y="398.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">后续每期都错，且越错越远</text>
</svg>
