<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="时段还是时点：三个条件决定走哪条路">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">时段还是时点：三个条件决定走哪条路</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">先判「是否随时间转移控制权」，再选「怎么量进度」</text>
<rect x="370" y="76" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="104.5" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">履约义务</text>
<line x1="470" y1="124" x2="470" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="250" y="148" width="440" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="470" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">三个条件满足任意一个 → 时段</text>
<text x="470" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">① 边干边受益  ② 在建商品归客户控制  ③ 不可替代 + 已收款</text>
<line x1="400" y1="218" x2="240" y2="250" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="540" y1="218" x2="700" y2="250" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="252" width="330" height="74" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="225.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">时段法：按进度确认</text>
<text x="225.0" y="303.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">投入法 / 产出法 / 时间法</text>
<rect x="550" y="252" width="330" height="74" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="715.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">时点法：按控制权转移</text>
<text x="715.0" y="303.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">五指标：现时收款权 / 法定所有权</text>
<text x="550" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">五指标另三项：实物转移 / 主要风险报酬 / 客户已接受</text>
<text x="60" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">进度要能可靠计量；不能可靠计量时按已发生成本确认（不确认毛利）</text>
<line x1="20" y1="386" x2="920" y2="386" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="20" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">本机读数：同一项目第 6 月末，产出法 840,000 / 投入法 1,220,000 / 时间法 1,000,000</text>
<text x="20" y="432" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">最大差 380,000 元，占合同额 19.00% —— 三法都合规，差别只在「用哪个刻度」</text>
<text x="20" y="452" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">所以口径必须在合同层写死并存快照，不能在月结时临时选一个</text>
</svg>
