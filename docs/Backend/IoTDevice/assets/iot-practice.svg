<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="十条命令串起七段链（本机可复跑）">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">十条命令串起七段链（本机可复跑）</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">验收标准不是「跑通了」，而是八个负向用例全部按预期失败</text>
<rect x="30" y="88" width="158" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="109.0" y="126.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">1. 注册</text>
<rect x="208" y="88" width="158" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="287.0" y="126.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">2. 鉴权</text>
<rect x="386" y="88" width="158" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="465.0" y="126.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">3. 上报</text>
<rect x="564" y="88" width="158" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="643.0" y="126.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">4. 去重</text>
<rect x="742" y="88" width="158" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="821.0" y="126.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">5. 改期望</text>
<rect x="30" y="184" width="158" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="109.0" y="222.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">6. 离线改</text>
<rect x="208" y="184" width="158" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="287.0" y="222.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">7. 下发</text>
<rect x="386" y="184" width="158" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="465.0" y="222.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">8. 超时</text>
<rect x="564" y="184" width="158" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="643.0" y="222.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">9. 升级</text>
<rect x="742" y="184" width="158" height="66" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="821.0" y="222.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">10. 退役</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="188" y1="121" x2="206" y2="121" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="366" y1="121" x2="384" y2="121" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="544" y1="121" x2="562" y2="121" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="722" y1="121" x2="740" y2="121" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="810" y1="154" x2="860" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="860" y1="154" x2="860" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="860" y1="184" x2="810" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="188" y1="217" x2="206" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="366" y1="217" x2="384" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="544" y1="217" x2="562" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="722" y1="217" x2="740" y2="217" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="300" width="880" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="322.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">N1 错密码 · N2 同 client_id · N3 订阅 cmd/# · N4 重发同 id · N5 同 seq · N6 离线改 3 次 · N7 断电 · N8 退役再连</text>
<text x="470" y="368" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">六条验收 SQL 全为 0 才算跑通：跨设备指令 / 卡住 SENT / seq 缺口 / 重复行 / 影子版本 / 升级滞留</text>
<text x="470" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">环境：Mosquitto 2.1.x + SQLite 3.40+ + paho-mqtt 2.1，全部本地，不依赖云服务</text>
<text x="470" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">跑不通通常不是代码问题，而是忘了 persistence / 忘了 reload 密码文件 / 开了 allow_anonymous</text>
</svg>
