<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="连接生命周期：会话比连接活得久">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">连接生命周期：会话比连接活得久</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">断线不等于离线——离线消息、遗嘱与抢占都发生在「连接已断」之后</text>
<rect x="30" y="100" width="190" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="125.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">CONNECT</text>
<text x="125.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">clean_start=false</text>
<rect x="250" y="100" width="190" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="345.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">会话建立</text>
<text x="345.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">expiry=86400</text>
<rect x="470" y="100" width="190" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="565.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">在线（心跳）</text>
<text x="565.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0.8 × KeepAlive</text>
<rect x="690" y="100" width="220" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="800.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">TCP 断开</text>
<text x="800.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">会话仍存活</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="220" y1="135" x2="248" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="440" y1="135" x2="468" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="660" y1="135" x2="688" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="250" y="220" width="190" height="70" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="345.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">排队消息</text>
<text x="345.0" y="269.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">QoS≥1 且已订阅</text>
<rect x="470" y="220" width="190" height="70" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="565.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">遗嘱延迟</text>
<text x="565.0" y="269.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">30 s 内重连则不触发</text>
<rect x="690" y="220" width="220" height="70" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="800.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">会话过期</text>
<text x="800.0" y="269.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">消息丢弃、订阅清空</text>
<line x1="880" y1="170" x2="880" y2="218" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="688" y1="255" x2="662" y2="255" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="468" y1="255" x2="442" y2="255" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="30" y="330" width="880" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="355.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">最常见的误配：clean_start=false + session_expiry=0 —— 看起来保留了会话，实际断开即销毁</text>
<text x="470" y="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">「设备离线 30 分钟、每 5 s 一条指令」= 360 条要缓存；expiry=0 时这 360 条在 Broker 侧全部丢弃</text>
<text x="470" y="426" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">所以离线队列必须建在平台侧（库表），不能指望 Broker 会话</text>
</svg>
