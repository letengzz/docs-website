<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="影子：一份意图 + 一份事实 + 一个版本号">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">影子：一份意图 + 一份事实 + 一个版本号</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">desired 与 reported 分开写，delta 是算出来的，不是存下来的</text>
<rect x="60" y="90" width="240" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="180.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">desired（意图）</text>
<text x="180.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">App / 规则 / 运维写</text>
<rect x="60" y="230" width="240" height="90" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="180.0" y="271.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">reported（事实）</text>
<text x="180.0" y="289.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">设备上报，只写这一态</text>
<rect x="400" y="160" width="170" height="90" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="485.0" y="201.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">delta</text>
<text x="485.0" y="219.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">读时计算</text>
<rect x="650" y="90" width="230" height="90" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="765.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">version</text>
<text x="765.0" y="149.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">任何一态变更 +1</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="300" y1="135" x2="398" y2="195" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="300" y1="275" x2="398" y2="215" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="570" y1="190" x2="648" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="650" y="230" width="230" height="90" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="765.0" y="271.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">并发丢更新 75%</text>
<text x="765.0" y="289.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">整档覆盖：20 写只留 5</text>
<line x1="765" y1="180" x2="765" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="60" y="356" width="820" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="378.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">修法只有一条：UPDATE ... WHERE version=?；rowcount=0 就重读重算，最多 3 次后返回 409</text>
<text x="470" y="416" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">收敛判据不是「推成功了」，而是 delta 变成空——所以要落 converge_latency 与 converge_fail_rate</text>
<text x="470" y="440" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">离线设备上线只推最终态（delta 天然如此），不重放 20 次历史修改</text>
</svg>
