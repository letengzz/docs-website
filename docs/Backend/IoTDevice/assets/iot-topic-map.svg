<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="专题地图：接入 · 控制 · 治理">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">专题地图：接入 · 控制 · 治理</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">九页分工——一页只回答一个问题，跨页只靠判据编号引用</text>
<rect x="30" y="86" width="240" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="150" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">接入（身份→会话→数据）</text>
<rect x="50" y="128" width="200" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="150.0" y="157.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">设备身份</text>
<rect x="50" y="190" width="200" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="150.0" y="219.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">连接与会话</text>
<rect x="50" y="252" width="200" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="150.0" y="281.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">遥测接入</text>
<rect x="50" y="314" width="200" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="150.0" y="343.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">设备影子</text>
<rect x="350" y="86" width="240" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="470" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">控制（意图→执行→升级）</text>
<rect x="370" y="128" width="200" height="48" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="157.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">指令下发</text>
<rect x="370" y="190" width="200" height="48" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="470.0" y="219.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">固件升级</text>
<rect x="370" y="252" width="200" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="470.0" y="281.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">实战</text>
<rect x="670" y="86" width="240" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="790" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">治理（口径→分诊）</text>
<rect x="690" y="128" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="790.0" y="157.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">总览七段链</text>
<rect x="690" y="190" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="790.0" y="219.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">常见问题</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="270" y1="240" x2="348" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="590" y1="240" x2="668" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="470" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">接入段回答「这个数据是谁的」；控制段回答「这条命令做了几次」；治理段回答「这个在线率算得对不对」</text>
<text x="470" y="436" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">读的顺序建议：总览 → 身份 → 会话 → 影子 → 指令 → OTA → 遥测 → 实战 → 分诊</text>
</svg>
