<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="七段链：五段的失败是安静的">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段链：五段的失败是安静的</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">设备不会报错，它只是不再说话了——所以每段都要有一份「可对账的证据」</text>
<rect x="30" y="90" width="200" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 注册</text>
<text x="130.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">三元组入库</text>
<rect x="254" y="90" width="200" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="354.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 接入</text>
<text x="354.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CONNACK 0</text>
<rect x="478" y="90" width="200" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="578.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 鉴权</text>
<text x="578.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">证/密钥通过</text>
<rect x="702" y="90" width="200" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="802.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 上报</text>
<text x="802.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">落库一行</text>
<rect x="30" y="200" width="200" height="74" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="130.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 指令</text>
<text x="130.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">收到业务 ACK</text>
<rect x="254" y="200" width="200" height="74" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="354.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 升级</text>
<text x="354.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">新版本上报</text>
<rect x="478" y="200" width="200" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="578.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑦ 退役</text>
<text x="578.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">凭证失效</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="230" y1="127" x2="250" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="454" y1="127" x2="474" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="678" y1="127" x2="698" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="832" y1="170" x2="832" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="130" y1="274" x2="130" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="300" width="880" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="322.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">安静的五段：注册、上报、指令、退役（以及半个接入）——只能靠对账发现，不会自己告警</text>
<text x="470" y="366" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">每段都有自己的成功定义：产线=烧对了 / 平台=记上了 / 设备=做了 / 业务=生效了</text>
<text x="470" y="392" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">四份证据：secret_fp · session_id · (device_id,seq) · command_id</text>
<text x="470" y="418" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">任何一段只有「成功」而没有「证据」，这一段就已经在丢了</text>
</svg>
