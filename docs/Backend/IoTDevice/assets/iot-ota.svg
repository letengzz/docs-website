<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="固件升级：让失败的设备还能自己回来">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">固件升级：让失败的设备还能自己回来</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">签名 → 灰度 → 断点下载 → A/B 刷写 → 版本收敛</text>
<rect x="30" y="90" width="206" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="133.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 签名清单</text>
<text x="133.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Ed25519 + sha256</text>
<rect x="256" y="90" width="206" height="74" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="359.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 灰度 1%</text>
<text x="359.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">观察 2 h</text>
<rect x="482" y="90" width="206" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="585.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 分片下载</text>
<text x="585.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">断点续传</text>
<rect x="708" y="90" width="206" height="74" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="811.0" y="123.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ A/B 刷写</text>
<text x="811.0" y="141.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">3 次启动失败回滚</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="236" y1="127" x2="254" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="462" y1="127" x2="480" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="688" y1="127" x2="706" y2="127" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="880" y="127" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#64748b" text-anchor="middle" font-weight="400">→</text>
<rect x="30" y="200" width="430" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="245.0" y="231.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">slot A（运行中）</text>
<text x="245.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">confirmed</text>
<rect x="30" y="290" width="430" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="245.0" y="321.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">slot B（新固件）</text>
<text x="245.0" y="339.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">写入后置 boot 标志</text>
<rect x="500" y="200" width="410" height="70" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="705.0" y="231.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">启动成功 + health=ok</text>
<text x="705.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">→ 标记 confirmed</text>
<rect x="500" y="290" width="410" height="70" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="705.0" y="321.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">3 次未喂狗 → 回滚 A</text>
<text x="705.0" y="339.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">不依赖网络</text>
<line x1="245" y1="270" x2="245" y2="288" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="460" y1="325" x2="498" y2="325" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="460" y1="235" x2="498" y2="235" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="384" width="880" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="406.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">2% 坏固件下：全量直推 200 台变砖；灰度 1% + A/B 最坏 2 台</text>
<text x="470" y="444" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">「下载完成」不是终态；confirmed 必须由「新固件跑起来并连上平台」触发</text>
</svg>
