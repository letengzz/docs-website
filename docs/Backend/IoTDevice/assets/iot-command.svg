<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="指令状态机：三个终态，一个必须存在的超时">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">指令状态机：三个终态，一个必须存在的超时</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">PUBACK 只证明 Broker 收到了，不证明设备做了</text>
<rect x="30" y="100" width="160" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="110.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">CREATED</text>
<text x="110.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">API 受理</text>
<rect x="230" y="100" width="160" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="310.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">QUEUED</text>
<text x="310.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">离线入队</text>
<rect x="430" y="100" width="160" height="66" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="510.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">SENT</text>
<text x="510.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">已 publish</text>
<rect x="630" y="100" width="160" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="710.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">ACKED</text>
<text x="710.0" y="147.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">设备回执收到</text>
<rect x="630" y="220" width="160" height="66" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="710.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">SUCCEEDED</text>
<text x="710.0" y="267.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">执行成功 + 结果</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker></defs>
<line x1="190" y1="133" x2="228" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="390" y1="133" x2="428" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="590" y1="133" x2="628" y2="133" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="710" y1="166" x2="710" y2="218" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="430" y="220" width="160" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="510.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">FAILED</text>
<text x="510.0" y="267.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">失败 + 原因码</text>
<rect x="230" y="220" width="160" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="310.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">TIMEOUT</text>
<text x="310.0" y="267.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">超过 expires_at</text>
<rect x="30" y="220" width="160" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="110.0" y="249.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">UNKNOWN</text>
<text x="110.0" y="267.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">发了但没回执</text>
<line x1="430" y1="133" x2="390" y2="220" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="430" y1="133" x2="310" y2="220" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="230" y1="253" x2="192" y2="253" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="30" y="330" width="880" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="470.0" y="352.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">TIMEOUT 与 UNKNOWN 必须分开：前者重发就行，后者要去现场查设备</text>
<text x="470" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">幂等两层：平台 (device_id, seq) 唯一键防重复入队；设备 16 槽环形窗防 Broker 重投</text>
<text x="470" y="422" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">重试只换 seq，不换 command_id —— 换了就等于一条新指令，开门会开两次</text>
</svg>
