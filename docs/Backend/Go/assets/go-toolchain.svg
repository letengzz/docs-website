<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Go 工具链与日常工作流</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="150" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="105" y="96" fill="#0e7490" font-weight="bold" font-size="14">go mod init</text>
    <text x="105" y="116" fill="#4b5563" font-size="11">初始化模块</text>
    <text x="105" y="133" fill="#4b5563" font-size="11">生成 go.mod</text>
    <rect x="200" y="70" width="150" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="275" y="96" fill="#0e7490" font-weight="bold" font-size="14">go get</text>
    <text x="275" y="116" fill="#4b5563" font-size="11">添加/升级依赖</text>
    <text x="275" y="133" fill="#4b5563" font-size="11">写入 require</text>
    <rect x="370" y="70" width="150" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="445" y="96" fill="#4338ca" font-weight="bold" font-size="14">go build</text>
    <text x="445" y="116" fill="#4b5563" font-size="11">编译产出二进制</text>
    <text x="445" y="133" fill="#4b5563" font-size="11">或静态库</text>
    <rect x="540" y="70" width="150" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="615" y="96" fill="#047857" font-weight="bold" font-size="14">go test</text>
    <text x="615" y="116" fill="#4b5563" font-size="11">运行 _test.go</text>
    <text x="615" y="133" fill="#4b5563" font-size="11">竞态检测 -race</text>
    <rect x="710" y="70" width="140" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="780" y="96" fill="#b45309" font-weight="bold" font-size="14">go run</text>
    <text x="780" y="116" fill="#4b5563" font-size="11">编译并执行</text>
    <text x="780" y="133" fill="#4b5563" font-size="11">开发期快捷命令</text>
    <path d="M 180 115 L 198 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 350 115 L 368 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 520 115 L 538 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 690 115 L 708 115" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="220" width="220" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="246" fill="#334155" font-weight="bold" font-size="14">辅助命令</text>
    <text x="140" y="266" fill="#4b5563" font-size="11">go fmt / gofmt 统一格式</text>
    <text x="140" y="283" fill="#4b5563" font-size="11">go vet 静态检查</text>
    <text x="140" y="300" fill="#4b5563" font-size="11">go fix 迁移废弃 API</text>
    <text x="140" y="317" fill="#4b5563" font-size="11">go doc 查看文档</text>
    <rect x="280" y="220" width="260" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="410" y="246" fill="#6d28d9" font-weight="bold" font-size="14">环境与缓存</text>
    <text x="410" y="266" fill="#4b5563" font-size="11">GOPATH 用户的包目录</text>
    <text x="410" y="283" fill="#4b5563" font-size="11">GOMODCACHE 模块缓存</text>
    <text x="410" y="300" fill="#4b5563" font-size="11">GOBIN 可执行文件目录</text>
    <text x="410" y="317" fill="#4b5563" font-size="11">GOOS / GOARCH 交叉编译</text>
    <rect x="570" y="220" width="280" height="120" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="710" y="246" fill="#0f766e" font-weight="bold" font-size="14">文件布局</text>
    <text x="710" y="266" fill="#4b5563" font-size="11">go.mod 模块声明与依赖</text>
    <text x="710" y="283" fill="#4b5563" font-size="11">go.sum 依赖校验和</text>
    <text x="710" y="300" fill="#4b5563" font-size="11">go.work 多模块工作区</text>
    <text x="710" y="317" fill="#4b5563" font-size="11">vendor/ 依赖内置（可选）</text>
</g>
  <text x="440" y="384" text-anchor="middle" font-size="13" fill="#475569">一条命令一个职责：Go 把「依赖、编译、测试、格式化、检查」全部收进 go 子命令，无需额外脚手架</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
