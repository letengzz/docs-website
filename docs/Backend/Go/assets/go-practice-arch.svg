<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">实战：短链服务分层架构</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="60" width="150" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="105" y="86" fill="#0e7490" font-weight="bold" font-size="14">HTTP 层</text>
    <text x="105" y="106" fill="#4b5563" font-size="11">POST /links</text>
    <text x="105" y="123" fill="#4b5563" font-size="11">GET /:code</text>
    <rect x="210" y="60" width="170" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="295" y="86" fill="#4338ca" font-weight="bold" font-size="14">服务层</text>
    <text x="295" y="106" fill="#4b5563" font-size="11">生成短码</text>
    <text x="295" y="123" fill="#4b5563" font-size="11">校验与限流</text>
    <rect x="410" y="60" width="170" height="90" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="495" y="86" fill="#6d28d9" font-weight="bold" font-size="14">存储层</text>
    <text x="495" y="106" fill="#4b5563" font-size="11">repository 接口</text>
    <text x="495" y="123" fill="#4b5563" font-size="11">SQL 实现</text>
    <rect x="610" y="60" width="120" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="670" y="86" fill="#047857" font-weight="bold" font-size="14">MySQL</text>
    <text x="670" y="106" fill="#4b5563" font-size="11">长链映射表</text>
    <rect x="760" y="60" width="90" height="90" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="805" y="86" fill="#be123c" font-weight="bold" font-size="14">Redis</text>
    <text x="805" y="106" fill="#4b5563" font-size="11">热点缓存</text>
    <path d="M 180 105 L 208 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 380 105 L 408 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 580 105 L 608 105" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 700 105 L 758 105" stroke="#475569" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <rect x="30" y="200" width="250" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="155" y="226" fill="#b45309" font-weight="bold" font-size="14">关键设计点</text>
    <text x="155" y="246" fill="#4b5563" font-size="11">短码用 base62(自增ID) 或随机 + 冲突重试</text>
    <text x="155" y="263" fill="#4b5563" font-size="11">读多写少：先查缓存再回源</text>
    <text x="155" y="280" fill="#4b5563" font-size="11">重定向用 302 便于统计点击</text>
    <rect x="300" y="200" width="270" height="130" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="435" y="226" fill="#0f766e" font-weight="bold" font-size="14">接口抽象与测试</text>
    <text x="435" y="246" fill="#4b5563" font-size="11">repository 定义接口，SQL 实现可替换</text>
    <text x="435" y="263" fill="#4b5563" font-size="11">服务层用 httptest + 内存实现做单测</text>
    <text x="435" y="280" fill="#4b5563" font-size="11">go test -race 检测并发问题</text>
    <rect x="590" y="200" width="260" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="720" y="226" fill="#334155" font-weight="bold" font-size="14">可观测与交付</text>
    <text x="720" y="246" fill="#4b5563" font-size="11">结构化日志（log/slog）</text>
    <text x="720" y="263" fill="#4b5563" font-size="11">请求指标与耗时直方图</text>
    <text x="720" y="280" fill="#4b5563" font-size="11">单二进制 + 容器多阶段构建</text>
    <rect x="30" y="355" width="820" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="381" fill="#047857" font-weight="bold" font-size="13">验证方式：go test ./... 通过 → go run . 启动 → curl 创建短链并重定向成功 → go build 产出单文件二进制</text>
</g>
  <text x="440" y="434" text-anchor="middle" font-size="13" fill="#475569">分层的目的不是「好看」，而是让存储与传输可替换、让业务逻辑能被单测覆盖</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
