<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">泛型：类型参数与约束</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="260" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="160" y="96" fill="#6d28d9" font-weight="bold" font-size="14">声明带类型参数的函数</text>
    <text x="160" y="116" fill="#4b5563" font-size="11">func Map[T any, U any](s []T,</text>
    <text x="160" y="133" fill="#4b5563" font-size="11">  f func(T) U) []U</text>
    <rect x="320" y="70" width="250" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="445" y="96" fill="#4338ca" font-weight="bold" font-size="14">约束（constraint）</text>
    <text x="445" y="116" fill="#4b5563" font-size="11">type Number interface {</text>
    <text x="445" y="133" fill="#4b5563" font-size="11">  ~int | ~int64 | ~float64</text>
    <text x="445" y="150" fill="#4b5563" font-size="11">}</text>
    <rect x="600" y="70" width="250" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="725" y="96" fill="#047857" font-weight="bold" font-size="14">实例化与类型推断</text>
    <text x="725" y="116" fill="#4b5563" font-size="11">Map(names, len)  // 自动推断</text>
    <text x="725" y="133" fill="#4b5563" font-size="11">Map[string, int](...)  // 显式</text>
    <path d="M 290 135 L 318 135" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 570 135 L 598 135" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="240" width="260" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="266" fill="#b45309" font-weight="bold" font-size="14">~ 波浪号的含义</text>
    <text x="160" y="286" fill="#4b5563" font-size="11">~int 表示「底层类型是 int」的自定义类型也满足</text>
    <text x="160" y="303" fill="#4b5563" font-size="11">例：type UserID int 也满足 ~int</text>
    <text x="160" y="320" fill="#4b5563" font-size="11">不加 ~ 时只有 int 本身满足</text>
    <rect x="320" y="240" width="250" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="445" y="266" fill="#0e7490" font-weight="bold" font-size="14">1.26 的变化</text>
    <text x="445" y="286" fill="#4b5563" font-size="11">类型参数的约束可以引用泛型类型自身</text>
    <text x="445" y="303" fill="#4b5563" font-size="11">递归约束表达力更强</text>
    <text x="445" y="320" fill="#4b5563" font-size="11">内置 new 支持 new(表达式)</text>
    <rect x="600" y="240" width="250" height="120" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="725" y="266" fill="#be123c" font-weight="bold" font-size="14">什么时候不用泛型</text>
    <text x="725" y="286" fill="#4b5563" font-size="11">逻辑只对一种类型有意义</text>
    <text x="725" y="303" fill="#4b5563" font-size="11">用 interface{} + 类型断言更清晰</text>
    <text x="725" y="320" fill="#4b5563" font-size="11">能用切片/映射等内置能力解决就不必抽象</text>
</g>
  <text x="440" y="382" text-anchor="middle" font-size="13" fill="#475569">泛型解决「同一份逻辑、多种类型」，但 Go 更鼓励先写具体类型，重复到第三次再抽象</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
