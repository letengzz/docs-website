<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="410" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">错误处理：error 是值，panic 是异常出口</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="70" width="170" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="115" y="96" fill="#0e7490" font-weight="bold" font-size="14">返回 error</text>
    <text x="115" y="116" fill="#4b5563" font-size="11">data, err := f()</text>
    <text x="115" y="133" fill="#4b5563" font-size="11">if err != nil</text>
    <rect x="230" y="70" width="170" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="315" y="96" fill="#4338ca" font-weight="bold" font-size="14">包装上下文</text>
    <text x="315" y="116" fill="#4b5563" font-size="11">fmt.Errorf("%w")</text>
    <text x="315" y="133" fill="#4b5563" font-size="11">保留错误链</text>
    <rect x="430" y="70" width="170" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="515" y="96" fill="#047857" font-weight="bold" font-size="14">判定类型</text>
    <text x="515" y="116" fill="#4b5563" font-size="11">errors.Is / As</text>
    <text x="515" y="133" fill="#4b5563" font-size="11">哨兵错误</text>
    <rect x="630" y="70" width="220" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="740" y="96" fill="#b45309" font-weight="bold" font-size="14">交给上层</text>
    <text x="740" y="116" fill="#4b5563" font-size="11">不打印两次</text>
    <text x="740" y="133" fill="#4b5563" font-size="11">统一在边界记录</text>
    <path d="M 200 120 L 228 120" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 400 120 L 428 120" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 600 120 L 628 120" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <rect x="30" y="220" width="260" height="140" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="246" fill="#be123c" font-weight="bold" font-size="14">panic / recover</text>
    <text x="160" y="266" fill="#4b5563" font-size="11">panic 只用于「程序不可继续」的严重错误</text>
    <text x="160" y="283" fill="#4b5563" font-size="11">recover 只在 defer 中有效</text>
    <text x="160" y="300" fill="#4b5563" font-size="11">能 recover ≠ 应该 recover：库代码不要吞掉 panic</text>
    <rect x="330" y="220" width="250" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="455" y="246" fill="#6d28d9" font-weight="bold" font-size="14">常见错误写法</text>
    <text x="455" y="266" fill="#4b5563" font-size="11">_ = doSomething() 忽略错误</text>
    <text x="455" y="283" fill="#4b5563" font-size="11">if err != nil { log.Fatal() } 在库里直接退出</text>
    <text x="455" y="300" fill="#4b5563" font-size="11">重复包装导致错误信息噪音</text>
    <text x="455" y="317" fill="#4b5563" font-size="11">用 err.Error() 做字符串比较</text>
    <rect x="620" y="220" width="230" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="735" y="246" fill="#334155" font-weight="bold" font-size="14">推荐的检查节奏</text>
    <text x="735" y="266" fill="#4b5563" font-size="11">每层加自己的上下文</text>
    <text x="735" y="283" fill="#4b5563" font-size="11">最外层统一转换为响应/日志</text>
    <text x="735" y="300" fill="#4b5563" font-size="11">对可重试错误标注语义</text>
</g>
  <text x="440" y="392" text-anchor="middle" font-size="13" fill="#475569">Go 的哲学：错误是控制流的一部分，必须显式处理；panic 是留给「程序员写错了」的</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
