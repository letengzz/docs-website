<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-label="OCPP 一次充电的消息时序">
<rect width="680" height="372" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#64748b"/></marker></defs>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">一次充电的消息时序：谁先说、谁必须回</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">左列是消息名，箭头方向 = 请求方向（实线请求、虚线应答）</text>
<text x="24" y="60" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">左列：消息名</text>
<text x="176" y="60" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">箭头：充电桩 ⇄ 运营平台</text>
<text x="442" y="60" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">右列：这条消息真正决定的事</text>
<text x="168" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">BootNotification</text>
<path d="M176 88 L430 88" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 96 L176 96" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">桩开机报型号与固件</text>
<text x="168" y="126" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">Heartbeat</text>
<path d="M176 122 L430 122" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 130 L176 130" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="126" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">300 s 一次，占消息 34.5%</text>
<text x="168" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">Authorize</text>
<path d="M176 156 L430 156" fill="none" stroke="#0d9488" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 164 L176 164" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">卡号 / 即插即充 MAC</text>
<text x="168" y="194" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">StartTransaction</text>
<path d="M176 190 L430 190" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 198 L176 198" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="194" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">Platform 回事务号 = idem_key</text>
<text x="168" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">MeterValues</text>
<path d="M176 224 L430 224" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 232 L176 232" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">15 s 一次，约 190 条/单</text>
<text x="168" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">StopTransaction</text>
<path d="M176 258 L430 258" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M430 266 L176 266" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">桩报结束，平台补末段</text>
<text x="168" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#0f172a" text-anchor="end" font-weight="700">StatusNotification</text>
<path d="M176 292 L430 292" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<path d="M430 300 L176 300" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="3 3"/>
<text x="442" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="400">拔枪事件，多数桩不发</text>
<rect x="24" y="320" width="632" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="342" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">缺 StatusNotification → 平台不知道车何时拔枪 → 占位费漏收 42.8%</text>
</svg>
