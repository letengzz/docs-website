<text x="370" y="78" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">80% 以上降功率：恒流段结束</text>
<path d="M370 84 L370 105.0" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="70" y="262" width="120" height="50" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="130" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">上报间隔 5 s</text>
<text x="130" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">−0.94%</text>
<text x="130" y="308" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">7,013 kWh</text>
