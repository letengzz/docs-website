<text x="262" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">15 s（本机默认）</text>
<text x="262" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">−1.32%</text>
<text x="262" y="308" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">9,819 kWh</text>
<rect x="334" y="262" width="120" height="50" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="394" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">30 s</text>
<text x="394" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">−1.88%</text>
<text x="394" y="308" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">14,027 kWh</text>
<rect x="466" y="262" width="120" height="50" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="526" y="280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">60 s</text>
<text x="526" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">−3.01%</text>
<text x="526" y="308" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">22,443 kWh</text>
<text x="24" y="332" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">结论：积分只能用来做看板与趋势，不能用来结算——它的误差与上报间隔成正比，且永远偏小。</text>
