<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="资金流：车主付一笔，四方各拿一份">
<rect width="680" height="330" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#64748b"/></marker></defs>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">资金流：车主付一笔，四方各拿一份</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">电费是代收代付、服务费才是收入；分成按合同口径，不按流水口径</text>
<rect x="24" y="76" width="148" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="98" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">车主</text>
<text x="98" y="120" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">付 167.52 元</text>
<rect x="212" y="76" width="148" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="286" y="100" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">平台</text>
<text x="286" y="120" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">代收 + 佣金 3%</text>
<path d="M172 108 L212 108" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M360 108 L400 108" fill="none" stroke="#64748b" stroke-width="1.4"/>
<path d="M400 108 L400 200" fill="none" stroke="#64748b" stroke-width="1.4"/>
<path d="M400 200 L120 200 L120 208" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="208" width="192" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
<text x="120" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">电网</text>
<text x="120" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">按关口表 767,355.4 kWh</text>
<text x="120" y="261" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">含站用电与线损</text>
<path d="M400 200 L336 200 L336 208" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="240" y="208" width="192" height="62" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="336" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">场地方</text>
<text x="336" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">服务费 25% + 占位费 10%</text>
<text x="336" y="261" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">94,098 元/两月</text>
<path d="M400 200 L552 200 L552 208" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="456" y="208" width="192" height="62" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="552" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">运营商</text>
<text x="552" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">余下全部</text>
<text x="552" y="261" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">自担空驶与故障</text>
<rect x="24" y="284" width="632" height="34" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">电费项毛利 −2.88%：代收代付必然亏，亏的正是站用电与线损那 21,905 度</text>
</svg>
