<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img" aria-label="三个「充了多少度」与三个「该收多少」">
<rect width="680" height="372" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">三个「充了多少度」与三个「该收多少」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">同一批 20,254 单，每列的三个数各有各的合法来源，谁也不能替谁</text>
<rect x="24" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="68" width="200" height="34" rx="10" fill="#f8fafc" stroke="none" stroke-width="1"/>
<rect x="24" y="68" width="200" height="3" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="124" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">充了多少度</text>
<text x="38" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">枪端电表</text>
<text x="38" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">745,450.0 kWh</text>
<text x="210" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">计费依据</text>
<path d="M38 148 L210 148" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="38" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">平台积分</text>
<text x="38" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">735,988.4 kWh</text>
<text x="210" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">看板依据 −1.27%</text>
<path d="M38 206 L210 206" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="38" y="234" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">站总表</text>
<text x="38" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">767,355.4 kWh</text>
<text x="210" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">电网结算 +2.94%</text>
<rect x="240" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="240" y="68" width="200" height="34" rx="10" fill="#f8fafc" stroke="none" stroke-width="1"/>
<rect x="240" y="68" width="200" height="3" rx="1.5" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="340" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">该收多少</text>
<text x="254" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">电费</text>
<text x="254" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">501,502.18 元</text>
<text x="426" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">分时目录价</text>
<path d="M254 148 L426 148" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="254" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">服务费</text>
<text x="254" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">372,889.28 元</text>
<text x="426" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">合同单价</text>
<path d="M254 206 L426 206" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="254" y="234" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">占位费</text>
<text x="254" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">8,761.12 元</text>
<text x="426" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">超时 30 min 起</text>
<rect x="456" y="68" width="200" height="214" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="456" y="68" width="200" height="34" rx="10" fill="#f8fafc" stroke="none" stroke-width="1"/>
<rect x="456" y="68" width="200" height="3" rx="1.5" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="556" y="91" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">这根枪能不能用</text>
<text x="470" y="118" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">在线率</text>
<text x="470" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">99.71%</text>
<text x="642" y="137" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">有心跳</text>
<path d="M470 148 L642 148" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="470" y="176" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">可用率</text>
<text x="470" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">97.70%</text>
<text x="642" y="195" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">能启充</text>
<path d="M470 206 L642 206" fill="none" stroke="#eef2f7" stroke-width="1"/>
<text x="470" y="234" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">计费正确率</text>
<text x="470" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">95.68%</text>
<text x="642" y="253" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="end" font-weight="400">金额对得上</text>
<rect x="24" y="294" width="632" height="46" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="314" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">电网按「站总表」收你钱，你按「积分」收车主钱：中间 31,367 度 = 2.0 万元 / 两月</text>
<text x="340" y="332" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">而「在线 99.71% → 可用 97.70% → 计费正确 95.68%」这两段落差，就是沉默的那部分成本</text>
<text x="24" y="364" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">三个口径都存、都展示、差异单独成表——这不是冗余，是唯一能让争议可裁决的做法。</text>
</svg>
