<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="站—桩—枪三级与功率共享的临界点">
<rect width="680" height="330" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#64748b"/></marker></defs>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">站—桩—枪三级，与功率共享的临界点</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">标称功率是单枪的，分配功率是站的；两者在第 5 辆车到来时分道扬镳</text>
<rect x="24" y="70" width="200" height="96" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<rect x="24" y="70" width="200" height="3" rx="1.5" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="38" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">站 station</text>
<text x="38" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">容量 480 kW</text>
<text x="38" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">场地方 OWN01 · 分成 25%</text>
<text x="38" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">站用电与线损都记在站上</text>
<rect x="256" y="70" width="140" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="270" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">桩 charger</text>
<text x="270" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">一体式 DC / 交流 AC</text>
<text x="270" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">额定 120 kW</text>
<text x="270" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">固件版本决定消息面</text>
<rect x="428" y="70" width="228" height="96" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="442" y="94" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">枪 connector</text>
<text x="442" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">一把枪一只电表（meter_no 唯一）</text>
<text x="442" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">会话挂在枪上，不挂在桩上</text>
<text x="442" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">枪是计量的最小单位</text>
<path d="M224 118 L256 118" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M396 118 L428 118" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="24" y="196" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">同一站 8 把 120 kW 枪，站容量 480 kW：</text>
<rect x="24" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="72" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">1 车同充</text>
<text x="72" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">120 kW/枪</text>
<text x="72" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">21 min  +0%</text>
<rect x="132" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="180" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">2 车同充</text>
<text x="180" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">120 kW/枪</text>
<text x="180" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">21 min  +0%</text>
<rect x="240" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="288" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">4 车同充</text>
<text x="288" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">120 kW/枪</text>
<text x="288" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">21 min  +0%</text>
<rect x="348" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="396" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">5 车同充</text>
<text x="396" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">96 kW/枪</text>
<text x="396" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">26 min  +24%</text>
<rect x="456" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="504" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">6 车同充</text>
<text x="504" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">80 kW/枪</text>
<text x="504" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">31 min  +48%</text>
<rect x="564" y="210" width="96" height="62" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="612" y="228" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">8 车同充</text>
<text x="612" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">60 kW/枪</text>
<text x="612" y="264" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">41 min  +95%</text>
<text x="24" y="292" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">第 5 辆车到场的那一刻，前 4 辆车的功率同时下降——「标称 120 kW」在站点层面从来不成立。</text>
<text x="24" y="312" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">所以「预计 xx 分钟充满」必须由站内实时分配算，不能由单枪铭牌算。</text>
</svg>
