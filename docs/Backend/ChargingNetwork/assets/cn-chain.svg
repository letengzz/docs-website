<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-label="充电七段链：四段的失败是安静的">
<rect width="680" height="316" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#64748b"/></marker></defs>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">充电七段链：四段的失败是安静的</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">从选站选址到月度分成，每一段各产出一个数；四个数错了也不会报错</text>
<rect x="24" y="72" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="72" width="148" height="3" rx="1.5" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="36" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">① 建</text>
<text x="36" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">站址与桩资产</text>
<text x="36" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">station / connector</text>
<text x="36" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">安静失败</text>
<path d="M172 116 L184 116" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="184" y="72" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="184" y="72" width="148" height="3" rx="1.5" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="196" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">② 接</text>
<text x="196" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">接入与协议</text>
<text x="196" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">OCPP 握手</text>
<text x="196" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">安静失败</text>
<path d="M332 116 L344 116" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="344" y="72" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="344" y="72" width="148" height="3" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="356" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">③ 启</text>
<text x="356" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">启充与鉴权</text>
<text x="356" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">authorize</text>
<text x="356" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="start" font-weight="700">显性失败</text>
<path d="M492 116 L504 116" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="504" y="72" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="504" y="72" width="148" height="3" rx="1.5" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="516" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">④ 充</text>
<text x="516" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">充电与计量</text>
<text x="516" y="134" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">meter / sampled</text>
<text x="516" y="150" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">安静失败</text>
<rect x="24" y="176" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="176" width="148" height="3" rx="1.5" fill="#dc2626" stroke="none" stroke-width="1"/>
<text x="36" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">⑤ 计</text>
<text x="36" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">分时与账单</text>
<text x="36" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">fee_line</text>
<text x="36" y="254" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">安静失败</text>
<rect x="184" y="176" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="184" y="176" width="148" height="3" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="196" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">⑥ 结</text>
<text x="196" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">结算与分成</text>
<text x="196" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">settlement_batch</text>
<text x="196" y="254" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="start" font-weight="700">显性失败</text>
<rect x="344" y="176" width="148" height="88" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="344" y="176" width="148" height="3" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="356" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">⑦ 维</text>
<text x="356" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">运维与可用率</text>
<text x="356" y="238" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">在线/可用/正确率</text>
<text x="356" y="254" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#16a34a" text-anchor="start" font-weight="700">显性失败</text>
<rect x="24" y="176" width="468" height="88" rx="10" fill="none" stroke="#dbe3ef" stroke-width="1" stroke-dasharray="5 3"/>
<text x="258" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">⑦ 维放在第二行：它不是链条末端，而是每天都跑一遍的背景</text>
<text x="24" y="296" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">四段「安静失败」的共同形态：车充上了、钱也收了，只有「到底充了多少度」没人能自证。</text>
</svg>
