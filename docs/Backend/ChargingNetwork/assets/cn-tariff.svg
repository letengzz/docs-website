<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" role="img" aria-label="24 小时分时段与一单跨时段的拆分">
<rect width="680" height="404" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">24 小时分时带：一单跨两个时段怎么拆</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">分时表是「分钟偏移的集合」，不是「几点的字符串」——跨零点时后者会整段负掉</text>
<rect x="60.0" y="92" width="173.83333333333334" height="34" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="1"/>
<text x="146.91666666666669" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">谷 0.32</text>
<rect x="233.83333333333334" y="92" width="74.5" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="271.08333333333337" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">平 0.65</text>
<rect x="308.33333333333337" y="92" width="24.833333333333332" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<rect x="333.16666666666663" y="92" width="24.833333333333332" height="34" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<rect x="358.0" y="92" width="298.0" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="507.0" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">平 0.65</text>
<path d="M308.3 86 L308.3 78 L358.0 78 L358.0 86" fill="none" stroke="#d97706" stroke-width="1.2"/>
<text x="333.1666666666667" y="72" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">峰 1.00 / 尖 1.20（10–12 时）</text>
<path d="M60.0 126 L60.0 132" fill="none" stroke="#475569" stroke-width="1"/>
<text x="60.0" y="144" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">00:00</text>
<path d="M233.8 126 L233.8 132" fill="none" stroke="#475569" stroke-width="1"/>
<text x="233.83333333333334" y="144" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">07:00</text>
<path d="M308.3 126 L308.3 132" fill="none" stroke="#475569" stroke-width="1"/>
<text x="308.33333333333337" y="144" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">10:00</text>
<path d="M358.0 126 L358.0 132" fill="none" stroke="#475569" stroke-width="1"/>
<text x="358.0" y="144" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">12:00</text>
<path d="M656.0 126 L656.0 132" fill="none" stroke="#475569" stroke-width="1"/>
<text x="656.0" y="144" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">24:00</text>
<rect x="24" y="162" width="632" height="96" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="40" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">放大 09:42 → 10:26（44 分钟，41.20 kWh）</text>
<rect x="48" y="194" width="238.9090909090909" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<rect x="286.9090909090909" y="194" width="345.09090909090907" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="167.45454545454544" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">平 0.65</text>
<text x="167.45454545454544" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="middle" font-weight="400">18 min · 16.85 kWh</text>
<text x="459.4545454545454" y="212" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">峰 1.00</text>
<text x="459.4545454545454" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="middle" font-weight="400">26 min · 24.35 kWh</text>
<text x="48" y="252" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="400">09:42</text>
<text x="286.9090909090909" y="252" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="400">10:00</text>
<text x="632" y="252" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="400">10:26</text>
<text x="40" y="284" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">正确：按分钟拆</text>
<text x="40" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">平 16.85×0.65 = 10.96 + 峰 24.35×1.00 = 24.35</text>
<text x="40" y="322" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">合计电费 35.30 元</text>
<text x="372" y="284" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">错误：整单套一个价</text>
<text x="372" y="304" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">按开始（平）41.20×0.65 = 26.78　−24.2%</text>
<text x="372" y="322" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="400">按结束（峰）41.20×1.00 = 41.20　+16.7%</text>
<rect x="24" y="336" width="632" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="358" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">总量上两种错误互相抵消（+0.02%），单笔上最大偏 49.2%、12.4% 的单偏超 10%</text>
<text x="24" y="392" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">所以「平均差 0.02%」这个数字毫无意义——账单是按单笔出的，不是按总量出的。</text>
</svg>
