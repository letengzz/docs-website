<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="四条启充路径与各自的失败形态">
<rect width="680" height="320" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">四条启充路径：谁证明「这枪该给他用」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">四条路径的鉴权强度不同，失败时的后果也完全不同</text>
<rect x="24" y="68" width="300" height="96" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="68" width="3" height="96" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="40" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">扫码启充</text>
<text x="308" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="end" font-weight="400">占 62%</text>
<text x="40" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">App 下单 → 平台下发 RemoteStart</text>
<text x="40" y="138" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">失败形态</text>
<text x="40" y="154" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="400">桩不在线就启不了</text>
<rect x="340" y="68" width="300" height="96" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="340" y="68" width="3" height="96" rx="1.5" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="356" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">刷卡启充</text>
<text x="624" y="92" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="end" font-weight="400">占 21%</text>
<text x="356" y="114" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">本地白名单 / 离线钱包</text>
<text x="356" y="138" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">失败形态</text>
<text x="356" y="154" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="400">离线也能充，但余额靠桩自算</text>
<rect x="24" y="176" width="300" height="96" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="176" width="3" height="96" rx="1.5" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="40" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">即插即充</text>
<text x="308" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="end" font-weight="400">占 14%</text>
<text x="40" y="222" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">车桩握手 MAC / ISO 15118</text>
<text x="40" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">失败形态</text>
<text x="40" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="400">最省事，但换车要重绑</text>
<rect x="340" y="176" width="300" height="96" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="340" y="176" width="3" height="96" rx="1.5" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="356" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">预约锁枪</text>
<text x="624" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="end" font-weight="400">占 3%</text>
<text x="356" y="222" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">预约单占位 → 到点自动启充</text>
<text x="356" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="700">失败形态</text>
<text x="356" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="400">过期不解锁会白占一天</text>
<text x="24" y="292" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">四条路径共用同一条硬约束：一把枪同一时刻只能有一个活动会话（见实战 `trg_one_active_session`）。</text>
<text x="24" y="311" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">鉴权决定「能不能充」，约束决定「会不会重复计费」——两者不能互相替代。</text>
</svg>
