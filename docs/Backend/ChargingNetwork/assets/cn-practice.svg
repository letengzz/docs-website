<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="680" height="336" role="img" aria-label="十张表、四个触发器、十五条断言">
<rect width="680" height="336" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">十张表、四个触发器、十五条断言</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">能被数据库拦住的叫约束；只能靠人记住的叫制度</text>
<rect x="24" y="70" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="36" y="87" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">station</text>
<text x="36" y="101" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">容量与分成比例</text>
<rect x="236" y="70" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="248" y="87" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">charger</text>
<text x="248" y="101" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">桩型号与固件</text>
<rect x="448" y="70" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="460" y="87" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">connector</text>
<text x="460" y="101" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">枪与电表</text>
<rect x="24" y="116" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="36" y="133" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">tariff_band</text>
<text x="36" y="147" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">分时段与单价</text>
<rect x="236" y="116" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="248" y="133" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">member</text>
<text x="248" y="147" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">车主与车牌</text>
<rect x="448" y="116" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="460" y="133" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">charging_session</text>
<text x="460" y="147" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">一次充电（三口径）</text>
<rect x="24" y="162" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="36" y="179" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">session_segment</text>
<text x="36" y="193" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">按时段拆电量</text>
<rect x="236" y="162" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="248" y="179" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">occupancy_fee</text>
<text x="248" y="193" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">占位费（封顶 30）</text>
<rect x="448" y="162" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="460" y="179" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">fee_line</text>
<text x="460" y="193" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">账单三段勾稽</text>
<rect x="24" y="208" width="200" height="38" rx="8" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<text x="36" y="225" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">settlement_batch</text>
<text x="36" y="239" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">月度分成批次</text>
<rect x="24" y="202" width="300" height="36" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1"/>
<text x="36" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">trg_one_active_session</text>
<text x="36" y="232" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">一枪一活动会话</text>
<rect x="340" y="202" width="300" height="36" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1"/>
<text x="352" y="218" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">trg_meter_monotonic</text>
<text x="352" y="232" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">积分不得高于枪表</text>
<rect x="24" y="246" width="300" height="36" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1"/>
<text x="36" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">trg_band_no_overlap</text>
<text x="36" y="276" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">分时段不得重叠</text>
<rect x="340" y="246" width="300" height="36" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1"/>
<text x="352" y="262" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="700">trg_fee_needs_closed_session</text>
<text x="352" y="276" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">未结束不开账单</text>
<rect x="24" y="292" width="632" height="34" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="313" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">正向 10/10、负向 5/5、EXIT=0；换 billing_basis 三值，同一批单出三个账单</text>
</svg>
