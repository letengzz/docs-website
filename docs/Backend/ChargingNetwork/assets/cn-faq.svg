<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="排障顺序：先问哪个数不对，再问为什么">
<rect width="680" height="320" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#64748b"/></marker></defs>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">排障顺序：先定位「哪个数不对」，再问「为什么」</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">充电侧的争议九成落在四个数上，每个数的下一个问题都不一样</text>
<rect x="262" y="64" width="156" height="34" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
<text x="340" y="86" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">车主说「不对」</text>
<path d="M340 98 L340 122 L96 122 L96 140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="28" y="142" width="136" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
<text x="96" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">充得少</text>
<text x="96" y="178" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">枪表 vs 电池入电</text>
<text x="96" y="191" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">效率 96% / 89% 的损耗归谁</text>
<path d="M340 98 L340 122 L256 122 L256 140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="188" y="142" width="136" height="56" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="256" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">收得多</text>
<text x="256" y="178" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">分时拆分是否跨段</text>
<text x="256" y="191" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">整单套价单笔偏 49.2%</text>
<path d="M340 98 L340 122 L416 122 L416 140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="348" y="142" width="136" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="416" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">多收一笔</text>
<text x="416" y="178" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">占位费从何时起算</text>
<text x="416" y="191" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">拔枪事件缺失，漏 42.8%</text>
<path d="M340 98 L340 122 L576 122 L576 140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="508" y="142" width="136" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="576" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">启不了</text>
<text x="576" y="178" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">在线 ≠ 可用</text>
<text x="576" y="191" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="400">在线 99.71% 可用 97.70%</text>
<rect x="24" y="222" width="632" height="38" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">四个分支的公共前提：先确认「你看的是哪个口径的数」——三个电量、三种率、三种价。</text>
<text x="24" y="286" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">分诊原则：先按「金额 / 电量 / 可用性」三类归位，再进具体页。</text>
<text x="24" y="306" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">跨类的争议（例如「充得少又问占位费」）先拆成两条，分别裁决后再合并。</text>
</svg>
