<text x="868" y="225" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">半显性</text>
<rect x="28" y="264" width="904" height="46" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="44" y="283" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">安静 = 没有任何一处抛异常</text>
<text x="44" y="301" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">票能出、短信能发、核销能过，只有「还剩几位」是错的；错量不超过容量量级，永远触发不了阈值告警。</text>
<rect x="28" y="322" width="904" height="50" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="44" y="341" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">本机读数（4,800 档期 / 57,600 位 / 52,110 条预约）</text>
<text x="44" y="361" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">平均占用率 81.19% ｜ 售罄档期 44.31% ｜ 占用≤50% 档期 31.35% ｜ 泄漏占位落在售罄档期 74/120</text>
