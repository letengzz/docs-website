<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="三个「还有没有位置」：同一个档期，三种算法">
<defs>
</defs>
<rect x="0" y="0" width="960" height="430" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">三个「还有没有位置」：同一个档期，三种算法</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">差异只在「算不算占位」和「算不算超售」，但三个数都自称「剩余」</text>
<rect x="28" y="88" width="700" height="58" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="44" y="113" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">名义容量 capacity</text>
<text x="44" y="133" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">建档期写死：物理上最多同时服务几个</text>
<rect x="748" y="88" width="184" height="58" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="840" y="125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">12</text>
<rect x="28" y="158" width="700" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="44" y="183" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">已占用 used</text>
<text x="44" y="203" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">HOLD + CONFIRMED + CHECKED_IN + NO_SHOW</text>
<rect x="748" y="158" width="184" height="58" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="840" y="195" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#b45309" text-anchor="middle">13</text>
<rect x="28" y="228" width="700" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="44" y="253" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">可售余量 remaining</text>
<text x="44" y="273" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">capacity + overbook − used</text>
<rect x="748" y="228" width="184" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="840" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">0</text>
<text x="28" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">只有第三种同时回答了两个问题：现在能不能卖，以及已经卖超了多少。</text>
<rect x="28" y="322" width="288" height="82" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="42" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">只算已确认</text>
<text x="42" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">12 − 11 = 1</text>
<text x="42" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">再卖 1 位就真超卖</text>
<rect x="328" y="322" width="288" height="82" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="342" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">算上占位、忘了超售</text>
<text x="342" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">12 − 13 = −1</text>
<text x="342" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">显示已满，其实还能卖 1 位</text>
<rect x="628" y="322" width="288" height="82" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="642" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">名义 + 超售 − 已占</text>
<text x="642" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">12 + 1 − 13 = 0</text>
<text x="642" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">正确：还能卖 0，已超 1</text>
</svg>