<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="到店高峰不是均匀分布，核销性能要按 10 分钟峰值算">
<defs>
</defs>
<rect x="0" y="0" width="960" height="430" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">到店高峰不是均匀分布，核销性能要按 10 分钟峰值算</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">10:00 的档期，80% 的人在 09:50-10:10 之间到店</text>
<rect x="60" y="249" width="150" height="51" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="135" y="239" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">15%</text>
<text x="135" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">开始前 30 </text><text x="135" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle"></text>
<rect x="280" y="113" width="150" height="187" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="355" y="103" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">55%</text>
<text x="355" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">开始前 10 </text><text x="355" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle"></text>
<rect x="500" y="215" width="150" height="85" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="575" y="205" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">25%</text>
<text x="575" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">开始后 10 </text><text x="575" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle"></text>
<rect x="720" y="283" width="150" height="17" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="795" y="273" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">5%</text>
<text x="795" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">开始后 30 </text><text x="795" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle"></text>
<line x1="40" y1="300" x2="920" y2="300" stroke="#6b7280" stroke-width="1.4"/>
<rect x="28" y="366" width="440" height="48" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="44" y="386" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">核销 = 往 checkin 表写一行（只增不改）</text>
<text x="44" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">主键 booking_id 即幂等键：重复请求被拒，返回原核销时间</text>
<rect x="492" y="366" width="440" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="508" y="386" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">实测重复核销请求占 29.80%（7,706 / 25,859）</text>
<text x="508" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">状态字段表达不了「发生几次」，事实表可以</text>
</svg>