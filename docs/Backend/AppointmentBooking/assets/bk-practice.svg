<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="实战的四层：表、触发器、视图、断言">
<defs>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">实战的四层：表、触发器、视图、断言</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">九张表让十三条断言有地方落地；断言才是产物</text>
<rect x="28" y="84" width="904" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<rect x="28" y="84" width="150" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="103" y="110" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">断言层</text>
<text x="103" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">8 条正向 + 5 条负向</text>
<text x="196" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">C1~C8 / N1~N5 → PASS 13 FAIL 0 EXIT 0</text>
<rect x="28" y="156" width="904" height="62" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="28" y="156" width="150" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="103" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">视图层</text>
<text x="103" y="202" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">唯一的余量口径</text>
<text x="196" y="194" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">v_slot_usage：capacity + overbook − used</text>
<rect x="28" y="228" width="904" height="62" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<rect x="28" y="228" width="150" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="103" y="254" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">触发器层</text>
<text x="103" y="274" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">四个约束守住非法写入</text>
<text x="196" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">座位上限 / 状态迁移 / 核销前置 / 迁移留痕</text>
<rect x="28" y="300" width="904" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<rect x="28" y="300" width="150" height="62" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="103" y="326" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">表层</text>
<text x="103" y="346" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">九张表</text>
<text x="196" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">point / slot / booking / event / checkin / waitlist / quota / channel / diff</text>
<rect x="28" y="372" width="904" height="22" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="28" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">负向断言是这个设计的另一半：只有正向断言的系统，通常是一个从来没拒绝过任何请求的系统。</text>
</svg>