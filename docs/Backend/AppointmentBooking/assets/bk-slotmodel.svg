<text x="44" y="388" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="start">闭区间的 12.5% 虚增永远不会被对账发现：对账比的是「卖了多少」和「收了多少」，两者都基于同一份错误容量。</text>
