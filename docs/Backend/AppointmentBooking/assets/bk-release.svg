<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="配额与需求的错配：15 位顾客被挡在门外，15 个位空着">
<defs>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">配额与需求的错配：15 位顾客被挡在门外，15 个位空着</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">同一个 100 位的资源，按 40/40/20 分配，实际需求是 55/30/15</text>
<text x="28" y="86" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">配额</text>
<text x="220" y="86" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">需求</text>
<text x="420" y="86" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">结果</text>
<text x="28" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">SELF</text>
<rect x="90" y="100" width="192" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="274" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="end">40</text>
<rect x="288" y="100" width="10" height="26" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="60" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start"></text>
<line x1="354" y1="96" x2="354" y2="130" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="360" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">需求 55</text>
<text x="560" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">溢出 15 位被挡</text>
<text x="28" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">CHA</text>
<rect x="90" y="144" width="192" height="26" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="274" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="end">40</text>
<rect x="288" y="144" width="10" height="26" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="60" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start"></text>
<line x1="234" y1="140" x2="234" y2="174" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="240" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">需求 30</text>
<text x="560" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">空置 10 位</text>
<text x="28" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">CHB</text>
<rect x="90" y="188" width="96" height="26" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="178" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="end">20</text>
<rect x="192" y="188" width="10" height="26" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="60" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start"></text>
<line x1="162" y1="184" x2="162" y2="218" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="168" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">需求 15</text>
<text x="560" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">空置 5 位</text>
<rect x="28" y="244" width="440" height="62" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="44" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">按配额成交 85 位 → 可用率 85%</text>
<text x="44" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">被挡 15 位与空置 15 位同时存在：饥饱同现</text>
<rect x="492" y="244" width="440" height="62" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="508" y="266" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">调剂 min(溢出, 空置) → 可用率 100%</text>
<text x="508" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">只调能调的，且不超过对方空置量 → 永不造成新超卖</text>
<rect x="28" y="322" width="904" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="44" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">配额必须存绝对值：按百分比存，四个渠道的取整尾差加起来不等于容量，实测多出或少 1~3 个位</text>
<text x="44" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">used ≤ quota 必须是数据库 CHECK 约束，不能靠应用层「注意一下」。</text>
</svg>