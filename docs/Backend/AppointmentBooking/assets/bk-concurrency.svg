<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="三种占座实现：判断发生在哪一层，决定会不会超卖">
<defs>
</defs>
<rect x="0" y="0" width="960" height="470" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">三种占座实现：判断发生在哪一层，决定会不会超卖</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">容量 50，12 线程各抢 6 次（共 72 次尝试），本机实测</text>
<rect x="28" y="84" width="904" height="96" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<rect x="28" y="84" width="172" height="96" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="114" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">先查后改</text>
<text x="114" y="144" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">判断在应用层</text>
<text x="220" y="114" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">SELECT 读到 49 → 都认为还有 1 个</text>
<text x="220" y="138" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">报成功 53~55 ｜ 超卖 3~5</text>
<text x="220" y="162" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">失败 = 17~19</text>
<rect x="28" y="192" width="904" height="96" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<rect x="28" y="192" width="172" height="96" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="114" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">条件更新</text>
<text x="114" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">判断在 WHERE</text>
<text x="220" y="222" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">UPDATE ... WHERE used &lt; cap</text>
<text x="220" y="246" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">报成功 50 ｜ 超卖 0</text>
<text x="220" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">失败 = 22（WHERE 不成立的请求被正确拒绝）</text>
<rect x="28" y="300" width="904" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<rect x="28" y="300" width="172" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="114" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">唯一键占座</text>
<text x="114" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">判断在索引</text>
<text x="220" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">UNIQUE(slot_id, seat_no) WHERE state IN (...)</text>
<text x="220" y="354" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">报成功 47 ｜ 超卖 0</text>
<text x="220" y="378" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">失败 = 25（按 count+1 分配座位号会撞号）</text>
<rect x="28" y="412" width="904" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="44" y="432" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">缓存余量只能展示，不能判定：TTL 1s / 5s / 30s 在 50 rps 下最坏陈旧放行 50 / 250 / 1,500 人</text>
<text x="44" y="449" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">锁只降低冲突概率，正确性必须落在唯一键或条件更新上。</text>
</svg>