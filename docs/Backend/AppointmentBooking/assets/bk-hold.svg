<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="占位的六个状态与五条边：只有一条边没有人触发">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<rect x="0" y="0" width="960" height="440" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">占位的六个状态与五条边：只有一条边没有人触发</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">HOLD → EXPIRED 是纯后台行为，它挂了没人知道——所以它必须被当成一等公民设计</text>
<rect x="50" y="174" width="140" height="52" rx="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="120" y="205" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">HOLD 已占位</text>
<rect x="320" y="174" width="140" height="52" rx="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="390" y="205" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">CONFIRMED 已付</text>
<rect x="630" y="94" width="140" height="52" rx="26" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="700" y="125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">CHECKED_IN 已到店</text>
<rect x="630" y="254" width="140" height="52" rx="26" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="700" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">NO_SHOW 爽约</text>
<rect x="50" y="304" width="140" height="52" rx="26" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="120" y="335" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">EXPIRED 超时</text>
<rect x="320" y="314" width="140" height="52" rx="26" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="390" y="345" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">CANCELLED 取消</text>
<line x1="192" y1="194" x2="316" y2="194" stroke="#0f766e" stroke-width="1.6" marker-end="url(#ah-t)"/>
<text x="254" y="186" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#0f766e" text-anchor="middle">付款回调</text>
<line x1="462" y1="190" x2="628" y2="132" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="552" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">核销</text>
<line x1="462" y1="212" x2="628" y2="272" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="552" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">未到店</text>
<line x1="150" y1="226" x2="138" y2="302" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ah-r)"/>
<text x="96" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">到期</text>
<line x1="390" y1="226" x2="390" y2="312" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="452" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">顾客取消</text>
<rect x="700" y="330" width="232" height="56" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="716" y="350" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">唯一没有请求触发的边</text>
<text x="716" y="369" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">HOLD → EXPIRED（定时清理）</text>
</svg>