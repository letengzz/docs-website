<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="递补的五步：缺一步，位就空转或被同一个人攥着">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="420" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">递补的五步：缺一步，位就空转或被同一个人攥着</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">800 人候补 / 释放 120 位：只通知 1 人填充 52.70%，顺延 3 人 89.42%</text>
<rect x="28" y="96" width="168" height="96" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="112" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">① 释放</text>
<text x="112" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">位真的空出来</text>
<text x="112" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">used 减少</text>
<line x1="198" y1="144" x2="210" y2="144" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="212" y="96" width="168" height="96" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="296" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">② 取人</text>
<text x="296" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">按 priority + 入队时间</text>
<text x="296" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">取第一个 WAITING</text>
<line x1="382" y1="144" x2="394" y2="144" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="396" y="96" width="168" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="480" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">③ 通知</text>
<text x="480" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">发消息 + 写 expire_at</text>
<text x="480" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">状态改 NOTIFIED</text>
<line x1="566" y1="144" x2="578" y2="144" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="580" y="96" width="168" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="664" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">④ 确认</text>
<text x="664" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">用户点击 → 创建 booking</text>
<text x="664" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">占座成功</text>
<line x1="750" y1="144" x2="762" y2="144" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="764" y="96" width="168" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="848" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">⑤ 落位</text>
<text x="848" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">候补改 PROMOTED</text>
<text x="848" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">位被消耗</text>
<rect x="28" y="214" width="904" height="62" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="44" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">③ 与 ④ 之间可能隔 15 分钟：这 15 分钟位必须被「预留」，不能等确认才占</text>
<text x="44" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">否则别的入口会把位抢走 → 通知了但没位。做法：通知时 reserved + 1，确认转正，超时释放。</text>
<text x="28" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">填充率 = 1 − (1 − 送达率 × 接受率)^顺延次数</text>
<rect x="60" y="340" width="90" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="105" y="336" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">52.7%</text>
<text x="105" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">顺延 1 人</text>
<rect x="200" y="328" width="90" height="38" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="245" y="324" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">77.7%</text>
<text x="245" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">顺延 2 人</text>
<rect x="340" y="322" width="90" height="44" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="385" y="318" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">89.4%</text>
<text x="385" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">顺延 3 人</text>
<rect x="480" y="319" width="90" height="47" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="525" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">95.0%</text>
<text x="525" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">顺延 4 人</text>
<text x="700" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">收益在第三次之后明显衰减</text>
<text x="700" y="360" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">→ 默认「最多顺延 3 人」的来源</text>
</svg>