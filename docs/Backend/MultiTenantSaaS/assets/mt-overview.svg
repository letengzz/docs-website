<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="多租户四个维度与五个必失点">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">四个维度，五个必失点</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">必失点不是「配置写错」，而是「配好了、跑起来了、只在某个入口漏掉」</text>
<rect x="28" y="82" width="218" height="66" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="42" y="108" font-size="14" fill="#2b5c8a" font-weight="700" text-anchor="start">隔离</text>
<text x="42" y="130" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">数据能不能被看见</text>
<rect x="260" y="82" width="218" height="66" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="274" y="108" font-size="14" fill="#2f8f7d" font-weight="700" text-anchor="start">公平</text>
<text x="274" y="130" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">慢的租户会不会拖死快的</text>
<rect x="492" y="82" width="218" height="66" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="506" y="108" font-size="14" fill="#c2703a" font-weight="700" text-anchor="start">计量</text>
<text x="506" y="130" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">收的钱对不对得上做的事</text>
<rect x="724" y="82" width="218" height="66" rx="8" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.4"/>
<text x="738" y="108" font-size="14" fill="#6b4a8a" font-weight="700" text-anchor="start">生命周期</text>
<text x="738" y="130" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">开通与退出有没有留痕</text>
<rect x="28" y="172" width="600" height="54" rx="7" fill="#ffffff" stroke="#b4453c" stroke-width="1.2"/>
<text x="44" y="194" font-size="12.5" fill="#b4453c" font-weight="700" text-anchor="start">① 上下文没设</text>
<text x="44" y="214" font-size="11" fill="#475569" font-weight="400" text-anchor="start">同一连接把上一个租户带过来：可见 1,000 行</text>
<rect x="28" y="238" width="600" height="54" rx="7" fill="#ffffff" stroke="#b4453c" stroke-width="1.2"/>
<text x="44" y="260" font-size="12.5" fill="#b4453c" font-weight="700" text-anchor="start">② 上下文是空串</text>
<text x="44" y="280" font-size="11" fill="#475569" font-weight="400" text-anchor="start">nullif 后为 null，一行都看不到（列表全空）</text>
<rect x="28" y="304" width="600" height="54" rx="7" fill="#ffffff" stroke="#b4453c" stroke-width="1.2"/>
<text x="44" y="326" font-size="12.5" fill="#b4453c" font-weight="700" text-anchor="start">③ 策略被关掉</text>
<text x="44" y="346" font-size="11" fill="#475569" font-weight="400" text-anchor="start">单查询 56.4 ms、读到 234,299 行</text>
<rect x="28" y="370" width="600" height="54" rx="7" fill="#ffffff" stroke="#c2703a" stroke-width="1.2"/>
<text x="44" y="392" font-size="12.5" fill="#c2703a" font-weight="700" text-anchor="start">④ 大租户的点查</text>
<text x="44" y="412" font-size="11" fill="#475569" font-weight="400" text-anchor="start">4.723 ms 对小租户 0.049 ms（96 倍）</text>
<rect x="28" y="436" width="600" height="54" rx="7" fill="#ffffff" stroke="#c2703a" stroke-width="1.2"/>
<text x="44" y="458" font-size="12.5" fill="#c2703a" font-weight="700" text-anchor="start">⑤ 备份基线膨胀</text>
<text x="44" y="478" font-size="11" fill="#475569" font-weight="400" text-anchor="start">300 租户 schema 备份 26,560 行 DDL / 0.52 s</text>
<rect x="648" y="172" width="284" height="318" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="664" y="198" font-size="13" fill="#334155" font-weight="700" text-anchor="start">判定顺序（照着问）</text>
<text x="664" y="226" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">1 谁在连？session_user</text>
<text x="664" y="262" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">2 谁在干活？current_user</text>
<text x="664" y="298" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">3 上下文取到了吗？</text>
<text x="664" y="334" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">4 策略在不在、FORCE 了吗</text>
<text x="664" y="370" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">5 这条 SQL 走哪个索引</text>
<text x="664" y="406" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">6 配额扣在哪一层</text>
<text x="664" y="442" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">7 账单能不能追到事件</text>
<text x="664" y="470" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">任何一步含糊，</text>
<text x="664" y="486" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">后面六步都白问</text>
</svg>
