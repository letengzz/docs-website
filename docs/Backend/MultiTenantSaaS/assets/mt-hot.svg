<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="16 个分片的租户数与行数对比，展示数据倾斜">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">按租户数均衡 ≠ 按数据量均衡</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">300 个租户哈希到 16 个分片；多出来的 20 万行全部落在同一个租户上</text>
<text x="28" y="92" font-size="11.5" fill="#2f8f7d" font-weight="700" text-anchor="start">租户数：最多 26 / 最少 13 = 2.00 倍（哈希涨落，不是 bug）</text>
<text x="28" y="114" font-size="11.5" fill="#b4453c" font-weight="700" text-anchor="start">行数：最多 220,000 / 最少 19,000 = 11.6 倍（大租户把分片压弯了）</text>
