<text x="50" y="412" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">分片编号（hash(tenant_id) &amp; 15）</text>
<rect x="28" y="428" width="452" height="58" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="44" y="450" font-size="11" fill="#475569" font-weight="400" text-anchor="start">扩容搬迁：取模 4→5 = 79.9%，8→9 = 88.3%</text>
<text x="44" y="470" font-size="11" fill="#475569" font-weight="400" text-anchor="start">一致性哈希 4→5 = 18.3%，8→9 = 8.8%（4~10 倍差距）</text>
<rect x="500" y="428" width="432" height="58" rx="7" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.2"/>
<text x="516" y="450" font-size="11" fill="#c2703a" font-weight="700" text-anchor="start">但翻倍扩容时两者一样差</text>
<text x="516" y="470" font-size="11" fill="#475569" font-weight="400" text-anchor="start">4→8 与 8→16 都约 51% —— 一半的键本来就必须搬</text>
