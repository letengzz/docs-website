<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="多租户专题地图：隔离、公平、成本、生命周期四条主线">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">多租户的四条主线，十个页面</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">结构决定「数据放在哪」，资源决定「谁先跑」，计量决定「收多少钱」，时间决定「怎么开始与结束」</text>
<rect x="28" y="82" width="218" height="200" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="42" y="108" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">① 结构 · 数据放在哪</text>
<rect x="42" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#2b5c8a" stroke-width="1"/>
<text x="54" y="162" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">隔离三档</text>
<text x="54" y="180" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">判据 ISO-A ~ ISO-H</text>
<rect x="42" y="202" width="190" height="52" rx="6" fill="#ffffff" stroke="#2b5c8a" stroke-width="1"/>
<text x="54" y="224" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">租户上下文</text>
<text x="54" y="242" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">判据 CTX-A ~ CTX-H</text>
<rect x="260" y="82" width="218" height="200" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="274" y="108" font-size="13" fill="#2f8f7d" font-weight="700" text-anchor="start">② 公平 · 谁先跑</text>
<rect x="274" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#2f8f7d" stroke-width="1"/>
<text x="286" y="162" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">噪声邻居</text>
<text x="286" y="180" font-size="10.5" fill="#2f8f7d" font-weight="400" text-anchor="start">判据 NNB-A ~ NNB-H</text>
<rect x="274" y="202" width="190" height="52" rx="6" fill="#ffffff" stroke="#2f8f7d" stroke-width="1"/>
<text x="286" y="224" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">配额执行</text>
<text x="286" y="242" font-size="10.5" fill="#2f8f7d" font-weight="400" text-anchor="start">判据 QTA-A ~ QTA-H</text>
<rect x="492" y="82" width="218" height="200" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="506" y="108" font-size="13" fill="#c2703a" font-weight="700" text-anchor="start">③ 成本 · 收多少钱</text>
<rect x="506" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#c2703a" stroke-width="1"/>
<text x="518" y="162" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">大租户与热点</text>
<text x="518" y="180" font-size="10.5" fill="#c2703a" font-weight="400" text-anchor="start">判据 HOT-A ~ HOT-H</text>
<rect x="506" y="202" width="190" height="52" rx="6" fill="#ffffff" stroke="#c2703a" stroke-width="1"/>
<text x="518" y="224" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">计量与账单</text>
<text x="518" y="242" font-size="10.5" fill="#c2703a" font-weight="400" text-anchor="start">判据 MTR-A ~ MTR-H</text>
<rect x="724" y="82" width="218" height="200" rx="8" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.4"/>
<text x="738" y="108" font-size="13" fill="#6b4a8a" font-weight="700" text-anchor="start">④ 时间 · 怎么开始与结束</text>
<rect x="738" y="140" width="190" height="52" rx="6" fill="#ffffff" stroke="#6b4a8a" stroke-width="1"/>
<text x="750" y="162" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">生命周期</text>
<text x="750" y="180" font-size="10.5" fill="#6b4a8a" font-weight="400" text-anchor="start">判据 LFC-A ~ LFC-H</text>
<rect x="738" y="202" width="190" height="52" rx="6" fill="#ffffff" stroke="#6b4a8a" stroke-width="1"/>
<text x="750" y="224" font-size="12.5" fill="#1f2d3d" font-weight="700" text-anchor="start">实战基线</text>
<text x="750" y="242" font-size="10.5" fill="#6b4a8a" font-weight="400" text-anchor="start">判据 PRC-A ~ PRC-H</text>
<rect x="28" y="300" width="452" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="44" y="326" font-size="13" fill="#334155" font-weight="700" text-anchor="start">入口：Overview</text>
<text x="44" y="348" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">四个维度各自的判定顺序 + 五个必失点</text>
<text x="44" y="368" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">先看这一页，再决定要改哪一层</text>
<rect x="500" y="300" width="432" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="516" y="326" font-size="13" fill="#334155" font-weight="700" text-anchor="start">出口：FAQ</text>
<text x="516" y="348" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">十类症状的分诊表：从「列表全空」到「账单对不上」</text>
<text x="516" y="368" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">每条症状都指回具体某一页的某一节</text>
<path d="M 28 412 L 932 412" stroke="#cbd5e1" stroke-width="1" fill="none"/>
<text x="28" y="440" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">十条硬约束：同一份租户数据，任何一条入口漏掉，另外九条都不会报错</text>
<text x="28" y="464" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">10 页 / 10 族 80 条判据 · 每族 8 条，编号形如 ISO-A，可被脚本机械核对</text>
<text x="28" y="486" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">实测环境：PostgreSQL 18.6 容器 + Python 3.13 离散事件仿真（脚本不入库）</text>
</svg>
