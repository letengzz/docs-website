<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="多租户常见症状的分诊树">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">十类症状，一张分诊表</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">先按症状定位到层，再去那一页找具体判据；不要从「是不是数据库的问题」开始问</text>
<rect x="28" y="84" width="904" height="42" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="480" y="111" font-size="12.5" fill="#2b5c8a" font-weight="700" text-anchor="middle">看到什么现象？先在下面三列里选一列，再翻到对应那一页</text>
<rect x="28" y="148" width="292" height="42" rx="7" fill="#fbeceb" stroke="#b4453c" stroke-width="1.3"/>
<text x="42" y="175" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">数据看得不对</text>
<rect x="28" y="200" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="42" y="223" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">列表全空 / 少了行</text>
<rect x="28" y="244" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="42" y="267" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">看到了别人的行</text>
<rect x="28" y="288" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="42" y="311" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">导出比页面多</text>
<rect x="332" y="148" width="292" height="42" rx="7" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.3"/>
<text x="346" y="175" font-size="12" fill="#c2703a" font-weight="700" text-anchor="start">快慢与公平</text>
<rect x="332" y="200" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="346" y="223" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">某个租户一来就全慢</text>
<rect x="332" y="244" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="346" y="267" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">自己越用越慢</text>
<rect x="332" y="288" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="346" y="311" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">超时集中在高峰</text>
<rect x="636" y="148" width="292" height="42" rx="7" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.3"/>
<text x="650" y="175" font-size="12" fill="#2f8f7d" font-weight="700" text-anchor="start">钱与账</text>
<rect x="636" y="200" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="650" y="223" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">配额没拦住</text>
<rect x="636" y="244" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="650" y="267" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">账单对不上</text>
<rect x="636" y="288" width="292" height="36" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="650" y="311" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">毛利算不出来</text>
<rect x="28" y="352" width="904" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="44" y="378" font-size="12.5" fill="#334155" font-weight="700" text-anchor="start">三条最容易被当成「数据库问题」的错觉</text>
<text x="44" y="406" font-size="11.5" fill="#b4453c" font-weight="700" text-anchor="start">「查询慢」</text>
<text x="44" y="428" font-size="10" fill="#475569" font-weight="400" text-anchor="start">多数是大租户的数据量，不是索引没建</text>
<text x="44" y="452" font-size="10" fill="#2b5c8a" font-weight="700" text-anchor="start">→ HotTenant</text>
<text x="344" y="406" font-size="11.5" fill="#b4453c" font-weight="700" text-anchor="start">「列表空了」</text>
<text x="344" y="428" font-size="10" fill="#475569" font-weight="400" text-anchor="start">多数是上下文空串，策略 fail-closed 得彻底</text>
<text x="344" y="452" font-size="10" fill="#2b5c8a" font-weight="700" text-anchor="start">→ TenantContext</text>
<text x="644" y="406" font-size="11.5" fill="#b4453c" font-weight="700" text-anchor="start">「账单多了」</text>
<text x="644" y="428" font-size="10" fill="#475569" font-weight="400" text-anchor="start">多数是重复事件没去重，不是单价改了</text>
<text x="644" y="452" font-size="10" fill="#2b5c8a" font-weight="700" text-anchor="start">→ MeteringBilling</text>
</svg>
