<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="计量到账单的流水线以及三种误差">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">从一次调用到一行账单：四个必须对齐的口径</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">事件源的去重键 → 聚合窗口 → 账期切分 → 分摊规则，任何一环换口径，账单就对不上</text>
<rect x="28" y="84" width="168" height="62" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="40" y="108" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">① 事件</text>
<text x="40" y="128" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">event_id / 发生时间</text>
<path d="M 196 115 L 210 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="214" y="84" width="168" height="62" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="226" y="108" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">② 去重</text>
<text x="226" y="128" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">按 event_id 幂等</text>
<path d="M 382 115 L 396 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="400" y="84" width="168" height="62" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="412" y="108" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">③ 聚合</text>
<text x="412" y="128" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">按租户 × 维度 × 小时</text>
<path d="M 568 115 L 582 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="586" y="84" width="168" height="62" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="598" y="108" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">④ 账期</text>
<text x="598" y="128" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">切分 + 迟到窗口</text>
<path d="M 754 115 L 768 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="772" y="84" width="168" height="62" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="784" y="108" font-size="12" fill="#1f2d3d" font-weight="700" text-anchor="start">⑤ 账单行</text>
<text x="784" y="128" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">可追到事件 ID</text>
<rect x="28" y="168" width="452" height="50" rx="6" fill="#ffffff" stroke="#c2703a" stroke-width="1.2"/>
<text x="44" y="189" font-size="12" fill="#c2703a" font-weight="700" text-anchor="start">采样 1%</text>
<text x="44" y="208" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">单租户误差 −0.87% ~ +2.16%，总量 +0.95%</text>
<rect x="28" y="228" width="452" height="50" rx="6" fill="#ffffff" stroke="#b4453c" stroke-width="1.2"/>
<text x="44" y="249" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">重复 0.5%</text>
<text x="44" y="268" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">不去重多计 14,858 单位 = 超收 0.50%</text>
<rect x="28" y="288" width="452" height="50" rx="6" fill="#ffffff" stroke="#2f8f7d" stroke-width="1.2"/>
<text x="44" y="309" font-size="12" fill="#2f8f7d" font-weight="700" text-anchor="start">迟到 0.3%</text>
<text x="44" y="328" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本期少计 0.31%，下一期补记才算平</text>
<rect x="500" y="168" width="432" height="172" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="516" y="194" font-size="12.5" fill="#334155" font-weight="700" text-anchor="start">分摊三种口径（总成本 48,000）</text>
<text x="516" y="222" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start">均摊：每户 9,600</text>
<text x="516" y="252" font-size="11" fill="#2b5c8a" font-weight="700" text-anchor="start">按用量：18,968 / 3,117</text>
<text x="516" y="282" font-size="11" fill="#2f8f7d" font-weight="700" text-anchor="start">两部制：14,771 / 5,732</text>
<text x="516" y="320" font-size="10.5" fill="#b4453c" font-weight="400" text-anchor="start">最大偏差 9,368 —— 均摊让最大租户少付一半</text>
<rect x="28" y="348" width="904" height="128" rx="8" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.2"/>
<text x="44" y="374" font-size="12.5" fill="#2b5c8a" font-weight="700" text-anchor="start">账单必须能回答的三个问题</text>
<text x="44" y="402" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">这一行怎么算的</text>
<text x="44" y="424" font-size="11" fill="#475569" font-weight="400" text-anchor="start">→ 规则版本 + 单价 + 数量</text>
<text x="344" y="402" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">数量从哪来</text>
<text x="344" y="424" font-size="11" fill="#475569" font-weight="400" text-anchor="start">→ 聚合行 → 事件 ID 列表</text>
<text x="644" y="402" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">为什么变了</text>
<text x="644" y="424" font-size="11" fill="#475569" font-weight="400" text-anchor="start">→ 与上期差量 + 口径变更记录</text>
<text x="44" y="456" font-size="10.5" fill="#5a6b7b" font-weight="400" text-anchor="start">做不到这三条，客诉只能靠人工查日志 —— 那是最贵的一种客服</text>
</svg>
