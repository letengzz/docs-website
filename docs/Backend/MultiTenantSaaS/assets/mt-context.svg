<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="租户上下文从请求到异步任务的六段传播链">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="28" y="36" font-size="18" font-weight="700" fill="#1f2d3d">租户上下文的六段链，和三个会断的地方</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b">上下文不是「一个变量」，而是「一个必须连续传递的证明」</text>
<rect x="28" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="40" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">① HTTP 请求</text>
<text x="40" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">Header</text>
<path d="M 168 115 L 180 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="184" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="196" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">② 认证解析</text>
<text x="196" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">Token</text>
<path d="M 324 115 L 336 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="340" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="352" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">③ 线程/协程</text>
<text x="352" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">ThreadLocal</text>
<path d="M 480 115 L 492 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="496" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="508" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">④ 取连接</text>
<text x="508" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">Pool</text>
<path d="M 636 115 L 648 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="652" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="664" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">⑤ 事务内 SET</text>
<text x="664" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">SET LOCAL</text>
<path d="M 792 115 L 804 115" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
<rect x="808" y="86" width="140" height="58" rx="7" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="820" y="110" font-size="11.5" fill="#1f2d3d" font-weight="700" text-anchor="start">⑥ 异步与缓存</text>
<text x="820" y="130" font-size="10.5" fill="#2b5c8a" font-weight="400" text-anchor="start">Task/L1</text>
<rect x="100" y="168" width="252" height="62" rx="7" fill="#fbeceb" stroke="#b4453c" stroke-width="1.3"/>
<text x="112" y="192" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">断点 A：池化复用</text>
<text x="112" y="214" font-size="10.5" fill="#7f1d1d" font-weight="400" text-anchor="start">忘记设 → 读到上一租户 1,000 行</text>
<path d="M 226 168 L 226 144" stroke="#b4453c" stroke-width="1.4" fill="none"/>
<rect x="390" y="168" width="252" height="62" rx="7" fill="#fbeceb" stroke="#b4453c" stroke-width="1.3"/>
<text x="402" y="192" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">断点 B：异步丢上下文</text>
<text x="402" y="214" font-size="10.5" fill="#7f1d1d" font-weight="400" text-anchor="start">线程池里 current 为空 → 空串 → 0 行</text>
<path d="M 516 168 L 516 144" stroke="#b4453c" stroke-width="1.4" fill="none"/>
<rect x="680" y="168" width="252" height="62" rx="7" fill="#fbeceb" stroke="#b4453c" stroke-width="1.3"/>
<text x="692" y="192" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">断点 C：缓存键不含租户</text>
<text x="692" y="214" font-size="10.5" fill="#7f1d1d" font-weight="400" text-anchor="start">key 少一段前缀，直接串租户</text>
<path d="M 806 168 L 806 144" stroke="#b4453c" stroke-width="1.4" fill="none"/>
<rect x="28" y="252" width="452" height="216" rx="8" fill="#ffffff" stroke="#2b5c8a" stroke-width="1.2"/>
<text x="44" y="278" font-size="12.5" fill="#2b5c8a" font-weight="700" text-anchor="start">两种写法，效果不同</text>
<text x="44" y="302" font-size="11.5" fill="#1f2d3d" font-weight="400" text-anchor="start">SET LOCAL app.tenant_id = 't7'</text>
<text x="44" y="322" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">事务结束自动复位；池里下一个请求拿不到残留</text>
<text x="44" y="350" font-size="11.5" fill="#1f2d3d" font-weight="400" text-anchor="start">set_config('app.tenant_id','t7',false)</text>
<text x="44" y="370" font-size="10.5" fill="#b4453c" font-weight="400" text-anchor="start">会话级；请求忘了设就一直沿用上一次的值</text>
<text x="44" y="398" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">实测 set_config 本身 1.6 µs —— 便宜到不该省</text>
<text x="44" y="426" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">但「设了」不等于「设对了」：空串与 null 是两种结果</text>
<text x="44" y="452" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">空串 → nullif → null → 0 行；不设 → 沿用旧值 → 别人的行</text>
<rect x="500" y="252" width="432" height="216" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="516" y="278" font-size="12.5" fill="#334155" font-weight="700" text-anchor="start">四个必带租户键的载体</text>
<text x="516" y="306" font-size="11" fill="#475569" font-weight="400" text-anchor="start">· 缓存 key：t:{tenant}:order:{id}</text>
<text x="516" y="336" font-size="11" fill="#475569" font-weight="400" text-anchor="start">· 消息 key / header：tenant_id</text>
<text x="516" y="366" font-size="11" fill="#475569" font-weight="400" text-anchor="start">· 日志 MDC：tenant=…，审计可追</text>
<text x="516" y="396" font-size="11" fill="#475569" font-weight="400" text-anchor="start">· 指标标签：按租户拆但不做高基数</text>
<text x="516" y="440" font-size="10.5" fill="#b4453c" font-weight="400" text-anchor="start">少一个载体 = 少一条排查路径，</text>
<text x="516" y="458" font-size="10.5" fill="#b4453c" font-weight="400" text-anchor="start">不是「少一个字段」</text>
</svg>
