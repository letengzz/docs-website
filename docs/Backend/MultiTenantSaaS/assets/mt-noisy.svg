<text x="44" y="460" font-size="11" fill="#475569" font-weight="400" text-anchor="start">p50 2,097 → 2,407 ms（+14.8%）</text>
<text x="44" y="478" font-size="10.5" fill="#5a6b7b" font-weight="400" text-anchor="start">公平排队不是免费的，但它只让「制造噪声的人」付</text>
