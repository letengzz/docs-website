<text x="516" y="460" font-size="11" fill="#475569" font-weight="400" text-anchor="start">A p50 2,407 → 1,105 ms（-54%），拒 809 个</text>
<text x="516" y="478" font-size="10.5" fill="#5a6b7b" font-weight="400" text-anchor="start">对自己也好：排队变短，超时变少</text>
