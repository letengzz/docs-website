<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img">
<title>归一化流水线：救回 5 类变体，漏掉 1 类</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="820" height="440" fill="#FFFFFF"/>
<text x="40" y="40" font-size="18" font-weight="700" fill="#1F2937">归一化流水线：救回 5 类变体，漏掉 1 类</text>
<text x="40" y="64" font-size="13" fill="#6B7280">每一格都标注本机实测的变体命中率（1,000 条 × 6 类）</text>
<rect x="40" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="95.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">NFKC</text>
<text x="95.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">全角/兼容</text>
<line x1="150" y1="133" x2="162" y2="133" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="162" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="217.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">去零宽</text>
<text x="217.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">ZWSP/ZWJ</text>
<line x1="272" y1="133" x2="284" y2="133" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="284" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="339.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">繁→简</text>
<text x="339.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">50%→100%</text>
<line x1="394" y1="133" x2="406" y2="133" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="406" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="461.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">去标点空格</text>
<text x="461.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">0%→100%</text>
<line x1="516" y1="133" x2="528" y2="133" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="528" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="583.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">谐音表</text>
<text x="583.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">50%→100%</text>
<line x1="638" y1="133" x2="650" y2="133" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="650" y="100" width="110" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="705.0" y="128.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">关键词</text>
<text x="705.0" y="147.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">最终判定</text>
<line x1="240" y1="166" x2="240" y2="216" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="240.0" y="185.0" text-anchor="middle" font-size="12" fill="#6B7280">拆字 0%→100%</text>
<rect x="60" y="220" width="700" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="410.0" y="252.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">拼音首字母：0% → 0%（归一化对它完全无效，只能靠行为特征与账号画像）</text>
<text x="150" y="320.0" text-anchor="end" font-size="12" fill="#6B7280">明文</text>
<rect x="160" y="306" width="480" height="20" rx="4" fill="#F1F5F9"/>
<rect x="160" y="306" width="480.0" height="20" rx="4" fill="#2563EB" opacity="0.85"/>
<text x="648.0" y="320.0" font-size="12" fill="#1F2937">100%</text>
<text x="150" y="350.0" text-anchor="end" font-size="12" fill="#6B7280">变体</text>
<rect x="160" y="336" width="480" height="20" rx="4" fill="#F1F5F9"/>
<rect x="160" y="336" width="400.0" height="20" rx="4" fill="#D97706" opacity="0.85"/>
<text x="568.0" y="350.0" font-size="12" fill="#1F2937">83.3%</text>
<text x="150" y="380.0" text-anchor="end" font-size="12" fill="#6B7280">误杀</text>
<rect x="160" y="366" width="480" height="20" rx="4" fill="#F1F5F9"/>
<rect x="160" y="366" width="110.8" height="20" rx="4" fill="#DC2626" opacity="0.85"/>
<text x="278.8" y="380.0" font-size="12" fill="#1F2937">23.1%</text>
<text x="40" y="412" font-size="12" fill="#6B7280">第三根柱是代价：同一套归一化把良性文本的误杀率从 7.7% 抬到 23.1%——救回漏放的每一步都在制造误杀。</text>
</svg>
