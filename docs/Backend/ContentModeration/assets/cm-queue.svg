<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img">
<title>人审队列：ρ=0.89 时 p95 已经是 71 秒</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="800" height="430" fill="#FFFFFF"/>
<text x="40" y="40" font-size="18" font-weight="700" fill="#1F2937">人审队列：ρ=0.89 时 p95 已经是 71 秒</text>
<text x="40" y="64" font-size="13" fill="#6B7280">15 名审核员 × 40 秒/条 = 1,350 条/小时的处理能力</text>
<rect x="60" y="110" width="680" height="62" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="90" y="136" font-size="14" font-weight="600" fill="#1F2937">900 /h</text>
<text x="90" y="158" font-size="12" fill="#6B7280">ρ=0.667</text>
<text x="680" y="148" text-anchor="end" font-size="15" font-weight="600" fill="#059669">p95 5.4 s</text>
<rect x="220" y="128" width="52" height="26" rx="4" fill="#059669" opacity="0.18"/>
<rect x="60" y="188" width="680" height="62" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="90" y="214" font-size="14" font-weight="600" fill="#1F2937">1,200 /h</text>
<text x="90" y="236" font-size="12" fill="#6B7280">ρ=0.889</text>
<text x="680" y="226" text-anchor="end" font-size="15" font-weight="600" fill="#D97706">p95 71.1 s</text>
<rect x="220" y="206" width="182" height="26" rx="4" fill="#D97706" opacity="0.18"/>
<rect x="60" y="266" width="680" height="62" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="90" y="292" font-size="14" font-weight="600" fill="#1F2937">1,800 /h</text>
<text x="90" y="314" font-size="12" fill="#6B7280">ρ=1.333</text>
<text x="680" y="304" text-anchor="end" font-size="15" font-weight="600" fill="#DC2626">p95 7.9 h</text>
<rect x="220" y="284" width="520" height="26" rx="4" fill="#DC2626" opacity="0.18"/>
<text x="40" y="370" font-size="13" fill="#1F2937">利用率超过 0.85 之后，等待时间不再与人数成反比——这是排队论里唯一必须记住的结论。</text>
<text x="40" y="394" font-size="12" fill="#6B7280">加 5 个人（20 人）把 p95 从 71 s 压到 1 s 以内；而把阈值抬到 0.75 只是把工作推给了「没人看」。 </text>
</svg>
