<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img">
<title>可见性状态机：处置就是一次状态迁移</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="820" height="440" fill="#FFFFFF"/>
<text x="40" y="40" font-size="18" font-weight="700" fill="#1F2937">可见性状态机：处置就是一次状态迁移</text>
<text x="40" y="64" font-size="13" fill="#6B7280">每一个箭头都必须有「谁触发、能否撤销、留下什么证据」</text>
<rect x="60" y="100" width="130" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="125.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">VISIBLE</text>
<text x="125.0" y="142.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">可见</text>
<rect x="240" y="100" width="130" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="305.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">LIMITED</text>
<text x="305.0" y="142.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">降权/限流</text>
<rect x="420" y="100" width="130" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="485.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">HIDDEN</text>
<text x="485.0" y="142.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">仅作者可见</text>
<rect x="600" y="100" width="150" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="675.0" y="123.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">REMOVED</text>
<text x="675.0" y="142.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">下架/删除</text>
<rect x="420" y="250" width="130" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="485.0" y="273.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">APPEALING</text>
<text x="485.0" y="292.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">申诉中</text>
<rect x="240" y="250" width="130" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="305.0" y="273.1" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">RESTORED</text>
<text x="305.0" y="292.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">恢复可见</text>
<line x1="190" y1="128" x2="236" y2="128" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="370" y1="128" x2="416" y2="128" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="550" y1="128" x2="596" y2="128" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="675" y1="156" x2="560" y2="246" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="617.5" y="195.0" text-anchor="middle" font-size="12" fill="#6B7280">申诉</text>
<line x1="420" y1="278" x2="374" y2="278" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="397.0" y="272.0" text-anchor="middle" font-size="12" fill="#6B7280">撤销</text>
<line x1="240" y1="278" x2="130" y2="160" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="185.0" y="213.0" text-anchor="middle" font-size="12" fill="#6B7280">回填</text>
<line x1="660" y1="128" x2="660" y2="200" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="676" y="212" font-size="11" fill="#6B7280">复审保留</text>
<text x="40" y="356" font-size="13" fill="#1F2937">本机实测：无守卫时 100 次重复下架写入 100 条记录；有守卫时只有 1 次状态迁移。</text>
<text x="40" y="382" font-size="13" fill="#1F2937">误杀恢复是一次反向迁移，且必须留下 2 条审计（下架、撤销）——只留一条的，事后说不清谁放回来的。</text>
</svg>
