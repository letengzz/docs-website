<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img">
<title>七段链：每一段都有独立的失败形态</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="820" height="420" fill="#FFFFFF"/>
<text x="40" y="40" font-size="18" font-weight="700" fill="#1F2937">七段链：每一段都有独立的失败形态</text>
<text x="40" y="64" font-size="13" fill="#6B7280">从左到右是顺序，从上到下是「这一段错了会怎样」</text>
<rect x="40" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="88.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">接入</text>
<rect x="40" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="88.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">重复提交</text>
<line x1="88" y1="174" x2="88" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="136" y1="142" x2="144" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="148" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="196.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">机审</text>
<rect x="148" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="196.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">漏检</text>
<line x1="196" y1="174" x2="196" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="244" y1="142" x2="252" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="256" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="304.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">判定</text>
<rect x="256" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="304.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">阈值错</text>
<line x1="304" y1="174" x2="304" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="352" y1="142" x2="360" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="364" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="412.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">路由</text>
<rect x="364" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="412.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">排队</text>
<line x1="412" y1="174" x2="412" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="460" y1="142" x2="468" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="472" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="520.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">处置</text>
<rect x="472" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="520.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">误杀</text>
<line x1="520" y1="174" x2="520" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="568" y1="142" x2="576" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="580" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="628.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">申诉</text>
<rect x="580" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="628.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">不闭环</text>
<line x1="628" y1="174" x2="628" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="676" y1="142" x2="684" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="688" y="110" width="96" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="736.0" y="146.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">度量</text>
<rect x="688" y="220" width="96" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
<text x="736.0" y="256.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">看不见</text>
<line x1="736" y1="174" x2="736" y2="216" stroke="#FCA5A5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="40" y="330" font-size="13" fill="#1F2937">顺序不能跳：跳过「判定」直接调处置，等于每个模型都自带一套策略；</text>
<text x="40" y="354" font-size="13" fill="#1F2937">跳过「申诉」，误杀就只能靠人投诉——而投诉的人本来就不多。</text>
<text x="40" y="388" font-size="12" fill="#6B7280">本册十页按这七段展开，最后两页是实战与分诊。</text>
</svg>
