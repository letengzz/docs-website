<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img">
<title>七步落地：从「有模型」到「有判据」</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="820" height="450" fill="#FFFFFF"/>
<text x="40" y="40" font-size="18" font-weight="700" fill="#1F2937">七步落地：从「有模型」到「有判据」</text>
<text x="40" y="64" font-size="13" fill="#6B7280">每一步都能独立验收，不需要等前一步「完全做好」</text>
<rect x="40" y="110" width="160" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="120.0" y="137.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">① 摸底</text>
<text x="120.0" y="157.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">量基线</text>
<line x1="200" y1="143" x2="226" y2="143" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="230" y="110" width="160" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="310.0" y="137.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">② 定级</text>
<text x="310.0" y="157.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">三档</text>
<line x1="390" y1="143" x2="416" y2="143" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="420" y="110" width="160" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="500.0" y="137.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">③ 接入</text>
<text x="500.0" y="157.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">幂等</text>
<line x1="580" y1="143" x2="606" y2="143" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="610" y="110" width="160" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="690.0" y="137.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">④ 归一化</text>
<text x="690.0" y="157.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">文本</text>
<rect x="40" y="230" width="160" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="120.0" y="257.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">⑤ 队列</text>
<text x="120.0" y="277.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">SLA</text>
<rect x="230" y="230" width="160" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="257.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">⑥ 处置</text>
<text x="310.0" y="277.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">状态机</text>
<rect x="420" y="230" width="160" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="500.0" y="257.9" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">⑦ 度量</text>
<text x="500.0" y="277.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1F2937">抽检</text>
<line x1="120" y1="176" x2="120" y2="226" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="620" y1="176" x2="620" y2="226" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="60" y="330" width="700" height="76" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="410.0" y="363.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">先做 ⑦ 的人会得到一张漂亮的报表，但拿不出「这条为什么被拦」的证据；</text>
<text x="410.0" y="382.1" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2937">先做 ⑥ 的人会在第一周就发现：没有 ③ 的幂等，处置日志全是重复的。</text>
</svg>
