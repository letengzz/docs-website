<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="与相邻专题的分工：同一个设备，五册问五个问题">
<title>与相邻专题的分工：同一个设备，五册问五个问题</title>
<rect x="24" y="84" width="400" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="444" y="84" width="200" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="664" y="84" width="232" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="109" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">你问的问题</text>
<text x="460" y="109" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">该读哪一册</text>
<text x="680" y="109" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">为什么不是本册</text>
<rect x="24" y="128" width="872" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#0f172a">这台设备还值多少钱、折旧怎么摊</text>
<text x="460" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#1d4ed8">资产台账与折旧摊销</text>
<text x="680" y="155" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">那册管账，本册管可用性</text>
<rect x="24" y="172" width="872" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="199" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#0f172a">这批货做完了没有、良品多少</text>
<text x="460" y="199" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#1d4ed8">生产执行与工单报工</text>
<text x="680" y="199" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">那册判数量守恒，本册判停机</text>
<rect x="24" y="216" width="872" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="243" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#0f172a">料在哪个货位、谁去拣</text>
<text x="460" y="243" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#1d4ed8">仓储作业与波次拣选</text>
<text x="680" y="243" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">那册管库内空间，本册管备件</text>
<rect x="24" y="260" width="872" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="287" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#0f172a">这次停机让成本多了多少</text>
<text x="460" y="287" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#1d4ed8">成本核算与月末结账</text>
<text x="680" y="287" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">那册管归集，本册管时长</text>
<rect x="24" y="304" width="872" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="331" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#0f172a">设备坏了算不算事故、怎么取证</text>
<text x="460" y="331" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#1d4ed8">事故响应与取证流程</text>
<text x="680" y="331" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">那册管事件，本册管寿命</text>
<rect x="24" y="364" width="872" height="60" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="40" y="390" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.2" fill="#92400e" font-weight="700">一句话边界：别的册子问「这个东西值多少 / 产出了多少」，本册只问「它什么时候会停、停了多久、下次怎么不停」</text>
<text x="40" y="411" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#92400e">边界最紧的是「资产台账」：同一份设备清单，两册共用，但一册按折旧年限看，一册按失效分布看</text>
<rect x="0" y="0" width="920" height="430" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">与相邻专题的分工：同一个设备，五册问五个问题</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">看这张表之前先问自己：我要的是「值多少钱」还是「还能转多久」</text>
</svg>
