<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="工单六态与两条不能走的路">
<title>工单六态与两条不能走的路</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="40" y="110" width="130" height="54" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="105" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">OPEN</text>
<rect x="210" y="110" width="130" height="54" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="275" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">ASSIGNED</text>
<rect x="380" y="110" width="130" height="54" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="445" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">WORKING</text>
<rect x="550" y="110" width="130" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="615" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">DONE</text>
<rect x="720" y="110" width="130" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="785" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">CLOSED</text>
<line x1="170" y1="137" x2="208" y2="137" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="340" y1="137" x2="378" y2="137" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="510" y1="137" x2="548" y2="137" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="680" y1="137" x2="718" y2="137" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="150" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">派工</text>
<text x="320" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">开工（记 started_at）</text>
<text x="490" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">完工（必须填 finished_at）</text>
<text x="660" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">关单（成本归集后）</text>
<rect x="210" y="214" width="160" height="46" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="290" y="243" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="middle">CANCELLED</text>
<line x1="275" y1="164" x2="275" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="283" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#991b1b">误报 / 重复</text>
<line x1="785" y1="118" x2="700" y2="66" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="742" y1="92" x2="756" y2="76" stroke="#dc2626" stroke-width="2.4"/>
<line x1="756" y1="92" x2="742" y2="76" stroke="#dc2626" stroke-width="2.4"/>
<text x="700" y="52" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#991b1b">CLOSED → WORKING 一律拒绝</text>
<line x1="515" y1="290" x2="515" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
<text x="524" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#991b1b">DONE → OPEN 只在「重开」动作里允许，且必须新开一条停机</text>
<rect x="24" y="292" width="460" height="84" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="318" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">停机记录与工单是两张表，靠 wo_id 连</text>
<text x="40" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">一条纠正工单可以有多段停机（等件 / 修 / 试机）</text>
<text x="40" y="362" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">C3 自检：已关闭的纠正工单必须有停机记录，否则时长永远算不出来</text>
<rect x="500" y="292" width="396" height="84" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="516" y="318" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">本机去重读数</text>
<text x="516" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#92400e">1,623 条上报 → 15 分钟窗口合并后 1,199 张工单</text>
<text x="516" y="362" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#92400e">合并 26.1%；按条数算维修工时虚增 35.4%</text>
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">工单六态与两条不能走的路</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">状态机最容易漏的不是「怎么前进」，而是「谁能后退、退了之后停机记录怎么办」</text>
</svg>
