<line x1="266.5" y1="156" x2="272.5" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="273.0" y="92" width="118" height="128" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="286.0" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">③ 检</text>
<text x="286.0" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">点检与</text>
<text x="286.0" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">状态监测</text>
<text x="286.0" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<line x1="391.0" y1="156" x2="397.0" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="397.5" y="92" width="118" height="128" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="410.5" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">④ 修</text>
<text x="410.5" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">工单与</text>
<text x="410.5" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">停机登记</text>
<text x="410.5" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">失败：半显性</text>
<line x1="515.5" y1="156" x2="521.5" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="522.0" y="92" width="118" height="128" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="535.0" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑤ 备</text>
<text x="535.0" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">备件与</text>
<text x="535.0" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">可修复件</text>
<text x="535.0" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<line x1="640.0" y1="156" x2="646.0" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="646.5" y="92" width="118" height="128" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="659.5" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑥ 算</text>
<text x="659.5" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">停机口径</text>
<text x="659.5" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">与 OEE</text>
<text x="659.5" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">失败：半显性</text>
<line x1="764.5" y1="156" x2="770.5" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="771.0" y="92" width="118" height="128" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="784.0" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑦ 验</text>
<text x="784.0" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">可靠性</text>
<text x="784.0" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">回写策略</text>
<text x="784.0" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：安静</text>
<rect x="24" y="246" width="872" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">三个「好了」：工单关了 / 设备转起来了 / 下一台不会再这样坏 —— 只有第三个跟维护有关</text>
<text x="40" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">前两个是动作（可以补单），第三个是判断（必须靠间隔、备件与可靠性数据一起成立）</text>
<rect x="0" y="0" width="920" height="404" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段维护链：从「建台账」到「校核可靠性」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">七段里五段的失败是安静的：设备照转，只是没人知道它下一次什么时候停</text>
</svg>
