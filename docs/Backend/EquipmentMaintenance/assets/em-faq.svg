<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 396" width="920" height="396" role="img" aria-label="故障分诊：先看现象落在哪一段">
<title>故障分诊：先看现象落在哪一段</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="24" y="92" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="119" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">设备总在同一时间停</text>
<line x1="326" y1="113" x2="366" y2="113" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="92" width="250" height="42" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="382" y="119" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查维护间隔与班次</text>
<text x="636" y="119" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">② 定策略</text>
<rect x="24" y="140" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="167" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">点检表全绿但仍然坏</text>
<line x1="326" y1="161" x2="366" y2="161" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="140" width="250" height="42" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="382" y="167" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查补录指纹与测点</text>
<text x="636" y="167" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">③ 检</text>
<rect x="24" y="188" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="215" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">工单很多但停机不长</text>
<line x1="326" y1="209" x2="366" y2="209" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="188" width="250" height="42" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="382" y="215" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查去重键</text>
<text x="636" y="215" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">④ 修</text>
<rect x="24" y="236" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="263" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">停了很久在等件</text>
<line x1="326" y1="257" x2="366" y2="257" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="236" width="250" height="42" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="382" y="263" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查 ABC 与安全库存</text>
<text x="636" y="263" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">⑤ 备</text>
<rect x="24" y="284" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="311" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">两部门可用率不一致</text>
<line x1="326" y1="305" x2="366" y2="305" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="284" width="250" height="42" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="382" y="311" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查分母与并集</text>
<text x="636" y="311" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">⑥ 算</text>
<rect x="24" y="332" width="300" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="359" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#0f172a">换了新件反而更爱坏</text>
<line x1="326" y1="353" x2="366" y2="353" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="368" y="332" width="250" height="42" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="382" y="359" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#0f172a">查 β 与安装质量</text>
<text x="636" y="359" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.2" fill="#475569">⑦ 验</text>
<rect x="24" y="386" width="872" height="50" rx="8" fill="#fff1f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="40" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.6" fill="#7f1d1d">分诊第一问永远是「这条数字的分母是什么」，第二问是「它是不是并集」——这两问答不上来，后面全是猜</text>
<rect x="0" y="0" width="920" height="396" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">故障分诊：先看现象落在哪一段</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一个「设备老停」，可能是台账没分级、间隔定错、点检补录，也可能是备件没到</text>
</svg>
