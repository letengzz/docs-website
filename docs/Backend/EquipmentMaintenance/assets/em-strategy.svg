<text x="37" y="148.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">适合 C 类 / β≈1</text>
<rect x="240" y="88" width="208" height="106" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="253" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">PM 定期维护</text>
<text x="253" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">按时间或产量</text>
<text x="253" y="148.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">适合 β&gt;1.5 的磨损件</text>
<rect x="456" y="88" width="208" height="106" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="469" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">CBM 状态维护</text>
<text x="469" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">按测点阈值触发</text>
<text x="469" y="148.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">适合有可测征兆的件</text>
<rect x="672" y="88" width="208" height="106" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="685" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">PdM 预测维护</text>
<text x="685" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">按剩余寿命排程</text>
<text x="685" y="148.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">需要历史失效样本</text>
<rect x="24" y="216" width="500" height="172" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">失效率曲线：浴盆的三段与三种策略</text>
<line x1="64" y1="366" x2="504" y2="366" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="64" y1="260" x2="64" y2="366" stroke="#94a3b8" stroke-width="1.2"/>
<text x="70" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b">运行时间 →</text>
<text x="36" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">λ</text>
<path d="M 68 276 C 114 356, 144 362, 194 362" fill="none" stroke="#dc2626" stroke-width="2.4"/>
<path d="M 194 362 C 254 361, 304 364, 354 360" fill="none" stroke="#16a34a" stroke-width="2.4"/>
<path d="M 354 360 C 414 352, 464 288, 500 268" fill="none" stroke="#b45309" stroke-width="2.4"/>
<text x="76" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#991b1b">早期失效 β&lt;1</text>
<text x="238" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#166534">偶发 β≈1</text>
<text x="396" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309">磨损 β&gt;1</text>
<rect x="540" y="216" width="356" height="172" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="556" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">本机模型（Cp=1,200 / Cc=9,000 元）</text>
<text x="556" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#92400e">β=2.2, η=900h：最优 T=350h，6.29 元/h</text>
<text x="556" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#166534">不做 PM：11.29 元/h → 省 44.3%</text>
<text x="556" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#991b1b">β=0.8, η=900h：PM 9.77 &gt; 不维护 8.83</text>
<text x="556" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#991b1b">→ 定时更换把「还能用」的件换掉了</text>
<text x="556" y="364" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#92400e">β=1.0：差 1.6%，等于白做</text>
<rect x="0" y="0" width="920" height="420" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">四种维护策略，四种失效分布</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一句「每 350 小时换一次」，在 β=2.2 的件上是省钱，在 β=0.8 的件上是浪费</text>
</svg>
