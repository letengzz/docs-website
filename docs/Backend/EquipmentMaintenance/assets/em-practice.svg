<text x="44" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#334155">表 7 张：eq_asset, eq_downtime, eq_inspect, eq_part, eq_plan, eq_wo, eq_wo_part</text>
<text x="44" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#334155">部分唯一索引：['ux_dt_open']    -- 同一设备同时只允许一条未闭合停机</text>
<text x="44" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#334155">C1~C5 全部 0：工单挂空设备 0 / 计划到期早于完成 0 / 关单无停机 0 / 双开停机 0 / 备件负数 0</text>
<text x="44" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#334155">N1~N4 全部被拒：关单回退 / 第二条未闭合停机 / 发料冲负 / 间隔为 0</text>
<text x="44" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.3" fill="#334155">读数：已闭合停机 1 条 2.5 h，未闭合 1 条；MTTR 150.0 min；A(负荷) 99.971%</text>
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七步闭环：从台账到可复算的可用率</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">每一步都有可执行命令与期望值——判据不是「做了」，是「算出来的数对得上」</text>
</svg>
