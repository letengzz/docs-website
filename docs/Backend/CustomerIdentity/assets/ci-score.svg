<text x="607" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="middle">0.80</text>
<text x="607" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">P100 / R65</text>
<rect x="740" y="140" width="64" height="180" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="772" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">222 万</text>
<text x="772" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="middle">0.90</text>
<text x="772" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">P100 / R27</text>
<line x1="60" y1="320" x2="900" y2="320" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50" y="66" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">成本 = 误合并 × 400 元 + 漏合并 × 40 元（错认一个人赔一单，漏认只是下次再问）</text>
<text x="50" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="600" text-anchor="start">0.45 时最大簇 68 条：低阈值 + 传递闭包 = 把一整个小区的住户并成一个人</text>
</svg>
