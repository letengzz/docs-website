<text x="112" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="middle">0.45</text>
<text x="112" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">P91 / R86</text>
<rect x="245" y="272" width="64" height="48" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.2"/>
