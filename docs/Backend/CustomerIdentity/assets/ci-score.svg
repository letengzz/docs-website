<text x="277" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="middle">0.60</text>
<text x="277" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">P100 / R80</text>
<rect x="410" y="269" width="64" height="51" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="442" y="261" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">64 万</text>
<text x="442" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="middle">0.70</text>
