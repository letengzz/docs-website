<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="硬合并与软合并：一扇门和一串门牌">
<title>硬合并与软合并：一扇门和一串门牌</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>

<rect x="40" y="66" width="400" height="120" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="53" y="90" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">硬合并：删掉旧主键</text>
<text x="53" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">旧 ID 查不到 → 会话失效</text>
<text x="53" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">外键必须一起改，漏一张表就孤儿</text>
<text x="53" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">拆回去要靠 merge_log</text>
<text x="53" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">删除 25,076 个主键</text>
<rect x="500" y="66" width="400" height="120" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="513" y="90" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">软合并：留别名</text>
<text x="513" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">old_id → canonical_id</text>
<text x="513" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">旧 ID 仍能查到人</text>
<text x="513" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">别名只许指向 active</text>
<text x="513" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1">25,076 行别名</text>
<text x="40" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="600" text-anchor="start">别名不是链：A→B 之后 B 又被并进 C，若 A 仍指向 B，就要爬 43 跳</text>
<rect x="40" y="236" width="860" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="53" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">唯一正确的写法：别名永远指向簇根，并在每次合并时把整簇重指</text>
<text x="53" y="284" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">读一次 = 一次主键查询；不做路径压缩时，三轮合并后最长链 43 跳</text>
</svg>
