<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="客户身份归并的七段链">
<title>客户身份归并的七段链</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>

<rect x="26" y="88" width="116" height="132" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="39" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">① 采</text>
<text x="39" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">四个入口</text>
<text x="39" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">各自建档</text>
<text x="39" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309">失败：显性</text>
<line x1="142" y1="154" x2="150" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="158" y="88" width="116" height="132" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="171" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">② 归</text>
<text x="171" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">手机/姓名/</text>
<text x="171" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">证件归一</text>
<text x="171" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1">失败：安静</text>
<line x1="274" y1="154" x2="282" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="290" y="88" width="116" height="132" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="303" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">③ 判</text>
<text x="303" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">分块+打分</text>
<text x="303" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">出候选</text>
<text x="303" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d">失败：安静</text>
<line x1="406" y1="154" x2="414" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="422" y="88" width="116" height="132" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="435" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">④ 并</text>
<text x="435" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">簇与主键</text>
<text x="435" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">合并落库</text>
<text x="435" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">失败：半显性</text>
<line x1="538" y1="154" x2="546" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="554" y="88" width="116" height="132" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="567" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑤ 金</text>
<text x="567" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">字段存活</text>
<text x="567" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">出金记录</text>
<text x="567" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a21caf">失败：安静</text>
<line x1="670" y1="154" x2="678" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="686" y="88" width="116" height="132" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="699" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑥ 权</text>
<text x="699" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">同意/可见</text>
<text x="699" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">范围</text>
<text x="699" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4338ca">失败：安静</text>
<line x1="802" y1="154" x2="810" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="818" y="88" width="116" height="132" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="831" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑦ 删</text>
<text x="831" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">留存期到</text>
<text x="831" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">清洗</text>
<text x="831" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">失败：安静</text>
<text x="26" y="44" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">七段的产物：一条记录 → 一个簇 → 一个客户 → 一份可见范围 → 0 行明文</text>
<text x="26" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="start">五段失败是安静的：数还在、页面还在，只是「同一个人」的边界悄悄错了一格</text>
<text x="26" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">安静的意思是：没有任何一条约束会因此报错</text>
</svg>
