<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">入住：房型落到房号，以及三种区间变更</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">换房只能按夜切分——整段改 room_id 会同时造出「凭空占用」与「凭空释放」</text>
<text x="24" y="78" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">换房：住 4 晚，第 2 晚搬房</text>
<rect x="24" y="88" width="340" height="62" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="107" font-size="11.5" font-weight="700" fill="#881337">错：整段改 room_id</text>
<text x="34" y="122" font-size="9.8" fill="#334155">0806 的 4 晚全改成 0912</text>
<text x="34" y="136" font-size="9.8" fill="#334155">前半段新房凭空被占 → 重房</text>
<rect x="396" y="88" width="340" height="62" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="406" y="107" font-size="11.5" font-weight="700" fill="#115e59">对：按夜切分</text>
<text x="406" y="122" font-size="9.8" fill="#334155">0806 [11-06,11-08) + 0912 [11-08,11-10)</text>
<text x="24" y="178" font-size="10" fill="#881337" text-anchor="start">实测：抽查 300 单换房，「整段改」有 13 单与新房间冲突；按夜切分 0 单</text>
<rect x="60" y="196" width="140" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="70" y="215" font-size="10" font-weight="700" fill="#0f172a">11-06</text>
<rect x="220" y="196" width="140" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="230" y="215" font-size="10" font-weight="700" fill="#0f172a">11-07</text>
<rect x="380" y="196" width="140" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="390" y="215" font-size="10" font-weight="700" fill="#0f172a">11-08</text>
<rect x="540" y="196" width="140" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="550" y="215" font-size="10" font-weight="700" fill="#0f172a">11-09</text>
<rect x="60" y="240" width="300" height="34" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="70" y="259" font-size="10" font-weight="700" fill="#1e3a8a">0806（前半段）</text>
<rect x="380" y="240" width="300" height="34" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="390" y="259" font-size="10" font-weight="700" fill="#115e59">0912（后半段）</text>
<rect x="24" y="296" width="232" height="88" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="34" y="315" font-size="11.5" font-weight="700" fill="#78350f">延住 2.40%</text>
<text x="34" y="330" font-size="9.8" fill="#334155">54.17% 的那晚已被卖</text>
<text x="34" y="344" font-size="9.8" fill="#334155">先查余量再改区间</text>
<rect x="268" y="296" width="232" height="88" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="278" y="315" font-size="11.5" font-weight="700" fill="#4c1d95">提前离店 6.20%</text>
<text x="278" y="330" font-size="9.8" fill="#334155">空出 78 房夜 = 3.62%</text>
<text x="278" y="344" font-size="9.8" fill="#334155">必须在夜审前释放</text>
<rect x="512" y="296" width="224" height="88" rx="8" fill="#ecfeff" stroke="#6fb6c9" stroke-width="1.1"/>
<text x="522" y="315" font-size="11.5" font-weight="700" fill="#164e63">换房 4.30%</text>
<text x="522" y="330" font-size="9.8" fill="#334155">其中换两次 7 单</text>
<text x="522" y="344" font-size="9.8" fill="#334155">一单要支持多房号</text>
</svg>
