<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">专题地图：九页、七段链、三个口径</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">左边是业务链，右边是本册的九页分工；五页的主题是「失败很安静」</text>
<rect x="24" y="70" width="330" height="118" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="89" font-size="11.5" font-weight="700" fill="#1e3a8a">七段链（业务侧）</text>
<text x="34" y="104" font-size="9.8" fill="#334155">排房 → 定价 → 预订 → 入住</text>
<text x="34" y="118" font-size="9.8" fill="#334155">在住 → 夜审 → 离店</text>
<text x="34" y="132" font-size="9.8" fill="#334155">每一步改三个数中的一个</text>
<rect x="24" y="200" width="330" height="118" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="34" y="219" font-size="11.5" font-weight="700" fill="#115e59">三个「还剩几间房」</text>
<text x="34" y="234" font-size="9.8" fill="#334155">物理 12,000 / 可售 11,880</text>
<text x="34" y="248" font-size="9.8" fill="#334155">已售 9,100 / 余量 2,780</text>
<text x="34" y="262" font-size="9.8" fill="#334155">分母不同，结论不同</text>
<rect x="24" y="330" width="330" height="78" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="349" font-size="11.5" font-weight="700" fill="#881337">五个安静的失败</text>
<text x="34" y="364" font-size="9.8" fill="#334155">超卖 / 价格顺序 / 夜审重跑 / 佣金 / 间夜归月</text>
<rect x="396" y="70" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="406" y="89" font-size="10.5" font-weight="700" fill="#4c1d95">总览</text>
<text x="406" y="104" font-size="9" fill="#334155">HPO</text>
<rect x="514" y="70" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="524" y="89" font-size="10.5" font-weight="700" fill="#4c1d95">房量与房态</text>
<text x="524" y="104" font-size="9" fill="#334155">HPR</text>
<rect x="632" y="70" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="642" y="89" font-size="10.5" font-weight="700" fill="#4c1d95">价格日历</text>
<text x="642" y="104" font-size="9" fill="#334155">HPP</text>
<rect x="396" y="144" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="406" y="163" font-size="10.5" font-weight="700" fill="#4c1d95">预订</text>
<text x="406" y="178" font-size="9" fill="#334155">HPB</text>
<rect x="514" y="144" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="524" y="163" font-size="10.5" font-weight="700" fill="#4c1d95">入住与在住</text>
<text x="524" y="178" font-size="9" fill="#334155">HPC</text>
<rect x="632" y="144" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="642" y="163" font-size="10.5" font-weight="700" fill="#4c1d95">夜审与间夜</text>
<text x="642" y="178" font-size="9" fill="#334155">HPN</text>
<rect x="396" y="218" width="108" height="62" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="406" y="237" font-size="10.5" font-weight="700" fill="#4c1d95">渠道与对账</text>
<text x="406" y="252" font-size="9" fill="#334155">HPX</text>
<rect x="514" y="218" width="108" height="62" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="524" y="237" font-size="10.5" font-weight="700" fill="#78350f">实战</text>
<text x="524" y="252" font-size="9" fill="#334155">HPT</text>
<rect x="632" y="218" width="108" height="62" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="642" y="237" font-size="10.5" font-weight="700" fill="#78350f">常见问题</text>
<text x="642" y="252" font-size="9" fill="#334155">HPQ</text>
<line x1="354" y1="129" x2="394" y2="101" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="354" y1="259" x2="394" y2="175" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)" stroke-dasharray="5 4"/>
<text x="396" y="310" font-size="10" fill="#475569" text-anchor="start">本册 9 页 / 9 族 72 条判据；每页 8 条（A~H）</text>
<text x="396" y="332" font-size="9.5" fill="#64748b" text-anchor="start">虚线：口径问题向下传导到具体页面</text>
</svg>
