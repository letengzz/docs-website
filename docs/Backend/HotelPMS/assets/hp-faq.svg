<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">分诊：从「谁的数字对不上」开始</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">酒店系统报错少、数字错多；入口不是异常堆栈，是两个数之差</text>
<rect x="24" y="80" width="200" height="64" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="99" font-size="11.5" font-weight="700" fill="#881337">现象</text>
<text x="34" y="114" font-size="9.8" fill="#334155">客人到店无房 / 房价差几十</text>
<rect x="250" y="80" width="200" height="64" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="260" y="99" font-size="11.5" font-weight="700" fill="#78350f">先查哪张表</text>
<text x="260" y="114" font-size="9.8" fill="#334155">avail_daily / room_night</text>
<rect x="476" y="80" width="260" height="64" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="486" y="99" font-size="11.5" font-weight="700" fill="#1e3a8a">再判口径</text>
<text x="486" y="114" font-size="9.8" fill="#334155">按物理还是按可售</text>
<line x1="224" y1="112" x2="248" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="450" y1="112" x2="474" y2="112" stroke="#64748b" stroke-width="1.2" marker-end="url(#arw)"/>
<rect x="24" y="176" width="150" height="36" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="195" font-size="10.5" font-weight="700" fill="#881337">1 止损</text>
<text x="190" y="199" font-size="10" fill="#334155" text-anchor="start">关渠道 / 停夜审 / 锁房源</text>
<rect x="24" y="220" width="150" height="36" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="34" y="239" font-size="10.5" font-weight="700" fill="#78350f">2 导出</text>
<text x="190" y="243" font-size="10" fill="#334155" text-anchor="start">当日快照先留证</text>
<rect x="24" y="264" width="150" height="36" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="283" font-size="10.5" font-weight="700" fill="#1e3a8a">3 定位</text>
<text x="190" y="287" font-size="10" fill="#334155" text-anchor="start">哪两个数字对不上</text>
<rect x="24" y="308" width="150" height="36" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="34" y="327" font-size="10.5" font-weight="700" fill="#115e59">4 回放</text>
<text x="190" y="331" font-size="10" fill="#334155" text-anchor="start">单条订单重算</text>
<rect x="24" y="352" width="150" height="36" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="34" y="371" font-size="10.5" font-weight="700" fill="#4c1d95">5 补断言</text>
<text x="190" y="375" font-size="10" fill="#334155" text-anchor="start">修完补一条能变红的</text>
<text x="24" y="400" font-size="10" fill="#881337" font-weight="700" text-anchor="start">第 1 步最常被跳过：工程师习惯先查日志，而房态系统每继续卖一次都在产生新的错数据</text>
</svg>
