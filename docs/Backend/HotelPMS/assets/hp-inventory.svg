<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">房态：三种表示、两层约束</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">行数不是重点，「能回答什么问题」才是</text>
<rect x="24" y="76" width="230" height="92" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="95" font-size="11.5" font-weight="700" fill="#881337">字段 room.status</text>
<text x="34" y="110" font-size="9.8" fill="#334155">100 行</text>
<text x="34" y="124" font-size="9.8" fill="#334155">答：这间房此刻什么状态</text>
<text x="34" y="138" font-size="9.8" fill="#334155">不答：明天还剩几间</text>
<rect x="266" y="76" width="230" height="92" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="276" y="95" font-size="11.5" font-weight="700" fill="#78350f">区间 reservation</text>
<text x="276" y="110" font-size="9.8" fill="#334155">5,347 段</text>
<text x="276" y="124" font-size="9.8" fill="#334155">答：这单住了哪几晚</text>
<text x="276" y="138" font-size="9.8" fill="#334155">不答：某日总可售</text>
<rect x="508" y="76" width="228" height="92" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="518" y="95" font-size="11.5" font-weight="700" fill="#115e59">房-日格 room_night</text>
<text x="518" y="110" font-size="9.8" fill="#334155">12,000 格（实售 5,296）</text>
<text x="518" y="124" font-size="9.8" fill="#334155">答：任意日剩几间</text>
<text x="518" y="138" font-size="9.8" fill="#334155">不答：一段的连续性</text>
<text x="24" y="196" font-size="9.8" fill="#475569" text-anchor="start">区间两两判重叠 = 5,347 × 5,346 / 2 = 14,292,531 对；房-日格只需一次索引命中</text>
<rect x="24" y="218" width="350" height="104" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="237" font-size="11.5" font-weight="700" fill="#1e3a8a">约束一：ux_room_night</text>
<text x="34" y="252" font-size="9.8" fill="#334155">UNIQUE(room_id, stay_date)</text>
<text x="34" y="266" font-size="9.8" fill="#334155">挡「同一间房同夜两拨人」</text>
<text x="34" y="280" font-size="9.8" fill="#334155">挡不住房型超量</text>
<rect x="392" y="218" width="344" height="104" rx="8" fill="#f5f3ff" stroke="#9d8fd0" stroke-width="1.1"/>
<text x="402" y="237" font-size="11.5" font-weight="700" fill="#4c1d95">约束二：avail_daily 触发器</text>
<text x="402" y="252" font-size="9.8" fill="#334155">sold 累加 + 上限校验</text>
<text x="402" y="266" font-size="9.8" fill="#334155">挡「房型超卖」</text>
<text x="402" y="280" font-size="9.8" fill="#334155">挡不住同房分给两个订单</text>
<text x="24" y="348" font-size="10.5" fill="#881337" font-weight="700" text-anchor="start">两层都要，且都必须在数据库里：应用层的 if 在并发下一定被穿透</text>
<rect x="24" y="362" width="712" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
<text x="34" y="381" font-size="11.5" font-weight="700" fill="#0f172a">20 线程抢 1 间（栅栏卡在「查过之后、写之前」）</text>
<text x="34" y="396" font-size="9.8" fill="#334155">先查后改：7 个线程认为成功，终值 sold=7 → 超卖 6 间    条件更新：1 个成功，sold=1 → 超卖 0 间</text>
</svg>
