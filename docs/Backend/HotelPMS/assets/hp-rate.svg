<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#0f172a">价格日历：四维输入与两条派生顺序</text>
<text x="24" y="50" font-size="10.5" fill="#64748b">固定金额的附加费必须在折扣之后相加——顺序错则 42.75% 的订单受影响</text>
<rect x="24" y="76" width="168" height="76" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="34" y="95" font-size="11.5" font-weight="700" fill="#1e3a8a">维度 1：stay_date</text>
<text x="34" y="110" font-size="9.8" fill="#334155">一天一价，不是一段一价</text>
<rect x="204" y="76" width="168" height="76" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="214" y="95" font-size="11.5" font-weight="700" fill="#1e3a8a">维度 2：room_type</text>
<text x="214" y="110" font-size="9.8" fill="#334155">房型是价格的第二维</text>
<rect x="384" y="76" width="168" height="76" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="394" y="95" font-size="11.5" font-weight="700" fill="#1e3a8a">维度 3：条件</text>
<text x="394" y="110" font-size="9.8" fill="#334155">人数 / 餐包 / 取消政策</text>
<rect x="564" y="76" width="172" height="76" rx="8" fill="#eef4ff" stroke="#7f9cd6" stroke-width="1.1"/>
<text x="574" y="95" font-size="11.5" font-weight="700" fill="#1e3a8a">维度 4：渠道</text>
<text x="574" y="110" font-size="9.8" fill="#334155">直销 / OTA / 协议 / 会员</text>
<rect x="24" y="180" width="340" height="96" rx="8" fill="#fff1f2" stroke="#d99aa3" stroke-width="1.1"/>
<text x="34" y="199" font-size="11.5" font-weight="700" fill="#881337">顺序 A（错）</text>
<text x="34" y="214" font-size="9.8" fill="#334155">(bar + bf) × 0.92 × 0.88</text>
<text x="34" y="228" font-size="9.8" fill="#334155">餐包也被打了 88 折</text>
<text x="34" y="242" font-size="9.8" fill="#334155">5,993,698.19</text>
<rect x="396" y="180" width="340" height="96" rx="8" fill="#ecfdf5" stroke="#6bbfa4" stroke-width="1.1"/>
<text x="406" y="199" font-size="11.5" font-weight="700" fill="#115e59">顺序 B（对）</text>
<text x="406" y="214" font-size="9.8" fill="#334155">bar × 0.92 × 0.88 + bf</text>
<text x="406" y="228" font-size="9.8" fill="#334155">餐包按成本原价加回</text>
<text x="406" y="242" font-size="9.8" fill="#334155">6,034,657.81</text>
<text x="24" y="302" font-size="10.5" fill="#881337" font-weight="700" text-anchor="start">差 +40,959.62 元（+0.6834%），受影响 855 单（42.75%），单笔最大差 106.63 元</text>
<rect x="24" y="320" width="712" height="92" rx="8" fill="#fffbeb" stroke="#d9b166" stroke-width="1.1"/>
<text x="34" y="339" font-size="11.5" font-weight="700" fill="#78350f">锁价：订单必须冻结快照</text>
<text x="34" y="354" font-size="9.8" fill="#334155">reservation.sell_total（整单，用于收款与开票） 与 room_night.rate（逐夜，用于夜审与跨月拆分）各存一份</text>
<text x="34" y="368" font-size="9.8" fill="#334155">不变量：SUM(room_night.rate) = sell_total；调价后历史订单金额必须不变</text>
</svg>
