<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">服务注册与发现：谁在哪儿、是否健康、调哪个实例</text>
  <!-- 注册中心 -->
  <rect x="290" y="55" width="260" height="95" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="420" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">注册中心（Nacos）</text>
  <text x="420" y="105" text-anchor="middle" font-size="11" fill="#6b7280">服务名 → 实例列表</text>
  <text x="420" y="124" text-anchor="middle" font-size="11" fill="#6b7280">心跳健康检查 · 命名空间/分组隔离</text>
  <text x="420" y="143" text-anchor="middle" font-size="10" fill="#8b5cf6">注册表：order-service → 10.0.0.2:8080 / 10.0.0.3:8080</text>
  <!-- 提供方 -->
  <rect x="60" y="220" width="300" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="210" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">库存服务 stock-service</text>
  <text x="210" y="270" text-anchor="middle" font-size="11" fill="#4b5563">实例 A：10.0.0.2:8080（健康）</text>
  <text x="210" y="289" text-anchor="middle" font-size="11" fill="#4b5563">实例 B：10.0.0.3:8080（健康）</text>
  <!-- 调用方 -->
  <rect x="480" y="220" width="300" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="630" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">订单服务 order-service</text>
  <text x="630" y="270" text-anchor="middle" font-size="11" fill="#4b5563">启动时注册自己</text>
  <text x="630" y="289" text-anchor="middle" font-size="11" fill="#4b5563">调用前查 stock-service 实例列表</text>
  <!-- 箭头 -->
  <path d="M 210 213 C 210 155 330 155 345 152" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="205" y="170" font-size="11" fill="#059669">① register + 心跳</text>
  <path d="M 630 213 C 630 160 550 155 535 152" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="520" y="170" font-size="11" fill="#4338ca">② 查实例 / 订阅变化</text>
  <path d="M 630 235 L 420 235 L 405 232" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="520" y="215" font-size="11" fill="#4338ca">③ 返回实例列表</text>
  <!-- 调用 -->
  <path d="M 475 265 L 365 265" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#amber)"/>
  <text x="420" y="258" text-anchor="middle" font-size="11" fill="#b45309">④ OpenFeign + LoadBalancer 选实例发起调用</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#475569">实例故障 → Nacos 心跳超时自动摘除 → 调用方不再路由到故障实例</text>
  <defs>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
