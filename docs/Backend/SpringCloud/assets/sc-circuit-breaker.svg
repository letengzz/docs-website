<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">熔断器三态转换与请求处理</text>
  <!-- CLOSED -->
  <rect x="55" y="100" width="210" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <text x="160" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">CLOSED 关闭</text>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#4b5563">请求正常放行</text>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#4b5563">滑动窗口统计失败率/慢调用</text>
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#4b5563">正常 → 保持 CLOSED</text>
  <text x="160" y="212" text-anchor="middle" font-size="10" fill="#059669">失败率 ≥ 阈值 → 转 OPEN</text>
  <!-- OPEN -->
  <rect x="315" y="100" width="210" height="120" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="420" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">OPEN 打开</text>
  <text x="420" y="154" text-anchor="middle" font-size="11" fill="#4b5563">请求直接快速失败</text>
  <text x="420" y="172" text-anchor="middle" font-size="11" fill="#4b5563">不发起真实下游调用</text>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#4b5563">走 fallback 降级</text>
  <text x="420" y="212" text-anchor="middle" font-size="10" fill="#dc2626">等待窗口结束 → 半开</text>
  <!-- HALF_OPEN -->
  <rect x="575" y="100" width="210" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="680" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">HALF_OPEN 半开</text>
  <text x="680" y="154" text-anchor="middle" font-size="11" fill="#4b5563">放行少量探测请求</text>
  <text x="680" y="172" text-anchor="middle" font-size="11" fill="#4b5563">验证下游是否恢复</text>
  <text x="680" y="194" text-anchor="middle" font-size="11" fill="#4b5563">成功 → CLOSED</text>
  <text x="680" y="212" text-anchor="middle" font-size="10" fill="#b45309">再失败 → OPEN</text>
  <!-- arrows -->
  <path d="M 270 145 L 310 145" stroke="#ef4444" stroke-width="2.5" marker-end="url(#red)"/>
  <path d="M 530 145 L 570 145" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#amber)"/>
  <path d="M 660 230 C 600 285 300 285 240 235" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
  <text x="420" y="272" text-anchor="middle" font-size="12" fill="#065f46">探测成功 → 关闭并重置统计</text>
  <text x="420" y="294" text-anchor="middle" font-size="12" fill="#475569">配合：超时 3s · 重试最多 3 次 · 信号量/线程池隔离 · 限流保护</text>
  <rect x="100" y="320" width="640" height="55" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="343" text-anchor="middle" font-size="12" fill="#334155">fallback：返回缓存 / 提示“服务繁忙” / 记录告警 → 用户拿到的永远是“及时、可解释”的结果</text>
  <text x="420" y="362" text-anchor="middle" font-size="11" fill="#6b7280">注意：业务校验异常要用 ignoreExceptions 排除，不要误触发熔断</text>
  <defs>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
