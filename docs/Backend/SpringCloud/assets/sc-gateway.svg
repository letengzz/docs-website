<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="420" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Spring Cloud Gateway：路由匹配与过滤器链</text>
  <!-- 客户端 -->
  <rect x="30" y="105" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">客户端</text>
  <text x="100" y="155" text-anchor="middle" font-size="10" fill="#6b7280">/api/order/1</text>
  <!-- 网关三段 -->
  <rect x="220" y="45" width="180" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Route 路由匹配</text>
  <text x="310" y="93" text-anchor="middle" font-size="11" fill="#6b7280">Predicate：Path、Method</text>
  <text x="310" y="111" text-anchor="middle" font-size="10" fill="#6b7280">Header、Query、时间</text>
  <rect x="220" y="155" width="180" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="310" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">Filter 过滤器链</text>
  <text x="310" y="203" text-anchor="middle" font-size="11" fill="#6b7280">鉴权 / 限流 / 改写</text>
  <text x="310" y="221" text-anchor="middle" font-size="10" fill="#6b7280">GlobalFilter + 局部 Filter</text>
  <rect x="220" y="265" width="180" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="310" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">转发下游</text>
  <text x="310" y="313" text-anchor="middle" font-size="11" fill="#6b7280">uri: lb://order-service</text>
  <text x="310" y="331" text-anchor="middle" font-size="10" fill="#6b7280">LoadBalancer 选实例</text>
  <path d="M 175 140 H 216" stroke="#6366f1" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M 310 130 V 151" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
  <path d="M 310 240 V 261" stroke="#ec4899" stroke-width="2" marker-end="url(#pink)"/>
  <!-- 服务 -->
  <rect x="480" y="255" width="320" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">下游微服务实例（order-service / stock-service / ...）</text>
  <text x="640" y="307" text-anchor="middle" font-size="11" fill="#4b5563">由注册中心提供健康实例列表</text>
  <text x="640" y="327" text-anchor="middle" font-size="11" fill="#4b5563">StripPrefix=1 后转发：/api/order/1 → /order/1</text>
  <text x="640" y="345" text-anchor="middle" font-size="10" fill="#6b7280">网关侧统一：JWT 校验 · 限流 · 日志 · 跨域</text>
  <path d="M 405 305 H 476" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#violet)"/>
  <!-- 示例路径 -->
  <rect x="90" y="360" width="660" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="387" text-anchor="middle" font-size="12" fill="#334155">Path=/api/order/** 命中 → 过滤器：鉴权、限流 → lb://order-service → /order/1</text>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ec4899"/>
    </marker>
    <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
