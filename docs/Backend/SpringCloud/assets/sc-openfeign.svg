<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="410" fill="#ffffff"/>
  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">OpenFeign 声明式调用：从接口到 HTTP 请求</text>
  <!-- 业务代码 -->
  <rect x="45" y="70" width="170" height="105" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">订单服务业务代码</text>
  <text x="130" y="122" text-anchor="middle" font-size="11" fill="#6b7280">stockClient.getStock(id)</text>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#6b7280">只写接口，不关心</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#6b7280">IP 与负载均衡</text>
  <!-- Feign 接口 -->
  <rect x="265" y="70" width="170" height="105" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="350" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">Feign 接口</text>
  <text x="350" y="120" text-anchor="middle" font-size="11" fill="#6b7280">@FeignClient(name=</text>
  <text x="350" y="137" text-anchor="middle" font-size="11" fill="#6b7280">"stock-service")</text>
  <text x="350" y="157" text-anchor="middle" font-size="11" fill="#6b7280">@GetMapping("/api/stock")</text>
  <!-- 动态代理 -->
  <rect x="485" y="70" width="170" height="105" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="570" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Feign 动态代理</text>
  <text x="570" y="122" text-anchor="middle" font-size="11" fill="#6b7280">注解 → HTTP 请求</text>
  <text x="570" y="142" text-anchor="middle" font-size="11" fill="#6b7280">Encoder / Decoder</text>
  <text x="570" y="160" text-anchor="middle" font-size="11" fill="#6b7280">日志 / 拦截器</text>
  <!-- 提供方 -->
  <rect x="620" y="250" width="190" height="85" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="715" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">库存服务实例</text>
  <text x="715" y="298" text-anchor="middle" font-size="11" fill="#4b5563">实例 A：10.0.0.2:8080</text>
  <text x="715" y="316" text-anchor="middle" font-size="11" fill="#4b5563">实例 B：10.0.0.3:8080</text>
  <!-- LoadBalancer -->
  <rect x="280" y="250" width="280" height="85" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">LoadBalancer 选实例</text>
  <text x="420" y="300" text-anchor="middle" font-size="11" fill="#6b7280">从注册中心拉取 stock-service 列表</text>
  <text x="420" y="318" text-anchor="middle" font-size="11" fill="#6b7280">策略：轮询 / 随机 / Zone / 权重</text>
  <path d="M 215 123 L 260 123" stroke="#6366f1" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M 440 123 L 480 123" stroke="#6366f1" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M 655 178 L 655 246" stroke="#ec4899" stroke-width="2" marker-end="url(#pink)"/>
  <text x="670" y="215" font-size="11" fill="#be185d">HTTP /api/stock/{id}</text>
  <path d="M 420 340 L 660 338" stroke="#10b981" stroke-width="2" marker-end="url(#green)"/>
  <text x="540" y="360" text-anchor="middle" font-size="11" fill="#047857">响应 → 解码器 → 返回 StockDTO</text>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ec4899"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
