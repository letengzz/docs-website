<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#334155;font-weight:600}.s{font-size:12px;fill:#475569}.box{fill:#F8FAFC;stroke:#CBD5E1;rx:10}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.violet{fill:#F5F3FF;stroke:#8B5CF6}.line{stroke:#94A3B8;fill:none;stroke-width:2}.tag{font-size:12px;fill:#64748B}</style>
<rect width="920" height="580" fill="#FFFFFF"/>
<text x="460" y="38" text-anchor="middle" class="h">引擎与业务系统的边界：三个聚合、两类事务</text>
<text x="460" y="62" text-anchor="middle" class="tag">引擎库只是「流程的形状」，业务库才是「业务的事实」——两者不能放进同一个事务里假装原子</text>

<rect x="40" y="86" width="390" height="200" rx="10" class="box blue"/>
<text x="60" y="114" class="lt">业务库（事实权威源）</text>
<rect x="60" y="130" width="350" height="46" rx="8" class="box"/>
<text x="235" y="152" text-anchor="middle" class="s">posts：标题 / 正文 / 状态 / 可见性</text>
<text x="235" y="170" text-anchor="middle" class="s">（状态是业务事实，不是流程状态）</text>
<rect x="60" y="186" width="350" height="46" rx="8" class="box"/>
<text x="235" y="208" text-anchor="middle" class="s">review_records：审批留痕（谁·何时·意见）</text>
<text x="235" y="226" text-anchor="middle" class="s">被退回也要留一条，不允许覆盖</text>
<rect x="60" y="242" width="350" height="34" rx="8" class="box"/>
<text x="235" y="264" text-anchor="middle" class="s">business_key ↔ 流程实例 id 的映射列</text>

<rect x="490" y="86" width="390" height="200" rx="10" class="box amber"/>
<text x="510" y="114" class="lt">引擎库（流程的形状）</text>
<rect x="510" y="130" width="350" height="46" rx="8" class="box"/>
<text x="685" y="152" text-anchor="middle" class="s">ACT_RU_*：当前在谁的待办里</text>
<text x="685" y="170" text-anchor="middle" class="s">流程变量、执行流、任务</text>
<rect x="510" y="186" width="350" height="46" rx="8" class="box"/>
<text x="685" y="208" text-anchor="middle" class="s">ACT_HI_*：流转轨迹与耗时</text>
<text x="685" y="226" text-anchor="middle" class="s">办结后仍在，供审计与报表</text>
<rect x="510" y="242" width="350" height="34" rx="8" class="box"/>
<text x="685" y="264" text-anchor="middle" class="s">流程定义版本（VERSION_）</text>

<rect x="40" y="306" width="410" height="130" rx="10" class="box green"/>
<text x="60" y="334" class="lt">事务 A：业务写 + 推进流程</text>
<text x="60" y="360" class="s">同一数据源时可同事务提交：</text>
<text x="60" y="382" class="s">「落库 → 完成任务」要么都成功，要么都回滚。</text>
<text x="60" y="406" class="s" fill="#047857">这是 Flowable/Camunda 7 嵌入式形态的最大优势。</text>

<rect x="470" y="306" width="410" height="130" rx="10" class="box rose"/>
<text x="490" y="334" class="lt">事务 B：流程 → 外部副作用</text>
<text x="490" y="360" class="s">发通知、调支付、清缓存无法回滚，</text>
<text x="490" y="382" class="s">必须走「本地事件表 + 异步消费」两阶段：</text>
<text x="490" y="406" class="s" fill="#B91C1C">在提交事务里写事件行，事务外消费且消费幂等。</text>

<rect x="40" y="456" width="840" height="106" rx="10" class="box violet"/>
<text x="60" y="484" class="lt">版本与存量实例：流程定义升级后，正在跑的实例怎么办</text>
<text x="60" y="510" class="s">默认行为：存量实例继续按「旧版本定义」走完，新实例走新版本——这是安全默认，但会导致「同一流程两种行为」并存</text>
<text x="60" y="534" class="s">需要统一时必须做实例迁移（migration）：先盘点落在差异节点上的实例数，再决定「等待跑完」还是「批量迁移」，不要一键全迁</text>
</svg>
