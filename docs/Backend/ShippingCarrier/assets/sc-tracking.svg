<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">轨迹归一：九个状态、三个写入规则与两个读数</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">乱序不是数据丢失，是排序问题；后果与丢失相同</text>
  <text x="30" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">九个归一状态（承运商 10~40 个原始词收敛到此）</text>
  <text x="130" y="104" text-anchor="middle" font-size="9" fill="#475569" font-weight="bold">前段</text>
  <rect x="30" y="112" width="200" height="38" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="130" y="130.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">CREATED</text>
  <rect x="30" y="158" width="200" height="38" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="130" y="176.2" text-anchor="middle" font-size="9" fill="#155E75" font-weight="bold">COLLECTED</text>
  <rect x="30" y="204" width="200" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="222.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">IN_TRANSIT</text>
  <text x="366" y="104" text-anchor="middle" font-size="9" fill="#475569" font-weight="bold">中段</text>
  <rect x="266" y="112" width="200" height="38" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="366" y="130.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">ARRIVED</text>
  <rect x="266" y="158" width="200" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="366" y="176.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">OUT_FOR_DELIVERY</text>
  <rect x="266" y="204" width="200" height="38" rx="8" fill="#F7FEE7" stroke="#65A30D" stroke-width="1.6"/>
  <text x="366" y="222.2" text-anchor="middle" font-size="9" fill="#3F6212" font-weight="bold">PICKUP</text>
  <text x="602" y="104" text-anchor="middle" font-size="9" fill="#475569" font-weight="bold">终段</text>
  <rect x="502" y="112" width="200" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="602" y="130.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">SIGNED</text>
  <rect x="502" y="158" width="200" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="602" y="176.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">REJECTED</text>
  <rect x="502" y="204" width="200" height="38" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="602" y="222.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">RETURNED</text>
  <text x="380" y="262" text-anchor="middle" font-size="9" fill="#334155">中间态可被终态覆盖（优先级），跨天变化以 event_time 为准</text>
  <line x1="30" y1="276" x2="730" y2="276" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="298" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">三个写入规则</text>
  <rect x="30" y="308" width="700" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="44" y="325" text-anchor="start" font-size="8.5" fill="#334155">① 写入只追加，不排序；任何「最后一条」显式 order by event_time</text>
  <rect x="30" y="336" width="700" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="44" y="353" text-anchor="start" font-size="8.5" fill="#334155">② 去重键 = (waybill_no, event_time, state_norm)，三者缺一必虚增</text>
  <rect x="30" y="364" width="700" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="44" y="381" text-anchor="start" font-size="8.5" fill="#334155">③ event_time 与 received_at 分列，否则延迟与乱序不可区分</text>
  <text x="30" y="412" text-anchor="start" font-size="9" fill="#B91C1C">本机读数：10,000 单 / 78,135 条事件 → 末条不一致 3.17%，重推虚增 3.78%</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
