<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战的七步流水、三条验收断言与工程体量</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">正向跑通只证明有 happy path，负向用例才证明守卫真的在拦</text>
  <rect x="30" y="82" width="170" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="115" y="100.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">① 建发货单</text>
  <text x="115" y="117" text-anchor="middle" font-size="7.5" fill="#334155">shipment/parcel</text>
  <rect x="212" y="82" width="170" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="297" y="100.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 取号</text>
  <text x="297" y="117" text-anchor="middle" font-size="7.5" fill="#1D4ED8">waybill</text>
  <rect x="394" y="82" width="170" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="479" y="100.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">③ 渲染打印</text>
  <text x="479" y="117" text-anchor="middle" font-size="7.5" fill="#6D28D9">label_print</text>
  <rect x="576" y="82" width="170" height="72" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="661" y="100.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">④ 交接</text>
  <text x="661" y="117" text-anchor="middle" font-size="7.5" fill="#0E7490">collected_at</text>
  <line x1="200" y1="118" x2="210" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="382" y1="118" x2="392" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="564" y1="118" x2="574" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="176" width="220" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="140" y="194.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 轨迹</text>
  <text x="140" y="211" text-anchor="middle" font-size="7.5" fill="#B45309">track_event</text>
  <rect x="270" y="176" width="220" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="194.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑥ 异常/签收</text>
  <text x="380" y="211" text-anchor="middle" font-size="7.5" fill="#B91C1C">exception_case</text>
  <rect x="510" y="176" width="220" height="72" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="620" y="194.2" text-anchor="middle" font-size="10" fill="#9D174D" font-weight="bold">⑦ 对账</text>
  <text x="620" y="211" text-anchor="middle" font-size="7.5" fill="#BE185D">recon_diff</text>
  <line x1="115" y1="154" x2="115" y2="172" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="300" y="200" text-anchor="middle" font-size="8.5" fill="#64748B">只有第 ② 步调外部接口</text>
  <text x="30" y="278" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">三条验收断言（收工判据）</text>
  <rect x="30" y="288" width="120" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="90" y="304" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">A2 一致</text>
  <rect x="158" y="288" width="572" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="172" y="304" text-anchor="start" font-size="8.5" fill="#334155">签收 ⇒ DELIVERED，期望 0 行</text>
  <rect x="30" y="318" width="120" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="90" y="334" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">A4 轨迹</text>
  <rect x="158" y="318" width="572" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="172" y="334" text-anchor="start" font-size="8.5" fill="#334155">末态与运单状态一致率 ≥ 99.0%</text>
  <rect x="30" y="348" width="120" height="24" rx="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="90" y="364" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">A6 对账</text>
  <rect x="158" y="348" width="572" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="172" y="364" text-anchor="start" font-size="8.5" fill="#334155">行级差异 ≤ 5%，OTHER 占比 ≤ 5%</text>
  <text x="30" y="400" text-anchor="start" font-size="9" fill="#334155">五张迁移 → 11 张表；三段 pytest 7 个用例；十二条负向用例必须全部按期望失败</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
