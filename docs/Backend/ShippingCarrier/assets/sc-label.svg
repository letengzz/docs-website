  <rect x="320" y="100" width="400" height="96" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <rect x="332" y="112" width="40" height="72" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="3 3"/>
