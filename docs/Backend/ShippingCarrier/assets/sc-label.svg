  <text x="352" y="196" text-anchor="middle" font-size="8" fill="#B91C1C">10X</text>
  <text x="688" y="196" text-anchor="middle" font-size="8" fill="#B91C1C">10X</text>
  <text x="510" y="214" text-anchor="middle" font-size="8.5" fill="#334155">X = 0.30mm 时每侧 3.00 mm，两侧合计 6.00 mm</text>
  <text x="320" y="246" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">缩放面单 = 同时压窄模块与留白（203 dpi 换算）</text>
  <rect x="320" y="258" width="400" height="22" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="340" y="273" text-anchor="start" font-size="8" fill="#1E293B" font-weight="bold">100%</text>
  <text x="400" y="273" text-anchor="start" font-size="8" fill="#334155">模块 0.300 mm</text>
  <text x="530" y="273" text-anchor="start" font-size="8" fill="#334155">静区 3.00 / 侧</text>
  <text x="660" y="273" text-anchor="start" font-size="8" fill="#1E293B">正常</text>
  <rect x="320" y="284" width="400" height="22" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="340" y="299" text-anchor="start" font-size="8" fill="#1E293B" font-weight="bold">90%</text>
  <text x="400" y="299" text-anchor="start" font-size="8" fill="#334155">模块 0.270 mm</text>
  <text x="530" y="299" text-anchor="start" font-size="8" fill="#334155">静区 2.70 / 侧</text>
  <text x="660" y="299" text-anchor="start" font-size="8" fill="#1E293B">需实测</text>
  <rect x="320" y="310" width="400" height="22" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="340" y="325" text-anchor="start" font-size="8" fill="#1E293B" font-weight="bold">85%</text>
  <text x="400" y="325" text-anchor="start" font-size="8" fill="#334155">模块 0.255 mm</text>
  <text x="530" y="325" text-anchor="start" font-size="8" fill="#334155">静区 2.55 / 侧</text>
  <text x="660" y="325" text-anchor="start" font-size="8" fill="#1E293B">贴近下限</text>
  <rect x="320" y="336" width="400" height="22" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="340" y="351" text-anchor="start" font-size="8" fill="#991B1B" font-weight="bold">80%</text>
  <text x="400" y="351" text-anchor="start" font-size="8" fill="#B91C1C">模块 0.240 mm</text>
  <text x="530" y="351" text-anchor="start" font-size="8" fill="#B91C1C">静区 2.40 / 侧</text>
  <text x="660" y="351" text-anchor="start" font-size="8" fill="#991B1B">低于 0.250 下限</text>
  <text x="320" y="394" text-anchor="start" font-size="9" fill="#B91C1C">塞不下就换模板，不要缩放：留白不能靠缩获得</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
