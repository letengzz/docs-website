<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">面单的区域划分、静区几何与缩放代价</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">标准定的是区域与尺寸上限，工程要守的是「机器读得到」</text>
  <rect x="40" y="76" width="230" height="300" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="40" y="70" text-anchor="start" font-size="8.5" fill="#334155">一联 ≤ 100 × 130 mm（±1.0）</text>
  <rect x="52" y="88" width="206" height="46" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="155" y="115" text-anchor="middle" font-size="8" fill="#1E3A8A">码号区：运单号条码 + 二维码</text>
  <rect x="52" y="146" width="206" height="46" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="155" y="173" text-anchor="middle" font-size="8" fill="#115E59">目的地信息区：分拣码</text>
  <rect x="52" y="204" width="206" height="46" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="155" y="231" text-anchor="middle" font-size="8" fill="#5B21B6">收件人信息区：脱敏电话</text>
  <rect x="52" y="262" width="206" height="46" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
  <text x="155" y="289" text-anchor="middle" font-size="8" fill="#92400E">内件信息区 / 业务处理区</text>
  <rect x="52" y="320" width="206" height="46" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.2"/>
  <text x="155" y="347" text-anchor="middle" font-size="8" fill="#1E293B">签收区 + 自定义区</text>
