<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="366" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选渠道的四段与两个硬门槛</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先筛可达与时效，再比价：顺序反了就会选出「便宜但发不出去」的渠道</text>
  <rect x="14" y="74" width="172" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="100" y="92.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 地址归一</text>
  <text x="100" y="109" text-anchor="middle" font-size="7.5" fill="#1D4ED8">省市区 + 详细地址</text>
  <text x="100" y="126.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">归一失败的进人工核查</text>
  <rect x="204" y="74" width="172" height="84" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="290" y="92.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">② 可达判定</text>
  <text x="290" y="109" text-anchor="middle" font-size="7.5" fill="#4338CA">停派 / 超区 / 限运</text>
  <text x="290" y="126.25" text-anchor="middle" font-size="7.5" fill="#4338CA">不可达直接淘汰</text>
  <rect x="394" y="74" width="172" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="480" y="92.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">③ 计费重</text>
  <text x="480" y="109" text-anchor="middle" font-size="7.5" fill="#6D28D9">max(实重, 体积重)</text>
  <text x="480" y="126.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">体积重 = 长宽高 / 系数</text>
  <rect x="584" y="74" width="172" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="670" y="92.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 运价与时效</text>
  <text x="670" y="109" text-anchor="middle" font-size="7.5" fill="#0F766E">分区价 × 计费重</text>
  <text x="670" y="126.25" text-anchor="middle" font-size="7.5" fill="#0F766E">承诺时效与截单时间</text>
  <line x1="186" y1="116" x2="204" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="116" x2="394" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="566" y1="116" x2="584" y2="116" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="14" y="190" width="354" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="191" y="208.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">两个硬门槛</text>
  <text x="191" y="225" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 不可达不进比价（再多钱也发不出去）</text>
  <text x="191" y="242.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 超承诺时效不进候选（宁可报贵）</text>
  <rect x="392" y="190" width="354" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="569" y="208.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">选渠道的口径</text>
  <text x="569" y="225" text-anchor="middle" font-size="7.5" fill="#334155">先筛后比价，不是先比价后筛</text>
  <text x="569" y="242.25" text-anchor="middle" font-size="7.5" fill="#334155">筛掉的渠道要留原因，否则对账说不清</text>
  <rect x="14" y="282" width="732" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="300.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">同一件货、同一目的地，四个渠道给出四个价差 30% 的原因</text>
  <text x="380" y="317" text-anchor="middle" font-size="7.5" fill="#B45309">计费重的系数不同（5000 / 6000）、分区表不同、附加费口径不同 —— 三者必须分开比</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
