<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="428" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">承运商账单的四个层次与六类差异归口</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">对账的目标不是算出同一个数，而是把每一行的差额归到可反驳的理由上</text>
  <text x="30" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">账单四层：只有两层能完全独立重算</text>
  <rect x="30" y="96" width="380" height="38" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="220" y="114.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">④ 税</text>
  <text x="398" y="120" text-anchor="end" font-size="7.5" fill="#475569">可重算</text>
  <rect x="30" y="142" width="380" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="220" y="160.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">③ 调整项（重量复核/地址更正）</text>
  <text x="398" y="166" text-anchor="end" font-size="7.5" fill="#475569">只能验依据</text>
  <rect x="30" y="188" width="380" height="38" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="220" y="206.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">② 附加费（燃油/偏远/旺季）</text>
  <text x="398" y="212" text-anchor="end" font-size="7.5" fill="#475569">靠合同费率表</text>
  <rect x="30" y="234" width="380" height="38" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="220" y="252.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">① 基础运费（计费重×分区×费率）</text>
  <text x="398" y="258" text-anchor="end" font-size="7.5" fill="#475569">可重算</text>
  <text x="30" y="300" text-anchor="start" font-size="9" fill="#334155">重算的三把尺子：计费重 / 分区版本 / 费率生效区间</text>
  <text x="30" y="320" text-anchor="start" font-size="8.5" fill="#334155">本机：20,000 件 ÷6000 体积重胜出 50.01%，平均增重 1.796 kg</text>
  <text x="30" y="338" text-anchor="start" font-size="8.5" fill="#334155">0.5kg 向上 83,522.0 对四舍五入 78,543.5，差 6.34%</text>
  <text x="440" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">六类差异归口</text>
  <rect x="440" y="96" width="140" height="42" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="510" y="114.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">重量差异</text>
  <rect x="590" y="96" width="140" height="42" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="660" y="114.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">分区差异</text>
  <rect x="440" y="148" width="140" height="42" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="510" y="166.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">费率差异</text>
  <rect x="590" y="148" width="140" height="42" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="660" y="166.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">附加费差异</text>
  <rect x="440" y="200" width="140" height="42" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.6"/>
  <text x="510" y="218.2" text-anchor="middle" font-size="9" fill="#9D174D" font-weight="bold">重复计费</text>
  <rect x="590" y="200" width="140" height="42" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="660" y="218.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">缺失计费</text>
  <rect x="30" y="360" width="700" height="56" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="380" y="382" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">只比总额 ≈ 没对账：3,000 行里 150 行有错，总额只差 +38.68 元（0.02%）</text>
  <text x="380" y="402" text-anchor="middle" font-size="9" fill="#334155">75 行多收、75 行少收 —— 正负相抵是账单最天然的自卫机制</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
