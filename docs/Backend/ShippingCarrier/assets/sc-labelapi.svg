<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">取号的三种模式、幂等三元组与号池四态</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">超时是常态：没有幂等键时，每一次超时都必然多一张运单</text>
  <text x="30" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">三种取号模式</text>
  <rect x="30" y="96" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="130" y="114.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">实时取号</text>
  <text x="130" y="131" text-anchor="middle" font-size="7.5" fill="#1D4ED8">出库时调接口</text>
  <text x="130" y="148.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">抖动即阻塞出库</text>
  <rect x="30" y="172" width="200" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="130" y="190.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">号池预取</text>
  <text x="130" y="207" text-anchor="middle" font-size="7.5" fill="#0F766E">批量预取号</text>
  <text x="130" y="224.25" text-anchor="middle" font-size="7.5" fill="#0F766E">要管有效期</text>
  <rect x="30" y="248" width="200" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="130" y="266.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">离线号段</text>
  <text x="130" y="283" text-anchor="middle" font-size="7.5" fill="#B45309">自己按规则生成</text>
  <text x="130" y="300.25" text-anchor="middle" font-size="7.5" fill="#B45309">校验位必须自算</text>
  <text x="266" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">幂等：一个 key 一条约束</text>
  <rect x="266" y="96" width="200" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="366" y="114.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">生成 client_ref</text>
  <text x="366" y="131" text-anchor="middle" font-size="7.5" fill="#334155">= shipment:parcel</text>
  <line x1="366" y1="158" x2="366" y2="172" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="266" y="172" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="366" y="190.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">调取号接口</text>
  <text x="366" y="207" text-anchor="middle" font-size="7.5" fill="#1D4ED8">成功 / 超时 / 拒绝</text>
  <line x1="366" y1="234" x2="366" y2="248" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="266" y="248" width="200" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="366" y="266.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">超时：同 key 重试</text>
  <text x="366" y="283" text-anchor="middle" font-size="7.5" fill="#B91C1C">绝不新建</text>
  <line x1="366" y1="310" x2="366" y2="324" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="266" y="324" width="200" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="366" y="342.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">成功：写 waybill_no</text>
  <text x="366" y="359" text-anchor="middle" font-size="7.5" fill="#047857">unique(client_ref)</text>
  <text x="502" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">号池四态（单向）</text>
  <rect x="502" y="96" width="228" height="50" rx="8" fill="#F7FEE7" stroke="#65A30D" stroke-width="1.6"/>
  <text x="616" y="114.2" text-anchor="middle" font-size="9" fill="#3F6212" font-weight="bold">AVAILABLE</text>
  <text x="616" y="131" text-anchor="middle" font-size="7.5" fill="#4D7C0F">按 expire_at 升序领</text>
  <rect x="502" y="158" width="228" height="50" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="616" y="176.2" text-anchor="middle" font-size="9" fill="#155E75" font-weight="bold">RESERVED</text>
  <text x="616" y="193" text-anchor="middle" font-size="7.5" fill="#0E7490">已发号未打印</text>
  <rect x="502" y="220" width="228" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="616" y="238.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">PRINTED</text>
  <text x="616" y="255" text-anchor="middle" font-size="7.5" fill="#6D28D9">已打印未交接</text>
  <rect x="502" y="282" width="228" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="616" y="300.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">USED</text>
  <text x="616" y="317" text-anchor="middle" font-size="7.5" fill="#334155">已交接，不可作废</text>
  <line x1="722" y1="146" x2="722" y2="158" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="722" y1="208" x2="722" y2="220" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="30" y1="330" x2="730" y2="330" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="352" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">本机读数（1,000 单，接口超时后重投 3 次）</text>
  <text x="30" y="372" text-anchor="start" font-size="9" fill="#B91C1C">无唯一键：落 3,000 行，1,000 单全部拿到多个运单号</text>
  <text x="30" y="392" text-anchor="start" font-size="9" fill="#065F46">UNIQUE(client_ref)：落 1,000 行，每单一个号</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
