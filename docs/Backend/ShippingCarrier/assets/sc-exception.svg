<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="432" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">异常件的三段判定窗口与承诺日三口径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「迟了 / 没了 / 坏了」变成有窗口、有判据、有话术的三个状态</text>
  <text x="30" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">丢失判定：三段窗口</text>
  <rect x="30" y="96" width="700" height="16" rx="3" fill="#E2E8F0"/>
  <rect x="30" y="96" width="233" height="16" rx="3" fill="#DBEAFE"/>
  <rect x="263" y="96" width="233" height="16" fill="#FDE68A"/>
  <rect x="496" y="96" width="234" height="16" rx="3" fill="#FECACA"/>
  <text x="146" y="130" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">0 ~ 24h　OBSERVE</text>
  <text x="380" y="130" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">24 ~ 72h　QUERYING</text>
  <text x="613" y="130" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">&gt; 72h　FILED</text>
  <text x="146" y="148" text-anchor="middle" font-size="8" fill="#334155">只登记，不通知客户</text>
  <text x="380" y="148" text-anchor="middle" font-size="8" fill="#334155">发承运商查询单</text>
  <text x="613" y="148" text-anchor="middle" font-size="8" fill="#334155">立案 + 赔付流程</text>
  <text x="30" y="186" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">承诺日三口径（本机 8,000 单、T+3）</text>
  <rect x="30" y="198" width="220" height="66" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="140" y="216.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">自然日</text>
  <text x="140" y="233" text-anchor="middle" font-size="7.5" fill="#B91C1C">发货日 + 3 天</text>
  <text x="140" y="250.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">36.71% 落在非工作日</text>
  <rect x="270" y="198" width="220" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="216.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">工作日</text>
  <text x="380" y="233" text-anchor="middle" font-size="7.5" fill="#047857">跳过周末 + 节假日</text>
  <text x="380" y="250.25" text-anchor="middle" font-size="7.5" fill="#047857">0.00% 落在非工作日</text>
  <rect x="510" y="198" width="220" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="620" y="216.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">时段</text>
  <text x="620" y="233" text-anchor="middle" font-size="7.5" fill="#0F766E">工作日 + 18 点截单</text>
  <text x="620" y="250.25" text-anchor="middle" font-size="7.5" fill="#0F766E">边界更细，需截单表</text>
  <text x="30" y="302" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">「没扫描」≠「丢了」：同一批 5,000 单的两种判法</text>
  <rect x="30" y="312" width="340" height="88" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="200" y="334" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">24h 一刀切</text>
  <text x="200" y="354" text-anchor="middle" font-size="8.5" fill="#334155">命中 83 单（1.66%）｜真丢失 27 单</text>
  <text x="200" y="374" text-anchor="middle" font-size="8.5" fill="#B91C1C">准确率 32.53% → 三分之二是误判</text>
  <rect x="390" y="312" width="340" height="88" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="560" y="334" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">三段窗口</text>
  <text x="560" y="354" text-anchor="middle" font-size="8.5" fill="#334155">观察 → 查询 → 立案，每段对应一个动作</text>
  <text x="560" y="374" text-anchor="middle" font-size="8.5" fill="#065F46">误判随窗口收窄下降（用误判率复盘 SQL 验证）</text>
  <text x="380" y="420" text-anchor="middle" font-size="9" fill="#334155">判据：签收才是终局；立案之前先算「最后轨迹 + 承诺时效 + 查询结果」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
