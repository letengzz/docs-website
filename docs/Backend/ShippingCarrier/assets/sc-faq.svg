<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">交付问题的分诊决策树与止血五步</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">十二行现象里十行的答案在你自己库里 —— 查清楚再打电话</text>
  <rect x="300" y="76" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">客户说没收到</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">先分类，不要先打电话</text>
  <line x1="380" y1="128" x2="107" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="160" width="134" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="107" y="178.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">系统里没单</text>
  <text x="107" y="195" text-anchor="middle" font-size="7.5" fill="#1D4ED8">查 waybill 与</text>
  <text x="107" y="212.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">order_request</text>
  <line x1="380" y1="128" x2="289" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="222" y="160" width="134" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="289" y="178.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">有单没扫描</text>
  <text x="289" y="195" text-anchor="middle" font-size="7.5" fill="#B45309">查 dispatched_at</text>
  <text x="289" y="212.25" text-anchor="middle" font-size="7.5" fill="#B45309">与 collected_at</text>
  <line x1="380" y1="128" x2="471" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="404" y="160" width="134" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="471" y="178.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">有轨迹无末态</text>
  <text x="471" y="195" text-anchor="middle" font-size="7.5" fill="#B91C1C">按 event_time</text>
  <text x="471" y="212.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">重排末条</text>
  <line x1="380" y1="128" x2="653" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="586" y="160" width="134" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="653" y="178.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">签收了但客户说没</text>
  <text x="653" y="195" text-anchor="middle" font-size="7.5" fill="#6D28D9">查签收人</text>
  <text x="653" y="212.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">与代收点</text>
  <text x="380" y="262" text-anchor="middle" font-size="9" fill="#334155">四条分支覆盖十二类现象里的十类；剩下两类是「钱」（账单）与「话术」（承诺日）</text>
  <line x1="30" y1="278" x2="730" y2="278" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="300" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">止血五步（顺序固定）</text>
  <text x="30" y="320" text-anchor="start" font-size="8.5" fill="#334155">① 冻结写入（停掉会放大错误的任务）</text>
  <text x="390" y="320" text-anchor="start" font-size="8.5" fill="#334155">② 量口径（一条 SQL 数出影响多少单、多少钱）</text>
  <text x="30" y="344" text-anchor="start" font-size="8.5" fill="#334155">③ 定段（十二行分诊表 → 表与字段）</text>
  <text x="390" y="344" text-anchor="start" font-size="8.5" fill="#334155">④ 补证据（打印记录 / 实测值 / 查询单号）</text>
  <text x="30" y="368" text-anchor="start" font-size="8.5" fill="#334155">⑤ 对外（先给可兑现的新时间，再谈责任）</text>
  <text x="30" y="396" text-anchor="start" font-size="9" fill="#B91C1C">反例：故障期间顺手优化 / 重新发一单掩盖 / 24h 内就通知「丢件了」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
