<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 604" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:13px;fill:#334155;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11px;fill:#64748B}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.slate{fill:#F1F5F9;stroke:#94A3B8}.hd{fill:#0F172A}</style>
<rect width="920" height="604" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">网关安全：三层边界 + 一层审计</text>
<text x="460" y="56" text-anchor="middle" class="tag">网关只能做「与业务无关」的判断 —— 越界去做细粒度授权，就是在网关与服务之间留一条缝</text>

<rect x="40" y="78" width="840" height="26" class="hd"/>
<text x="115" y="96" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">边界</text>
<text x="315" y="96" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">网关侧的载体</text>
<text x="555" y="96" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">边界到哪为止</text>
<text x="775" y="96" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">最常见的失效 → 事故形态</text>

<rect x="40" y="104" width="150" height="76" class="blue"/>
<text x="115" y="132" text-anchor="middle" class="lt">网络边界</text>
<text x="115" y="152" text-anchor="middle" class="tag">谁的网络能连过来</text>
<text x="115" y="170" text-anchor="middle" class="tag">暴露面可枚举</text>
<rect x="190" y="104" width="250" height="76" class="box"/>
<text x="315" y="130" text-anchor="middle" class="s">IP 黑白名单 / mTLS</text>
<text x="315" y="152" text-anchor="middle" class="tag">TLS 版本与密码套件</text>
<text x="315" y="172" text-anchor="middle" class="tag">Admin API 只允许内网访问</text>
<rect x="440" y="104" width="230" height="76" class="box"/>
<text x="555" y="130" text-anchor="middle" class="s">到「请求能不能到达应用」</text>
<text x="555" y="152" text-anchor="middle" class="tag">为止</text>
<rect x="670" y="104" width="210" height="76" class="box"/>
<text x="775" y="130" text-anchor="middle" class="s">为临时排查把管理端口</text>
<text x="775" y="152" text-anchor="middle" class="tag">开给 0.0.0.0/0</text>
<text x="775" y="172" text-anchor="middle" class="tag">→ 网关配置权限被公网掌握</text>

<rect x="40" y="180" width="150" height="76" class="amber"/>
<text x="115" y="208" text-anchor="middle" class="lt">认证</text>
<text x="115" y="228" text-anchor="middle" class="tag">Authentication</text>
<text x="115" y="246" text-anchor="middle" class="tag">「你是谁」</text>
<rect x="190" y="180" width="250" height="76" class="box"/>
<text x="315" y="206" text-anchor="middle" class="s">API Key / JWT / OIDC / mTLS / Basic</text>
<text x="315" y="228" text-anchor="middle" class="tag">本地验签（快，不能发现吊销）</text>
<text x="315" y="248" text-anchor="middle" class="tag">远端 introspection（准，多一次往返）</text>
<rect x="440" y="180" width="230" height="76" class="box"/>
<text x="555" y="206" text-anchor="middle" class="s">到「令牌是否有效」为止</text>
<text x="555" y="228" text-anchor="middle" class="tag">必须校验 iss / aud / exp</text>
<text x="555" y="248" text-anchor="middle" class="tag">算法写死，不由令牌声明</text>
<rect x="670" y="180" width="210" height="76" class="box"/>
<text x="775" y="206" text-anchor="middle" class="s">只解析 payload 不验签名</text>
<text x="775" y="228" text-anchor="middle" class="tag">不校验 iss/aud</text>
<text x="775" y="248" text-anchor="middle" class="tag">→ 为其它系统签发的令牌可直用</text>

<rect x="40" y="256" width="150" height="76" class="green"/>
<text x="115" y="284" text-anchor="middle" class="lt">授权</text>
<text x="115" y="304" text-anchor="middle" class="tag">Authorization</text>
<text x="115" y="322" text-anchor="middle" class="tag">「你能干什么」</text>
<rect x="190" y="256" width="250" height="76" class="box"/>
<text x="315" y="282" text-anchor="middle" class="s">只做粗粒度</text>
<text x="315" y="304" text-anchor="middle" class="tag">路径级 / 接口类别级 scope / 角色级</text>
<text x="315" y="324" text-anchor="middle" class="tag">细粒度（这条数据属于谁）必须留服务</text>
<rect x="440" y="256" width="230" height="76" class="box"/>
<text x="555" y="282" text-anchor="middle" class="s">到「这个身份能不能访问</text>
<text x="555" y="304" text-anchor="middle" class="tag">这一类接口」为止</text>
<text x="555" y="324" text-anchor="middle" class="tag">不得基于数据</text>
<rect x="670" y="256" width="210" height="76" class="box"/>
<text x="775" y="282" text-anchor="middle" class="s">授权被切成两半</text>
<text x="775" y="304" text-anchor="middle" class="tag">网关判路径 + 服务判数据</text>
<text x="775" y="324" text-anchor="middle" class="tag">→ 缝隙就是越权漏洞的产地</text>

<rect x="40" y="332" width="150" height="76" class="rose"/>
<text x="115" y="360" text-anchor="middle" class="lt">请求限制</text>
<text x="115" y="380" text-anchor="middle" class="tag">把攻击面收窄在入口</text>
<text x="115" y="398" text-anchor="middle" class="tag">唯一的硬边界</text>
<rect x="190" y="332" width="250" height="76" class="box"/>
<text x="315" y="358" text-anchor="middle" class="s">请求体大小 / 头大小与数量</text>
<text x="315" y="380" text-anchor="middle" class="tag">URI 长度 / 允许的方法</text>
<text x="315" y="400" text-anchor="middle" class="tag">URI 拦截器（.git / .env / 调试端点）</text>
<rect x="440" y="332" width="230" height="76" class="box"/>
<text x="555" y="358" text-anchor="middle" class="s">到「畸形请求进不了后端」</text>
<text x="555" y="380" text-anchor="middle" class="tag">为止</text>
<text x="555" y="400" text-anchor="middle" class="tag">超限返回 413，不是 502</text>
<rect x="670" y="332" width="210" height="76" class="box"/>
<text x="775" y="358" text-anchor="middle" class="s">前端限制了就以为够了</text>
<text x="775" y="380" text-anchor="middle" class="tag">超限返回 502 被误判为后端问题</text>
<text x="775" y="400" text-anchor="middle" class="tag">→ 排障方向一开始就是错的</text>

<rect x="40" y="408" width="840" height="72" class="slate"/>
<text x="115" y="436" text-anchor="middle" class="lt">审计层</text>
<text x="115" y="456" text-anchor="middle" class="tag">横切以上四层</text>
<text x="115" y="472" text-anchor="middle" class="tag">事后唯一的证据</text>
<text x="190" y="434" class="s">访问日志：谁访问了哪个接口、结果如何 —— 失败原因要记全（401 与 403 的分布本身就是一个信号）</text>
<text x="190" y="456" class="tag">凭证绝不落盘：只记「存在与类型」（如 auth=Bearer、api_key_id 的哈希前 8 位）</text>
<text x="190" y="476" class="tag">最低要求：日志写到「被审计对象拿不到」的地方，否则有人恶意操作时等于不存在</text>

<rect x="40" y="488" width="412" height="104" class="rose"/>
<text x="246" y="512" text-anchor="middle" class="lt">网关自己会变成攻击载荷：SSRF</text>
<text x="64" y="534" class="tag">危险来源：上游地址 / 重定向目标 / 镜像目标</text>
<text x="64" y="552" class="tag">被请求参数决定 → 诱导网关去请求内网或云元数据</text>
<text x="64" y="572" class="tag">防线一：网络策略禁止访问元数据地址（硬边界）</text>
<text x="64" y="586" class="tag">防线二：上游/重定向/镜像目标全部来自配置</text>

<rect x="468" y="488" width="412" height="104" class="amber"/>
<text x="674" y="512" text-anchor="middle" class="lt">最常见的一笔安全债：上游 TLS 校验被关掉</text>
<text x="492" y="534" class="tag">为了让自签名的上游「先跑起来」，把 verify 关掉</text>
<text x="492" y="552" class="tag">这一行会一直留在生产环境（中间人风险）</text>
<text x="492" y="572" class="tag">正确做法：显式配置受信任的 CA 与正确主机名</text>
<text x="492" y="586" class="tag">APISIX 3.19 起，这条从「静默」变成「升级即 502」</text>
</svg>
