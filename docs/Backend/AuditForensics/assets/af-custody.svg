<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img">
<title>保管链五环：每环带上前一环的摘要</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="820" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">保管链五环：每环带上前一环的摘要</text>
<rect x="24" y="84" width="144" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="96.0" y="120.0" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">① export</text>
<text x="96.0" y="139.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">取证工程师</text>
<line x1="169" y1="128" x2="178" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="180" y="84" width="144" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="252.0" y="120.0" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">② verify</text>
<text x="252.0" y="139.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">第二人复核</text>
<line x1="325" y1="128" x2="334" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="336" y="84" width="144" height="88" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="408.0" y="120.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">③ receive</text>
<text x="408.0" y="139.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">法务 / 合规</text>
<line x1="481" y1="128" x2="490" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="492" y="84" width="144" height="88" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="564.0" y="120.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">④ store</text>
<text x="564.0" y="139.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">档案管理</text>
<line x1="637" y1="128" x2="646" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="648" y="84" width="144" height="88" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="720.0" y="120.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">⑤ ack</text>
<text x="720.0" y="139.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">外部接收方</text>
<text x="24" y="206" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">每环四要素：谁、何时、做了什么、前一环摘要（prev_digest = 上一环 digest）</text>
<rect x="24" y="224" width="372" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="210.0" y="264.0" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缺环三种形状</text>
<text x="210.0" y="283.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">跳级 / 断链 / 时间倒挂</text>
<rect x="424" y="224" width="372" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="610.0" y="264.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三种都能一条 SQL 查出</text>
<text x="610.0" y="283.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">LAG(digest) + LAG(at) 窗口函数</text>
<text x="24" y="352" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">时间线重建：流内用 seq（时钟 σ=5 ms 时按 ts 排序有 23.51% 相邻逆序），跨流用 request_id 归组。</text>
<text x="24" y="376" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">纸质件只承载签章、不承载哈希校验——把它当主证据，等于放弃整条链。</text>
<text x="24" y="400" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">介质编号、存放位置、保留期必须入账，物理安全是保管链的一部分。</text>
</svg>