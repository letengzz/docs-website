<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img">
<title>三类保留期与冻结的交集决定处置动作</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="820" height="450" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三类保留期与冻结的交集决定处置动作</text>
<rect x="24" y="76" width="250" height="300" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="42" y="106" font-size="13" fill="#b45309" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">保留期依据</text>
<text x="42" y="128" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">日志 6 个月 / 交易 5 年</text>
<text x="40" y="140" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">网络日志 ≥ 180 天</text>
<text x="40" y="168" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">交易记录 ≥ 5 年</text>
<text x="40" y="196" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">会计凭证 10 / 30 年</text>
<text x="40" y="224" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">合同：至时效届满</text>
<text x="40" y="264" font-size="11.5" fill="#b91c1c" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">起算点必须写明</text>
<text x="40" y="288" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">（事件 / 期末 / 关系结束）</text>
<rect x="300" y="76" width="240" height="300" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="420.0" y="218.0" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">冻结 legal_hold</text>
<text x="420.0" y="237.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">hold_to 为空视为永久</text>
<rect x="566" y="76" width="230" height="140" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="681.0" y="138.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三种回答</text>
<text x="681.0" y="157.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">已删除 / 将于 X 日后 / 依法不能删</text>
<rect x="566" y="236" width="230" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="681.0" y="298.0" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测比例</text>
<text x="681.0" y="317.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">5000 请求 → 83.26% 被阻断</text>
<text x="24" y="408" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分层：热 90 天 + 温 1 年 + 冷至期满 → 月成本 5.32 → 2.02（省 62%），代价是取证要解冻。</text>
<text x="24" y="432" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">销毁交付「清单」而非结论：主库 / 备份 / 缓存 / 下游，四个层面各自签字。</text>
</svg>