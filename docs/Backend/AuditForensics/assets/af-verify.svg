<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img">
<title>校验的三条路径与一处盲区</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="820" height="440" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">校验的三条路径与一处盲区</text>
<rect x="24" y="76" width="250" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="114.0" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">单条 / 区间</text>
<text x="149.0" y="133.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">重算该段哈希，微秒到毫秒</text>
<rect x="24" y="190" width="250" height="92" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="149.0" y="228.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">全链复算</text>
<text x="149.0" y="247.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">20 万条 1538.6 ms；一年 46.8 分钟</text>
<rect x="24" y="304" width="250" height="92" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="149.0" y="342.0" font-size="13" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">锚点对齐</text>
<text x="149.0" y="361.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">只比两个数字，常数成本</text>
<rect x="310" y="76" width="486" height="92" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="553.0" y="114.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分段校验：每 1000 条一个 checkpoint</text>
<text x="553.0" y="133.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">实测 7.42 ms / 段，比全链快 207 倍</text>
<rect x="310" y="190" width="486" height="92" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="553.0" y="228.0" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">失败四级</text>
<text x="553.0" y="247.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">HASH_MISMATCH / BROKEN_LINK / TAIL_TRUNCATED / ANCHOR_MISMATCH</text>
<rect x="310" y="304" width="486" height="92" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="553.0" y="342.0" font-size="13" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">盲区：链自校验挡不住截断</text>
<text x="553.0" y="361.0" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">截 1 / 100 / 5000 条，三种情况全部判 OK</text>
<text x="24" y="424" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">触发点：每天（对齐）· 取证前（全链）· 恢复后（全链）· 迁移后（全链 + 锚点）</text>
</svg>