<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img">
<title>七段链：留、链、锚、验、取、出、证</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="820" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">七段链：留、链、锚、验、取、出、证</text>
<rect x="24" y="74" width="100" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="74.0" y="114.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">留 Record</text>
<text x="74.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">五元组 + actor 三层</text>
<line x1="125" y1="122.0" x2="134" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="136" y="74" width="100" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="186.0" y="114.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">链 Chain</text>
<text x="186.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">前驱哈希，可定位</text>
<line x1="237" y1="122.0" x2="246" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="248" y="74" width="100" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="298.0" y="114.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">锚 Anchor</text>
<text x="298.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">链头交给外部</text>
<line x1="349" y1="122.0" x2="358" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="360" y="74" width="100" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="410.0" y="114.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">验 Verify</text>
<text x="410.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">每日对齐 + 分段</text>
<line x1="461" y1="122.0" x2="470" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="472" y="74" width="100" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="522.0" y="114.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">取 Access</text>
<text x="522.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">案件 + 目的 + 留痕</text>
<line x1="573" y1="122.0" x2="582" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="584" y="74" width="100" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="634.0" y="114.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">出 Export</text>
<text x="634.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">六件物料可复现</text>
<line x1="685" y1="122.0" x2="694" y2="122.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="696" y="74" width="100" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="746.0" y="114.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">证 Custody</text>
<text x="746.0" y="133.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">五环交接</text>
<text x="24" y="200" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">每段的失败都是安静的，除了「验」与「证」——而这两段最容易被跳过。</text>
<rect x="24" y="222" width="372" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="42" y="252" font-size="14" fill="#2563eb" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">前三段：让记录成立　留 → 链 → 锚</text>
<rect x="424" y="222" width="372" height="210" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="442" y="252" font-size="14" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">后四段：让证明成立　验 → 取 → 出 → 证</text>
<text x="44" y="276" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">留：主语记错，后面全白做</text>
<text x="44" y="302" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">链：改中间能定位，改末尾不能</text>
<text x="44" y="328" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">锚：唯一能发现截断的手段</text>
<text x="44" y="364" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">失败形态：表在涨、行数对、监控绿</text>
<text x="444" y="276" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">验：每日对齐是常数成本</text>
<text x="444" y="302" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">取：读的人被谁看</text>
<text x="444" y="328" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">出：两次导出必须同哈希</text>
<text x="444" y="354" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">证：五环缺一环，前面全废</text>
<text x="444" y="386" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">失败形态：包发出去了，对方不收</text>
</svg>