<text x="24" y="434" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">易变元数据放 manifest.meta，不参与总哈希；exporter_version 必须进包。</text>
