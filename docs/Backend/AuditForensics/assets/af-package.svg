<text x="610.0" y="346.0" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">不可复现：含导出时刻</text>
