<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" role="img" aria-label="三条上传链路、预签名锁住的四项与分片续传">
  <rect x="0" y="0" width="1000" height="630" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0f172a">三条上传链路：谁承担带宽，谁承担授权</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">
    <text x="40" y="66" font-size="14" font-weight="700" fill="#0f172a">A. 服务端代理流式转发</text>
    <rect x="40" y="76" width="110" height="38" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="95" y="100" text-anchor="middle" fill="#075985">客户端</text>
    <line x1="152" y1="95" x2="214" y2="95" stroke="#0284c7" stroke-width="1.6"/>
    <polygon points="214,91 224,95 214,99" fill="#0284c7"/>
    <rect x="224" y="76" width="110" height="38" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="279" y="100" text-anchor="middle" fill="#075985">应用</text>
    <line x1="336" y1="95" x2="398" y2="95" stroke="#0284c7" stroke-width="1.6"/>
    <polygon points="398,91 408,95 398,99" fill="#0284c7"/>
    <rect x="408" y="76" width="110" height="38" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="463" y="100" text-anchor="middle" fill="#075985">桶</text>
    <text x="534" y="92" fill="#0c4a6e">应用承担全部带宽；超时与重试都在应用上</text>
    <text x="534" y="112" fill="#0369a1">适合 ≤ 5 MB 且必须即时校验内容的场景</text>

    <text x="40" y="152" font-size="14" font-weight="700" fill="#0f172a">B. 服务端中转（先落临时盘）</text>
    <rect x="40" y="162" width="110" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="95" y="186" text-anchor="middle" fill="#166534">客户端</text>
    <line x1="152" y1="181" x2="214" y2="181" stroke="#16a34a" stroke-width="1.6"/>
    <polygon points="214,177 224,181 214,185" fill="#16a34a"/>
    <rect x="224" y="162" width="110" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="279" y="186" text-anchor="middle" fill="#166534">应用</text>
    <line x1="336" y1="181" x2="384" y2="181" stroke="#16a34a" stroke-width="1.6"/>
    <polygon points="384,177 394,181 384,185" fill="#16a34a"/>
    <rect x="394" y="162" width="80" height="38" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="434" y="186" text-anchor="middle" fill="#854d0e">临时盘</text>
    <line x1="476" y1="181" x2="524" y2="181" stroke="#16a34a" stroke-width="1.6"/>
    <polygon points="524,177 534,181 524,185" fill="#16a34a"/>
    <rect x="534" y="162" width="80" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="574" y="186" text-anchor="middle" fill="#166534">桶</text>
    <text x="640" y="178" fill="#14532d">可「先落盘再决定」（病毒扫描 / 转码）</text>
    <text x="640" y="198" fill="#15803d">代价：临时盘容量 + 两次 I/O + 多实例不共享</text>

    <text x="40" y="238" font-size="14" font-weight="700" fill="#0f172a">C. 预签名直传（推荐默认）</text>
    <rect x="40" y="248" width="110" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="95" y="272" text-anchor="middle" fill="#5b21b6">客户端</text>
    <line x1="152" y1="267" x2="214" y2="267" stroke="#7c3aed" stroke-width="1.6"/>
    <polygon points="214,263 224,267 214,271" fill="#7c3aed"/>
    <text x="188" y="258" text-anchor="middle" font-size="11" fill="#6d28d9">① 请求签名</text>
    <rect x="224" y="248" width="110" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="279" y="272" text-anchor="middle" fill="#5b21b6">应用（只签名）</text>
    <line x1="152" y1="300" x2="650" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="654,296 664,300 654,304" fill="#7c3aed"/>
    <text x="400" y="320" text-anchor="middle" font-size="11.5" fill="#6d28d9">② 字节直传（应用不承担带宽）</text>
    <rect x="664" y="248" width="90" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="709" y="272" text-anchor="middle" fill="#5b21b6">桶</text>
    <text x="770" y="256" fill="#4c1d95">③ 服务端 commit：</text>
    <text x="782" y="274" fill="#4c1d95">存在性 → 大小 → 校验和 → 归属</text>
    <text x="770" y="296" fill="#6d28d9">④ pending → active</text>
    <text x="782" y="314" fill="#6d28d9">（条件更新，幂等）</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="344" width="450" height="196" rx="10" fill="#ffffff" stroke="#16a34a"/>
    <text x="60" y="370" font-size="14" font-weight="700" fill="#166534">预签名「锁住了」四项</text>
    <text x="60" y="396" font-size="12.5" fill="#14532d">· 方法：PUT 的 URL 不能拿来 GET</text>
    <text x="60" y="420" font-size="12.5" fill="#14532d">· 桶 + key：一个 URL 只对一个对象有效</text>
    <text x="60" y="444" font-size="12.5" fill="#14532d">· 过期：X-Amz-Expires，长期凭证上限 7 天</text>
    <text x="60" y="468" font-size="12.5" fill="#14532d">· 签进去的头：客户端必须原样发送</text>
    <text x="60" y="500" font-size="12" fill="#64748b">临时凭证（STS）签的 URL 随令牌失效，往往远早于 7 天</text>
    <text x="60" y="524" font-size="12" fill="#64748b">控制台签发只能 1 分钟 ~ 12 小时</text>

    <rect x="510" y="344" width="450" height="196" rx="10" fill="#ffffff" stroke="#dc2626"/>
    <text x="530" y="370" font-size="14" font-weight="700" fill="#991b1b">预签名「锁不住」三项</text>
    <text x="530" y="396" font-size="12.5" fill="#7f1d1d">· body 大小（PUT）：客户端可传任意大 → 用 POST Policy</text>
    <text x="530" y="420" font-size="12.5" fill="#7f1d1d">· 使用者身份：bearer token，谁拿到谁能用</text>
    <text x="530" y="444" font-size="12.5" fill="#7f1d1d">· 请求次数：有效期内可重复 PUT 覆盖</text>
    <text x="530" y="476" font-size="12" fill="#b91c1c">补法：content-length-range + 短过期 + 一次性随机 key</text>
    <text x="530" y="500" font-size="12" fill="#b91c1c">+ If-None-Match: *（拒绝第二次写入）</text>
    <text x="530" y="524" font-size="12" fill="#b91c1c">+ commit 阶段 HeadObject 复核大小与校验和</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="572" font-size="13" font-weight="700" fill="#0f172a">分片续传：状态只在服务端（uploadId + 每片 ETag）</text>
    <rect x="40" y="584" width="150" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="115" y="604" text-anchor="middle" font-size="11.5" fill="#075985">CreateMultipart</text>
    <rect x="206" y="584" width="150" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="281" y="604" text-anchor="middle" font-size="11.5" fill="#075985">UploadPart × N</text>
    <rect x="372" y="584" width="150" height="30" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="447" y="604" text-anchor="middle" font-size="11.5" fill="#854d0e">ListParts（续传）</text>
    <rect x="538" y="584" width="160" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="618" y="604" text-anchor="middle" font-size="11.5" fill="#166534">CompleteMultipart</text>
    <text x="712" y="604" font-size="11.5" fill="#475569">→ 未 complete 的分片：不出现在 LIST，但一直计费</text>
  </g>
</svg>
