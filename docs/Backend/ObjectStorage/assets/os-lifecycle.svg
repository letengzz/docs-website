<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-label="生命周期四类动作、最小存储期与成本盈亏平衡">
  <rect x="0" y="0" width="1000" height="610" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0f172a">生命周期：四类动作、判定顺序与盈亏平衡</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="66" font-size="14" font-weight="700" fill="#0f172a">① 四类动作（缺一类就是一个账单漏洞）</text>
    <rect x="40" y="78" width="215" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="60" y="102" font-size="12.5" font-weight="700" fill="#075985">Transition</text>
    <text x="60" y="124" font-size="11.5" fill="#0c4a6e">转存储类（当前版本）</text>
    <text x="60" y="146" font-size="11.5" fill="#0369a1">缺：数据永远在 Standard</text>

    <rect x="270" y="78" width="215" height="86" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="290" y="102" font-size="12.5" font-weight="700" fill="#166534">Expiration</text>
    <text x="290" y="124" font-size="11.5" fill="#14532d">过期删除（当前版本）</text>
    <text x="290" y="146" font-size="11.5" fill="#15803d">缺：数据只增不减</text>

    <rect x="500" y="78" width="215" height="86" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="520" y="102" font-size="12.5" font-weight="700" fill="#854d0e">NoncurrentVersion</text>
    <text x="520" y="124" font-size="11.5" fill="#78350f">非当前版本过期</text>
    <text x="520" y="146" font-size="11.5" fill="#b45309">缺：覆盖写 = 存储翻倍</text>

    <rect x="730" y="78" width="230" height="86" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="750" y="102" font-size="12.5" font-weight="700" fill="#991b1b">AbortIncompleteMPU</text>
    <text x="750" y="124" font-size="11.5" fill="#7f1d1d">中止未完成分片</text>
    <text x="750" y="146" font-size="11.5" fill="#b91c1c">缺：分片永久计费且不可见</text>

    <text x="40" y="192" font-size="12.5" font-weight="700" fill="#0f172a">判定顺序：过期 &gt; 转换；同一天命中「转层」与「过期」时，直接删除（不先转一次层）</text>
    <text x="40" y="214" font-size="12" fill="#475569">同前缀两条转换规则都命中时，选「更冷的那个」—— 不是按规则书写顺序</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="252" font-size="14" font-weight="700" fill="#0f172a">② 1 TB 的月成本与「取回多少就不划算」</text>
    <line x1="220" y1="268" x2="220" y2="404" stroke="#cbd5e1"/>

    <text x="210" y="288" text-anchor="end" font-size="12" fill="#334155">Standard</text>
    <rect x="226" y="274" width="235" height="18" rx="3" fill="#0284c7"/>
    <text x="470" y="288" font-size="11.5" fill="#075985">$23.55 / 月 · 无取回费</text>

    <text x="210" y="318" text-anchor="end" font-size="12" fill="#334155">Standard-IA</text>
    <rect x="226" y="304" width="128" height="18" rx="3" fill="#16a34a"/>
    <text x="362" y="318" font-size="11.5" fill="#166534">$12.80 · 取回 $0.01/GB · 盈亏平衡 1,075 GB（105%）</text>

    <text x="210" y="348" text-anchor="end" font-size="12" fill="#334155">Glacier IR</text>
    <rect x="226" y="334" width="41" height="18" rx="3" fill="#d97706"/>
    <text x="276" y="348" font-size="11.5" fill="#92400e">$4.10 · 取回 $0.03/GB · 平衡点 648.5 GB（63.3%）</text>

    <text x="210" y="378" text-anchor="end" font-size="12" fill="#334155">Deep Archive</text>
    <rect x="226" y="364" width="10" height="18" rx="3" fill="#7c3aed"/>
    <text x="246" y="378" font-size="11.5" fill="#5b21b6">$1.01 · 取回 $0.02/GB · 平衡点 1,126.9 GB（110%）</text>

    <text x="40" y="428" font-size="12" fill="#b45309">读法：IA 与 Deep Archive「只要不是每月全量取回一次以上」就赚；GIR 只要月取回 &gt; 63.3% 就亏（它的取回单价是 IA 的 3 倍）</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="466" font-size="14" font-weight="700" fill="#0f172a">③ 最小存储期：为什么「转冷再删」是双倍付费</text>
    <rect x="40" y="478" width="920" height="56" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="60" y="500" font-size="12" fill="#7f1d1d">GIR 最短 90 天：第 1 天转入、第 30 天删除 → 仍按 90 天计费（付了 3 个月的 GIR 费）</text>
    <text x="60" y="522" font-size="12" fill="#7f1d1d">Deep Archive 最短 180 天：第 60 天删 → 付 6 个月；另加每对象约 40 KB 元数据（100 万对象 = 40 GB）</text>

    <text x="40" y="562" font-size="13" font-weight="700" fill="#0f172a">④ 小对象陷阱：128 KB 最小计费</text>
    <text x="40" y="584" font-size="12" fill="#334155">4 KB 对象放 IA / GIR → 计量按 128 KB 算，放大 <tspan font-weight="700" fill="#b91c1c">32 倍</tspan>；10 亿个 4 KB 对象：实际 3.73 TB，按 119.21 TB 计费 → IA 账单 $1,525.9/月，而 Standard 只要 $87.7/月</text>
    <text x="40" y="604" font-size="12" fill="#b45309">对策：规则里加 ObjectSizeGreaterThan: 131072（小于 128 KB 不进冷层）</text>
  </g>
</svg>
