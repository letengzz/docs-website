<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-label="键空间：四段式 key、前缀分布与列举分页">
  <rect x="0" y="0" width="1000" height="610" fill="#f8fafc"/>
  <text x="500" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0f172a">key 是地址：四段构成、前缀分布、列举分页</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="72" font-size="14" font-weight="700" fill="#0f172a">① 四段式 key（顺序可按查询调整，四段都要在）</text>

    <rect x="40" y="86" width="150" height="46" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="115" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#075985">A 隔离段</text>
    <text x="115" y="124" text-anchor="middle" font-size="11.5" fill="#0c4a6e">tenant_id</text>

    <rect x="190" y="86" width="140" height="46" fill="#dcfce7" stroke="#16a34a"/>
    <text x="260" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">B 业务域</text>
    <text x="260" y="124" text-anchor="middle" font-size="11.5" fill="#14532d">attachments /</text>

    <rect x="330" y="86" width="180" height="46" fill="#fef3c7" stroke="#d97706"/>
    <text x="420" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">C 时间分段</text>
    <text x="420" y="124" text-anchor="middle" font-size="11.5" fill="#78350f">yyyy/mm（UTC）</text>

    <rect x="510" y="86" width="250" height="46" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="635" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">D 不可猜段 + 扩展名</text>
    <text x="635" y="124" text-anchor="middle" font-size="11.5" fill="#4c1d95">UUIDv7 / 内容哈希 .ext</text>

    <text x="780" y="106" font-size="12" fill="#475569">缺 D：同名覆盖、可枚举</text>
    <text x="780" y="124" font-size="12" fill="#475569">缺 C：只能按年龄过期</text>
    <text x="780" y="142" font-size="12" fill="#475569">缺 A：删租户靠逐条 LIST</text>

    <text x="40" y="160" font-size="12.5" fill="#0f172a" font-family="Menlo, Consolas, monospace">attachments/3f2a9c10-…/2026/10/018f3b2e-….png</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="206" font-size="14" font-weight="700" fill="#0f172a">② 前缀分布：20 万个 key 的首段占比</text>

    <text x="40" y="236" font-size="12.5" fill="#334155">顺序 key（2026/10/20/…）</text>
    <rect x="220" y="222" width="240" height="20" rx="3" fill="#dc2626"/>
    <text x="468" y="237" font-size="12" font-weight="700" fill="#991b1b">1 个首段 · 100% 集中 · 极差 0</text>

    <text x="40" y="272" font-size="12.5" fill="#334155">哈希前缀（sha256[:2]/…）</text>
    <defs>
      <pattern id="osBins" width="7" height="20" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="4" height="20" fill="#16a34a"/>
      </pattern>
    </defs>
    <rect x="220" y="258" width="240" height="20" rx="3" fill="url(#osBins)" stroke="#15803d" stroke-width="0.5"/>
    <text x="468" y="273" font-size="12" font-weight="700" fill="#15803d">256 个首段 · 最大 0.43% · 极差/均值 0.207</text>

    <text x="40" y="308" font-size="12" fill="#64748b">每前缀约 3,500 次写/秒、5,500 次读/秒（官方口径）；分区分裂是异步的</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="352" font-size="14" font-weight="700" fill="#0f172a">③ 列举：字典序 + 每页 ≤ 1000 + 游标</text>

    <rect x="40" y="368" width="190" height="86" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="135" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">第 1 页</text>
    <text x="135" y="414" text-anchor="middle" font-size="11.5" fill="#334155">MaxKeys=1000</text>
    <text x="135" y="434" text-anchor="middle" font-size="11.5" fill="#334155">IsTruncated=true</text>

    <line x1="232" y1="411" x2="286" y2="411" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="286,407 294,411 286,415" fill="#64748b"/>
    <text x="259" y="402" text-anchor="middle" font-size="11" fill="#475569">token</text>

    <rect x="296" y="368" width="190" height="86" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="391" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">第 2 页</text>
    <text x="391" y="414" text-anchor="middle" font-size="11.5" fill="#334155">ContinuationToken</text>
    <text x="391" y="434" text-anchor="middle" font-size="11.5" fill="#334155">IsTruncated=false → 停</text>

    <rect x="510" y="368" width="450" height="86" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="530" y="392" font-size="12.5" font-weight="700" fill="#991b1b">三个必错点</text>
    <text x="530" y="414" font-size="12" fill="#7f1d1d">① 返回条数 &lt; 1000 就认为结束（错，必须看 IsTruncated）</text>
    <text x="530" y="434" font-size="12" fill="#7f1d1d">② prefix 不以 / 结尾（tenant-a 误伤 tenant-ab）</text>
    <text x="530" y="452" font-size="12" fill="#7f1d1d">③ 用 LIST 当对账真相来源（翻页期间的新写不可靠）</text>
  </g>

  <text x="40" y="490" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f172a">结论：key 一旦写进对象就改不动 —— 改 key 等于全量搬迁</text>
  <text x="40" y="516" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#475569">所以这一页的所有决定都必须在「第一次上传」之前定下来：四段结构、不可猜段、哈希前缀（仅批量写入路径）、不改名只换 key。</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">
    <rect x="40" y="540" width="290" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="60" y="562" font-weight="700" fill="#0f172a">key 不可变</text>
    <text x="60" y="582">内容变了就换 key，缓存层永不需要失效</text>
  </g>
</svg>
