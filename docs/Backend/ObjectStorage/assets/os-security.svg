<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="访问控制四套机制、公开桶四种成因、对象锁与加密">
  <rect x="0" y="0" width="1000" height="600" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0f172a">授权是「并集」，不是「层层加固」</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="60" width="215" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="60" y="84" font-size="12.5" font-weight="700" fill="#075985">IAM 身份策略</text>
    <text x="60" y="106" font-size="11.5" fill="#0c4a6e">作用对象：主体（用户/角色）</text>
    <text x="60" y="126" font-size="11.5" fill="#0c4a6e">只能管本账号</text>
    <text x="60" y="146" font-size="11.5" fill="#0369a1">排查：中</text>

    <rect x="270" y="60" width="215" height="96" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="290" y="84" font-size="12.5" font-weight="700" fill="#991b1b">桶策略</text>
    <text x="290" y="106" font-size="11.5" fill="#7f1d1d">作用对象：桶 / 前缀（资源）</text>
    <text x="290" y="126" font-size="11.5" fill="#7f1d1d">唯一跨账号生效 → 公开桶主因</text>
    <text x="290" y="146" font-size="11.5" fill="#b91c1c">排查：高（Deny 优先）</text>

    <rect x="500" y="60" width="215" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="520" y="84" font-size="12.5" font-weight="700" fill="#854d0e">ACL</text>
    <text x="520" y="106" font-size="11.5" fill="#78350f">作用对象：桶 / 对象</text>
    <text x="520" y="126" font-size="11.5" fill="#78350f">2023-04 起新桶默认禁用</text>
    <text x="520" y="146" font-size="11.5" fill="#b45309">老桶的历史遗留</text>

    <rect x="730" y="60" width="230" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="750" y="84" font-size="12.5" font-weight="700" fill="#5b21b6">预签名 URL</text>
    <text x="750" y="106" font-size="11.5" fill="#4c1d95">作用对象：单对象 + 单次操作</text>
    <text x="750" y="126" font-size="11.5" fill="#4c1d95">上限 = 签名者的权限</text>
    <text x="750" y="146" font-size="11.5" fill="#6d28d9">排查：低（看参数即知）</text>

    <text x="40" y="182" font-size="12.5" fill="#b91c1c" font-weight="700">并集关系：任何一条 Allow 命中即放行（除非有显式 Deny）→ 「IAM 很严」不能抵消「桶策略里的一个 *」</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="218" font-size="14" font-weight="700" fill="#0f172a">公开桶的四种成因</text>
    <rect x="40" y="230" width="450" height="150" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="60" y="254" font-size="12" fill="#7f1d1d">① 桶策略 Principal: "*" + s3:GetObject</text>
    <text x="60" y="278" font-size="12" fill="#7f1d1d">② ACL public-read（老桶 / 有人「省事」开启）</text>
    <text x="60" y="302" font-size="12" fill="#7f1d1d">③ 对象级 ACL（上传时带 x-amz-acl: public-read）</text>
    <text x="60" y="326" font-size="12" fill="#7f1d1d">④ Block Public Access 四项被关（「让 CDN 能读」）</text>
    <text x="60" y="356" font-size="11.5" fill="#991b1b">正确替代：CloudFront OAC 以自身身份签名回源，桶保持私有</text>

    <rect x="510" y="230" width="450" height="150" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="530" y="254" font-size="12.5" font-weight="700" fill="#166534">最小权限的四件事</text>
    <text x="530" y="278" font-size="12" fill="#14532d">· 主体：角色 ARN，不用账号根（:root = 账号内所有主体）</text>
    <text x="530" y="302" font-size="12" fill="#14532d">· 动作：只给 GetObject，不给 s3:*</text>
    <text x="530" y="326" font-size="12" fill="#14532d">· 资源：写到前缀级（……/attachments/tenant-a/*）</text>
    <text x="530" y="350" font-size="12" fill="#14532d">· 条件：SecureTransport / SourceVpce / s3:prefix</text>
    <text x="530" y="370" font-size="11.5" fill="#15803d">Deny 只用于全局不变量（禁明文、禁未加密上传）</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="414" font-size="14" font-weight="700" fill="#0f172a">对象锁：删不掉的字节</text>
    <rect x="40" y="426" width="450" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="60" y="450" font-size="12" fill="#0c4a6e">治理模式：有 BypassGovernanceRetention 的人可解（内部防误删）</text>
    <text x="60" y="472" font-size="12" fill="#0c4a6e">合规模式：没人能解（含根账号），到期前不可删改</text>
    <text x="60" y="494" font-size="11.5" fill="#b91c1c">必须在建桶时开启 + 版本控制；锁定期内生命周期过期不生效</text>

    <text x="510" y="414" font-size="14" font-weight="700" fill="#0f172a">加密三档的副作用</text>
    <rect x="510" y="426" width="450" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="530" y="450" font-size="12" fill="#4c1d95">SSE-S3（默认）：ETag 不变、可去重</text>
    <text x="530" y="472" font-size="12" fill="#4c1d95">SSE-KMS：ETag 不是 MD5、每对象一密钥 → 无法去重</text>
    <text x="530" y="494" font-size="12" fill="#4c1d95">客户端加密：端到端信任；收敛加密才可去重（已知明文风险）</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="40" y="520" width="920" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="60" y="544" font-size="12.5" font-weight="700" fill="#0f172a">审计：默认不开的那一半</text>
    <text x="60" y="566" font-size="11.5" fill="#334155">CloudTrail 管理事件（默认开，免费）只能回答「谁改了配置」；要回答「谁读了这份机密文件」，必须开数据事件（按事件计费）。</text>
    <text x="700" y="566" font-size="11.5" fill="#b91c1c">日志桶自身必须私有</text>
  </g>
</svg>
