<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img">
<title>在线预算怎么分：200 ms 里的四跳</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="360" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">在线预算怎么分：200 ms 里的四跳</text>
<rect x="24" y="72" width="832" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<rect x="24.0" y="72" width="41.6" height="34" fill="#94a3b8" opacity="0.85"/>
<text x="44.8" y="94" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">鉴权 10</text>
<rect x="65.6" y="72" width="124.8" height="34" fill="#2563eb" opacity="0.85"/>
<text x="128.0" y="94" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1 跳 30</text>
<rect x="190.4" y="72" width="208.0" height="34" fill="#0d9488" opacity="0.85"/>
<text x="294.4" y="94" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2 跳 50</text>
<rect x="398.4" y="72" width="332.8" height="34" fill="#b45309" opacity="0.85"/>
<text x="564.8" y="94" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3~4 跳 80</text>
<rect x="731.2" y="72" width="124.8" height="34" fill="#7c3aed" opacity="0.85"/>
<text x="793.6" y="94" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">序列化 30</text>
<text x="24" y="142" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">超出预算时：降跳 + truncated=true，不抛异常、不静默返回空。</text>
<rect x="24" y="168" width="256" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="152.0" y="199.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">限流按跳数</text>
<text x="152.0" y="218.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">hops/s，而非 QPS</text>
<rect x="300" y="168" width="256" height="76" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="428.0" y="199.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">缓存键四维</text>
<text x="428.0" y="218.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">src / depth / version / filter</text>
<rect x="576" y="168" width="280" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="716.0" y="199.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四个观测指标</text>
<text x="716.0" y="218.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">跳数 / 扫描行数 / 截断率 / 命中率</text>
<text x="24" y="286" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">预计算实测：200 次三层查询，闭包 0.9 ms vs 实时 2.9 ms（3.2×）；</text>
<text x="24" y="312" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">全部后代：2.1 ms vs 47.8 ms（22.8×）。差距主要来自方差，不是均值。</text>
</svg>
