<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img">
<title>五个安静的失败：都发生在「写成功」之后</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">五个安静的失败：都发生在「写成功」之后</text>
<circle cx="34" cy="88" r="6" fill="#b91c1c"/>
<text x="52" y="82" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">孤儿边</text>
<text x="52" y="104" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">dst 指向不存在的节点</text>
<text x="760" y="92" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">0（本机）</text>
<circle cx="34" cy="154" r="6" fill="#b91c1c"/>
<text x="52" y="148" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">单向边</text>
<text x="52" y="170" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">98.4% 的边没有反向边</text>
<text x="760" y="158" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">180,369</text>
<circle cx="34" cy="220" r="6" fill="#b91c1c"/>
<text x="52" y="214" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">重复边</text>
<text x="52" y="236" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">无主键时重试写两行</text>
<text x="760" y="224" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">主键=0</text>
<circle cx="34" cy="286" r="6" fill="#b91c1c"/>
<text x="52" y="280" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">超点</text>
<text x="52" y="302" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">一个节点 20,000 条出边</text>
<text x="760" y="290" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p99 仅 8</text>
<circle cx="34" cy="352" r="6" fill="#b91c1c"/>
<text x="52" y="346" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">快照漂移</text>
<text x="52" y="368" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">闭包与边表差一个版本</text>
<text x="760" y="356" font-size="12" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">无法重建</text>
<text x="24" y="404" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">共同点：接口返回 200、页面正常，只有对账或压测才会暴露。</text>
</svg>
