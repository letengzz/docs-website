<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img">
<title>两种递归：按节点收敛 vs 按路径爆炸</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">两种递归：按节点收敛 vs 按路径爆炸</text>
<rect x="24" y="60" width="380" height="70" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="214.0" y="88.0" font-size="13" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">UNION（去重）</text>
<text x="214.0" y="107.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结果 = 可达节点集合</text>
<rect x="24" y="140" width="380" height="46" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="214.0" y="163.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三跳 29,510 行 / 114.5 ms</text>
<rect x="484" y="60" width="372" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="670.0" y="88.0" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">UNION ALL（不去重）</text>
<text x="670.0" y="107.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">结果 = 所有路径</text>
<rect x="484" y="140" width="372" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="670.0" y="163.0" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三跳 29,134,438 行</text>
<text x="510" y="232" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1 跳</text>
<text x="700" y="232" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">20,001</text>
<text x="510" y="276" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2 跳</text>
<text x="700" y="276" font-size="13" fill="#0f172a" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">80,970</text>
<text x="510" y="320" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3 跳</text>
<text x="700" y="320" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">29,134,438</text>
<text x="24" y="244" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">放大的来源：</text>
<text x="24" y="272" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">超点 1 跳 20,000 行，</text>
<text x="24" y="298" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2 跳 ×4.05，3 跳 ×359.8。</text>
<text x="24" y="340" font-size="12" fill="#b91c1c" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">路径字符串去重：40 对 3 跳 = 1,967 ms；</text>
<text x="24" y="366" font-size="12" fill="#0d9488" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">分层 BFS：40 对 8 跳 = 358.3 ms。</text>
<text x="24" y="398" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">→ 去重交给集合，不在字符串里做子串匹配。</text>
</svg>
