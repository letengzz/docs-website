<rect width="880" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三步分诊：数据、查询、结构</text>
<rect x="24" y="66" width="250" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="96.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1 数据对不对</text>
<text x="149.0" y="115.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">孤儿 / 重复 / 计数</text>
<text x="300" y="98" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">去看：</text>
<text x="300" y="122" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">边写入 · 一致性与快照</text>
<line x1="149" y1="141" x2="149" y2="156" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="158" width="250" height="74" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
