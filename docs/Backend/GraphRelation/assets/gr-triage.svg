<text x="149.0" y="207.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">慢 / 超时 / 内存涨</text>
<text x="300" y="190" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">去看：</text>
<text x="300" y="214" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">多跳遍历 · 超点</text>
<line x1="149" y1="233" x2="149" y2="248" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="250" width="250" height="74" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="149.0" y="280.0" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3 结构对不对</text>
<text x="149.0" y="299.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">写慢 / 空间大 / 重建久</text>
<text x="300" y="282" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">去看：</text>
<text x="300" y="306" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">三种关系存储</text>
<text x="24" y="356" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">先分诊再优化：在错误的层做正确的优化，是图项目最常见的浪费。</text>
