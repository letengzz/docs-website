<line x1="350" y1="264" x2="408" y2="264" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="70" y="330" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">关注列表：A→B</text>
<text x="270" y="330" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">粉丝列表：B→A</text>
