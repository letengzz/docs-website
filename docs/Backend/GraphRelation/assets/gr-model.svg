<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img">
<title>四步建模：主语 → 边 → 主键 → 时间</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四步建模：主语 → 边 → 主键 → 时间</text>
<rect x="24" y="64" width="190" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="119.0" y="98.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">1 主语</text>
<text x="119.0" y="117.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">A 关注 B</text>
<line x1="215" y1="105" x2="232" y2="105" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="234" y="64" width="190" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="329.0" y="98.0" font-size="12.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">2 边或列</text>
<text x="329.0" y="117.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">多对多才建边</text>
<line x1="425" y1="105" x2="442" y2="105" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
