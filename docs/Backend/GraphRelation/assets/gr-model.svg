<text x="539.0" y="98.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">3 主键</text>
<text x="539.0" y="117.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">(src,dst,rel)</text>
<line x1="635" y1="105" x2="652" y2="105" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="654" y="64" width="190" height="82" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="749.0" y="98.0" font-size="12.5" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">4 时间</text>
<text x="749.0" y="117.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">点 or 区间</text>
<text x="24" y="196" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">方向写反的代价：两个页面同时错，而且都看起来合理</text>
<circle cx="120" cy="272" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="120" y="278" font-size="14" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">A</text>
