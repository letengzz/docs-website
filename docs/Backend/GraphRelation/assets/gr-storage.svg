<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img">
<title>同一棵树，三种结构，三种成本</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="430" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">同一棵树，三种结构，三种成本</text>
<rect x="24" y="62" width="260" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="154.0" y="160.0" font-size="14" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">邻接表</text>
<text x="154.0" y="179.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">parent 一列</text>
<text x="154" y="168" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">子树 47.8 ms</text>
<text x="154" y="196" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">写入 0.011 ms</text>
<text x="154" y="230" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">写最优 / 读最慢</text>
<rect x="300" y="62" width="260" height="210" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="430.0" y="160.0" font-size="14" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">闭包表</text>
<text x="430.0" y="179.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">祖先-后代对</text>
<text x="430" y="168" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">子树 2.1 ms</text>
<text x="430" y="196" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">写入 15.4 ms</text>
<text x="430" y="230" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">读最快 / 写放大 1,389×</text>
<rect x="576" y="62" width="260" height="210" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="706.0" y="160.0" font-size="14" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">物化路径</text>
<text x="706.0" y="179.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">/1/7/42/</text>
<text x="706" y="168" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">子树 3.7 ms</text>
<text x="706" y="196" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">移动 41.0 ms</text>
<text x="706" y="230" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">折中 / 移动要改字符串</text>
<text x="24" y="306" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">闭包表的「快」有前提：必须补 (anc,depth) 索引。</text>
<text x="24" y="334" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">默认主键 (anc,desc) 下，查三层以内 1.945 ms，比递归的 0.059 ms 慢 33 倍；</text>
<text x="24" y="360" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">补索引后 0.007 ms，快 278 倍。</text>
<text x="24" y="396" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">选型：多对多无层级 → 邻接表；读多写少的树 → 闭包表 + 索引；面包屑 → 物化路径。</text>
</svg>
