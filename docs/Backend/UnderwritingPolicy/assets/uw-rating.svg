<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="四个因子相乘：顺序无关，但「相加」是另一个函数">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">四个因子相乘：顺序无关，但「相加」是另一个函数</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">同一组因子，乘积 1.0919、偏离量相加 0.8400+1——差 4.09%，且 98.61% 的单子结论不同</text>
<rect x="28" y="96" width="150" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="103" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">基础保费</text>
<text x="103" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">保额 × 基准费率</text>
<rect x="216" y="96" width="110" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="271" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">年龄</text>
<text x="271" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.35</text>
<line x1="184" y1="124" x2="210" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="364" y="96" width="110" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="419" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">地区</text>
<text x="419" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.10</text>
<line x1="332" y1="124" x2="358" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="512" y="96" width="110" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="567" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">渠道</text>
<text x="567" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.05</text>
<line x1="480" y1="124" x2="506" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="660" y="96" width="110" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="715" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">NCD</text>
<text x="715" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">0.70</text>
<line x1="628" y1="124" x2="654" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="28" y="190" width="520" height="78" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="44" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">乘积（正确）：1.35 × 1.10 × 1.05 × 0.70 = 1.0919</text>
<text x="44" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">6,440.00 × 1.0919 = 7,029.10；24 种排列 → 1 个结果</text>
<rect x="28" y="282" width="520" height="78" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.2"/>
<text x="44" y="308" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">偏离量相加（错误）：1 + 0.35 + 0.10 + 0.05 − 0.30 = 1.2000</text>
<text x="44" y="332" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">6,440.00 × 1.2000 = 7,728.00；与乘积差 698.90（9.9%）</text>
<rect x="580" y="190" width="352" height="170" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="596" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">为什么「相加」看起来也对</text>
<text x="596" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">它和「加权求和模型」写起来一样，</text>
<text x="596" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">但加权求和必须先取对数，</text>
<text x="596" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">再用 exp 还原——那其实就是乘积。</text>
<text x="596" y="308" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">差别只在折扣上：折扣叠加是乘法</text>
<text x="596" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">（0.95 × 0.9 = 0.855），不是加法（0.85）。</text>
</svg>
