<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="承保的七段链：每一段都能单独失败">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="380" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">承保的七段链：每一段都能单独失败</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">四段的失败是安静的——保单能出、发票能开，只有「这份承诺还站不站得住」是错的</text>
<rect x="28" y="100" width="120" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="88" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">① 要</text>
<text x="88" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">投保单</text>
<text x="88" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">要素采集</text>
<line x1="150" y1="148" x2="156" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="52" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="88" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">安静</text>
<rect x="158" y="100" width="120" height="96" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="218" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">② 核</text>
<text x="218" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">风险选择</text>
<text x="218" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">五结局</text>
<line x1="280" y1="148" x2="286" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="182" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="218" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">半显性</text>
<rect x="288" y="100" width="120" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="348" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">③ 保</text>
<text x="348" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">出单</text>
<text x="348" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">要素冻结</text>
<line x1="410" y1="148" x2="416" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="312" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="348" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">安静</text>
<rect x="418" y="100" width="120" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="478" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">④ 改</text>
<text x="478" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">批改</text>
<text x="478" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">加退费</text>
<line x1="540" y1="148" x2="546" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="442" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="478" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">安静</text>
<rect x="548" y="100" width="120" height="96" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="608" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">⑤ 续</text>
<text x="608" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">续保</text>
<text x="608" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">NCD 与费率</text>
<line x1="670" y1="148" x2="676" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="572" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="608" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">半显性</text>
<rect x="678" y="100" width="120" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="738" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">⑥ 退</text>
<text x="738" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">退保</text>
<text x="738" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">短期费率表</text>
<line x1="800" y1="148" x2="806" y2="148" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="702" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="738" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">安静</text>
<rect x="808" y="100" width="120" height="96" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="868" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">⑦ 摊</text>
<text x="868" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">再保</text>
<text x="868" y="170" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">分出与摊回</text>
<rect x="832" y="208" width="72" height="24" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="868" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">半显性</text>
<text x="28" y="296" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">七段里四段的失败是安静的；「半显性」的两段（核保、续保）会以工单形式出现，但工单本身不代表判对。</text>
<text x="28" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">每一段都必须留下可独立复核的证据：核保留规则命中、出单留要素快照、批改留序号、退保留费率口径、再保留分出比例。</text>
<text x="28" y="348" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">本机读数：18,000 张保单 / 保额 68.22 亿 / 承保保费 7,024.33 万 / 已赚 86.74% / 未满期 13.26%</text>
</svg>
