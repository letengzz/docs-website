<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="成数与溢额：两种分出方式买的是两种东西">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">成数与溢额：两种分出方式买的是两种东西</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">成数按比例切（连小单也分），溢额按保额切（只分大的）——同一张 200 万保单结果差 3 倍</text>
<rect x="40" y="96" width="300" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="190" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">一张保单：保额 2,000,000 / 保费 56,000</text>
<rect x="40" y="190" width="420" height="120" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="56" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">成数 30%（Quota Share）</text>
<rect x="56" y="232" width="300" height="34" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.0"/>
<rect x="356" y="232" width="88" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="206" y="254" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">分出 600,000</text>
<text x="400" y="254" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">自留</text>
<text x="56" y="292" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">分出保费 16,800 · 赔款 80 万摊回 24 万 · 佣金 25% 摊回 4,200</text>
<rect x="500" y="190" width="420" height="120" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="516" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">溢额（自留线 200,000）</text>
<rect x="516" y="232" width="40" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/>
<rect x="556" y="232" width="348" height="34" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.0"/>
<text x="530" y="254" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">自留</text>
<text x="730" y="254" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">分出 1,800,000</text>
<text x="516" y="292" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">分出保费 50,400 · 赔款摊回 72 万 · 小单一分不分</text>
<rect x="40" y="330" width="880" height="50" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.0"/>
<text x="56" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">全量上看：成数 30% 分出保费 21,072,981.50（正好 30%）；溢额外分保额 51.00% 但只分出保费 22.29%</text>
<text x="56" y="370" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">——保额与保费不是等比例迁移的，这正是「按保额分」与「按保费分」会给出不同自留风险的原因。</text>
</svg>
