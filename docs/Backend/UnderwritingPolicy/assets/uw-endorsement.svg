<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="批改：一份保单的追加协议，序号是它的身份">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">批改：一份保单的追加协议，序号是它的身份</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">加费按未满期日比例、减费按短期费率表——同一张批单上两个方向用两把尺子</text>
<rect x="28" y="96" width="200" height="250" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="128" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">policy</text>
<text x="44" y="152" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">保额 2,000,000</text>
<text x="44" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">保费 56,000.00</text>
<text x="44" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">起保 2025-07-01</text>
<text x="44" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">状态 IN_FORCE</text>
<text x="128" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">要素一经出单</text>
<text x="128" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">只能追加、不能覆盖</text>
<text x="128" y="318" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">→ 批单是唯一写入口</text>
<rect x="260" y="106" width="660" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="280" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">seq 1</text>
<text x="360" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">SUM_INSURED_UP</text>
<text x="360" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">生效 2025-10-01</text>
<text x="760" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">+5,000.00</text>
<rect x="260" y="172" width="660" height="56" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="280" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">seq 2</text>
<text x="360" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">SUM_INSURED_DOWN</text>
<text x="360" y="216" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">生效 2026-01-01</text>
<text x="760" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="start">−2,100.00</text>
<rect x="260" y="238" width="660" height="56" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="280" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">seq 3</text>
<text x="360" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">INFO（地址变更）</text>
<text x="360" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">生效 2026-03-01</text>
<text x="760" y="272" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#6b7280" text-anchor="start">0.00</text>
<rect x="260" y="306" width="660" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="280" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#9f1239" text-anchor="start">seq 4 缺失</text>
<text x="280" y="350" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">并发 MAX+1 时会撞号：12 线程 × 4 次 → 25.00% 重号；UNIQUE(policy_id, seq) 是唯一能拦住它的东西</text>
<text x="28" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">批改 313 次加费：按日比例 168,355.50 / 按剩余整月 166,344.79（−1.19%）；减费 187 次：按日退 75,098.24 / 短期表退 65,145.38（客户少拿 13.25%）。</text>
</svg>
