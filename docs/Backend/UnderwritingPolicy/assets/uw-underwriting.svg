<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="核保五个结局：不是「过 / 不过」，是五种合同">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="430" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">核保五个结局：不是「过 / 不过」，是五种合同</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">标准承保、加费、除外、拒保、转人工——五种结局后面跟着五种不同的条款写法</text>
<rect x="40" y="96" width="120" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="100" y="123" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">投保单</text>
<rect x="200" y="168" width="150" height="42" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="275" y="194" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">标准体</text>
<rect x="372" y="177" width="90" height="24" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="417" y="193" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle">63.42%</text>
<line x1="164" y1="118" x2="196" y2="189" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="200" y="218" width="150" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="275" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">加费（×1.25）</text>
<rect x="372" y="227" width="90" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="417" y="243" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">24.28%</text>
<line x1="164" y1="118" x2="196" y2="239" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="200" y="268" width="150" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="275" y="294" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">除外责任</text>
<rect x="372" y="277" width="90" height="24" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="417" y="293" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">4.28%</text>
<line x1="164" y1="118" x2="196" y2="289" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="200" y="318" width="150" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="275" y="344" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">转人工</text>
<rect x="372" y="327" width="90" height="24" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="417" y="343" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle">4.04%</text>
<line x1="164" y1="118" x2="196" y2="339" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="200" y="368" width="150" height="42" rx="6" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.2"/>
<text x="275" y="394" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">拒保</text>
<rect x="372" y="377" width="90" height="24" rx="12" fill="#ffffff" stroke="#9f1239" stroke-width="1.2"/>
<text x="417" y="393" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9f1239" text-anchor="middle">3.98%</text>
<line x1="164" y1="118" x2="196" y2="389" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="520" y="100" width="412" height="300" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="538" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">规则表的三个纪律</text>
<text x="538" y="156" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">① 命中即停，所以顺序就是策略</text>
<text x="538" y="174" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">顺序不同导致结论不同 4.10%（985/24,000），其中 630 单被误放行</text>
<text x="538" y="212" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">② 每条命中都要留痕</text>
<text x="538" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">只存「最终结局」等于事后无法解释为什么加费 25%</text>
<text x="538" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">③ 转人工必须有时效与兜底</text>
<text x="538" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">4.04% 转人工，没有 SLA 就是「永远在核」</text>
<text x="538" y="324" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">④ 规则是可配置的，不是 if-else</text>
<text x="538" y="342" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">费率与规则都会变，改一次发一次版等于没人改</text>
<text x="40" y="404" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">本机读数：24,000 张投保单，自动出结论 95.96%，转人工 4.04%；「标准体」只占 63.42%——多数单子是被改过的。</text>
</svg>
