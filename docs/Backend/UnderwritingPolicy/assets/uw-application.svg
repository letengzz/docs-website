<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="投保单的三个关系人和四类要素">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">投保单的三个关系人和四类要素</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">一次提交要能回答：谁付钱、保谁、赔给谁、保什么</text>
<rect x="380" y="96" width="200" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="480" y="128" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">投保人 holder</text>
<text x="480" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">付钱、承担告知义务</text>
<rect x="120" y="236" width="200" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="220" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">被保险人 insured</text>
<text x="220" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">风险载体，须有可保利益</text>
<rect x="640" y="236" width="200" height="72" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="740" y="268" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">受益人 beneficiary</text>
<text x="740" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">只影响给付，不影响核保</text>
<line x1="400" y1="168" x2="260" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="560" y1="168" x2="700" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="320" y1="272" x2="636" y2="272" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="478" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">同一人可兼任（车险常见）</text>
<rect x="28" y="340" width="904" height="34" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.0"/>
<text x="44" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">四类要素：标的（车架号/门牌/职业）· 风险（既往症/出险史）· 期限（起止日）· 关系（三者之间的身份与利益）</text>
</svg>
