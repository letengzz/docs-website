<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="专题地图：从一张投保单到一张再保账单">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="460" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">专题地图：从一张投保单到一张再保账单</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">九页正文按「一份承诺的生命周期」排列，两条横线是「钱」与「证据」</text>
<rect x="40" y="88" width="130" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="105" y="113" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">卖之前</text>
<rect x="40" y="146" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="105" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">险种、条款与责任</text>
<rect x="40" y="206" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="105" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">投保单与关系人</text>
<rect x="300" y="88" width="130" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="365" y="113" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">定价与选择</text>
<rect x="300" y="146" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="365" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">核保与风险选择</text>
<rect x="300" y="206" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="365" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">费率因子与保费计</text>
<text x="365" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">算</text>
<rect x="300" y="266" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="365" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">出单与保单要素</text>
<rect x="580" y="88" width="130" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="645" y="113" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">持有期</text>
<rect x="580" y="146" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="645" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">批改与加退费</text>
<rect x="580" y="206" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="645" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">续保与退保</text>
<rect x="800" y="88" width="130" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="865" y="113" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">收口</text>
<rect x="800" y="146" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="865" y="168" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">再保分出</text>
<rect x="800" y="206" width="130" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="865" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="middle">实战</text>
<line x1="170" y1="108" x2="298" y2="108" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="108" x2="558" y2="108" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="710" y1="108" x2="838" y2="108" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="372" width="880" height="62" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="56" y="396" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">「钱」这条线：保额（保多少） → 承保保费（收多少） → 已赚保费（赚多少） → 实收（到账多少）</text>
<text x="56" y="418" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">「证据」这条线：投保单要素 → 核保命中 → 保单快照 → 批单序号 → 退保口径 → 分出比例</text>
</svg>
