<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="三个「多少」：保额不是保费，保费不是已赚">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">三个「多少」：保额不是保费，保费不是已赚</text>
<text x="24" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#6b7280">四个数各自成立、互不相等，而只有一个是对的答案，取决于你回答的是哪个问题</text>
<rect x="28" y="92" width="904" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="44" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">保额 sum insured</text>
<text x="44" y="138" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">承诺的上限</text>
<text x="330" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="start">6,821,770,000</text>
<text x="620" y="130" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">≠ 收入，连「应收」都不是</text>
<rect x="28" y="162" width="904" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="44" y="188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">承保保费 written</text>
<text x="44" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">签下的年保费</text>
<text x="330" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="start">70,243,271.68</text>
<text x="620" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">签单那天全额确认</text>
<rect x="28" y="232" width="904" height="62" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="44" y="258" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">已赚保费 earned</text>
<text x="44" y="278" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">已经「过期」的部分</text>
<text x="330" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0f766e" text-anchor="start">60,929,670.58</text>
<text x="620" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">86.74%，按 365 天摊</text>
<rect x="28" y="302" width="904" height="62" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.2"/>
<text x="44" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">实收保费 collected</text>
<text x="44" y="348" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">钱真到了</text>
<text x="330" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#9f1239" text-anchor="start">69,057,693.17</text>
<text x="620" y="340" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">1.81% 应收未收</text>
<text x="28" y="382" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">四个数的关系：实收 ≈ 承保（差应收未收）；承保 − 未满期 = 已赚；保额与它们都无关，它只在上限处出现。</text>
</svg>
