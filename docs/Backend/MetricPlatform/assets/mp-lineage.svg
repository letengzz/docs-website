<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="血缘：改一个字段，动 5 个指标">
<title>血缘：改一个字段，动 5 个指标</title>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">血缘：改一个字段，动 5 个指标</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">24 个指标 / 40 个源字段 / 76 条边；平均每个字段影响 2.17 个指标</text>
