<text x="40" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">影响面不是「谁引用了它」，而是「谁的结果会变」——中间还隔着口径版本、聚合表、缓存与已发出的报表。</text>
<text x="40" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">四层影响：① 直接口径 ② 间接指标 ③ 物化表 ④ 已交付报表（这一层通常没人管，也最容易翻车）。</text>
</svg>
