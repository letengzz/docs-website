<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="权限三轴与过滤下推">
<title>权限三轴与过滤下推</title>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">权限三轴与过滤下推</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">指标权限 × 行级过滤 × 列级脱敏；漏掉任何一轴，越权都是静默的</text>
<rect x="40" y="86" width="280" height="100" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="56" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">指标权限</text>
<text x="56" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">能不能查这个指标</text>
<text x="56" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">GMV / UV / 毛利</text>
<rect x="340" y="86" width="280" height="100" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="356" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">行级过滤</text>
<text x="356" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">能看到哪几行</text>
<text x="356" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">region in (本人辖区)</text>
<rect x="640" y="86" width="280" height="100" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="656" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">列级脱敏</text>
<text x="656" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">能看到哪些列</text>
<text x="656" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">手机号 → 138****</text>
<rect x="40" y="210" width="430" height="96" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="56" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="700" text-anchor="start">过滤后置的两种漏法</text>
<text x="56" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e" font-weight="400" text-anchor="start">① 先聚合再在应用层过滤：总数已经泄露</text>
<text x="56" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e" font-weight="400" text-anchor="start">② join 后过滤落在错误的表：明细全部可见</text>
<text x="56" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e" font-weight="600" text-anchor="start">本机：east 应见 6,811 行，漏 27,047 行（79.88%）</text>
<rect x="490" y="210" width="430" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="506" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">过滤必须下推</text>
<text x="506" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">把谓词编译进 SQL 的 where，而不是结果集</text>
<text x="506" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">缓存键必须含权限上下文，否则 A 的结果给 B</text>
<text x="506" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">join 后行数 56,167：明细一侧必须同样带过滤</text>
</svg>
