<text x="24" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">读法：①②⑦ 会当场报错；③④⑤⑥ 只表现为「数字不对」，而数字不对通常先被业务发现、不是被系统发现。</text>
