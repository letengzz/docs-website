<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="版本与生效期：两段时间轴">
<title>版本与生效期：两段时间轴</title>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">版本与生效期：两段时间轴</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">业务时间（effective）与发布时间（recorded）不是同一根轴，迟到数据让两者错开</text>
<text x="60" y="96" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="600" text-anchor="start">业务时间</text>
<line x1="150" y1="92" x2="900" y2="92" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="150" y1="86" x2="150" y2="98" stroke="#94a3b8" stroke-width="1"/>
<text x="150" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">1 月</text>
<line x1="270" y1="86" x2="270" y2="98" stroke="#94a3b8" stroke-width="1"/>
<text x="270" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">3 月</text>
<line x1="390" y1="86" x2="390" y2="98" stroke="#94a3b8" stroke-width="1"/>
<text x="390" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">5 月</text>
<line x1="510" y1="86" x2="510" y2="98" stroke="#94a3b8" stroke-width="1"/>
<text x="510" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">7 月</text>
<line x1="630" y1="86" x2="630" y2="98" stroke="#94a3b8" stroke-width="1"/>
<text x="630" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">9 月</text>
<rect x="150" y="124" width="240" height="44" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="160" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">v1：含取消单（净额）</text>
<text x="160" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">2026-01-01 ~ 2026-04-30</text>
<rect x="390" y="124" width="420" height="44" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="400" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">v2：排除取消、扣退款</text>
<text x="400" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">2026-05-01 ~ 至今（effective_to = NULL）</text>
<text x="60" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" font-weight="600" text-anchor="start">发布时间</text>
<line x1="150" y1="202" x2="900" y2="202" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="700" y="186" width="190" height="34" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="710" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="start">2026-08-14 发布 v2</text>
<rect x="150" y="240" width="700" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="166" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">回填：v2 发布后，1~4 月历史数字被整体重算，6 个月全部变化，合计 3,061,940.84 元（4.07%）。</text>
<text x="166" y="282" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">如果 v2 只对新期间生效，同一张年报里会出现两种口径——所以「是否重述历史」必须写进口径契约，而不是留给实现。</text>
</svg>
