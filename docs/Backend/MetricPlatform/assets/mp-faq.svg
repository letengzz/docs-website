<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="分诊：数字不对时先问三个问题">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<title>分诊：数字不对时先问三个问题</title>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">分诊：数字不对时先问三个问题</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">口径对不对 → 粒度对不对 → 权限对不对；三个问题能挡掉八成的「平台算错了」</text>
<rect x="40" y="88" width="240" height="56" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="56" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#92400e" font-weight="700" text-anchor="start">业务说：这个数不对</text>
<text x="56" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e" font-weight="400" text-anchor="start">先要一个具体反例</text>
<line x1="284" y1="116" x2="340" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="344" y="88" width="250" height="54" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="360" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">Q1 口径</text>
<text x="360" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">问：算不算取消/退款</text>
<line x1="598" y1="115" x2="640" y2="115" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="344" y="158" width="250" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="360" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">Q2 粒度</text>
<text x="360" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">问：按哪一天、哪个区域</text>
<line x1="598" y1="185" x2="640" y2="185" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="344" y="228" width="250" height="54" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="360" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">Q3 权限</text>
<text x="360" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">问：他该看到几行</text>
<line x1="598" y1="255" x2="640" y2="255" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="644" y="88" width="276" height="194" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="660" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">对应处置</text>
<text x="660" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">· 口径：查契约里的「排除项」</text>
<text x="660" y="164" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">· 粒度：查时区与开闭区间</text>
<text x="660" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">· 权限：查过滤是否下推</text>
<text x="660" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">· 都不是：跑双口径对账归因</text>
<rect x="40" y="300" width="880" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="58" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="700" text-anchor="start">不要先回答「平台没错」或「是你不会用」——先拿到一个能对到行号的反例。</text>
<text x="58" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#92400e" font-weight="400" text-anchor="start">有反例就能归因；没有反例的争论只会变成「我觉得」，而「我觉得」不会让任何一个数字变对。</text>
</svg>
