<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect width="880" height="480" fill="#FFFFFF"/>
  <text x="440" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E293B">CRDT：合并是一个可交换、可幂等的「并」运算</text>

  <text x="40" y="76" font-size="13" fill="#334155">三个副本各自演化（互不通信），任意顺序、任意次数地合并后，终态必须相同——这就是「收敛」。</text>

  <rect x="40" y="96" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">副本 A</text>
  <text x="130" y="144" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#334155">{"x":1}</text>

  <rect x="260" y="96" width="180" height="60" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803D">副本 B</text>
  <text x="350" y="144" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#334155">{"x":2}</text>

  <rect x="480" y="96" width="180" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">副本 C</text>
  <text x="570" y="144" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#334155">{"x":1}</text>

  <line x1="130" y1="160" x2="300" y2="210" stroke="#94A3B8" stroke-width="2"/>
  <line x1="350" y1="160" x2="340" y2="210" stroke="#94A3B8" stroke-width="2"/>
  <line x1="570" y1="160" x2="400" y2="210" stroke="#94A3B8" stroke-width="2"/>

  <rect x="230" y="210" width="220" height="56" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="340" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D28D9">merge = 取上确界（join）</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#64748B">LWW 用时间戳定序，计数器用 max</text>

  <rect x="230" y="292" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#6D28D9">终态：三副本逐字相同</text>

  <rect x="500" y="200" width="340" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="520" y="226" font-size="13" font-weight="bold" fill="#1E293B">三条必须同时成立</text>
  <text x="520" y="250" font-size="12" fill="#334155">交换律：A∪B = B∪A（乱序到达不影响）</text>
  <text x="520" y="272" font-size="12" fill="#334155">结合律：合并可分批、可缓存中间结果</text>
  <text x="520" y="294" font-size="12" fill="#334155">幂等律：同一份更新重放 N 次不改变终态</text>
  <text x="520" y="322" font-size="12" fill="#15803D">缺一条 → 断线重连与重复投递就会分叉</text>

  <rect x="40" y="360" width="800" height="98" rx="10" fill="#FEF2F2" stroke="#EF4444"/>
  <text x="60" y="386" font-size="13" font-weight="bold" fill="#B91C1C">代价：三样东西会一直涨</text>
  <text x="60" y="410" font-size="12" fill="#334155">① 元数据（每个字符一个全局唯一 ID）；② 墓碑（删除只标记不回收）；③ 历史（离线越久，要补的更新越多）。</text>
  <text x="60" y="434" font-size="12" fill="#334155">所以 CRDT 的工程问题从来不是「怎么合并」，而是「怎么把这三样压住」——快照、GC 与压缩。</text>
</svg>
