ill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-01</text><rect x="538" y="112" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="572" y="137" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-02</text><rect x="616" y="112" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="650" y="137" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-03</text><rect x="694" y="112" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="728" y="137" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-04</text><rect x="772" y="112" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="806" y="137" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-05</text><rect x="850" y="112" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="884" y="137" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-06</text><rect x="460" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="494" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-07</text><rect x="538" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="572" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-08</text><rect x="616" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="650" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-09</text><rect x="694" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="728" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-10</text><rect x="772" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="806" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-11</text><rect x="850" y="164" width="68" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="884" y="189" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">FG-12</text><rect x="40" y="214" width="880" height="76" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.2"/><text x="56" y="240" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">同一原料批污染：实际受影响 38 台，但「批次粒度」只能整批召回 480 台 → 12.6× 的召回成本（100,800 元 vs 7,980 元）。</text><text x="56" y="264" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">反向追溯 480 台里 466 台能追到原料批，缺环 14 台（2.9%）——缺环不是「数据丢了」，是「上料时没扫批次码」。</text><text x="56" y="282" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">谱系是 16 个批次、15 条边；每条边都要带数量，否则「召回多少台」只能靠猜。</text></svg>