fill="#b91c1c" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">外部失败 144 万</text><text x="730.0" y="128" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">12.0%</text><text x="60" y="172" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">失败成本（内部 + 外部）= 432 万 = 销售额 3.6%；预防只占 0.8%。</text><text x="60" y="214" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">1 - 10 - 100 规则（同一处缺陷在不同阶段被发现的代价）</text><rect x="230" y="222" width="60" height="20" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="0"/><text x="222" y="237" font-size="11" fill="#0f766e" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">预防阶段发现</text><text x="296" y="237" font-size="11" fill="#0f766e" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">1×</text><rect x="230" y="248" width="200" height="20" rx="3" fill="#b45309" stroke="#b45309" stroke-width="0"/><text x="222" y="263" font-size="11" fill="#b45309" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">内部失败（出厂前）</text><text x="436" y="263" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">10×</text><rect x="230" y="274" width="460" height="20" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="222" y="289" font-size="11" fill="#b91c1c" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">外部失败（客户手里）</text><text x="696" y="289" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">100×</text><text x="60" y="322" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">「预防 +0.3 个百分点（36 万）、外部失败降 40%（省 57.6 万）」是这一册唯一能被财务听懂的一句话。</text></svg>