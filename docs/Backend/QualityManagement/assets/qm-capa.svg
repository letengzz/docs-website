<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300"><rect width="960" height="300" fill="#ffffff"/><text x="30" y="40" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">8D 的八步：真正花钱的是 D4 之前</text><line x1="60" y1="170" x2="900" y2="170" stroke="#d1d5db"/><circle cx="60" cy="170" r="7" fill="#0f766e"/><text x="60.0" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D1</text><text x="60.0" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">组队</text><text x="60.0" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">0.5 天</text><circle cx="171" cy="170" r="7" fill="#0f766e"/><text x="171.42857142857144" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D2</text><text x="171.42857142857144" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">描述</text><text x="171.42857142857144" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">3 天</text><circle cx="283" cy="170" r="7" fill="#b45309"/><text x="282.8571428571429" y="148" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D3</text><text x="282.8571428571429" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">围堵</text><text x="282.8571428571429" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">9 天</text><circle cx="394" cy="170" r="7" fill="#b45309"/><text x="394.2857142857143" y="148" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D4</text><text x="394.2857142857143" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">根因</text><text x="394.2857142857143" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">17 天</text><circle cx="506" cy="170" r="7" fill="#0f766e"/><text x="505.7142857142857" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D5</text><text x="505.7142857142857" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">对策</text><text x="505.7142857142857" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">24 天</text><circle cx="617" cy="170" r="7" fill="#0f766e"/><text x="617.1428571428571" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D6</text><text x="617.1428571428571" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">实施</text><text x="617.1428571428571" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">31 天</text><circle cx="729" cy="170" r="7" fill="#0f766e"/><text x="728.5714285714286" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D7</text><text x="728.5714285714286" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">预防</text><text x="728.5714285714286" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">38 天</text><circle cx="840" cy="170" r="7" fill="#0f766e"/><text x="840.0" y="148" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D8</text><text x="840.0" y="196" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">关闭</text><text x="840.0" y="214" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">52 天</text><rect x="60" y="62" width="840" height="58" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1.2"/><text x="76" y="86" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">D3 围堵（平均第 9 天）到 D4 根因（第 17 天）之间 8 天：货已经拦住了，但为什么坏还没人知道。</text><text x="76" y="108" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">本机 117 条只做围堵的 CAPA，12 个月再发 19 条（16.2%）；做了根因的 203 条再发 22 条（10.8%）。</text><text x="60" y="250" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">逾期 94/320 = 29.4%；人为原因归因 143 条再发 16.8%，系统原因 177 条再发 4.5%——「人为原因」是最省事的结论，也是最贵的。</text><text x="60" y="274" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">关闭条件不是「对策做完了」，是「连续 N 批没有再发」：有效性验证必须是数据，不是签字。</text></svg>