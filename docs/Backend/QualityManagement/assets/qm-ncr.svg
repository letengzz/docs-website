<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330"><rect width="960" height="330" fill="#ffffff"/><text x="30" y="40" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">不合格品单的四态五迁移：隔离不是「放到红框里」</text><rect x="110" y="130" width="170" height="58" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/><text x="195" y="165" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">OPEN 已开单</text><rect x="390" y="130" width="170" height="58" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text x="475" y="165" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">DISPOSITIONED 已处置</text><rect x="670" y="130" width="170" height="58" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/><text x="755" y="165" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">CLOSED 已关闭</text><rect x="670" y="236" width="170" height="58" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="755" y="271" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">VOID 误开单</text><line x1="280" y1="159" x2="386" y2="159" stroke="#b45309" stroke-width="1.6"/><polygon points="386,159 378.7,162.4 378.7,155.6" fill="#b45309"/><text x="333" y="150" font-size="10" fill="#b45309" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">MRB 处置</text><line x1="560" y1="159" x2="666" y2="159" stroke="#0f766e" stroke-width="1.6"/><polygon points="666,159 658.7,162.4 658.7,155.6" fill="#0f766e"/><text x="613" y="150" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">量对平</text><line x1="195" y1="188" x2="195" y2="236" stroke="#6b7280" stroke-width="1.6"/><polygon points="195,236 191.6,228.7 198.4,228.7" fill="#6b7280"/><line x1="195" y1="236" x2="666" y2="236" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3"/><polygon points="666,236 658.7,239.4 658.7,232.6" fill="#6b7280"/><text x="430" y="256" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">误开单（复检合格），必须留原因，不是删除</text><text x="30" y="306" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">让步接收只有「有失效日、有数量上限、有审批人」三条成立时才算处置完；过期未出货的，回 DISPOSITIONED 重判。</text><text x="30" y="70" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">每一条边都有「谁有权、要什么证据、失败会怎样」；没有边的那条（CLOSED → OPEN）是刻意的：关闭后改结论只能开新单。</text></svg>