<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="实时风控决策专题地图">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="40" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">实时风控决策 · 九页地图</text>

  <!-- lane 1 -->
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">决策链路（一次请求怎么判）</text>
  <rect x="40" y="82" width="190" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="135" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">总览 RDO</text>
  <text x="135" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">四段与三个交界</text>

  <rect x="255" y="82" width="190" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="350" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">信号与特征 RDS</text>
  <text x="350" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">窗口 · 去重 · 时间旅行</text>

  <rect x="470" y="82" width="190" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="565" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">规则与决策表 RDR</text>
  <text x="565" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">优先级 · 互斥 · 灰度</text>

  <rect x="685" y="82" width="175" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="772" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">评分卡 RDK</text>
  <text x="772" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">WOE · 刻度 · 校准</text>

  <line x1="232" y1="118" x2="251" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m1)"/>
  <line x1="447" y1="118" x2="466" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m1)"/>
  <line x1="662" y1="118" x2="681" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- lane 2 -->
  <text x="40" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">运行面（怎么跑得住）</text>

  <rect x="40" y="206" width="250" height="72" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="165" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f766e">在线服务 RDV</text>
  <text x="165" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#115e59">预算 · 热更新 · 降级</text>

  <rect x="315" y="206" width="250" height="72" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="440" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f766e">案件与审核 RDC</text>
  <text x="440" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#115e59">队列 · SLA · 一致性</text>

  <rect x="590" y="206" width="270" height="72" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="725" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f766e">度量与误杀治理 RDM</text>
  <text x="725" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#115e59">四个率 · 成本线 · 回归集</text>

  <!-- lane 3 -->
  <text x="40" y="316" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">落地与分诊</text>

  <rect x="40" y="326" width="380" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="230" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400e">实战 RDP：最小可跑决策服务</text>
  <text x="230" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">S1~S10 + P1~P12 验收</text>

  <rect x="445" y="326" width="415" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="652" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">常见问题 RDQ：分诊表与止血顺序</text>
  <text x="652" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">先隔离单条规则，不要全量关停</text>

  <line x1="230" y1="288" x2="230" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m1)"/>
  <line x1="652" y1="288" x2="652" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m1)"/>

  <text x="40" y="440" font-family="system-ui, sans-serif" font-size="12" fill="#475569">读法：先读总览拿全局图，再按手上的问题选一条线；实战页是「把前六页装进一个能验收的服务」。</text>
</svg>
