<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="阈值与总成本曲线">
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="40" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">总成本是 U 形：更严不等于更好</text>
  <text x="40" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">日请求 100,000，真实坏人 1,000；FN_COST 3,000，FP_COST 60</text>

  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="380" x2="680" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">100万</text>
  <text x="52" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">70万</text>
  <text x="52" y="384" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">40万</text>
  <text x="90" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">2000</text>
  <text x="360" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">5000</text>
  <text x="640" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">8000</text>
  <text x="380" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">被处置量（越往右越严）</text>

  <!-- curve -->
  <polyline points="90,81 183,287 370,352 650,330" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- points -->
  <circle cx="90" cy="81" r="5" fill="#2563eb"/>
  <text x="102" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">B 更宽 97.8万</text>

  <circle cx="183" cy="287" r="5" fill="#2563eb"/>
  <text x="150" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">A 宽 57.9万</text>

  <circle cx="370" cy="352" r="7" fill="#059669"/>
  <text x="382" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">C 严 45.4万（最低）</text>

  <circle cx="650" cy="330" r="5" fill="#dc2626"/>
  <text x="560" y="318" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">D 更严 49.7万</text>

  <!-- marginal note -->
  <rect x="420" y="120" width="300" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="436" y="144" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b">C → D 的边际账</text>
  <text x="436" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">多拦 3,000 单，只多抓 45 个坏人</text>
  <text x="436" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">边际精确率 1.5% &lt; FP/FN = 2%</text>
  <text x="436" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">所以「更严」反而更贵</text>

  <text x="40" y="452" font-family="system-ui, sans-serif" font-size="12" fill="#475569">精确率随严格程度单调下降（35.0% → 12.2%），必须与「漏过数」成对看。</text>
</svg>
