<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="事件到信号的三层结构">
  <defs>
    <marker id="s1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#f8fafc"/>
  <text x="40" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">事件 → 窗口 → 特征：三层各有各的「过期」方式</text>

  <!-- layer 1 -->
  <rect x="40" y="70" width="250" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">① 原始事件</text>
  <text x="60" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Kafka 保留 7~30 天</text>
  <text x="60" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#475569">数仓明细，只追加</text>
  <text x="60" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#0369a1">过期方式：保留期删除</text>

  <!-- layer 2 -->
  <rect x="355" y="70" width="250" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="375" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">② 聚合窗口</text>
  <text x="375" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#475569">pay_cnt_1h / amount_30d</text>
  <text x="375" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Redis 宽表 / OLAP</text>
  <text x="375" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">过期方式：滚动重算</text>

  <!-- layer 3 -->
  <rect x="670" y="70" width="250" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="690" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">③ 画像与名单</text>
  <text x="690" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#475569">设备归属、历史处置</text>
  <text x="690" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#475569">黑白名单（带 TTL）</text>
  <text x="690" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">过期方式：expire_at</text>

  <line x1="292" y1="135" x2="351" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#s1)"/>
  <line x1="607" y1="135" x2="666" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#s1)"/>

  <!-- guard rails -->
  <rect x="40" y="230" width="880" height="70" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="60" y="256" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">聚合前必须去重</text>
  <text x="60" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">去重键 = (subject_id, event_id)；漏掉 subject_id 会在「同一事件被两个上游各发一次」时失效</text>

  <rect x="40" y="315" width="430" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="341" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">迟到与水位</text>
  <text x="60" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#1e3a8a">事件时间定义窗口；处理时间会把迟到算进下一格</text>

  <rect x="490" y="315" width="430" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="510" y="341" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">增量补丁要带 TTL</text>
  <text x="510" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">流任务挂掉后，永不过期的 delta 会让计数永久偏高</text>
</svg>
