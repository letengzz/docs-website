<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="从分箱到刻度">
  <defs>
    <marker id="k1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#f8fafc"/>
  <text x="40" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">从分箱到刻度：一个 612 分是怎么拆出来的</text>

  <!-- bins -->
  <text x="40" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">① 分箱（每箱坏人 ≥ 30，箱数 4~8）</text>

  <rect x="40" y="90" width="190" height="86" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="114" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">B1  坏 60 / 好 940</text>
  <text x="56" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">坏率 6.0%</text>
  <text x="56" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">WOE +1.653</text>

  <rect x="245" y="90" width="190" height="86" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="261" y="114" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">B2  坏 120 / 好 880</text>
  <text x="261" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">坏率 12.0%</text>
  <text x="261" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#14532d">WOE +0.894</text>

  <rect x="450" y="90" width="190" height="86" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="466" y="114" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400e">B3  坏 260 / 好 740</text>
  <text x="466" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">坏率 26.0%</text>
  <text x="466" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#78350f">WOE −0.053</text>

  <rect x="655" y="90" width="190" height="86" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="671" y="114" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">B4  坏 560 / 好 440</text>
  <text x="671" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">坏率 56.0%</text>
  <text x="671" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">WOE −1.340</text>

  <!-- formula -->
  <rect x="40" y="196" width="805" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="218" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">WOE = ln( (好_i/好总) ÷ (坏_i/坏总) )　　IV = Σ (好占比 − 坏占比) × WOE　　IV 合计 1.1281，KS 0.4267</text>
  <text x="56" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">IV &gt; 0.5 要怀疑穿越：本例 1.13，通常说明变量里混进了「事后才知道」的信息</text>

  <!-- scale -->
  <text x="40" y="282" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">② 刻度（base 600 @ 30:1，PDO 20）</text>

  <rect x="40" y="296" width="250" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">factor = 20 / ln2 = 28.8539</text>
  <text x="56" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">offset = 600 − 28.85×ln30 = 501.86</text>

  <rect x="305" y="296" width="250" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="321" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">odds 30:1 → 600 分</text>
  <text x="321" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#1e293b">odds 60:1 → 620 分</text>

  <rect x="570" y="296" width="275" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="586" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b">odds 1:1 → 501.86 分</text>
  <text x="586" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">所以阈值不能凭感觉取 600</text>

  <text x="40" y="386" font-family="system-ui, sans-serif" font-size="12" fill="#475569">单调 ≠ 校准：分数与 odds 严格单调，与坏率不是线性关系；上线前必须用 OOT 样本做一次校准。</text>
</svg>
