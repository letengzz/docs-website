<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-label="案件流转与回流闭环">
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="c2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="460" fill="#f8fafc"/>
  <text x="40" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">案件流转与回流：一次误杀要变成一条回归样本</text>

  <!-- row 1 -->
  <rect x="40" y="80" width="170" height="76" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">决策 REVIEW</text>
  <text x="56" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">带 decision_id</text>
  <text x="56" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">金额 / 分数 / hits</text>

  <rect x="250" y="80" width="180" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="266" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">分层队列</text>
  <text x="266" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">拒绝复核 / 抽样 / 申诉</text>
  <text x="266" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">ρ ≤ 0.8 才安全</text>

  <rect x="470" y="80" width="180" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="486" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">人工双审</text>
  <text x="486" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Kappa ≥ 0.6 才可单审</text>
  <text x="486" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#475569">reason_code 枚举</text>

  <rect x="690" y="80" width="190" height="76" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="706" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">结论与处置</text>
  <text x="706" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">放行 / 维持 / 升级</text>
  <text x="706" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">撤销 + 加白（带 TTL）</text>

  <line x1="212" y1="118" x2="246" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>
  <line x1="432" y1="118" x2="466" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>
  <line x1="652" y1="118" x2="686" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>

  <!-- row 2: feedback -->
  <rect x="470" y="216" width="180" height="76" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="486" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5b21b6">标注回流</text>
  <text x="486" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">按 1/p 加权入模</text>
  <text x="486" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">拒绝队列只做评估</text>

  <rect x="690" y="216" width="190" height="76" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="706" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400e">回归样本集</text>
  <text x="706" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">每条误杀一条样本</text>
  <text x="706" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">接入 CI，改规则必跑</text>

  <line x1="785" y1="158" x2="785" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>
  <line x1="652" y1="254" x2="686" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>

  <!-- config update -->
  <rect x="250" y="216" width="180" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="266" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">改规则 / 加例外</text>
  <text x="266" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#475569">先影子 → 再灰度</text>
  <text x="266" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#475569">差异率 &lt; 5% 才继续</text>

  <line x1="466" y1="254" x2="434" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#c1)"/>
  <path d="M 250 254 L 120 254 L 120 162" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#c2)"/>
  <text x="128" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">新版本重新决策</text>

  <!-- note -->
  <rect x="40" y="330" width="840" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="356" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">容量与一致性：两个最容易失控的地方</text>
  <text x="60" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#475569">容量：L = λ × W（200 件/时 × 4 小时 = 800 件上限）；利用率 ρ 从 0.8 到 0.95，等待时间涨 4 倍以上，所以按 ρ ≤ 0.8 排人。</text>
  <text x="60" y="404" font-family="system-ui, sans-serif" font-size="12" fill="#475569">一致性：Kappa 低于 0.4 时加人只会放大混乱——先写判定手册，再谈吞吐。</text>
  <text x="60" y="424" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">漏掉「结果回填」（7/30 天后的拒付与投诉），人工判断是否正确就永远只能靠感觉。</text>
</svg>
