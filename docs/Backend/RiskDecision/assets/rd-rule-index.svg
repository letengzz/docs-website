<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="逐条短路与倒排索引的耗时对比">
  <rect x="0" y="0" width="820" height="400" fill="#f8fafc"/>
  <text x="40" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">80 条规则 / 120 字段：逐条短路 vs 倒排索引</text>
  <text x="40" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">单位 µs/次，越低越好；Python 3.13.12 单线程，100,000 次均值</text>

  <!-- axis -->
  <line x1="200" y1="100" x2="200" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="300" x2="740" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="380" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">20</text>
  <text x="560" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">40</text>
  <text x="725" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">60 µs</text>

  <!-- bar 1: 33.91 -->
  <rect x="220" y="130" width="339" height="52" rx="6" fill="#2563eb"/>
  <text x="230" y="162" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">33.91</text>
  <text x="220" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">逐条短路（推荐）</text>

  <!-- bar 2: 46.48 -->
  <rect x="220" y="210" width="465" height="52" rx="6" fill="#f97316"/>
  <text x="230" y="242" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">46.48</text>
  <text x="220" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">倒排索引后求值</text>

  <!-- note -->
  <rect x="40" y="344" width="740" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b">索引慢了 27%：收益是少算几条规则，成本是对 120 个字段逐个查桶。规则条数少于字段数时，这笔账是亏的。</text>
  <text x="56" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#991b1b">同一次测量的 p99/p50 = 2.15（70.94 / 32.94 µs）：长尾来自 GC 与调度，不来自规则条数。</text>
</svg>
