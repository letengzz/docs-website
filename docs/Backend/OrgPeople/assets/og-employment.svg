<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="双时态：业务时间与系统时间">
<title>双时态：业务时间与系统时间</title>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">双时态：一条任职有两个时间轴</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">横轴是「这件事什么时候生效」，纵轴是「系统什么时候知道」。只有一格是「现在」，其余都必须能回放</text>
<rect x="120" y="90" width="620" height="240" fill="#f8fafc" stroke="#e2e8f0"/>
<line x1="120" y1="330" x2="740" y2="330" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="120" y1="90" x2="120" y2="330" stroke="#94a3b8" stroke-width="1.4"/>
<text x="430.0" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">业务时间（valid_from / valid_to）→</text>
<text x="62" y="210.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="600" text-anchor="middle" transform="rotate(-90 62 210.0)">系统时间（recorded_at）→</text>
<circle cx="256.4" cy="210.0" r="6" fill="#15803d" opacity="0.85"/>
<text x="268.4" y="214.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="600" text-anchor="start">异动生效 3-01</text>
<circle cx="256.4" cy="282.0" r="6" fill="#be123c" opacity="0.85"/>
<text x="268.4" y="286.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">补录 3-31</text>
<circle cx="461.0" cy="181.2" r="6" fill="#be123c" opacity="0.85"/>
<text x="473.0" y="185.2" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">更正 7-15</text>
<line x1="120" y1="210.0" x2="740" y2="210.0" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="128" y="202.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="start">今天：所有回放都要在这里停下</text>
<rect x="756" y="90" width="180" height="106" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="768" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">三条查询</text>
<text x="768" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">① 当时生效的</text>
<text x="768" y="153" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">② 当时知道的</text>
<text x="768" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">③ 两者同时</text>
<text x="768" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">⑧ as-of 的完整式</text>
<rect x="756" y="210" width="180" height="106" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="768" y="234" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">两个错法</text>
<text x="768" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">只留当前：错 23.9%</text>
<text x="768" y="273" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">无系统时间：虚增 0.9%</text>
<text x="768" y="304" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">见 ④ 与 ⑤ 节</text>
<text x="120" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">本机：18 个月里 23.9% 的人归属变过；11.8% 的任职是补录；1.2% 是事后更正</text>
</svg>
