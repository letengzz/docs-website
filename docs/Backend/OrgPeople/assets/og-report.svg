<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="汇报线：实线、虚线与环">
<title>汇报线：实线、虚线与环</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">汇报线：一个人可以有两条线，但不能没有终点</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">实线决定考核与预算，虚线决定协作与可见范围；两条线都要能上溯到一个根</text>
<line x1="480" y1="116" x2="300" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="480" y1="116" x2="660" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="300" y1="200" x2="180" y2="244" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="300" y1="200" x2="330" y2="244" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="660" y1="200" x2="660" y2="244" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="180" y1="284" x2="660" y2="244" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="422" y="76" width="116" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="480" y="101" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">CEO</text>
<rect x="242" y="160" width="116" height="40" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.4"/>
<text x="300" y="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">研发VP</text>
<rect x="602" y="160" width="116" height="40" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.4"/>
<text x="660" y="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">销售VP</text>
<rect x="122" y="244" width="116" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="180" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">平台经理</text>
<rect x="272" y="244" width="116" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="330" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">应用经理</text>
<rect x="602" y="244" width="116" height="40" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="660" y="269" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">大区经理</text>
<rect x="740" y="96" width="196" height="100" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="752" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">两条线的分工</text>
<text x="752" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">实线：考核、预算</text>
<text x="752" y="159" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">虚线：协作、可见</text>
<text x="752" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a21caf" font-weight="600" text-anchor="start">分开存两张</text>
<rect x="740" y="208" width="196" height="100" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="752" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">环的代价</text>
<text x="752" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">注入 1.5% 反向指针</text>
<text x="752" y="271" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">环上 238 人（3.0%）</text>
<text x="752" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">一个环拖两个人</text>
<text x="28" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="400" text-anchor="start">递归上溯必须带深度上限（本机取 30）：没有上限的 CTE 遇到环会一直跑，直到内存耗尽。</text>
</svg>
