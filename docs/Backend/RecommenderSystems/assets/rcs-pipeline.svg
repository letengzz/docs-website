<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">四段链路与三个交界：每段坏的样子都不一样</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一个「推荐不准」，可能来自四段中的任何一段；三个交界是「两边都对、接起来就错」</text>

<rect x="36" y="96" width="196" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="134" y="122" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 召回</text>
<text x="134" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">全库 → 数百候选</text>
<text x="134" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">20~60 ms（并行）</text>
<text x="134" y="190" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：想要的根本不在池子里</text>

<rect x="288" y="96" width="196" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="386" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 特征</text>
<text x="386" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">候选 + 上下文 → 向量</text>
<text x="386" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">5~20 ms</text>
<text x="386" y="190" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：训练与服务不是同一个数</text>

<rect x="540" y="96" width="196" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="638" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 排序</text>
<text x="638" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">特征 → 分数 → 顺序</text>
<text x="638" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">10~30 ms</text>
<text x="638" y="190" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：分数不能当概率</text>

<rect x="792" y="96" width="132" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="858" y="122" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 后处理</text>
<text x="858" y="146" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">去重 打散 混排</text>
<text x="858" y="166" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">1~5 ms</text>
<text x="858" y="190" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">坏：改了顺序还改结论</text>

<line x1="232" y1="156" x2="288" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="484" y1="156" x2="540" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="736" y1="156" x2="792" y2="156" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="232" y="228" width="56" height="20" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="260" y="242" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界1</text>
<rect x="484" y="228" width="56" height="20" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="512" y="242" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界2</text>
<rect x="736" y="228" width="56" height="20" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="764" y="242" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界3</text>

<text x="36" y="276" font-size="11" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">三个交界的默认错误</text>
<text x="36" y="298" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界1：候选来自相似物品，特征却按物品 ID 取 → 一批候选特征全空，被打成同一个默认分</text>
<text x="36" y="320" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界2：训练用了批内统计量，服务时 batch=1 → 离线 AUC 高，线上分数挤成一团</text>
<text x="36" y="342" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">交界3：后处理改了顺序，日志仍记模型位置 → 实验结论「模型变好」，其实是规则改的</text>

<rect x="36" y="356" width="888" height="30" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="52" y="376" font-size="10.5" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">排查顺序固定为「候选覆盖率 → 特征缺失率 → 分数分布」，三个数算完再决定改哪一段</text>
</svg>
