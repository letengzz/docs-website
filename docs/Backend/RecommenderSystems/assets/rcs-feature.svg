<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">特征穿越：曝光时刻是唯一合法的右端点</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一个特征，只要右端点越过了曝光时刻，离线 AUC 就会「变好」——而线上取不到这个值</text>

<rect x="80" y="120" width="480" height="76" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="320" y="150" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">允许：event_time &lt; t0</text>
<text x="320" y="172" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">历史行为、历史统计、内容特征</text>
<text x="320" y="188" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">且 snapshot_at ≤ t0 − δ（δ = 特征任务 p99）</text>

<rect x="560" y="120" width="340" height="76" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="730" y="150" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">禁止：标签之后才产生的数据</text>
<text x="730" y="172" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">点击、停留、转化、退款、投诉</text>
<text x="730" y="188" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">以及由它们聚合出的任何统计量</text>

<line x1="80" y1="230" x2="900" y2="230" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="200" y1="222" x2="200" y2="238" stroke="#15803d" stroke-width="1.6"/>
<line x1="490" y1="222" x2="490" y2="238" stroke="#b45309" stroke-width="1.6"/>
<line x1="560" y1="216" x2="560" y2="244" stroke="#b91c1c" stroke-width="2"/>
<line x1="650" y1="222" x2="650" y2="238" stroke="#b91c1c" stroke-width="1.6"/>
<line x1="820" y1="222" x2="820" y2="238" stroke="#b91c1c" stroke-width="1.6"/>

<text x="200" y="258" font-size="10.5" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">t0 − 7d</text>
<text x="490" y="258" font-size="10.5" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">t0 − δ</text>
<text x="560" y="258" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">t0 曝光</text>
<text x="650" y="258" font-size="10.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">点击</text>
<text x="820" y="258" font-size="10.5" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">退款/投诉</text>

<line x1="200" y1="94" x2="200" y2="120" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="560" y1="94" x2="560" y2="120" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="212" y="106" font-size="10" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">特征窗口起点（由最长窗口决定）</text>
<text x="572" y="106" font-size="10" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">切在这里：左边可算，右边不可算</text>

<rect x="80" y="276" width="404" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="96" y="298" font-size="11.5" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">合规写法：点对点 join</text>
<text x="96" y="318" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">取 t0 之前最近一次快照，而不是按自然日 dt 关联</text>
<text x="96" y="336" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">按 dt 关联会让上午 10 点的样本用上晚上 8 点的行为</text>

<rect x="500" y="276" width="400" height="72" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="516" y="298" font-size="11.5" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">代价：离线 AUC 0.7497 → 0.9799</text>
<text x="516" y="318" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">带穿越特征时线上取不到，直接掉回 0.75，差 0.23</text>
<text x="516" y="336" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">AUC &gt; 0.90 在推荐场景里是报警信号，不是成绩</text>
</svg>
