<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img">
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">延迟预算：并行只省「和」与「最大」的差</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">六路召回、单路对数正态；并行后 p99 由最慢一路决定，超时阈值决定丢几路</text>

<text x="36" y="100" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">p99 对比（预算 120 ms）</text>
<line x1="36" y1="118" x2="470" y2="118" stroke="#cbd5e1" stroke-width="1"/>

<text x="36" y="150" font-size="11" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">串行</text>
<rect x="100" y="136" width="334" height="22" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
<text x="444" y="152" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">160.2 ms</text>

<text x="36" y="184" font-size="11" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行</text>
<rect x="100" y="170" width="147" height="22" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
<text x="257" y="186" font-size="10.5" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">70.3 ms（2.3×）</text>

<line x1="250" y1="126" x2="250" y2="200" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="254" y="212" font-size="9.5" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">120 ms 预算线</text>

<text x="36" y="240" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">p50：串行 107.7 ms ／ 并行 36.5 ms</text>

<line x1="490" y1="96" x2="490" y2="270" stroke="#e2e8f0" stroke-width="1"/>

<text x="510" y="100" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">单路超时阈值 → 请求受影响比例</text>

<text x="510" y="130" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">60 ms</text>
<rect x="570" y="118" width="14" height="18" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
<text x="596" y="132" font-size="10" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行丢 3.61% ／ 串行整单超时 99.99%</text>

<text x="510" y="166" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">40 ms</text>
<rect x="570" y="154" width="142" height="18" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
<text x="724" y="168" font-size="10" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行丢 36.57% ／ 串行 100%</text>

<text x="510" y="202" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">25 ms</text>
<rect x="570" y="190" width="364" height="18" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
<text x="942" y="204" font-size="10" fill="#7f1d1d" text-anchor="end" font-family="PingFang SC, Helvetica, Arial, sans-serif">丢 93.53%</text>

<rect x="510" y="232" width="414" height="38" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="526" y="250" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">把超时从 60 调到 40，等于放弃三分之一的召回通道</text>
<text x="526" y="264" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">监控上只表现为「降级率上升」，不会报错</text>

<rect x="36" y="286" width="280" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="52" y="308" font-size="11" font-weight="700" fill="#1e3a8a" font-family="PingFang SC, Helvetica, Arial, sans-serif">四层降级</text>
<text x="52" y="326" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">特征默认值 → 丢通道 → 规则排序</text>
<text x="52" y="344" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">→ 兜底池（预生成，进程内留一份）</text>

<rect x="336" y="286" width="280" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="352" y="308" font-size="11" font-weight="700" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行的隐藏成本</text>
<text x="352" y="326" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">线程池要独立；取消不传染；</text>
<text x="352" y="344" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">下游峰值被放大 6 倍</text>

<rect x="636" y="286" width="288" height="76" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="652" y="308" font-size="11" font-weight="700" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">容量：利特尔法则</text>
<text x="652" y="326" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">并发 = QPS × 延迟；池子 = 目标 QPS ×</text>
<text x="652" y="344" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">目标延迟 × 1.5，否则排队 → 雪崩</text>
</svg>
