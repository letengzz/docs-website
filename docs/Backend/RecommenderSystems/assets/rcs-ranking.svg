<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">排序分数有三种用法，各自要求不同</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一份分数被排序器、业务方、实验平台同时使用；三件事对分数的要求不一样，冲突就在这里</text>

<rect x="36" y="92" width="286" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="179" y="118" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 比大小（排序器自己）</text>
<text x="52" y="144" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">只需要序，不需要值</text>
<text x="52" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">成对/列表损失就够，AUC 可看</text>
<text x="52" y="184" font-size="10.5" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">坑：全局 AUC 掩盖人均差异</text>
<text x="52" y="204" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">实测 全局 0.6781／GAUC 0.6115</text>
<text x="52" y="224" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">差 0.0666 是「用户之间」的差异</text>

<rect x="338" y="92" width="286" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="481" y="118" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 当概率（业务方）</text>
<text x="354" y="144" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">要能乘：pCTR × 出价 × 客单价</text>
<text x="354" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">必须点态 + 校准（先验/Platt/isotonic）</text>
<text x="354" y="184" font-size="10.5" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">坑：负采样后均值高估 5.97×</text>
<text x="354" y="204" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">2.96% 被算成 17.69%，AUC 却不变</text>
<text x="354" y="224" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">验收：均值偏差 ≤10%，ECE &lt; 0.02</text>

<rect x="640" y="92" width="284" height="150" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
<text x="782" y="118" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 去偏差（训练侧）</text>
<text x="656" y="144" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">训练用 IPS 权重，打分不带 position</text>
<text x="656" y="164" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">把位置当特征＝教模型抄答案</text>
<text x="656" y="184" font-size="10.5" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">坑：IPS 方差大到不能选品</text>
<text x="656" y="204" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">新品 真值 8.40%／朴素 0.81%</text>
<text x="656" y="224" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">IPS 拉回 7.24%，但 Top5 估成 20.9%</text>

<rect x="36" y="262" width="888" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="52" y="282" font-size="11" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">暴露 10067 次 vs 16 次（633×）：位置越差，观测 CTR 越低，再训练就更差</text>
<text x="52" y="300" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">所以 IPS 的正确用法是「评估策略」，不是「决定给谁流量」——决策要加权重裁剪与最小曝光阈值</text>

<rect x="36" y="322" width="432" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="52" y="344" font-size="11" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">三种损失的选择</text>
<text x="52" y="364" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">要概率 → 点态；只要顺序 → 成对/列表；有分级标签 → NDCG</text>

<rect x="492" y="322" width="432" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="508" y="344" font-size="11" font-weight="700" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">一句判断</text>
<text x="508" y="364" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">下游有人拿分数做乘法，就必须点态 + 校准，没有例外</text>
</svg>
