<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
<defs><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">样本构造：五个决定，一个校准偏移</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">曝光表左连行为表 → 去重 → 切分 → 负采样 → 校准；每一步错了都不报错，只让指标悄悄失真</text>

<rect x="36" y="94" width="132" height="112" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
<text x="102" y="118" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">曝光日志</text>
<text x="102" y="140" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">request_id</text>
<text x="102" y="158" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">user / item</text>
<text x="102" y="176" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">position</text>
<text x="102" y="194" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">shown_at</text>

<line x1="168" y1="150" x2="196" y2="150" stroke="#64748b" stroke-width="1.4" marker-end="url(#as)"/>

<rect x="196" y="94" width="176" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="284" y="118" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 左连行为</text>
<text x="284" y="142" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">曝光 left join 点击</text>
<text x="284" y="162" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">未点即负样本</text>
<text x="284" y="186" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">只取点击 = 没有负样本</text>

<line x1="372" y1="150" x2="400" y2="150" stroke="#64748b" stroke-width="1.4" marker-end="url(#as)"/>

<rect x="400" y="94" width="176" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="488" y="118" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">② 去重键</text>
<text x="488" y="142" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">(request_id, item_id)</text>
<text x="488" y="162" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">一次请求一条样本</text>
<text x="488" y="186" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">按用户物品聚合 = CTR 虚高</text>

<line x1="576" y1="150" x2="604" y2="150" stroke="#64748b" stroke-width="1.4" marker-end="url(#as)"/>

<rect x="604" y="94" width="152" height="112" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="680" y="118" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">③ 时间切分</text>
<text x="680" y="142" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">训练 / 隔离带 / 验证</text>
<text x="680" y="162" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">隔离带 ≥ 特征窗口</text>
<text x="680" y="186" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">随机切分 = 自己骗自己</text>

<line x1="756" y1="150" x2="784" y2="150" stroke="#64748b" stroke-width="1.4" marker-end="url(#as)"/>

<rect x="784" y="94" width="140" height="112" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="854" y="118" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">④ 负采样</text>
<text x="854" y="142" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">只压训练集</text>
<text x="854" y="162" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">验证集保持全量</text>
<text x="854" y="186" font-size="10" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">验证也压 = 口径不一致</text>

<rect x="36" y="228" width="888" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="52" y="252" font-size="11.5" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">⑤ 校准：负采样 1:4 之后，AUC 几乎不变，概率全错</text>
<text x="52" y="274" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">真实 CTR 2.963%（1:32.7）→ 压到 1:4（8.19×）→ AUC 0.7544 / 0.7558，预测均值 17.69% vs 2.96%＝高估 5.97×</text>
<text x="52" y="294" font-size="10.5" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">修法只要一行：打分侧 logit − log(8.19) → 2.99%（残差 +0.9%）；写在训练侧会让离线与线上再次不同源</text>

<rect x="36" y="320" width="432" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="52" y="342" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">标签延迟：最近 7 天最脏</text>
<text x="52" y="362" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">负样本里混着「还没回传的正样本」，用两条 SQL 算成熟度差</text>

<rect x="492" y="320" width="432" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="508" y="342" font-size="11" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">反馈回路：样本只来自系统愿意展示的</text>
<text x="508" y="362" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">新品曝光量 1/633 → 观测 CTR 0.81% → 再训练 → 永久判死</text>
</svg>
