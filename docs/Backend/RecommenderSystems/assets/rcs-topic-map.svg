<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<text x="36" y="44" font-size="22" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">推荐系统工程：十页一张图</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">上排是链路，下排是横切关注点；每条连线都是本库既有的判据族，可被巡检机械核对</text>

<rect x="36" y="98" width="168" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="120" y="124" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">总览 RCO</text>
<text x="120" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">四段链路与三个交界</text>
<text x="120" y="168" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">先定位段，再谈模型</text>

<rect x="222" y="98" width="168" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="306" y="124" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">样本 RCS</text>
<text x="306" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">曝光左连行为</text>
<text x="306" y="168" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">负采样要校正</text>

<rect x="408" y="98" width="168" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="492" y="124" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">召回 RCR</text>
<text x="492" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">多路 + 配额 + 融合</text>
<text x="492" y="168" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">决定天花板</text>

<rect x="594" y="98" width="168" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="678" y="124" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">特征 RCF</text>
<text x="678" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">训练服务同一个数</text>
<text x="678" y="168" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">穿越与漂移</text>

<rect x="780" y="98" width="144" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="852" y="124" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">排序 RCK</text>
<text x="852" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">比大小 / 当概率</text>
<text x="852" y="168" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">去位置偏差</text>

<rect x="36" y="240" width="168" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="120" y="266" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">冷启动 RCC</text>
<text x="120" y="290" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">新品靠配额</text>
<text x="120" y="310" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">新用户靠会话</text>

<rect x="222" y="240" width="168" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="306" y="266" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">在线服务 RCV</text>
<text x="306" y="290" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">并行只省和与最大</text>
<text x="306" y="310" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">四层降级</text>

<rect x="408" y="240" width="168" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="492" y="266" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">评估 RCX</text>
<text x="492" y="290" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">样本量 / SRM / 偷看</text>
<text x="492" y="310" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">什么时候可以停</text>

<rect x="594" y="240" width="168" height="96" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
<text x="678" y="266" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">实战 RCP</text>
<text x="678" y="290" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">S1~S10 十步</text>
<text x="678" y="310" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">六项验收全 PASS</text>

<rect x="780" y="240" width="144" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<text x="852" y="266" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">FAQ RCQ</text>
<text x="852" y="290" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">症状 → 段 → 命令</text>
<text x="852" y="310" font-size="10.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">十分钟出结论</text>

<line x1="120" y1="194" x2="120" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="306" y1="194" x2="306" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="492" y1="194" x2="492" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="678" y1="194" x2="678" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>

<rect x="36" y="364" width="888" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="52" y="384" font-size="11" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">贯穿全篇的一条：判据跟着问题走，不跟着模型走</text>
<text x="52" y="402" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">所以本专题不建版本目录——换代的是召回与排序的实现，校准、偏差、冷启动三问一字未变</text>
</svg>
