<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="28" y="42" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#1f2328">从表达式到下一次触发时刻</text>
<text x="28" y="70" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">四步计算，两个坑在时区与日历语义上</text>
<rect x="28" y="100" width="210" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="42" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">① 解析表达式</text>
<text x="42" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">段数 / 字段范围</text>
<text x="42" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">5 段 vs 6 段</text>
<line x1="238" y1="150" x2="256" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="256" y="100" width="210" height="100" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="270" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">② 定位本地时刻</text>
<text x="270" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">IANA 时区</text>
<text x="270" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">DST 跳变 / 重复</text>
<line x1="466" y1="150" x2="484" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="484" y="100" width="210" height="100" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="498" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">③ 转成绝对时间</text>
<text x="498" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">UTC 时间戳落库</text>
<text x="498" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">不以本地字符串为键</text>
<line x1="694" y1="150" x2="712" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="712" y="100" width="210" height="100" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
<text x="726" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">④ 写入 next_run_at</text>
<text x="726" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">索引 (state, next_run_at)</text>
<text x="726" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">扫描只比时间戳</text>
<rect x="28" y="236" width="440" height="116" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="42" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">坑 1：本地时刻可能不存在</text>
<text x="42" y="288" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">2026-03-08 02:30（America/New_York）不存在</text>
<text x="42" y="309" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">datetime 不抛异常，静默映射成 03:30 EDT</text>
<text x="42" y="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">「每天 02:30」一年只跑 364 次</text>
<rect x="492" y="236" width="440" height="116" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="506" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">坑 2：本地时刻可能出现两次</text>
<text x="506" y="288" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">2026-11-01 01:30 有两个 offset（差 1 小时）</text>
<text x="506" y="309" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">按本地字符串判重 → 漏跑一次</text>
<text x="506" y="330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">按本地字符串去重失败 → 同一天跑两次</text>
<rect x="28" y="374" width="904" height="96" rx="10" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/>
<text x="42" y="402" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">推论</text>
<text x="42" y="426" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">一天不总是 86,400 秒：实测 03-08 为 82,800 秒、11-01 为 90,000 秒；业务关键任务应避开本地 00:00~03:00。</text>
<text x="28" y="506" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a">本页读数来自 Python 3.13 zoneinfo，脚本不入库，命令见正文第七节。</text>
</svg>
