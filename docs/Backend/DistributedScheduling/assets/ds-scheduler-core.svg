<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="28" y="42" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#1f2328">扫描 · 认领 · 执行三段式</text>
<text x="28" y="70" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">防重的正确性全部压在第二条语句的条件上</text>
<rect x="28" y="100" width="280" height="120" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="42" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">① 扫描</text>
<text x="42" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">WHERE state='pending'</text>
<text x="42" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">AND next_run_at &lt;= now()</text>
<text x="42" y="194" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">ORDER BY next_run_at LIMIT n</text>
<rect x="340" y="100" width="300" height="120" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="354" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">② 认领（唯一防重）</text>
<text x="354" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">UPDATE ... SET state='running'</text>
<text x="354" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">WHERE id IN (...) AND state='pending'</text>
<text x="354" y="194" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">检查影响行数 == 认领数</text>
<rect x="672" y="100" width="260" height="120" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="686" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">③ 执行</text>
<text x="686" y="152" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">调业务方法</text>
<text x="686" y="173" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#57606a">成功 + 写下一次时间（同事务）</text>
<line x1="308" y1="160" x2="340" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="640" y1="160" x2="672" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="28" y="250" width="440" height="130" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="42" y="278" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">没有条件更新时（实测）</text>
<text x="42" y="302" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">两个 worker 各读 20 条同一批任务</text>
<text x="42" y="323" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">实际执行 40 次，表里 running 只有 20 行</text>
<text x="42" y="344" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">数据看起来完全正常 → 最难排查的形态</text>
<rect x="492" y="250" width="440" height="130" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="506" y="278" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">有条件更新时（实测）</text>
<text x="506" y="302" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">两条语句各更新 20 条，互不相交</text>
<text x="506" y="323" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">20 线程 × 3 轮 = 600 次认领，重复 0</text>
<text x="506" y="344" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">锁等待错误 0，总耗时 166.6 ms</text>
<rect x="28" y="398" width="904" height="92" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="42" y="426" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#1f2328">另两个必备件</text>
<text x="42" y="450" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#57606a">租约 locked_until：执行 90 s 而租约 60 s 时，实测 91% 的任务会被别人抢走；租约 300 s 时为 0%。回收必须配 fencing。</text>
<text x="28" y="506" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a">索引 (state, next_run_at)：无索引 10.109 ms，有索引 0.023 ms（440 倍）。</text>
</svg>
