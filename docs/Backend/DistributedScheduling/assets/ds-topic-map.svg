<text x="248.0" y="351.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a">全部落到指标</text>
<line x1="716" y1="336" x2="716" y2="384" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
<text x="716.0" y="351.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a">同一套判据</text>
<text x="28" y="506" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a">虚线不存在：每一层都依赖上一层成立；上层没做对，下层的正确性是假的。</text>
