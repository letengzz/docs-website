<text x="380" y="122" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f766e">invoice_line（行项）—— 每一行都必须能回答「怎么算的 / 数量从哪来 / 为什么变了」</text>
<text x="380" y="148" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">kind</text>
<text x="500" y="148" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">描述</text>
<text x="636" y="148" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">数量来源</text>
<text x="812" y="148" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">金额</text>
<text x="380" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">subscription</text>
<text x="500" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">Pro × 10 席位</text>
<text x="636" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">seat_snapshot</text>
<text x="812" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">3,000.00</text>
<text x="380" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">proration</text>
<text x="500" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">升级折算（10-10）</text>
<text x="636" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">change_log</text>
<text x="812" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">212.91</text>
<text x="380" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">usage</text>
<text x="500" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">导出 128.4 万行</text>
<text x="636" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">agg-2026-10</text>
<text x="812" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">25.68</text>
<text x="380" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">credit_note</text>
<text x="500" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">上期红冲（重复计费）</text>
<text x="636" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">CN-2026-09-02</text>
<text x="812" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">−40.00</text>
<rect x="364" y="266" width="520" height="108" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="624.0" y="324.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e"></text>
<text x="380" y="292" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">税额的两种算口径（本机 1,000 张账单，税率 6%）</text>
<text x="380" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">按行算：Σ round(line × 6%)  ·  按总额算：round(Σ line × 6%)</text>
<text x="380" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9f1239">不一致 416/1,000（41.60%），最大差 0.03 元 —— 差的是分，丢的是「发票与账单能对上」</text>
<text x="380" y="362" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">口径必须与发票系统一致，因为发票是按行开具的</text>
<text x="36" y="408" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">四种行项类型是账单能被解释的最小集合：订阅、折算、用量、红冲。少一类，差额就一定落到「调整项」里</text>
<text x="36" y="436" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">任何「调整项」都必须带原因码与来源单号；否则下一次对账，这笔钱没有主人</text>
</svg>
