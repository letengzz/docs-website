<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="一张账单的结构与税额的两种算口径">
<rect x="0" y="0" width="920" height="470" fill="#f8fafc"/>
<text x="36" y="38" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">一张账单的结构与税额的两种算口径</text>
<text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">行项是唯一事实来源；小计、税、总额都必须是「从行项推出来」的，不能反过来</text>
<rect x="36" y="96" width="300" height="246" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
