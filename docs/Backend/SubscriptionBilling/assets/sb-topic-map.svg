<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-label="订阅计费专题地图">
<rect x="0" y="0" width="920" height="460" fill="#f8fafc"/>
<text x="36" y="38" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">订阅计费专题地图</text>
<text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">五段链 + 一张账单的八个问题：定价怎么长、周期怎么切、变更怎么折算、账单怎么开、钱怎么收、账怎么对</text>
<rect x="36" y="92" width="168" height="108" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="120.0" y="134.68" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">① 定价</text>
<text x="120.0" y="150.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">价格表形状</text>
<text x="120.0" y="166.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">阶梯 · 席位 · 封顶</text>
<rect x="228" y="92" width="168" height="108" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="312.0" y="134.68" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">② 周期</text>
<text x="312.0" y="150.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">锚点与边界</text>
<text x="312.0" y="166.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">anniversary / calendar</text>
<rect x="420" y="92" width="168" height="108" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="504.0" y="134.68" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e40af">③ 折算</text>
<text x="504.0" y="150.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">中途变更</text>
<text x="504.0" y="166.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">credit + charge</text>
<rect x="612" y="92" width="168" height="108" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
<text x="696.0" y="134.68" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f766e">④ 出账</text>
<text x="696.0" y="150.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">账单与行项</text>
<text x="696.0" y="166.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">税额 · 信用票据</text>
<rect x="804" y="92" width="80" height="108" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="844.0" y="134.68" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#9f1239">⑤ 收款</text>
<text x="844.0" y="150.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">催收</text>
<text x="844.0" y="166.68" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">降级</text>
<defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="204" y1="146" x2="228" y2="146" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar1)"/>
<defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="396" y1="146" x2="420" y2="146" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar2)"/>
<defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="588" y1="146" x2="612" y2="146" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar3)"/>
<defs><marker id="ar4" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="780" y1="146" x2="804" y2="146" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar4)"/>
<text x="36" y="232" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">每一页只回答一个「这步到底怎么算对」的问题；五段之间靠四个接缝连起来</text>
<rect x="36" y="252" width="132" height="22" rx="11.0" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="102.0" y="267.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1e40af">Overview</text>
<text x="180" y="267" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">五段链与三个金额口径（SBO）</text>
<rect x="36" y="278" width="132" height="22" rx="11.0" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="102.0" y="293.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1e40af">Pricing</text>
<text x="180" y="293" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">定价模型与价格表：阶梯、席位、最低消费（SBP）</text>
<rect x="36" y="304" width="132" height="22" rx="11.0" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="102.0" y="319.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1e40af">Cycle</text>
<text x="180" y="319" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">周期与锚点：月末、时区、闭账与迟到账（SBC）</text>
<rect x="36" y="330" width="132" height="22" rx="11.0" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="102.0" y="345.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f766e">Proration</text>
<text x="180" y="345" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">升降配与按比例折算：四种口径的差多少（SBR）</text>
<rect x="36" y="356" width="132" height="22" rx="11.0" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="102.0" y="371.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f766e">Invoice</text>
<text x="180" y="371" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">账单结构、税额口径与信用票据（SBI）</text>
<rect x="36" y="382" width="132" height="22" rx="11.0" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
<text x="102.0" y="397.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9f1239">Dunning</text>
<text x="180" y="397" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">催收阶梯、账龄与服务降级（SBU）</text>
<rect x="36" y="408" width="132" height="22" rx="11.0" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="102.0" y="423.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#92400e">Reconciliation</text>
<text x="180" y="423" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">三向对账与收入确认边界（SBS）</text>
<rect x="36" y="434" width="132" height="22" rx="11.0" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="102.0" y="449.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#92400e">Practice</text>
<text x="180" y="449" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">最小可跑的订阅计费：12 表 + 出账五步（SBE）</text>
</svg>
