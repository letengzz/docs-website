<text x="36" y="282" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9f1239">两种实现 12 期后的差距：−29 天（少收一整期的 27 天 + 2 月那 2 天）</text>
<line x1="36" y1="296" x2="884" y2="296" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="36" y="322" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">周期边界必须落在「客户能预期」的位置上：</text>
<text x="48" y="348" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 自然月（calendar）：所有人同一天出账，财务最省事，但月中注册的客户第一期必须折算</text>
<text x="48" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 周年日（anniversary）：每个客户自己的 30/31 天，不折算；但出账是天天都在跑，不能只排一次批</text>
<text x="48" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 混合：首期折算到自然月末，之后走周年日 —— 这是多数商用系统的默认，也要在合同里写清</text>
</svg>
