<line x1="740" y1="130" x2="748" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar6)"/>
<text x="36" y="190" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">② 递推（recursive）：每期都由「上一期的实际结束日」加一个月 —— 一旦撞上 2 月就被永久拉短</text>
<rect x="36" y="202" width="104" height="44" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
