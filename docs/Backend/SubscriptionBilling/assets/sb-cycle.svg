<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="周期锚点：锚定与递推只差一步，一年后差 29 天">
<rect x="0" y="0" width="920" height="430" fill="#f8fafc"/>
<text x="36" y="38" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">周期锚点：锚定与递推只差一步，一年后差 29 天</text>
<text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">起订日 2026-01-30；同一份「每月续期」的需求，两种实现的边界完全不同</text>
<text x="36" y="96" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">① 锚定（anchored）：每期都由「起订日的日号」重算，2 月缺 30 号就取当月最后一天</text>
