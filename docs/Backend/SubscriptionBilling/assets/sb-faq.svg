<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="账单类问题的分诊树">
<rect x="0" y="0" width="920" height="420" fill="#f8fafc"/>
<text x="36" y="38" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">账单类问题的分诊树</text>
<text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">先确定「错在哪一段」，再决定是改代码、补数据还是改合同</text>
<rect x="340" y="92" width="240" height="52" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="460.0" y="122.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9f1239">客户说「这个月账不对」</text>
<rect x="36" y="176" width="200" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="136.0" y="203.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">金额比上月高</text>
<text x="136.0" y="219.32" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#78350f">先看用量还是单价</text>
<rect x="256" y="176" width="200" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="356.0" y="203.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">金额比预期低</text>
<text x="356.0" y="219.32" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#78350f">先看漏计还是折扣</text>
<rect x="476" y="176" width="200" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="576.0" y="203.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">多了一张账单</text>
<text x="576.0" y="219.32" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#78350f">先看出账批与唯一键</text>
<rect x="696" y="176" width="188" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="790.0" y="203.32" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">服务被降级</text>
<text x="790.0" y="219.32" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#78350f">先看催收状态</text>
<defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="460" y1="148" x2="136" y2="172" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar1)"/>
<defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="460" y1="148" x2="356" y2="172" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar2)"/>
<defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="460" y1="148" x2="576" y2="172" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar3)"/>
<defs><marker id="ar4" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<line x1="460" y1="148" x2="790" y2="172" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar4)"/>
<text x="36" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">· 用量涨：看聚合口径与迟到</text>
<text x="36" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 单价变：看价格表版本生效时间</text>
<text x="256" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">· 漏计：看归期与迟到窗口</text>
<text x="256" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 折扣：看合同与优惠券作用域</text>
<text x="476" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">· 重跑：唯一键是否生效</text>
<text x="476" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 折算：变更流水是否双行</text>
<text x="696" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">· 降级：dunning 状态与 D+</text>
<text x="696" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 恢复：幂等重放是否留痕</text>
<line x1="36" y1="320" x2="884" y2="320" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="36" y="346" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">三条纪律：先冻结出账批再查；任何手工改账都留调整项；先给客户一个可核对的行项，再解释原因</text>
<text x="36" y="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9f1239">最容易走错的一步：直接改账单金额「让它对上」—— 这会把一个可解释的差异变成不可解释的差异</text>
</svg>
