<text x="92" y="420" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">三向对账</text>
<text x="200" y="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">差集 + 归口 + 四态幂等</text>
<line x1="590" y1="292" x2="590" y2="452" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="608" y="314" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#9f1239">六条负向验收（必须失败）</text>
<text x="608" y="338" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 同一 (tenant, period) 出两次账 → 第二次 0 行</text>
<text x="608" y="358" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 缺幂等键重跑出账 → 账单翻倍</text>
<text x="608" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 折算只收新增不退未用 → 净额对不上</text>
<text x="608" y="398" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 按行税额 ≠ 发票税额 → 发票校验失败</text>
<text x="608" y="418" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 支付缺失仍把账单置 paid → 对账差集非空</text>
<text x="608" y="438" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">· 降级后仍可写 → 服务闸门失效</text>
</svg>
