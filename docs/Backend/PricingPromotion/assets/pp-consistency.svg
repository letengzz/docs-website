<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="试算与结算：两条路径与一份快照">
  <rect x="0" y="0" width="920" height="420" fill="#f8fafc"/>
  <text x="36" y="38" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">试算与结算：两条路径与一份快照</text>
  <text x="36" y="60" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">同一个应付至少被算四次；唯一可行的解法是锁价 + 快照 + 可回放</text>
  <rect x="36" y="96" width="250" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="161.0" y="127.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">路径 A（错误）</text>
  <text x="161.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">试算读实时 → 提交再读</text>
  <rect x="36" y="196" width="250" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="161.0" y="227.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#92400e">路径 B（底线）</text>
  <text x="161.0" y="245.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#78350f">提交按 quote_id 取回</text>
  <rect x="36" y="296" width="250" height="70" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="161.0" y="327.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">路径 C（默认）</text>
  <text x="161.0" y="345.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">B + 过期/在售/版本校验</text>
  <defs><marker id="a12" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="290" y1="131" x2="340" y2="131" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>
  <defs><marker id="a14" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="290" y1="231" x2="340" y2="231" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a14)"/>
  <defs><marker id="a16" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="290" y1="331" x2="340" y2="331" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a16)"/>
  <rect x="344" y="96" width="250" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="469.0" y="127.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">改价 5% 后</text>
  <text x="469.0" y="145.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">500/500 单结算≠试算</text>
  <rect x="344" y="196" width="250" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="469.0" y="227.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">快照四要素</text>
  <text x="469.0" y="245.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">金额 · 行 · 分摊 · 版本</text>
  <rect x="344" y="296" width="250" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="469.0" y="327.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">三向对账</text>
  <text x="469.0" y="345.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">订单 ⇄ 支付 ⇄ 分录</text>
  <rect x="628" y="196" width="256" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="756.0" y="227.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#5b21b6">锁价 30 分钟</text>
  <text x="756.0" y="245.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4c1d95">锁价不锁库存</text>
  <text x="36" y="388" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9f1239">平均差额 10.75 元；静默按新价下单是最糟的选择——宁可 409 并附新 quote</text>
</svg>
