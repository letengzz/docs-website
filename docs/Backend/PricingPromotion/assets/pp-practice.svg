  <rect x="332" y="104" width="270" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="467.0" y="135.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1e40af">Java 25 + Boot 4.1</text>
  <text x="467.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">long 金额 · JdbcClient</text>
  <defs><marker id="a12" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="606" y1="139.0" x2="624" y2="139.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>
  <rect x="628" y="104" width="270" height="70" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="763.0" y="135.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">Redis 8</text>
  <text x="763.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#115e59">只做加速读</text>
  <text x="36" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">验收序列</text>
  <rect x="36" y="226" width="270" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="171.0" y="257.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#5b21b6">S1~S2</text>
  <text x="171.0" y="275.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4c1d95">容器健康 · 建表种子</text>
  <defs><marker id="a21" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="310" y1="261.0" x2="328" y2="261.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a21)"/>
  <rect x="332" y="226" width="270" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="467.0" y="257.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#5b21b6">S3~S4</text>
  <text x="467.0" y="275.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4c1d95">试算 · 分摊守恒</text>
  <defs><marker id="a26" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="606" y1="261.0" x2="624" y2="261.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a26)"/>
  <rect x="628" y="226" width="270" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="763.0" y="257.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#5b21b6">S5~S6</text>
  <text x="763.0" y="275.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#4c1d95">锁价 · 幂等</text>
  <rect x="36" y="316" width="200" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="136.0" y="347.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">N1 过期 quote</text>
  <text x="136.0" y="365.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">必须 409</text>
  <defs><marker id="a34" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="240" y1="351.0" x2="254" y2="351.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a34)"/>
  <rect x="258" y="316" width="200" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="358.0" y="347.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">N2 券不超发</text>
  <text x="358.0" y="365.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">成功≤100</text>
  <defs><marker id="a39" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="462" y1="351.0" x2="476" y2="351.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a39)"/>
  <rect x="480" y="316" width="200" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="580.0" y="347.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">N3 不多退</text>
  <text x="580.0" y="365.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">读原分摊</text>
  <defs><marker id="a44" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
  <line x1="684" y1="351.0" x2="698" y2="351.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a44)"/>
  <rect x="702" y="316" width="200" height="70" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="802.0" y="347.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#9f1239">N4 不 d&gt;p</text>
  <text x="802.0" y="365.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#881337">absorbed&gt;0</text>
  <text x="36" y="412" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9f1239">负向验收证明的不是「功能在」，而是「守卫还在」——正向验收在删掉守卫的实现上照样能过</text>
