<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="升级阶梯与三个阈值">
<rect x="0" y="0" width="920" height="360" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">升级阶梯与三个阈值</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">升级的目标是「当时在线的人」，不是「某个职位」</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="40" y="100" width="190" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="135.0" y="134.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">L0 自查</text>
<text x="135.0" y="152.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">剩余 40%</text>
<line x1="230" y1="136" x2="252" y2="136" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="252" y="100" width="190" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="347.0" y="134.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">L1 组长</text>
<text x="347.0" y="152.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">剩余 20%</text>
<line x1="442" y1="136" x2="464" y2="136" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="464" y="100" width="190" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="559.0" y="134.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">L2 二线</text>
<text x="559.0" y="152.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">已违约</text>
<line x1="654" y1="136" x2="676" y2="136" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="676" y="100" width="190" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="771.0" y="134.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">L3 值班</text>
<text x="771.0" y="152.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">违约 2 小时</text>
<text x="40" y="220" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">每一级必须有「触发 / 动作 / 停止」三要素</text>
<rect x="40" y="236" width="400" height="88" rx="8" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="240.0" y="278.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">自然时钟算 80% 阈值</text>
<text x="240.0" y="296.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">73.0% 的预警落在非工作时段</text>
<rect x="480" y="236" width="400" height="88" rx="8" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="680.0" y="278.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">工作时钟算 80% 阈值</text>
<text x="680.0" y="296.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">0% 落在非工作时段</text>
</svg>
