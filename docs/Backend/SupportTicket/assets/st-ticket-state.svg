<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="工单六态与两处守卫">
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">工单六态与两处守卫</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">状态代表客户处境；流程细节留在事件流水</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="60" y="100" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="155.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">NEW</text>
<text x="155.0" y="149.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">待受理</text>
<rect x="330" y="100" width="190" height="66" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="425.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">OPEN</text>
<text x="425.0" y="149.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">有人负责</text>
<rect x="600" y="100" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="695.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">PENDING</text>
<text x="695.0" y="149.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">等客户</text>
<rect x="600" y="240" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="695.0" y="271.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">ON_HOLD</text>
<text x="695.0" y="289.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">等内部</text>
<rect x="330" y="240" width="190" height="66" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="425.0" y="271.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">RESOLVED</text>
<text x="425.0" y="289.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">已给结论</text>
<rect x="60" y="240" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="155.0" y="271.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">CLOSED</text>
<text x="155.0" y="289.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">已结束</text>
<line x1="250" y1="133" x2="330" y2="133" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="520" y1="133" x2="600" y2="133" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="600" y1="166" x2="600" y2="240" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="690" y1="166" x2="690" y2="300" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="600" y1="300" x2="520" y2="273" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="330" y1="273" x2="250" y2="273" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="258" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">认领 + 公开回复</text>
<text x="612" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">挂起</text>
<text x="120" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">超窗口自动关</text>
<rect x="330" y="330" width="520" height="50" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="590.0" y="360.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">守卫：OPEN 必须有负责人与首个公开回复；RESOLVED 必须填解决类型</text>
</svg>
