<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="七步流水与十二个负向用例">
<rect x="0" y="0" width="920" height="360" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">七步流水与十二个负向用例</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">每个承诺都有对应断言，验收脚本只返回数字</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="28" y="96" width="116" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="86.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S1 占位</text>
<line x1="144" y1="126" x2="156" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="156" y="96" width="116" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="214.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S2 建单</text>
<line x1="272" y1="126" x2="284" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="284" y="96" width="116" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="342.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S3 首消息</text>
<line x1="400" y1="126" x2="412" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="412" y="96" width="116" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="470.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S4 快照</text>
<line x1="528" y1="126" x2="540" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="540" y="96" width="116" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="598.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S5 认领</text>
<line x1="656" y1="126" x2="668" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="668" y="96" width="116" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="726.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S6 回填</text>
<line x1="784" y1="126" x2="796" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="796" y="96" width="116" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="854.0" y="131.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">S7 升级</text>
<rect x="28" y="190" width="420" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="238.0" y="265.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b"></text>
<text x="48" y="216" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">六个验收查询（目标值）</text>
<text x="48" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">请求 2700 / 工单 2000 / 孤儿 0</text>
<text x="48" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">无首响即关闭 0</text>
<text x="48" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">有认领无租约 0</text>
<text x="48" y="310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">缺 SLA 快照 0</text>
<text x="48" y="332" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">重复升级 0</text>
<text x="48" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">深层合并链 0</text>
<rect x="480" y="190" width="400" height="140" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="680.0" y="265.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b"></text>
<text x="500" y="216" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">负向用例必须先失败</text>
<text x="500" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">P2 并发认领：成功次数 = 行数</text>
<text x="500" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">P3 内部备注不算首响</text>
<text x="500" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">P6 同级升级只能一条</text>
<text x="500" y="310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">P10 周五 17:00 → 周一 16:00</text>
<text x="500" y="332" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">P11 夏令时 23 / 25 小时</text>
</svg>
