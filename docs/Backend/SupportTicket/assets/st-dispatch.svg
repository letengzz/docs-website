<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" role="img" aria-label="分派策略与队头阻塞">
<rect x="0" y="0" width="920" height="370" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">分派策略与队头阻塞</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">同一批参数：12 坐席，λ=4.0 单/小时</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="40" y="90" width="420" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="250.0" y="155.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b"></text>
<text x="60" y="116" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">硬轮询（队头阻塞）</text>
<text x="60" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">队列头指定坐席 7，而 7 在忙</text>
<text x="60" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">坐席 1~6 空闲，整队仍不能动</text>
<text x="60" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c">平均等待 7,346 分钟</text>
<rect x="480" y="90" width="400" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="680.0" y="155.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b"></text>
<text x="500" y="116" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">拉取：先技能，再负载</text>
<text x="500" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">候选集按技能过滤，再取负载最小</text>
<text x="500" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">技能不匹配率 24.1%，返工减半</text>
<text x="500" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#166534">平均等待 37.1 分钟</text>
<text x="40" y="252" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">认领必须是比较并设置（CAS）</text>
<rect x="40" y="268" width="400" height="74" rx="8" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="240.0" y="303.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">先查后改</text>
<text x="240.0" y="321.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">374 次成功 / 100 行</text>
<rect x="480" y="268" width="400" height="74" rx="8" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="680.0" y="303.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">条件更新 + 租约</text>
<text x="680.0" y="321.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">100 次成功 / 100 行</text>
</svg>
