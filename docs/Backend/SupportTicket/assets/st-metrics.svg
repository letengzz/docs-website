<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-label="四个分母陷阱与占用率曲线">
<rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">四个分母陷阱与占用率曲线</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">同一批数据，两种口径可以差 41 个百分点</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="40" y="90" width="280" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="180.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">按单达标率</text>
<text x="180.0" y="141.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">88.31%</text>
<rect x="340" y="90" width="280" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="480.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">按等待分钟</text>
<text x="480.0" y="141.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">46.98%</text>
<rect x="640" y="90" width="240" height="70" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="760.0" y="123.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">差值</text>
<text x="760.0" y="141.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">41.32 个百分点</text>
<rect x="40" y="180" width="280" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="180.0" y="213.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">CSAT（只算回复者）</text>
<text x="180.0" y="231.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">79.23%</text>
<rect x="340" y="180" width="280" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="480.0" y="213.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">CSAT（全量真实）</text>
<text x="480.0" y="231.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">61.72%</text>
<rect x="640" y="180" width="240" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="760.0" y="213.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">回复率</text>
<text x="760.0" y="231.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">32.8%</text>
<text x="40" y="290" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">占用率对等待极度敏感</text>
<text x="40" y="318" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">ρ=0.73 → 11.6 分钟；ρ=0.90 → 69.7 分钟；ρ=0.95 → 193.8 分钟</text>
<text x="40" y="344" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c">工作量只涨 30%，等待涨 16 倍</text>
