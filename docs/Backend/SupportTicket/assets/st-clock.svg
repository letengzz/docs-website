<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="三时钟与三类日历">
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">三时钟与三类日历</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">同一张单，三种「多久」可以差两个数量级</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="40" y="90" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="135.0" y="121.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">首响</text>
<text x="135.0" y="139.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">提交→公开回复</text>
<rect x="250" y="90" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="345.0" y="121.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">解决</text>
<text x="345.0" y="139.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">提交→解决字段</text>
<rect x="460" y="90" width="190" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="555.0" y="121.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">定期更新</text>
<text x="555.0" y="139.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">上次回复→本次</text>
<rect x="670" y="90" width="210" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="775.0" y="121.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">下次响应</text>
<text x="775.0" y="139.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">追问→下个回复</text>
<text x="40" y="200" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">日历的四种边界</text>
<rect x="40" y="216" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="138.0" y="247.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">工作日</text>
<text x="138.0" y="265.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">周末不一定是周六日</text>
<rect x="252" y="216" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350.0" y="247.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">工作时段</text>
<text x="350.0" y="265.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">可能多段，有午休</text>
<rect x="464" y="216" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="562.0" y="247.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">节假日</text>
<text x="562.0" y="265.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">假日表 + 补班表</text>
<rect x="676" y="216" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="774.0" y="247.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">时区</text>
<text x="774.0" y="265.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">每个日历绑 IANA</text>
<rect x="40" y="308" width="840" height="66" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="460.0" y="339.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">周五 17:00 + 8 小时：自然时钟 周六 01:00；工作时钟 下周一 16:00</text>
<text x="460.0" y="357.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">6,000 单里 72.52% 的自然到期点落在非工作时段</text>
</svg>
