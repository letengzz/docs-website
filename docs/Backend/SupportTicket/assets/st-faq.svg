<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-label="分诊路径与止血顺序">
<rect x="0" y="0" width="920" height="350" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">分诊路径与止血顺序</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">从「客户说了什么」到「哪一段错了」</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="40" y="90" width="300" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="190.0" y="118.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">客户说了什么</text>
<text x="190.0" y="136.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">无首响 / 双认领 / 合并丢单</text>
<line x1="340" y1="120" x2="380" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="380" y="90" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="118.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">查一条 SQL</text>
<text x="500.0" y="136.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">不是「检查配置」</text>
<line x1="620" y1="120" x2="660" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="660" y="90" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="770.0" y="118.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">定位到段</text>
<text x="770.0" y="136.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">七段之一</text>
<text x="40" y="200" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">止血五步，顺序不可跳</text>
<rect x="40" y="216" width="164" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="122.0" y="253.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">① 先指一个具体的人</text>
<rect x="212" y="216" width="164" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="294.0" y="253.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">② 再算承诺还剩多久</text>
<rect x="384" y="216" width="164" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="466.0" y="253.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">③ 对客户说一句人话</text>
<rect x="556" y="216" width="164" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="638.0" y="253.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">④ 判断是否个案</text>
<rect x="728" y="216" width="164" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="810.0" y="253.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">⑤ 最后才改报表</text>
</svg>
