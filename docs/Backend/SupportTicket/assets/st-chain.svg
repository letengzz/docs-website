<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="七段服务链与三个时间">
<rect x="0" y="0" width="920" height="330" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">七段服务链与三个时间</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">安静的六段：归并、分派、认领、履约、关闭、度量</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#64748b"/></marker></defs>
<rect x="28" y="96" width="116" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="86.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">① 进线</text>
<text x="86.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">渠道消息</text>
<line x1="144" y1="137" x2="156" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="156" y="96" width="116" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="214.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">② 归并</text>
<text x="214.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">可能是 0 张单</text>
<line x1="272" y1="137" x2="284" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="284" y="96" width="116" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="342.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">③ 分派</text>
<text x="342.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">进池子</text>
<line x1="400" y1="137" x2="412" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="412" y="96" width="116" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="470.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">④ 认领</text>
<text x="470.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">唯一负责人</text>
<line x1="528" y1="137" x2="540" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="540" y="96" width="116" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="598.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">⑤ 履约</text>
<text x="598.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">公开回复</text>
<line x1="656" y1="137" x2="668" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="668" y="96" width="116" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="726.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">⑥ 关闭</text>
<text x="726.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">可重开</text>
<line x1="784" y1="137" x2="796" y2="137" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="796" y="96" width="116" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="854.0" y="135.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">⑦ 度量</text>
<text x="854.0" y="153.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">达标率</text>
<text x="28" y="220" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">三个时间轴并行，且互不相等</text>
<rect x="28" y="236" width="280" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="168.0" y="266.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">客户时间</text>
<text x="168.0" y="284.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">自然时长，含全部等待</text>
<rect x="320" y="236" width="280" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="460.0" y="266.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">坐席时间</text>
<text x="460.0" y="284.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">扣除等待客户与排队</text>
<rect x="612" y="236" width="280" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="752.0" y="266.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">承诺时间</text>
<text x="752.0" y="284.0" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">营业小时内累计</text>
</svg>
