<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="lm-boundaries.svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">四条边界：动手之前必须写下来的四句话</text>
  <rect x="32" y="92" width="200" height="186" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">边界一 · 改造 ≠ 重写</text>
  <text x="48" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#334155">重写的验收标准是</text>
  <text x="48" y="154" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「功能对等」——</text>
  <text x="48" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#334155">一次性、末期才知道答案。</text>
  <text x="48" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#334155"></text>
  <text x="48" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#334155">改造的验收标准是</text>
  <text x="48" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「可退性」——</text>
  <text x="48" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#334155">每一步当场就能回答。</text>
  <text x="48" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#334155"></text>
  <text x="48" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：能不能说出</text>
  <text x="48" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#334155">「退回去要几分钟」。</text>
  <rect x="248" y="92" width="200" height="186" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="264" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">边界二 · 绞杀者 ≠ 大爆炸</text>
  <text x="264" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#334155">区别不是粒度，是结构：</text>
  <text x="264" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#334155">有没有一个「改配置</text>
  <text x="264" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#334155">就能改变归属」的位置。</text>
  <text x="264" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#334155"></text>
  <text x="264" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#334155">大爆炸把风险堆到最后一天；</text>
  <text x="264" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#334155">绞杀者第一次切流就开始兑现</text>
  <text x="264" y="224" font-family="system-ui, sans-serif" font-size="10" fill="#334155">。</text>
  <text x="264" y="238" font-family="system-ui, sans-serif" font-size="10" fill="#334155"></text>
  <text x="264" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#334155">判据：回退要不要</text>
  <text x="264" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#334155">回滚数据 + 重新部署。</text>
  <rect x="464" y="92" width="200" height="186" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">边界三 · 防腐层 ≠ 适配器</text>
  <text x="480" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#334155">适配器翻译接口形状</text>
  <text x="480" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#334155">（参数、协议、格式）；</text>
  <text x="480" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#334155">防腐层翻译语义与模型</text>
  <text x="480" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#334155">（同一个词指的不是一回事）。</text>
  <text x="480" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#334155"></text>
  <text x="480" y="200" font-family="system-ui, sans-serif" font-size="9" fill="#334155">前者失效会编译不过；</text>
  <text x="480" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#334155">后者失效是「能跑通，</text>
  <text x="480" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#334155">但数据在慢慢错」。</text>
  <text x="480" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#334155"></text>
  <text x="480" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#334155">判据：领域代码里有没有旧字段</text>
  <text x="480" y="260" font-family="system-ui, sans-serif" font-size="9" fill="#334155">名。</text>
  <rect x="680" y="92" width="188" height="186" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="696" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">边界四 · 切换 ≠ 上线</text>
  <text x="696" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#334155">上线：代码进了生产，</text>
  <text x="696" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#334155">但可能被开关挡住，</text>
  <text x="696" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#334155">一个用户都没用到。</text>
  <text x="696" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#334155"></text>
  <text x="696" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#334155">切换：一部分真实流量</text>
  <text x="696" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#334155">开始由新系统负责。</text>
  <text x="696" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#334155"></text>
  <text x="696" y="224" font-family="system-ui, sans-serif" font-size="10" fill="#334155">两者之间可以隔几周，</text>
  <text x="696" y="236" font-family="system-ui, sans-serif" font-size="10" fill="#334155">这段间隔不是浪费——</text>
  <text x="696" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#334155">它专门用来暴露真实环境问</text>
  <text x="696" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#334155">题。</text>
  <rect x="32" y="296" width="836" height="132" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">四个数字：没有一个是能用形容词填的</text>
  <text x="48" y="344" font-family="system-ui, sans-serif" font-size="12" fill="#334155">① 回退时间：从决定回退到流量全部回到旧系统，需要多少分钟（「尽快」不合格）</text>
  <text x="48" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#334155">② 不可停机清单：哪些能力一秒钟都不能停，逐条列出并写依据（「核心业务」不合格）</text>
  <text x="48" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#334155">③ 当前流量归属：现在百分之多少的哪一类请求走新系统（必须带维度，只报「30%」没有信息</text>
  <text x="48" y="386" font-family="system-ui, sans-serif" font-size="12" fill="#334155">量）</text>
  <text x="48" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#334155">④ 退役条件：旧系统的哪一块，在什么客观条件下、由谁宣布停止使用（「等稳定以后」不合</text>
  <text x="48" y="414" font-family="system-ui, sans-serif" font-size="12" fill="#334155">格）</text>
  <rect x="32" y="444" width="836" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="468" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">什么时候不该做改造</text>
  <text x="48" y="492" font-family="system-ui, sans-serif" font-size="9" fill="#334155">系统本来就小 / 请求无法被拦截 / 拿不到旧系统源码或变更权 / 需要快速下线 / 没有人能持续投入。</text>
  <text x="48" y="506" font-family="system-ui, sans-serif" font-size="9" fill="#334155">前四条来自 Azure 与 AWS 两份官方文档；第五条是本库补的——改造的收益靠节奏，一次性投入后抽走比不做更糟。</text>
</svg>
