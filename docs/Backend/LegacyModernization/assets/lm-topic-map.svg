  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">遗留系统改造：九页地图</text>
  <text x="32" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">目录页 → 总览 → 绞杀者 → 防腐层 → 数据迁移 → 灰度切换 → 共存期 → 实战 → FAQ（2026-10 口径）</text>
