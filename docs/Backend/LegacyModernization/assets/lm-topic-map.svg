  <text x="48" y="332" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不教 SQL 语法 → 数据库专</text>
  <text x="48" y="344" font-family="system-ui, sans-serif" font-size="10" fill="#334155">题</text>
  <text x="48" y="356" font-family="system-ui, sans-serif" font-size="10" fill="#334155">不教队列怎么选 → 消息队列</text>
  <text x="48" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#334155">专题</text>
