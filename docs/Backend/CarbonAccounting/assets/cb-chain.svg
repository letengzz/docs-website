<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="七段链：界 → 采 → 因 → 算 → 摊 → 核 → 报">
<title>七段链：界 → 采 → 因 → 算 → 摊 → 核 → 报</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">七段链：界 → 采 → 因 → 算 → 摊 → 核 → 报</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">每段都有自己的产物；五段的失败是安静的</text>
<rect x="18" y="86" width="118" height="140" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="30" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">① 界</text>
<text x="30" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">组织边界</text>
<text x="30" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">运营边界</text>
<text x="30" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">失败：显性</text>
<line x1="136" y1="156" x2="148" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="150" y="86" width="118" height="140" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="162" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">② 采</text>
<text x="162" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">计量与账单</text>
<text x="162" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">期间与缺失</text>
<text x="162" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400">失败：安静</text>
<line x1="268" y1="156" x2="280" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="282" y="86" width="118" height="140" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="294" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">③ 因</text>
<text x="294" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">因子版本</text>
<text x="294" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">GWP 与单位</text>
<text x="294" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">失败：安静</text>
<line x1="400" y1="156" x2="412" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="414" y="86" width="118" height="140" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="426" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">④ 算</text>
<text x="426" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">量 × 因子</text>
<text x="426" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">范围归属</text>
<text x="426" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="532" y1="156" x2="544" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="546" y="86" width="118" height="140" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="558" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑤ 摊</text>
<text x="558" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">共因分配</text>
<text x="558" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">产品碳足迹</text>
<text x="558" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#a21caf" font-weight="400">失败：安静</text>
<line x1="664" y1="156" x2="676" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="678" y="86" width="118" height="140" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="690" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑥ 核</text>
<text x="690" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">数据质量</text>
<text x="690" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">不确定度</text>
<text x="690" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#4338ca" font-weight="400">失败：安静</text>
<line x1="796" y1="156" x2="808" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="810" y="86" width="118" height="140" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="822" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑦ 报</text>
<text x="822" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">披露与重述</text>
<text x="822" y="151" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">履约与鉴证</text>
<text x="822" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400">失败：显性</text>
<text x="24" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">产物：</text>
<text x="70" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">边界清单 · 活动数据台账 · 因子库快照 · 计算明细 · 分配台账 · 数据质量评分 · 披露报表与重述记录</text>
<text x="24" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="700">安静失败的形态：</text>
<text x="120" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">数算出来了、报表也合上了、审核人也签了字——只是边界与口径不是当初约定的那一个。</text>
</svg>
