<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="范围二双报：位置法 5,568 t / 市场法 4,320 t">
<title>范围二双报：位置法 5,568 t / 市场法 4,320 t</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">范围二双报：位置法 5,568 t / 市场法 4,320 t</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">1,000 万 kWh，40% 由合同工具覆盖</text>
<rect x="24" y="78" width="200" height="110" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="36" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">位置法</text>
<text x="36" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">电网平均 0.5568</text>
<text x="36" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">10,000,000 kWh</text>
<text x="36" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400">5,568.0 t</text>
<rect x="252" y="78" width="200" height="110" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="264" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">市场法（正确）</text>
<text x="264" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">残差因子 0.72 × 60%</text>
<text x="264" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">合同工具覆盖 40%</text>
<text x="264" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">4,320.0 t（−22.41%）</text>
<rect x="480" y="78" width="200" height="110" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="492" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">市场法（错用均值）</text>
<text x="492" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">0.5568 × 60%</text>
<text x="492" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">把电网均值当残差</text>
<text x="492" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">3,340.8 t（−40.00%）</text>
<rect x="708" y="78" width="208" height="110" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="720" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">两者之差 1,248 t</text>
<text x="720" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">不能相减当减排量</text>
<text x="720" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">只能并列披露</text>
<text x="720" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">误用再藏 979.2 t</text>
<text x="24" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">三个数都「算得出来」，差别在残差因子：不用 residual mix 就等于把别人买的绿电算成自己的。</text>
<text x="24" y="258" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">2015 版指南（现行）：位置法 + 市场法双报，年度匹配即可。</text>
<text x="24" y="284" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">2025 征求意见稿：位置法按「空间精度 → 时间粒度 → 消费侧因子」排序取值；市场法要求小时级匹配与可输送性；</text>
<text x="24" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">无残差因子时只能用「仅化石」因子，不再允许退回电网均值。旧版仍是现行有效文本，新版预计 2027 年定稿。</text>
</svg>
