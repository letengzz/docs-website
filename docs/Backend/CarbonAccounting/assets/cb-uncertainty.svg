<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="不确定性：相加 15% 与平方和 11.18% 都不是「保守」">
<title>不确定性：相加 15% 与平方和 11.18% 都不是「保守」</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">不确定性：相加 15% 与平方和 11.18% 都不是「保守」</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">重大性判定要同时看占比与数据质量</text>
<rect x="24" y="78" width="220" height="110" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="36" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">活动数据 ±5%</text>
<text x="36" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">计量误差</text>
<text x="36" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">缺失填补</text>
<rect x="262" y="78" width="220" height="110" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="274" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">因子 ±10%</text>
<text x="274" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">版本与热值</text>
<text x="274" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">GWP 选择</text>
<rect x="500" y="78" width="200" height="110" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="512" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">合成 11.18%</text>
<text x="512" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">平方和开方</text>
<text x="512" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">不是 15%</text>
<text x="512" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">蒙特卡洛 P5/P95</text>
<rect x="718" y="78" width="198" height="110" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="730" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">90% 区间</text>
<text x="730" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">P5 81,848</text>
<text x="730" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">P95 118,509</text>
<text x="730" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">宽 36.78%</text>
<text x="24" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">加权 DQR 2.21（1 最好）：电 55%×2 + 天然气 20%×1 + 柴油 8%×1 + 制冷剂 2%×4 + 差旅 15%×5。</text>
<text x="24" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">同时满足「占比 ≥5% 且 DQR ≥3」的只有差旅一项——所以先改差旅的取数方式，而不是去抠制冷剂的因子。</text>
<text x="24" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">重大性阈值 5%：低于阈值不等于可以不报，只等于可以不单列；高于阈值必须给来源与不确定度。</text>
</svg>
