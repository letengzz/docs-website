<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="基准年重述：三个数都过阈值，方向却相反">
<title>基准年重述：三个数都过阈值，方向却相反</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">基准年重述：三个数都过阈值，方向却相反</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">重述只改基准，不改当年</text>
<text x="24" y="92" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">重述后基准年 103,800（变动 +3.80%，未过 5% 阈值但触发了逐项列示）</text>
<rect x="24" y="110" width="300" height="110" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="36" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">不重述的口径</text>
<text x="36" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">当年 95,000 vs 基准 100,000</text>
<text x="36" y="175" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">同比 −5.00%</text>
<text x="36" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">看起来在降</text>
<rect x="340" y="110" width="300" height="110" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="352" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">重述后的口径</text>
<text x="352" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">当年 95,000 vs 基准 103,800</text>
<text x="352" y="175" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">同比 −8.48%</text>
<text x="352" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">实际降得更多</text>
<rect x="656" y="110" width="260" height="110" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="668" y="136" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">为什么必须重述</text>
<text x="668" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">并购改了边界</text>
<text x="668" y="175" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">方法改了因子</text>
<text x="668" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">否则两年不可比</text>
<text x="24" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">四类原因各自的口径：并购/剥离（结构）、方法变更（因子或 GWP 版本）、差错更正、以及「不重述」的资产剥离。</text>
<text x="24" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">每一条重述都要有：原因分类、金额、审批人、原值与新值——四个字段缺一个，审计就无法确认这是「重述」还是「改数」。</text>
<text x="24" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">披露的三层：核算方法（怎么算的）→ 数据（用了什么）→ 结果（算出来多少）。只报第三层，读者无法判断可比性。</text>
</svg>
