<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="范围三：十五类里，前四类通常占八成以上">
<title>范围三：十五类里，前四类通常占八成以上</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">范围三：十五类里，前四类通常占八成以上</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">「算了几类」与「覆盖多少」是两个数</text>
<rect x="24" y="80" width="250" height="34" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="36" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">1 采购商品与服务</text>
<rect x="286" y="88" width="300" height="18" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
<text x="594" y="102" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">62%</text>
<rect x="24" y="122" width="250" height="34" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="36" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">3 燃料能源相关</text>
<rect x="286" y="130" width="60" height="18" rx="3" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
<text x="354" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">9%</text>
<rect x="24" y="164" width="250" height="34" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="36" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">11 售出产品使用</text>
<rect x="286" y="172" width="62" height="18" rx="3" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
<text x="356" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">10%</text>
<rect x="24" y="206" width="250" height="34" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">2 资本品</text>
<rect x="286" y="214" width="40" height="18" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
<text x="334" y="228" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">5%</text>
<rect x="24" y="248" width="250" height="34" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="36" y="274" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">9 下游运输</text>
<rect x="286" y="256" width="30" height="18" rx="3" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1"/>
<text x="324" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">3%</text>
<rect x="24" y="290" width="250" height="34" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="36" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">其余六类</text>
<rect x="286" y="298" width="70" height="18" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
<text x="364" y="312" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700">11%</text>
<rect x="640" y="80" width="276" height="120" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="652" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">两种算法差 13.2%</text>
<text x="652" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">支出法 84,000 t</text>
<text x="652" y="145" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">供应商法 72,912 t</text>
<text x="652" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">同一笔采购</text>
<text x="640" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">支出法用「元 × 行业强度」</text>
<text x="640" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">供应商法用「实物量 × 实测因子」</text>
<text x="640" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">两者都要报：一个覆盖全，一个精度高</text>
<text x="24" y="330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">最容易被省掉的是第 1 类（62%）：省掉它，范围三就只剩一个好看的零头；而它恰好只能靠供应商数据或支出法估算。</text>
</svg>
