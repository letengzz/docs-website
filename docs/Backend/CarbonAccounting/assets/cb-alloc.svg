<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="分配：同一座热电厂，两种方法差 28.69 个百分点">
<title>分配：同一座热电厂，两种方法差 28.69 个百分点</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">分配：同一座热电厂，两种方法差 28.69 个百分点</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">分配只改归属，不改合计——但改了谁的 PCF 高</text>
<rect x="24" y="78" width="210" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">输入 120,000 GJ</text>
<text x="36" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">产出：电 40,000 GJ</text>
<text x="36" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">蒸汽 55,000 GJ</text>
<text x="36" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400">综合效率 79.2%</text>
<rect x="258" y="78" width="210" height="120" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="270" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">能量法</text>
<text x="270" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">电 42.11%</text>
<text x="270" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">汽 57.89%</text>
<text x="270" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400">电 25,263 t</text>
<rect x="492" y="78" width="210" height="120" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="504" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">火用法</text>
<text x="504" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">电 70.80%</text>
<text x="504" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">汽 29.20%</text>
<text x="504" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">电 42,478 t</text>
<rect x="726" y="78" width="190" height="120" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="738" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">差额</text>
<text x="738" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">+17,215 t 挪到电力</text>
<text x="738" y="143" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">−17,215 t 挪出蒸汽</text>
<text x="738" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">相对 +68.1%</text>
<text x="24" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">楼宇共因同理：1,200 t 按面积 600/360/240，按人数 480/120/600——租户 B 差 −66.7%，租户 C 差 +150%。</text>
<text x="24" y="264" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">三个必须写死的规则：① 分配方法在基准年定一次；② 分配台账号可追溯到动因量；③ 合计守恒（Σ分配 = 待分总量）。</text>
<text x="24" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">产品碳足迹的边界还要声明「 cradle-to-gate / gate-to-gate / cradle-to-grave 」，否则两个 PCF 根本不可比。</text>
</svg>
