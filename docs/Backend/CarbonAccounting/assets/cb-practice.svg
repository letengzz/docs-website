<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img" aria-label="八张表跑通一次核算与披露">
<title>八张表跑通一次核算与披露</title>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">八张表跑通一次核算与披露</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" font-weight="400">216 条活动数据，五条自检全 0，五条负向用例全被拦下</text>
<rect x="24" y="78" width="104" height="54" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="36" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">entity</text>
<rect x="136" y="78" width="104" height="54" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="148" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">facility</text>
<rect x="248" y="78" width="104" height="54" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="260" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">activity</text>
<rect x="360" y="78" width="104" height="54" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="372" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">factor</text>
<rect x="472" y="78" width="104" height="54" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="484" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">calc_line</text>
<rect x="584" y="78" width="104" height="54" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="596" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">boundary_run</text>
<rect x="696" y="78" width="104" height="54" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="708" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">disclosure</text>
<rect x="808" y="78" width="104" height="54" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="820" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">restatement</text>
<text x="24" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">范围一 212.30 t　范围二 9,761.68 t　合计 9,973.98 t</text>
<text x="24" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">运营控制法 9,973.98 t / 股权比例法 7,102.81 t（−28.79%）：差的 2,871 t 里，JV1/JV2 占大头。</text>
<text x="24" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">C1 明细=量×因子　C2 披露=明细合计　C3 范围二双报齐全　C4 合并=边界运行　C5 重述原因合规</text>
<text x="24" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" font-weight="400">N1 非法 GWP　N2 重复计算　N3 范围二不标 basis　N4 重述无审批人　N5 负排放直入库 → 5/5 拒绝</text>
<text x="24" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">五个负向用例全部落在约束与触发器上，不靠应用层记得判断——这才是「跑第三遍结果一样」的前提。</text>
</svg>
