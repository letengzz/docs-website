<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="储值本金与赠送金双余额及退卡口径">
<rect x="0" y="0" width="940" height="440" fill="#f8fafc"/>
<text x="28" y="34" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">储值卡的两种余额：本金与赠送金</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">混在一个余额里，退卡时永远算不清该退多少</text>
<rect x="60" y="84" width="360" height="90" rx="8" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="240.0" y="106.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">wallet</text>
<text x="240.0" y="124.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">principal_balance</text>
<text x="240.0" y="142.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">gift_balance</text>
<text x="240.0" y="160.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">两列分开放，不可互转</text>
<rect x="520" y="84" width="360" height="90" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="700.0" y="106.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">消费时先扣哪一类</text>
<text x="700.0" y="124.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">默认先扣赠送金（客户感知好）</text>
<text x="700.0" y="142.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">或按比例扣（财务口径稳）</text>
<text x="700.0" y="160.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">两种选一种，写进条款</text>
<text x="60" y="210" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">退卡结算：两种口径差多少（本机 20,000 张卡）</text>
<rect x="60" y="230" width="400" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="260.0" y="264.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">口径 A：先扣赠送金</text>
<text x="260.0" y="282.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">退款 = 实收本金 − max(0, 已消费 − 赠送金)</text>
<text x="260.0" y="300.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">客户感知：赠送金先用完了</text>
<rect x="480" y="230" width="400" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="680.0" y="264.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">口径 B：按比例扣本金</text>
<text x="680.0" y="282.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">退款 = 本金 − round(已消费 × 本金/总额)</text>
<text x="680.0" y="300.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">财务感知：折扣按比例享受</text>
<rect x="60" y="344" width="820" height="36" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="470.0" y="366.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">两法不一致 74.78%（14,957/20,000），最大差 817.47 元，累计 194.28 万元</text>
<text x="60" y="406" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">监管口径：单张记名卡 ≤ 5000 元、不记名卡 ≤ 1000 元；记名卡不得设有效期、不记名卡至少 3 年</text>
</svg>
