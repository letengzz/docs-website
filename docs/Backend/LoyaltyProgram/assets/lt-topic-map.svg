<text x="856.0" y="129.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">失效结转</text>
<rect x="60" y="190" width="260" height="86" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="190.0" y="210.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">积分批次账</text>
<text x="190.0" y="228.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">batch / ledger</text>
<text x="190.0" y="246.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">先到期先扣</text>
<text x="190.0" y="264.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">过期可追溯</text>
<rect x="350" y="190" width="260" height="86" rx="8" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="480.0" y="210.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">储值双余额</text>
<text x="480.0" y="228.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">本金 / 赠送金</text>
<text x="480.0" y="246.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">分列不可互转</text>
<text x="480.0" y="264.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">退卡按口径</text>
<rect x="640" y="190" width="260" height="86" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="770.0" y="210.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">等级成长值</text>
<text x="770.0" y="228.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">滚动 12 个月</text>
<text x="770.0" y="246.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">升降级有缓冲</text>
<text x="770.0" y="264.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">权益按快照</text>
<text x="60" y="310" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a">三本账共同的失败方式：余额对了、流水对了、报表错了</text>
<rect x="60" y="330" width="820" height="96" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="470.0" y="364.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e293b">必失点（每一条都有本机读数）</text>
<text x="470.0" y="382.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">消耗顺序错 → 过期量 +354.9%｜先查后改 → 报成功 128 次而上限 100｜抵扣不封顶 → 32.77% 超抵</text>
<text x="470.0" y="400.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">逐笔四舍五入退积分 → 66.62% 合计≠原值｜退卡赠送金口径 → 74.78% 退款不同｜breakage 用「迄今未兑」→ 负债高估 21.31pp</text>
</svg>
