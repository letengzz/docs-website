<text x="344.0" y="111.0" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">③ 落批</text>
<text x="344.0" y="129.0" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">发放记账</text>
<line x1="402" y1="116" x2="414" y2="116" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="414" y="90" width="116" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
