<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="配置组合漏斗"><title>配置组合漏斗</title><rect width="900" height="340" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">从 648 个组合到 277 个合法组合：三种校验各拦住多少</text><text x="24" y="80" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">笛卡尔全排列</text><rect x="24" y="88" width="560" height="16" rx="4" fill="#f1f5f9"/><rect x="24" y="88" width="560" height="16" rx="4" fill="#6b7280" opacity="0.75"/><text x="596" y="101" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">648 个  ·  6 个维度：4×3×3×2×3×3</text><text x="24" y="136" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">取值域校验（每维查允许值）</text><rect x="24" y="144" width="560" height="16" rx="4" fill="#f1f5f9"/><rect x="24" y="144" width="560" height="16" rx="4" fill="#b91c1c" opacity="0.75"/><text x="596" y="157" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">648 个  ·  一条都拦不住</text><text x="24" y="192" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">两两组合校验（pairwise）</text><rect x="24" y="200" width="560" height="16" rx="4" fill="#f1f5f9"/><rect x="24" y="200" width="248" height="16" rx="4" fill="#b45309" opacity="0.75"/><text x="596" y="213" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">287 个  ·  多放行 10 个（3.61%）</text><text x="24" y="248" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">全局约束求解（本册）</text><rect x="24" y="256" width="560" height="16" rx="4" fill="#f1f5f9"/><rect x="24" y="256" width="239" height="16" rx="4" fill="#047857" opacity="0.75"/><text x="596" y="269" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">277 个  ·  8 条约束，含 2 条三维约束</text><text x="24" y="304" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">两两校验漏掉的 10 个组合，全部违反「品类 + 规模 + 许可」或「材质 + 接口 + 电压」这两条三维约束。</text><text x="24" y="324" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">按维度做前端联动的产品，天然只能表达两维约束——三维约束必须在提交时求一次全局解。</text></svg>