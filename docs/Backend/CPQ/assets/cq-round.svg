<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="取整顺序"><title>取整顺序</title><rect width="900" height="400" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">三种「都能算出价」的写法：35.30% 的订单差 1 分</text><rect x="24" y="62" width="852" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="450.0" y="90.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">成本 100.00 → ×1.35 → ×0.88 → ×1.13</text>
<text x="450.0" y="109.0" text-anchor="middle" font-size="12" fill="#6b7280">每一步取整 vs 末尾一次取整：单笔最大差 0.01 元</text><rect x="24" y="146" width="260" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="154.0" y="179.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">每步取整</text><text x="300" y="170" text-anchor="start" font-size="12" fill="#1f2937" font-weight="400">r2(r2(r2(cost×1.35)×0.88)×1.13)</text><text x="300" y="190" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">1,000 单里 353 单差 1 分</text><rect x="24" y="212" width="260" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="154.0" y="245.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">末尾取整</text><text x="300" y="236" text-anchor="start" font-size="12" fill="#1f2937" font-weight="400">r2(cost×1.35×0.88×1.13)</text><text x="300" y="256" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">本册口径：只在出具金额时取整</text><rect x="24" y="278" width="260" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="154.0" y="311.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">逐行取整加总</text><text x="300" y="302" text-anchor="start" font-size="12" fill="#1f2937" font-weight="400">Σ r2(行金额) vs r2(Σ 行金额)</text><text x="300" y="322" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">3,000 行合计差 0.34 元</text><text x="24" y="354" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">分摊：2,000 组里 850 组（42.50%）逐行取整后合计不等于目标折扣额，累计差 8.99 元。</text><text x="24" y="374" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">解法不是「多留几位小数」，而是先定「谁是自由项」：把余数给金额最大的一行，或存一个 residual 列。</text></svg>