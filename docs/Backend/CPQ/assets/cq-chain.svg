<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="七段链"><title>七段链</title><rect width="900" height="380" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="34" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">七段链：一次报价从建模到变更，每一段都能单独失败</text><rect x="24" y="60" width="112" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="80.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">① 建</text>
<text x="80.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">产品模型</text>
<text x="80.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">维度与选项</text><line x1="137" y1="102" x2="147" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="80.0" y="162" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="600">安静</text><rect x="148" y="60" width="112" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="204.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">② 配</text>
<text x="204.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">约束求解</text>
<text x="204.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">合法性</text><line x1="261" y1="102" x2="271" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="204.0" y="162" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">显性</text><rect x="272" y="60" width="112" height="84" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="328.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">③ 价</text>
<text x="328.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">价格册</text>
<text x="328.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">优先级</text><line x1="385" y1="102" x2="395" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="328.0" y="162" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="600">安静</text><rect x="396" y="60" width="112" height="84" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="452.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">④ 折</text>
<text x="452.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">瀑布</text>
<text x="452.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">审批</text><line x1="509" y1="102" x2="519" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="452.0" y="162" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">显性</text><rect x="520" y="60" width="112" height="84" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="576.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">⑤ 报</text>
<text x="576.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">版本</text>
<text x="576.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">有效期</text><line x1="633" y1="102" x2="643" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="576.0" y="162" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="600">安静</text><rect x="644" y="60" width="112" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="700.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">⑥ 签</text>
<text x="700.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">锁价</text>
<text x="700.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">转单</text><line x1="757" y1="102" x2="767" y2="102" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="700.0" y="162" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">显性</text><rect x="768" y="60" width="112" height="84" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="824.0" y="99.0" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="600">⑦ 变</text>
<text x="824.0" y="118.0" text-anchor="middle" font-size="12" fill="#6b7280">改配</text>
<text x="824.0" y="134.0" text-anchor="middle" font-size="12" fill="#6b7280">重定价</text><text x="824.0" y="162" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="600">安静</text><text x="24" y="196" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">四段「安静」的共同形态：页面能报出价、报价单发得出、合同签得成，只有「这个价还能不能卖」没人能回答。</text><rect x="24" y="224" width="268" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="158.0" y="261.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">配置</text>
<text x="158.0" y="280.0" text-anchor="middle" font-size="12" fill="#6b7280">648 组合 → 277 合法</text><rect x="316" y="224" width="268" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="450.0" y="261.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">取价</text>
<text x="450.0" y="280.0" text-anchor="middle" font-size="12" fill="#6b7280">命中 11 条，取哪条？</text><rect x="608" y="224" width="268" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="742.0" y="261.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">折扣</text>
<text x="742.0" y="280.0" text-anchor="middle" font-size="12" fill="#6b7280">94.35% 的订单两种算法不同价</text><text x="24" y="330" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">本机读数：种子 20261105，648 个组合 / 300 个 SKU / 936 条价格行 / 3,000 张报价。</text><text x="24" y="352" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">三个口径都在「没人报错」的前提下各算了一遍——这就是 CPQ 的缺陷形态。</text></svg>