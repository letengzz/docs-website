<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="报价有效期"><title>报价有效期</title><rect width="900" height="330" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">报价的三个时间：出具、有效期截止、转单——它们不在同一个刻度上</text><line x1="60" y1="120" x2="840" y2="120" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="120" r="5" fill="#1d4ed8"/><text x="120" y="104" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">T0 出具</text><text x="120" y="142" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">价格快照落库</text><circle cx="420" cy="120" r="5" fill="#1d4ed8"/><text x="420" y="104" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">T0+30d 到期</text><text x="420" y="142" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">有效期末</text><circle cx="620" cy="120" r="5" fill="#1d4ed8"/><text x="620" y="104" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">T0+47d 转单</text><text x="620" y="142" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">中位周期 23 天，P90 48 天</text><circle cx="760" cy="120" r="5" fill="#1d4ed8"/><text x="760" y="104" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">T0+90d 关单</text><text x="760" y="142" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="400">赢单/丢单</text><rect x="24" y="170" width="400" height="80" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="224.0" y="207.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">过期后仍成交</text>
<text x="224.0" y="226.0" text-anchor="middle" font-size="12" fill="#6b7280">225 / 921 = 24.43%</text>
<text x="224.0" y="242.0" text-anchor="middle" font-size="12" fill="#6b7280">金额 10,456,798.02 元</text><rect x="452" y="170" width="400" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="652.0" y="207.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">转单时按实时价重算</text>
<text x="652.0" y="226.0" text-anchor="middle" font-size="12" fill="#6b7280">921 张全部漂移，合计 173,269.87 元</text>
<text x="652.0" y="242.0" text-anchor="middle" font-size="12" fill="#6b7280">单笔最大 1,271.18 元（年涨 6%）</text><text x="24" y="280" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">「报价有效」是三个独立判断：配置还有效吗、价格还有效吗、审批还有效吗。合成一个 valid_to 字段，就只剩一个。</text><text x="24" y="302" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">本册口径：报价只承诺「价格快照」，配置与审批各自带自己的失效条件，转单时逐项复核。</text></svg>