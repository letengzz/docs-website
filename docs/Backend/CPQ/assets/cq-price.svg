<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="价格册优先级"><title>价格册优先级</title><rect width="900" height="400" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">同一 SKU 命中 11 条价格：优先级决定「取哪条」，不是「取哪条便宜」</text><rect x="24" y="66" width="300" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="174.0" y="94.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">customer 客户专属</text><text x="340" y="94" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">priority = 40</text><text x="470" y="94" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">8,640.00 元</text><text x="620" y="94" text-anchor="start" font-size="12" fill="#1d4ed8" font-weight="600">← 生效期内取这一条</text><rect x="24" y="120" width="300" height="46" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="174.0" y="148.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">region 区域</text><text x="340" y="148" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">priority = 20</text><text x="470" y="148" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">9,120.00 元</text><rect x="24" y="174" width="300" height="46" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="174.0" y="202.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">base 基础</text><text x="340" y="202" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">priority = 10</text><text x="470" y="202" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">9,600.00 元</text><rect x="24" y="228" width="300" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="174.0" y="256.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">legacy 历史</text><text x="340" y="256" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">priority = 5</text><text x="470" y="256" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">12,000.00 元</text><text x="24" y="294" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">82.00% 的 SKU 同时命中多个价格册；46.33% 的 SKU「按优先级取」与「取最低价」结果不同，合计差 89,315.50 元。</text><text x="24" y="314" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">「取最低价」看起来对客户更友好，实际是把定价权交给了价格册里最旧的那条记录。</text><rect x="24" y="328" width="852" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="450.0" y="359.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">有效期内重叠 157 对：同一册同一 SKU 出现两条都「当前有效」的价格，取哪条取决于排序字段</text></svg>