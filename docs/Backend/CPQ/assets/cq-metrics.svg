<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="度量口径"><title>度量口径</title><rect width="900" height="400" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">同一个赢单率，四个分母：30.70% / 33.19% / 100% / 说不清</text><rect x="24" y="66" width="300" height="54" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="174.0" y="98.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">全部报价 3,000</text><text x="344" y="90" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">921 / 3,000 = 30.70%</text><text x="344" y="110" text-anchor="start" font-size="11" fill="#6b7280" font-weight="400">把已过期未跟进的也算进分母</text><rect x="24" y="128" width="300" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="174.0" y="160.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">有效报价 2,775</text><text x="344" y="152" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">921 / 2,775 = 33.19%</text><text x="344" y="172" text-anchor="start" font-size="11" fill="#6b7280" font-weight="400">剔除过期未成交</text><rect x="24" y="190" width="300" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="174.0" y="222.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">仅已成交 921</text><text x="344" y="214" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">921 / 921 = 100%</text><text x="344" y="234" text-anchor="start" font-size="11" fill="#6b7280" font-weight="400">「我们从不丢单」</text><rect x="24" y="252" width="300" height="54" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="174.0" y="284.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">按金额加权</text><text x="344" y="276" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">需先定义「金额口径」</text><text x="344" y="296" text-anchor="start" font-size="11" fill="#6b7280" font-weight="400">报价额 / 锁价额 / 实收额</text><text x="24" y="322" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">周期：P50 23 天 / P90 48 天 / 均值 25.6 天；配置错误率 9.67%（1,200 单里 116 单下单后被退回改配）。</text><text x="24" y="344" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">报表里不写分母，四个部门就能在同一张看板上得到四个「正确」的转化率。</text></svg>