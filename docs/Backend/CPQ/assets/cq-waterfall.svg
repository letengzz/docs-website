<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="折扣瀑布"><title>折扣瀑布</title><rect width="900" height="350" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">折扣瀑布：把百分比加起来一次扣，与逐层扣，差多少</text><rect x="24" y="70" width="150" height="66" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="99.0" y="100.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">标价</text>
<text x="99.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">60,000.00</text><line x1="175" y1="103" x2="188" y2="103" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="190" y="70" width="150" height="66" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="265.0" y="100.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">数量 15%</text>
<text x="265.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">51,000.00</text><line x1="341" y1="103" x2="354" y2="103" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="356" y="70" width="150" height="66" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="431.0" y="100.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">协议 8%</text>
<text x="431.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">46,920.00</text><line x1="507" y1="103" x2="520" y2="103" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="522" y="70" width="150" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="597.0" y="100.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">促销 10%</text>
<text x="597.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">42,228.00</text><line x1="673" y1="103" x2="686" y2="103" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="688" y="70" width="150" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="763.0" y="100.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">特批 5%</text>
<text x="763.0" y="119.0" text-anchor="middle" font-size="12" fill="#6b7280">40,116.60</text><text x="24" y="168" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">逐层扣：每一步的基数是上一层的净额（0.85 × 0.92 × 0.90 × 0.95 = 0.668）</text><text x="24" y="190" text-anchor="start" font-size="12" fill="#b91c1c" font-weight="600">加总扣：0.15 + 0.08 + 0.10 + 0.05 = 0.38 → ×0.62，比逐层扣少 2,868 元（4.8%）</text><rect x="24" y="210" width="420" height="74" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="234.0" y="244.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">2,000 单实测</text>
<text x="234.0" y="263.0" text-anchor="middle" font-size="12" fill="#6b7280">94.35% 的订单两种算法给出不同金额</text>
<text x="234.0" y="279.0" text-anchor="middle" font-size="12" fill="#6b7280">合计差 1,213,672.04 元，单笔最大 3,673.34 元</text><rect x="456" y="210" width="420" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="666.0" y="244.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">为什么会这样</text>
<text x="666.0" y="263.0" text-anchor="middle" font-size="12" fill="#6b7280">百分比之间的乘法不满足分配律</text>
<text x="666.0" y="279.0" text-anchor="middle" font-size="12" fill="#6b7280">只有「定额」与「百分比」可以互换顺序，百分比之间不行</text><text x="24" y="320" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">所以瀑布必须是「有序列表 + 每层记录基数」，而不是「一组可以求和的折扣率」。</text></svg>