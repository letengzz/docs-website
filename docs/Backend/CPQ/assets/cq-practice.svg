<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="实战结构"><title>实战结构</title><rect width="900" height="360" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">十张表、四个触发器：约束写在哪一层，决定它会不会被执行</text><rect x="24" y="64" width="200" height="152" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="124" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">配置</text><text x="124" y="112" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">product_model</text><text x="124" y="140" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">cfg_dim</text><text x="124" y="168" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">cfg_option</text><text x="124" y="196" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">cfg_rule</text><rect x="238" y="64" width="200" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="338" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">价格</text><text x="338" y="112" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">price_book</text><text x="338" y="140" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">price_entry</text><rect x="452" y="64" width="200" height="124" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="552" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">报价</text><text x="552" y="112" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">quote</text><text x="552" y="140" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">quote_line</text><text x="552" y="168" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">disc_approval</text><rect x="666" y="64" width="200" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="766" y="88" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">转单</text><text x="766" y="112" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="400">order_link</text><text x="24" y="240" text-anchor="start" font-size="12" fill="#1f2937" font-weight="400">四个触发器各管一条不变量：</text><text x="24" y="264" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· trg_line_amt：行金额不超过行毛额</text><text x="24" y="286" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· trg_quote_total：总额等于行合计</text><text x="24" y="308" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· trg_accept_gate：接受前必须有审批且不超上限</text><text x="24" y="330" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· trg_locked_after_order：转单后金额不可改</text><text x="520" y="264" text-anchor="start" font-size="12" fill="#047857" font-weight="600">13 条断言：9 条正向全 0，4 个负向各响一次</text><text x="520" y="286" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">实测 13/13 PASS，EXIT=0</text><text x="520" y="308" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">约束写在应用层 = 换一个入口就绕过；</text><text x="520" y="330" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">写在 CHECK / 触发器里 = 任何入口都绕不过。</text></svg>