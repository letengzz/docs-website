<text x="438.0" y="95.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">不可</text><rect x="526" y="70" width="160" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="606.0" y="95.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">不可</text><rect x="694" y="70" width="160" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="774.0" y="95.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">不可</text><text x="24" y="150" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">销售主管</text><rect x="190" y="122" width="160" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="270.0" y="147.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">自动</text><rect x="358" y="122" width="160" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
