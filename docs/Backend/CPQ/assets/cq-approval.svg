<text x="774.0" y="251.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">四眼</text><text x="24" y="300" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">5,000 笔实测：5.94%（297 笔）的实际折扣超出了审批人权限，其中 7% 是「审批人权限被配小」导致的系统性越权。</text><text x="24" y="322" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">超过 30% 的 1,200 笔里 9.0%（108 笔）只有一个人批过——四眼原则写进了制度，没写进约束。</text></svg>