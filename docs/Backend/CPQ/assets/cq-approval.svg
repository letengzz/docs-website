<text x="606.0" y="199.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">可批</text><rect x="694" y="174" width="160" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
