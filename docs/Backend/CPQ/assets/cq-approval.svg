<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="审批矩阵"><title>审批矩阵</title><rect width="900" height="350" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">审批矩阵：四档阈值，两个维度（折扣率 × 金额），三个人</text><text x="270" y="62" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">≤ 10%</text><text x="438" y="62" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">10~20%</text><text x="606" y="62" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">20~30%</text><text x="774" y="62" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">&gt; 30%</text><text x="24" y="98" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">销售代表</text><rect x="190" y="70" width="160" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
