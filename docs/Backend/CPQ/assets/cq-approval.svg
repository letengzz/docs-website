<text x="774.0" y="147.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">不可</text><text x="24" y="202" text-anchor="start" font-size="13" fill="#1f2937" font-weight="400">销售总监</text><rect x="190" y="174" width="160" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="270.0" y="199.0" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">自动</text><rect x="358" y="174" width="160" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
