<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="转单映射"><title>转单映射</title><rect width="900" height="370" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">转单不是复制：一行报价可能变成三行订单，也可能变成零元行</text><rect x="24" y="66" width="250" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="149.0" y="138.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">报价单</text>
<text x="149.0" y="157.0" text-anchor="middle" font-size="12" fill="#6b7280">2 行</text>
<text x="149.0" y="173.0" text-anchor="middle" font-size="12" fill="#6b7280">捆绑件 1 行 + 赠品 1 行</text><rect x="340" y="66" width="250" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="465.0" y="138.0" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">订单</text>
<text x="465.0" y="157.0" text-anchor="middle" font-size="12" fill="#6b7280">6 行</text>
<text x="465.0" y="173.0" text-anchor="middle" font-size="12" fill="#6b7280">捆绑拆 3 行，赠品 1 行 0 元</text><line x1="276" y1="141" x2="338" y2="141" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="606" y="96" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· 拆行：一行 3 个子件</text><text x="606" y="120" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· 赠品：0 元但占库存</text><text x="606" y="144" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· 锁价：金额不再重算</text><rect x="24" y="240" width="400" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="224.0" y="275.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">1,200 张报价 → 7,885 行订单</text>
<text x="224.0" y="294.0" text-anchor="middle" font-size="12" fill="#6b7280">平均 6.6 行/单，零元行 782 行（9.92%）</text><rect x="452" y="240" width="400" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="652.0" y="275.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">部分转单 263 单（21.92%）</text>
<text x="652.0" y="294.0" text-anchor="middle" font-size="12" fill="#6b7280">一次报价分批发货，金额需按行拆</text><text x="24" y="340" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">零元行不是「没有金额」，它占库存、进成本、要开票——把它当成「免费」的实现在对账时一定对不上。</text></svg>