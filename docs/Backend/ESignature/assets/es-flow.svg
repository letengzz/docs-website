<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="398" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">会签状态机与两种拓扑</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">状态机管「谁还没签」，拓扑管「谁可以先签」；两者混在一起就会造出「卡住但没人知道」的单</text>
  <rect x="24" y="82" width="124" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="86" y="100.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">草稿</text>
  <text x="86" y="117" text-anchor="middle" font-size="8" fill="#334155">draft</text>
  <rect x="172" y="82" width="124" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="234" y="100.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">待签</text>
  <text x="234" y="117" text-anchor="middle" font-size="8" fill="#1D4ED8">pending</text>
  <rect x="320" y="82" width="124" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="382" y="100.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">部分已签</text>
  <text x="382" y="117" text-anchor="middle" font-size="8" fill="#4338CA">partial</text>
  <rect x="468" y="82" width="124" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="530" y="100.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">已完成</text>
  <text x="530" y="117" text-anchor="middle" font-size="8" fill="#047857">done</text>
  <rect x="616" y="82" width="124" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="678" y="100.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">作废</text>
  <text x="678" y="117" text-anchor="middle" font-size="8" fill="#B91C1C">void</text>
  <line x1="148" y1="114" x2="171" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="296" y1="114" x2="319" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="444" y1="114" x2="467" y2="114" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="612" y="82" width="124" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="674" y="100" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">作废</text>
  <text x="674" y="118" text-anchor="middle" font-size="8" fill="#B91C1C">void</text>
  <text x="674" y="134" text-anchor="middle" font-size="7" fill="#B91C1C">已签的版本仍留</text>
  <line x1="382" y1="146" x2="382" y2="176" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="352" y="176" width="300" height="34" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
  <text x="502" y="197" text-anchor="middle" font-size="8.2" fill="#92400E">任一签署人拒签 -&gt; void（不是回到 draft：已签的字节不能删）</text>
  <text x="30" y="236" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">会签的两种拓扑：串行轮次 vs 并行度</text>
  <rect x="30" y="248" width="90" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="75" y="263" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">拓扑</text>
  <rect x="120" y="248" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="195" y="263" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">依赖形状</text>
  <rect x="270" y="248" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="345" y="263" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">轮次</text>
  <rect x="420" y="248" width="170" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="505" y="263" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">适用</text>
  <rect x="590" y="248" width="170" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="675" y="263" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">文件体积</text>
  <rect x="30" y="274" width="90" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="75" y="289" text-anchor="middle" font-size="7.6" fill="#334155">顺序会签</text>
  <rect x="120" y="274" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="195" y="289" text-anchor="middle" font-size="7.6" fill="#334155">A→B→C→D</text>
  <rect x="270" y="274" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="345" y="289" text-anchor="middle" font-size="7.6" fill="#334155">4 轮，任一人卡住全停</text>
  <rect x="420" y="274" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="505" y="289" text-anchor="middle" font-size="7.6" fill="#334155">适合金额分级审批</text>
  <rect x="590" y="274" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="289" text-anchor="middle" font-size="7.6" fill="#334155">4 份增量修订</text>
  <rect x="30" y="302" width="90" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="75" y="317" text-anchor="middle" font-size="7.6" fill="#334155">并行会签</text>
  <rect x="120" y="302" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="195" y="317" text-anchor="middle" font-size="7.6" fill="#334155">A/B/C/D 同时</text>
  <rect x="270" y="302" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="345" y="317" text-anchor="middle" font-size="7.6" fill="#334155">1 轮，谁先签都能过</text>
  <rect x="420" y="302" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="505" y="317" text-anchor="middle" font-size="7.6" fill="#334155">适合多方对等签约</text>
  <rect x="590" y="302" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="317" text-anchor="middle" font-size="7.6" fill="#334155">4 份增量修订</text>
  <rect x="30" y="330" width="90" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="75" y="345" text-anchor="middle" font-size="7.6" fill="#334155">混合</text>
  <rect x="120" y="330" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="195" y="345" text-anchor="middle" font-size="7.6" fill="#334155">法务+财务 → 总经理</text>
  <rect x="270" y="330" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="345" y="345" text-anchor="middle" font-size="7.6" fill="#334155">2 轮，最大并行度 3</text>
  <rect x="420" y="330" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="505" y="345" text-anchor="middle" font-size="7.6" fill="#334155">实际业务最常见</text>
  <rect x="590" y="330" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="345" text-anchor="middle" font-size="7.6" fill="#334155">4 份增量修订</text>
  <text x="380" y="384" text-anchor="middle" font-size="9.5" fill="#64748B">关键：轮次不同，但「文件体积」几乎相同——省下的不是存储，是等待时间</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
