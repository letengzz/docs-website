<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一次签署的完整时序</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">七步里只有第 ⑥ 步不可回滚；把幂等键放在它前面，是这一步唯一的设计重点</text>
  <rect x="40" y="72" width="150" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="115" y="92" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">业务系统</text>
  <line x1="115" y1="102" x2="115" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="218" y="72" width="150" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="293" y="92" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">签署服务</text>
  <line x1="293" y1="102" x2="293" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="396" y="72" width="150" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="471" y="92" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">签署人</text>
  <line x1="471" y1="102" x2="471" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="574" y="72" width="150" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="649" y="92" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">CA / TSA</text>
  <line x1="649" y1="102" x2="649" y2="372" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="115" y1="124" x2="293" y2="124" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="204" y="119" text-anchor="middle" font-size="7.4" fill="#475569">① POST /contracts（含快照摘要）</text>
  <line x1="293" y1="152" x2="471" y2="152" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="382" y="147" text-anchor="middle" font-size="7.4" fill="#475569">② 发送签署链接</text>
  <line x1="471" y1="180" x2="293" y2="180" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="382" y="175" text-anchor="middle" font-size="7.4" fill="#475569">③ 打开并核身</text>
  <line x1="293" y1="208" x2="649" y2="208" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="471" y="203" text-anchor="middle" font-size="7.4" fill="#475569">④ 送签（证书 + 摘要）</text>
  <line x1="649" y1="236" x2="293" y2="236" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="471" y="231" text-anchor="middle" font-size="7.4" fill="#475569">⑤ 返回签名值 + 时戳</text>
  <path d="M293,264 l26,-10 l0,20 z" fill="#7C3AED"/>
  <path d="M319,264 l-24,-9 M319,264 l-24,9" stroke="#7C3AED" stroke-width="1.4" fill="none"/>
  <text x="336" y="268" text-anchor="start" font-size="7.6" fill="#5B21B6">⑥ 增量写回 + 链上记账</text>
  <line x1="293" y1="292" x2="115" y2="292" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="204" y="287" text-anchor="middle" font-size="7.4" fill="#475569">⑦ 回执与最终摘要</text>
  <rect x="40" y="312" width="690" height="46" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="52" y="332" text-anchor="start" font-size="8.4" fill="#065F46">第 ⑥ 步是唯一「不可回滚」的一步：签名值写进 /Contents 之后，删掉它等于撕掉一页已签的合同</text>
  <text x="52" y="350" text-anchor="start" font-size="8.4" fill="#065F46">所以 ⑥ 之前必须有幂等键（contract, signer, revision），⑥ 之后只允许追加、不允许覆盖</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
