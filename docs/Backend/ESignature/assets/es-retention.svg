<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">留存时间轴：15 年里要补几次时戳</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">证书会过期、算法会过时；「当年能验」不等于「到期那天还能验」</text>
  <line x1="60" y1="150" x2="710" y2="150" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="150" r="7" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="60" y="132" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">2026-11</text>
  <text x="60" y="178" text-anchor="middle" font-size="8.2" fill="#065F46" font-weight="bold">签署完成</text>
  <text x="60" y="194" text-anchor="middle" font-size="7.2" fill="#047857">签名 + 时戳</text>
  <circle cx="200" cy="150" r="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="132" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">2028-03</text>
  <text x="200" y="178" text-anchor="middle" font-size="8.2" fill="#1E3A8A" font-weight="bold">签名证书到期</text>
  <text x="200" y="194" text-anchor="middle" font-size="7.2" fill="#1D4ED8">旧签名仍有效</text>
  <circle cx="200" cy="150" r="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="200" y="132" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">2028-03</text>
  <text x="200" y="178" text-anchor="middle" font-size="8.2" fill="#5B21B6" font-weight="bold">归档时戳 #1</text>
  <text x="200" y="194" text-anchor="middle" font-size="7.2" fill="#6D28D9">到期前必须补</text>
  <circle cx="400" cy="150" r="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">2031-03</text>
  <text x="400" y="178" text-anchor="middle" font-size="8.2" fill="#5B21B6" font-weight="bold">归档时戳 #2</text>
  <text x="400" y="194" text-anchor="middle" font-size="7.2" fill="#6D28D9">算法仍安全</text>
  <circle cx="600" cy="150" r="7" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">2041-11</text>
  <text x="600" y="178" text-anchor="middle" font-size="8.2" fill="#92400E" font-weight="bold">留存期满</text>
  <text x="600" y="194" text-anchor="middle" font-size="7.2" fill="#B45309">15 年整</text>
  <text x="30" y="236" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">留存不是「存着」，是「到期那天还能验」</text>
  <rect x="30" y="250" width="126" height="25" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="93" y="267" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">证书 3 年一换</text>
  <rect x="162" y="250" width="300" height="25" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="168" y="267" text-anchor="start" font-size="8" fill="#334155">15 年留存期内需要 5 次归档时戳</text>
  <rect x="468" y="250" width="268" height="25" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="474" y="267" text-anchor="start" font-size="7.6" fill="#991B1B">缺一次，证书过期后旧签名可能验不过</text>
  <rect x="30" y="280" width="126" height="25" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="93" y="297" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">算法会过期</text>
  <rect x="162" y="280" width="300" height="25" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="168" y="297" text-anchor="start" font-size="8" fill="#334155">SHA-1 已不可用于新签名</text>
  <rect x="468" y="280" width="268" height="25" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="474" y="297" text-anchor="start" font-size="7.6" fill="#991B1B">存量文档要评估「重签或加固」而不是「照存」</text>
  <rect x="30" y="310" width="126" height="25" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="93" y="327" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">证据要齐</text>
  <rect x="162" y="310" width="300" height="25" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="168" y="327" text-anchor="start" font-size="8" fill="#334155">文档 + 证书链 + 吊销信息 + 时戳</text>
  <rect x="468" y="310" width="268" height="25" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="474" y="327" text-anchor="start" font-size="7.6" fill="#991B1B">只存 PDF，五年后取证时缺证书链</text>
  <rect x="30" y="340" width="126" height="25" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="93" y="357" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">体量</text>
  <rect x="162" y="340" width="300" height="25" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="168" y="357" text-anchor="start" font-size="8" fill="#334155">10 万份/年 × 320 KB × 15 年 = 457.8 GiB</text>
  <rect x="468" y="340" width="268" height="25" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="474" y="357" text-anchor="start" font-size="7.6" fill="#991B1B">3 副本 = 1.34 TiB，冷热分层不可避免</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
