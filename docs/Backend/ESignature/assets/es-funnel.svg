<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" width="760" height="418" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="418" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">签署漏斗：五个转化率与三个分母</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">漏斗的价值不在总分，在于「哪一段流失最大、这一段归谁负责」</text>
  <rect x="60.0" y="78" width="560.0" height="32" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="99" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">创建 1,200</text>
  <rect x="74.0" y="120" width="532.0" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="380" y="141" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">已发送 1,140</text>
  <rect x="105.3" y="162" width="469.5" height="32" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="183" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">已打开 1,006</text>
  <rect x="115.5" y="204" width="448.9" height="32" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="380" y="225" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">已核身 962</text>
  <rect x="129.8" y="246" width="420.5" height="32" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="380" y="267" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">已签署 901</text>
  <rect x="136.5" y="288" width="406.9" height="32" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="309" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">已完成 872</text>
  <text x="660" y="96" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">流失</text>
  <text x="676" y="130" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">-60</text>
  <text x="676" y="172" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">-134</text>
  <text x="676" y="214" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">-44</text>
  <text x="676" y="256" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">-61</text>
  <text x="676" y="298" text-anchor="middle" font-size="8.5" fill="#DC2626" font-weight="bold">-29</text>
  <text x="380" y="348" text-anchor="middle" font-size="9" fill="#334155">最大一段流失是「已发送 -&gt; 已打开」的 134 份，不是核身</text>
  <rect x="60" y="360" width="676" height="46" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="72" y="380" text-anchor="start" font-size="8.6" fill="#1E293B" font-weight="bold">同一套数据的三个完成率：按创建合同 72.7% / 按已发送 76.5% / 按签署人 90.5%</text>
  <text x="72" y="398" text-anchor="start" font-size="8.2" fill="#475569">对外只报一个数，就必须写清分母；否则「完成率 90%」与「72%」可以同时为真</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
