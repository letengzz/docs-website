<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">验签失败的分诊树</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">先分清是「字节变了」还是「信任链断了」——两类问题的修法完全相反</text>
  <rect x="290" y="76" width="180" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="11" fill="#991B1B" font-weight="bold">验签失败</text>
  <rect x="24" y="180" width="184" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="116" y="198.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">文档被改过</text>
  <text x="116" y="215" text-anchor="middle" font-size="7.2" fill="#C2410C">摘要不一致</text>
  <text x="116" y="231.56" text-anchor="middle" font-size="7.2" fill="#C2410C">定位 ByteRange 外</text>
  <text x="116" y="248.12" text-anchor="middle" font-size="7.2" fill="#C2410C">或签名后的追加区</text>
  <line x1="380" y1="132" x2="116" y2="179" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="200" y="180" width="184" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="292" y="198.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">证书不可信</text>
  <text x="292" y="215" text-anchor="middle" font-size="7.2" fill="#B45309">链不完整/过期</text>
  <text x="292" y="231.56" text-anchor="middle" font-size="7.2" fill="#B45309">补证书链</text>
  <text x="292" y="248.12" text-anchor="middle" font-size="7.2" fill="#B45309">查 OCSP/CRL</text>
  <line x1="380" y1="132" x2="292" y2="179" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="376" y="180" width="184" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="468" y="198.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">身份不符</text>
  <text x="468" y="215" text-anchor="middle" font-size="7.2" fill="#1D4ED8">主体 ≠ 签署人</text>
  <text x="468" y="231.56" text-anchor="middle" font-size="7.2" fill="#1D4ED8">核对证书 SAN</text>
  <text x="468" y="248.12" text-anchor="middle" font-size="7.2" fill="#1D4ED8">与核身记录</text>
  <line x1="380" y1="132" x2="468" y2="179" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="552" y="180" width="184" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="644" y="198.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">时间不可信</text>
  <text x="644" y="215" text-anchor="middle" font-size="7.2" fill="#6D28D9">无时戳或超期</text>
  <text x="644" y="231.56" text-anchor="middle" font-size="7.2" fill="#6D28D9">补 TSA 时戳</text>
  <text x="644" y="248.12" text-anchor="middle" font-size="7.2" fill="#6D28D9">查时钟偏移</text>
  <line x1="380" y1="132" x2="644" y2="179" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="292" text-anchor="middle" font-size="9" fill="#1E3A8A">四个分支的处理顺序：先证明「字节没变」，再证明「人是对的」，最后证明「时间是真的」</text>
  <rect x="24" y="308" width="712" height="60" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="36" y="328" text-anchor="start" font-size="9" fill="#0F172A" font-weight="bold">最常见的误判：把「证书过期」当成「签名无效」</text>
  <text x="36" y="346" text-anchor="start" font-size="8" fill="#475569">证书在签名时刻有效、之后过期，签名仍然有效；需要的是「签名时刻的证据」（时戳），不是「现在还有效的证书」</text>
  <text x="36" y="362" text-anchor="start" font-size="8" fill="#991B1B">反过来：证书现在就有效、但签名时刻早于 notBefore，这个签名从一开始就是无效的</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
