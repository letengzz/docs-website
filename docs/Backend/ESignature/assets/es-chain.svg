<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="352" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">七段签署链：从模板到可验证的存证</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">每一段都能跑通，不等于每一段都拦得住；红框是各段「看不出错」的失败形态</text>
  <rect x="18" y="78" width="100" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="68" y="96.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">① 模板</text>
  <text x="68" y="113" text-anchor="middle" font-size="7" fill="#334155">模板与条款</text>
  <text x="68" y="129.1" text-anchor="middle" font-size="7" fill="#334155">版本 + 变量</text>
  <rect x="126" y="78" width="100" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="176" y="96.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 生成</text>
  <text x="176" y="113" text-anchor="middle" font-size="7" fill="#1D4ED8">生成待签件</text>
  <text x="176" y="129.1" text-anchor="middle" font-size="7" fill="#1D4ED8">定稿 + 摘要</text>
  <rect x="234" y="78" width="100" height="74" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="284" y="96.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">③ 发送</text>
  <text x="284" y="113" text-anchor="middle" font-size="7" fill="#4338CA">发送与路由</text>
  <text x="284" y="129.1" text-anchor="middle" font-size="7" fill="#4338CA">顺序/并行</text>
  <rect x="342" y="78" width="100" height="74" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="392" y="96.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 核身</text>
  <text x="392" y="113" text-anchor="middle" font-size="7" fill="#0F766E">实名与意愿</text>
  <text x="392" y="129.1" text-anchor="middle" font-size="7" fill="#0F766E">核身 + 验证码</text>
  <rect x="450" y="78" width="100" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="500" y="96.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">⑤ 签署</text>
  <text x="500" y="113" text-anchor="middle" font-size="7" fill="#6D28D9">签署落章</text>
  <text x="500" y="129.1" text-anchor="middle" font-size="7" fill="#6D28D9">字节范围 + 证书</text>
  <rect x="558" y="78" width="100" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="608" y="96.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">⑥ 存证</text>
  <text x="608" y="113" text-anchor="middle" font-size="7" fill="#B45309">证据固化</text>
  <text x="608" y="129.1" text-anchor="middle" font-size="7" fill="#B45309">哈希链 + 时戳</text>
  <rect x="666" y="78" width="100" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="716" y="96.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">⑦ 留存</text>
  <text x="716" y="113" text-anchor="middle" font-size="7" fill="#047857">留存与取证</text>
  <text x="716" y="129.1" text-anchor="middle" font-size="7" fill="#047857">分区 + 导出</text>
  <line x1="118.5" y1="115" x2="125" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="226.5" y1="115" x2="233" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="334.5" y1="115" x2="341" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="442.5" y1="115" x2="449" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="550.5" y1="115" x2="557" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="658.5" y1="115" x2="665" y2="115" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">四道闸门：摘要对得上 · 人是对的人 · 意思是他表达的 · 事后能证明</text>
  <rect x="18" y="196" width="62" height="24" rx="5" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="49" y="212" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">闸门一</text>
  <rect x="86" y="196" width="452" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="94" y="212" text-anchor="start" font-size="8.2" fill="#334155">② 的定稿摘要与 ⑤ 签的字节范围必须指向同一份字节</text>
  <rect x="544" y="196" width="198" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="551" y="212" text-anchor="start" font-size="7.6" fill="#991B1B">摘要算错只表现为「验签失败」，不报错</text>
  <rect x="18" y="226" width="62" height="24" rx="5" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="49" y="242" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">闸门二</text>
  <rect x="86" y="226" width="452" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="94" y="242" text-anchor="start" font-size="8.2" fill="#334155">④ 的核身结果绑定 ⑤ 的签名人与证书主体</text>
  <rect x="544" y="226" width="198" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="551" y="242" text-anchor="start" font-size="7.6" fill="#991B1B">核身放行错人，签出来的仍是合法签名</text>
  <rect x="18" y="256" width="62" height="24" rx="5" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="49" y="272" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">闸门三</text>
  <rect x="86" y="256" width="452" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="94" y="272" text-anchor="start" font-size="8.2" fill="#334155">⑤ 的签署时间必须在证书有效期内且有时戳支撑</text>
  <rect x="544" y="256" width="198" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="551" y="272" text-anchor="start" font-size="7.6" fill="#991B1B">没有时戳只能相信签署方自己的时钟</text>
  <rect x="18" y="286" width="62" height="24" rx="5" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="49" y="302" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">闸门四</text>
  <rect x="86" y="286" width="452" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="94" y="302" text-anchor="start" font-size="8.2" fill="#334155">⑥ 的链头锚定在签署方拿不到的地方</text>
  <rect x="544" y="286" width="198" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="551" y="302" text-anchor="start" font-size="7.6" fill="#991B1B">只存前驱哈希，改一条可顺链重算</text>
  <text x="380" y="336" text-anchor="middle" font-size="9.5" fill="#64748B">七段里五段的失败是安静的：页面一切正常，只是「谁签了什么」悄悄挪了一格</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
