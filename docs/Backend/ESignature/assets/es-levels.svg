<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="382" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四个层次的「签了」：从名字到可举证</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份合同，四种成立方式在纠纷里的分量完全不同</text>
  <rect x="24" y="78" width="168" height="86" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="108" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">有名字</text>
  <text x="108" y="113" text-anchor="middle" font-size="7.5" fill="#334155">文档上有他的姓名</text>
  <text x="108" y="130.25" text-anchor="middle" font-size="7.5" fill="#334155">可能是别人代打</text>
  <text x="108" y="147.5" text-anchor="middle" font-size="7.5" fill="#334155">零成本，零证据</text>
  <rect x="208" y="78" width="168" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="292" y="96.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">有图章</text>
  <text x="292" y="113" text-anchor="middle" font-size="7.5" fill="#B45309">贴了印章图片</text>
  <text x="292" y="130.25" text-anchor="middle" font-size="7.5" fill="#B45309">图片可以复制粘贴</text>
  <text x="292" y="147.5" text-anchor="middle" font-size="7.5" fill="#B45309">看起来正式，验不了</text>
  <rect x="392" y="78" width="168" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="476" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">有签名</text>
  <text x="476" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">证书私钥签的</text>
  <text x="476" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">绑定了字节范围</text>
  <text x="476" y="147.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">技术上可验签</text>
  <rect x="576" y="78" width="168" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="660" y="96.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">可举证</text>
  <text x="660" y="113" text-anchor="middle" font-size="7.5" fill="#047857">签名 + 时戳 + 链</text>
  <text x="660" y="130.25" text-anchor="middle" font-size="7.5" fill="#047857">证书链与吊销可查</text>
  <text x="660" y="147.5" text-anchor="middle" font-size="7.5" fill="#047857">第三方能独立验证</text>
  <line x1="192" y1="121" x2="207" y2="121" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="376" y1="121" x2="391" y2="121" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="121" x2="575" y2="121" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="190" text-anchor="middle" font-size="9.5" fill="#1E3A8A">四个层次逐级加强，但只有最后一级能在纠纷里当证据用</text>
  <text x="30" y="220" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">同一句话的四种「成立」</text>
  <rect x="30" y="232" width="106" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="83" y="247" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">情形</text>
  <rect x="136" y="232" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="211" y="247" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">第 1 级</text>
  <rect x="286" y="232" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="361" y="247" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">第 2 级</text>
  <rect x="436" y="232" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="511" y="247" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">第 3 级</text>
  <rect x="586" y="232" width="150" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="661" y="247" text-anchor="middle" font-size="8.5" fill="#3730A3" font-weight="bold">第 4 级</text>
  <rect x="30" y="258" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="95" y="274" text-anchor="middle" font-size="7.4" fill="#334155">合同正文被改一个字</text>
  <rect x="160" y="258" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="274" text-anchor="middle" font-size="7.4" fill="#334155">有名字：无感</text>
  <rect x="310" y="258" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="375" y="274" text-anchor="middle" font-size="7.4" fill="#334155">有图章：无感</text>
  <rect x="460" y="258" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="525" y="274" text-anchor="middle" font-size="7.4" fill="#334155">有签名：验签失败</text>
  <rect x="610" y="258" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="274" text-anchor="middle" font-size="7.4" fill="#334155">可举证：失败 + 定位偏移</text>
  <rect x="30" y="288" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="95" y="304" text-anchor="middle" font-size="7.4" fill="#334155">签署人事后否认</text>
  <rect x="160" y="288" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="304" text-anchor="middle" font-size="7.4" fill="#334155">有名字：各说各话</text>
  <rect x="310" y="288" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="375" y="304" text-anchor="middle" font-size="7.4" fill="#334155">有图章：印章也能 P</text>
  <rect x="460" y="288" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="525" y="304" text-anchor="middle" font-size="7.4" fill="#334155">有签名：能证「私钥签过」</text>
  <rect x="610" y="288" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="304" text-anchor="middle" font-size="7.4" fill="#334155">可举证：+ 时戳证明「何时签」</text>
  <rect x="30" y="318" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="95" y="334" text-anchor="middle" font-size="7.4" fill="#334155">私钥泄露后被冒签</text>
  <rect x="160" y="318" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="225" y="334" text-anchor="middle" font-size="7.4" fill="#334155">有名字：查不出</text>
  <rect x="310" y="318" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="375" y="334" text-anchor="middle" font-size="7.4" fill="#334155">有图章：查不出</text>
  <rect x="460" y="318" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="525" y="334" text-anchor="middle" font-size="7.4" fill="#334155">有签名：签名有效但可否认</text>
  <rect x="610" y="318" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="675" y="334" text-anchor="middle" font-size="7.4" fill="#334155">可举证：吊销 + 时戳切分责任</text>
  <text x="380" y="366" text-anchor="middle" font-size="9.5" fill="#64748B">本专题只讨论第 3、4 级：技术上可验签，以及第三方能独立举证</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
