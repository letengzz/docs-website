<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">证据四层：事件流 / 哈希链 / 时间戳 / 外部锚定</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">链解决「有没有被改」，时戳解决「什么时候就有」，外部锚定解决「改的人是不是就是他自己」</text>
  <rect x="24" y="84" width="300" height="68" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="174" y="102.2" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">事件流</text>
  <text x="174" y="119" text-anchor="middle" font-size="7.8" fill="#334155">签署/查看/撤回</text>
  <text x="174" y="136.94" text-anchor="middle" font-size="7.8" fill="#334155">只追加不改</text>
  <rect x="24" y="168" width="300" height="68" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="174" y="186.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">哈希链</text>
  <text x="174" y="203" text-anchor="middle" font-size="7.8" fill="#1D4ED8">h_i = H(h_{i-1} || 事件)</text>
  <text x="174" y="220.94" text-anchor="middle" font-size="7.8" fill="#1D4ED8">改一条要重算其后全部</text>
  <rect x="24" y="252" width="300" height="68" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="174" y="270.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">时间戳</text>
  <text x="174" y="287" text-anchor="middle" font-size="7.8" fill="#6D28D9">TSA 对链头签发</text>
  <text x="174" y="304.94" text-anchor="middle" font-size="7.8" fill="#6D28D9">证明「此刻已存在」</text>
  <rect x="24" y="336" width="300" height="68" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="174" y="354.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">外部锚定</text>
  <text x="174" y="371" text-anchor="middle" font-size="7.8" fill="#047857">链头摘要送第三方</text>
  <text x="174" y="388.94" text-anchor="middle" font-size="7.8" fill="#047857">签署方改不动</text>
  <line x1="174" y1="152" x2="174" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="174" y1="236" x2="174" y2="246" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="174" y1="320" x2="174" y2="330" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="392" y="84" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">本机读数（1,000 条事件链）</text>
  <rect x="392" y="96" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="112" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">未篡改</text>
  <rect x="548" y="96" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="112" text-anchor="start" font-size="8" fill="#1D4ED8">首处不一致 = None</text>
  <rect x="392" y="126" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="142" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">改第 500 条</text>
  <rect x="548" y="126" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="142" text-anchor="start" font-size="8" fill="#1D4ED8">定位到 500，只 1 条失败</text>
  <rect x="392" y="156" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="172" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">隐藏它需重算</text>
  <rect x="548" y="156" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="172" text-anchor="start" font-size="8" fill="#1D4ED8">500 条（500~999）</text>
  <rect x="392" y="186" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="202" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">改第 0 条</text>
  <rect x="548" y="186" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="202" text-anchor="start" font-size="8" fill="#1D4ED8">需重算全部 1,000 条</text>
  <rect x="392" y="216" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="232" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">重建 10 万条</text>
  <rect x="548" y="216" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="232" text-anchor="start" font-size="8" fill="#1D4ED8">211.8 ms（47 万条/秒）</text>
  <rect x="392" y="246" width="150" height="24" rx="4" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="467" y="262" text-anchor="middle" font-size="8.2" fill="#1E293B" font-weight="bold">每条独立签名</text>
  <rect x="548" y="246" width="188" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="554" y="262" text-anchor="start" font-size="8" fill="#1D4ED8">10 万条 = 24 MiB</text>
  <rect x="392" y="284" width="344" height="120" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="404" y="304" text-anchor="start" font-size="9.5" fill="#92400E" font-weight="bold">为什么链本身不够</text>
  <text x="404" y="324" text-anchor="start" font-size="7.8" fill="#92400E">链能防「悄悄改一条」，防不住「从改动处往后全</text>
  <text x="404" y="340" text-anchor="start" font-size="7.8" fill="#92400E">部重算」。所以链头必须离开签署方的控制范围：</text>
  <text x="404" y="356" text-anchor="start" font-size="7.8" fill="#92400E">① 交 TSA 打时间戳；② 把摘要推给第三方存证；</text>
  <text x="404" y="372" text-anchor="start" font-size="7.8" fill="#92400E">③ 把摘要写进已发布的、不可改的外部介质。</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
