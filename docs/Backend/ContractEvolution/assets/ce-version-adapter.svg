<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="服务端承载多版本：入口解析版本、版本 DTO、单一领域模型、出站映射四层，版本差异只出现在 DTO 与映射两层">
  <title>服务端多版本：版本差异只允许出现在两端，中间只有一份领域模型</title>
  <defs>
    <marker id="ce4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ce4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="440" fill="#f8fafc"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">四层结构：版本差异收敛在 ② 与 ④，领域模型永远只有一份</text>

  <rect x="30" y="176" width="120" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="90" y="204" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">请求</text>
  <text x="90" y="224" font-size="9.6" fill="#475569" text-anchor="middle">/api/v2/posts</text>
  <text x="90" y="242" font-size="9.6" fill="#475569" text-anchor="middle">X-API-Version</text>

  <rect x="180" y="176" width="130" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="245" y="200" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">① 版本解析</text>
  <text x="245" y="220" font-size="9.6" fill="#475569" text-anchor="middle">路径优先 → Header</text>
  <text x="245" y="238" font-size="9.6" fill="#be123c" text-anchor="middle">返回枚举，不返字符串</text>

  <rect x="340" y="96" width="150" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="415" y="120" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">② V1PostDto</text>
  <text x="415" y="140" font-size="9.6" fill="#475569" text-anchor="middle">amount（元）+ status(int)</text>
  <text x="415" y="156" font-size="9.6" fill="#475569" text-anchor="middle">含已废弃字段</text>

  <rect x="340" y="180" width="150" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="415" y="204" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">② V2PostDto</text>
  <text x="415" y="224" font-size="9.6" fill="#475569" text-anchor="middle">amount_cents + state</text>
  <text x="415" y="240" font-size="9.6" fill="#475569" text-anchor="middle">删掉 legacy_flag</text>

  <rect x="340" y="264" width="150" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="415" y="288" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">② V3PostDto</text>
  <text x="415" y="308" font-size="9.6" fill="#475569" text-anchor="middle">灰度中，字段更少</text>
  <text x="415" y="324" font-size="9.6" fill="#475569" text-anchor="middle">不允许直连领域模型</text>

  <rect x="530" y="176" width="150" height="80" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="605" y="202" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">③ 领域模型 Post</text>
  <text x="605" y="222" font-size="9.6" fill="#475569" text-anchor="middle">唯一，不含 version</text>
  <text x="605" y="240" font-size="9.6" fill="#475569" text-anchor="middle">业务逻辑只写在这里</text>

  <rect x="720" y="176" width="150" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="795" y="198" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">④ 出站映射</text>
  <text x="795" y="218" font-size="9.6" fill="#475569" text-anchor="middle">改名 · 换算 · 枚举合并</text>
  <text x="795" y="236" font-size="9.6" fill="#be123c" text-anchor="middle">废弃字段在此推导填充</text>

  <line x1="150" y1="216" x2="176" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#ce4a)"/>
  <line x1="310" y1="216" x2="336" y2="212" stroke="#475569" stroke-width="1.4" marker-end="url(#ce4a)"/>
  <line x1="490" y1="212" x2="526" y2="214" stroke="#475569" stroke-width="1.4" marker-end="url(#ce4a)"/>
  <line x1="680" y1="216" x2="716" y2="216" stroke="#475569" stroke-width="1.4" marker-end="url(#ce4a)"/>

  <line x1="490" y1="130" x2="526" y2="186" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ce4a)"/>
  <line x1="490" y1="296" x2="526" y2="246" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ce4a)"/>

  <rect x="30" y="352" width="400" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="374" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">反模式：36 处 if（12 接口 × 3 版本）</text>
  <text x="46" y="394" font-size="9.8" fill="#475569" text-anchor="start">每处手写字段裁剪 → 脱敏不一致、错误体不一致</text>
  <text x="46" y="410" font-size="9.8" fill="#be123c" text-anchor="start">新增第四个版本时，这 36 处都要再审一遍</text>

  <rect x="470" y="352" width="400" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="486" y="374" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">共享内核陷阱：@Entity 直接当响应体</text>
  <text x="486" y="394" font-size="9.8" fill="#475569" text-anchor="start">加一个内部字段 = 契约多一个字段（可能是敏感数据）</text>
  <text x="486" y="410" font-size="9.8" fill="#be123c" text-anchor="start">加懒加载关联 → 序列化抛 LazyInitializationException</text>
</svg>
