<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="消费者清单的五个信号源：网关日志、链路追踪、契约仓库、SDK 下载、应用注册表，各自的覆盖范围与盲区">
  <title>消费者清单：五个信号源各自覆盖什么、漏掉什么</title>
  <defs>
    <marker id="ce3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">五个信号源：用日志算「量」，用注册表找「人」</text>

  <rect x="330" y="196" width="240" height="82" rx="10" fill="#0f172a"/>
  <text x="450" y="224" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">消费者清单</text>
  <text x="450" y="246" font-size="10" fill="#cbd5e1" text-anchor="middle">谁在调 · 调多少 · 能不能改</text>
  <text x="450" y="266" font-size="10" fill="#94a3b8" text-anchor="middle">三问答不齐就不能下线</text>

  <rect x="40" y="70" width="230" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="56" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">① 网关访问日志</text>
  <text x="56" y="114" font-size="9.8" fill="#15803d" text-anchor="start">覆盖：全部真实请求、可按天聚合</text>
  <text x="56" y="132" font-size="9.8" fill="#be123c" text-anchor="start">盲区：内网直连；保留期短</text>
  <text x="56" y="152" font-size="9.8" fill="#475569" text-anchor="start">用途：算量与占比（唯一可信）</text>

  <rect x="40" y="200" width="230" height="96" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="56" y="224" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">② 分布式追踪</text>
  <text x="56" y="244" font-size="9.8" fill="#15803d" text-anchor="start">覆盖：服务间调用、真实依赖链</text>
  <text x="56" y="262" font-size="9.8" fill="#be123c" text-anchor="start">盲区：采样率 1%~10%，低频看不见</text>
  <text x="56" y="282" font-size="9.8" fill="#475569" text-anchor="start">用途：发现「居然还有人在调」</text>

  <rect x="40" y="330" width="230" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="56" y="354" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">③ 契约仓库（CDC）</text>
  <text x="56" y="374" font-size="9.8" fill="#15803d" text-anchor="start">覆盖：已登记消费者依赖哪些字段</text>
  <text x="56" y="392" font-size="9.8" fill="#be123c" text-anchor="start">盲区：接入率通常只有 20%~30%</text>
  <text x="56" y="412" font-size="9.8" fill="#475569" text-anchor="start">用途：定「字段」粒度，最精确</text>

  <rect x="630" y="70" width="230" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="646" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">④ SDK / 包下载统计</text>
  <text x="646" y="114" font-size="9.8" fill="#15803d" text-anchor="start">覆盖：构建系统级消费者、版本分布</text>
  <text x="646" y="132" font-size="9.8" fill="#be123c" text-anchor="start">盲区：手写 HTTP 调用完全看不到</text>
  <text x="646" y="152" font-size="9.8" fill="#475569" text-anchor="start">用途：看迁移进度（拉取≠运行）</text>

  <rect x="630" y="200" width="230" height="96" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="646" y="224" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">⑤ 应用注册表</text>
  <text x="646" y="244" font-size="9.8" fill="#15803d" text-anchor="start">覆盖：负责人、团队、回调地址</text>
  <text x="646" y="262" font-size="9.8" fill="#be123c" text-anchor="start">盲区：只覆盖注册过的；数据会腐化</text>
  <text x="646" y="282" font-size="9.8" fill="#475569" text-anchor="start">用途：唯一能直接给出「人」的源</text>

  <rect x="630" y="330" width="230" height="96" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="646" y="354" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">可归因率（合成指标）</text>
  <text x="646" y="376" font-size="9.8" fill="#475569" text-anchor="start">能映射到(系统,负责人)的请求占比</text>
  <text x="646" y="396" font-size="9.8" fill="#15803d" text-anchor="start">≥ 99.5%：可进入下线流程</text>
  <text x="646" y="416" font-size="9.8" fill="#be123c" text-anchor="start">&lt; 95%：任何下线结论都不可靠</text>

  <line x1="270" y1="128" x2="326" y2="206" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>
  <line x1="270" y1="248" x2="326" y2="238" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>
  <line x1="270" y1="368" x2="326" y2="262" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>
  <line x1="630" y1="128" x2="574" y2="206" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>
  <line x1="630" y1="248" x2="574" y2="238" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>
  <line x1="630" y1="368" x2="574" y2="262" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ce3a)"/>

  <text x="30" y="452" font-size="10" fill="#475569" text-anchor="start">没有单一信号能覆盖全部：日志缺「人」，注册表缺「量」，追踪缺「低频」，CDC 缺「广度」，SDK 缺「手写调用」。</text>
  <text x="30" y="470" font-size="10" fill="#be123c" text-anchor="start">最危险的不是「清单不全」，而是「日志窗口只有 7 天」——季度任务在窗口里根本不存在。</text>
</svg>
