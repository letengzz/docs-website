<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="症状分诊：白屏、数值偏差、分页漏数、不知道谁在调、门禁假绿、公告无效，分别指向对应的页面">
  <title>症状分诊：从「看到什么」到「先看哪一页」</title>
  <defs>
    <marker id="cea1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">六种症状、六条线索：先定位到页，再定位到判据</text>

  <rect x="26" y="58" width="330" height="52" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
  <text x="42" y="78" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">老客户端白屏，但只加了个字段</text>
  <text x="42" y="96" font-size="9.4" fill="#475569" text-anchor="start">严格解析器把「加法」变成了故障</text>

  <rect x="26" y="122" width="330" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="42" y="142" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">接口 200，金额偏差固定倍数</text>
  <text x="42" y="160" font-size="9.4" fill="#475569" text-anchor="start">统一倍率 = 单位变更的指纹</text>

  <rect x="26" y="186" width="330" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="42" y="206" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">分页翻到后面开始漏数据</text>
  <text x="42" y="224" font-size="9.4" fill="#475569" text-anchor="start">ORDER BY 缺唯一 tiebreaker</text>

  <rect x="26" y="250" width="330" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="42" y="270" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">不知道谁在调 v1，不敢下线</text>
  <text x="42" y="288" font-size="9.4" fill="#475569" text-anchor="start">可归因率低于 99.5%</text>

  <rect x="26" y="314" width="330" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="42" y="334" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">CI 全绿，线上还是炸了</text>
  <text x="42" y="352" font-size="9.4" fill="#475569" text-anchor="start">门禁从未红过 = 可信度为零</text>

  <rect x="26" y="378" width="330" height="52" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
  <text x="42" y="398" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">废弃公告发了两年，量没降</text>
  <text x="42" y="416" font-size="9.4" fill="#475569" text-anchor="start">只做了 Mark，没做 Constrain</text>

  <rect x="596" y="58" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="80" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">兼容性判定 · 四种「看似安全」</text>
  <text x="612" y="98" font-size="9.4" fill="#475569" text-anchor="start">判据 CEC-B：文档须要求忽略未知字段</text>

  <rect x="596" y="122" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="144" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">兼容性判定 · 三值断言</text>
  <text x="612" y="162" font-size="9.4" fill="#475569" text-anchor="start">状态码 / 结构 / 数值，缺一不可</text>

  <rect x="596" y="186" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="208" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">兼容性判定 · 排序稳定性</text>
  <text x="612" y="226" font-size="9.4" fill="#475569" text-anchor="start">判据 CEC-E：必须有唯一列 tiebreaker</text>

  <rect x="596" y="250" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="272" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">消费者清单 · 五个信号源</text>
  <text x="612" y="290" font-size="9.4" fill="#475569" text-anchor="start">判据 CEI-G：达标才允许进入下线</text>

  <rect x="596" y="314" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="336" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">契约门禁 · 变异测试</text>
  <text x="612" y="354" font-size="9.4" fill="#475569" text-anchor="start">判据 CEG-C：新增门禁必须能红一次</text>

  <rect x="596" y="378" width="278" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="612" y="400" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">下线 · 五阶段</text>
  <text x="612" y="418" font-size="9.4" fill="#475569" text-anchor="start">判据 CEU-B：中间阶段用限流而非关停</text>

  <line x1="356" y1="84" x2="592" y2="84" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>
  <line x1="356" y1="148" x2="592" y2="148" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>
  <line x1="356" y1="212" x2="592" y2="212" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>
  <line x1="356" y1="276" x2="592" y2="276" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>
  <line x1="356" y1="340" x2="592" y2="340" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>
  <line x1="356" y1="404" x2="592" y2="404" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#cea1)"/>

  <text x="450" y="452" font-size="10" fill="#475569" text-anchor="middle">左列是「你看到什么」，右列是「先看哪一页」；每页都给出可机器判的判据编号。</text>
</svg>
