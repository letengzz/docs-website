<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="契约演进：同步接口、异步消息、数据库表、客户端 SDK 四类契约面，共用判定、承载、门禁、下线四步主线">
  <title>契约演进：四类契约面与同一条演进主线</title>
  <defs>
    <marker id="ce1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">四类契约面：同一次改动会同时打到不止一处</text>

  <rect x="30" y="62" width="196" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="128" y="86" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">① 同步接口</text>
  <text x="128" y="106" font-size="9.8" fill="#475569" text-anchor="middle">HTTP + JSON / gRPC</text>
  <text x="128" y="124" font-size="9.8" fill="#475569" text-anchor="middle">前端 · 移动端 · 第三方</text>
  <text x="128" y="146" font-size="9.8" fill="#be123c" text-anchor="middle">症状：报错 / 白屏</text>
  <text x="128" y="164" font-size="9.8" fill="#475569" text-anchor="middle">检测：oasdiff / buf</text>

  <rect x="240" y="62" width="196" height="112" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="338" y="86" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">② 异步消息</text>
  <text x="338" y="106" font-size="9.8" fill="#475569" text-anchor="middle">Kafka / RabbitMQ 消息体</text>
  <text x="338" y="124" font-size="9.8" fill="#475569" text-anchor="middle">下游服务 · 数仓 · 风控</text>
  <text x="338" y="146" font-size="9.8" fill="#be123c" text-anchor="middle">症状：死信堆积 / 静默写错</text>
  <text x="338" y="164" font-size="9.8" fill="#475569" text-anchor="middle">检测：registry 兼容模式</text>

  <rect x="450" y="62" width="196" height="112" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="548" y="86" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">③ 数据库表</text>
  <text x="548" y="106" font-size="9.8" fill="#475569" text-anchor="middle">表结构 + 视图</text>
  <text x="548" y="124" font-size="9.8" fill="#475569" text-anchor="middle">本服务 · BI · CDC · 报表</text>
  <text x="548" y="146" font-size="9.8" fill="#be123c" text-anchor="middle">症状：查询报错 / 口径漂移</text>
  <text x="548" y="164" font-size="9.8" fill="#475569" text-anchor="middle">检测：四阶段 + 对账</text>

  <rect x="660" y="62" width="196" height="112" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="758" y="86" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">④ 客户端 SDK / 包</text>
  <text x="758" y="106" font-size="9.8" fill="#475569" text-anchor="middle">npm / Maven / pip</text>
  <text x="758" y="124" font-size="9.8" fill="#475569" text-anchor="middle">集成方代码</text>
  <text x="758" y="146" font-size="9.8" fill="#be123c" text-anchor="middle">症状：编译失败 / 运行时报错</text>
  <text x="758" y="164" font-size="9.8" fill="#475569" text-anchor="middle">检测：语义化版本 + 弃用</text>

  <text x="30" y="206" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">同一条主线：四类契约面共用一套判定与流程，区别只在「谁能被机器检查」</text>
  <line x1="128" y1="174" x2="128" y2="224" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="338" y1="174" x2="338" y2="224" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="548" y1="174" x2="548" y2="224" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="758" y1="174" x2="758" y2="224" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 4"/>

  <rect x="30" y="228" width="196" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="128" y="252" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">1. 判定</text>
  <text x="128" y="272" font-size="9.6" fill="#475569" text-anchor="middle">结构 / 语义 / 时序</text>
  <text x="128" y="290" font-size="9.6" fill="#475569" text-anchor="middle">S1 与 S2 各跑一遍</text>

  <rect x="240" y="228" width="196" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="338" y="252" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">2. 承载</text>
  <text x="338" y="272" font-size="9.6" fill="#475569" text-anchor="middle">适配层 / 四阶段 / 兼容模式</text>
  <text x="338" y="290" font-size="9.6" fill="#475569" text-anchor="middle">内部模型只有一份</text>

  <rect x="450" y="228" width="196" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="548" y="252" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">3. 门禁</text>
  <text x="548" y="272" font-size="9.6" fill="#475569" text-anchor="middle">静态 diff · CDC</text>
  <text x="548" y="290" font-size="9.6" fill="#475569" text-anchor="middle">回放对账 · N-1 矩阵</text>

  <rect x="660" y="228" width="196" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="758" y="252" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">4. 下线</text>
  <text x="758" y="272" font-size="9.6" fill="#475569" text-anchor="middle">标注 → 限流 → 410</text>
  <text x="758" y="290" font-size="9.6" fill="#475569" text-anchor="middle">按迁移能力分批</text>

  <line x1="226" y1="265" x2="238" y2="265" stroke="#475569" stroke-width="1.4" marker-end="url(#ce1a)"/>
  <line x1="436" y1="265" x2="448" y2="265" stroke="#475569" stroke-width="1.4" marker-end="url(#ce1a)"/>
  <line x1="646" y1="265" x2="658" y2="265" stroke="#475569" stroke-width="1.4" marker-end="url(#ce1a)"/>

  <rect x="30" y="330" width="826" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="354" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start">能机器检查的比例</text>
  <rect x="46" y="366" width="220" height="22" rx="4" fill="#1d4ed8"/>
  <text x="156" y="382" font-size="10" fill="#ffffff" text-anchor="middle">结构 100%</text>
  <rect x="276" y="366" width="220" height="22" rx="4" fill="#b45309"/>
  <text x="386" y="382" font-size="10" fill="#ffffff" text-anchor="middle">语义 约 20%（靠回放）</text>
  <rect x="506" y="366" width="220" height="22" rx="4" fill="#be123c"/>
  <text x="616" y="382" font-size="10" fill="#ffffff" text-anchor="middle">时序 约 10%（靠演练）</text>

  <text x="30" y="436" font-size="11" font-weight="600" fill="#0f172a" text-anchor="start">三个必须记住的判据</text>
  <text x="30" y="458" font-size="10" fill="#475569" text-anchor="start">① 兼容性只对「最老的消费者」成立——不是对接文档的属性。</text>
  <text x="30" y="476" font-size="10" fill="#475569" text-anchor="start">② 默认值属于契约：改默认值与删字段同级处理。</text>
  <text x="30" y="494" font-size="10" fill="#be123c" text-anchor="start">③ 只做加法不一定安全：严格解析器会把新增字段变成故障。</text>
</svg>
