<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="430" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">微服务总体架构</text>
  <!-- 客户端 -->
  <rect x="330" y="55" width="180" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="420" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">客户端（Web / App）</text>
  <text x="420" y="98" text-anchor="middle" font-size="11" fill="#4b5563">统一入口访问</text>
  <!-- 网关 -->
  <path d="M 420 112 V 140" stroke="#6366f1" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="330" y="145" width="180" height="52" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="420" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">API 网关</text>
  <text x="420" y="188" text-anchor="middle" font-size="11" fill="#4b5563">路由 · 鉴权 · 限流</text>
  <!-- 服务 -->
  <path d="M 360 202 V 235" stroke="#ec4899" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M 420 202 V 235" stroke="#ec4899" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M 480 202 V 235" stroke="#ec4899" stroke-width="2" marker-end="url(#a1)"/>
  <g>
    <rect x="120" y="240" width="170" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="205" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">订单服务</text>
    <text x="205" y="290" text-anchor="middle" font-size="11" fill="#4b5563">实例 1 / 实例 2</text>
    <text x="205" y="308" text-anchor="middle" font-size="11" fill="#6b7280">MySQL</text>
  </g>
  <g>
    <rect x="335" y="240" width="170" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="420" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">库存服务</text>
    <text x="420" y="290" text-anchor="middle" font-size="11" fill="#4b5563">实例 1 / 实例 2</text>
    <text x="420" y="308" text-anchor="middle" font-size="11" fill="#6b7280">MySQL / Redis</text>
  </g>
  <g>
    <rect x="550" y="240" width="170" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="635" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">账户服务</text>
    <text x="635" y="290" text-anchor="middle" font-size="11" fill="#4b5563">实例 1 / 实例 2</text>
    <text x="635" y="308" text-anchor="middle" font-size="11" fill="#6b7280">MySQL</text>
  </g>
  <!-- 基础设施 -->
  <g>
    <rect x="70" y="350" width="700" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="420" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">基础设施：注册中心（Nacos） · 配置中心 · 链路追踪（SkyWalking/Zipkin） · 消息队列 · 监控</text>
    <text x="420" y="398" text-anchor="middle" font-size="12" fill="#475569">服务间调用：OpenFeign + LoadBalancer；故障隔离：熔断/限流/降级</text>
  </g>
  <path d="M 205 322 V 345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 420 322 V 345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 635 322 V 345" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
