<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">熔断器状态机</text>
  <!-- CLOSED -->
  <g>
    <rect x="40" y="110" width="200" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <text x="140" y="145" text-anchor="middle" font-size="17" font-weight="bold" fill="#047857">CLOSED 关闭</text>
    <text x="140" y="175" text-anchor="middle" font-size="12" fill="#374151">正常调用</text>
    <text x="140" y="197" text-anchor="middle" font-size="12" fill="#374151">统计失败率</text>
    <text x="140" y="219" text-anchor="middle" font-size="11" fill="#6b7280">失败率 &gt; 阈值 → 打开</text>
  </g>
  <!-- OPEN -->
  <g>
    <rect x="310" y="110" width="200" height="120" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="410" y="145" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">OPEN 打开</text>
    <text x="410" y="175" text-anchor="middle" font-size="12" fill="#374151">直接拒绝（快速失败）</text>
    <text x="410" y="197" text-anchor="middle" font-size="12" fill="#374151">走降级逻辑</text>
    <text x="410" y="219" text-anchor="middle" font-size="11" fill="#6b7280">等待时间窗口 → 半开</text>
  </g>
  <!-- HALF_OPEN -->
  <g>
    <rect x="580" y="110" width="200" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="680" y="145" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">HALF_OPEN 半开</text>
    <text x="680" y="175" text-anchor="middle" font-size="12" fill="#374151">放行少量探测请求</text>
    <text x="680" y="197" text-anchor="middle" font-size="12" fill="#374151">成功 → 关闭</text>
    <text x="680" y="219" text-anchor="middle" font-size="11" fill="#6b7280">失败 → 重新打开</text>
  </g>
  <path d="M 245 170 H 305" stroke="#10b981" stroke-width="2.5" marker-end="url(#c1)"/>
  <text x="275" y="160" text-anchor="middle" font-size="11" fill="#047857">失败率超标</text>
  <path d="M 515 170 H 575" stroke="#ef4444" stroke-width="2.5" marker-end="url(#c1)"/>
  <text x="545" y="160" text-anchor="middle" font-size="11" fill="#b91c1c">等待超时</text>
  <path d="M 680 235 V 280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 680 285 H 140" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 140 285 V 235" stroke="#f59e0b" stroke-width="2" marker-end="url(#c1)"/>
  <text x="410" y="305" text-anchor="middle" font-size="11" fill="#b45309">探测成功 → 回到 CLOSED；探测失败 → 回到 OPEN</text>
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
