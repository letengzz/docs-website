<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="360" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">链路追踪：一次请求的 Trace 与 Span</text>
  <!-- 客户端 -->
  <rect x="30" y="60" width="120" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">客户端</text>
  <text x="90" y="108" text-anchor="middle" font-size="11" fill="#6b7280">Trace ID 起点</text>
  <!-- 服务调用链 -->
  <g>
    <rect x="190" y="55" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="260" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">网关</text>
    <text x="260" y="105" text-anchor="middle" font-size="10" fill="#6b7280">Span: 鉴权</text>
  </g>
  <g>
    <rect x="360" y="55" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="430" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">订单服务</text>
    <text x="430" y="105" text-anchor="middle" font-size="10" fill="#6b7280">Span: 创建订单</text>
  </g>
  <g>
    <rect x="530" y="55" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="600" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">库存服务</text>
    <text x="600" y="105" text-anchor="middle" font-size="10" fill="#6b7280">Span: 扣库存</text>
  </g>
  <g>
    <rect x="700" y="55" width="120" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="760" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">账户服务</text>
    <text x="760" y="105" text-anchor="middle" font-size="10" fill="#6b7280">Span: 扣款</text>
  </g>
  <path d="M 155 90 H 185" stroke="#6366f1" stroke-width="2"/>
  <path d="M 335 90 H 355" stroke="#6366f1" stroke-width="2"/>
  <path d="M 505 90 H 525" stroke="#6366f1" stroke-width="2"/>
  <path d="M 675 90 H 695" stroke="#6366f1" stroke-width="2"/>
  <!-- 时间线 -->
  <text x="410" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">时间线（Trace = 整条链路，Span = 每个节点耗时）</text>
  <rect x="60" y="190" width="700" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="80" y="202" width="120" height="34" rx="6" fill="#c7d2fe"/>
  <text x="140" y="224" text-anchor="middle" font-size="12" fill="#3730a3">网关 8ms</text>
  <rect x="210" y="202" width="150" height="34" rx="6" fill="#a7f3d0"/>
  <text x="285" y="224" text-anchor="middle" font-size="12" fill="#065f46">订单 120ms</text>
  <rect x="380" y="202" width="100" height="34" rx="6" fill="#fde68a"/>
  <text x="430" y="224" text-anchor="middle" font-size="12" fill="#92400e">库存 60ms</text>
  <rect x="500" y="202" width="80" height="34" rx="6" fill="#fbcfe8"/>
  <text x="540" y="224" text-anchor="middle" font-size="12" fill="#9d174d">账户 90ms</text>
  <!-- 收集 -->
  <rect x="220" y="280" width="400" height="52" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="303" text-anchor="middle" font-size="13" fill="#6d28d9">Agent 上报 → SkyWalking OAP / Zipkin → 界面查看调用拓扑与耗时瓶颈</text>
  <text x="420" y="320" text-anchor="middle" font-size="11" fill="#6b7280">traceId 贯穿日志，定位慢在哪个服务、哪个 SQL、哪个第三方调用</text>
</svg>
