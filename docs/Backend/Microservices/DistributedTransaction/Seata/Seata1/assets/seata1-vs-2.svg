<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Seata 1.x 与 2.x 的配置与能力差异</text>

  <!-- 1.x -->
  <rect x="30" y="60" width="380" height="250" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Seata 1.x（1.8.0 为最后版本）</text>
  <rect x="55" y="106" width="330" height="66" rx="8" fill="#ffffff" stroke="#ef4444"/>
  <text x="220" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">配置文件：两个文件</text>
  <text x="220" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">file.conf（参数） + registry.conf（注册/配置中心）</text>
  <text x="220" y="166" text-anchor="middle" font-size="10" fill="#6b7280">Hocon 风格，键名扁平</text>
  <rect x="55" y="182" width="330" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="220" y="204" text-anchor="middle" font-size="11" fill="#991b1b">启动方式：seata-server.sh/bat</text>
  <text x="220" y="222" text-anchor="middle" font-size="10" fill="#7f1d1d">事务会话存储 file/db/redis 可选</text>
  <rect x="55" y="244" width="330" height="52" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="220" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">状态：仅存量项目使用</text>
  <text x="220" y="284" text-anchor="middle" font-size="10" fill="#7f1d1d">新项目不要使用 1.x；升级前先按官方升级指南核对</text>

  <!-- 2.x -->
  <rect x="470" y="60" width="380" height="250" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="660" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">Seata 2.x（当前 2.7.0）</text>
  <rect x="495" y="106" width="330" height="66" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="660" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">统一配置：application.yml</text>
  <text x="660" y="150" text-anchor="middle" font-size="10" fill="#4338ca">配置项命名空间化，风格与 Spring Boot 一致</text>
  <text x="660" y="166" text-anchor="middle" font-size="10" fill="#6b7280">兼容 1.4.2 及更早的 file.conf / registry.conf</text>
  <rect x="495" y="182" width="330" height="52" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="660" y="204" text-anchor="middle" font-size="11" fill="#3730a3">支持 Raft 高可用模式、控制台（Console）</text>
  <text x="660" y="222" text-anchor="middle" font-size="10" fill="#4338ca">四种模式（AT/TCC/SAGA/XA）与 2.x 客户端配套</text>
  <rect x="495" y="244" width="330" height="52" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="660" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730a3">状态：新项目统一使用 2.x</text>
  <text x="660" y="284" text-anchor="middle" font-size="10" fill="#4338ca">Spring Cloud Alibaba 2023.0.1.0 对应 Seata 2.0.0</text>

  <!-- 迁移 -->
  <rect x="30" y="330" width="820" height="88" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="356" font-size="13" font-weight="bold" fill="#1f2937">1.x → 2.x 迁移要点</text>
  <text x="50" y="380" font-size="11" fill="#374151">① 先升级 Server 还是 Client：按官方升级指南顺序执行，客户端与 Server 版本需匹配，避免协议不兼容。</text>
  <text x="50" y="402" font-size="11" fill="#374151">② 配置迁移：把 file.conf / registry.conf 中的注册、配置、事务分组映射到新配置结构，并保留回滚方案。</text>

  <path d="M 412 185 H 468" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#s12)"/>
  <text x="440" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">升级</text>

  <defs>
    <marker id="s12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
