<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">分布式事务方案全景：刚性事务与柔性事务</text>

  <!-- 问题 -->
  <rect x="30" y="60" width="840" height="66" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="86" font-size="13" font-weight="bold" fill="#1f2937">要解决的问题</text>
  <text x="50" y="110" font-size="11" fill="#374151">下单 = 创建订单（订单库）+ 扣库存（库存库）+ 扣余额（账户库），三步跨服务跨库，任何一步失败都不能留下脏数据</text>

  <!-- 刚性 -->
  <rect x="30" y="146" width="390" height="240" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="225" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">刚性事务（强一致，两阶段）</text>
  <rect x="55" y="190" width="340" height="76" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="225" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">2PC / XA</text>
  <text x="225" y="234" text-anchor="middle" font-size="10" fill="#4b5563">Prepare 阶段锁定资源 → Commit 或 Rollback</text>
  <text x="225" y="252" text-anchor="middle" font-size="10" fill="#6b7280">数据库原生支持；同步阻塞、锁持有时间长</text>
  <rect x="55" y="278" width="340" height="92" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="225" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">适用与代价</text>
  <text x="225" y="322" text-anchor="middle" font-size="10" fill="#4338ca">适用：强一致、低并发（资金对账、存量系统改造）</text>
  <text x="225" y="340" text-anchor="middle" font-size="10" fill="#4338ca">代价：可用性下降，协调者与参与者故障都会阻塞</text>
  <text x="225" y="360" text-anchor="middle" font-size="10" fill="#6b7280">代表：MySQL XA、Seata XA 模式</text>

  <!-- 柔性 -->
  <rect x="480" y="146" width="390" height="240" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">柔性事务（最终一致，可补偿）</text>
  <rect x="505" y="190" width="160" height="76" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="585" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">TCC</text>
  <text x="585" y="234" text-anchor="middle" font-size="10" fill="#374151">Try 预留</text>
  <text x="585" y="252" text-anchor="middle" font-size="10" fill="#374151">Confirm / Cancel</text>
  <rect x="685" y="190" width="160" height="76" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="765" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">SAGA</text>
  <text x="765" y="234" text-anchor="middle" font-size="10" fill="#374151">子事务序列</text>
  <text x="765" y="252" text-anchor="middle" font-size="10" fill="#374151">反向补偿</text>
  <rect x="505" y="278" width="160" height="92" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text x="585" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">本地消息表</text>
  <text x="585" y="322" text-anchor="middle" font-size="10" fill="#065f46">业务与消息同库同事务</text>
  <text x="585" y="340" text-anchor="middle" font-size="10" fill="#065f46">定时投递 + 消费幂等</text>
  <text x="585" y="360" text-anchor="middle" font-size="10" fill="#6b7280">最推荐的入门方案</text>
  <rect x="685" y="278" width="160" height="92" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text x="765" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">事务消息</text>
  <text x="765" y="322" text-anchor="middle" font-size="10" fill="#065f46">半消息 + 本地事务</text>
  <text x="765" y="340" text-anchor="middle" font-size="10" fill="#065f46">失败回查补偿</text>
  <text x="765" y="360" text-anchor="middle" font-size="10" fill="#6b7280">RocketMQ 原生支持</text>

  <!-- 落地框架 -->
  <rect x="30" y="404" width="840" height="48" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="450" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">统一框架：Apache Seata（AT / TCC / SAGA / XA 四种模式，TC + TM + RM 三个角色）</text>
  <text x="450" y="443" text-anchor="middle" font-size="10" fill="#6b7280">选型顺序：能不分布式就不分布式 → 能最终一致就不强一致 → 再考虑框架</text>
</svg>
