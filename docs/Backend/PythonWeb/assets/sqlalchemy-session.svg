<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="544" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">SQLAlchemy 的会话、事务与连接池三层结构</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">参数不是越大越好：先算端到端预算，再用压测找真实拐点</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">三层结构：池管连接、Session 管事务、ORM 对象管状态</text>
  <rect x="30" y="92" width="700" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="110.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Engine + 连接池</text>
  <text x="380" y="127" text-anchor="middle" font-size="8.5" fill="#1D4ED8">pool_size 常驻 · max_overflow 峰值缓冲 · pool_timeout 快速失败</text>
  <text x="380" y="146.55" text-anchor="middle" font-size="8.5" fill="#1D4ED8">pool_recycle 必须小于服务端 wait_timeout，否则每小时固定出现 Lost connection</text>
  <text x="380" y="166.1" text-anchor="middle" font-size="8.5" fill="#1D4ED8">pool_pre_ping 取连接前轻量探活；用了 PgBouncer 时可能失效，需更短的 recycle</text>
  <line x1="380" y1="166" x2="380" y2="184" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="184" width="700" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="202.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">Session（AsyncSession）</text>
  <text x="380" y="219" text-anchor="middle" font-size="8.5" fill="#6D28D9">expire_on_commit=False 在异步下是必须的，否则 commit 后访问属性会抛 MissingGreenlet</text>
  <text x="380" y="238.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">事务边界只有一处：要么 yield 依赖统一提交，要么 session.begin()，不要混用</text>
  <text x="380" y="258.1" text-anchor="middle" font-size="8.5" fill="#6D28D9">异常路径必须 rollback，否则连接归还池时仍带着未回滚事务（idle in transaction）</text>
  <line x1="380" y1="258" x2="380" y2="276" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="276" width="700" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="294.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">ORM 对象</text>
  <text x="380" y="311" text-anchor="middle" font-size="8.5" fill="#0F766E">lazy="raise" 强制显式声明加载策略，避免隐式 IO 与 N+1</text>
  <text x="380" y="330.55" text-anchor="middle" font-size="8.5" fill="#0F766E">selectinload 是默认首选；joinedload 用于多对一；一对多用 joinedload 会放大行数</text>
  <line x1="30" y1="352" x2="730" y2="352" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="378" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">端到端连接预算（必须在扩容前算清）</text>
  <rect x="30" y="390" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="125" y="407" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">来源</text>
  <rect x="220" y="390" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="285" y="407" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">占用</text>
  <rect x="350" y="390" width="380" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="540" y="407" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">说明</text>
  <rect x="30" y="416" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="432" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">业务服务 4 实例</text>
  <rect x="220" y="416" width="130" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="285" y="432" text-anchor="middle" font-size="7.5" fill="#334155">4×(20+10)=120</text>
  <rect x="350" y="416" width="380" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="432" text-anchor="middle" font-size="7.5" fill="#334155">pool_size 20 + max_overflow 10</text>
  <rect x="30" y="440" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="456" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">定时任务 2 实例</text>
  <rect x="220" y="440" width="130" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="285" y="456" text-anchor="middle" font-size="7.5" fill="#334155">2×(5+2)=14</text>
  <rect x="350" y="440" width="380" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="456" text-anchor="middle" font-size="7.5" fill="#334155">批量任务应显著小于在线服务</text>
  <rect x="30" y="464" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="480" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">迁移 / 运维工具</text>
  <rect x="220" y="464" width="130" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="285" y="480" text-anchor="middle" font-size="7.5" fill="#334155">20</text>
  <rect x="350" y="464" width="380" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="480" text-anchor="middle" font-size="7.5" fill="#334155">留给手工排查与迁移窗口</text>
  <rect x="30" y="488" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="504" text-anchor="middle" font-size="7.5" fill="#1E293B" font-weight="bold">数据库上限</text>
  <rect x="220" y="488" width="130" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="285" y="504" text-anchor="middle" font-size="7.5" fill="#334155">500</text>
  <rect x="350" y="488" width="380" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="504" text-anchor="middle" font-size="7.5" fill="#334155">余量 346，够应对突发与扩容</text>
  <text x="380" y="526" text-anchor="middle" font-size="9.5" fill="#B91C1C">预算超限的表现是「Too many connections」，且往往发生在扩容瞬间</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
