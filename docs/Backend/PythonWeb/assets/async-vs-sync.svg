<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="436" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">同步与异步在 IO 密集场景下的耗时对比</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">async 不是「更快」，而是「等待可以重叠」</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一个接口，两种并发模型：等待时间能不能重叠</text>
  <text x="60" y="106" text-anchor="start" font-size="9.5" fill="#B45309" font-weight="bold">同步（WSGI）：一个请求一个 worker，等待时 worker 被占住</text>
  <text x="34" y="138" text-anchor="start" font-size="8" fill="#92400E">worker 1</text>
  <rect x="100" y="120" width="52" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="126" y="136" text-anchor="middle" font-size="7.5" fill="#047857">DB 30ms</text>
  <rect x="156" y="120" width="52" height="24" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="182" y="136" text-anchor="middle" font-size="7.5" fill="#B45309">排队 90ms</text>
  <rect x="212" y="120" width="52" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="238" y="136" text-anchor="middle" font-size="7.5" fill="#1D4ED8">计算 20ms</text>
  <text x="34" y="172" text-anchor="start" font-size="8" fill="#92400E">worker 2</text>
  <rect x="100" y="154" width="52" height="24" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <text x="126" y="170" text-anchor="middle" font-size="7.5" fill="#B45309">排队 60ms</text>
  <rect x="156" y="154" width="52" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="182" y="170" text-anchor="middle" font-size="7.5" fill="#047857">DB 30ms</text>
  <rect x="212" y="154" width="52" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="238" y="170" text-anchor="middle" font-size="7.5" fill="#1D4ED8">计算 20ms</text>
  <text x="34" y="206" text-anchor="start" font-size="8" fill="#92400E">worker 3</text>
  <rect x="100" y="188" width="55.75" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="127.875" y="204" text-anchor="middle" font-size="7.5" fill="#B91C1C">排队 120ms</text>
  <rect x="159.75" y="188" width="52" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="185.75" y="204" text-anchor="middle" font-size="7.5" fill="#047857">DB 30ms</text>
  <rect x="215.75" y="188" width="52" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="241.75" y="204" text-anchor="middle" font-size="7.5" fill="#1D4ED8">计算 20ms</text>
  <text x="730" y="142" text-anchor="end" font-size="8" fill="#B45309">总耗时 ↑</text>
  <text x="60" y="244" text-anchor="start" font-size="9.5" fill="#0F766E" font-weight="bold">异步（ASGI）：单 worker 内交替推进，等待期间处理其他请求</text>
  <text x="34" y="276" text-anchor="start" font-size="8" fill="#115E59">loop</text>
  <rect x="100" y="258" width="84" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="142" y="274" text-anchor="middle" font-size="7.5" fill="#047857">DB-1</text>
  <rect x="188" y="258" width="84" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="230" y="274" text-anchor="middle" font-size="7.5" fill="#047857">DB-2</text>
  <rect x="276" y="258" width="84" height="24" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="318" y="274" text-anchor="middle" font-size="7.5" fill="#047857">DB-3</text>
  <rect x="364" y="258" width="84" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="406" y="274" text-anchor="middle" font-size="7.5" fill="#1D4ED8">算-1</text>
  <rect x="452" y="258" width="84" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="494" y="274" text-anchor="middle" font-size="7.5" fill="#1D4ED8">算-2</text>
  <rect x="540" y="258" width="84" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="582" y="274" text-anchor="middle" font-size="7.5" fill="#1D4ED8">算-3</text>
  <text x="730" y="276" text-anchor="end" font-size="8" fill="#0F766E">1 个 worker 完成</text>
  <rect x="30" y="306" width="226" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="143" y="324.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">什么时候用 async def</text>
  <text x="143" y="341" text-anchor="middle" font-size="7.5" fill="#047857">调 httpx / 异步 DB / Redis</text>
  <text x="143" y="358.25" text-anchor="middle" font-size="7.5" fill="#047857">需要 await 的外部 IO</text>
  <text x="143" y="375.5" text-anchor="middle" font-size="7.5" fill="#047857">高并发、连接数多</text>
  <rect x="266" y="306" width="226" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="379" y="324.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">什么时候用 def</text>
  <text x="379" y="341" text-anchor="middle" font-size="7.5" fill="#1D4ED8">纯计算、短同步操作</text>
  <text x="379" y="358.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">调用同步库且无法替换</text>
  <text x="379" y="375.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">FastAPI 会放进线程池</text>
  <rect x="502" y="306" width="228" height="88" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="616" y="324.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">四个致命的阻塞写法</text>
  <text x="616" y="341" text-anchor="middle" font-size="7.5" fill="#B91C1C">async 里用 requests</text>
  <text x="616" y="358.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">大计算（bcrypt）不挪线程池</text>
  <text x="616" y="375.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">异步视图配同步 DB 驱动</text>
  <text x="616" y="392.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">读文件 / sleep</text>
  <text x="380" y="418" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">判据：这个函数里，时间花在「等」还是花在「算」——等用 async，算用 def</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
