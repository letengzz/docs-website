<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="458" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Python API 服务的五种部署形态与探针语义</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份代码在开发与生产是两条完全不同的启动路径</text>
  <text x="380" y="76" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">先决定「产物是文件还是进程」，再决定部署到哪</text>
  <rect x="30" y="92" width="132" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">开发</text>
  <text x="96" y="127" text-anchor="middle" font-size="7.5" fill="#334155">uvicorn --reload</text>
  <text x="96" y="144.25" text-anchor="middle" font-size="7.5" fill="#334155">单进程 + 热重载</text>
  <text x="96" y="161.5" text-anchor="middle" font-size="7.5" fill="#334155">禁止用于生产</text>
  <rect x="172" y="92" width="132" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="238" y="110.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">单机生产</text>
  <text x="238" y="127" text-anchor="middle" font-size="7.5" fill="#1D4ED8">gunicorn + uvicorn worker</text>
  <text x="238" y="144.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">worker 挂了自动重启</text>
  <text x="238" y="161.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">-w 取 CPU 核数起步</text>
  <rect x="314" y="92" width="132" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="110.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">K8s Deployment</text>
  <text x="380" y="127" text-anchor="middle" font-size="7.5" fill="#6D28D9">探针决定滚动更新质量</text>
  <text x="380" y="144.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">preStop sleep 覆盖端点传播</text>
  <text x="380" y="161.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">资源请求与限制都要设</text>
  <rect x="456" y="92" width="132" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="522" y="110.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">托管容器 / Serverless</text>
  <text x="522" y="127" text-anchor="middle" font-size="7.5" fill="#0F766E">按量伸缩，冷启动是变量</text>
  <text x="522" y="144.25" text-anchor="middle" font-size="7.5" fill="#0F766E">控制依赖体积与启动耗时</text>
  <text x="522" y="161.5" text-anchor="middle" font-size="7.5" fill="#0F766E">注意平台是否支持流式</text>
  <rect x="598" y="92" width="132" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="664" y="110.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">CPU 密集任务</text>
  <text x="664" y="127" text-anchor="middle" font-size="7.5" fill="#B45309">独立进程 / 任务队列</text>
  <text x="664" y="144.25" text-anchor="middle" font-size="7.5" fill="#B45309">绝不放在 Web 进程里</text>
  <text x="664" y="161.5" text-anchor="middle" font-size="7.5" fill="#B45309">否则阻塞整个事件循环</text>
  <line x1="30" y1="202" x2="730" y2="202" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="228" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">两个探针的语义必须分清（这是「可部署」与「能跑」的分水岭）</text>
  <rect x="30" y="240" width="350" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="205" y="258.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">livenessProbe → /health</text>
  <text x="205" y="275" text-anchor="middle" font-size="7.5" fill="#B91C1C">失败动作：重启容器</text>
  <text x="205" y="292.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">所以绝不能查 DB / Redis</text>
  <text x="205" y="309.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">依赖抖动会导致全部副本被重启</text>
  <text x="205" y="326.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">把小故障放大成服务全挂</text>
  <rect x="390" y="240" width="340" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="258.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">readinessProbe → /ready</text>
  <text x="560" y="275" text-anchor="middle" font-size="7.5" fill="#047857">失败动作：摘掉流量，但不重启</text>
  <text x="560" y="292.25" text-anchor="middle" font-size="7.5" fill="#047857">所以要查所有关键依赖</text>
  <text x="560" y="309.5" text-anchor="middle" font-size="7.5" fill="#047857">依赖恢复前不接新流量</text>
  <text x="560" y="326.75" text-anchor="middle" font-size="7.5" fill="#047857">期望：停掉 Redis 后 ready=503 而 health 仍 200</text>
  <rect x="30" y="348" width="700" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="366.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">镜像五条硬要求</text>
  <text x="380" y="383" text-anchor="middle" font-size="8" fill="#4338CA">非 root 运行 · PYTHONUNBUFFERED=1（不设会丢日志） · 依赖层与代码层分开 COPY</text>
  <text x="380" y="401.4" text-anchor="middle" font-size="8" fill="#4338CA">不要 COPY . .（用 .dockerignore 排除 .env / .git） · 不要把 --reload 带进镜像</text>
  <text x="380" y="440" text-anchor="middle" font-size="9.5" fill="#1E3A8A">验收：镜像 &lt; 250MB、容器内 /health 200、把依赖停掉后 /health 仍 200 且 /ready 变 503</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
