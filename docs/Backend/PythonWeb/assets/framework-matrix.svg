<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="436" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Python Web 三大框架的能力矩阵与异步取舍</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">逐项对照后，选型的争议通常只剩「要不要自带后台」</text>
  <rect x="30" y="74" width="150" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="105" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="180" y="74" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="275" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">Django</text>
  <rect x="370" y="74" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="465" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">Flask</text>
  <rect x="560" y="74" width="170" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="645" y="91" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">FastAPI</text>
  <rect x="30" y="100" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="116" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">核心假设</text>
  <rect x="180" y="100" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="116" text-anchor="middle" font-size="8" fill="#334155">做完整网站</text>
  <rect x="370" y="100" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="116" text-anchor="middle" font-size="8" fill="#334155">只处理 HTTP</text>
  <rect x="560" y="100" width="170" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="116" text-anchor="middle" font-size="8" fill="#334155">在写 API，类型即契约</text>
  <rect x="30" y="124" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="140" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">配置哲学</text>
  <rect x="180" y="124" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="140" text-anchor="middle" font-size="8" fill="#334155">约定优于配置</text>
  <rect x="370" y="124" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="140" text-anchor="middle" font-size="8" fill="#334155">显式配置</text>
  <rect x="560" y="124" width="170" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="140" text-anchor="middle" font-size="8" fill="#334155">声明式（类型注解）</text>
  <rect x="30" y="148" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="164" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">同步/异步</text>
  <rect x="180" y="148" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="164" text-anchor="middle" font-size="8" fill="#334155">同步为主</text>
  <rect x="370" y="148" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="164" text-anchor="middle" font-size="8" fill="#334155">3.x 起支持</text>
  <rect x="560" y="148" width="170" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="164" text-anchor="middle" font-size="8" fill="#334155">异步优先</text>
  <rect x="30" y="172" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="188" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">自带能力</text>
  <rect x="180" y="172" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="188" text-anchor="middle" font-size="8" fill="#334155">ORM/Admin/Auth</text>
  <rect x="370" y="172" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="188" text-anchor="middle" font-size="8" fill="#334155">仅路由与响应对象</text>
  <rect x="560" y="172" width="170" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="188" text-anchor="middle" font-size="8" fill="#334155">校验/序列化/注入</text>
  <rect x="30" y="196" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="212" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">自动文档</text>
  <rect x="180" y="196" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="212" text-anchor="middle" font-size="8" fill="#334155">需插件</text>
  <rect x="370" y="196" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="212" text-anchor="middle" font-size="8" fill="#334155">需插件</text>
  <rect x="560" y="196" width="170" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="212" text-anchor="middle" font-size="8" fill="#334155">内置 OpenAPI</text>
  <rect x="30" y="220" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="236" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">ORM</text>
  <rect x="180" y="220" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="236" text-anchor="middle" font-size="8" fill="#334155">内置 Django ORM</text>
  <rect x="370" y="220" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="236" text-anchor="middle" font-size="8" fill="#334155">需 SQLAlchemy</text>
  <rect x="560" y="220" width="170" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="236" text-anchor="middle" font-size="8" fill="#334155">需 SQLAlchemy</text>
  <rect x="30" y="244" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="260" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">后台管理</text>
  <rect x="180" y="244" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="260" text-anchor="middle" font-size="8" fill="#334155">开箱即用</text>
  <rect x="370" y="244" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="260" text-anchor="middle" font-size="8" fill="#334155">无</text>
  <rect x="560" y="244" width="170" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="260" text-anchor="middle" font-size="8" fill="#334155">无（需第三方）</text>
  <rect x="30" y="268" width="150" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="105" y="284" text-anchor="middle" font-size="8" fill="#1E293B" font-weight="bold">典型体量</text>
  <rect x="180" y="268" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="275" y="284" text-anchor="middle" font-size="8" fill="#334155">中大型内容系统</text>
  <rect x="370" y="268" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="465" y="284" text-anchor="middle" font-size="8" fill="#334155">小型服务</text>
  <rect x="560" y="268" width="170" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="645" y="284" text-anchor="middle" font-size="8" fill="#334155">微服务 / AI 服务</text>
  <text x="380" y="320" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">异步的真相：只在 IO 等待占比高时才有收益</text>
  <rect x="30" y="334" width="226" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="143" y="352.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">IO 密集（DB / 外部 API）</text>
  <text x="143" y="369" text-anchor="middle" font-size="7.5" fill="#047857">async 明显更快</text>
  <text x="143" y="386.25" text-anchor="middle" font-size="7.5" fill="#047857">一个事件循环扛成千连接</text>
  <text x="143" y="403.5" text-anchor="middle" font-size="7.5" fill="#047857">必须用异步驱动与 httpx</text>
  <rect x="266" y="334" width="226" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="379" y="352.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">CPU 密集（哈希 / 报表）</text>
  <text x="379" y="369" text-anchor="middle" font-size="7.5" fill="#B45309">async 没有收益，略慢</text>
  <text x="379" y="386.25" text-anchor="middle" font-size="7.5" fill="#B45309">应放 def 视图或线程池</text>
  <text x="379" y="403.5" text-anchor="middle" font-size="7.5" fill="#B45309">绝不能在协程里同步阻塞</text>
  <rect x="502" y="334" width="228" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="616" y="352.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">worker 数怎么定</text>
  <text x="616" y="369" text-anchor="middle" font-size="7.5" fill="#6D28D9">FastAPI：CPU 核数起步</text>
  <text x="616" y="386.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">Django：2×核数+1</text>
  <text x="616" y="403.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">内存是硬上限，别贪多</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
