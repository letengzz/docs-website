<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306" role="img" aria-label="内部往来对账的三类差异">
<title>内部往来对账的三类差异</title>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">双方余额差 1.74% 看起来很小，但逐笔不匹配 11.0%——总额法永远看不见这件事</text>
<text x="24" y="62" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">内部销售 500 笔 / 54,125,951.67 元</text>
<text x="24" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">销方挂账</text>
<rect x="104" y="84" width="520.0" height="24" rx="8" fill="#bae6fd" stroke="#bae6fd" stroke-width="1.5"/>
<text x="632.0" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">54,125,951.67</text>
<text x="24" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">购方挂账</text>
<rect x="104" y="118" width="510.9676697533067" height="24" rx="8" fill="#bbf7d0" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="622.9676697533067" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">53,185,791.15</text>
<text x="24" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309" font-weight="400">差额 940,160.52 元（1.74%）——如果只对这个数，调整完就「平」了</text>
<text x="24" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">三类差异必须分类处置，不能只调差额：</text>
<rect x="24" y="208" width="4" height="20" rx="2" fill="#fde68a" stroke="#fde68a" stroke-width="1.5"/>
<text x="36" y="223" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">在途：4,028,148.48 元（7.4%）</text>
<rect x="24" y="234" width="4" height="20" rx="2" fill="#fecaca" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="249" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">单边挂账：966,237.30 元（1.8%）</text>
<rect x="24" y="260" width="4" height="20" rx="2" fill="#ddd6fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="36" y="275" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">汇率差：199,219.88 元（0.4%）</text>
<text x="560" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700">逐笔不匹配：55 笔 / 11.0%</text>
<text x="560" y="134" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="400">金额 4,994,385.78 / 9.2%</text>
<text x="560" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">在途 → 期后补记并留痕</text>
<text x="560" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">单边 → 问询对方，不自行冲销</text>
<text x="560" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">汇率 → 按交易日锁定</text>
</svg>
