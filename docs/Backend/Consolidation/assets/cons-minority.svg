<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 404" width="780" height="404" role="img" aria-label="少数股东权益的滚动桥">
<title>少数股东权益的滚动桥</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">少数股东权益是一条滚动的桥，不是一个比例乘出来的数</text>
<rect x="60" y="128.79999999999998" width="96" height="131.20000000000002" rx="4" fill="#bae6fd" stroke="#bae6fd" stroke-width="1.5"/>
<text x="108" y="120.79999999999998" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">1,640,000</text>
<text x="108" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">期初</text>
<line x1="156" y1="254" x2="176" y2="254" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="176" y="221.6" width="96" height="38.400000000000006" rx="4" fill="#bbf7d0" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="224" y="213.6" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">480,000</text>
<text x="224" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">+ 损益份额</text>
<line x1="272" y1="254" x2="292" y2="254" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="292" y="260" width="96" height="9.600000000000001" rx="4" fill="#fecaca" stroke="#fecaca" stroke-width="1.5"/>
<text x="340" y="283.6" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">-120,000</text>
<text x="340" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">− 分红</text>
<line x1="388" y1="254" x2="408" y2="254" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="408" y="253.152" width="96" height="6.848000000000001" rx="4" fill="#ddd6fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="456" y="245.152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">85,600</text>
<text x="456" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">+ CTA 份额</text>
<line x1="504" y1="254" x2="524" y2="254" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="524" y="93.15199999999999" width="96" height="166.848" rx="4" fill="#c7d2fe" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="572" y="85.15199999999999" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">2,085,600</text>
<text x="572" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">期末</text>
<line x1="40" y1="260" x2="740" y2="260" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="24" y="336" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="400">漏 CTA 份额 → 少数股东权益少 85,600；漏分红份额 → 多 120,000（方向相反，都不报错）</text>
<text x="24" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">子公司巨亏 6,800,000 时：按份额承担 → 少数股东权益 −720,000；归零口径 → 母公司多吃 720,000</text>
<text x="24" y="384" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">部分商誉法与全部商誉法差 80,000（商誉 200,000 的 40%）——口径要在附注里写清</text>
</svg>
