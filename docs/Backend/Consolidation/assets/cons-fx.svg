<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-label="外币报表折算与 CTA">
<title>外币报表折算与 CTA</title>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">折算不是「乘一个汇率」：三个报表项用三种汇率，差出来的数叫 CTA</text>
<rect x="24" y="58" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">资产 3,000,000 USD</text>
<text x="232" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700">期末 7.25</text>
<text x="320" y="78" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">21,750,000.00</text>
<rect x="24" y="96" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">负债 1,800,000 USD</text>
<text x="232" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700">期末 7.25</text>
<text x="320" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">13,050,000.00</text>
<rect x="24" y="134" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">实收资本 1,000,000 USD</text>
<text x="232" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700">历史 7.05</text>
<text x="320" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">7,050,000.00</text>
<rect x="24" y="172" width="400" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">净利 200,000 USD</text>
<text x="232" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700">平均 7.18</text>
<text x="320" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">1,436,000.00</text>
<line x1="24" y1="222" x2="424" y2="222" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="24" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">CTA = 21,750,000 − 13,050,000 − 7,050,000 − 1,436,000 = 214,000.00</text>
<rect x="470" y="58" width="380" height="168" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="486" y="84" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">三个会改变 CTA 的选择</text>
<text x="486" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">① 净利按期末而非平均：CTA 200,000（差 14,000）</text>
<text x="486" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">② 时态法：资产 21,590,000（差 160,000）</text>
<text x="486" y="164" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">③ CTA 全归母公司：少数股东权益少 85,600</text>
<text x="486" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">折算是唯一「算法正确也会差」的一段</text>
<text x="470" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="400">顺序也会差：400,000 USD 内部往来，先折后抵与先抵后折差 28,000</text>
<text x="470" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">口径必须先定：所有内部往来按交易日汇率折算，抵销在折算后做</text>
</svg>
