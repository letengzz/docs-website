<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" role="img" aria-label="五类抵销分录与它防的错">
<title>五类抵销分录与它防的错</title>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">五类抵销：每一类的「借」都对应一类被高估的资产或负债</text>
<text x="24" y="72" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">抵销类型</text>
<text x="200" y="72" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">借</text>
<text x="440" y="72" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">贷</text>
<text x="620" y="72" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">防的是什么</text>
<line x1="24" y1="80" x2="880" y2="80" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="16" y="86" width="868" height="34" rx="4" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="24" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">权益抵销</text>
<text x="200" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">实收资本 / 留存收益</text>
<text x="440" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">长期股权投资 / 少数股东权益</text>
<text x="620" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">同一笔净资产记两次</text>
<text x="24" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">往来抵销</text>
<text x="200" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">应付账款</text>
<text x="440" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">应收账款</text>
<text x="620" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">内部债权债务虚增资产</text>
<rect x="16" y="154" width="868" height="34" rx="4" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="24" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">存货未实现</text>
<text x="200" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">营业成本</text>
<text x="440" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">存货</text>
<text x="620" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">集团内部加价留在存货里</text>
<text x="24" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">固定资产未实现</text>
<text x="200" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">资产处置收益</text>
<text x="440" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">固定资产</text>
<text x="620" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">内部卖设备虚增原值</text>
<rect x="16" y="222" width="868" height="34" rx="4" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="24" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">内部收入成本</text>
<text x="200" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">营业收入</text>
<text x="440" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">营业成本</text>
<text x="620" y="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">收入被算了两遍</text>
<line x1="24" y1="266" x2="880" y2="266" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="24" y="298" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" font-weight="400">只做前两类（多数团队的默认）时，合并存货仍会多出内部毛利——「试算平了」不代表「数对了」</text>
<text x="24" y="322" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">权益抵销漏记商誉 200,000：借 5,000,000 / 贷 5,200,000，差 −200,000，抵销表自己不平</text>
</svg>
