<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 336" width="920" height="336" role="img" aria-label="报表包进合并前的四道关">
<title>报表包进合并前的四道关</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">报表包进合并前的四道关：少一道，错的数就会穿着一身正确的格式进表</text>
<rect x="24" y="76" width="164" height="118" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">报表包</text>
<text x="38" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">600 科目</text>
<text x="38" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">4 家单体</text>
<text x="38" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">行数对不上就不收</text>
<line x1="188" y1="135" x2="200" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="200" y="76" width="164" height="118" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="214" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">关账</text>
<text x="214" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">统一 12-31</text>
<text x="214" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">状态 closed</text>
<text x="214" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">未关账的包不能参与合并</text>
<line x1="364" y1="135" x2="376" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="376" y="76" width="164" height="118" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="390" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">映射</text>
<text x="390" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">600→40 行</text>
<text x="390" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">一一对应</text>
<text x="390" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">缺 21 条 = 少 21 </text>
<line x1="540" y1="135" x2="552" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="552" y="76" width="164" height="118" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="566" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">折算</text>
<text x="566" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">原币→本币</text>
<text x="566" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">按汇率类型</text>
<text x="566" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">漏折 = 虚减 3.5 亿</text>
<line x1="716" y1="135" x2="728" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="728" y="76" width="164" height="118" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="742" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">汇总</text>
<text x="742" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">同科目加总</text>
<text x="742" y="144" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">同期间同口径</text>
<text x="742" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">一对多映射 = 重复计入</text>
<text x="24" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#b91c1c" font-weight="400">四类缺陷都不报警：未映射（少行）、一对多映射（重复行）、漏折（量纲错）、跨期（时点错）</text>
<text x="24" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">唯一能自己喊出来的是「借贷不平」——而它只在单体层校验，合并层不重算就静默通过</text>
<text x="24" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="400">本机读数：2,400 行报表包 / 600 科目 / 21 条未映射 → 3,565,524.63 元（1.62%）少了整行</text>
<text x="24" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">B 家原币 56,484,440.38 USD，漏折直接并表 → 虚减 353,027,752.38 元</text>
</svg>
