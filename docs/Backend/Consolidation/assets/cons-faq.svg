<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 324" width="820" height="324" role="img" aria-label="合并数异常的十二行分诊表">
<title>合并数异常的十二行分诊表</title>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">合并数不对时，先看「差在哪一段」，而不是先改数</text>
<text x="24" y="68" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">症状</text>
<text x="300" y="68" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">先查什么</text>
<text x="700" y="68" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">归属</text>
<line x1="24" y1="76" x2="800" y2="76" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="24" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">合并净利 ≠ 母公司 + 份额</text>
<text x="300" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">未实现利润是否抵销 / 有效持股是否穿透</text>
<text x="700" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第④⑥段</text>
<text x="24" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">资产 = 负债 + 权益 不平</text>
<text x="300" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">抵销分录借贷是否等额 / 是否有重复抵销</text>
<text x="700" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第④段</text>
<text x="24" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">少数股东权益对不上</text>
<text x="300" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">CTA 与分红的份额是否计入</text>
<text x="700" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第⑥段</text>
<text x="24" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">合并收入偏高</text>
<text x="300" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">内部收入成本是否成对抵销</text>
<text x="700" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第④段</text>
<text x="24" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">外币子公司数忽高忽低</text>
<text x="300" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">三组汇率是否混用 / CTA 归属是否固定</text>
<text x="700" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第⑤段</text>
<text x="24" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">某科目整行缺失</text>
<text x="300" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">映射表是否缺行 / 是否一对多</text>
<text x="700" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="400">第②段</text>
<line x1="24" y1="270" x2="800" y2="270" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="24" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="400">止血五步：冻结出表 → 取抵销台账 → 逐类核差异 → 只调差异不调总额 → 把判据补进脚本</text>
</svg>
