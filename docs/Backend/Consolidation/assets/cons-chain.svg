<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="合并报表的七段链：收齐定抵折分报">
<title>合并报表的七段链：收齐定抵折分报</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="24" y="92" width="118" height="128" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="37" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">① 收</text>
<text x="37" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">报表包</text>
<text x="37" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">四家单体</text>
<text x="37" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">失败：显性</text>
<line x1="142" y1="156" x2="148" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="148" y="92" width="118" height="128" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="161" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">② 齐</text>
<text x="161" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">口径与</text>
<text x="161" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">科目映射</text>
<text x="161" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="266" y1="156" x2="272" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="272" y="92" width="118" height="128" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="285" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">③ 定</text>
<text x="285" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">合并范围</text>
<text x="285" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">持股链</text>
<text x="285" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="390" y1="156" x2="396" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="396" y="92" width="118" height="128" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="409" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">④ 抵</text>
<text x="409" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">内部交易</text>
<text x="409" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">与抵销</text>
<text x="409" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="514" y1="156" x2="520" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="520" y="92" width="118" height="128" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="533" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑤ 折</text>
<text x="533" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">外币折算</text>
<text x="533" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">与 CTA</text>
<text x="533" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="638" y1="156" x2="644" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="644" y="92" width="118" height="128" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="657" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑥ 分</text>
<text x="657" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">少数股东</text>
<text x="657" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">与权益</text>
<text x="657" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">失败：安静</text>
<line x1="762" y1="156" x2="768" y2="156" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="768" y="92" width="118" height="128" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="781" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">⑦ 报</text>
<text x="781" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">合并三表</text>
<text x="781" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">与勾稽</text>
<text x="781" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">失败：半显性</text>
<text x="24" y="40" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">合并报表的七段链：收 → 齐 → 定 → 抵 → 折 → 分 → 报</text>
<text x="24" y="64" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569" font-weight="400">五段失败是安静的：不报错、不平、不少行，只是合并数与单体数之和不一样</text>
<text x="24" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309" font-weight="400">唯一会自己喊出来的是第①段（借贷不平）与第⑦段（资产≠负债+权益）——其余五段要靠判据去撞</text>
<text x="24" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">所以每段都要留一份可对账的证据：映射表行数 / 有效持股 / 抵销台账 / CTA 归属 / 少数股东滚动</text>
</svg>
