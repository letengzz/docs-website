<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="合并层的三道勾稽">
<title>合并层的三道勾稽</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="36" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700">合并层的三道勾稽：只有第一道会自己喊，后两道要靠台账</text>
<rect x="24" y="68" width="240" height="96" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="94" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">① 单体合计</text>
<text x="40" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">四家试算表逐项相加</text>
<text x="40" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="400">借贷不平会当场报</text>
<line x1="264" y1="116" x2="292" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="292" y="68" width="240" height="96" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="308" y="94" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">② 抵销台账</text>
<text x="308" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">五类抵销逐笔留痕</text>
<text x="308" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b45309" font-weight="400">借贷必须等额同期间</text>
<line x1="532" y1="116" x2="560" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="560" y="68" width="260" height="96" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="576" y="94" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">③ 合并试算</text>
<text x="576" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">40 个合并行 + 少数股东</text>
<text x="576" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">三表勾稽后出表</text>
<text x="32" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700">·</text>
<text x="48" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">资产 = 负债 + 权益</text>
<text x="48" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">恒平——构造正确时它抓不到任何抵销错误</text>
<text x="32" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700">·</text>
<text x="48" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">合并净利 = 母公司 + 份额 − 未实现利润</text>
<text x="48" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">差 3,247,557.10（未抵销内部毛利）</text>
<text x="32" y="304" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700">·</text>
<text x="48" y="304" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">少数股东权益 = 期初 + 损益 − 分红 + CTA</text>
<text x="48" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">漏一项就差 85,600</text>
<text x="32" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700">·</text>
<text x="48" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">抵销后内部往来余额 = 0</text>
<text x="48" y="376" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">逐笔不匹配 55 笔时不等于 0</text>
</svg>
