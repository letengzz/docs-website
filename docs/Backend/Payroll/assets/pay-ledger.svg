<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="成本归集与三条勾稽：一笔工资如何进总账">
<title>成本归集与三条勾稽：一笔工资如何进总账</title>
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">成本归集与三条勾稽：一笔工资如何进总账</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一笔工资在系统里变成四组分录：计提、发放与代扣、缴纳社保、缴纳个税</text>
<rect x="24" y="92" width="208" height="122" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="36" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">① 计提（月末，按部门）</text>
<text x="36" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 管理费用-工资 30,000</text>
<text x="36" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 管理费用-社保 11,850</text>
<text x="36" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 应付职工薪酬 41,850</text>
<line x1="232" y1="153" x2="244" y2="153" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="248" y="92" width="208" height="122" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="260" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">② 发放与代扣（发薪日）</text>
<text x="260" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 应付职工薪酬 30,000</text>
<text x="260" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 其他应付款-社保 5,000</text>
<text x="260" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 应交税费-个税 1,700</text>
<text x="260" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 银行存款 23,300</text>
<line x1="456" y1="153" x2="468" y2="153" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="472" y="92" width="208" height="122" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="484" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">③ 缴纳社保（次月）</text>
<text x="484" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 应付职工薪酬 11,850</text>
<text x="484" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 其他应付款-社保 5,000</text>
<text x="484" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 银行存款 16,850</text>
<line x1="680" y1="153" x2="692" y2="153" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="696" y="92" width="208" height="122" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="708" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">④ 缴纳个税（次月 15 日前）</text>
<text x="708" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">借 应交税费-个税 1,700</text>
<text x="708" y="160" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#475569" text-anchor="start" font-weight="400">贷 银行存款 1,700</text>
<text x="28" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">三条勾稽（月结前必须全为 0）</text>
<rect x="24" y="258" width="872" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400">① 计提合计 − 工资单应发合计 − 单位社保公积金合计 = 0</text>
<rect x="24" y="290" width="872" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400">② 应付职工薪酬期初 + 计提 − 支付 − 期末余额 = 0</text>
<rect x="24" y="322" width="872" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="36" y="340" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400">③ 代扣个税合计 − 个税申报表税额合计 = 0</text>
<rect x="24" y="360" width="872" height="26" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="378" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#991b1b" text-anchor="start" font-weight="400">漏计提单位社保：成本少 11,850，应付职工薪酬余额永远差这一笔，且每月累积</text>
</svg>
