<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 446" width="920" height="446" role="img" aria-label="七段薪酬链：从「打卡」到「入账」">
<title>七段薪酬链：从「打卡」到「入账」</title>
<rect x="0" y="0" width="920" height="446" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">七段薪酬链：从「打卡」到「入账」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">七段里有四段的失败是安静的；越靠前的段错一天，越靠后的段错一个月</text>
<rect x="24" y="92" width="208" height="108" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">① 考勤与工时</text>
<text x="38" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">打卡 / 请假 / 加班</text>
<text x="38" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">班次与假期规则</text>
<text x="38" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（漏一天班）</text>
<line x1="232" y1="146" x2="252" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="256" y="92" width="208" height="108" rx="8" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
<text x="270" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">② 应发计算</text>
<text x="270" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">基本+绩效+补贴</text>
<text x="270" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">缺勤与加班折算</text>
<text x="270" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（日薪口径）</text>
<line x1="464" y1="146" x2="484" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="488" y="92" width="208" height="108" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="502" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">③ 社保公积金</text>
<text x="502" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">基数上下限</text>
<text x="502" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">个人 / 单位分列</text>
<text x="502" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（漏封顶）</text>
<line x1="696" y1="146" x2="716" y2="146" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="720" y="92" width="208" height="108" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="734" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">④ 个税预扣</text>
<text x="734" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">累计预扣法</text>
<text x="734" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">年度重置</text>
<text x="734" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（未归零）</text>
<rect x="24" y="232" width="208" height="108" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="38" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑤ 补发与调整</text>
<text x="38" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">追溯 / 补差</text>
<text x="38" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">跨年归属</text>
<text x="38" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（记错期间）</text>
<line x1="232" y1="286" x2="252" y2="286" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="256" y="232" width="208" height="108" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="270" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑥ 代发与工资条</text>
<text x="270" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">银行文件 / 回执</text>
<text x="270" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">可见范围</text>
<text x="270" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：显性（回执对不上）</text>
<line x1="464" y1="286" x2="484" y2="286" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="488" y="232" width="208" height="108" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="502" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑦ 成本归集与勾稽</text>
<text x="502" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">成本中心分摊</text>
<text x="502" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">应付职工薪酬</text>
<text x="502" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：最后一道</text>
<line x1="696" y1="286" x2="716" y2="286" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M 128 200 L 128 232" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)" fill="none"/>
<text x="28" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">四个必失接缝</text>
<rect x="24" y="384" width="424" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="401" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">计薪天数：21.75 还是当月工作日</text>
<rect x="464" y="384" width="424" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="476" y="401" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">社保基数：申报值还是实际值</text>
<rect x="24" y="416" width="424" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="433" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">年度重置：1 月累计额有没有清零</text>
<rect x="464" y="416" width="424" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="476" y="433" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">成本归集：应发口径还是成本口径</text>
</svg>
