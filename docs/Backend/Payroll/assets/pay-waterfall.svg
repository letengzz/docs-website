<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="从应发到实发：四项扣减与两条支路">
<title>从应发到实发：四项扣减与两条支路</title>
<rect x="0" y="0" width="920" height="420" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">从应发到实发：四项扣减与两条支路</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">示例：月薪 30,000，社保公积金个人部分 5,000，专项附加扣除 3,000，第 6 个月</text>
<rect x="40" y="143.125" width="96" height="196.875" fill="#3b82f6" opacity="0.85" rx="4"/>
<text x="88" y="135.125" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">30,000</text>
<text x="88" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">应发</text>
<rect x="212" y="143.125" width="96" height="32.8125" fill="#f59e0b" opacity="0.85" rx="4"/>
<text x="260" y="135.125" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">5,000</text>
<text x="260" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">个人社保</text>
<rect x="384" y="274.375" width="96" height="32.8125" fill="#8b5cf6" opacity="0.85" rx="4"/>
<text x="432" y="266.375" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">5,000</text>
<text x="432" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">计税所得</text>
<rect x="556" y="175.9375" width="96" height="11.15625" fill="#ef4444" opacity="0.85" rx="4"/>
<text x="604" y="167.9375" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">1,700</text>
<text x="604" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">个税</text>
<rect x="728" y="187.09375" width="96" height="152.90625" fill="#10b981" opacity="0.85" rx="4"/>
<text x="776" y="179.09375" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">23,300</text>
<text x="776" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">实发</text>
<line x1="24" y1="340" x2="896" y2="340" stroke="#94a3b8" stroke-width="1.2"/>
<text x="24" y="384" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">个人社保 = 基数 × (8% + 2% + 0.5% + 12%)</text>
<text x="480" y="384" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">个税 = 累计所得额 × 预扣率 − 速算扣除数 − 已预扣</text>
<text x="24" y="406" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="400">计税所得不是 25,000：这里已扣减 5,000 起征点与 3,000 专项附加扣除</text>
</svg>
