<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-label="社保基数的三段映射：抬升、等比、封顶">
<title>社保基数的三段映射：抬升、等比、封顶</title>
<rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">社保基数的三段映射：抬升、等比、封顶</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">社平工资 12,000 → 下限 7,200（60%）、上限 36,000（300%）</text>
<line x1="60" y1="200" x2="860" y2="200" stroke="#94a3b8" stroke-width="2"/>
<line x1="60.0" y1="192" x2="60.0" y2="208" stroke="#64748b" stroke-width="2"/>
<text x="60.0" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">0</text>
<line x1="175.2" y1="192" x2="175.2" y2="208" stroke="#0369a1" stroke-width="2"/>
<text x="175.2" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" text-anchor="middle" font-weight="600">下限 7,200</text>
<line x1="252.0" y1="192" x2="252.0" y2="208" stroke="#64748b" stroke-width="2"/>
<text x="252.0" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">社平 12,000</text>
<line x1="636.0" y1="192" x2="636.0" y2="208" stroke="#ef4444" stroke-width="2"/>
<text x="636.0" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#ef4444" text-anchor="middle" font-weight="600">上限 36,000</text>
<rect x="60.0" y="120" width="115.19999999999999" height="56" fill="#e0f2fe" rx="4"/>
<text x="117.6" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">抬升区：按下限缴</text>
<rect x="175.2" y="120" width="460.8" height="56" fill="#dcfce7" rx="4"/>
<text x="405.6" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">等比区：按实际缴</text>
<rect x="636.0" y="120" width="224.0" height="56" fill="#fee2e2" rx="4"/>
<text x="748.0" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">封顶区：按上限缴</text>
<text x="24" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">申报 5,000 → 实际 7,200：个人 1,620.00，单位 2,844.00</text>
<text x="24" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">申报 45,000 → 实际 36,000：个人 8,100.00，单位 14,220.00</text>
<text x="24" y="352" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="400">漏做上限：按 45,000 缴，个人每月多缴 2,025.00，全年 24,300.00</text>
</svg>
