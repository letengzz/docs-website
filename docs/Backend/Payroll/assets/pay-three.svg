<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="三个「发多少」：应发、实发、公司成本">
<title>三个「发多少」：应发、实发、公司成本</title>
<rect x="0" y="0" width="920" height="340" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三个「发多少」：应发、实发、公司成本</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">同一个 30,000 的月薪，在三个口径下是三个数；混用一次，报表就对不上</text>
<rect x="24" y="92" width="272" height="132" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="40" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">应发（Gross）</text>
<text x="40" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">30,000.00</text>
<text x="40" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">劳动合同约定的月工资</text>
<text x="40" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">扣款前</text>
<rect x="320" y="92" width="272" height="132" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="336" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">实发（Net）</text>
<text x="336" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">23,300.00</text>
<text x="336" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">打到卡里的钱</text>
<text x="336" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">扣社保 5,000 + 个税 1,700</text>
<rect x="616" y="92" width="272" height="132" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="632" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">公司成本（CTC）</text>
<text x="632" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#0f172a" text-anchor="start" font-weight="700">41,850.00</text>
<text x="632" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">应发 + 单位社保公积金 11,850</text>
<text x="632" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">进成本中心</text>
<text x="28" y="262" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">实发 ÷ 公司成本 = 55.7%</text>
<text x="28" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">个税基数用「应发」减「个人社保」减「专项附加扣除」，不是用实发；成本归集用「应发 + 单位部分」，不是用应发</text>
<text x="28" y="310" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="400">混用口径的典型现象：人力报 30,000、财务报 41,850、员工说收到 23,300，三个数都没错</text>
</svg>
