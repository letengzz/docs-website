<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">WebFlux 线程模型：一个请求会换线程</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">线程数与请求数解耦，代价是上下文不再自动跟随</text>
  <rect x="20" y="76" width="720" height="44" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">一次请求在 WebFlux 里的线程轨迹（Netty + R2DBC）</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#334155">接受连接 → 解析请求 → 进入 handler → 发起数据库查询 → 回写响应</text>
  <rect x="20" y="140" width="172" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="106" y="158.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">EventLoop-1</text>
  <text x="106" y="175" text-anchor="middle" font-size="7.5" fill="#1D4ED8">接受连接</text>
  <text x="106" y="192.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">解析与路由</text>
  <text x="106" y="209.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">执行 handler 前半段</text>
  <rect x="212" y="140" width="172" height="96" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="298" y="158.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">R2DBC 连接</text>
  <text x="298" y="175" text-anchor="middle" font-size="7.5" fill="#0E7490">把 SQL 交给驱动</text>
  <text x="298" y="192.25" text-anchor="middle" font-size="7.5" fill="#0E7490">线程立刻被释放</text>
  <text x="298" y="209.5" text-anchor="middle" font-size="7.5" fill="#0E7490">等待网络事件回来</text>
  <rect x="404" y="140" width="172" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="490" y="158.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">EventLoop-2</text>
  <text x="490" y="175" text-anchor="middle" font-size="7.5" fill="#4338CA">结果回来重新调度</text>
  <text x="490" y="192.25" text-anchor="middle" font-size="7.5" fill="#4338CA">可能在另一个线程上</text>
  <text x="490" y="209.5" text-anchor="middle" font-size="7.5" fill="#4338CA">继续管道后半段</text>
  <rect x="596" y="140" width="144" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="668" y="158.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">响应写出</text>
  <text x="668" y="175" text-anchor="middle" font-size="7.5" fill="#047857">回到 Netty</text>
  <text x="668" y="192.25" text-anchor="middle" font-size="7.5" fill="#047857">分片写字节</text>
  <line x1="192" y1="188" x2="212" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="384" y1="188" x2="404" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="576" y1="188" x2="596" y2="188" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="256" width="350" height="130" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="274.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">三条必须接受的现实</text>
  <text x="195" y="291" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 同一个请求可能在不同线程上执行</text>
  <text x="195" y="308.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② ThreadLocal 会丢，要改用 Reactor Context</text>
  <text x="195" y="325.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 任何一处阻塞都会拖住整条 event loop 上的请求</text>
  <rect x="390" y="256" width="350" height="130" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="565" y="274.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">两条落地纪律</text>
  <text x="565" y="291" text-anchor="middle" font-size="7.5" fill="#047857">① 全链路要么都是响应式客户端，要么在边界上显式切换线程</text>
  <text x="565" y="308.25" text-anchor="middle" font-size="7.5" fill="#047857">② 线程数默认等于 CPU 核数，不要按「每请求一线程」估算容量</text>
  <rect x="20" y="400" width="720" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="418.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">排障判据：jstack 里 event loop 线程长期处于 RUNNABLE 且在做 JDBC 调用</text>
  <text x="380" y="435" text-anchor="middle" font-size="7.5" fill="#B45309">看到这一幕就不是「性能问题」，而是有人把阻塞调用写进了非阻塞链路</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
