<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">响应式链路里五个最容易阻塞的位置</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">非阻塞链路里的一次阻塞，代价是整条链路的吞吐</text>
  <rect x="20" y="74" width="350" height="112" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="92.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">① JDBC / JPA</text>
  <text x="195" y="109" text-anchor="middle" font-size="7.5" fill="#B91C1C">症状：驱动内部线程池被打满</text>
  <text x="195" y="126.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">判据：jstack 出现 pooled-*-thread 在 socketRead</text>
  <text x="195" y="143.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">替代：R2DBC 或把访问隔离到有界线程池</text>
  <rect x="390" y="74" width="350" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="565" y="92.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">② 阻塞式客户端（RestTemplate）</text>
  <text x="565" y="109" text-anchor="middle" font-size="7.5" fill="#C2410C">症状：event loop 上出现 synRead 等待</text>
  <text x="565" y="126.25" text-anchor="middle" font-size="7.5" fill="#C2410C">判据：BlockHound 直接报错并给出调用栈</text>
  <text x="565" y="143.5" text-anchor="middle" font-size="7.5" fill="#C2410C">替代：WebClient / HTTP Interface（响应式实现）</text>
  <rect x="20" y="202" width="350" height="112" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="195" y="220.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">③ 本地缓存与锁</text>
  <text x="195" y="237" text-anchor="middle" font-size="7.5" fill="#B45309">症状：偶发尖刺、与 QPS 无关</text>
  <text x="195" y="254.25" text-anchor="middle" font-size="7.5" fill="#B45309">判据：synchronized 段里有 IO 或长计算</text>
  <text x="195" y="271.5" text-anchor="middle" font-size="7.5" fill="#B45309">替代：ReentrantLock + 无锁读，或干脆移出热路径</text>
  <rect x="390" y="202" width="350" height="112" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="565" y="220.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">④ 文件、命令与打印</text>
  <text x="565" y="237" text-anchor="middle" font-size="7.5" fill="#4338CA">症状：接口 P99 与磁盘相关</text>
  <text x="565" y="254.25" text-anchor="middle" font-size="7.5" fill="#4338CA">判据：链路里出现 File / Process / 同步日志落盘</text>
  <text x="565" y="271.5" text-anchor="middle" font-size="7.5" fill="#4338CA">替代：异步日志、独立线程池、只读快照</text>
  <rect x="20" y="330" width="720" height="100" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="348.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">⑤ 自己写出来的阻塞（最常见也最隐蔽）</text>
  <text x="380" y="365" text-anchor="middle" font-size="7.5" fill="#6D28D9">在响应式链路里调用 block() / blockLast()、在 map 里做重计算、在 filter 里查数据库</text>
  <text x="380" y="382.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">判据：BlockHound 开启后集成测试必须全绿；否则它一定会在生产的高并发时刻现形</text>
  <text x="380" y="399.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">替代：把重计算交给 publishOn(boundedElastic)（有界）、把查询改成异步组合而不是逐条等待</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
