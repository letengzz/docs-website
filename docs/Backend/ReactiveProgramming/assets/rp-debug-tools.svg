<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">响应式排障的四件工具与分工</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">时序靠断言、装配靠调试钩子、阻塞靠门禁、线上靠上下文与水位的协同</text>
  <rect x="20" y="74" width="350" height="108" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="195" y="92.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">StepVerifier（测试期）</text>
  <text x="195" y="109" text-anchor="middle" font-size="7.5" fill="#047857">断言信号的顺序与数量</text>
  <text x="195" y="126.25" text-anchor="middle" font-size="7.5" fill="#047857">expectNext / expectError</text>
  <text x="195" y="143.5" text-anchor="middle" font-size="7.5" fill="#047857">verifyComplete 才算真过</text>
  <text x="195" y="160.75" text-anchor="middle" font-size="7.5" fill="#047857">价值：把「时序」变成可断言对象</text>
  <rect x="390" y="74" width="350" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="565" y="92.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">Hooks.onOperatorDebug（本地）</text>
  <text x="565" y="109" text-anchor="middle" font-size="7.5" fill="#6D28D9">给每个操作符补装配点</text>
  <text x="565" y="126.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">报错里出现 assembly trace</text>
  <text x="565" y="143.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">只在排查时开，开销大</text>
  <text x="565" y="160.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">价值：定位「到底哪一行装配的」</text>
  <rect x="20" y="198" width="350" height="108" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="216.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">BlockHound（门禁）</text>
  <text x="195" y="233" text-anchor="middle" font-size="7.5" fill="#B91C1C">运行时拦截阻塞调用</text>
  <text x="195" y="250.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">把「偷偷阻塞」变成测试失败</text>
  <text x="195" y="267.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">可在 CI 里常开</text>
  <text x="195" y="284.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">价值：唯一能自动拦住阻塞的判据</text>
  <rect x="390" y="198" width="350" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="565" y="216.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">Reactor Context + 日志（线上）</text>
  <text x="565" y="233" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Context 承载 traceId 等横切信息</text>
  <text x="565" y="250.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">MDC 需要显式桥接</text>
  <text x="565" y="267.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">valueCount / 队列指标看水位</text>
  <text x="565" y="284.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">价值：回答「请求走到哪一步慢」</text>
  <rect x="20" y="322" width="720" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="340.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">四件工具各管一段：测试断言时序、本地定位装配、CI 拦阻塞、线上看水位</text>
  <text x="380" y="357" text-anchor="middle" font-size="7.5" fill="#B45309">只用其中一件，都会有整整一类问题永远看不见</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
