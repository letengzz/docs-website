<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 514" width="760" height="514" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="514" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">响应式编程专题地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">从「要不要用」到「怎么验证」，一条主线读完</text>
  <rect x="20" y="72" width="350" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="195" y="90.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">第 0 步：先判断要不要用</text>
  <text x="195" y="107" text-anchor="middle" font-size="7.5" fill="#334155">连接数与线程数不成正比、下游有响应式驱动时才值得</text>
  <rect x="390" y="72" width="350" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="565" y="90.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">第 0 步的对照面</text>
  <text x="565" y="107" text-anchor="middle" font-size="7.5" fill="#334155">虚拟线程用阻塞写法也能扛住大多数 IO 密集场景</text>
  <line x1="195" y1="126" x2="195" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="565" y1="126" x2="565" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="156" width="233" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="136.5" y="174.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">Reactor 核心</text>
  <text x="136.5" y="191" text-anchor="middle" font-size="7.5" fill="#6D28D9">Mono / Flux 是描述不是容器</text>
  <text x="136.5" y="208.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">装配与订阅是两个时刻</text>
  <text x="136.5" y="225.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">调度器决定代码跑在哪个线程</text>
  <rect x="273" y="156" width="233" height="104" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="389.5" y="174.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">背压</text>
  <text x="389.5" y="191" text-anchor="middle" font-size="7.5" fill="#4338CA">request(n) 才是流量控制</text>
  <text x="389.5" y="208.25" text-anchor="middle" font-size="7.5" fill="#4338CA">缓冲满了有四种处置</text>
  <text x="389.5" y="225.5" text-anchor="middle" font-size="7.5" fill="#4338CA">不是所有场景都能真背压</text>
  <rect x="526" y="156" width="233" height="104" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="642.5" y="174.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">数据访问</text>
  <text x="642.5" y="191" text-anchor="middle" font-size="7.5" fill="#0E7490">R2DBC / 响应式 Redis</text>
  <text x="642.5" y="208.25" text-anchor="middle" font-size="7.5" fill="#0E7490">事务边界与连接池</text>
  <text x="642.5" y="225.5" text-anchor="middle" font-size="7.5" fill="#0E7490">五个最容易阻塞的位置</text>
  <line x1="136" y1="260" x2="136" y2="290" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="389" y1="260" x2="389" y2="290" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="642" y1="260" x2="642" y2="290" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="294" width="233" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="136.5" y="312.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">WebFlux 落地</text>
  <text x="136.5" y="329" text-anchor="middle" font-size="7.5" fill="#1D4ED8">注解式与函数式端点</text>
  <text x="136.5" y="346.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">返回值类型与线程模型</text>
  <text x="136.5" y="363.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">什么该留在 MVC</text>
  <rect x="273" y="294" width="233" height="104" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="389.5" y="312.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">排障与验证</text>
  <text x="389.5" y="329" text-anchor="middle" font-size="7.5" fill="#C2410C">StepVerifier 断言时序</text>
  <text x="389.5" y="346.25" text-anchor="middle" font-size="7.5" fill="#C2410C">BlockHound 抓阻塞调用</text>
  <text x="389.5" y="363.5" text-anchor="middle" font-size="7.5" fill="#C2410C">Context 透传与日志</text>
  <rect x="526" y="294" width="233" height="104" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="642.5" y="312.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">实战</text>
  <text x="642.5" y="329" text-anchor="middle" font-size="7.5" fill="#047857">一次聚合查询的改造</text>
  <text x="642.5" y="346.25" text-anchor="middle" font-size="7.5" fill="#047857">超时、降级与并发</text>
  <text x="642.5" y="363.5" text-anchor="middle" font-size="7.5" fill="#047857">可复制的判据清单</text>
  <line x1="380" y1="398" x2="380" y2="428" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="20" y="432" width="720" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="450.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">收口：常见问题与最佳实践</text>
  <text x="380" y="467" text-anchor="middle" font-size="7.5" fill="#B45309">分诊表（症状 → 第一步）＋ 高频十二问 ＋ 上线自查清单 ＋ 术语表</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
