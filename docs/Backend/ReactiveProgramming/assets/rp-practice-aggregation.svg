<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">实战：把一次聚合查询从串行改成并行</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">并行不是目的，把「总延迟由最慢的一段决定」写进契约才是</text>
  <rect x="20" y="74" width="350" height="140" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="195" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">改造前：串行阻塞</text>
  <text x="195" y="109" text-anchor="middle" font-size="7.5" fill="#334155">用户信息（60ms）</text>
  <text x="195" y="126.25" text-anchor="middle" font-size="7.5" fill="#334155">↓</text>
  <text x="195" y="143.5" text-anchor="middle" font-size="7.5" fill="#334155">订单列表（120ms）</text>
  <text x="195" y="160.75" text-anchor="middle" font-size="7.5" fill="#334155">↓</text>
  <text x="195" y="178" text-anchor="middle" font-size="7.5" fill="#334155">商品明细（80ms）</text>
  <text x="195" y="195.25" text-anchor="middle" font-size="7.5" fill="#334155">↓</text>
  <text x="195" y="212.5" text-anchor="middle" font-size="7.5" fill="#334155">合计 ≈ 260ms，且占一个线程</text>
  <rect x="390" y="74" width="350" height="140" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="565" y="92.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">改造后：并行组合</text>
  <text x="565" y="109" text-anchor="middle" font-size="7.5" fill="#6D28D9">Mono.zip(用户, 订单, 商品)</text>
  <text x="565" y="126.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">三个下游同时发起</text>
  <text x="565" y="143.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">合并成一个响应对象</text>
  <text x="565" y="160.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">timeout 150ms + onErrorResume</text>
  <text x="565" y="178" text-anchor="middle" font-size="7.5" fill="#6D28D9">合计 ≈ max(60,120,80) = 120ms</text>
  <line x1="370" y1="144" x2="390" y2="144" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="139" text-anchor="middle" font-size="7.5" fill="#64748B">同一份契约</text>
  <rect x="20" y="232" width="720" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="250.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">关键设计点：超时是预算而不是保护网</text>
  <text x="380" y="267" text-anchor="middle" font-size="7.5" fill="#B91C1C">总超时必须小于上游给你的 SLA；每个下游各自设超时，再在外层设总超时，两层都要有</text>
  <rect x="20" y="322" width="350" height="116" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="195" y="340.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">四个可复制的判据</text>
  <text x="195" y="357" text-anchor="middle" font-size="7.5" fill="#047857">① 三个下游的调用日志时间戳重叠（真的并行）</text>
  <text x="195" y="374.25" text-anchor="middle" font-size="7.5" fill="#047857">② 注入 500ms 延迟时能在 150ms 返回降级值</text>
  <text x="195" y="391.5" text-anchor="middle" font-size="7.5" fill="#047857">③ 单个下游失败不影响其余两路（partial 结果）</text>
  <text x="195" y="408.75" text-anchor="middle" font-size="7.5" fill="#047857">④ BlockHound 开启后测试仍全绿</text>
  <rect x="390" y="322" width="350" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="565" y="340.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">三个常见反例</text>
  <text x="565" y="357" text-anchor="middle" font-size="7.5" fill="#B45309">① 用 flatMap 逐条等待，看起来并行其实串行</text>
  <text x="565" y="374.25" text-anchor="middle" font-size="7.5" fill="#B45309">② 只在最外层设超时，内层请求已经占满连接池</text>
  <text x="565" y="391.5" text-anchor="middle" font-size="7.5" fill="#B45309">③ 降级返回 null，下游 NPE 比超时更隐蔽</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
