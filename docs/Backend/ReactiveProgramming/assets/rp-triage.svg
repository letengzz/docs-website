<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="474" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">排障分诊：六种症状的第一步</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">症状 → 第一动作 → 常见根因</text>
  <rect x="20" y="74" width="350" height="94" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="195" y="92.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">症状：接口偶发 500，堆栈指向 null</text>
  <text x="195" y="109" text-anchor="middle" font-size="7.5" fill="#B91C1C">第一步：确认是不是 Mono 没被订阅</text>
  <text x="195" y="126.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">或降级分支返回了空值</text>
  <rect x="390" y="74" width="350" height="94" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="565" y="92.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">症状：吞吐上不去、CPU 不高</text>
  <text x="565" y="109" text-anchor="middle" font-size="7.5" fill="#C2410C">第一步：BlockHound 或 jstack 找阻塞点</text>
  <text x="565" y="126.25" text-anchor="middle" font-size="7.5" fill="#C2410C">大概率是隐藏的同步调用</text>
  <rect x="20" y="184" width="350" height="94" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="195" y="202.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">症状：日志里 traceId 丢了</text>
  <text x="195" y="219" text-anchor="middle" font-size="7.5" fill="#B45309">第一步：确认是 Context 还是 MDC</text>
  <text x="195" y="236.25" text-anchor="middle" font-size="7.5" fill="#B45309">Context 不会自动进 MDC，需要显式桥接</text>
  <rect x="390" y="184" width="350" height="94" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="565" y="202.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">症状：内存缓慢上涨直到 OOM</text>
  <text x="565" y="219" text-anchor="middle" font-size="7.5" fill="#4338CA">第一步：查有无无界缓冲或未取消的订阅</text>
  <text x="565" y="236.25" text-anchor="middle" font-size="7.5" fill="#4338CA">长连接场景还要看 Flink 式堆积</text>
  <rect x="20" y="294" width="350" height="94" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="195" y="312.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">症状：改造后更慢</text>
  <text x="195" y="329" text-anchor="middle" font-size="7.5" fill="#6D28D9">第一步：数一遍链路里的线程切换</text>
  <text x="195" y="346.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">publishOn 过多会把收益吃光</text>
  <rect x="390" y="294" width="350" height="94" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="565" y="312.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">症状：超时时间到了却没超时</text>
  <text x="565" y="329" text-anchor="middle" font-size="7.5" fill="#0E7490">第一步：确认 timeout 在上游还是下游</text>
  <text x="565" y="346.25" text-anchor="middle" font-size="7.5" fill="#0E7490">订阅链外的等待不受 timeout 约束</text>
  <rect x="20" y="404" width="720" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="422.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">三条纪律：先取证后动手 / 一次只改一个变量 / 恢复后把判据补成测试</text>
  <text x="380" y="439" text-anchor="middle" font-size="7.5" fill="#047857">分诊表只负责把你带到「第一步」，根因仍然要靠证据</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
