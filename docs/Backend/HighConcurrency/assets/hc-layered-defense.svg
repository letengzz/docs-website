<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>四层防线与预算分配</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:14px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:12px;fill:#64748B}.num{font-size:13px;fill:#FFFFFF;font-weight:700}.box{stroke-width:1.5}</style>
<rect width="920" height="560" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">四层防线：从入口到底层，配额单调递减</text>
<text x="460" y="56" text-anchor="middle" class="tag">限流不是一件事，四件事——只做入口限流，故障会整齐地从内部某个共享资源上炸开</text>

<rect x="40" y="76" width="700" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<circle cx="72" cy="119" r="15" fill="#3B82F6"/>
<text x="72" y="124" text-anchor="middle" class="num">1</text>
<text x="104" y="106" class="lt">接入层 · CDN / 网关 / nginx</text>
<text x="104" y="128" class="s">拒谁：IP、用户、应用、路由维度 · 手段：limit_req / limit_conn / 网关路由限流</text>
<text x="104" y="148" class="s">这层失效：恶意流量与重试流量穿透到应用</text>

<rect x="80" y="172" width="660" height="86" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<circle cx="112" cy="215" r="15" fill="#8B5CF6"/>
<text x="112" y="220" text-anchor="middle" class="num">2</text>
<text x="144" y="202" class="lt">应用层 · 服务进程内</text>
<text x="144" y="224" class="s">拒谁：接口 + 业务标识（用户 / 商品）· 手段：信号量、并发限制、参数级限流</text>
<text x="144" y="244" class="s">这层失效：线程池被单一慢下游占满</text>

<rect x="120" y="268" width="620" height="86" rx="10" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<circle cx="152" cy="311" r="15" fill="#F59E0B"/>
<text x="152" y="316" text-anchor="middle" class="num">3</text>
<text x="184" y="298" class="lt">资源层 · 连接池 / 线程池 / 协程池</text>
<text x="184" y="320" class="s">拒谁：池容量本身 · 手段：池上限 + 获取超时（把等待变成快速失败）</text>
<text x="184" y="340" class="s">这层失效：池满后请求无限等待 → 「服务活着但什么都不返回」</text>

<rect x="160" y="364" width="580" height="86" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<circle cx="192" cy="407" r="15" fill="#F43F5E"/>
<text x="192" y="412" text-anchor="middle" class="num">4</text>
<text x="224" y="394" class="lt">依赖层 · 对下游的每次调用</text>
<text x="224" y="416" class="s">拒谁：下游已声明的配额 · 手段：熔断 + 隔离 + 超时 + 配额（四项缺一不可）</text>
<text x="224" y="436" class="s">这层失效：慢下游把上游拖死（雪崩）</text>

<rect x="762" y="76" width="118" height="374" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="821" y="106" text-anchor="middle" class="lt">配额方向</text>
<text x="821" y="132" text-anchor="middle" class="s">10000</text>
<text x="821" y="152" text-anchor="middle" class="tag">入口 QPS</text>
<text x="821" y="206" text-anchor="middle" class="s">1500</text>
<text x="821" y="226" text-anchor="middle" class="tag">每实例并发</text>
<text x="821" y="282" text-anchor="middle" class="s">30</text>
<text x="821" y="302" text-anchor="middle" class="tag">每实例连接</text>
<text x="821" y="360" text-anchor="middle" class="s">800</text>
<text x="821" y="380" text-anchor="middle" class="tag">下游 QPS</text>
<line x1="800" y1="160" x2="800" y2="350" stroke="#94A3B8" stroke-width="2"/>
<path d="M800 356 L794 344 L806 344 Z" fill="#94A3B8"/>
<text x="821" y="430" text-anchor="middle" class="tag">递减是必然</text>
<text x="821" y="446" text-anchor="middle" class="tag">越往下共享越多</text>

<rect x="40" y="466" width="840" height="72" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="60" y="492" class="lt">四层配额必须能一句话说清「拒谁」——写不出来就等于没有这一层</text>
<text x="60" y="514" class="s">① 「同一个 key 单位时间内超过 N 就拒」　② 「同一个业务标识同时在处理的超过 N 就拒或排队」</text>
<text x="60" y="532" class="s">③ 「池里没有空闲资源且等待超过 T 毫秒就拒」　④ 「下游连续失败比例超过 P 就暂时不再调用」</text>
</svg>
