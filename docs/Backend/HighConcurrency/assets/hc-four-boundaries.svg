<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>高并发的四条边界</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:14px;fill:#0F172A;font-weight:600}.s{font-size:12.5px;fill:#475569}.tag{font-size:12px;fill:#64748B}.box{stroke-width:1.5}</style>
<rect width="920" height="520" fill="#FFFFFF"/>
<text x="460" y="36" text-anchor="middle" class="h">四条边界：先把「不等」的地方分清</text>
<text x="460" y="58" text-anchor="middle" class="tag">这四条是所有手段的地基——边界错了，手段用对也没用</text>

<rect x="40" y="80" width="420" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="60" y="108" class="lt">边界一：并发 ≠ 吞吐</text>
<text x="60" y="132" class="s">QPS = 并发数 ÷ 平均响应时间</text>
<text x="60" y="154" class="s">200 并发 @ 20 ms → 10000 QPS</text>
<text x="60" y="174" class="s">200 并发 @ 500 ms → 400 QPS</text>
<text x="60" y="196" class="s">同一并发数，吞吐可以差 25 倍</text>

<rect x="480" y="80" width="400" height="130" rx="10" fill="#F5F3FF" stroke="#8B5CF6" class="box"/>
<text x="500" y="108" class="lt">边界二：单机容量 ≠ 集群容量</text>
<text x="500" y="132" class="s">加机器只在「瓶颈不随之移动」时有效</text>
<text x="500" y="154" class="s">瓶颈会下沉到共享资源：DB 连接、</text>
<text x="500" y="174" class="s">缓存单分片、下游配额、出口带宽</text>
<text x="500" y="196" class="s">「加机器没效果」= 瓶颈已下沉</text>

<rect x="40" y="228" width="420" height="142" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="60" y="256" class="lt">边界三：过载 ≠ 故障</text>
<text x="60" y="280" class="s">区别不在「有没有超容量」，而在</text>
<text x="60" y="300" class="s">「恢复路径是否存在」</text>
<text x="60" y="322" class="s">过载：部分请求被快速拒绝，流量回落即恢复</text>
<text x="60" y="342" class="s">故障：全局延迟飙升、连接堆积，需重启介入</text>
<text x="60" y="362" class="s">关键：慢比拒绝危险——慢会诱发重试风暴</text>

<rect x="480" y="228" width="400" height="142" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="500" y="256" class="lt">边界四：降级必须有序</text>
<text x="500" y="280" class="s">「先拒谁」必须在设计期写死</text>
<text x="500" y="302" class="s">① 超配额的非核心调用方</text>
<text x="500" y="322" class="s">② 非核心功能（推荐 / 埋点）</text>
<text x="500" y="342" class="s">③ 重复与非法请求</text>
<text x="500" y="362" class="s">④ 核心写入 → 排队而不是拒绝</text>

<rect x="40" y="388" width="840" height="100" rx="10" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<text x="460" y="414" text-anchor="middle" class="lt">一条贯穿的四步动作链</text>
<text x="460" y="440" text-anchor="middle" class="s">先算三组数字（容量 / 水位线 / 时间预算）→ 再配四层防线（配额单调递减）</text>
<text x="460" y="462" text-anchor="middle" class="s">→ 再定过载行为（快速失败 + 降级分级 + 恢复条件）→ 最后把判据变成可执行断言</text>
<text x="460" y="481" text-anchor="middle" class="tag">跳过任何一步，后面的参数都只能靠拍</text>
</svg>
