<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>请求的三种命运与队列形状</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}.lbl{font-size:11.5px;fill:#FFFFFF;font-weight:600}</style>
<rect width="920" height="540" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">同一批请求的三种命运：拒绝、排队、降级</text>
<text x="460" y="56" text-anchor="middle" class="tag">给每个接口选定一条主路径；三条路径同时存在时，没有一条能被验证</text>

<rect x="40" y="76" width="120" height="56" rx="8" fill="#334155"/>
<text x="100" y="110" text-anchor="middle" class="lbl">到达 50000 QPS</text>

<path d="M160 104 L200 104" stroke="#94A3B8" stroke-width="2"/>
<path d="M200 104 l-8 -5 l0 10 Z" fill="#94A3B8"/>

<rect x="204" y="76" width="150" height="56" rx="8" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="279" y="100" text-anchor="middle" class="lt">① 拒绝</text>
<text x="279" y="120" text-anchor="middle" class="tag">429 + Retry-After</text>

<rect x="366" y="76" width="150" height="56" rx="8" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<text x="441" y="100" text-anchor="middle" class="lt">② 排队</text>
<text x="441" y="120" text-anchor="middle" class="tag">延迟处理，必须有界</text>

<rect x="528" y="76" width="150" height="56" rx="8" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="603" y="100" text-anchor="middle" class="lt">③ 降级</text>
<text x="603" y="120" text-anchor="middle" class="tag">返回更低质量的结果</text>

<rect x="690" y="76" width="190" height="56" rx="8" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="785" y="100" text-anchor="middle" class="lt">三者混用 = 不可验证</text>
<text x="785" y="120" text-anchor="middle" class="tag">无法回答「为何走了这条路」</text>

<rect x="40" y="152" width="410" height="180" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="60" y="178" class="lt">有界队列：容量由算式反推</text>
<text x="60" y="202" class="s">队列容量 = 可接受最大等待 × 处理速率</text>
<text x="60" y="224" class="s">例：500 QPS、可等 1 秒 → 容量 500</text>
<text x="60" y="248" class="s">满时行为必须是「快速失败」</text>
<text x="60" y="270" class="s">因为「满」等价于「等待已超过承诺上限」</text>
<text x="60" y="296" class="s">无界队列的三种死法：</text>
<text x="60" y="316" class="s">① 内存耗尽　② 延迟失控　③ 陈旧结果（最危险）</text>

<rect x="470" y="152" width="410" height="180" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="490" y="178" class="lt">无界队列为什么最贵</text>
<text x="490" y="202" class="s">它不立刻炸，而是把一次突发</text>
<text x="490" y="222" class="s">变成一次持续一小时的事故</text>
<text x="490" y="248" class="s">正反馈链：</text>
<text x="490" y="270" class="s">队列变长 → 响应变慢 → 上游超时重试</text>
<text x="490" y="290" class="s">→ 更多请求涌入 → 队列更长（放大 2~4 倍）</text>
<text x="490" y="316" class="s">陈旧结果：CPU 打满但实际产出为零</text>

<rect x="40" y="350" width="840" height="86" rx="10" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<text x="460" y="376" text-anchor="middle" class="lt">队列深度是最好的水位线指标</text>
<text x="460" y="400" text-anchor="middle" class="s">等待时间 ≈ 队列长度 ÷ 处理速率（Little's law）——队列深度直接就是「还要等多久」的分子</text>
<text x="460" y="422" text-anchor="middle" class="s">告警建立在「深度 &gt; 80% 持续 N 秒」上，而不是「出现拒绝」上：前者有趋势，后者只有二元状态</text>

<rect x="40" y="452" width="840" height="72" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="60" y="478" class="lt">异步化必须提前算的三笔账</text>
<text x="60" y="500" class="s">账一：结果怎么返回（轮询 / 长轮询 / 回调 / 推送）　账二：失败怎么补偿（重试上限 + 死信 + 超时清扫）</text>
<text x="60" y="518" class="s">账三：顺序怎么保证（单消费者 / 按 key 分区 / 业务层重排）——分区数必须设计期定死</text>
</svg>
