<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>热点识别与拆分</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}.bar{fill:#E2E8F0}.hot{fill:#F43F5E}</style>
<rect width="920" height="540" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">热点：总量没超，但全部集中在同一个点上</text>
<text x="460" y="56" text-anchor="middle" class="tag">平均值会掩盖热点——7 个分片跑 20%、1 个跑 95% 时，平均值是 29%，看起来非常健康</text>

<text x="60" y="94" class="lt">分片负载（同一时刻取值）</text>
<rect x="60" y="108" width="360" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="80" y="132" class="tag">分片 1</text>
<rect x="150" y="120" width="60" height="14" rx="3" class="bar"/>
<text x="80" y="156" class="tag">分片 2</text>
<rect x="150" y="144" width="66" height="14" rx="3" class="bar"/>
<text x="80" y="180" class="tag">分片 3</text>
<rect x="150" y="168" width="54" height="14" rx="3" class="bar"/>
<text x="80" y="204" class="tag">分片 4</text>
<rect x="150" y="192" width="240" height="14" rx="3" class="hot"/>
<text x="80" y="228" class="tag">分片 5</text>
<rect x="150" y="216" width="58" height="14" rx="3" class="bar"/>
<text x="80" y="248" class="tag">分片 6</text>
<rect x="150" y="240" width="62" height="14" rx="3" class="bar"/>
<text x="404" y="132" text-anchor="end" class="tag">均值 29%</text>
<text x="404" y="204" text-anchor="end" class="tag">峰值 95%</text>

<rect x="440" y="108" width="440" height="150" rx="8" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="460" y="132" class="lt">判据：方差，不是均值</text>
<text x="460" y="156" class="s">最大分片 / 最小分片 &lt; 2 视为均匀；&gt; 3 说明存在分片热点</text>
<text x="460" y="176" class="s">&gt; 5 说明分片键选错了，不是流量问题</text>
<text x="460" y="200" class="s">分片键基数判据：≥ 10 × 分片数</text>
<text x="460" y="220" class="s">低基数键（status / 枚举）几乎全落到 1~2 片</text>
<text x="460" y="240" class="s">递增键（created_at）会把最新数据集中到一片</text>

<text x="60" y="292" class="lt">热点的四种形态</text>
<rect x="60" y="306" width="200" height="104" rx="8" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="160" y="330" text-anchor="middle" class="lt">读热点</text>
<text x="160" y="352" text-anchor="middle" class="s">单 key QPS 占比 &gt; 5%</text>
<text x="160" y="372" text-anchor="middle" class="s">先上本地缓存兜底</text>
<text x="160" y="392" text-anchor="middle" class="tag">maximumSize + 短 TTL</text>

<rect x="272" y="306" width="200" height="104" rx="8" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="372" y="330" text-anchor="middle" class="lt">写热点</text>
<text x="372" y="352" text-anchor="middle" class="s">所有人改同一行</text>
<text x="372" y="372" text-anchor="middle" class="s">行锁等待上升</text>
<text x="372" y="392" text-anchor="middle" class="tag">分桶 / 预扣 + 异步落库</text>

<rect x="484" y="306" width="200" height="104" rx="8" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<text x="584" y="330" text-anchor="middle" class="lt">分片热点</text>
<text x="584" y="352" text-anchor="middle" class="s">哈希不均</text>
<text x="584" y="372" text-anchor="middle" class="s">分片间方差大</text>
<text x="584" y="392" text-anchor="middle" class="tag">换分片键 / 加盐</text>

<rect x="696" y="306" width="184" height="104" rx="8" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="788" y="330" text-anchor="middle" class="lt">时间热点</text>
<text x="788" y="352" text-anchor="middle" class="s">周期性尖峰</text>
<text x="788" y="372" text-anchor="middle" class="s">定时任务同时启动</text>
<text x="788" y="392" text-anchor="middle" class="tag">按稳定标识哈希错峰</text>

<rect x="60" y="428" width="820" height="96" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<text x="80" y="454" class="lt">拆分要付的三笔账（代价小的排前面：本地缓存 → 加副本 → 分桶 → 异步合并 → 时间错峰）</text>
<text x="80" y="478" class="s">① 一致性：副本延迟、本地缓存过期、分桶聚合不准 → 必须明确不一致窗口的上界并被业务接受</text>
<text x="80" y="498" class="s">② 聚合读：分桶后要 SUM、多副本后要去重 → 维护近似值 + 定期校准，或把聚合放到离线</text>
<text x="80" y="518" class="s">③ 可观测性：一次逻辑操作变成 N 次物理调用 → 每个物理调用带同一个业务 ID；失效必须覆盖全部副本</text>
</svg>
