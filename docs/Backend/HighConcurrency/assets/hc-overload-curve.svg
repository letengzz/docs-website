<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<title>过载曲线三阶段与恢复</title>
<style>.h{font-size:20px;fill:#0F172A;font-weight:700}.lt{font-size:13.5px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.tag{font-size:11.5px;fill:#64748B}.box{stroke-width:1.5}.ax{stroke:#94A3B8;stroke-width:1.5;fill:none}</style>
<rect width="920" height="540" fill="#FFFFFF"/>
<text x="460" y="34" text-anchor="middle" class="h">过载曲线的三个阶段：健康系统的拐点在延迟，不在成功率</text>
<text x="460" y="56" text-anchor="middle" class="tag">若成功率在延迟明显上升之前就掉，说明有环节在提前失败——那个环节就是真正的瓶颈</text>

<rect x="60" y="78" width="800" height="230" rx="10" fill="#F8FAFC" stroke="#CBD5E1" class="box"/>
<line x1="100" y1="278" x2="840" y2="278" class="ax"/>
<line x1="100" y1="278" x2="100" y2="100" class="ax"/>
<text x="86" y="110" text-anchor="end" class="tag">延迟 / 错误率</text>
<text x="840" y="298" text-anchor="end" class="tag">负载（水位线）</text>

<rect x="100" y="100" width="220" height="178" fill="#ECFDF5" opacity="0.55"/>
<rect x="320" y="100" width="200" height="178" fill="#FFFBEB" opacity="0.55"/>
<rect x="520" y="100" width="320" height="178" fill="#FFF1F2" opacity="0.55"/>

<path d="M100 266 L320 240 L520 150 L840 106" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
<text x="700" y="122" class="tag" fill="#3B82F6">延迟</text>

<path d="M100 270 L520 270 L600 272 L700 210 L840 130" stroke="#F43F5E" stroke-width="2.5" fill="none"/>
<text x="720" y="176" class="tag" fill="#F43F5E">错误率</text>

<text x="200" y="94" text-anchor="middle" class="tag">① 线性区 0~60%</text>
<text x="420" y="94" text-anchor="middle" class="tag">② 拐点区 60%~90%</text>
<text x="680" y="94" text-anchor="middle" class="tag">③ 崩溃区 &gt; 90%</text>

<line x1="520" y1="100" x2="520" y2="278" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="510" y="294" text-anchor="end" class="tag">成功率开始下降的点</text>

<rect x="40" y="324" width="270" height="100" rx="10" fill="#ECFDF5" stroke="#10B981" class="box"/>
<text x="60" y="350" class="lt">① 线性区</text>
<text x="60" y="372" class="s">延迟近似恒定，成功率 100%</text>
<text x="60" y="392" class="s">排队时间可忽略</text>
<text x="60" y="412" class="s">该做的事：建立基线、确认容量</text>

<rect x="325" y="324" width="270" height="100" rx="10" fill="#FFFBEB" stroke="#F59E0B" class="box"/>
<text x="345" y="350" class="lt">② 拐点区</text>
<text x="345" y="372" class="s">延迟近似线性上升，成功率仍 100%</text>
<text x="345" y="392" class="s">排队开始主导延迟</text>
<text x="345" y="412" class="s">该做的事：容量类指标告警 + 降级 L1/L2</text>

<rect x="610" y="324" width="270" height="100" rx="10" fill="#FFF1F2" stroke="#F43F5E" class="box"/>
<text x="630" y="350" class="lt">③ 崩溃区</text>
<text x="630" y="372" class="s">延迟非线性飙升，成功率断崖下跌</text>
<text x="630" y="392" class="s">上下文切换 / GC / 锁竞争占满 CPU</text>
<text x="630" y="412" class="s">该做的事：L3 + 丢弃陈旧请求</text>

<rect x="40" y="438" width="840" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" class="box"/>
<text x="460" y="464" text-anchor="middle" class="lt">为什么第 ③ 阶段不可逆：两条正反馈</text>
<text x="460" y="488" text-anchor="middle" class="s">反馈一（设计问题，可在上游解决）：队列变长 → 响应变慢 → 上游超时重试 → 流量放大 2~4 倍 → 队列更长</text>
<text x="460" y="510" text-anchor="middle" class="s">反馈二（物理问题，只能在过载前拦住）：请求堆积 → 内存上升 → GC 更频繁 → 停顿更长 → 处理更少 → 堆积更多</text>
</svg>
