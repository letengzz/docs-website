<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="840" height="320" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">TCP 粘包与拆包</text>
  <!-- 问题 -->
  <g>
    <rect x="30" y="70" width="370" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="215" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">问题：TCP 是字节流</text>
    <text x="215" y="124" text-anchor="middle" font-size="11" fill="#4b5563">粘包：多条消息粘在一起（ABC → 一次读到 ABC）</text>
    <text x="215" y="146" text-anchor="middle" font-size="11" fill="#4b5563">拆包：一条消息被拆成多段（ABC → A、BC）</text>
    <text x="215" y="168" text-anchor="middle" font-size="10" fill="#6b7280">原因：TCP 面向字节流，无消息边界</text>
  </g>
  <!-- 解决 -->
  <g>
    <rect x="440" y="70" width="370" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="625" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">解决：定义消息边界</text>
    <text x="625" y="124" text-anchor="middle" font-size="11" fill="#4b5563">定长：每包固定长度</text>
    <text x="625" y="146" text-anchor="middle" font-size="11" fill="#4b5563">分隔符：\n / \r\n / 自定义</text>
    <text x="625" y="168" text-anchor="middle" font-size="10" fill="#6b7280">长度字段：LengthFieldBasedFrameDecoder（推荐）</text>
  </g>
  <!-- LengthField 协议 -->
  <g>
    <rect x="140" y="200" width="560" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="420" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">自定义协议：魔数 + 版本 + 长度 + 消息体</text>
    <g font-size="11" text-anchor="middle">
      <rect x="170" y="240" width="80" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
      <text x="210" y="261" fill="#4338ca">魔数 4B</text>
      <rect x="260" y="240" width="80" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
      <text x="300" y="261" fill="#b45309">版本 1B</text>
      <rect x="350" y="240" width="100" height="34" rx="6" fill="#fce7f3" stroke="#ec4899"/>
      <text x="400" y="261" fill="#be185d">长度 4B</text>
      <rect x="460" y="240" width="220" height="34" rx="6" fill="#ecfdf5" stroke="#10b981"/>
      <text x="570" y="261" fill="#047857">消息体 body</text>
    </g>
  </g>
  <text x="420" y="305" text-anchor="middle" font-size="12" fill="#475569">Netty 内置 LengthFieldBasedFrameDecoder，按长度字段自动拆包，业务无感</text>
</svg>
