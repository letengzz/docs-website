<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Java NIO：Selector 多路复用</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="76" width="170" height="74" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="102" fill="#1d4ed8" font-weight="bold" font-size="14">Channel 注册</text>
    <text x="125" y="122" fill="#4b5563" font-size="11">SocketChannel</text>
    <text x="125" y="139" fill="#4b5563" font-size="11">register(selector)</text>
    <rect x="240" y="76" width="170" height="74" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="325" y="102" fill="#047857" font-weight="bold" font-size="14">事件就绪</text>
    <text x="325" y="122" fill="#4b5563" font-size="11">OP_ACCEPT / READ</text>
    <text x="325" y="139" fill="#4b5563" font-size="11">OP_WRITE / CONNECT</text>
    <rect x="440" y="76" width="170" height="74" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="525" y="102" fill="#b45309" font-weight="bold" font-size="14">selector.select()</text>
    <text x="525" y="122" fill="#4b5563" font-size="11">阻塞等待事件</text>
    <text x="525" y="139" fill="#4b5563" font-size="11">返回就绪集合</text>
    <rect x="640" y="76" width="220" height="74" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="750" y="102" fill="#6d28d9" font-weight="bold" font-size="14">遍历 SelectionKey</text>
    <text x="750" y="122" fill="#4b5563" font-size="11">按 readyOps 分支处理</text>
    <text x="750" y="139" fill="#4b5563" font-size="11">处理完必须 remove</text>
    <rect x="60" y="210" width="370" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="245" y="236" fill="#4338ca" font-weight="bold" font-size="14">一次 select 背后的系统调用</text>
    <text x="245" y="256" fill="#4b5563" font-size="11">Linux：epoll_wait（Netty 用 epoll 原生传输）</text>
    <text x="245" y="273" fill="#4b5563" font-size="11">一次调用返回所有就绪的 fd，避免逐连接轮询</text>
    <text x="245" y="290" fill="#4b5563" font-size="11">复杂度 O(就绪数)，与连接总数无关</text>
    <text x="245" y="307" fill="#4b5563" font-size="11">这就是「C10K」问题的标准答案</text>
    <rect x="470" y="210" width="380" height="130" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="660" y="236" fill="#be123c" font-weight="bold" font-size="14">四个必须知道的坑</text>
    <text x="660" y="256" fill="#4b5563" font-size="11">selector.select() 返回 0 也要处理（否则空转烧 CPU）</text>
    <text x="660" y="273" fill="#4b5563" font-size="11">SelectionKey 处理完必须 remove，否则重复触发</text>
    <text x="660" y="290" fill="#4b5563" font-size="11">注册与修改 interestOps 要在同一线程做</text>
    <text x="660" y="307" fill="#4b5563" font-size="11">OP_WRITE 几乎总是就绪，不要一直监听</text>
    <path d="M 210 113 L 234 113" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 410 113 L 434 113" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 610 113 L 634 113" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <path d="M 750 150 C 750 190 500 180 400 204" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</g>
  <text x="450" y="418" text-anchor="middle" font-size="13" fill="#475569">NIO 的本质是「一个线程管很多连接」；代价是代码复杂度上升，所以生产上通常直接用 Netty</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
