<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">自定义二进制协议帧结构</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="90" width="110" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="95" y="116" fill="#be123c" font-weight="bold" font-size="14">魔数</text>
    <text x="95" y="136" fill="#4b5563" font-size="11">2 字节</text>
    <text x="95" y="153" fill="#4b5563" font-size="11">固定 0xCAFEBABE</text>
    <rect x="160" y="90" width="110" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="215" y="116" fill="#b45309" font-weight="bold" font-size="14">版本</text>
    <text x="215" y="136" fill="#4b5563" font-size="11">1 字节</text>
    <text x="215" y="153" fill="#4b5563" font-size="11">协议版本号</text>
    <rect x="280" y="90" width="130" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="345" y="116" fill="#1d4ed8" font-weight="bold" font-size="14">序列化类型</text>
    <text x="345" y="136" fill="#4b5563" font-size="11">1 字节</text>
    <text x="345" y="153" fill="#4b5563" font-size="11">JSON/Protobuf</text>
    <rect x="420" y="90" width="130" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="485" y="116" fill="#047857" font-weight="bold" font-size="14">指令类型</text>
    <text x="485" y="136" fill="#4b5563" font-size="11">1 字节</text>
    <text x="485" y="153" fill="#4b5563" font-size="11">请求/响应/心跳</text>
    <rect x="560" y="90" width="130" height="110" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="625" y="116" fill="#6d28d9" font-weight="bold" font-size="14">消息长度</text>
    <text x="625" y="136" fill="#4b5563" font-size="11">4 字节</text>
    <text x="625" y="153" fill="#4b5563" font-size="11">含头部还是不含</text>
    <rect x="700" y="90" width="160" height="110" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="780" y="116" fill="#0f766e" font-weight="bold" font-size="14">消息体</text>
    <text x="780" y="136" fill="#4b5563" font-size="11">N 字节</text>
    <text x="780" y="153" fill="#4b5563" font-size="11">业务负载</text>
    <rect x="80" y="250" width="350" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="255" y="276" fill="#4338ca" font-weight="bold" font-size="14">为什么必须定长度</text>
    <text x="255" y="296" fill="#4b5563" font-size="11">TCP 是字节流，没有消息边界</text>
    <text x="255" y="313" fill="#4b5563" font-size="11">不读长度就分不清「一个包还是半个包」</text>
    <text x="255" y="330" fill="#4b5563" font-size="11">Netty 用 LengthFieldBasedFrameDecoder 解决</text>
    <text x="255" y="347" fill="#4b5563" font-size="11">心跳包用 length=0 表示</text>
    <rect x="470" y="250" width="380" height="120" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="660" y="276" fill="#be123c" font-weight="bold" font-size="14">设计时的四个决定</text>
    <text x="660" y="296" fill="#4b5563" font-size="11">长度字段是否包含自身（必须写进协议文档）</text>
    <text x="660" y="313" fill="#4b5563" font-size="11">字节序统一为大端（网络字节序）</text>
    <text x="660" y="330" fill="#4b5563" font-size="11">最大长度上限，超过直接断连防攻击</text>
    <text x="660" y="347" fill="#4b5563" font-size="11">版本号放前面，方便灰度兼容</text>
</g>
  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#475569">协议文档最少要写清：每个字段的长度、字节序、取值范围，以及「长度字段算不算自己」</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
