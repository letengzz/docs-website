<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="七段资产链：从「想买」到「注销」">
<title>七段资产链：从「想买」到「注销」</title>
<rect x="0" y="0" width="920" height="430" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">七段资产链：从「想买」到「注销」</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">前两段在采购系统里，后五段在资产系统里；三段失败是安静的</text>
<rect x="24" y="92" width="208" height="98" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="38" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">① 申请与预算</text>
<text x="38" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">资本支出申请 + 预算占用</text>
<text x="38" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<text x="38" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：显性（超预算会拒）</text>
<line x1="232" y1="141" x2="256" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="256" y="92" width="208" height="98" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="270" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">② 采购与到货</text>
<text x="270" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">PO / 收货 / 安装调试</text>
<text x="270" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<text x="270" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（先挂 CIP，不转固）</text>
<line x1="464" y1="141" x2="488" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="488" y="92" width="208" height="98" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="502" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">③ 建卡与资本化</text>
<text x="502" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">资产卡片 + 成本归集 + 转</text>
<text x="502" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">固</text>
<text x="502" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（合并成一张卡）</text>
<line x1="696" y1="141" x2="720" y2="141" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="720" y="92" width="208" height="98" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="734" y="116" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">④ 折旧计提</text>
<text x="734" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">月度引擎：方法 / 寿命 / </text>
<text x="734" y="156" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">尾差</text>
<text x="734" y="178" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（每月都错一点）</text>
<rect x="140" y="214" width="208" height="98" rx="8" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="154" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑤ 变更</text>
<text x="154" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">转移 / 改良 / 减值 / </text>
<text x="154" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">拆分</text>
<text x="154" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（寿命改了没人重算）</text>
<line x1="348" y1="263" x2="372" y2="263" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="372" y="214" width="208" height="98" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="386" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑥ 处置</text>
<text x="386" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">出售 / 报废 / 清理费用</text>
<text x="386" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<text x="386" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：安静（累计折旧没清）</text>
<line x1="580" y1="263" x2="604" y2="263" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="604" y="214" width="208" height="98" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="618" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">⑦ 盘点与勾稽</text>
<text x="618" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">账实核对 + 账账勾稽</text>
<text x="618" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<text x="618" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">失败：最后一道</text>
<path d="M 128 190 L 128 214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)" fill="none"/>
<text x="28" y="350" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">四个必失接缝</text>
<rect x="24" y="364" width="424" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="383" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">CIP 转固时点：什么时候从「在建」变成「在用」</text>
<rect x="464" y="364" width="424" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="476" y="383" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">部分月规则：当月增加提不提、当月减少提不提</text>
<rect x="24" y="398" width="424" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="417" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">变更之后：寿命 / 残值 / 减值要不要重算历史</text>
<rect x="464" y="398" width="424" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="476" y="417" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">处置之后：累计折旧与减值准备有没有一起注销</text>
</svg>
