<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-label="三处勾稽：卡片 ⇄ 台账 ⇄ 总账">
<title>三处勾稽：卡片 ⇄ 台账 ⇄ 总账</title>
<rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">三处勾稽：卡片 ⇄ 台账 ⇄ 总账</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">月结前必须同时为 0，任何一处不为 0 都说明有一张卡没走完流程</text>
<rect x="24" y="96" width="120" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">① 卡片内</text>
<rect x="160" y="96" width="420" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="176" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400">原值 − 累计折旧 − 减值准备 = 账面净值</text>
<text x="176" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">期望：0 行 / 0.00</text>
<rect x="596" y="96" width="300" height="72" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="612" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">逐卡恒等式，任何时刻成立</text>
<text x="612" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<rect x="24" y="184" width="120" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">② 台账 ⇄ 总账</text>
<rect x="160" y="184" width="420" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="176" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400">Σ 卡片原值 = 固定资产科目余额</text>
<text x="176" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">期望：0 行 / 0.00</text>
<rect x="596" y="184" width="300" height="72" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="612" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">差 1 分都要查，通常是漏建卡或重复建卡</text>
<text x="612" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
<rect x="24" y="272" width="120" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="84" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">③ 台账 ⇄ 折旧</text>
<rect x="160" y="272" width="420" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="176" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400">Σ 本月折旧明细 = 累计折旧贷方发生额</text>
<text x="176" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">期望：0 行 / 0.00</text>
<rect x="596" y="272" width="300" height="72" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="612" y="302" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">差 83,180.19 的那次就是 47 张卡没过账</text>
<text x="612" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"></text>
</svg>
