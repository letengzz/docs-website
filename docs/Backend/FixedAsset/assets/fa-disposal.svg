<text x="38" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">100,000.00</text>
<rect x="24" y="176" width="180" height="72" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
