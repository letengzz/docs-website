<text x="702" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">+500.00</text>
<line x1="416" y1="160" x2="448" y2="128" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
