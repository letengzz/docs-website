<rect x="24" y="268" width="872" height="76" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="38" y="292" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">部分处置 30%：按比例分摊原值与累计折旧，不要「整卡注销 + 按 70% 重建」</text>
<text x="38" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">分摊原值 30,000.00 / 分摊累计 18,600.00 / 净值 11,400.00 / 售价 12,000.00 / 清理 450.00 / 损益 +150.00</text>
<text x="38" y="334" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="400">重建法的隐患：原值能对上，但资产号、使用部门、累计折旧的明细全断了，下一次盘点找不到卡</text>
</svg>
