<text x="466" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">40,000.00</text>
<rect x="452" y="176" width="200" height="72" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="466" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">清理费用</text>
<text x="466" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">1,500.00</text>
