<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="变更之后：未来适用还是追溯重述">
<title>变更之后：未来适用还是追溯重述</title>
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">变更之后：未来适用还是追溯重述</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">同一笔变更，两种口径在第 24 期之后会走出两条完全不同的折旧线</text>
<rect x="24" y="92" width="872" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="38" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">先问一句：这次变更改的是「估计」还是「政策 / 差错」？</text>
<line x1="200" y1="136" x2="200" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="660" y1="136" x2="660" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="24" y="168" width="420" height="200" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="38" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">会计估计变更 → 未来适用</text>
<text x="38" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 寿命、残值、减值后的可收回金额</text>
<text x="38" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 不调整以前期间，只改剩余期间的月折旧</text>
<text x="38" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 新月折旧 =（净值 − 残值）÷ 剩余期</text>
<text x="38" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 读数：60→84 期，月折旧 1,583.33 → 950.00</text>
<rect x="476" y="168" width="420" height="200" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="490" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">会计政策变更 / 前期差错 → 追溯</text>
<text x="490" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 折旧方法换了（直线 → 双倍）</text>
<text x="490" y="244" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 寿命一开始就写错（5 年写成 10 年）</text>
<text x="490" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 需要一次性补提或冲回差额</text>
<text x="490" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">· 读数：追溯到 84 期要冲回 10,857.12</text>
</svg>
