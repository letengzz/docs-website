<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">订单状态机：正向流转与逆向补偿</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">订单最怕的不是状态多，而是「谁都能改」——把合法流转写成显式的边</text>
  <rect x="30" y="78" width="130" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="95" y="96.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">待支付</text>
  <text x="95" y="113" text-anchor="middle" font-size="7.5" fill="#B45309">超时未付 → 已取消</text>
  <text x="95" y="130.25" text-anchor="middle" font-size="7.5" fill="#B45309">释放预占库存</text>
  <rect x="200" y="78" width="130" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="265" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">已支付</text>
  <text x="265" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">等待履约</text>
  <text x="265" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">通知仓储</text>
  <rect x="370" y="78" width="130" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="435" y="96.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">待发货</text>
  <text x="435" y="113" text-anchor="middle" font-size="7.5" fill="#1D4ED8">拣货 / 打包</text>
  <text x="435" y="130.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可拆单</text>
  <rect x="540" y="78" width="130" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="605" y="96.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">已发货</text>
  <text x="605" y="113" text-anchor="middle" font-size="7.5" fill="#0F766E">物流在途</text>
  <text x="605" y="130.25" text-anchor="middle" font-size="7.5" fill="#0F766E">可确认收货</text>
  <rect x="540" y="190" width="130" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="605" y="208.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">已完成</text>
  <text x="605" y="225" text-anchor="middle" font-size="7.5" fill="#047857">触发结算</text>
  <text x="605" y="242.25" text-anchor="middle" font-size="7.5" fill="#047857">开放评价</text>
  <line x1="160" y1="109" x2="200" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="330" y1="109" x2="370" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="500" y1="109" x2="540" y2="109" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="605" y1="140" x2="605" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="190" width="200" height="62" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="130" y="208.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">已取消</text>
  <text x="130" y="225" text-anchor="middle" font-size="7.5" fill="#334155">用户主动 / 超时 / 风控</text>
  <text x="130" y="242.25" text-anchor="middle" font-size="7.5" fill="#334155">库存回补 + 券退还</text>
  <rect x="250" y="190" width="250" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="375" y="208.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">退款中 / 已退款</text>
  <text x="375" y="225" text-anchor="middle" font-size="7.5" fill="#B91C1C">逆向流程</text>
  <text x="375" y="242.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">金额按行分摊退还</text>
  <line x1="95" y1="140" x2="95" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="435" y1="140" x2="435" y2="190" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="130" y1="285" x2="670" y2="285" stroke="#94A3B8" stroke-width="1.4"/>
  <rect x="30" y="302" width="340" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="200" y="320.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">三条硬约束</text>
  <text x="200" y="337" text-anchor="middle" font-size="7.5" fill="#6D28D9">状态只能按定义的边前进，禁止跳级</text>
  <text x="200" y="354.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">每次流转都要落审计：谁、何时、为什么</text>
  <text x="200" y="371.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">幂等：同一事件重复到达不得二次生效</text>
  <rect x="390" y="302" width="340" height="92" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="320.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">两种建模方式</text>
  <text x="560" y="337" text-anchor="middle" font-size="7.5" fill="#B45309">状态机表：简单直白，适合状态少的业务</text>
  <text x="560" y="354.25" text-anchor="middle" font-size="7.5" fill="#B45309">事件溯源：可回放可追溯，成本更高</text>
  <text x="560" y="371.5" text-anchor="middle" font-size="7.5" fill="#B45309">选前者起步，需要追溯时再补审计表</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
