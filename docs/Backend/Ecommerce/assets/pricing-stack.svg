<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="450" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">价格计算的六层顺序：顺序错了，结果就对不上</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">促销叠加的核心不是规则多，而是「谁先算、谁后算」必须全局唯一</text>
  <rect x="40" y="76" width="680" height="40" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">① 商品原价（取 SKU 售价，快照进订单行）</text>
  <line x1="380" y1="116" x2="380" y2="136" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="136" width="680" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="154.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">② 单品级促销（限时折扣 / 会员价 / 第二件半价）——按 SKU 计算</text>
  <line x1="380" y1="176" x2="380" y2="196" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="196" width="680" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="214.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">③ 订单级优惠（满减 / 店铺券 / 平台券）——按订单计算</text>
  <line x1="380" y1="236" x2="380" y2="256" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="256" width="680" height="40" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="274.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 运费与包邮规则（按重量 / 件数 / 地区 / 满额）</text>
  <line x1="380" y1="296" x2="380" y2="316" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="316" width="680" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="334.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">⑤ 应付金额 = ①→④ 逐层计算结果，并写入订单快照</text>
  <line x1="380" y1="356" x2="380" y2="376" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="376" width="680" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="394.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">⑥ 优惠分摊到订单行——退款时按行退，错在这一步就会「退多了」</text>
  <text x="380" y="411" text-anchor="middle" font-size="7.5" fill="#B91C1C">每行分摊 = 该行金额 / 参与优惠总额 × 优惠金额，末行用「总额减已分摊」兜住误差</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
