<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="428" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">交易核心链路与每一步的一致性要求</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一套系统里三种一致性要求并存，混为一谈会既拖慢读、又漏掉该守的写</text>
  <rect x="20" y="84" width="96" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="68" y="102.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">浏览商品</text>
  <text x="68" y="119" text-anchor="middle" font-size="7.5" fill="#047857">只读</text>
  <text x="68" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">缓存可容忍短</text>
  <rect x="125" y="84" width="96" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="173" y="102.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">加入购物车</text>
  <text x="173" y="119" text-anchor="middle" font-size="7.5" fill="#047857">只读+本地</text>
  <text x="173" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">价格只做「展</text>
  <rect x="230" y="84" width="96" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="278" y="102.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">提交订单</text>
  <text x="278" y="119" text-anchor="middle" font-size="7.5" fill="#B91C1C">强约束</text>
  <text x="278" y="136.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">校验价格 +</text>
  <rect x="335" y="84" width="96" height="78" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="383" y="102.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">支付回调</text>
  <text x="383" y="119" text-anchor="middle" font-size="7.5" fill="#C2410C">幂等</text>
  <text x="383" y="136.25" text-anchor="middle" font-size="7.5" fill="#C2410C">重复回调必须</text>
  <rect x="440" y="84" width="96" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="488" y="102.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">履约发货</text>
  <text x="488" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">状态流转</text>
  <text x="488" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">只能前进，不</text>
  <rect x="545" y="84" width="96" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="593" y="102.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">确认收货</text>
  <text x="593" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">状态流转</text>
  <text x="593" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">触发结算与评</text>
  <rect x="650" y="84" width="96" height="78" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="698" y="102.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">售后/退款</text>
  <text x="698" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">补偿</text>
  <text x="698" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">逆向流转 +</text>
  <line x1="20" y1="178" x2="740" y2="178" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="380" y="196" text-anchor="middle" font-size="8" fill="#64748B">写入端「越靠后越不可逆」：购物车出错可重来，订单与支付出错就要靠补偿</text>
  <rect x="40" y="216" width="330" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="205" y="234.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">三类一致性要分开对待</text>
  <text x="205" y="251" text-anchor="middle" font-size="7.5" fill="#334155">强一致：库存扣减、订单金额、支付结果</text>
  <text x="205" y="268.25" text-anchor="middle" font-size="7.5" fill="#334155">最终一致：积分、销量、搜索索引、报表</text>
  <text x="205" y="285.5" text-anchor="middle" font-size="7.5" fill="#334155">无需一致：推荐位、排行榜、库存展示数</text>
  <rect x="390" y="216" width="330" height="96" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="555" y="234.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">每一步都要写清失败怎么办</text>
  <text x="555" y="251" text-anchor="middle" font-size="7.5" fill="#334155">可重试：超时、网络抖动（须幂等）</text>
  <text x="555" y="268.25" text-anchor="middle" font-size="7.5" fill="#334155">可补偿：库存回补、优惠券退还</text>
  <text x="555" y="285.5" text-anchor="middle" font-size="7.5" fill="#334155">不可自动处理：金额不符 → 转人工对账</text>
  <text x="380" y="336" text-anchor="middle" font-size="8" fill="#64748B">把「失败怎么办」写在设计阶段，是电商系统与普通后台最本质的区别</text>
  <rect x="40" y="356" width="680" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="374.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">一条经验：凡是会改钱和改货的操作，都要能回答「重复执行一次会怎样」</text>
  <text x="380" y="391" text-anchor="middle" font-size="7.5" fill="#B91C1C">答不上来的，就是还没设计完</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
