<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="434" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">库存的预占 / 实扣 / 释放与四层防超卖</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「预占」是电商库存的关键抽象——它让下单与支付之间的等待期不占用真实库存</text>
  <rect x="40" y="76" width="680" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">下单：预占库存（可售减、占用加）——不直接扣减</text>
  <line x1="380" y1="120" x2="380" y2="142" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="180" y="142" width="400" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="160.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">支付成功：预占转为实扣（占用减、实扣加）</text>
  <line x1="180" y1="186" x2="120" y2="214" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="580" y1="186" x2="640" y2="214" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="214" width="300" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="190" y="232.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">超时未支付 / 取消</text>
  <text x="190" y="249" text-anchor="middle" font-size="7.5" fill="#B45309">预占释放，可售回加</text>
  <text x="190" y="266.25" text-anchor="middle" font-size="7.5" fill="#B45309">释放必须幂等、且要防重复释放</text>
  <text x="190" y="283.5" text-anchor="middle" font-size="7.5" fill="#B45309">对账任务兜住「漏释放」</text>
  <rect x="420" y="214" width="300" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="570" y="232.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">退款 / 售后回补</text>
  <text x="570" y="249" text-anchor="middle" font-size="7.5" fill="#047857">是否回补可售取决于货是否可再售</text>
  <text x="570" y="266.25" text-anchor="middle" font-size="7.5" fill="#047857">破损退回 → 进次品库，不回可售</text>
  <line x1="40" y1="306" x2="720" y2="306" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="380" y="326" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">防超卖的层层设防（从数据库向上兜）</text>
  <rect x="30" y="340" width="168" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="114" y="358.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">① 数据库层</text>
  <text x="114" y="375" text-anchor="middle" font-size="7.5" fill="#334155">条件更新：库存 &gt;= 数量</text>
  <text x="114" y="392.25" text-anchor="middle" font-size="7.5" fill="#334155">唯一约束兜住重复提交</text>
  <text x="114" y="409.5" text-anchor="middle" font-size="7.5" fill="#334155">扣减影响行数为 0 即失败</text>
  <rect x="208" y="340" width="168" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="292" y="358.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">② 缓存层</text>
  <text x="292" y="375" text-anchor="middle" font-size="7.5" fill="#334155">Redis 预扣（Lua 原子）</text>
  <text x="292" y="392.25" text-anchor="middle" font-size="7.5" fill="#334155">缓存扣减只做「准入」</text>
  <text x="292" y="409.5" text-anchor="middle" font-size="7.5" fill="#334155">最终以数据库为准回滚</text>
  <rect x="386" y="340" width="168" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="470" y="358.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">③ 队列层</text>
  <text x="470" y="375" text-anchor="middle" font-size="7.5" fill="#334155">异步下单削峰</text>
  <text x="470" y="392.25" text-anchor="middle" font-size="7.5" fill="#334155">请求入队即返回排队中</text>
  <text x="470" y="409.5" text-anchor="middle" font-size="7.5" fill="#334155">消费端串行处理同一 SKU</text>
  <rect x="564" y="340" width="166" height="78" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="647" y="358.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">④ 对账层</text>
  <text x="647" y="375" text-anchor="middle" font-size="7.5" fill="#334155">每日核对缓存与库的差</text>
  <text x="647" y="392.25" text-anchor="middle" font-size="7.5" fill="#334155">差异自动修正 + 告警</text>
  <text x="647" y="409.5" text-anchor="middle" font-size="7.5" fill="#334155">兜住所有漏网之鱼</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
