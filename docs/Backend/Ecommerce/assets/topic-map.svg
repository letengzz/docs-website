<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">电商系统设计专题：四组九页地图</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">业务建模 → 交易计算 → 底线保障 → 峰值治理，四组问题按「先想清楚再动手」排列</text>
  <rect x="40" y="78" width="680" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="54" y="119" font-size="10" fill="#5B21B6" font-weight="bold">① 先把业务建模对</text>
  <text x="157" y="110.5" font-size="8" fill="#6D28D9">Overview：核心链路与一致性要求总览</text>
  <text x="157" y="126.5" font-size="8" fill="#6D28D9">DomainModeling：SPU / SKU / 类目 / 属性 / 店铺</text>
  <rect x="40" y="164" width="680" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="54" y="205" font-size="10" fill="#1E3A8A" font-weight="bold">② 再把交易算清</text>
  <text x="147" y="196.5" font-size="8" fill="#1D4ED8">Cart：购物车、促销叠加与优惠分摊</text>
  <text x="147" y="212.5" font-size="8" fill="#1D4ED8">OrderStateMachine：订单状态机与流转约束</text>
  <rect x="40" y="250" width="680" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="54" y="291" font-size="10" fill="#065F46" font-weight="bold">③ 然后守住底线</text>
  <text x="147" y="282.5" font-size="8" fill="#047857">Inventory：库存模型、预占与超卖防护</text>
  <text x="147" y="298.5" font-size="8" fill="#047857">Payment：支付回调幂等、对账与差错处理</text>
  <rect x="40" y="336" width="680" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="54" y="377" font-size="10" fill="#92400E" font-weight="bold">④ 最后扛住峰值</text>
  <text x="147" y="368.5" font-size="8" fill="#B45309">FlashSale：秒杀的分层过滤与异步削峰</text>
  <text x="147" y="384.5" font-size="8" fill="#B45309">FAQ：电商系统的排错与常见误判</text>
  <line x1="25" y1="152" x2="25" y2="164" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="238" x2="25" y2="250" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="25" y1="324" x2="25" y2="336" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="434" text-anchor="middle" font-size="8" fill="#64748B">电商的难点从来不是 CRUD，而是「钱、货、单」三者在并发与失败下的最终一致</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
