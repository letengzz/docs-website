<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">商品领域模型：SPU、SKU 与两类属性</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">SPU/SKU 的分界一旦混淆，库存与价格就会记在错误的粒度上，后面全是补丁</text>
  <rect x="40" y="80" width="680" height="44" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">类目树（Category）——负责「能找到」，与属性模板绑定</text>
  <line x1="380" y1="124" x2="380" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="180" y="146" width="400" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="164.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">SPU：标准化产品单元（iPhone 17）</text>
  <line x1="380" y1="190" x2="380" y2="212" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="180" y="212" width="400" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="230.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">SKU：库存量单位（iPhone 17 256G 黑色）</text>
  <line x1="200" y1="256" x2="120" y2="288" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="560" y1="256" x2="640" y2="288" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="288" width="300" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="306.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">销售属性（决定 SKU）</text>
  <text x="190" y="323" text-anchor="middle" font-size="7.5" fill="#047857">颜色 / 容量 / 尺码：影响价格与库存</text>
  <text x="190" y="340.25" text-anchor="middle" font-size="7.5" fill="#047857">枚举值可组合，组合即一个 SKU</text>
  <text x="190" y="357.5" text-anchor="middle" font-size="7.5" fill="#047857">销售属性只有「选哪个」没有「填什么」</text>
  <rect x="420" y="288" width="300" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="570" y="306.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">规格参数（不决定 SKU）</text>
  <text x="570" y="323" text-anchor="middle" font-size="7.5" fill="#B45309">屏幕 / 重量 / 材质：只做展示与筛选</text>
  <text x="570" y="340.25" text-anchor="middle" font-size="7.5" fill="#B45309">同一 SPU 下所有 SKU 共享</text>
  <text x="570" y="357.5" text-anchor="middle" font-size="7.5" fill="#B45309">可自由增加，不影响交易链路</text>
  <text x="380" y="394" text-anchor="middle" font-size="8" fill="#64748B">判断口径：改了这个值会让「库存」和「价格」跟着变，它就是销售属性；否则是规格参数</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
