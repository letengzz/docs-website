<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="错误回执结构">
<rect x="0" y="0" width="920" height="400" fill="#f8fafc"/>
<text x="32" y="36" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">回执的两张表与三条原则</text>
<text x="32" y="58" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">批量导入的用户体验，全在这张回执上</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<rect x="32" y="96" width="250" height="176" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<text x="157.0" y="122" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">汇总回执</text>
<text x="157.0" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">文件：orders_1003.csv</text>
<text x="157.0" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">总行 10,000</text>
<text x="157.0" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">成功 9,987</text>
<text x="157.0" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">失败 13（0.13%）</text>
<text x="157.0" y="204" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">批次：B-20261025-07</text>
<rect x="306" y="96" width="250" height="176" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="431.0" y="122" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">错误行回执</text>
<text x="431.0" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">line_no,列,错误码,原值</text>
<text x="431.0" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">37,amount,E_TYPE,12元</text>
<text x="431.0" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">58,sku,E_REF,SKU-9</text>
<text x="431.0" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">58,amount,E_RANGE,-3</text>
<rect x="580" y="96" width="308" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="734.0" y="122" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1e293b">回执三原则</text>
<text x="734.0" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">① 行号指文件行，不是库 ID</text>
<text x="734.0" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">② 一行多错全部返回</text>
<text x="734.0" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">③ 回执本身可再次导入校验</text>
<text x="32" y="300" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#334155">「部分成功」必须显式：要么全成 / 全败，要么「成功的已入账、失败的给回执」，不能两种混着不说。</text>
<text x="32" y="324" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">失败率阈值不是拍脑袋：>5% 直接整批回滚，否则用户会拿到一个 9,000 行的半成品库。</text>
<rect x="32" y="344" width="856" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="48" y="368" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#92400e">回执里禁止出现「未知错误」：错误码必须能指向「改哪一列、改成什么」。</text>
</svg>
