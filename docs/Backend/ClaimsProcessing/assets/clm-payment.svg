<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="赔付与分摊">
<title>两张保单、一次事故：谁先赔决定谁多掏</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">两张保单、一次事故：谁先赔决定谁多掏</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">保额 60,000 与 40,000，损失 90,000；比例分摊与顺序赔付差 6,000</text>
<rect x="28" y="96" width="430" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="start">比例分摊（限额加权）</text>
<text x="42" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="400" text-anchor="start">A 保单  60,000 → 54,000</text>
<text x="42" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="400" text-anchor="start">B 保单  40,000 → 36,000</text>
<text x="42" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">合计 90,000，各按限额占比承担</text>
<text x="42" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="start">客户拿满，两家按能力分担</text>
<rect x="490" y="96" width="430" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="504" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="start">顺序赔付（先到先赔）</text>
<text x="504" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="400" text-anchor="start">A 保单  60,000 → 60,000</text>
<text x="504" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="400" text-anchor="start">B 保单  40,000 → 30,000</text>
<text x="504" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">合计 90,000，但 6,000 转嫁给 B</text>
<text x="504" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#be123c" font-weight="600" text-anchor="start">客户也拿满，公平性已改变</text>
<rect x="28" y="264" width="892" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="42" y="289" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="400" text-anchor="start">四方责任比例分摊：逐方取整 1,000 起里 328 起不闭合（最大差 0.01），最大余数法 0 起——闭合要靠算法，不靠运气。</text>
</svg>
