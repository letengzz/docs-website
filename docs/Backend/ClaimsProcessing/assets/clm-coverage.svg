<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="计算顺序四口径">
<title>同一笔损失，四种算法四个数</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">同一笔损失，四种算法四个数</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">损失 60,000 / 绝对免赔 1,000 / 责任比例 70% / 每次事故限额 50,000</text>
<rect x="90" y="135" width="86" height="115" rx="4" fill="#be123c" fill-opacity="0.85"/>
<text x="133" y="125" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">34,000</text>
<text x="133" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="middle">先限额→比例→免赔</text>
<text x="133" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="" text-anchor="middle">元</text>
<rect x="280" y="134" width="86" height="116" rx="4" fill="#ea580c" fill-opacity="0.85"/>
<text x="323" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">34,300</text>
<text x="323" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="middle">先限额→免赔→比例</text>
<text x="323" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="" text-anchor="middle">元</text>
<rect x="470" y="111" width="86" height="139" rx="4" fill="#0ea5e9" fill-opacity="0.85"/>
<text x="513" y="101" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">41,000</text>
<text x="513" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="middle">先比例→免赔→限额</text>
<text x="513" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="" text-anchor="middle">元</text>
<rect x="660" y="110" width="86" height="140" rx="4" fill="#15803d" fill-opacity="0.85"/>
<text x="703" y="100" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">41,300</text>
<text x="703" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="middle">先免赔→比例→限额</text>
<text x="703" y="286" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="" text-anchor="middle">元</text>
<line x1="60" y1="250" x2="880" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="620" y="84" width="310" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="632" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9a3412" font-weight="700" text-anchor="start">极差 7,300 元 = 最高口径的 17.7%</text>
<text x="632" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#9a3412" font-weight="400" text-anchor="start">四个数都能在条款里找到依据</text>
<text x="28" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">顺序不是实现细节：先扣免赔会让比例乘在更小的基数上，先套限额会让免赔只扣一次。定顺序，写进条款解释文件。</text>
</svg>
