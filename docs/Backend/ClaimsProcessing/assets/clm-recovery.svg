<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="追偿回收">
<title>追偿回收：冲赔款还是冲费用，赔付率差 1.6 点</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="320" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">追偿回收：冲赔款还是冲费用，赔付率差 1.6 点</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">已付赔款 200,000 / 追回 80,000 / 已赚保费 5,000,000</text>
<rect x="28" y="100" width="190" height="80" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="40" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">毛赔款</text>
<text x="40" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">200,000.00</text>
<line x1="218" y1="140" x2="250" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="252" y="92" width="210" height="96" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="264" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="600" text-anchor="start">追回</text>
<text x="264" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">80,000.00</text>
<text x="264" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">时效 / 责任方 / 分摊</text>
<line x1="462" y1="140" x2="494" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="496" y="84" width="210" height="66" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="508" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="600" text-anchor="start">冲减赔款（推荐）</text>
<text x="508" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">净赔款 120,000 → 赔付率 2.4%</text>
<rect x="496" y="168" width="210" height="66" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="508" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#4338ca" font-weight="600" text-anchor="start">冲减费用（另一种）</text>
<text x="508" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">赔款 200,000 → 赔付率 4.0%</text>
<rect x="736" y="84" width="196" height="150" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="748" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700" text-anchor="start">再保成数 30%</text>
<text x="748" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">应摊回 24,000.00</text>
<text x="748" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">漏摊则准备金多留</text>
<text x="748" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#be123c" font-weight="700" text-anchor="start">24,000.00</text>
<text x="748" y="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">回收不冲减，等于</text>
<text x="748" y="216" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">把利润记了两次</text>
<text x="28" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">追偿的账要回答三件事：冲哪个科目、按什么比例分给再保、追不回来时怎么核销。三件事都不报错，只是赔付率悄悄变脸。</text>
</svg>
