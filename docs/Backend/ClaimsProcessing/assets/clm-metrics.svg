<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="理赔度量">
<title>四个指标、四个分母</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="340" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">四个指标、四个分母</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">12,000 报案 / 11,040 立案 / 8,160 结案；同一个「结案率」可以是 68.0% 或 73.9%</text>
<rect x="28" y="92" width="250" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="start">漏斗三数</text>
<text x="42" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400" text-anchor="start">报案 12,000</text>
<text x="42" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400" text-anchor="start">立案 11,040（92.0%）</text>
<text x="42" y="194" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400" text-anchor="start">结案 8,160（68.0%）</text>
<text x="42" y="222" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">未决 2,880 起在准备金里</text>
<rect x="300" y="92" width="300" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="314" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="700" text-anchor="start">三个赔付率</text>
<text x="314" y="142" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">已付 / 已赚保费 = 54.88%</text>
<text x="314" y="166" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">+ 未决准备金 = 75.66%</text>
<text x="314" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">终极损失 / 已赚保费 = 待估</text>
<text x="314" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#9a3412" font-weight="600" text-anchor="start">报哪个都要写清分子分母</text>
<rect x="622" y="92" width="310" height="150" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="636" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700" text-anchor="start">时效看分位，不看均值</text>
<text x="636" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">报案→立案  P50 3.0h / P90 9.5h</text>
<text x="636" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">立案→结案  P50 37.5h / P90 130h</text>
<text x="636" y="184" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">均值 4.55h 是 P50 的 1.53 倍</text>
<text x="636" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0369a1" font-weight="600" text-anchor="start">均值被长尾拖走，承诺要按 P90 定</text>
<text x="28" y="288" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">同一批案子，换分母就换结论：结案率对报案 68.0%、对立案 73.9%；赔付率算不算准备金差 20.8 个点。口径先定，再谈达标。</text>
</svg>
