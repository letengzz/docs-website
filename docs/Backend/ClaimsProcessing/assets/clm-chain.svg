<text x="830" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="600" text-anchor="start">失败：安静</text>
<text x="830" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">产物见表</text>
<text x="28" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400" text-anchor="start">六段之中只有「报」会自己报错（少字段、缺单证）；「立」并错案、「定」多核减、「赔」重复付，都在账面上平得过去。</text>
