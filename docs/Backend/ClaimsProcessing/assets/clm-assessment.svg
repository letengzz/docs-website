<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="定损核减">
<title>明细核减与总额打折：差 8.66%</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">明细核减与总额打折：差 8.66%</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">1,000 起案件、申报 23,218,349.15 元，两种核法给出两个核定金额</text>
<rect x="28" y="96" width="210" height="96" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="40" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="600" text-anchor="start">申报总额</text>
<text x="40" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">23,218,349.15</text>
<text x="40" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">1,000 起 / 12.57% 被核减</text>
<line x1="238" y1="144" x2="268" y2="144" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="270" y="96" width="300" height="96" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="282" y="118" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="600" text-anchor="start">核减三因</text>
<text x="282" y="140" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">超目录价 1,701,419.41</text>
<text x="282" y="158" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">重复票据 908,846.01</text>
<text x="282" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155" font-weight="400" text-anchor="start">非本次事故 308,466.84</text>
<line x1="570" y1="144" x2="600" y2="144" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="602" y="96" width="160" height="96" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="614" y="120" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="600" text-anchor="start">逐项核定</text>
<text x="614" y="148" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">20,299,616.89</text>
<rect x="602" y="208" width="160" height="74" rx="8" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="614" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#be123c" font-weight="600" text-anchor="start">总额打 95 折</text>
<text x="614" y="258" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">22,057,431.69</text>
<line x1="682" y1="192" x2="682" y2="206" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="778" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#be123c" font-weight="700" text-anchor="start">多付 1,757,814.80 元 / 8.66%</text>
<text x="778" y="258" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">且逐案差异无法解释</text>
<text x="28" y="306" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">总额打折是「一刀切」：真错的案子没扣够，合规的案子被误扣，赔付率与客户体验同时受损，且没有一条核减理由可回溯。</text>
</svg>
