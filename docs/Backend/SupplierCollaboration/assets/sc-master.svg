<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="三方料号：一个锚与两个外部标识">
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三方料号：一个锚与两个外部标识</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">item_id 是锚；supplier_sku 与 mpn 都只是它外面的标签</text>
<rect x="70" y="100" width="220" height="80" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="180.0" y="136.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">item_id（我方料号）</text>
<text x="180.0" y="155.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">主键，唯一锚点</text>
<rect x="470" y="90" width="220" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="580.0" y="121.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">supplier_sku</text>
<text x="580.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">对方系统编码，会变</text>
<rect x="470" y="220" width="220" height="70" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="580.0" y="251.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">mpn + 品牌</text>
<text x="580.0" y="270.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">制造商编码，全球一致</text>
<rect x="470" y="340" width="220" height="48" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="580.0" y="360.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">GTIN / 条码</text>
<text x="580.0" y="379.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">实物锚点，带校验位</text>
<line x1="470" y1="125" x2="296" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="470" y1="255" x2="296" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="580" y1="340" x2="400" y2="190" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="70" y="220" width="220" height="150" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="180.0" y="291.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">item_supplier_map</text>
<text x="180.0" y="310.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">factor / moq / valid_from</text>
<text x="340" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">有效期是关键：旧行 valid_to 关掉，新行另开一行，历史 ASN 才不会改指向</text>
<text x="40" y="390" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">本机读数：1 箱 = 7 个、99.90 元/箱；先折箱后乘 vs 先折单价后乘，3,000 行里 1,315 行（43.8%）差 1-2 分</text>
</svg>
