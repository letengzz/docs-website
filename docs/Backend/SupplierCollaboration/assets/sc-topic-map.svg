<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="专题地图：六段协同链与九页">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">专题地图：六段协同链与九页</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">上一排是链上的六段，下一排是支撑它们的四组内容</text>
<rect x="30" y="86" width="138" height="62" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="99.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">① 协议定价</text>
<text x="99.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">三段阶梯 / 优先级</text>
<line x1="168" y1="117" x2="186" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="186" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="255.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">② 订单发布</text>
<text x="255.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">价格快照 / 变更</text>
<line x1="324" y1="117" x2="342" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="342" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="411.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">③ 发货通知</text>
<text x="411.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">ASN 幂等 / 收货</text>
<line x1="480" y1="117" x2="498" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="498" y="86" width="138" height="62" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="567.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">④ 寄售消耗</text>
<text x="567.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">货权 / 三本账</text>
<line x1="636" y1="117" x2="654" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="654" y="86" width="138" height="62" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="723.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 发票复核</text>
<text x="723.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">批量容差 / 四个出口</text>
<line x1="792" y1="117" x2="810" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="810" y="86" width="138" height="62" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="879.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 对账付款</text>
<text x="879.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">四类差异 / 日报</text>
<text x="30" y="172" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">六段里四段的失败是安静的（① ② ④ ⑤ ⑥），只有 ③ 会当场报错</text>
<rect x="30" y="200" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="76.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">总览</text>
<text x="76" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPO</text>
<rect x="130" y="200" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="176.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">门户</text>
<text x="176" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPP</text>
<rect x="230" y="200" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="276.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">协议</text>
<text x="276" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPG</text>
<rect x="330" y="200" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="376.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">主数据</text>
<text x="376" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPM</text>
<rect x="430" y="200" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="476.0" y="233.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">寄售</text>
<text x="476" y="242" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPV</text>
<rect x="30" y="274" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="76.0" y="307.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">复核</text>
<text x="76" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPB</text>
<rect x="130" y="274" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="176.0" y="307.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">对账</text>
<text x="176" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPT</text>
<rect x="230" y="274" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="276.0" y="307.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">实战</text>
<text x="276" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPX</text>
<rect x="330" y="274" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="376.0" y="307.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">分诊</text>
<text x="376" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">SPQ</text>
<text x="30" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">阅读顺序：总览 → 门户 → 协议 → 主数据 → 寄售 → 复核 → 对账 → 实战 → 分诊</text>
<text x="30" y="396" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">每一页都以「一份对方能复核的证据」收尾，而不是以「一段我方日志」收尾</text>
<text x="30" y="436" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">判据 9 族 × 8 条 = 72 条，逐页唯一编号，可由 utils/audit 机械核对</text>
</svg>
