<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="三种阶梯口径下的同一张订单">
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三种阶梯口径下的同一张订单</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">阶梯 1-499→10.00、500-1999→9.50、2000+→9.00；订单 3 行 × 700 = 2,100 件</text>
<rect x="40" y="90" width="270" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="175.0" y="121.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">按行套档</text>
<text x="175.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">700 → 9.50</text>
<text x="175" y="205" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="700">19,950.00</text>
<text x="175" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">+5.56%（对比按单）</text>
<rect x="340" y="90" width="270" height="70" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="475.0" y="121.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">按单套档</text>
<text x="475.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">2,100 → 9.00</text>
<text x="475" y="205" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="700">18,900.00</text>
<text x="475" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">基准（对比按单）</text>
<rect x="640" y="90" width="270" height="70" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="775.0" y="121.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="600">累进/滑动</text>
<text x="775.0" y="140.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">499×10 + 1,500×9.5 + 101×9</text>
<text x="775" y="205" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="700">20,149.00</text>
<text x="775" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">+6.61%（对比按单）</text>
<text x="40" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">三个数都「算得对」——差 6.61% 足够让一次月结谈判崩掉</text>
<text x="40" y="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">所以协议行必须有 tier_mode，且被订单引用后不许改</text>
<text x="40" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">区间写法只允许左闭右开：[from_qty, to_qty)，to_qty 为 NULL 表示无上限</text>
<text x="40" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">闭区间会让边界数量同时命中两档，取哪条取决于 ORDER BY —— 这就是两个系统两个价的来源</text>
</svg>
