<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="八类现象分诊到六段">
<rect x="0" y="0" width="940" height="420" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">八类现象分诊到六段</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">先按现象定位到段，再按段查第一个字段；不要一上来就查金额</text>
<rect x="30" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="100" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">① 协议定价</text>
<text x="100" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">金额与协议不一致</text>
<rect x="182" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="252" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">② 订单发布</text>
<text x="252" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">看不到订单</text>
<rect x="334" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="404" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">③ 发货通知</text>
<text x="404" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">无 ASN / 重复入库</text>
<rect x="486" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="556" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">④ 寄售消耗</text>
<text x="556" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">寄售对不上 / 成本忽高忽低</text>
<rect x="638" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="708" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">⑤ 发票复核</text>
<text x="708" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">发票一直挂起</text>
<rect x="790" y="86" width="140" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="860" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">⑥ 对账付款</text>
<text x="860" y="126" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">每月都来吵账</text>
<rect x="30" y="176" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">订单金额与协议不一致</text>
<text x="42" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">① 段 → 查 price_source</text>
<text x="442" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">①</text>
<rect x="480" y="176" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="492" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">供应商说看不到订单</text>
<text x="492" y="214" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">② 段 → 查 po.status</text>
<text x="892" y="204" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">②</text>
<rect x="30" y="232" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">收货无 ASN / 同一批入库两次</text>
<text x="42" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">③ 段 → 查 (supplier_id, asn_no)</text>
<text x="442" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">③</text>
<rect x="480" y="232" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="492" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">寄售库存对不上</text>
<text x="492" y="270" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">④ 段 → 三本账勾稽</text>
<text x="892" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">④</text>
<rect x="30" y="288" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">本月成本忽高忽低</text>
<text x="42" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">④ 段 → 查 period</text>
<text x="442" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">④</text>
<rect x="480" y="288" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="492" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">发票一直挂起</text>
<text x="492" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">⑤ 段 → 查 match_diff</text>
<text x="892" y="316" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">⑤</text>
<rect x="30" y="344" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="42" y="364" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">对方每月都来吵账</text>
<text x="42" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">⑥ 段 → 查对账单四口径</text>
<text x="442" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">⑥</text>
<rect x="480" y="344" width="440" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="492" y="364" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">重复付款</text>
<text x="492" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">⑤⑥ 段 → 查 invoice 唯一键</text>
<text x="892" y="372" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">⑤⑥</text>
<text x="30" y="404" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">止血顺序：先冻入口 → 取三快照 → 定位到段 → 只做可逆操作 → 写一条判据；顺序比技巧重要</text>
</svg>
