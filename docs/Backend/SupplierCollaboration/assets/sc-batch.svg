<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="批量复核：四个出口与回收路径">
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">批量复核：四个出口与回收路径</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">每张发票必须落到四个出口之一，每个出口都要有下游动作</text>
<rect x="40" y="150" width="180" height="96" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="130.0" y="194.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">一批发票</text>
<text x="130.0" y="213.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">5,000 张 / 月</text>
<line x1="220" y1="198" x2="300" y2="114" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="90" width="300" height="52" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="450.0" y="112.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">自动放行</text>
<text x="450.0" y="131.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">在容差内 → 生成应付</text>
<line x1="220" y1="198" x2="300" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="170" width="300" height="52" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="450.0" y="192.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">自动挂起</text>
<text x="450.0" y="211.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">差异可判型 → 通知对方</text>
<line x1="220" y1="198" x2="300" y2="274" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="250" width="300" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="450.0" y="272.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">转人工</text>
<text x="450.0" y="291.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">类型不明 → 复核队列</text>
<line x1="220" y1="198" x2="300" y2="354" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="330" width="300" height="52" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="450.0" y="352.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">拒绝</text>
<text x="450.0" y="371.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">重复/超额/冻结</text>
<text x="40" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">容差 2% → 自动放行 92.7%，真错放行 57 张（18.2%）</text>
<text x="40" y="326" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">容差 5% → 自动放行 98.2%，真错放行 173 张（58.2%）</text>
<text x="40" y="352" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">多放 5.5 个百分点，多漏 3.2 倍错单 —— 容差必须按供应商分层</text>
<rect x="650" y="90" width="260" height="120" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="780.0" y="146.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">回收三条路</text>
<text x="780.0" y="165.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">对账日报 / 供应商申诉 / 月度回溯抽样</text>
<text x="650" y="250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">挂起不是终点：超 5 个工作日</text>
<text x="650" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">无下游动作 → 日报红项</text>
</svg>
