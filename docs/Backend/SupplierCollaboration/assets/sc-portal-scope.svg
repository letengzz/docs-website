<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="门户可见范围：三层过滤与唯一的注入点">
<rect x="0" y="0" width="940" height="420" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">门户可见范围：三层过滤与唯一的注入点</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">任何一层没做，后面都白做；最容易漏的是第 2 层的那句 WHERE</text>
<rect x="40" y="84" width="250" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="165.0" y="110.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">① 身份层</text>
<text x="165.0" y="129.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">会话 → supplier_id</text>
<text x="310" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">失败时：登录成功但看不到数据</text>
<line x1="165" y1="144" x2="165" y2="162" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="162" width="250" height="60" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="165.0" y="188.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">② 范围层</text>
<text x="165.0" y="207.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">supplier_ids（可多家）</text>
<text x="310" y="188" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">失败时：能看到别家的订单（最危险）</text>
<line x1="165" y1="222" x2="165" y2="240" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="240" width="250" height="60" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="165.0" y="266.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">③ 对象层</text>
<text x="165.0" y="285.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">status 白名单</text>
<text x="310" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">失败时：看到草稿与已取消单据</text>
<rect x="40" y="330" width="520" height="54" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="300.0" y="353.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">仓储层唯一入口：find(ctx, filter)</text>
<text x="300.0" y="372.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">签名里不允许出现 supplier_id 参数</text>
<text x="40" y="410" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">本机读数：200 家供应商 / 20,000 张订单，漏写条件一次返回 20,000 行，越权可见 99.50%</text>
<rect x="610" y="84" width="300" height="132" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="760.0" y="146.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">正确写法</text>
<text x="760.0" y="165.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">download → 复用列表的 WHERE 前缀</text>
<rect x="610" y="236" width="300" height="132" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="760.0" y="298.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">错误写法</text>
<text x="760.0" y="317.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">?supplier_id=7 从请求体取</text>
<text x="610" y="400" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">详情接口与导出接口最容易绕过范围</text>
</svg>
