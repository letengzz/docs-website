<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="实战：六步流水与三个必须失败的用例">
<rect x="0" y="0" width="940" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">实战：六步流水与三个必须失败的用例</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">SQLite 3 + Python 3，无需服务、无需联网，全程 < 1 秒</text>
<rect x="30" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="99.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">1 建库</text>
<text x="99.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">7 表 + 3 触发器</text>
<line x1="168" y1="117" x2="182" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="182" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="251.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">2 解析协议价</text>
<text x="251.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">2,100 → 9.00</text>
<line x1="320" y1="117" x2="334" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="334" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="403.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">3 下单快照</text>
<text x="403.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">19,900 落库</text>
<line x1="472" y1="117" x2="486" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="486" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="555.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">4 ASN 幂等</text>
<text x="555.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">跑 3 次仍是 1 行</text>
<line x1="624" y1="117" x2="638" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="638" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="707.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">5 寄售消耗</text>
<text x="707.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">period 对齐</text>
<line x1="776" y1="117" x2="790" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="790" y="86" width="138" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="859.0" y="113.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">6 匹配+对账</text>
<text x="859.0" y="132.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">300 元放行</text>
<text x="30" y="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">三个必须失败的反向用例（grep -c Error 必须等于 3）</text>
<rect x="30" y="200" width="220" height="44" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="140.0" y="227.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">N1 改历史价格</text>
<text x="268" y="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">预期 ABORT</text>
<text x="268" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">po_line.price is frozen</text>
<rect x="30" y="256" width="220" height="44" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="140.0" y="283.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">N2 重复发票</text>
<text x="268" y="276" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">预期 UNIQUE 冲突</text>
<text x="268" y="294" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">supplier_id, invoice_no</text>
<rect x="30" y="312" width="220" height="44" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="140.0" y="339.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">N3 冻结期改数</text>
<text x="268" y="332" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">预期 ABORT</text>
<text x="268" y="350" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">period 2026-09 is closed</text>
<rect x="560" y="200" width="340" height="150" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/>
<text x="730.0" y="271.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">验收口径</text>
<text x="730.0" y="290.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="middle">换机器重跑输出逐字一致；六处金额相等</text>
<text x="30" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">只要有一条反向用例没报错，对应判据就没落地：历史会被改写 / 会重复付款 / 对账单会被静默篡改</text>
</svg>
