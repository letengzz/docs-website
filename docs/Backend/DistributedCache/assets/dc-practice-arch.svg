<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.t{font-size:14px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:13px;fill:#334155;font-weight:600}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.violet{fill:#F5F3FF;stroke:#8B5CF6}.slate{fill:#F1F5F9;stroke:#94A3B8}.line{stroke:#94A3B8;fill:none;stroke-width:2}.tag{font-size:12px;fill:#64748B}</style>
<rect width="940" height="620" fill="#FFFFFF"/>
<text x="470" y="34" text-anchor="middle" class="h">实战架构：博客平台的两级缓存与失效链路</text>
<text x="470" y="56" text-anchor="middle" class="tag">读多写少、内容可枚举、失效点集中——这三条决定了本项目「L1 + L2」是划算的</text>

<rect x="40" y="84" width="180" height="56" rx="8" class="box blue"/>
<text x="130" y="118" text-anchor="middle" class="t">读者 / 作者</text>
<rect x="255" y="84" width="180" height="56" rx="8" class="box slate"/>
<text x="345" y="118" text-anchor="middle" class="t">Nginx</text>
<rect x="470" y="84" width="200" height="56" rx="8" class="box blue"/>
<text x="570" y="118" text-anchor="middle" class="t">blog-api（多实例）</text>
<rect x="705" y="84" width="200" height="56" rx="8" class="box blue"/>
<text x="805" y="118" text-anchor="middle" class="t">blog-web（SSR，多实例）</text>
<path class="line" d="M220 112 H255"/><path class="line" d="M435 112 H470"/><path class="line" d="M670 112 H705"/>

<rect x="40" y="176" width="275" height="120" rx="10" class="box green"/>
<text x="177" y="204" text-anchor="middle" class="lt">L1 · 进程内 Caffeine</text>
<text x="177" y="230" text-anchor="middle" class="s">只放「近乎不可变」的内容：</text>
<text x="177" y="250" text-anchor="middle" class="s">渲染后的 HTML 片段、分类树、站点配置</text>
<text x="177" y="274" text-anchor="middle" class="tag">容量上限 + 写后 30s 过期（双保险）</text>

<rect x="345" y="176" width="275" height="120" rx="10" class="box amber"/>
<text x="482" y="204" text-anchor="middle" class="lt">L2 · Redis 8.10</text>
<text x="482" y="230" text-anchor="middle" class="s">文章详情 / 列表页 / 标签聚合 / 计数</text>
<text x="482" y="250" text-anchor="middle" class="s">key 统一前缀 + 版本号后缀</text>
<text x="482" y="274" text-anchor="middle" class="tag">逻辑过期，避免同一 key 并发重建</text>

<rect x="650" y="176" width="255" height="120" rx="10" class="box rose"/>
<text x="777" y="204" text-anchor="middle" class="lt">L3 · MySQL 8.4</text>
<text x="777" y="230" text-anchor="middle" class="s">唯一事实来源</text>
<text x="777" y="250" text-anchor="middle" class="s">变更以 binlog 为事件源</text>
<text x="777" y="274" text-anchor="middle" class="tag">不做「写库顺带删缓存」</text>

<path class="line" d="M177 296 V330"/>
<path class="line" d="M482 296 V330"/>
<path class="line" d="M777 296 V330"/>

<rect x="40" y="330" width="865" height="128" rx="10" class="box violet"/>
<text x="470" y="358" text-anchor="middle" class="lt">失效链路：一次发布如何影响三层缓存</text>
<text x="470" y="384" text-anchor="middle" class="s">① 文章状态变更 → 写库并提交 → ② 变更日志（CDC）产出事件 → ③ 失效消费者删 L2 并广播 invalidate →</text>
<text x="470" y="406" text-anchor="middle" class="s">④ 各实例收到广播后删本地 L1 → ⑤ 广播丢失时，由 L1 的 30 秒写后过期自行收敛。</text>
<text x="470" y="432" text-anchor="middle" class="tag">关键点：不在写事务里删缓存——事务提交与缓存删除之间没有原子性，靠「事件 + 兜底 TTL」才成立。</text>

<rect x="40" y="476" width="420" height="126" rx="10" class="box green"/>
<text x="250" y="504" text-anchor="middle" class="lt">热点预案（承接第 119 天压测）</text>
<text x="250" y="530" text-anchor="middle" class="s">首页与热文详情是天然热点</text>
<text x="250" y="552" text-anchor="middle" class="s">处置：L1 兜住 + 列表页整页缓存</text>
<text x="250" y="574" text-anchor="middle" class="s">压测并发仍需 Bypass for network</text>
<text x="250" y="594" text-anchor="middle" class="tag">否则压的是缓存不是服务端</text>

<rect x="485" y="476" width="420" height="126" rx="10" class="box amber"/>
<text x="695" y="504" text-anchor="middle" class="lt">观测面板（承接第 113 天接入）</text>
<text x="695" y="530" text-anchor="middle" class="s">应用侧命中率（L1+L2）与回源 QPS</text>
<text x="695" y="552" text-anchor="middle" class="s">Redis P99、淘汰速率、内存碎片率</text>
<text x="695" y="574" text-anchor="middle" class="s">失效事件消费延迟与失败数</text>
<text x="695" y="594" text-anchor="middle" class="tag">三块必须同屏，便于成组判读</text>
</svg>
