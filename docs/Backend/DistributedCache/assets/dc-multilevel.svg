<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="PingFang SC, Microsoft YaHei, sans-serif">
<style>.t{font-size:15px;fill:#0F172A;font-weight:600}.s{font-size:12px;fill:#475569}.h{font-size:18px;fill:#0F172A;font-weight:700}.lt{font-size:13px;fill:#334155;font-weight:600}.box{fill:#F8FAFC;stroke:#CBD5E1}.blue{fill:#EFF6FF;stroke:#3B82F6}.amber{fill:#FFFBEB;stroke:#F59E0B}.green{fill:#ECFDF5;stroke:#10B981}.rose{fill:#FFF1F2;stroke:#F43F5E}.violet{fill:#F5F3FF;stroke:#8B5CF6}.line{stroke:#94A3B8;fill:none;stroke-width:2}.bad{stroke:#F43F5E;fill:none;stroke-width:2}.good{stroke:#10B981;fill:none;stroke-width:2}.tag{font-size:12px;fill:#64748B}</style>
<rect width="940" height="640" fill="#FFFFFF"/>
<text x="470" y="34" text-anchor="middle" class="h">三级缓存与「本地那一层怎么失效」</text>
<text x="470" y="56" text-anchor="middle" class="tag">越靠近应用越快，也越难统一失效——多级缓存的全部难点都在 L1</text>

<rect x="350" y="80" width="240" height="52" rx="8" class="box blue"/>
<text x="470" y="112" text-anchor="middle" class="t">请求</text>

<rect x="60" y="164" width="230" height="86" rx="8" class="box green"/>
<text x="175" y="194" text-anchor="middle" class="lt">L1 · 进程内（Caffeine）</text>
<text x="175" y="216" text-anchor="middle" class="s">纳秒级 · 容量 MB 级</text>
<text x="175" y="236" text-anchor="middle" class="s">每个实例各有一份</text>

<rect x="355" y="164" width="230" height="86" rx="8" class="box amber"/>
<text x="470" y="194" text-anchor="middle" class="lt">L2 · 远程（Redis）</text>
<text x="470" y="216" text-anchor="middle" class="s">亚毫秒级 · 容量 GB 级</text>
<text x="470" y="236" text-anchor="middle" class="s">所有实例共享一份</text>

<rect x="650" y="164" width="230" height="86" rx="8" class="box rose"/>
<text x="765" y="194" text-anchor="middle" class="lt">L3 · 数据库</text>
<text x="765" y="216" text-anchor="middle" class="s">毫秒级 · 容量 TB 级</text>
<text x="765" y="236" text-anchor="middle" class="s">唯一事实来源</text>

<path class="line" d="M470 132 V164"/>
<path class="line" d="M290 207 H355"/>
<path class="line" d="M585 207 H650"/>
<text x="322" y="200" text-anchor="middle" class="tag">miss</text>
<text x="617" y="200" text-anchor="middle" class="tag">miss</text>

<path class="good" d="M175 250 V286"/>
<text x="185" y="282" class="tag">hit → 直接返回</text>
<path class="good" d="M470 250 V286"/>
<text x="480" y="282" class="tag">hit → 回填 L1</text>

<rect x="60" y="300" width="820" height="150" rx="10" class="box violet"/>
<text x="470" y="330" text-anchor="middle" class="lt">写路径：数据库更新后，L2 好删，L1 难删</text>

<rect x="85" y="348" width="230" height="84" rx="8" class="box green"/>
<text x="200" y="374" text-anchor="middle" class="t">① 广播失效</text>
<text x="200" y="396" text-anchor="middle" class="s">MQ / Redis Pub-Sub 通知</text>
<text x="200" y="416" text-anchor="middle" class="s">各实例各删各的 L1</text>

<rect x="355" y="348" width="230" height="84" rx="8" class="box amber"/>
<text x="470" y="374" text-anchor="middle" class="t">② 短 TTL + 版本号</text>
<text x="470" y="396" text-anchor="middle" class="s">L1 只活几秒</text>
<text x="470" y="416" text-anchor="middle" class="s">值里带版本，旧版丢弃</text>

<rect x="625" y="348" width="230" height="84" rx="8" class="box rose"/>
<text x="740" y="374" text-anchor="middle" class="t">③ 不缓存可变数据</text>
<text x="740" y="396" text-anchor="middle" class="s">L1 只放「按天/按版本」</text>
<text x="740" y="416" text-anchor="middle" class="s">天然不可变的内容</text>

<text x="470" y="478" text-anchor="middle" class="s">三条路线可叠加：不变量走 ③，可变热点走 ①+②。</text>
<text x="470" y="498" text-anchor="middle" class="s">「广播丢了一条消息」是这条链路唯一无法自愈的失败——必须有 TTL 兜底。</text>

<rect x="60" y="522" width="820" height="94" rx="10" class="box rose"/>
<text x="470" y="550" text-anchor="middle" class="lt">最常见的两个「不报错但错」</text>
<text x="470" y="574" text-anchor="middle" class="s">① 只删了 L2 没删 L1：更新成功、日志干净，部分用户长期看到旧数据</text>
<text x="470" y="596" text-anchor="middle" class="s">② L1 用无界 Map：命中率很高，直到某天 OOM —— 容量上限必须显式设置</text>
</svg>
