# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: Deploy VitePress site to Pages

on:
  # 在针对 `main` 分支的推送上运行。如果你
  # 使用 `master` 分支作为默认分支，请将其更改为 `master`
  push:
    branches: [main]

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    # 3,200+ 页的构建在 4 核 runner 上约 20~40 分钟；给足上限但不要拖到 6 小时默认值
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要
      - uses: pnpm/action-setup@v5
        with:
          version: 9
          # - uses: oven-sh/setup-bun@v1 # 如果使用 Bun，请取消注释
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm # 或 pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Add swap space
        run: |
          sudo fallocate -l 16G /swapfile-ci || sudo dd if=/dev/zero of=/swapfile-ci bs=1M count=16384
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - name: Report Node heap budget
        # OOM 日志里 `Mark-Compact <used> (<capacity>)` 的 capacity 就是**当时生效的**
        # 老生代上限。这一步把 package.json 里声明的值和实际生效值一起打出来，
        # 这样下次再 OOM，第一眼就能判断「是上限不够」还是「上限根本没生效」。
        run: |
          HEAP=$(grep -o 'max-old-space-size=[0-9]*' package.json | head -1 | cut -d= -f2)
          echo "package.json 声明 max-old-space-size = ${HEAP} MB"
          NODE_OPTIONS="--max-old-space-size=${HEAP}" node -e \
            "console.log('生效 heap_size_limit =', Math.round(require('v8').getHeapStatistics().heap_size_limit/1048576), 'MB')"
          free -h
      - name: Install dependencies
        run:  pnpm install # 或 npm ci / yarn install / bun install
      - name: Build with VitePress
        # 内存上限与 --minify false 都写在 package.json 的 docs:build 里，这里不要再传参数
        # （pnpm run <script> -- <flag> 会把字面量 `--` 一起传下去，VitePress 会把 flag 当成构建根目录，
        #  产物落到 ./--minify/.vitepress/dist，导致后续上传 .vitepress/dist 报 “No such file or directory”）
        run: pnpm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
