<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="544" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">门禁清单的单一来源：把「三处手抄」收敛成一份数据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一件事写在三个地方，就一定会出现三个版本；而漂移的表现恰是最难查的那一种</text>
  <text x="60" y="78" text-anchor="start" font-size="10.5" fill="#991B1B" font-weight="bold">问题：同一份门禁清单，三处各抄一份</text>
  <rect x="30" y="88" width="220" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="106.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">CI 工作流 run: 步骤</text>
  <text x="140" y="123" text-anchor="middle" font-size="7.5" fill="#1D4ED8">第 79 天起串成五阶段</text>
  <text x="140" y="140.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">改代码不必改它，于是落后</text>
  <line x1="140" y1="162" x2="140" y2="182" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="88" width="220" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="106.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">文档「本地运行」9 步</text>
  <text x="380" y="123" text-anchor="middle" font-size="7.5" fill="#B45309">给人看，写得详尽</text>
  <text x="380" y="140.25" text-anchor="middle" font-size="7.5" fill="#B45309">但不参与任何执行</text>
  <line x1="380" y1="162" x2="380" y2="182" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="88" width="220" height="74" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="620" y="106.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">各工具的 selftest.py</text>
  <text x="620" y="123" text-anchor="middle" font-size="7.5" fill="#0F766E">只覆盖自己那一块</text>
  <text x="620" y="140.25" text-anchor="middle" font-size="7.5" fill="#0F766E">跨工具的顺序无人负责</text>
  <line x1="620" y1="162" x2="620" y2="182" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="140" y1="182" x2="620" y2="182" stroke="#DC2626" stroke-width="1.4"/>
  <line x1="380" y1="182" x2="380" y2="190" stroke="#DC2626" stroke-width="1.4"/>
  <rect x="30" y="190" width="700" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="60" y="219" text-anchor="start" font-size="9.5" fill="#991B1B">代价：本地绿、CI 红 —— 作者本地少跑了一道门禁，直到推上去才知道（最贵的一类失败：它不报错，只是晚一步）</text>
  <line x1="30" y1="258" x2="730" y2="258" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="282" text-anchor="start" font-size="10.5" fill="#065F46" font-weight="bold">做法：清单收敛成一份数据，本地 / CI / 审计 / 文档都读它</text>
  <rect x="250" y="292" width="260" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="310.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">scripts/gates.json</text>
  <text x="380" y="327" text-anchor="middle" font-size="7.5" fill="#047857">12 道门禁：id / 命令 / 前置 / 超时 / 权重</text>
  <line x1="380" y1="342" x2="380" y2="360" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="280" y="360" width="200" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="378.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">scripts/run-gates.py</text>
  <text x="380" y="395" text-anchor="middle" font-size="7.5" fill="#6D28D9">声明与执行分离</text>
  <line x1="380" y1="406" x2="380" y2="418" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="380" y1="418" x2="114" y2="434" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="5 4"/>
  <rect x="30" y="434" width="168" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="114" y="452.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">本地：一条命令</text>
  <text x="114" y="469" text-anchor="middle" font-size="7" fill="#1D4ED8">失败不早退，一次报全</text>
  <text x="114" y="485.1" text-anchor="middle" font-size="7" fill="#1D4ED8">每道门禁带超时</text>
  <line x1="380" y1="418" x2="292" y2="434" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="208" y="434" width="168" height="72" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="292" y="452.2" text-anchor="middle" font-size="9" fill="#155E75" font-weight="bold">CI：--shard 1/3</text>
  <text x="292" y="469" text-anchor="middle" font-size="7" fill="#0E7490">按 weight 贪心装箱</text>
  <text x="292" y="485.1" text-anchor="middle" font-size="7" fill="#0E7490">各片耗时接近</text>
  <line x1="380" y1="418" x2="470" y2="434" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="386" y="434" width="168" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="470" y="452.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">审计：--json 报告</text>
  <text x="470" y="469" text-anchor="middle" font-size="7" fill="#6D28D9">digest 记命令集合</text>
  <text x="470" y="485.1" text-anchor="middle" font-size="7" fill="#6D28D9">回答「当时跑了什么」</text>
  <line x1="380" y1="418" x2="648" y2="434" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="5 4"/>
  <rect x="564" y="434" width="168" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="648" y="452.2" text-anchor="middle" font-size="9" fill="#92400E" font-weight="bold">文档：--check</text>
  <text x="648" y="469" text-anchor="middle" font-size="7" fill="#B45309">doc=true 必须写进</text>
  <text x="648" y="485.1" text-anchor="middle" font-size="7" fill="#B45309">「本地运行」并注明期望</text>
  <text x="380" y="528" text-anchor="middle" font-size="9" fill="#475569">清单是数据、不是代码：改了清单不必改代码，所以只有报告里的 digest 能回答「当时跑的是哪几条命令」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
