<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="600" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">模板 CLI：分层结构与数据流</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">「问什么」和「写什么」被一份与框架无关的选择模型隔开，这是可测试与可替换的前提</text>
  <rect x="30" y="76" width="169" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="114.5" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">命令行参数</text>
  <text x="114.5" y="111" text-anchor="middle" font-size="7.5" fill="#334155">非交互 / 脚本 / CI</text>
  <rect x="207" y="76" width="169" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="291.5" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">交互菜单</text>
  <text x="291.5" y="111" text-anchor="middle" font-size="7.5" fill="#334155">人守着终端时用</text>
  <rect x="384" y="76" width="169" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="468.5" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">预设组合</text>
  <text x="468.5" y="111" text-anchor="middle" font-size="7.5" fill="#334155">少做决策，不是限制</text>
  <rect x="561" y="76" width="169" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="645.5" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">配置文件</text>
  <text x="645.5" y="111" text-anchor="middle" font-size="7.5" fill="#334155">团队默认值</text>
  <line x1="380" y1="126" x2="380" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="146" width="700" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="164.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">① 交互层 · Picocli</text>
  <text x="380" y="181" text-anchor="middle" font-size="8" fill="#6D28D9">@Command / @Option / @Parameters —— 只负责问，不负责写</text>
  <text x="380" y="199.4" text-anchor="middle" font-size="8" fill="#6D28D9">参数校验、帮助与自动补全、退出码约定都在这一层收口</text>
  <text x="380" y="217.8" text-anchor="middle" font-size="8" fill="#6D28D9">换掉 CLI 框架不影响下面任何一层</text>
  <line x1="380" y1="230" x2="380" y2="250" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="250" width="700" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="380" y="268.2" text-anchor="middle" font-size="10.5" fill="#3730A3" font-weight="bold">② 选择模型 · 一份与框架无关的描述（ProjectDescription 等价物）</text>
  <text x="380" y="285" text-anchor="middle" font-size="8" fill="#4338CA">坐标：groupId / artifactId / 项目名 / 根包名</text>
  <text x="380" y="303.4" text-anchor="middle" font-size="8" fill="#4338CA">构建：Maven profile 组合（v1 只支持 Maven，理由见正文）</text>
  <text x="380" y="321.8" text-anchor="middle" font-size="8" fill="#4338CA">基线：Java 21 或 25；Spring Boot 4.1.x</text>
  <text x="380" y="340.2" text-anchor="middle" font-size="8" fill="#4338CA">技术栈：security × orm × cache —— 复用 stack-select 的三维取值</text>
  <text x="380" y="358.6" text-anchor="middle" font-size="8" fill="#4338CA">依赖集：由技术栈推导，不手写在模板里</text>
  <line x1="380" y1="370" x2="380" y2="390" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="390" width="169" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="114.5" y="408.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">③ 模板渲染</text>
  <text x="114.5" y="425" text-anchor="middle" font-size="7.5" fill="#047857">目录叠加 + 占位符替换</text>
  <text x="114.5" y="442.25" text-anchor="middle" font-size="7.5" fill="#047857">只渲染被选中的文件</text>
  <rect x="207" y="390" width="169" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="291.5" y="408.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">③ 条件包含</text>
  <text x="291.5" y="425" text-anchor="middle" font-size="7.5" fill="#047857">按技术栈决定文件存不存在</text>
  <text x="291.5" y="442.25" text-anchor="middle" font-size="7.5" fill="#047857">难点在这里，不在插值</text>
  <rect x="384" y="390" width="169" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="468.5" y="408.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">③ 版本目录</text>
  <text x="468.5" y="425" text-anchor="middle" font-size="7.5" fill="#047857">版本集中一处，随 CLI 发布</text>
  <text x="468.5" y="442.25" text-anchor="middle" font-size="7.5" fill="#047857">模板内不写版本号</text>
  <rect x="561" y="390" width="169" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="645.5" y="408.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">③ 文件树写入</text>
  <text x="645.5" y="425" text-anchor="middle" font-size="7.5" fill="#047857">先规划再落盘</text>
  <text x="645.5" y="442.25" text-anchor="middle" font-size="7.5" fill="#047857">冲突与覆盖策略显式</text>
  <line x1="380" y1="468" x2="380" y2="488" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="488" width="226" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="506.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">④ 新项目目录树</text>
  <text x="143" y="523" text-anchor="middle" font-size="7.5" fill="#1D4ED8">可直接 mvn verify</text>
  <text x="143" y="540.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">无残留占位符</text>
  <rect x="267" y="488" width="226" height="70" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="380" y="506.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ --dry-run 预览</text>
  <text x="380" y="523" text-anchor="middle" font-size="7.5" fill="#0F766E">文件树 + 关键配置摘要</text>
  <text x="380" y="540.25" text-anchor="middle" font-size="7.5" fill="#0F766E">确认后才落盘</text>
  <rect x="504" y="488" width="226" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="617" y="506.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">④ stack.json</text>
  <text x="617" y="523" text-anchor="middle" font-size="7.5" fill="#B45309">记录选中的三维取值</text>
  <text x="617" y="540.25" text-anchor="middle" font-size="7.5" fill="#B45309">后续切换/校验的依据</text>
  <text x="380" y="580" text-anchor="middle" font-size="9.5" fill="#3730A3">分层的意义：交互层与生成内核都不知道对方的存在，两边可以各自替换</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
