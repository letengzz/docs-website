<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">主库可插拔：与 ORM 可插拔正交的第二个可插拔维度</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">编译期选 ORM（第 76 天）、部署期选引擎（本日），Flyway 脚本双方言 + 一致性门禁</text>
  <rect x="40" y="74" width="200" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="140" y="92.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">编译期：ORM 可插拔（四选一）</text>
  <text x="140" y="109" text-anchor="middle" font-size="7.2" fill="#6D28D9">MyBatis-Plus / MyBatis-Flex /</text>
  <text x="140" y="125.56" text-anchor="middle" font-size="7.2" fill="#6D28D9">JPA / JDBC —— 已于第 76 天落地</text>
  <text x="140" y="142.12" text-anchor="middle" font-size="7.2" fill="#6D28D9">stack-select.py 生成期决定</text>
  <rect x="40" y="174" width="200" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="140" y="192.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">部署期：主库可插拔（二选一）</text>
  <text x="140" y="209" text-anchor="middle" font-size="7.2" fill="#0F766E">MySQL 8.4 / PostgreSQL 17</text>
  <text x="140" y="225.56" text-anchor="middle" font-size="7.2" fill="#0F766E">compose profile + Spring 配置切换</text>
  <text x="140" y="242.12" text-anchor="middle" font-size="7.2" fill="#0F766E">本次（第 81 天）落地</text>
  <line x1="140" y1="148" x2="140" y2="174" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="120" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">两层正交：ORM 怎么访问数据库，与数据库是什么引擎，互不绑定</text>
  <rect x="300" y="160" width="100" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="350" y="178.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">同一套业务代码</text>
  <text x="350" y="195" text-anchor="middle" font-size="7" fill="#334155">spi 契约 + Mapper</text>
  <text x="350" y="211.1" text-anchor="middle" font-size="7" fill="#334155">不含任何方言 SQL</text>
  <line x1="400" y1="206" x2="412" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="412" y="160" width="100" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="462" y="178.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">Flyway 迁移脚本</text>
  <text x="462" y="195" text-anchor="middle" font-size="7" fill="#1D4ED8">db/mysql/*.sql</text>
  <text x="462" y="211.1" text-anchor="middle" font-size="7" fill="#1D4ED8">db/postgres/*.sql</text>
  <text x="462" y="227.2" text-anchor="middle" font-size="7" fill="#1D4ED8">版本号两侧成对</text>
  <line x1="512" y1="206" x2="524" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="524" y="160" width="100" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="574" y="178.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">结构一致性门禁</text>
  <text x="574" y="195" text-anchor="middle" font-size="7" fill="#B91C1C">parity_check.py</text>
  <text x="574" y="211.1" text-anchor="middle" font-size="7" fill="#B91C1C">类型归一化比对</text>
  <text x="574" y="227.2" text-anchor="middle" font-size="7" fill="#B91C1C">不一致即退出码 1</text>
  <line x1="624" y1="206" x2="636" y2="206" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="636" y="160" width="100" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="686" y="178.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">选定的数据库</text>
  <text x="686" y="195" text-anchor="middle" font-size="7" fill="#047857">MySQL 8.4</text>
  <text x="686" y="211.1" text-anchor="middle" font-size="7" fill="#047857">或 PostgreSQL 17</text>
  <text x="686" y="227.2" text-anchor="middle" font-size="7" fill="#047857">compose profile 启动</text>
  <line x1="240" y1="240" x2="300" y2="240" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="286" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">验收：parity_check OK + compose 双 profile 各起一遍 + 冒烟脚本通过，两条路径等效才算可插拔</text>
  <text x="40" y="316" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三条设计决策</text>
<rect x="30" y="328" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="120" y="343" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">为什么不是运行时热切换</text>
<rect x="218" y="328" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="474" y="343" text-anchor="middle" font-size="8.5" fill="#334155">切换引擎是发布事件（迁移+验证+回滚预案），不是配置热更；模板给的是「可选」，不是「随换」</text>
<rect x="30" y="354" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="120" y="369" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">为什么雪花 ID 是前提</text>
<rect x="218" y="354" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="474" y="369" text-anchor="middle" font-size="8.5" fill="#334155">主键不用自增，双方言 DDL 就没有 IDENTITY/自增差异，这是本方案能对齐的第一块基石</text>
<rect x="30" y="380" width="180" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="120" y="395" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">驱动怎么带</text>
<rect x="218" y="380" width="512" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>  <text x="474" y="395" text-anchor="middle" font-size="8.5" fill="#334155">两个 JDBC 驱动都进 bootJar（约 2.5MB），配置决定连谁；要裁剪再按 Maven profile 拆</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
