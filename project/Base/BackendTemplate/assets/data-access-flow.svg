<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="368" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">MyBatis-Plus 数据访问分层与拦截器链</text>

  <!-- ① 分层链路 -->
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#1E3A8A" font-weight="bold">① 请求链路：泛型封装让 80% 的 CRUD 不用写 SQL</text>

  <g font-size="11">
    <rect x="32" y="74" width="106" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="85" y="96" text-anchor="middle" fill="#1E3A8A" font-weight="bold">Controller</text>
    <text x="85" y="113" text-anchor="middle" font-size="9" fill="#64748B">接收请求</text>

    <rect x="150" y="74" width="106" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="203" y="96" text-anchor="middle" fill="#1E3A8A" font-weight="bold">Service 接口</text>
    <text x="203" y="113" text-anchor="middle" font-size="9" fill="#64748B">extends IService</text>

    <rect x="268" y="74" width="106" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="321" y="96" text-anchor="middle" fill="#1E3A8A" font-weight="bold">ServiceImpl</text>
    <text x="321" y="113" text-anchor="middle" font-size="9" fill="#64748B">extends ServiceImpl</text>

    <rect x="386" y="74" width="106" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="439" y="96" text-anchor="middle" fill="#1E3A8A" font-weight="bold">BaseMapper</text>
    <text x="439" y="113" text-anchor="middle" font-size="9" fill="#64748B">泛型 CRUD</text>

    <rect x="504" y="74" width="106" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
    <text x="557" y="96" text-anchor="middle" fill="#9A3412" font-weight="bold">MP 拦截器链</text>
    <text x="557" y="113" text-anchor="middle" font-size="9" fill="#9A3412">改写 SQL</text>

    <rect x="622" y="74" width="106" height="52" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
    <text x="675" y="96" text-anchor="middle" fill="#166534" font-weight="bold">MySQL 8.4</text>
    <text x="675" y="113" text-anchor="middle" font-size="9" fill="#166534">执行 SQL</text>
  </g>

  <g stroke="#2563EB" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <line x1="138" y1="100" x2="148" y2="100"/>
    <line x1="256" y1="100" x2="266" y2="100"/>
    <line x1="374" y1="100" x2="384" y2="100"/>
    <line x1="492" y1="100" x2="502" y2="100"/>
    <line x1="610" y1="100" x2="620" y2="100"/>
  </g>

  <!-- ② 自动填充 -->
  <rect x="32" y="152" width="340" height="190" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="202" y="176" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">② MetaObjectHandler 自动填充</text>

  <rect x="52" y="192" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="66" y="212" font-size="11" fill="#92400E" font-weight="bold">INSERT 时</text>
  <text x="66" y="232" font-size="11" fill="#475569">createTime · createBy · deleted=0</text>

  <rect x="52" y="256" width="300" height="54" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <text x="66" y="276" font-size="11" fill="#92400E" font-weight="bold">UPDATE 时</text>
  <text x="66" y="296" font-size="11" fill="#475569">updateTime · updateBy（不覆盖创建信息）</text>

  <text x="202" y="330" text-anchor="middle" font-size="9.5" fill="#A16207">实现 MetaObjectHandler，用 strictInsertFill / strictUpdateFill</text>

  <!-- ③ 拦截器清单 -->
  <rect x="388" y="152" width="340" height="190" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="558" y="176" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">③ 内置拦截器（按注册顺序）</text>

  <g font-size="10.5">
    <rect x="406" y="190" width="304" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="418" y="209" fill="#1E293B">① PaginationInnerInterceptor（分页 + 方言）</text>

    <rect x="406" y="226" width="304" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="418" y="245" fill="#1E293B">② OptimisticLockerInnerInterceptor（乐观锁）</text>

    <rect x="406" y="262" width="304" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="418" y="281" fill="#1E293B">③ BlockAttackInnerInterceptor（拦截全表更新）</text>

    <rect x="406" y="298" width="304" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1"/>
    <text x="418" y="317" fill="#1E293B">④ 逻辑删除：全局 logic-delete-field</text>
  </g>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
