<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">上线验收清单的三层结构：AUTO / MANUAL / 签名表</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">清单的失效方式不是「漏了一项」，而是「判据没被写下来，所以也没法被检验」</text>
  <text x="380" y="74" text-anchor="middle" font-size="9.5" fill="#475569">六类 × 3 项 = 18 项，每一项都必须能回答「谁判定 · 判据是什么」</text>
  <rect x="30.0" y="88" width="108" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="84" y="106.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">功能</text>
  <text x="84" y="123" text-anchor="middle" font-size="6.6" fill="#1D4ED8">A1 主链路</text>
  <text x="84" y="138.18" text-anchor="middle" font-size="6.6" fill="#1D4ED8">A2 边界矩阵</text>
  <text x="84" y="153.36" text-anchor="middle" font-size="6.6" fill="#1D4ED8">A3 已知缺陷</text>
  <rect x="148.4" y="88" width="108" height="82" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="202.4" y="106.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">性能</text>
  <text x="202.4" y="123" text-anchor="middle" font-size="6.6" fill="#B45309">B1 p95 达标</text>
  <text x="202.4" y="138.18" text-anchor="middle" font-size="6.6" fill="#B45309">B2 容量拐点</text>
  <text x="202.4" y="153.36" text-anchor="middle" font-size="6.6" fill="#B45309">B3 慢查询</text>
  <rect x="266.8" y="88" width="108" height="82" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="320.8" y="106.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">安全</text>
  <text x="320.8" y="123" text-anchor="middle" font-size="6.6" fill="#B91C1C">C1 权限最小</text>
  <text x="320.8" y="138.18" text-anchor="middle" font-size="6.6" fill="#B91C1C">C2 密钥不落明文</text>
  <text x="320.8" y="153.36" text-anchor="middle" font-size="6.6" fill="#B91C1C">C3 漏洞扫描</text>
  <rect x="385.20000000000005" y="88" width="108" height="82" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="439.2" y="106.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">数据</text>
  <text x="439.2" y="123" text-anchor="middle" font-size="6.6" fill="#0F766E">D1 备份可恢复</text>
  <text x="439.2" y="138.18" text-anchor="middle" font-size="6.6" fill="#0F766E">D2 迁移可回退</text>
  <text x="439.2" y="153.36" text-anchor="middle" font-size="6.6" fill="#0F766E">D3 隔离脱敏</text>
  <rect x="503.6" y="88" width="108" height="82" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="557.6" y="106.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">可观测</text>
  <text x="557.6" y="123" text-anchor="middle" font-size="6.6" fill="#0E7490">E1 指标看板</text>
  <text x="557.6" y="138.18" text-anchor="middle" font-size="6.6" fill="#0E7490">E2 日志可检索</text>
  <text x="557.6" y="153.36" text-anchor="middle" font-size="6.6" fill="#0E7490">E3 告警触达人</text>
  <rect x="622.0" y="88" width="108" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="676" y="106.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">运维</text>
  <text x="676" y="123" text-anchor="middle" font-size="6.6" fill="#047857">F1 部署可重放</text>
  <text x="676" y="138.18" text-anchor="middle" font-size="6.6" fill="#047857">F2 回滚演练</text>
  <text x="676" y="153.36" text-anchor="middle" font-size="6.6" fill="#047857">F3 值班交接</text>
  <text x="60" y="186" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三层结构：把「判定方式」写在清单里，而不是写「已验」</text>
  <rect x="30" y="198" width="700" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="216.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">第 1 层 · AUTO 12 项 —— 脚本判定，CI 里全跑</text>
  <text x="380" y="233" text-anchor="middle" font-size="8" fill="#1D4ED8">判据只有三类：文件内容（grep）、脚本退出码、JSON 字段（用例矩阵 / 签名表）</text>
  <text x="380" y="251.4" text-anchor="middle" font-size="8" fill="#1D4ED8">代表项：A2 用例矩阵、C1 权限注解、D1 备份演练、D2 双方言结构、F1 部署自测、F2 回滚不可变性</text>
  <line x1="380" y1="272" x2="380" y2="286" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="286" width="700" height="74" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="304.2" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="bold">第 2 层 · MANUAL 6 项 —— 真实验收环境才能做，工具不假装它们通过</text>
  <text x="380" y="321" text-anchor="middle" font-size="8" fill="#B45309">压测 p95 · 慢查询定位 · 依赖漏洞扫描 · 跨租户越权 · 告警触达真人 · 主链路端到端</text>
  <text x="380" y="339.4" text-anchor="middle" font-size="8" fill="#B45309">工具只做两件事：列出可直接粘贴的命令，以及写出「期望看到什么」——判据先于执行发生</text>
  <line x1="380" y1="360" x2="380" y2="374" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="374" width="700" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="392.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">第 3 层 · 签名表 —— --strict 的唯一转绿条件</text>
  <text x="380" y="409" text-anchor="middle" font-size="8" fill="#047857">每项登记「谁（by）· 何时（at，ISO 日期）· 结论 · 证据（evidence，≥ 8 字符且可点开复核）」</text>
  <text x="380" y="427.4" text-anchor="middle" font-size="8" fill="#047857">写「已验」「OK」判不合格；给 AUTO 项签名会被点名 —— 人去签 AUTO 项等于绕开脚本判据</text>
  <text x="380" y="452" text-anchor="middle" font-size="9.5" fill="#B91C1C">随仓库提供的签名表是空的：没验过就不该是绿的，--strict 返回 1 才是正确状态</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
