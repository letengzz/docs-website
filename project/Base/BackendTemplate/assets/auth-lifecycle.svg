<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">登录业务闭环与令牌生命周期</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">认证只是起点：账号要能被保护，令牌要能被吊销，登录行为要能被审计</text>
  <rect x="24" y="66" width="712" height="112" rx="12" fill="#FAFAFF" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="40" y="88" text-anchor="start" font-size="12" fill="#5B21B6" font-weight="bold">① 登录与账号锁定</text>
  <rect x="40" y="96" width="128" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="104" y="123.59" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">POST /api/auth/login</text>
  <text x="104" y="138.59" text-anchor="middle" font-size="7.5" fill="#1D4ED8">username + password</text>
  <line x1="170" y1="129" x2="196" y2="129" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="198" y="96" width="148" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="272" y="123.59" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">校验账号密码</text>
  <text x="272" y="138.59" text-anchor="middle" font-size="7.5" fill="#475569">统一错误码防枚举</text>
  <line x1="348" y1="112" x2="388" y2="100" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="84" width="156" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="468" y="104.59" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">成功：清计数</text>
  <text x="468" y="119.59" text-anchor="middle" font-size="7.5" fill="#047857">签发 Access + Refresh</text>
  <line x1="348" y1="146" x2="388" y2="158" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="142" width="156" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="468" y="162.59" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">失败：Redis 计数</text>
  <text x="468" y="177.59" text-anchor="middle" font-size="7.5" fill="#B91C1C">满 5 次 → 锁定 15 分钟</text>
  <rect x="562" y="96" width="158" height="66" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.6"/>
  <text x="641" y="123.59" text-anchor="middle" font-size="9.5" fill="#854D0E" font-weight="bold">登录审计</text>
  <text x="641" y="138.59" text-anchor="middle" font-size="7.5" fill="#A16207">t_login_log：成功/失败/IP/UA</text>
  <line x1="548" y1="110" x2="560" y2="118" stroke="#CA8A04" stroke-width="1.6" marker-end="url(#arwY)" stroke-dasharray="5 4"/>
  <line x1="548" y1="168" x2="560" y2="152" stroke="#CA8A04" stroke-width="1.6" marker-end="url(#arwY)" stroke-dasharray="5 4"/>
  <rect x="24" y="190" width="712" height="112" rx="12" fill="#FAFBFF" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="40" y="212" text-anchor="start" font-size="12" fill="#1E3A8A" font-weight="bold">② 使用与刷新</text>
  <rect x="40" y="220" width="150" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="115" y="247.59" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">携带 Bearer Access</text>
  <text x="115" y="262.59" text-anchor="middle" font-size="7.5" fill="#1D4ED8">受保护接口请求</text>
  <line x1="192" y1="253" x2="216" y2="253" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="218" y="220" width="176" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="306" y="247.59" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">JwtAuthFilter 校验</text>
  <text x="306" y="262.59" text-anchor="middle" font-size="7.5" fill="#475569">签名 / 过期 / 黑名单 / 吊销时间</text>
  <line x1="396" y1="253" x2="420" y2="253" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="422" y="220" width="138" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="491" y="247.59" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">放行</text>
  <text x="491" y="262.59" text-anchor="middle" font-size="7.5" fill="#047857">写入 SecurityContext</text>
  <rect x="578" y="220" width="142" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="649" y="247.59" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">POST /api/auth/refresh</text>
  <text x="649" y="262.59" text-anchor="middle" font-size="7.5" fill="#C2410C">旧 Refresh 一次性消费</text>
  <line x1="576" y1="253" x2="574" y2="253" stroke="#EA580C" stroke-width="1.6" marker-end="url(#arwO)"/>
  <text x="380" y="296" text-anchor="middle" font-size="9.5" fill="#9A3412">刷新即轮换：新 Refresh 生效、旧 Refresh 立即作废；重复使用判定为复用攻击 → 吊销该用户全部会话</text>
  <rect x="24" y="314" width="712" height="98" rx="12" fill="#FFFBFB" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="40" y="336" text-anchor="start" font-size="12" fill="#991B1B" font-weight="bold">③ 登出与吊销</text>
  <rect x="40" y="344" width="168" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="124" y="365.59" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">POST /api/auth/logout</text>
  <text x="124" y="380.59" text-anchor="middle" font-size="7.5" fill="#B91C1C">Access + Refresh</text>
  <line x1="210" y1="371" x2="232" y2="371" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arwR)"/>
  <rect x="234" y="344" width="216" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="342" y="365.59" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">jti 入黑名单</text>
  <text x="342" y="380.59" text-anchor="middle" font-size="7.5" fill="#B91C1C">TTL = Access 剩余有效期</text>
  <line x1="452" y1="371" x2="474" y2="371" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arwR)"/>
  <rect x="476" y="344" width="140" height="54" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="546" y="365.59" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">删除 Redis 中的</text>
  <text x="546" y="380.59" text-anchor="middle" font-size="7.5" fill="#C2410C">Refresh 记录</text>
  <rect x="624" y="344" width="96" height="54" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="672" y="365.59" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">旧令牌</text>
  <text x="672" y="380.59" text-anchor="middle" font-size="7.5" fill="#475569">立即 401</text>
  <text x="380" y="406" text-anchor="middle" font-size="9" fill="#64748B">Redis 键：auth:refresh:{userId}:{jti} · auth:blacklist:{jti} · auth:fail:{username} · auth:lock:{username}</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arwO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#EA580C"/>
    </marker>
    <marker id="arwY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#CA8A04"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#DC2626"/>
    </marker>
  </defs>
</svg>
