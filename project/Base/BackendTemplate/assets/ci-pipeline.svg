<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">CI 流水线的五个阶段与失败代价排序</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">越早失败的阶段放在越前面——把 30 分钟的镜像构建放在 30 秒的 lint 之前，就是白烧机器</text>
  <rect x="10" y="84" width="140" height="92" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="102.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">① 静态检查</text>
  <text x="80" y="119" text-anchor="middle" font-size="7.5" fill="#334155">编译 + lint</text>
  <text x="80" y="136.25" text-anchor="middle" font-size="7.5" fill="#334155">选择器 --check</text>
  <text x="80" y="153.5" text-anchor="middle" font-size="7.5" fill="#334155">秒级失败</text>
  <rect x="166" y="84" width="140" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="236" y="102.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">② 测试与门禁</text>
  <text x="236" y="119" text-anchor="middle" font-size="7.5" fill="#047857">单元 / 集成（真容器）</text>
  <text x="236" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">覆盖率按模块阈值</text>
  <text x="236" y="153.5" text-anchor="middle" font-size="7.5" fill="#047857">契约破坏性变更拦截</text>
  <rect x="322" y="84" width="140" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="392" y="102.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">③ 构建镜像</text>
  <text x="392" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">多阶段 Dockerfile</text>
  <text x="392" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">打 git sha 标签</text>
  <text x="392" y="153.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">推送到镜像仓库</text>
  <rect x="478" y="84" width="140" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="548" y="102.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">④ 部署预发</text>
  <text x="548" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">迁移 + 起容器</text>
  <text x="548" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">compose 编排</text>
  <text x="548" y="153.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">健康检查通过</text>
  <rect x="634" y="84" width="116" height="92" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="692" y="102.2" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">⑤ 冒烟</text>
  <text x="692" y="119" text-anchor="middle" font-size="7.5" fill="#B91C1C">smoke.sh 七项</text>
  <text x="692" y="136.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">失败即流水线失败</text>
  <line x1="150" y1="130" x2="166" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="306" y1="130" x2="322" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="462" y1="130" x2="478" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="618" y1="130" x2="634" y2="130" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="40" y="200" width="330" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="205" y="218.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">三条硬约束</text>
  <text x="205" y="235" text-anchor="middle" font-size="7.5" fill="#B91C1C">① 门禁失败必须让流水线红，不允许 --continue-on-error</text>
  <text x="205" y="252.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">② 冒烟失败要把容器日志打出来（否则只有红叉没有线索）</text>
  <text x="205" y="269.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">③ 镜像标签用 git sha，禁止用 latest 部署</text>
  <rect x="390" y="200" width="330" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="555" y="218.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">两处缓存</text>
  <text x="555" y="235" text-anchor="middle" font-size="7.5" fill="#0F766E">Maven 仓库缓存：跨流水线复用 ~/.m2，依赖不重下</text>
  <text x="555" y="252.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Docker 构建缓存：builder 阶段的依赖层跨次复用</text>
  <rect x="40" y="312" width="680" height="74" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="330.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">顺序不能调换</text>
  <text x="380" y="347" text-anchor="middle" font-size="7.5" fill="#334155">静态检查最早失败最省时间；测试通过才构建镜像；镜像构建成功才部署；部署+冒烟通过才算这一次提交可用</text>
  <text x="380" y="406" text-anchor="middle" font-size="8" fill="#64748B">流水线的目标不是「自动」，而是「让每一次提交都有同一个可复现的判定结论」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
