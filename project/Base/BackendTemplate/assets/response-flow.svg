<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">统一响应链路：成功与异常都收敛成同一种结构</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker>
  </defs>
  <g font-size="12">
    <rect x="24" y="70" width="120" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="84" y="101" text-anchor="middle" fill="#1E3A8A" font-weight="bold">HTTP 请求</text>
    <rect x="176" y="70" width="130" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="241" y="101" text-anchor="middle" fill="#1E3A8A" font-weight="bold">Controller</text>
    <rect x="338" y="70" width="150" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="413" y="94" text-anchor="middle" fill="#065F46" font-weight="bold">Service 正常返回</text>
    <text x="413" y="112" text-anchor="middle" fill="#065F46" font-size="11">Result.success(data)</text>
    <rect x="338" y="182" width="150" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="413" y="206" text-anchor="middle" fill="#7F1D1D" font-weight="bold">抛异常</text>
    <text x="413" y="224" text-anchor="middle" fill="#7F1D1D" font-size="11">业务/校验/系统异常</text>
    <rect x="520" y="126" width="140" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="590" y="150" text-anchor="middle" fill="#9A3412" font-weight="bold">@RestControllerAdvice</text>
    <text x="590" y="168" text-anchor="middle" fill="#9A3412" font-size="11">统一异常处理</text>
    <rect x="418" y="126" width="76" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="456" y="150" text-anchor="middle" fill="#5B21B6" font-weight="bold">Result</text>
    <text x="456" y="168" text-anchor="middle" fill="#5B21B6" font-size="11">code/msg</text>
  </g>
  <g stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="144" y1="96" x2="172" y2="96"/>
    <line x1="306" y1="96" x2="334" y2="96"/>
    <line x1="488" y1="96" x2="500" y2="120"/>
    <line x1="488" y1="208" x2="500" y2="182"/>
  </g>
  <g stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="660" y1="152" x2="612" y2="152"/>
    <line x1="418" y1="152" x2="200" y2="152"/>
  </g>
  <text x="380" y="278" text-anchor="middle" font-size="12" fill="#334155">客户端始终拿到 { code, message, data, timestamp }，HTTP 状态码固定或按错误等级映射，前端只需一套解析逻辑</text>
</svg>
