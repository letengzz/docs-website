  <text x="445" y="278" text-anchor="middle" font-size="8.5" fill="#334155">redis</text>
  <rect x="500" y="262" width="230" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="615" y="278" text-anchor="middle" font-size="8.5" fill="#334155">偏好 JPA 规范与派生查询</text>
  <rect x="30" y="286" width="100" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="302" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">satoken-flex</text>
  <rect x="130" y="286" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
