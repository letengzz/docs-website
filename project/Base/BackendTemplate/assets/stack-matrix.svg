  <rect x="30" y="310" width="100" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="326" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">minimal</text>
  <rect x="130" y="310" width="110" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="185" y="326" text-anchor="middle" font-size="8.5" fill="#334155">spring</text>
