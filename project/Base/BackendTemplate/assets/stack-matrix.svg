  <text x="615" y="326" text-anchor="middle" font-size="8.5" fill="#334155">依赖最少，单机、无缓存</text>
  <rect x="30" y="334" width="100" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="350" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">local-cache</text>
  <rect x="130" y="334" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="185" y="350" text-anchor="middle" font-size="8.5" fill="#334155">spring</text>
  <rect x="240" y="334" width="150" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="315" y="350" text-anchor="middle" font-size="8.5" fill="#334155">jpa</text>
  <rect x="390" y="334" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445" y="350" text-anchor="middle" font-size="8.5" fill="#334155">caffeine</text>
  <rect x="500" y="334" width="230" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="615" y="350" text-anchor="middle" font-size="8.5" fill="#334155">单机部署，不引入 Redis</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#1E3A8A">共 2 × 4 × 3 = 24 种组合；脚本对每一种都做约束校验，非法组合直接拒绝并说明原因</text>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#B91C1C">硬约束一：ORM 与安全框架各自单选，不支持 JPA + MyBatis 混用（两个事务管理器与两套映射无法收敛）</text>
  <text x="380" y="416" text-anchor="middle" font-size="9.5" fill="#92400E">硬约束二：cache=none 时依赖缓存的特性必须一起关掉，否则会出现「本机能跑、多实例失效」的假象</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
