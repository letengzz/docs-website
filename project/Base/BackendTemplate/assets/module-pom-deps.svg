<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="500" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四个业务模块的 POM：依赖分层与版本来源</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">上层只依赖下层，版本由 BOM / 根 POM 统一给出——子模块 POM 越「薄」越好维护</text>
  <rect x="30" y="76" width="176" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="118" y="94.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">template-application</text>
  <text x="118" y="111" text-anchor="middle" font-size="7" fill="#B91C1C">唯一可启动 · 打包入口</text>
  <rect x="212" y="76" width="526" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="94" text-anchor="middle" font-size="8" fill="#334155">template-web · spring-boot-starter-actuator · spring-boot-starter-test(test)</text>
  <text x="475" y="112.4" text-anchor="middle" font-size="8" fill="#334155">版本：starter 由 BOM 提供；内部模块版本由 ${project.version} 统一</text>
  <rect x="30" y="130" width="176" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="118" y="148.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">template-web</text>
  <text x="118" y="165" text-anchor="middle" font-size="7" fill="#1D4ED8">Controller · 校验 · 全局异常</text>
  <rect x="212" y="130" width="526" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="148" text-anchor="middle" font-size="8" fill="#334155">template-security · starter-web · starter-validation · springdoc-openapi-starter-webmvc-ui</text>
  <text x="475" y="166.4" text-anchor="middle" font-size="8" fill="#334155">版本：starter 由 BOM 提供；springdoc 由根 POM 的 dependencyManagement 提供</text>
  <rect x="30" y="184" width="176" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="118" y="202.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">template-security</text>
  <text x="118" y="219" text-anchor="middle" font-size="7" fill="#B45309">JWT · 过滤器 · 权限注解</text>
  <rect x="212" y="184" width="526" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="202" text-anchor="middle" font-size="8" fill="#334155">template-data · starter-security · jjwt-api / jjwt-impl / jjwt-jackson · starter-data-redis</text>
  <text x="475" y="220.4" text-anchor="middle" font-size="8" fill="#334155">版本：starter 由 BOM 提供；jjwt 三件套同版本 0.13.0（写在模块自身）</text>
  <rect x="30" y="238" width="176" height="46" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="118" y="256.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">template-data</text>
  <text x="118" y="273" text-anchor="middle" font-size="7" fill="#0F766E">Mapper · 分页 · 数据源配置</text>
  <rect x="212" y="238" width="526" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="256" text-anchor="middle" font-size="8" fill="#334155">template-common · mybatis-plus-spring-boot4-starter · mysql-connector-j (runtime)</text>
  <text x="475" y="274.4" text-anchor="middle" font-size="8" fill="#334155">版本：BOM 提供 Spring 组件；MyBatis-Plus 由根 POM 的 dependencyManagement 提供</text>
  <rect x="30" y="292" width="176" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="118" y="310.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">template-common</text>
  <text x="118" y="327" text-anchor="middle" font-size="7" fill="#047857">Result · ErrorCode · 工具类</text>
  <rect x="212" y="292" width="526" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="475" y="310" text-anchor="middle" font-size="8" fill="#334155">spring-boot-starter-validation · lombok (provided) · spring-boot-starter-test (test)</text>
  <text x="475" y="328.4" text-anchor="middle" font-size="8" fill="#334155">版本：全部由 BOM 提供；不依赖任何内部模块，是依赖链的末端</text>
  <text x="380" y="356" text-anchor="middle" font-size="9.5" fill="#B91C1C" font-weight="bold">依赖方向：自上而下，禁止反向（common 不准引用 web / data 的任何类型）</text>
  <rect x="30" y="372" width="708" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="384" y="390" text-anchor="middle" font-size="8.5" fill="#6D28D9">① Spring Boot 官方 starter → 版本由 BOM（spring-boot-dependencies）统一提供，模块里不写 &lt;version&gt;</text>
  <text x="384" y="409.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">② 第三方库（MyBatis-Plus / springdoc / jjwt）→ 版本集中在根 POM：先声明 properties，再进 dependencyManagement</text>
  <text x="384" y="429.1" text-anchor="middle" font-size="8.5" fill="#6D28D9">③ 内部模块（template-*）→ 版本由根 POM 的 ${project.version} 提供，子模块只写 groupId + artifactId</text>
  <text x="380" y="478" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">子模块 POM 只做两件事：声明 parent、列出依赖；版本与插件配置全部留在根 POM</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
