<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">测试数据隔离：三档方案与选择依据</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一套用例在不同隔离档下的行为完全不同，选错档位会出现「单跑能过、全跑失败」</text>
  <rect x="30" y="76" width="226" height="116" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 1 档 · 事务回滚</text>
  <text x="143" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">做法：测试类/方法加 @Transactional</text>
  <text x="143" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">优点：最快，毫秒级，不用清库</text>
  <text x="143" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">适用：Mapper / Service 单测</text>
  <text x="143" y="162.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">坑：跨线程不可见；RANDOM_PORT 失效</text>
  <rect x="268" y="76" width="226" height="116" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">第 2 档 · 清库重来</text>
  <text x="381" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">做法：@BeforeEach 或 @Sql 执行 clean.sql</text>
  <text x="381" y="128.25" text-anchor="middle" font-size="7.5" fill="#B45309">优点：有真实提交语义，贴近生产</text>
  <text x="381" y="145.5" text-anchor="middle" font-size="7.5" fill="#B45309">适用：MockMvc + 真库的接口测试</text>
  <text x="381" y="162.75" text-anchor="middle" font-size="7.5" fill="#B45309">坑：TRUNCATE 隐式提交；外键先解约束</text>
  <rect x="506" y="76" width="226" height="116" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">第 3 档 · 独立库/容器</text>
  <text x="619" y="111" text-anchor="middle" font-size="7.5" fill="#047857">做法：Testcontainers 每类一容器或一 schema</text>
  <text x="619" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">优点：隔离度最高，可安全并行</text>
  <text x="619" y="145.5" text-anchor="middle" font-size="7.5" fill="#047857">适用：集成测试、并行执行</text>
  <text x="619" y="162.75" text-anchor="middle" font-size="7.5" fill="#047857">坑：启动 5~15 秒；CI 需 Docker</text>
  <line x1="256" y1="134" x2="268" y2="134" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="494" y1="134" x2="506" y2="134" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="212" width="120" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="90" y="229" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="150" y="212" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="245" y="229" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">事务回滚</text>
  <rect x="340" y="212" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="435" y="229" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">清库重来</text>
  <rect x="530" y="212" width="200" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="630" y="229" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">独立库 / 容器</text>
  <rect x="30" y="238" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="254" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">速度</text>
  <rect x="150" y="238" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="254" text-anchor="middle" font-size="8.5" fill="#334155">最快（毫秒级）</text>
  <rect x="340" y="238" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="254" text-anchor="middle" font-size="8.5" fill="#334155">中（每用例清表）</text>
  <rect x="530" y="238" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="254" text-anchor="middle" font-size="8.5" fill="#334155">慢（启动 5~15 秒）</text>
  <rect x="30" y="262" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="278" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">隔离度</text>
  <rect x="150" y="262" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="278" text-anchor="middle" font-size="8.5" fill="#334155">低（仅当前事务内）</text>
  <rect x="340" y="262" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="278" text-anchor="middle" font-size="8.5" fill="#334155">中（用例间互不影响）</text>
  <rect x="530" y="262" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="278" text-anchor="middle" font-size="8.5" fill="#334155">高（库级完全独立）</text>
  <rect x="30" y="286" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="302" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">跨线程可见</text>
  <rect x="150" y="286" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="302" text-anchor="middle" font-size="8.5" fill="#334155">否（事务未提交）</text>
  <rect x="340" y="286" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="302" text-anchor="middle" font-size="8.5" fill="#334155">是</text>
  <rect x="530" y="286" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="302" text-anchor="middle" font-size="8.5" fill="#334155">是</text>
  <rect x="30" y="310" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="326" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">自增序列</text>
  <rect x="150" y="310" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="326" text-anchor="middle" font-size="8.5" fill="#334155">不回退，会留空洞</text>
  <rect x="340" y="310" width="190" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="326" text-anchor="middle" font-size="8.5" fill="#334155">可用 TRUNCATE 重置</text>
  <rect x="530" y="310" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="326" text-anchor="middle" font-size="8.5" fill="#334155">每个库各自从 1 开始</text>
  <rect x="30" y="334" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="350" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">适用</text>
  <rect x="150" y="334" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="350" text-anchor="middle" font-size="8.5" fill="#334155">Mapper / Service 单测</text>
  <rect x="340" y="334" width="190" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="435" y="350" text-anchor="middle" font-size="8.5" fill="#334155">接口层集成测试</text>
  <rect x="530" y="334" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="350" text-anchor="middle" font-size="8.5" fill="#334155">并行执行与多环境隔离</text>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">选择依据：速度与隔离度成反比——按测试类型选档，不要一刀切</text>
  <text x="380" y="402" text-anchor="middle" font-size="9.5" fill="#475569">顺序建议：先用第 1 档覆盖 Service 层，接口层升到第 2 档，只有需要并行时才付出第 3 档的成本</text>
  <text x="380" y="424" text-anchor="middle" font-size="9.5" fill="#B91C1C">最容易翻车的一点：用 H2 假装 MySQL——方言差异会让「测试全绿、上线报错」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
