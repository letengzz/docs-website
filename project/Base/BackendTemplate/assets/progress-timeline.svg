<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">第 69 天进展：骨架 → 响应 → 异常 → 健康检查（每步可验证）</text>
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
  <g font-size="12">
    <rect x="24" y="66" width="160" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="104" y="90" text-anchor="middle" fill="#065F46" font-weight="bold">① 骨架与配置</text>
    <text x="104" y="112" text-anchor="middle" fill="#334155" font-size="11">Maven 多模块 + 启动类</text>
    <text x="104" y="132" text-anchor="middle" fill="#64748B" font-size="11">验证：启动成功日志</text>

    <rect x="208" y="66" width="160" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="288" y="90" text-anchor="middle" fill="#1E3A8A" font-weight="bold">② 统一响应</text>
    <text x="288" y="112" text-anchor="middle" fill="#334155" font-size="11">Result + ErrorCode</text>
    <text x="288" y="132" text-anchor="middle" fill="#64748B" font-size="11">验证：curl 返回 code=0</text>

    <rect x="392" y="66" width="160" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="472" y="90" text-anchor="middle" fill="#9A3412" font-weight="bold">③ 全局异常</text>
    <text x="472" y="112" text-anchor="middle" fill="#334155" font-size="11">@RestControllerAdvice</text>
    <text x="472" y="132" text-anchor="middle" fill="#64748B" font-size="11">验证：curl 返回 400/500 码</text>

    <rect x="576" y="66" width="160" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="656" y="90" text-anchor="middle" fill="#5B21B6" font-weight="bold">④ 健康检查</text>
    <text x="656" y="112" text-anchor="middle" fill="#334155" font-size="11">Actuator + 自定义端点</text>
    <text x="656" y="132" text-anchor="middle" fill="#64748B" font-size="11">验证：/actuator/health UP</text>
  </g>
  <g stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arr5)">
    <line x1="184" y1="109" x2="204" y2="109"/>
    <line x1="368" y1="109" x2="388" y2="109"/>
    <line x1="552" y1="109" x2="572" y2="109"/>
  </g>
  <g>
    <rect x="24" y="182" width="712" height="96" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="44" y="208" font-size="13" fill="#0F172A" font-weight="bold">下一步（第 70 天）：</text>
    <text x="44" y="232" font-size="12" fill="#334155">① 请求追踪 ID（TraceId）与日志切面，让每条日志可串起一次请求；</text>
    <text x="44" y="252" font-size="12" fill="#334155">② 参数校验增强（分组校验、自定义校验注解、校验错误统一返回）；</text>
    <text x="44" y="272" font-size="12" fill="#334155">③ 用 MockMvc 为统一响应与异常处理补集成测试，纳入 CI 质量门禁。</text>
  </g>
</svg>
