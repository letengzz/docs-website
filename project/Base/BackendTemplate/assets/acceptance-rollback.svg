<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="596" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">观察窗口、触发阈值与回滚决策人</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">回滚该由谁拍板，取决于阈值是谁定的 —— 把审批放在事故现场，观察窗口就是摆设</text>
  <text x="60" y="78" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">观察窗口：不是「发布完等一会儿」，而是按风险定长短</text>
  <rect x="30" y="90" width="226" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="108.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">常规发布</text>
  <text x="143" y="125" text-anchor="middle" font-size="8" fill="#1D4ED8">无 schema 变更</text>
  <text x="143" y="143.4" text-anchor="middle" font-size="8" fill="#1D4ED8">30 分钟</text>
  <text x="143" y="161.8" text-anchor="middle" font-size="8" fill="#1D4ED8">覆盖高峰片段的 1/4</text>
  <rect x="268" y="90" width="226" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="381" y="108.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">涉数据迁移</text>
  <text x="381" y="125" text-anchor="middle" font-size="8" fill="#B45309">双方言 DDL / 回填</text>
  <text x="381" y="143.4" text-anchor="middle" font-size="8" fill="#B45309">2 小时</text>
  <text x="381" y="161.8" text-anchor="middle" font-size="8" fill="#B45309">副作用常在异步任务里才显形</text>
  <rect x="506" y="90" width="226" height="76" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="108.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">首次上线</text>
  <text x="619" y="125" text-anchor="middle" font-size="8" fill="#6D28D9">无历史基线</text>
  <text x="619" y="143.4" text-anchor="middle" font-size="8" fill="#6D28D9">24 小时</text>
  <text x="619" y="161.8" text-anchor="middle" font-size="8" fill="#6D28D9">「正常」需要一个日周期来定义</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">触发阈值：命中任一即回滚，一线值班有权直接执行</text>
  <rect x="30" y="208" width="96" height="24" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="78" y="224" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">错误率</text>
  <rect x="134" y="208" width="596" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432" y="224" text-anchor="middle" font-size="8.5" fill="#334155">HTTP 5xx &gt; 1% 持续 5 分钟</text>
  <rect x="30" y="236" width="96" height="24" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="78" y="252" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">延迟</text>
  <rect x="134" y="236" width="596" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432" y="252" text-anchor="middle" font-size="8.5" fill="#334155">核心接口 p95 &gt; 基线 × 1.5 持续 10 分钟</text>
  <rect x="30" y="264" width="96" height="24" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="78" y="280" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">业务</text>
  <rect x="134" y="264" width="596" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432" y="280" text-anchor="middle" font-size="8.5" fill="#334155">下单/支付成功率比前一小时下降 &gt; 10%</text>
  <rect x="30" y="292" width="96" height="24" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="78" y="308" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">资源</text>
  <rect x="134" y="292" width="596" height="24" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432" y="308" text-anchor="middle" font-size="8.5" fill="#334155">容器内存达 limit 的 90% 持续 10 分钟</text>
  <text x="380" y="338" text-anchor="middle" font-size="9.5" fill="#B91C1C">「持续 N 分钟」不是修饰语：瞬时抖动会触发无谓回滚，而回滚本身会制造第二次抖动</text>
  <line x1="30" y1="356" x2="730" y2="356" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="384" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">决策路径：审批前置到「阈值是谁定的」，而不是「这次要不要回」</text>
  <rect x="300" y="396" width="160" height="54" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="414.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">告警</text>
  <text x="380" y="431" text-anchor="middle" font-size="7.5" fill="#6D28D9">一线值班 5 分钟内响应</text>
  <line x1="380" y1="450" x2="380" y2="466" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="120" y1="466" x2="640" y2="466" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="120" y1="466" x2="120" y2="480" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="466" x2="380" y2="480" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="640" y1="466" x2="640" y2="480" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="480" width="180" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="120" y="498.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">命中阈值</text>
  <text x="120" y="515" text-anchor="middle" font-size="8" fill="#047857">直接回滚</text>
  <text x="120" y="533.4" text-anchor="middle" font-size="8" fill="#047857">→ 冒烟 7 项</text>
  <text x="120" y="551.8" text-anchor="middle" font-size="8" fill="#047857">→ 通知决策人</text>
  <rect x="290" y="480" width="180" height="76" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="498.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">未命中但业务异常</text>
  <text x="380" y="515" text-anchor="middle" font-size="8" fill="#B45309">电话回滚决策人</text>
  <text x="380" y="533.4" text-anchor="middle" font-size="8" fill="#B45309">15 分钟内答复</text>
  <text x="380" y="551.8" text-anchor="middle" font-size="8" fill="#B45309">不许等审批再回滚</text>
  <rect x="550" y="480" width="180" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="640" y="498.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">涉及数据</text>
  <text x="640" y="515" text-anchor="middle" font-size="8" fill="#B91C1C">同时叫 DBA</text>
  <text x="640" y="533.4" text-anchor="middle" font-size="8" fill="#B91C1C">不要先回滚再叫人</text>
  <text x="640" y="551.8" text-anchor="middle" font-size="8" fill="#B91C1C">只有 DBA 能批数据回退</text>
  <text x="380" y="578" text-anchor="middle" font-size="9.5" fill="#065F46">回滚命令引用身份标签 sha-&lt;12&gt;，不引用环境指针 prod；冒烟不过就停下找 DBA</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
