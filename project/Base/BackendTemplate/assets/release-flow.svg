<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="464" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">发布流水线：从提交到线上，以及怎么退回去</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">回滚是换回旧身份、不是重新构建——所以历史标签绝不能被覆盖或回收</text>
  <text x="380" y="78" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">七阶段：前三阶段产出可追溯的镜像，后四阶段才碰线上</text>
  <rect x="30" y="92" width="166" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="113" y="110.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 构建</text>
  <text x="113" y="127" text-anchor="middle" font-size="8" fill="#6D28D9">buildx 多架构</text>
  <text x="113" y="145.4" text-anchor="middle" font-size="8" fill="#6D28D9">amd64 + arm64</text>
  <text x="113" y="163.8" text-anchor="middle" font-size="8" fill="#6D28D9">内嵌 revision 标签</text>
  <line x1="196" y1="135" x2="210" y2="135" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="92" width="166" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="293" y="110.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 打标签</text>
  <text x="293" y="127" text-anchor="middle" font-size="8" fill="#1D4ED8">身份 sha-&lt;12&gt;</text>
  <text x="293" y="145.4" text-anchor="middle" font-size="8" fill="#1D4ED8">版本 1.2.0</text>
  <text x="293" y="163.8" text-anchor="middle" font-size="8" fill="#1D4ED8">两者都不可变</text>
  <line x1="376" y1="135" x2="390" y2="135" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="92" width="166" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="473" y="110.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 推不可变层</text>
  <text x="473" y="127" text-anchor="middle" font-size="8" fill="#047857">只推 sha 与版本</text>
  <text x="473" y="145.4" text-anchor="middle" font-size="8" fill="#047857">不推任何环境指针</text>
  <text x="473" y="163.8" text-anchor="middle" font-size="8" fill="#047857">registry 开不可变</text>
  <line x1="556" y1="135" x2="570" y2="135" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="92" width="166" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="653" y="110.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 签名</text>
  <text x="653" y="127" text-anchor="middle" font-size="8" fill="#0F766E">cosign keyless</text>
  <text x="653" y="145.4" text-anchor="middle" font-size="8" fill="#0F766E">SBOM + provenance</text>
  <text x="653" y="163.8" text-anchor="middle" font-size="8" fill="#0F766E">验签不过不部署</text>
  <line x1="30" y1="204" x2="730" y2="204" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="30" y="190" width="700" height="28" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="209" text-anchor="middle" font-size="9" fill="#B91C1C" font-weight="bold">──── 以下开始影响线上：唯一一道「人」的审批门 ────</text>
  <rect x="30" y="232" width="226" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="143" y="250.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">⑤ 打环境指针</text>
  <text x="143" y="267" text-anchor="middle" font-size="8" fill="#B45309">审批通过才执行</text>
  <text x="143" y="285.4" text-anchor="middle" font-size="8" fill="#B45309">tag sha → prod</text>
  <text x="143" y="303.8" text-anchor="middle" font-size="8" fill="#B45309">单独一次操作</text>
  <line x1="256" y1="275" x2="270" y2="275" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="232" width="226" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="383" y="250.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">⑥ 部署与观察</text>
  <text x="383" y="267" text-anchor="middle" font-size="8" fill="#C2410C">IMAGE_REF=sha-xxx</text>
  <text x="383" y="285.4" text-anchor="middle" font-size="8" fill="#C2410C">compose 滚动替换</text>
  <text x="383" y="303.8" text-anchor="middle" font-size="8" fill="#C2410C">看 readiness 与指标</text>
  <line x1="496" y1="275" x2="510" y2="275" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="232" width="226" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="623" y="250.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">⑦ 回滚</text>
  <text x="623" y="267" text-anchor="middle" font-size="8" fill="#B91C1C">换回上一个身份标签</text>
  <text x="623" y="285.4" text-anchor="middle" font-size="8" fill="#B91C1C">不重新构建</text>
  <text x="623" y="303.8" text-anchor="middle" font-size="8" fill="#B91C1C">旧标签必须还在</text>
  <line x1="128" y1="318" x2="128" y2="340" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="128" y1="340" x2="220" y2="340" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="220" y1="340" x2="366" y2="340" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="5 4"/>
  <text x="380" y="338" text-anchor="middle" font-size="8" fill="#1E293B"></text>
  <text x="60" y="366" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">判据（可机械校验）</text>
  <rect x="30" y="376" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="391" text-anchor="start" font-size="8.8" fill="#065F46">✔ 线上镜像的 org.opencontainers.image.revision 必须等于当前部署记录的提交</text>
  <rect x="30" y="402" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="417" text-anchor="start" font-size="8.8" fill="#065F46">✔ 任何部署/回滚命令的 IMAGE_REF 必须指向不可变标签；出现环境指针即视为违规</text>
  <rect x="30" y="428" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="443" text-anchor="start" font-size="8.8" fill="#065F46">✔ 回滚所需的历史身份标签仍在 registry 内且未被覆盖</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
