    <text x="380" y="300" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">template-common（最底层）</text>
  </g>
  <g stroke="#059669" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="300" y1="230" x2="300" y2="276"/>
    <line x1="460" y1="230" x2="460" y2="276"/>
    <line x1="200" y1="150" x2="200" y2="276"/>
