  </g>
  <g>
    <rect x="120" y="126" width="200" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
    <text x="220" y="156" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">template-web</text>
    <rect x="440" y="126" width="200" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
    <text x="540" y="156" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">template-security</text>
  </g>
  <g>
    <rect x="280" y="206" width="200" height="48" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
    <text x="380" y="236" text-anchor="middle" font-size="14" fill="#065F46" font-weight="bold">template-data</text>
  </g>
  <g stroke="#047857" stroke-width="2" fill="none">
    <line x1="330" y1="94" x2="235" y2="124"/>
    <line x1="430" y1="94" x2="525" y2="124"/>
    <line x1="245" y1="174" x2="330" y2="204"/>
