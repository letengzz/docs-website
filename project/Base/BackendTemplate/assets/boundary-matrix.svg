<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="414" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">边界用例矩阵：三值取法与四步法</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">边界值不是猜出来的，是从约束反推出来的；每个边界至少三个取值才算测过</text>
  <rect x="30" y="76" width="110" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="85" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">字段 / 输入</text>
  <rect x="140" y="76" width="130" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="205" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">边界定义</text>
  <rect x="270" y="76" width="105" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="322.5" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">边界 - 1</text>
  <rect x="375" y="76" width="115" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="432.5" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">边界值</text>
  <rect x="490" y="76" width="105" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="542.5" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">边界 + 1</text>
  <rect x="595" y="76" width="135" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="662.5" y="93" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">期望</text>
  <rect x="30" y="102" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="118" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">username 长度</text>
  <rect x="140" y="102" width="130" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="118" text-anchor="middle" font-size="8.5" fill="#334155">3 ~ 20 位</text>
  <rect x="270" y="102" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="118" text-anchor="middle" font-size="8.5" fill="#334155">2 位</text>
  <rect x="375" y="102" width="115" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="118" text-anchor="middle" font-size="8.5" fill="#334155">3 位 / 20 位</text>
  <rect x="490" y="102" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="118" text-anchor="middle" font-size="8.5" fill="#334155">21 位</text>
  <rect x="595" y="102" width="135" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="118" text-anchor="middle" font-size="8.5" fill="#334155">越界拒绝</text>
  <rect x="30" y="126" width="110" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="142" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">password 长度</text>
  <rect x="140" y="126" width="130" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="142" text-anchor="middle" font-size="8.5" fill="#334155">8 ~ 64 位</text>
  <rect x="270" y="126" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="142" text-anchor="middle" font-size="8.5" fill="#334155">7 位</text>
  <rect x="375" y="126" width="115" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="142" text-anchor="middle" font-size="8.5" fill="#334155">8 位 / 64 位</text>
  <rect x="490" y="126" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="142" text-anchor="middle" font-size="8.5" fill="#334155">65 位</text>
  <rect x="595" y="126" width="135" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="142" text-anchor="middle" font-size="8.5" fill="#334155">越界拒绝</text>
  <rect x="30" y="150" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="166" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">password 字符类</text>
  <rect x="140" y="150" width="130" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="166" text-anchor="middle" font-size="8.5" fill="#334155">四类字符取三</text>
  <rect x="270" y="150" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="166" text-anchor="middle" font-size="8.5" fill="#334155">仅两类</text>
  <rect x="375" y="150" width="115" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="166" text-anchor="middle" font-size="8.5" fill="#334155">恰好三类</text>
  <rect x="490" y="150" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="166" text-anchor="middle" font-size="8.5" fill="#334155">四类齐全</text>
  <rect x="595" y="150" width="135" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="166" text-anchor="middle" font-size="8.5" fill="#334155">两类拒绝</text>
  <rect x="30" y="174" width="110" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="190" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">用户 id</text>
  <rect x="140" y="174" width="130" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="190" text-anchor="middle" font-size="8.5" fill="#334155">必须 &gt; 0</text>
  <rect x="270" y="174" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="190" text-anchor="middle" font-size="8.5" fill="#334155">0</text>
  <rect x="375" y="174" width="115" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="190" text-anchor="middle" font-size="8.5" fill="#334155">1</text>
  <rect x="490" y="174" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="190" text-anchor="middle" font-size="8.5" fill="#334155">Long.MAX</text>
  <rect x="595" y="174" width="135" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="190" text-anchor="middle" font-size="8.5" fill="#334155">0 拒绝</text>
  <rect x="30" y="198" width="110" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="214" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">分页 size</text>
  <rect x="140" y="198" width="130" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="214" text-anchor="middle" font-size="8.5" fill="#334155">1 ~ 100</text>
  <rect x="270" y="198" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="214" text-anchor="middle" font-size="8.5" fill="#334155">0</text>
  <rect x="375" y="198" width="115" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="214" text-anchor="middle" font-size="8.5" fill="#334155">1 / 100</text>
  <rect x="490" y="198" width="105" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="214" text-anchor="middle" font-size="8.5" fill="#334155">101</text>
  <rect x="595" y="198" width="135" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="214" text-anchor="middle" font-size="8.5" fill="#334155">越界拒绝</text>
  <rect x="30" y="222" width="110" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="85" y="238" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">令牌 exp</text>
  <rect x="140" y="222" width="130" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="205" y="238" text-anchor="middle" font-size="8.5" fill="#334155">服务端当前时刻</text>
  <rect x="270" y="222" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322.5" y="238" text-anchor="middle" font-size="8.5" fill="#334155">exp - 1s</text>
  <rect x="375" y="222" width="115" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="432.5" y="238" text-anchor="middle" font-size="8.5" fill="#334155">恰好 exp</text>
  <rect x="490" y="222" width="105" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="542.5" y="238" text-anchor="middle" font-size="8.5" fill="#334155">exp + 1s</text>
  <rect x="595" y="222" width="135" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="662.5" y="238" text-anchor="middle" font-size="8.5" fill="#334155">过期即拒</text>
  <text x="60" y="272" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">边界用例四步法</text>
  <rect x="30" y="282" width="169" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="114.5" y="300.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">① 定边界</text>
  <text x="114.5" y="317" text-anchor="middle" font-size="7.5" fill="#6D28D9">从校验注解、DDL 与</text>
  <text x="114.5" y="334.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">业务规则反推边界值</text>
  <line x1="199" y1="313" x2="217" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="207" y="282" width="169" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="291.5" y="300.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 取三值</text>
  <text x="291.5" y="317" text-anchor="middle" font-size="7.5" fill="#1D4ED8">边界 - 1 / 边界 /</text>
  <text x="291.5" y="334.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">边界 + 1 各取一个</text>
  <line x1="376" y1="313" x2="394" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="384" y="282" width="169" height="62" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="468.5" y="300.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">③ 补等价类</text>
  <text x="468.5" y="317" text-anchor="middle" font-size="7.5" fill="#0F766E">每个等价类取一个</text>
  <text x="468.5" y="334.25" text-anchor="middle" font-size="7.5" fill="#0F766E">代表值，别只取一个</text>
  <line x1="553" y1="313" x2="571" y2="313" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="561" y="282" width="169" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="645.5" y="300.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">④ 补异常路径</text>
  <text x="645.5" y="317" text-anchor="middle" font-size="7.5" fill="#B91C1C">null / 空串 / 超长 /</text>
  <text x="645.5" y="334.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">非法字符 / 类型不匹配</text>
  <text x="380" y="372" text-anchor="middle" font-size="9.5" fill="#B91C1C">边界用例要覆盖「刚好不合法」而不是「明显不合法」——空串和超长串挡不住 off-by-one</text>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#475569">时间类边界必须注入可控时钟（Clock），不要用 Thread.sleep + 等待断言，那是 flaky 测试的主要来源</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
