<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="394" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选择脚本：一次输入、六个产物、CI 可校验</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">只在 marker 区间内写文件，手工改动不会被悄悄冲掉——冲突会以 diff 的形式暴露出来</text>
  <rect x="30" y="76" width="169" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="114.5" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">① 选择</text>
  <text x="114.5" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">CLI 参数 / 交互菜单 / 预设</text>
  <text x="114.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">一次只改一个维度</text>
  <line x1="199" y1="108" x2="217" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="207" y="76" width="169" height="64" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="291.5" y="94.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">② 校验</text>
  <text x="291.5" y="111" text-anchor="middle" font-size="7.5" fill="#B45309">白名单校验</text>
  <text x="291.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#B45309">能力依赖校验（cache=none）</text>
  <line x1="376" y1="108" x2="394" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="384" y="76" width="169" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="468.5" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">③ 渲染</text>
  <text x="468.5" y="111" text-anchor="middle" font-size="7.5" fill="#047857">固定 marker 区间重写</text>
  <text x="468.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">确定性输出，无时间戳</text>
  <line x1="553" y1="108" x2="571" y2="108" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="561" y="76" width="169" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="645.5" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">④ 核对</text>
  <text x="645.5" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">--check 比对生成物</text>
  <text x="645.5" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">不一致则非 0 退出（CI）</text>
  <text x="60" y="170" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">一次执行产出六个文件</text>
  <rect x="30" y="182" width="226" height="66" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="143" y="200.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">stack.json</text>
  <text x="143" y="217" text-anchor="middle" font-size="7.5" fill="#334155">唯一事实来源，入 Git</text>
  <text x="143" y="234.25" text-anchor="middle" font-size="7.5" fill="#334155">记录 security / orm / cache</text>
  <rect x="268" y="182" width="226" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="200.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">pom.xml</text>
  <text x="381" y="217" text-anchor="middle" font-size="7.5" fill="#1D4ED8">改 modules 区块</text>
  <text x="381" y="234.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">marker 区间内重写</text>
  <rect x="506" y="182" width="226" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="619" y="200.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">template-application/pom.xml</text>
  <text x="619" y="217" text-anchor="middle" font-size="7.5" fill="#1D4ED8">改实现依赖区块</text>
  <text x="619" y="234.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">只保留选中实现</text>
  <rect x="30" y="258" width="226" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="143" y="276.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">application-stack.yml</text>
  <text x="143" y="293" text-anchor="middle" font-size="7.5" fill="#047857">生成 Spring 配置片段</text>
  <text x="143" y="310.25" text-anchor="middle" font-size="7.5" fill="#047857">条件自动配置的开关</text>
  <rect x="268" y="258" width="226" height="66" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="381" y="276.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">.mvn/stack-profiles.txt</text>
  <text x="381" y="293" text-anchor="middle" font-size="7.5" fill="#0F766E">给 CI 用的 -P 参数</text>
  <text x="381" y="310.25" text-anchor="middle" font-size="7.5" fill="#0F766E">CI 不再拼命令</text>
  <rect x="506" y="258" width="226" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="276.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">STACK.md</text>
  <text x="619" y="293" text-anchor="middle" font-size="7.5" fill="#6D28D9">当前组合 + 启动命令</text>
  <text x="619" y="310.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">给新人的一页说明</text>
  <text x="380" y="352" text-anchor="middle" font-size="9.5" fill="#1E3A8A">幂等：重复执行同一命令，Git 工作区应无变化；这也是 --check 能当 CI 门禁的前提</text>
  <text x="380" y="374" text-anchor="middle" font-size="9.5" fill="#475569">回滚：stack.json 与生成物一起入 Git，切换组合就是一次提交，回滚就是一次 checkout</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
