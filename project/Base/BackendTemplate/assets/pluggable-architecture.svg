<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">可插拔后端模板：分层与依赖方向</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">变化点收进实现模块，不变点留在共享模块——依赖方向永远指向内层</text>
  <rect x="30" y="76" width="372" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="216" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">装配层 template-application</text>
  <text x="216" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">main 类 + 配置 + 打包入口</text>
  <text x="216" y="129.4" text-anchor="middle" font-size="8" fill="#6D28D9">唯一允许依赖具体实现的地方</text>
  <rect x="30" y="146" width="372" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="216" y="164.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">Web 层 template-web</text>
  <text x="216" y="181" text-anchor="middle" font-size="8" fill="#1D4ED8">Controller / 参数校验 / 全局异常</text>
  <text x="216" y="199.4" text-anchor="middle" font-size="8" fill="#1D4ED8">只依赖 common + spi，构造注入拿实现</text>
  <rect x="30" y="214" width="372" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="216" y="232.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">SPI 契约层 template-spi</text>
  <text x="216" y="249" text-anchor="middle" font-size="8" fill="#047857">AuthPort / TokenStatePort / CachePort / UserRepository</text>
  <text x="216" y="267.4" text-anchor="middle" font-size="8" fill="#047857">不放 CRUD 泛型接口——四套 ORM 的接口形状无法收敛</text>
  <rect x="30" y="290" width="372" height="46" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="216" y="308.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">公共层 template-common</text>
  <text x="216" y="325" text-anchor="middle" font-size="7.5" fill="#334155">Result&lt;T&gt; / ErrorCode / PageResult / CurrentUser</text>
  <text x="216" y="342.25" text-anchor="middle" font-size="7.5" fill="#334155">零框架依赖，谁都不依赖它之外的模块</text>
  <line x1="58" y1="128" x2="58" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="58" y1="196" x2="58" y2="214" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="58" y1="272" x2="58" y2="290" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="216" y="358" text-anchor="middle" font-size="9.5" fill="#5B21B6">依赖方向永远向内：实现 → SPI → common</text>
  <rect x="424" y="76" width="306" height="68" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="577" y="94.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">安全实现（二选一）</text>
  <text x="577" y="111" text-anchor="middle" font-size="8" fill="#B45309">template-security-spring</text>
  <text x="577" y="129.4" text-anchor="middle" font-size="8" fill="#B45309">template-security-satoken</text>
  <rect x="424" y="158" width="306" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="577" y="176.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">数据实现（四选一）</text>
  <text x="577" y="193" text-anchor="middle" font-size="8" fill="#0F766E">template-data-jpa ｜ template-data-mybatis</text>
  <text x="577" y="211.4" text-anchor="middle" font-size="8" fill="#0F766E">template-data-mybatis-plus</text>
  <text x="577" y="229.8" text-anchor="middle" font-size="8" fill="#0F766E">template-data-mybatis-flex</text>
  <rect x="424" y="258" width="306" height="68" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="577" y="276.2" text-anchor="middle" font-size="9.5" fill="#155E75" font-weight="bold">缓存实现（三选一）</text>
  <text x="577" y="293" text-anchor="middle" font-size="8" fill="#0E7490">template-cache-redis ｜ template-cache-caffeine</text>
  <text x="577" y="311.4" text-anchor="middle" font-size="8" fill="#0E7490">template-cache-noop</text>
  <line x1="404" y1="110" x2="416" y2="110" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="404" y1="201" x2="416" y2="201" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="404" y1="292" x2="416" y2="292" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="577" y="344" text-anchor="middle" font-size="9" fill="#115E59">实现模块只依赖 SPI 与 common，互相之间不依赖</text>
  <text x="577" y="364" text-anchor="middle" font-size="8.5" fill="#64748B">装配层按 classpath 自动生效：@ConditionalOnClass + @ConditionalOnProperty</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
