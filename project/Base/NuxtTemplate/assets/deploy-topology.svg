<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">部署形态与交付流程</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">换 UI 库之后产物变了、但部署流程不变，才算模板真的把复杂度封装住了</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一份代码，五种交付形态：差异由 Nitro preset 与路由规则决定</text>
  <rect x="30" y="94" width="132" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="96" y="112.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">Node 服务</text>
  <text x="96" y="129" text-anchor="middle" font-size="7.5" fill="#047857">node-server preset</text>
  <text x="96" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">自建服务器首选</text>
  <text x="96" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">SSR 与接口同机</text>
  <rect x="172" y="94" width="132" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="238" y="112.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">静态产物</text>
  <text x="238" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">prerender 全量</text>
  <text x="238" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">对象存储 + CDN</text>
  <text x="238" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">零 Node 运行时</text>
  <rect x="314" y="94" width="132" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="112.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">容器镜像</text>
  <text x="380" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">多阶段构建</text>
  <text x="380" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">体积可控</text>
  <text x="380" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">编排友好</text>
  <rect x="456" y="94" width="132" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="522" y="112.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">边缘运行时</text>
  <text x="522" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">边缘函数部署</text>
  <text x="522" y="146.25" text-anchor="middle" font-size="7.5" fill="#0F766E">就近响应</text>
  <text x="522" y="163.5" text-anchor="middle" font-size="7.5" fill="#0F766E">注意运行时限制</text>
  <rect x="598" y="94" width="132" height="88" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="664" y="112.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">Serverless</text>
  <text x="664" y="129" text-anchor="middle" font-size="7.5" fill="#B45309">冷启动需评估</text>
  <text x="664" y="146.25" text-anchor="middle" font-size="7.5" fill="#B45309">按量计费</text>
  <text x="664" y="163.5" text-anchor="middle" font-size="7.5" fill="#B45309">适合波动流量</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">UI 可插拔对部署的影响：每个变体是独立产物，部署流程要按变体区分</text>
  <rect x="30" y="214" width="100" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="80" y="230" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">① 构建</text>
  <rect x="136" y="214" width="594" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="433" y="230" text-anchor="middle" font-size="8.5" fill="#334155">按 ui.config.json 出产物</text>
  <rect x="30" y="244" width="100" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="80" y="260" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">② 变量注入</text>
  <rect x="136" y="244" width="594" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="433" y="260" text-anchor="middle" font-size="8.5" fill="#334155">runtimeConfig 覆盖环境相关项</text>
  <rect x="30" y="274" width="100" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="80" y="290" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">③ 健康检查</text>
  <rect x="136" y="274" width="594" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="433" y="290" text-anchor="middle" font-size="8.5" fill="#334155">准备一个不依赖 UI 的探针接口</text>
  <rect x="30" y="304" width="100" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="80" y="320" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">④ 回滚</text>
  <rect x="136" y="304" width="594" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="433" y="320" text-anchor="middle" font-size="8.5" fill="#334155">产物按变体命名，可切回上一版</text>
  <text x="380" y="352" text-anchor="middle" font-size="9.5" fill="#065F46">验收清单里必须有一项：把 UI 库换掉，重新部署，页面功能与视觉都正常</text>
  <text x="380" y="374" text-anchor="middle" font-size="9.5" fill="#64748B">这一步同时也是「适配层到底做没做干净」的最终检验</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
