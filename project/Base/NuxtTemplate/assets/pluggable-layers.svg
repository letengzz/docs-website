<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">四层可插拔：依赖方向与「零改动」的来源</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把 UI 库的差异收敛到第 3 层的三个实现包里，是整套设计成立的前提</text>
  <rect x="30" y="78" width="700" height="50" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="96.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">第 1 层 · 业务层</text>
  <text x="380" y="113" text-anchor="middle" font-size="8" fill="#334155">app/pages · app/components/business · 只出现 &lt;Xxx&gt; 自家组件名</text>
  <rect x="30" y="152" width="700" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="170.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 2 层 · 契约层 @app/ui</text>
  <text x="380" y="187" text-anchor="middle" font-size="8" fill="#1D4ED8">组件映射表 + 命令式 API + 令牌接口；不 import 任何具体组件库</text>
  <rect x="30" y="226" width="700" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="244.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">第 3 层 · 实现层（三选一，互不引用）</text>
  <text x="380" y="261" text-anchor="middle" font-size="8" fill="#047857">@app/ui-element · @app/ui-antd · @app/ui-nuxtui，各自实现同一份契约</text>
  <rect x="30" y="300" width="700" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="318.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">第 4 层 · 组件库（node_modules）</text>
  <text x="380" y="335" text-anchor="middle" font-size="8" fill="#6D28D9">element-plus 2.14.x / ant-design-vue 4.x / @nuxt/ui 4.11.x + tailwindcss 4</text>
  <line x1="380" y1="128" x2="380" y2="152" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="202" x2="380" y2="226" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="380" y1="276" x2="380" y2="300" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="378" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">依赖只能自上而下：第 1 层不认识第 4 层，第 3 层之间零引用</text>
  <text x="380" y="400" text-anchor="middle" font-size="9.5" fill="#B91C1C">「业务代码零改动」能成立，唯一原因是第 2 层的契约把差异吸收干净了</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
