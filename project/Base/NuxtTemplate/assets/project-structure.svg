<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="372" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">工程目录：三类文件与三种所有权</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「谁拥有这些文件」在目录层面说清楚，是切换脚本能安全运行的制度前提</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">三类文件、三种所有权：谁写的，谁负责改</text>
  <rect x="30" y="94" width="228" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="144" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">手写区（脚本永不改动）</text>
  <text x="144" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">app/pages/ · app/components/</text>
  <text x="144" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">app/assets/styles/tokens.css</text>
  <text x="144" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">nuxt.config.ts（marker 之外）</text>
  <text x="144" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">server/ · shared/</text>
  <rect x="270" y="94" width="228" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="384" y="112.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">生成区（脚本完全拥有）</text>
  <text x="384" y="129" text-anchor="middle" font-size="7.5" fill="#C2410C">app/ui/generated/manifest.ts</text>
  <text x="384" y="146.25" text-anchor="middle" font-size="7.5" fill="#C2410C">app/ui/generated/adapter.ts</text>
  <text x="384" y="163.5" text-anchor="middle" font-size="7.5" fill="#C2410C">app/ui/generated/nuxt-ui.config.mjs</text>
  <text x="384" y="180.75" text-anchor="middle" font-size="7.5" fill="#C2410C">app/assets/styles/generated-tokens.css</text>
  <rect x="510" y="94" width="228" height="112" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="624" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">唯一事实来源</text>
  <text x="624" y="129" text-anchor="middle" font-size="7.5" fill="#047857">ui.config.json</text>
  <text x="624" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">两个取值：ui / render</text>
  <text x="624" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">入库、可 review</text>
  <text x="624" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">改它之后必须重跑脚本</text>
  <text x="380" y="228" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">换库的影响范围：一个 UI 库进出一个文件都没有越界</text>
  <rect x="30" y="242" width="104" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="82" y="258" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">会变</text>
  <rect x="140" y="242" width="590" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="435" y="258" text-anchor="middle" font-size="8.5" fill="#334155">生成区 6 个文件 + ui.config.json（共 8 个写入目标）</text>
  <rect x="30" y="272" width="104" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="82" y="288" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">不会变</text>
  <rect x="140" y="272" width="590" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="435" y="288" text-anchor="middle" font-size="8.5" fill="#334155">手写区全部文件：页面、业务组件、手写令牌、nuxt.config.ts 的 marker 之外</text>
  <rect x="30" y="302" width="104" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="82" y="318" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">为什么重要</text>
  <rect x="140" y="302" width="590" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="435" y="318" text-anchor="middle" font-size="8.5" fill="#334155">范围可预测，评审时只看这 8 个文件的 diff 就够了</text>
  <text x="380" y="356" text-anchor="middle" font-size="9.5" fill="#6D28D9">判断一个模板是否真的「可插拔」，看换库那一次 diff 有没有越出手写区就够了</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
