<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">构建矩阵：一个库一条构建线，六种组合一条命令</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「支持多个 UI 库」落到构建系统里，才算真的能交付，而不只是文档上支持</text>
  <text x="380" y="82" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">一个 UI 库 × 两种渲染模式 = 两条构建线，六种组合都能一条命令产出</text>
  <rect x="30" y="96" width="190" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="125" y="113" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">UI 实现层</text>
  <rect x="220" y="96" width="300" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="370" y="113" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">必须特别处理的点</text>
  <rect x="520" y="96" width="240" height="26" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="640" y="113" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">适合的场景</text>
  <rect x="30" y="122" width="190" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="140" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">@app/ui-element</text>
  <rect x="220" y="122" width="300" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="370" y="140" text-anchor="middle" font-size="8.5" fill="#334155">注入 ID 与 z-index；pnpm 处理 dayjs 提升</text>
  <rect x="520" y="122" width="240" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="140" text-anchor="middle" font-size="8.5" fill="#334155">表单密集的中后台</text>
  <rect x="30" y="150" width="190" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="168" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">@app/ui-antd</text>
  <rect x="220" y="150" width="300" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="370" y="168" text-anchor="middle" font-size="8.5" fill="#334155">打开样式提取，避免首屏样式闪烁</text>
  <rect x="520" y="150" width="240" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="168" text-anchor="middle" font-size="8.5" fill="#334155">复杂表格与企业管理台</text>
  <rect x="30" y="178" width="190" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="196" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">@app/ui-nuxtui</text>
  <rect x="220" y="178" width="300" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="370" y="196" text-anchor="middle" font-size="8.5" fill="#334155">根组件需 UApp 包裹；Tailwind 4 走 CSS 导入</text>
  <rect x="520" y="178" width="240" height="28" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="196" text-anchor="middle" font-size="8.5" fill="#334155">内容站、追求原生融合</text>
  <rect x="30" y="206" width="190" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="125" y="224" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">@app/ui-vuetify</text>
  <rect x="220" y="206" width="300" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="370" y="224" text-anchor="middle" font-size="8.5" fill="#334155">模块版本仍偏新，生产需锁死版本</text>
  <rect x="520" y="206" width="240" height="28" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="224" text-anchor="middle" font-size="8.5" fill="#334155">Material 风格产品</text>
  <text x="380" y="268" text-anchor="middle" font-size="10" fill="#1E3A8A">渲染模式两条线：SSR（server preset）与 SSG（prerender），切换只改 Nitro preset 与路由规则</text>
  <rect x="30" y="282" width="226" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="143" y="300.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">CI 矩阵</text>
  <text x="143" y="317" text-anchor="middle" font-size="8" fill="#6D28D9">3 个 UI × 2 个模式</text>
  <text x="143" y="335.4" text-anchor="middle" font-size="8" fill="#6D28D9">并行跑，互不污染</text>
  <text x="143" y="353.8" text-anchor="middle" font-size="8" fill="#6D28D9">失败即定位到组合</text>
  <rect x="268" y="282" width="226" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="300.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">缓存策略</text>
  <text x="381" y="317" text-anchor="middle" font-size="8" fill="#1D4ED8">按组合分目录缓存</text>
  <text x="381" y="335.4" text-anchor="middle" font-size="8" fill="#1D4ED8">node_modules 可复用</text>
  <text x="381" y="353.8" text-anchor="middle" font-size="8" fill="#1D4ED8">只重建对应变体</text>
  <rect x="506" y="282" width="226" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="300.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">产物命名</text>
  <text x="619" y="317" text-anchor="middle" font-size="8" fill="#047857">带库名与模式后缀</text>
  <text x="619" y="335.4" text-anchor="middle" font-size="8" fill="#047857">避免互相覆盖</text>
  <text x="619" y="353.8" text-anchor="middle" font-size="8" fill="#047857">便于回滚到上一版</text>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#B91C1C">不要试图「一次构建带多套库」——那是运行时切换，代价是体积与样式冲突</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
