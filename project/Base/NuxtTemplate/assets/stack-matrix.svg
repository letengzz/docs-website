<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="492" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三维选择与组合兼容矩阵</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">名义 240 种组合，剔除 64 种阻断组合后剩 176 种——这就是「选项要克制」的实际代价</text>
  <rect x="30" y="76" width="220" height="136" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">UI 框架（5 选 1）</text>
  <text x="140" y="111" text-anchor="middle" font-size="8.5" fill="#1D4ED8">无</text>
  <text x="140" y="130.55" text-anchor="middle" font-size="8.5" fill="#1D4ED8">Element Plus</text>
  <text x="140" y="150.1" text-anchor="middle" font-size="8.5" fill="#1D4ED8">Ant Design Vue</text>
  <text x="140" y="169.65" text-anchor="middle" font-size="8.5" fill="#1D4ED8">Nuxt UI</text>
  <text x="140" y="189.2" text-anchor="middle" font-size="8.5" fill="#1D4ED8">Vuetify（实验性）</text>
  <rect x="270" y="76" width="220" height="136" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">CSS 预处理器（4 选 1）</text>
  <text x="380" y="111" text-anchor="middle" font-size="8.5" fill="#6D28D9">无</text>
  <text x="380" y="130.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">Sass</text>
  <text x="380" y="150.1" text-anchor="middle" font-size="8.5" fill="#6D28D9">Less</text>
  <text x="380" y="169.65" text-anchor="middle" font-size="8.5" fill="#6D28D9">Stylus</text>
  <text x="380" y="189.2" text-anchor="middle" font-size="8.5" fill="#6D28D9"></text>
  <rect x="510" y="76" width="220" height="136" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="620" y="94.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">原子化框架（3 选 1）</text>
  <text x="620" y="111" text-anchor="middle" font-size="8.5" fill="#0F766E">无</text>
  <text x="620" y="130.55" text-anchor="middle" font-size="8.5" fill="#0F766E">UnoCSS</text>
  <text x="620" y="150.1" text-anchor="middle" font-size="8.5" fill="#0F766E">Tailwind CSS</text>
  <text x="620" y="169.65" text-anchor="middle" font-size="8.5" fill="#0F766E"></text>
  <text x="620" y="189.2" text-anchor="middle" font-size="8.5" fill="#0F766E"></text>
  <rect x="30" y="230" width="700" height="76" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="248.2" text-anchor="middle" font-size="10.5" fill="#1E293B" font-weight="bold">有效组合怎么算</text>
  <text x="380" y="265" text-anchor="middle" font-size="8.5" fill="#334155">名义：5 × 4 × 3 × 4（渲染模式）= 240 种</text>
  <text x="380" y="284.55" text-anchor="middle" font-size="8.5" fill="#334155">硬阻断：Nuxt UI + UnoCSS（16 种）｜实验性：Vuetify（默认也阻断，48 种）</text>
  <text x="380" y="304.1" text-anchor="middle" font-size="8.5" fill="#334155">有效：240 − 64 = 176 种 → 全矩阵 --dry-run 扫描；模块与工程开关另做单测与抽样</text>
  <text x="60" y="330" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">四条规则示例（完整 12 条见正文）</text>
  <rect x="30" y="344" width="70" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="65" y="360" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">block</text>
  <rect x="108" y="344" width="622" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="122" y="360" text-anchor="start" font-size="8.3" fill="#334155">Nuxt UI + UnoCSS：两套工具类解析器互相覆盖</text>
  <rect x="30" y="374" width="70" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="65" y="390" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">block</text>
  <rect x="108" y="374" width="622" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="122" y="390" text-anchor="start" font-size="8.3" fill="#334155">Vuetify（实验性）：模块仍在 1.0.0-rc 线，默认阻断，可用 --force-experimental 解除</text>
  <rect x="30" y="404" width="70" height="24" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="65" y="420" text-anchor="middle" font-size="8.5" fill="#92400E" font-weight="bold">warn</text>
  <rect x="108" y="404" width="622" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="122" y="420" text-anchor="start" font-size="8.3" fill="#334155">Nuxt UI + Sass / Vuetify + Tailwind：需严格协调样式顺序</text>
  <rect x="30" y="434" width="70" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="65" y="450" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">info</text>
  <rect x="108" y="434" width="622" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="122" y="450" text-anchor="start" font-size="8.3" fill="#334155">Nuxt UI + Tailwind：已随 Nuxt UI 安装，不重复装</text>
  <text x="380" y="476" text-anchor="middle" font-size="9.5" fill="#B91C1C">只有 block 会禁用「初始化项目」按钮；warn 与 info 允许提交但必须写清原因与出路</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
