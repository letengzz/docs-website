<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Nuxt 通用模板全景：一条主线、四层可替换</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">主线是业务代码不动，四层各自可参数化替换；本文档按四层逐个落地并给出验证方式</text>
  <rect x="30" y="76" width="700" height="58" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="11" fill="#1E293B" font-weight="bold">业务代码层（app/pages · app/components · app/composables）</text>
  <text x="380" y="111" text-anchor="middle" font-size="8.5" fill="#334155">只认自家组件名 &lt;XButton&gt; 与自家 composable，完全不知道底层用的是哪套 UI 库</text>
  <line x1="380" y1="134" x2="380" y2="148" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="500" y="145" text-anchor="middle" font-size="8" fill="#6D28D9">依赖方向只向下</text>
  <rect x="30" y="148" width="162" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="111" y="166.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① UI 组件库</text>
  <text x="111" y="183" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Element Plus 2.14</text>
  <text x="111" y="200.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Ant Design Vue 4</text>
  <text x="111" y="217.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Nuxt UI 4.11</text>
  <text x="111" y="234.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Vuetify 3（可选）</text>
  <rect x="206" y="148" width="162" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="287" y="166.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② 设计令牌</text>
  <text x="287" y="183" text-anchor="middle" font-size="7.5" fill="#6D28D9">品牌色 圆角 间距</text>
  <text x="287" y="200.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">语义令牌映射</text>
  <text x="287" y="217.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">明暗主题切换</text>
  <text x="287" y="234.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">变量桥接到组件库</text>
  <rect x="382" y="148" width="162" height="108" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="463" y="166.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 数据与请求</text>
  <text x="463" y="183" text-anchor="middle" font-size="7.5" fill="#047857">useFetch 统一封装</text>
  <text x="463" y="200.25" text-anchor="middle" font-size="7.5" fill="#047857">错误归一与重试</text>
  <text x="463" y="217.5" text-anchor="middle" font-size="7.5" fill="#047857">鉴权头与刷新</text>
  <text x="463" y="234.75" text-anchor="middle" font-size="7.5" fill="#047857">缓存键规范</text>
  <rect x="558" y="148" width="162" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="639" y="166.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">④ 运行时与部署</text>
  <text x="639" y="183" text-anchor="middle" font-size="7.5" fill="#0F766E">Nitro preset</text>
  <text x="639" y="200.25" text-anchor="middle" font-size="7.5" fill="#0F766E">Node 边缘 静态</text>
  <text x="639" y="217.5" text-anchor="middle" font-size="7.5" fill="#0F766E">Docker 与 CI</text>
  <text x="639" y="234.75" text-anchor="middle" font-size="7.5" fill="#0F766E">多环境变量</text>
  <text x="380" y="280" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四层各自可替换：换 UI 库只动第 1 层的一个包，业务代码零改动</text>
  <rect x="30" y="296" width="86" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="73" y="313" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">广度</text>
  <rect x="122" y="296" width="608" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="426" y="313" text-anchor="middle" font-size="8.5" fill="#334155">覆盖需求、脚手架、适配层、令牌、切换工具链、测试门禁、部署交付全链路</text>
  <rect x="30" y="326" width="86" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="73" y="343" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">深度</text>
  <rect x="122" y="326" width="608" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="426" y="343" text-anchor="middle" font-size="8.5" fill="#334155">适配层契约、切换脚本、契约测试与 SSR 水合差异都有真实实现，不是设计稿</text>
  <rect x="30" y="356" width="86" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="73" y="373" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">可验证</text>
  <rect x="122" y="356" width="608" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="426" y="373" text-anchor="middle" font-size="8.5" fill="#334155">每一步都给出可复制命令与预期输出；脚本部分附回归自测，可当 CI 门禁</text>
  <text x="380" y="400" text-anchor="middle" font-size="9.5" fill="#6D28D9">定位：给「同一套业务要交付到多个客户 / 多个技术偏好团队」的场景准备的可参数化基座</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
