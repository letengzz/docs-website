<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="402" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">初始化引擎五阶段流水线：plan → snapshot → apply → install → verify</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">前三阶段不碰依赖，任何一步失败都能回到「初始化前」——这是可回滚的前提</text>
  <rect x="26" y="76" width="132" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="92" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① plan</text>
  <text x="92" y="111" text-anchor="middle" font-size="7" fill="#1D4ED8">读选择</text>
  <text x="92" y="127.1" text-anchor="middle" font-size="7" fill="#1D4ED8">出变更计划</text>
  <text x="92" y="143.2" text-anchor="middle" font-size="7" fill="#1D4ED8">不写任何文件</text>
  <line x1="158" y1="126" x2="170" y2="126" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="170" y="76" width="132" height="100" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="236" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② snapshot</text>
  <text x="236" y="111" text-anchor="middle" font-size="7" fill="#6D28D9">逐文件快照</text>
  <text x="236" y="127.1" text-anchor="middle" font-size="7" fill="#6D28D9">记 existed 标记</text>
  <text x="236" y="143.2" text-anchor="middle" font-size="7" fill="#6D28D9">写入 manifest</text>
  <line x1="302" y1="126" x2="314" y2="126" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="76" width="132" height="100" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">③ apply</text>
  <text x="380" y="111" text-anchor="middle" font-size="7" fill="#B91C1C">删引导器</text>
  <text x="380" y="127.1" text-anchor="middle" font-size="7" fill="#B91C1C">改 marker 区间</text>
  <text x="380" y="143.2" text-anchor="middle" font-size="7" fill="#B91C1C">写 template.config</text>
  <line x1="446" y1="126" x2="458" y2="126" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="458" y="76" width="132" height="100" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="524" y="94.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">④ install</text>
  <text x="524" y="111" text-anchor="middle" font-size="7" fill="#C2410C">spawn 包管理器</text>
  <text x="524" y="127.1" text-anchor="middle" font-size="7" fill="#C2410C">prod / dev 分开</text>
  <text x="524" y="143.2" text-anchor="middle" font-size="7" fill="#C2410C">收敛 lockfile</text>
  <line x1="590" y1="126" x2="602" y2="126" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="602" y="76" width="132" height="100" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="668" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">⑤ verify</text>
  <text x="668" y="111" text-anchor="middle" font-size="7" fill="#047857">12 项断言</text>
  <text x="668" y="127.1" text-anchor="middle" font-size="7" fill="#047857">残留与漂移</text>
  <text x="668" y="143.2" text-anchor="middle" font-size="7" fill="#047857">人类可读报告</text>
  <text x="60" y="202" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">失败策略</text>
  <rect x="30" y="216" width="196" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="128" y="232" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">① 校验失败即退出</text>
  <rect x="234" y="216" width="496" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="250" y="232" text-anchor="start" font-size="8.3" fill="#334155">不写任何文件，仓库保持原样</text>
  <rect x="30" y="246" width="196" height="24" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="128" y="262" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">② 快照不完整即退出</text>
  <rect x="234" y="246" width="496" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="250" y="262" text-anchor="start" font-size="8.3" fill="#334155">没有快照就不允许动文件</text>
  <rect x="30" y="276" width="196" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="128" y="292" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">③ 单文件失败被累积</text>
  <rect x="234" y="276" width="496" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="250" y="292" text-anchor="start" font-size="8.3" fill="#334155">不中断，跑完统一报告（半删最危险）</text>
  <rect x="30" y="306" width="196" height="24" rx="5" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2"/>
  <text x="128" y="322" text-anchor="middle" font-size="8.5" fill="#9A3412" font-weight="bold">④ 失败保留锁与快照</text>
  <rect x="234" y="306" width="496" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="250" y="322" text-anchor="start" font-size="8.3" fill="#334155">用户可重试或回滚，数据不丢</text>
  <rect x="30" y="336" width="196" height="24" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <text x="128" y="352" text-anchor="middle" font-size="8.5" fill="#065F46" font-weight="bold">⑤ 不自动回滚</text>
  <rect x="234" y="336" width="496" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="250" y="352" text-anchor="start" font-size="8.3" fill="#334155">报告事实，由用户决定下一步</text>
  <text x="380" y="386" text-anchor="middle" font-size="9.5" fill="#B91C1C">唯一逐字节必须正确的部分：一个缩进累加的 bug 只会在连跑两次时暴露</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
