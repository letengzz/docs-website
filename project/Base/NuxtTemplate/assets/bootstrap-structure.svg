<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="452" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">引导期骨架：四个区与各自的删除边界</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">前端与服务端引导区整体删除；样式基线与引擎永久保留——这是引擎删除范围的唯一依据</text>
  <rect x="30" y="78" width="336" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="198" y="96.2" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">① 前端引导区</text>
  <text x="198" y="113" text-anchor="middle" font-size="8.5" fill="#B91C1C">app/pages/setup/</text>
  <text x="198" y="132.55" text-anchor="middle" font-size="8.5" fill="#B91C1C">app/components/wizard/</text>
  <text x="198" y="152.1" text-anchor="middle" font-size="8.5" fill="#B91C1C">app/utils/wizard/</text>
  <rect x="280" y="86" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="319" y="99" text-anchor="middle" font-size="7.5" fill="#991B1B" font-weight="bold">初始化时删除</text>
  <rect x="394" y="78" width="336" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="562" y="96.2" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">② 服务端引导区</text>
  <text x="562" y="113" text-anchor="middle" font-size="8.5" fill="#B91C1C">server/api/wizard/</text>
  <text x="562" y="132.55" text-anchor="middle" font-size="8.5" fill="#B91C1C">server/utils/wizard/</text>
  <text x="562" y="152.1" text-anchor="middle" font-size="8.5" fill="#B91C1C">（含 options.json）</text>
  <rect x="644" y="86" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="683" y="99" text-anchor="middle" font-size="7.5" fill="#991B1B" font-weight="bold">初始化时删除</text>
  <rect x="30" y="190" width="336" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="198" y="208.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">③ 样式基线</text>
  <text x="198" y="225" text-anchor="middle" font-size="8.5" fill="#047857">app/assets/styles/tokens.css</text>
  <text x="198" y="244.55" text-anchor="middle" font-size="8.5" fill="#047857">app/assets/styles/base.css</text>
  <text x="198" y="264.1" text-anchor="middle" font-size="8.5" fill="#047857">不随选择变化</text>
  <rect x="280" y="198" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
  <text x="319" y="211" text-anchor="middle" font-size="7.5" fill="#065F46" font-weight="bold">永久保留</text>
  <rect x="394" y="190" width="336" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="562" y="208.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">④ 引擎区</text>
  <text x="562" y="225" text-anchor="middle" font-size="8.5" fill="#047857">scripts/init.mjs</text>
  <text x="562" y="244.55" text-anchor="middle" font-size="8.5" fill="#047857">scripts/verify.mjs</text>
  <text x="562" y="264.1" text-anchor="middle" font-size="8.5" fill="#047857">可重跑 · 可审计</text>
  <rect x="644" y="198" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
  <text x="683" y="211" text-anchor="middle" font-size="7.5" fill="#065F46" font-weight="bold">永久保留</text>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#B91C1C">删除范围是「逐条列举的白名单」，不是通配：目录里多一个文件就整体跳过</text>
  <rect x="30" y="326" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="341" text-anchor="start" font-size="8.5" fill="#334155">① 前端引导区删除后，首页从 /setup 换成业务首页</text>
  <rect x="30" y="352" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="367" text-anchor="start" font-size="8.5" fill="#334155">② 服务端引导区删除后，server/ 只剩示例健康检查</text>
  <rect x="30" y="378" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="393" text-anchor="start" font-size="8.5" fill="#334155">③ 样式基线保留，后续方案在它之上追加入口</text>
  <rect x="30" y="404" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="419" text-anchor="start" font-size="8.5" fill="#334155">④ 引擎保留，用于 --check 漂移检测与 --rollback 回滚</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
