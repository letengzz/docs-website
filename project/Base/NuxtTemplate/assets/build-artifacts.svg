<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="500" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">构建产物形态与 Nitro preset</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">preset 决定产物面向哪个运行时：node-server 是一个服务，static 是一堆文件</text>
  <rect x="30" y="76" width="220" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="140" y="94.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">pnpm dev</text>
  <text x="140" y="111" text-anchor="middle" font-size="8" fill="#1D4ED8">内存中的 dev server</text>
  <text x="140" y="129.4" text-anchor="middle" font-size="8" fill="#1D4ED8">不做 SSR 校验</text>
  <text x="140" y="147.8" text-anchor="middle" font-size="8" fill="#1D4ED8">快，但不能代表生产</text>
  <rect x="270" y="76" width="220" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">pnpm build</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">产出 .output/</text>
  <text x="380" y="129.4" text-anchor="middle" font-size="8" fill="#6D28D9">含 server/index.mjs</text>
  <text x="380" y="147.8" text-anchor="middle" font-size="8" fill="#6D28D9">SSR / SPA / 混合</text>
  <rect x="510" y="76" width="220" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="620" y="94.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">pnpm generate</text>
  <text x="620" y="111" text-anchor="middle" font-size="8" fill="#047857">只产出静态文件</text>
  <text x="620" y="129.4" text-anchor="middle" font-size="8" fill="#047857">public/ 下纯 HTML</text>
  <text x="620" y="147.8" text-anchor="middle" font-size="8" fill="#047857">SSG 站点适用</text>
  <text x="380" y="186" text-anchor="middle" font-size="10.5" fill="#0F172A" font-weight="bold">产物结构（node-server）</text>
  <rect x="30" y="200" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="215" text-anchor="start" font-size="8.3" fill="#334155">.output/server/index.mjs —— 入口，直接 node 它</text>
  <rect x="30" y="226" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="241" text-anchor="start" font-size="8.3" fill="#334155">.output/server/node_modules —— 仅被打入产物的依赖（不含 devDeps）</text>
  <rect x="30" y="252" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="267" text-anchor="start" font-size="8.3" fill="#334155">.output/public/_nuxt/entry.&lt;hash&gt;.js —— 客户端入口（体积重点）</text>
  <rect x="30" y="278" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="293" text-anchor="start" font-size="8.3" fill="#334155">.output/public/_nuxt/&lt;page&gt;.&lt;hash&gt;.js —— 按路由切分的页面 chunk</text>
  <rect x="30" y="304" width="700" height="22" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="44" y="319" text-anchor="start" font-size="8.3" fill="#334155">.output/nitro.json —— preset 与输出路径等元信息</text>
  <text x="60" y="356" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">体积预算（gzip）</text>
  <rect x="30" y="368" width="176" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="118" y="384" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">入口 JS ≤ 120 KB</text>
  <rect x="214" y="368" width="516" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="228" y="384" text-anchor="start" font-size="8.3" fill="#334155">超出多因按需导入没生效或 lodash 全量引入</text>
  <rect x="30" y="398" width="176" height="24" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="118" y="414" text-anchor="middle" font-size="8.5" fill="#5B21B6" font-weight="bold">单页 JS ≤ 60 KB</text>
  <rect x="214" y="398" width="516" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="228" y="414" text-anchor="start" font-size="8.3" fill="#334155">页面里同步 import 了重型图表 / 编辑器</text>
  <rect x="30" y="428" width="176" height="24" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
  <text x="118" y="444" text-anchor="middle" font-size="8.5" fill="#115E59" font-weight="bold">全局 CSS ≤ 60 KB</text>
  <rect x="214" y="428" width="516" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="228" y="444" text-anchor="start" font-size="8.3" fill="#334155">原子化未生效，产出了全量工具类</text>
  <text x="380" y="484" text-anchor="middle" font-size="9.5" fill="#B91C1C">部署前必做：pnpm build &amp;&amp; pnpm preview —— 能拦掉八成「线上白屏」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
