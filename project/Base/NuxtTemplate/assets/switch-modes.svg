<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">三种切换模式：构建时 / 运行时 / 混合</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">区别不在实现难度，而在「代价落在谁身上」——产物体积、类型安全还是交付流程</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">同一个诉求有三种实现位置，成本与能力各不相同</text>
  <rect x="30" y="94" width="226" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="11" fill="#1E3A8A" font-weight="bold">构建时切换</text>
  <text x="143" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">切换 = 改配置 + 重新构建</text>
  <text x="143" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">产物只含一套组件库</text>
  <text x="143" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">体积最小、类型最准</text>
  <text x="143" y="184.2" text-anchor="middle" font-size="8" fill="#1D4ED8">换库需要重跑 CI</text>
  <text x="143" y="202.6" text-anchor="middle" font-size="8" fill="#1D4ED8">本模板默认方案</text>
  <rect x="268" y="94" width="226" height="130" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">运行时切换</text>
  <text x="381" y="129" text-anchor="middle" font-size="8" fill="#C2410C">同一份产物带多套库</text>
  <text x="381" y="147.4" text-anchor="middle" font-size="8" fill="#C2410C">通过开关决定渲染哪套</text>
  <text x="381" y="165.8" text-anchor="middle" font-size="8" fill="#C2410C">演示友好、可灰度</text>
  <text x="381" y="184.2" text-anchor="middle" font-size="8" fill="#C2410C">体积翻倍、样式易冲突</text>
  <text x="381" y="202.6" text-anchor="middle" font-size="8" fill="#C2410C">仅建议做演示壳</text>
  <rect x="506" y="94" width="226" height="130" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">混合模式</text>
  <text x="619" y="129" text-anchor="middle" font-size="8" fill="#047857">构建时定主库</text>
  <text x="619" y="147.4" text-anchor="middle" font-size="8" fill="#047857">运行时只切主题与密度</text>
  <text x="619" y="165.8" text-anchor="middle" font-size="8" fill="#047857">兼顾体积与灵活性</text>
  <text x="619" y="184.2" text-anchor="middle" font-size="8" fill="#047857">令牌层必须全覆盖</text>
  <text x="619" y="202.6" text-anchor="middle" font-size="8" fill="#047857">面向多品牌交付</text>
  <text x="60" y="248" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">四项指标对照</text>
  <rect x="30" y="258" width="160" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="110" y="274" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">指标</text>
  <rect x="190" y="258" width="180" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="280" y="274" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">构建时</text>
  <rect x="370" y="258" width="180" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="460" y="274" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">运行时</text>
  <rect x="550" y="258" width="180" height="24" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="640" y="274" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">混合</text>
  <rect x="30" y="282" width="160" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="298" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">产物体积</text>
  <rect x="190" y="282" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="298" text-anchor="middle" font-size="8.5" fill="#334155">一套库</text>
  <rect x="370" y="282" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="298" text-anchor="middle" font-size="8.5" fill="#334155">N 套库叠加</text>
  <rect x="550" y="282" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="298" text-anchor="middle" font-size="8.5" fill="#334155">一套库</text>
  <rect x="30" y="306" width="160" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="322" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">类型安全</text>
  <rect x="190" y="306" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="322" text-anchor="middle" font-size="8.5" fill="#334155">最好</text>
  <rect x="370" y="306" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="322" text-anchor="middle" font-size="8.5" fill="#334155">需要联合类型</text>
  <rect x="550" y="306" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="322" text-anchor="middle" font-size="8.5" fill="#334155">好</text>
  <rect x="30" y="330" width="160" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="346" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">切换成本</text>
  <rect x="190" y="330" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="346" text-anchor="middle" font-size="8.5" fill="#334155">重跑构建</text>
  <rect x="370" y="330" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="346" text-anchor="middle" font-size="8.5" fill="#334155">改开关</text>
  <rect x="550" y="330" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="346" text-anchor="middle" font-size="8.5" fill="#334155">改令牌配置</text>
  <rect x="30" y="354" width="160" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="370" text-anchor="middle" font-size="8.5" fill="#334155" font-weight="bold">适用场景</text>
  <rect x="190" y="354" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="370" text-anchor="middle" font-size="8.5" fill="#334155">多客户交付</text>
  <rect x="370" y="354" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="370" text-anchor="middle" font-size="8.5" fill="#334155">演示 / 内部对比</text>
  <rect x="550" y="354" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="370" text-anchor="middle" font-size="8.5" fill="#334155">多品牌白标</text>
  <text x="380" y="396" text-anchor="middle" font-size="9.5" fill="#B91C1C">选择纪律：默认构建时切换；需要运行时能力时，只让「不引入新组件库」的维度上运行时</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
