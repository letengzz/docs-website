<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">选择模型：一份 JSON 同时驱动页面、校验与计划</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">options.json 描述「可以选什么」，template.config.json 记录「实际选了什么」——前者是菜单，后者是小票</text>
  <rect x="300" y="76" width="160" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">options.json</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#6D28D9">唯一事实来源</text>
  <text x="380" y="129.4" text-anchor="middle" font-size="8" fill="#6D28D9">候选 + 默认 + 规则</text>
  <line x1="380" y1="138" x2="120" y2="174" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="174" width="180" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="120" y="192.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">页面渲染</text>
  <text x="120" y="209" text-anchor="middle" font-size="7.5" fill="#1D4ED8">分组与控件形态</text>
  <text x="120" y="226.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">由 column / multiple 决定</text>
  <line x1="380" y1="138" x2="380" y2="174" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="290" y="174" width="180" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="192.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">规则校验</text>
  <text x="380" y="209" text-anchor="middle" font-size="7.5" fill="#B91C1C">block / warn / info</text>
  <text x="380" y="226.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">前端即时提示 + 服务端判定</text>
  <line x1="380" y1="138" x2="640" y2="174" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="550" y="174" width="180" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="640" y="192.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">变更计划</text>
  <text x="640" y="209" text-anchor="middle" font-size="7.5" fill="#047857">deps · modules · cssEntries</text>
  <text x="640" y="226.25" text-anchor="middle" font-size="7.5" fill="#047857">deleteFiles 白名单</text>
  <text x="60" y="276" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">三处刻意设计</text>
  <rect x="30" y="290" width="152" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="106" y="306" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">layout 由数据决定</text>
  <rect x="190" y="290" width="540" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="206" y="306" text-anchor="start" font-size="8.3" fill="#334155">column 字段决定渲染到左区还是右区，加分组只改 JSON</text>
  <rect x="30" y="320" width="152" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="106" y="336" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">文件清单显式声明</text>
  <rect x="190" y="320" width="540" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="206" y="336" text-anchor="start" font-size="8.3" fill="#334155">每个选项自带 files，删除范围不靠通配、不靠猜测</text>
  <rect x="30" y="350" width="152" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="106" y="366" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">规则与选项分离</text>
  <rect x="190" y="350" width="540" height="24" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="206" y="366" text-anchor="start" font-size="8.3" fill="#334155">rules 表达「两个选择之间的关系」，塞进任一侧都会让模型失衡</text>
  <text x="380" y="396" text-anchor="middle" font-size="9.5" fill="#6D28D9">初始化后 options.json 随引导器一起删除，交班给 template.config.json</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
