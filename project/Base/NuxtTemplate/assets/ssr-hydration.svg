<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="346" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">SSR 与水合：三个组件库的差异点在哪</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">适配层必须把 ID、z-index、样式注入这三件事统一处理，否则换库当天就会白屏</text>
  <rect x="30" y="80" width="160" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="110" y="98.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">服务端渲染</text>
  <text x="110" y="115" text-anchor="middle" font-size="7.5" fill="#6D28D9">renderToString</text>
  <text x="110" y="132.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">产出首屏 HTML</text>
  <line x1="190" y1="112" x2="224" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="224" y="80" width="160" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="304" y="98.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">HTML + Payload</text>
  <text x="304" y="115" text-anchor="middle" font-size="7.5" fill="#334155">样式内联顺序</text>
  <text x="304" y="132.25" text-anchor="middle" font-size="7.5" fill="#334155">组件 ID 与 z-index</text>
  <line x1="384" y1="112" x2="418" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="418" y="80" width="160" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="498" y="98.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">客户端水合</text>
  <text x="498" y="115" text-anchor="middle" font-size="7.5" fill="#047857">复用 DOM 并接管</text>
  <text x="498" y="132.25" text-anchor="middle" font-size="7.5" fill="#047857">不一致就重渲染</text>
  <line x1="578" y1="112" x2="612" y2="112" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="612" y="80" width="118" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="671" y="98.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">可交互页面</text>
  <text x="671" y="115" text-anchor="middle" font-size="7.5" fill="#0F766E">水合报错即白屏</text>
  <text x="671" y="132.25" text-anchor="middle" font-size="7.5" fill="#0F766E">或交互失效</text>
  <text x="380" y="166" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">组件库的 SSR 差异几乎全部集中在「ID、层级、样式注入顺序」这三点上</text>
  <rect x="30" y="180" width="226" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="198.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">Element Plus</text>
  <text x="143" y="215" text-anchor="middle" font-size="8" fill="#1D4ED8">官方模块自动配 SSR</text>
  <text x="143" y="233.4" text-anchor="middle" font-size="8" fill="#1D4ED8">ID / z-index 注入键</text>
  <text x="143" y="251.8" text-anchor="middle" font-size="8" fill="#1D4ED8">Teleport 组件需 ClientOnly</text>
  <text x="143" y="270.2" text-anchor="middle" font-size="8" fill="#1D4ED8">pnpm 要处理 dayjs 提升</text>
  <rect x="268" y="180" width="226" height="106" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="381" y="198.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">Ant Design Vue</text>
  <text x="381" y="215" text-anchor="middle" font-size="8" fill="#047857">官方模块按需导入</text>
  <text x="381" y="233.4" text-anchor="middle" font-size="8" fill="#047857">extractStyle 需手动开</text>
  <text x="381" y="251.8" text-anchor="middle" font-size="8" fill="#047857">解决样式闪烁与水合</text>
  <text x="381" y="270.2" text-anchor="middle" font-size="8" fill="#047857">图标包要单独注册</text>
  <rect x="506" y="180" width="226" height="106" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="619" y="198.2" text-anchor="middle" font-size="10.5" fill="#115E59" font-weight="bold">Nuxt UI</text>
  <text x="619" y="215" text-anchor="middle" font-size="8" fill="#0F766E">需 UApp 包裹根组件</text>
  <text x="619" y="233.4" text-anchor="middle" font-size="8" fill="#0F766E">Tailwind 4 走 CSS 导入</text>
  <text x="619" y="251.8" text-anchor="middle" font-size="8" fill="#0F766E">要求 Nuxt 4.1 以上</text>
  <text x="619" y="270.2" text-anchor="middle" font-size="8" fill="#0F766E">主题用 CSS 变量</text>
  <text x="380" y="308" text-anchor="middle" font-size="9.5" fill="#065F46">验证方式：curl 首屏 HTML 看结构与样式是否齐全，再看控制台有无 hydration mismatch</text>
  <text x="380" y="330" text-anchor="middle" font-size="9.5" fill="#B91C1C">不要用「本地看着正常」当结论——水合问题常常只在生产构建下暴露</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
