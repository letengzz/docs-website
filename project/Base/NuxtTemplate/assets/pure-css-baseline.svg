<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">纯 CSS 渲染基线：三层与三条纪律</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">不引任何样式框架：令牌定义语义，基础层管重置与排版，布局层只服务选择页</text>
  <rect x="30" y="78" width="420" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="240" y="96.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">令牌层 tokens.css</text>
  <text x="240" y="113" text-anchor="middle" font-size="8.5" fill="#6D28D9">语义色 · 间距刻度 · 圆角 · 字号</text>
  <text x="240" y="132.55" text-anchor="middle" font-size="8.5" fill="#6D28D9">唯一颜色来源，业务只引用语义名</text>
  <line x1="240" y1="148" x2="240" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="162" width="420" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="240" y="180.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">基础层 base.css</text>
  <text x="240" y="197" text-anchor="middle" font-size="8.5" fill="#1D4ED8">reset + 排版 + 表单基础样式</text>
  <text x="240" y="216.55" text-anchor="middle" font-size="8.5" fill="#1D4ED8">控件是原生元素，不引组件库</text>
  <line x1="240" y1="232" x2="240" y2="246" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="246" width="420" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="240" y="264.2" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="bold">布局层 wizard.css</text>
  <text x="240" y="281" text-anchor="middle" font-size="8.5" fill="#B45309">三区栅格与卡片样式</text>
  <text x="240" y="300.55" text-anchor="middle" font-size="8.5" fill="#B45309">整体属于引导期资产，随页面一起删</text>
  <rect x="474" y="78" width="256" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="602" y="96.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">为什么令牌层必须存在</text>
  <text x="602" y="113" text-anchor="middle" font-size="8" fill="#334155">换方案时语义名不变，业务组件零改动</text>
  <rect x="474" y="162" width="256" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="602" y="180.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">为什么不用 !important</text>
  <text x="602" y="197" text-anchor="middle" font-size="8" fill="#334155">权重可控，接入组件库时才覆盖得动</text>
  <rect x="474" y="246" width="256" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="602" y="264.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">为什么布局层要单独成文件</text>
  <text x="602" y="281" text-anchor="middle" font-size="8" fill="#334155">在页面组件内 import，删除页面即删除样式引用</text>
  <line x1="30" y1="344" x2="730" y2="344" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="364" text-anchor="middle" font-size="9.5" fill="#B91C1C">三条纪律：不用 !important · 不写行内布局样式 · wizard.css 不进全局 css 数组</text>
  <text x="380" y="384" text-anchor="middle" font-size="9.5" fill="#065F46">判据：删掉选择页后，nuxt.config.ts 无需任何改动，构建仍通过</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
