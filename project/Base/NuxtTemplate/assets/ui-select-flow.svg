<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="366" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">切换脚本五步：幂等、可校验、可回溯</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把「约定」变成「可执行断言」，是这份模板里最能省下返工成本的一件事</text>
  <rect x="30" y="86" width="132" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="96" y="104.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">① 读配置</text>
  <text x="96" y="121" text-anchor="middle" font-size="7.5" fill="#6D28D9">ui.config.json</text>
  <text x="96" y="138.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">库 / 模式 / 主题</text>
  <line x1="162" y1="128" x2="176" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="176" y="86" width="132" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="242" y="104.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 校验取值</text>
  <text x="242" y="121" text-anchor="middle" font-size="7.5" fill="#1D4ED8">白名单之外</text>
  <text x="242" y="138.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">直接非 0 退出</text>
  <line x1="308" y1="128" x2="322" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="322" y="86" width="132" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="388" y="104.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">③ 改 marker 区间</text>
  <text x="388" y="121" text-anchor="middle" font-size="7.5" fill="#047857">区间外一个</text>
  <text x="388" y="138.25" text-anchor="middle" font-size="7.5" fill="#047857">字符都不碰</text>
  <line x1="454" y1="128" x2="468" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="468" y="86" width="132" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="534" y="104.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 产出固定文件</text>
  <text x="534" y="121" text-anchor="middle" font-size="7.5" fill="#0F766E">纯函数结果</text>
  <text x="534" y="138.25" text-anchor="middle" font-size="7.5" fill="#0F766E">重复跑字节不变</text>
  <line x1="600" y1="128" x2="614" y2="128" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="614" y="86" width="132" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="680" y="104.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">⑤ --check 门禁</text>
  <text x="680" y="121" text-anchor="middle" font-size="7.5" fill="#C2410C">不一致即报红</text>
  <text x="680" y="138.25" text-anchor="middle" font-size="7.5" fill="#C2410C">可进 CI</text>
  <text x="380" y="192" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">脚本的定位：把「换 UI 库」从一次人工重构，降级成一次配置变更 + 一次构建</text>
  <rect x="30" y="208" width="226" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="143" y="226.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">幂等</text>
  <text x="143" y="243" text-anchor="middle" font-size="8" fill="#047857">同一条命令跑两遍</text>
  <text x="143" y="261.4" text-anchor="middle" font-size="8" fill="#047857">git status 必须干净</text>
  <text x="143" y="279.8" text-anchor="middle" font-size="8" fill="#047857">靠「产物是取值的纯函数」</text>
  <rect x="268" y="208" width="226" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="381" y="226.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">可校验</text>
  <text x="381" y="243" text-anchor="middle" font-size="8" fill="#1D4ED8">--check 逐字节比对</text>
  <text x="381" y="261.4" text-anchor="middle" font-size="8" fill="#1D4ED8">手改生成物会被抓出</text>
  <text x="381" y="279.8" text-anchor="middle" font-size="8" fill="#1D4ED8">可当 CI 门禁使用</text>
  <rect x="506" y="208" width="226" height="90" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="226.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">可回溯</text>
  <text x="619" y="243" text-anchor="middle" font-size="8" fill="#6D28D9">ui.config.json 入库</text>
  <text x="619" y="261.4" text-anchor="middle" font-size="8" fill="#6D28D9">谁在什么时候换过库</text>
  <text x="619" y="279.8" text-anchor="middle" font-size="8" fill="#6D28D9">一眼可见、可 review</text>
  <text x="380" y="326" text-anchor="middle" font-size="9.5" fill="#B91C1C">反面做法：把「换库」写成一份 wiki 步骤清单——清单会过期，脚本不会</text>
  <text x="380" y="348" text-anchor="middle" font-size="9.5" fill="#065F46">另一条硬约束：脚本只写 marker 区间，业务自己的文件永不覆盖</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
