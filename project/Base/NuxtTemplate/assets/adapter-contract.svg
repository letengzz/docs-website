<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="378" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">契约的三组能力与措辞标准</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">把 props 设计成业务语义，是适配层最容易被做错、也最难返工的一步</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">契约层只暴露业务真正需要的三类能力，不暴露组件库的 API 形状</text>
  <rect x="30" y="94" width="226" height="116" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="143" y="112.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">① 声明式组件</text>
  <text x="143" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">XButton / XInput / XTable</text>
  <text x="143" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">XModal / XForm / XSelect</text>
  <text x="143" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">用 props 表达业务语义</text>
  <text x="143" y="184.2" text-anchor="middle" font-size="8" fill="#1D4ED8">不用透传组件库私有 props</text>
  <rect x="268" y="94" width="226" height="116" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="381" y="112.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">② 命令式 API</text>
  <text x="381" y="129" text-anchor="middle" font-size="8" fill="#6D28D9">toast.success / error</text>
  <text x="381" y="147.4" text-anchor="middle" font-size="8" fill="#6D28D9">confirm / prompt</text>
  <text x="381" y="165.8" text-anchor="middle" font-size="8" fill="#6D28D9">loading 遮罩</text>
  <text x="381" y="184.2" text-anchor="middle" font-size="8" fill="#6D28D9">三库实现方式完全不同</text>
  <rect x="506" y="94" width="226" height="116" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="619" y="112.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">③ 环境与令牌</text>
  <text x="619" y="129" text-anchor="middle" font-size="8" fill="#047857">主题模式（light/dark）</text>
  <text x="619" y="147.4" text-anchor="middle" font-size="8" fill="#047857">语义色与尺寸令牌</text>
  <text x="619" y="165.8" text-anchor="middle" font-size="8" fill="#047857">语言与本地化文本</text>
  <text x="619" y="184.2" text-anchor="middle" font-size="8" fill="#047857">组件默认尺寸与层级</text>
  <text x="380" y="232" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">判断标准：接口措辞来自业务，而不是来自框架</text>
  <rect x="30" y="246" width="346" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="203" y="264.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">来自框架的措辞</text>
  <text x="203" y="281" text-anchor="middle" font-size="8" fill="#B91C1C">XTable 暴露 :columns 直传 Element 的列结构</text>
  <text x="203" y="299.4" text-anchor="middle" font-size="8" fill="#B91C1C">XModal 暴露 el-dialog 的 before-close</text>
  <rect x="388" y="246" width="346" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="561" y="264.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">来自业务的措辞</text>
  <text x="561" y="281" text-anchor="middle" font-size="8" fill="#047857">XTable 只接受 rows + 列定义（label / field / width）</text>
  <text x="561" y="299.4" text-anchor="middle" font-size="8" fill="#047857">XModal 只接受 title / open / onConfirm</text>
  <text x="380" y="340" text-anchor="middle" font-size="9.5" fill="#B91C1C">代价要讲清楚：适配层要重写一遍属性映射，换来的是业务层永远不跟组件库绑定</text>
  <text x="380" y="362" text-anchor="middle" font-size="9.5" fill="#64748B">换句话说，适配层是「一次性成本」，绑定是「每次升级都要付的成本」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
