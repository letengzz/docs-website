<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">生成器形态对照：外部 CLI / 云端站点 / 模板内自举</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">三种形态的差别在「谁提供选择界面」与「选择模型存在几处」，不在产物本身</text>
  <rect x="30" y="76" width="220" height="132" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="140" y="94.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">A. 外部 CLI 生成器</text>
  <text x="140" y="111" text-anchor="middle" font-size="8" fill="#334155">装 CLI 再跑命令</text>
  <text x="140" y="129.4" text-anchor="middle" font-size="8" fill="#334155">命令行问答</text>
  <text x="140" y="147.8" text-anchor="middle" font-size="8" fill="#334155">选择模型与模板分离</text>
  <text x="140" y="166.2" text-anchor="middle" font-size="8" fill="#334155">断网不可用</text>
  <text x="140" y="184.6" text-anchor="middle" font-size="8" fill="#334155">最坏：生成完跑不起来</text>
  <rect x="270" y="76" width="220" height="132" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">B. 云端站点生成器</text>
  <text x="380" y="111" text-anchor="middle" font-size="8" fill="#B45309">打开网页填表下载</text>
  <text x="380" y="129.4" text-anchor="middle" font-size="8" fill="#B45309">需要额外基础设施</text>
  <text x="380" y="147.8" text-anchor="middle" font-size="8" fill="#B45309">站点与模板版本易漂移</text>
  <text x="380" y="166.2" text-anchor="middle" font-size="8" fill="#B45309">必须联网</text>
  <text x="380" y="184.6" text-anchor="middle" font-size="8" fill="#B45309">适合面向全网的公开项目</text>
  <rect x="510" y="76" width="220" height="132" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="620" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">C. 模板内自举（本项目）</text>
  <text x="620" y="111" text-anchor="middle" font-size="8" fill="#047857">clone 后 pnpm dev</text>
  <text x="620" y="129.4" text-anchor="middle" font-size="8" fill="#047857">网页表单实时提示</text>
  <text x="620" y="147.8" text-anchor="middle" font-size="8" fill="#047857">模型与代码同源</text>
  <text x="620" y="166.2" text-anchor="middle" font-size="8" fill="#047857">Nuxt 自带服务端</text>
  <text x="620" y="184.6" text-anchor="middle" font-size="8" fill="#047857">最坏：选择页删不干净</text>
  <text x="380" y="228" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">差别不在「生成了什么」，而在「谁提供选择界面」与「选择模型存在几处」</text>
  <text x="60" y="254" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">四个判断维度</text>
  <rect x="30" y="264" width="120" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="90" y="279" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">维度</text>
  <rect x="150" y="264" width="200" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="250" y="279" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">A 外部 CLI</text>
  <rect x="350" y="264" width="200" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="450" y="279" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">B 云端站点</text>
  <rect x="550" y="264" width="180" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.1"/>
  <text x="640" y="279" text-anchor="middle" font-size="8.5" fill="#1E3A8A" font-weight="bold">C 模板内自举</text>
  <rect x="30" y="290" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="306" text-anchor="middle" font-size="7.8" fill="#1E293B" font-weight="bold">用户第一步</text>
  <rect x="150" y="290" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="306" text-anchor="middle" font-size="7.8" fill="#334155">装 CLI → 跑命令 → 拿到目录</text>
  <rect x="350" y="290" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="306" text-anchor="middle" font-size="7.8" fill="#334155">打开网页 → 填表 → 下 zip</text>
  <rect x="550" y="290" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="306" text-anchor="middle" font-size="7.8" fill="#334155">clone → pnpm dev → 打开网页</text>
  <rect x="30" y="314" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="330" text-anchor="middle" font-size="7.8" fill="#1E293B" font-weight="bold">服务器成本</text>
  <rect x="150" y="314" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="330" text-anchor="middle" font-size="7.8" fill="#334155">一个 npm 包 + 发布流水线</text>
  <rect x="350" y="314" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="330" text-anchor="middle" font-size="7.8" fill="#334155">一台服务器 + 打包服务</text>
  <rect x="550" y="314" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="330" text-anchor="middle" font-size="7.8" fill="#334155">无（dev server 即服务端）</text>
  <rect x="30" y="338" width="120" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="354" text-anchor="middle" font-size="7.8" fill="#1E293B" font-weight="bold">模型一致性</text>
  <rect x="150" y="338" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="354" text-anchor="middle" font-size="7.8" fill="#334155">两处，容易漂移</text>
  <rect x="350" y="338" width="200" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="354" text-anchor="middle" font-size="7.8" fill="#334155">两处，版本要对齐</text>
  <rect x="550" y="338" width="180" height="24" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="354" text-anchor="middle" font-size="7.8" fill="#334155">一处，与代码同源</text>
  <rect x="30" y="362" width="120" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="378" text-anchor="middle" font-size="7.8" fill="#1E293B" font-weight="bold">最坏情况</text>
  <rect x="150" y="362" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="250" y="378" text-anchor="middle" font-size="7.8" fill="#334155">生成完才发现跑不起来</text>
  <rect x="350" y="362" width="200" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="378" text-anchor="middle" font-size="7.8" fill="#334155">站点与模板版本不一致</text>
  <rect x="550" y="362" width="180" height="24" rx="0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="378" text-anchor="middle" font-size="7.8" fill="#334155">选择页残留删不干净</text>
  <text x="380" y="404" text-anchor="middle" font-size="9.5" fill="#065F46">结论：团队内部模板选 C——把服务器交给 Nuxt 自带的 Nitro，把复杂度集中在一次性的引擎里</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
