<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">Nuxt 通用模板的生命周期：从零依赖到可上线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">引导期只有 Nuxt 一个依赖；选择页自举完成初始化后，模板把自己变成你所选的项目</text>
  <rect x="26" y="76" width="132" height="88" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="92" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">① 引导期</text>
  <text x="92" y="111" text-anchor="middle" font-size="7" fill="#334155">只有 nuxt 一个依赖</text>
  <text x="92" y="127.1" text-anchor="middle" font-size="7" fill="#334155">纯 CSS 渲染</text>
  <text x="92" y="143.2" text-anchor="middle" font-size="7" fill="#334155">首页 = /setup</text>
  <line x1="158" y1="120" x2="170" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="170" y="76" width="132" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="236" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">② 选择技术栈</text>
  <text x="236" y="111" text-anchor="middle" font-size="7" fill="#1D4ED8">左侧技术栈三维</text>
  <text x="236" y="127.1" text-anchor="middle" font-size="7" fill="#1D4ED8">右侧 Nuxt 配置</text>
  <text x="236" y="143.2" text-anchor="middle" font-size="7" fill="#1D4ED8">冲突即时拦截</text>
  <line x1="302" y1="120" x2="314" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="76" width="132" height="88" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">③ 初始化引擎</text>
  <text x="380" y="111" text-anchor="middle" font-size="7" fill="#6D28D9">五阶段流水线</text>
  <text x="380" y="127.1" text-anchor="middle" font-size="7" fill="#6D28D9">自删除引导器</text>
  <text x="380" y="143.2" text-anchor="middle" font-size="7" fill="#6D28D9">装依赖 · 可回滚</text>
  <line x1="446" y1="120" x2="458" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="458" y="76" width="132" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="524" y="94.2" text-anchor="middle" font-size="9.5" fill="#115E59" font-weight="bold">④ 应用基线</text>
  <text x="524" y="111" text-anchor="middle" font-size="7" fill="#0F766E">路由 · 状态 · 请求</text>
  <text x="524" y="127.1" text-anchor="middle" font-size="7" fill="#0F766E">样式入口排序</text>
  <text x="524" y="143.2" text-anchor="middle" font-size="7" fill="#0F766E">令牌层保留</text>
  <line x1="590" y1="120" x2="602" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="602" y="76" width="132" height="88" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="668" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">⑤ 交付</text>
  <text x="668" y="111" text-anchor="middle" font-size="7" fill="#047857">构建 · 部署 · 验收</text>
  <text x="668" y="127.1" text-anchor="middle" font-size="7" fill="#047857">四层门禁</text>
  <text x="668" y="143.2" text-anchor="middle" font-size="7" fill="#047857">可复现可回滚</text>
  <text x="60" y="190" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">初始化是唯一的分界线</text>
  <rect x="30" y="202" width="336" height="78" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="198" y="220.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">引导期资产（初始化时删除）</text>
  <text x="198" y="237" text-anchor="middle" font-size="8" fill="#B91C1C">app/pages/setup · app/components/wizard</text>
  <text x="198" y="255.4" text-anchor="middle" font-size="8" fill="#B91C1C">server/api/wizard · app/utils/wizard</text>
  <text x="198" y="273.8" text-anchor="middle" font-size="8" fill="#B91C1C">app/assets/styles/wizard.css</text>
  <rect x="394" y="202" width="336" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="562" y="220.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">产物资产（永久保留）</text>
  <text x="562" y="237" text-anchor="middle" font-size="8" fill="#047857">app/pages · app/components · server/api</text>
  <text x="562" y="255.4" text-anchor="middle" font-size="8" fill="#047857">tokens.css · base.css · 所选方案入口</text>
  <text x="562" y="273.8" text-anchor="middle" font-size="8" fill="#047857">scripts/init.mjs · scripts/verify.mjs</text>
  <line x1="30" y1="300" x2="730" y2="300" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="30" y="316" width="166" height="46" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="113" y="334" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">默认零依赖</text>
  <text x="113" y="350" text-anchor="middle" font-size="7.5" fill="#475569">选之前不装任何 UI / 样式库</text>
  <rect x="206" y="316" width="166" height="46" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="289" y="334" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">选择留痕</text>
  <text x="289" y="350" text-anchor="middle" font-size="7.5" fill="#475569">template.config.json 记录选择快照</text>
  <rect x="382" y="316" width="166" height="46" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="465" y="334" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">产物可复现</text>
  <text x="465" y="350" text-anchor="middle" font-size="7.5" fill="#475569">同选择同版本 = 逐字节相同产物</text>
  <rect x="558" y="316" width="166" height="46" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="641" y="334" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">门禁可执行</text>
  <text x="641" y="350" text-anchor="middle" font-size="7.5" fill="#475569">残留 / 漂移 / 体积都有脚本断言</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
