<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="416" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">设计令牌三层桥接：一处改动，三层透传</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">令牌层是「换 UI 库不换外观」的关键——没有它，换库必然带来一次视觉回归</text>
  <rect x="30" y="84" width="700" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="102.2" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">① 品牌令牌：原始值，唯一事实来源</text>
  <text x="380" y="119" text-anchor="middle" font-size="8.5" fill="#6D28D9">--brand-500: #2563EB · --radius-md: 8px · --space-4: 16px</text>
  <line x1="380" y1="142" x2="380" y2="166" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="166" width="700" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="184.2" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">② 语义令牌：业务与组件都只认这一层</text>
  <text x="380" y="201" text-anchor="middle" font-size="8.5" fill="#1D4ED8">--ui-color-primary · --ui-radius-control · --ui-space-gutter · --ui-font-body</text>
  <line x1="380" y1="224" x2="380" y2="248" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="248" width="700" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="266.2" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">③ 组件库变量：各库自己的命名体系</text>
  <text x="380" y="283" text-anchor="middle" font-size="8.5" fill="#047857">Element --el-color-primary · Ant token.colorPrimary · Nuxt UI --ui-primary</text>
  <text x="380" y="328" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">换品牌色只改第 ① 层一处，三层自动透传；组件库换了，第 ③ 层的适配文件跟着换</text>
  <rect x="30" y="344" width="230" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="145" y="361" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">为什么不让业务直接用组件库变量</text>
  <rect x="266" y="344" width="464" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="498" y="361" text-anchor="middle" font-size="8.5" fill="#334155">业务一旦写 var(--el-color-primary)，换库就等于全量替换，前面的适配层白做</text>
  <rect x="30" y="374" width="230" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="145" y="391" text-anchor="middle" font-size="8.5" fill="#1E293B" font-weight="bold">为什么令牌要做成三层</text>
  <rect x="266" y="374" width="464" height="26" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="498" y="391" text-anchor="middle" font-size="8.5" fill="#334155">品牌要表达「我们是谁」，语义要表达「这里是什么」，组件库只表达「它怎么实现」</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
