<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="432" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">分层定位：业务层 / 后台骨架层 / 基线层</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">本模板只消费初始化产物，不修改 NuxtTemplate 的任何文件</text>
  <rect x="30" y="76" width="460" height="74" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="260" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">业务层 · 你自己写的部分</text>
  <text x="260" y="111" text-anchor="middle" font-size="8" fill="#047857">仪表盘 / 用户管理 / 订单管理 / 各业务页面……</text>
  <text x="260" y="129.4" text-anchor="middle" font-size="8" fill="#047857">只依赖适配层组件与 useAuth 等骨架能力，不直接 import 任何 UI 框架</text>
  <rect x="30" y="176" width="460" height="102" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="260" y="194.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">后台骨架层 · 本模板交付的部分</text>
  <text x="260" y="211" text-anchor="middle" font-size="8" fill="#6D28D9">双布局：default（侧边栏 + 顶栏）/ auth（居中卡片）</text>
  <text x="260" y="229.4" text-anchor="middle" font-size="8" fill="#6D28D9">菜单单一来源 config/menu.ts → 侧边栏 + 面包屑 + 重定向</text>
  <text x="260" y="247.8" text-anchor="middle" font-size="8" fill="#6D28D9">登录页 + useAuth + middleware/auth.ts 路由守卫</text>
  <text x="260" y="266.2" text-anchor="middle" font-size="8" fill="#6D28D9">适配层 app/ui-impl/（在 components/ 之外）：UiButton / UiInput …</text>
  <rect x="30" y="294" width="460" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="260" y="312.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">基线层 · NuxtTemplate 初始化产物</text>
  <text x="260" y="329" text-anchor="middle" font-size="8" fill="#1D4ED8">所选技术栈（UI 框架 / 预处理器 / 原子化 / 渲染模式）</text>
  <text x="260" y="347.4" text-anchor="middle" font-size="8" fill="#1D4ED8">template.config.json：选择快照，本模板读取的唯一事实</text>
  <line x1="260" y1="294" x2="260" y2="280" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="312" y="290" text-anchor="start" font-size="8" fill="#2563EB" font-weight="bold">读取（只读）</text>
  <line x1="260" y1="176" x2="260" y2="150" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="310" y="167" text-anchor="start" font-size="8" fill="#7C3AED" font-weight="bold">承接</text>
  <rect x="520" y="76" width="210" height="174" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="625" y="94.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">三条硬约束</text>
  <text x="625" y="111" text-anchor="middle" font-size="8" fill="#B91C1C">① 不改 NuxtTemplate：</text>
  <text x="625" y="129.4" text-anchor="middle" font-size="8" fill="#B91C1C">   选择页 / 引擎零改动</text>
  <text x="625" y="147.8" text-anchor="middle" font-size="8" fill="#B91C1C"></text>
  <text x="625" y="166.2" text-anchor="middle" font-size="8" fill="#B91C1C">② 骨架代码不 import</text>
  <text x="625" y="184.6" text-anchor="middle" font-size="8" fill="#B91C1C">   任何具体 UI 框架</text>
  <text x="625" y="203" text-anchor="middle" font-size="8" fill="#B91C1C"></text>
  <text x="625" y="221.4" text-anchor="middle" font-size="8" fill="#B91C1C">③ 没选 UI 框架也必须可用</text>
  <text x="625" y="239.8" text-anchor="middle" font-size="8" fill="#B91C1C">   （纯 CSS 兜底实现）</text>
  <rect x="520" y="270" width="210" height="136" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="625" y="288.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">反模式（都不要做）</text>
  <text x="625" y="305" text-anchor="middle" font-size="8" fill="#B45309">· fork 三份模板分别维护</text>
  <text x="625" y="323.4" text-anchor="middle" font-size="8" fill="#B45309"></text>
  <text x="625" y="341.8" text-anchor="middle" font-size="8" fill="#B45309">· 运行时 import 全部实现</text>
  <text x="625" y="360.2" text-anchor="middle" font-size="8" fill="#B45309">  （体积与首屏双输）</text>
  <text x="625" y="378.6" text-anchor="middle" font-size="8" fill="#B45309"></text>
  <text x="625" y="397" text-anchor="middle" font-size="8" fill="#B45309">· 骨架页面直接写 el-button / a-button</text>
  <text x="380" y="412" text-anchor="middle" font-size="9.5" fill="#1E3A8A">一句话定位：NuxtTemplate 交付「干净的基线工程」，本模板交付「盖在基线上的后台骨架」，边界是 template.config.json</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
