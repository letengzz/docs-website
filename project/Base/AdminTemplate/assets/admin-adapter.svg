<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="444" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">技术栈适配层：构建期 alias 映射到唯一实现</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">骨架代码只认 Ui* 适配名，具体框架由 template.config.json 在构建期决定</text>
  <rect x="30" y="150" width="160" height="166" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="110" y="168.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">骨架与业务代码</text>
  <text x="110" y="185" text-anchor="middle" font-size="8" fill="#047857">layouts / pages /</text>
  <text x="110" y="203.4" text-anchor="middle" font-size="8" fill="#047857">components/admin/</text>
  <text x="110" y="221.8" text-anchor="middle" font-size="8" fill="#047857">只写 &lt;UiButton&gt;</text>
  <text x="110" y="240.2" text-anchor="middle" font-size="8" fill="#047857">&lt;UiInput&gt; 这类</text>
  <text x="110" y="258.6" text-anchor="middle" font-size="8" fill="#047857">适配组件名，</text>
  <text x="110" y="277" text-anchor="middle" font-size="8" fill="#047857">永不出现框架</text>
  <text x="110" y="295.4" text-anchor="middle" font-size="8" fill="#047857">真实标签</text>
  <rect x="260" y="112" width="200" height="216" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="360" y="130.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">适配层 app/ui-impl/</text>
  <text x="360" y="147" text-anchor="middle" font-size="8" fill="#6D28D9">UiButton · UiInput · UiForm</text>
  <text x="360" y="165.4" text-anchor="middle" font-size="8" fill="#6D28D9">UiMenu · UiDropdown</text>
  <text x="360" y="183.8" text-anchor="middle" font-size="8" fill="#6D28D9">UiMessage · UiTable</text>
  <text x="360" y="202.2" text-anchor="middle" font-size="8" fill="#6D28D9"></text>
  <text x="360" y="220.6" text-anchor="middle" font-size="8" fill="#6D28D9">每个组件一个目录 + 一份实现：</text>
  <text x="360" y="239" text-anchor="middle" font-size="8" fill="#6D28D9">element-plus/Button.vue</text>
  <text x="360" y="257.4" text-anchor="middle" font-size="8" fill="#6D28D9">antd/Button.vue · nuxtui/Button.vue</text>
  <text x="360" y="275.8" text-anchor="middle" font-size="8" fill="#6D28D9">vuetify/Button.vue</text>
  <text x="360" y="294.2" text-anchor="middle" font-size="8" fill="#6D28D9">plain/Button.vue（兜底）</text>
  <text x="360" y="312.6" text-anchor="middle" font-size="8" fill="#6D28D9">（刻意放在 components/ 之外）</text>
  <line x1="190" y1="216" x2="260" y2="216" stroke="#059669" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="225" y="211" text-anchor="middle" font-size="7.5" fill="#64748B">只用适配名</text>
  <rect x="530" y="76" width="200" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="630" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">构建期 alias 决定实现</text>
  <text x="630" y="111" text-anchor="middle" font-size="8" fill="#1D4ED8">nuxt.config.ts 读 template.config.json</text>
  <rect x="530" y="152" width="200" height="32" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="630" y="170.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">选 Element Plus</text>
  <line x1="460" y1="192" x2="530" y2="168" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="194" width="200" height="32" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="630" y="212.2" text-anchor="middle" font-size="9" fill="#3730A3" font-weight="bold">选 Ant Design Vue</text>
  <line x1="460" y1="201" x2="530" y2="210" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="236" width="200" height="32" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="630" y="254.2" text-anchor="middle" font-size="9" fill="#115E59" font-weight="bold">选 Nuxt UI</text>
  <line x1="460" y1="210" x2="530" y2="252" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="278" width="200" height="32" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="630" y="296.2" text-anchor="middle" font-size="9" fill="#155E75" font-weight="bold">选 Vuetify</text>
  <line x1="460" y1="219" x2="530" y2="294" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="530" y="320" width="200" height="32" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="630" y="338.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">没选（兜底）</text>
  <line x1="460" y1="228" x2="530" y2="336" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="630" y="372" text-anchor="middle" font-size="8.5" fill="#64748B">编译进产物的只有所选框架的那一个实现文件</text>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">验收判据：产物里 grep 不到未选框架的 import——构建期切换，不是运行时判断</text>
  <text x="380" y="424" text-anchor="middle" font-size="9.5" fill="#B91C1C">为什么不用 &lt;component :is&gt; 运行时切换：五套实现全部进产物，体积与首屏都为没用的框架买单</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
