<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="434" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">初始化流程：从 NuxtTemplate 到后台骨架</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">前 3 步交给 NuxtTemplate，本模板从第 4 步接手</text>
  <rect x="30" y="76" width="132" height="84" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="94.2" text-anchor="middle" font-size="9" fill="#1E293B" font-weight="bold">第 1 步 · 拿到基线</text>
  <text x="96" y="111" text-anchor="middle" font-size="7.5" fill="#334155">clone NuxtTemplate</text>
  <text x="96" y="128.25" text-anchor="middle" font-size="7.5" fill="#334155">pnpm install</text>
  <text x="96" y="145.5" text-anchor="middle" font-size="7.5" fill="#334155">pnpm dev</text>
  <line x1="162" y1="118" x2="172" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="172" y="76" width="132" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="238" y="94.2" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">第 2 步 · 选择页</text>
  <text x="238" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">打开 /setup</text>
  <text x="238" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">选 UI 框架 / 预处理器</text>
  <text x="238" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">选原子化 / 渲染模式</text>
  <line x1="304" y1="118" x2="314" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="314" y="76" width="132" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">第 3 步 · 初始化</text>
  <text x="380" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">点「初始化项目」</text>
  <text x="380" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">五阶段引擎跑完</text>
  <text x="380" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">引导器自删干净</text>
  <line x1="446" y1="118" x2="456" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="456" y="76" width="132" height="84" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="522" y="94.2" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">第 4 步 · 叠加骨架</text>
  <text x="522" y="111" text-anchor="middle" font-size="7.5" fill="#047857">按 ③④⑤ 添加</text>
  <text x="522" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">适配层 / 布局 / 登录</text>
  <text x="522" y="145.5" text-anchor="middle" font-size="7.5" fill="#047857">追加 admin 配置区间</text>
  <line x1="588" y1="118" x2="598" y2="118" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="598" y="76" width="132" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="664" y="94.2" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">第 5 步 · 验收</text>
  <text x="664" y="111" text-anchor="middle" font-size="7.5" fill="#C2410C">pnpm dev 看到骨架</text>
  <text x="664" y="128.25" text-anchor="middle" font-size="7.5" fill="#C2410C">登录闭环可用</text>
  <text x="664" y="145.5" text-anchor="middle" font-size="7.5" fill="#C2410C">grep 无其他框架残留</text>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">第 4 步起才是本模板的内容；前 3 步的细节全部在 NuxtTemplate 文档里，不重复</text>
  <rect x="30" y="206" width="340" height="184" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="200" y="224.2" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">template.config.json（选择快照 · 节选）</text>
  <text x="200" y="241" text-anchor="middle" font-size="8.5" fill="#0E7490">{</text>
  <text x="200" y="260.55" text-anchor="middle" font-size="8.5" fill="#0E7490">  "selection": {</text>
  <text x="200" y="280.1" text-anchor="middle" font-size="8.5" fill="#0E7490">    "ui": "element-plus",</text>
  <text x="200" y="299.65" text-anchor="middle" font-size="8.5" fill="#0E7490">    "css": "sass", "atomic": "unocss",</text>
  <text x="200" y="319.2" text-anchor="middle" font-size="8.5" fill="#0E7490">    "render": "ssr",</text>
  <text x="200" y="338.75" text-anchor="middle" font-size="8.5" fill="#0E7490">    "modules": ["pinia", "vueuse"]</text>
  <text x="200" y="358.3" text-anchor="middle" font-size="8.5" fill="#0E7490">  }</text>
  <text x="200" y="377.85" text-anchor="middle" font-size="8.5" fill="#0E7490">}</text>
  <rect x="390" y="206" width="340" height="184" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="224.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">初始化后叠加的骨架目录（本模板新增）</text>
  <text x="560" y="241" text-anchor="middle" font-size="8.5" fill="#0F766E">app/（骨架层，业务层另起）</text>
  <text x="560" y="260.55" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ layouts/ default.vue · auth.vue</text>
  <text x="560" y="280.1" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ components/admin/ 骨架组件</text>
  <text x="560" y="299.65" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ components/ui/ 适配层组件</text>
  <text x="560" y="319.2" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ composables/useAuth.ts</text>
  <text x="560" y="338.75" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ config/menu.ts 菜单单一来源</text>
  <text x="560" y="358.3" text-anchor="middle" font-size="8.5" fill="#0F766E">├─ middleware/auth.ts 路由守卫</text>
  <text x="560" y="377.85" text-anchor="middle" font-size="8.5" fill="#0F766E">└─ server/api/auth/ 登录演示接口</text>
  <text x="380" y="414" text-anchor="middle" font-size="10" fill="#065F46">验证收尾：pnpm verify 确认基线干净 → pnpm dev 打开 /dashboard 出现骨架，控制台 0 error</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
