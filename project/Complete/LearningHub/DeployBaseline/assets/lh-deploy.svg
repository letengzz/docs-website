<text x="337" y="110" font-size="11" fill="#2563eb" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">sensitive_keys 2 / 明文口令 0</text>
