<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="学习平台四周里程碑"><title>学习平台四周里程碑</title><rect width="900" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">四周里程碑：每周一个能跑出来的验收，不写「已完成」</text><rect x="24" y="60" width="200" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="124.0" y="105.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">第 1 周 251-257</text><text x="124.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#6b7280">需求 · 架构 · 库表</text><text x="124.0" y="139.0" text-anchor="middle" font-size="11.5" fill="#6b7280">12 表 DDL 可执行</text><text x="124.0" y="154.0" text-anchor="middle" font-size="11.5" fill="#6b7280">4 条契约能被 mock 跑通</text><line x1="225" y1="108" x2="239" y2="108" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/><rect x="240" y="60" width="200" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="340.0" y="105.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">第 2 周 258-264</text><text x="340.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#6b7280">核心编码</text><text x="340.0" y="139.0" text-anchor="middle" font-size="11.5" fill="#6b7280">报名 / 进度 / 组卷</text><text x="340.0" y="154.0" text-anchor="middle" font-size="11.5" fill="#6b7280">三个接口可调通</text><line x1="441" y1="108" x2="455" y2="108" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/><rect x="456" y="60" width="200" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="556.0" y="105.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">第 3 周 265-271</text><text x="556.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#6b7280">联调与测试</text><text x="556.0" y="139.0" text-anchor="middle" font-size="11.5" fill="#6b7280">判分与并发交卷</text><text x="556.0" y="154.0" text-anchor="middle" font-size="11.5" fill="#6b7280">压测与一致性达标</text><line x1="657" y1="108" x2="671" y2="108" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/><rect x="672" y="60" width="200" height="96" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="772.0" y="105.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">第 4 周 272-280</text><text x="772.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#6b7280">部署与验收</text><text x="772.0" y="139.0" text-anchor="middle" font-size="11.5" fill="#6b7280">一键起 + 监控</text><text x="772.0" y="154.0" text-anchor="middle" font-size="11.5" fill="#6b7280">上线验收清单</text><text x="24" y="186" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">每天一个构建步骤，产物是「可被读者执行的命令 + 期望读数」，不是代码副本。</text><text x="24" y="208" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">第 1 周的五步：需求拆分 → 技术选型 → 架构边界 → 接口契约 → 库表设计。</text><rect x="24" y="224" width="852" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="450.0" y="256.0" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">本周期只回答一个问题：一份「学习过」的证据，能不能被机器判出来、被人复核？</text></svg>