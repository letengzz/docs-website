<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img">
<title>压测四段：灌数 → 单查 → 并发 → 对账</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="880" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#0f172a" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">压测四段：灌数 → 单查 → 并发 → 对账</text>
<rect x="24" y="74" width="196" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="122.0" y="110.0" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">灌数 10 万</text>
<text x="122.0" y="129.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">202.9 ms / 4.9 MB</text>
<line x1="221" y1="117" x2="236" y2="117" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="238" y="74" width="196" height="86" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.2"/>
<text x="336.0" y="110.0" font-size="12" fill="#0d9488" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">单查 p99</text>
<text x="336.0" y="129.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">0.024 ms</text>
<line x1="435" y1="117" x2="450" y2="117" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="452" y="74" width="196" height="86" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="550.0" y="110.0" font-size="12" fill="#b45309" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">200 请求 / 20 并发</text>
<text x="550.0" y="129.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p99 93.23 ms</text>
<line x1="649" y1="117" x2="664" y2="117" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="666" y="74" width="196" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="764.0" y="110.0" font-size="12" fill="#7c3aed" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">对账</text>
<text x="764.0" y="129.0" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">错误 0 / 行数守恒</text>
<text x="24" y="208" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">p50 0.09 ms 与 p99 93.23 ms 差 1,036 倍：排队成本只在尾部。</text>
<text x="24" y="238" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">唯一键前：400 次重复提交落 400 行；唯一键后：落 200 行、拒 400 次。</text>
<text x="24" y="264" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">加唯一键前必须先清重复，否则 CREATE UNIQUE INDEX 直接失败。</text>
<text x="24" y="306" font-size="13" fill="#0f172a" font-weight="600" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">四条容量基线</text>
<rect x="24" y="322" width="196" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="122.0" y="342.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">点查 p99 < 1 ms</text>
<rect x="238" y="322" width="196" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="336.0" y="342.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">重复不增行</text>
<rect x="452" y="322" width="196" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="550.0" y="342.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">并发错误 0</text>
<rect x="666" y="322" width="196" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="764.0" y="342.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">行数守恒</text>
</svg>
