<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="900" height="480" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">四个模块、四条契约、一条同步链</text><rect x="40" y="70" width="196" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="70" width="196" height="5" rx="2" fill="#2563eb"/><text x="56" y="102" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">内容</text><text x="56" y="128" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">course</text><text x="56" y="148" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">section</text><text x="56" y="176" font-size="10" fill="#2563eb" font-weight="400" text-anchor="start">只被读，不被写</text><line x1="236" y1="140" x2="252" y2="140" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="252" y="70" width="196" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="252" y="70" width="196" height="5" rx="2" fill="#7c3aed"/><text x="268" y="102" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">做题</text><text x="268" y="128" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">question</text><text x="268" y="148" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">question_option</text><text x="268" y="176" font-size="10" fill="#7c3aed" font-weight="400" text-anchor="start">题目改版后旧卷按旧版判</text><line x1="448" y1="140" x2="464" y2="140" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="464" y="70" width="196" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="464" y="70" width="196" height="5" rx="2" fill="#d97706"/><text x="480" y="102" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">学与考</text><text x="480" y="128" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">enrollment</text><text x="480" y="148" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">progress</text><text x="480" y="176" font-size="10" fill="#d97706" font-weight="400" text-anchor="start">唯一写成绩的地方</text><line x1="660" y1="140" x2="676" y2="140" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="676" y="70" width="196" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="676" y="70" width="196" height="5" rx="2" fill="#059669"/><text x="692" y="102" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">凭证</text><text x="692" y="128" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">learner</text><text x="692" y="148" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">certificate</text><text x="692" y="176" font-size="10" fill="#059669" font-weight="400" text-anchor="start">只从「已通过」长出来</text><rect x="40" y="236" width="820" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="262" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">四条契约（每条必须回答：约定什么 / 定错的后果 / 怎么验证）</text><circle cx="64" cy="286" r="4" fill="#2563eb"/><text x="76" y="290" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">C1 报名唯一</text><text x="76" y="308" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">(learner,course) 唯一</text><circle cx="264" cy="286" r="4" fill="#2563eb"/><text x="276" y="290" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">C2 进度单调</text><text x="276" y="308" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">pct 不回退</text><circle cx="464" cy="286" r="4" fill="#2563eb"/><text x="476" y="290" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">C3 交卷一次</text><text x="476" y="308" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">idem_key 唯一 + 分数只写一次</text><circle cx="664" cy="286" r="4" fill="#2563eb"/><text x="676" y="290" font-size="11" fill="#1f2937" font-weight="600" text-anchor="start">C4 发证需通过</text><text x="676" y="308" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">成绩 ≥ 及格线</text><rect x="40" y="340" width="820" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="366" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">同步链：交卷那一刻就把分数算完，不留「最终一致」</text><rect x="70" y="384" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="130" y="409" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">报名</text><line x1="190" y1="404" x2="228" y2="404" stroke="#64748b" stroke-width="1.3" marker-end="url(#ah)"/><rect x="230" y="384" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="290" y="409" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">学完必修</text><line x1="350" y1="404" x2="388" y2="404" stroke="#64748b" stroke-width="1.3" marker-end="url(#ah)"/><rect x="390" y="384" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="450" y="409" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">开考</text><line x1="510" y1="404" x2="548" y2="404" stroke="#64748b" stroke-width="1.3" marker-end="url(#ah)"/><rect x="550" y="384" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="610" y="409" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">交卷判分</text><line x1="670" y1="404" x2="708" y2="404" stroke="#64748b" stroke-width="1.3" marker-end="url(#ah)"/><rect x="710" y="384" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="770" y="409" font-size="12" fill="#2563eb" font-weight="600" text-anchor="middle">发证</text><text x="60" y="446" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">六步事务本机 0.20 ms；12 表 + 4 触发器建库 0.99 ms；200 次重复提交：无唯一键 200 行、有唯一键 1 行</text></svg>