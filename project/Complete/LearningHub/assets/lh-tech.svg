<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="版本基线的五个维度与三个坑" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="560" fill="#f8fafc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="40" y="40" font-size="17" fill="#1f2937" font-weight="600" text-anchor="start">版本基线：五个维度、六个 PRAGMA、三个静默失效的坑</text><text x="40" y="62" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">定基线的目的不是记录「用了什么」，是让换人、换机、换季度之后得到同一个结果</text><rect x="40" y="86" width="152" height="66" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="52" y="110" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">语言</text><text x="52" y="134" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Python 3.13.12</text><rect x="206" y="86" width="152" height="66" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="218" y="110" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">存储</text><text x="218" y="134" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">SQLite 3.50.4 / PG 18</text><rect x="372" y="86" width="152" height="66" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="384" y="110" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="start">字符集</text><text x="384" y="134" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">UTF-8（建库时定）</text><rect x="538" y="86" width="152" height="66" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="550" y="110" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="start">时间</text><text x="550" y="134" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">UTC 存 / 本地展示</text><rect x="704" y="86" width="152" height="66" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="716" y="110" font-size="12" fill="#d97706" font-weight="700" text-anchor="start">布尔</text><text x="716" y="134" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">SQLite 0/1，PG 真 boolean</text><rect x="40" y="172" width="470" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="198" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">六个 PRAGMA（只在连接工厂里写）</text><text x="60" y="224" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">foreign_keys</text><text x="190" y="224" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">0 → on</text><text x="310" y="224" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">默认关闭，必须断言</text><text x="60" y="250" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">journal_mode</text><text x="190" y="250" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">delete → wal</text><text x="310" y="250" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">库级持久属性，设一次</text><text x="60" y="276" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">synchronous</text><text x="190" y="276" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">full → normal</text><text x="310" y="276" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">连接级，每次连接都要设</text><text x="60" y="302" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">busy_timeout</text><text x="190" y="302" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">5000（显式）</text><text x="310" y="302" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">换驱动后可能归零</text><text x="60" y="328" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">encoding</text><text x="190" y="328" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">UTF-8</text><text x="310" y="328" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">建库时决定，之后不可改</text><text x="60" y="354" font-size="10" fill="#1f2937" font-weight="600" text-anchor="start">recursive_triggers</text><text x="190" y="354" font-size="10" fill="#d97706" font-weight="600" text-anchor="start">off</text><text x="310" y="354" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">避免触发器递归</text><rect x="530" y="172" width="330" height="200" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><text x="550" y="198" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">三个静默失效的坑</text><text x="550" y="224" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start">① foreign_keys 在事务内设置无效</text><text x="550" y="246" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">    返回 0，不报错</text><text x="550" y="272" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start">② UNIQUE 大小写敏感</text><text x="550" y="294" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">    A@x.com 与 a@x.com 可并存</text><text x="550" y="320" font-size="11" fill="#1f2937" font-weight="400" text-anchor="start">③ julianday() 无时区概念</text><text x="550" y="342" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">    DST 那天 02:30 照样算得出</text><text x="550" y="364" font-size="10" fill="#dc2626" font-weight="400" text-anchor="start">三个都不抛异常 → 正向用例全绿</text><rect x="40" y="392" width="470" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="416" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">四种写入配置（500 次逐条提交）</text><text x="60" y="430" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">delete/full</text><rect x="160" y="420" width="120" height="13" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="292" y="430" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">0.37 ms</text><text x="60" y="450" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">delete/normal</text><rect x="160" y="440" width="110" height="13" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="292" y="450" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">0.34 ms</text><text x="60" y="470" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">wal/full</text><rect x="160" y="460" width="29" height="13" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="292" y="470" font-size="10" fill="#2563eb" font-weight="700" text-anchor="start">0.09 ms</text><text x="60" y="490" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">wal/normal</text><rect x="160" y="480" width="7" height="13" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1"/><text x="292" y="490" font-size="10" fill="#059669" font-weight="700" text-anchor="start">0.02 ms</text><text x="40" y="540" font-size="11" fill="#059669" font-weight="400" text-anchor="start">wal/normal 比 delete/full 快 18.5×，代价是掉电可能丢最后一个事务；真正更大的杠杆是批量提交。</text><rect x="530" y="392" width="330" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="550" y="416" font-size="12" fill="#2563eb" font-weight="700" text-anchor="start">换 PostgreSQL 必改三处</text><text x="550" y="440" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">① raise(abort) → raise exception</text><text x="550" y="462" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">② julianday → extract(epoch ...)</text><text x="550" y="484" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">③ autoincrement / datetime('now')</text><text x="550" y="508" font-size="10" fill="#dc2626" font-weight="400" text-anchor="start">②③ 改错不报错，优先改</text></svg>