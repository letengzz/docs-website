<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="680" height="318" role="img" aria-label="第 1 周验收单与八项门禁">
<rect width="680" height="318" fill="#ffffff"/>
<rect width="680" height="318" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">第 1 周验收单：四份文档交付了什么，怎么判定</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">交付物不是「写了四页」，而是「十二张表能建出来、六条不变量拦得住、四条契约可执行」</text>
<rect x="24" y="68" width="148" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="68" width="148" height="3" rx="1.5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="36" y="90" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">① 需求</text>
<text x="36" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">用户故事 8 条</text>
<text x="36" y="128" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="start" font-weight="400">每条带一条可判定验收</text>
<path d="M172 111 L184 111" fill="none" stroke="#64748b" stroke-width="1.2"/>
<rect x="184" y="68" width="148" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="184" y="68" width="148" height="3" rx="1.5" fill="#0d9488" stroke="none" stroke-width="1"/>
<text x="196" y="90" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#0d9488" text-anchor="start" font-weight="700">② 架构</text>
<text x="196" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">四模块单向依赖</text>
<text x="196" y="128" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="start" font-weight="400">四条契约各配一条约束</text>
<path d="M332 111 L344 111" fill="none" stroke="#64748b" stroke-width="1.2"/>
<rect x="344" y="68" width="148" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="344" y="68" width="148" height="3" rx="1.5" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="356" y="90" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">③ 基线</text>
<text x="356" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">版本与 PRAGMA</text>
<text x="356" y="128" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="start" font-weight="400">换 PG 要改的三处</text>
<path d="M492 111 L504 111" fill="none" stroke="#64748b" stroke-width="1.2"/>
<rect x="504" y="68" width="148" height="86" rx="10" fill="#ffffff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="504" y="68" width="148" height="3" rx="1.5" fill="#7c3aed" stroke="none" stroke-width="1"/>
<text x="516" y="90" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">④ 库设计</text>
<text x="516" y="110" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">五查询九索引</text>
<text x="516" y="128" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="start" font-weight="400">四条加速、一条无收益</text>
<rect x="24" y="166" width="632" height="30" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="340" y="186" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">第 1 周门禁：以下 8 项全部 PASS 才能进入第 2 周核心编码</text>
<rect x="24" y="208" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="34" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">A1</text>
<text x="34" y="239" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">12 张表</text>
<rect x="184" y="208" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="194" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">A2</text>
<text x="194" y="239" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">9 个索引</text>
<rect x="344" y="208" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="354" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">A3</text>
<text x="354" y="239" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">4 个触发器</text>
<rect x="504" y="208" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="514" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">A4</text>
<text x="514" y="239" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">建库 1.31 ms</text>
<rect x="24" y="254" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="34" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">I1~I6</text>
<text x="34" y="285" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">6 条不变量全拦</text>
<rect x="184" y="254" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="194" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">C1</text>
<text x="194" y="285" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">部分唯一索引命中</text>
<rect x="344" y="254" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="354" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">C4</text>
<text x="354" y="285" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">发证需通过</text>
<rect x="504" y="254" width="148" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="514" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">P</text>
<text x="514" y="285" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">5 页 × 8 判据</text>
<text x="24" y="310" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400">验收的判据是「可执行」，不是「已阅读」：每一项都对应一条能被机器判定的命令与期望输出。</text>
</svg>
