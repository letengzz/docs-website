<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" role="img" aria-label="组卷：五步，两处必须落库">
<rect width="680" height="396" fill="#ffffff"/>
<text x="24" y="30" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">组卷：五步，两处必须落库</text>
<text x="24" y="50" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="400">蓝图定难度 → 抽样 → 冻结卷面 → 建 attempt → 并发只允许一个赢家</text>
<rect x="24" y="72" width="110" height="58" rx="8" fill="#fff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="24" y="72" width="110" height="3" rx="1.5" fill="#0d9488"/>
<text x="79" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">蓝图</text>
<text x="79" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">50 题/5 档</text>
<line x1="136" y1="101" x2="146.0" y2="101.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="152.0,101.0 146.0,98.0 146.0,104.0" fill="#cbd5e1"/>
<rect x="154" y="72" width="110" height="58" rx="8" fill="#fff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="154" y="72" width="110" height="3" rx="1.5" fill="#2563eb"/>
<text x="209" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">抽样</text>
<text x="209" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">seed + 分层</text>
<line x1="266" y1="101" x2="276.0" y2="101.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="282.0,101.0 276.0,98.0 276.0,104.0" fill="#cbd5e1"/>
<rect x="284" y="72" width="110" height="58" rx="8" fill="#fff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="284" y="72" width="110" height="3" rx="1.5" fill="#dc2626"/>
<text x="339" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">冻结</text>
<text x="339" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">paper_item</text>
<line x1="396" y1="101" x2="406.0" y2="101.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="412.0,101.0 406.0,98.0 406.0,104.0" fill="#cbd5e1"/>
<rect x="414" y="72" width="110" height="58" rx="8" fill="#fff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="414" y="72" width="110" height="3" rx="1.5" fill="#d97706"/>
<text x="469" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">建卷</text>
<text x="469" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">attempt</text>
<line x1="526" y1="101" x2="536.0" y2="101.0" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="542.0,101.0 536.0,98.0 536.0,104.0" fill="#cbd5e1"/>
<rect x="544" y="72" width="110" height="58" rx="8" fill="#fff" stroke="#dbe3ef" stroke-width="1"/>
<rect x="544" y="72" width="110" height="3" rx="1.5" fill="#2563eb"/>
<text x="599" y="96" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">并发</text>
<text x="599" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="400">主键唯一</text>
<text x="24" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">难度配额（50 题，蓝图）</text>
<text x="24" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="700">L1</text>
<rect x="56" y="172" width="200" height="12" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<rect x="56" y="172" width="120" height="12" rx="6" fill="#2563eb"/>
<text x="266" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">10 题</text>
<text x="24" y="204" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="700">L2</text>
<rect x="56" y="194" width="200" height="12" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<rect x="56" y="194" width="180" height="12" rx="6" fill="#2563eb"/>
<text x="266" y="204" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">15 题</text>
<text x="24" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="700">L3</text>
<rect x="56" y="216" width="200" height="12" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<rect x="56" y="216" width="180" height="12" rx="6" fill="#2563eb"/>
<text x="266" y="226" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">15 题</text>
<text x="24" y="248" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="700">L4</text>
<rect x="56" y="238" width="200" height="12" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<rect x="56" y="238" width="84" height="12" rx="6" fill="#2563eb"/>
<text x="266" y="248" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">7 题</text>
<text x="24" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="700">L5</text>
<rect x="56" y="260" width="200" height="12" rx="6" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<rect x="56" y="260" width="36" height="12" rx="6" fill="#2563eb"/>
<text x="266" y="270" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#475569" text-anchor="start" font-weight="400">3 题</text>
<text x="320" y="182" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">纯随机抽 50 题：</text>
<text x="320" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">42.5% 的卷难度偏差 &gt;5 题</text>
<text x="320" y="220" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0d9488" text-anchor="start" font-weight="700">按蓝图分层抽：偏差 0%</text>
<text x="320" y="244" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">→ 难度配额不是「更好看」，</text>
<text x="320" y="258" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="400">是「每一卷都可解释」</text>
<rect x="24" y="282" width="632" height="44" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="38" y="302" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">题库 +100 题后同 seed 重抽：50 题里有 13 题变了（26.0%）</text>
<text x="38" y="318" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">→ seed 只能还原「排序」，还原不了「题库内容」，卷面必须落 paper_item</text>
<rect x="24" y="334" width="632" height="44" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1"/>
<text x="38" y="354" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">同一 attempt 被 5 个请求同时抽：无主键 5 份卷，有主键 1 份</text>
<text x="38" y="370" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="400">卷面总分 124~144 浮动，65% 答对率在绝对及格线下通过率 93.0%</text>
<text x="24" y="392" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">判据 LNW-A ~ LNW-H：八条都在问「这一卷凭什么能复现」</text>
</svg>
