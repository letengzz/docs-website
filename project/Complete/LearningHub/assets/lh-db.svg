<text x="40" y="338" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="400">选择性低的索引（state 只有两种值、90% 是 SUBMITTED）几乎不加速，却照样付这三笔代价。</text>
