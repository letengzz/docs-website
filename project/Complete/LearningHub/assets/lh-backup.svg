<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="960" height="360" rx="12" fill="#f8fafc"/><text x="480.0" y="34" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#0f172a" font-weight="600">备份、恢复与 RPO 边界（本机实测读数）</text><line x1="60" y1="112" x2="900" y2="112" stroke="#cbd5e1" stroke-width="2"/><circle cx="120" cy="112" r="6" fill="#0f766e"/><text x="120" y="96" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">T0 备份</text><circle cx="330" cy="112" r="6" fill="#0f766e"/><text x="330" y="96" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">T1 迟到写入</text><circle cx="540" cy="112" r="6" fill="#0f766e"/><text x="540" y="96" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">误删 501 行</text><circle cx="750" cy="112" r="6" fill="#0f766e"/><text x="750" y="96" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600">T2 恢复</text><rect x="120" y="128" width="420" height="10" rx="5" fill="#be123c" opacity="0.25"/><text x="330" y="158" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#be123c">RPO 窗口：这 120 行恢复后必然消失</text><rect x="60" y="180" width="180" height="88" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="150.0" y="208.6" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#0f172a" font-weight="60