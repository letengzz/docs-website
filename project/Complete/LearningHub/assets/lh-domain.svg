<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="学习平台领域模型"><title>学习平台领域模型</title><rect width="900" height="350" fill="#ffffff"/><text x="24" y="32" text-anchor="start" font-size="16" fill="#1f2937" font-weight="700">十二张表分成四组，共用两个主语：learner_id 与 course_id</text><rect x="24" y="60" width="200" height="130" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="124" y="86" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">内容</text><text x="124" y="110" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">course</text><text x="124" y="136" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">section</text><text x="124" y="162" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">lesson</text><rect x="240" y="60" width="200" height="130" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/><text x="340" y="86" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">做题</text><text x="340" y="110" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">question</text><text x="340" y="136" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">question_option</text><text x="340" y="162" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">exam</text><rect x="456" y="60" width="200" height="156" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="556" y="86" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">学与考</text><text x="556" y="110" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">enrollment</text><text x="556" y="136" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">progress</text><text x="556" y="162" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">attempt</text><text x="556" y="188" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">answer</text><rect x="672" y="60" width="200" height="104" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="772" y="86" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">凭证</text><text x="772" y="110" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">learner</text><text x="772" y="136" text-anchor="middle" font-size="11.5" fill="#1f2937" font-weight="400">certificate</text><text x="24" y="268" text-anchor="start" font-size="12" fill="#1f2937" font-weight="400">两条硬约束写在索引上，不写在代码里：</text><text x="24" y="292" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· 同一学员同一课程只有一条有效报名（部分唯一索引，撤销后可重新报名）</text><text x="24" y="314" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">· 一次作答只能交一次卷，且得分必须等于明细之和（触发器）</text><text x="470" y="268" text-anchor="start" font-size="12" fill="#047857" font-weight="600">6 条不变量全部可执行，本机 6/6 PASS，退出码 0。</text><text x="470" y="292" text-anchor="start" font-size="12" fill="#6b7280" font-weight="400">12 张表 + 4 个触发器建库 1.27 ms。</text></svg>