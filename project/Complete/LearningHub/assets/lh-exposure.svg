<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif"><rect x="0" y="0" width="900" height="388" fill="#f7f9fc"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/></marker></defs><text x="28" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">曝光计数驱动的组卷与泄题面收敛</text><text x="28" y="62" font-size="13" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">同一道题能被多少人看到，是可以在组卷前算出来的</text><rect x="28" y="88" width="196" height="86" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="40" y="112" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">题库</text><text x="40" y="134" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">800 题 / 8 章 / 4 难度</text><text x="40" y="152" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">每卷 40 题 = 8 章 × 5</text><line x1="226" y1="131" x2="244" y2="131" stroke="#9aa8bd" stroke-width="1.4" marker-end="url(#ah)"/><rect x="246" y="88" width="196" height="86" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="258" y="112" font-size="13" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">曝光表</text><text x="258" y="134" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">channel × mode × seen_at</text><text x="258" y="152" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">同场同题只记 1 行</text><line x1="444" y1="131" x2="462" y2="131" stroke="#9aa8bd" stroke-width="1.4" marker-end="url(#ah)"/><rect x="464" y="88" width="196" height="86" rx="8" fill="#eceafd" stroke="#4338ca" stroke-width="1"/><text x="476" y="112" font-size="13" fill="#4338ca" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">治理视图</text><text x="476" y="134" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">近 30 天考试渠道</text><text x="476" y="152" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">DISTINCT attempt_id</text><line x1="662" y1="131" x2="680" y2="131" stroke="#9aa8bd" stroke-width="1.4" marker-end="url(#ah)"/><rect x="682" y="88" width="196" height="86" rx="8" fill="#fdf3e3" stroke="#b45309" stroke-width="1"/><text x="694" y="112" font-size="13" fill="#b45309" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">曝光感知组卷</text><text x="694" y="134" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">章配额 + 曝光升序</text><text x="694" y="152" font-size="10.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">不足即 degraded</text><rect x="28" y="196" width="844" height="74" rx="8" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/><text x="44" y="220" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">上限就是产能：800 题 × K ÷ 40 题每卷</text><rect x="44" y="230" width="150" height="28" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="54" y="249" font-size="11" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">K=1</text><text x="184" y="249" font-size="11" fill="#1f2937" font-weight="600" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">20 份</text><rect x="210" y="230" width="150" height="28" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="220" y="249" font-size="11" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">K=2</text><text x="350" y="249" font-size="11" fill="#1f2937" font-weight="600" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">40 份</text><rect x="376" y="230" width="150" height="28" rx="6" fill="#fdf3e3" stroke="#b45309" stroke-width="1"/><text x="386" y="249" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">K=3</text><text x="516" y="249" font-size="11" fill="#1f2937" font-weight="600" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">60 份</text><rect x="542" y="230" width="150" height="28" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="552" y="249" font-size="11" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">K=5</text><text x="682" y="249" font-size="11" fill="#1f2937" font-weight="600" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">100 份</text><rect x="708" y="230" width="150" height="28" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1"/><text x="718" y="249" font-size="11" fill="#0f766e" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">K=10</text><text x="848" y="249" font-size="11" fill="#1f2937" font-weight="600" text-anchor="end" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">200 份</text><rect x="28" y="288" width="844" height="80" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1"/><text x="44" y="312" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">本机实测暴露的一处真缺陷：上限 3 只在第 60 份卷之前成立</text><text x="44" y="334" font-size="11.5" fill="#1f2937" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">降级信号只写在日志、没进返回体 → 调用方继续发卷 139 份 → 单题最多曝光 21 次、中位 10 次。</text><text x="44" y="354" font-size="11.5" fill="#5b6b82" font-weight="400" text-anchor="start" font-family="Inter, 'Noto Sans SC', 'PingFang SC', sans-serif">修法：degraded 进返回体 + 门禁断言「degraded 必须触发告警」（第 9 章装配器同款）。</text></svg>