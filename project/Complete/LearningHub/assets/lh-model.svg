<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" width="680" height="296" role="img" aria-label="四个模块的单向依赖：下游只读上游">
<title>四个模块的单向依赖：下游只读上游</title>
<rect width="680" height="296" fill="#ffffff"/>
<text x="24" y="28" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">四个模块的单向依赖：下游只能读上游，不能写上游</text>
<text x="24" y="46" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#64748b" text-anchor="start" font-weight="400">每张表只有一个写入者；跨模块引用一律只读——这是四条契约里最先被违反的一条</text>
<rect x="24" y="66" width="132" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="24" y="66" width="132" height="26" rx="8" fill="#2563eb"/>
<rect x="24" y="84" width="132" height="8" fill="#2563eb"/>
<text x="34" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="600">内容</text>
<text x="146" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#f1f5f9" text-anchor="end" font-weight="400">3 张</text>
<text x="34" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">course · section · lesson</text>
<line x1="34" y1="144" x2="146" y2="144" stroke="#e2e8f0"/>
<text x="34" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="start" font-weight="400">写入者</text>
<text x="34" y="171" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#2563eb" text-anchor="start" font-weight="600">教务后台</text>
<line x1="159" y1="119" x2="176" y2="119" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M176 115 L181 119 L176 123" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="170.0" y="108" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="7.5" fill="#475569" text-anchor="middle" font-weight="400">只读</text>
<rect x="184" y="66" width="132" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="184" y="66" width="132" height="26" rx="8" fill="#7c3aed"/>
<rect x="184" y="84" width="132" height="8" fill="#7c3aed"/>
<text x="194" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="600">做题</text>
<text x="306" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#f1f5f9" text-anchor="end" font-weight="400">3 张</text>
<text x="194" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">question · question_option</text>
<text x="194" y="130" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">exam</text>
<line x1="194" y1="144" x2="306" y2="144" stroke="#e2e8f0"/>
<text x="194" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="start" font-weight="400">写入者</text>
<text x="194" y="171" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#7c3aed" text-anchor="start" font-weight="600">题库后台</text>
<line x1="319" y1="119" x2="336" y2="119" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M336 115 L341 119 L336 123" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="330.0" y="108" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="7.5" fill="#475569" text-anchor="middle" font-weight="400">只读</text>
<rect x="344" y="66" width="132" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="344" y="66" width="132" height="26" rx="8" fill="#0891b2"/>
<rect x="344" y="84" width="132" height="8" fill="#0891b2"/>
<text x="354" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="600">学与考</text>
<text x="466" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#f1f5f9" text-anchor="end" font-weight="400">4 张</text>
<text x="354" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">enrollment · progress</text>
<text x="354" y="130" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">attempt · answer</text>
<line x1="354" y1="144" x2="466" y2="144" stroke="#e2e8f0"/>
<text x="354" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="start" font-weight="400">写入者</text>
<text x="354" y="171" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#0891b2" text-anchor="start" font-weight="600">学习与考试服务</text>
<line x1="479" y1="119" x2="496" y2="119" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M496 115 L501 119 L496 123" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="490.0" y="108" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="7.5" fill="#475569" text-anchor="middle" font-weight="400">只读</text>
<rect x="504" y="66" width="132" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="504" y="66" width="132" height="26" rx="8" fill="#b45309"/>
<rect x="504" y="84" width="132" height="8" fill="#b45309"/>
<text x="514" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#ffffff" text-anchor="start" font-weight="600">凭证</text>
<text x="626" y="84" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9" fill="#f1f5f9" text-anchor="end" font-weight="400">2 张</text>
<text x="514" y="116" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#334155" text-anchor="start" font-weight="400">learner · certificate</text>
<line x1="514" y1="144" x2="626" y2="144" stroke="#e2e8f0"/>
<text x="514" y="160" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#475569" text-anchor="start" font-weight="400">写入者</text>
<text x="514" y="171" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#b45309" text-anchor="start" font-weight="600">发证任务</text>
<rect x="24" y="186" width="632" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="38" y="206" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">三条约束写在库里，不写在代码里</text>
<text x="38" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#2563eb" text-anchor="start" font-weight="600">一条报名</text>
<text x="86.0" y="224" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#475569" text-anchor="start" font-weight="400">learner_id × course_id 只能有一条有效记录（部分唯一索引，撤销后可重报）</text>
<text x="38" y="240" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#2563eb" text-anchor="start" font-weight="600">一次交卷</text>
<text x="86.0" y="240" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#475569" text-anchor="start" font-weight="400">attempt 只能锁定一次，得分必须等于 answer 明细之和（触发器）</text>
<text x="38" y="256" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#2563eb" text-anchor="start" font-weight="600">一张证书</text>
<text x="86.0" y="256" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8.5" fill="#475569" text-anchor="start" font-weight="400">cert_no 全局唯一，撤销只改状态不删行（唯一索引 + 状态位）</text>
<text x="38" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" fill="#64748b" text-anchor="start" font-weight="400">违反时只有写入者报错，读者不受影响——这是把约束放进库里的唯一收益。</text>
</svg>
