<text x="528" y="146" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">一人可判、可关</text>
<rect x="24" y="180" width="712" height="66" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
<text x="38" y="204" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">本机读数：基线 p99 1035.4 ms → 阈值 2070.8 ms；6 分钟突发 for=5m 触发 / for=10m 漏；判分失败 4/2000（0.20%）</text>
