<text x="283" y="106" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">p99 超基线 2 倍</text>
<text x="283" y="126" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">判分失败率非零</text>
<text x="283" y="146" font-family="sans-serif" font-size="13" font-weight="400" fill="#1E293B">/readyz 变红</text>
