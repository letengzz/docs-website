<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">数据库设计：核心关系与关键字段</text>
  <rect x="30" y="70" width="180" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">sys_user</text>
  <text x="48" y="120" font-size="10" fill="#3730a3">id / username（唯一）</text>
  <text x="48" y="140" font-size="10" fill="#3730a3">password_hash / status</text>
  <text x="48" y="160" font-size="10" fill="#6b7280">created_at / updated_at</text>
  <rect x="250" y="70" width="180" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="340" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">project</text>
  <text x="268" y="120" font-size="10" fill="#065f46">id / name / owner_id</text>
  <text x="268" y="140" font-size="10" fill="#065f46">status / deleted_at（软删）</text>
  <text x="268" y="160" font-size="10" fill="#6b7280">索引：(owner_id, status)</text>
  <rect x="470" y="70" width="180" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="560" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">task</text>
  <text x="488" y="120" font-size="10" fill="#5b21b6">id / project_id / title</text>
  <text x="488" y="140" font-size="10" fill="#5b21b6">status / assignee_id / sort</text>
  <text x="488" y="160" font-size="10" fill="#6b7280">索引：(project_id, status, sort)</text>
  <rect x="690" y="70" width="160" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="770" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">member / log</text>
  <text x="708" y="120" font-size="10" fill="#92400e">project_member</text>
  <text x="708" y="140" font-size="10" fill="#92400e">（project_id, user_id, role）</text>
  <text x="708" y="160" font-size="10" fill="#6b7280">operation_log</text>
  <path d="M 212 125 H 246" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#d1)"/>
  <path d="M 432 125 H 466" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#d1)"/>
  <path d="M 652 125 H 686" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#d1)"/>
  <rect x="30" y="200" width="820" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="226" font-size="13" font-weight="bold" fill="#1f2937">设计要点</text>
  <text x="50" y="252" font-size="11" fill="#374151">① 所有业务表带 `created_at/updated_at`；② 用软删（`deleted_at`）保证可追溯，查询统一加条件；</text>
  <text x="50" y="272" font-size="11" fill="#374151">③ 状态字段用枚举字符串（可读性强），④ 排序字段 `sort` 用整数便于拖拽重排。</text>
  <rect x="30" y="296" width="820" height="84" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="322" font-size="13" font-weight="bold" fill="#1f2937">索引与约束（先想清楚再建表）</text>
  <text x="50" y="348" font-size="11" fill="#374151">唯一约束：`sys_user.username`、`project_member(project_id, user_id)`；反例：给低基数列（如 status）单建索引，收益低还可能被忽略。</text>
  <text x="50" y="370" font-size="10" fill="#6b7280">详见数据库专题：[MySQL 索引深入](../../../../docs/DB/Relational/MySQL/IndexDeepDive/index.md)。</text>
  <defs>
    <marker id="d1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
