<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">完整项目实战：六个阶段形成闭环</text>
  <rect x="30" y="70" width="120" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">需求拆分</text>
  <text x="90" y="126" text-anchor="middle" font-size="10" fill="#6b7280">用户故事 / 验收</text>
  <rect x="175" y="70" width="120" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">数据库设计</text>
  <text x="235" y="126" text-anchor="middle" font-size="10" fill="#6b7280">表结构 / 索引</text>
  <rect x="320" y="70" width="120" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="380" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">接口联调</text>
  <text x="380" y="126" text-anchor="middle" font-size="10" fill="#6b7280">契约 / Mock</text>
  <rect x="465" y="70" width="120" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="525" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">编码实现</text>
  <text x="525" y="126" text-anchor="middle" font-size="10" fill="#6b7280">模块 / 规范</text>
  <rect x="610" y="70" width="110" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">测试</text>
  <text x="665" y="126" text-anchor="middle" font-size="10" fill="#6b7280">单元/接口/E2E</text>
  <rect x="745" y="70" width="105" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="797" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">部署与复盘</text>
  <text x="797" y="126" text-anchor="middle" font-size="10" fill="#6b7280">上线 / 改进项</text>
  <path d="M 152 110 H 172" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#l1)"/>
  <path d="M 297 110 H 317" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#l1)"/>
  <path d="M 442 110 H 462" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#l1)"/>
  <path d="M 587 110 H 607" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#l1)"/>
  <path d="M 722 110 H 742" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#l1)"/>
  <rect x="30" y="186" width="820" height="90" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="212" font-size="13" font-weight="bold" fill="#1f2937">贯穿始终的三条线</text>
  <text x="50" y="238" font-size="11" fill="#374151">① 可验证：每个阶段都要有明确产出物与验收方式（SQL 能建库、接口能调通、页面能操作、测试能跑过、线上能访问）。</text>
  <text x="50" y="262" font-size="11" fill="#374151">② 可回滚：数据库迁移、发布版本、配置变更都要能退回上一步。</text>
  <rect x="30" y="292" width="820" height="88" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="318" font-size="13" font-weight="bold" fill="#1f2937">示例项目设定（贯穿本专题）</text>
  <text x="50" y="344" font-size="11" fill="#374151">一个「任务协作平台」：用户登录、创建项目、任务看板（拖拽状态）、成员与权限、操作日志。</text>
  <text x="50" y="368" font-size="11" fill="#374151">技术栈：Vue 3 + Vite（前端，复用 [Vue3 模板]）、Spring Boot + MySQL/Redis（后端）、Nginx + Docker（部署）。</text>
  <defs>
    <marker id="l1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
