<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="360" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">复盘：把一次项目变成团队资产</text>
  <rect x="30" y="70" width="260" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">做得好的</text>
  <text x="52" y="122" font-size="11" fill="#065f46">契约先行，联调返工少</text>
  <text x="52" y="146" font-size="11" fill="#065f46">迁移脚本向前兼容，发布零停顿</text>
  <text x="52" y="170" font-size="11" fill="#065f46">核心链路 E2E 用例守护回归</text>
  <text x="52" y="194" font-size="10" fill="#6b7280">要写成"可复制的做法"而非口号</text>
  <rect x="310" y="70" width="260" height="140" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="440" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">做得不好的</text>
  <text x="332" y="122" font-size="11" fill="#7f1d1d">需求变更未同步接口文档</text>
  <text x="332" y="146" font-size="11" fill="#7f1d1d">慢 SQL 上线后才被发现</text>
  <text x="332" y="170" font-size="11" fill="#7f1d1d">回滚只演练了应用层</text>
  <text x="332" y="194" font-size="10" fill="#6b7280">每条要给出改进动作与责任人</text>
  <rect x="590" y="70" width="260" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="720" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">下次要做的</text>
  <text x="612" y="122" font-size="11" fill="#1e3a8a">接口变更走评审 + 自动生成文档</text>
  <text x="612" y="146" font-size="11" fill="#1e3a8a">上线前跑慢查询巡检</text>
  <text x="612" y="170" font-size="11" fill="#1e3a8a">回滚演练纳入发布清单</text>
  <text x="612" y="194" font-size="10" fill="#6b7280">转成下个迭代的任务</text>
  <rect x="30" y="232" width="820" height="104" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="258" font-size="13" font-weight="bold" fill="#1f2937">复盘要量化</text>
  <text x="50" y="284" font-size="11" fill="#374151">交付：计划 vs 实际工时、需求变更次数、缺陷数（分严重级别）</text>
  <text x="50" y="308" font-size="11" fill="#374151">质量：线上事故数、回滚次数、P95 延迟、慢 SQL 数量、测试覆盖率</text>
  <text x="50" y="330" font-size="10" fill="#6b7280">没有数字的复盘只能变成"感觉会"，下个迭代无法验证改进是否生效。</text>
</svg>
