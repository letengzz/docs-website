<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">需求拆分：从一句话到可验收的任务</text>
  <rect x="30" y="70" width="250" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">① 业务目标</text>
  <text x="52" y="122" font-size="11" fill="#3730a3">"团队需要一个任务看板"</text>
  <text x="52" y="146" font-size="11" fill="#3730a3">明确：谁用、解决什么问题、成功标准</text>
  <text x="52" y="172" font-size="10" fill="#6b7280">产出：一页纸的目标与范围（含"不做什么"）</text>
  <rect x="315" y="70" width="250" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">② 用户故事</text>
  <text x="337" y="122" font-size="11" fill="#065f46">作为〈角色〉，我希望〈能力〉，以便〈价值〉</text>
  <text x="337" y="146" font-size="11" fill="#065f46">按角色与场景穷举，再合并重复项</text>
  <text x="337" y="172" font-size="10" fill="#6b7280">产出：故事清单 + 优先级（P0/P1/P2）</text>
  <rect x="600" y="70" width="250" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="725" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">③ 验收标准</text>
  <text x="622" y="122" font-size="11" fill="#92400e">每个 P0 故事写出 Given/When/Then</text>
  <text x="622" y="146" font-size="11" fill="#92400e">明确异常路径与边界条件</text>
  <text x="622" y="172" font-size="10" fill="#6b7280">产出：可直接转成测试用例的验收清单</text>
  <rect x="30" y="210" width="820" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="50" y="236" font-size="13" font-weight="bold" fill="#1f2937">拆到"能估时"的粒度</text>
  <text x="50" y="262" font-size="11" fill="#374151">一个任务 = 一个人 1~3 天能完成 + 有独立验收方式；超过就继续拆（如"任务看板"拆为：列表、拖拽、状态流转、权限）。</text>
  <rect x="30" y="302" width="820" height="78" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="50" y="328" font-size="13" font-weight="bold" fill="#1f2937">本次示例的 P0 范围</text>
  <text x="50" y="354" font-size="11" fill="#374151">登录与登出、项目 CRUD、任务 CRUD 与状态流转、成员与角色、操作日志；**不做**：消息推送、附件、甘特图。</text>
</svg>
