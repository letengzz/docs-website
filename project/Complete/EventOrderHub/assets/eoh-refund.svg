<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
<text x="36" y="42" font-size="21" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">退款与部分退款：额度是并发资源，退款单是幂等单元</text>
<text x="36" y="66" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">三条不变量（I1 不超退 / I2 明细不超退 / I3 状态与金额一致）是整条链路的地基</text>

<rect x="36" y="92" width="180" height="66" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="126" y="116" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">退款申请</text>
<text x="126" y="138" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">refund_no = 订单 + 批次</text>

<line x1="216" y1="125" x2="244" y2="125" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>

<rect x="248" y="92" width="200" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="348" y="114" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">额度扣减（条件更新）</text>
<text x="348" y="134" font-size="9.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">WHERE paid - refunded &gt;= amt</text>
<text x="348" y="150" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">影响 0 行 = 额度不足</text>

<line x1="448" y1="125" x2="476" y2="125" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>

<rect x="480" y="92" width="180" height="66" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
<text x="570" y="116" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">提交渠道</text>
<text x="570" y="138" font-size="10" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">PROCESSING（不是成功）</text>

<line x1="660" y1="125" x2="688" y2="125" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>

<rect x="692" y="92" width="232" height="66" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
<text x="808" y="112" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">回执三通道</text>
<text x="808" y="132" font-size="9.5" fill="#334155" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">同步受理 / 异步回调 / 主动查询</text>
<text x="808" y="150" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">只等回调 = 用户一直看到退款中</text>

<rect x="36" y="178" width="288" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="52" y="200" font-size="11" font-weight="700" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">无守卫：退了 120%</text>
<text x="52" y="222" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">refunded = refunded + paid×0.6（两次）</text>
<text x="52" y="242" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">paid 188.13 → refunded 225.76</text>
<text x="52" y="262" font-size="10" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">超退 20%：不是差一点，是多给钱</text>

<rect x="336" y="178" width="288" height="96" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="352" y="200" font-size="11" font-weight="700" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">条件更新：停在 60%</text>
<text x="352" y="222" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">WHERE paid − refunded ≥ amt</text>
<text x="352" y="242" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">第一条 UPDATE 1，第二条 UPDATE 0</text>
<text x="352" y="262" font-size="10" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">等锁后重判：40% &lt; 60%，自动拦住</text>

<rect x="636" y="178" width="288" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="652" y="200" font-size="11" font-weight="700" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">幂等键冲突：阻塞 2341 ms</text>
<text x="652" y="222" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">会话 A 持键 2 s，会话 B 同号插入</text>
<text x="652" y="242" font-size="10" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">等锁 → 23505 duplicate key</text>
<text x="652" y="262" font-size="10" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">所以上游重试超时必须大于持锁时长</text>

<text x="36" y="304" font-size="11.5" font-weight="700" fill="#334155" font-family="PingFang SC, Helvetica, Arial, sans-serif">退满判定的三种写法（20 万单 / 1 万条成功退款）</text>
<rect x="36" y="314" width="520" height="20" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="1"/>
<text x="566" y="329" font-size="10.5" fill="#7f1d1d" font-family="PingFang SC, Helvetica, Arial, sans-serif">聚合子查询（无索引）144,281 ms</text>
<rect x="36" y="342" width="120" height="20" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
<text x="166" y="357" font-size="10.5" fill="#78350f" font-family="PingFang SC, Helvetica, Arial, sans-serif">加部分索引后 923 ms</text>
<rect x="36" y="370" width="34" height="20" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1"/>
<text x="80" y="385" font-size="10.5" fill="#14532d" font-family="PingFang SC, Helvetica, Arial, sans-serif">读维护列 112 ms</text>
<text x="300" y="385" font-size="10" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">热路径读维护列，冷路径聚合校验——不一致即告警</text>
</svg>
