<text x="716" y="300" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">订阅</text>
<line x1="538" y1="366" x2="400" y2="284" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text x="60" y="372" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">虚线 = 下游事件回流到订单上下文</text>
<text x="60" y="394" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">库存/支付/履约只发事件；只有订单上下文能改订单状态</text>
<text x="60" y="416" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">（这是「一个写者」的全部含义）</text>
<line x1="536" y1="478" x2="392" y2="268" stroke="#0f766e" stroke-width="1.8" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<rect x="36" y="544" width="288" height="58" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="180.0" y="568.4" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">事务①：orders + items + outbox</text>
<text x="180.0" y="585.9" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">同一 PostgreSQL 事务</text>
<rect x="336" y="544" width="288" height="58" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="480.0" y="568.4" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">事务②：库存预占 + 发事件</text>
<text x="480.0" y="585.9" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">唯一约束兜底不超卖</text>
<rect x="636" y="544" width="288" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="780.0" y="568.4" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">事务③：消费位点 + 幂等表</text>
<text x="780.0" y="585.9" font-size="11.5" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">同事务提交，重复投递无副作用</text>
<text x="36" y="528" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">三处事务之外，任何「跨上下文一致性」都只能靠重试 + 对账，不能靠分布式事务。</text>
</svg>
