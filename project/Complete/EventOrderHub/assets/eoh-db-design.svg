<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">EventOrderHub 数据库设计：九张表与六条不变量</text>
<text x="36" y="70" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">约束挡得住的问题不写校验；约束挡不住的问题，每条配一条可执行 SQL</text>
<rect x="36" y="96" width="380" height="150" rx="10" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="36" y="90" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">订单（唯一写者）</text>
<rect x="52" y="112" width="164" height="24" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="134.0" y="128" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">orders</text>
<rect x="52" y="144" width="164" height="24" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.1"/><text x="134.0" y="160" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">order_items</text>
<rect x="52" y="176" width="164" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.1"/><text x="134.0" y="192" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">outbox</text>
<text x="232" y="128" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">幂等键部分唯一索引</text>
<text x="232" y="146" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">total_amount 生成列</text>
<text x="232" y="164" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">status 十值枚举</text>
<text x="232" y="192" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">outbox 同事务写入</text>
<rect x="436" y="96" width="240" height="150" rx="10" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="436" y="90" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">支付</text>
<rect x="452" y="112" width="208" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.1"/><text x="556.0" y="128" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">payment</text>
<rect x="452" y="144" width="208" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.1"/><text x="556.0" y="160" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">payment_callback_log</text>
<text x="452" y="190" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">SUCCEEDED ⇔ paid_at</text>
<text x="452" y="208" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">(channel, txn, type) 唯一</text>
<rect x="696" y="96" width="228" height="150" rx="10" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="696" y="90" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">库存</text>
<rect x="712" y="112" width="196" height="24" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/><text x="810.0" y="128" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">stock</text>
<rect x="712" y="144" width="196" height="24" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/><text x="810.0" y="160" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">stock_reservation</text>
<text x="712" y="190" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">reserved ≤ total</text>
<text x="712" y="208" font-size="10.5" font-weight="400" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">不用排他约束</text>
<rect x="36" y="272" width="288" height="120" rx="10" fill="none" stroke="#15803d" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="36" y="266" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">履约</text>
<rect x="52" y="288" width="256" height="24" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.1"/><text x="180.0" y="304" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">shipment</text>
<rect x="52" y="320" width="256" height="24" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.1"/><text x="180.0" y="336" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">shipment_item</text>
<text x="52" y="366" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">DELIVERED ⇔ delivered_at</text>
<rect x="344" y="272" width="220" height="120" rx="10" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="344" y="266" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">通知</text>
<rect x="360" y="288" width="188" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.1"/><text x="454.0" y="304" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif">notify_task</text>
<text x="360" y="340" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">(event, channel, tpl) 唯一</text>
<text x="360" y="358" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">attempts ≤ 11 → DEAD</text>
<rect x="584" y="272" width="340" height="120" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="596" y="294" font-size="12" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">六条不变量（约束挡不住的部分）</text>
<text x="596" y="320" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I1</text>
<text x="622" y="320" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">金额恒等 199 ms</text>
<text x="758" y="320" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I2</text>
<text x="784" y="320" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">行号连续 95 ms</text>
<text x="596" y="344" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I3</text>
<text x="622" y="344" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">库存恒等 21 ms</text>
<text x="758" y="344" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I4</text>
<text x="784" y="344" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">支付-订单 22 ms</text>
<text x="596" y="368" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I5</text>
<text x="622" y="368" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">发货前提 21 ms</text>
<text x="758" y="368" font-size="11" font-weight="700" fill="#be123c" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I6</text>
<text x="784" y="368" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">幂等唯一 52 ms</text>
<text x="36" y="414" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">状态链：支付成功 → PAID → 库存预占 → ALLOCATED → 发货 → SHIPPED → 签收 → COMPLETED</text>
<text x="36" y="434" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">I4 卡在「支付成功但订单没往前走」，I5 卡在「有发货单但订单没到 ALLOCATED」——这两条是跨上下文唯一的真相来源。</text>
<text x="36" y="456" font-size="11" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif">十张表 = 九张业务表 + outbox（第 183 天定稿）；二十个索引，每个都能说出它支撑哪条查询。</text>
</svg>
