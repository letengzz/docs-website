<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/><text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">订单中心：五个上下文与事件方向</text><text x="40" y="77" font-size="13" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">订单是唯一有权改订单状态的上下文；其余只发事件</text>
<rect x="360" y="112" width="230" height="100" rx="12" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.7"/>
<text x="376" y="140" font-size="15" text-anchor="start" fill="#1d4ed8" font-weight="700" font-family="PingFang SC, Helvetica, Arial, sans-serif">订单 Order</text>
<text x="376" y="164" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">orders / order_items</text>
<text x="376" y="180" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">order_events / outbox</text>
<text x="376" y="204" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 改状态 + 发事件</text>
<rect x="40" y="252" width="230" height="100" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.7"/>
<text x="56" y="280" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700" font-family="PingFang SC, Helvetica, Arial, sans-serif">库存 Inventory</text>
<text x="56" y="304" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">stock / stock_reservation</text>
<text x="56" y="344" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 预占 / 释放 / 扣减</text>
<rect x="360" y="330" width="230" height="100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.7"/>
<text x="376" y="358" font-size="15" text-anchor="start" fill="#b45309" font-weight="700" font-family="PingFang SC, Helvetica, Arial, sans-serif">支付 Payment</text>
<text x="376" y="382" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">payment</text>
<text x="376" y="398" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">payment_callback_log</text>
<text x="376" y="422" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 发起 / 回调 / 退款</text>
<rect x="690" y="252" width="230" height="100" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.7"/>
<text x="706" y="280" font-size="15" text-anchor="start" fill="#6d28d9" font-weight="700" font-family="PingFang SC, Helvetica, Arial, sans-serif">履约 Fulfillment</text>
<text x="706" y="304" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">shipment</text>
<text x="706" y="320" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">shipment_item</text>
<text x="706" y="344" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 发货 / 签收</text>
<rect x="690" y="112" width="230" height="100" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.7"/>
<text x="706" y="140" font-size="15" text-anchor="start" fill="#b91c1c" font-weight="700" font-family="PingFang SC, Helvetica, Arial, sans-serif">通知 Notify</text>
<text x="706" y="164" font-size="10" text-anchor="start" fill="#0f172a" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">notify_task</text>
<text x="706" y="204" font-size="11" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">· 纯消费者</text>
<line x1="270" y1="296" x2="356" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"/>
<text x="312" y="262" font-size="10" text-anchor="middle" fill="#0f766e" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">stock.reserved</text>
<line x1="420" y1="326" x2="420" y2="216" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="430" y="292" font-size="10" text-anchor="start" fill="#b45309" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">payment.succeeded</text>
<line x1="592" y1="162" x2="686" y2="280" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<text x="578" y="240" font-size="10" text-anchor="start" fill="#1d4ed8" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">order.created</text>
<line x1="592" y1="140" x2="686" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<text x="600" y="132" font-size="10" text-anchor="start" fill="#1d4ed8" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">order.*</text>
<text x="40" y="470" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">禁令：支付/库存/履约都不得 UPDATE orders.status —— 跨上下文只能发事件，由订单侧消费后推进状态机。</text>
<text x="40" y="496" font-size="12" text-anchor="start" fill="#475569" font-weight="400" font-family="PingFang SC, Helvetica, Arial, sans-serif">读方向可以直连（订单查库存快照），写方向必须走事件。</text>
</svg>
