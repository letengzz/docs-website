<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" role="img" aria-label="第 3 周验收：三份证据合成七道门">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="28" y="36" font-size="18" fill="#1f2d3d" font-weight="700" text-anchor="start">第 3 周验收：三份证据 → 一张表 → 七道门</text>
<text x="28" y="58" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">验收不是把三份报告的结论抄在一起，而是回答「哪一条结论一旦不成立，前面全部作废」</text>
<rect x="28" y="82" width="292" height="86" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="42" y="106" font-size="12.5" fill="#2b5c8a" font-weight="700" text-anchor="start">① 一致性矩阵</text>
<text x="42" y="128" font-size="11" fill="#475569" font-weight="400" text-anchor="start">ECM · 18 条用例</text>
<text x="42" y="150" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">覆盖 11/16 条迁移</text>
<path d="M 174 168 L 174 196" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
<rect x="330" y="82" width="292" height="86" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="344" y="106" font-size="12.5" fill="#2f8f7d" font-weight="700" text-anchor="start">② 并发与幂等</text>
<text x="344" y="128" font-size="11" fill="#475569" font-weight="400" text-anchor="start">ECC · 3 组竞态</text>
<text x="344" y="150" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">双成功 1000/1000 → 0</text>
<path d="M 476 168 L 476 196" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
<rect x="632" y="82" width="292" height="86" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="646" y="106" font-size="12.5" fill="#c2703a" font-weight="700" text-anchor="start">③ 压测与容量</text>
<text x="646" y="128" font-size="11" fill="#475569" font-weight="400" text-anchor="start">ECP · 4 档并发</text>
<text x="646" y="150" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">7,734 → 5,921 TPS</text>
<path d="M 778 168 L 778 196" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
<rect x="28" y="198" width="904" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="44" y="221" font-size="12.5" fill="#334155" font-weight="700" text-anchor="start">合成验收表：每条证据 → 一条判据 → 一个可勾选的结论</text>
<text x="44" y="241" font-size="11" fill="#5a6b7b" font-weight="400" text-anchor="start">18 + 3 + 8 = 29 条结论先各自判定，再合成 7 道门；任一门不成立，整周不通过</text>
<rect x="28" y="266" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="42" y="292" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G1</text>
<text x="72" y="292" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">矩阵 18 条全绿</text>
<text x="42" y="318" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="260" y="266" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="274" y="292" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G2</text>
<text x="304" y="292" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">幂等三组 0 双成功</text>
<text x="274" y="318" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="492" y="266" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="506" y="292" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G3</text>
<text x="536" y="292" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">压测零错误但超时真实</text>
<text x="506" y="318" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="724" y="266" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="738" y="292" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G4</text>
<text x="768" y="292" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">三表计数自洽</text>
<text x="738" y="318" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="28" y="362" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="42" y="388" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G5</text>
<text x="72" y="388" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">批量化有读数</text>
<text x="42" y="414" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="260" y="362" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="274" y="388" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G6</text>
<text x="304" y="388" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">四条负向仍失败</text>
<text x="274" y="414" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="492" y="362" width="218" height="76" rx="7" fill="#eef4fa" stroke="#2b5c8a" stroke-width="1.3"/>
<text x="506" y="388" font-size="13" fill="#2b5c8a" font-weight="700" text-anchor="start">G7</text>
<text x="536" y="388" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">遗留缺口已登记</text>
<text x="506" y="414" font-size="10" fill="#5a6b7b" font-weight="400" text-anchor="start">判定：通过 / 不通过</text>
<rect x="28" y="448" width="452" height="78" rx="8" fill="#fbeceb" stroke="#b4453c" stroke-width="1.3"/>
<text x="44" y="472" font-size="12" fill="#b4453c" font-weight="700" text-anchor="start">四条负向复验（必须仍然失败）</text>
<text x="44" y="494" font-size="10.5" fill="#7f1d1d" font-weight="400" text-anchor="start">重复支付回调 / 已释放后支付成功 / 重复退款 / 超卖写入</text>
<text x="44" y="514" font-size="10.5" fill="#7f1d1d" font-weight="400" text-anchor="start">任何一条变成「通过」，说明本周改动把守卫改回去了</text>
<rect x="500" y="448" width="432" height="78" rx="8" fill="#fffdf5" stroke="#c2703a" stroke-width="1.3"/>
<text x="516" y="472" font-size="12" fill="#c2703a" font-weight="700" text-anchor="start">批量化：4.5 倍吞吐与 50% 误伤</text>
<text x="516" y="494" font-size="10.5" fill="#7c4a1e" font-weight="400" text-anchor="start">1 事务 10 单：11,291 → 51,163 单/秒</text>
<text x="516" y="514" font-size="10.5" fill="#7c4a1e" font-weight="400" text-anchor="start">1% 坏单在 100 单/批下丢掉 500/1000 单</text>
</svg>
