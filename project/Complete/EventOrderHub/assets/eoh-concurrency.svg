<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif">
<defs><marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="28" y="34" font-size="18" font-weight="700" fill="#1f2d3d">三组竞态与两道守卫</text>
<text x="28" y="56" font-size="12" fill="#5a6b7b">本机实测（PostgreSQL 18 容器，两个/四个真实会话）：每格数字都是跑出来的，不是推的</text>

<rect x="28" y="76" width="288" height="150" rx="8" fill="#e9f0f7" stroke="#2b5c8a" stroke-width="1.4"/>
<text x="40" y="98" font-size="12.5" font-weight="700" fill="#1f2d3d">竞态 A · 支付 vs 超时释放</text>
<text x="40" y="119" font-size="11" fill="#5a6b7b">S1 支付：CAS → UPDATE 1（持锁 2 s）</text>
<text x="40" y="137" font-size="11" fill="#5a6b7b">S2 释放：阻塞 1.85 s → UPDATE 0</text>
<text x="40" y="157" font-size="11" fill="#2f8f7d">终态 CONSUMED，reserved=10，available=90</text>
<text x="40" y="177" font-size="11" fill="#b5432f">若释放不看影响行数：available=92 → 超卖 2</text>
<text x="40" y="197" font-size="11" fill="#5a6b7b">支付输了（已 RELEASED）→ UPDATE 0</text>
<text x="40" y="215" font-size="11" font-weight="700" fill="#b5432f">→ 必须入 orphan_payment 队列</text>

<rect x="336" y="76" width="288" height="150" rx="8" fill="#e8f4f1" stroke="#2f8f7d" stroke-width="1.4"/>
<text x="348" y="98" font-size="12.5" font-weight="700" fill="#1f2d3d">竞态 B · outbox 4 消费者</text>
<text x="348" y="119" font-size="11" fill="#5a6b7b">SKIP LOCKED：500×4=2,000</text>
<text x="348" y="137" font-size="11" fill="#5a6b7b">去重 2,000，重复 0，0.20 s</text>
<text x="348" y="157" font-size="11" fill="#b5432f">去掉 skip（固定区间）：</text>
<text x="348" y="175" font-size="11" fill="#b5432f">2,000 条里 distinct 只有 500</text>
<text x="348" y="193" font-size="11" font-weight="700" fill="#b5432f">重复 1,500（75%）</text>
<text x="348" y="213" font-size="11" fill="#5a6b7b">消费端幂等键：event_id 唯一</text>

<rect x="644" y="76" width="288" height="150" rx="8" fill="#fbf0e6" stroke="#c2703a" stroke-width="1.4"/>
<text x="656" y="98" font-size="12.5" font-weight="700" fill="#1f2d3d">竞态 C · 重复退款</text>
<text x="656" y="119" font-size="11" fill="#5a6b7b">唯一键 + CAS：S1 restored / UPDATE 1</text>
<text x="656" y="137" font-size="11" fill="#5a6b7b">S2 等 0.12 s → UPDATE 0</text>
<text x="656" y="157" font-size="11" fill="#2f8f7d">reserved 10 → 8（只回补一次），refund=1</text>
<text x="656" y="177" font-size="11" fill="#b5432f">拆掉守卫（读后写、无唯一键）：</text>
<text x="656" y="195" font-size="11" font-weight="700" fill="#b5432f">reserved 10 → 6（回补两次）</text>
<text x="656" y="215" font-size="11" fill="#5a6b7b">6 就是「货凭空多了 2 件」</text>

<line x1="28" y1="248" x2="932" y2="248" stroke="#c3ccd6"/>

<rect x="28" y="264" width="446" height="94" rx="8" fill="#f2f4f7" stroke="#6b7785" stroke-width="1.4"/>
<text x="40" y="286" font-size="12.5" font-weight="700" fill="#1f2d3d">守卫一：状态 CAS（每个迁移都带 WHERE status）</text>
<text x="40" y="307" font-size="11.5" fill="#5a6b7b">update stock_reservation set status='CONSUMED'</text>
<text x="40" y="325" font-size="11.5" fill="#5a6b7b">where order_no=$1 and status='HELD' returning id;</text>
<text x="40" y="346" font-size="11.5" fill="#b5432f">只剩一个赢家；但「谁该赢」要靠业务规则（支付优先）</text>

<rect x="492" y="264" width="440" height="94" rx="8" fill="#efecf7" stroke="#5b4a8a" stroke-width="1.4"/>
<text x="504" y="286" font-size="12.5" font-weight="700" fill="#1f2d3d">守卫二：唯一键（把幂等写进库层）</text>
<text x="504" y="307" font-size="11.5" fill="#5a6b7b">refund(order_no unique) / outbox(event_id unique)</text>
<text x="504" y="325" font-size="11.5" fill="#5a6b7b">on conflict do nothing → 影响 0 行即「已经做过」</text>
<text x="504" y="346" font-size="11.5" fill="#5b4a8a">应用层「先查再写」在并发下必然漏（本页 D2 反例）</text>

<rect x="28" y="376" width="904" height="76" rx="8" fill="#eaf4e6" stroke="#4a7d3a" stroke-width="1.4"/>
<text x="40" y="398" font-size="12.5" font-weight="700" fill="#1f2d3d">幂等三层：请求层（Idempotency-Key）· 事件层（event_id）· 状态层（CAS）</text>
<text x="40" y="419" font-size="11.5" fill="#5a6b7b">三层各挡一类失败，缺一层就漏一类：连点 / 重复投递 / 丢失更新。第三层挡不住「两个迁移都合法」——那是业务规则的事。</text>
<text x="40" y="438" font-size="11.5" fill="#4a7d3a">判据 ECC-A~H：CAS 谓词、按影响行数分支、孤儿队列、只用 SKIP LOCKED、回补与改状态同语句、A9 不变量</text>
</svg>
