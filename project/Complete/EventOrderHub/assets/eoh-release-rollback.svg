<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
<text x="36" y="44" font-size="23" font-weight="700" fill="#0f172a" font-family="PingFang SC, Helvetica, Arial, sans-serif">发布五阶段与两条出口</text>
<text x="36" y="70" font-size="12.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每个阶段只有「指标达标才前进」；任何一条告警触发，就按预演过的路径退回上一版</text>
<rect x="36" y="100" width="168" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="48" y="124" font-size="12" font-weight="700" fill="#b45309" font-family="PingFang SC, Helvetica, Arial, sans-serif">P0 preflight</text>
<text x="48" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">扫不可回滚语句</text>
<text x="48" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">镜像/配置版本</text>
<line x1="204" y1="148" x2="214" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="214" y="100" width="168" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="226" y="124" font-size="12" font-weight="700" fill="#1d4ed8" font-family="PingFang SC, Helvetica, Arial, sans-serif">P1 金丝雀</text>
<text x="226" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">起 1 实例不接流</text>
<text x="226" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">readiness+warmup</text>
<line x1="382" y1="148" x2="392" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="392" y="100" width="168" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="404" y="124" font-size="12" font-weight="700" fill="#0f766e" font-family="PingFang SC, Helvetica, Arial, sans-serif">P2 切流 5%</text>
<text x="404" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">观察 5 min</text>
<text x="404" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">≥1,500 样本</text>
<line x1="560" y1="148" x2="570" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="570" y="100" width="168" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="582" y="124" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">P3 50% → 100%</text>
<text x="582" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">每档重判</text>
<text x="582" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">并发类问题在此暴露</text>
<line x1="738" y1="148" x2="748" y2="148" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="748" y="100" width="168" height="96" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="760" y="124" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">P4 收尾</text>
<text x="760" y="146" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">保留旧版 N 分钟</text>
<text x="760" y="163" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">写发布记录</text>
<rect x="36" y="224" width="434" height="96" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="48" y="248" font-size="12" font-weight="700" fill="#15803d" font-family="PingFang SC, Helvetica, Arial, sans-serif">出口条件：四条判据全绿</text>
<text x="48" y="270" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">p99 ≤ 基线 × 1.5（相对，非绝对）</text>
<text x="48" y="287" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">积压累计增长 ≤ 1,000 行</text>
<text x="48" y="304" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">readiness 翻转 &lt; 1 次</text>
<rect x="490" y="224" width="434" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="502" y="248" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">为什么不能用绝对阈值</text>
<text x="502" y="270" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">500 ms 阈值对 1.6 倍劣化（129→206 ms）</text>
<text x="502" y="287" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">检出 0/200；相对判据 159/200</text>
<rect x="36" y="348" width="200" height="84" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="48" y="372" font-size="12" font-weight="700" fill="#b91c1c" font-family="PingFang SC, Helvetica, Arial, sans-serif">中止</text>
<text x="48" y="394" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">不继续</text>
<line x1="236" y1="390" x2="250" y2="390" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="250" y="348" width="674" height="84" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="262" y="372" font-size="12" font-weight="700" fill="#6d28d9" font-family="PingFang SC, Helvetica, Arial, sans-serif">回滚四步（快路径共 9 min = 月预算 20.8%）</text>
<text x="262" y="394" font-size="10.5" fill="#475569" font-family="PingFang SC, Helvetica, Arial, sans-serif">① 切权重回 0（秒级）→ ② 等旧版接住（≤120 s）→ ③ 验证积压回落 → ④ 写发布记录</text>
</svg>
