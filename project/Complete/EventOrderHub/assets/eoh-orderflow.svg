<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="40" y="50" font-size="23" font-weight="700" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">下单链路：一个事务写四处，一个投递器搬出去</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事务边界之内只有数据库；Kafka 在边界之外，靠 outbox + 至少一次投递补齐</text>
<rect x="40" y="100" width="600" height="230" rx="10" fill="#f8fafc" stroke="#1d4ed8" stroke-dasharray="6 4"/>
<text x="56" y="124" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">① 本地事务（PostgreSQL）</text>
<rect x="60" y="140" width="150" height="60" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
<text x="135.0" y="167.5" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">幂等键校验</text>
<text x="135.0" y="182.5" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">command_id 唯一</text>
<rect x="230" y="140" width="150" height="60" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="305.0" y="167.5" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">状态机守卫</text>
<text x="305.0" y="182.5" font-size="12" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">条件 UPDATE</text>
<rect x="400" y="140" width="210" height="60" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="505.0" y="167.5" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">orders / order_items</text>
<text x="505.0" y="182.5" font-size="12" font-weight="400" fill="#6d28d9" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">INSERT 一单多行</text>
<rect x="60" y="226" width="150" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="135.0" y="253.5" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">stock_reservation</text>
<text x="135.0" y="268.5" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">HELD 态占位</text>
<rect x="230" y="226" width="150" height="60" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4"/>
<text x="305.0" y="253.5" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">outbox</text>
<text x="305.0" y="268.5" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">同一事务写入</text>
<rect x="400" y="226" width="210" height="60" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
<text x="505.0" y="253.5" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">COMMIT</text>
<text x="505.0" y="268.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">四处一起成功或一起失败</text>
<line x1="210" y1="170" x2="228" y2="170" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="380" y1="170" x2="398" y2="170" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ahb)"/>
<line x1="500" y1="200" x2="500" y2="224" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="210" y1="256" x2="228" y2="256" stroke="#b45309" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="380" y1="256" x2="398" y2="256" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ahr)"/>
<rect x="680" y="140" width="240" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="800.0" y="172.6" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">投递器（worker）</text>
<text x="800.0" y="187.1" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">FOR UPDATE SKIP LOCKED</text>
<rect x="680" y="226" width="240" height="60" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
<text x="800.0" y="253.6" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">Kafka topic</text>
<text x="800.0" y="268.1" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">order.events / 至少一次</text>
<rect x="680" y="302" width="240" height="60" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="800.0" y="329.6" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">消费端幂等表</text>
<text x="800.0" y="344.1" font-size="11.5" font-weight="400" fill="#0f766e" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">event_id 唯一</text>
<line x1="642" y1="256" x2="678" y2="180" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ahr)"/>
<line x1="800" y1="212" x2="800" y2="224" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="800" y1="288" x2="800" y2="300" stroke="#0f766e" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="748" y="128" font-size="11" font-weight="400" fill="#475569" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事务提交之后才开始</text>
<rect x="40" y="356" width="430" height="78" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="255.0" y="385.3" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">为什么不能直接发 Kafka</text>
<text x="255.0" y="399.8" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">事务里发消息 = 消息发了但库回滚 / 库提交了消息没发</text>
<text x="255.0" y="414.3" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">两种都发生过，且都不可自动修复</text>
<rect x="490" y="356" width="430" height="78" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="705.0" y="385.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">为什么投递器要 SKIP LOCKED</text>
<text x="705.0" y="399.8" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">两路并发取到同一批 → 重复投递</text>
<text x="705.0" y="414.3" font-size="11.5" font-weight="400" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">实测：去掉后两路各 500 条、重复 500 条</text>
<text x="40" y="470" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">验收口径：下单一次 ⇒ orders +1、order_items +n、stock_reservation +1、outbox +1；消费端处理两次 ⇒ 读模型只 +1</text>
<text x="40" y="496" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-family="PingFang SC, Helvetica, Arial, sans-serif" xml:space="preserve">回滚口径：库存不够 ⇒ 四张表都不留痕（同一个事务），而不是「建了单再删单」</text>
</svg>
