<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="库存预占的三态与双向竞态：支付确认与超时释放同时争抢同一行">
  <title>库存预占：三态迁移与双向竞态</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">库存预占：三态迁移与双向竞态</text>
  <text x="24" y="58" font-size="13" fill="#475569">同一行 HELD 会被两条链路同时推进；赢家只有一个，输家必须安静退出</text>

  <rect x="40" y="96" width="180" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">HELD 已预占</text>
  <text x="130" y="146" text-anchor="middle" font-size="12.5" fill="#475569">库存已扣 available</text>
  <text x="130" y="166" text-anchor="middle" font-size="12.5" fill="#475569">等待支付确认或超时</text>

  <rect x="380" y="96" width="180" height="86" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="470" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CONSUMED 已扣减</text>
  <text x="470" y="146" text-anchor="middle" font-size="12.5" fill="#475569">终态 · 不可再释放</text>
  <text x="470" y="166" text-anchor="middle" font-size="12.5" fill="#475569">由支付成功事件推进</text>

  <rect x="380" y="248" width="180" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="470" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">RELEASED 已释放</text>
  <text x="470" y="298" text-anchor="middle" font-size="12.5" fill="#475569">终态 · 不可再扣减</text>
  <text x="470" y="318" text-anchor="middle" font-size="12.5" fill="#475569">由超时任务推进</text>

  <path d="M 220 126 L 374 126" stroke="#15803d" stroke-width="2" marker-end="url(#arw)"/>
  <text x="298" y="116" text-anchor="middle" font-size="12" fill="#15803d">支付成功 + CAS</text>

  <path d="M 220 152 L 374 278" stroke="#b45309" stroke-width="2" marker-end="url(#arw)"/>
  <text x="252" y="216" font-size="12" fill="#b45309">超时 + CAS</text>

  <path d="M 470 182 L 470 242" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="480" y="214" font-size="12" fill="#64748b">两支互斥</text>

  <rect x="620" y="96" width="300" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="636" y="122" font-size="14" font-weight="700" fill="#0f172a">两条链路的写入方式</text>
  <text x="636" y="148" font-size="12.5" fill="#475569">① 支付确认：更新 reservation 后同事务写 outbox</text>
  <text x="636" y="170" font-size="12.5" fill="#475569">② 超时释放：先 CAS 改状态，再写 outbox</text>
  <text x="636" y="196" font-size="12.5" fill="#475569">③ 两支都带 WHERE status='HELD'</text>
  <text x="636" y="218" font-size="12.5" fill="#475569">④ 影响 0 行 = 对方已赢 → 安静退出</text>
  <text x="636" y="244" font-size="12.5" fill="#475569">⑤ 释放同时回补 stock.available</text>
  <text x="636" y="266" font-size="12.5" fill="#475569">⑥ 回补只在 CAS 成功时执行</text>
  <text x="636" y="292" font-size="12.5" fill="#475569">⑦ 事件在事务内写，不在提交后发</text>
  <text x="636" y="318" font-size="12.5" fill="#b91c1c">⑧ 禁止先发事件后改状态（会放出假事件）</text>

  <rect x="40" y="368" width="880" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="58" y="392" font-size="13" font-weight="700" fill="#1e3a8a">扫描纪律：三列复合索引 (status, expires_at, id) + ORDER BY id + FOR UPDATE SKIP LOCKED + 限批 500</text>
  <text x="58" y="414" font-size="12.5" fill="#334155">按 id 排序释放让所有事务以同一顺序申请行锁，显著降低死锁率；SKIP LOCKED 让多个扫描实例互不阻塞。</text>
  <text x="58" y="434" font-size="12.5" fill="#334155">不变量：available + held 恒等于 total；HELD 行的 expires_at 过期超过宽限期即视为「该释放却没释放」。</text>
</svg>
