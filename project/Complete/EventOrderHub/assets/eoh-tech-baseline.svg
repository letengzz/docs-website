<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="订单中心的技术基线与三条能力边界：事务边界、事件投递、缓存降级">
  <defs>
    <marker id="eohArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">技术基线：一条事务边界，一条投递路径，一条降级路径</text>

  <rect x="40" y="60" width="300" height="120" rx="12" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="58" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">① 事务边界 · PostgreSQL 18.6</text>
  <text x="58" y="110" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">orders + order_items + outbox 同库同事务</text>
  <text x="58" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">状态推进用条件更新（version 列）</text>
  <text x="58" y="154" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">不用 XA、不用 Seata：跨库只在「订单 → 库存」</text>

  <rect x="370" y="60" width="300" height="120" rx="12" fill="#ecfdf5" stroke="#b6e3dd"/>
  <text x="388" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f766e">② 事件投递 · Kafka 4.2（KRaft）</text>
  <text x="388" y="110" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">outbox 表 → 投递器（SKIP LOCKED）→ Kafka</text>
  <text x="388" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">消费端按 event_id 幂等（去重表）</text>
  <text x="388" y="154" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">至少一次投递，不追求端到端 exactly-once</text>

  <rect x="700" y="60" width="200" height="120" rx="12" fill="#fff7ed" stroke="#f5d0b0"/>
  <text x="718" y="86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c2410c">③ 缓存 · Redis 8.2</text>
  <text x="718" y="110" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">幂等键、热点商品快照</text>
  <text x="718" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">按「可丢」设计</text>
  <text x="718" y="154" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">不做锁、不做唯一性判定</text>

  <rect x="40" y="206" width="860" height="96" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
  <text x="58" y="232" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">为什么是「先 outbox 再 Kafka」，不是「直接发 Kafka」</text>
  <text x="58" y="256" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">直接发：写库成功、发消息失败 → 订单永远等不到库存预占（需要一个「反向补偿」的补偿器）</text>
  <text x="58" y="278" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">outbox：消息与业务数据同一事务落库，投递器只负责「搬运」；失败可无限重试，积压可观测</text>

  <rect x="40" y="318" width="420" height="126" rx="10" fill="#fef2f2" stroke="#f5c2c2"/>
  <text x="58" y="344" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#b91c1c">明确不做（三条）</text>
  <text x="58" y="368" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· Kafka 事务消息替代 outbox（跨系统仍非原子）</text>
  <text x="58" y="390" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· Redis 分布式锁保证库存不超卖</text>
  <text x="58" y="412" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">· 端到端 exactly-once（只做「至少一次 + 幂等」）</text>

  <rect x="480" y="318" width="420" height="126" rx="10" fill="#eff6ff" stroke="#bfd3f5"/>
  <text x="498" y="344" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">本地最小可跑集（3 个容器）</text>
  <text x="498" y="368" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">postgres:18.6（含 pg_stat_statements）</text>
  <text x="498" y="390" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">apache/kafka:4.2.1（KRaft 单节点）</text>
  <text x="498" y="412" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#334155">redis:8.2（appendonly yes）</text>

  <rect x="40" y="462" width="860" height="44" rx="8" fill="#ecfdf5" stroke="#b6e3dd"/>
  <text x="58" y="490" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#0f766e">验收口径：docker compose config 通过 + 三个容器 healthy + 一次「下单 → outbox → 消费」闭环跑通</text>
</svg>
