<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="预检隔离与分组批写">
  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#f8fafc"/>
  <text x="40" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">把坏单挡在批外：预检 → 分组 → 批写 → 兜底</text>

  <rect x="40" y="66" width="150" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="115" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">一批 30 单</text>
  <text x="115" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">待写入</text>
  <text x="115" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">含重复 / 冲突</text>

  <rect x="225" y="66" width="170" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="310" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">① 预检</text>
  <text x="310" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">一次 ANY($1) 查询</text>
  <text x="310" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">命中即走幂等路径</text>

  <rect x="430" y="66" width="170" height="78" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="515" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5b21b6">② 分组</text>
  <text x="515" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">按 warehouse_id</text>
  <text x="515" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4c1d95">跨仓互不影响</text>

  <rect x="635" y="66" width="225" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="747" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">③ 批写（每组一事务）</text>
  <text x="747" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">INSERT ... ON CONFLICT DO NOTHING</text>
  <text x="747" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">持仓: 返回行数 = 新单数</text>

  <line x1="192" y1="105" x2="221" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="397" y1="105" x2="426" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="602" y1="105" x2="631" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#b1)"/>

  <!-- 兜底 -->
  <rect x="430" y="196" width="430" height="78" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="446" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#92400e">④ 差集兜底：只重放失败的那几条</text>
  <text x="446" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">库存扣减用 UPDATE ... FROM (VALUES ...) RETURNING 反推未命中 sku</text>
  <text x="446" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">写进 write_batch.retried_single，爆炸半径从「整批」缩到「一条」</text>

  <line x1="747" y1="146" x2="747" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#b1)"/>
  <text x="756" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">未命中</text>

  <!-- 幂等旁路 -->
  <rect x="40" y="196" width="355" height="78" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">预检命中的单：直接返回已有结果</text>
  <text x="56" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#475569">这不是「错误」，是幂等（重放不产生第二次写入）</text>
  <text x="56" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#475569">计入 write_batch.deduped，与 inserted 相加 = size</text>

  <path d="M 310 146 L 310 176 L 218 176 L 218 192" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b1)"/>

  <!-- 失败放大表 -->
  <rect x="40" y="300" width="820" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="324" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">为什么批 100 反而更慢（坏单率 1%，整批回滚）</text>
  <text x="56" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#475569">整批成功率：b=10 → 90.4%　b=30 → 74.0%　b=100 → 36.6%　b=300 → 4.9%</text>
  <text x="56" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#475569">有效加速（成功 4.5×、失败退化为 1×）：b=10 → 4.17×　b=30 → 3.59×　b=100 → 2.28×</text>
  <text x="56" y="388" font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">结论：生产取 30；饱和点 100 只作理论上限。</text>
</svg>
