<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="交易通知的触达闭环与八条验收">
  <rect x="0" y="0" width="920" height="470" fill="#f8fafc"/>
  <text x="32" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">第 4 周补充：从「写一行通知」到「证明送达」</text>
  <text x="32" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">一条 notify_task 同时表达「消息」与「尝试」，于是发失败、发重复、发了没到三者长得一样</text>

  <defs><marker id="en1" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>

  <rect x="32" y="76" width="150" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="107" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#1e40af">订单事件</text>
  <text x="107" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">paid / shipped / refunded</text>
  <line x1="184" y1="109" x2="198" y2="109" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#en1)"/>

  <rect x="200" y="76" width="196" height="66" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.4"/>
  <text x="298" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f766e">决策五步</text>
  <text x="298" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">可达 → 偏好 → 静默 → 配额 → 渲染</text>
  <text x="298" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">退订是终止，不是降级</text>
  <line x1="398" y1="109" x2="412" y2="109" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#en1)"/>

  <rect x="414" y="76" width="160" height="66" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="494" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#1e40af">outbox（写时渲染）</text>
  <text x="494" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">unique(event,user,dedup)</text>
  <line x1="576" y1="109" x2="590" y2="109" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#en1)"/>

  <rect x="592" y="76" width="140" height="66" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="662" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#1e40af">投递尝试</text>
  <text x="662" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">send_group_id</text>
  <line x1="734" y1="109" x2="748" y2="109" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#en1)"/>

  <rect x="750" y="76" width="138" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="819" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#92400e">回执状态机</text>
  <text x="819" y="122" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#78350f">state_rank 单调</text>

  <text x="32" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">三张表各自解决的问题</text>
  <rect x="32" y="188" width="270" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#1e40af">notification_outbox</text>
  <text x="46" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">一条消息一行，唯一键即幂等闸门</text>
  <text x="46" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">next_at 承担退避，expire_at 决定放弃</text>
  <text x="46" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">payload 存已渲染结果与地址快照</text>

  <rect x="314" y="188" width="286" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="328" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#0f766e">notification_delivery</text>
  <text x="328" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">一次尝试一行，同组 delivered 唯一</text>
  <text x="328" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">回执只按 state_rank 前进</text>
  <text x="328" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">乱序回执影响 0 行 = 正常结果</text>

  <rect x="612" y="188" width="276" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="626" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#5b21b6">notification_inbox</text>
  <text x="626" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">站内信读模型（写扩散的一半）</text>
  <text x="626" y="248" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#334155">read_at 时间戳而非布尔</text>
  <text x="626" y="266" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c">部分索引只索引未读行</text>

  <text x="32" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#64748b">N1~N8 验收：每条都能一条 SQL 或一次 curl 判定</text>
  <rect x="32" y="320" width="856" height="34" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="46" y="342" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#115e59">N1 事件投两次只 1 行 ｜ N2 站内信与短信各一行 ｜ N3 退订后不发且不降级 ｜ N4 静默只压短信、站内信立即写</text>
  <rect x="32" y="358" width="856" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="46" y="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#1e40af">N5 迟到 ACCEPTD 不回退 ｜ N6 同组 delivered 唯一 ｜ N7 缺变量落 failed ｜ N8 连发 12 条只过 2 条</text>

  <text x="32" y="416" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c">涉钱通知（退款、扣款失败）必须豁免静默时段：不发的代价高于打扰的代价</text>
  <text x="32" y="438" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">实测：FIFO 单队列下事务消息 p99 51.82 s；双队列优先后 0.00 s，营销只涨 0.37 s</text>
  <text x="32" y="458" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">N5 与 N6 是这一步的核心：对应 bug 只在回执乱序与降级超时时出现</text>
</svg>
