<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" width="960" height="596" role="img">
<title>第 1 周收口：七道门与一张契约面</title>
<rect x="0" y="0" width="960" height="596" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
</defs>
<text x="32" y="44" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">第 1 周收口：设计能「照着实现」的七道门</text>
<text x="32" y="70" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">前四天各交一份设计，第五天要回答的是：把它们拼起来，还有没有说不清的地方</text>
<rect x="32" y="94" width="640" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="48" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">G1</text>
<text x="90" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="start">需求</text>
<text x="160" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">10 状态 / 16 迁移全可达</text>
<text x="656" y="124" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EOH</text>
<rect x="32" y="146" width="640" height="48" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="48" y="176" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#047857" font-weight="700" text-anchor="start">G2</text>
<text x="90" y="176" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#047857" font-weight="700" text-anchor="start">选型</text>
<text x="160" y="176" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">3 容器 healthy + 版本对齐</text>
<text x="656" y="176" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">ETS</text>
<rect x="32" y="198" width="640" height="48" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="48" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b45309" font-weight="700" text-anchor="start">G3</text>
<text x="90" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b45309" font-weight="700" text-anchor="start">架构</text>
<text x="160" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">4 topic / 6 字段信封 / 零重复</text>
<text x="656" y="228" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EOA</text>
<rect x="32" y="250" width="640" height="48" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="48" y="280" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6d28d9" font-weight="700" text-anchor="start">G4</text>
<text x="90" y="280" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#6d28d9" font-weight="700" text-anchor="start">数据库</text>
<text x="160" y="280" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">10 表 + 6 不变量全 0</text>
<text x="656" y="280" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EDB</text>
<rect x="32" y="302" width="640" height="48" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="48" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#4338ca" font-weight="700" text-anchor="start">G5</text>
<text x="90" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#4338ca" font-weight="700" text-anchor="start">契约</text>
<text x="160" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">8 端点 × 幂等 × 迁移 × 错误码</text>
<text x="656" y="332" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EW1-A~D</text>
<rect x="32" y="354" width="640" height="48" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="48" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start">G6</text>
<text x="90" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="start">对齐</text>
<text x="160" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">契约字段 ⇄ DDL 列 100% 命中</text>
<text x="656" y="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EW1-E~G</text>
<rect x="32" y="406" width="640" height="48" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
<text x="48" y="436" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#15803d" font-weight="700" text-anchor="start">G7</text>
<text x="90" y="436" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#15803d" font-weight="700" text-anchor="start">闸门</text>
<text x="160" y="436" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">一条命令跑完，输出 PASS</text>
<text x="656" y="436" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="end">EW1-H</text>
<rect x="700" y="94" width="228" height="300" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="716" y="120" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#334155" font-weight="700" text-anchor="start">契约面：三类断言</text>
<text x="716" y="148" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4338ca" font-weight="700" text-anchor="start">① 幂等</text>
<text x="716" y="168" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">每个写接口都有键来源</text>
<text x="716" y="190" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">（Header / 业务键 / 复合）</text>
<text x="716" y="218" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4338ca" font-weight="700" text-anchor="start">② 迁移</text>
<text x="716" y="238" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">接口 ⇄ 状态迁移双向覆盖</text>
<text x="716" y="260" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">没有孤儿接口、没有孤儿迁移</text>
<text x="716" y="288" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#4338ca" font-weight="700" text-anchor="start">③ 错误码</text>
<text x="716" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">端点声明的码都在总表里</text>
<text x="716" y="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">且每个码都有触发条件</text>
<text x="716" y="358" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700" text-anchor="start">三条都过，才叫</text>
<text x="716" y="378" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700" text-anchor="start">「可照着实现」</text>
<rect x="32" y="470" width="896" height="58" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="48" y="492" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#c2410c" font-weight="700" text-anchor="start">收口当天发现的两个缺口（此前四天各自都没错）</text>
<text x="48" y="514" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">① 取消接口没有幂等键 → 重试把 PAID 订单推进两次 REFUNDING；② 契约的 amount_unit 与 DDL 金额列单位未约定</text>
<text x="32" y="552" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">七道门全绿 = 第 1 周验收通过；任一为红，第 2 周不允许开始编码（返工成本按小时计，不是按天）</text>
<text x="32" y="576" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">判据族 EW1-A ~ EW1-H；每条都能用页面「如何验证」里的命令复跑</text>
</svg>
