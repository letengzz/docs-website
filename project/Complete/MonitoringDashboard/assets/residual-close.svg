<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="遗留项结清：L1 / L2 / L4 的对象、今天的结论，以及判据失效的三种形态">
  <title>遗留项结清：L1 / L2 / L4 与判据失效的三种形态</title>
  <defs>
    <marker id="rc-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="30" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">遗留项结清：把 ⏳ 逐条换成实测数字</text>
  <text x="30" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">今天不新增功能，只做一件事：让此前标着「未跑」的格子，换成机器真实打印出来的读数。</text>

  <!-- 三行：L1 / L2 / L4 -->
  <rect x="30" y="90" width="404" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">L1  C6 的三条动态判据</text>
  <text x="46" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">DA-A 白名单 ................ 通过 5/5（未登记 404）</text>
  <text x="46" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">DA-D 点数预算 ............ 8 序列查询下 4508 &gt; 2000</text>
  <text x="46" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">DA-H 校验脚本 ............ 通过（先修 DA3 自匹配）</text>

  <rect x="452" y="90" width="418" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="468" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">L2  五条静态对账 + 规则热更新</text>
  <text x="468" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">RR-C 原子性 ............... 通过：reload 500 + previous rule set restored</text>
  <text x="468" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">W2-B / D / E ............... 通过</text>
  <text x="468" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">W2-F 被喂错输入 · W2-G 对象不存在</text>

  <rect x="30" y="198" width="404" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="224" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">L4  容量与保留策略</text>
  <text x="46" y="246" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">写入速率 ........ 12.76 MiB/d（84 序列、15s）</text>
  <text x="46" y="266" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">15d 外推 ........ 191 MiB · 每样本 ≈ 70 B</text>
  <text x="46" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">sample_limit=2 → up=0「sample limit exceeded」</text>

  <rect x="452" y="198" width="418" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="468" y="224" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="start">R-7  出海口的三段式静态校验</text>
  <text x="468" y="246" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">A1 有告警规则文件 ⇒ A2 必须有 alerting.alertmanagers</text>
  <text x="468" y="266" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">A3 运行期 activeAlertmanagers ≥ 1</text>
  <text x="468" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#0f766e" text-anchor="start">用真缺陷版本 stage0.yaml 实测抓得到（A2+A3）</text>

  <!-- 分隔 -->
  <line x1="30" y1="316" x2="870" y2="316" stroke="#e2e8f0"/>

  <!-- 竞态 -->
  <text x="30" y="344" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">今天最关键的运行期发现：「写完立刻 reload」是一次竞态</text>
  <rect x="30" y="356" width="200" height="46" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="130" y="376" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">写入后 0 秒 reload</text>
  <text x="130" y="393" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">0 / 8 读到新内容</text>
  <rect x="244" y="356" width="200" height="46" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="344" y="376" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">回读指纹确认后 reload</text>
  <text x="344" y="393" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">5 / 5 生效（70~79ms）</text>
  <rect x="458" y="356" width="412" height="46" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="474" y="376" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">失效形态是静默的：reload 200 + 日志 Completed + 规则一条没换。</text>
  <text x="474" y="393" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">换挂载粒度不能解决（单文件 0/3、目录 0/5）——真因是 ~0.09s 的传播窗口。</text>

  <!-- 三种形态 -->
  <text x="30" y="440" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">今天跑出来的，多半不是「系统错了」，而是「判据错了」——同一类问题的三种形态</text>
  <rect x="30" y="454" width="272" height="86" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="46" y="478" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9f1239" text-anchor="start">① 判据恒真</text>
  <text x="46" y="500" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">DA3 自匹配（模式串写在被搜文件里）</text>
  <text x="46" y="517" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">INV-1/3 断言在「规范化之后」</text>
  <text x="46" y="534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">DA-D 数据稀疏时恒取 0 点</text>

  <rect x="314" y="454" width="272" height="86" rx="10" fill="#fef9c3" stroke="#fde047"/>
  <text x="330" y="478" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#854d0e" text-anchor="start">② 判据被喂错输入</text>
  <text x="330" y="500" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">W2-F 对着「联调简化版」判</text>
  <text x="330" y="517" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">alertmanager.yaml 的 severity</text>
  <text x="330" y="534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">接受域 → 恒真，且看不出</text>

  <rect x="598" y="454" width="272" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="614" y="478" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start">③ 判据的对象不存在</text>
  <text x="614" y="500" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">W2-G：runbook_url 出现 0 次</text>
  <text x="614" y="517" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">第三张大盘：prometheus_tsdb_*</text>
  <text x="614" y="534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">不存在（采集器不抓自己）</text>

  <!-- 底部结论 -->
  <rect x="30" y="556" width="840" height="44" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="46" y="575" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="start">三种形态的共同点只有一句话：它们都不会失败，因此都不会被发现。</text>
  <text x="46" y="592" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="start">能发现它们的只有一件事——给每条判据跑一个「期望为失败」的用例（今天靠它抓出五处）。</text>
</svg>
