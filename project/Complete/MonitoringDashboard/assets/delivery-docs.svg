<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="delivery-docs.svg">
  <title>三份交付文档各只回答一个问题</title>
  <rect x="0" y="0" width="900" height="660" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">三份交付文档各只回答一个问题：读者不同、时机不同、形态就不同</text>

  <rect x="32" y="92" width="270" height="42" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">《从零复现指南》</text>
  <text x="46" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#334155">要的是顺序 · 篇幅 ≤ 80 行</text>

  <rect x="315" y="92" width="270" height="42" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="329" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">《上线验收清单》</text>
  <text x="329" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#334155">要的是判据 · 篇幅 ≤ 120 行</text>

  <rect x="598" y="92" width="270" height="42" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="612" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">《故障应对索引》</text>
  <text x="612" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#334155">要的是检索 · 篇幅 ≤ 100 行</text>

  <rect x="32" y="142" width="270" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="162" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">唯一问题</text>
  <text x="46" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#334155">在一台机器上从零到看见三张</text>
  <text x="46" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#334155">大盘，按什么顺序敲哪些命令</text>

  <rect x="315" y="142" width="270" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="329" y="162" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">唯一问题</text>
  <text x="329" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#334155">交付前逐条勾哪 24 项，每一项</text>
  <text x="329" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#334155">的通过标准与证据是什么</text>

  <rect x="598" y="142" width="270" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="612" y="162" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">唯一问题</text>
  <text x="612" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#334155">出问题时先看哪个现象、跑哪</text>
  <text x="612" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#334155">条命令、找谁</text>

  <rect x="32" y="222" width="270" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#334155">读者：第一次接触这个项目的人</text>
  <text x="46" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">不回答：系统由哪些组件组成</text>

  <rect x="315" y="222" width="270" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="329" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#334155">读者：签字交付的人（执行者）</text>
  <text x="329" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">不回答：为什么这样设计</text>

  <rect x="598" y="222" width="270" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="612" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#334155">读者：凌晨被叫起来处理的人</text>
  <text x="612" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">不回答：组件有哪些配置项</text>

  <rect x="32" y="274" width="270" height="76" rx="9" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="46" y="294" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f766e">第一屏：读者要做的动作</text>
  <text x="46" y="314" font-family="system-ui, sans-serif" font-size="10" fill="#334155">按 0 → 5 顺序执行；每一步之后</text>
  <text x="46" y="330" font-family="system-ui, sans-serif" font-size="10" fill="#334155">停一下，核对「应该看到什么」；</text>
  <text x="46" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#334155">对不上就停在第几步。</text>

  <rect x="315" y="274" width="270" height="76" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="329" y="294" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">第一屏：读者要做的动作</text>
  <text x="329" y="314" font-family="system-ui, sans-serif" font-size="10" fill="#334155">从上往下逐条跑，每条把「命令</text>
  <text x="329" y="330" font-family="system-ui, sans-serif" font-size="10" fill="#334155">/ 实测值 / 判定」三格填满，再</text>
  <text x="329" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#334155">走下一条。</text>

  <rect x="598" y="274" width="270" height="76" rx="9" fill="#fee2e2" stroke="#ef4444"/>
  <text x="612" y="294" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">第一屏：读者要做的动作</text>
  <text x="612" y="314" font-family="system-ui, sans-serif" font-size="10" fill="#334155">先在最左列找到你看到的现象，</text>
  <text x="612" y="330" font-family="system-ui, sans-serif" font-size="10" fill="#334155">再往右执行；不要从中间列开始</text>
  <text x="612" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#334155">猜，也不要先想根因。</text>

  <rect x="32" y="358" width="270" height="100" rx="9" fill="#ffffff" stroke="#ef4444"/>
  <text x="46" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">写了等于没写</text>
  <text x="46" y="398" font-family="system-ui, sans-serif" font-size="10" fill="#334155">第 0 步写成「请确保环境满足</text>
  <text x="46" y="414" font-family="system-ui, sans-serif" font-size="10" fill="#334155">要求」——读者能做的动作是点头。</text>
  <text x="46" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155">正确形态：一条命令 + 三个退出</text>
  <text x="46" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#334155">码，判据从文档搬进脚本。</text>

  <rect x="315" y="358" width="270" height="100" rx="9" fill="#ffffff" stroke="#ef4444"/>
  <text x="329" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">写了等于没写</text>
  <text x="329" y="398" font-family="system-ui, sans-serif" font-size="10" fill="#334155">期望值写形容词：「服务应正常</text>
  <text x="329" y="414" font-family="system-ui, sans-serif" font-size="10" fill="#334155">运行」——无法判、也无法反驳；</text>
  <text x="329" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155">任何一次交付都能宣称满足它。</text>
  <text x="329" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#334155">改成数字或布尔才叫判据。</text>

  <rect x="598" y="358" width="270" height="100" rx="9" fill="#ffffff" stroke="#ef4444"/>
  <text x="612" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">写了等于没写</text>
  <text x="612" y="398" font-family="system-ui, sans-serif" font-size="10" fill="#334155">第一层按组件分类：「一、</text>
  <text x="612" y="414" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Prometheus 二、Alertmanager」</text>
  <text x="612" y="430" font-family="system-ui, sans-serif" font-size="10" fill="#334155">被叫起来的人不知道自己是第几</text>
  <text x="612" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#334155">类问题。分类必须是现象。</text>

  <rect x="32" y="476" width="836" height="72" rx="12" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="48" y="500" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3730a3">引用方向不允许成环</text>
  <text x="48" y="522" font-family="system-ui, sans-serif" font-size="11" fill="#334155">从零复现指南 → 上线验收清单 → 故障应对索引 →（环境被破坏了）回到第 0 步，单向不回环。</text>
  <text x="48" y="542" font-family="system-ui, sans-serif" font-size="11" fill="#334155">禁止引用内部编号：DA6 / LA-3 / ACV-B 会随迭代漂移，索引只引用现象描述。</text>

  <rect x="32" y="566" width="836" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="588" font-family="system-ui, sans-serif" font-size="11" fill="#334155">判据：三份的第一屏都出现「读者要做的动作」，三份各配一个「写了等于没写」的反例，三份互不复制。</text>
  <text x="48" y="608" font-family="system-ui, sans-serif" font-size="11" fill="#334155">八条 DD 判据全绿只说明文档自身没写坏，不说明它能被别人用 —— 中间隔着一次真实复现。</text>
</svg>
