<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">指标规范门禁：三个校验点与一个闭环</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">规范写在文档里没有执行力，要变成机器能拦的判据</text>
  <rect x="40" y="80" width="220" height="128" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="150" y="103" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">① 暴露端 /metrics</text>
  <text x="60" y="126" font-size="8" fill="#4338CA">MG1 指标名匹配命名模板</text>
  <text x="60" y="144" font-size="8" fill="#4338CA">MG2 指标必须在 metric_def</text>
  <text x="60" y="162" font-size="8" fill="#4338CA">MG3 标签必须已登记且匹配正则</text>
  <text x="60" y="180" font-size="8" fill="#4338CA">MG4 bounded=false 一律禁止</text>
  <text x="60" y="198" font-size="8" fill="#4338CA">MG5 单指标序列数 ≤ 预算</text>
  <rect x="270" y="80" width="220" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="103" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 采集端 scrape.yaml</text>
  <text x="290" y="126" font-size="8" fill="#1D4ED8">MG6 任务名规范 + 公共标签齐全</text>
  <text x="290" y="144" font-size="8" fill="#1D4ED8">MG7 间隔 ∈ [15s,300s]</text>
  <text x="290" y="162" font-size="8" fill="#1D4ED8">MG7 超时 ≤ 间隔 / 2</text>
  <text x="290" y="186" font-size="8" fill="#64748B">盲区：拦不住指标内容本身的错</text>
  <text x="290" y="202" font-size="8" fill="#64748B">所以必须与 ① 同时校验</text>
  <rect x="500" y="80" width="220" height="128" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="610" y="103" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 规则端 *.yaml</text>
  <text x="520" y="126" font-size="8" fill="#0F766E">MG8 引用的指标必须已登记</text>
  <text x="520" y="144" font-size="8" fill="#0F766E">MG8 且被标记 alertable=true</text>
  <text x="520" y="162" font-size="8" fill="#0F766E">MG9 不得按无界标签聚合</text>
  <text x="520" y="186" font-size="8" fill="#64748B">盲区：拦不住运行期基数膨胀</text>
  <text x="520" y="202" font-size="8" fill="#64748B">所以要配下面的运行期巡检</text>
  <rect x="40" y="228" width="340" height="76" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="210" y="250" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">校验器：输入三样，输出带位置</text>
  <text x="60" y="272" font-size="8" fill="#047857">字典导出（两张表） + /metrics 文本 + 采集与规则文件</text>
  <text x="60" y="292" font-size="8" fill="#065F46">违规退出码 1；字典缺失按「未登记」判失败，绝不静默放行</text>
  <rect x="400" y="228" width="320" height="76" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="560" y="250" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">运行期巡检：高基数三条查询</text>
  <text x="420" y="272" font-size="8" fill="#C2410C">topk(20, count by (__name__)(...)) 找大户</text>
  <text x="420" y="290" font-size="8" fill="#C2410C">count by (label)(...) → 定位爆炸的标签</text>
  <rect x="40" y="320" width="680" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="343" text-anchor="middle" font-size="9" fill="#991B1B" font-weight="bold">阈值由容量反推，不拍脑袋</text>
  <text x="380" y="363" text-anchor="middle" font-size="8" fill="#B91C1C">序列数 × 采样密度 × 保留期 = 磁盘占用　｜　降采样/缩保留期能买回容量，只有删标签能降查询延迟</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
