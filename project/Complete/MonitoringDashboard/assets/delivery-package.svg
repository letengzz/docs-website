<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="delivery-package.svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">交付包：两条待办的真实性质不同，处置也不同</text>
  <text x="32" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">一条是「形态」问题（文档没落成页面），一条是「边界」问题（脚本与配置不许入仓）</text>
  <rect x="32" y="92" width="418" height="172" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">待办 A · 三份交付文档落成文件</text>
  <text x="48" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#334155">表面看：还差三份文档</text>
  <text x="48" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#334155">真实性质：形态——本仓 project/ 只允许 *.md 与配图，</text>
  <text x="48" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#334155">「文件」在这里只能是「页面」</text>
  <text x="48" y="191" font-family="system-ui, sans-serif" font-size="12" fill="#334155">正确处置：落成三个独立页面（今日完成）</text>
  <text x="48" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#334155">判据：PK-B / PK-C / PK-D</text>
  <rect x="450" y="92" width="418" height="172" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="466" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">待办 B · 环境侧 9 份交付件入仓</text>
  <text x="466" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#334155">表面看：还差 9 个文件</text>
  <text x="466" y="157" font-family="system-ui, sans-serif" font-size="12" fill="#334155">真实性质：边界——源码、脚本、配置一律不入库</text>
  <text x="466" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#334155">正确处置：先建台账，逐条标注落盘位置与校验命令</text>
  <text x="466" y="191" font-family="system-ui, sans-serif" font-size="12" fill="#334155">「入仓」必须改写为「内容入仓」</text>
  <text x="466" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#334155">判据：PK-A / PK-E / PK-F</text>
  <rect x="32" y="284" width="836" height="118" rx="12" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="48" y="308" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e">硬边界不变量 PK-A（任何一天跑都必须为空）</text>
  <text x="48" y="332" font-family="system-ui, sans-serif" font-size="12" fill="#334155">find project -type f ! -name "*.md" ! -name "*.png" ! -name "*.svg" ! -name "*.jpg"   → 预期：无输出</text>
  <text x="48" y="349" font-family="system-ui, sans-serif" font-size="12" fill="#334155">交付物只有三种合法落地形态：① 页面  ② 页面里的围栏代码块（完整内容）  ③ assets/ 下的 SVG 配图。</text>
  <text x="48" y="366" font-family="system-ui, sans-serif" font-size="12" fill="#334155">「文件本身」不是第四种形态——把两条待办当成同一件事（「把文件补上」）会当场违反这条边界。</text>
  <rect x="32" y="422" width="836" height="62" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="450.0" y="458" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">今日目标 = 文档落盘（三份页面），不是配置落盘；台账如实标 ⏳，未做的写未做</text>
</svg>
