<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="424" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">第 2 周第 1 步：业务侧指标暴露（组件 C1）</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">自研两件中的第一件：把「契约一」从文档变成可被抓取的端点 —— 没有它，采集器抓到的是零个样本</text>

  <rect x="30" y="76" width="210" height="156" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="135" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 指标定义层</text>
  <text x="135" y="112" text-anchor="middle" font-size="7.6" fill="#1D4ED8">业务代码里注册指标</text>
  <text x="135" y="130" text-anchor="middle" font-size="7.6" fill="#1D4ED8">app_orders_total</text>
  <text x="135" y="147.6" text-anchor="middle" font-size="7.6" fill="#1D4ED8">app_http_requests_seconds</text>
  <text x="135" y="165.2" text-anchor="middle" font-size="7.6" fill="#1D4ED8">app_db_pool_in_use</text>
  <text x="135" y="185" text-anchor="middle" font-size="7.6" fill="#DC2626">标签只用 {service,instance,env}</text>
  <text x="135" y="202.6" text-anchor="middle" font-size="7.6" fill="#1D4ED8">名字以单位后缀结尾（_total 等）</text>
  <text x="135" y="220.2" text-anchor="middle" font-size="7.6" fill="#1D4ED8">每个名字要在 metric_def 登记</text>

  <rect x="275" y="76" width="210" height="156" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="380" y="94.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② /metrics 端点</text>
  <text x="380" y="112" text-anchor="middle" font-size="7.6" fill="#6D28D9">Micrometer + Prometheus registry</text>
  <text x="380" y="130" text-anchor="middle" font-size="7.6" fill="#6D28D9">纯文本，一行一个样本</text>
  <text x="380" y="147.6" text-anchor="middle" font-size="7.6" fill="#6D28D9">GET localhost:8080/metrics</text>
  <text x="380" y="165.2" text-anchor="middle" font-size="7.6" fill="#6D28D9">公共标签由配置统一注入</text>
  <text x="380" y="185" text-anchor="middle" font-size="7.6" fill="#DC2626">一次请求只产生一次聚合</text>
  <text x="380" y="202.6" text-anchor="middle" font-size="7.6" fill="#6D28D9">换入 / 换出都只改这一个端点</text>
  <text x="380" y="220.2" text-anchor="middle" font-size="7.6" fill="#6D28D9">契约一的正本在 contracts/01-expose.md</text>

  <rect x="520" y="76" width="210" height="156" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="625" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 采集器：15s 拉一次</text>
  <text x="625" y="112" text-anchor="middle" font-size="7.6" fill="#047857">拉模型：抓不到就是 down</text>
  <text x="625" y="130" text-anchor="middle" font-size="7.6" fill="#047857">目标发现走 file_sd / k8s_sd</text>
  <text x="625" y="147.6" text-anchor="middle" font-size="7.6" fill="#047857">超时 10s ≤ 间隔的 2/3</text>
  <text x="625" y="165.2" text-anchor="middle" font-size="7.6" fill="#047857">sample_limit 由容量公式定</text>
  <text x="625" y="185" text-anchor="middle" font-size="7.6" fill="#047857">进入时序库，raw 保留 15d</text>
  <text x="625" y="202.6" text-anchor="middle" font-size="7.6" fill="#047857">采集侧判据见 SCR-A ~ SCR-G</text>
  <text x="625" y="220.2" text-anchor="middle" font-size="7.6" fill="#047857">规则与大盘都读这份数据</text>

  <line x1="240" y1="154" x2="275" y2="154" stroke="#7C3AED" stroke-width="2" marker-end="url(#me)"/>
  <line x1="485" y1="154" x2="520" y2="154" stroke="#7C3AED" stroke-width="2" marker-end="url(#me)"/>

  <line x1="30" y1="256" x2="730" y2="256" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="280" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">暴露端的三道拦截（MG 门禁的第一个校验点）</text>

  <rect x="30" y="292" width="150" height="22" rx="5" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="105" y="307" text-anchor="middle" font-size="8.5" fill="#9F1239" font-weight="bold">命名与登记 · MG1 / MG2</text>
  <rect x="188" y="292" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459" y="307" text-anchor="middle" font-size="8.5" fill="#334155">名字必须匹配模板并以单位结尾；未在 metric_def 登记的名字一律不许出现</text>

  <rect x="30" y="320" width="150" height="22" rx="5" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="105" y="335" text-anchor="middle" font-size="8.5" fill="#9F1239" font-weight="bold">标签与无界 · MG3 / MG4</text>
  <rect x="188" y="320" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459" y="335" text-anchor="middle" font-size="8.5" fill="#334155">标签名要在 metric_label_def 登记、取值匹配 value_regex；bounded=false 的标签禁止出现在任何指标上</text>

  <rect x="30" y="348" width="150" height="22" rx="5" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="105" y="363" text-anchor="middle" font-size="8.5" fill="#9F1239" font-weight="bold">基数预算 · MG5</text>
  <rect x="188" y="348" width="542" height="22" rx="5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
  <text x="459" y="363" text-anchor="middle" font-size="8.5" fill="#334155">标签取值组合数 ≤ 单指标序列预算 —— 序列数 = 各标签基数的乘积，这是乘法不是加法</text>

  <rect x="30" y="382" width="700" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="380" y="401" text-anchor="middle" font-size="8.5" fill="#92400E">收尾判据：GET /metrics 里出现的每个指标名与标签名，都能在两张字典表里查到 —— 查不到就是门禁没接上</text>

  <defs>
    <marker id="me" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
