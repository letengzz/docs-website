<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="acceptance-checklist.svg">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">上线验收清单：六层 24 项，每一层都有自己的证据形态</text>
  <text x="32" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">24 项 ≠ 30 条命令：每一项要回答「用什么证据证明它成立」，命令只是拿证据的手段</text>
  <rect x="32" y="96" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="135" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="104" y="122" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">容器与幂等 · 4 项</text>
  <text x="104" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">三个服务全部 running；二次 up -d 无一行 Recreated（幂等）</text>
  <text x="868" y="136" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">1-1 ~ 1-4</text>
  <rect x="32" y="170" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="209" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="104" y="196" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">文件一致性 · 4 项</text>
  <text x="104" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">6 个配置在宿主/容器的 sha256 相等；promtool 两份规则均 SUCCESS</text>
  <text x="868" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">2-1 ~ 2-4</text>
  <rect x="32" y="244" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="283" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="104" y="270" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">采集与规则 · 4 项</text>
  <text x="104" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">activeTargets = 5 且全 up；告警按名字集合比对，不只比条数</text>
  <text x="868" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">3-1 ~ 3-4</text>
  <rect x="32" y="318" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="357" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="104" y="344" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">大盘数据源 · 4 项</text>
  <text x="104" y="366" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">D1 有序列 / D2 三态可分（总数 = NaN + 零值 + 非零）/ D3 值可解释</text>
  <text x="868" y="358" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">4-1 ~ 4-4</text>
  <rect x="32" y="392" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="431" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">5</text>
  <text x="104" y="418" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">自监控 · 4 项</text>
  <text x="104" y="440" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">自采集目标 = 1；规则评估失败 = 0；抓取耗时与 15 分钟峰值各记一数</text>
  <text x="868" y="432" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">5-1 ~ 5-4</text>
  <rect x="32" y="466" width="56" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60.0" y="505" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e3a8a" text-anchor="middle">6</text>
  <text x="104" y="492" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">保留与告警端到端 · 4 项</text>
  <text x="104" y="514" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">保留上限四处同读；通知条数 = 分组数；被抑制的留下 inhibitedBy</text>
  <text x="868" y="506" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">6-1 ~ 6-4</text>
  <rect x="32" y="546" width="836" height="30" rx="10" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="450.0" y="565" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">证据三类：主 主读数（命令直接给出的数字/集合）· 旁 旁证（独立路径同一结论）· 档 文档级（核对一个事实）</text>
</svg>
