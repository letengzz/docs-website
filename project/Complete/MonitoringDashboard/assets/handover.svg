<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <rect width="880" height="500" fill="#FFFFFF"/>
  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">结项四类对账：每条读数都能被第二个人复跑</text>

  <rect x="50" y="62" width="180" height="126" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D4ED8">① 章节与侧边栏</text>
  <text x="140" y="116" text-anchor="middle" font-size="13" fill="#334155">29 章 / 31 图</text>
  <text x="140" y="138" text-anchor="middle" font-size="13" fill="#334155">唯一路径 30 条</text>
  <text x="140" y="166" text-anchor="middle" font-size="12" fill="#64748B">HO-B</text>

  <rect x="250" y="62" width="180" height="126" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="340" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803D">② 三段式覆盖</text>
  <text x="340" y="116" text-anchor="middle" font-size="13" fill="#334155">补前 25 / 29</text>
  <text x="340" y="138" text-anchor="middle" font-size="13" fill="#334155">补后 29 / 29</text>
  <text x="340" y="166" text-anchor="middle" font-size="12" fill="#64748B">HO-A</text>

  <rect x="450" y="62" width="180" height="126" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="540" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">③ 判据族</text>
  <text x="540" y="116" text-anchor="middle" font-size="13" fill="#334155">26 个族</text>
  <text x="540" y="138" text-anchor="middle" font-size="13" fill="#334155">3 章无编号族</text>
  <text x="540" y="166" text-anchor="middle" font-size="12" fill="#64748B">HO-C</text>

  <rect x="650" y="62" width="180" height="126" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/>
  <text x="740" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#B91C1C">④ 遗留项</text>
  <text x="740" y="116" text-anchor="middle" font-size="13" fill="#334155">3 条，全有</text>
  <text x="740" y="138" text-anchor="middle" font-size="13" fill="#334155">解除条件</text>
  <text x="740" y="166" text-anchor="middle" font-size="12" fill="#64748B">HO-D / HO-G</text>

  <line x1="440" y1="188" x2="440" y2="212" stroke="#94A3B8" stroke-width="2" marker-end="url(#a8)"/>

  <rect x="50" y="216" width="780" height="66" rx="10" fill="#1E293B"/>
  <text x="440" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">结项判据不是「写完了」，而是「换个人也能继续」</text>
  <text x="440" y="268" text-anchor="middle" font-size="13" fill="#CBD5E1">三个对象各有各的表：系统（能起）/ 文档（能验）/ 人（能接手）</text>

  <text x="50" y="316" font-size="14" font-weight="bold" fill="#1E293B">「没做完」必须拆成两种，写法不同</text>

  <rect x="50" y="328" width="380" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="70" y="354" font-size="13" font-weight="bold" fill="#334155">没时间做</text>
  <text x="70" y="378" font-size="12" fill="#475569">条件具备、动作明确、只差排期</text>
  <text x="70" y="400" font-size="12" fill="#475569">写：动作 + 归属人 + 截止时间</text>

  <rect x="450" y="328" width="380" height="86" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="470" y="354" font-size="13" font-weight="bold" fill="#92400E">条件不具备</text>
  <text x="470" y="378" font-size="12" fill="#475569">缺干净机器 / 缺真实通知渠道</text>
  <text x="470" y="400" font-size="12" fill="#475569">写：解除条件 + 谁来解除（禁「待确认」）</text>

  <rect x="50" y="430" width="780" height="50" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="70" y="461" font-size="13" fill="#334155">结项期改结构，会让已经跑过的验收读数全部作废——所以本页只归位、只登记，不新增决定。</text>
  <defs>
    <marker id="a8" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
