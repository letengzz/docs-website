<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="隔离复现：把干净拆成四个维度（状态隔离、依赖获取路径隔离、宿主工具链隔离、人为污染隔离），逐个标出本机能否达成；下方是复现指纹的字段与 diff 判读">
  <title>干净的四个维度、本机达成度，与复现指纹的字段和 diff 判读</title>
  <rect width="900" height="700" fill="#ffffff"/>

  <text x="30" y="36" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1f2328">隔离复现 · 干净的四个维度与本机可逼近的范围</text>
  <text x="30" y="58" font-family="system-ui, sans-serif" font-size="11.5" fill="#57606a">没有第二台机器时，把干净从一个形容词拆成四个可判定的维度，逐个测出本机停在第几维。</text>

  <text x="30" y="86" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">A 干净的四个维度 → 本机达成度 → 判定命令</text>

  <rect x="30" y="102" width="840" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">① 状态隔离（容器 / 卷 / 网络 / 端口）</text>
  <text x="44" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">前三样随命名空间走；裸端口是宿主全局资源，不在命名空间里</text>
  <text x="44" y="151" font-family="ui-monospace, monospace" font-size="9.5" fill="#0969da">docker compose -p monitoring-fresh up -d</text>
  <rect x="566" y="115" width="176" height="20" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="654" y="129" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#9a6700">部分可达成 · 端口要另改</text>

  <rect x="30" y="164" width="840" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">② 依赖获取路径隔离（镜像层与包缓存）</text>
  <text x="44" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">第二次起栈一次网络拉取都没有发生 —— 依赖走的还是本机那批层</text>
  <text x="44" y="213" font-family="ui-monospace, monospace" font-size="9.5" fill="#0969da">docker image inspect prom/prometheus:v3.5.0</text>
  <rect x="566" y="177" width="176" height="20" rx="4" fill="#ffebe9" stroke="#cf222e"/>
  <text x="654" y="191" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#cf222e">不可达成</text>

  <rect x="30" y="226" width="840" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="244" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">③ 宿主工具链隔离（OS / 内核 / 包管理器 / JDK）</text>
  <text x="44" y="260" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">本机 java 17.0.8，隔壁项目基线是 Java 25 LTS —— 这一维与工程无关也不可换</text>
  <text x="44" y="275" font-family="ui-monospace, monospace" font-size="9.5" fill="#0969da">java -version</text>
  <rect x="566" y="239" width="176" height="20" rx="4" fill="#ffebe9" stroke="#cf222e"/>
  <text x="654" y="253" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#cf222e">不可达成</text>

  <rect x="30" y="288" width="840" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">④ 人为污染隔离（历史备份 / 临时放行 / 实验残留 / 先前进程）</text>
  <text x="44" y="322" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">量得出来、清不干净 —— 运行中容器 11 / 全部容器 12 / 卷 14 / 镜像 15</text>
  <text x="44" y="337" font-family="ui-monospace, monospace" font-size="9.5" fill="#0969da">docker ps -aq | wc -l</text>
  <rect x="566" y="301" width="176" height="20" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="654" y="315" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle" fill="#9a6700">不可达成但可量化</text>

  <rect x="30" y="352" width="840" height="58" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="44" y="372" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1f2328">两次隔离实验读数（本轮真跑：同一套编排复制到全新目录 /tmp/monitoring-fresh）</text>
  <text x="44" y="390" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">第 1 次只换项目名 → Bind for 0.0.0.0:9093 failed: port is already allocated（网络、卷、三容器都已建出来）</text>
  <text x="44" y="404" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">第 2 次换命名空间 + 换端口 → ready 200 · activeTargets 5 全 up · 3 组 9 条规则 · Prometheus 3.5.0</text>

  <text x="30" y="432" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">B 复现指纹：字段 → 两次复现之间 diff → 判读</text>

  <rect x="30" y="444" width="400" height="212" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="468" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">指纹字段（一份可 diff 的文本）</text>
  <text x="44" y="492" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">1 compose 项目名</text>
  <text x="44" y="511" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">2 网络名 / 卷名</text>
  <text x="44" y="530" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">3 裸端口（宿主上实际占用）</text>
  <text x="44" y="549" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">4 镜像 digest（不是 tag）</text>
  <text x="44" y="568" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">5 目标数与健康计数</text>
  <text x="44" y="587" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">6 宿主存量四读数</text>
  <text x="44" y="606" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 宿主 JDK 与 docker 版本</text>
  <text x="44" y="638" font-family="system-ui, sans-serif" font-size="9.5" fill="#0969da">同一份指纹在两次复现之间可逐行比较</text>

  <rect x="468" y="444" width="402" height="212" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="482" y="468" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f2328">diff 里出现什么 → 哪一维没隔离</text>
  <text x="482" y="492" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">digest 变了 → ② 依赖获取路径：走了不同来源</text>
  <text x="482" y="511" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">裸端口撞上宿主已有端口 → ① 状态隔离</text>
  <text x="482" y="530" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">卷名带随机后缀 → 这次是全新卷，不是复用</text>
  <text x="482" y="549" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">宿主存量四读数变化 → ④ 人为污染不可复现</text>
  <text x="482" y="568" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">目标数 / 健康计数对不上 → 不是复现成功</text>
  <text x="482" y="587" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">JDK 或 docker 版本不同 → ③ 宿主工具链</text>
  <text x="482" y="606" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">任何一行没有解释 → 这一行就没被隔离</text>
  <text x="482" y="638" font-family="system-ui, sans-serif" font-size="9.5" fill="#cf222e">不许用脏机器的指纹去冒充干净机器的</text>

  <text x="30" y="676" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">纪律（第 143 天）：脏机器上复现成功不构成任何证据。退出码也是读数，记录它必须同时记录执行了什么才得到它（第 146 天）。</text>
  <text x="30" y="692" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">本步没有把 DD-G 从 1 变成 0：它把距离量化了，并写清它要满足哪三条才允许被勾掉。</text>
</svg>
