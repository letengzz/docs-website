<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="484" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">指标数据模型：从指标名到样本，以及基数与保留</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">同一份数据，标签决定容量，保留期决定成本</text>
  <rect x="14" y="84" width="176" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="102" y="102.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 指标名</text>
  <text x="102" y="119" text-anchor="middle" font-size="7.5" fill="#1D4ED8">http_requests_total</text>
  <text x="102" y="136.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">全局唯一、不含变量</text>
  <text x="102" y="153.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">命名规范的第 1 条</text>
  <line x1="192" y1="132" x2="200" y2="132" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="202" y="84" width="176" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="290" y="102.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">② 标签集</text>
  <text x="290" y="119" text-anchor="middle" font-size="7.5" fill="#0F766E">job / instance / path</text>
  <text x="290" y="136.25" text-anchor="middle" font-size="7.5" fill="#0F766E">决定「同一条曲线」</text>
  <text x="290" y="153.5" text-anchor="middle" font-size="7.5" fill="#0F766E">基数由它决定</text>
  <line x1="380" y1="132" x2="388" y2="132" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="84" width="176" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="478" y="102.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 序列（series）</text>
  <text x="478" y="119" text-anchor="middle" font-size="7.5" fill="#047857">指标名 + 一组标签值</text>
  <text x="478" y="136.25" text-anchor="middle" font-size="7.5" fill="#047857">唯一确定一条时间线</text>
  <text x="478" y="153.5" text-anchor="middle" font-size="7.5" fill="#047857">是计费与容量单位</text>
  <line x1="568" y1="132" x2="576" y2="132" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="578" y="84" width="168" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="662" y="102.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">④ 样本</text>
  <text x="662" y="119" text-anchor="middle" font-size="7.5" fill="#6D28D9">时刻 + 数值</text>
  <text x="662" y="136.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">15s 一个点</text>
  <text x="662" y="153.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">保留期决定留多久</text>
  <rect x="14" y="196" width="364" height="120" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="196" y="214.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">基数是怎么炸掉的</text>
  <text x="196" y="231" text-anchor="middle" font-size="7.5" fill="#B91C1C">把 user_id 做成标签：10 万用户 = 10 万序列</text>
  <text x="196" y="248.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">把 order_id 做成标签：日订单 100 万 = 100 万序列</text>
  <text x="196" y="265.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">把原始 URL 做成标签：无限序列</text>
  <text x="196" y="282.75" text-anchor="middle" font-size="7.5" fill="#B91C1C">结论：标签只能放「有限且可枚举」的维度</text>
  <rect x="390" y="196" width="356" height="120" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="568" y="214.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">正确做法：路径归一</text>
  <text x="568" y="231" text-anchor="middle" font-size="7.5" fill="#047857">/api/v1/articles/12345  → /api/v1/articles/{id}</text>
  <text x="568" y="248.25" text-anchor="middle" font-size="7.5" fill="#047857">把高基数信息放进日志，不进标签</text>
  <text x="568" y="265.5" text-anchor="middle" font-size="7.5" fill="#047857">需要按用户维度分析时用事件表，不用指标</text>
  <text x="568" y="282.75" text-anchor="middle" font-size="7.5" fill="#047857">判据：单指标序列数 &lt; 1 万，超了先降标签</text>
  <rect x="14" y="330" width="364" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="196" y="348.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">保留策略（raw）</text>
  <text x="196" y="365" text-anchor="middle" font-size="7.5" fill="#B45309">原始分辨率 15s，保留 15 天</text>
  <text x="196" y="382.25" text-anchor="middle" font-size="7.5" fill="#B45309">retention.time = 15d，显式配置</text>
  <text x="196" y="399.5" text-anchor="middle" font-size="7.5" fill="#B45309">写错不会报错，只会悄悄撑满磁盘</text>
  <rect x="390" y="330" width="356" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="568" y="348.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">降采样（recording rule）</text>
  <text x="568" y="365" text-anchor="middle" font-size="7.5" fill="#4338CA">每 5 分钟聚合一次：avg / max / p95</text>
  <text x="568" y="382.25" text-anchor="middle" font-size="7.5" fill="#4338CA">聚合序列保留 90 天，供趋势与月报</text>
  <text x="568" y="399.5" text-anchor="middle" font-size="7.5" fill="#4338CA">聚合后标签必须减少，不能全量复制</text>
  <text x="380" y="464" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">一句话：指标模型的核心不是「存什么」，而是「标签放什么」——放错一个维度，容量翻三个数量级。</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
