<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="384" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">对账：四个数与三类差异</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四个数是同一件事的四种视角；对账的价值是把它归到三类可处置的原因上</text>
  <rect x="22" y="74" width="170" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="107" y="92.2" text-anchor="middle" font-size="9.5" fill="#1E293B" font-weight="bold">usage 明细</text>
  <text x="107" y="109" text-anchor="middle" font-size="7.2" fill="#334155">一行一次调用</text>
  <text x="107" y="125.56" text-anchor="middle" font-size="7.2" fill="#334155">11,520 行 / 50 ms</text>
  <line x1="107" y1="146" x2="107" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="208" y="74" width="170" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="293" y="92.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">quota_policy.used</text>
  <text x="293" y="109" text-anchor="middle" font-size="7.2" fill="#1D4ED8">条件更新扣减</text>
  <text x="293" y="125.56" text-anchor="middle" font-size="7.2" fill="#1D4ED8">与明细同事务</text>
  <line x1="293" y1="146" x2="293" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="394" y="74" width="170" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="479" y="92.2" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">/admin/usage</text>
  <text x="479" y="109" text-anchor="middle" font-size="7.2" fill="#4338CA">客户看到的数</text>
  <text x="479" y="125.56" text-anchor="middle" font-size="7.2" fill="#4338CA">按窗口聚合</text>
  <line x1="479" y1="146" x2="479" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="580" y="74" width="170" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="665" y="92.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">invoice_line</text>
  <text x="665" y="109" text-anchor="middle" font-size="7.2" fill="#B45309">开票时的快照</text>
  <text x="665" y="125.56" text-anchor="middle" font-size="7.2" fill="#B45309">24 行 / 12 ms</text>
  <line x1="665" y1="146" x2="665" y2="160" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="97" y1="160" x2="665" y2="160" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="382" y1="160" x2="382" y2="175" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="252" y="176" width="260" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="382" y="194.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">对账引擎（只读）</text>
  <text x="382" y="211" text-anchor="middle" font-size="7.6" fill="#6D28D9">LEFT JOIN 双向差异 + 归因</text>
  <rect x="22" y="254" width="226" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="135" y="272.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">漏计量</text>
  <text x="135" y="289" text-anchor="middle" font-size="7.4" fill="#C2410C">开票 &gt; 明细</text>
  <text x="135" y="306.02" text-anchor="middle" font-size="7.4" fill="#C2410C">+3,007 单位（2 行）</text>
  <text x="135" y="323.04" text-anchor="middle" font-size="7.4" fill="#C2410C">写用量失败但扣了配额</text>
  <line x1="382" y1="228" x2="135" y2="252" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="268" y="254" width="226" height="86" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="381" y="272.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">重复计量</text>
  <text x="381" y="289" text-anchor="middle" font-size="7.4" fill="#B91C1C">开票 &lt; 明细</text>
  <text x="381" y="306.02" text-anchor="middle" font-size="7.4" fill="#B91C1C">−1,385 单位（2 行）</text>
  <text x="381" y="323.04" text-anchor="middle" font-size="7.4" fill="#B91C1C">重试未去重，25 行 -dup</text>
  <line x1="382" y1="228" x2="381" y2="252" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="514" y="254" width="226" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="627" y="272.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">口径不同</text>
  <text x="627" y="289" text-anchor="middle" font-size="7.4" fill="#0F766E">同一批明细</text>
  <text x="627" y="306.02" text-anchor="middle" font-size="7.4" fill="#0F766E">+192 单位（2 行跨界）</text>
  <text x="627" y="323.04" text-anchor="middle" font-size="7.4" fill="#0F766E">UTC 月 vs UTC+8 月</text>
  <line x1="382" y1="228" x2="627" y2="252" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="380" y="366" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">三类差异的处置完全不同：第一类补记，第二类冲销，第三类改口径而不是改数据</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
