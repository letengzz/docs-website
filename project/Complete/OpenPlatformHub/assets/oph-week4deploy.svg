<text x="648" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4ade80" font-weight="700" text-anchor="start">EXIT=0</text>
<text x="648" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#cbd5e1" font-weight="400" text-anchor="start">失败不早停：</text>
