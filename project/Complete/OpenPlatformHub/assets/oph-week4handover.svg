<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="交付包与交接手册">
<title>交付包与交接手册</title>
<rect x="0" y="0" width="960" height="360" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">交付包与交接手册</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569">六件物料 → 一份清单（哈希）→ 五天交接 → 四条完整性判据</text>
<rect x="32" y="84" width="140" height="64" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="44" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">schema.sql</text>
<text x="44" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">建库脚本</text>
<rect x="180" y="84" width="140" height="64" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="192" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">gate.yaml</text>
<text x="192" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">11 条断言</text>
<text x="250" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle">↓</text>
<rect x="328" y="84" width="140" height="64" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
<text x="340" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">alerting.yaml</text>
<text x="340" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">4 条告警</text>
<rect x="476" y="84" width="140" height="64" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="488" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">openapi.yaml</text>
<text x="488" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">契约</text>
<text x="546" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle">↓</text>
<rect x="624" y="84" width="140" height="64" rx="6" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1.5"/>
<text x="636" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">signoff.csv</text>
<text x="636" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">28 行签收</text>
<rect x="772" y="84" width="140" height="64" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="784" y="108" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">handover.md</text>
<text x="784" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">五天清单</text>
<text x="32" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">① 六件物料各自对应一步验收产物，缺一件就无法复跑</text>
<rect x="32" y="214" width="404" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="48" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">② manifest：6 行 sha256 + 版本号 + 构建时间</text>
<text x="48" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">本机：tar 311 B / 校验 24 ms / 改 1 字节即 FAILED</text>
<rect x="452" y="214" width="476" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="468" y="236" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="start">③ 五天交接：读 → 跑 → 改 → 问 → 留</text>
<text x="468" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">每天 4 项，每项一个可验证的收尾动作</text>
<rect x="32" y="286" width="896" height="56" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="48" y="308" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="700" text-anchor="start">④ 四条完整性判据：能起、能验、能改、能回滚——缺一条就不算交付</text>
<text x="48" y="328" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#92400e" font-weight="400" text-anchor="start">「能起」看一条命令；「能验」看 46 条判据；「能改」看改一个阈值后门禁是否仍绿；「能回滚」看 RTO 是否守住 15 分钟</text>
</svg>
