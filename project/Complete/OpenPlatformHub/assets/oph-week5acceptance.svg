<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"><rect width="1000" height="400" fill="#ffffff"/><text x="30" y="40" font-size="18" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">26 项验收单：24 过 2 未过，两项都只在「同时坏两个」时出现</text><text x="30" y="74" font-size="13" fill="#374151" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">五个区 26 项（每格一项，红格为未过）</text><text x="30" y="102" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">① 单故障注入</text><rect x="140" y="89" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="164" y="89" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="188" y="89" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="212" y="89" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><text x="242" y="102" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">4 项</text><text x="30" y="142" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">② 降级形态</text><rect x="140" y="129" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="164" y="129" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="188" y="129" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="212" y="129" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><text x="242" y="142" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">4 项</text><text x="30" y="182" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">③ 熔断阈值</text><rect x="140" y="169" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="164" y="169" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="188" y="169" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><text x="218" y="182" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">3 项</text><text x="30" y="222" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">④ 事故升级</text><rect x="140" y="209" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="164" y="209" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><rect x="188" y="209" width="18" height="18" rx="4" fill="#e8f6ec" stroke="#15803d" stroke-width="1.1"/><text x="218" y="222" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">3 项</text><text x="30" y="262" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">⑤ 组合场景</text><rect x="140" y="249" width="18" height="18" rx="4" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.1"/><rect x="164" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="188" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="212" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="236" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="260" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="284" y="249" width="18" height="18" rx="4" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.1"/><rect x="308" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="332" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="356" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="380" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><rect x="404" y="249" width="18" height="18" rx="4" fill="#fdf3e3" stroke="#b45309" stroke-width="1.1"/><text x="434" y="262" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">12 项</text><rect x="30" y="300" width="380" height="54" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/><text x="46" y="322" font-size="20" fill="#15803d" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">92.3%</text><text x="130" y="322" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">24 / 26 通过</text><text x="46" y="344" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">①~④ 共 14 格全绿；未过的 2 项落在 ⑤ 的 12 格里</text><text x="30" y="380" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">14 格 = 5 能力 × 4 故障 − 6 格「不适用」；12 项 = C(4,2) 组合里抽 3 对 × 4 项</text><text x="470" y="74" font-size="13" fill="#374151" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">还账：闸门从「按命令分类」改成「按是否读到数据」</text><text x="470" y="118" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">还账前</text><rect x="532" y="104" width="273.2142857142857" height="26" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/><text x="815.2142857142858" y="122" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">135/168 = 80.4%</text><text x="470" y="158" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">还账后</text><rect x="532" y="144" width="279.2857142857143" height="26" rx="5" fill="#e8f6ec" stroke="#15803d" stroke-width="1.3"/><text x="821.2857142857142" y="162" font-size="12" fill="#15803d" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">138/168 = 82.1%</text><line x1="803.2" y1="88" x2="803.2" y2="176" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4"/><text x="809.1904761904761" y="84" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">门槛 80% = 134 格</text><text x="809.2857142857142" y="196" font-size="10" fill="#b45309" text-anchor="end" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">▲ +3 格（两条横轴同尺度，差的就是这 3 格）</text><rect x="470" y="200" width="420" height="96" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/><text x="486" y="222" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">+3 格：3 条「写保守常量」的命令不再被年龄闸门误拦</text><text x="486" y="244" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">失败格 33 → 30（19.6% → 17.9%）</text><text x="486" y="264" font-size="12" fill="#374151" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">静默错误 39 格 — 一格没少</text><text x="486" y="284" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">占比 28.9% → 28.3%：不是变好了，是分母变大了</text><text x="470" y="330" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">余量：4 格（138 − 134）。改之前只差 1 格就要跌回门槛以下。</text><text x="470" y="350" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">「刚过线」不是稳定状态——加一条依赖 quota 的命令就能把它推下去。</text><text x="470" y="380" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,PingFang SC,sans-serif">静默格不因还账而减少：还账改的是闸门判据，不是兜底数据源的可靠性。</text></svg>
