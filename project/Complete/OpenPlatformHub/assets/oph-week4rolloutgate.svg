<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="灰度发布与回退闸门：四道判据、三条回退路径、一条 schema 硬约束">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">灰度与回退：四道判据、三条路径、一条 schema 硬约束</text>
<rect x="30" y="62" width="180" height="74" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="120.0" y="95.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#334155">入口流量</text>
<text x="120.0" y="112.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">200 rps</text>
<rect x="250" y="62" width="150" height="74" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="325.0" y="95.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0f766e">v1.8（旧）</text>
<text x="325.0" y="112.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">权重 90%</text>
<rect x="250" y="152" width="150" height="74" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="325.0" y="185.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#3730a3">v1.9（新）</text>
<text x="325.0" y="202.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">权重 10%</text>
<line x1="210" y1="99" x2="248" y2="99" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="210" y1="110" x2="248" y2="176" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="250" y="244" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#166534">按用户哈希切流：跨版本会话 0.0%</text>
<text x="250" y="262" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#9f1239">按随机切流：57.4% 会话跨两个版本</text>
<rect x="430" y="62" width="200" height="164" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="530.0" y="140.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">四条回退判据</text>
<text x="530.0" y="157.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">5xx>2%（1.5 min）</text>
<text x="530.0" y="171.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">P99>800ms（5 min）</text>
<text x="530.0" y="185.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">对账差>0.1%（5 min）</text>
<text x="530.0" y="199.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">告警静默（3 min）</text>
<line x1="400" y1="99" x2="428" y2="99" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="400" y1="176" x2="428" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="660" y="62" width="250" height="74" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="785.0" y="95.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#166534">蓝绿切换 3 s</text>
<text x="785.0" y="112.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">改 Service selector</text>
<rect x="660" y="152" width="250" height="74" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="785.0" y="185.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#166534">金丝雀回切 8 s</text>
<text x="785.0" y="202.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">权重 → 0 + 连接排空</text>
<line x1="630" y1="110" x2="658" y2="99" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="630" y1="150" x2="658" y2="180" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="660" y="240" width="250" height="56" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="785.0" y="264.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#9f1239">滚动重启 56 s（最慢）</text>
<text x="785.0" y="281.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">3×12s + 2×10s 探针</text>
<text x="30" y="314" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">schema 向后兼容：回退时旧代码必须能写新库</text>
<rect x="30" y="330" width="300" height="36" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="180.0" y="353.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#166534">加列 + 默认值</text>
<text x="346" y="353" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">旧版 INSERT 100/100 成功</text>
<rect x="30" y="374" width="300" height="36" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="180.0" y="397.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#9f1239">加 NOT NULL 无默认（空表）</text>
<text x="346" y="397" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">DDL 成功，旧版 INSERT 0/100</text>
<rect x="30" y="418" width="300" height="36" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="180.0" y="441.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#9f1239">删列 / 改类型</text>
<text x="346" y="441" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">回退必须回滚数据</text>
<text x="560" y="314" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">expand → migrate → contract</text>
<rect x="560" y="330" width="350" height="36" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="735.0" y="353.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#0f766e">expand：加列双写，可回退</text>
<rect x="560" y="374" width="350" height="36" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="735.0" y="397.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#b45309">migrate：回填校验，需反向脚本</text>
<rect x="560" y="418" width="350" height="36" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="735.0" y="441.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#9f1239">contract：删旧列，不可回退</text>
</svg>
