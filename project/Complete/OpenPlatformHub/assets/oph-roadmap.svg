<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="开放平台项目四周里程碑与六个模块">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="18" fill="#0f172a">四周里程碑：每一个格子都要有可执行的验收动作</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">周期 8（第 221-250 天）：应用接入 → 配额计量 → 事件推送 → 账单与门户</text>

<rect x="30" y="82" width="212" height="140" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="136" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">第 1 周 · 需求设计</text>
<text x="46" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">US-01~US-08 与验收条件</text>
<text x="46" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">十张表与六条不变量</text>
<text x="46" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">签名串与四类接口契约</text>
<text x="46" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">验收：契约可被 mock 跑通</text>

<rect x="254" y="82" width="212" height="140" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="360" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f766e">第 2 周 · 核心编码</text>
<text x="270" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">验签中间件与令牌服务</text>
<text x="270" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">令牌桶限流 + 用量记账</text>
<text x="270" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">outbox 与投递器</text>
<text x="270" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">验收：五个接口可调通</text>

<rect x="478" y="82" width="212" height="140" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="584" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#a16207">第 3 周 · 联调测试</text>
<text x="494" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">三处断点的用例矩阵</text>
<text x="494" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">并发与幂等专项</text>
<text x="494" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">限流与计量的对账脚本</text>
<text x="494" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">验收：用例全绿、压测达标</text>

<rect x="702" y="82" width="208" height="140" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="806" y="106" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#334155">第 4 周 · 部署验收</text>
<text x="718" y="132" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">一键起与迁移脚本</text>
<text x="718" y="154" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">开发者门户四个页面</text>
<text x="718" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a">上线验收清单 20 项</text>
<text x="718" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">验收：从零复现成功</text>

<text x="28" y="256" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#0f172a">六个模块，一条判据：每一段都要能单独验证</text>

<rect x="30" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="100" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">应用与凭证</text>
<text x="100" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">app / key / 轮换</text>

<rect x="184" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="254" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">授权与令牌</text>
<text x="254" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">token / scope / 撤销</text>

<rect x="338" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="408" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">配额与计量</text>
<text x="408" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">limit / usage / units</text>

<rect x="492" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="562" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">事件推送</text>
<text x="562" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">outbox / 重投 / 死信</text>

<rect x="646" y="270" width="140" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="716" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">账单</text>
<text x="716" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">阶梯 / 取整 / 下钻</text>

<rect x="800" y="270" width="110" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="855" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#0f172a">门户</text>
<text x="855" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">看板 / 重放</text>

<text x="470" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a">六个模块共用一个键：<tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app_id</tspan> —— 它是凭证、配额、用量、账单、事件订阅的唯一主语</text>
<text x="470" y="396" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">本周只交付第 1 周：需求、数据库设计、接口契约 —— 三样都能被 mock 或 SQL 直接验证</text>
<text x="470" y="424" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309">不做的事：真实计费对接、多副本限流、SPA 门户 —— 顺序上都在第 3 周之后</text>
</svg>
