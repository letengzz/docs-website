<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="开放平台技术选型四个维度">
<rect x="0" y="0" width="940" height="470" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">技术选型：每个选择都要带一条能跑的验证命令</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">选对了不写在纸上，改起来才知道——所以每格都写「换掉它要改哪条判据」</text>
<rect x="30" y="86" width="196" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="128" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="600">运行时</text>
<rect x="46" y="128" width="164" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="128.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">选中：http.server</text>
<rect x="46" y="190" width="164" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="128.0" y="220.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">否：FastAPI</text>
<text x="46" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">单文件起服务</text>
<text x="46" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">第 3 周换 ASGI，判据不变</text>
<rect x="258" y="86" width="196" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="356" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="600">存储</text>
<rect x="274" y="128" width="164" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="356.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">选中：SQLite / PG18</text>
<rect x="274" y="190" width="164" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="356.0" y="220.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">白名单：七样 SQL</text>
<text x="274" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">ON CONFLICT 幂等</text>
<text x="274" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">方言分支只有两处</text>
<rect x="486" y="86" width="196" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="584" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="600">令牌</text>
<rect x="502" y="128" width="164" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="584.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">选中：不透明串</text>
<rect x="502" y="190" width="164" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="584.0" y="220.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">否：JWT</text>
<text x="502" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">撤销 1 秒生效</text>
<text x="502" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">40 B vs 398 B</text>
<rect x="714" y="86" width="196" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="812" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="600">投递</text>
<rect x="730" y="128" width="164" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="812.0" y="158.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">选中：outbox 表</text>
<rect x="730" y="190" width="164" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="812.0" y="220.0" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">否：Kafka</text>
<text x="730" y="206" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">不引「至少一次」</text>
<text x="730" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">能证明投了几次</text>
<rect x="30" y="360" width="880" height="34" rx="17" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="470" y="382" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="400">基线：建表 3.7 ms · 1 万行插入 20 ms · HMAC 3.6 µs · json 8.8 µs · count(*) 0.05 ms</text>
<text x="470" y="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">Python 3.13.12 内置 SQLite 3.50.4，而命令行 sqlite3 是 3.39.5 —— 以应用进程里的版本为准</text>
<text x="470" y="444" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">第 3 周压测时，任何一项超过基线 10 倍都要给出原因，否则先怀疑代码而不是硬件</text>
</svg>
