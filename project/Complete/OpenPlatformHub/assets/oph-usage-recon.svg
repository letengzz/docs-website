<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img" aria-label="用量、账单、收款三向对账">
<title>用量、账单、收款三向对账</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700">三向对账：用量 → 账单 → 收款，每一条边都有自己的差异</text>
<rect x="30" y="60" width="250" height="86" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="46" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">用量聚合</text>
<text x="46" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">10,800 桶</text>
<text x="46" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">真实调用 134,004,266</text>
<rect x="350" y="60" width="250" height="86" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="366" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">账单明细</text>
<text x="366" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">10,461 行</text>
<text x="366" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">136,028.57</text>
<rect x="670" y="60" width="250" height="86" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="686" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">收款</text>
<text x="686" y="110" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155" font-weight="400">—</text>
<text x="686" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">132,912.33</text>
<line x1="284" y1="103" x2="346" y2="103" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="300" y="96" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400">计费</text>
<line x1="604" y1="103" x2="666" y2="103" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="618" y="96" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#64748b" font-weight="400">开票+收款</text>
<rect x="30" y="172" width="400" height="118" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="46" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">边 ①：用量 ⇄ 账单</text>
<text x="46" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">漏计量 370 桶 · 重复计量 201 桶</text>
<text x="46" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">取整（最小计费单位 100）9,422 桶，合计 +531.50</text>
<text x="46" y="258" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">同口径逐行不一致 571 行（5.3%），总额差 −1.517%</text>
<text x="46" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#b91c1c" font-weight="400">按实际调用比：9,993 桶（92.5%）金额不同</text>
<rect x="462" y="172" width="448" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="478" y="196" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">边 ②：账单 ⇄ 收款</text>
<text x="478" y="218" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">缺口 3,116.24（2.29%）</text>
<text x="478" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">归口三类：拒付 / 预存抵扣 / 汇率</text>
<text x="478" y="258" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400">对账差异表唯一键 (period, tenant, sku, day, kind)</text>
<text x="478" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#15803d" font-weight="400">重跑两次：新增 0 行（幂等）</text>
</svg>
