<line x1="28" y1="330" x2="912" y2="330" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="28" y="356" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400">验收的产物不是一份文档，而是三张可执行的清单：映射表、覆盖矩阵、缺口排期</text>
<text x="28" y="376" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">四条硬边界：不写业务逻辑 · 不做真实 HTTP · 不引入依赖 · 不优化索引</text>
