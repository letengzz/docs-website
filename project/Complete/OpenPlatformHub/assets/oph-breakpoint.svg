<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372" role="img" aria-label="三处断点与三类违规">
<title>三处断点与三类违规</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="920" height="372" fill="#f8fafc"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a" font-weight="700">三处断点与三类违规</text>
<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">每个接缝都会留下一种「半截状态」——它不报错，只让账单和用量对不上</text>
<rect x="40" y="96" width="170" height="56" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="125" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">① 验签</text>
<rect x="250" y="96" width="170" height="56" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="335" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">② 扣配额</text>
<rect x="460" y="96" width="170" height="56" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="545" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">③ 写用量</text>
<rect x="670" y="96" width="170" height="56" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="755" y="130" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">④ 返回响应</text>
<line x1="215" y1="124" x2="243" y2="124" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="425" y1="124" x2="453" y2="124" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="635" y1="124" x2="663" y2="124" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="212" cy="124" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="212" y="129" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c" font-weight="700" text-anchor="middle">B1</text>
<circle cx="422" cy="124" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="422" y="129" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c" font-weight="700" text-anchor="middle">B2</text>
<circle cx="632" cy="124" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="632" y="129" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c" font-weight="700" text-anchor="middle">B3</text>
<text x="176" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.8" fill="#166534">什么都没发生</text>
<text x="392" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.8" fill="#991b1b">配额白扣</text>
<text x="602" y="86" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.8" fill="#991b1b">二次计量</text>
<rect x="40" y="186" width="240" height="118" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/>
<text x="53" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V1 扣额无用量</text>
<text x="53" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">配额 −1，用量 0</text>
<text x="53" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">客户额度少得快，账单查不到</text>
<text x="236" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">62</text>
<text x="236" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">条</text>
<rect x="340" y="186" width="240" height="118" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="353" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V2 重复计量</text>
<text x="353" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">同一逻辑请求两条用量</text>
<text x="353" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">账单比实际用量高</text>
<text x="536" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">55</text>
<text x="536" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">条</text>
<rect x="640" y="186" width="240" height="118" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="653" y="208" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">V3 成功无用量</text>
<text x="653" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">返回 2xx，账上没有</text>
<text x="653" y="252" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569">最危险：客户以为成功</text>
<text x="836" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">62</text>
<text x="836" y="254" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" text-anchor="middle">条</text>
<rect x="40" y="318" width="840" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="56" y="343" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#334155">补偿挡住 V1/V3、幂等键挡住 V2、先计量再响应抑制 V3 —— 三件事对应三个断点，只做幂等时 V1 仍是 62</text>
</svg>
