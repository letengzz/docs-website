<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="五个指标与三道闸门">
<title>监控与告警接线：五个指标、四道规则、三道闸门</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#ffffff"/>
<text x="28" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">监控与告警接线：从五个指标到一条通知</text>

<text x="28" y="56" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">阈值来自第 3 周读数，规则决定它会不会响、会不会停、会不会重复响</text>

<rect x="28" y="84" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="99" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">请求量</text>
<text x="38" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#64748b" font-weight="400" text-anchor="start">分母，不告警</text>
<line x1="218" y1="100" x2="256" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="28" y="124" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="139" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">错误率</text>
<text x="38" y="152" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#64748b" font-weight="400" text-anchor="start">1%（5xx）</text>
<line x1="218" y1="140" x2="256" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="28" y="164" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="179" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">P99 延迟</text>
<text x="38" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#64748b" font-weight="400" text-anchor="start">80 ms</text>
<line x1="218" y1="180" x2="256" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="28" y="204" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="219" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">配额拒绝率</text>
<text x="38" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#64748b" font-weight="400" text-anchor="start">20%</text>
<line x1="218" y1="220" x2="256" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="28" y="244" width="190" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="38" y="259" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#0f172a" font-weight="600" text-anchor="start">对账差异</text>
<text x="38" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#64748b" font-weight="400" text-anchor="start">0.06</text>
<line x1="218" y1="260" x2="256" y2="176" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="258" y="92" width="180" height="150" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="272" y="114" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309" font-weight="700" text-anchor="start">四道规则</text>
<text x="272" y="138" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="start">OphP99High</text>
<text x="272" y="150" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#78350f" font-weight="400" text-anchor="start">for: 2m</text>
<text x="272" y="162" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="start">OphErrorRateHigh</text>
<text x="272" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#78350f" font-weight="400" text-anchor="start">for: 3m</text>
<text x="272" y="186" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="start">OphReconDrift</text>
<text x="272" y="198" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#78350f" font-weight="400" text-anchor="start">for: 10m</text>
<text x="272" y="210" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#334155" font-weight="600" text-anchor="start">OphScrapeStale</text>
<text x="272" y="222" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="#78350f" font-weight="400" text-anchor="start">for: 2m</text>
<line x1="438" y1="167" x2="474" y2="167" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="476" y="84" width="200" height="74" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="488" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="700" text-anchor="start">闸门① 触发</text>
<text x="488" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#166534" font-weight="400" text-anchor="start">6 分钟故障在 1 分钟内被发现</text>
<text x="488" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#166534" font-weight="400" text-anchor="start">四次单点尖峰：0 次误报</text>
<rect x="476" y="168" width="200" height="74" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="488" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#0369a1" font-weight="700" text-anchor="start">闸门② 恢复</text>
<text x="488" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#075985" font-weight="400" text-anchor="start">故障后 5 分钟内自动恢复</text>
<text x="488" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#075985" font-weight="400" text-anchor="start">无需人工关闭</text>
<line x1="676" y1="203" x2="712" y2="203" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="714" y="168" width="218" height="74" rx="8" fill="#fae8ff" stroke="#f5d0fe" stroke-width="1.5"/>
<text x="726" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#a21caf" font-weight="700" text-anchor="start">闸门③ 不重复</text>
<text x="726" y="212" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#86198f" font-weight="400" text-anchor="start">抑制后通知 2 → 1 条</text>
<text x="726" y="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#86198f" font-weight="400" text-anchor="start">group_by 带 service</text>
<rect x="714" y="84" width="218" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="726" y="106" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9a3412" font-weight="700" text-anchor="start">读数：for 1m vs 2m</text>
<text x="726" y="128" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#9a3412" font-weight="400" text-anchor="start">触发 5 → 1，误报 4 → 0</text>
<text x="726" y="146" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#9a3412" font-weight="400" text-anchor="start">延迟 0 → 1 分钟</text>
<text x="28" y="290" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#334155" font-weight="400" text-anchor="start">采集断流 12 分钟：前三条规则全部「不触发」，与「一切正常」在面板上无法区分——所以第四条规则守的是「瞎」，不是「慢」。</text>
</svg>
