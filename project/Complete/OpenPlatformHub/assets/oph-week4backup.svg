<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="备份与恢复演练的四步">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9f1239"/></marker>
</defs>
<rect x="0" y="0" width="920" height="430" fill="#f8fafc"/>
<text x="24" y="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1f2937">备份与恢复：四步里只有一步是「备份」</text>
<rect x="32" y="58" width="190" height="68" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="127.0" y="88.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#3730a3">① 取</text>
<text x="127.0" y="108.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">锁定备份点</text>
<line x1="223" y1="92" x2="248" y2="92" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="252" y="58" width="190" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="347.0" y="88.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b45309">② 起</text>
<text x="347.0" y="108.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">空库 + 空目录</text>
<line x1="443" y1="92" x2="468" y2="92" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="472" y="58" width="190" height="68" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="567.0" y="88.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f766e">③ 灌</text>
<text x="567.0" y="108.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">逻辑/物理恢复</text>
<line x1="663" y1="92" x2="688" y2="92" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="692" y="58" width="190" height="68" rx="8" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.5"/>
<text x="787.0" y="88.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#9f1239">④ 验</text>
<text x="787.0" y="108.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">六项一致性</text>
<text x="24" y="165" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">④ 验的六项（少一项就会「恢复成功但数不对」）</text>
<rect x="32" y="180" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="50" cy="198" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="50" y="202" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">1</text>
<text x="68" y="202" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">行数逐表相等</text>
<rect x="320" y="180" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="338" cy="198" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="338" y="202" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">2</text>
<text x="356" y="202" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">金额合计相等</text>
<rect x="608" y="180" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="626" cy="198" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="626" y="202" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">3</text>
<text x="644" y="202" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">integrity_check</text>
<rect x="32" y="226" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="50" cy="244" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="50" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">4</text>
<text x="68" y="248" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">无孤儿行</text>
<rect x="320" y="226" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="338" cy="244" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="338" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">5</text>
<text x="356" y="248" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">索引存在</text>
<rect x="608" y="226" width="272" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="626" cy="244" r="10" fill="#ccfbf1" stroke="#0f766e"/>
<text x="626" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0f766e" font-weight="600">6</text>
<text x="644" y="248" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">gate.yaml 全绿</text>
<text x="24" y="292" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937" font-weight="600">RPO 与 RTO 是两把尺子：RPO 量丢多少，RTO 量停多久</text>
<line x1="60" y1="352" x2="860" y2="352" stroke="#cbd5e1" stroke-width="2"/>
<line x1="60" y1="344" x2="60" y2="360" stroke="#6b7280" stroke-width="2"/>
<text x="60" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">上次备份</text>
<line x1="300" y1="344" x2="300" y2="360" stroke="#6b7280" stroke-width="2"/>
<text x="300" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">故障点</text>
<line x1="640" y1="344" x2="640" y2="360" stroke="#6b7280" stroke-width="2"/>
<text x="640" y="380" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">恢复可用</text>
<line x1="60" y1="330" x2="300" y2="330" stroke="#9f1239" stroke-width="2" marker-end="url(#ah-r)"/>
<text x="180" y="322" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9f1239" font-weight="600">RPO 15 min</text>
<line x1="300" y1="330" x2="640" y2="330" stroke="#0f766e" stroke-width="2" marker-end="url(#ah-t)"/>
<text x="470" y="322" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#0f766e" font-weight="600">RTO 实测 ≤ 9 min</text>
<text x="460" y="404" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#6b7280">本机读数：备份 1.04 s / 恢复 3.19 s / 57.36 MiB / 一致性 6 项全过</text>
</svg>
