<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="同事务边界与首次响应回放">
<title>同事务边界与首次响应回放</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<text x="24" y="34" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#0f172a" font-weight="700">第 3 周第 2 步：把「配额 + 用量 + 首次响应」压进一个事务</text>
<text x="24" y="58" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">600 条逻辑请求，每处断点 12% 失败率，种子 20261102</text>
<rect x="24" y="84" width="120" height="46" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="84" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">验签</text>
<line x1="144" y1="107" x2="168" y2="107" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="168" y="84" width="300" height="46" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
<text x="318" y="104" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">同一事务</text>
<text x="318" y="122" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">扣配额 + 写用量 + 存首次响应</text>
<line x1="468" y1="107" x2="492" y2="107" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="492" y="84" width="120" height="46" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="552" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">响应 2xx</text>
<line x1="156" y1="130" x2="156" y2="158" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="148" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0369a1" font-weight="700">B1</text>
<text x="148" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#0369a1" font-weight="400">验签后 / 扣额前</text>
<line x1="330" y1="130" x2="330" y2="158" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="322" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309" font-weight="700">B2</text>
<text x="322" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b45309" font-weight="400">扣额后 / 写用量前</text>
<line x1="480" y1="130" x2="480" y2="158" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="472" y="174" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b91c1c" font-weight="700">B3</text>
<text x="472" y="192" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" fill="#b91c1c" font-weight="400">写用量后 / 响应前</text>
<path d="M 552 130 L 552 216 L 240 216 L 240 160" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="566" y="216" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">客户端重试（同 Idempotency-Key）</text>
<text x="566" y="238" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">命中缓存 → 回放首次响应体</text>
<text x="566" y="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">不再扣配额、不再写用量</text>
<text x="24" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#0f172a" font-weight="700">四档防护的违规读数（V1 扣额无用量 / V2 重复计量）</text>
<rect x="24" y="316" width="500" height="28" rx="6" fill="#fecaca" stroke="#fecaca" stroke-width="1.5"/>
<text x="36" y="335" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">无防护</text>
<text x="300" y="335" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V1 = 59</text>
<text x="420" y="335" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V2 = 66</text>
<rect x="24" y="350" width="500" height="28" rx="6" fill="#fde68a" stroke="#fde68a" stroke-width="1.5"/>
<text x="36" y="369" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">仅补偿</text>
<text x="300" y="369" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V1 = 0</text>
<text x="420" y="369" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V2 = 66</text>
<rect x="24" y="384" width="500" height="28" rx="6" fill="#fef3c7" stroke="#fef3c7" stroke-width="1.5"/>
<text x="36" y="403" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">同事务</text>
<text x="300" y="403" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V1 = 0</text>
<text x="420" y="403" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V2 = 66</text>
<rect x="24" y="418" width="500" height="28" rx="6" fill="#bbf7d0" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="36" y="437" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#0f172a" font-weight="700">同事务 + 首响应缓存</text>
<text x="300" y="437" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V1 = 0</text>
<text x="420" y="437" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#475569" font-weight="400">V2 = 0</text>
<text x="560" y="330" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#0f172a" font-weight="700">事务边界成本（3000 请求）</text>
<text x="560" y="354" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">两次 commit：381 ms（127 µs/请求）</text>
<text x="560" y="376" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">一次 commit：251 ms（84 µs/请求）</text>
<text x="560" y="398" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#15803d" font-weight="400">合并事务反而更快 34%</text>
<text x="560" y="428" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">缓存体积：200,000 键 × 542 B</text>
<text x="560" y="450" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#475569" font-weight="400">= 103.4 MiB（响应体平均 542 B）</text>
</svg>
