<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="412" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">一键部署：Compose 五服务与依赖注入</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">nginx 只做入口，业务两服务各自健康检查，MySQL 与 Redis 带卷持久化</text>
  <rect x="300" y="74" width="160" height="60" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="380" y="92.2" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">nginx 入口</text>
  <text x="380" y="109" text-anchor="middle" font-size="7.5" fill="#334155">80/443 · 静态与转发</text>
  <text x="380" y="126.25" text-anchor="middle" font-size="7.5" fill="#334155">唯一对外端口</text>
  <rect x="30" y="164" width="200" height="86" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="130" y="182.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">blog-web（前台 SSR）</text>
  <text x="130" y="199" text-anchor="middle" font-size="7.5" fill="#047857">Node 常驻 · 端口 3000</text>
  <text x="130" y="216.25" text-anchor="middle" font-size="7.5" fill="#047857">SSR 出完整 HTML</text>
  <text x="130" y="233.5" text-anchor="middle" font-size="7.5" fill="#047857">healthcheck: /healthz</text>
  <rect x="260" y="164" width="200" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="360" y="182.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">blog-server（后端）</text>
  <text x="360" y="199" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Spring Boot · 18080</text>
  <text x="360" y="216.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">profile=prod</text>
  <text x="360" y="233.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">healthcheck: /actuator</text>
  <rect x="490" y="164" width="240" height="86" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="610" y="182.2" text-anchor="middle" font-size="9" fill="#5B21B6" font-weight="bold">依赖注入（env 单一来源）</text>
  <text x="610" y="199" text-anchor="middle" font-size="7.5" fill="#6D28D9">SPRING_PROFILES_ACTIVE=prod</text>
  <text x="610" y="216.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">DB_URL / DB_USER / DB_PASSWORD</text>
  <text x="610" y="233.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">REDIS_HOST / TOKEN_SECRET</text>
  <line x1="380" y1="134" x2="380" y2="148" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="148" x2="130" y2="148" stroke="#334155" stroke-width="1.4"/>
  <line x1="380" y1="148" x2="360" y2="148" stroke="#334155" stroke-width="1.4"/>
  <line x1="130" y1="148" x2="130" y2="164" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="360" y1="148" x2="360" y2="164" stroke="#334155" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="460" y1="207" x2="490" y2="207" stroke="#6D28D9" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="30" y="276" width="330" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="195" y="294.2" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="bold">mysql 8.4（唯一主库）</text>
  <text x="195" y="311" text-anchor="middle" font-size="7.5" fill="#B45309">挂载 conf.d/my.cnf：ngram_token_size=2</text>
  <text x="195" y="328.25" text-anchor="middle" font-size="7.5" fill="#B45309">innodb_ft_enable_stopword=OFF</text>
  <text x="195" y="345.5" text-anchor="middle" font-size="7.5" fill="#B45309">卷 blog-mysql:/var/lib/mysql · 首启慢</text>
  <rect x="400" y="276" width="330" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="565" y="294.2" text-anchor="middle" font-size="9.5" fill="#991B1B" font-weight="bold">redis 7.x（会话与计数）</text>
  <text x="565" y="311" text-anchor="middle" font-size="7.5" fill="#B91C1C">卷 blog-redis:/data · appendonly yes</text>
  <text x="565" y="328.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">评论会话与浏览计数</text>
  <text x="565" y="345.5" text-anchor="middle" font-size="7.5" fill="#B91C1C">允许丢窗口内几秒计数</text>
  <line x1="360" y1="250" x2="360" y2="262" stroke="#B45309" stroke-width="1.4"/>
  <line x1="195" y1="262" x2="565" y2="262" stroke="#B45309" stroke-width="1.4"/>
  <line x1="195" y1="262" x2="195" y2="276" stroke="#B45309" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="565" y1="262" x2="565" y2="276" stroke="#B45309" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="380" y="394" text-anchor="middle" font-size="9.5" fill="#B91C1C">红线：ngram 两行配置必须落在 my.cnf 里进容器，漏了搜索不报错、只是永远搜不到中文词</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
