<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">全栈博客平台 ER 图（6 张业务表 + 1 张回写表）</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">user - post 为 1:N；post 与 tag 经 post_tags 多对多；comment 自关联实现两级嵌套</text>

  <!-- users -->
  <rect x="60" y="80" width="170" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="145" y="102" text-anchor="middle" font-size="12" fill="#1E40AF" font-weight="bold">users</text>
  <text x="75" y="122" font-size="10" fill="#1D4ED8">PK id BIGINT（雪花）</text>
  <text x="75" y="140" font-size="10" fill="#1D4ED8">username / password_hash</text>
  <text x="75" y="158" font-size="10" fill="#1D4ED8">role（ADMIN/AUTHOR/READER）</text>

  <!-- posts -->
  <rect x="300" y="80" width="200" height="150" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="400" y="102" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">posts</text>
  <text x="315" y="122" font-size="10" fill="#047857">PK id / FK author_id → users</text>
  <text x="315" y="140" font-size="10" fill="#047857">slug UNIQUE / title / status</text>
  <text x="315" y="158" font-size="10" fill="#047857">content_md / content_html</text>
  <text x="315" y="176" font-size="10" fill="#047857">search_text（FULLTEXT ngram）</text>
  <text x="315" y="194" font-size="10" fill="#047857">category_id / view_count</text>
  <text x="315" y="212" font-size="10" fill="#047857">published_at / status 索引</text>

  <!-- categories -->
  <rect x="560" y="80" width="160" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="640" y="102" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">categories</text>
  <text x="575" y="122" font-size="10" fill="#B45309">PK id / name UNIQUE</text>
  <text x="575" y="140" font-size="10" fill="#B45309">slug UNIQUE</text>

  <!-- post_tags -->
  <rect x="330" y="270" width="150" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="405" y="292" text-anchor="middle" font-size="12" fill="#4C1D95" font-weight="bold">post_tags</text>
  <text x="345" y="312" font-size="10" fill="#6D28D9">PK (post_id, tag_id)</text>

  <!-- tags -->
  <rect x="560" y="270" width="160" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="640" y="292" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">tags</text>
  <text x="575" y="312" font-size="10" fill="#B45309">PK id / name UNIQUE</text>
  <text x="575" y="330" font-size="10" fill="#B45309">slug UNIQUE</text>

  <!-- comments -->
  <rect x="60" y="270" width="220" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="170" y="292" text-anchor="middle" font-size="12" fill="#1E40AF" font-weight="bold">comments</text>
  <text x="75" y="312" font-size="10" fill="#1D4ED8">PK id / FK post_id → posts</text>
  <text x="75" y="330" font-size="10" fill="#1D4ED8">FK user_id → users</text>
  <text x="75" y="348" font-size="10" fill="#1D4ED8">parent_id（自关联，两级）</text>
  <text x="75" y="366" font-size="10" fill="#1D4ED8">content（1~500）</text>
  <text x="75" y="384" font-size="10" fill="#1D4ED8">root_id（楼层根，冗余）</text>

  <!-- view_count_daily -->
  <rect x="60" y="430" width="220" height="64" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="170" y="452" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">view_count_daily（回写表）</text>
  <text x="75" y="472" font-size="10" fill="#475569">post_id + date 唯一 · Redis 定时回写</text>

  <!-- relations -->
  <line x1="230" y1="128" x2="300" y2="128" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="265" y="120" text-anchor="middle" font-size="9.5" fill="#64748B">1:N 作者</text>
  <line x1="500" y1="128" x2="560" y2="128" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="530" y="120" text-anchor="middle" font-size="9.5" fill="#64748B">N:1</text>
  <line x1="405" y1="230" x2="405" y2="270" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="435" y="254" font-size="9.5" fill="#64748B">M:N 经 post_tags</text>
  <line x1="480" y1="302" x2="560" y2="302" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="280" y1="320" x2="330" y2="320" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="305" y="312" text-anchor="middle" font-size="9.5" fill="#64748B">1:N</text>
  <line x1="170" y1="390" x2="170" y2="430" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
