<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="404" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">契约先行 + 双方言 DDL：第 92 天的两个门禁</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">契约定稿后前后端并行；DDL 两侧成对由 parity 门禁守住结构一致</text>
  <text x="60" y="82" text-anchor="start" font-size="10.5" fill="#1E3A8A" font-weight="bold">契约是「可 diff 的事实来源」：改接口先改契约，评审过了再写代码</text>
  <rect x="30" y="94" width="210" height="108" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="135" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 定契约（第 92 天）</text>
  <text x="135" y="129" text-anchor="middle" font-size="8" fill="#6D28D9">api/openapi.json（OpenAPI 3.1）</text>
  <text x="135" y="147.4" text-anchor="middle" font-size="8" fill="#6D28D9">四条链路 12 路径 14 操作</text>
  <text x="135" y="165.8" text-anchor="middle" font-size="8" fill="#6D28D9">统一响应 Result + JWT 口径</text>
  <text x="135" y="184.2" text-anchor="middle" font-size="8" fill="#6D28D9">门禁：contract_check.py</text>
  <line x1="240" y1="148" x2="292" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="300" y="94" width="190" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="395" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 并行开工</text>
  <text x="395" y="129" text-anchor="middle" font-size="8" fill="#1D4ED8">前端：按契约 Mock</text>
  <text x="395" y="147.4" text-anchor="middle" font-size="8" fill="#1D4ED8">后端：按契约实现</text>
  <text x="395" y="165.8" text-anchor="middle" font-size="8" fill="#1D4ED8">改接口先改契约</text>
  <text x="395" y="184.2" text-anchor="middle" font-size="8" fill="#1D4ED8">契约进 Git 可 diff 可评审</text>
  <line x1="490" y1="148" x2="542" y2="148" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="550" y="94" width="180" height="108" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="640" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 契约测试</text>
  <text x="640" y="129" text-anchor="middle" font-size="8" fill="#047857">实现对照契约断言</text>
  <text x="640" y="147.4" text-anchor="middle" font-size="8" fill="#047857">破坏性变更被拦截</text>
  <text x="640" y="165.8" text-anchor="middle" font-size="8" fill="#047857">CI 门禁接入（第 3 周）</text>
  <text x="60" y="236" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">同日交付：双方言 DDL 与结构门禁（第 1 周数据库设计闭环）</text>
  <rect x="30" y="248" width="340" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="200" y="266.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">db/mysql + db/postgres</text>
  <text x="200" y="283" text-anchor="middle" font-size="8" fill="#0F766E">V1__blog_init.sql 两侧成对</text>
  <text x="200" y="301.4" text-anchor="middle" font-size="8" fill="#0F766E">七条翻译规则转换</text>
  <text x="200" y="319.8" text-anchor="middle" font-size="8" fill="#0F766E">DATETIME→TIMESTAMP、MEDIUMTEXT→TEXT</text>
  <text x="200" y="338.2" text-anchor="middle" font-size="8" fill="#0F766E">FULLTEXT(ngram) → GIN(to_tsvector)</text>
  <rect x="390" y="248" width="340" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="266.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">db/parity_check.py 门禁</text>
  <text x="560" y="283" text-anchor="middle" font-size="8" fill="#B45309">类型归一化逐列比对</text>
  <text x="560" y="301.4" text-anchor="middle" font-size="8" fill="#B45309">主键 / 唯一 / 普通索引一致</text>
  <text x="560" y="319.8" text-anchor="middle" font-size="8" fill="#B45309">检索索引：名称对齐、列形态豁免</text>
  <text x="560" y="338.2" text-anchor="middle" font-size="8" fill="#B45309">不一致退出码 1，可直接进 CI</text>
  <text x="380" y="386" text-anchor="middle" font-size="10" fill="#B91C1C" font-weight="bold">验收：contract_check 与 parity_check 退出码均为 0；门禁有效性用变异法确认（改坏一格必须报红）</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
