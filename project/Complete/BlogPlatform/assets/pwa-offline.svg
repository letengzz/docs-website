<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="448" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">博客前台离线三层落位与三条硬红线</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">四项能力只做三项：可离线、可安装、可后台（仅评论）；可推送明确不做</text>

  <text x="195" y="78" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">缓存三层（职责不混，配置一行行对上）</text>

  <rect x="30" y="88" width="330" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="195" y="110" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">① 壳 —— 预缓存 + Cache First</text>
  <text x="195" y="130" text-anchor="middle" font-size="8" fill="#1D4ED8">_nuxt/* 的 JS/CSS、字体、图标、offline.html</text>
  <text x="195" y="148" text-anchor="middle" font-size="8" fill="#1D4ED8">带内容哈希 → 永远不会陈旧</text>
  <text x="195" y="166" text-anchor="middle" font-size="8" fill="#DC2626">SSR 输出的 HTML 不进这一层（每次请求现渲染）</text>

  <rect x="30" y="194" width="330" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="195" y="216" text-anchor="middle" font-size="10.5" fill="#5B21B6" font-weight="bold">② 内容快照 —— Network First（3s 超时）</text>
  <text x="195" y="236" text-anchor="middle" font-size="8" fill="#6D28D9">只快照「访问过的」文章详情页 HTML</text>
  <text x="195" y="254" text-anchor="middle" font-size="8" fill="#6D28D9">cacheName: pages ｜ maxEntries 30 ｜ 7 天</text>
  <text x="195" y="272" text-anchor="middle" font-size="8" fill="#6D28D9">承接第 102 天口径：仅 PUBLISHED 会进缓存</text>

  <rect x="30" y="300" width="330" height="96" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="195" y="322" text-anchor="middle" font-size="10.5" fill="#065F46" font-weight="bold">③ 兜底 —— navigateFallback: /offline.html</text>
  <text x="195" y="342" text-anchor="middle" font-size="8" fill="#047857">纯静态、不依赖 Nuxt 与任何前端依赖</text>
  <text x="195" y="360" text-anchor="middle" font-size="8" fill="#047857">读出 pages 缓存，列出「离线可读的文章」</text>
  <text x="195" y="378" text-anchor="middle" font-size="8" fill="#047857">让离线状态仍然有用，而不是死路一条</text>

  <rect x="380" y="88" width="350" height="118" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="555" y="110" text-anchor="middle" font-size="10.5" fill="#991B1B" font-weight="bold">三条硬红线（都属「不报错但错」）</text>
  <text x="555" y="132" text-anchor="middle" font-size="8.5" fill="#B91C1C">① /api/ 必须进 navigateFallbackDenylist</text>
  <text x="555" y="150" text-anchor="middle" font-size="8" fill="#B91C1C">否则断网时接口会拿到 HTML，res.json() 的错误指向无关位置</text>
  <text x="555" y="172" text-anchor="middle" font-size="8.5" fill="#B91C1C">② /api/v1/me、admin、评论写接口绝不进缓存</text>
  <text x="555" y="190" text-anchor="middle" font-size="8" fill="#B91C1C">个人化数据被缓存 → 切换账号串号，属安全事故</text>

  <rect x="380" y="218" width="350" height="72" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="555" y="240" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">③ 接口响应必须限 statuses: [200]</text>
  <text x="555" y="260" text-anchor="middle" font-size="8" fill="#C2410C">第 102 天定死「非 PUBLISHED 一律 404」；若 404 也被缓存</text>
  <text x="555" y="278" text-anchor="middle" font-size="8" fill="#C2410C">读者会长期看到「文章不存在」，且不会有任何日志</text>

  <rect x="380" y="302" width="350" height="94" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text x="555" y="324" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">两条容易踩的时效性口径</text>
  <text x="555" y="344" text-anchor="middle" font-size="8" fill="#334155">安装不依赖 Service Worker：Manifest + HTTPS 即可安装</text>
  <text x="555" y="362" text-anchor="middle" font-size="8" fill="#334155">Lighthouse 12.0 已移除 PWA 分类，验收看运行时信号</text>
  <text x="555" y="382" text-anchor="middle" font-size="8" fill="#334155">不要写「Lighthouse PWA 分数 ≥ 90」这类已失效的判据</text>

  <rect x="30" y="408" width="700" height="32" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="380" y="429" text-anchor="middle" font-size="9.5" fill="#3730A3" font-weight="bold">交付判据：F1~F10 十条断言；其中 F10 证明 SEO（完整 SSR HTML）没有被离线能力换掉</text>
</svg>
