<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">管理端认证与鉴权：一道请求穿过四道关卡</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">认证回答「你是谁」，授权回答「你能不能」——顺序一旦颠倒，未认证的人也能问出路径是否存在</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">四道关卡全部通过，业务代码才第一次看到这个请求</text>
  <rect x="30" y="94" width="168" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="114" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 取令牌</text>
  <text x="114" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">从 Authorization 头取 Bearer</text>
  <text x="114" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">缺失 / 格式错 → 401</text>
  <text x="114" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">OPTIONS 预检直接放行</text>
  <text x="114" y="180.75" text-anchor="middle" font-size="7.5" fill="#6D28D9">在拦截器里，不进控制器</text>
  <line x1="198" y1="146" x2="210" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="94" width="168" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="294" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 验签与过期</text>
  <text x="294" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">先验 HMAC-SHA256 签名</text>
  <text x="294" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">再解析 payload，最后判 exp</text>
  <text x="294" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">顺序反了 = 读伪造数据</text>
  <text x="294" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">失败一律 401，不区分原因</text>
  <line x1="378" y1="146" x2="390" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="94" width="168" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="474" y="112.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 规则查表</text>
  <text x="474" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">方法 + 路径前缀 → 所需角色</text>
  <text x="474" y="146.25" text-anchor="middle" font-size="7.5" fill="#0F766E">未命中 → 按 VIEWER 兜底</text>
  <text x="474" y="163.5" text-anchor="middle" font-size="7.5" fill="#0F766E">角色不足 → 403</text>
  <text x="474" y="180.75" text-anchor="middle" font-size="7.5" fill="#0F766E">默认拒绝，不默认放行</text>
  <line x1="558" y1="146" x2="570" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="94" width="168" height="104" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="654" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 业务处理</text>
  <text x="654" y="129" text-anchor="middle" font-size="7.5" fill="#047857">身份与角色已是可信输入</text>
  <text x="654" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">400 / 404 / 409 由业务给出</text>
  <text x="654" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">审计日志在此后落库</text>
  <text x="654" y="180.75" text-anchor="middle" font-size="7.5" fill="#047857">身份经请求属性向下传递</text>
  <line x1="30" y1="216" x2="730" y2="216" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="242" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">两个最容易被写混的地方：状态码边界与角色阶梯</text>
  <rect x="30" y="254" width="340" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="272.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">401 与 403 的边界</text>
  <text x="200" y="289" text-anchor="middle" font-size="8" fill="#1D4ED8">401 = 「你是谁」没答上来：无令牌 / 格式错 / 验签失败 / 过期 / 口令错</text>
  <text x="200" y="307.4" text-anchor="middle" font-size="8" fill="#1D4ED8">403 = 身份答对了，但角色不够</text>
  <text x="200" y="325.8" text-anchor="middle" font-size="8" fill="#1D4ED8">认证必须在授权之前：先判权限等于承认「该路径存在」</text>
  <text x="200" y="344.2" text-anchor="middle" font-size="8" fill="#1D4ED8">客户端应对：401 去登录，403 提示无权限</text>
  <rect x="390" y="254" width="340" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="272.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">角色阶梯与写权限</text>
  <text x="560" y="289" text-anchor="middle" font-size="8" fill="#B45309">VIEWER(1)：只读后台，未登记规则时的兜底级别</text>
  <text x="560" y="307.4" text-anchor="middle" font-size="8" fill="#B45309">EDITOR(2)：文章增删改 + 发布 / 下线</text>
  <text x="560" y="325.8" text-anchor="middle" font-size="8" fill="#B45309">ADMIN(3)：EDITOR 全部 + 分类与标签维护</text>
  <text x="560" y="344.2" text-anchor="middle" font-size="8" fill="#B45309">比较用「至少达到」一个量，不做两套互不相干的判定</text>
  <text x="380" y="392" text-anchor="middle" font-size="9.5" fill="#1E3A8A">令牌是自签的：header.payload.signature，HS256 + Base64URL 无填充；暂不引第三方库，等需要 RS256 / JWKS 轮转时再换</text>
  <text x="380" y="414" text-anchor="middle" font-size="9.5" fill="#B91C1C">最容易出事的两处都不报错：授权写在认证之前、规则漏登记时默认放行——它们只会静默泄露</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
