<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">管理端写入链路：四道关卡与两条读回路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">写入只需一条路径，读出必须分成读者端与后台端两条——混淆这两条是内容系统最经典的泄露事故</text>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#1E3A8A" font-weight="bold">一次写入要穿过四道关卡，然后被两条完全不同的查询读到</text>
  <rect x="30" y="94" width="168" height="104" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="114" y="112.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">① 入口校验</text>
  <text x="114" y="129" text-anchor="middle" font-size="7.5" fill="#6D28D9">@Valid：字段级约束</text>
  <text x="114" y="146.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">引用校验：categoryId / tagIds</text>
  <text x="114" y="163.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">不合法 → 400 + 字段名</text>
  <line x1="198" y1="146" x2="210" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="94" width="168" height="104" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="294" y="112.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">② 状态机动作</text>
  <text x="294" y="129" text-anchor="middle" font-size="7.5" fill="#1D4ED8">create / update</text>
  <text x="294" y="146.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">publish：DRAFT → PUBLISHED</text>
  <text x="294" y="163.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">delete：软删除</text>
  <text x="294" y="180.75" text-anchor="middle" font-size="7.5" fill="#1D4ED8">非法迁移 → 409</text>
  <line x1="378" y1="146" x2="390" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="94" width="168" height="104" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="474" y="112.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">③ 唯一性与翻译</text>
  <text x="474" y="129" text-anchor="middle" font-size="7.5" fill="#0F766E">slug 冲突 → 409</text>
  <text x="474" y="146.25" text-anchor="middle" font-size="7.5" fill="#0F766E">id → slug 翻译在此发生</text>
  <text x="474" y="163.5" text-anchor="middle" font-size="7.5" fill="#0F766E">更新时排除自己</text>
  <line x1="558" y1="146" x2="570" y2="146" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="94" width="168" height="104" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="654" y="112.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">④ 渲染与落定</text>
  <text x="654" y="129" text-anchor="middle" font-size="7.5" fill="#047857">发布时刻才渲染 HTML</text>
  <text x="654" y="146.25" text-anchor="middle" font-size="7.5" fill="#047857">先转义再拼标签（消毒）</text>
  <text x="654" y="163.5" text-anchor="middle" font-size="7.5" fill="#047857">published_at 同时写死</text>
  <line x1="30" y1="216" x2="730" y2="216" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="242" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">同一张表、两条查询：可见性判定必须分开写</text>
  <rect x="30" y="254" width="340" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="272.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">读者端查询（findPublished*）</text>
  <text x="200" y="289" text-anchor="middle" font-size="8" fill="#1D4ED8">过滤：status = PUBLISHED 且 published_at 非空</text>
  <text x="200" y="307.4" text-anchor="middle" font-size="8" fill="#1D4ED8">软删除时把 published_at 清空 → 双保险</text>
  <text x="200" y="325.8" text-anchor="middle" font-size="8" fill="#1D4ED8">草稿对读者端恒为 404，连存在性都不暴露</text>
  <text x="200" y="344.2" text-anchor="middle" font-size="8" fill="#1D4ED8">按 published_at 倒序分页</text>
  <rect x="390" y="254" width="340" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="560" y="272.2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">后台端查询（findForAdmin / findById）</text>
  <text x="560" y="289" text-anchor="middle" font-size="8" fill="#B45309">过滤：status != DELETED</text>
  <text x="560" y="307.4" text-anchor="middle" font-size="8" fill="#B45309">草稿可见（否则作者找不到自己的草稿）</text>
  <text x="560" y="325.8" text-anchor="middle" font-size="8" fill="#B45309">软删除后连后台也按「不存在」处理</text>
  <text x="560" y="344.2" text-anchor="middle" font-size="8" fill="#B45309">按 id 倒序：新建的排在最前</text>
  <text x="380" y="392" text-anchor="middle" font-size="9.5" fill="#1E3A8A">两条查询共用一张表是刻意的：可见性差异属于「查询语义」，不属于「数据形态」——多一张草稿表只会引入同步问题</text>
  <text x="380" y="414" text-anchor="middle" font-size="9.5" fill="#B91C1C">契约缺口是在这一步被发现的：实现必然产生 400 / 404 / 409，而初版契约只声明了 200 与 403 → 已回补进 openapi.json</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
