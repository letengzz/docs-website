<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="560" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">全栈博客平台：分层架构与资产复用</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">前台 SSR 直出保 SEO；业务层是唯一新写的部分，基座能力全部来自后端通用模板</text>

  <!-- 客户端层 -->
  <text x="60" y="84" font-size="11" fill="#7C3AED" font-weight="bold">客户端层</text>
  <rect x="60" y="92" width="300" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="210" y="116" text-anchor="middle" font-size="12" fill="#4C1D95" font-weight="bold">前台 · Nuxt（Vue3 SSR）</text>
  <text x="210" y="136" text-anchor="middle" font-size="10" fill="#6D28D9">文章 / 搜索页 / 归档 · HTML 直出 · SEO</text>

  <rect x="400" y="92" width="300" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="550" y="116" text-anchor="middle" font-size="12" fill="#4C1D95" font-weight="bold">后台管理 · Vue3 SPA</text>
  <text x="550" y="136" text-anchor="middle" font-size="10" fill="#6D28D9">写作 / 草稿 / 评论管理 · Element Plus</text>

  <line x1="210" y1="158" x2="330" y2="196" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="550" y1="158" x2="430" y2="196" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="380" y="182" text-anchor="middle" font-size="10" fill="#64748B">HTTPS / JSON API（OpenAPI 契约先行）</text>

  <!-- 服务端层 -->
  <text x="60" y="216" font-size="11" fill="#2563EB" font-weight="bold">服务端层（Spring Boot 4.1 · Java 25）</text>
  <rect x="60" y="224" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="160" y="248" text-anchor="middle" font-size="11.5" fill="#1E40AF" font-weight="bold">业务模块（新写）</text>
  <text x="160" y="266" text-anchor="middle" font-size="10" fill="#1D4ED8">文章 / 分类标签 / 评论 / 搜索</text>

  <rect x="280" y="224" width="200" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="380" y="248" text-anchor="middle" font-size="11.5" fill="#1E40AF" font-weight="bold">渲染与检索</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#1D4ED8">commonmark + 消毒 · ngram 全文</text>

  <rect x="500" y="224" width="200" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/>
  <text x="600" y="248" text-anchor="middle" font-size="11.5" fill="#1E40AF" font-weight="bold">后端通用模板（复用）</text>
  <text x="600" y="266" text-anchor="middle" font-size="10" fill="#1D4ED8">认证 / 统一响应 / 异常 / TraceId</text>

  <line x1="160" y1="286" x2="230" y2="330" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="380" y1="286" x2="330" y2="330" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="600" y1="286" x2="530" y2="330" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- 数据层 -->
  <text x="60" y="350" font-size="11" fill="#059669" font-weight="bold">数据层</text>
  <rect x="60" y="358" width="300" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="210" y="382" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">MySQL 8.4（可插拔 PostgreSQL 17）</text>
  <text x="210" y="400" text-anchor="middle" font-size="10" fill="#047857">7 张业务表 · ngram FULLTEXT · Flyway 迁移</text>

  <rect x="400" y="358" width="300" height="62" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="550" y="382" text-anchor="middle" font-size="11.5" fill="#065F46" font-weight="bold">Redis 8</text>
  <text x="550" y="400" text-anchor="middle" font-size="10" fill="#047857">文章缓存 · 浏览计数 · 会话黑名单</text>

  <line x1="210" y1="420" x2="210" y2="452" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="550" y1="420" x2="550" y2="452" stroke="#94A3B8" stroke-width="1.4"/>

  <!-- 部署与质量层 -->
  <text x="60" y="472" font-size="11" fill="#D97706" font-weight="bold">交付层</text>
  <rect x="60" y="480" width="640" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="380" y="502" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Docker Compose 一键部署 ｜ CI 门禁（复用模板 gates.json）｜ k6 压测 ｜ 上线验收清单</text>
  <text x="380" y="521" text-anchor="middle" font-size="10" fill="#B45309">nginx（前台 SSR + 后台静态 + API 反代）</text>

  <line x1="380" y1="440" x2="380" y2="452" stroke="#94A3B8" stroke-width="1.4"/>
</svg>
