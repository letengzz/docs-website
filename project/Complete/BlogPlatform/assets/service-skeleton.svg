<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="500" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">后端工程骨架：四模块、两条运行路径、两个门禁</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">第 93 天产出 —— 「契约 → 实现 → 验收」最小闭环里，结构由门禁保，行为由冒烟保</text>
  <rect x="30" y="76" width="160" height="82" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="110" y="94.2" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="bold">blog-common</text>
  <text x="110" y="111" text-anchor="middle" font-size="7.5" fill="#6D28D9">Result / ErrorCode</text>
  <text x="110" y="128.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">BizException</text>
  <text x="110" y="145.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">零第三方依赖</text>
  <line x1="190" y1="117" x2="210" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="210" y="76" width="160" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="290" y="94.2" text-anchor="middle" font-size="9.5" fill="#1E3A8A" font-weight="bold">blog-data</text>
  <text x="290" y="111" text-anchor="middle" font-size="7.5" fill="#1D4ED8">Post / Page 模型</text>
  <text x="290" y="128.25" text-anchor="middle" font-size="7.5" fill="#1D4ED8">PostRepository 接口</text>
  <text x="290" y="145.5" text-anchor="middle" font-size="7.5" fill="#1D4ED8">InMemory 实现</text>
  <line x1="370" y1="117" x2="390" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="76" width="160" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="470" y="94.2" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="bold">blog-web</text>
  <text x="470" y="111" text-anchor="middle" font-size="7.5" fill="#047857">PostController</text>
  <text x="470" y="128.25" text-anchor="middle" font-size="7.5" fill="#047857">DTO 映射</text>
  <text x="470" y="145.5" text-anchor="middle" font-size="7.5" fill="#047857">全局异常出口</text>
  <line x1="550" y1="117" x2="570" y2="117" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="570" y="76" width="160" height="82" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="650" y="94.2" text-anchor="middle" font-size="9.5" fill="#9A3412" font-weight="bold">blog-application</text>
  <text x="650" y="111" text-anchor="middle" font-size="7.5" fill="#C2410C">启动类 + 装配</text>
  <text x="650" y="128.25" text-anchor="middle" font-size="7.5" fill="#C2410C">装载迁移脚本</text>
  <text x="650" y="145.5" text-anchor="middle" font-size="7.5" fill="#C2410C">唯一可启动模块</text>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#5B21B6">依赖方向只准向右：common ← data ← web ← application（反向依赖由门禁 S3 拦下）</text>
  <text x="60" y="208" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">两条运行路径：同一份代码，两种装配</text>
  <rect x="30" y="218" width="340" height="78" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="200" y="236.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">本地 · local（默认 profile）</text>
  <text x="200" y="253" text-anchor="middle" font-size="8" fill="#047857">内存仓储，不需要数据库</text>
  <text x="200" y="271.4" text-anchor="middle" font-size="8" fill="#047857">mvn spring-boot:run  →  默认 8080</text>
  <text x="200" y="289.8" text-anchor="middle" font-size="8" fill="#047857">契约与行为验收都在这条路径上跑</text>
  <rect x="390" y="218" width="340" height="78" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="560" y="236.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">生产 · prod + flyway</text>
  <text x="560" y="253" text-anchor="middle" font-size="8" fill="#C2410C">Flyway 装载 db/&lt;vendor&gt;/ 迁移脚本</text>
  <text x="560" y="271.4" text-anchor="middle" font-size="8" fill="#C2410C">凭据全是无默认值占位符 ${DB_URL}</text>
  <text x="560" y="289.8" text-anchor="middle" font-size="8" fill="#C2410C">缺环境变量就起不来 —— 有意为之</text>
  <text x="60" y="328" text-anchor="start" font-size="11" fill="#0F172A" font-weight="bold">两个门禁：一个管结构，一个管行为</text>
  <rect x="30" y="338" width="340" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="200" y="356.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">skeleton_check.py · 结构</text>
  <text x="200" y="373" text-anchor="middle" font-size="8" fill="#1D4ED8">模块名单 / 依赖方向 / 版本来源 / 生产配置</text>
  <text x="200" y="391.4" text-anchor="middle" font-size="8" fill="#1D4ED8">迁移脚本命名与双方言版本对齐</text>
  <text x="200" y="409.8" text-anchor="middle" font-size="8" fill="#1D4ED8">27 条断言，8 个变异用例自证有效</text>
  <rect x="390" y="338" width="340" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="560" y="356.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">api_smoke.py · 行为</text>
  <text x="560" y="373" text-anchor="middle" font-size="8" fill="#0F766E">9 个用例：列表 / 详情 / 过滤 / 健康检查</text>
  <text x="560" y="391.4" text-anchor="middle" font-size="8" fill="#0F766E">含错误路径：草稿 404、越界分页 400</text>
  <text x="560" y="409.8" text-anchor="middle" font-size="8" fill="#0F766E">断言喂空响应必须报错，否则是假门禁</text>
  <line x1="30" y1="434" x2="730" y2="434" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="380" y="456" text-anchor="middle" font-size="10" fill="#B91C1C">两条门禁都要能「变异测试」：把配置或断言改坏一格必须报红 —— 只跑一遍通过不算验证</text>
  <text x="380" y="476" text-anchor="middle" font-size="9.5" fill="#065F46">当日实测：mvn install 成功 → 服务 8 秒监听 → api_smoke 9/9 PASS</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
