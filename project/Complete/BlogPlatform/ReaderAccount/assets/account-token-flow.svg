<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">令牌生命周期：access 无状态、refresh 可撤销、一换一</text>

  <!-- stages -->
  <rect x="20" y="44" width="120" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">① 注册</text>
  <text x="80" y="84" text-anchor="middle" font-size="9" fill="#64748b">建 PENDING 账号</text>
  <text x="80" y="98" text-anchor="middle" font-size="9" fill="#64748b">不发令牌</text>

  <rect x="152" y="44" width="120" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="212" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a5f">② 登录</text>
  <text x="212" y="84" text-anchor="middle" font-size="9" fill="#1e40af">access 15 分</text>
  <text x="212" y="98" text-anchor="middle" font-size="9" fill="#1e40af">refresh 30 天 + 开族</text>

  <rect x="284" y="44" width="120" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="344" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a5f">③ 刷新</text>
  <text x="344" y="84" text-anchor="middle" font-size="9" fill="#1e40af">换新 access</text>
  <text x="344" y="98" text-anchor="middle" font-size="9" fill="#1e40af">refresh 同时轮换</text>

  <rect x="416" y="44" width="120" height="62" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="476" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">④ 复用检测</text>
  <text x="476" y="84" text-anchor="middle" font-size="9" fill="#b91c1c">旧 refresh 又出现</text>
  <text x="476" y="98" text-anchor="middle" font-size="9" fill="#b91c1c">判定这一族已泄漏</text>

  <rect x="548" y="44" width="112" height="62" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="604" y="66" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">⑤ 撤销</text>
  <text x="604" y="84" text-anchor="middle" font-size="9" fill="#b45309">登出 / 改密 / 冻结</text>
  <text x="604" y="98" text-anchor="middle" font-size="9" fill="#b45309">三种触发源</text>

  <g stroke="#64748b" stroke-width="1.2" fill="none">
    <line x1="140" y1="75" x2="148" y2="75"/><polygon points="148,75 143,72 143,78" fill="#64748b"/>
    <line x1="272" y1="75" x2="280" y2="75"/><polygon points="280,75 275,72 275,78" fill="#64748b"/>
    <line x1="404" y1="75" x2="412" y2="75"/><polygon points="412,75 407,72 407,78" fill="#64748b"/>
    <line x1="536" y1="75" x2="544" y2="75"/><polygon points="544,75 539,72 539,78" fill="#64748b"/>
  </g>

  <!-- detail panel -->
  <rect x="20" y="122" width="640" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="144" font-size="10.5" fill="#334155">② 登录：一次登录 = 一个 family_id。刷新令牌只存哈希 —— 它本身就是凭据，明文入库等于口令明文入库。</text>
  <text x="38" y="166" font-size="10.5" fill="#334155">③ 刷新：旧的 refresh 立刻写 revoked_at 与 replaced_by。轮换是 RFC 9700 对公开客户端的要求，</text>
  <text x="38" y="184" font-size="10.5" fill="#64748b">     代价是并发刷新必然有一次失败 —— 前端要用「单飞 + 排队」而不是「各自去刷」（见测试页 B3）。</text>
  <text x="38" y="206" font-size="10.5" fill="#991b1b">④ 复用检测：服务端无法判断是攻击者还是本人在用旧票，所以只能把整族作废，让双方都重新登录。</text>
  <text x="38" y="224" font-size="10.5" fill="#64748b">     安全优先于便利：宁可让真实用户多登一次，也不能让攻击者继续持有有效族。</text>
  <text x="38" y="246" font-size="10.5" fill="#334155">⑤ 登出撤当前族；改密与冻结撤该用户全部族（RFC 9700 明确把这两件事列为可自动撤销的安全事件）。</text>
  <text x="38" y="264" font-size="10.5" fill="#334155">闲置过期：refresh 30 天未使用即失效，不因「用户还在但很久没来」而永久有效。</text>

  <!-- rule -->
  <rect x="20" y="284" width="640" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="38" y="306" font-size="11" font-weight="700" fill="#1e3a5f">为什么 access 不落库、refresh 必须落库</text>
  <text x="38" y="328" font-size="10.5" fill="#1e40af">access 寿命 15 分钟，靠短寿命换取「不用查库」——每个请求只做一次 HMAC 验签，零 IO。</text>
  <text x="38" y="348" font-size="10.5" fill="#1e40af">refresh 寿命 30 天，必须能「反悔」：登出、改密、冻结、泄漏检测都要能即时作废它。</text>
  <text x="38" y="368" font-size="10.5" fill="#1e40af">无状态令牌撤销不了的场景，全部由这张表兜住 —— 这就是它存在的唯一理由。</text>
</svg>
