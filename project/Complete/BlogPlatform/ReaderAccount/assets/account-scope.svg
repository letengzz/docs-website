<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">一张 users 表、两套入口、一条硬边界</text>

  <!-- reader side -->
  <rect x="26" y="46" width="300" height="252" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="176" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a5f">读者端账号（第 109 天新建）</text>
  <line x1="46" y1="80" x2="306" y2="80" stroke="#e2e8f0"/>
  <text x="44" y="102" font-size="11" fill="#334155">凭据来源：users 表（数据库）</text>
  <text x="44" y="130" font-size="11" fill="#334155">入口：/api/v1/auth/** 与 /api/v1/me/**</text>
  <text x="44" y="158" font-size="11" fill="#334155">令牌：access 15 分 + refresh 30 天</text>
  <text x="44" y="182" font-size="9.5" fill="#64748b" font-family="Menlo, monospace">refresh 落库 = 可撤销（JWT 撤销不了的它管）</text>
  <text x="44" y="210" font-size="11" fill="#334155">载体：httpOnly Cookie</text>
  <text x="44" y="234" font-size="9.5" fill="#64748b" font-family="Menlo, monospace">前台是 SSR，服务端必须读得到登录态</text>
  <text x="44" y="262" font-size="11" fill="#334155">页面：/register /login /me /me/comments</text>
  <text x="44" y="286" font-size="11" fill="#1e3a5f" font-weight="600">业务身份：READER / AUTHOR</text>

  <!-- admin side -->
  <rect x="354" y="46" width="300" height="252" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="504" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">管理端账号（第 99 天已建）</text>
  <line x1="374" y1="80" x2="634" y2="80" stroke="#e2e8f0"/>
  <text x="372" y="102" font-size="11" fill="#334155">凭据来源：users 表 + admin_role 列</text>
  <text x="372" y="130" font-size="11" fill="#334155">入口：/api/v1/admin/**</text>
  <text x="372" y="158" font-size="11" fill="#334155">令牌：access 2 小时</text>
  <text x="372" y="182" font-size="9.5" fill="#64748b" font-family="Menlo, monospace">第 99 天由配置起步，本日收敛进表</text>
  <text x="372" y="210" font-size="11" fill="#334155">载体：Authorization: Bearer（SPA）</text>
  <text x="372" y="234" font-size="9.5" fill="#64748b" font-family="Menlo, monospace">后台无 SEO 需求，不走 SSR 缓存</text>
  <text x="372" y="262" font-size="11" fill="#334155">页面：后台管理端（Vue3 + Element Plus）</text>
  <text x="372" y="286" font-size="11" fill="#334155" font-weight="600">运维角色：VIEWER / EDITOR / ADMIN</text>

  <!-- hard boundary -->
  <rect x="26" y="314" width="628" height="70" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="44" y="338" font-size="11.5" font-weight="700" fill="#991b1b">硬边界：读者令牌访问 /api/v1/admin/** 必须返回 401，不是 403</text>
  <text x="44" y="358" font-size="10" fill="#b91c1c">令牌里带 aud=reader|admin，管理端拦截器在验签后立刻比对 aud</text>
  <text x="44" y="375" font-size="10" fill="#b91c1c">拿错门票属于「身份未被证实」，不是「角色不够」——判错方向就等于承认了该身份有效</text>
</svg>
