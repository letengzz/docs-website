<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">页面与登录态：SSR 下令牌放在哪、缓存怎么切</text>

  <!-- pages -->
  <rect x="26" y="46" width="236" height="196" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="144" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f">四个页面</text>
  <text x="40" y="92" font-size="10" fill="#1e3a5f">/register 注册</text>
  <text x="40" y="110" font-size="9" fill="#64748b">口令强度实时提示、失败不回显已填值</text>
  <text x="40" y="134" font-size="10" fill="#1e3a5f">/login 登录</text>
  <text x="40" y="152" font-size="9" fill="#64748b">错误只说「用户名或口令不对」</text>
  <text x="40" y="176" font-size="10" fill="#1e3a5f">/me 个人中心</text>
  <text x="40" y="194" font-size="9" fill="#64748b">改昵称、改口令、注销账号、会话列表</text>
  <text x="40" y="218" font-size="10" fill="#1e3a5f">/me/comments 我的评论</text>
  <text x="40" y="234" font-size="9" fill="#64748b">只列本人评论，可跳转到原文定位</text>

  <!-- token carrier -->
  <rect x="282" y="46" width="196" height="196" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">令牌载体</text>
  <text x="294" y="92" font-size="10" fill="#065f46" font-family="Menlo, monospace">Set-Cookie: access_token</text>
  <text x="294" y="110" font-size="9" fill="#64748b" font-family="Menlo, monospace">HttpOnly; Secure; SameSite=Lax; Path=/</text>
  <text x="294" y="134" font-size="10" fill="#065f46" font-family="Menlo, monospace">Set-Cookie: refresh_token</text>
  <text x="294" y="152" font-size="9" fill="#64748b" font-family="Menlo, monospace">HttpOnly; Path=/api/v1/auth/refresh</text>
  <text x="294" y="180" font-size="9.5" fill="#b91c1c">不用 localStorage：前台是 SSR，</text>
  <text x="294" y="196" font-size="9.5" fill="#b91c1c">服务端拿不到 localStorage，</text>
  <text x="294" y="212" font-size="9.5" fill="#b91c1c">首屏只能渲染成「未登录」。</text>
  <text x="294" y="232" font-size="9" fill="#64748b">HttpOnly 同时挡掉 XSS 读令牌</text>

  <!-- cache -->
  <rect x="494" y="46" width="160" height="196" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="574" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">缓存切分</text>
  <text x="506" y="92" font-size="9.5" fill="#991b1b">登录态页面：</text>
  <text x="506" y="110" font-size="9" fill="#b91c1c" font-family="Menlo, monospace">Cache-Control:</text>
  <text x="506" y="124" font-size="9" fill="#b91c1c" font-family="Menlo, monospace">  private, no-store</text>
  <text x="506" y="148" font-size="9.5" fill="#334155">公共页面：</text>
  <text x="506" y="166" font-size="9" fill="#475569" font-family="Menlo, monospace">  public, max-age=60</text>
  <text x="506" y="180" font-size="9" fill="#475569" font-family="Menlo, monospace">  stale-while-</text>
  <text x="506" y="194" font-size="9" fill="#475569" font-family="Menlo, monospace">  revalidate=300</text>
  <text x="506" y="216" font-size="9.5" fill="#b91c1c">两个身份进同一个</text>
  <text x="506" y="230" font-size="9.5" fill="#b91c1c">缓存键 = 串号事故</text>

  <!-- redirect whitelist -->
  <rect x="26" y="256" width="628" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="278" font-size="11" font-weight="700" fill="#334155">两条容易漏掉的前端判据</text>
  <text x="44" y="300" font-size="10.5" fill="#334155">① 回跳参数只接受站内相对路径：登录后跳回 /posts/xxx 靠 redirect 参数，但它必须过白名单。</text>
  <text x="44" y="318" font-size="10.5" fill="#64748b">   放行 //evil.com 或 https://evil.com 就是一个开放重定向，且利用了「用户信任本站」这一次点击。</text>
  <text x="44" y="340" font-size="10.5" fill="#334155">② 按钮显隐不是权限判据：前端藏掉「删除」只影响体验，服务端仍必须独立判归属。</text>
  <text x="44" y="358" font-size="10.5" fill="#64748b">   判据写法：把接口直接 curl 一遍（不带前端），越权仍必须 403 —— 这条就是验收页矩阵存在的理由。</text>
</svg>
