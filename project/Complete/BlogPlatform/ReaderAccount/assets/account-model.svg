<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">账号与归属：扩一列、加一表、收一处口径</text>

  <!-- users -->
  <rect x="26" y="48" width="240" height="204" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="146" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a5f">users（第 1 周已有的表，扩列）</text>
  <text x="40" y="90" font-size="9" fill="#475569" font-family="Menlo, monospace">id                BIGINT   PK</text>
  <text x="40" y="105" font-size="9" fill="#475569" font-family="Menlo, monospace">username          VARCHAR(32)  UK</text>
  <text x="40" y="120" font-size="9" fill="#1e40af" font-family="Menlo, monospace">email             VARCHAR(96)  UK · NULL</text>
  <text x="40" y="135" font-size="9" fill="#1e40af" font-family="Menlo, monospace">password_hash     VARCHAR(120)</text>
  <text x="40" y="150" font-size="9" fill="#475569" font-family="Menlo, monospace">nickname          VARCHAR(32)</text>
  <text x="40" y="165" font-size="9" fill="#475569" font-family="Menlo, monospace">role              READER / AUTHOR</text>
  <text x="40" y="180" font-size="9" fill="#1e40af" font-family="Menlo, monospace">admin_role        NULL / VIEWER / EDITOR /</text>
  <text x="40" y="195" font-size="9" fill="#1e40af" font-family="Menlo, monospace">status            PENDING / ACTIVE /</text>
  <text x="40" y="210" font-size="9" fill="#1e40af" font-family="Menlo, monospace">email_verified_at DATETIME  NULL</text>
  <text x="40" y="225" font-size="9" fill="#1e40af" font-family="Menlo, monospace">last_login_at     DATETIME  NULL</text>
  <text x="40" y="240" font-size="9" fill="#1e40af" font-family="Menlo, monospace">closed_at         DATETIME  NULL</text>

  <!-- user_tokens -->
  <rect x="286" y="48" width="196" height="204" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="384" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">user_tokens（本日新建）</text>
  <text x="298" y="90" font-size="9" fill="#475569" font-family="Menlo, monospace">id           BIGINT  PK</text>
  <text x="298" y="105" font-size="9" fill="#475569" font-family="Menlo, monospace">user_id      BIGINT</text>
  <text x="298" y="120" font-size="9" fill="#065f46" font-family="Menlo, monospace">family_id    CHAR(36)  登录族</text>
  <text x="298" y="135" font-size="9" fill="#065f46" font-family="Menlo, monospace">token_hash   CHAR(64)  只存哈希</text>
  <text x="298" y="150" font-size="9" fill="#475569" font-family="Menlo, monospace">issued_at    DATETIME</text>
  <text x="298" y="165" font-size="9" fill="#475569" font-family="Menlo, monospace">expires_at   DATETIME</text>
  <text x="298" y="180" font-size="9" fill="#475569" font-family="Menlo, monospace">revoked_at   DATETIME NULL</text>
  <text x="298" y="195" font-size="9" fill="#475569" font-family="Menlo, monospace">replaced_by  BIGINT   NULL</text>
  <text x="298" y="210" font-size="9" fill="#475569" font-family="Menlo, monospace">ua_hash      CHAR(16) 设备指纹</text>
  <text x="298" y="233" font-size="9" fill="#64748b">uk(family_id, issued_at)</text>
  <text x="298" y="246" font-size="9" fill="#64748b">KEY(user_id, expires_at)</text>

  <!-- ownership -->
  <rect x="498" y="48" width="156" height="204" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="576" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">归属引用</text>
  <text x="510" y="92" font-size="9" fill="#475569" font-family="Menlo, monospace">posts.author_id</text>
  <text x="510" y="112" font-size="9" fill="#475569" font-family="Menlo, monospace">comments.user_id</text>
  <text x="510" y="132" font-size="9" fill="#475569" font-family="Menlo, monospace">comments.</text>
  <text x="510" y="146" font-size="9" fill="#475569" font-family="Menlo, monospace">  reply_to_user_id</text>
  <text x="510" y="176" font-size="9.5" fill="#b91c1c">四处都是强引用，</text>
  <text x="510" y="192" font-size="9.5" fill="#b91c1c">所以 users 不能删行。</text>
  <text x="510" y="216" font-size="9.5" fill="#64748b">评论显示名走实时联表，</text>
  <text x="510" y="232" font-size="9.5" fill="#64748b">不做昵称快照。</text>

  <!-- decisions -->
  <rect x="26" y="272" width="628" height="108" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="294" font-size="11" font-weight="700" fill="#334155">三处口径收敛（都是第 99 天留下的悬空点）</text>
  <text x="44" y="316" font-size="10.5" fill="#334155">① password_hash 注释：原写「BCrypt 哈希」但实现是自描述 PBKDF2 串 —— 改为「自描述哈希串」</text>
  <text x="44" y="336" font-size="10.5" fill="#334155">② 角色两套枚举：业务身份收进 role，运维角色收进 admin_role —— 一列一件事</text>
  <text x="44" y="356" font-size="10.5" fill="#334155">③ 管理端账号来源：由配置文件改为 users 表，配置只保留引导用的首个 ADMIN</text>
</svg>
