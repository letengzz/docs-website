# 本地开发 profile：不连数据库，仓储走内存实现
# 启动：mvn -o -pl blog-application -am spring-boot:run -Dspring-boot.run.profiles=local
server:
  port: 8080

spring:
  flyway:
    # 本地不跑迁移（没有数据库可迁移）；迁移脚本的复制仍然发生在 process-resources 阶段，
    # 用来证明「脚本来源唯一、构建期进入 classpath」这条链路是通的
    enabled: false
    locations: classpath:db/migration/mysql

blog:
  repository: in-memory

logging:
  level:
    com.blog: DEBUG
