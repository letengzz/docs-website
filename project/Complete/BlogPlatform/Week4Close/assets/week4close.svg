<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <rect width="880" height="560" fill="#FFFFFF"/>
  <text x="440" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E293B">第 4 周收口：九项验收清单逐条实测回填</text>

  <rect x="40" y="90" width="800" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="70" y="115" font-size="15" font-weight="bold" fill="#1D4ED8">收口范围：只回填、不加判据</text>
  <text x="70" y="137" font-size="13" fill="#334155">九项全部来自已定稿页面（部署 1~3、监控 4~6、备份 7~8、复现 9），实测列纪律与回归报告一致</text>

  <rect x="40" y="180" width="250" height="120" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="165" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">第 1~3 项 · 一键部署</text>
  <text x="165" y="236" text-anchor="middle" font-size="13" fill="#334155">docker compose ps 全绿</text>
  <text x="165" y="258" text-anchor="middle" font-size="13" fill="#334155">SHOW TABLES = 8</text>
  <text x="165" y="280" text-anchor="middle" font-size="13" fill="#334155">三道冒烟门禁数字一致</text>

  <rect x="315" y="180" width="250" height="120" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
  <text x="440" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#A16207">第 4~6 项 · 监控接入</text>
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#334155">/actuator/prometheus 可拉</text>
  <text x="440" y="258" text-anchor="middle" font-size="13" fill="#334155">告警触达一次（未跑则标注）</text>
  <text x="440" y="280" text-anchor="middle" font-size="13" fill="#334155">traceId 三段日志同 ID</text>

  <rect x="590" y="180" width="250" height="120" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="715" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#BE185D">第 7~9 项 · 备份与复现</text>
  <text x="715" y="236" text-anchor="middle" font-size="13" fill="#334155">backups/ 有昨日 dump</text>
  <text x="715" y="258" text-anchor="middle" font-size="13" fill="#334155">R1~R6 恢复对账满足</text>
  <text x="715" y="280" text-anchor="middle" font-size="13" fill="#334155">新目录从零复现成功</text>

  <rect x="40" y="330" width="800" height="80" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="70" y="358" font-size="15" font-weight="bold" fill="#B91C1C">实测列纪律（红线）</text>
  <text x="70" y="382" font-size="13" fill="#334155">只填真跑出来的输出；本机无 docker 时标「⏳ 未跑 + 原因」，不许把期望值抄进实测列</text>
  <text x="70" y="402" font-size="13" fill="#334155">跑不了的项目保留判据与命令，等有环境时回填——欠账显式登记，不许悄悄销账</text>

  <rect x="40" y="440" width="800" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="70" y="468" font-size="15" font-weight="bold" fill="#334155">第 4 周里程碑对照（需求设计 → 核心编码 → 联调测试 → 部署验收）</text>
  <text x="70" y="492" font-size="13" fill="#334155">一键部署 ✅ / 监控接入 ✅ / 备份演练 ✅ / 第 4 周收口 ✅（本页）；压测仍顺延第 119 天，口径三处不变</text>
</svg>
