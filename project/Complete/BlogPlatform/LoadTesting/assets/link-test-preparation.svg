<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E293B">压测前置：五个变量不写死，结果就只是噪音</text>

  <rect x="40" y="76" width="820" height="64" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="70" y="102" font-size="15" font-weight="bold" fill="#1D4ED8">① 量什么</text>
  <text x="70" y="126" font-size="13" fill="#334155">主指标：QPS / P95-P99 / 错误率（5xx，4xx 不计）　诊断指标：缓存命中率 / 连接池 pending</text>

  <rect x="40" y="152" width="820" height="64" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="70" y="178" font-size="15" font-weight="bold" fill="#15803D">② 在什么环境量</text>
  <text x="70" y="202" font-size="13" fill="#334155">本项目 = 同机压测 → 结论只能作环比，不能当容量上界；压测进程 CPU &gt; 70% 即停止加并发</text>

  <rect x="40" y="228" width="820" height="64" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="70" y="254" font-size="15" font-weight="bold" fill="#334155">③ 用多少数据量</text>
  <text x="70" y="278" font-size="13" fill="#334155">posts ≥ 10000（热文 200）、comments ≥ 5000、users ≥ 200　空库压出来的数字没有意义</text>

  <rect x="40" y="304" width="820" height="86" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="70" y="330" font-size="15" font-weight="bold" fill="#B45309">④ 排除了哪些旁路变量（八项，全部"不报错但错"）</text>
  <text x="70" y="354" font-size="12.5" fill="#334155">SW 缓存 · 浏览器 HTTP 缓存 · 连接复用 · nginx 缓存 · JIT 未预热 · 连接池冷启动 · buffer pool 冷 · Redis 未预热</text>
  <text x="70" y="378" font-size="12.5" fill="#B91C1C">漏掉任何一项，你压的都不是服务端 —— SW 命中根本不回源</text>

  <rect x="40" y="402" width="820" height="80" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="70" y="428" font-size="15" font-weight="bold" fill="#BE185D">⑤ 从第几秒开始算数</text>
  <text x="70" y="452" font-size="13" fill="#334155">0s ── 预热 60s（全部丢弃）── 稳态采样 180s（进报告）── 收尾 30s（只记录）</text>
  <text x="70" y="472" font-size="12.5" fill="#64748B">判据不是比例而是曲线：预热段 P95 必须已进入平台期，否则延长预热</text>
</svg>
