<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E293B">压测验收：报告四要素 + 结果三态</text>

  <rect x="40" y="74" width="196" height="96" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="138" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">① 环境</text>
  <text x="138" y="126" text-anchor="middle" font-size="12.5" fill="#334155">机器规格 / 是否同机</text>
  <text x="138" y="146" text-anchor="middle" font-size="12.5" fill="#334155">容器限额 / 工具版本</text>

  <rect x="248" y="74" width="196" height="96" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="346" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803D">② 数据</text>
  <text x="346" y="126" text-anchor="middle" font-size="12.5" fill="#334155">文章 / 评论 / 账号量级</text>
  <text x="346" y="146" text-anchor="middle" font-size="12.5" fill="#334155">热点分布与正文长度</text>

  <rect x="456" y="74" width="196" height="96" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="554" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#B45309">③ 模型</text>
  <text x="554" y="126" text-anchor="middle" font-size="12.5" fill="#334155">开/闭模型 · 到达率</text>
  <text x="554" y="146" text-anchor="middle" font-size="12.5" fill="#334155">预热与采样窗口</text>

  <rect x="664" y="74" width="196" height="96" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="762" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#BE185D">④ 口径</text>
  <text x="762" y="126" text-anchor="middle" font-size="12.5" fill="#334155">主指标定义</text>
  <text x="762" y="146" text-anchor="middle" font-size="12.5" fill="#334155">4xx 是否计入</text>

  <text x="60" y="212" font-size="16" font-weight="bold" fill="#1E293B">L1~L14 验收断言（挑选关键项）</text>

  <rect x="40" y="228" width="820" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="62" y="254" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#15803D">L6 / L7</tspan>　目标档 P95 ≤ 基线 × 2、P99 ≤ 基线 × 4（稳态窗口内取数）</text>

  <rect x="40" y="274" width="820" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="62" y="300" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#15803D">L9</tspan>　dropped_iterations = 0（非 0 说明压测机成为瓶颈，不是系统的问题）</text>

  <rect x="40" y="320" width="820" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="62" y="346" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#B91C1C">L12</tspan>　根因有「结构性」判据：EXPLAIN 的 type 非 ALL、无 Using filesort</text>

  <rect x="40" y="366" width="820" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="62" y="392" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#334155">L13</tspan>　优化后功能未回归：mvn test + 十二道冒烟零失败</text>

  <rect x="40" y="414" width="266" height="66" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="173" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#15803D">✅ 通过</text>
  <text x="173" y="463" text-anchor="middle" font-size="12" fill="#475569">带实测数值与输出片段</text>

  <rect x="317" y="414" width="266" height="66" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="450" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#B91C1C">❌ 不通过</text>
  <text x="450" y="463" text-anchor="middle" font-size="12" fill="#475569">写明失败项、实测值与方向</text>

  <rect x="594" y="414" width="266" height="66" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="727" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#B45309">⏳ 阻塞</text>
  <text x="727" y="463" text-anchor="middle" font-size="12" fill="#475569">写明原因与解除条件，不抄期望值</text>
</svg>
