<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E293B">上线验收终版：五个编号族合并成一张终表</text>

  <rect x="40" y="66" width="820" height="46" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="62" y="94" font-size="13" fill="#334155"><tspan font-weight="bold" fill="#1D4ED8">终表不产生新编号</tspan>　只做「归类 + 定位 + 状态」，每条仍回溯到唯一出处。</text>

  <rect x="40" y="130" width="156" height="104" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="118" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1E293B">上线清单九项</text>
  <text x="118" y="180" text-anchor="middle" font-size="11.5" fill="#475569">第 114 天定稿</text>
  <text x="118" y="200" text-anchor="middle" font-size="11.5" fill="#475569">环境 / DDL / 冒烟</text>
  <text x="118" y="220" text-anchor="middle" font-size="11.5" fill="#475569">指标 / 告警 / 备份</text>

  <rect x="208" y="130" width="156" height="104" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.6"/>
  <text x="286" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803D">L1~L14</text>
  <text x="286" y="180" text-anchor="middle" font-size="11.5" fill="#475569">第 119 天</text>
  <text x="286" y="200" text-anchor="middle" font-size="11.5" fill="#475569">容量与瓶颈判据</text>
  <text x="286" y="220" text-anchor="middle" font-size="11.5" fill="#475569">含结构性判据 L12</text>

  <rect x="376" y="130" width="156" height="104" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.6"/>
  <text x="454" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0E7490">F1~F10</text>
  <text x="454" y="180" text-anchor="middle" font-size="11.5" fill="#475569">第 118 天</text>
  <text x="454" y="200" text-anchor="middle" font-size="11.5" fill="#475569">离线与 SEO 不互斥</text>
  <text x="454" y="220" text-anchor="middle" font-size="11.5" fill="#475569">浏览器侧实测</text>

  <rect x="544" y="130" width="156" height="104" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="622" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6D28D9">D1~D10</text>
  <text x="622" y="180" text-anchor="middle" font-size="11.5" fill="#475569">第 117 天</text>
  <text x="622" y="200" text-anchor="middle" font-size="11.5" fill="#475569">交付与交接断言</text>
  <text x="622" y="220" text-anchor="middle" font-size="11.5" fill="#475569">含配置对账 14 项</text>

  <rect x="712" y="130" width="148" height="104" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.6"/>
  <text x="786" y="156" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#BE185D">M1~M10</text>
  <text x="786" y="180" text-anchor="middle" font-size="11.5" fill="#475569">第 116 天</text>
  <text x="786" y="200" text-anchor="middle" font-size="11.5" fill="#475569">AI 预审与评估</text>
  <text x="786" y="220" text-anchor="middle" font-size="11.5" fill="#475569">含第 13 道门禁</text>

  <text x="60" y="274" font-size="16" font-weight="bold" fill="#1E293B">合并后按「验收对象」重排为四组（这才是给使用方看的形态）</text>

  <rect x="40" y="290" width="410" height="80" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="60" y="316" font-size="13.5" font-weight="bold" fill="#15803D">A. 系统可用</text>
  <text x="60" y="338" font-size="12" fill="#334155">五服务健康 · 迁移正确 · 十二道冒烟绿</text>
  <text x="60" y="358" font-size="12" fill="#334155">来源：九项 1~3 ｜ GL1 ｜ D6</text>

  <rect x="462" y="290" width="398" height="80" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="482" y="316" font-size="13.5" font-weight="bold" fill="#0E7490">B. 可观测</text>
  <text x="482" y="338" font-size="12" fill="#334155">指标可拉 · 告警触达 · traceId 三段闭环</text>
  <text x="482" y="358" font-size="12" fill="#334155">来源：九项 4~6 ｜ D7</text>

  <rect x="40" y="382" width="410" height="80" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="60" y="408" font-size="13.5" font-weight="bold" fill="#B45309">C. 抗压与可恢复</text>
  <text x="60" y="430" font-size="12" fill="#334155">L1~L13 容量结论 · R1~R6 恢复对账</text>
  <text x="60" y="450" font-size="12" fill="#334155">来源：九项 7~8 ｜ L 系列 ｜ Rb 演练</text>

  <rect x="462" y="382" width="398" height="80" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="482" y="408" font-size="13.5" font-weight="bold" fill="#6D28D9">D. 可交接与可复现</text>
  <text x="482" y="430" font-size="12" fill="#334155">交付物 11 项齐 · 从零复现成功 · 17 项巡检 E=0</text>
  <text x="482" y="450" font-size="12" fill="#334155">来源：九项 9 ｜ D1~D10 ｜ F 系列</text>
</svg>
