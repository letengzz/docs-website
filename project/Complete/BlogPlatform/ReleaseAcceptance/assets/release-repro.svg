<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E293B">文档沉淀与从零复现：八段最短路径</text>

  <rect x="40" y="68" width="820" height="44" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="62" y="95" font-size="12.5" fill="#334155">复现对象是<tspan font-weight="bold" fill="#1D4ED8">读者自己搭的工程</tspan>，不是本仓的某个目录 —— 本仓只有文档。</text>

  <rect x="40" y="128" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="138" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">① 读需求与架构</text>
  <text x="138" y="174" text-anchor="middle" font-size="11.5" fill="#475569">Requirements</text>
  <text x="138" y="190" text-anchor="middle" font-size="11.5" fill="#475569">Architecture</text>

  <rect x="248" y="128" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="346" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">② 建库与契约</text>
  <text x="346" y="174" text-anchor="middle" font-size="11.5" fill="#475569">DatabaseDesign</text>
  <text x="346" y="190" text-anchor="middle" font-size="11.5" fill="#475569">Contract</text>

  <rect x="456" y="128" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="554" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">③ 起骨架</text>
  <text x="554" y="174" text-anchor="middle" font-size="11.5" fill="#475569">Skeleton</text>
  <text x="554" y="190" text-anchor="middle" font-size="11.5" fill="#475569">两条运行路径</text>

  <rect x="664" y="128" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="762" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">④ 写业务链路</text>
  <text x="762" y="174" text-anchor="middle" font-size="11.5" fill="#475569">WritePath → Search</text>
  <text x="762" y="190" text-anchor="middle" font-size="11.5" fill="#475569">FrontendSSR</text>

  <rect x="40" y="216" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="138" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">⑤ 上账号与评论</text>
  <text x="138" y="262" text-anchor="middle" font-size="11.5" fill="#475569">ReaderAccount</text>
  <text x="138" y="278" text-anchor="middle" font-size="11.5" fill="#475569">Comments</text>

  <rect x="248" y="216" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="346" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">⑥ 容器化部署</text>
  <text x="346" y="262" text-anchor="middle" font-size="11.5" fill="#475569">Deployment</text>
  <text x="346" y="278" text-anchor="middle" font-size="11.5" fill="#475569">Monitoring</text>

  <rect x="456" y="216" width="196" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
  <text x="554" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">⑦ 跑门禁</text>
  <text x="554" y="262" text-anchor="middle" font-size="11.5" fill="#475569">十二道冒烟</text>
  <text x="554" y="278" text-anchor="middle" font-size="11.5" fill="#475569">mvn test</text>

  <rect x="664" y="216" width="196" height="72" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="762" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803D">⑧ 发布与验收</text>
  <text x="762" y="262" text-anchor="middle" font-size="11.5" fill="#475569">本章 ①~⑥</text>
  <text x="762" y="278" text-anchor="middle" font-size="11.5" fill="#475569">验收终表</text>

  <text x="60" y="330" font-size="16" font-weight="bold" fill="#1E293B">文档本身的验收：17 项巡检就是文档门禁</text>

  <rect x="40" y="346" width="820" height="42" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="62" y="372" font-size="12.5" fill="#334155"><tspan font-weight="bold" fill="#0E7490">结构类</tspan>　headingcheck · containercheck · fencecheck · codelangcheck · tablecheck · frontmattercheck</text>

  <rect x="40" y="394" width="820" height="42" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="62" y="420" font-size="12.5" fill="#334155"><tspan font-weight="bold" fill="#0E7490">引用类</tspan>　linkcheck · barelinkcheck · anchorcheck · imagecheck · altcheck · inlinecheck</text>

  <rect x="40" y="442" width="820" height="42" rx="8" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="62" y="468" font-size="12.5" fill="#334155"><tspan font-weight="bold" fill="#0E7490">治理类</tspan>　sidebarcheck · indexlinkcheck · depthcheck · dupcheck · logocheck · casecheck</text>

  <rect x="40" y="492" width="820" height="22" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="62" y="508" font-size="12" fill="#475569">全部 E=0 才算「文档可交付」—— 构建绿只证明语法没错，不证明文档能用。</text>
</svg>
