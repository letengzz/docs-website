<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <rect width="900" height="540" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E293B">欠账合并兑现：五批 ⏳ 汇成一条执行序列</text>

  <rect x="40" y="66" width="820" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="62" y="88" font-size="12.5" fill="#334155">第 115 / 116 / 117 / 118 / 119 天各自登记了一批 ⏳，但共享同一个前置条件。</text>
  <text x="62" y="107" font-size="12.5" fill="#475569">分五次开环境 = 五次返工；合并成一次 = 一条序列跑完。</text>

  <rect x="40" y="130" width="380" height="34" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="58" y="152" font-size="12" fill="#334155"><tspan font-weight="bold">第 115 天</tspan>　上线验收清单九项实测</text>

  <rect x="40" y="172" width="380" height="34" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="58" y="194" font-size="12" fill="#334155"><tspan font-weight="bold">第 116 天</tspan>　M10：第 13 道 AI 评估门禁接入</text>

  <rect x="40" y="214" width="380" height="34" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="58" y="236" font-size="12" fill="#334155"><tspan font-weight="bold">第 117 天</tspan>　D3 / D4 / D6 / D7 交接断言</text>

  <rect x="40" y="256" width="380" height="34" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="58" y="278" font-size="12" fill="#334155"><tspan font-weight="bold">第 118 天</tspan>　F2 / F3 / F8 / F9 浏览器侧</text>

  <rect x="40" y="298" width="380" height="34" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="58" y="320" font-size="12" fill="#334155"><tspan font-weight="bold">第 119 天</tspan>　L1~L13 压测实测回填</text>

  <path d="M 428 150 L 452 150 L 452 300 L 476 300" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M 428 189 L 452 189 L 452 300 L 476 300" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M 428 231 L 452 231 L 452 300 L 476 300" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M 428 273 L 452 273 L 452 300 L 476 300" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M 428 315 L 452 315 L 476 315" fill="none" stroke="#94A3B8" stroke-width="2"/>

  <rect x="480" y="246" width="380" height="120" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="670" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">一台有 Docker 的机器</text>
  <text x="670" y="298" text-anchor="middle" font-size="12" fill="#334155">compose up → 迁移 → 五服务健康</text>
  <text x="670" y="320" text-anchor="middle" font-size="12" fill="#334155">十二道冒烟 + 第 13 道评估 + k6 smoke</text>
  <text x="670" y="342" text-anchor="middle" font-size="12" fill="#334155">浏览器侧 F 系列 + 面板核对</text>

  <text x="60" y="410" font-size="16" font-weight="bold" fill="#1E293B">执行序列的固定顺序（顺序错了会互相干扰）</text>

  <rect x="40" y="426" width="820" height="38" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.4"/>
  <text x="62" y="451" font-size="12.5" fill="#334155"><tspan font-weight="bold" fill="#15803D">S1 骨架</tspan>　compose up -d → compose ps 全绿 → SHOW TABLES = 8 → ngram 两参数核对</text>

  <rect x="40" y="470" width="820" height="38" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.4"/>
  <text x="62" y="495" font-size="12.5" fill="#334155"><tspan font-weight="bold" fill="#15803D">S2 功能</tspan>　十二道冒烟 + 判据唯一性核查 → 全绿后才有资格谈性能与验收</text>

  <rect x="40" y="514" width="820" height="22" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="62" y="530" font-size="12" fill="#475569">S3 观测 → S4 AI 评估 → S5 浏览器侧 → S6 压测 → S7 备份恢复 → S8 从零复现（详见正文）</text>
</svg>
