<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="430" fill="#f8fafc"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">核心业务流：发文 → 发布 → 被搜到 → 被评论 → 作者可见反馈</text>

  <!-- stage 1 -->
  <rect x="20" y="52" width="120" height="96" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a5f">① 发文</text>
  <text x="32" y="92" font-size="9" fill="#475569">作者登录后台</text>
  <text x="32" y="108" font-size="9" fill="#475569">POST /admin/posts</text>
  <text x="32" y="124" font-size="9" fill="#475569">状态：DRAFT</text>
  <text x="32" y="140" font-size="9" fill="#475569">门禁：admin_smoke</text>

  <!-- stage 2 -->
  <rect x="160" y="52" width="140" height="96" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="230" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">② 发布（同事务）</text>
  <text x="172" y="92" font-size="9" fill="#475569">写时渲染 content_html</text>
  <text x="172" y="108" font-size="9" fill="#475569">search_text 纯文本</text>
  <text x="172" y="124" font-size="9" fill="#475569">published_at 刷新</text>
  <text x="172" y="140" font-size="9" fill="#7c3aed">提交后：失效缓存</text>

  <!-- stage 3 -->
  <rect x="320" y="52" width="120" height="96" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">③ 被搜到</text>
  <text x="332" y="92" font-size="9" fill="#475569">ngram 布尔模式</text>
  <text x="332" y="108" font-size="9" fill="#475569">WHERE status 过滤</text>
  <text x="332" y="124" font-size="9" fill="#475569">门禁：search_smoke</text>
  <text x="332" y="140" font-size="9" fill="#475569">EXPLAIN 走索引</text>

  <!-- stage 4 -->
  <rect x="460" y="52" width="100" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">④ 被评论</text>
  <text x="470" y="92" font-size="9" fill="#475569">PUBLISHED 才可评</text>
  <text x="470" y="108" font-size="9" fill="#475569">楼层写时分配</text>
  <text x="470" y="124" font-size="9" fill="#475569">门禁：comment_smoke</text>

  <!-- stage 5 -->
  <rect x="580" y="52" width="80" height="96" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">⑤ 反馈</text>
  <text x="588" y="92" font-size="9" fill="#475569">后台列表</text>
  <text x="588" y="108" font-size="9" fill="#475569">me/comments</text>
  <text x="588" y="124" font-size="9" fill="#475569">占位保留口径</text>

  <!-- arrows -->
  <line x1="140" y1="100" x2="158" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="300" y1="100" x2="318" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="440" y1="100" x2="458" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="560" y1="100" x2="578" y2="100" stroke="#334155" stroke-width="1.5"/>
  <path d="M 620 150 C 620 200, 80 200, 80 150" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="350" y="196" text-anchor="middle" font-size="9.5" fill="#b91c1c">反馈回路：作者在后台与「我的评论」看到链路另一端发生的事</text>

  <!-- identity band -->
  <rect x="20" y="216" width="640" height="52" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="36" y="238" font-size="11" font-weight="700" fill="#1e40af">身份主语贯穿整条链（第 109 天之后链路才真正闭环）</text>
  <text x="36" y="256" font-size="9.5" fill="#1e40af">①② 管理端令牌（aud=admin）　③ 游客即可搜　④ 读者令牌（aud=reader，PENDING 不可评）　⑤ 读侧是过滤不是权限</text>

  <!-- cross-cutting -->
  <rect x="20" y="284" width="640" height="126" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="306" font-size="11" font-weight="700" fill="#334155">三个横切面：任何一章只看到局部，本章负责把它们串起来</text>
  <text x="36" y="328" font-size="10" fill="#334155">· 状态机：DRAFT / PUBLISHED / OFFLINE / DELETED 是链路上所有「能不能」的唯一事实来源（StateMachine 页）</text>
  <text x="36" y="348" font-size="10" fill="#334155">· 可见性：读者端只认 PUBLISHED，404 逐字节一致；缓存提交后失效 + TTL 兜底（Visibility 章）</text>
  <text x="36" y="368" font-size="10" fill="#334155">· 契约：五条链路 23 条路径是模块间对话的唯一词汇表，字段漂移由门禁抓（Integration 页）</text>
  <text x="36" y="396" font-size="9.5" fill="#64748b">本图是章节地图：每一格的门禁与判据在各既有章节，端到端走查与一条龙回归见 EndToEnd / Regression 页</text>
</svg>
