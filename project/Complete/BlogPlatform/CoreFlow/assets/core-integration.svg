<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0b162a">接口联调：每个箭头都是一个「响应字段喂下游请求」的依赖</text>

  <!-- producer: admin write -->
  <rect x="22" y="48" width="170" height="110" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="107" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a5f">管理端写接口</text>
  <text x="34" y="88" font-size="9" fill="#475569" font-family="Menlo, monospace">POST /admin/posts</text>
  <text x="34" y="104" font-size="9" fill="#475569" font-family="Menlo, monospace">→ PostAdminView</text>
  <text x="34" y="124" font-size="9" fill="#1e40af" font-family="Menlo, monospace">id, slug, status</text>
  <text x="34" y="144" font-size="8.5" fill="#64748b">产出方负责字段语义稳定</text>

  <!-- consumer: reader frontend -->
  <rect x="250" y="40" width="180" height="58" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="340" y="60" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">前台详情页 URL</text>
  <text x="262" y="78" font-size="9" fill="#047857" font-family="Menlo, monospace">/posts/{slug}（只认 slug）</text>
  <line x1="192" y1="69" x2="248" y2="69" stroke="#334155" stroke-width="1.3"/>
  <text x="220" y="62" text-anchor="middle" font-size="8.5" fill="#475569">slug</text>

  <!-- consumer: contentHtml -->
  <rect x="250" y="106" width="180" height="58" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="340" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">前台正文渲染</text>
  <text x="262" y="144" font-size="9" fill="#047857" font-family="Menlo, monospace">contentHtml（v-html 信任边界）</text>
  <line x1="192" y1="130" x2="248" y2="130" stroke="#334155" stroke-width="1.3"/>
  <text x="220" y="123" text-anchor="middle" font-size="8.5" fill="#475569">contentHtml</text>

  <!-- search chain -->
  <rect x="250" y="172" width="180" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">搜索页</text>
  <text x="262" y="210" font-size="9" fill="#b45309" font-family="Menlo, monospace">q 净化 / 400 → 友好提示（Q4）</text>
  <line x1="340" y1="164" x2="340" y2="170" stroke="#334155" stroke-width="1.3"/>
  <text x="452" y="196" font-size="8.5" fill="#64748b">命中项跳详情页</text>
  <line x1="430" y1="201" x2="452" y2="201" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- comments chain -->
  <rect x="460" y="40" width="196" height="124" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="558" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">评论与身份</text>
  <text x="472" y="80" font-size="9" fill="#475569" font-family="Menlo, monospace">POST comments（Cookie access）</text>
  <text x="472" y="96" font-size="9" fill="#475569" font-family="Menlo, monospace">GET me/comments → 跳回原文</text>
  <text x="472" y="116" font-size="9" fill="#b91c1c" font-family="Menlo, monospace">authorName 实时联表</text>
  <text x="472" y="132" font-size="9" fill="#b91c1c" font-family="Menlo, monospace">（不做昵称快照，第 109 天）</text>
  <text x="472" y="152" font-size="8.5" fill="#64748b">aud=reader：打 admin 路径一律 401</text>

  <!-- drift guards -->
  <rect x="460" y="172" width="196" height="58" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="558" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">漂移由谁抓</text>
  <text x="472" y="210" font-size="9" fill="#5b21b6" font-family="Menlo, monospace">contract_check（结构）</text>
  <text x="472" y="224" font-size="9" fill="#5b21b6" font-family="Menlo, monospace">smoke 字段断言（行为）</text>

  <!-- bottom: three drift classes -->
  <rect x="22" y="248" width="634" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="270" font-size="11" font-weight="700" fill="#334155">联调要抓的是三类漂移——每一类都有归属的门禁，不靠肉眼</text>
  <text x="40" y="292" font-size="10" fill="#334155">① 结构漂移：字段改名 / 删除。契约门禁拦（$ref 可解析 + 每操作有响应结构），改契约必须先过 contract_check</text>
  <text x="40" y="314" font-size="10" fill="#334155">② 语义漂移：字段还在但口径变了（如列表 total 先查后滤、countPublishedByCategory 不认 OFFLINE）。smoke 字段断言拦</text>
  <text x="40" y="336" font-size="10" fill="#334155">③ 时序漂移：单模块都对、先后错了（缓存回填窗口、渲染与 search_text 不同事务）。跨进程断言留在 smoke 层</text>
  <text x="40" y="364" font-size="9" fill="#64748b">判据唯一性由 assertion_audit 兜底：同一断言前缀（A/B/T/S/Q/C/R/CF）全库只允许出现一次</text>
</svg>
