<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', sans-serif">
  <rect width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0b162a">两级楼层模型 + 写入三约束</text>

  <!-- floor model -->
  <rect x="30" y="50" width="360" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="210" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">物理两级，展示永远两层</text>

  <!-- floor 1 root -->
  <rect x="50" y="88" width="320" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="64" y="105" font-size="11.5" font-weight="700" fill="#1e3a5f">#1 楼层根（张三）</text>
  <text x="64" y="121" font-size="9.5" fill="#475569" font-family="Menlo, monospace">parent_id=NULL · root_id=id · floor=1</text>
  <!-- floor 1 replies -->
  <rect x="80" y="138" width="290" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="94" y="153" font-size="10.5" fill="#334155">└ 回复 @张三（李四）</text>
  <text x="94" y="166" font-size="9" fill="#64748b" font-family="Menlo, monospace">parent=根 · root=根 · floor=NULL</text>
  <rect x="80" y="178" width="290" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="94" y="193" font-size="10.5" fill="#334155">└ 回复 @李四（王五）← 物理上还是第 2 层</text>
  <text x="94" y="206" font-size="9" fill="#64748b" font-family="Menlo, monospace">parent=李四的回复 · root=根 · floor=NULL</text>

  <!-- floor 2 root -->
  <rect x="50" y="224" width="320" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="64" y="241" font-size="11.5" font-weight="700" fill="#1e3a5f">#2 楼层根（赵六）</text>
  <text x="64" y="257" font-size="9.5" fill="#475569" font-family="Menlo, monospace">parent_id=NULL · root_id=id · floor=2</text>

  <!-- deleted floor -->
  <rect x="50" y="276" width="320" height="42" rx="8" fill="#fef2f2" stroke="#f87171" stroke-dasharray="5 3"/>
  <text x="64" y="293" font-size="11.5" font-weight="600" fill="#991b1b">#3 已删除（楼层号不回收）</text>
  <text x="64" y="309" font-size="9.5" fill="#b91c1c" font-family="Menlo, monospace">deleted_at≠NULL · floor=3 永久占位 · 不可再被回复</text>

  <text x="210" y="348" text-anchor="middle" font-size="10" fill="#64748b">取整层：WHERE post_id=? AND root_id=?（一条索引走完，根也包含）</text>
  <text x="210" y="366" text-anchor="middle" font-size="10" fill="#b91c1c">root_id IS NULL = 脏数据信号，不是合法状态</text>

  <!-- three constraints -->
  <text x="565" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">写入三约束（按序判定）</text>
  <g>
    <rect x="420" y="88" width="230" height="70" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="535" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">① 只能评论 PUBLISHED</text>
    <text x="535" y="130" text-anchor="middle" font-size="9.5" fill="#64748b">DRAFT/OFFLINE/DELETED/不存在</text>
    <text x="535" y="146" text-anchor="middle" font-size="9.5" fill="#b91c1c">→ 404（四来源逐字节一致）</text>
  </g>
  <g>
    <rect x="420" y="172" width="230" height="70" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="535" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">② 父评论同文章</text>
    <text x="535" y="214" text-anchor="middle" font-size="9.5" fill="#64748b">parent.post_id == 本文章 post_id</text>
    <text x="535" y="230" text-anchor="middle" font-size="9.5" fill="#b91c1c">→ 409 STATE_CONFLICT(2003)</text>
  </g>
  <g>
    <rect x="420" y="256" width="230" height="70" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="535" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">③ 已删评论不可回复</text>
    <text x="535" y="298" text-anchor="middle" font-size="9.5" fill="#64748b">parent.deleted_at IS NULL</text>
    <text x="535" y="314" text-anchor="middle" font-size="9.5" fill="#b91c1c">→ 404（与不存在不可区分）</text>
  </g>
  <text x="535" y="356" text-anchor="middle" font-size="10" fill="#64748b">楼层号：写时分配 + 唯一索引</text>
  <text x="535" y="372" text-anchor="middle" font-size="10" fill="#64748b">uk_comments_post_floor，冲突重试一次</text>
</svg>
