<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="在线协作任务看板：五个聚合与 controller 到 service 到 repository 三段式调用链，事务边界只落在 service 层，底部列出幂等键、乐观锁与游标分页三条写路径口径">
  <title>在线协作任务看板 · 五个聚合与三段式调用链上的事务边界</title>
  <defs>
    <marker id="tdc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">在线协作任务看板 · 五个聚合与三段式调用链上的事务边界</text>
  <text x="30" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">14 张表按「谁写入」切给五个聚合；事务只开在 service 的公开方法上，控制器与仓库都不开。</text>

  <text x="30" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">五个聚合（每张表只有一个写入方）</text>

  <rect x="30" y="108" width="160" height="76" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="42" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">workspace</text>
  <text x="42" y="150" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">workspaces / invitations</text>
  <text x="42" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不做：判「谁能看哪张卡」</text>

  <rect x="200" y="108" width="160" height="76" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="212" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">membership</text>
  <text x="212" y="150" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">memberships</text>
  <text x="212" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不做：缓存角色、进令牌</text>

  <rect x="370" y="108" width="160" height="76" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="382" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">board</text>
  <text x="382" y="150" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">boards / board_events</text>
  <text x="382" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不做：卡片内容；只此一处发 seq</text>

  <rect x="540" y="108" width="160" height="76" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="552" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">list</text>
  <text x="552" y="150" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">board_lists</text>
  <text x="552" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不做：维护卡片计数</text>

  <rect x="710" y="108" width="160" height="76" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="722" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">card</text>
  <text x="722" y="150" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">cards</text>
  <text x="722" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不做：判权限、发通知、写审计</text>

  <text x="30" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">三段式：事务边界只落在 service，方法必须是公开且由外部调用</text>

  <rect x="30" y="222" width="230" height="78" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">controller</text>
  <text x="44" y="268" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">解析请求 / 校验格式 / 异常映射成状态码</text>
  <text x="44" y="288" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c">不开事务：边界会随接口漂移</text>

  <line x1="262" y1="261" x2="333" y2="261" stroke="#334155" stroke-width="1.6" marker-end="url(#tdc-ar)"/>

  <rect x="335" y="222" width="230" height="78" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="349" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3730a3">service</text>
  <text x="349" y="268" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#334155">@Transactional</text>
  <text x="349" y="288" font-family="system-ui, sans-serif" font-size="9.5" fill="#3730a3">编排多张表：一起提交或一起回滚</text>

  <line x1="567" y1="261" x2="638" y2="261" stroke="#334155" stroke-width="1.6" marker-end="url(#tdc-ar)"/>

  <rect x="640" y="222" width="230" height="78" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="654" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">repository</text>
  <text x="654" y="268" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">执行 SQL / 映射领域对象</text>
  <text x="654" y="288" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c">不开事务：否则「动了但没记」</text>

  <text x="30" y="330" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">写路径的三条口径</text>

  <rect x="30" y="342" width="230" height="76" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="364" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">幂等键</text>
  <text x="44" y="384" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">Idempotency-Key</text>
  <text x="44" y="402" font-family="system-ui, sans-serif" font-size="9" fill="#334155">先占位、后写结果；唯一索引串行化</text>

  <rect x="335" y="342" width="230" height="76" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="349" y="364" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">乐观锁</text>
  <text x="349" y="384" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">WHERE ... AND version = ?</text>
  <text x="349" y="402" font-family="system-ui, sans-serif" font-size="9" fill="#334155">0 行先二次判定 → 404 或 409 + 最新现状</text>

  <rect x="640" y="342" width="230" height="76" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="654" y="364" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">游标分页</text>
  <text x="654" y="384" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">(created_at, id)</text>
  <text x="654" y="402" font-family="system-ui, sans-serif" font-size="9" fill="#334155">行值比较 + LIMIT +1；不用 offset</text>

  <rect x="30" y="432" width="840" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="44" y="454" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">两条贯穿全表的纪律</text>
  <text x="44" y="474" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">一、跨工作区一律 404 而不是 403（不暴露资源存在性）；409 必须带最新 version 与 position，只回「冲突了」视为不合格。</text>
  <text x="44" y="492" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">二、受影响行数为 0 时要先在同一事务里再读一次：读到 → 409（落后两个版本），读不到 → 404（不可见 / 已删）——不能一律当 409。</text>
</svg>
