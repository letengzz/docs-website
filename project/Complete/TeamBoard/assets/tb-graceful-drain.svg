<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="替换时间线：摘流、SIGTERM、在途排空与关闭顺序">
  <defs>
    <marker id="drn-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">替换的 30 秒：六件事，两个必须错开的时刻</text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 时间轴 -->
    <line x1="60" y1="96" x2="900" y2="96" stroke="#cbd5e1" stroke-width="2"/>
    <text x="60" y="80" font-size="11" fill="#64748b">T+0</text>
    <text x="330" y="80" font-size="11" fill="#64748b">T+6s</text>
    <text x="560" y="80" font-size="11" fill="#64748b">T+26s</text>
    <text x="852" y="80" font-size="11" fill="#64748b">T+30s</text>

    <!-- 摘流 -->
    <rect x="60" y="112" width="240" height="80" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="78" y="136" font-size="12" font-weight="600" fill="#1e3a8a">① 摘流（not-ready）</text>
    <text x="78" y="156" font-size="11" fill="#334155">/readyz 返回 503</text>
    <text x="78" y="174" font-size="11" fill="#334155">等网关刷新 upstream：5 s</text>

    <!-- SIGTERM -->
    <rect x="330" y="112" width="230" height="80" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="348" y="136" font-size="12" font-weight="600" fill="#92400e">② SIGTERM（T+6s）</text>
    <text x="348" y="156" font-size="11" fill="#78350f">preStop 停顿 6 s &gt; 刷新周期</text>
    <text x="348" y="174" font-size="11" fill="#78350f">顺序反了 = 必丢一批请求</text>

    <!-- drain -->
    <rect x="590" y="112" width="310" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="608" y="136" font-size="12" font-weight="600" fill="#166534">③ 在途排空（≤ 20 s）</text>
    <text x="608" y="156" font-size="11" fill="#14532d">拒新 · 等在途 · 长连接 4409</text>
    <text x="608" y="174" font-size="11" fill="#14532d">然后关池、刷日志、exit 0</text>

    <line x1="300" y1="152" x2="326" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#drn-arrow)"/>
    <line x1="560" y1="152" x2="586" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#drn-arrow)"/>

    <!-- 实测 -->
    <rect x="60" y="218" width="400" height="120" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="78" y="242" font-size="12" font-weight="600" fill="#991b1b">abrupt：SIGTERM 直接 exit(0)</text>
    <text x="78" y="264" font-size="11" fill="#7f1d1d">200 个并发 /slow（每个 400 ms）</text>
    <text x="78" y="282" font-size="11" fill="#7f1d1d">结果 ok=0 / fail=200</text>
    <text x="78" y="300" font-size="11" fill="#7f1d1d">错误全部是 ECONNRESET，耗时 170 ms</text>
    <text x="78" y="322" font-size="11" fill="#b91c1c">在途全丢不是概率事件，是确定事件</text>

    <rect x="490" y="218" width="410" height="120" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="508" y="242" font-size="12" font-weight="600" fill="#166534">graceful：close 后等在途写完</text>
    <text x="508" y="264" font-size="11" fill="#14532d">同一份 200 并发压测</text>
    <text x="508" y="282" font-size="11" fill="#14532d">结果 ok=200 / fail=0，耗时 472 ms</text>
    <text x="508" y="300" font-size="11" fill="#14532d">472 ms ≈ 400 ms 处理器 + 72 ms 排空</text>
    <text x="508" y="322" font-size="11" fill="#166534">drain 的代价是把已进来的活干完，不是额外等待</text>

    <!-- 关闭顺序 -->
    <rect x="60" y="356" width="840" height="64" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="78" y="380" font-size="12" font-weight="600" fill="#0f172a">关闭顺序（不能换）：摘流 → 拒新连接 → 等在途 → 长连接 4409 + Retry-After → 关池 / 刷日志 / exit 0</text>
    <text x="78" y="402" font-size="11" fill="#334155">不等式：preStop(6s) + drain(20s) &lt; stop_grace_period(30s)；超出部分会被 SIGKILL，客户端连 5xx 都拿不到</text>
  </g>
</svg>
