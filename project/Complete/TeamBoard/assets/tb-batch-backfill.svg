<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #6b7a90; stroke-width: 1.2; }
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.4; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.4; }
    .c { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.4; }
    .r { fill: #fdeeee; stroke: #c95555; stroke-width: 1.4; }
    text { fill: #222; font-size: 11px; text-anchor: middle; }
    .t { font-size: 15px; font-weight: bold; }
    .h { font-size: 12px; font-weight: bold; }
    .s { font-size: 10px; fill: #555; }
    .m { font-size: 10px; fill: #2b4c8c; font-family: Menlo, monospace; }
    .arrow { stroke: #8a94a6; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>
  <text class="t" x="440" y="24">分批回填的三个性质：可中断、可续跑、可观测</text>

  <text class="h" x="20" y="52">① 可中断：一次只提交一批</text>
  <rect class="a" x="20" y="62" width="120" height="44" rx="6"/>
  <text class="s" x="80" y="82">batch 1</text>
  <text class="m" x="80" y="98">5,000 行 / 264 ms</text>
  <rect class="a" x="150" y="62" width="120" height="44" rx="6"/>
  <text class="s" x="210" y="82">batch 2</text>
  <text class="m" x="210" y="98">5,000 行 / 265 ms</text>
  <rect class="a" x="280" y="62" width="120" height="44" rx="6"/>
  <text class="s" x="340" y="82">batch 3</text>
  <text class="m" x="340" y="98">5,000 行 / 259 ms</text>
  <rect class="r" x="410" y="62" width="120" height="44" rx="6"/>
  <text class="s" x="470" y="82">batch 4（被杀）</text>
  <text class="m" x="470" y="98">回滚，游标不动</text>
  <rect class="a" x="540" y="62" width="120" height="44" rx="6"/>
  <text class="s" x="600" y="82">batch 4（重跑）</text>
  <text class="m" x="600" y="98">续跑，不重复</text>
  <rect class="b" x="670" y="62" width="190" height="44" rx="6"/>
  <text class="s" x="765" y="82">关键：批次与游标同一语句</text>
  <text class="s" x="765" y="98">否则「写了没记」或「记了没写」</text>
  <path class="arrow" d="M140 84 L146 84"/>
  <path class="arrow" d="M270 84 L276 84"/>
  <path class="arrow" d="M400 84 L406 84"/>
  <path class="arrow" d="M530 84 L536 84"/>

  <text class="h" x="20" y="140">② 可续跑：游标必须只会前进</text>
  <rect class="box" x="20" y="150" width="260" height="66" rx="6"/>
  <text class="s" x="150" y="170">bf_progress(job, last_id, done)</text>
  <text class="m" x="150" y="188">last_id = 2015000</text>
  <text class="s" x="150" y="206">断点：下一批从 id &gt; 2015000 开始</text>

  <rect class="c" x="300" y="150" width="260" height="66" rx="6"/>
  <text class="s" x="430" y="170">陷阱：空批次返回 max(id)=NULL</text>
  <text class="m" x="430" y="188">coalesce(max(id),0) → 0</text>
  <text class="s" x="430" y="206">游标被写回 0，进度归零</text>

  <rect class="b" x="580" y="150" width="280" height="66" rx="6"/>
  <text class="s" x="720" y="170">正解：greatest(last_id, hi)</text>
  <text class="m" x="720" y="188">last_id = greatest(2015000, 0)</text>
  <text class="s" x="720" y="206">游标单调不减，重跑幂等（0 行）</text>

  <text class="h" x="20" y="248">③ 可观测：数据库不给你进度，只能自己记</text>
  <rect class="r" x="20" y="258" width="270" height="66" rx="6"/>
  <text class="s" x="155" y="278">PG 18.6 实测：没有</text>
  <text class="m" x="155" y="296">pg_stat_progress_update</text>
  <text class="s" x="155" y="314">ERROR: relation does not exist</text>

  <rect class="box" x="310" y="258" width="260" height="66" rx="6"/>
  <text class="s" x="440" y="278">三个派生指标</text>
  <text class="s" x="440" y="296">进度 = done / total_rows</text>
  <text class="s" x="440" y="312">速率 = Δdone / Δt　滞后 = cursor − done</text>

  <rect class="b" x="590" y="258" width="270" height="66" rx="6"/>
  <text class="s" x="725" y="278">估算剩余时间</text>
  <text class="m" x="725" y="296">(total − done) / 速率</text>
  <text class="s" x="725" y="312">速率用最近 5 批的移动平均，不用全程均值</text>

  <rect class="box" x="20" y="342" width="840" height="60" rx="6"/>
  <text class="s" x="440" y="364">最贵的一条读数：杀掉客户端不等于停止语句 —— 实测杀 psql 后 pg_stat_activity 里仍是 active，语句继续写。</text>
  <text class="s" x="440" y="384">必须 pg_cancel_backend(pid)，或给每批设 statement_timeout。否则「已经中断」只是你的假设。</text>
</svg>
