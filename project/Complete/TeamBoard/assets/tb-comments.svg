<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="在线协作任务看板：评论到同事务写 outbox 再到投递器与消费侧幂等折叠的四段链路、outbox 状态机四条边，以及两层去重键与三条对账 SQL">
  <title>在线协作任务看板 · 评论到通知：同事务写 outbox、状态机与折叠</title>
  <defs>
    <marker id="tnt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">在线协作任务看板 · 评论与通知：outbox 的落地</text>
  <text x="30" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">通知与业务改动同生共死：同一事务写 outbox，异步投递（至少一次），消费侧按去重键幂等，再折叠成一条。</text>

  <text x="30" y="92" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">一、四段链路（一条评论走完这四步）</text>

  <rect x="30" y="104" width="195" height="96" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="44" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3730a3">① 评论接口</text>
  <text x="44" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#334155">只做卡片下的一层评论</text>
  <text x="44" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#334155">@ 只认工作区成员，解析成 id</text>
  <text x="44" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#334155">解析不到 → 回报未解析项</text>

  <line x1="227" y1="152" x2="243" y2="152" stroke="#334155" stroke-width="1.6" marker-end="url(#tnt-ar)"/>

  <rect x="245" y="104" width="195" height="96" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="259" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">② 同一事务写 outbox</text>
  <text x="259" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#334155">comments 与 outbox 一起提交</text>
  <text x="259" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#334155">一起回滚，不会凭空多也不会丢</text>
  <text x="259" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#334155">提交后才唤醒投递器</text>

  <line x1="442" y1="152" x2="458" y2="152" stroke="#334155" stroke-width="1.6" marker-end="url(#tnt-ar)"/>

  <rect x="460" y="104" width="195" height="96" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="474" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">③ 投递器</text>
  <text x="474" y="146" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#334155">FOR UPDATE SKIP LOCKED</text>
  <text x="474" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#334155">每 2 秒轮询兜底 + 提交后唤醒</text>
  <text x="474" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#334155">多实例拿到不相交的两批</text>

  <line x1="657" y1="152" x2="673" y2="152" stroke="#334155" stroke-width="1.6" marker-end="url(#tnt-ar)"/>

  <rect x="675" y="104" width="195" height="96" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="689" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3730a3">④ 幂等 + 折叠</text>
  <text x="689" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#334155">重复投递被唯一键挡住</text>
  <text x="689" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#334155">同一卡片的多条评论合并</text>
  <text x="689" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#334155">count 记折叠了多少条</text>

  <text x="30" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">二、outbox 状态机：四条边，没有第五条</text>

  <rect x="30" y="240" width="200" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="264" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0f172a">pending</text>
  <text x="44" y="284" font-family="system-ui, sans-serif" font-size="9" fill="#334155">next_attempt_at 已到期</text>

  <line x1="232" y1="272" x2="328" y2="272" stroke="#334155" stroke-width="1.6" marker-end="url(#tnt-ar)"/>
  <text x="238" y="265" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">取行 + 租约</text>

  <rect x="330" y="240" width="200" height="64" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="344" y="264" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#3730a3">delivering</text>
  <text x="344" y="284" font-family="system-ui, sans-serif" font-size="9" fill="#334155">locked_until = now() + 30s</text>

  <line x1="532" y1="272" x2="628" y2="272" stroke="#334155" stroke-width="1.6" marker-end="url(#tnt-ar)"/>
  <text x="542" y="265" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">投递成功</text>

  <rect x="630" y="240" width="200" height="64" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="644" y="264" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0f766e">delivered</text>
  <text x="644" y="284" font-family="system-ui, sans-serif" font-size="9" fill="#334155">终态：投递成功</text>

  <text x="30" y="326" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">回退：投递失败 → 回到 pending，attempts + 1，next_attempt_at = now() + min(2^n, 300) 秒 × 0.8~1.2 抖动。</text>
  <text x="30" y="344" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">租约到期（投递器进程崩了）→ 也回到 pending 让别人接手；attempts &gt;= 6 → dead（终态，必须告警，不得自动丢弃）。</text>

  <text x="30" y="378" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">三、两层键：投递去重与折叠，行数不相等是正常的</text>

  <rect x="30" y="390" width="266" height="72" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">投递去重键（每条评论一行）</text>
  <text x="44" y="430" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#334155">mention:{cardId}:{userId}:{commentId}</text>
  <text x="44" y="450" font-family="system-ui, sans-serif" font-size="9" fill="#334155">重试与重发都只投递一次</text>

  <rect x="317" y="390" width="266" height="72" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="331" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">折叠键（每卡片每人一行）</text>
  <text x="331" y="430" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#334155">UNIQUE (recipient_id, card_id, kind)</text>
  <text x="331" y="450" font-family="system-ui, sans-serif" font-size="9" fill="#334155">5 条评论 → 1 条通知，count = 5</text>

  <rect x="604" y="390" width="266" height="72" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="618" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">未读：实时查询 + 部分索引</text>
  <text x="618" y="430" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#334155">(recipient_id) WHERE read_at IS NULL</text>
  <text x="618" y="450" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不用计数器列：漂移不可自愈</text>

  <rect x="30" y="474" width="840" height="40" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="44" y="492" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">三条对账 + 三档告警</text>
  <text x="44" y="508" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">对账：outbox 滞留 / 含 @ 的评论漏发 / 死信，三者的期望都是 0。告警：dead &gt; 0 立即；pending 最老年龄 &gt; 5 分钟；5 分钟投递成功率 &lt; 99%。</text>
</svg>
