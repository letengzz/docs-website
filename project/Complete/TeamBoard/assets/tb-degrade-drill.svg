<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="降级演练：编排层与网络层探测是假阳性，只有应用层真实命令可信；C3 从宽容读取改为严格读取；压测基线两档阈值">
  <title>降级演练：三层探测的假阳性、C3 的 fail-closed、基线两档阈值</title>
  <defs>
    <marker id="tbd1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="tbd2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450" y="30" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="middle">docker pause 之后：三层的探测结果与两处必须改的口径</text>

  <rect x="26" y="58" width="404" height="34" rx="6" fill="#e2e8f0"/>
  <text x="40" y="80" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start">① 三层探测：只有第三层可信</text>

  <rect x="26" y="100" width="404" height="54" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="40" y="120" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">编排层 · docker exec / pg_isready</text>
  <text x="40" y="139" font-size="9.6" fill="#475569" text-anchor="start">35 ms 返回 Container is paused</text>
  <text x="380" y="139" font-size="9.6" fill="#b45309" text-anchor="end">业务进程用不了 ✗</text>

  <rect x="26" y="162" width="404" height="54" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="40" y="182" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">网络层 · TCP connect :15432</text>
  <text x="40" y="201" font-size="9.6" fill="#be123c" text-anchor="start">0 ms 连接成功，随后 read 超时</text>
  <text x="380" y="201" font-size="9.6" fill="#be123c" text-anchor="end">假阳性 ✗</text>

  <rect x="26" y="224" width="404" height="54" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="40" y="244" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">应用层 · PING / SELECT 1</text>
  <text x="40" y="263" font-size="9.6" fill="#15803d" text-anchor="start">读超时 2001 ms → 判定不可用</text>
  <text x="380" y="263" font-size="9.6" fill="#15803d" text-anchor="end">唯一可信 ✓</text>

  <text x="26" y="300" font-size="9.8" fill="#475569" text-anchor="start">cgroup freezer 冻住进程但保留监听队列 → 握手由内核完成 → connect 秒回。</text>
  <text x="26" y="318" font-size="9.8" fill="#be123c" text-anchor="start">只设 connectTimeout 不设 readTimeout 的系统，会在这里被永久挂住。</text>

  <rect x="456" y="58" width="418" height="34" rx="6" fill="#e2e8f0"/>
  <text x="470" y="80" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start">② C3 改造：从「读到空」到「直接抛」</text>

  <rect x="456" y="100" width="196" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
  <text x="470" y="120" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">改造前 · 宽容模式</text>
  <text x="470" y="139" font-size="9.4" fill="#475569" text-anchor="start">current_setting(..., true)</text>
  <text x="470" y="156" font-size="9.4" fill="#be123c" text-anchor="start">无上下文 → NULL</text>
  <text x="470" y="172" font-size="9.4" fill="#be123c" text-anchor="start">→ RLS 0 行 → 被当成「没数据」</text>

  <rect x="678" y="100" width="196" height="80" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.3"/>
  <text x="692" y="120" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">改造后 · 严格模式</text>
  <text x="692" y="139" font-size="9.4" fill="#475569" text-anchor="start">current_setting('app.tenant')</text>
  <text x="692" y="156" font-size="9.4" fill="#15803d" text-anchor="start">无上下文 → ERROR</text>
  <text x="692" y="172" font-size="9.4" fill="#15803d" text-anchor="start">→ 抛异常 → 503 / 任务失败</text>

  <line x1="652" y1="140" x2="674" y2="140" stroke="#be123c" stroke-width="1.5" marker-end="url(#tbd2)"/>

  <rect x="456" y="196" width="418" height="82" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="470" y="216" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">代价：五个入口必须都设过上下文</text>
  <text x="470" y="235" font-size="9.4" fill="#475569" text-anchor="start">HTTP 同步 ✓ · @Async ✗ · 定时任务 ✓ · 消息消费 ✓ · 手动跑批 ✗</text>
  <text x="470" y="252" font-size="9.4" fill="#b45309" text-anchor="start">✗ 的两行改造后从「静默成功」变成「失败」——这是特性</text>
  <text x="470" y="269" font-size="9.4" fill="#475569" text-anchor="start">所以挑低峰发布，并先把这两类入口的上下文补上</text>

  <rect x="26" y="336" width="404" height="34" rx="6" fill="#e2e8f0"/>
  <text x="40" y="358" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start">③ 基线两档：报警不阻断</text>

  <rect x="26" y="378" width="404" height="22" rx="4" fill="#ecfdf5"/>
  <text x="36" y="394" font-size="9.6" fill="#15803d" text-anchor="start">≤ ×1.20 通过</text>
  <rect x="146" y="378" width="160" height="22" rx="4" fill="#fffbeb"/>
  <text x="226" y="394" font-size="9.6" fill="#b45309" text-anchor="middle">×1.20 ~ ×1.50 报警</text>
  <rect x="306" y="378" width="124" height="22" rx="4" fill="#fff1f2"/>
  <text x="368" y="394" font-size="9.6" fill="#be123c" text-anchor="middle">> ×1.50 阻断</text>
  <text x="26" y="420" font-size="9.8" fill="#475569" text-anchor="start">噪声本身能到 10%~15%；设成阻断的结局是「重跑直到绿」，比没门禁更糟。</text>
  <text x="26" y="440" font-size="9.8" fill="#be123c" text-anchor="start">基线必须带 commit 与 env：1c2g 与 4c8g 的 p99 差 4 倍。</text>

  <rect x="456" y="336" width="418" height="64" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.3"/>
  <text x="470" y="356" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">矩阵第 23 格：甲的签名 + 乙的凭证</text>
  <text x="470" y="374" font-size="9.4" fill="#475569" text-anchor="start">对象存储只校验签名，不校验调用者身份 → 常见结果是 200</text>
  <text x="470" y="391" font-size="9.4" fill="#15803d" text-anchor="start">正解：object_key 前缀与 policy condition 都绑定 tenant</text>

  <text x="456" y="432" font-size="9.8" fill="#475569" text-anchor="start">降级演练进 CI 的关键不是注入，而是：</text>
  <text x="456" y="450" font-size="9.8" fill="#475569" text-anchor="start">注释掉降级分支后，断言必须变红（变异测试）。</text>
</svg>
