<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">租户退出：六阶段状态机与三份证据</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#64748B">冷静期 30 天可撤销；到期后 72 小时内完成物理删除并出证据包</text>

  <rect x="26" y="78" width="104" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="78" y="97" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">requested</text>
  <text x="78" y="113" text-anchor="middle" font-size="7.2" fill="#1D4ED8">二次确认 + 验证码</text>

  <rect x="146" y="78" width="104" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="198" y="97" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">exporting</text>
  <text x="198" y="113" text-anchor="middle" font-size="7.2" fill="#1D4ED8">三份产物 + 摘要</text>

  <rect x="266" y="78" width="104" height="46" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="318" y="97" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">cooling</text>
  <text x="318" y="113" text-anchor="middle" font-size="7.2" fill="#047857">30 天 · 只读 · 可撤销</text>

  <rect x="386" y="78" width="104" height="46" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="438" y="97" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">deleting</text>
  <text x="438" y="113" text-anchor="middle" font-size="7.2" fill="#C2410C">墓碑化 + 级联删除</text>

  <rect x="506" y="78" width="104" height="46" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="558" y="97" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="bold">purging</text>
  <text x="558" y="113" text-anchor="middle" font-size="7.2" fill="#C2410C">对象 / 缓存 / 副本</text>

  <rect x="626" y="78" width="104" height="46" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/>
  <text x="678" y="97" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">closed</text>
  <text x="678" y="113" text-anchor="middle" font-size="7.2" fill="#475569">证据包归档</text>

  <line x1="130" y1="101" x2="146" y2="101" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="250" y1="101" x2="266" y2="101" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="370" y1="101" x2="386" y2="101" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="490" y1="101" x2="506" y2="101" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="610" y1="101" x2="626" y2="101" stroke="#94A3B8" stroke-width="1.4"/>

  <path d="M318 124 L318 150 L78 150 L78 132" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="196" y="166" text-anchor="middle" font-size="8" fill="#047857">撤销（唯一合法窗口）→ 恢复 active，并重启被停的定时任务</text>

  <text x="26" y="196" font-size="10.5" fill="#0F172A" font-weight="bold">三个本机实测读数（PG 18.6）</text>

  <rect x="26" y="206" width="228" height="72" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="140" y="224" text-anchor="middle" font-size="8.6" fill="#991B1B" font-weight="bold">先删父表：0.354 ms 报 23503</text>
  <text x="140" y="240" text-anchor="middle" font-size="7.6" fill="#B91C1C">同一条错误还会在「只归档</text>
  <text x="140" y="253" text-anchor="middle" font-size="7.6" fill="#B91C1C">不解除引用」时复现——</text>
  <text x="140" y="266" text-anchor="middle" font-size="7.6" fill="#B91C1C">复制不等于让原行消失</text>

  <rect x="266" y="206" width="228" height="72" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
  <text x="380" y="224" text-anchor="middle" font-size="8.6" fill="#92400E" font-weight="bold">级联删除 160,200 行</text>
  <text x="380" y="240" text-anchor="middle" font-size="7.6" fill="#92400E">外键列无索引：84,413 ms</text>
  <text x="380" y="253" text-anchor="middle" font-size="7.6" fill="#92400E">加索引后：562.7 ms</text>
  <text x="380" y="266" text-anchor="middle" font-size="7.6" fill="#B45309">差 150 倍（平方级 → 线性）</text>

  <rect x="506" y="206" width="224" height="72" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="618" y="224" text-anchor="middle" font-size="8.6" fill="#1E3A8A" font-weight="bold">删除 ≠ 空间回收</text>
  <text x="618" y="240" text-anchor="middle" font-size="7.6" fill="#1D4ED8">card 3,136 → 3,144 kB</text>
  <text x="618" y="253" text-anchor="middle" font-size="7.6" fill="#1D4ED8">VACUUM 后 2,128 kB</text>
  <text x="618" y="266" text-anchor="middle" font-size="7.6" fill="#2563EB">死元组要单独回收</text>

  <text x="26" y="302" font-size="10.5" fill="#0F172A" font-weight="bold">证据包四件（缺一件就等于「删了但没人能证明」）</text>
  <rect x="26" y="312" width="170" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="111" y="330" text-anchor="middle" font-size="8" fill="#334155">manifest.json</text>
  <text x="111" y="344" text-anchor="middle" font-size="7.2" fill="#64748B">时间线 + retained 说明</text>

  <rect x="206" y="312" width="170" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="291" y="330" text-anchor="middle" font-size="8" fill="#334155">residual.sql.txt</text>
  <text x="291" y="344" text-anchor="middle" font-size="7.2" fill="#64748B">每表计数应全为 0</text>

  <rect x="386" y="312" width="170" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="471" y="330" text-anchor="middle" font-size="8" fill="#334155">objects.txt</text>
  <text x="471" y="344" text-anchor="middle" font-size="7.2" fill="#64748B">前缀剩余对象数 + sha256</text>

  <rect x="566" y="312" width="164" height="40" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="648" y="330" text-anchor="middle" font-size="8" fill="#334155">sign.txt</text>
  <text x="648" y="344" text-anchor="middle" font-size="7.2" fill="#64748B">操作人 + 复核人双签</text>

  <rect x="26" y="362" width="704" height="26" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="378" y="379" text-anchor="middle" font-size="8.3" fill="#065F46">「残留全 0」只在清单齐全时成立：表清单 → 残留 SQL 逐条对齐，新增表漏登记就等于假绿</text>
</svg>
