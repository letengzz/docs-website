  <text x="423" y="410" font-family="system-ui, sans-serif" font-size="9.5" fill="#b45309" text-anchor="end">⏳ 未跑</text>

  <rect x="169" y="432" width="253" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="183" y="456" font-family="system-ui, sans-serif" font-size="10.5" fill="#0f172a">A8 一键部署 + 成本判据</text>
  <text x="408" y="456" font-family="system-ui, sans-serif" font-size="9.5" fill="#b45309" text-anchor="end">⏳ 未跑</text>

