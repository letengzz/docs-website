  <rect x="580" y="326" width="284" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="590" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#0f172a">下载附件</text>
  <text x="714" y="348" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle">允许</text>
