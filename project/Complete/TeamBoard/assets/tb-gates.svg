  <text x="834" y="348" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle">允许</text>

  <rect x="580" y="376" width="284" height="94" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="594" y="400" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">两条贯穿全表的边界</text>
  <text x="594" y="422" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">跨工作区一律 404，不是 403——</text>
  <text x="594" y="438" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">「无权」与「不存在」必须长得一样。</text>
  <text x="594" y="458" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">越权订阅实时流返回 403，不是静默不推。</text>

  <line x1="60" y1="478" x2="422" y2="478" stroke="#e2e8f0"/>
  <text x="60" y="500" font-family="system-ui, sans-serif" font-size="10" fill="#065f46">✅ 本机可判（文档级 · TB-A）</text>
  <text x="60" y="520" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">⏳ 未跑 · 本机无容器运行时 / 本仓无工程代码（BL-1 / BL-2）</text>
  <text x="580" y="520" font-family="system-ui, sans-serif" font-size="10" fill="#334155">18 格 = 6 动作 × 3 角色；每格都要能失败。</text>
