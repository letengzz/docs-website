  <text x="714" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle">允许</text>
  <text x="774" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle">允许</text>
  <text x="834" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle">拒绝 403</text>

