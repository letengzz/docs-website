  <text x="501" y="180" font-family="system-ui, sans-serif" font-size="9.5" fill="#b45309" text-anchor="end">⏳ 未跑</text>

  <rect x="91" y="202" width="408" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
