  <text x="774" y="234" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="middle">允许</text>
  <text x="834" y="234" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle">拒绝 403</text>

  <rect x="580" y="250" width="284" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="590" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#0f172a">评论</text>
