<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="在线协作任务看板的验收视图：左侧是 A1 到 A8 八级验收阶梯，只有 A1 本机可判；右侧是六动作乘三角色的权限矩阵十八格">
  <title>在线协作任务看板 · A1~A8 验收阶梯与权限矩阵 18 格</title>
  <defs>
    <marker id="tbg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">在线协作任务看板 · A1~A8 验收阶梯与权限矩阵</text>
  <text x="30" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">左：八级门槛顺序不可换，前一级不过就不要往下走。右：18 格每一格都要能失败，任何一格与表中值不符即为不过。</text>

  <text x="30" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">验收阶梯 A1~A8（越往下越靠近「能跑起来」）</text>
  <text x="580" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">权限矩阵 18 格（6 动作 × 3 角色）</text>

  <line x1="44" y1="118" x2="44" y2="468" stroke="#334155" stroke-width="1.6" marker-end="url(#tbg-ar)"/>
  <line x1="480" y1="300" x2="574" y2="300" stroke="#334155" stroke-width="1.6" marker-end="url(#tbg-ar)"/>

  <rect x="60" y="110" width="470" height="38" rx="8" fill="#d1fae5" stroke="#34d399"/>
  <text x="74" y="134" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">A1 设计齐备 · DDL 与 ER 一致、契约齐备</text>
  <text x="516" y="134" font-family="system-ui, sans-serif" font-size="9.5" fill="#065f46" text-anchor="end">✅ 本机可判</text>

