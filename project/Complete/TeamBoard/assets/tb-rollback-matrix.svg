<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="回滚矩阵：代码、配置、库结构、缓存与事件四类耦合">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">四类耦合：只有代码能真正「退回去」</text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 四类 -->
    <rect x="30" y="58" width="215" height="88" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="48" y="82" font-size="12" font-weight="600" fill="#166534">① 代码（镜像）</text>
    <text x="48" y="102" font-size="11" fill="#14532d">换回上一版 digest</text>
    <text x="48" y="120" font-size="11" fill="#14532d">代价：秒级 ✅</text>

    <rect x="255" y="58" width="215" height="88" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="273" y="82" font-size="12" font-weight="600" fill="#92400e">② 配置</text>
    <text x="273" y="102" font-size="11" fill="#78350f">能退，但语义可能变</text>
    <text x="273" y="120" font-size="11" fill="#78350f">需要配置快照 ⚠️</text>

    <rect x="480" y="58" width="215" height="88" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="498" y="82" font-size="12" font-weight="600" fill="#991b1b">③ 库结构（DDL）</text>
    <text x="498" y="102" font-size="11" fill="#7f1d1d">部分不可退</text>
    <text x="498" y="120" font-size="11" fill="#7f1d1d">代价：恢复备份 ❌</text>

    <rect x="705" y="58" width="225" height="88" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="723" y="82" font-size="12" font-weight="600" fill="#92400e">④ 缓存与事件</text>
    <text x="723" y="102" font-size="11" fill="#78350f">能清缓存，事件不可退</text>
    <text x="723" y="120" font-size="11" fill="#78350f">清缓存 = 一次冷启动 ⚠️</text>

    <!-- 四场景 -->
    <rect x="30" y="166" width="900" height="150" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="48" y="190" font-size="12" font-weight="600" fill="#0f172a">四个本机实测：旧代码（回滚后的上一版）在新结构上会怎样（PG 18.6 / 100 行表）</text>

    <text x="48" y="216" font-size="11" fill="#166534">A · ADD COLUMN pos int NOT NULL DEFAULT 0 → 旧代码插入成功，返回 101 | 0（新列取默认值，双向兼容）</text>
    <text x="48" y="238" font-size="11" fill="#991b1b">B · ALTER COLUMN ver DROP DEFAULT → 旧代码插入失败：null value in column "ver" violates not-null constraint</text>
    <text x="48" y="260" font-size="11" fill="#991b1b">C · DROP COLUMN ver（此前 ver=7）→ 查询报 column "ver" does not exist，值随列消失，无 DDL 可逆</text>
    <text x="48" y="282" font-size="11" fill="#92400e">D · RENAME COLUMN title TO name → 旧代码 insert into card(title) 报 column "title" does not exist（42703）</text>
    <text x="48" y="304" font-size="11" fill="#64748b">结论：能起来 ≠ 能写入。回滚演练必须包含「旧版写路径」一步，且在已迁移的库上做</text>

    <!-- 标签 -->
    <rect x="30" y="336" width="440" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="48" y="360" font-size="12" font-weight="600" fill="#1e3a8a">迁移标签决定「能不能回滚镜像」</text>
    <text x="48" y="380" font-size="11" fill="#334155">R0 纯增量（可退） · R1 双写窗口 · R2 语义变更（只能向前）</text>
    <text x="48" y="398" font-size="11" fill="#334155">R3 不可逆（DROP / RENAME / 回填后删源）→ 回滚选项删除</text>
    <text x="48" y="416" font-size="11" fill="#b91c1c">发布记录里写「本次最高标签」</text>

    <rect x="490" y="336" width="440" height="86" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="508" y="360" font-size="12" font-weight="600" fill="#166534">回滚点三件套（缺一不可）</text>
    <text x="508" y="380" font-size="11" fill="#14532d">镜像 repo@sha256:…（上一版 + 上上版）</text>
    <text x="508" y="398" font-size="11" fill="#14532d">数据 pg_current_wal_lsn() + 最近基础备份</text>
    <text x="508" y="416" font-size="11" fill="#14532d">配置 env 键值快照（密钥只记版本号）</text>
  </g>
</svg>
