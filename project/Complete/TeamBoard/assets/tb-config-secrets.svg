<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="配置三分法与密钥四级落点：随镜像走、随环境走、密钥三类的落点与后果，以及本地 .env、CI 变量、编排 secrets、密钥管理服务四级密钥落法">
  <title>配置与密钥 · 三层分流与密钥四级落点</title>
  <defs>
    <filter id="soft" x="-5%" y="-8%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">配置与密钥 · 三层分流与密钥四级落点</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">同一份镜像跑三套环境：哪些值随镜像走、哪些随环境走、密钥放在哪一级——以及一条命令把密钥打印进日志的那处风险。</text>

  <text x="30" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0969da">一、配置三分流（按「谁该改它」分，不按「放在哪个文件」分）</text>

  <rect x="30" y="100" width="400" height="96" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="42" y="124" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">随镜像走的（默认值，不该变）</text>
  <text x="42" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">落点：application.yml + application-common.yml，打进镜像</text>
  <text x="42" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">变更成本：改一次要重新构建并发布镜像</text>
  <text x="42" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">写错后果：三套环境一起错，没有「只回滚一套」的选项</text>

  <rect x="30" y="208" width="400" height="96" rx="9" fill="#fff8c5" stroke="#d4a72c" filter="url(#soft)"/>
  <text x="42" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a6700">随环境走的（连接串、开关、域名）</text>
  <text x="42" y="254" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">落点：.env / CI 变量 / 编排 environment / compose env_file</text>
  <text x="42" y="272" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">变更成本：改值 + 重启，不动镜像</text>
  <text x="42" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">写错后果：环境串味（预发连上生产库），且第一眼看不出来</text>

  <rect x="30" y="316" width="400" height="96" rx="9" fill="#ffebe9" stroke="#ff8182" filter="url(#soft)"/>
  <text x="42" y="340" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cf222e">密钥（凭据、令牌、证书私钥）</text>
  <text x="42" y="362" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">落点：密钥管理服务；本地退化为 .env；编排用 secrets:</text>
  <text x="42" y="380" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">变更成本：轮换要双密钥过渡（旧令牌在 TTL 内仍有效）</text>
  <text x="42" y="398" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">泄漏后果：不可逆——只能轮换，已泄漏的时间窗撤不回来</text>

  <text x="460" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37">二、密钥四级落点（越往下越难泄漏，也越难轮换）</text>

  <rect x="460" y="100" width="410" height="78" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="472" y="124" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">L1 · 本地 .env（不入库）</text>
  <text x="472" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">最小形态：.env + .env.example + .gitignore 首行 .env</text>
  <text x="472" y="163" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">不该用：任何多人共享的环境（共享即等于没有密钥）</text>

  <rect x="460" y="186" width="410" height="78" rx="9" fill="#fff8c5" stroke="#d4a72c" filter="url(#soft)"/>
  <text x="472" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a6700">L2 · CI 变量（仓库或环境级 Secrets）</text>
  <text x="472" y="231" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">最小形态：平台 Secrets + 输出掩码（add-mask）</text>
  <text x="472" y="249" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">不该用：需要双人审批与审计的生产主密钥</text>

  <rect x="460" y="272" width="410" height="78" rx="9" fill="#dafbe1" stroke="#4ac26b" filter="url(#soft)"/>
  <text x="472" y="296" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a7f37">L3 · 编排 secrets 挂载到 /run/secrets</text>
  <text x="472" y="317" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">最小形态：compose secrets: + configtree:/run/secrets/</text>
  <text x="472" y="335" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">不该用：需要不重启就轮换的场景（换文件要重建容器）</text>

  <rect x="460" y="358" width="410" height="78" rx="9" fill="#fbefff" stroke="#a475f9" filter="url(#soft)"/>
  <text x="472" y="382" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6e40c9">L4 · 密钥管理服务（Vault / KMS / SSM）</text>
  <text x="472" y="403" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">最小形态：启动时按角色拉取、只驻内存、不落盘</text>
  <text x="472" y="421" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">不该用：30 天周期的本地开发（过度设计，无人维护）</text>

  <rect x="30" y="470" width="840" height="110" rx="9" fill="#ffebe9" stroke="#ff8182" filter="url(#soft)"/>
  <text x="42" y="494" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#cf222e">三、docker compose config 会把展开后的密钥打印到标准输出</text>
  <text x="42" y="518" font-family="system-ui, sans-serif" font-size="9.5" fill="#1f2328">错误写法：CI 里直接跑 docker compose config 并把输出打日志——插值展开后的库口令、签名密钥进日志留存。</text>
  <text x="42" y="540" font-family="system-ui, sans-serif" font-size="9.5" fill="#1f2328">正确写法：docker compose config --no-interpolate -q（只校验结构，不插值、不打印任何一个值）。</text>
  <text x="42" y="562" font-family="system-ui, sans-serif" font-size="9.5" fill="#1a7f37">判据：CI 脚本里凡出现 docker compose config，后面必须跟 -q 或 --no-interpolate；日志里密钥字面值命中 0 次。</text>

  <text x="30" y="604" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">三条「不」的判据：密钥不进镜像、不进日志、不进仓库；三套环境用同一份镜像 digest，只有值不同。</text>
</svg>
