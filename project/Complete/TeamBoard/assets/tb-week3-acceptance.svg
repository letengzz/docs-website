<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="在线协作任务看板第 3 周验收结论：上部是四类证据各自的收口形态，中部是八族判据的文档级与运行期分布条形图，下部是三类残余与一处口径更正">
  <title>第 3 周验收结论 · 四类证据的收口、判据族分布与三类残余</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1f2328">第 3 周验收结论 · 四类证据的收口、判据族分布与三类残余</text>
  <text x="30" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#57606a">七页各自自洽，推不出「这一周完成了」——收口页只做三件事：汇总判据、给出结论、登记残余。</text>

  <text x="30" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">四类证据的形态不相同，收口方式也不相同</text>

  <rect x="30" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">联调</text>
  <text x="44" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：可勾选清单 + 实跑表</text>
  <text x="44" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：每项都有「不通过的现象」</text>
  <text x="44" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 IG · TS</text>

  <rect x="240" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="254" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">自动化测试</text>
  <text x="254" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：分层清单 + 用例集</text>
  <text x="254" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：每条能答「为什么不下沉」</text>
  <text x="254" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 ET</text>

  <rect x="450" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="464" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">覆盖率门禁</text>
  <text x="464" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：阈值 + 判定链</text>
  <text x="464" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：红了必须能拦人</text>
  <text x="464" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 CV</text>

  <rect x="660" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="674" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">容量</text>
  <text x="674" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：带前提的分位数结论</text>
  <text x="674" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：同时给写 QPS 与出站量</text>
  <text x="674" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 CAP · CC</text>

  <text x="30" y="216" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">判据族分布（蓝 = 文档级本机可判，橙 = 运行期需真实环境；八族 64 条 = 56 + 8）</text>

  <text x="40" y="243" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">IG 联调</text>
  <rect x="200" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="233" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="233" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="245" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">TS 分层</text>
  <rect x="200" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="255" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="267" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="287" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">CV 门禁</text>
  <rect x="200" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="277" width="60" height="14" rx="3" fill="#0969da"/>
  <text x="706" y="289" font-family="system-ui, sans-serif" font-size="9.5" fill="#1a7f37">8 + 0 全部可判</text>

  <text x="40" y="309" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">ET 端到端</text>
  <rect x="200" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="299" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="311" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="331" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">CC 并发</text>
  <rect x="200" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="321" width="60" height="14" rx="3" fill="#bc4c00"/><rect x="634" y="321" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="333" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">6 + 2</text>

  <text x="40" y="353" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">PM 权限</text>
  <rect x="200" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="343" width="60" height="14" rx="3" fill="#bc4c00"/><rect x="634" y="343" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="355" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">6 + 2</text>

  <text x="40" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">CAP 容量</text>
  <rect x="200" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="365" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="377" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="397" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">W3 收口</text>
  <rect x="200" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="387" width="60" height="14" rx="3" fill="#0969da"/>
