  <text x="40" y="419" font-family="system-ui, sans-serif" font-size="9.5" fill="#9a6700">读法：文档级占多数不等于这一周完成了七分之六——它验的是「口径自洽」，不是「系统可用」。</text>

  <text x="30" y="446" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">三类残余（按「读者下一步做什么」分类，不按重要性）</text>

  <rect x="30" y="456" width="270" height="76" rx="9" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="44" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a7f37">A · 文档内可解</text>
  <text x="44" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">补两处命令序列的参数与期望输出</text>
  <text x="44" y="514" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">处置：本章节集作者，本机即可完成</text>

  <rect x="315" y="456" width="270" height="76" rx="9" fill="#fff8c5" stroke="#9a6700"/>
  <text x="329" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a6700">B · 需工程代码</text>
  <text x="329" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">八条运行期判据，共用同一个前置</text>
  <text x="329" y="514" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">处置：读者按环境骨架建 app/ 与 web/</text>

  <rect x="600" y="456" width="270" height="76" rx="9" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="614" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bc4c00">C · 需环境与数据</text>
  <text x="614" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">50 万卡片种子数据 + 三份令牌夹具</text>
  <text x="614" y="514" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">处置：第 4 周造一次，两处共用</text>

  <rect x="30" y="542" width="840" height="1" fill="#d0d7de"/>
  <text x="30" y="556" font-family="system-ui, sans-serif" font-size="9.5" fill="#cf222e">口径更正（2026-10-17 复验）：BL-1「本机无容器运行时」已不成立——Client / Server 均 27.1.1，且有 5 个常驻容器在运行；残余阻塞只剩 BL-2「本仓库无工程代码」。</text>
</svg>
