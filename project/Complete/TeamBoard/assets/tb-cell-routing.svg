<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="Microsoft YaHei, Arial, sans-serif">
  <style>
    .gw { fill: #f6f7f9; stroke: #9aa3af; stroke-width: 1.2; }
    .a { fill: #eef4ff; stroke: #4a7bd8; stroke-width: 1.5; }
    .b { fill: #eefaf0; stroke: #3aa76d; stroke-width: 1.5; }
    .t { fill: #fff6e8; stroke: #d99a3a; stroke-width: 1.5; }
    .x { fill: #fdeeee; stroke: #c0504d; stroke-width: 1.5; }
    text { fill: #222; font-size: 12px; text-anchor: middle; }
    .hd { font-size: 15px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .s { font-size: 11px; fill: #555; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #333; }
    .line { stroke: #8a94a6; stroke-width: 1.4; fill: none; marker-end: url(#arB); }
    .dash { stroke: #b0b8c4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arB); }
  </style>
  <defs>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <text class="hd" x="430" y="24">第 3 周第 1 步：把「单集群看板」改成「可切流的双单元」</text>
  <text class="s" x="430" y="44">联调对象从「前后端」扩到「单元之间」——多出来的是路由、闸门、复制三件事</text>

  <rect class="gw" x="30" y="62" width="800" height="46" rx="8"/>
  <text class="h" x="430" y="82">网关：令牌 → 会话 → tenant_id → 归属表（缓存 30 s）</text>
  <text class="s" x="430" y="99">命中率 100% 才算过；非归属单元返回 421 + X-Cell-Correct</text>

  <rect class="t" x="340" y="126" width="180" height="44" rx="8"/>
  <text class="h" x="430" y="145">tenant_route</text>
  <text class="s" x="430" y="162">tenant_id / cell / epoch</text>

  <rect class="a" x="90" y="200" width="300" height="150" rx="8"/>
  <text class="h" x="240" y="222">单元 A（主）</text>
  <text class="s" x="240" y="244">应用 3 实例 · PG 主 + 备</text>
  <text class="s" x="240" y="264">Redis · MinIO 桶 a · 索引 a</text>
  <text class="mono" x="240" y="288">epoch = 1</text>
  <text class="s" x="240" y="310">写：只写本地库</text>
  <text class="s" x="240" y="330">旧 epoch 的写 → UPDATE 0</text>
  <text class="s" x="240" y="344">（实测：0 行受影响，无报错）</text>

  <rect class="b" x="470" y="200" width="300" height="150" rx="8"/>
  <text class="h" x="620" y="222">单元 B（接管方）</text>
  <text class="s" x="620" y="244">应用 2 实例（降配）</text>
  <text class="s" x="620" y="264">Redis · MinIO 桶 b · 索引 b</text>
  <text class="mono" x="620" y="288">epoch = 1 → 2（迁移时 +1）</text>
  <text class="s" x="620" y="310">接收 A 的单向逻辑复制</text>
  <text class="s" x="620" y="330">归属表**不**参与复制</text>
  <text class="s" x="620" y="344">（复制了会把流量指回 A）</text>

  <path class="line" d="M430 108 L430 126"/>
  <path class="line" d="M400 170 L240 200 M460 170 L620 200"/>
  <path class="dash" d="M390 275 L470 275"/>
  <text class="s" x="430" y="266">A → B 单向</text>

  <rect class="x" x="230" y="374" width="400" height="44" rx="8"/>
  <text class="s" x="430" y="392">三条必失点：路由缓存未失效 · 归属表被复制 · 旧 epoch 静默写入</text>
  <text class="s" x="430" y="408">三条都不会报错，都只能靠「12 条联调用例」抓出来</text>
</svg>
