<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" role="img" aria-label="一次拖动的四段可观测链路与四张大屏的信息层级、阅读顺序">
  <title>监控与告警接入 · 一次拖动的四段可观测链路与四张大屏的信息层级</title>
  <rect x="0" y="0" width="900" height="562" fill="#ffffff"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">监控与告警接入 · 四段可观测链路与四张大屏</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">指标按周期 5 定稿的口径接进同一条链路：先看有没有事，再看是哪个服务，最后看观测链路自己还活着吗。</text>

  <text x="30" y="88" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0969da">一、一次拖动的四段可观测链路（请求进入 → 事务 → 发布 → 出站）</text>

  <rect x="30" y="98" width="190" height="126" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="42" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">① 入口 · HTTP 层</text>
  <text x="42" y="141" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_http_requests_total</text>
  <text x="42" y="156" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_http_request_duration_seconds</text>
  <text x="42" y="171" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_authz_denied_total</text>
  <text x="42" y="194" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">route 必须是模板</text>
  <text x="42" y="208" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">不是实际路径</text>

  <line x1="222" y1="161" x2="246" y2="161" stroke="#54aeff" stroke-width="2"/>
  <polygon points="246,156 256,161 246,166" fill="#54aeff"/>

  <rect x="255" y="98" width="190" height="126" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="267" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">② 事务 · 写 + outbox</text>
  <text x="267" y="141" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_card_moves_total{result}</text>
  <text x="267" y="156" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_card_move_rows_updated_total</text>
  <text x="267" y="171" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_outbox_pending</text>
  <text x="267" y="194" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">行数增量必须恰好 +1</text>
  <text x="267" y="208" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">409 记 conflict 不计错误</text>

  <line x1="447" y1="161" x2="471" y2="161" stroke="#54aeff" stroke-width="2"/>
  <polygon points="471,156 481,161 471,166" fill="#54aeff"/>

  <rect x="480" y="98" width="190" height="126" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="492" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">③ 发布 · 提交后广播</text>
  <text x="492" y="141" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_redis_publish_failures_total</text>
  <text x="492" y="156" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_redis_subscriber_lag_seconds</text>
  <text x="492" y="171" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_outbox_oldest_age_seconds</text>
  <text x="492" y="194" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">先提交、后广播</text>
  <text x="492" y="208" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">顺序反了会拉到旧数据</text>

  <line x1="672" y1="161" x2="696" y2="161" stroke="#54aeff" stroke-width="2"/>
  <polygon points="696,156 706,161 696,166" fill="#54aeff"/>

  <rect x="705" y="98" width="190" height="126" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="717" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">④ 出站 · 每连接队列</text>
  <text x="717" y="141" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_ws_broadcast_duration_seconds</text>
  <text x="717" y="156" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_ws_queue_dropped_total</text>
  <text x="717" y="171" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">tb_ws_resync_required_total</text>
  <text x="717" y="194" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">队列上限 256 条 / 1 MB</text>
  <text x="717" y="208" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">超限即清空并标记</text>

  <text x="30" y="258" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#cf222e">二、阅读顺序：三问，不能跳</text>

  <rect x="30" y="268" width="270" height="34" rx="7" fill="#ffebe9" stroke="#ff8182"/>
  <text x="46" y="289" font-family="system-ui, sans-serif" font-size="9.5" fill="#1f2328">先：有没有事 —— 业务流量的一眼结论</text>
  <line x1="302" y1="285" x2="314" y2="285" stroke="#ff8182" stroke-width="2"/>
  <polygon points="314,281 322,285 314,289" fill="#ff8182"/>

  <rect x="322" y="268" width="270" height="34" rx="7" fill="#ffebe9" stroke="#ff8182"/>
  <text x="338" y="289" font-family="system-ui, sans-serif" font-size="9.5" fill="#1f2328">再看：是哪个服务 —— 下钻到 route</text>
  <line x1="594" y1="285" x2="606" y2="285" stroke="#ff8182" stroke-width="2"/>
  <polygon points="606,281 614,285 606,289" fill="#ff8182"/>

  <rect x="614" y="268" width="256" height="34" rx="7" fill="#ffebe9" stroke="#ff8182"/>
  <text x="630" y="289" font-family="system-ui, sans-serif" font-size="9.5" fill="#1f2328">最后：观测链路自己还活着吗</text>

  <rect x="30" y="316" width="205" height="176" rx="9" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="42" y="338" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">大屏一 · 业务流量</text>
  <text x="42" y="358" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">回答：有没有在动</text>
  <text x="42" y="372" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">动得对不对</text>
  <text x="42" y="394" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">首屏：tb_card_moves_total</text>
  <text x="42" y="408" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">按 result 拆分</text>
  <text x="42" y="422" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">拖动成功 vs 冲突</text>
  <text x="42" y="444" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">下钻：拖动 → 评论</text>
  <text x="42" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">→ 活跃工作区</text>

  <rect x="250" y="316" width="205" height="176" rx="9" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="262" y="338" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">大屏二 · 服务健康</text>
  <text x="262" y="358" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">回答：哪条 route 在报错</text>
  <text x="262" y="372" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">哪个实例在拖后腿</text>
  <text x="262" y="394" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">首屏：延迟 P99 与 5xx</text>
  <text x="262" y="408" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">占比，按 route 与</text>
  <text x="262" y="422" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">实例分别拆开</text>
  <text x="262" y="444" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">下钻：route → 实例</text>
  <text x="262" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">→ 版本</text>

  <rect x="470" y="316" width="205" height="176" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="482" y="338" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">大屏三 · 实时链路</text>
  <text x="482" y="358" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">回答：写对了，别人的</text>
  <text x="482" y="372" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">屏幕上更新了吗</text>
  <text x="482" y="394" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">首屏：广播延迟 P99</text>
  <text x="482" y="408" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">resync_required 增量</text>
  <text x="482" y="422" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">outbox 最老龄期</text>
  <text x="482" y="444" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">下钻：连接 → 广播</text>
  <text x="482" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">→ outbox</text>

  <rect x="690" y="316" width="205" height="176" rx="9" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="702" y="338" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9a6700">大屏四 · 资源水位</text>
  <text x="702" y="358" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">回答：哪一层先饱和</text>
  <text x="702" y="372" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">（池 / Redis / 线程池）</text>
  <text x="702" y="394" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">首屏：连接池 pending</text>
  <text x="702" y="408" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">线程池队列长度</text>
  <text x="702" y="422" font-family="system-ui, sans-serif" font-size="8.5" fill="#57606a">Redis 投递失败</text>
  <text x="702" y="444" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">下钻：池 → Redis</text>
  <text x="702" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#1f2328">→ 线程池</text>

  <text x="30" y="514" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">四张不是并列：每张右下角常驻三行读数 —— up / scrape_samples_scraped / scrape_duration_seconds，它们负责回答第三问。</text>
  <text x="30" y="532" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">「观测链路自己死了」与「系统没事」在数据上是同一种安静，所以这三行必须常驻、且不被下钻图层覆盖。</text>
  <text x="30" y="550" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">指标名一律 tb_ 前缀：规范沿用周期 5，名字必须能区分来源，否则两套系统的曲线会混进同一条序列。</text>
</svg>
