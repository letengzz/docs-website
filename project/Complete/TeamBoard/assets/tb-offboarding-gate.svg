<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="15.5" fill="#0F172A" font-weight="bold">退出演练结论如何变成一次发布的前置项</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">演练只证明「那天能跑通」，闸门要证明「今天还成立」——两者之间隔着一个可验证的输出契约</text>

  <rect x="24" y="76" width="170" height="96" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="109" y="98" text-anchor="middle" font-size="9.5" fill="#0F172A" font-weight="bold">① 编排器 dry-run</text>
  <text x="109" y="118" text-anchor="middle" font-size="8.2" fill="#334155">10 步 / 不写任何行</text>
  <text x="109" y="134" text-anchor="middle" font-size="8.2" fill="#334155">输出 checks[] 与 counts</text>
  <text x="109" y="150" text-anchor="middle" font-size="8.2" fill="#334155">含指纹（可排序）</text>
  <text x="109" y="166" text-anchor="middle" font-size="8.2" fill="#B91C1C">只读，可随时重跑</text>

  <rect x="212" y="76" width="170" height="96" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="297" y="98" text-anchor="middle" font-size="9.5" fill="#0F172A" font-weight="bold">② 判定表</text>
  <text x="297" y="118" text-anchor="middle" font-size="8.2" fill="#334155">12 项，三态 + 豁免</text>
  <text x="297" y="134" text-anchor="middle" font-size="8.2" fill="#334155">fail 不可豁免</text>
  <text x="297" y="150" text-anchor="middle" font-size="8.2" fill="#334155">warn 要带四字段豁免</text>
  <text x="297" y="166" text-anchor="middle" font-size="8.2" fill="#B91C1C">判定是纯函数</text>

  <rect x="400" y="76" width="150" height="96" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/>
  <text x="475" y="98" text-anchor="middle" font-size="9.5" fill="#0F172A" font-weight="bold">③ 结论</text>
  <text x="475" y="118" text-anchor="middle" font-size="8.2" fill="#334155">pass</text>
  <text x="475" y="134" text-anchor="middle" font-size="8.2" fill="#334155">blocked</text>
  <text x="475" y="150" text-anchor="middle" font-size="8.2" fill="#B91C1C">waived（附豁免人）</text>
  <text x="475" y="166" text-anchor="middle" font-size="8.2" fill="#334155">三态，不是一个布尔</text>

  <rect x="568" y="76" width="168" height="96" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="652" y="98" text-anchor="middle" font-size="9.5" fill="#0F172A" font-weight="bold">④ 发布闸门</text>
  <text x="652" y="118" text-anchor="middle" font-size="8.2" fill="#334155">PreLaunchGate 增一项 C13</text>
  <text x="652" y="134" text-anchor="middle" font-size="8.2" fill="#334155">blocked 即一票否决</text>
  <text x="652" y="150" text-anchor="middle" font-size="8.2" fill="#334155">waived 要进发布单</text>
  <text x="652" y="166" text-anchor="middle" font-size="8.2" fill="#B91C1C">与 C1/C3/C5 同级</text>

  <defs><marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/></marker></defs>
  <line x1="194" y1="124" x2="210" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#g1)"/>
  <line x1="382" y1="124" x2="398" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#g1)"/>
  <line x1="550" y1="124" x2="566" y2="124" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#g1)"/>

  <rect x="24" y="190" width="348" height="92" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="40" y="212" font-size="9.5" fill="#0F172A" font-weight="bold">step 表的 running 超时</text>
  <text x="40" y="232" font-size="8.3" fill="#334155">心跳 5s、检测 5s、超时 30s：3000 次模拟 0% 误判</text>
  <text x="40" y="250" font-size="8.3" fill="#334155">超时 15s（3× 心跳）：误判 75.4%；10s：100%</text>
  <text x="40" y="268" font-size="8.3" fill="#B91C1C">「ttl ≥ 3× 心跳」在 5% 丢心跳下不成立，要 6×</text>

  <rect x="388" y="190" width="348" height="92" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="404" y="212" font-size="9.5" fill="#0F172A" font-weight="bold">超时扫描的代价</text>
  <text x="404" y="232" font-size="8.3" fill="#334155">20 万行 step 表，命中 7,535 行</text>
  <text x="404" y="250" font-size="8.3" fill="#334155">无索引 12.355 ms → 索引 3.272 ms（3.8×）</text>
  <text x="404" y="268" font-size="8.3" fill="#334155">索引 (status, updated_at)，每分钟扫一次即可</text>

  <rect x="24" y="298" width="712" height="52" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="380" y="320" text-anchor="middle" font-size="8.6" fill="#334155">判定表穷举：4 项 × 3 态 = 81 组合，不允许豁免时只有 1 种通过（全 pass）；允许 warn 豁免时 16 种通过</text>
  <text x="380" y="340" text-anchor="middle" font-size="8.6" fill="#64748B">这说明「豁免」不是语法糖：它把通过面从 1.2% 扩到 19.8%，所以每个豁免都必须留四字段（谁、为什么、到何时、补救项）</text>

  <text x="380" y="376" text-anchor="middle" font-size="9" fill="#1E3A8A" font-weight="bold">指纹必须 sort_keys：不排序时「顶层换序」与「内层换序」会得到三个不同指纹，比对永远不相等</text>
  <text x="380" y="400" text-anchor="middle" font-size="9" fill="#B91C1C">闸门的价值不在拦住坏人，而在让「这次为什么放行」留下可复核的形状</text>
</svg>
