<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="迁移前置闸门：体检、预演、加锁预算、执行与记录">
  <defs>
    <marker id="mgp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">迁移前置：让 DDL 在碰到生产之前，先回答「锁谁、多久、退路」</text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 五步 -->
    <rect x="30" y="62" width="168" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="114" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">① 影子库预演</text>
    <text x="114" y="106" text-anchor="middle" font-size="11" fill="#64748b">用生产备份恢复</text>
    <text x="114" y="124" text-anchor="middle" font-size="11" fill="#64748b">跑一遍并计时</text>

    <rect x="214" y="62" width="168" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="298" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">② 体检</text>
    <text x="298" y="106" text-anchor="middle" font-size="11" fill="#64748b">pg_stat_activity</text>
    <text x="298" y="124" text-anchor="middle" font-size="11" fill="#64748b">无长事务再走</text>

    <rect x="398" y="62" width="168" height="76" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="482" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">③ 加锁预算</text>
    <text x="482" y="106" text-anchor="middle" font-size="11" fill="#78350f">lock_timeout 500ms</text>
    <text x="482" y="124" text-anchor="middle" font-size="11" fill="#78350f">statement_timeout 30s</text>

    <rect x="582" y="62" width="168" height="76" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="666" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">④ 独立迁移任务</text>
    <text x="666" y="106" text-anchor="middle" font-size="11" fill="#64748b">restart: no</text>
    <text x="666" y="124" text-anchor="middle" font-size="11" fill="#64748b">失败不自动重试</text>

    <rect x="766" y="62" width="164" height="76" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="848" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">⑤ 记录回滚点</text>
    <text x="848" y="106" text-anchor="middle" font-size="11" fill="#14532d">pg_current_wal_lsn()</text>
    <text x="848" y="124" text-anchor="middle" font-size="11" fill="#14532d">+ 最近基础备份</text>

    <line x1="198" y1="100" x2="212" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#mgp-arrow)"/>
    <line x1="382" y1="100" x2="396" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#mgp-arrow)"/>
    <line x1="566" y1="100" x2="580" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#mgp-arrow)"/>
    <line x1="750" y1="100" x2="764" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#mgp-arrow)"/>

    <!-- 锁队列 -->
    <rect x="30" y="160" width="440" height="128" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="184" font-size="12" font-weight="600" fill="#991b1b">锁队列：后来者堵住后来者（本机实测）</text>
    <text x="48" y="206" font-size="11" fill="#7f1d1d">会话 A：ACCESS EXCLUSIVE 持锁 3 s</text>
    <text x="48" y="224" font-size="11" fill="#7f1d1d">会话 B：ALTER（lock_timeout=0）排队</text>
    <text x="48" y="242" font-size="11" fill="#7f1d1d">会话 C：select count(*) —— 被堵 1.19 s</text>
    <text x="48" y="266" font-size="11" fill="#b91c1c">只读查询被 DDL 排队堵住：这就是「迁移引发全站超时」的机制</text>

    <rect x="490" y="160" width="440" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="508" y="184" font-size="12" font-weight="600" fill="#1e3a8a">lock_timeout 的两个读数（20,000 行表）</text>
    <text x="508" y="206" font-size="11" fill="#334155">lock_timeout=200ms → 0.238 s 报 lock timeout（自杀）</text>
    <text x="508" y="224" font-size="11" fill="#334155">lock_timeout=0    → 1.42 s 等到锁（排队成功）</text>
    <text x="508" y="242" font-size="11" fill="#334155">基线 docker exec + psql 启动开销 = 0.299 s</text>
    <text x="508" y="266" font-size="11" fill="#b91c1c">「排队成功」不等于没问题：等待期间应用侧已 504</text>

    <!-- DDL 代价 -->
    <rect x="30" y="302" width="900" height="106" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="48" y="326" font-size="12" font-weight="600" fill="#0f172a">同一条 ALTER，三种代价</text>
    <text x="48" y="348" font-size="11" fill="#166534">ADD COLUMN DEFAULT 常量 → 0.008 s（attmissingval，不重写表）</text>
    <text x="48" y="366" font-size="11" fill="#92400e">ADD COLUMN DEFAULT random() → 0.082 s（全表重写，按行数线性放大）</text>
    <text x="48" y="384" font-size="11" fill="#991b1b">CREATE INDEX CONCURRENTLY 在事务里 → ERROR: cannot run inside a transaction block</text>
    <text x="48" y="400" font-size="11" fill="#334155">加约束走 NOT VALID + VALIDATE；大表索引必须 CONCURRENTLY 且单独成文件</text>
  </g>
</svg>
