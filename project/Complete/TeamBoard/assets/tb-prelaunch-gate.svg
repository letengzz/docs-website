<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="上线前置：七道闸门与一次 Go/No-Go 决策">
  <defs>
    <marker id="plg-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">七道闸门的依赖顺序：上游结论会改下游选项</text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 前置四道 -->
    <rect x="30" y="58" width="200" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="130" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">① ISC 产物指纹</text>
    <text x="130" y="100" text-anchor="middle" font-size="11" fill="#334155">清单写 digest</text>

    <rect x="250" y="58" width="200" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="350" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">② EPR 环境等价</text>
    <text x="350" y="100" text-anchor="middle" font-size="11" fill="#334155">差异 ⊆ 白名单</text>

    <rect x="470" y="58" width="200" height="58" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="570" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">③ MGP 迁移锁</text>
    <text x="570" y="100" text-anchor="middle" font-size="11" fill="#78350f">无长事务 · 有 lock_timeout</text>

    <rect x="690" y="58" width="240" height="58" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="810" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">④ RBD 回滚选项</text>
    <text x="810" y="100" text-anchor="middle" font-size="11" fill="#7f1d1d">含 R3 → 回滚路径删除</text>

    <line x1="230" y1="87" x2="246" y2="87" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="450" y1="87" x2="466" y2="87" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="670" y1="87" x2="686" y2="87" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>

    <!-- 部署 -->
    <rect x="330" y="146" width="300" height="58" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="480" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">T-0：迁移 → 替换 → 冒烟</text>
    <text x="480" y="188" text-anchor="middle" font-size="11" fill="#334155">migrate Exited(0) · drain done inflight=0</text>

    <line x1="570" y1="116" x2="520" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="810" y1="116" x2="640" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>

    <!-- 后置三道 -->
    <rect x="30" y="234" width="280" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="170" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">⑤ DRN 优雅退出</text>
    <text x="170" y="276" text-anchor="middle" font-size="11" fill="#14532d">有 drain done 日志</text>

    <rect x="330" y="234" width="300" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="480" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">⑥ SMK 冒烟 10/10</text>
    <text x="480" y="276" text-anchor="middle" font-size="11" fill="#14532d">S0 digest 相符 · ≤ 60 s</text>

    <rect x="650" y="234" width="280" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="790" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">⑦ CRC 容量余量</text>
    <text x="790" y="276" text-anchor="middle" font-size="11" fill="#14532d">≥ 25% · 按 maxReplicas 算</text>

    <line x1="480" y1="204" x2="480" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="480" y1="234" x2="170" y2="230" stroke="#cbd5e1" stroke-width="0"/>

    <!-- 决策 -->
    <rect x="180" y="316" width="600" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="480" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">⑧ 本页 PLG：12 项 Go/No-Go —— 任一红项未解除，不发</text>
    <text x="480" y="358" text-anchor="middle" font-size="11" fill="#334155">一票否决：digest 不符 / 非白名单差异 / 长事务 / 含 R3 且窗口不足 / 余量 &lt; 15%</text>

    <line x1="170" y1="292" x2="300" y2="312" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="480" y1="292" x2="480" y2="312" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>
    <line x1="790" y1="292" x2="660" y2="312" stroke="#2563eb" stroke-width="2" marker-end="url(#plg-arrow)"/>

    <!-- 必跑三条 -->
    <rect x="30" y="382" width="900" height="46" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="48" y="404" font-size="12" font-weight="600" fill="#991b1b">上线前必跑三条（第 3 周用例）：C1 跨实例同步 · C3 断网回滚 ≤ 2 s · C5 并发改同一卡收到冲突</text>
    <text x="48" y="420" font-size="11" fill="#7f1d1d">它们的共同点：单实例测试永远造不出失败条件 —— 广播跨进程、断网、真并发</text>
  </g>
</svg>
