<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">退出编排器：状态机、幂等键与三个不可省的预演</text>
  <text x="380" y="54" text-anchor="middle" font-size="10.5" fill="#64748B">编排器的价值不在「按顺序调用」，而在「不按顺序时会怎样」</text>
  <rect x="30" y="76" width="104" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="82" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">requested</text>
  <line x1="136" y1="96" x2="148" y2="96" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="150" y="76" width="104" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="202" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">exporting</text>
  <line x1="256" y1="96" x2="268" y2="96" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="270" y="76" width="104" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="322" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">cooling</text>
  <line x1="376" y1="96" x2="388" y2="96" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="390" y="76" width="104" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="442" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">deleting</text>
  <line x1="496" y1="96" x2="508" y2="96" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="510" y="76" width="104" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="562" y="94.2" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">purging</text>
  <line x1="616" y1="96" x2="628" y2="96" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="630" y="76" width="104" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="682" y="94.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">closed</text>
  <line x1="380" y1="118" x2="380" y2="132" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arw)" stroke-dasharray="5 4"/>
  <rect x="200" y="134" width="360" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="380" y="152.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">crashed（任意状态可进入）</text>
  <text x="380" y="188" text-anchor="middle" font-size="8.5" fill="#B91C1C" font-weight="bold">恢复时不猜「跑到哪了」，只读 step.status —— 进度在库不在日志</text>
  <text x="30" y="214" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">两张表：run 存状态，step 存进度（主键 = 幂等键）</text>
  <rect x="30" y="226" width="340" height="92" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="200" y="244.2" text-anchor="middle" font-size="10" fill="#3730A3" font-weight="bold">offboard_run</text>
  <text x="200" y="261" text-anchor="middle" font-size="7.5" fill="#4338CA">id / tenant_id / state / updated_at</text>
  <text x="200" y="278.25" text-anchor="middle" font-size="7.5" fill="#4338CA">十对依赖由 DEPENDS 常量给出</text>
  <text x="200" y="295.5" text-anchor="middle" font-size="7.5" fill="#4338CA">有环则拒绝启动，不是「先跑看看」</text>
  <rect x="390" y="226" width="340" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="560" y="244.2" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">offboard_step</text>
  <text x="560" y="261" text-anchor="middle" font-size="7.5" fill="#6D28D9">PK (run_id, name) —— 不是 (run_id, seq)</text>
  <text x="560" y="278.25" text-anchor="middle" font-size="7.5" fill="#6D28D9">status: pending/running/done/failed</text>
  <text x="560" y="295.5" text-anchor="middle" font-size="7.5" fill="#6D28D9">result: 对什么对象做了什么</text>
  <text x="30" y="344" text-anchor="start" font-size="10" fill="#0F172A" font-weight="bold">四组本机读数（Python 3.13.12 + SQLite 3，脚本不入库）</text>
  <rect x="30" y="356" width="166" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="113" y="374.2" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">幂等：二次触发</text>
  <text x="113" y="391" text-anchor="middle" font-size="7.5" fill="#047857">执行步骤 10 → 0</text>
  <text x="113" y="408.25" text-anchor="middle" font-size="7.5" fill="#047857">行数仍 10，0.251 ms</text>
  <rect x="208" y="356" width="166" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
  <text x="291" y="374.2" text-anchor="middle" font-size="10" fill="#115E59" font-weight="bold">断点续跑</text>
  <text x="291" y="391" text-anchor="middle" font-size="7.5" fill="#0F766E">崩溃在第 6 步（done=5）</text>
  <text x="291" y="408.25" text-anchor="middle" font-size="7.5" fill="#0F766E">重启只跑 5 步，重放 = 0</text>
  <rect x="386" y="356" width="166" height="64" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="469" y="374.2" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">dry-run v1 → v2</text>
  <text x="469" y="391" text-anchor="middle" font-size="7.5" fill="#C2410C">写 10 行 54.538 ms</text>
  <text x="469" y="408.25" text-anchor="middle" font-size="7.5" fill="#C2410C">→ 0 行 0.408 ms（133×）</text>
  <rect x="564" y="356" width="166" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="647" y="374.2" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">偏序 1,000 次</text>
  <text x="647" y="391" text-anchor="middle" font-size="7.5" fill="#B91C1C">999 次违反依赖（99.9%）</text>
  <text x="647" y="408.25" text-anchor="middle" font-size="7.5" fill="#B91C1C">顺序必须由拓扑排序强制</text>
  <text x="380" y="442" text-anchor="middle" font-size="8.5" fill="#991B1B" font-weight="bold">演练写坏台账的形态：10 行 running 占住唯一键 → 真跑时该步永远被跳过</text>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
