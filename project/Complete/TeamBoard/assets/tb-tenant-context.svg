<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>租户上下文：六条传播链路与三类失效形态</title>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">一次绑定，六条链路，三类失效</text>

  <!-- 入口列 -->
  <rect x="30" y="60" width="180" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="120" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">六类入口</text>

  <rect x="30" y="112" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="134" text-anchor="middle" font-size="12" fill="#334155">HTTP 请求（过滤器）</text>
  <rect x="30" y="152" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="#334155">异步任务（装饰器）</text>
  <rect x="30" y="192" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="214" text-anchor="middle" font-size="12" fill="#334155">定时任务（遍历租户）</text>
  <rect x="30" y="232" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="254" text-anchor="middle" font-size="12" fill="#334155">消息消费（消息头）</text>
  <rect x="30" y="272" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="294" text-anchor="middle" font-size="12" fill="#334155">WebSocket（握手属性）</text>
  <rect x="30" y="312" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="120" y="334" text-anchor="middle" font-size="12" fill="#334155">后台脚本（显式角色）</text>

  <!-- 绑定点 -->
  <rect x="250" y="150" width="190" height="120" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="345" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">ScopedValue 作用域</text>
  <text x="345" y="200" text-anchor="middle" font-size="11" fill="#334155">Tenant(tenantId, userId, reqId)</text>
  <text x="345" y="220" text-anchor="middle" font-size="11" fill="#334155">不可变 · 不用 remove</text>
  <text x="345" y="240" text-anchor="middle" font-size="11" fill="#334155">require() 为空即抛</text>
  <text x="345" y="260" text-anchor="middle" font-size="10" fill="#065F46">子线程继承 · 池线程不继承</text>

  <!-- 箭头 -->
  <path d="M210 129 L250 180" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M210 169 L250 196" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M210 209 L250 212" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M210 249 L250 228" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M210 289 L250 248" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M210 329 L250 262" stroke="#94A3B8" stroke-width="1.5" fill="none"/>

  <!-- SQL -->
  <rect x="500" y="120" width="210" height="80" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="605" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">事务边界处写一次</text>
  <text x="605" y="168" text-anchor="middle" font-size="11" fill="#334155">set_config('app.tenant_id',?,true)</text>
  <text x="605" y="188" text-anchor="middle" font-size="10" fill="#B45309">第三参数 true = 事务级</text>

  <rect x="500" y="216" width="210" height="70" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="605" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">RLS 策略比较</text>
  <text x="605" y="262" text-anchor="middle" font-size="11" fill="#334155">tenant_id = current_setting(...)</text>
  <text x="605" y="278" text-anchor="middle" font-size="10" fill="#B91C1C">不写 coalesce 兜底</text>

  <path d="M440 190 L500 160" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M440 220 L500 245" stroke="#10B981" stroke-width="2" fill="none"/>

  <!-- 三类失效 -->
  <rect x="30" y="380" width="840" height="150" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="50" y="406" font-size="13" font-weight="bold" fill="#991B1B">三类失效形态（单租户环境全部不可见）</text>

  <rect x="50" y="420" width="250" height="92" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="66" y="442" font-size="12" font-weight="bold" fill="#B91C1C">① 为空</text>
  <text x="66" y="462" font-size="11" fill="#334155">异步/定时链路漏了绑定</text>
  <text x="66" y="480" font-size="11" fill="#334155">表现：抛错或返回空列表</text>
  <text x="66" y="498" font-size="10" fill="#7F1D1D">确认：grep tenant context missing</text>

  <rect x="320" y="420" width="250" height="92" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="336" y="442" font-size="12" font-weight="bold" fill="#B91C1C">② 串号</text>
  <text x="336" y="462" font-size="11" fill="#334155">会话级 set_config 残留在池里</text>
  <text x="336" y="480" font-size="11" fill="#334155">表现：读到别人的租户的数据</text>
  <text x="336" y="498" font-size="10" fill="#7F1D1D">确认：响应回显 tenantId 对比</text>

  <rect x="590" y="420" width="260" height="92" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="606" y="442" font-size="12" font-weight="bold" fill="#B91C1C">③ 丢失后回退</text>
  <text x="606" y="462" font-size="11" fill="#334155">代码里的 orElse(1L) 兜底生效</text>
  <text x="606" y="480" font-size="11" fill="#334155">表现：写操作进了 1 号租户</text>
  <text x="606" y="498" font-size="10" fill="#7F1D1D">确认：grep DEFAULT_TENANT 期望 0</text>
</svg>
