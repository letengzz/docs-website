<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>删除流水线：四个阶段 × 三个面</title>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/></marker>
</defs>
<text x="32.0" y="42.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">删除流水线：四个阶段 × 三个面</text>
<text x="32.0" y="68.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">顺序固定：列出 → 落清单 → 删除 → 复查；清单是唯一的删除意图记录</text>
<rect x="200.0" y="84.0" width="150.0" height="46.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="275.0" y="113.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">① 列出</text>
<line x1="350.0" y1="107.0" x2="372.0" y2="107.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowb)"/>
<rect x="376.0" y="84.0" width="150.0" height="46.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="451.0" y="113.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">② 落清单</text>
<line x1="526.0" y1="107.0" x2="548.0" y2="107.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowb)"/>
<rect x="552.0" y="84.0" width="150.0" height="46.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="627.0" y="113.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">③ 删除</text>
<line x1="702.0" y1="107.0" x2="724.0" y2="107.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowb)"/>
<rect x="728.0" y="84.0" width="150.0" height="46.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="803.0" y="113.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">④ 复查</text>
<rect x="32.0" y="148.0" width="150.0" height="76.0" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.4"/>
<text x="107.0" y="178.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#047857" font-weight="700" text-anchor="middle">DB</text>
<text x="107.0" y="200.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="middle">ResidualScanner</text>
<rect x="200.0" y="148.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="212.0" y="176.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">keyset 分批扫描</text>
<text x="212.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">27.6~38.9 ms/批</text>
<rect x="376.0" y="148.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="388.0" y="176.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">只落 id 清单</text>
<text x="388.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">88,890 B / 40k 行</text>
<rect x="552.0" y="148.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="564.0" y="176.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">分批删 5,000 行</text>
<text x="564.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">31.4→42.6 ms/批</text>
<rect x="728.0" y="148.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="740.0" y="176.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">复查计数与水位</text>
<text x="740.0" y="198.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">空批 15.494 ms</text>
<rect x="32.0" y="232.0" width="150.0" height="76.0" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="107.0" y="262.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="middle">对象存储</text>
<text x="107.0" y="284.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="middle">trash/{id}/{ts}/</text>
<rect x="200.0" y="232.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="212.0" y="260.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">按前缀列举</text>
<text x="212.0" y="282.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">每页 1,000 个</text>
<rect x="376.0" y="232.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="388.0" y="260.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">不落清单，记前缀</text>
<text x="388.0" y="282.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">路径可重算</text>
<rect x="552.0" y="232.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="564.0" y="260.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">rename 进 trash</text>
<text x="564.0" y="282.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">2.62 ms；逐对象 1,236.6 ms</text>
<rect x="728.0" y="232.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="740.0" y="260.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">列举 trash 前缀</text>
<text x="740.0" y="282.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">为空才算干净</text>
<rect x="32.0" y="316.0" width="150.0" height="76.0" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="107.0" y="346.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#6d28d9" font-weight="700" text-anchor="middle">缓存</text>
<text x="107.0" y="368.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="middle">清单 17.8 B/行</text>
<rect x="200.0" y="316.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="212.0" y="344.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">SCAN 游标遍历</text>
<text x="212.0" y="366.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">419.8 ms / 5,000 键</text>
<rect x="376.0" y="316.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="388.0" y="344.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">清单落盘</text>
<text x="388.0" y="366.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">键名 + TTL 快照</text>
<rect x="552.0" y="316.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="564.0" y="344.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">UNLINK 批量删</text>
<text x="564.0" y="366.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">85.9 ms；续跑 103.8 ms</text>
<rect x="728.0" y="316.0" width="150.0" height="76.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="740.0" y="344.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">抽查 key 存在性</text>
<text x="740.0" y="366.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#475569" font-weight="400" text-anchor="start">命中 0 才通过</text>
<rect x="32.0" y="406.0" width="438.0" height="60.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="52.0" y="430.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="start">软删标记：601 ms / 表 39→50 MB（+28%）</text>
<text x="52.0" y="452.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">真删 119.9 ms；VACUUM 36 ms 但体积不变</text>
<rect x="490.0" y="406.0" width="438.0" height="60.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="510.0" y="430.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b45309" font-weight="700" text-anchor="start">空清单必须 rc=2：0 张表 ≠ 干净</text>
<text x="510.0" y="452.0" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">低权角色看 information_schema 返回 0 行，pg_class 非 0</text>
</svg>
