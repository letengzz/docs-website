<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="连接池串租户的时间线与四道防线">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- 顶部：连接池 -->
  <text x="30" y="32" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0f172a">同一根连接被两个请求先后借走</text>
  <text x="30" y="52" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#64748b">连接池不清理会话状态：租户身份若写在会话上，就会跟着连接一起被借出去</text>

  <rect x="30" y="68" width="920" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="90" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#334155">连接池（maximumPoolSize = 20）</text>

  <rect x="48" y="102" width="120" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="108" y="124" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">连接 #1</text>
  <text x="108" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">空闲</text>

  <rect x="186" y="102" width="120" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="246" y="124" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">连接 #2</text>
  <text x="246" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">空闲</text>

  <rect x="324" y="102" width="150" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="399" y="123" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">连接 #3</text>
  <text x="399" y="140" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#1d4ed8" text-anchor="middle">会话值仍是 tenant-a</text>

  <line x1="474" y1="128" x2="560" y2="128" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="517" y="120" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">归还</text>
  <text x="517" y="146" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c" text-anchor="middle">不清会话</text>

  <rect x="566" y="102" width="366" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="584" y="123" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#991b1b">风险不在「谁借到了连接」，而在</text>
  <text x="584" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#991b1b">「借到的时候它身上还带着什么」</text>

  <!-- 时间线 -->
  <text x="30" y="204" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0f172a">两个请求，四个状态（实测）</text>

  <rect x="30" y="216" width="216" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="46" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#1e40af">req-101 · tenant-a</text>
  <text x="46" y="258" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">SET app.tenant_id = 'tenant-a'</text>
  <text x="46" y="276" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">SELECT count(*) → 4,000</text>
  <text x="46" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#15803d">结果正确，但写错了层</text>

  <line x1="246" y1="268" x2="268" y2="268" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="272" y="216" width="216" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="288" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#334155">COMMIT · 归还连接</text>
  <text x="288" y="258" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">连接回到池中</text>
  <text x="288" y="276" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#b91c1c">current_setting → tenant-a</text>
  <text x="288" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b">会话值没有随事务消失</text>

  <line x1="488" y1="268" x2="510" y2="268" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arRed)"/>

  <rect x="514" y="216" width="216" height="104" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="530" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#92400e">req-102 · tenant-b</text>
  <text x="530" y="258" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">SET LOCAL 落在自动提交</text>
  <text x="530" y="276" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#92400e">仅一条 WARNING，不生效</text>
  <text x="530" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b">多数驱动不把它当异常</text>

  <line x1="730" y1="268" x2="752" y2="268" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arRed)"/>

  <rect x="756" y="216" width="194" height="104" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="772" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#991b1b">实际返回 4,000 行</text>
  <text x="772" y="258" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#991b1b">本应是 tenant-b 的 2,000 行</text>
  <text x="772" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b">SQL 对、策略对、数据错</text>
  <text x="772" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="700" fill="#991b1b">HTTP 200</text>

  <!-- 四道防线 -->
  <text x="30" y="356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0f172a">四道防线：各拦一件事，缺一道就漏一种形态</text>

  <rect x="30" y="368" width="216" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="46" y="390" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#166534">① 事务级写入口</text>
  <text x="46" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">只允许 set_config(…, true)</text>
  <text x="46" y="427" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">边界自己定，不交给 ORM</text>
  <text x="46" y="449" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#166534">拦形态 1 / 2</text>

  <rect x="258" y="368" width="216" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="274" y="390" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#166534">② fail-closed 策略</text>
  <text x="274" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">current_setting(…, true)</text>
  <text x="274" y="427" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">未设 → 0 行，不是全表</text>
  <text x="274" y="449" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#166534">拦形态 3 的「读全表」</text>

  <rect x="486" y="368" width="216" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="502" y="390" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#166534">③ 进 / 出各断言一次</text>
  <text x="502" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">不等即 500，不降级</text>
  <text x="502" y="427" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">错误比脏数据便宜</text>
  <text x="502" y="449" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#166534">让 1 / 2 / 3 都变响</text>

  <rect x="714" y="368" width="236" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="730" y="390" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#166534">④ 池层串号计数</text>
  <text x="730" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">lastTenant + 冲突计数</text>
  <text x="730" y="427" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#334155">只告警，不阻断请求</text>
  <text x="730" y="449" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#166534">拦「机制没生效」</text>

  <!-- 成本条 -->
  <rect x="30" y="486" width="920" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#334155">同一台机器、4 客户端、只做 SELECT 1 的成本对照（TPS 越高越好）</text>

  <rect x="48" y="520" width="270" height="18" rx="3" fill="#15803d"/>
  <text x="326" y="534" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#166534">SET LOCAL 5,291.75（基准）</text>

  <rect x="48" y="544" width="219" height="18" rx="3" fill="#ca8a04"/>
  <text x="275" y="558" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#92400e">SET + RESET 4,285.56（-19.0%）</text>

  <rect x="520" y="520" width="183" height="18" rx="3" fill="#b91c1c"/>
  <text x="711" y="534" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#991b1b">DISCARD ALL 3,578.64（-32.4%）</text>
  <text x="520" y="558" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#64748b">且预编译语句一并失效：prepared statement "P_0" does not exist</text>
</svg>
