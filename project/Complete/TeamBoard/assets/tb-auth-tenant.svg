<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="认证与租户成员关系：令牌只证明身份，成员关系每次查表">
  <title>认证链路：令牌 → 主体 → 成员关系 → 角色 → 数据边界</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
  </defs>
  <style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif}</style>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="30" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">令牌只证明「你是谁」，成员关系每次查表</text>
  <rect x="20" y="70" width="150" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="95.0" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Bearer 令牌</text>
  <text x="95.0" y="113" font-size="10" fill="#475569" text-anchor="middle">sub / sid / jti</text>
  <text x="95.0" y="129" font-size="10" fill="#475569" text-anchor="middle">不含 tenant / role</text>
  <rect x="200" y="70" width="150" height="80" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="275.0" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">TokenFilter</text>
  <text x="275.0" y="113" font-size="10" fill="#475569" text-anchor="middle">验签 + iss/aud/exp</text>
  <rect x="380" y="70" width="150" height="80" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="455.0" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">会话校验</text>
  <text x="455.0" y="113" font-size="10" fill="#475569" text-anchor="middle">auth_session 未吊销</text>
  <rect x="560" y="70" width="150" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="635.0" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">租户意图</text>
  <text x="635.0" y="113" font-size="10" fill="#475569" text-anchor="middle">X-Tenant（不可信）</text>
  <rect x="740" y="70" width="140" height="80" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="810.0" y="94" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">成员查表</text>
  <text x="810.0" y="113" font-size="10" fill="#475569" text-anchor="middle">tenant_member</text>
  <line x1="170" y1="110" x2="198" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="350" y1="110" x2="378" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="530" y1="110" x2="558" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="110" x2="738" y2="110" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="560" y="200" width="320" height="90" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="720.0" y="224" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">角色进入上下文</text>
  <text x="720.0" y="243" font-size="10" fill="#475569" text-anchor="middle">ScopedValue：tenant_id / user_id / role</text>
  <text x="720.0" y="259" font-size="10" fill="#475569" text-anchor="middle">事务内 set_config('app.tenant_id')</text>
  <line x1="810" y1="150" x2="810" y2="198" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="560" y="320" width="320" height="70" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="720.0" y="344" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">数据边界</text>
  <text x="720.0" y="363" font-size="10" fill="#475569" text-anchor="middle">RLS + 复合外键 + 租户条件</text>
  <line x1="720" y1="290" x2="720" y2="318" stroke="#be123c" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="20" y="200" width="240" height="90" rx="7" fill="#fef2f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="140.0" y="224" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">401 未登录</text>
  <text x="140.0" y="243" font-size="10" fill="#475569" text-anchor="middle">无令牌 / 验签失败 / 会话吊销</text>
  <rect x="20" y="310" width="240" height="90" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="140.0" y="334" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">404 非成员</text>
  <text x="140.0" y="353" font-size="10" fill="#475569" text-anchor="middle">不泄露租户是否存在</text>
  <rect x="280" y="310" width="240" height="90" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="400.0" y="334" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">403 无权限</text>
  <text x="400.0" y="353" font-size="10" fill="#475569" text-anchor="middle">是成员，但角色不允许</text>
  <rect x="20" y="420" width="860" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="450.0" y="447.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">三个状态码的分工，就是「身份 / 租户 / 权限」三件事的分工</text>
</svg>
