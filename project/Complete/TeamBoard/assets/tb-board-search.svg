<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#0F172A" font-weight="bold">看板检索：从权重列到稳定游标</text>
  <text x="380" y="52" text-anchor="middle" font-size="10.5" fill="#64748B">RPI 保证「不漏」，本步保证「排得对、翻得稳、可证伪」</text>
  <rect x="30" y="74" width="160" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="110" y="92" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">① 写入</text>
  <text x="110" y="108" text-anchor="middle" font-size="7.5" fill="#1D4ED8">title / description</text>
  <text x="110" y="125" text-anchor="middle" font-size="7.5" fill="#1D4ED8">生成列自动落词项</text>
  <text x="110" y="142" text-anchor="middle" font-size="7.5" fill="#1D4ED8">A 档 / D 档分开</text>
  <rect x="210" y="74" width="160" height="92" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="290" y="92" text-anchor="middle" font-size="10" fill="#5B21B6" font-weight="bold">② 索引</text>
  <text x="290" y="108" text-anchor="middle" font-size="7.5" fill="#6D28D9">GIN (tenant_id,</text>
  <text x="290" y="125" text-anchor="middle" font-size="7.5" fill="#6D28D9">search_vector_w)</text>
  <text x="290" y="142" text-anchor="middle" font-size="7.5" fill="#6D28D9">并发建，验 indisvalid</text>
  <rect x="390" y="74" width="160" height="92" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="470" y="92" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">③ 粗排</text>
  <text x="470" y="108" text-anchor="middle" font-size="7.5" fill="#047857">websearch_to_tsquery</text>
  <text x="470" y="125" text-anchor="middle" font-size="7.5" fill="#047857">ts_rank_cd 权重</text>
  <text x="470" y="142" text-anchor="middle" font-size="7.5" fill="#047857">limit 200</text>
  <rect x="570" y="74" width="160" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="650" y="92" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="bold">④ 稳定游标</text>
  <text x="650" y="108" text-anchor="middle" font-size="7.5" fill="#C2410C">round(rank,6)</text>
  <text x="650" y="125" text-anchor="middle" font-size="7.5" fill="#C2410C">(rank_key, id) 行值</text>
  <text x="650" y="142" text-anchor="middle" font-size="7.5" fill="#C2410C">order by 以 id 收尾</text>
  <line x1="190" y1="120" x2="210" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="370" y1="120" x2="390" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="550" y1="120" x2="570" y2="120" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="30" y="198" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">两条必须同时成立的不变式</text>
  <rect x="30" y="210" width="330" height="78" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="195" y="228" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">权重方向</text>
  <text x="195" y="244" text-anchor="middle" font-size="7.5" fill="#B45309">标题命中的 rank_key</text>
  <text x="195" y="261" text-anchor="middle" font-size="7.5" fill="#B45309">必须严格大于</text>
  <text x="195" y="278" text-anchor="middle" font-size="7.5" fill="#B45309">仅描述命中的卡片</text>
  <rect x="390" y="210" width="340" height="78" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.6"/>
  <text x="560" y="228" text-anchor="middle" font-size="10" fill="#155E75" font-weight="bold">游标同源</text>
  <text x="560" y="244" text-anchor="middle" font-size="7.5" fill="#0E7490">SELECT 里的 round(...)</text>
  <text x="560" y="261" text-anchor="middle" font-size="7.5" fill="#0E7490">与游标里存的值</text>
  <text x="560" y="278" text-anchor="middle" font-size="7.5" fill="#0E7490">必须逐字一致</text>
  <text x="30" y="318" text-anchor="start" font-size="10.5" fill="#0F172A" font-weight="bold">零结果的处理是可观测的，不是静默的</text>
  <rect x="30" y="330" width="220" height="64" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="140" y="348" text-anchor="middle" font-size="10" fill="#1E293B" font-weight="bold">严格 AND</text>
  <text x="140" y="364" text-anchor="middle" font-size="7.5" fill="#334155">命中 0 条</text>
  <rect x="270" y="330" width="220" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="348" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">降级 OR</text>
  <text x="380" y="364" text-anchor="middle" font-size="7.5" fill="#047857">取前 20</text>
  <text x="380" y="381" text-anchor="middle" font-size="7.5" fill="#047857">degraded = true</text>
  <rect x="510" y="330" width="220" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="620" y="348" text-anchor="middle" font-size="10" fill="#1E3A8A" font-weight="bold">标注与统计</text>
  <text x="620" y="364" text-anchor="middle" font-size="7.5" fill="#1D4ED8">matched / ignored</text>
  <text x="620" y="381" text-anchor="middle" font-size="7.5" fill="#1D4ED8">补词表的输入</text>
  <line x1="250" y1="362" x2="270" y2="362" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="490" y1="362" x2="510" y2="362" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arw)"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>
</svg>
