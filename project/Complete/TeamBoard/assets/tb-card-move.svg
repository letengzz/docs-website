<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="在线协作任务看板：分数排序键在 a1 与 a2 之间插入得到 a1V 的逐位比较过程，以及一次拖动从客户端预判到客户端对齐的服务端十二步链路">
  <title>在线协作任务看板 · 分数排序键的 midpoint 与一次拖动的十二步链路</title>
  <defs>
    <marker id="tcm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">在线协作任务看板 · midpoint 算法与一次拖动的十二步链路</text>
  <text x="30" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">顺序键是可比较字符串（0-9A-Za-z，按字节序），一次拖动只更新一行；冲突由乐观锁与唯一约束分别兜住。</text>

  <text x="30" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">一、midpoint：逐位比较，取「首个不同位」的中间值</text>

  <rect x="40" y="112" width="180" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">前键 a（目标位置之前）</text>
  <text x="56" y="150" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#0f172a">a1</text>

  <rect x="250" y="112" width="180" height="46" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="266" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#3730a3">新键（只写这一行）</text>
  <text x="266" y="150" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#3730a3">a1V</text>

  <rect x="460" y="112" width="180" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">后键 b（目标位置之后）</text>
  <text x="476" y="150" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#0f172a">a2</text>

  <line x1="222" y1="135" x2="248" y2="135" stroke="#334155" stroke-width="1.6" marker-end="url(#tcm-ar)"/>
  <line x1="432" y1="135" x2="458" y2="135" stroke="#334155" stroke-width="1.6" marker-end="url(#tcm-ar)"/>
  <text x="660" y="140" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#0f766e">a1 &lt; a1V &lt; a2</text>

  <text x="40" y="184" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">① 第 1 位都是 a：相同，跳过。② 第 2 位是 1 与 2：相邻，没有中间字符可插。</text>
  <text x="40" y="202" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">③ 规则：保留 a 的该字符，下界抬到 a1 之后，此时 a 用完、上界消失。④ 上界消失就在 a 末尾追加中位字符 V（62 字符里的下标 31）。</text>
  <text x="40" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">同点连续插入（a1V 与 a2）→ 首个不同位仍在第 2 位 → a1VV；严格间隔（a1 与 a3）→ 取中位字符 2。</text>

  <rect x="40" y="234" width="840" height="52" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="54" y="254" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">相邻无空隙：数学上插不进去时怎么办</text>
  <text x="54" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">条件：a 是 b 的前缀，且 b 的剩余部分全是最小字符 0（例：a1 与 a100）。处置：对「该列」做一次重排压缩并占用一个新 seq 广播。</text>

  <text x="30" y="312" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">二、一次拖动的十二步链路（每一步都要能说清失败表现）</text>

  <rect x="30" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">① 客户端预判</text>
  <text x="42" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">本地先移动卡片</text>
  <text x="42" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">生成 client_op_id</text>

  <rect x="170" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="182" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">② 发起请求</text>
  <text x="182" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">POST .../move</text>
  <text x="182" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">重试时 id 不变</text>

  <rect x="310" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="322" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">③ 鉴权与限流</text>
  <text x="322" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">按用户与工作区</text>
  <text x="322" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">401 与 429 不混</text>

  <rect x="450" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="462" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">④ 权限判定</text>
  <text x="462" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">require_member</text>
  <text x="462" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">跨工作区一律 404</text>

  <rect x="590" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="602" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">⑤ 幂等检查</text>
  <text x="602" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">命中直接返回</text>
  <text x="602" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">上次的响应</text>

  <rect x="730" y="324" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="742" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">⑥ 读当前卡片</text>
  <text x="742" y="362" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">SELECT ... FOR UPDATE</text>
  <text x="742" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">只锁这一行</text>

  <rect x="30" y="404" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">⑦ 乐观锁校验</text>
  <text x="42" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">version 必须相等</text>
  <text x="42" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">不等 → 409 + 现状</text>

  <rect x="170" y="404" width="132" height="68" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="182" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">⑧ 算新顺序键</text>
  <text x="182" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">取相邻两键算中值</text>
  <text x="182" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">无空隙 → 压缩该列</text>

  <rect x="310" y="404" width="132" height="68" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="322" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">⑨ 事务内写入</text>
  <text x="322" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">cards + 事件 + 审计</text>
  <text x="322" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">+ outbox，一次提交</text>

  <rect x="450" y="404" width="132" height="68" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="462" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">⑩ 提交后广播</text>
  <text x="462" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">Redis 频道广播</text>
  <text x="462" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">失败靠补拉兜底</text>

  <rect x="590" y="404" width="132" height="68" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="602" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">⑪ 各实例推送</text>
  <text x="602" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">按 seq 顺序推送</text>
  <text x="602" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">断线带 since 补拉</text>

  <rect x="730" y="404" width="132" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="742" y="424" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">⑫ 客户端对齐</text>
  <text x="742" y="442" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">按 seq 去重排序</text>
  <text x="742" y="458" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">覆盖本地乐观顺序</text>

  <rect x="30" y="486" width="840" height="70" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="44" y="506" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">并发两场景：两个 409 的来源不同，code 必须能区分</text>
  <text x="44" y="526" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">同一张卡片：乐观锁拦下后到者（CARD_VERSION_CONFLICT），响应带最新 version 与 position；输的一方回弹 + 补拉 + 只自动重试一次。</text>
  <text x="44" y="544" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">同一对邻居之间：两次更新命中不同行，乐观锁拦不住 → 由 UNIQUE (list_id, position) 兜底（POSITION_TAKEN），重试必须重新计算位置键。</text>

  <rect x="30" y="566" width="840" height="42" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="44" y="584" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">一次拖动只允许更新一行</text>
  <text x="44" y="600" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">证法：pg_stat_statements 的 rows 增量恰好 +1，或拖动后 xmin 计数 +1；只数一列、看 updated_at、拖到同一位置——三种都会把判据做假。</text>
</svg>
