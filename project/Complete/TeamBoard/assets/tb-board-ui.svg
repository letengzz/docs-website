<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="看板页面的组件树与三条数据通道">
  <defs>
    <marker id="u" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="ug" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857"/>
    </marker>
    <marker id="ur" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">看板页面：一个 store、三条通道、一次可回滚的拖动</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">
    <rect x="40" y="60" width="180" height="44" rx="8" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="130" y="87" text-anchor="middle" font-weight="600" fill="#1d4ed8">BoardPage</text>

    <rect x="40" y="140" width="180" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="130" y="164" text-anchor="middle" font-weight="600" fill="#0f172a">BoardColumn × N</text>
    <rect x="58" y="178" width="144" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="130" y="198" text-anchor="middle" font-size="11" fill="#475569">CardItem（tabindex=0）</text>
    <rect x="58" y="216" width="144" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="130" y="236" text-anchor="middle" font-size="11" fill="#475569">CardItem（拖动中 → 幽灵）</text>
    <rect x="58" y="254" width="144" height="24" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="130" y="270" text-anchor="middle" font-size="10.5" fill="#047857">占位符（transform 驱动）</text>

    <rect x="250" y="140" width="170" height="60" rx="10" fill="#fffbeb" stroke="#f0d8a8"/>
    <text x="335" y="164" text-anchor="middle" font-weight="600" fill="#92400e">CardEditor</text>
    <text x="335" y="184" text-anchor="middle" font-size="10.5" fill="#475569">dirtyFields / 防抖保存</text>

    <rect x="250" y="220" width="170" height="44" rx="8" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="335" y="247" text-anchor="middle" font-weight="600" fill="#1d4ed8">MemberBar</text>

    <rect x="250" y="282" width="170" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="335" y="309" text-anchor="middle" font-weight="600" fill="#b91c1c">RealtimeBadge 三态</text>

    <rect x="470" y="120" width="200" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="570" y="146" text-anchor="middle" font-weight="600" fill="#047857">useBoardStore（唯一真相）</text>
    <text x="570" y="172" text-anchor="middle" font-size="11" fill="#475569">columns / cards / version</text>
    <text x="570" y="194" text-anchor="middle" font-size="11" fill="#475569">snapshot（回滚用）</text>
    <text x="570" y="216" text-anchor="middle" font-size="11" fill="#475569">conflictHints</text>
    <line x1="490" y1="232" x2="650" y2="232" stroke="#6ee7b7"/>
    <text x="570" y="254" text-anchor="middle" font-size="10.5" fill="#047857">action 只有五个：</text>
    <text x="570" y="272" text-anchor="middle" font-size="10.5" fill="#047857">load / moveCard / applyRemote</text>
    <text x="570" y="290" text-anchor="middle" font-size="10.5" fill="#047857">saveField / refreshBoard</text>

    <rect x="730" y="96" width="190" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="825" y="120" text-anchor="middle" font-weight="600" fill="#0f172a">REST API</text>
    <text x="825" y="140" text-anchor="middle" font-size="10.5" fill="#475569">/cards/move · 409 语义</text>

    <rect x="730" y="188" width="190" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="825" y="212" text-anchor="middle" font-weight="600" fill="#0f172a">STOMP / WebSocket</text>
    <text x="825" y="232" text-anchor="middle" font-size="10.5" fill="#475569">t.{tenant}.board.{id}</text>

    <rect x="730" y="280" width="190" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="825" y="304" text-anchor="middle" font-weight="600" fill="#0f172a">SSE 兜底 / 轮询</text>
    <text x="825" y="324" text-anchor="middle" font-size="10.5" fill="#475569">推送不可用时的降级</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="220" y1="82" x2="290" y2="180" marker-end="url(#u)"/>
    <line x1="220" y1="82" x2="290" y2="242" marker-end="url(#u)"/>
    <line x1="220" y1="82" x2="290" y2="304" marker-end="url(#u)"/>
    <line x1="420" y1="170" x2="466" y2="190" marker-end="url(#u)"/>
    <line x1="420" y1="242" x2="466" y2="236" marker-end="url(#u)"/>
    <line x1="420" y1="304" x2="466" y2="280" marker-end="url(#u)"/>
  </g>
  <g stroke="#047857" stroke-width="1.8" fill="none">
    <path d="M670,150 C700,140 706,126 726,126" marker-end="url(#ug)" stroke-dasharray="6 4"/>
    <path d="M826,156 C826,172 760,180 700,196" marker-end="url(#ug)" stroke-dasharray="6 4"/>
  </g>
  <g stroke="#b91c1c" stroke-width="1.6" fill="none">
    <path d="M760,286 C700,296 690,270 676,258" marker-end="url(#ur)" stroke-dasharray="5 5"/>
  </g>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" fill="#475569">
    <text x="678" y="120">请求</text>
    <text x="712" y="176" fill="#047857">事件</text>
    <text x="700" y="290" fill="#b91c1c">兜底</text>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#0f172a">
    <rect x="40" y="352" width="880" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="376" font-weight="600">一次拖动的五步（快照 → 本地 → 请求 → 覆盖版本 → 冲突回滚）</text>
    <text x="60" y="400" fill="#475569">① structuredClone 快照　② 记下 expectedVersion　③ 本地立即生效（界面先动）</text>
    <text x="60" y="422" fill="#475569">④ 用响应覆盖（关键：把新 version 写回）　⑤ 409 → 还原快照 + 重读 + 一句提示</text>
  </g>
</svg>
