<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <title>第 1 周施工 FAQ：九类现象的分诊路径</title>
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">分诊：先缩小范围，再判断严重性</text>

  <!-- 第一步 -->
  <rect x="300" y="56" width="300" height="52" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1D4ED8">第一步：造第二个租户</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#1E40AF">两份数据 + 两个 token，成本十分钟</text>

  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#B91C1C">九类现象里七类只在多租户下可见；没有第二份数据，隔离缺陷不可观测</text>

  <!-- 三类分支 -->
  <rect x="30" y="146" width="270" height="150" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="46" y="170" font-size="12" font-weight="bold" fill="#991B1B">现象：拿不到数据</text>
  <text x="46" y="192" font-size="10" fill="#334155">tenant context missing（全部查询）</text>
  <text x="46" y="208" font-size="10" fill="#64748B">→ 过滤器顺序 / 是否经过过滤器</text>
  <text x="46" y="228" font-size="10" fill="#334155">只有异步任务报错</text>
  <text x="46" y="244" font-size="10" fill="#64748B">→ 装饰器是否挂上</text>
  <text x="46" y="264" font-size="10" fill="#334155">列表空但库里有数据</text>
  <text x="46" y="280" font-size="10" fill="#64748B">→ current_setting 是否为空</text>

  <rect x="315" y="146" width="270" height="150" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="331" y="170" font-size="12" font-weight="bold" fill="#92400E">现象：拿到了不该拿的数据</text>
  <text x="331" y="192" font-size="10" fill="#334155">列表返回别的租户数据</text>
  <text x="331" y="208" font-size="10" fill="#64748B">→ 查询漏 tenant_id / owner 绕过 RLS</text>
  <text x="331" y="228" font-size="10" fill="#334155">缓存命中后串号</text>
  <text x="331" y="244" font-size="10" fill="#64748B">→ key 是否带 t:{tenant}</text>
  <text x="331" y="264" font-size="10" fill="#334155">移出成员后仍收到事件</text>
  <text x="331" y="280" font-size="10" fill="#64748B">→ 只在 SUBSCRIBE 时判了权限</text>

  <rect x="600" y="146" width="270" height="150" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="616" y="170" font-size="12" font-weight="bold" fill="#334155">现象：状态码不对</text>
  <text x="616" y="192" font-size="10" fill="#334155">越权返回 403 而不是 404</text>
  <text x="616" y="208" font-size="10" fill="#64748B">→ 全局异常处理器把 0 行映射成禁止</text>
  <text x="616" y="228" font-size="10" fill="#334155">404 但 body 有字段</text>
  <text x="616" y="244" font-size="10" fill="#64748B">→ 错误响应序列化了实体</text>
  <text x="616" y="264" font-size="10" fill="#334155">订阅「成功」但收不到消息</text>
  <text x="616" y="280" font-size="10" fill="#64748B">→ 两端 destination 不一致</text>

  <!-- 下半：十二项自查 -->
  <rect x="30" y="312" width="840" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="46" y="336" font-size="12" font-weight="bold" fill="#047857">自查清单：十二项，全部可机器判</text>
  <text x="46" y="358" font-size="10" fill="#334155">兜底租户（0）· 上下文写入点（=入口数）· 租户请求头（0）· set_config 第三参数（true）· 裸线程（0）· 缓存 key 前缀（t:）</text>
  <text x="46" y="376" font-size="10" fill="#334155">锁 key（含租户）· 主题拼装点（一处）· 迁移跨租户（0）· 审计权限（ar）· 全文索引（存在）· 应用连接角色（非 owner）</text>

  <!-- 底部：术语与方法 -->
  <rect x="30" y="404" width="410" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
  <text x="46" y="428" font-size="11" font-weight="bold" fill="#334155">四个最常混的概念</text>
  <text x="46" y="448" font-size="10" fill="#334155">开 RLS ≠ 对 owner 生效（要 FORCE）</text>
  <text x="46" y="466" font-size="10" fill="#334155">BYPASSRLS ≠ 超级用户（只绕策略）</text>

  <rect x="460" y="404" width="410" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
  <text x="476" y="428" font-size="11" font-weight="bold" fill="#334155">两条分诊纪律</text>
  <text x="476" y="448" font-size="10" fill="#334155">现象必须可构造（挡掉「偶发」类描述）</text>
  <text x="476" y="466" font-size="10" fill="#334155">每条现象配一条命令，而不是一段解释</text>
</svg>
