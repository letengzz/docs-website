<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="邀请的五个状态与两条死路">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">邀请的一生：一条条件更新决定它能不能被用第二次</text>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">
    <rect x="40" y="90" width="150" height="52" rx="10" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="115" y="113" text-anchor="middle" fill="#1d4ed8">pending</text>
    <text x="115" y="131" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">已签发，token 只在邮件里</text>

    <rect x="250" y="90" width="150" height="52" rx="10" fill="#eff6ff" stroke="#93b4f0"/>
    <text x="325" y="113" text-anchor="middle" fill="#1d4ed8">previewed</text>
    <text x="325" y="131" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">只读，可重复（不消耗）</text>

    <rect x="460" y="90" width="150" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="535" y="113" text-anchor="middle" fill="#047857">accepted</text>
    <text x="535" y="131" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">accepted_at 非空</text>

    <rect x="670" y="90" width="150" height="52" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="745" y="113" text-anchor="middle" fill="#047857">member</text>
    <text x="745" y="131" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">membership 一行</text>

    <rect x="460" y="200" width="150" height="52" rx="10" fill="#fffbeb" stroke="#f0d8a8"/>
    <text x="535" y="223" text-anchor="middle" fill="#92400e">expired</text>
    <text x="535" y="241" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">expires_at &lt; now()</text>

    <rect x="250" y="200" width="150" height="52" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="325" y="223" text-anchor="middle" fill="#b91c1c">revoked</text>
    <text x="325" y="241" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">撤销 / 重发</text>
  </g>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="192" y1="116" x2="246" y2="116"/>
    <line x1="402" y1="116" x2="456" y2="116"/>
    <line x1="612" y1="116" x2="666" y2="116"/>
  </g>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#475569">
    <text x="196" y="110">GET</text>
    <text x="406" y="110">POST accept</text>
    <text x="616" y="110">事务提交</text>
  </g>

  <g stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4">
    <path d="M535,146 L535,196"/>
    <path d="M460,120 C420,170 400,190 400,200" />
    <path d="M150,146 C150,300 250,340 460,330" />
  </g>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10.5" fill="#b91c1c">
    <text x="542" y="176">过期后 0 行</text>
    <text x="300" y="300">重发 = 旧 token 立即 revoked</text>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#0f172a">
    <rect x="40" y="290" width="480" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="314" font-weight="600" font-size="12.5">一次接受的四步（同一事务）</text>
    <text x="60" y="338">① UPDATE invitation … WHERE accepted_at IS NULL</text>
    <text x="60" y="358">&#160;&#160;&#160;AND expires_at &gt; now() RETURNING … &#160;→ 受影响行数必须为 1</text>
    <text x="60" y="378">② INSERT membership … ON CONFLICT DO UPDATE（防「已是成员」）</text>
    <text x="60" y="398">③ INSERT audit_log（member.join）</text>
    <text x="60" y="418">④ afterCommit 才发「某某加入」的通知与推送</text>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#0f172a">
    <rect x="560" y="290" width="360" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="580" y="314" font-weight="600" font-size="12.5" fill="#b91c1c">两条死路（都是 410，不区分原因）</text>
    <text x="580" y="338">· 已接受过 → 重放得到 0 行</text>
    <text x="580" y="358">· 已过期 → 同样是 0 行</text>
    <text x="580" y="378">· 已撤销 / token 不存在 → 同样是 0 行</text>
    <text x="580" y="402" fill="#475569">区分原因等于给攻击者一个探测器：</text>
    <text x="580" y="420" fill="#475569">「这个 token 存在但过期了」本身就是信息。</text>
  </g>
</svg>
