<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="部署脚本概览：第 0 层静态校验与八步链路、三级就绪判定、沙盒实测读数与三处踩坑">
  <title>部署脚本 · 第 0 层与八步链路、三级就绪、实测读数与三处踩坑</title>
  <defs>
    <filter id="soft" x="-5%" y="-8%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2328">部署脚本 · 第 0 层与八步链路、三级就绪、实测读数与三处踩坑</text>
  <text x="30" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">一条命令不是一条命令，是八个各自会失败的动作被编排串起来；每一步都要有一个最小可判定形式。</text>

  <text x="30" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0969da">一、第 0 层静态校验与八步链路</text>

  <rect x="33" y="100" width="834" height="42" rx="8" fill="#f6f8fa" stroke="#8c959f" filter="url(#soft)"/>
  <text x="45" y="118" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1f2328">第 0 层 · 静态校验：docker compose config -q 期望 rc=0</text>
  <text x="45" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#cf222e">它是静态校验：通过它，照样可能挂错 PG 18 的路径、照样可能被 Compose 吃掉容器内的变量名。</text>

  <rect x="33" y="158" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="45" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">① 拉镜像</text>
  <text x="45" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：每行 Pulled 或 Already exists</text>
  <text x="45" y="219" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：直连超时（见第三栏）</text>
  <text x="45" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">tag 写明确小版本，不写 latest</text>

  <rect x="246" y="158" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="258" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">② 建网络与卷</text>
  <text x="258" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：出现 default 网络与 db-data 卷</text>
  <text x="258" y="219" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：卷名冲突（同工程名）</text>
  <text x="258" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">卷要落在宿主，数据才不会随容器走</text>

  <rect x="459" y="158" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="471" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">③ 起依赖</text>
  <text x="471" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：db 与 cache 存在（可 starting）</text>
  <text x="471" y="219" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：宿主端口被占用</text>
  <text x="471" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">先起依赖，再谈应用</text>

  <rect x="672" y="158" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="684" y="180" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">④ 等健康</text>
  <text x="684" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：STATUS 出现 healthy</text>
  <text x="684" y="219" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：只等容器存在，应用先起</text>
  <text x="684" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">condition: service_healthy</text>

  <line x1="229" y1="201" x2="244" y2="201" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="442" y1="201" x2="457" y2="201" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="655" y1="201" x2="670" y2="201" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 770 244 V 257 H 131 V 268" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="33" y="270" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="45" y="292" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">⑤ 跑迁移</text>
  <text x="45" y="314" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：migrate exited (0)</text>
  <text x="45" y="331" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：不幂等、无版本记录</text>
  <text x="45" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">restart: no，跑完即退</text>

  <rect x="246" y="270" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="258" y="292" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">⑥ 起应用</text>
  <text x="258" y="314" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：app running (healthy)</text>
  <text x="258" y="331" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">前提：migrate 已 completed</text>
  <text x="258" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">迁移先于应用是硬约束</text>

  <rect x="459" y="270" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="471" y="292" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">⑦ 三级就绪</text>
  <text x="471" y="314" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：容器 到 进程 到 业务</text>
  <text x="471" y="331" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">失败：UP 但连不上库</text>
  <text x="471" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">见第二栏</text>

  <rect x="672" y="270" width="196" height="86" rx="9" fill="#ddf4ff" stroke="#54aeff" filter="url(#soft)"/>
  <text x="684" y="292" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0969da">⑧ 自检</text>
  <text x="684" y="314" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：建工作区并读得回来</text>
  <text x="684" y="331" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">退出码：0 全绿 1 未就绪 2 缺前置</text>
  <text x="684" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">三种失败，三个排查入口</text>

  <line x1="229" y1="313" x2="244" y2="313" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="442" y1="313" x2="457" y2="313" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="655" y1="313" x2="670" y2="313" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="30" y="386" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37">二、三级就绪判定：up -d 返回不等于可用</text>

  <rect x="33" y="396" width="264" height="94" rx="9" fill="#dafbe1" stroke="#4ac26b" filter="url(#soft)"/>
  <text x="45" y="418" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">L1 容器层 · docker compose ps</text>
  <text x="45" y="440" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：长驻 running，一次性 exited (0)</text>
  <text x="45" y="457" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">挡住：挂载点错、镜像拉不下来、反复重启</text>
  <text x="45" y="478" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">这一层最容易「看起来全绿」</text>

  <rect x="318" y="396" width="264" height="94" rx="9" fill="#dafbe1" stroke="#4ac26b" filter="url(#soft)"/>
  <text x="330" y="418" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">L2 进程层 · pg_isready 与就绪探针</text>
  <text x="330" y="440" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：/-/ready 或 /actuator/health 成功</text>
  <text x="330" y="457" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">挡住：连接池未就绪、迁移没跑完就对外</text>
  <text x="330" y="478" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">进程活着不等于能服务</text>

  <rect x="603" y="396" width="264" height="94" rx="9" fill="#dafbe1" stroke="#4ac26b" filter="url(#soft)"/>
  <text x="615" y="418" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1a7f37">L3 业务层 · 一次真实读写</text>
  <text x="615" y="440" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">判据：建工作区，再在列表里读回它</text>
  <text x="615" y="457" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">挡住：鉴权、落库、读回的任何断点</text>
  <text x="615" y="478" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">只返回 UP 的服务照样连不上库</text>

  <line x1="297" y1="443" x2="316" y2="443" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="582" y1="443" x2="601" y2="443" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="30" y="520" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700">三、沙盒实测读数与三处真实踩坑</text>

  <rect x="33" y="530" width="264" height="80" rx="9" fill="#fff8c5" stroke="#d4a72c" filter="url(#soft)"/>
  <text x="45" y="551" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9a6700">实测 · 冷启动与幂等</text>
  <text x="45" y="572" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">up -d --wait 全程 11.8 s（含 5 份迁移）</text>
  <text x="45" y="589" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">三容器 healthy，migrate exited (0)</text>
  <text x="45" y="606" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">二次 up -d：Running，无 Recreated</text>

  <rect x="318" y="530" width="264" height="80" rx="9" fill="#ffebe9" stroke="#ff8182" filter="url(#soft)"/>
  <text x="330" y="551" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#cf222e">踩坑一 · PG 18 挂载点</text>
  <text x="330" y="572" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">挂 .../postgresql/data：启动即退出，码 1</text>
  <text x="330" y="589" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">正确：只挂 /var/lib/postgresql</text>
  <text x="330" y="606" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">日志是一整段英文说明，不是报错关键行</text>

  <rect x="603" y="530" width="264" height="80" rx="9" fill="#ffebe9" stroke="#ff8182" filter="url(#soft)"/>
  <text x="615" y="551" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#cf222e">踩坑二 · 日志撒谎与密钥入日志</text>
  <text x="615" y="572" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">单个 $ 被 Compose 吃掉：文件名恒为空</text>
  <text x="615" y="589" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">迁移却成功、退出码仍 0</text>
  <text x="615" y="606" font-family="system-ui, sans-serif" font-size="9" fill="#1f2328">config 明文中口令命中 2 次</text>
</svg>
