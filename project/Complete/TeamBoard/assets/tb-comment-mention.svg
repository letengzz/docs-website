<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#0F172A" font-weight="bold">一条评论的五次变化与一个事务边界</text>
  <text x="380" y="48" text-anchor="middle" font-size="10" fill="#64748B">1~4 必须在同一事务；5（广播）在提交之后 —— 反过来就会推出回滚掉的内容</text>

  <rect x="24" y="68" width="440" height="240" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="40" y="90" font-size="9.5" fill="#1E293B" font-weight="bold">BEGIN … COMMIT（同一事务）</text>

  <rect x="44" y="102" width="400" height="40" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <text x="58" y="120" font-size="8.4" fill="#1E3A8A" font-weight="bold">① INSERT comment</text>
  <text x="58" y="135" font-size="7.4" fill="#1D4ED8">uuidv7() + temp_id 唯一 + body 1~8000</text>

  <rect x="44" y="150" width="400" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/>
  <text x="58" y="168" font-size="8.4" fill="#3730A3" font-weight="bold">② INSERT comment_mention</text>
  <text x="58" y="183" font-size="7.4" fill="#4338CA">ON CONFLICT DO NOTHING（主键去重）</text>

  <rect x="44" y="198" width="400" height="40" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3"/>
  <text x="58" y="216" font-size="8.4" fill="#115E59" font-weight="bold">③ INSERT notification_outbox</text>
  <text x="58" y="231" font-size="7.4" fill="#0F766E">dedup_key 唯一：mention:{comment}:{user}</text>

  <rect x="44" y="246" width="400" height="44" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <text x="58" y="264" font-size="8.4" fill="#92400E" font-weight="bold">④ 冗余列 / 幂等记录</text>
  <text x="58" y="279" font-size="7.4" fill="#B45309">idempotency_record（key → 响应体，24 h）</text>

  <rect x="484" y="68" width="252" height="112" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="500" y="90" font-size="9.5" fill="#991B1B" font-weight="bold">COMMIT 之后</text>
  <text x="500" y="112" font-size="8" fill="#B91C1C">⑤ board_events + 广播</text>
  <text x="500" y="130" font-size="7.4" fill="#64748B">提交前推送 → 可能推出回滚内容</text>
  <text x="500" y="150" font-size="7.4" fill="#059669">投递器按 published_at IS NULL 拉取</text>
  <text x="500" y="168" font-size="7.4" fill="#B45309">至少一次 + 消费侧按 dedup_key 幂等</text>

  <rect x="484" y="192" width="252" height="116" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="500" y="212" font-size="9.5" fill="#065F46" font-weight="bold">三种重复提交的处置</text>
  <text x="500" y="232" font-size="7.6" fill="#047857">同 key → 返回首次响应（200）</text>
  <text x="500" y="250" font-size="7.6" fill="#047857">同 tempId 异 key → 返回已存在（200）</text>
  <text x="500" y="268" font-size="7.6" fill="#B91C1C">异 key 异 tempId 同内容 → 两条</text>
  <text x="500" y="288" font-size="7.4" fill="#64748B">按内容去重会误判「我就是要发两遍」</text>

  <rect x="24" y="322" width="712" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="40" y="342" font-size="9.3" fill="#991B1B" font-weight="bold">唯一的越权红线：@ 到非本工作区成员 → 整条 422</text>
  <text x="40" y="362" font-size="7.8" fill="#B91C1C">静默过滤 = 用户以为发出去了（体验断裂）；放行 = 通知发给无权用户（信息泄漏）</text>
  <text x="40" y="378" font-size="7.8" fill="#059669">未解析的提及（离职用户）相反：静默降级为纯文本 + 响应里返回 unresolvedMentions</text>
</svg>
