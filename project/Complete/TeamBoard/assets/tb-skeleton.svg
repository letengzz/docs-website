<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="TeamBoard 第 2 周第 1 步：工程骨架、迁移、健康检查、验收四步">
  <title>最小可跑骨架：四步从零到 /healthz</title>
  <defs>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="#f8fafc"/>
  <text x="450" y="26" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">第 2 周第 1 步：先让「一条请求走完全程」，再谈业务</text>
  <rect x="30" y="60" width="195" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="127.5" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">① 骨架</text>
  <text x="127.5" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">Gradle 多模块</text>
  <text x="127.5" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">api / core / infra</text>
  <text x="127.5" y="129" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">配置分 profile</text>
  <rect x="250" y="60" width="195" height="96" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="347.5" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">② 迁移</text>
  <text x="347.5" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">Flyway 版本化</text>
  <text x="347.5" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">R__ 可重入视图</text>
  <text x="347.5" y="129" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">V1 建表 + RLS</text>
  <rect x="470" y="60" width="195" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="567.5" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">③ 健康检查</text>
  <text x="567.5" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">/healthz 查三样</text>
  <text x="567.5" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">DB / 迁移 / 时钟</text>
  <text x="567.5" y="129" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">不查下游</text>
  <rect x="690" y="60" width="180" height="96" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="780.0" y="82" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">④ 验收</text>
  <text x="780.0" y="99" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">一条 curl</text>
  <text x="780.0" y="114" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">三个预期读数</text>
  <text x="780.0" y="129" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">失败即回退</text>
  <line x1="227" y1="108" x2="248" y2="108" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="447" y1="108" x2="468" y2="108" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <line x1="667" y1="108" x2="688" y2="108" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar-slate)"/>
  <rect x="30" y="190" width="840" height="96" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="450.0" y="212" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">/healthz 的三条判据：快、浅、诚实</text>
  <text x="450.0" y="229" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">快：P99 ( 20 ms，不做聚合查询    浅：只查本进程依赖，不级联下游    诚实：依赖不可用就返 503，不返 200</text>
  <text x="450.0" y="244" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">错误示范：把「能连上数据库」写成「查询成功」——连接池借不到连接时它照样返回 200</text>
  <rect x="30" y="306" width="400" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="230.0" y="328" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">本步交付物</text>
  <text x="230.0" y="345" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">一个能跑的骨架</text>
  <text x="230.0" y="360" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">一次可重复的迁移</text>
  <text x="230.0" y="375" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">一份验收脚本（三行 curl）</text>
  <rect x="470" y="306" width="400" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="670.0" y="328" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">本步明确不做</text>
  <text x="670.0" y="345" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">登录与鉴权（下一章）</text>
  <text x="670.0" y="360" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">业务表之外的任何表</text>
  <text x="670.0" y="375" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">前端页面与实时通道</text>
  <text x="450" y="430" font-size="11" fill="#475569" font-weight="400" text-anchor="middle">顺序理由：迁移在业务之前、健康检查在业务之前，因为它们是后面每一章的验收前提</text>
</svg>
