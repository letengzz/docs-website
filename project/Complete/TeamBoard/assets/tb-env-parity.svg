<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="环境等价的三个层次：键集合、值差异白名单与结构指纹">
  <defs>
    <marker id="epr-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#0f172a">「配置等价」有三个层次，混在一起就写出恒假的闸门</text>
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <!-- 三套环境 -->
    <rect x="40" y="60" width="150" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="115" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">staging</text>
    <text x="115" y="100" text-anchor="middle" font-size="11" fill="#334155">20 个键</text>

    <rect x="40" y="124" width="150" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="115" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">prod</text>
    <text x="115" y="164" text-anchor="middle" font-size="11" fill="#334155">20 个键</text>

    <rect x="40" y="188" width="150" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="115" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">canary</text>
    <text x="115" y="228" text-anchor="middle" font-size="11" fill="#334155">20 个键</text>

    <line x1="190" y1="150" x2="250" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#epr-arrow)"/>

    <!-- 三个层次 -->
    <rect x="260" y="60" width="330" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="278" y="84" font-size="12" font-weight="600" fill="#166534">① 键集合：必须完全相同</text>
    <text x="278" y="104" font-size="11" fill="#14532d">排序后取摘要 → 1a20a0dc1e2c71cc（三套相同）</text>
    <text x="278" y="122" font-size="11" fill="#14532d">能不能用哈希判？✅ 可以，且应该</text>

    <rect x="260" y="146" width="330" height="72" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="278" y="170" font-size="12" font-weight="600" fill="#92400e">② 值差异：只能 ⊆ 白名单</text>
    <text x="278" y="190" font-size="11" fill="#78350f">值指纹 f850b65b ≠ 5b316172，差异 8 个键</text>
    <text x="278" y="208" font-size="11" fill="#78350f">能不能用哈希判？❌ 物理上恒假</text>

    <rect x="260" y="232" width="330" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="278" y="256" font-size="12" font-weight="600" fill="#166534">③ 结构指纹：必须相同</text>
    <text x="278" y="276" font-size="11" fill="#14532d">列 + 索引规范化后 md5 = d131ba84…</text>
    <text x="278" y="294" font-size="11" fill="#14532d">加一列 → 7bff8eaa…（敏感且可逆）</text>

    <!-- 白名单 -->
    <rect x="620" y="60" width="300" height="120" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="638" y="84" font-size="12" font-weight="600" fill="#0f172a">白名单 8 键（必须不同）</text>
    <text x="638" y="104" font-size="11" fill="#334155">DB_URL · REDIS_URL · S3_ENDPOINT · S3_BUCKET</text>
    <text x="638" y="122" font-size="11" fill="#334155">DB_POOL_MAX · LOG_LEVEL · OTEL_SAMPLE_RATIO</text>
    <text x="638" y="140" font-size="11" fill="#334155">SPRING_PROFILES_ACTIVE</text>
    <text x="638" y="164" font-size="11" fill="#b91c1c">白名单外必须逐字节相同</text>

    <rect x="620" y="196" width="300" height="108" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="638" y="220" font-size="12" font-weight="600" fill="#991b1b">五类「顺手调一下」= 漏测</text>
    <text x="638" y="240" font-size="11" fill="#7f1d1d">DB_STATEMENT_TIMEOUT · WS_QUEUE</text>
    <text x="638" y="258" font-size="11" fill="#7f1d1d">JWT_TTL / REFRESH_TTL</text>
    <text x="638" y="276" font-size="11" fill="#7f1d1d">FEATURE_* 默认值 · REDIS_TIMEOUT</text>
    <text x="638" y="296" font-size="11" fill="#7f1d1d">预发放宽、生产收紧 → 预发全绿、生产 504</text>

    <rect x="40" y="330" width="880" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="58" y="354" font-size="12" font-weight="600" fill="#1e3a8a">闸门落点：启动期自检（缺键/越界即 exit 1）+ 发布前比对（差异清单 ⊆ 白名单）+ 运行期定时比对（只告警）</text>
    <text x="58" y="376" font-size="11" fill="#334155">结构指纹刻意不含 pg_stat_*（行数、大小、last_analyze）—— 一旦纳入，指纹每天都变，闸门变成噪音</text>
  </g>
</svg>
