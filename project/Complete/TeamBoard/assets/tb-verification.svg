<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="在线协作任务看板的可运行验证链：顶部灰底表示环境页已完成的四步，中部是本节从第 5 步到第 9 步的五张卡片，下部是并发验证与实时验证两处判定要点，底部是性能预检的口径">
  <title>在线协作任务看板 · 从第 5 步起的可运行验证链</title>
  <defs>
    <marker id="tbvf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">在线协作任务看板 · 从第 5 步起的可运行验证链</text>
  <text x="30" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">第 5~9 步顺序不可换；并发与实时两处各藏着一个「看起来一样但其实不同」的结果。</text>

  <rect x="30" y="82" width="840" height="42" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="44" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">① ~ ④ 已在环境页完成（依赖可起 / 服务可启动 / 前端可访问 / 最小链路），本节不复述</text>
  <text x="44" y="117" font-family="system-ui, sans-serif" font-size="9" fill="#334155">判据的对象不同：前四条判「东西起来了」，本节判「这条链路是通的，而且并发时不打架」。</text>

  <rect x="30" y="136" width="156" height="104" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="42" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3730a3">⑤ 种子数据</text>
  <text x="42" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#334155">3 工作区 / 4 列</text>
  <text x="42" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#334155">每列 5 张卡</text>
  <text x="42" y="216" font-family="system-ui, sans-serif" font-size="8.5" fill="#b45309">形状：3 行 × 20 张</text>

  <line x1="188" y1="188" x2="199" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#tbvf-ar)"/>

  <rect x="201" y="136" width="156" height="104" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="213" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3730a3">⑥ 七条冒烟</text>
  <text x="213" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#334155">令牌 → 建卡 → 拖动</text>
  <text x="213" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#334155">→ 评论 → 拉事件</text>
  <text x="213" y="216" font-family="system-ui, sans-serif" font-size="8.5" fill="#b45309">seq 从 1 起连续</text>

  <line x1="359" y1="188" x2="370" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#tbvf-ar)"/>

  <rect x="372" y="136" width="156" height="104" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="384" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">⑦ 并发验证</text>
  <text x="384" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#334155">同 version 并发两次</text>
  <text x="384" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#334155">期望 200 加 409</text>
  <text x="384" y="216" font-family="system-ui, sans-serif" font-size="8.5" fill="#b45309">version 只前进 1</text>

  <line x1="530" y1="188" x2="541" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#tbvf-ar)"/>

  <rect x="543" y="136" width="156" height="104" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="555" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">⑧ 实时验证</text>
  <text x="555" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#334155">两个 wscat 订阅</text>
  <text x="555" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#334155">A 拖动 → B 一秒内</text>
  <text x="555" y="216" font-family="system-ui, sans-serif" font-size="8.5" fill="#b45309">seq 无缺口</text>

  <line x1="701" y1="188" x2="712" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#tbvf-ar)"/>

  <rect x="714" y="136" width="156" height="104" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="726" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">⑨ 性能预检</text>
  <text x="726" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#334155">200 RPS 开环</text>
  <text x="726" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#334155">P99 不高于 300 ms</text>
  <text x="726" y="216" font-family="system-ui, sans-serif" font-size="8.5" fill="#b45309">本机未跑</text>

  <text x="30" y="270" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">两处最容易验错的判定要点（判据写在这里，不写在感觉里）</text>

  <rect x="30" y="282" width="420" height="156" rx="9" fill="#eef2ff" stroke="#818cf8"/>
  <text x="44" y="306" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">并发验证：一成一败才会发生</text>
  <text x="44" y="328" font-family="system-ui, sans-serif" font-size="9" fill="#334155">两个请求：同一个 version，不同的 client_op_id</text>
  <text x="44" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#334155">不同 client_op_id → 200 与 409：业务冲突</text>
  <text x="44" y="364" font-family="system-ui, sans-serif" font-size="9" fill="#334155">相同 client_op_id → 两个都 200：幂等重放</text>
  <text x="44" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#334155">两行都「只前进 1」，但只有第一行证明了乐观锁</text>
  <text x="44" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#334155">另外两条判据：card.moved 只加 1、没有 500</text>
  <text x="44" y="422" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">反例：去掉 version 校验 → 两个 200、version 加 2</text>

  <rect x="470" y="282" width="400" height="156" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="484" y="306" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">实时验证：一秒与连续两条</text>
  <text x="484" y="328" font-family="system-ui, sans-serif" font-size="9" fill="#334155">两个 wscat 客户端订阅同一块看板</text>
  <text x="484" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#334155">A 拖动 → B 一秒内收到带 seq 与 version 的事件</text>
  <text x="484" y="364" font-family="system-ui, sans-serif" font-size="9" fill="#334155">seq 缺口检测：相邻两条必须恰好差 1</text>
  <text x="484" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#334155">断线追平：since 的第一条必须是上一条加 1</text>
  <text x="484" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#334155">多一条是重复应用，少一条是丢改动</text>
  <text x="484" y="422" font-family="system-ui, sans-serif" font-size="9" fill="#b45309">先取一次性票据：浏览器不能自定义请求头</text>

  <rect x="30" y="452" width="840" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="44" y="474" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">第 9 步的性能预检：口径写进脚本（k6 的 thresholds），不靠人眼看输出</text>
  <text x="44" y="492" font-family="system-ui, sans-serif" font-size="9" fill="#334155">前置：环境页四条全绿 + 能登录的账号 + psql 可连。性能部分本机没有 k6、也没有在运行的服务，如实标「未跑」，不写数字。</text>
</svg>
