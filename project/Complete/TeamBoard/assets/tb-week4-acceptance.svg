  <rect x="200" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="255" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="255" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="267" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="287" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">MO 监控接入</text>
  <rect x="200" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="277" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="277" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="289" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="309" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">BR 备份恢复</text>
  <rect x="200" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="299" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="299" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="311" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">7 + 1</text>

  <text x="40" y="331" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">RU 发布回滚</text>
  <rect x="200" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="321" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="321" width="60" height="14" rx="3" fill="#bc4c00"/><rect x="634" y="321" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="333" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">6 + 2</text>

  <text x="40" y="353" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">DL 交付文档</text>
  <rect x="200" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="343" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="343" width="60" height="14" rx="3" fill="#0969da"/>
  <text x="706" y="355" font-family="system-ui, sans-serif" font-size="9.5" fill="#1a7f37">8 + 0 全部可判</text>

  <text x="40" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">LX 上线验收</text>
  <rect x="200" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="365" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="365" width="60" height="14" rx="3" fill="#bc4c00"/><rect x="634" y="365" width="60" height="14" rx="3" fill="#bc4c00"/>
  <text x="706" y="377" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">6 + 2（含一条 FAIL）</text>

  <text x="40" y="397" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">W4 本周收口</text>
  <rect x="200" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="262" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="324" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="386" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="448" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="510" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="572" y="387" width="60" height="14" rx="3" fill="#0969da"/><rect x="634" y="387" width="60" height="14" rx="3" fill="#0969da"/>
  <text x="706" y="399" font-family="system-ui, sans-serif" font-size="9.5" fill="#1a7f37">8 + 0 全部可判</text>

  <text x="40" y="419" font-family="system-ui, sans-serif" font-size="9.5" fill="#9a6700">读法：「判据已跑」不等于「功能已验」——沙盒里跑出来的是文档里的 DDL 与编排，不是本项目自己的服务。</text>

  <text x="30" y="446" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">三处口径修正（旧写法保留在历史页，不回填）</text>

  <rect x="30" y="456" width="270" height="86" rx="9" fill="#fff8c5" stroke="#9a6700"/>
  <text x="44" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a6700">一 · BL-1 已失效</text>
  <text x="44" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">旧：本机无容器运行时</text>
  <text x="44" y="513" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">新：docker 27.1.1 可用，只剩 BL-2</text>
  <text x="44" y="530" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">依据：docker version 与 compose version</text>

  <rect x="315" y="456" width="270" height="86" rx="9" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="329" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bc4c00">二 · 成本判据恒假</text>
  <text x="329" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">旧：EXPLAIN 的 rows 等于 1</text>
  <text x="329" y="513" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">新：命令标签 UPDATE 1 或带 RETURNING</text>
  <text x="329" y="530" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">依据：PG 18.6 实测 rows=0（提交 f0f13a3a）</text>

  <rect x="600" y="456" width="270" height="86" rx="9" fill="#ddf4ff" stroke="#0969da"/>
  <text x="614" y="478" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0969da">三 · 一键起要分级</text>
  <text x="614" y="496" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">旧：up 返回 0 就算起来了</text>
  <text x="614" y="513" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">新：容器层 / 服务就绪 / 业务就绪三级</text>
  <text x="614" y="530" font-family="system-ui, sans-serif" font-size="9" fill="#57606a">依据：沙盒 up -d --wait 实测 11.8 s</text>

  <rect x="30" y="556" width="840" height="1" fill="#d0d7de"/>
  <text x="30" y="574" font-family="system-ui, sans-serif" font-size="9.5" fill="#cf222e">本轮唯一一条 FAIL（LX-G）：audit_log 建了 PARTITION BY RANGE，却一个分区都没有——分区数实测 0，插入报 no partition of relation found for row；</text>
  <text x="30" y="592" font-family="system-ui, sans-serif" font-size="9.5" fill="#cf222e">而一次拖动要在同一事务里写审计，因此主链路会整笔回滚。它不是语法错、不是服务异常，是交付件缺失；已登记 LX-1，本页不改 DDL。</text>
</svg>
