<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="在线协作任务看板第 4 周验收结论：上部是四类交付证据各自的收口形态，中部是八族判据的已跑与未跑分布，下部是三处口径修正与一条判 FAIL 的缺陷">
  <title>第 4 周验收结论 · 四类交付证据的收口、判据族分布与三处口径修正</title>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1f2328">第 4 周验收结论 · 四类交付证据的收口、判据族分布与三处口径修正</text>
  <text x="30" y="60" font-family="system-ui, sans-serif" font-size="11.5" fill="#57606a">八页各自自洽，推不出「这一周完成了」——收口页只做三件事：汇总判据、给出结论、登记残余。</text>

  <text x="30" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">四类交付证据的形态与收口判据</text>

  <rect x="30" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">可重复起栈</text>
  <text x="44" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：一条命令 + 三级就绪 + 退出码</text>
  <text x="44" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：顺序是否是强制的</text>
  <text x="44" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 DY · CF</text>

  <rect x="240" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="254" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">结构可带走</text>
  <text x="254" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：对账表 + 备份指纹</text>
  <text x="254" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：六项是否逐项相等</text>
  <text x="254" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 BR</text>

  <rect x="450" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="464" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">状态可观测</text>
  <text x="464" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：指标清单 + 告警 + 四张大屏</text>
  <text x="464" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：指标与查询能否对账</text>
  <text x="464" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 MO</text>

  <rect x="660" y="100" width="195" height="90" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="674" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">别人能接手</text>
  <text x="674" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">形态：四份文档 + 回滚动作表</text>
  <text x="674" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#57606a">收口：有没有一条走得到的路径</text>
  <text x="674" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#0969da">判据族 DL · RU · LX</text>

  <text x="30" y="216" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1f2328">判据族分布（蓝 = 判据本身已跑，橙 = 因 BL-2 未跑；八族 64 条 = 56 + 8）</text>

  <text x="40" y="243" font-family="system-ui, sans-serif" font-size="10" fill="#1f2328">DY 部署脚本</text>
